לפי אישי ציבור ככלפי כל אדם. בביקורת שיפוטית על החלטת אי-העמדה לדין, בג\"צ נוקט ריסון רב ויתערב רק כאשר ההחלטה בלתי סבירה באורח קיצוני, לא כאשר ניתן היה להגיע גם למסקנה אחרת.","currency":"לא אומת עדכון מעבר למקורות הקורס"},{"name":"פלוני 2 נגד מדינת ישראל","cite":"בש\"פ 6718/06, 6793/06 (2006) — מפי השופט א' רובינשטיין","facts":"שני קטינים נעצרו עד תום ההליכים בבית המשפט המחוזי לנוער בחיפה, בעקבות כתבי אישום המייחסים להם חבלה בכוונה מחמירה במסגרת אירוע אלימות קשה בעל גוון לאומני. בדיון המעצר הגישה המדינה גם רשימת 'מב\"דים' (תיקים ממתינים לבירור דין) ופלט מרשם פלילי, בניגוד לכלל הנוהג.","claimant":"העוררים טענו כי אין מקום להציג תיקים פתוחים (מב\"דים) שטרם הבשילו לכתב אישום, בהתאם להנחיית פרקליטת המדינה משנת 2003 האוסרת על כך; ויש להעדיף חלופת מעצר.","respondent":"המדינה טענה כי לנוכח חומרת העבירה והתסקירים השליליים, אין מקום לחלופת מעצר, וכי הצגת התיקים הפתוחים נדרשה להזמת טענת העוררים שלא נפתחו נגדם תיקים כלל בתקופה הרלוונטית.","question":"האם רשאי בית המשפט הדן במעצר עד תום ההליכים להתחשב בפלט מחשב של תיקים פתוחים ('מב\"דים') שטרם התבררו?","ruling":"העררים התקבלו באופן מוגבל — נדחתה חלופת המעצר, אך הותר להציג את פלט המב\"דים לצורך הזמת טענה ספציפית שהעלו העוררים (שלא נפתחו נגדם תיקים כלל).","halacha":"ככלל אין להגיש רשימת 'מב\"דים' כראיה בהליך מעצר עד תום ההליכים, שכן קיומו של תיק אינו מעיד על אמיתות החשד שבו. החריג היחיד הוא כאשר הנאשם עצמו טוען שלא נפתחו נגדו כלל תיקים בתקופה מסוימת — או-אז ניתן להגיש את הפלט לצורך הזמת אותה טענה ספציפית בלבד, ולא כדי לבסס טענה מהותית נוספת.","currency":"לא אומת עדכון מעבר למקורות הקורס"},{"name":"שלום ימיני נגד מדינת ישראל","cite":"ע\"פ 2247/10, 3164/10, פ\"ד סד(2) 666 (2011) — מפי השופט י' עמית (השופטים א' א' לוי וח' מלצר מסכימים)","facts":"תאונת פגע וברח קטלנית בתל אביב: רכב שבו נסעו ימיני וסימון פגע בשתי הולכות רגל ונמלט במהירות מן המקום מבלי להושיט עזרה. במחוזי הורשע ימיני, שהיה נוסע ברכב ולא נהגו, בביצוע בצוותא של עבירת ההפקרה לאחר פגיעה, והגיש ערעור לעליון על שאלת אחריותו כנוסע.","claimant":"אחריות פלילית לעבירת הפקרה חלה על הנהג בלבד, שכן רק הוא שולט ברכב ומחליט אם לעצור. נוסע ברכב הוא לכל היותר עד מקרי לאירוע ואינו יכול לשאת באחריות פלילית לביצוע העבירה.","respondent":"הנוסע לא היה עד מקרי גרידא — הוא היה מעורב באירוע ופעל (או נמנע מלפעול) באופן שסייע לנהג להימלט ולא להושיט עזרה, ולכן יש להטיל עליו אחריות פלילית כמסייע.","question":"האם ניתן להרשיע נוסע ברכב (שאינו הנהג) כמסייע או כמבצע בצוותא בעבירת הפקרה לאחר פגיעה, לפי סעיף 64א לפקודת התעבורה?","ruling":"ימיני הורשע כמסייע לעבירת ההפקרה לאחר פגיעה, ועונשו הוחמר בערעור.","halacha":"נוסע ברכב החוטא במחדל — נמנע מהזעקת עזרה או מעודד את הנהג להימלט מזירת התאונה — נושא באחריות פלילית כמסייע לעבירת הפקרה לאחר פגיעה, גם אם לא הוא נהג ברכב.","currency":"לא אומת עדכון מעבר למקורות הקורס","reasoning":"השופט עמית, בהסתמך על הלכת ויצמן, קבע: (א) נוסע ברכב המעורב באירוע תאונה אינו \"עובר אורח מקרי\" — קיימת לגביו זיקה הדוקה לאירוע והוא יכול להשפיע על הנהג או להזעיק עזרה. (ב) נוסע המעודד את הנהג לברוח, או הנמנע במפגיע מהזעקת כוחות הצלה ויוצר עמו \"חומת שתיקה\" — מסייע בפועל, במעשה או במחדל, לביצוע עבירת ההפקרה, ונושא באחריות פלילית בגינה.","exam":"בקייס של תאונת פגע וברח שבו יושב נוסע לצד הנהג — אין להסתפק בבדיקת אחריות הנהג בלבד; יש לבחון גם את התנהגות הנוסע (עידוד לברוח, שתיקה, אי-הזעקת עזרה) ולשקול הרשעתו כמסייע לפי הלכת ימיני."},{"name":"פלוני נגד מדינת ישראל (תיקי מב\"ד בתסקיר)","cite":"רע\"פ 1021/07 (2009) — מפי השופט ח' מלצר (בהסכמת השופטת א' פרוקצ'יה והשופט ס' ג'ובראן)","facts":"קטין הודה בעבירות רכוש ואלימות. שירות המבחן לנוער הגיש ארבעה תסקירים חיוביים, ובעקבותיהם נמנע בית משפט השלום לנוער מהרשעתו. לקראת ערעור המדינה, הגיש שירות המבחן תסקיר חמישי שציין החמרה, לרבות פתיחת ארבעה 'תיקי מב\"ד' נגדו. בית המשפט המחוזי לנוער קיבל את ערעור המדינה והחמיר בעונשו, תוך שנתן משקל לתיקי המב\"ד.","claimant":"שירות המבחן נוהג שלא כדין כשהוא מציין תיקי מב\"ד בתסקיריו, שכן הדבר יוצר תמונה בלתי מדויקת ופוגע בחזקת החפות.","respondent":"מידע היסטורי על תיקים קודמים, גם אם לא הסתיימו בהרשעה, רלוונטי לגיבוש תמונה מלאה על אורח חייו של הנאשם לצורך גזירת עונש הולם.","question":"האם שירות המבחן רשאי להתייחס בתסקיר הנערך לקראת גזירת הדין לקיומם של 'תיקי מב\"ד', ואם כן — האם רשאי בית המשפט להידרש לנתונים אלה?","ruling":"הערעור נדחה. שירות המבחן רשאי להתייחס לתיקי מב\"ד בתסקירו, ובית המשפט רשאי להידרש לנתונים אלה בגזר הדין, תוך זהירות ומתן משקל בהתאם למידת המידע ולעדכנותו.","halacha":"שירות המבחן רשאי להתייחס בתסקירו לקיומם של תיקי מב\"ד, ובית המשפט רשאי להידרש לכך בגזירת הדין, מכוח חוק המרשם הפלילי ותקנת השבים — בניגוד לתובע, שסעיפים 187-188 לחסד\"פ אוסרים עליו להציג מידע כזה. הכללים החלים על התסקיר הם כללי רלבנטיות ולא כללי קבילות רגילים; יש לבדוק עדכנות ודיוק הנתונים ולתת להם משקל בהתאם לעוצמת החשדות — ככל שהמידע לאקוני יותר, כך פוחת משקלו.","currency":"לא אומת עדכון מעבר למקורות הקורס","exam":"אם בקייס מוצג תסקיר שירות המבחן המזכיר תיקי מב\"ד (חקירות פתוחות/ממתינות) של הנאשם — יש לזכור שזה מותר לשירות המבחן (בזהירות ובמשקל מותאם), ולהבחין זאת מהתובע עצמו, שאסור לו להציג נתונים כאלה לפי סעיפים 187-188 לחסד\"פ."},{"name":"חברת לרגו עבודות עפר בע\"מ נגד מדינת ישראל","cite":"בש\"פ 342/06 (2006) — מפי השופטת א' פרוקצ'יה","facts":"המבקשת נחקרה בחשד לכריית חול בלתי חוקית (סעיף 88 לפקודת המכרות). המשטרה תפסה שופל ומשאית ששימשו, לפי הטענה, לביצוע העבירה. בית משפט השלום סירב להשיב את הכלים. בערר קבע בית המשפט המחוזי שהכלים ישוחררו כנגד הפקדת ערבויות כספיות גבוהות ואיסור שימוש. המבקשת עררה על גובה ההפקדה.","claimant":"התנאים הכספיים מחמירים מדי וחורגים מתכלית התפיסה, שכן תכלית התפיסה מניעתית ולא לשם הבטחת חילוט.","respondent":"קיים סיכון ממשי להמשך פעילות בלתי חוקית; סכומי ההפקדה משקפים איזון ראוי, והמדינה שוקלת לבקש חילוט הכלים אם תורשע המבקשת.","question":"מהם המבחנים שעל בית המשפט להפעיל לעניין שחרור חפצים שנתפסו על ידי המשטרה, ומהם התנאים הסבירים לשחרור כזה?","ruling":"בית המשפט העליון קיבל את הערר וקבע כי לא ברור מנוסח החלטת המחוזי מהי תכלית התפיסה. הוחזר העניין לבית המשפט המחוזי כדי שיכריע תחילה בתכלית התפיסה, ובהתאם — מהם תנאי השחרור המידתיים.","halacha":"המקור הנורמטיבי לתפיסת חפצים הוא סעיף 32(א) לפקודת סדר הדין הפלילי (מעצר וחיפוש). שלוש התכליות העיקריות: (1) מניעה עתידית; (2) הבטחת חילוט; (3) שימור לראיה. יש לבחון: (א) האם עדיין קיימת עילת תפיסה; (ב) האם ניתן להשיג את התכלית באמצעות 'חלופת תפיסה' הפוגעת פחות בזכות הקניין. תנאי השחרור חייבים להתאים לתכלית הספציפית — אם התכלית חילוט, מוצדקת ערבות התואמת את ערך החפץ; אם מניעתית, אין קורלציה מתחייבת בין ערך הנכס לגובה הערבות.","currency":"לא אומת עדכון מעבר למקורות הקורס"},{"name":"מדינת ישראל נגד מקדאד מקדאד","cite":"ע\"פ 1888/02 (2002) — מפי השופט א' גרוניס (בהסכמת השופטות ד' דורנר וא' פרוקצ'יה)","facts":"המשיב הואשם ברצח וניסיון לרצח, לאחר שממכונית שמתוכה נורו יריות שקטלו אדם ופצעו אחר, נמצא כובע גרב שעליו שרידי רוק שהפרופיל הגנטי שלו תאם את זה של המשיב ברמת ייחודיות של 1 ל-135 מיליארד. המשיב סירב לתת דגימת רוק, ניסה למנוע לקיחת דגימה, שתק בחקירתו בנוגע לרצח והגיב בעוצמה חריגה כשנתפסו תחתוניו. בית המשפט המחוזי זיכה מחמת הספק, ברוב דעות, כנגד דעת מיעוט.","claimant":"המדינה טענה כי מכלול הראיות הנסיבתיות — המסכה עם רוק המשיב, בצירוף התנהגותו — חייב להוביל למסקנה יחידה שהמשיב הוא זה שחבש את המסכה בעת הרצח.","respondent":"הסניגוריה טענה כי אין אפשרות מדעית לדעת את גיל הרוק, וכי לבני משפחתו של המשיב הייתה גישה לכובע הגרב, כך שייתכן שאדם אחר ביצע את המעשה.","question":"האם צירוף ראיה נסיבתית פיזית (רוק על מסכה, תואם גנטית לנאשם) עם התנהגות מפלילה בחקירה מספיק כדי להוכיח מעבר לספק סביר שהנאשם, ולא קרוב משפחה אחר, ביצע את העבירה?","ruling":"הערעור התקבל פה אחד; המשיב הורשע ברצח (סעיף 300(א)(2)) ובניסיון לרצח (סעיף 305). התיק הוחזר למחוזי לגזירת הדין.","halacha":"ראיות נסיבתיות מהוות בסיס למסקנה על עובדה ולא הוכחה ישירה לה; אין לקבוע ממצא מרשיע אלא אם הוא מתחייב הגיונית מן הנסיבות שהוכחו. על בית המשפט לבחון מיוזמתו הסברים תמימים אפשריים, אך אין די באפשרות דמיונית כדי לזכות. סירובו של נאשם לשתף פעולה בהליך חקירה שבכוחו לתרום להוכחת חפותו (כגון סירוב למתן דגימת רוק) הוא התנהגות מפלילה שעשויה לחזק את הראיות נגדו ואף לשמש ראיה נסיבתית עצמאית לחובתו.","currency":"לא אומת עדכון מעבר למקורות הקורס"},{"name":"בנימין אייבי נגד היועץ המשפטי לממשלה","cite":"בג\"ץ 6087/17 (2017) — מפי השופט י' עמית (בהסכמת השופטים א' שהם וג' קרא)","facts":"העותר הגיש עתירה במסגרת החקירה הפלילית 'תיק 3000' (פרשת רכש הצוללות), בבקשה להורות ליועץ המשפטי לממשלה ולפרקליט המדינה להגדיר את ראש הממשלה דאז כחשוד ולזמנו לחקירה, וכן לפרסם לציבור את עמדתם המקצועית לגבי עוצמת החשדות.","claimant":"העותר טען כי המידע הפומבי די בו כדי לבסס חשד סביר, כי החלטת המשיבים בלתי סבירה באופן קיצוני, וכי הסעד המבוקש רק דורש שיפעילו שיקול דעת ויקבלו החלטה סבירה.","respondent":"המשיבים טענו כי הסעד המבוקש משמעו הפעלת לחץ בלתי ראוי על רשויות האכיפה, כי ביקורת שיפוטית ראויה רק לאחר סיום החקירה, וכי חשיפת עמדה מקצועית עלולה לפגוע בחקירה.","question":"האם על בג\"ץ להתערב בשיקול דעתן של רשויות אכיפת החוק בנוגע לניהול חקירה פלילית תלויה ועומדת, ולהורות על חשיפת עמדתן המקצועית לציבור בעודה מתנהלת?","ruling":"העתירה נדחתה על הסף. בג\"ץ קבע כי לא נמצא שהמקרה בא בשערי המקרים החריגים המצדיקים התערבות באופן ניהול החקירה. העותר חויב בהוצאות.","halacha":"לגורמי מערכת אכיפת החוק מוקנה שיקול דעת רחב בשאלת פתיחת חקירה פלילית ובאופן ניהולה. התערבות שיפוטית שמורה למקרים חריגים ביותר — חוסר סבירות קיצוני, חוסר תום לב, או שיקולים זרים — וביתר שאת כאשר החקירה עודנה תלויה ועומדת. בג\"ץ אינו מחליף את רשויות החקירה ואינו פועל כ'שופט חוקר'.","currency":"לא אומת עדכון מעבר למקורות הקורס"},{"name":"הוועד הציבורי נגד עינויים בישראל נגד ממשלת ישראל","cite":"בג\"ץ 5100/94 (1999) — מפי הנשיא אהרן ברק","facts":"שירות הביטחון הכללי (השב\"כ) חקר חשודים בפעילות חבלנית עוינת תוך שימוש באמצעים פיזיים (טלטול, תנוחת 'שבאח', כריעת צפרדע, הידוק אזיקים, מניעת שינה ממושכת), על פי הנחיות פנימיות שאושרו בעקבות דוח ועדת לנדוי (1987). עותרים טענו כי אמצעים אלה בלתי חוקיים ופוגעים בכבוד האדם.","claimant":"לשב\"כ אין סמכות לערוך חקירות, ובוודאי אין לו סמכות להפעיל אמצעים פיזיים הפוגעים בכבוד האדם; אין בהנחיות הפנימיות (המבוססות על סייג ה'צורך') כדי להוות הסמכה כדין.","respondent":"לחוקרי השב\"כ סמכות חקירה כללית, וכאשר מתקיימים תנאי סייג ה'צורך' (סעיף 34יא לחוק העונשין), רשאים החוקרים להפעיל אמצעי לחץ פיזי מתון, ובכלל זה במקרי 'פצצה מתקתקת'.","question":"האם סמכות החקירה הכללית של חוקרי השב\"כ כוללת הרשאה להפעיל אמצעים פיזיים חריגים, והאם סייג ה'צורך' הפלילי יכול לשמש מקור סמכות מינהלית מראש (הנחיות כלליות), להבדיל מהגנה בדיעבד מפני אחריות פלילית אינדיבידואלית?","ruling":"סמכות החקירה הכללית של חוקרי השב\"כ אינה כוללת שימוש באמצעים כגון טלטול, 'שבאח', 'כריעת צפרדע' ומניעת שינה שאינה נובעת מצורכי חקירה טבעיים. סייג ה'צורך' הוא הגנה אד-הוק בדיעבד במישור האחריות הפלילית האינדיבידואלית בלבד, ואינו יכול לשמש מקור סמכות מינהלית כללית מראש. ההנחיות שאישרה ועדת השרים אינן כדין.","halacha":"סמכות חקירה מינהלית חייבת להיות מעוגנת בהסמכה מפורשת בחקיקה ראשית — עקרון חוקיות המינהל. שימוש באמצעים פיזיים (טלטול, 'שבאח', 'כריעת צפרדע', איזוק מכאיב, מניעת שינה מכוונת) חורג מסמכות החקירה הכללית ואסור. ההבחנה המרכזית: סייג ה'צורך' הפלילי (הגנה בדיעבד, אד-הוק, אישית) שונה מהותית מהסמכה מינהלית מראש (פרוספקטיבית, כללית) — הראשון אינו יכול לשמש מקור לשנייה. קביעת מדיניות לגבי הרשאת אמצעי חקירה חריגים (גם למצבי 'פצצה מתקתקת') מסורה לרשות המחוקקת בלבד; בהיעדר חקיקה ראשית, כל שימוש שיטתי ומונחה מראש באמצעים פיזיים חריגים בחקירה הוא בלתי חוקי, גם אם הפועל היחיד עשוי לחסות בדיעבד תחת סייג ה'צורך' אם התקיימו יסודותיו במקרה קונקרטי.","currency":"לא אומת עדכון מעבר למקורות הקורס"},{"name":"מדינת ישראל נגד ויקטור גואטה","cite":"בש\"פ 2145/92 (1992) — מפי המשנה לנשיא מנחם אלון","facts":"שוטרים שערכו מעקב סמוי אחר ויקטור גואטה בחשד לסחר בסמים עצרו אותו ברחוב, דרשו ממנו להוריד את מכנסיו ותחתוניו במקום גלוי לעין (סמוך למדרגות) וערכו בו חיפוש. בחיפוש נמצאה חבילת סם מסוכן (הרואין) שהובלטה מבין ישבניו. בית המשפט המחוזי הורה לשחררו ממעצר בקובעו שהחיפוש המשפיל ברחוב היה בלתי חוקי, והמדינה עררה על כך לעליון.","claimant":"החיפוש שנערך בפרהסיה, תוך הפשטת הנאשם ברשות הרבים, פגע קשות בכבודו וצנעתו, ולכן הוא בלתי חוקי ומחייב את שחרורו וכן פסילת הראיה שהושגה באמצעותו.","respondent":"החיפוש נערך לנוכח חשד סביר וממשי לסחר בסמים, ובנסיבות הדחופות נדרשה פעולה מיידית של השוטרים בשטח; הראיה שנתפסה — חבילת הסם — קבילה ורלוונטית ביותר.","question":"מהי ההבחנה בין \"חיפוש על גוף\" ל\"חיפוש בגוף\" (חיצוני מול פנימי), והאם ניתן לבצע חיפוש חיצוני הכרוך בהפשטת אזרח ברחוב, ומהן מגבלות השמירה על כבוד האדם בעת חיפוש כזה?","ruling":"בית המשפט הביע ביקורת חריפה על אופן ביצוע החיפוש המשפיל ברחוב, אך לנוכח החשד המבוסס והראיה החזקה (הסם עצמו) הוטלו על גואטה תנאי שחרור מגבילים במקום שחרור מלא.","halacha":"חיפוש חיצוני על הגוף (שאינו חדירה פנימית) חייב להתבצע תוך שמירה קפדנית על כבוד האדם וצנעתו; הפשטת אדם ברחוב או ברשות הרבים אסורה בעליל ומהווה פגיעה בלתי חוקית בכבודו, גם כשקיים חשד סביר לביצוע החיפוש.","currency":"לא אומת עדכון מעבר למקורות הקורס","reasoning":"המשנה לנשיא אלון קבע: (א) תפיסת חפץ המובלט מעל הגוף (כגון חבילה הנצפית מבין הבגדים) היא \"חיפוש גופני חיצוני\" ולא חיפוש פנימי חודרני. (ב) גם כאשר קיים חשד סביר המצדיק חיפוש, קיימת חובה מוחלטת לשמור על כבוד האדם וצנעתו מכוח חוק-יסוד: כבוד האדם וחירותו. (ג) הפשטת אדם ברשות הרבים לעיני עוברים ושבים מהווה ביזוי וביוש בלתי חוקי בעליל — אף אם ניתנה לה \"הסכמה\" בנסיבות הלחץ שבשטח; חיפוש הכרוך בהפשטה חייב להתבצע במקום מוצנע ובמכובד ובסודיות.","exam":"אם בקייס שוטרים עורכים \"חיפוש חירום\" הכרוך בהפשטת חשוד במקום גלוי לעין (רחוב, כניסה לבניין) — יש לזהות פגיעה בלתי חוקית בכבוד האדם לפי הלכת גואטה, גם אם היה חשד סביר לחיפוש עצמו; יש להבחין זאת מחיפוש פנימי בגוף (הדורש הליך שונה ומחמיר יותר)."}];
const LIMITATIONS_HTML = "\n  \u003cdiv class=\"panel\">\n    \u003cdiv class=\"eyebrow\">שיעור 6 · טענה מקדמית #6 · סעיף 9–10 לחסד\"פ\u003c/div>\n    \u003ch2>⏳ התיישנות — כל מה שצריך לדעת, בפשטות\u003c/h2>\n\n    \u003cp>ההתיישנות היא אחת משבע הטענות המקדמיות (סעיף 149(6) לחסד\"פ), אך יש לה שלושה \"ראשים\" נפרדים לגמרי, שקל להתבלבל ביניהם. זו הסיבה המרכזית ל\"בלגן\": \u003cb>לא מדובר בכלל אחד, אלא בשלושה נושאים שונים תחת אותה כותרת.\u003c/b>\u003c/p>\n\n    \u003cdiv class=\"scenario-row\" style=\"margin-top:16px;\">\n      \u003cspan class=\"verdict ok\">א\u003c/span>\n      \u003cdiv>\u003cb>התיישנות עבירות\u003c/b> — מתי כבר לא ניתן להעמיד לדין בשל חלוף הזמן מביצוע העבירה. זהו הראש המרכזי והמורכב ביותר.\u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"scenario-row\">\n      \u003cspan class=\"verdict ok\">ב\u003c/span>\n      \u003cdiv>\u003cb>התיישנות עבירות מין בקטינים\u003c/b> — כללים מיוחדים שדוחים את תחילת מניין הזמן, כדי לתת לקורבן זמן להתבגר לפני שהשעון \"מתחיל לרוץ\".\u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"scenario-row\">\n      \u003cspan class=\"verdict ok\">ג\u003c/span>\n      \u003cdiv>\u003cb>התיישנות עונשים\u003c/b> — נושא נפרד לגמרי: לא \"האם אפשר להעמיד לדין\", אלא \"האם אפשר עוד לבצע עונש שכבר נגזר\".\u003c/div>\n    \u003c/div>\n\n    \u003c!-- ============ SECTION A ============ -->\n    \u003cdiv class=\"lim-section-badge\">א. התיישנות עבירות — הכלל הבסיסי\u003c/div>\n    \u003cp>\u003cb>הרעיון:\u003c/b> ככל שעובר יותר זמן מביצוע העבירה, כך קשה יותר לברר את האמת (עדים שוכחים, ראיות נעלמות) וגם פוחת הצורך החברתי בענישה. לכן החוק קובע \"תאריך תפוגה\" להעמדה לדין — התלוי בחומרת העבירה.\u003c/p>\n\n    \u003ch3>כמה זמן יש? (סעיף 9 לחסד\"פ)\u003c/h3>\n    \u003cul>\n      \u003cli>\u003cb>פשע שדינו מיתה או מאסר עולם\u003c/b> — 30 שנים\u003c/li>\n      \u003cli>\u003cb>פשע חמור, דינו 7+ שנות מאסר ומנוי בתוספת לחוק\u003c/b> — 15 שנים\u003c/li>\n      \u003cli>\u003cb>פשע \"רגיל\"\u003c/b> (מעל 3 שנות מאסר, לא מהתוספת) — 10 שנים\u003c/li>\n      \u003cli>\u003cb>עוון\u003c/b> (מאסר 3 חודשים עד 3 שנים) — 5 שנים\u003c/li>\n      \u003cli>\u003cb>חטא\u003c/b> (מאסר עד 3 חודשים) — שנה אחת\u003c/li>\n    \u003c/ul>\n\n    \u003cdiv class=\"callout\">\n      \u003cspan class=\"callout-title\">חריג \"טכנולוגי\" — עדות DNA/טביעת אצבע/תצלום\u003c/span>\n      \u003cp>גם אחרי 15 שנה מיום ביצוע העבירה (ולא יותר מ-23 שנה מהמעשה), עדיין ניתן להעמיד חשוד לדין אם: (1) החשוד אותר רק אחרי 15 השנים; וגם (2) יש בידי הרשות ראיה ביומטרית (DNA, טביעת אצבע, או תצלום פנים) שיש בה יסוד סביר להוכיח את זהותו או את קשרו לעבירה.\u003c/p>\n    \u003c/div>\n\n    \u003ch3>עבירות שלעולם לא מתיישנות\u003c/h3>\n    \u003cp>רצח (לרבות בנסיבות מחמירות); עבירות לפי חוק מניעת פשע השמדת עם ולפי חוק עשיית דין בנאצים ובעוזריהם; ניסיון לרצח ראש ממשלה מכהן או קשירת קשר לכך.\u003c/p>\n\n    \u003ch3>מתי מתחיל השעון לרוץ?\u003c/h3>\n    \u003cp>\u003cb>הכלל:\u003c/b> מיום ביצוע העבירה. אם אדם נחקר על כמה עבירות שמהוות \"פרשה\" אחת — היום הקובע הוא יום ביצוע \u003cb>העבירה החמורה מביניהן\u003c/b>.\u003c/p>\n\n    \u003ch3>מה \"עוצר\" את השעון? — \"אירוע מנתק\"\u003c/h3>\n    \u003cp>זהו החלק הכי מבלבל, אז בואו נפשט: בעבירות פשע או עוון, שלושה סוגי אירועים \"מנתקים\" את מרוץ ההתיישנות — \u003cb>הליכי חקירה, הגשת כתב אישום, או הליך מטעם בית המשפט.\u003c/b> כשקורה אחד מהם, מרוץ ההתיישנות \u003cb>נפסק ומתחיל מחדש מאפס\u003c/b> בתום אותו אירוע.\u003c/p>\n\n    \u003cdiv class=\"callout warn\">\n      \u003cspan class=\"callout-title\">דגש למבחן — בעבירת חטא אין בכלל \"אירוע מנתק\"\u003c/span>\n      \u003cp>שימו לב: מושג ה\"אירוע מנתק\" חל \u003cb>רק על עבירות פשע ועוון\u003c/b>. בעבירת \u003cb>חטא\u003c/b>, שעון ההתיישנות של שנה אחת מתחיל ביום ביצוע העבירה ומסתיים בדיוק כעבור שנה — ללא שום קשר לפעולות המשטרה או התביעה. אפילו אם המשטרה חוקרת, מגישה כתב אישום, או שבית המשפט פועל — שום דבר לא \"מאפס\" את השעון בעבירת חטא.\u003c/p>\n    \u003c/div>\n\n    \u003cdiv class=\"callout warn\">\n      \u003cspan class=\"callout-title\">אבל — יש תקרה! (\"התקופה הנוספת\")\u003c/span>\n      \u003cp>אם לא הייתה שום הגבלה, המשטרה הייתה יכולה \"להחיות\" תיק ישן לנצח רק בעצם פתיחת חקירה. לכן החוק קובע תקרה: כאשר האירוע המנתק הוא \u003cb>הליך חקירה\u003c/b>, ההארכה מעבר לתקופת ההתיישנות המקורית (הנספרת מיום ביצוע העבירה) מוגבלת ל\"תקופה נוספת\" בלבד:\u003c/p>\n      \u003cul style=\"margin:10px 0 0;\">\n        \u003cli>פשע שדינו מיתה/מאסר עולם — עד 5 שנים נוספות (תקרה כוללת: 35 שנה מהמעשה)\u003c/li>\n        \u003cli>פשע חמור מהתוספת (15 שנה בסיס) — עד 3 שנים נוספות (תקרה כוללת: 18 שנה מהמעשה)\u003c/li>\n        \u003cli>פשע \"רגיל\" (10 שנה בסיס) — עד 3 שנים נוספות (תקרה כוללת: 13 שנה מהמעשה)\u003c/li>\n        \u003cli>עוון שאינו מהתוספת (5 שנה בסיס) — עד שנתיים נוספות (תקרה כוללת: 7 שנים מהמעשה)\u003c/li>\n      \u003c/ul>\n      \u003cp style=\"margin-top:10px\">\u003ci>שיטת זיכרון מהירה: בכל קטגוריה — לוקחים את מספר השנים הבסיסי ומוסיפים לו את \"התקופה הנוספת\" כדי לקבל את התקרה הסופית.\u003c/i>\u003c/p>\n    \u003c/div>\n\n    \u003cdiv class=\"example-box\">\n      \u003cspan class=\"ex-title\">💡 דוגמה מהמצגת\u003c/span>\n      \u003cp style=\"margin-bottom:10px;\">עבירת פשע \"רגילה\" (4 שנות מאסר, תקופת התיישנות בסיסית של 10 שנים) בוצעה ב-1/2020. התנהל הליך חקירה שהסתיים ב-1/2025.\u003c/p>\n      \u003cdiv class=\"timeline\">\n        \u003cdiv class=\"timeline-step\">\u003cdiv class=\"timeline-date\">1/2020\u003c/div>\u003cdiv class=\"timeline-dot\">\u003c/div>\u003cdiv class=\"timeline-label\">יום ביצוע\u003cbr>העבירה\u003c/div>\u003c/div>\n        \u003cdiv class=\"timeline-line\">\u003c/div>\n        \u003cdiv class=\"timeline-step\">\u003cdiv class=\"timeline-date\">1/2025\u003c/div>\u003cdiv class=\"timeline-dot\">\u003c/div>\u003cdiv class=\"timeline-label\">הליך החקירה\u003cbr>האחרון\u003c/div>\u003c/div>\n        \u003cdiv class=\"timeline-line\">\u003c/div>\n        \u003cdiv class=\"timeline-step\">\u003cdiv class=\"timeline-date\">1/2030\u003c/div>\u003cdiv class=\"timeline-dot\">\u003c/div>\u003cdiv class=\"timeline-label\">10 שנים מהמעשה\u003cbr>(ההתיישנות \"המקורית\")\u003c/div>\u003c/div>\n        \u003cdiv class=\"timeline-line\">\u003c/div>\n        \u003cdiv class=\"timeline-step\">\u003cdiv class=\"timeline-date\">1/2033\u003c/div>\u003cdiv class=\"timeline-dot end\">\u003c/div>\u003cdiv class=\"timeline-label\">התיישנות סופית\u003cbr>(1/2030 + 3 שנים)\u003c/div>\u003c/div>\n      \u003c/div>\n      \u003cp>למרות שהחקירה \"אפסה\" את השעון והחלה תקופה חדשה של 10 שנים מ-1/2025 (שהייתה מגיעה עד 1/2035) — ה\"תקופה הנוספת\" בעבירת פשע רגילה מוגבלת ל-3 שנים \u003cb>מעבר לתאריך ההתיישנות המקורי\u003c/b> (1/2030). לכן ההתיישנות הסופית היא \u003cb>1/2033\u003c/b>, לא 1/2035.\u003c/p>\n    \u003c/div>\n\n    \u003cdiv class=\"callout\">\n      \u003cspan class=\"callout-title\">ואם יש כמה הליכי חקירה ברצף? (הדוגמה הנוספת במצגת)\u003c/span>\n      \u003cp>המצגת מציגה גם תרחיש שבו יש הליך חקירה נוסף מאוחר יותר (למשל ב-1/2031, שהוא כבר בתוך \"התקופה הנוספת\"). במקרה כזה ה\"תקופה הנוספת\" יכולה להתארך שוב באותה לוגיקה — כל עוד לא חורגים מהתקרה שקבע החוק לאותו סוג עבירה, ובכפוף לכך שגורמים מוסמכים אישרו את ההארכה (ראו בהמשך).\u003c/p>\n    \u003c/div>\n\n    \u003cdetails class=\"enrichment\">\u003csummary>הרחבה שאינה לבחינה: הארכת התקופה הנוספת\u003c/summary>\u003cp>\u003cb>המרצה הוציא טבלה זו מהחומר בשיעור 7.\u003c/b> התוכן הקיים נשמר לעיון; לא בוצע כאן אימות פרטני לכל סמכות ומועד.\u003c/p>\n    \u003cp>בתנאי שקיים אינטרס ציבורי להארכה, גורמים בכירים יכולים להאריך את התקופה הנוספת בשלבים, כשכל הארכה מצטרפת לקודמותיה:\u003c/p>\n    \u003cul>\n      \u003cli>\u003cb>ראש אגף החקירות\u003c/b> (או מקביל) — הארכה של עד 6 חודשים בכל פעם\u003c/li>\n      \u003cli>\u003cb>פרקליט מחוז / ראש ענף חקירות\u003c/b> — לצורך השלמת חקירה, הוצאת תעודת חיסיון, שימוע או החלטה בערר: הארכה של עד שנה–שנתיים בכל פעם, תלוי סוג העבירה\u003c/li>\n      \u003cli>\u003cb>היועץ המשפטי לממשלה\u003c/b> — כשיש גם אינטרס ציבורי וגם נסיבות מיוחדות שיירשמו: הארכה מעת לעת, עד תקרה מצטברת של 3–5 שנים (תלוי סוג העבירה)\u003c/li>\n    \u003c/ul>\n\n    \u003c/details>\u003ch3>אילו פרקי זמן פשוט \"לא נספרים\" (מוקפאים, לא מתאפסים)?\u003c/h3>\n    \u003cp>בשונה מ\"אירוע מנתק\" (שמאפס ומתחיל את השעון מחדש), יש פרקי זמן שפשוט \u003cb>לא נכללים במניין\u003c/b> — השעון נעצר ופשוט ממשיך מהנקודה שבה נעצר, בלי לחזור להתחלה:\u003c/p>\n    \u003cul>\n      \u003cli>החשוד נמצא בחו\"ל, או שלא ניתן לאתרו למרות שקידה סבירה של הרשויות\u003c/li>\n      \u003cli>החשוד מתחמק מהליכי חקירה או העמדה לדין\u003c/li>\n      \u003cli>מצבו הרפואי/הנפשי של החשוד או של עד מרכזי אינו מאפשר את קיום ההליך\u003c/li>\n      \u003cli>עד מרכזי בחו\"ל/לא ניתן לאתרו — ובנוסף מתקיים אחד מאלה: יש יסוד להניח שזה בגלל פעולות החשוד; או שמדובר בעבירת טרור/ארגון פשיעה; או שמדובר בפשע חמור (7+ שנים) — ואז ההקפאה מוגבלת ל-3 שנים לכל היותר\u003c/li>\n      \u003cli>בקשת עזרה משפטית ממדינה אחרת\u003c/li>\n      \u003cli>הליכים משפטיים שנוקט החשוד עצמו\u003c/li>\n      \u003cli>חסינות שנתונה לחשוד לפי דין\u003c/li>\n      \u003cli>מיום החתימה על הסדר מותנה ועד תום התקופה שנקבעה לקיום תנאיו (או עד הפרתם/גילוי מרמה)\u003c/li>\n    \u003c/ul>\n\n    \u003ch3>מה קורה בסוף?\u003c/h3>\n    \u003cdiv class=\"scenario-row\">\n      \u003cspan class=\"verdict need\">חלפה ההתיישנות\u003c/span>\n      \u003cdiv>לא ניתן עוד להעמיד לדין על העבירה — הדבר יוביל לביטול כתב האישום.\u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"scenario-row\">\n      \u003cspan class=\"verdict ok\">לא חלפה\u003c/span>\n      \u003cdiv>ניתן להעמיד לדין כרגיל.\u003c/div>\n    \u003c/div>\n\n    \u003c!-- ============ SECTION B ============ -->\n    \u003cdiv class=\"lim-section-badge b\">ב. התיישנות בעבירות מין שנעברו בקטינים\u003c/div>\n    \u003cdiv class=\"callout warn\">\n      \u003cspan class=\"callout-title\">⚠ הוסר מחומר הבחינה — הודעת המרצה בשיעור 7\u003c/span>\n      \u003cp>בפתיחת שיעור 7 הודיע המרצה במפורש כי בשל המורכבות המשפטית ותכיפות שינויי החקיקה בנושא, הוא \u003cb>מסיר לחלוטין את נושא התיישנות עבירות מין בקטינים מחומר החובה של הקורס ומהבחינה המסכמת\u003c/b>. הנושא יילמד בהרחבה בשנה הבאה, בקורס המתקדם \"סדר דין פלילי מהלכה למעשה\". התוכן שלהלן נשאר לעיונכם (לא נבדקה עדכניותו מעבר למקורות המחברת), אך \u003cb>אינו לחומר הבחינה\u003c/b>.\u003c/p>\n    \u003c/div>\n    \u003cp>כאן החוק \"דוחה\" את תחילת מרוץ ההתיישנות הרבה מעבר ליום ביצוע העבירה — כדי לתת לקורבן, שהיה קטין בזמן העבירה, זמן ממשי להתבגר ולבחור להתלונן.\u003c/p>\n\n    \u003ch3>פגיעה בידי בן משפחה או אחראי על הקטין\u003c/h3>\n    \u003cp>מניין ההתיישנות (15 שנה, כדין עבירת מין) \u003cb>מתחיל רק ביום שבו מלאו לקורבן 34 שנים\u003c/b> — ולא ביום ביצוע העבירה.\u003c/p>\n    \u003cdiv class=\"example-box\">\n      \u003cspan class=\"ex-title\">💡 דוגמה\u003c/span>\n      \u003cp>הורה ביצע עבירת אינוס בילדתו כשהייתה בת 16. מרוץ 15 השנים מתחיל רק ביום שבו היא תמלא 34 — כלומר ניתן להעמיד את ההורה לדין \u003cb>עד שהילדה תמלא 49\u003c/b>.\u003c/p>\n    \u003c/div>\n\n    \u003ch3>פגיעה בידי מי שאינו בן משפחה/אחראי (ובן 15+)\u003c/h3>\n    \u003cp>מניין ההתיישנות מתחיל ביום שבו מלאו לקטין \u003cb>33 שנים\u003c/b>.\u003c/p>\n    \u003cdiv class=\"example-box\">\n      \u003cspan class=\"ex-title\">💡 דוגמה\u003c/span>\n      \u003cp>לוי (בן 30) ביצע עבירת אינוס בשכנתו חן, כשהייתה בת 16. ניתן להעמיד את לוי לדין \u003cb>עד שחן תמלא 48\u003c/b> (15 שנה החל מיום שתמלא 33).\u003c/p>\n    \u003c/div>\n\n    \u003ch3>מתי צריך \"תוספת ראייתית\" (חיזוק) כדי להרשיע?\u003c/h3>\n    \u003cp>אם התלונה במשטרה הוגשה \u003cb>גם\u003c/b> אחרי שהקורבן עבר את גיל הסף (28 למשפחה/אחראי, 18 לאחרים) \u003cb>וגם\u003c/b> אחרי שחלפו 15 השנה מיום ביצוע העבירה עצמו — ניתן להרשיע על סמך עדות הקטין בלבד \u003cb>רק אם יש בחומר הראיות דבר לחיזוקה\u003c/b>.\u003c/p>\n\n    \u003cdiv class=\"callout warn\">\n      \u003cspan class=\"callout-title\">אין להתבלבל! מלכודת ניסוח\u003c/span>\n      \u003cp>הניסוח בחוק \"...או... לפי המאוחר\" עלול להישמע כאילו מספיק תנאי אחד. בפועל \u003cb>מדובר בתנאים מצטברים\u003c/b> — צריך גם שחלף גיל הסף וגם שחלפה תקופת ה-15 שנה, כדי שיידרש חיזוק.\u003c/p>\n    \u003c/div>\n\n    \u003cp>\u003cb>עבירה בידי בן משפחה/אחראי\u003c/b> (גיל סף 28):\u003c/p>\n    \u003cdiv class=\"scenario-row\">\u003cspan class=\"verdict need\">נדרש חיזוק\u003c/span>\u003cdiv>עבירה בגיל 13, תלונה בגיל 29 — גם מלאו לקורבן 28 וגם חלפו 15 השנה\u003c/div>\u003c/div>\n    \u003cdiv class=\"scenario-row\">\u003cspan class=\"verdict ok\">אין צורך בחיזוק\u003c/span>\u003cdiv>עבירה בגיל 15, תלונה בגיל 29 — מלאו 28, אך טרם חלפה תקופת ה-15 שנה\u003c/div>\u003c/div>\n    \u003cdiv class=\"scenario-row\">\u003cspan class=\"verdict ok\">אין צורך בחיזוק\u003c/span>\u003cdiv>עבירה בגיל 11, תלונה בגיל 27 — חלפה תקופת ה-15 שנה, אך טרם מלאו לקורבן 28\u003c/div>\u003c/div>\n\n    \u003cp style=\"margin-top:14px;\">\u003cb>עבירה בידי מי שאינו בן משפחה/אחראי\u003c/b> (גיל סף 18):\u003c/p>\n    \u003cdiv class=\"scenario-row\">\u003cspan class=\"verdict need\">נדרש חיזוק\u003c/span>\u003cdiv>עבירה בגיל 8, תלונה בגיל 24 — גם מלאו 18 וגם חלפו 15 השנה\u003c/div>\u003c/div>\n    \u003cdiv class=\"scenario-row\">\u003cspan class=\"verdict ok\">אין צורך בחיזוק\u003c/span>\u003cdiv>עבירה בגיל 10, תלונה בגיל 19 — מלאו 18, אך טרם חלפה תקופת ה-15 שנה\u003c/div>\u003c/div>\n    \u003cdiv class=\"scenario-row\">\u003cspan class=\"verdict ok\">אין צורך בחיזוק\u003c/span>\u003cdiv>עבירה בגיל שנתיים, תלונה בגיל 17 וחצי — חלפה תקופת ה-15 שנה, אך טרם מלאו 18\u003c/div>\u003c/div>\n\n    \u003ch3>הגשת כתב אישום אחרי חלוף 15 השנה מהמעשה\u003c/h3>\n    \u003cp>אם חלפה תקופת ההתיישנות הנמנית \u003cb>מיום ביצוע העבירה עצמה\u003c/b> (15 שנה) — ניתן להגיש כתב אישום רק \u003cb>באישור היועץ המשפטי לממשלה\u003c/b> (גם אם עדיין לא חלפה ההתיישנות \"הדחויה\" הנמנית מגיל 33/34).\u003c/p>\n\n    \u003c!-- ============ SECTION C ============ -->\n    \u003cdiv class=\"lim-section-badge c\">ג. התיישנות עונשים\u003c/div>\n    \u003cp>נושא שונה לגמרי: לא אם ניתן להעמיד לדין, אלא — לאחר שכבר \u003cb>הורשע\u003c/b> הנאשם ונגזר עליו עונש — עד מתי ניתן עוד לבצע את אותו עונש בפועל.\u003c/p>\n\n    \u003ch3>כמה זמן יש לבצע את העונש?\u003c/h3>\n    \u003cul>\n      \u003cli>\u003cb>פשע\u003c/b> — 20 שנים\u003c/li>\n      \u003cli>\u003cb>עוון\u003c/b> — 10 שנים\u003c/li>\n      \u003cli>\u003cb>חטא\u003c/b> — 3 שנים\u003c/li>\n    \u003c/ul>\n    \u003cp>זה חל על עונש שהוטל ולא התחיל בביצועו, וגם על עונש שהופסק ביצועו ולא נמשך.\u003c/p>\n\n    \u003cdiv class=\"callout warn\">\n      \u003cspan class=\"callout-title\">דגש למבחן\u003c/span>\n      \u003cp>בעבירה שאין לה התיישנות (למשל רצח) — \u003cb>גם אין התיישנות על העונש\u003c/b> שהוטל בגינה. עונש מאסר עולם על רצח לעולם לא \"יתיישן\".\u003c/p>\n    \u003c/div>\n\n    \u003ch3>מתי מתחיל השעון?\u003c/h3>\n    \u003cp>מיום שפסק הדין נעשה \u003cb>חלוט\u003c/b> (אין עליו עוד ערעור), או מיום ההפסקה בביצוע העונש — \u003cb>לפי המאוחר מביניהם\u003c/b>.\u003c/p>\n\n    \u003cdiv class=\"callout warn\">\n      \u003cspan class=\"callout-title\">דגש למבחן — התנאי המכריע: \"באשמת מי\" נעצר הביצוע\u003c/span>\n      \u003cp>השעון ממשיך לרוץ \u003cb>רק כאשר\u003c/b> העיכוב או ההפסקה בביצוע העונש אירעו \u003cb>באשמת המדינה או הרשות\u003c/b> — למשל שירות בתי הסוהר שחרר אסיר מוקדם עקב צפיפות או מגפה ולא קרא לו לשוב. לעומת זאת, אם האסיר עצמו נמלט, התחמק, או ברח לחוץ לארץ — פרק הזמן הזה \u003cb>אינו נספר כלל\u003c/b>, והשעון קופא לחלוטין.\u003c/p>\n    \u003c/div>\n\n    \u003ch3>מה לא נספר?\u003c/h3>\n    \u003cp>פרק הזמן שבו מי שהוטל עליו העונש שהה בחו\"ל, או שלא ניתן היה לאתרו בשל התחמקותו מריצוי העונש.\u003c/p>\n\n    \u003cdiv class=\"example-box\">\n      \u003cspan class=\"ex-title\">💡 מקרה אמיתי — יוסי בן ארי, 30 שנה בפרגוואי\u003c/span>\n      \u003cp>בן ארי נידון בשנות ה-90 לתריסר שנות מאסר בעבירות סמים חמורות מסוג פשע. לאחר שריצה 4 שנים בלבד, נמלט מהכלא וברח לפרגוואי, שם חי תחת זהות בדויה כמעט 30 שנה — עד שאותר, נעצר והוחזר לישראל ב-2021. הוא עתר לשחרורו בטענה שחלפו מעל 20 שנה מאז הפסקת ריצוי העונש, ולכן העונש התיישן לפי סעיף 10(א). המדינה השיבה כי לפי סעיף 10(ג), תקופת ההימלטות אינה נספרת כלל. השופט אלכס שטיין דחה את העתירה וקבע: מוסד ההתיישנות נועד להעניק מחילה למי ששהה בקהילה וסבל מחרדת העונש המתמדת — לא למי שנמלט וחי בשקט תחת זהות בדויה.\u003c/p>\n    \u003c/div>\n    \u003cdiv class=\"callout case-callout\">\u003cspan class=\"callout-title\">קשור לפסק דין\u003c/span>\u003cbutton class=\"case-link\" data-case=\"23\">⚖ יוסי בן ארי נגד השר לביטחון פנים (2021)\u003c/button>\u003c/div>\n  \u003c/div>\n";

ת המשפט קבע שהכללים על התסקיר הם כללי רלוונטיות ולא כללי קבילות רגילים, ולא הטיל איסור פסיקתי גורף על הכללת המידע."]}];

const MCQ = [{"q":"עבירה שהעונש המרבי עליה הוא בדיוק 3 שנות מאסר מסווגת כ:","opts":["חטא","עוון","פשע","תלוי בבית המשפט הדן בעניין"],"correct":1,"explain":"לפי סעיף 24 לחוק העונשין, \"עוון\" כולל עונש מרבי העולה על 3 חודשים ועד 3 שנים <b>כולל</b>. רק מעל 3 שנים מדובר ב\"פשע\".","id":"mcq-1","topic":"classify","lesson":"1","extra":false},{"q":"מתי רשאית המשטרה שלא לחקור תלונה על עבירת פשע?","opts":["בכל מקרה שבו יש חוסר בכוח אדם","רק באישור פרקליט המחוז","במקרים חריגים שבהם התלונה מופרכת לחלוטין ונעדרת תשתית ראייתית מינימלית (הלכת צדוק)","לעולם לא — חובת החקירה בפשע היא מוחלטת"],"correct":2,"explain":"בהלכת בג\"ץ צדוק נקבע חריג מצומצם: כשאין כל תשתית ראייתית מינימלית וברור שאין יסוד לחשד, המשטרה רשאית להימנע מחקירה גם בעבירת פשע.","id":"mcq-2","topic":"sec59","lesson":"1","extra":false,"source":"שיעור 1.mp3 — הדיון בסעיף 59 ובדוגמת גניבה ממעסיק"},{"q":"מיהו הגורם המכריע בערר על החלטת פרקליט מחוז שלא להעמיד לדין מטעמי מדיניות (נסיבות העניין)?","opts":["פרקליט המדינה","היועץ המשפטי לממשלה","בית המשפט לעניינים מנהליים","מנהל תחום עררים בפרקליטות המדינה"],"correct":1,"explain":"כאשר ההחלטה מבוססת על עילת מדיניות (נסיבות העניין), הערר מוכרע בידי היועץ המשפטי לממשלה. עילה מקצועית (חוסר ראיות/אשמה) מוכרעת בידי פרקליט המדינה.","id":"mcq-3","topic":"appeal","lesson":"3","extra":false},{"q":"לפי המסגרת שלימד המרצה בשיעור 3, איזה נתון מונע הסדר מותנה?","opts":["העבירה מסוג עוון","העונש הצפוי אינו כולל מאסר בפועל","העבירה מסוג פשע","עבר פלילי נקי ב-5 השנים האחרונות"],"correct":2,"explain":"המרצה תחם את ההסדר הנלמד לעבירות חטא ועוון והדגיש שאין להסיק מהיעדר בקשת מאסר שהסיווג של עבירת פשע השתנה.","id":"mcq-4","topic":"conditional","lesson":"3","extra":false,"source":"שיעור 3.mp3 — הסבר המרצה על סגירת תיק בהסדר, תנאי הסף והעיון לפני חתימה"},{"q":"שני שותפים הועמדו לדין בכתבי אישום נפרדים. לפי בג״ץ 11339/05, האם סיום משפטו של העד הוא תנאי גורף להעדתו?","opts":["כן, בכל מקרה","לא; ככלל ניתן להעידו, ודחייה עד לסיום משפטו היא חריגה ומנומקת","כן, אלא אם הנאשם הודה","לא ניתן להעיד שותף לעולם"],"correct":1,"explain":"בוטל החסם הגורף של הלכת קנזי. הושארה אפשרות לדחייה במקרים חריגים ביותר ומטעמים שיירשמו.","id":"mcq-5","topic":"kanzi","source":"מדינת ישראל נ׳ בית המשפט המחוזי באר שבע 11339-05.pdf — ההכרעה הסופית ודעת הנשיאה ביניש, פסקה 3","lesson":"3","extra":false},{"q":"מהי המלכודת בהחלת הלכת קנזי ההיסטורית על כל מקרה של עדות שותף?","opts":["התעלמות מהשינוי בבג״ץ 11339/05 ומההבחנה בין משפטים נפרדים למשותפים","הכלל חל רק על עבירות חטא","ביטול החסם הופך כל עדות למהימנה","משפט נפרד הוא תמיד כתב אישום משותף"],"correct":0,"explain":"יש להפריד בין הדין ההיסטורי, הכלל המאוחר והמסלול הדיוני. הסרת החסם אינה קביעה שכל עדות שותף מהימנה.","id":"mcq-6","topic":"kanzi","source":"מדינת ישראל נ׳ בית המשפט המחוזי באר שבע 11339-05.pdf — ההכרעה הסופית ודעת הנשיאה ביניש, פסקה 3","lesson":"3","extra":false},{"q":"מה ההבדל בין תיקון כתב אישום לפני ההקראה לבין תיקון לאחריה?","opts":["אין הבדל — התובע תמיד צריך אישור שופט","לפני ההקראה התובע מתקן בחופשיות; אחריה נדרשת בקשה רשמית ואישור שהנאשם קיבל הזדמנות סבירה להתגונן","לפני ההקראה נדרש אישור היועמ\"ש; אחריה התובע חופשי","התיקון אפשרי רק אחרי ההקראה"],"correct":1,"explain":"לפני תחילת המשפט התובע הוא הבעלים הבלעדי של כתב האישום. לאחר ההקראה, כל תיקון טעון בקשה רשמית ואישור שניתנה לנאשם הזדמנות סבירה להתגונן מפני השינוי.","id":"mcq-7","topic":"amend","lesson":"4","extra":false},{"q":"נאשם הודה בעובדות כתב האישום, אך אין בהן כדי להרשיע, והתביעה מבקשת לחזור בה מהאישום. מה התוצאה?","opts":["הרשעה אוטומטית","זיכוי מוחלט, ברשות בית המשפט","ביטול כתב האישום בלבד, ללא זיכוי","התיק ממשיך כרגיל"],"correct":1,"explain":"כאשר ההודאה אינה מספיקה להרשעה, התביעה רשאית לחזור מהאישום ברשות בית המשפט, והתוצאה היא זיכוי מוחלט.","id":"mcq-8","topic":"withdraw","lesson":"4","extra":false},{"q":"מתי חלה זכות העיון בחומר חקירה לפי סעיף 74?","opts":["מרגע פתיחת החקירה, לכל עבירה","רק בעבירות חטא","עם הגשת כתב האישום, ורק בעבירות פשע ועוון","רק לאחר תחילת שמיעת הראיות"],"correct":2,"explain":"זכות העיון קמה עם הגשת כתב האישום, וחלה רק בעבירות מסוג פשע או עוון — לא בעבירות חטא כגון תעבורה פשוטה.","id":"mcq-9","topic":"review","lesson":"5","extra":false},{"q":"התביעה סירבה לחשוף חומר חסוי, ובית המשפט הורה על חשיפתו. מה אינה אחת משלוש האפשרויות העומדות בפני המדינה?","opts":["לחשוף את החומר לנאשם","להמשיך במשפט בלי להשתמש בחומר כראיה","לבקש מבית המשפט להאריך את מעצר הנאשם","לחזור מכתב האישום כדי להגן על מקור מודיעיני"],"correct":2,"explain":"שלוש האפשרויות הן: לחשוף, להמשיך בלי להשתמש בחומר כראיה, או לחזור מכתב האישום. הארכת מעצר אינה קשורה לדילמת החשיפה.","id":"mcq-10","topic":"review","lesson":"5","extra":false},{"q":"מהם ארבעת התנאים המצטברים לוויתור על הקראת כתב האישום בקול רם?","opts":["הנאשם משלם קנס, מודה ומוותר על סנגור","ייצוג על ידי סנגור, הצהרת הסנגור שהקריא או הסביר את כתב האישום, אישור הנאשם בפני בית המשפט, ואישור בית המשפט לוויתור","הודאה בכתב בלבד ואישור התביעה","בקשה בעל־פה של התובע ללא נוכחות הנאשם"],"correct":1,"explain":"ארבעת התנאים המצטברים: הנאשם מיוצג בידי סנגור; הסנגור מצהיר שהקריא או הסביר לנאשם את כתב האישום; הנאשם מאשר את הוויתור בפני בית המשפט; ובית המשפט מאשר את הוויתור לאחר שבחן שהנאשם מבין את משמעותו.","id":"mcq-11","topic":"reading","lesson":"5","extra":false},{"q":"מהי דוקטרינת הפסילה הראייתית הנהוגה בישראל (הלכת יששכרוב)?","opts":["פסילה אוטומטית של כל ראיה שהושגה שלא כדין (\"פירות העץ המורעל\")","פסילה פסיקתית יחסית — שיקול דעת לפי איזון אינטרסים","אין פסילה בישראל בשום מקרה","פסילה רק בעבירות ביטחון"],"correct":1,"explain":"בניגוד לדוקטרינה האמריקאית הקטגורית, בישראל נקבעה בהלכת יששכרוב פסילה פסיקתית יחסית: שיקול דעת של בית המשפט לפי איזון אינטרסים, לא פסילה אוטומטית.","id":"mcq-12","topic":"packer","lesson":"1","extra":false},{"q":"על פי סעיף 184 לחסד״פ, אילו תנאים מצטברים הדגיש המרצה להרשעה בעבירה אחרת שהתגלתה מן העובדות?","opts":["שהעבירה האחרת חמורה יותר ושנמסרה הודעה לתביעה","הזדמנות סבירה להתגונן; ואיסור להטיל עונש חמור מזה שהיה אפשר להטיל בעבירה המקורית","הסכמת הנאשם בלבד","שהעבירה האחרת הופיעה מראש בכתב האישום"],"correct":1,"explain":"בשיעור 1 הוצגו שני תנאים מצטברים: הזדמנות סבירה להתגונן, והגבלת חומרת העונש. בפרשת דמיאניוק המוקד היה בתנאי הראשון.","id":"mcq-13","topic":"sec184","lesson":"1","extra":false,"source":"שיעור 1.mp3 — סעיף 184"},{"q":"מה קורה כאשר בית המשפט המחוזי מוסמך לדון בנאשם אחד מתוך כתב אישום משותף, ואילו נאשם אחר מואשם רק בעבירות שבסמכות בית משפט השלום?","opts":["התיק כולו מפוצל אוטומטית לשני בתי משפט","המחוזי רוכש סמכות \"נגררת\" לדון גם בנאשם השני (הלכת סוסן)","הנאשם השני זכאי לזיכוי אוטומטי","יש צורך באישור היועמ\"ש לדיון משותף"],"correct":1,"explain":"הלכת סוסן קובעת שכאשר למחוזי סמכות עניינית לגבי נאשם אחד בכתב אישום משותף, הוא רוכש סמכות נגררת לדון גם ביתר הנאשמים, למניעת פיצול הליכים.","id":"mcq-14","topic":"joinder","lesson":"4","extra":false},{"q":"מהי \"עילת הזהב\" מבין עילות סגירת התיק לפי סעיף 62?","opts":["חוסר ראיות מספיקות","נסיבות העניין בכללותן","חוסר אשמה — מביאה למחיקה מוחלטת ומיידית של הרישום","חוסר סמכות עניינית"],"correct":2,"explain":"עילת חוסר אשמה נחשבת \"עילת הזהב\" משום שהיא מביאה למחיקה מוחלטת ומיידית של הרישום המשטרתי, בשונה משתי העילות האחרות שמותירות רישום פנימי.","id":"mcq-15","topic":"closure","lesson":"2","extra":false},{"q":"בעבירת פשע רגילה, מהו תפקיד \"התקופה הנוספת\" לפי ההסבר בשיעור 7?","opts":["היא חלה על כל אירוע מנתק ללא הבחנה","היא רלוונטית רק כאשר האירוע המנתק הוא פעולת חקירה","היא מבטלת כל התיישנות בעבירות פשע","היא חלה רק לאחר גזר הדין"],"correct":1,"explain":"המרצה הדגיש שהמנגנון נוגע לאירוע מנתק מסוג פעולת חקירה בלבד, ולא לכתב אישום או להליך מטעם בית המשפט. טבלת ההארכות עצמה הוצאה מחומר הבחינה.","id":"mcq-16","topic":"limitations-pointer","lesson":"6","extra":false,"source":"שיעור 7 ערוך.mp3 — דברי המרצה בתחילת הדיון בהתיישנות"},{"q":"איזו קביעה תואמת את ההנחיה המפורשת בשיעור 7 לגבי בחינה?","opts":["יש ללמוד את טבלת ההארכות בעבירות מין בקטינים","נושא התיישנות עבירות המין בקטינים וטבלת ההארכות אינם חלק מחומר הבחינה","אין התיישנות לעבירות מין בקטינים בכל מצב","התיישנות עבירות מין בקטינים נלמדת רק בשיעור 8"],"correct":1,"explain":"המרצה הורה להתעלם מן השקפים בנושא זה לצורך הבחינה ולהוציא גם את טבלת ההארכות מחומר הלימוד.","id":"mcq-17","topic":"limitations-pointer","lesson":"6","extra":false,"source":"שיעור 7 ערוך.mp3 — דברי המרצה בתחילת הדיון בהתיישנות"},{"q":"נאשם ערער על חומרת עונשו בלבד (המדינה לא ערערה). בערעור התגלה שביצע עבירה חמורה יותר מזו שהורשע בה. מה רשאי בית המשפט שלערעור לעשות?","opts":["להרשיע בעבירה החמורה ולהחמיר בעונש כרצונו","להרשיע בעבירה החמורה (סעיף 216), אך לא להחמיר בעונש מעבר למה שנגזר במקור","לא לגעת בתיק כלל, כי הנאשם הוא היחיד שערער","לבטל את כתב האישום אוטומטית"],"correct":1,"explain":"סעיף 216 מתיר הרשעה בעבירה שהתגלתה מהעובדות, ובלבד שניתנה הזדמנות סבירה להתגונן. אך סעיף 217 קובע שבערעור שהגיש הנאשם על חומרת העונש, בית המשפט לא יחמיר — ההחמרה אפשרית רק אם המדינה ערערה על קולת העונש.","id":"mcq-18","topic":"appeals","lesson":"8","extra":false},{"q":"מהו ההבדל בין טענת \"סיכון כפול\" לטענת \"כבר נשפטתי\" לפי סעיף 5 לחסד\"פ?","opts":["אין הבדל, מדובר באותה טענה","\"כבר נשפטתי\" מבוססת על מעשה בית-דין; \"סיכון כפול\" מבוססת על כך שאין להעמיד אדם פעמיים בסיכון הרשעה, גם אם ההליך הקודם לא הסתיים בפסק דין","\"סיכון כפול\" חלה רק בעבירות מס","\"כבר נשפטתי\" חלה רק בערעור"],"correct":1,"explain":"טענת \"כבר נשפטתי\" (סעיף 5) דורשת זיכוי או הרשעה קודמים בפועל (מעשה בית-דין). טענת \"סיכון כפול\" רחבה יותר עקרונית אך נדירה מאוד בפועל — היא נטענת כשההליך הקודם הופסק באמצע בלי שהסתיים בפסק דין, ובתי המשפט תמיד דחו אותה לגופה עד כה.","id":"mcq-19","topic":"double-jeopardy-justice","lesson":"6","extra":false},{"q":"עבירת חטא בוצעה ב־1.1.2023. בהנחה שאין תקופה שיש לגרוע מהמניין, מהו המועד כעבור שנת ההתיישנות הבסיסית?","opts":["1.1.2024","1.1.2025","1.8.2024","אין התיישנות לחטא"],"correct":0,"explain":"שנה מ־1.1.2023 היא 1.1.2024. לפי ההסבר בשיעור 7, פעולת חקירה אינה מאפסת את מניין ההתיישנות בחטא.","id":"mcq-20","topic":"limitations-pointer","source":"שיעור 7 ערוך.mp3 — דברי המרצה בתחילת הדיון בהתיישנות","lesson":"6","extra":false},{"q":"בכתב אישום אחד נגד שני נאשמים, אחד הודה והאחר כופר. מהו הכלל שנלמד בשיעור 7?","opts":["גוזרים מיד את דינו של המודה","לא גוזרים את דין המודה לפני סיום בירור משפטו של מי שלא הודה","מוחקים את כתב האישום נגד מי שהודה","מפצלים תמיד את כתב האישום"],"correct":1,"explain":"סעיף 155 הוצג בהקלטה ככלל של דחיית גזר הדין של מי שהודה עד לסיום בירור משפטם של מי שלא הודו. ההסבר שניתן: לאפשר לבית המשפט לראות את התמונה הכוללת ואת חלקו של כל נאשם.","id":"mcq-21","topic":"multi-defendants","lesson":"7","extra":false,"source":"שיעור 7 ערוך.mp3 — דברי המרצה"},{"q":"חשוד הועמד לדין בעבירה שעונשה המרבי 3 שנות מאסר בדיוק, במסגרת כתב אישום משותף עם נאשם נוסף שהעבירה שיוחסה לו היא בסמכות המחוזי. איזה בית משפט ידון בעניינו של הראשון?","opts":["בית משפט השלום בלבד, כי עבירתו היא עוון","בית המשפט המחוזי, מכוח סמכות נגררת (הלכת סוסן)","יש לפצל את הדיון בין שני בתי המשפט","אין לבית משפט כלשהו סמכות לדון בו"],"correct":1,"explain":"עבירה בעונש מרבי של בדיוק 3 שנים מסווגת כעוון (סעיף 24), הנתון עקרונית לסמכות השלום. אך מכוח הלכת סוסן, כשלמחוזי סמכות עניינית לגבי נאשם אחד בכתב אישום משותף, הוא רוכש סמכות נגררת לדון גם בנאשם השני — גם אם עבירתו הפרטנית בסמכות השלום.","id":"mcq-22","topic":"joinder","lesson":"4","extra":false},{"q":"חשוד נחקר וזוכה בעבר מעבירת גניבה מסוימת. כעבור שנתיים מתגלות ראיות חדשות, והתביעה מבקשת להעמידו לדין שוב על אותה גניבה בדיוק. מה הדין?","opts":["מותר, כי יש ראיות חדשות","אסור — סעיף 5 לחסד\"פ אוסר דיון חוזר על מעשה שממנו זוכה, למעט חריג מצומצם של מוות מאוחר לקורבן","מותר רק באישור היועמ\"ש","אסור לחלוטין, ואף לא ניתן לפתוח חקירה חדשה בעתיד על עבירה אחרת"],"correct":1,"explain":"סעיף 5 לחסד\"פ קובע איסור עקרוני לדון באדם על מעשה שממנו כבר זוכה, כטענה מקדמית עצמאית — ללא קשר לגילוי ראיות חדשות. החריג היחיד הוא מקרה מוות מאוחר של הקורבן.","id":"mcq-23","topic":"double-jeopardy-justice","lesson":"6","extra":false},{"q":"טרם הוגש כתב אישום והוצע לחשוד הסדר מותנה. מדוע יש לאפשר לו עיון בחומר החקירה ובטיוטת האישום?","opts":["כדי שיוכל להחליט באופן מושכל אם להסכים להסדר ולהודות בעובדות","משום שכל חשוד זכאי תמיד לכל תיק החקירה מיד עם פתיחתו","משום שכבר הורשע בבית המשפט","אין לו אפשרות לעיין לפני החתימה בשום מקרה"],"correct":0,"explain":"זו זכות עיון במסגרת ההסדר המוצע לפני אישום, שנועדה לאפשר בחינה של הראיות וההסכמה. אין לבלבל אותה עם העיון הרגיל של נאשם לאחר הגשת אישום לפי סעיף 74. השאלה הקודמת הציעה מסלול תקיפה שלא אומת והוחלפה.","id":"mcq-24","topic":"conditional","lesson":"3","extra":false,"source":"שיעור 3.mp3 — הסבר המרצה על סגירת תיק בהסדר, תנאי הסף והעיון לפני חתימה"},{"q":"מה משותף לסעיף 167 לחסד\"פ (הבאת ראיות מיוזמת בית המשפט) ולהלכת יששכרוב (פסילת ראיות)?","opts":["שניהם עוסקים בסמכות מעצר","שניהם דוגמאות למתח בין חשיפת האמת/יעילות לבין זכויות והגינות ההליך, ומעניקים לבית המשפט שיקול דעת ולא כלל נוקשה","אין ביניהם שום קשר","שניהם חלים רק בבית המשפט העליון"],"correct":1,"explain":"סעיף 167 מבטא נסיגה אינקוויזיטורית לטובת חשיפת האמת, ופסילה פסיקתית יחסית (יששכרוב) מבטאת איזון בין מיגור פשיעה להליך ראוי — בשני המקרים לבית המשפט שיקול דעת רחב, לא כלל אוטומטי.","id":"mcq-25","topic":"adversarial","lesson":"1","extra":false},{"q":"פרקליט המחוז החליט לחרוג מחלוקת העבודה הרגילה בין הפרקליטות לתביעה המשטרתית (סעיף 60(ו)). כעבור זמן, במהלך המשפט, מבקשת התביעה לתקן את כתב האישום כדי להוסיף עבירה חמורה יותר. מה משותף לשני המצבים מבחינת תוצאת החריגה?","opts":["שניהם פוסלים אוטומטית את ההליך","בשניהם יש לבחון את תנאי הדין ואת הפגיעה בהגנה; לא כל חריגה טכנית מבטלת את ההליך","שניהם דורשים אישור בית המשפט העליון","אין ביניהם שום קשר עקרוני"],"correct":1,"explain":"בשני המקרים החוק מאפשר גמישות (חריגה מחלוקת עבודה; תיקון כתב אישום), ובשניהם המבחן המכריע הוא אם נגרם עיוות דין/נפגעה הזדמנות סבירה להתגונן — לא פגם טכני כשלעצמו.","id":"mcq-26","topic":"amend","lesson":"4","extra":false,"source":"חוק סדר הדין הפלילי [נוסח משולב] תשמ\"ב-1982 — סעיף 60(ו)"},{"q":"מהו ההבדל המהותי בין \"עיכוב\" ל\"מעצר\" לפי חוק המעצרים?","opts":["אין הבדל, אלו מונחים נרדפים","עיכוב הוא הגבלת חירות קלה ומתוחמת בזמן/במקום; מעצר הוא שלילת חירות מלאה","עיכוב חל רק על עדים, מעצר חל רק על חשודים","עיכוב דורש צו שופט, מעצר לא"],"correct":1,"explain":"עיכוב הוא הגבלה קלה ומתוחמת (לבירור/חקירה במקום, עד 3 שעות ובנסיבות מסוימות 6 שעות), בעוד מעצר הוא שלילת חירות מלאה. כלל הברזל: לא ייעצר אדם אם ניתן להסתפק בעיכוב.","id":"mcq-27","topic":"arrest-basics","lesson":"extra","extra":true},{"q":"שוטר רוצה לעצור חשוד ללא צו שופט לפי סעיף 23(א) לחוק המעצרים. אילו תנאים נדרשים במצטבר?","opts":["חשד סביר בלבד, ללא צורך בעילה נוספת","יסוד סביר לחשד שהאדם עבר עבירה שאינה חטא, וגם התקיימות עילת מעצר סטטוטורית (למשל חשש לשיבוש הליכים)","אישור בעל פה מהתובע התורן בלבד","רק אם העבירה היא פשע חמור"],"correct":1,"explain":"סעיף 23(א) דורש שני תנאים מצטברים: (1) יסוד סביר לחשד בעוון/פשע (לא חטא), וגם (2) עילת מעצר סטטוטורית — כגון חשש לשיבוש הליכים, סכנה לציבור, או חזקת מסוכנות.","id":"mcq-28","topic":"arrest-nowarrant","lesson":"extra","extra":true},{"q":"מהי תכליתו של \"מעצר גישור\" לפי סעיף 17(ד) לחוק המעצרים?","opts":["לאפשר לתביעה להמשיך בחקירה עוד מספר ימים","לגשר על פרק הזמן הדרוש לניסוח כתב האישום והבקשה למעצר עד תום ההליכים, ולא להמשך חקירה","להאריך את המעצר ללא הגבלת זמן","לאפשר לחשוד להתייעץ עם משפחתו"],"correct":1,"explain":"מעצר גישור (עד 5 ימים) נועד אך ורק לגישור על הזמן הדרוש להכנת כתב האישום ובקשת המעצר עד תום ההליכים — לא להמשך חקירה (הלכת אלטויל), והוא כפוף לתקרת ימי המעצר הרגילה.","id":"mcq-29","topic":"arrest-bridge","lesson":"extra","extra":true},{"q":"מהי ההגדרה המקובלת ל\"ראיות לכאורה\" הנדרשות למעצר עד תום ההליכים (הלכת זאדה)?","opts":["ראיות שמוכיחות אשמה מעבר לספק סביר, כמו בהרשעה","ראיות גולמיות שקיים לגביהן סיכוי סביר שיהפכו בסוף ההליך לראיות שעל בסיסן ניתן להרשיע, מבלי שבית המשפט קובע מהימנות בשלב זה","כל מסמך שהוגש על ידי התביעה, ללא בחינה","עדות של שוטר אחד בלבד, תמיד מספיקה"],"correct":1,"explain":"הלכת זאדה (השופט ברק) קבעה שראיות לכאורה הן ראיות גולמיות בעלות סיכוי סביר להפוך לראיות מרשיעות — בית המשפט אינו קובע מהימנות בשלב המעצר, אלא אם נפער \"חור שחור\" מהותי בחומר הראיות.","id":"mcq-30","topic":"arrest-pending","lesson":"extra","extra":true},{"q":"נאשם בעבירת רכוש חמורה (לא אלימות) מתבקש להיעצר עד תום ההליכים רק בשל חומרת העבירה וריבוי מקרים דומים (\"מכת מדינה\"). האם די בכך?","opts":["כן, חומרת העבירה וההיקף התופעתי מספיקים כעילת מעצר עצמאית","לא — לפי הלכת גנימאת, חומרת העבירה כשלעצמה אינה עילת מעצר עצמאית; יש לבחון מסוכנות אישית וחלופת מעצר","כן, אך רק אם מדובר בעבירת ביטחון","לא, אין כלל אפשרות לעצור בעבירות רכוש"],"correct":1,"explain":"הלכת גנימאת (דיון נוסף, שמגר וברק) קבעה שחומרת העבירה או היותה \"מכת מדינה\" אינן עילת מעצר עצמאית — חובה חוקתית לבחון את מסוכנותו האישית של הנאשם הספציפי ואת קיומה של חלופת מעצר.","id":"mcq-31","topic":"arrest-pending","lesson":"extra","extra":true},{"q":"נאשם נתון במעצר עד תום ההליכים 9 חודשים מאז הגשת כתב האישום, וטרם ניתנה הכרעת דין. מה הדין?","opts":["הוא ממשיך להיות עצור ללא הגבלה עד תום המשפט","קמה לו זכות עקרונית לשחרור לפי סעיף 61, אלא אם שופט עליון מאריך את המעצר (בד\"כ בפרקי זמן של 90 יום)","הוא משתחרר אוטומטית ולא ניתן להאריך בשום מקרה","הספירה מתחילה מיום המעצר הראשוני, גם אם קדם להגשת כתב האישום"],"correct":1,"explain":"סעיף 61 קובע שחלוף 9 חודשים ממעצר לאחר כתב אישום ללא הכרעת דין מקים זכות עקרונית לשחרור — אך שופט עליון (בהלכת איבדיוב, המונה מיום הגשת כתב האישום בלבד) רשאי להאריך, בדרך כלל בפרקי זמן של 90 יום.","id":"mcq-32","topic":"arrest-release","lesson":"extra","extra":true},{"q":"במעצר עד תום ההליכים, מה קורה אם הנאשם אינו מיוצג ואינו מוותר על ייצוג?","opts":["בית המשפט יכול לעצור אותו ללא הגבלת זמן עד שימצא סנגור בעצמו","ניתן לעצור לתקופות של עד 7 ימים בכל פעם ועד 30 יום סה\"כ, שבמהלכם ימונה סנגור מטעם הסנגוריה הציבורית","המשפט לא יכול להתחיל כלל","התנאי של ייצוג אינו רלוונטי למעצר עד תום ההליכים"],"correct":1,"explain":"ייצוג הוא אחד מארבעת התנאים המצטברים למעצר עד תום ההליכים (סעיף 21). נאשם שאינו מיוצג ואינו מוותר — ניתן לעצור עד 7 ימים בכל פעם, עד 30 יום סה\"כ, שבמהלכם תמונה לו סנגוריה ציבורית.","id":"mcq-33","topic":"arrest-pending","lesson":"extra","extra":true},{"q":"מהו רף ההוכחה הנדרש במשפט האזרחי לעומת המשפט הפלילי?","opts":["זהה בשני המקרים — מעבר לספק סביר","אזרחי: מאזן הסתברויות (מעל 50%, הלכה מפורשת: 50% ומעלה). פלילי: מעבר לספק סביר, ללא מספר מוגדר בפסיקה","אזרחי: מעבר לספק סביר. פלילי: מאזן הסתברויות","אין רף הוכחה קבוע באף אחד מהמקרים"],"correct":1,"explain":"במשפט האזרחי הרף הוא מאזן ההסתברויות — הלכה מפורשת של בית המשפט העליון קובעת שהרף הוא 50% ומעלה. במשפט הפלילי הרף הוא מעבר לכל ספק סביר — מבחן איכותי, ללא אחוז מוגדר בפסיקה.","id":"mcq-34","topic":"circles","lesson":"1","extra":false},{"q":"מה חייב להיכלל בפרק העובדות בכתב האישום, ומה אסור לכלול בו?","opts":["עובדות בלבד; אסור לצרף ראיות גולמיות או עדויות","רק סעיפי החוק הרלוונטיים","רשימת כל הראיות שבידי התביעה","תמצית טיעוני הסנגור מראש"],"correct":0,"explain":"פרק העובדות בכתב האישום (סעיף 85) כולל תיאור עובדתי של העבירה בלבד. חל איסור מוחלט לצרף אליו ראיות גולמיות או עדויות — אלו יובאו בנפרד במהלך המשפט.","id":"mcq-35","topic":"structure","lesson":"4","extra":false},{"q":"מתי הופך אדם ממעמד \"חשוד\" למעמד \"נאשם\"?","opts":["ברגע שהוא נעצר לראשונה","ברגע שהוגש נגדו כתב אישום רשמית למזכירות בית המשפט","ברגע שהתביעה מחליטה להעמידו לדין, גם אם טרם הוגש כתב אישום","רק לאחר תשובתו לכתב האישום"],"correct":1,"explain":"המעבר ממעמד חשוד למעמד נאשם הוא פעולה טכנית וברורה: ברגע שכתב האישום מוגש רשמית למזכירות בית המשפט, הוא הופך מיידית ל\"נאשם\" — לא לפני כן.","id":"mcq-36","topic":"defendant","lesson":"5","extra":false},{"q":"נאשם נשאל לתשובתו לכתב האישום ובחר לשתוק, בלי לכפור ובלי להודות. מה המשמעות הראייתית?","opts":["השתיקה חסרת כל משמעות ראייתית","השתיקה עשויה לשמש חיזוק לראיות התביעה","השתיקה שקולה להודאה מלאה בעובדות","השתיקה מחייבת זיכוי אוטומטי"],"correct":1,"explain":"לפי סעיף 152, הימנעות מהשבה לאישום (שתיקה) עשויה לשמש חיזוק למשקל ראיות התביעה — אף שאינה שקולה להודאה, ואינה חסרת משמעות ראייתית.","id":"mcq-37","topic":"defendant-response","lesson":"6","extra":false},{"q":"מהי תכלית ה\"הסכמה בדבר עובדות וראיות\" לפי סעיף 144 לחסד\"פ?","opts":["לחייב את הנאשם להודות בכל האישומים","לחסוך זימון עדים טכניים לעובדות ומסמכים שאינם שנויים במחלוקת, ולמקד את הדיון בליבת המחלוקת","לבטל את זכות הנאשם לחקור עדי תביעה","להחליף לחלוטין את שלב הראיות במשפט"],"correct":1,"explain":"סעיף 144 מאפשר לצדדים המיוצגים להסכים על עובדות או קבילות מסמכים/מוצגים שאינם שנויים במחלוקת מהותית — כך נחסך זימון עדים טכניים (כגון שוטר שערך דוח), והדיון מתמקד בשאלות האמיתיות השנויות במחלוקת.","id":"mcq-38","topic":"reading","lesson":"5","extra":false},{"q":"מהי המשמעות של טענת \"אין להשיב לאשמה\" בסיום פרשת התביעה?","opts":["הנאשם מודה בעובדות","הטענה היא שהתביעה לא הוכיחה אפילו לכאורה את רכיבי העבירה","היא מחייבת את התביעה לסכם בכתב","היא מבטלת אוטומטית את כתב האישום"],"correct":1,"explain":"כך הוצגה הטענה בשיעור. המרצה אף הזהיר מהשיקול האסטרטגי בהעלאתה: אם תידחה, השופט כבר קבע שקיימת תשתית ראשונית.","id":"mcq-39","topic":"trial-conduct","lesson":"7","extra":false,"source":"שיעור 7 ערוך.mp3 — דברי המרצה"},{"q":"נאשם בחר להעיד בפרשת ההגנה. מהו סדר העדות שנלמד בשיעור 7?","opts":["הוא רשאי להעיד רק אחרי כל עדי ההגנה","עדותו נשמעת תחילה בפרשת ההגנה","הוא חייב להעיד בפרשת התביעה","אסור לו להעיד במשפטו"],"correct":1,"explain":"המרצה הסביר שהנאשם שמעיד עושה זאת תחילה בפרשת ההגנה, כדי שלא יתאים בדיעבד את גרסתו לעדי הגנה ששמע לפניו.","id":"mcq-40","topic":"trial-conduct","lesson":"7","extra":false,"source":"שיעור 7 ערוך.mp3 — דברי המרצה"},{"q":"מהם שלושת שלבי קביעת העונש לפי סעיפים 40ג–40טו לחוק העונשין?","opts":["קביעת עונש מקסימלי בלבד, ללא שלבים נוספים","(1) קביעת מתחם עונש הולם, (2) אפשרות חריגה ממנו לקולא/לחומרא, (3) קביעת העונש הסופי בתוך המתחם","רק בחינת עברו הפלילי של הנאשם","הכרעה לפי שיקול דעת שרירותי של השופט בלבד"],"correct":1,"explain":"שלושת השלבים: (1) קביעת מתחם עונש הולם לפי חומרת הפגיעה בערך החברתי; (2) אפשרות חריגה — לקולא משיקולי שיקום, או לחומרא להגנה על הציבור; (3) קביעת העונש הסופי בתוך המתחם, לפי נסיבות שאינן קשורות לביצוע העבירה.","id":"mcq-41","topic":"sentencing","lesson":"8","extra":false},{"q":"מהו סדר הסיכומים שנלמד בשיעור 8?","opts":["הנאשם ואחריו התובע","התובע ואחריו הנאשם, שלו נשמרת המילה האחרונה","בית המשפט מסכם לבדו","הצדדים מסכמים במקביל"],"correct":1,"explain":"המרצה הדגיש כי התובע מסכם תחילה והנאשם אחריו; לנאשם זכות המילה האחרונה.","id":"mcq-42","topic":"verdict-sentence","lesson":"8","extra":false,"source":"שיעור8 ערוך.mp3 — דברי המרצה"},{"id":"mcq-43","topic":"verdict-sentence","q":"מתי אפשר להביא ראיה חדשה גם לאחר הכרעת הדין, לפי ההסבר בשיעור 8?","opts":["בכל פעם שאחד הצדדים מבקש","רק בנסיבות נדירות וחריגות: ראיה חדשה שלא הייתה בהישג יד ונדרשת לעשיית צדק ולמניעת עיוות דין","רק אם הנאשם מודה","לעולם לא"],"correct":1,"explain":"כך תחם המרצה את החריג. אין להפוך אותו להזדמנות לתיקון מחדל ראייתי של צד.","source":"שיעור8 ערוך.mp3 — דברי המרצה","lesson":"8","extra":false},{"id":"mcq-44","topic":"reading","q":"מהי התוצאה לפי סעיף 77(א) אם לנאשם או לסנגורו לא ניתנה הזדמנות סבירה לעיין בראיה או בהודעת העד?","opts":["התובע רשאי להגיש אותה תמיד","התובע אינו רשאי להגיש את הראיה או להשמיע את העד, אלא אם ויתרו על העיון","כתב האישום נמחק אוטומטית","הראיה עוברת לעיון בית המשפט בלבד"],"correct":1,"explain":"זהו הסייג להבאת ראיות מטעם התובע שנלמד במצגת 2.","source":"דיון פלילי - מצגת שניה - 234524.PDF","lesson":"2","extra":false},{"id":"mcq-45","topic":"appeals","q":"נאשם זוכה, אך אינו מרוצה מאמירה עובדתית עליו בנימוקי פסק הדין. מה ההבחנה שהמרצה הדגיש?","opts":["כל אמירה מקימה זכות ערעור עצמאית","אין לנאשם זכות ערעור רגילה על זיכויו רק כדי לשנות את הנימוקים","עליו להודות מחדש","הזיכוי מתבטל מעצמו"],"correct":1,"explain":"בשיעור 8 הופרדה פגיעה מהתוצאה מפגיעה מהנמקה בלבד. הזיכוי אינו מקנה לנאשם מסלול ערעור רגיל רק כדי לתקן אמירות.","source":"שיעור8 ערוך.mp3 — דיון בסיום המשפט ובערעור","lesson":"8","extra":false},{"id":"mcq-46","topic":"arrest-release","q":"לפי דעת הרוב במורוזובה, מה קורה לימי המעצר שקדמו להכרעת דין שבוטלה בערעור?","opts":["נמחקים מהמניין","מצטרפים לימי המעצר לאחר החזרת התיק; המאסר אינו נספר במניין זה","נחשבים אוטומטית למאסר","תמיד נפתחים תשעה חודשים חדשים"],"correct":1,"explain":"זו ההבחנה בין דעת הרוב לבין גישת המיעוט בדבר חטיבת דיון חדשה.","source":"ילנה מורוזובה נ׳ מדינת ישראל.pdf — בש״פ 5142/99, פסקאות 10–1
