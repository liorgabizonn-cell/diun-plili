התקופה הנוספת\")\u003c/span>\n      \u003cp>אם לא הייתה שום הגבלה, המשטרה הייתה יכולה \"להחיות\" תיק ישן לנצח רק בעצם פתיחת חקירה. לכן החוק קובע תקרה: כאשר האירוע המנתק הוא \u003cb>הליך חקירה\u003c/b>, ההארכה מעבר לתקופת ההתיישנות המקורית (הנספרת מיום ביצוע העבירה) מוגבלת ל\"תקופה נוספת\" בלבד:\u003c/p>\n      \u003cul style=\"margin:10px 0 0;\">\n        \u003cli>פשע שדינו מיתה/מאסר עולם — עד 5 שנים נוספות (תקרה כוללת: 35 שנה מהמעשה)\u003c/li>\n        \u003cli>פשע חמור מהתוספת (15 שנה בסיס) — עד 3 שנים נוספות (תקרה כוללת: 18 שנה מהמעשה)\u003c/li>\n        \u003cli>פשע \"רגיל\" (10 שנה בסיס) — עד 3 שנים נוספות (תקרה כוללת: 13 שנה מהמעשה)\u003c/li>\n        \u003cli>עוון שאינו מהתוספת (5 שנה בסיס) — עד שנתיים נוספות (תקרה כוללת: 7 שנים מהמעשה)\u003c/li>\n      \u003c/ul>\n      \u003cp style=\"margin-top:10px\">\u003ci>שיטת זיכרון מהירה: בכל קטגוריה — לוקחים את מספר השנים הבסיסי ומוסיפים לו את \"התקופה הנוספת\" כדי לקבל את התקרה הסופית.\u003c/i>\u003c/p>\n    \u003c/div>\n\n    \u003cdiv class=\"example-box\">\n      \u003cspan class=\"ex-title\">💡 דוגמה מהמצגת\u003c/span>\n      \u003cp style=\"margin-bottom:10px;\">עבירת פשע \"רגילה\" (4 שנות מאסר, תקופת התיישנות בסיסית של 10 שנים) בוצעה ב-1/2020. התנהל הליך חקירה שהסתיים ב-1/2025.\u003c/p>\n      \u003cdiv class=\"timeline\">\n        \u003cdiv class=\"timeline-step\">\u003cdiv class=\"timeline-date\">1/2020\u003c/div>\u003cdiv class=\"timeline-dot\">\u003c/div>\u003cdiv class=\"timeline-label\">יום ביצוע\u003cbr>העבירה\u003c/div>\u003c/div>\n        \u003cdiv class=\"timeline-line\">\u003c/div>\n        \u003cdiv class=\"timeline-step\">\u003cdiv class=\"timeline-date\">1/2025\u003c/div>\u003cdiv class=\"timeline-dot\">\u003c/div>\u003cdiv class=\"timeline-label\">הליך החקירה\u003cbr>האחרון\u003c/div>\u003c/div>\n        \u003cdiv class=\"timeline-line\">\u003c/div>\n        \u003cdiv class=\"timeline-step\">\u003cdiv class=\"timeline-date\">1/2030\u003c/div>\u003cdiv class=\"timeline-dot\">\u003c/div>\u003cdiv class=\"timeline-label\">10 שנים מהמעשה\u003cbr>(ההתיישנות \"המקורית\")\u003c/div>\u003c/div>\n        \u003cdiv class=\"timeline-line\">\u003c/div>\n        \u003cdiv class=\"timeline-step\">\u003cdiv class=\"timeline-date\">1/2033\u003c/div>\u003cdiv class=\"timeline-dot end\">\u003c/div>\u003cdiv class=\"timeline-label\">התיישנות סופית\u003cbr>(1/2030 + 3 שנים)\u003c/div>\u003c/div>\n      \u003c/div>\n      \u003cp>למרות שהחקירה \"אפסה\" את השעון והחלה תקופה חדשה של 10 שנים מ-1/2025 (שהייתה מגיעה עד 1/2035) — ה\"תקופה הנוספת\" בעבירת פשע רגילה מוגבלת ל-3 שנים \u003cb>מעבר לתאריך ההתיישנות המקורי\u003c/b> (1/2030). לכן ההתיישנות הסופית היא \u003cb>1/2033\u003c/b>, לא 1/2035.\u003c/p>\n    \u003c/div>\n\n    \u003cdiv class=\"callout\">\n      \u003cspan class=\"callout-title\">ואם יש כמה הליכי חקירה ברצף? (הדוגמה הנוספת במצגת)\u003c/span>\n      \u003cp>המצגת מציגה גם תרחיש שבו יש הליך חקירה נוסף מאוחר יותר (למשל ב-1/2031, שהוא כבר בתוך \"התקופה הנוספת\"). במקרה כזה ה\"תקופה הנוספת\" יכולה להתארך שוב באותה לוגיקה — כל עוד לא חורגים מהתקרה שקבע החוק לאותו סוג עבירה, ובכפוף לכך שגורמים מוסמכים אישרו את ההארכה (ראו בהמשך).\u003c/p>\n    \u003c/div>\n\n    \u003cdetails class=\"enrichment\">\u003csummary>הרחבה שאינה לבחינה: הארכת התקופה הנוספת\u003c/summary>\u003cp>\u003cb>המרצה הוציא טבלה זו מהחומר בשיעור 7.\u003c/b> התוכן הקיים נשמר לעיון; לא בוצע כאן אימות פרטני לכל סמכות ומועד.\u003c/p>\n    \u003cp>בתנאי שקיים אינטרס ציבורי להארכה, גורמים בכירים יכולים להאריך את התקופה הנוספת בשלבים, כשכל הארכה מצטרפת לקודמותיה:\u003c/p>\n    \u003cul>\n      \u003cli>\u003cb>ראש אגף החקירות\u003c/b> (או מקביל) — הארכה של עד 6 חודשים בכל פעם\u003c/li>\n      \u003cli>\u003cb>פרקליט מחוז / ראש ענף חקירות\u003c/b> — לצורך השלמת חקירה, הוצאת תעודת חיסיון, שימוע או החלטה בערר: הארכה של עד שנה–שנתיים בכל פעם, תלוי סוג העבירה\u003c/li>\n      \u003cli>\u003cb>היועץ המשפטי לממשלה\u003c/b> — כשיש גם אינטרס ציבורי וגם נסיבות מיוחדות שיירשמו: הארכה מעת לעת, עד תקרה מצטברת של 3–5 שנים (תלוי סוג העבירה)\u003c/li>\n    \u003c/ul>\n\n    \u003c/details>\u003ch3>אילו פרקי זמן פשוט \"לא נספרים\" (מוקפאים, לא מתאפסים)?\u003c/h3>\n    \u003cp>בשונה מ\"אירוע מנתק\" (שמאפס ומתחיל את השעון מחדש), יש פרקי זמן שפשוט \u003cb>לא נכללים במניין\u003c/b> — השעון נעצר ופשוט ממשיך מהנקודה שבה נעצר, בלי לחזור להתחלה:\u003c/p>\n    \u003cul>\n      \u003cli>החשוד נמצא בחו\"ל, או שלא ניתן לאתרו למרות שקידה סבירה של הרשויות\u003c/li>\n      \u003cli>החשוד מתחמק מהליכי חקירה או העמדה לדין\u003c/li>\n      \u003cli>מצבו הרפואי/הנפשי של החשוד או של עד מרכזי אינו מאפשר את קיום ההליך\u003c/li>\n      \u003cli>עד מרכזי בחו\"ל/לא ניתן לאתרו — ובנוסף מתקיים אחד מאלה: יש יסוד להניח שזה בגלל פעולות החשוד; או שמדובר בעבירת טרור/ארגון פשיעה; או שמדובר בפשע חמור (7+ שנים) — ואז ההקפאה מוגבלת ל-3 שנים לכל היותר\u003c/li>\n      \u003cli>בקשת עזרה משפטית ממדינה אחרת\u003c/li>\n      \u003cli>הליכים משפטיים שנוקט החשוד עצמו\u003c/li>\n      \u003cli>חסינות שנתונה לחשוד לפי דין\u003c/li>\n      \u003cli>מיום החתימה על הסדר מותנה ועד תום התקופה שנקבעה לקיום תנאיו (או עד הפרתם/גילוי מרמה)\u003c/li>\n    \u003c/ul>\n\n    \u003ch3>מה קורה בסוף?\u003c/h3>\n    \u003cdiv class=\"scenario-row\">\n      \u003cspan class=\"verdict need\">חלפה ההתיישנות\u003c/span>\n      \u003cdiv>לא ניתן עוד להעמיד לדין על העבירה — הדבר יוביל לביטול כתב האישום.\u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"scenario-row\">\n      \u003cspan class=\"verdict ok\">לא חלפה\u003c/span>\n      \u003cdiv>ניתן להעמיד לדין כרגיל.\u003c/div>\n    \u003c/div>\n\n    \u003c!-- ============ SECTION B ============ -->\n    \u003cdiv class=\"lim-section-badge b\">ב. התיישנות בעבירות מין שנעברו בקטינים\u003c/div>\n    \u003cdiv class=\"callout warn\">\n      \u003cspan class=\"callout-title\">⚠ הוסר מחומר הבחינה — הודעת המרצה בשיעור 7\u003c/span>\n      \u003cp>בפתיחת שיעור 7 הודיע המרצה במפורש כי בשל המורכבות המשפטית ותכיפות שינויי החקיקה בנושא, הוא \u003cb>מסיר לחלוטין את נושא התיישנות עבירות מין בקטינים מחומר החובה של הקורס ומהבחינה המסכמת\u003c/b>. הנושא יילמד בהרחבה בשנה הבאה, בקורס המתקדם \"סדר דין פלילי מהלכה למעשה\". התוכן שלהלן נשאר לעיונכם (לא נבדקה עדכניותו מעבר למקורות המחברת), אך \u003cb>אינו לחומר הבחינה\u003c/b>.\u003c/p>\n    \u003c/div>\n    \u003cp>כאן החוק \"דוחה\" את תחילת מרוץ ההתיישנות הרבה מעבר ליום ביצוע העבירה — כדי לתת לקורבן, שהיה קטין בזמן העבירה, זמן ממשי להתבגר ולבחור להתלונן.\u003c/p>\n\n    \u003ch3>פגיעה בידי בן משפחה או אחראי על הקטין\u003c/h3>\n    \u003cp>מניין ההתיישנות (15 שנה, כדין עבירת מין) \u003cb>מתחיל רק ביום שבו מלאו לקורבן 34 שנים\u003c/b> — ולא ביום ביצוע העבירה.\u003c/p>\n    \u003cdiv class=\"example-box\">\n      \u003cspan class=\"ex-title\">💡 דוגמה\u003c/span>\n      \u003cp>הורה ביצע עבירת אינוס בילדתו כשהייתה בת 16. מרוץ 15 השנים מתחיל רק ביום שבו היא תמלא 34 — כלומר ניתן להעמיד את ההורה לדין \u003cb>עד שהילדה תמלא 49\u003c/b>.\u003c/p>\n    \u003c/div>\n\n    \u003ch3>פגיעה בידי מי שאינו בן משפחה/אחראי (ובן 15+)\u003c/h3>\n    \u003cp>מניין ההתיישנות מתחיל ביום שבו מלאו לקטין \u003cb>33 שנים\u003c/b>.\u003c/p>\n    \u003cdiv class=\"example-box\">\n      \u003cspan class=\"ex-title\">💡 דוגמה\u003c/span>\n      \u003cp>לוי (בן 30) ביצע עבירת אינוס בשכנתו חן, כשהייתה בת 16. ניתן להעמיד את לוי לדין \u003cb>עד שחן תמלא 48\u003c/b> (15 שנה החל מיום שתמלא 33).\u003c/p>\n    \u003c/div>\n\n    \u003ch3>מתי צריך \"תוספת ראייתית\" (חיזוק) כדי להרשיע?\u003c/h3>\n    \u003cp>אם התלונה במשטרה הוגשה \u003cb>גם\u003c/b> אחרי שהקורבן עבר את גיל הסף (28 למשפחה/אחראי, 18 לאחרים) \u003cb>וגם\u003c/b> אחרי שחלפו 15 השנה מיום ביצוע העבירה עצמו — ניתן להרשיע על סמך עדות הקטין בלבד \u003cb>רק אם יש בחומר הראיות דבר לחיזוקה\u003c/b>.\u003c/p>\n\n    \u003cdiv class=\"callout warn\">\n      \u003cspan class=\"callout-title\">אין להתבלבל! מלכודת ניסוח\u003c/span>\n      \u003cp>הניסוח בחוק \"...או... לפי המאוחר\" עלול להישמע כאילו מספיק תנאי אחד. בפועל \u003cb>מדובר בתנאים מצטברים\u003c/b> — צריך גם שחלף גיל הסף וגם שחלפה תקופת ה-15 שנה, כדי שיידרש חיזוק.\u003c/p>\n    \u003c/div>\n\n    \u003cp>\u003cb>עבירה בידי בן משפחה/אחראי\u003c/b> (גיל סף 28):\u003c/p>\n    \u003cdiv class=\"scenario-row\">\u003cspan class=\"verdict need\">נדרש חיזוק\u003c/span>\u003cdiv>עבירה בגיל 13, תלונה בגיל 29 — גם מלאו לקורבן 28 וגם חלפו 15 השנה\u003c/div>\u003c/div>\n    \u003cdiv class=\"scenario-row\">\u003cspan class=\"verdict ok\">אין צורך בחיזוק\u003c/span>\u003cdiv>עבירה בגיל 15, תלונה בגיל 29 — מלאו 28, אך טרם חלפה תקופת ה-15 שנה\u003c/div>\u003c/div>\n    \u003cdiv class=\"scenario-row\">\u003cspan class=\"verdict ok\">אין צורך בחיזוק\u003c/span>\u003cdiv>עבירה בגיל 11, תלונה בגיל 27 — חלפה תקופת ה-15 שנה, אך טרם מלאו לקורבן 28\u003c/div>\u003c/div>\n\n    \u003cp style=\"margin-top:14px;\">\u003cb>עבירה בידי מי שאינו בן משפחה/אחראי\u003c/b> (גיל סף 18):\u003c/p>\n    \u003cdiv class=\"scenario-row\">\u003cspan class=\"verdict need\">נדרש חיזוק\u003c/span>\u003cdiv>עבירה בגיל 8, תלונה בגיל 24 — גם מלאו 18 וגם חלפו 15 השנה\u003c/div>\u003c/div>\n    \u003cdiv class=\"scenario-row\">\u003cspan class=\"verdict ok\">אין צורך בחיזוק\u003c/span>\u003cdiv>עבירה בגיל 10, תלונה בגיל 19 — מלאו 18, אך טרם חלפה תקופת ה-15 שנה\u003c/div>\u003c/div>\n    \u003cdiv class=\"scenario-row\">\u003cspan class=\"verdict ok\">אין צורך בחיזוק\u003c/span>\u003cdiv>עבירה בגיל שנתיים, תלונה בגיל 17 וחצי — חלפה תקופת ה-15 שנה, אך טרם מלאו 18\u003c/div>\u003c/div>\n\n    \u003ch3>הגשת כתב אישום אחרי חלוף 15 השנה מהמעשה\u003c/h3>\n    \u003cp>אם חלפה תקופת ההתיישנות הנמנית \u003cb>מיום ביצוע העבירה עצמה\u003c/b> (15 שנה) — ניתן להגיש כתב אישום רק \u003cb>באישור היועץ המשפטי לממשלה\u003c/b> (גם אם עדיין לא חלפה ההתיישנות \"הדחויה\" הנמנית מגיל 33/34).\u003c/p>\n\n    \u003c!-- ============ SECTION C ============ -->\n    \u003cdiv class=\"lim-section-badge c\">ג. התיישנות עונשים\u003c/div>\n    \u003cp>נושא שונה לגמרי: לא אם ניתן להעמיד לדין, אלא — לאחר שכבר \u003cb>הורשע\u003c/b> הנאשם ונגזר עליו עונש — עד מתי ניתן עוד לבצע את אותו עונש בפועל.\u003c/p>\n\n    \u003ch3>כמה זמן יש לבצע את העונש?\u003c/h3>\n    \u003cul>\n      \u003cli>\u003cb>פשע\u003c/b> — 20 שנים\u003c/li>\n      \u003cli>\u003cb>עוון\u003c/b> — 10 שנים\u003c/li>\n      \u003cli>\u003cb>חטא\u003c/b> — 3 שנים\u003c/li>\n    \u003c/ul>\n    \u003cp>זה חל על עונש שהוטל ולא התחיל בביצועו, וגם על עונש שהופסק ביצועו ולא נמשך.\u003c/p>\n\n    \u003cdiv class=\"callout warn\">\n      \u003cspan class=\"callout-title\">דגש למבחן\u003c/span>\n      \u003cp>בעבירה שאין לה התיישנות (למשל רצח) — \u003cb>גם אין התיישנות על העונש\u003c/b> שהוטל בגינה. עונש מאסר עולם על רצח לעולם לא \"יתיישן\".\u003c/p>\n    \u003c/div>\n\n    \u003ch3>מתי מתחיל השעון?\u003c/h3>\n    \u003cp>מיום שפסק הדין נעשה \u003cb>חלוט\u003c/b> (אין עליו עוד ערעור), או מיום ההפסקה בביצוע העונש — \u003cb>לפי המאוחר מביניהם\u003c/b>.\u003c/p>\n\n    \u003cdiv class=\"callout warn\">\n      \u003cspan class=\"callout-title\">דגש למבחן — התנאי המכריע: \"באשמת מי\" נעצר הביצוע\u003c/span>\n      \u003cp>השעון ממשיך לרוץ \u003cb>רק כאשר\u003c/b> העיכוב או ההפסקה בביצוע העונש אירעו \u003cb>באשמת המדינה או הרשות\u003c/b> — למשל שירות בתי הסוהר שחרר אסיר מוקדם עקב צפיפות או מגפה ולא קרא לו לשוב. לעומת זאת, אם האסיר עצמו נמלט, התחמק, או ברח לחוץ לארץ — פרק הזמן הזה \u003cb>אינו נספר כלל\u003c/b>, והשעון קופא לחלוטין.\u003c/p>\n    \u003c/div>\n\n    \u003ch3>מה לא נספר?\u003c/h3>\n    \u003cp>פרק הזמן שבו מי שהוטל עליו העונש שהה בחו\"ל, או שלא ניתן היה לאתרו בשל התחמקותו מריצוי העונש.\u003c/p>\n\n    \u003cdiv class=\"example-box\">\n      \u003cspan class=\"ex-title\">💡 מקרה אמיתי — יוסי בן ארי, 30 שנה בפרגוואי\u003c/span>\n      \u003cp>בן ארי נידון בשנות ה-90 לתריסר שנות מאסר בעבירות סמים חמורות מסוג פשע. לאחר שריצה 4 שנים בלבד, נמלט מהכלא וברח לפרגוואי, שם חי תחת זהות בדויה כמעט 30 שנה — עד שאותר, נעצר והוחזר לישראל ב-2021. הוא עתר לשחרורו בטענה שחלפו מעל 20 שנה מאז הפסקת ריצוי העונש, ולכן העונש התיישן לפי סעיף 10(א). המדינה השיבה כי לפי סעיף 10(ג), תקופת ההימלטות אינה נספרת כלל. השופט אלכס שטיין דחה את העתירה וקבע: מוסד ההתיישנות נועד להעניק מחילה למי ששהה בקהילה וסבל מחרדת העונש המתמדת — לא למי שנמלט וחי בשקט תחת זהות בדויה.\u003c/p>\n    \u003c/div>\n    \u003cdiv class=\"callout case-callout\">\u003cspan class=\"callout-title\">קשור לפסק דין\u003c/span>\u003cbutton class=\"case-link\" data-case=\"23\">⚖ יוסי בן ארי נגד השר לביטחון פנים (2021)\u003c/button>\u003c/div>\n  \u003c/div>\n";
const MCQ = [{"q":"עבירה שהעונש המרבי עליה הוא בדיוק 3 שנות מאסר מסווגת כ:","opts":["חטא","עוון","פשע","תלוי בבית המשפט הדן בעניין"],"correct":1,"explain":"לפי סעיף 24 לחוק העונשין, \"עוון\" כולל עונש מרבי העולה על 3 חודשים ועד 3 שנים \u003cb>כולל\u003c/b>. רק מעל 3 שנים מדובר ב\"פשע\".","id":"mcq-1","topic":"classify","status":"קיים — טרם הושלם אימות פרטני","lesson":"1","extra":false},{"q":"מתי רשאית המשטרה שלא לחקור תלונה על עבירת פשע?","opts":["בכל מקרה שבו יש חוסר בכוח אדם","רק באישור פרקליט המחוז","במקרים חריגים שבהם התלונה מופרכת לחלוטין ונעדרת תשתית ראייתית מינימלית (הלכת צדוק)","לעולם לא — חובת החקירה בפשע היא מוחלטת"],"correct":2,"explain":"בהלכת בג\"ץ צדוק נקבע חריג מצומצם: כשאין כל תשתית ראייתית מינימלית וברור שאין יסוד לחשד, המשטרה רשאית להימנע מחקירה גם בעבירת פשע.","id":"mcq-2","topic":"sec59","status":"אומת מול הקלטת שיעור 1","lesson":"1","extra":false,"source":"שיעור 1.mp3 — הדיון בסעיף 59 ובדוגמת גניבה ממעסיק"},{"q":"מיהו הגורם המכריע בערר על החלטת פרקליט מחוז שלא להעמיד לדין מטעמי מדיניות (נסיבות העניין)?","opts":["פרקליט המדינה","היועץ המשפטי לממשלה","בית המשפט לעניינים מנהליים","מנהל תחום עררים בפרקליטות המדינה"],"correct":1,"explain":"כאשר ההחלטה מבוססת על עילת מדיניות (נסיבות העניין), הערר מוכרע בידי היועץ המשפטי לממשלה. עילה מקצועית (חוסר ראיות/אשמה) מוכרעת בידי פרקליט המדינה.","id":"mcq-3","topic":"appeal","status":"קיים — טרם הושלם אימות פרטני","lesson":"3","extra":false},{"q":"לפי המסגרת שלימד המרצה בשיעור 3, איזה נתון מונע הסדר מותנה?","opts":["העבירה מסוג עוון","העונש הצפוי אינו כולל מאסר בפועל","העבירה מסוג פשע","עבר פלילי נקי ב-5 השנים האחרונות"],"correct":2,"explain":"המרצה תחם את ההסדר הנלמד לעבירות חטא ועוון והדגיש שאין להסיק מהיעדר בקשת מאסר שהסיווג של עבירת פשע השתנה.","id":"mcq-4","topic":"conditional","status":"אומת מול הסבר המרצה","lesson":"3","extra":false,"source":"שיעור 3.mp3 — הסבר המרצה על סגירת תיק בהסדר, תנאי הסף והעיון לפני חתימה"},{"q":"שני שותפים הועמדו לדין בכתבי אישום נפרדים. לפי בג״ץ 11339/05, האם סיום משפטו של העד הוא תנאי גורף להעדתו?","opts":["כן, בכל מקרה","לא; ככלל ניתן להעידו, ודחייה עד לסיום משפטו היא חריגה ומנומקת","כן, אלא אם הנאשם הודה","לא ניתן להעיד שותף לעולם"],"correct":1,"explain":"בוטל החסם הגורף של הלכת קנזי. הושארה אפשרות לדחייה במקרים חריגים ביותר ומטעמים שיירשמו.","id":"mcq-5","topic":"kanzi","status":"תוקן ואומת","source":"מדינת ישראל נ׳ בית המשפט המחוזי באר שבע 11339-05.pdf — ההכרעה הסופית ודעת הנשיאה ביניש, פסקה 3","lesson":"3","extra":false},{"q":"מהי המלכודת בהחלת הלכת קנזי ההיסטורית על כל מקרה של עדות שותף?","opts":["התעלמות מהשינוי בבג״ץ 11339/05 ומההבחנה בין משפטים נפרדים למשותפים","הכלל חל רק על עבירות חטא","ביטול החסם הופך כל עדות למהימנה","משפט נפרד הוא תמיד כתב אישום משותף"],"correct":0,"explain":"יש להפריד בין הדין ההיסטורי, הכלל המאוחר והמסלול הדיוני. הסרת החסם אינה קביעה שכל עדות שותף מהימנה.","id":"mcq-6","topic":"kanzi","status":"תוקן ואומת","source":"מדינת ישראל נ׳ בית המשפט המחוזי באר שבע 11339-05.pdf — ההכרעה הסופית ודעת הנשיאה ביניש, פסקה 3","lesson":"3","extra":false},{"q":"מה ההבדל בין תיקון כתב אישום לפני ההקראה לבין תיקון לאחריה?","opts":["אין הבדל — התובע תמיד צריך אישור שופט","לפני ההקראה התובע מתקן בחופשיות; אחריה נדרשת בקשה רשמית ואישור שהנאשם קיבל הזדמנות סבירה להתגונן","לפני ההקראה נדרש אישור היועמ\"ש; אחריה התובע חופשי","התיקון אפשרי רק אחרי ההקראה"],"correct":1,"explain":"לפני תחילת המשפט התובע הוא הבעלים הבלעדי של כתב האישום. לאחר ההקראה, כל תיקון טעון בקשה רשמית ואישור שניתנה לנאשם הזדמנות סבירה להתגונן מפני השינוי.","id":"mcq-7","topic":"amend","status":"קיים — טרם הושלם אימות פרטני","lesson":"4","extra":false},{"q":"נאשם הודה בעובדות כתב האישום, אך אין בהן כדי להרשיע, והתביעה מבקשת לחזור בה מהאישום. מה התוצאה?","opts":["הרשעה אוטומטית","זיכוי מוחלט, ברשות בית המשפט","ביטול כתב האישום בלבד, ללא זיכוי","התיק ממשיך כרגיל"],"correct":1,"explain":"כאשר ההודאה אינה מספיקה להרשעה, התביעה רשאית לחזור מהאישום ברשות בית המשפט, והתוצאה היא זיכוי מוחלט.","id":"mcq-8","topic":"withdraw","status":"קיים — טרם הושלם אימות פרטני","lesson":"4","extra":false},{"q":"מתי חלה זכות העיון בחומר חקירה לפי סעיף 74?","opts":["מרגע פתיחת החקירה, לכל עבירה","רק בעבירות חטא","עם הגשת כתב האישום, ורק בעבירות פשע ועוון","רק לאחר תחילת שמיעת הראיות"],"correct":2,"explain":"זכות העיון קמה עם הגשת כתב האישום, וחלה רק בעבירות מסוג פשע או עוון — לא בעבירות חטא כגון תעבורה פשוטה.","id":"mcq-9","topic":"review","status":"קיים — טרם הושלם אימות פרטני","lesson":"5","extra":false},{"q":"התביעה סירבה לחשוף חומר חסוי, ובית המשפט הורה על חשיפתו. מה אינה אחת משלוש האפשרויות העומדות בפני המדינה?","opts":["לחשוף את החומר לנאשם","להמשיך במשפט בלי להשתמש בחומר כראיה","לבקש מבית המשפט להאריך את מעצר הנאשם","לחזור מכתב האישום כדי להגן על מקור מודיעיני"],"correct":2,"explain":"שלוש האפשרויות הן: לחשוף, להמשיך בלי להשתמש בחומר כראיה, או לחזור מכתב האישום. הארכת מעצר אינה קשורה לדילמת החשיפה.","id":"mcq-10","topic":"review","status":"קיים — טרם הושלם אימות פרטני","lesson":"5","extra":false},{"q":"מהם ארבעת התנאים המצטברים לוויתור על הקראת כתב האישום בקול רם?","opts":["הנאשם משלם קנס, מודה ומוותר על סנגור","ייצוג על ידי סנגור, הצהרת הסנגור שהקריא או הסביר את כתב האישום, אישור הנאשם בפני בית המשפט, ואישור בית המשפט לוויתור","הודאה בכתב בלבד ואישור התביעה","בקשה בעל־פה של התובע ללא נוכחות הנאשם"],"correct":1,"explain":"ארבעת התנאים המצטברים: הנאשם מיוצג בידי סנגור; הסנגור מצהיר שהקריא או הסביר לנאשם את כתב האישום; הנאשם מאשר את הוויתור בפני בית המשפט; ובית המשפט מאשר את הוויתור לאחר שבחן שהנאשם מבין את משמעותו.","id":"mcq-11","topic":"reading","status":"קיים — טרם הושלם אימות פרטני","lesson":"5","extra":false},{"q":"מהי דוקטרינת הפסילה הראייתית הנהוגה בישראל (הלכת יששכרוב)?","opts":["פסילה אוטומטית של כל ראיה שהושגה שלא כדין (\"פירות העץ המורעל\")","פסילה פסיקתית יחסית — שיקול דעת לפי איזון אינטרסים","אין פסילה בישראל בשום מקרה","פסילה רק בעבירות ביטחון"],"correct":1,"explain":"בניגוד לדוקטרינה האמריקאית הקטגורית, בישראל נקבעה בהלכת יששכרוב פסילה פסיקתית יחסית: שיקול דעת של בית המשפט לפי איזון אינטרסים, לא פסילה אוטומטית.","id":"mcq-12","topic":"packer","status":"קיים — טרם הושלם אימות פרטני","lesson":"1","extra":false},{"q":"על פי סעיף 184 לחסד״פ, אילו תנאים מצטברים הדגיש המרצה להרשעה בעבירה אחרת שהתגלתה מן העובדות?","opts":["שהעבירה האחרת חמורה יותר ושנמסרה הודעה לתביעה","הזדמנות סבירה להתגונן; ואיסור להטיל עונש חמור מזה שהיה אפשר להטיל בעבירה המקורית","הסכמת הנאשם בלבד","שהעבירה האחרת הופיעה מראש בכתב האישום"],"correct":1,"explain":"בשיעור 1 הוצגו שני תנאים מצטברים: הזדמנות סבירה להתגונן, והגבלת חומרת העונש. בפרשת דמיאניוק המוקד היה בתנאי הראשון.","id":"mcq-13","topic":"sec184","status":"אומת מול הקלטת שיעור 1","lesson":"1","extra":false,"source":"שיעור 1.mp3 — סעיף 184"},{"q":"מה קורה כאשר בית המשפט המחוזי מוסמך לדון בנאשם אחד מתוך כתב אישום משותף, ואילו נאשם אחר מואשם רק בעבירות שבסמכות בית משפט השלום?","opts":["התיק כולו מפוצל אוטומטית לשני בתי משפט","המחוזי רוכש סמכות \"נגררת\" לדון גם בנאשם השני (הלכת סוסן)","הנאשם השני זכאי לזיכוי אוטומטי","יש צורך באישור היועמ\"ש לדיון משותף"],"correct":1,"explain":"הלכת סוסן קובעת שכאשר למחוזי סמכות עניינית לגבי נאשם אחד בכתב אישום משותף, הוא רוכש סמכות נגררת לדון גם ביתר הנאשמים, למניעת פיצול הליכים.","id":"mcq-14","topic":"joinder","status":"קיים — טרם הושלם אימות פרטני","lesson":"4","extra":false},{"q":"מהי \"עילת הזהב\" מבין עילות סגירת התיק לפי סעיף 62?","opts":["חוסר ראיות מספיקות","נסיבות העניין בכללותן","חוסר אשמה — מביאה למחיקה מוחלטת ומיידית של הרישום","חוסר סמכות עניינית"],"correct":2,"explain":"עילת חוסר אשמה נחשבת \"עילת הזהב\" משום שהיא מביאה למחיקה מוחלטת ומיידית של הרישום המשטרתי, בשונה משתי העילות האחרות שמותירות רישום פנימי.","id":"mcq-15","topic":"closure","status":"קיים — טרם הושלם אימות פרטני","lesson":"2","extra":false},{"q":"בעבירת פשע רגילה, מהו תפקיד \"התקופה הנוספת\" לפי ההסבר בשיעור 7?","opts":["היא חלה על כל אירוע מנתק ללא הבחנה","היא רלוונטית רק כאשר האירוע המנתק הוא פעולת חקירה","היא מבטלת כל התיישנות בעבירות פשע","היא חלה רק לאחר גזר הדין"],"correct":1,"explain":"המרצה הדגיש שהמנגנון נוגע לאירוע מנתק מסוג פעולת חקירה בלבד, ולא לכתב אישום או להליך מטעם בית המשפט. טבלת ההארכות עצמה הוצאה מחומר הבחינה.","id":"mcq-16","topic":"limitations-pointer","status":"תוקן ואומת","lesson":"6","extra":false,"source":"שיעור 7 ערוך.mp3 — דברי המרצה בתחילת הדיון בהתיישנות"},{"q":"איזו קביעה תואמת את ההנחיה המפורשת בשיעור 7 לגבי בחינה?","opts":["יש ללמוד את טבלת ההארכות בעבירות מין בקטינים","נושא התיישנות עבירות המין בקטינים וטבלת ההארכות אינם חלק מחומר הבחינה","אין התיישנות לעבירות מין בקטינים בכל מצב","התיישנות עבירות מין בקטינים נלמדת רק בשיעור 8"],"correct":1,"explain":"המרצה הורה להתעלם מן השקפים בנושא זה לצורך הבחינה ולהוציא גם את טבלת ההארכות מחומר הלימוד.","id":"mcq-17","topic":"limitations-pointer","status":"תוקן ואומת","lesson":"6","extra":false,"source":"שיעור 7 ערוך.mp3 — דברי המרצה בתחילת הדיון בהתיישנות"},{"q":"נאשם ערער על חומרת עונשו בלבד (המדינה לא ערערה). בערעור התגלה שביצע עבירה חמורה יותר מזו שהורשע בה. מה רשאי בית המשפט שלערעור לעשות?","opts":["להרשיע בעבירה החמורה ולהחמיר בעונש כרצונו","להרשיע בעבירה החמורה (סעיף 216), אך לא להחמיר בעונש מעבר למה שנגזר במקור","לא לגעת בתיק כלל, כי הנאשם הוא היחיד שערער","לבטל את כתב האישום אוטומטית"],"correct":1,"explain":"סעיף 216 מתיר הרשעה בעבירה שהתגלתה מהעובדות, ובלבד שניתנה הזדמנות סבירה להתגונן. אך סעיף 217 קובע שבערעור שהגיש הנאשם על חומרת העונש, בית המשפט לא יחמיר — ההחמרה אפשרית רק אם המדינה ערערה על קולת העונש.","id":"mcq-18","topic":"appeals","status":"קיים — טרם הושלם אימות פרטני","lesson":"8","extra":false},{"q":"מהו ההבדל בין טענת \"סיכון כפול\" לטענת \"כבר נשפטתי\" לפי סעיף 5 לחסד\"פ?","opts":["אין הבדל, מדובר באותה טענה","\"כבר נשפטתי\" מבוססת על מעשה בית-דין; \"סיכון כפול\" מבוססת על כך שאין להעמיד אדם פעמיים בסיכון הרשעה, גם אם ההליך הקודם לא הסתיים בפסק דין","\"סיכון כפול\" חלה רק בעבירות מס","\"כבר נשפטתי\" חלה רק בערעור"],"correct":1,"explain":"טענת \"כבר נשפטתי\" (סעיף 5) דורשת זיכוי או הרשעה קודמים בפועל (מעשה בית-דין). טענת \"סיכון כפול\" רחבה יותר עקרונית אך נדירה מאוד בפועל — היא נטענת כשההליך הקודם הופסק באמצע בלי שהסתיים בפסק דין, ובתי המשפט תמיד דחו אותה לגופה עד כה.","id":"mcq-19","topic":"double-jeopardy-justice","status":"קיים — טרם הושלם אימות פרטני","lesson":"6","extra":false},{"q":"עבירת חטא בוצעה ב־1.1.2023. בהנחה שאין תקופה שיש לגרוע מהמניין, מהו המועד כעבור שנת ההתיישנות הבסיסית?","opts":["1.1.2024","1.1.2025","1.8.2024","אין התיישנות לחטא"],"correct":0,"explain":"שנה מ־1.1.2023 היא 1.1.2024. לפי ההסבר בשיעור 7, פעולת חקירה אינה מאפסת את מניין ההתיישנות בחטא.","id":"mcq-20","topic":"limitations-pointer","status":"תוקן ואומת","source":"שיעור 7 ערוך.mp3 — דברי המרצה בתחילת הדיון בהתיישנות","lesson":"6","extra":false},{"q":"בכתב אישום אחד נגד שני נאשמים, אחד הודה והאחר כופר. מהו הכלל שנלמד בשיעור 7?","opts":["גוזרים מיד את דינו של המודה","לא גוזרים את דין המודה לפני סיום בירור משפטו של מי שלא הודה","מוחקים את כתב האישום נגד מי שהודה","מפצלים תמיד את כתב האישום"],"correct":1,"explain":"סעיף 155 הוצג בהקלטה ככלל של דחיית גזר הדין של מי שהודה עד לסיום בירור משפטם של מי שלא הודו. ההסבר שניתן: לאפשר לבית המשפט לראות את התמונה הכוללת ואת חלקו של כל נאשם.","id":"mcq-21","topic":"multi-defendants","status":"תוקן ואומת","lesson":"7","extra":false,"source":"שיעור 7 ערוך.mp3 — דברי המרצה"},{"q":"חשוד הועמד לדין בעבירה שעונשה המרבי 3 שנות מאסר בדיוק, במסגרת כתב אישום משותף עם נאשם נוסף שהעבירה שיוחסה לו היא בסמכות המחוזי. איזה בית משפט ידון בעניינו של הראשון?","opts":["בית משפט השלום בלבד, כי עבירתו היא עוון","בית המשפט המחוזי, מכוח סמכות נגררת (הלכת סוסן)","יש לפצל את הדיון בין שני בתי המשפט","אין לבית משפט כלשהו סמכות לדון בו"],"correct":1,"explain":"עבירה בעונש מרבי של בדיוק 3 שנים מסווגת כעוון (סעיף 24), הנתון עקרונית לסמכות השלום. אך מכוח הלכת סוסן, כשלמחוזי סמכות עניינית לגבי נאשם אחד בכתב אישום משותף, הוא רוכש סמכות נגררת לדון גם בנאשם השני — גם אם עבירתו הפרטנית בסמכות השלום.","id":"mcq-22","topic":"joinder","status":"קיים — טרם הושלם אימות פרטני","lesson":"4","extra":false},{"q":"חשוד נחקר וזוכה בעבר מעבירת גניבה מסוימת. כעבור שנתיים מתגלות ראיות חדשות, והתביעה מבקשת להעמידו לדין שוב על אותה גניבה בדיוק. מה הדין?","opts":["מותר, כי יש ראיות חדשות","אסור — סעיף 5 לחסד\"פ אוסר דיון חוזר על מעשה שממנו זוכה, למעט חריג מצומצם של מוות מאוחר לקורבן","מותר רק באישור היועמ\"ש","אסור לחלוטין, ואף לא ניתן לפתוח חקירה חדשה בעתיד על עבירה אחרת"],"correct":1,"explain":"סעיף 5 לחסד\"פ קובע איסור עקרוני לדון באדם על מעשה שממנו כבר זוכה, כטענה מקדמית עצמאית — ללא קשר לגילוי ראיות חדשות. החריג היחיד הוא מקרה מוות מאוחר של הקורבן.","id":"mcq-23","topic":"double-jeopardy-justice","status":"קיים — טרם הושלם אימות פרטני","lesson":"6","extra":false},{"q":"טרם הוגש כתב אישום והוצע לחשוד הסדר מותנה. מדוע יש לאפשר לו עיון בחומר החקירה ובטיוטת האישום?","opts":["כדי שיוכל להחליט באופן מושכל אם להסכים להסדר ולהודות בעובדות","משום שכל חשוד זכאי תמיד לכל תיק החקירה מיד עם פתיחתו","משום שכבר הורשע בבית המשפט","אין לו אפשרות לעיין לפני החתימה בשום מקרה"],"correct":0,"explain":"זו זכות עיון במסגרת ההסדר המוצע לפני אישום, שנועדה לאפשר בחינה של הראיות וההסכמה. אין לבלבל אותה עם העיון הרגיל של נאשם לאחר הגשת אישום לפי סעיף 74. השאלה הקודמת הציעה מסלול תקיפה שלא אומת והוחלפה.","id":"mcq-24","topic":"conditional","status":"הוחלף ניסוח לא מבוסס בתרגיל מההרצאה","lesson":"3","extra":false,"source":"שיעור 3.mp3 — הסבר המרצה על סגירת תיק בהסדר, תנאי הסף והעיון לפני חתימה"},{"q":"מה משותף לסעיף 167 לחסד\"פ (הבאת ראיות מיוזמת בית המשפט) ולהלכת יששכרוב (פסילת ראיות)?","opts":["שניהם עוסקים בסמכות מעצר","שניהם דוגמאות למתח בין חשיפת האמת/יעילות לבין זכויות והגינות ההליך, ומעניקים לבית המשפט שיקול דעת ולא כלל נוקשה","אין ביניהם שום קשר","שניהם חלים רק בבית המשפט העליון"],"correct":1,"explain":"סעיף 167 מבטא נסיגה אינקוויזיטורית לטובת חשיפת האמת, ופסילה פסיקתית יחסית (יששכרוב) מבטאת איזון בין מיגור פשיעה להליך ראוי — בשני המקרים לבית המשפט שיקול דעת רחב, לא כלל אוטומטי.","id":"mcq-25","topic":"adversarial","status":"קיים — טרם הושלם אימות פרטני","lesson":"1","extra":false},{"q":"פרקליט המחוז החליט לחרוג מחלוקת העבודה הרגילה בין הפרקליטות לתביעה המשטרתית (סעיף 60(יא)). כעבור זמן, במהלך המשפט, מבקשת התביעה לתקן את כתב האישום כדי להוסיף עבירה חמורה יותר. מה משותף לשני המצבים מבחינת תוצאת החריגה?","opts":["שניהם פוסלים אוטומטית את ההליך","בשניהם יש לבחון את תנאי הדין ואת הפגיעה בהגנה; לא כל חריגה טכנית מבטלת את ההליך","שניהם דורשים אישור בית המשפט העליון","אין ביניהם שום קשר עקרוני"],"correct":1,"explain":"בשני המקרים החוק מאפשר גמישות (חריגה מחלוקת עבודה; תיקון כתב אישום), ובשניהם המבחן המכריע הוא אם נגרם עיוות דין/נפגעה הזדמנות סבירה להתגונן — לא פגם טכני כשלעצמו.","id":"mcq-26","topic":"amend","status":"קיים — טרם הושלם אימות פרטני","lesson":"4","extra":false},{"q":"מהו ההבדל המהותי בין \"עיכוב\" ל\"מעצר\" לפי חוק המעצרים?","opts":["אין הבדל, אלו מונחים נרדפים","עיכוב הוא הגבלת חירות קלה ומתוחמת בזמן/במקום; מעצר הוא שלילת חירות מלאה","עיכוב חל רק על עדים, מעצר חל רק על חשודים","עיכוב דורש צו שופט, מעצר לא"],"correct":1,"explain":"עיכוב הוא הגבלה קלה ומתוחמת (לבירור/חקירה במקום, עד 3 שעות ובנסיבות מסוימות 6 שעות), בעוד מעצר הוא שלילת חירות מלאה. כלל הברזל: לא ייעצר אדם אם ניתן להסתפק בעיכוב.","id":"mcq-27","topic":"arrest-basics","status":"קיים — טרם הושלם אימות פרטני","lesson":"extra","extra":true},{"q":"שוטר רוצה לעצור חשוד ללא צו שופט לפי סעיף 23(א) לחוק המעצרים. אילו תנאים נדרשים במצטבר?","opts":["חשד סביר בלבד, ללא צורך בעילה נוספת","יסוד סביר לחשד שהאדם עבר עבירה שאינה חטא, וגם התקיימות עילת מעצר סטטוטורית (למשל חשש לשיבוש הליכים)","אישור בעל פה מהתובע התורן בלבד","רק אם העבירה היא פשע חמור"],"correct":1,"explain":"סעיף 23(א) דורש שני תנאים מצטברים: (1) יסוד סביר לחשד בעוון/פשע (לא חטא), וגם (2) עילת מעצר סטטוטורית — כגון חשש לשיבוש הליכים, סכנה לציבור, או חזקת מסוכנות.","id":"mcq-28","topic":"arrest-nowarrant","status":"קיים — טרם הושלם אימות פרטני","lesson":"extra","extra":true},{"q":"מהי תכליתו של \"מעצר גישור\" לפי סעיף 17(ד) לחוק המעצרים?","opts":["לאפשר לתביעה להמשיך בחקירה עוד מספר ימים","לגשר על פרק הזמן הדרוש לניסוח כתב האישום והבקשה למעצר עד תום ההליכים, ולא להמשך חקירה","להאריך את המעצר ללא הגבלת זמן","לאפשר לחשוד להתייעץ עם משפחתו"],"correct":1,"explain":"מעצר גישור (עד 5 ימים) נועד אך ורק לגישור על הזמן הדרוש להכנת כתב האישום ובקשת המעצר עד תום ההליכים — לא להמשך חקירה (הלכת אלטויל), והוא כפוף לתקרת ימי המעצר הרגילה.","id":"mcq-29","topic":"arrest-bridge","status":"קיים — טרם הושלם אימות פרטני","lesson":"extra","extra":true},{"q":"מהי ההגדרה המקובלת ל\"ראיות לכאורה\" הנדרשות למעצר עד תום ההליכים (הלכת זאדה)?","opts":["ראיות שמוכיחות אשמה מעבר לספק סביר, כמו בהרשעה","ראיות גולמיות שקיים לגביהן סיכוי סביר שיהפכו בסוף ההליך לראיות שעל בסיסן ניתן להרשיע, מבלי שבית המשפט קובע מהימנות בשלב זה","כל מסמך שהוגש על ידי התביעה, ללא בחינה","עדות של שוטר אחד בלבד, תמיד מספיקה"],"correct":1,"explain":"הלכת זאדה (השופט ברק) קבעה שראיות לכאורה הן ראיות גולמיות בעלות סיכוי סביר להפוך לראיות מרשיעות — בית המשפט אינו קובע מהימנות בשלב המעצר, אלא אם נפער \"חור שחור\" מהותי בחומר הראיות.","id":"mcq-30","topic":"arrest-pending","status":"קיים — טרם הושלם אימות פרטני","lesson":"extra","extra":true},{"q":"נאשם בעבירת רכוש חמורה (לא אלימות) מתבקש להיעצר עד תום ההליכים רק בשל חומרת העבירה וריבוי מקרים דומים (\"מכת מדינה\"). האם די בכך?","opts":["כן, חומרת העבירה וההיקף התופעתי מספיקים כעילת מעצר עצמאית","לא — לפי הלכת גנימאת, חומרת העבירה כשלעצמה אינה עילת מעצר עצמאית; יש לבחון מסוכנות אישית וחלופת מעצר","כן, אך רק אם מדובר בעבירת ביטחון","לא, אין כלל אפשרות לעצור בעבירות רכוש"],"correct":1,"explain":"הלכת גנימאת (דיון נוסף, שמגר וברק) קבעה שחומרת העבירה או היותה \"מכת מדינה\" אינן עילת מעצר עצמאית — חובה חוקתית לבחון את מסוכנותו האישית של הנאשם הספציפי ואת קיומה של חלופת מעצר.","id":"mcq-31","topic":"arrest-pending","status":"קיים — טרם הושלם אימות פרטני","lesson":"extra","extra":true},{"q":"נאשם נתון במעצר עד תום ההליכים 9 חודשים מאז הגשת כתב האישום, וטרם ניתנה הכרעת דין. מה הדין?","opts":["הוא ממשיך להיות עצור ללא הגבלה עד תום המשפט","קמה לו זכות עקרונית לשחרור לפי סעיף 61, אלא אם שופט עליון מאריך את המעצר (בד\"כ בפרקי זמן של 90 יום)","הוא משתחרר אוטומטית ולא ניתן להאריך בשום מקרה","הספירה מתחילה מיום המעצר הראשוני, גם אם קדם להגשת כתב האישום"],"correct":1,"explain":"סעיף 61 קובע שחלוף 9 חודשים ממעצר לאחר כתב אישום ללא הכרעת דין מקים זכות עקרונית לשחרור — אך שופט עליון (בהלכת איבדיוב, המונה מיום הגשת כתב האישום בלבד) רשאי להאריך, בדרך כלל בפרקי זמן של 90 יום.","id":"mcq-32","topic":"arrest-release","status":"קיים — טרם הושלם אימות פרטני","lesson":"extra","extra":true},{"q":"במעצר עד תום ההליכים, מה קורה אם הנאשם אינו מיוצג ואינו מוותר על ייצוג?","opts":["בית המשפט יכול לעצור אותו ללא הגבלת זמן עד שימצא סנגור בעצמו","ניתן לעצור לתקופות של עד 7 ימים בכל פעם ועד 30 יום סה\"כ, שבמהלכם ימונה סנגור מטעם הסנגוריה הציבורית","המשפט לא יכול להתחיל כלל","התנאי של ייצוג אינו רלוונטי למעצר עד תום ההליכים"],"correct":1,"explain":"ייצוג הוא אחד מארבעת התנאים המצטברים למעצר עד תום ההליכים (סעיף 21). נאשם שאינו מיוצג ואינו מוותר — ניתן לעצור עד 7 ימים בכל פעם, עד 30 יום סה\"כ, שבמהלכם תמונה לו סנגוריה ציבורית.","id":"mcq-33","topic":"arrest-pending","status":"קיים — טרם הושלם אימות פרטני","lesson":"extra","extra":true},{"q":"מהו רף ההוכחה הנדרש במשפט האזרחי לעומת המשפט הפלילי?","opts":["זהה בשני המקרים — מעבר לספק סביר","אזרחי: מאזן הסתברויות (מעל 50%, הלכה: 51%). פלילי: מעבר לספק סביר, ללא מספר מוגדר בפסיקה","אזרחי: מעבר לספק סביר. פלילי: מאזן הסתברויות","אין רף הוכחה קבוע באף אחד מהמקרים"],"correct":1,"explain":"במשפט האזרחי הרף הוא מאזן ההסתברויות (מעל 50%, עם הלכה המצמידה את המספר 51%). במשפט הפלילי הרף הוא מעבר לכל ספק סביר — מבחן איכותי, ללא אחוז מוגדר בפסיקה.","id":"mcq-34","topic":"circles","status":"קיים — טרם הושלם אימות פרטני","lesson":"1","extra":false},{"q":"מה חייב להיכלל בפרק העובדות בכתב האישום, ומה אסור לכלול בו?","opts":["עובדות בלבד; אסור לצרף ראיות גולמיות או עדויות","רק סעיפי החוק הרלוונטיים","רשימת כל הראיות שבידי התביעה","תמצית טיעוני הסנגור מראש"],"correct":0,"explain":"פרק העובדות בכתב האישום (סעיף 85) כולל תיאור עובדתי של העבירה בלבד. חל איסור מוחלט לצרף אליו ראיות גולמיות או עדויות — אלו יובאו בנפרד במהלך המשפט.","id":"mcq-35","topic":"structure","status":"קיים — טרם הושלם אימות פרטני","lesson":"4","extra":false},{"q":"מתי הופך אדם ממעמד \"חשוד\" למעמד \"נאשם\"?","opts":["ברגע שהוא נעצר לראשונה","ברגע שהוגש נגדו כתב אישום רשמית למזכירות בית המשפט","ברגע שהתביעה מחליטה להעמידו לדין, גם אם טרם הוגש כתב אישום","רק לאחר תשובתו לכתב האישום"],"correct":1,"explain":"המעבר ממעמד חשוד למעמד נאשם הוא פעולה טכנית וברורה: ברגע שכתב האישום מוגש רשמית למזכירות בית המשפט, הוא הופך מיידית ל\"נאשם\" — לא לפני כן.","id":"mcq-36","topic":"defendant","status":"קיים — טרם הושלם אימות פרטני","lesson":"5","extra":false},{"q":"נאשם נשאל לתשובתו לכתב האישום ובחר לשתוק, בלי לכפור ובלי להודות. מה המשמעות הראייתית?","opts":["השתיקה חסרת כל משמעות ראייתית","השתיקה עשויה לשמש חיזוק לראיות התביעה","השתיקה שקולה להודאה מלאה בעובדות","השתיקה מחייבת זיכוי אוטומטי"],"correct":1,"explain":"לפי סעיף 152, הימנעות מהשבה לאישום (שתיקה) עשויה לשמש חיזוק למשקל ראיות התביעה — אף שאינה שקולה להודאה, ואינה חסרת משמעות ראייתית.","id":"mcq-37","topic":"defendant-response","status":"קיים — טרם הושלם אימות פרטני","lesson":"6","extra":false},{"q":"מהי תכלית ה\"הסכמה בדבר עובדות וראיות\" לפי סעיף 144 לחסד\"פ?","opts":["לחייב את הנאשם להודות בכל האישומים","לחסוך זימון עדים טכניים לעובדות ומסמכים שאינם שנויים במחלוקת, ולמקד את הדיון בליבת המחלוקת","לבטל את זכות הנאשם לחקור עדי תביעה","להחליף לחלוטין את שלב הראיות במשפט"],"correct":1,"explain":"סעיף 144 מאפשר לצדדים המיוצגים להסכים על עובדות או קבילות מסמכים/מוצגים שאינם שנויים במחלוקת מהותית — כך נחסך זימון עדים טכניים (כגון שוטר שערך דוח), והדיון מתמקד בשאלות האמיתיות השנויות במחלוקת.","id":"mcq-38","topic":"reading","status":"קיים — טרם הושלם אימות פרטני","lesson":"5","extra":false},{"q":"מהי המשמעות של טענת \"אין להשיב לאשמה\" בסיום פרשת התביעה?","opts":["הנאשם מודה בעובדות","הטענה היא שהתביעה לא הוכיחה אפילו לכאורה את רכיבי העבירה","היא מחייבת את התביעה לסכם בכתב","היא מבטלת אוטומטית את כתב האישום"],"correct":1,"explain":"כך הוצגה הטענה בשיעור. המרצה אף הזהיר מהשיקול האסטרטגי בהעלאתה: אם תידחה, השופט כבר קבע שקיימת תשתית ראשונית.","id":"mcq-39","topic":"trial-conduct","status":"תוקן ואומת","lesson":"7","extra":false,"source":"שיעור 7 ערוך.mp3 — דברי המרצה"},{"q":"נאשם בחר להעיד בפרשת ההגנה. מהו סדר העדות שנלמד בשיעור 7?","opts":["הוא רשאי להעיד רק אחרי כל עדי ההגנה","עדותו נשמעת תחילה בפרשת ההגנה","הוא חייב להעיד בפרשת התביעה","אסור לו להעיד במשפטו"],"correct":1,"explain":"המרצה הסביר שהנאשם שמעיד עושה זאת תחילה בפרשת ההגנה, כדי שלא יתאים בדיעבד את גרסתו לעדי הגנה ששמע לפניו.","id":"mcq-40","topic":"trial-conduct","status":"תוקן ואומת","lesson":"7","extra":false,"source":"שיעור 7 ערוך.mp3 — דברי המרצה"},{"q":"מהם שלושת שלבי קביעת העונש לפי סעיפים 40ג–40טו לחוק העונשין?","opts":["קביעת עונש מקסימלי בלבד, ללא שלבים נוספים","(1) קביעת מתחם עונש הולם, (2) אפשרות חריגה ממנו לקולא/לחומרא, (3) קביעת העונש הסופי בתוך המתחם","רק בחינת עברו הפלילי של הנאשם","הכרעה לפי שיקול דעת שרירותי של השופט בלבד"],"correct":1,"explain":"שלושת השלבים: (1) קביעת מתחם עונש הולם לפי חומרת הפגיעה בערך החברתי; (2) אפשרות חריגה — לקולא משיקולי שיקום, או לחומרא להגנה על הציבור; (3) קביעת העונש הסופי בתוך המתחם, לפי נסיבות שאינן קשורות לביצוע העבירה.","id":"mcq-41","topic":"sentencing","status":"קיים — טרם הושלם אימות פרטני","lesson":"8","extra":false},{"q":"מהו סדר הסיכומים שנלמד בשיעור 8?","opts":["הנאשם ואחריו התובע","התובע ואחריו הנאשם, שלו נשמרת המילה האחרונה","בית המשפט מסכם לבדו","הצדדים מסכמים במקביל"],"correct":1,"explain":"המרצה הדגיש כי התובע מסכם תחילה והנאשם אחריו; לנאשם זכות המילה האחרונה.","id":"mcq-42","topic":"verdict-sentence","status":"תוקן ואומת","lesson":"8","extra":false,"source":"שיעור8 ערוך.mp3 — דברי המרצה"},{"id":"mcq-43","topic":"verdict-sentence","q":"מתי אפשר להביא ראיה חדשה גם לאחר הכרעת הדין, לפי ההסבר בשיעור 8?","opts":["בכל פעם שאחד הצדדים מבקש","רק בנסיבות נדירות וחריגות: ראיה חדשה שלא הייתה בהישג יד ונדרשת לעשיית צדק ולמניעת עיוות דין","רק אם הנאשם מודה","לעולם לא"],"correct":1,"explain":"כך תחם המרצה את החריג. אין להפוך אותו להזדמנות לתיקון מחדל ראייתי של צד.","source":"שיעור8 ערוך.mp3 — דברי המרצה","status":"תוקן ואומת","lesson":"8","extra":false},{"id":"mcq-44","topic":"reading","q":"מהי התוצאה לפי סעיף 77(א) אם לנאשם או לסנגורו לא ניתנה הזדמנות סבירה לעיין בראיה או בהודעת העד?","opts":["התובע רשאי להגיש אותה תמיד","התובע אינו רשאי להגיש את הראיה או להשמיע את העד, אלא אם ויתרו על העיון","כתב האישום נמחק אוטומטית","הראיה עוברת לעיון בית המשפט בלבד"],"correct":1,"explain":"זהו הסייג להבאת ראיות מטעם התובע שנלמד במצגת 2.","source":"דיון פלילי - מצגת שניה - 234524.PDF","status":"נוסף ואומת","lesson":"2","extra":false},{"id":"mcq-45","topic":"appeals","q":"נאשם זוכה, אך אינו מרוצה מאמירה עובדתית עליו בנימוקי פסק הדין. מה ההבחנה שהמרצה הדגיש?","opts":["כל אמירה מקימה זכות ערעור עצמאית","אין לנאשם זכות ערעור רגילה על זיכויו רק כדי לשנות את הנימוקים","עליו להודות מחדש","הזיכוי מתבטל מעצמו"],"correct":1,"explain":"בשיעור 8 הופרדה פגיעה מהתוצאה מפגיעה מהנמקה בלבד. הזיכוי אינו מקנה לנאשם מסלול ערעור רגיל רק כדי לתקן אמירות.","source":"שיעור8 ערוך.mp3 — דיון בסיום המשפט ובערעור","status":"נוסף על בסיס מקור שנבדק","lesson":"8","extra":false},{"id":"mcq-46","topic":"arrest-release","q":"לפי דעת הרוב במורוזובה, מה קורה לימי המעצר שקדמו להכרעת דין שבוטלה בערעור?","opts":["נמחקים מהמניין","מצטרפים לימי המעצר לאחר החזרת התיק; המאסר אינו נספר במניין זה","נחשבים אוטומטית למאסר","תמיד נפתחים תשעה חודשים חדשים"],"correct":1,"explain":"זו ההבחנה בין דעת הרוב לבין גישת המיעוט בדבר חטיבת דיון חדשה.","source":"ילנה מורוזובה נ׳ מדינת ישראל.pdf — בש״פ 5142/99, פסקאות 10–12 לדעת ביניש וההכרעה הסופית","status":"נוסף על בסיס מקור שנבדק","lesson":"extra","extra":true},{"id":"mcq-47","topic":"arrest-basics","q":"איזה סעיף מסדיר הבאה לתחנה בשל אי־ציות להוראות עיכוב חוקיות?","opts":["23(ז)","23(ב)","סעיף 184 לחסד״פ","סעיף 155 לחסד״פ"],"correct":1,"explain":"סעיף 23(ב) מסדיר את הסמכות לתכלית שלשמה התבקש העיכוב.","source":"חוק סדר הדין הפלילי סמכויות אכיפה מעצרים התשנו 1996.pdf — סעיף 23(ב)","status":"נוסף על בסיס מקור שנבדק","lesson":"extra","extra":true},{"id":"mcq-48","topic":"reading","q":"לפי סעיף 10א, מה נדרש כדי לקבל אמרת חוץ של עד?","opts":["תנאי אחד בלבד: שהאמרה כתובה","הוכחת האמרה, העדת מוסרה והזדמנות לחקירה, ושוני מהותי/הכחשה/אי־זכירה","רק הודאת הנאשם","צו חיפוש"],"correct":1,"explain":"אלה התנאים המצטברים שנוספו בעקבות אלעוקה.","source":"אלעוקה נ' מדינת ישראל.pdf — ניתוח קבוצה C","status":"נוסף על בסיס מקור שנבדק"},{"id":"mcq-49","topic":"arrest-basics","q":"מהו הכלל הנכון בחיפוש בטלפון לפי סעיף 23א?","opts":["תפיסת הטלפון מתירה עיון מלא","יש לבחון מקור סמכות והיקף צו; פגם מוקדם נבחן בנפרד ואינו מוביל אוטומטית לתוצאה אחת","אין צורך בצו לעולם","כל פגם מחייב זיכוי אוטומטי"],"correct":1,"explain":"זהו סדר הניתוח שנוסף בעקבות אוריך.","source":"יונתן אוריך נ' מדינת ישראל.pdf — ניתוח קבוצה C","status":"נוסף על בסיס מקור שנבדק"},{"id":"mcq-50","topic":"summations","lesson":"8","extra":false,"q":"לפי סעיף 169 כפי שהוסבר בשיעור 8, מה סדר הסיכומים לעניין האשמה?","opts":["הנאשם ואחריו התובע","התובע ואחריו הנאשם","רק התובע מסכם","בית המשפט מסכם במקום הצדדים"],"correct":1,"explain":"התובע מסכם תחילה ואחריו הנאשם. המרצה הדגיש את זכות הנאשם למילה האחרונה.","source":"שיעור8 ערוך.mp3 — שלב הסיכומים","status":"נוסף על בסיס ההקלטה שנבדקה"}];
const CASE_Q = [{"title":"קייס 1 — פגם בכתב האישום","scenario":"נאשם הורשע בעבירת מרמה. בערעור טוען סנגורו כי בכתב האישום נפלה טעות בציון התאריך המדויק של אחת מהעברות הכספיות, וכי בשל כך יש לבטל את ההרשעה כולה — למרות שכל שאר העובדות הוכחו כדבעי ולא נטען שהדבר פגע ביכולתו של הנאשם להתגונן.","question":"האם יש לקבל את הטענה? נמקו את תשובתכם תוך הפניה לפסיקה הרלוונטית.","points":["יש להזכיר את הלכת סילוסטר (ע\"פ 1/48): הדיון הפלילי אינו \"אשקוקי\" — פגם דיוני/טכני שלא גרם לעיוות דין ולא מנע הגנה הוגנת אינו מביא לביטול ההליך.","יש לבחון האם הפגם (טעות בתאריך) פגע בפועל ביכולת הנאשם להתגונן — כאן נמסר בעובדה שלא נטען כך.","ניתן להזכיר את סעיף 215 לחסד\"פ, שבו עוגנה ההלכה.","מסקנה סבירה: יש לדחות את הטענה, שכן מדובר בפגם טכני גרידא."],"id":"caseq-1","topic":"sec184","status":"קיים — טרם הושלם אימות פרטני","lesson":"1","extra":false},{"title":"קייס 2 — חיפוש בהסכמה","scenario":"שוטר עוצר אזרח ברחוב ללא כל חשד מוקדם, ומבקש לחפש בתיקו. השוטר אומר לו רק \"אתה מסכים שאבדוק לך בתיק?\" והאזרח עונה \"בסדר, בכיף\". בחיפוש נמצאים סמים.","question":"האם החיפוש חוקי, והאם הראיה קבילה? התייחסו לתנאים הנדרשים.","points":["יש להזכיר את רע״פ 10141/09 בן חיים: בהיעדר מקור סמכות אחר, נדרשת הסכמה אמיתית, מודעת ורצונית מהסוג שנדון בפסק הדין.","השוטר חייב להבהיר לאזרח באופן מפורש את זכותו המלאה לסרב, ושסירובו לא ייזקף לחובתו.","כאן השוטר לא הבהיר דבר מזה — ההסכמה אינה \"מדעת\".","מסקנה: החיפוש אינו חוקי, והראיה (הסמים) עלולה להיפסל מכוח הלכת יששכרוב (פסילה פסיקתית יחסית, בכפוף לאיזון אינטרסים)."],"id":"caseq-2","topic":"packer","status":"תוקן מול פסק הדין","lesson":"1","extra":false,"source":"אברהם בן חיים נ׳ מדינת ישראל.pdf — רע״פ 10141/09, פסקאות 3–5, 13, 31–35 וההכרעה הסופית"},{"title":"קייס 3 — עדות שותף","scenario":"שני שותפים הועמדו לדין בכתבי אישום נפרדים. האחד הורשע אך טרם נגזר דינו. התביעה מבקשת להעידו במשפט שותפו. הסנגור טוען שהלכת קנזי מחייבת לפסול את העדות באופן אוטומטי.","question":"האם הטענה הגורפת נכונה? הציגו כלל, חריג ויישום.","points":["מזהים שמדובר בכתבי אישום נפרדים.","מבחינים בין הלכת קנזי ההיסטורית לבין בג״ץ 11339/05 שביטל את החסם הגורף.","ככלל ניתן להעיד את השותף גם לפני סיום משפטו; ניתן לדחות במקרים חריגים ביותר ומטעמים שיירשמו.","העובדה שגזר הדין טרם ניתן אינה לבדה בסיס לפסילה אוטומטית. שאלת משקל העדות נפרדת מעצם האפשרות להעיד."],"id":"caseq-3","topic":"kanzi","status":"תוקן ואומת","source":"מדינת ישראל נ׳ בית המשפט המחוזי באר שבע 11339-05.pdf — ההכרעה הסופית ודעת הנשיאה ביניש, פסקה 3","lesson":"3","extra":false},{"title":"קייס 4 — הסדר מותנה","scenario":"חשוד בעבירת תקיפה (עוון) מוזמן על ידי התביעה להצעת הסדר מותנה. הוא מבקש מסנגורו לעיין בחומרי החקירה לפני שיחליט אם לחתום, אך התביעה משיבה שזכות העיון קמה רק לאחר הגשת כתב אישום, ולכן היא מסרבת למסור את החומרים.","question":"האם עמדת התביעה נכונה? נמקו את תשובתכם.","points":["יש להבחין בין זכות העיון הרגילה (סעיף 74) — הקמה רק לאחר הגשת כתב אישום — לבין זכות העיון המיוחדת בהליך של הסדר מותנה.","בהסדר מותנה, מאחר שהחשוד נדרש להודות בעובדות המתגבשות, התביעה חייבת לחשוף את טיוטת כתב האישום וכל חומרי החקירה עוד לפני הגשת כתב אישום.","מסקנה: עמדת התביעה שגויה — במסגרת הצעת הסדר מותנה קמה חובת חשיפה מיוחדת ומוקדמת."],"id":"caseq-4","topic":"conditional","status":"קיים — טרם הושלם אימות פרטני","lesson":"3","extra":false},{"title":"קייס 5 — התיישנות: גבולות חומר הבחינה","scenario":"בתרגיל מוצגת עבירת פשע רגילה ופעולת חקירה מאוחרת. סטודנט מבקש לפתור את השאלה באמצעות טבלת הארכות מפורטת המופיעה במצגת, וכן להסתמך על שקפים בעניין עבירות מין בקטינים.","question":"כיצד יש לבנות את התשובה לפי הנחיית המרצה בשיעור 7?","points":["מזהים את תקופת ההתיישנות הבסיסית לפי סיווג העבירה.","מסבירים שפעולת חקירה היא אירוע מנתק, ושמנגנון התקופה הנוספת קשור לפי השיעור לפעולת חקירה.","לא בונים את התשובה על טבלת הארכות שהמרצה הוציא מחומר הבחינה.","לא מייבאים את דיני עבירות המין בקטינים, שהמרצה הורה להתעלם מהם בבחינה."],"id":"caseq-5","topic":"limitations-pointer","status":"הוחלף בקייס התואם את חומר שיעור 7","lesson":"6","extra":false,"source":"שיעור 7 ערוך.mp3 — דברי המרצה בתחילת הדיון בהתיישנות"},{"title":"קייס 6 — סיווג העבירה לפני הצעת הסדר","scenario":"רונן חשוד בעבירה שעונשה המרבי חמש שנות מאסר. הוא נעדר עבר פלילי בחמש השנים שקדמו לה ואין נגדו תיקים נוספים. התובע סבור שאין מקום לבקש מאסר בפועל ולכן מציע הסדר מותנה. סטודנט טוען שהיעדר עבר פלילי והיעדר בקשת מאסר מספיקים לכך.","question":"מהו תנאי הסף שהסטודנט דילג עליו, לפי המסגרת שנלמדה בשיעור 3?","points":["מפרידים בין העונש המרבי הקבוע לעבירה לבין העונש שהתובע סבור שמתאים בנסיבות המקרה.","עונש מרבי של חמש שנים מציב את העבירה בסוג פשע.","לפי המסגרת שהמרצה לימד, הסדר מותנה מיועד לחטא ולעוון, ולא לפשע.","עבר נקי והערכת התובע שאין צורך במאסר אינם מחליפים את תנאי סיווג העבירה; לכן המסקנה של הסטודנט אינה נכונה."],"id":"caseq-6","topic":"conditional","status":"הקייס הסותר הוחלף בדוגמה המבוססת על ההרצאה","withheld":false,"lesson":"3","extra":false,"source":"שיעור 3.mp3 — הסבר המרצה על סגירת תיק בהסדר, תנאי הסף והעיון לפני חתימה"},{"title":"קייס 7 — התיישנות, סיכון כפול וערעור באיחור","scenario":"שרה ביצעה עבירת פשע (תקופת התיישנות בסיסית 10 שנים) ב-1/2014. ב-1/2018 החל הליך חקירה שהסתיים ב-6/2018. ב-2/2025 הוגש נגדה כתב אישום ומשפטה החל. באותו משפט טענה שרה שכבר זוכתה בעבר, בשנת 2016, מאישום שונה לחלוטין שנבע מאותו אירוע עובדתי — אך התביעה חוזרת וטוענת לעובדות דומות. שרה הורשעה בסופו של דבר, וסנגורה פספס את מועד הגשת הערעור בשבועיים בשל תקלה משרדית.","question":"התייחסו לשלוש הסוגיות: (1) האם ניתן היה להגיש את כתב האישום ב-2/2025 מבחינת התיישנות? (2) האם טענת הסיכון הכפול/הזיכוי הקודם תתקבל? (3) האם ניתן עדיין לערער חרף האיחור?","points":["(1) תקופת ההתיישנות הבסיסית: 1/2014 + 10 שנים = 1/2024. הליך החקירה (אירוע מנתק) מאפס ומתחיל שוב מ-6/2018, אך מוגבל ל\"תקופה נוספת\" של עד 3 שנים מעבר ל-1/2024 — כלומר עד 1/2027. הגשת האישום ב-2/2025 היא במועד.","(2) סעיף 5 חוסם רק דיון חוזר על אותו מעשה שממנו זוכתה — אם האישום הנוכחי מבוסס על עובדות שונות (גם אם מאותו אירוע כללי), הטענה עלולה להידחות; יש לבחון האם מדובר ב\"אותו מעשה\" ממש.","(3) בהליך פלילי ניתן להאריך את מועד הגשת הערעור גם ללא \"טעמים מיוחדים שיירשמו\" (בשונה מהליך אזרחי) — ולכן תקלה משרדית עשויה להצדיק הארכה; דחיית בקשת ההארכה עצמה נחשבת \"פסק דין\" הניתן לערעור בזכות (הלכת חילף)."],"id":"caseq-7","topic":"appeals","status":"קיים — טרם הושלם אימות פרטני","lesson":"8","extra":false},{"title":"קייס 8 — נאשמים באותו כתב אישום","scenario":"א׳ וב׳ מואשמים באותו כתב אישום בשוד. א׳ הודה בעובדות, וב׳ כופר. התביעה מבקשת לגזור את דינו של א׳ מיד כדי לסיים את עניינו.","question":"מהו הכלל שנלמד בשיעור 7 ומהו ההיגיון שניתן לו?","points":["מזהים שמדובר בכתב אישום אחד, תנאי מרכזי לדיון בסעיף 155 כפי שנלמד.","לא גוזרים את דינו של מי שהודה לפני שהסתיים בירור משפטו של מי שלא הודה.","ההסבר בשיעור הוא הצורך לראות את התמונה הכוללת ואת חלקו של כל נאשם לפני הענישה.","אין להוסיף חריגים או מסלולים שאינם מבוססים במפורש בחומר שנלמד."],"id":"caseq-8","topic":"multi-defendants","status":"הוחלף בקייס ממוקד ומאומת","lesson":"6","extra":false,"source":"שיעור 7 ערוך.mp3 — דברי המרצה בתחילת הדיון בהתיישנות"},{"title":"קייס 9 — מעצר ועיכוב: הרחבה מעבר להקלטות 1–8","scenario":"שוטר עיכב את דני ברחוב בחשד לתקיפה (עוון) לפני כשלוש שעות, וביקש לבדוק את זהותו. דני סירב לשתף פעולה, ובתגובה עצר אותו השוטר ללא צו. בתחנה נמנע ממנו לפגוש את עורך דינו למשך 20 שעות ללא נימוק מיוחד, ובמהלך אותה תקופה נגבתה ממנו הודאה בעבירה חמורה יותר — ניסיון לשוד (פשע). דני הובא בפני שופט לאחר 30 שעות. בשלב מאוחר יותר ביקשה התביעה מעצר גישור, ולאחר מכן מעצר עד תום ההליכים, בטענה שמדובר ב\"מכת מדינה\" של שוד ברחובות.","question":"נתחו, לפי הסדר: (1) האם העיכוב והמעצר ללא צו היו כדין? (2) מה דין מניעת הפגישה עם עורך הדין וההודאה שנגבתה? (3) האם הזמן עד ההבאה בפני שופט תקין? (4) האם טענת \"מכת מדינה\" מספיקה למעצר עד תום ההליכים?","points":["(1) תחילה בודקים שהעיכוב נעשה בסמכות. אי־ציות להוראות עיכוב חוקיות עשוי להקים סמכות לפי סעיף 23(ב) להבאה לתחנה לתכלית העיכוב. אין לייבא אוטומטית את תנאי מסלול 23(א); יש לבחון את הנסיבות ואת האפשרות להסתפק בעיכוב.","(2) מניעת פגישה עם עו\"ד ללא נימוק מיוחד לאורך 20 שעות פוגעת בזכות יסוד — בהתאם להלכת אסף שי, פגיעה בלתי חוקית כזו עלולה להוביל לפסילת ההודאה שנגבתה בעקבותיה מכוח הלכת יששכרוב.","(3) הכלל הוא הבאה בפני שופט תוך 24 שעות, עם אפשרות הארכה ל-48 שעות לכל היותר בנסיבות מיוחדות — 30 שעות ללא הצדקה מתועדת חורגות מהכלל הרגיל וטעונות בדיקה.","(4) לפי הלכת גנימאת, \"מכת מדינה\" או חומרת העבירה כשלעצמה אינן עילת מעצר עצמאית — יש לבחון את מסוכנותו האישית הספציפית של דני ואת קיומה של חלופת מעצר, ולא להסתפק בנימוק הכללי."],"id":"caseq-9","topic":"arrest-nowarrant","status":"סעיף העיכוב תוקן; יתר הפתרון טעון אימות","source":"חוק סדר הדין הפלילי סמכויות אכיפה מעצרים התשנו 1996.pdf — סעיף 23(ב)","lesson":"extra","extra":true},{"id":"caseq-10","title":"קייס 10 — שני מועדים בערעור ברשות","scenario":"בקשת רשות ערעור הוגשה בתוך 45 ימים מפסק הדין. ההחלטה המתירה ערעור ניתנה כעבור חודשיים. סטודנט טוען שהמועד חלף, כי עברו יותר מ־75 ימים מפסק הדין.","question":"האם חיבור פשוט של 45+30 פותר את השאלה? נמקו.","points":["מבדילים בין בקשת רשות הערעור לבין הערעור לאחר מתן הרשות.","45 הימים מתייחסים לבקשת הרשות לפי הכלל שנלמד.","30 הימים נמנים ממועד מתן הרשות, לא אוטומטית מתום 45 הימים.","ההמתנה להחלטה אינה מצדיקה כשלעצמה את מסקנת הסטודנט; בודקים את המועד בפועל לאחר מתן הרשות."],"topic":"appeals","source":"שיעור8 ערוך.mp3 — דיון בסיום המשפט ובערעור","status":"דוגמה לימודית על בסיס מקור שנבדק","lesson":"8","extra":false},{"id":"caseq-11","title":"קייס 11 — חזרה מערעור","scenario":"נאשם הגיש ערעור ומבקש לחזור בו. השוו בין בקשה לפני סיום טענות הצדדים לבין בקשה לאחר סיומן.","question":"מהי נקודת המעבר ומה נדרש בכל מצב?","points":["מזהים שהשאלה היא חזרה מערעור, לא חזרת תובע מאישום.","לפני סיום טענות בעלי הדין אין צורך ברשות בית המשפט.","אחרי סיום הטענות נדרשת רשות בית המשפט.","אין להעתיק לכאן את ההבחנה בין ביטול לזיכוי הנוגעת לחזרה מאישום."],"topic":"appeals","source":"שיעור8 ערוך.mp3 — דיון בסיום המשפט ובערעור","status":"דוגמה לימודית על בסיס מקור שנבדק","lesson":"8","extra":false},{"id":"caseq-12","topic":"summations","lesson":"8","extra":false,"title":"קייס 12 — האם סיכומים כתובים מבטלים את המשפט?","scenario":"בתיק כלכלי הסכימו הצדדים להגיש סיכומים בכתב. לאחר הרשעתו דורש הנאשם ביטול אוטומטי של המשפט משום שלא סיכם בעל־פה, בלי להצביע על פגיעה מסוימת בהגנתו.","question":"כיצד יש לנתח את הטענה לפי פלוני 5333/11? השוו בקצרה לזכריא.","points":["מזהים סוגיה של מתכונת הסיכומים, לא של עדות שותפים.","מציינים שטיעון בעל־פה הוא דרך המלך, אך אין ביטול אוטומטי עקב סיכומים בכתב בהסכמה.","בוחנים את ההסכמה ואת הטענה לנזק או עיוות דין; כאן לא פורטה פגיעה קונקרטית.","בזכריא יש חשיבות לכך שהתקיים דיון והסנגור עצמו בחר להסתפק בנימוקיו הכתובים.","המסקנה לפי נתוני הדוגמה: הדרישה לביטול אוטומטי אינה מבוססת; אין בכך היתר גורף לוותר על דיון בכל מקרה."],"source":"פלוני נ׳ מדינת ישראל 5333-11.pdf — רע״פ 5333/11, פסקאות א–ט; זכריא נ׳ מדינת ישראל.pdf — רע״פ 11160/03, פסקאות 2–4 והערת השופטת פרוקצ׳יה","status":"דוגמה לימודית המבוססת על פסקי הדין שנבדקו"}];

function save(){try{localStorage.setItem('diun-plili-study-'+VERSION,JSON.stringify(store));return true;}catch{persistent=false;say('השמירה במכשיר אינה זמינה. הטקסט יישמר רק עד סגירת העמוד.');return false;}}
const lessonLabel=t=>t?.lesson==='extra'?'הרחבה — מעבר להקלטות 1–8':t?.lesson==='info'?'מקורות ומיקוד':(t?.lessons?.length>1?'שיעורים '+t.lessons.join(', '):'שיעור '+t?.lesson);
const topicBadge=t=>`<span class="badge ${t.lesson==='extra'?'extra':''}">${esc(lessonLabel(t))}</span>`;
function sourceNote(source,status){return `<div class="source-note"><b>${esc(status||'מקורות הקורס')}</b>${source?`<br>${esc(source)}`:'<br>התוכן הועבר מהגרסה הקודמת; טרם הושלם אימות פרטני.'}<br><a href="${NOTEBOOK}" target="_blank" rel="noopener">פתיחת מחברת המקורות</a><span class="fine"> · שם המקור והסעיף מצוינים כשאומתו; הקישור פותח את המחברת, לא פסקה מסוימת.</span></div>`;}
function header(title,text=''){return `<h2>${title}</h2>${text?`<p class="muted">${text}</p>`:''}`;}
function setPage(html,section){main.innerHTML=html;document.querySelectorAll('.tabs a').forEach(a=>{const active=a.hash==='#'+section;a.classList.toggle('active',active);active?a.setAttribute('aria-current','page'):a.removeAttribute('aria-current');});}
function route(){const hash=location.hash.slice(1)||'home';if(hash==='main'){main.focus();return;}const [path,qs]=hash.split('?');const [view,id]=path.split('/');const params=new URLSearchParams(qs||'');if(view==='topic'&&byId(id))renderTopic(id);else if(view==='learn')renderLibrary();else if(view==='cases')renderCases(id);else if(view==='quiz')renderQuiz(params);else if(view==='limitations')renderLimitations();else if(view==='sources')renderSources();else renderHome();window.scrollTo(0,0);main.focus({preventScroll:true});}
function renderHome(){const learned=TOPIC_LIST.filter(t=>store.learned[t.id]&&t.lesson!=='info').length;const total=TOPIC_LIST.filter(t=>t.lesson!=='info').length;
 setPage(`<div class="page"><section class="hero"><div class="eyebrow">ערכת הלמידה של הקורס</div><h2>מהכלל המשפטי<br>לתשובה טובה במבחן.</h2><p>תקציר ממוקד, הסבר מעמיק ותרגול יישומי — עם הבחנה בין חומר ההרצאות, הרחבות ומידע שעדיין בבדיקה.</p><div class="hero-actions"><a href="#learn">לנושאי הקורס</a><a href="#quiz" class="secondary">לתרגול עצמי</a>${store.last?`<a href="#topic/${store.last}" class="secondary">המשך מהמקום שעצרתי</a>`:''}</div></section><div class="warning fine"><b>עדכון תוכן:</b> תוקנו ממצאי הביקורת בקנזי, מורוזובה ובתרגול. בדיקת כל חומרי הקורס עדיין לא הושלמה. <a href="#sources">מה אומת ומה לא?</a></div><section class="box"><div class="progress-row"><b>התקדמות אישית: ${learned} מתוך ${total} נושאים</b><progress value="${learned}" max="${total}" aria-label="נושאים שסומנו כנלמדו"></progress></div><p class="fine">סימון הלמידה, התשובות והמחוון נשמרים בדפדפן במכשיר הזה בלבד. הם אינם נשלחים למרצה או ל־AI. במכשיר משותף הימנעו מכתיבת מידע אישי.</p></section><div class="grid"><article class="tile"><h3><a href="#learn">01 · להבין את הנושא</a></h3><p>חיפוש לפי מושג, שיעור או שלב בהליך. מתחילים בתקציר ופותחים הרחבה לפי הצורך.</p></article><article class="tile"><h3><a href="#cases">02 · לקרוא את הפסיקה</a></h3><p>עובדות, טענות, שאלה, נימוקים והלכה. שימו לב למצב האימות בכל כרטיס.</p></article><article class="tile"><h3><a href="#quiz">03 · ליישם ולבדוק</a></h3><p>אמריקאיות עם הסבר וקייסים עם מחוון לבדיקה עצמית. חוזרים במיוחד לשאלות שטעינו בהן.</p></article></div><h3>מפת ההליך</h3><ol class="flow"><li>חקירה</li><li>החלטת התביעה</li><li>כתב אישום</li><li>בירור המשפט</li><li>פסק דין וערעור</li></ol><p class="fine">המפה היא עזר ניווט, לא תיאור של כל מסלול אפשרי. סעיפי הסמכות והחריגים מופיעים בנושאים המתאימים.</p></div>`,'home');}
function lessonOptions(){return '<option value="">כל השיעורים</option>'+Array.from({length:8},(_,i)=>`<option value="${i+1}">שיעור ${i+1}</option>`).join('')+'<option value="extra">הרחבה מעבר ל־1–8</option>';}
function renderLibrary(){setPage(`<div class="page">${header('נושאי הקורס','בוחרים נושא, קוראים תקציר ומעמיקים — באותו עמוד.')}<div class="filters"><label>חיפוש בנושא ובהסבר<input id="topic-search" type="search" placeholder="למשל: קנזי, התיישנות, ערעור"></label><label>שיוך לשיעור<select id="lesson-filter">${lessonOptions()}</select></label><label>מצב למידה<select id="study-filter"><option value="">כל הנושאים</option><option value="new">טרם סומנו כנלמדו</option><option value="done">סומנו כנלמדו</option></select></label></div><p class="fine">שיוך שיעורים 1–6 נשמר ברובו מהגרסה הקודמת וטרם נבדק כולו מחדש.</p><p id="topic-count" class="count" role="status"></p><div class="grid" id="topic-results"></div></div>`,'learn');
 const update=()=>{const term=document.getElementById('topic-search').value.trim().toLocaleLowerCase('he');const lesson=document.getElementById('lesson-filter').value;const learned=document.getElementById('study-filter').value;const matches=TOPIC_LIST.filter(t=>t.lesson!=='info'&&(!lesson||(t.lessons||[t.lesson]).includes(lesson))&&(!term||plain(t.title+' '+t.html+' '+(EXPANSIONS[t.id]?.html||'')).toLocaleLowerCase('he').includes(term))&&(!learned||(learned==='done'?store.learned[t.id]:!store.learned[t.id])));document.getElementById('topic-count').textContent=matches.length+' נושאים';document.getElementById('topic-results').innerHTML=matches.map(t=>`<article class="tile"><div class="tagline">${topicBadge(t)}${store.learned[t.id]?'<span class="saved-mark">✓ נלמד</span>':''}</div><a class="topic-title" href="#topic/${t.id}">${esc(t.title.replace(/ \(.*\)$/,''))}</a><small>${esc(t.group)}</small></article>`).join('')||'<p class="empty">לא נמצאו נושאים. נסו מושג אחר או הסירו סינון.</p>';};for(const id of ['topic-search','lesson-filter','study-filter'])document.getElementById(id).addEventListener('input',update);update();}
function renderTopic(id){const t=byId(id);const deep=EXPANSIONS[id];store.last=id;save();const related=MCQ.filter(q=>q.topic===id&&!q.withheld).length+CASE_Q.filter(q=>q.topic===id&&!q.withheld).length;setPage(`<article class="page topic-page"><div class="crumb"><a href="#learn">כל הנושאים</a> / ${esc(t.group)}</div><div class="tagline">${topicBadge(t)}<span class="badge pending">${esc(t.status)}</span></div><section class="panel">${t.html}</section>${deep?`<details class="detail" id="topic-deep"><summary>לקריאה בהרחבה</summary>${deep.html}</details>`:''}${sourceNote(t.source,t.status)}<div class="topic-actions"><button class="action" id="learned-toggle">${store.learned[id]?'✓ סומן כנלמד — ביטול סימון':'סיימתי ללמוד את הנושא'}</button>${related?`<a href="#quiz?topic=${id}">תרגול בנושא (${related})</a>`:''}<a href="#cases">מאגר הפסיקה</a><a href="#learn">חזרה לנושאים</a></div></article>`,'learn');document.getElementById('learned-toggle').addEventListener('click',e=>{store.learned[id]=!store.learned[id];save();e.currentTarget.textContent=store.learned[id]?'✓ סומן כנלמד — ביטול סימון':'סיימתי ללמוד את הנושא';say('סימון הלמידה עודכן');});}
function renderLimitations(){setPage(`<article class="page topic-page">${header('התיישנות — סדר בחישוב')}<div class="warning fine">מיקוד שיעור 7: התיישנות עבירות מין בקטינים וטבלת הארכת התקופה הנוספת אינן לבחינה. אין לבלבל זאת עם התקופה הנוספת הבסיסית עצמה.</div><div class="panel">${LIMITATIONS_HTML}</div>${sourceNote(SOURCE_NOTES.seven,'מיקוד הבחינה אומת; יתר החישובים טעונים בדיקה פרטנית')}<a class="action" href="#quiz?topic=limitations-pointer">תרגול התיישנות</a></article>`,'limitations');}
function caseMarkup(c,i,open){const field=(title,text)=>text?`<div class="case-field"><span class="label">${title}</span><p>${text}</p></div>`:'';return `<details class="case-card" id="case-${i}" ${open?'open':''}><summary><span><span class="name">${esc(c.name)}</span><br><span class="cite">${esc(c.cite)}</span><br><span class="badge pending">${esc(c.status)}</span></span></summary><div class="case-body">${c.withheld?'<p class="warning">הסיכום הקודם אינו מוצג כרגע משום שנמצא חשש לערבוב בין הלכות. עד להשלמת הבדיקה יש לעיין בפסק הדין המקורי במחברת.</p>':field('1 · סיפור המסגרת — מה קרה?',c.facts)+field('2 · טענות הצד המבקש',c.claimant)+field('טענות הצד שכנגד',c.respondent)+field('3 · השאלה המשפטית',c.question)+field('4 · נימוקי בית המשפט',c.reasoning||'טרם נכתב ניתוח נפרד ומאומת של הנימוקים. אין להשלים זאת בהשערה.')+field('התוצאה במקרה',c.ruling)+field('5 · ההלכה וגבולותיה',c.halacha)+field('דעת רוב ומיעוט',c.dissent)+field('ליישום במבחן',c.exam)}${field('עדכניות',c.currency||'לא נבדק שינוי מאוחר מעבר למקורות המחברת.')}${sourceNote(c.source,c.status)}<a class="action" href="#cases/${i}">קישור לכרטיס זה</a></div></details>`;}
function renderCases(id){setPage(`<div class="page">${header('פסקי הדין — מהסיפור להלכה',CASES.length+' כרטיסי פסיקה ונושאים; חלק מהכרטיסים מרכזים כמה הליכים.')}<div class="warning fine">אין לראות בכל הכרטיסים ניתוח מאומת. מצב האימות גלוי בכל כרטיס; סיכומים שבהם זוהה חשש מהותי הושהו לבדיקה.</div><div class="filters"><label>חיפוש בפסיקה<input type="search" id="case-search" placeholder="שם פסק דין, סוגיה או מספר הליך"></label></div><p id="case-count" role="status" class="count"></p><div id="cases-results"></div></div>`,'cases');const update=()=>{const s=document.getElementById('case-search').value.trim();const found=CASES.map((c,i)=>({c,i})).filter(({c})=>!s||plain(Object.values(c).join(' ')).includes(s));document.getElementById('case-count').textContent=found.length+' כרטיסים';document.getElementById('cases-results').innerHTML=found.map(({c,i})=>caseMarkup(c,i,String(i)===id)).join('')||'<p class="empty">לא נמצאו פסקי דין מתאימים.</p>';};document.getElementById('case-search').addEventListener('input',update);update();if(id&&/^\d+$/.test(id))requestAnimationFrame(()=>document.getElementById('case-'+id)?.scrollIntoView({block:'start'}));}
function renderSources(){setPage(`<div class="page topic-page"><section class="panel">${byId('lesson6-note').html}</section>${sourceNote(SOURCE_NOTES.seven+'; '+SOURCE_NOTES.eight,'תיעוד הביקורת — 20.9.2026')}<section class="box"><h3>מה השתנה?</h3><ul><li>הופרדו הרצאות, הרחבות ומצב האימות.</li><li>תוקנו הלכות ותרגילים שנמצאו שגויים; נוספו תרגילי ערעור וניתוח מורוזובה.</li><li>נוספו חיפוש, סינון, קישורים ישירים ושמירת התקדמות.</li></ul><h3>פרטיות ושמירה</h3><p>אין באתר בדיקת AI ואין שליחת תשובות. ההתקדמות נשמרת רק באחסון הדפדפן במכשיר זה, ללא סנכרון. ניקוי נתוני האתר מוחק אותה. טעינת גופנים נעשית מ־Google Fonts; אין להסיק מכך שתשובות נשלחות לשירות זה.</p><button class="action" id="clear-study">מחיקת נתוני הלמידה מהמכשיר</button><p class="fine" id="storage-state">${persistent?'השמירה המקומית זמינה.':'השמירה המקומית אינה זמינה בדפדפן זה.'}</p></section></div>`,'home');document.getElementById('clear-study').addEventListener('click',()=>{if(!confirm('למחוק מהמכשיר את כל התשובות, הסימונים וההתקדמות? פעולה זו אינה משנה את תוכן האתר.'))return;store={answers:{},drafts:{},rubrics:{},learned:{},last:null};save();say('נתוני הלמידה נמחקו מהמכשיר.');});}
let quizMode='mcq';
function answerFor(q){const value=store.answers[q.id];return Number.isInteger(value)&&value>=0&&value<q.opts.length?value:null;}
function renderQuiz(params){const initialTopic=params.get('topic');quizMode=params.get('mode')==='cases'?'cases':'mcq';setPage(`<div class="page">${header('תרגול עצמי','בודקים הבנה, לא רק זיכרון. שאלות חדשות מסומנות עם מקור; שאלות ותיקות עדיין בבדיקה.')}<div class="warning fine"><b>הקייסים אינם נבדקים בידי AI.</b> כתבו תשובה, פתחו פתרון וסמנו בעצמכם אילו רכיבים כללתם. התשובות נשמרות במכשיר בלבד.</div><div class="quiz-toolbar" role="group" aria-label="סוג תרגול"><button class="action" id="mode-mcq">אמריקאיות</button><button class="action" id="mode-cases">קייסים ומחוון</button></div><div class="filters"><label>נושא<select id="quiz-topic"><option value="">כל הנושאים</option>${TOPIC_LIST.filter(t=>t.lesson!=='info').map(t=>`<option value="${t.id}">${esc(t.title.replace(/ \(.*\)$/,''))}</option>`).join('')}</select></label><label>בחירת שאלות<select id="quiz-state"><option value="all">כל השאלות</option><option value="unanswered">טרם נענו</option><option value="wrong">טעויות באמריקאיות</option><option value="sourced">עם מקור שנבדק</option></select></label><label class="check-label"><input type="checkbox" id="include-extra">גם הרחבות מעבר ל־1–8</label></div><div class="score-bar"><div id="quiz-score" role="status" aria-live="polite"></div><button class="action" id="reset-mcq">איפוס האמריקאיות</button></div><p class="count" id="quiz-count" role="status"></p><div id="quiz-list"></div></div>`,'quiz');const select=document.getElementById('quiz-topic');if(byId(initialTopic))select.value=initialTopic;document.getElementById('include-extra').checked=byId(initialTopic)?.lesson==='extra';for(const id of ['quiz-topic','quiz-state','include-extra'])document.getElementById(id).addEventListener('change',drawQuiz);for(const mode of ['mcq','cases'])document.getElementById('mode-'+mode).addEventListener('click',()=>{quizMode=mode;drawQuiz();});document.getElementById('reset-mcq').addEventListener('click',()=>{if(!confirm('לאפס את כל התשובות האמריקאיות? תשובות הקייס יישארו שמורות.'))return;store.answers={};save();drawQuiz();});drawQuiz();}
function selectedQuestions(ignoreAnswerFilter=false){const topic=document.getElementById('quiz-topic').value;const extras=document.getElementById('include-extra').checked;const filter=document.getElementById('quiz-state').value;return (quizMode==='mcq'?MCQ:CASE_Q).filter(q=>!q.withheld&&(!topic||q.topic===topic)&&(extras||!q.extra)&&(ignoreAnswerFilter||filter==='all'||(filter==='sourced'&&!!q.source)||(filter==='wrong'&&quizMode==='mcq'&&answerFor(q)!==null&&answerFor(q)!==q.correct)||(filter==='unanswered'&&(quizMode==='mcq'?answerFor(q)===null:!store.drafts[q.id]))));}
function updateQuizScore(){const visible=selectedQuestions(true);if(quizMode==='mcq'){const answered=visible.filter(q=>answerFor(q)!==null);const correct=answered.filter(q=>answerFor(q)===q.correct).length;document.getElementById('quiz-score').textContent=`${correct} תשובות נכונות מתוך ${answered.length} שנענו · ${visible.length} שאלות בתחום שנבחר${answered.length?' · '+Math.round(correct/answered.length*100)+'% הצלחה':''}`;}else{document.getElementById('quiz-score').textContent='מחוון לבדיקה עצמית בלבד — אינו ציון אוטומטי';}}
function drawQuiz(){for(const mode of ['mcq','cases']){const b=document.getElementById('mode-'+mode);b.classList.toggle('primary',quizMode===mode);b.setAttribute('aria-pressed',String(quizMode===mode));}document.getElementById('reset-mcq').hidden=quizMode!=='mcq';const qs=selectedQuestions();document.getElementById('quiz-count').textContent=qs.length+' '+(quizMode==='mcq'?'שאלות':'קייסים')+' בתצוגה';const list=document.getElementById('quiz-list');list.innerHTML=qs.map(q=>quizMode==='mcq'?mcqMarkup(q):caseQuestionMarkup(q)).join('')||'<p class="empty">אין תרגילים בסינון הזה. נסו נושא אחר, סוג תרגול אחר או הרחבות.</p>';updateQuizScore();
 list.querySelectorAll('[data-answer]').forEach(b=>b.addEventListener('click',()=>{const q=MCQ.find(x=>x.id===b.dataset.question);if(answerFor(q)!==null)return;store.answers[q.id]=Number(b.dataset.answer);save();const card=b.closest('.mcq-card');card.outerHTML=mcqMarkup(q);updateQuizScore();say(Number(b.dataset.answer)===q.correct?'תשובה נכונה. ההסבר מוצג מתחת לשאלה.':'התשובה אינה נכונה. התשובה הנכונה וההסבר מוצגים.');}));
 list.querySelectorAll('textarea[data-draft]').forEach(el=>{const value=store.drafts[el.dataset.draft];el.value=typeof value==='string'?value:'';el.addEventListener('input',()=>{store.drafts[el.dataset.draft]=el.value;save();document.getElementById('saved-'+el.dataset.draft).textContent=persistent?'נשמר במכשיר':'לא ניתן לשמור לאחר סגירת העמוד';});});
 list.querySelectorAll('[data-rubric]').forEach(el=>el.addEventListener('change',()=>{store.rubrics[el.dataset.rubric]=el.checked;save();updateRubric(el.dataset.caseq);}));
 list.querySelectorAll('[data-caseq-card]').forEach(el=>updateRubric(el.dataset.caseqCard));
}
function mcqMarkup(q){const chosen=answerFor(q);const answered=chosen!==null;return `<article class="mcq-card" id="${q.id}"><div class="tagline">${topicBadge(byId(q.topic))}<span class="badge pending">${esc(q.status)}</span></div><div class="mcq-q"><span class="qnum">${q.id.replace('mcq-','שאלה ')}.</span> ${esc(q.q)}</div><div class="quiz-options">${q.opts.map((text,i)=>`<button class="opt ${answered?(i===q.correct?'correct':i===chosen?'incorrect':''):''}" data-question="${q.id}" data-answer="${i}" ${answered?'disabled':''}><span class="bullet">${String.fromCharCode(1488+i)}</span><span>${esc(text)}${answered&&i===q.correct?' — ✓ התשובה הנכונה':''}${answered&&i===chosen&&chosen!==q.correct?' — התשובה שבחרת':''}</span></button>`).join('')}</div>${answered?`<div class="explain"><b>${chosen===q.correct?'נכון':'לא נכון'}.</b> ${esc(q.explain)}${q.source?`<p class="fine">מקור: ${esc(q.source)}</p>`:''}<a href="#topic/${q.topic}">חזרה לנושא</a></div>`:''}</article>`;}
function caseQuestionMarkup(q){return `<article class="case-q" data-caseq-card="${q.id}"><div class="tagline">${topicBadge(byId(q.topic))}<span class="badge pending">${esc(q.status)}</span></div><h3>${esc(q.title)}</h3><div class="scenario">${esc(q.scenario)}</div><p class="question">${esc(q.question)}</p><label for="draft-${q.id}"><b>התשובה שלי</b></label><textarea id="draft-${q.id}" data-draft="${q.id}" placeholder="זיהוי הסוגיה → הכלל → יישום לעובדות → מסקנה"></textarea><span class="saved-mark" id="saved-${q.id}">${store.drafts[q.id]?'תשובה שמורה במכשיר':''}</span><details class="detail"><summary>פתרון מוצע ומחוון לבדיקה עצמית</summary><p class="fine">סמנו רק רכיבים שמופיעים בתשובתכם עם יישום לעובדות. הסימון אינו הערכה של איכות הנימוק.</p><div class="rubric">${q.points.map((p,i)=>`<label><input type="checkbox" data-caseq="${q.id}" data-rubric="${q.id}-${i}" ${store.rubrics[q.id+'-'+i]?'checked':''}><span>${esc(p)}</span></label>`).join('')}</div><p class="fine" id="rubric-count-${q.id}" role="status"></p>${q.source?`<p class="fine">מקור: ${esc(q.source)}</p>`:''}<a href="#topic/${q.topic}">לימוד חוזר של הנושא</a></details></article>`;}
function updateRubric(id){const q=CASE_Q.find(x=>x.id===id);document.getElementById('rubric-count-'+id).textContent=`סימנתם ${q.points.filter((_,i)=>store.rubrics[id+'-'+i]).length} מתוך ${q.points.length} רכיבים. זו בדיקה עצמית, לא ציון.`;}
document.addEventListener('click',e=>{const c=e.target.closest('.case-link');if(c&&c.dataset.case!==undefined){location.hash='cases/'+c.dataset.case;return;}const ex=e.target.closest('.expand-link');if(ex){const el=document.getElementById('topic-deep');if(el){el.open=true;el.scrollIntoView({block:'start'});}return;}if(e.target.closest('#open-limitations-btn'))location.hash='limitations';});
window.addEventListener('hashchange',route);route();
</script>
</body></html>
