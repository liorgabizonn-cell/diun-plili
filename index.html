שאחרת כל נאשם יטען זאת כדי לחמוק מדין.","question":"מהם התנאים והיקף השימוש בדוקטרינת ההגנה מן הצדק כטענה מקדמית לביטול כתב אישום?","ruling":"בפסיקה גובשה דוקטרינה בעלת מבחן תלת-שלבי (זיהוי הפגם, בחינת האפשרות לרפא אותו באמצעים מתונים יותר, ואיזון האינטרסים) המוחלת במשורה.","halacha":"בית המשפט רשאי לבטל כתב אישום כאשר הגשתו או ניהול ההליך הפלילי עומדים בסתירה מהותית לעקרונות של צדק והגינות משפטית — זוהי טענה מקדמית עצמאית מכוח סעיף 149(7) לחסד\"פ, הנבחנת במשורה ובזהירות.","currency":"לא אומת עדכון מעבר למקורות הקורס"},{"name":"מדינת ישראל נגד יגאל קרישניסקי","cite":"ע\"פ 250/77 (1977)","facts":"נאשם ניסה לטעון טענת \"סיכון כפול\" ביחס להליך קודם שהתנהל נגדו, כשההליך הקודם היה למעשה בטל מעיקרו (בית המשפט לא היה מוסמך לדון בו מלכתחילה).","claimant":"עמד בעבר ב\"סיכון\" של הרשעה באותו עניין, ולכן אין להעמידו לדין פעם נוספת.","respondent":"מכיוון שההליך הקודם היה בטל מעיקרו (חוסר סמכות), הוא לא היה הליך תקף שממנו נובע \"סיכון\" משפטי כלל.","question":"האם ניתן לטעון \"סיכון כפול\" כאשר ההליך הקודם שממנו נטען הסיכון היה בטל מעיקרו?","ruling":"נקבע כי הטענה אינה חלה במצב זה.","halacha":"טענת \"סיכון כפול\" אינה חלה כאשר ההליך הקודם בטל מעיקרו — למשל כשבית המשפט לא היה מוסמך לדון בו מלכתחילה. הליך בטל אינו יוצר \"סיכון\" משפטי מוכר.","currency":"לא אומת עדכון מעבר למקורות הקורס"},{"name":"דרורי נגד מדינת ישראל","cite":"ע\"פ 104/89 (1989)","facts":"נאשם הועמד לדין בכתב אישום הכולל כמה עבירות שונות, בעלות עונשים מרביים שונים, ונדרשה הכרעה איזה בית משפט מוסמך לדון בתיק כולו.","claimant":"לא פורט בסיכום הקיים; יש להשלים מהמקור, ולא להסיק טענה משוערת.","respondent":"לא פורט בסיכום הקיים; יש להשלים מהמקור, ולא להסיק טענה משוערת.","question":"כיצד נקבעת הסמכות העניינית כאשר כתב אישום אחד כולל כמה עבירות בחומרה שונה?","ruling":"נקבע מבחן ברור המבוסס על העבירה החמורה ביותר בכתב האישום.","halacha":"כתב אישום הכולל כמה עבירות — הסמכות העניינית נקבעת לפי העונש המקסימלי של העבירה החמורה ביותר שבו. למשל: שלוש עבירות בנות 5 שנים כל אחת → שלום; שילוב של עבירת 3 שנים ועבירת 10 שנים → מחוזי.","currency":"לא אומת עדכון מעבר למקורות הקורס"},{"name":"מדינת ישראל נגד בית המשפט המחוזי בבאר שבע","cite":"בג״ץ 11339/05 — הכרעה מיום 8.10.2006","facts":"בפרשה שבה הוגשו כתבי אישום נפרדים, התעוררה השאלה אם התביעה תוכל להעיד שותף שמשפטו שלו עדיין תלוי ועומד. המדינה פנתה נגד החלטת בית המשפט המחוזי בבאר שבע, ודיון בהרכב מורחב בחן מחדש את הלכת קנזי.","claimant":"המדינה ביקשה להסיר את החסם להעדת השותף לפני סיום משפטו הנפרד.","respondent":"במוקד העמדה התומכת בשימור ההגבלה עמד החשש לעדות מוטה של שותף המבקש להיטיב את מצבו ולפגיעה בזכויות. זהו תמצות הסוגיה; אין לייחס לכל משיב טיעון זהה.","question":"האם להמשיך בכלל המעכב העדת שותף כל עוד משפטו הנפרד לא הסתיים, ובאיזה היקף להשאיר שיקול דעת לדחייה?","ruling":"בדעת רוב נקבע שאין מניעה ככלל להעיד עד תביעה הקשור באותה פרשה ומשפטו תלוי ועומד. החלטת המחוזי שבמוקד העתירה בוטלה.","halacha":"במשפטים נפרדים ניתן להעיד שותף גם לפני סיום משפטו. רק במקרים חריגים ביותר, מטעמים שיירשמו, רשאי בית המשפט לדחות את שמיעתו עד לסיום משפטו.<p><b>השלמת A2: בעדות שותף במשפטים נפרדים אין חסם גורף; דחייה אפשרית רק במקרים חריגים ביותר ומטעמים שיירשמו. עצם האפשרות להעיד נפרדת ממשקל העדות.</b></p>","currency":"לא אומת עדכון מעבר למקורות הקורס","reasoning":"בית המשפט שקל את החשש מעדות אינטרסנטית מול עיכוב ההליך והקשיים שיצר הכלל הגורף. דעת הרוב העדיפה להסיר את החסם ולהותיר דחייה במקרים חריגים ביותר ובהנמקה. ההבחנה בין עצם העדת השותף לבין משקל עדותו נותרת חשובה.","dissent":"השופטים נבדלו בהיקף שיקול הדעת שיש להשאיר. ההכרעה אימצה את המסלול המצומצם המתואר בדעת הנשיאה ביניש.","source":"מדינת ישראל נ׳ בית המשפט המחוזי באר שבע 11339-05.pdf — ההכרעה הסופית ודעת הנשיאה ביניש, פסקה 3","exam":"אין לפתור קייס של כתבי אישום נפרדים באמצעות האיסור ההיסטורי בלבד. יש לזהות את השינוי ואת החריג."},{"name":"אשורנס נגד הכונס הרשמי","cite":"רע\"א 3312/04 (2004)","facts":"בתום פרשת התביעה במשפט, נטענה טענת \"אין להשיב לאשמה\" — כלומר שהאשמה לא הוכחה אף לכאורה על סמך ראיות התביעה בלבד.","claimant":"לא פורט בסיכום הקיים; יש להשלים מהמקור, ולא להסיק טענה משוערת.","respondent":"לא פורט בסיכום הקיים; יש להשלים מהמקור, ולא להסיק טענה משוערת.","question":"מהם התנאים לקבלת טענת \"אין להשיב לאשמה\" בתום פרשת התביעה?","ruling":"נקבעו העקרונות המנחים להפעלת סעיף 158 לחסד\"פ.","halacha":"אם בתום פרשת התביעה לא הוכחה האשמה אף לכאורה, יזכה בית המשפט את הנאשם — הן מיוזמתו והן לבקשת הנאשם — לאחר שנתן לתובע הזדמנות להשמיע את דברו בעניין.<p><b>השלמת A2: בהקשר הפלילי יש לבחון גילוי והגינות לפי השפעתם על ההליך וההגנה, ולא להעתיק מסקנה מהליך אחר בלי בסיס בחומר הקורס.</b></p>","currency":"לא אומת עדכון מעבר למקורות הקורס"},{"name":"לזרובסקי נגד מדינת ישראל","cite":"ע\"פ 5874/00 (2000)","facts":"במהלך המשפט ביקש בית המשפט לעשות שימוש בסמכותו להזמין ראיות או עדים מיוזמתו, לאחר שהצדדים סיימו להביא את ראיותיהם.","claimant":"לא פורט בסיכום הקיים; יש להשלים מהמקור, ולא להסיק טענה משוערת.","respondent":"לא פורט בסיכום הקיים; יש להשלים מהמקור, ולא להסיק טענה משוערת.","question":"מהו היקף סמכותו של בית המשפט להביא ראיות מיוזמתו לפי סעיף 167 לחסד\"פ, ובאילו שלבים ניתן להפעילה?","ruling":"אושרה סמכותו הרחבה של בית המשפט להביא ראיות מטעמו, לרבות בשלבים מאוחרים.","halacha":"סיימו הצדדים להביא ראיותיהם, רשאי בית המשפט להורות על הזמנת עד (גם אם כבר העיד) או ראיות נוספות, מיוזמתו או לבקשת בעל דין. גם לאחר הכרעת הדין ניתן לקבל ראיות חדשות — אך במקרים נדירים וחריגים ביותר, כשהדבר נדרש לעשיית צדק ולמניעת עיוות דין.","currency":"לא אומת עדכון מעבר למקורות הקורס"},{"name":"תיקים הממתינים לבירור דין (מב\"ד)","cite":"בש\"פ 6718/06 פלוני; רע\"פ 1021/07 פלוני","facts":"בשני מקרים נדונה השאלה האם ניתן להגיש כראיה נגד נאשם פלט ממחשב המשטרה על תיקים פתוחים שטרם הוחלט אם להגיש בגינם כתב אישום (מב\"ד — ממתינים לבירור דין).","claimant":"לא פורט בסיכום הקיים; יש להשלים מהמקור, ולא להסיק טענה משוערת.","respondent":"לא פורט בסיכום הקיים; יש להשלים מהמקור, ולא להסיק טענה משוערת.","question":"האם ניתן להגיש תיקי מב\"ד כראיה, ובאיזה שלב של ההליך?","ruling":"נקבעה הבחנה בין שלב הכרעת האשמה לשלב גזירת העונש.","halacha":"בשלב בירור האשמה אין להגיש פלט מב\"ד (אלא אם הנאשם טוען שלא נפתחה נגדו חקירה כלל), שכן אין להביא ראיות על עברו הפלילי בשלב זה. בשלב גזירת הדין, לעומת זאת, שירות המבחן רשאי לכלול מידע על תיקי מב\"ד בתסקיר, ובית המשפט רשאי להידרש לכך בזהירות הראויה.","currency":"לא אומת עדכון מעבר למקורות הקורס"},{"name":"שם טוב ופלוני — חריגים נוספים לערעור על החלטות ביניים","cite":"ע\"פ 6907/19 שם טוב; בג\"ץ 10683/08 פלוני נ' בית משפט השלום חיפה","facts":"שני מקרים נוספים (מלבד עניין פלדמן) שבהם נדונה השאלה אילו החלטות ביניים בהליך הפלילי ניתנות לערעור עצמאי ומיידי, חרף הכלל האוסר זאת.","claimant":"לא פורט בסיכום הקיים; יש להשלים מהמקור, ולא להסיק טענה משוערת.","respondent":"לא פורט בסיכום הקיים; יש להשלים מהמקור, ולא להסיק טענה משוערת.","question":"אילו סוגי החלטות ביניים בהליך הפלילי מהוות חריג לכלל האוסר ערעור עליהן במהלך ההליך?","ruling":"אושרה וחודדה רשימת החריגים לכלל.","halacha":"מלבד הכלל שאין לערער על החלטות ביניים אלא במסגרת הערעור על פסק הדין, קיימים חריגים שבהם ניתן לערער בזכות באופן מיידי: פסלות שופט; החלטה על דיון בדלתיים פתוחות; החלטה בעניין עיון בחומר חקירה; והחלטה בעניין עיכוב ביצוע עונש.<p><b>השלמת A2: בהחלטות תביעה יש להבחין בין פגם מנהלי בהחלטה לבין מחלוקת על דיות הראיות; הסעד תלוי בסוג הפגם ובעוצמת הפגיעה.</b></p>","currency":"לא אומת עדכון מעבר למקורות הקורס"},{"name":"צ'ירנסקי נגד סגן נשיא בית משפט השלום בחדרה","cite":"בג\"ץ 188/96 (1996)","facts":"נדונה שאלת זכות הערעור של מי שקיבל בפועל את התוצאה המבוקשת בפסק הדין, אך נקבעו בו קביעות עובדתיות שאינן נוחות לו, וכן שאלת זכות הערעור של עד.","claimant":"לא פורט בסיכום הקיים; יש להשלים מהמקור, ולא להסיק טענה משוערת.","respondent":"לא פורט בסיכום הקיים; יש להשלים מהמקור, ולא להסיק טענה משוערת.","question":"האם מי שזכה בפסק הדין, וכן עד במשפט, רשאים לערער על קביעות מסוימות שנקבעו בפסק הדין או במהלכו?","ruling":"נקבע כי שניהם אינם \"נפגעים\" במובן המקנה זכות ערעור.","halacha":"מי שקיבל פסק דין לטובתו אינו רשאי לערער עליו, גם אם נקבעו בו ממצאים לחובתו, מכיוון שאין לראות בו \"נפגע\" מפסק הדין. עד במשפט אינו רשאי לערער על אמרת אגב של שופט שבה הוטל ספק במהימנותו.","currency":"לא אומת עדכון מעבר למקורות הקורס"},{"name":"חניון חיפה, גבארה וסורפין — מתי תינתן רשות ערעור","cite":"ר\"ע 103/82 חניון חיפה; רע\"פ 4049/05 גבארה; רע\"פ 4732/02 סורפין","facts":"שלושה פסקי דין שגיבשו יחד את המבחנים למתן רשות לערער בהליך פלילי (ערעור \"שני\", לאחר ערעור בזכות), הן ביחס להכרעת הדין והן ביחס לחומרת העונש.","claimant":"לא פורט בסיכום הקיים; יש להשלים מהמקור, ולא להסיק טענה משוערת.","respondent":"לא פורט בסיכום הקיים; יש להשלים מהמקור, ולא להסיק טענה משוערת.","question":"מתי תינתן רשות ערעור בהליך פלילי?","ruling":"גובשו הקריטריונים העיקריים למתן הרשות.","halacha":"רשות ערעור תינתן כאשר הבקשה מעלה שאלה משפטית חשובה שלהכרעה בה חשיבות ציבורית כללית, החורגת מעניינם הספציפי של בעלי הדין — או, בערעור על חומרת העונש, כאשר המקרה חריג ותחושת הצדק מחייבת מתן רשות (למשל פער ניכר בין העונש שנגזר בערכאה הראשונה לזה שנגזר בערעור).","currency":"לא אומת עדכון מעבר למקורות הקורס"},{"name":"חילף נגד מדינת ישראל","cite":"רע\"פ 8274/99 (1999)","facts":"מערער ביקש להגיש ערעור (או בקשת רשות ערעור) לאחר שחלפו המועדים הקבועים בחוק להגשתו.","claimant":"לא פורט בסיכום הקיים; יש להשלים מהמקור, ולא להסיק טענה משוערת.","respondent":"לא פורט בסיכום הקיים; יש להשלים מהמקור, ולא להסיק טענה משוערת.","question":"באילו תנאים רשאי בית המשפט להאריך את המועד להגשת ערעור פלילי שהוגש באיחור?","ruling":"נקבע כי ניתן להאריך את המועד גם ללא \"טעמים מיוחדים שיירשמו\", בשונה מהליך אזרחי.","halacha":"בית המשפט רשאי, לבקשת מערער, להרשות הגשת ערעור או בקשת רשות ערעור גם לאחר חלוף המועדים — ללא צורך בטעמים מיוחדים שיירשמו (בשונה מהליך אזרחי). החלטת בית משפט לדחות בקשת הארכת מועד מהווה \"פסק דין\", והערעור עליה הוא בזכות.","currency":"לא אומת עדכון מעבר למקורות הקורס"},{"name":"יוסי בן ארי נגד השר לביטחון פנים","cite":"בג\"ץ 8029/21 (2021) — מפי השופט אלכס שטיין","facts":"בן ארי נידון בשנות ה-90 לתריסר שנות מאסר בעבירות סמים חמורות מסוג פשע. לאחר שריצה 4 שנים בלבד, נמלט מהכלא וברח לפרגוואי, שם חי תחת זהות בדויה כמעט 30 שנה — עד שאותר, נעצר והוחזר לישראל ב-2021.","claimant":"חלפו מעל 20 שנה מיום הפסקת ריצוי העונש בפועל, ולפי סעיף 10(א) לחוק סדר הדין הפלילי העונש התיישן לחלוטין והמדינה אינה מוסמכת להחזיקו במאסר.","respondent":"לפי סעיף 10(ג) לחוק, תקופת ההימלטות לחוץ לארץ וההתחמקות ממאסר אינן נספרות במניין — השעון נעצר ביום הבריחה.","question":"האם עונש מאסר של אסיר שנמלט מהכלא ושהה בחוץ לארץ כמעט 30 שנה מתיישן, או שבריחתו האקטיבית מקפיאה את מרוץ ההתיישנות?","ruling":"בית המשפט העליון דחה את העתירה — הבריחה מקפיאה את מרוץ ההתיישנות באופן מוחלט.","halacha":"בריחה אקטיבית של אסיר מהכלא והתחמקות ממאסר מקפיאות לחלוטין את שעון התיישנות העונש (סעיף 10(ג)). מוסד ההתיישנות נועד להעניק מחילה למי ששהה בקהילה וסבל מחרדת העונש המתמדת — לא למי שנמלט וחי בשקט תחת זהות בדויה.<p><b>השלמת A2: בביקורת מנהלית יש להציג את האיזון בין זכויות הפרט לבין האינטרס הציבורי ואת גבולות ההתערבות, בלי לייחס חריג עובדתי שלא אומת.</b></p>","currency":"לא אומת עדכון מעבר למקורות הקורס"},{"name":"דוד אפל נגד פרקליטת המדינה","cite":"בג\"ץ 2682/99 (1999)","facts":"דוד אפל, איש עסקים, הועמד לדין פלילי בגין עבירות שוחד ומרמה חמורות. אפל הגיש עתירה לבג\"ץ בדרישה לבטל את כתב האישום נגדו, בטענה שההחלטה להעמידו לדין לוקה בחוסר סבירות קיצוני ונשענת על תשתית ראייתית רעועה.","claimant":"החלטת התביעה להעמידו לדין היא החלטה מנהלית הכפופה לביקורת שיפוטית מלאה של בג\"ץ, וההחלטה להגיש כתב אישום עולה כדי חוסר סבירות קיצוני.","respondent":"ההחלטה על הגשת כתב אישום או סגירת תיק מצויה בליבת הסמכות המקצועית של התביעה הכללית, שלה המומחיות הייחודית בהערכת סיכויי הרשעה — ובית המשפט אינו \"תובע-על\".","question":"באילו נסיבות ובאיזו מידה יתערב בית המשפט הגבוה לצדק בשיקול הדעת המקצועי של רשויות התביעה בעניין הגשת כתב אישום או סגירת תיק פלילי?","ruling":"בית המשפט העליון דחה את העתירה וקבע הלכת התערבות מצומצמת ביותר.","halacha":"החלטת התביעה להעמיד אדם לדין היא אכן החלטה מנהלית הכפופה לביקורת שיפוטית, אך בג\"ץ יתערב בה רק במקרים נדירים וחריגים ביותר שבהם נפל בהחלטה פגם חמור היורד לשורש העניין — חוסר סבירות קיצוני ביותר, חוסר תום לב מובהק, שיקולים זרים ברורים או אפליה בררנית פסולה. כל עוד ההחלטה במתחם הסבירות המקצועי של התובע — אין התערבות.","currency":"לא אומת עדכון מעבר למקורות הקורס"},{"name":"רפאל יששכרוב נגד התובע הצבאי הראשי","cite":"ע\"פ 5121/98","facts":"חייל נחקר בגין עבירה והודה בחקירה, מבלי שחוקריו הודיעו לו כדין על זכותו להיוועץ בעורך דין לפני החקירה.","claimant":"פגיעה בזכות ההיוועצות בעורך דין, המעוגנת בחוק יסוד כבוד האדם וחירותו, פוגעת בהגינות ההליך ומצדיקה פסילת ההודאה שהושגה עקב כך.","respondent":"האינטרס הציבורי בחשיפת האמת ובמלחמה בפשיעה מצדיק קבלת ההודאה כראיה, חרף הפגם בחקירה.","question":"האם חוק יסוד כבוד האדם וחירותו מחייב פסילה של ראיה שהושגה תוך פגיעה בזכות חוקתית של הנחקר, ובאילו תנאים?","ruling":"בית המשפט העליון קבע כי לבתי המשפט שיקול דעת לפסול ראיה שהושגה שלא כדין, כאשר קבלתה תפגע באופן מהותי בזכות להליך הוגן.","halacha":"נקבעה דוקטרינת <b>הפסילה הפסיקתית היחסית</b> — לבית המשפט שיקול דעת לפסול ראיה שהושגה באמצעים פסולים, לפי מבחן איזון בין האינטרס הציבורי בחשיפת האמת לבין ההגנה על זכויות הנחקר וטוהר ההליך השיפוטי, ולא פסילה אוטומטית וקטגורית כבארה\"ב. זוהי ההלכה העומדת בבסיס הדיון על מודל מיגור הפשיעה מול מודל ההליך הראוי (ראו שיעור 1).","currency":"לא אומת עדכון מעבר למקורות הקורס"},{"name":"ירדאו קסאי נגד מדינת ישראל","cite":"רע\"פ 3829/15","facts":"קסאי עוכב ונעצר ברחוב על ידי שוטרים בנסיבות שבהן לא התקיימו עילות המעצר החוקיות. קסאי התנגד למעצר פיזית תוך שימוש בכוח מול השוטרים, והועמד לדין בגין תקיפת שוטר בעת מילוי תפקידו.","claimant":"מאחר שהמעצר היה בלתי חוקי מיסודו, השוטר לא פעל כחוק בעת מילוי תפקידו, ולכן עמדה לו זכות טבעית להתנגד למעצר הבלתי חוקי.","respondent":"חובה על אזרח לציית להוראות שוטר בשטח, ואין להתיר שימוש בכוח נגד אנשי חוק גם אם נפלה שגגה בחוקיות המעצר.","question":"האם עומדת לאדם זכות להתנגד פיזית למעצר בלתי חוקי שמבצע שוטר, ובאיזו מידה?","ruling":"בית המשפט העליון קיבל את טענת המערער.","halacha":"לכל אדם שמורה זכות יסוד להתנגד למעצר בלתי חוקי, ואף לעשות שימוש בכוח סביר ומידתי לצורך שמירה על חירותו. מעצר בלתי חוקי שולל מהשוטר את ההגנה של מילוי תפקידו כחוק.<p><b>השלמת A2: חיפוש בהסכמה נבחן לפי מקור הסמכות, תוקף ההסכמה וחוקיות הפעולה; יש להפריד בין היישום העובדתי לבין מבחן הפסילה היחסי.</b></p>","currency":"לא אומת עדכון מעבר למקורות הקורס"},{"name":"כהן נגד הפצ\"ר","cite":"ע\"פ 349/88","facts":"חייל בצבא נחשד בביצוע עבירה צבאית. המפקד והמשטרה הצבאית השתמשו בסמכות מעצר ללא צו תחת העילה של עבירה שבוצעה \"זה מקרוב\", חרף חלוף מספר ימים מהמעשה.","claimant":"חלפו ימים ממועד ביצוע המעשה, ולכן סמכות מעצר ללא צו תחת התיבה \"זה מקרוב\" פקעה, והיה חובה לפנות לשופט להוצאת צו מעצר מסודר.","respondent":"הביטוי \"זה מקרוב\" מעניק גמישות חקירתית של מספר ימים.","question":"מהו פרק הזמן המדויק המוגדר תחת התיבה \"זה מקרוב\" לצורך ביצוע מעצר שוטר ללא צו שופט?","ruling":"בית המשפט העליון קבע כי הביטוי מבטא משך זמן מצומצם ביותר.","halacha":"\"זה מקרוב\" נמדד בשעות בודדות בלבד ולא בימים. ברגע שחלפו ימים מאירוע העבירה, פוקעת סמכות השוטר לעצור ללא צו, וחובה לפנות לבית המשפט לקבלת צו מעצר.<p><b>השלמת A2: ההבחנות מן ההליך הצבאי אינן מועברות אוטומטית להליך האזרחי; יש להסתמך על כלל ההוגנות ונטל ההוכחה כפי שנלמדו בקורס.</b></p>","currency":"לא אומת עדכון מעבר למקורות הקורס"},{"name":"אסף שי נגד מדינת ישראל","cite":"ע\"פ 9956/05","facts":"אסף שי נחשד בביצוע עבירת הריגה בתאונת דרכים. במהלך חקירתו בתחנה ביקש להיפגש עם עורך דינו. החוקרים השהו את המפגש שלא כדין, והמשיכו לחקור אותו עד שמסר הודאה מפלילה בכתב.","claimant":"מניעת המפגש עם עורך דינו הייתה בלתי חוקית, פגעה באוטונומיה שלו וזיהמה את החקירה, ולכן יש לפסול את ההודאה מכוח הלכת יששכרוב.","respondent":"ההודאה ניתנה מרצון חופשי והחוקרים היו מוטרדים מדחיפות גביית הגרסה.","question":"מהי נפקות הפגיעה הבלתי חוקית בזכות היסוד של החשוד להיוועץ בעורך דין על קבילות הודאתו בחקירה?","ruling":"בית המשפט העליון פסל את קבילות ההודאה וזיכה את שי מעבירת ההריגה.","halacha":"זכות המפגש וההיוועצות עם עורך דין היא זכות יסוד חוקתית מן המעלה הראשונה. פגיעה בלתי חוקית בזכות זו פוגעת בהגינות ההליך הפלילי ותוביל לפסילת הודאה שנגבתה בעקבותיה.","currency":"לא אומת עדכון מעבר למקורות הקורס"},{"name":"מוצעב אלטויל נגד מדינת ישראל","cite":"בש\"פ 8845/04","facts":"אלטויל נעצר בחשד לביצוע עבירות ביטחון חמורות. בתום החקירה הגישה המדינה הצהרת תובע לפי סעיף 17(ד) וביקשה חמישה ימי מעצר גישור.","claimant":"הצהרת תובע השוללת חירות מנעצר שחקירתו הסתיימה חייבת להתפרש בצמצום דווקני; המדינה אינה מוסמכת להשתמש בימי הגישור להשלמת חקירה אלא רק לניסוח טכני של כתב האישום.","respondent":"מעצר הגישור נועד לגשר על הפער הזמני הנדרש לתובע ללמוד את תיק החקירה המורכב ולנסח את כתב האישום והבקשה למעצר עד תום ההליכים.","question":"מהו גדר סמכותו של בית המשפט בהענקת מעצר גישור לפי סעיף 17(ד), ומהן החובות המוטלות על התביעה בעת מתן הצהרת תובע?","ruling":"בית המשפט העליון תחם את מוסד מעצר הגישור לתכליתו הצרה.","halacha":"הצהרת תובע היא כלי דיוני המיועד אך ורק לגישור על פרק הזמן הדרוש להכנת כתב האישום והבקשה למעצר עד תום ההליכים, ולא נועד להמשך חקירה. בית המשפט מחויב לבחון בקפדנות אם קיימת עילת מעצר לכאורה, ולקצוב את ימי הגישור למינימום הנדרש.","currency":"לא אומת עדכון מעבר למקורות הקורס"},{"name":"שלמה זאדה נגד מדינת ישראל","cite":"בש\"פ 8087/95 — מפי הנשיא אהרן ברק","facts":"זאדה נעצר והועמד לדין בגין עבירות סמים ורכוש חמורות. התביעה ביקשה לעוצרו עד תום ההליכים. זאדה טען כי חומר הראיות מלא בסתירות פנימיות וקשיים במהימנות העדים.","claimant":"בשלב המעצר עד תום ההליכים, בית המשפט מחויב לבחון את מהימנות העדים ואת משקל הראיות; סתירות קשות בחומר החקירה שוללות קיום \"ראיות לכאורה\".","respondent":"בשלב המעצר בית המשפט אינו קובע ממצאי מהימנות או משקל, אלא בוחן רק את הפוטנציאל ההוכחתי הגולמי האצור בחומר החקירה.","question":"מהי הגדרתן המדויקת של \"ראיות לכאורה\" לצורך מעצר עד תום ההליכים, וכיצד על בית המשפט להעריך סתירות ופגמים בחומר הראיות בשלב זה?","ruling":"נקבעה הלכת זאדה המכוננת, המגדירה את מבחן הראיות לכאורה.","halacha":"ראיות לכאורה הן ראיות גולמיות שלגביהן קיים סיכוי סביר שתהפוכנה בסוף ההליך לראיות רגילות שעל פיהן ניתן להרשיע מעבר לספק סביר. בית המשפט אינו קובע מהימנות בשלב זה — רק אם נפער בחומר הראיות \"חור שחור\" או כרסום מהותי היורד לשורש העניין, תישלל קיומן של ראיות לכאורה.","currency":"לא אומת עדכון מעבר למקורות הקורס"},{"name":"עימאד גנימאת נגד מדינת ישראל","cite":"דנ\"פ 2316/95 — מפי הנשיא מאיר שמגר והשופט אהרן ברק","facts":"גנימאת הועמד לדין בגין עבירות רכוש מרובות של גניבת כלי רכב. התביעה ביקשה לעוצרו עד תום ההליכים בטענה שמדובר ב\"מכת מדינה\" המקימה עילת מעצר עצמאית.","claimant":"בעקבות חוק יסוד כבוד האדם וחירותו, חומרת העבירה כשלעצמה או היותה \"מכת מדינה\" אינן מהוות עילת מעצר עצמאית — חובה לבחון את מסוכנותו האישית של הנאשם הספציפי.","respondent":"הפגיעה הרכושית הקשה והיקף התופעה של גניבות רכב מחייבים הגנה על הציבור באמצעות מעצר עד תום ההליכים.","question":"האם חומרת העבירה או היותה \"מכת מדינה\" מקימות עילת מעצר עצמאית עד תום ההליכים, וכיצד משפיע חוק יסוד כבוד האדם וחירותו על דיני המעצרים?","ruling":"בדיון הנוסף נקבעה הלכה חוקתית מכוננת בדיני המעצרים.","halacha":"חומרת העבירה כשלעצמה או היותה \"מכת מדינה\" אינן מהוות עילת מעצר עצמאית. חוק יסוד כבוד האדם וחירותו מחייב לבחון את המסוכנות האישית של הנאשם, וקיימת חובה חוקתית לבחון תמיד חלופת מעצר פחות פוגענית.<p><b>השלמת A2: חומרת עבירה או תיוגה כ\"מכת מדינה\" אינם תחליף לבחינה קונקרטית של מסוכנות וחלופת מעצר.</b></p>","currency":"לא אומת עדכון מעבר למקורות הקורס"},{"name":"מדינת ישראל נגד איבדיוב","cite":"בש\"פ 433/98","facts":"איבדיוב היה נתון במעצר עד תום ההליכים במשך תשעה חודשים מיום הגשת כתב האישום. משפטו התארך עקב בקשות דחייה של הסניגוריה והעומס השיפוטי. בחלוף תשעת החודשים דרש להשתחרר מיד לפי סעיף 61.","claimant":"חלוף תשעת החודשים מקים זכות חוקתית מוחלטת לשחרור ממעצר, ללא קשר לעובדה שהמשפט טרם הסתיים.","respondent":"העיכובים נגרמו בחלקם בעטיו של הנאשם, והמסוכנות הנשקפת ממנו מחייבת את הארכת מעצרו בעליון.","question":"כיצד נמנים תשעת החודשים לשחרור באין הכרעת דין לפי סעיף 61, ומהם השיקולים המנחים את בית המשפט העליון בהארכת מעצר מעבר לתקופה זו?","ruling":"בית המשפט העליון קבע את הלכת איבדיוב, המגדירה את אופן מניין התקופה.","halacha":"תקופת תשעת החודשים נמנית אך ורק מיום הגשת כתב האישום, ואינה כוללת ימי מעצר שקדמו לו; מניין הימים אינו חייב להיות רציף. בחלוף תשעה חודשים נקודת המוצא היא שחרור, והארכת מעצר בעליון תינתן במשורה תוך איזון בין קצב ההליך למסוכנות הנאשם.","currency":"לא אומת עדכון מעבר למקורות הקורס"},{"name":"ילנה מורוזובה נגד מדינת ישראל","cite":"בש״פ 5142/99 — 22.11.1999","facts":"מורוזובה הואשמה ברצח בת זוגה. בהסדר טיעון הורשעה בהריגה ונגזרו עליה 11 שנות מאסר. לאחר שריצתה למעלה משלוש שנות מאסר, הותר לה בערעור לחזור מההודאה והתיק הוחזר למחוזי. נדרשה הכרעה מי מוסמך לדון במעצר וכיצד למנות את התקופות.","claimant":"הסנגוריה ביקשה לכלול גם את שנות המאסר במניין התקופה ולראות בסמכות ההארכה סמכות הנתונה לעליון; כן ביקשה שחרור בחלופה.","respondent":"המדינה הבחינה בין מעצר למאסר, וטענה שיש למנות את ימי המעצר המצטברים בגין אותו כתב אישום, בלי תקופת המאסר.","question":"האם החזרת התיק פותחת תשעה חודשי מעצר חדשים, והאם המאסר שכבר רוּצה נכלל במניין?","reasoning":"דעת הרוב ראתה את המעצר לפני ביטול ההכרעה ולאחריה כמעצר בשל אותו כתב אישום. הגנת החירות ומגבלת הסמכות אינן מאפשרות לאפס את המניין בדרך פרשנית. לצד זאת, מעצר ומאסר כפופים למשטרים שונים ולכן המאסר אינו נספר לצורך מגבלת המעצר.","ruling":"הערר נדחה; ההכרעה העקרונית התקבלה ברוב דעות לפי דעת ביניש.","halacha":"ימי המעצר שלפני ההכרעה מצטרפים לימי המעצר לאחר החזרת התיק. אין איפוס אוטומטי. תקופת המאסר אינה כלולה במניין לצורך זה. צו מעצר שפקע אינו מתחדש מעצמו ונדרשת החלטת מעצר.<p><b>השלמת A2: לאחר שינוי דיוני יש להבחין בין תקופות מעצר לבין תקופת מאסר וליישם את כלל המניין שאומת בחומר הקורס; אין להציג איפוס אוטומטי ללא בסיס.</b></p>","dissent":"קדמי, שאליו הצטרפו מצא וטירקל, תמך בתפיסה של חטיבת דיון חדשה ומניין חדש. זו אינה דעת הרוב.","source":"ילנה מורוזובה נ׳ מדינת ישראל.pdf — בש״פ 5142/99, פסקאות 10–12 לדעת ביניש וההכרעה הסופית","currency":"מוצגת ההלכה בפסק הדין שבמחברת; לא נבדקו שינויים מאוחרים מחוץ למחברת","exam":"מפרידים בין שלושה פרקי זמן: מעצר קודם, מאסר, ומעצר לאחר החזרת התיק. מונים במצטבר את פרקי המעצר, לא את המאסר."},{"name":"אלעוקה נגד מדינת ישראל","cite":"ע״פ 10683/08","facts":"ההליך עסק באמרות חוץ של עד שנמסרו במהלך חקירה ובשאלה אם ניתן להעדיפן על פני עדות שונה בבית המשפט.","claimant":"המערער טען לפסילת האמרות ולפגיעה ברצון החופשי באמצעות תחבולות חקירה.","respondent":"המדינה טענה שהאמרות עומדות בתנאי סעיף 10א ושהתחבולה לא שללה את הרצון החופשי.","question":"מתי ניתן לקבל אמרת חוץ של עד ומה גבולות תחבולת חקירה?","reasoning":"בית המשפט הפריד בין תנאי הקבילות המצטברים של סעיף 10א לבין שאלת המשקל, ובחן אם התחבולה חצתה את גבולות הרצון החופשי והגינות ההליך.","ruling":"הכלל שנלמד הוא שאין די בעצם קיומה של אמרה; יש לעמוד בתנאים המצטברים ולבחון את משקלה ואת נסיבות גבייתה.","halacha":"סעיף 10א דורש הוכחת האמרה, העדת מוסרה והזדמנות לחקירה, ושוני מהותי/הכחשה/אי־זכירה; תחבולה אינה פסולה כשלעצמה.","source":"אלעוקה נ' מדינת ישראל.pdf — ניתוח קבוצה C","currency":"מוצג לפי ניתוח המקור במחברת; לא נטענה קביעה בדבר שינוי מאוחר."},{"name":"חאתם פאיז אלמע׳ארי נגד התביעה הצבאית","cite":"חאתם פאיז אלמע׳ארי נ׳ התביעה הצבאית","facts":"ההליך עסק בהערכת מהימנות ובטענות הנוגעות להתנהלות התביעה.","claimant":"ההגנה תקפה את המשקל שניתן לעדות ואת הגינות ההתנהלות הדיונית.","respondent":"התביעה עמדה על כך שהערכת מהימנות מסורה לערכאה הדיונית ושאין במחדל נטען כדי להביא לתוצאה אוטומטית.","question":"כיצד מעריכים מהימנות ומה משמעותה של טענת חוסר הגינות?","reasoning":"ההערכה נעשית במכלול ובהנמקה; מחדל נבחן לפי השפעתו על ההגנה והוגנות ההליך.","ruling":"אין כלל אוטומטי הפוסל עדות או מבטל הליך; נדרשת בחינה קונקרטית של מהימנות, הסתירות והפגיעה הנטענת.","halacha":"סעיף 53 לפקודת הראיות הוא מסגרת להערכת מהימנות, לצד חובת הגינות התביעה.","source":"חאתם פאיז אלמע'ארי נ' התביעה הצבאית.pdf — ניתוח קבוצה C","currency":"מוצג לפי ניתוח המקור במחברת; לא נטענה קביעה בדבר שינוי מאוחר."},{"name":"יונתן אוריך נגד מדינת ישראל","cite":"דנ״פ 1062/21","facts":"ההליך עסק בחיפוש בטלפון ובחומר מחשב ובטענה שחיפוש מוקדם קדם לבקשת צו.","claimant":"ההגנה טענה שהחיפוש המוקדם פגם בתשתית ובצו וביקשה לבחון את הראיות בהתאם.","respondent":"המדינה טענה שיש לבחון בנפרד את מקור הסמכות ואת הראיות שהופקו מכוח הצו.","question":"כיצד מנתחים חיפוש בטלפון כאשר נטען לחיפוש בלתי חוקי שקדם לצו?","reasoning":"מפרידים בין תפיסת המכשיר, החיפוש המוקדם, תוקף הצו והראיות שהופקו; לאחר מכן מפעילים את האיזונים שנלמדו בדיני החיפוש והפסילה.","ruling":"סעיף 23א מחייב בחינה קונקרטית של מקור הסמכות והיקף החיפוש; תפיסת מכשיר אינה היתר לעיון גורף.","halacha":"חיפוש דיגיטלי דורש מקור סמכות והיקף מוגדר. פגם מוקדם אינו מוכרע אוטומטית אלא נבחן לפי חוקיות הפעולות והאיזונים הראייתיים.","source":"יונתן אוריך נ' מדינת ישראל.pdf — ניתוח קבוצה C","currency":"מוצג לפי ניתוח המקור במחברת; לא נטענה קביעה בדבר שינוי מאוחר."},{"name":"מדינת ישראל נגד רון תורג׳מן","cite":"ע״פ 10994/08 (14.5.2009)","facts":"המדינה ערערה על החלטה שהתירה לפרסם קטעים מתיעוד חזותי של חקירת רון תורג׳מן. במהלך ההליך הושג הסדר טיעון ותורג׳מן הורשע לפני גזר הדין.","claimant":"המדינה טענה שסעיף 13 ממשיך לחול.","respondent":"בקשת הפרסום והשלב הדיוני המאוחר.","question":"האם סעיף 13 חדל לחול לאחר הצגת התיעוד כראיה, וכיצד מופעל שיקול הדעת להתיר פרסום?","ruling":"הערעור התקבל במישור העקרוני: סעיף 13 ממשיך לחול. בנסיבות השלב הדיוני הותר הפרסום ללא דיחוי, בכפוף לאי־חשיפת פרטי קטינים.","halacha":"סעיף 13 חל לאורך ציר הזמן ונדרשת רשות בית המשפט גם לאחר הצגת התיעוד. האיזון תלוי בשלב ההליך, תקינותו, פרטיות, עמדת הנחקר ועניין ציבורי.","exam":"יש להפריד בין תחולת האיסור, שנמשכת, לבין שיקול הדעת להתיר פרסום, המשתנה לפי הנסיבות.","dissent":"","source":"מדינת ישראל נ׳ המשיבים רון תורג׳מן.pdf — ע״פ 10994/08"},{"name":"רשות השידור נגד מדינת ישראל","cite":"בש״פ 4275/07 (17.9.2007)","facts":"לאחר הגשת כתב האישום נגד רומן זדורוב ביקשה רשות השידור היתר לפרסם בכתבה טלוויזיונית קטעים מהתיעוד החזותי של חקירתו במשטרה, לפי סעיף 13 לחוק חקירת חשודים, לפני תחילת פרשת הראיות.","claimant":"עניין ציבורי והבקשה לפרסום תיעוד החקירה.","respondent":"הגנת סעיף 13 על תקינות ההליך, פרטיות וכבוד הנחקרים.","question":"באילו נסיבות יינתן היתר לפרסום תיעוד חזותי או קולי של חקירה למרות איסור סעיף 13?","ruling":"הערעור נדחה; בשלב המוקדם של ההליך לא נמצא חריג המצדיק סטייה מכלל איסור הפרסום.","halacha":"נקודת המוצא היא איסור פרסום ללא רשות בית המשפט. נשקלים תקינות וטוהר ההליך, פרטיות וכבוד הנחקרים; הסכמת הנחקר לבדה אינה מכריעה.","exam":"סעיף 13 אינו מתאיין אוטומטית בשל עניין ציבורי או הסכמה.","dissent":"","source":"רשות השידור נ׳ המשיבים 1. מדינת ישראל.pdf — בש״פ 4275/07"},{"name":"לאוניד לוין נ׳ מדינת ישראל","cite":"דנ״פ 11742/04 (9.5.2005), בעקבות ע״פ 1641/04","facts":"לאחר תאונת דרכים קטלנית נלקחה מלוין דגימת דם לבדיקת שכרות ונמצא אלכוהול בריכוז 132 מ״ג ל־100 סמ״ק דם. נדונו פגמים באופן ביצוע הבדיקה לפי חוק החיפוש.","claimant":"טענות בדבר פגמים בזהות הגורם שהורה על הבדיקה ובהסברים לחשוד.","respondent":"המדינה הסתמכה על תוצאות הבדיקה ועל ראיות נוספות.","question":"מה הדין החל על נטילת דם לצורך בדיקת שכרות ומה משמעותם של פגמים בפרוצדורת חיפוש פנימי?","ruling":"העתירה לדיון נוסף נדחתה. לא נקבעה פסילה אוטומטית בשל כל הפרה, ובנסיבות המקרה היו ראיות נוספות לשכרותו של לוין.","halacha":"בדיקת דם היא חיפוש פנימי ויש לבצעה בהתאם לחוק החיפוש; פגם אינו מוביל בהכרח לפסילה אוטומטית, ונפקותו נבחנת לפי נסיבות המקרה והמסגרת הראייתית.","exam":"יש לזהות את הפגם, המסלול החוקי ונפקותו הראייתית; אין להסיק שכל חריגה פרוצדורלית מובילה לפסילה.","dissent":"","source":"לאוניד לוין נ׳ מדינת ישראל.pdf — דנ״פ 11742/04"}];
const LIMITATIONS_HTML = "\n  \u003cdiv class=\"panel\">\n    \u003cdiv class=\"eyebrow\">שיעור 6 · טענה מקדמית #6 · סעיף 9–10 לחסד\"פ\u003c/div>\n    \u003ch2>⏳ התיישנות — כל מה שצריך לדעת, בפשטות\u003c/h2>\n\n    \u003cp>ההתיישנות היא אחת משבע הטענות המקדמיות (סעיף 149(6) לחסד\"פ), אך יש לה שלושה \"ראשים\" נפרדים לגמרי, שקל להתבלבל ביניהם. זו הסיבה המרכזית ל\"בלגן\": \u003cb>לא מדובר בכלל אחד, אלא בשלושה נושאים שונים תחת אותה כותרת.\u003c/b>\u003c/p>\n\n    \u003cdiv class=\"scenario-row\" style=\"margin-top:16px;\">\n      \u003cspan class=\"verdict ok\">א\u003c/span>\n      \u003cdiv>\u003cb>התיישנות עבירות\u003c/b> — מתי כבר לא ניתן להעמיד לדין בשל חלוף הזמן מביצוע העבירה. זהו הראש המרכזי והמורכב ביותר.\u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"scenario-row\">\n      \u003cspan class=\"verdict ok\">ב\u003c/span>\n      \u003cdiv>\u003cb>התיישנות עבירות מין בקטינים\u003c/b> — כללים מיוחדים שדוחים את תחילת מניין הזמן, כדי לתת לקורבן זמן להתבגר לפני שהשעון \"מתחיל לרוץ\".\u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"scenario-row\">\n      \u003cspan class=\"verdict ok\">ג\u003c/span>\n      \u003cdiv>\u003cb>התיישנות עונשים\u003c/b> — נושא נפרד לגמרי: לא \"האם אפשר להעמיד לדין\", אלא \"האם אפשר עוד לבצע עונש שכבר נגזר\".\u003c/div>\n    \u003c/div>\n\n    \u003c!-- ============ SECTION A ============ -->\n    \u003cdiv class=\"lim-section-badge\">א. התיישנות עבירות — הכלל הבסיסי\u003c/div>\n    \u003cp>\u003cb>הרעיון:\u003c/b> ככל שעובר יותר זמן מביצוע העבירה, כך קשה יותר לברר את האמת (עדים שוכחים, ראיות נעלמות) וגם פוחת הצורך החברתי בענישה. לכן החוק קובע \"תאריך תפוגה\" להעמדה לדין — התלוי בחומרת העבירה.\u003c/p>\n\n    \u003ch3>כמה זמן יש? (סעיף 9 לחסד\"פ)\u003c/h3>\n    \u003cul>\n      \u003cli>\u003cb>פשע שדינו מיתה או מאסר עולם\u003c/b> — 30 שנים\u003c/li>\n      \u003cli>\u003cb>פשע חמור, דינו 7+ שנות מאסר ומנוי בתוספת לחוק\u003c/b> — 15 שנים\u003c/li>\n      \u003cli>\u003cb>פשע \"רגיל\"\u003c/b> (מעל 3 שנות מאסר, לא מהתוספת) — 10 שנים\u003c/li>\n      \u003cli>\u003cb>עוון\u003c/b> (מאסר 3 חודשים עד 3 שנים) — 5 שנים\u003c/li>\n      \u003cli>\u003cb>חטא\u003c/b> (מאסר עד 3 חודשים) — שנה אחת\u003c/li>\n    \u003c/ul>\n\n    \u003cdiv class=\"callout\">\n      \u003cspan class=\"callout-title\">חריג \"טכנולוגי\" — עדות DNA/טביעת אצבע/תצלום\u003c/span>\n      \u003cp>גם אחרי 15 שנה מיום ביצוע העבירה (ולא יותר מ-23 שנה מהמעשה), עדיין ניתן להעמיד חשוד לדין אם: (1) החשוד אותר רק אחרי 15 השנים; וגם (2) יש בידי הרשות ראיה ביומטרית (DNA, טביעת אצבע, או תצלום פנים) שיש בה יסוד סביר להוכיח את זהותו או את קשרו לעבירה.\u003c/p>\n    \u003c/div>\n\n    \u003ch3>עבירות שלעולם לא מתיישנות\u003c/h3>\n    \u003cp>רצח (לרבות בנסיבות מחמירות); עבירות לפי חוק מניעת פשע השמדת עם ולפי חוק עשיית דין בנאצים ובעוזריהם; ניסיון לרצח ראש ממשלה מכהן או קשירת קשר לכך.\u003c/p>\n\n    \u003ch3>מתי מתחיל השעון לרוץ?\u003c/h3>\n    \u003cp>\u003cb>הכלל:\u003c/b> מיום ביצוע העבירה. אם אדם נחקר על כמה עבירות שמהוות \"פרשה\" אחת — היום הקובע הוא יום ביצוע \u003cb>העבירה החמורה מביניהן\u003c/b>.\u003c/p>\n\n    \u003ch3>מה \"עוצר\" את השעון? — \"אירוע מנתק\"\u003c/h3>\n    \u003cp>זהו החלק הכי מבלבל, אז בואו נפשט: בעבירות פשע או עוון, שלושה סוגי אירועים \"מנתקים\" את מרוץ ההתיישנות — \u003cb>הליכי חקירה, הגשת כתב אישום, או הליך מטעם בית המשפט.\u003c/b> כשקורה אחד מהם, מרוץ ההתיישנות \u003cb>נפסק ומתחיל מחדש מאפס\u003c/b> בתום אותו אירוע.\u003c/p>\n\n    \u003cdiv class=\"callout warn\">\n      \u003cspan class=\"callout-title\">דגש למבחן — בעבירת חטא אין בכלל \"אירוע מנתק\"\u003c/span>\n      \u003cp>שימו לב: מושג ה\"אירוע מנתק\" חל \u003cb>רק על עבירות פשע ועוון\u003c/b>. בעבירת \u003cb>חטא\u003c/b>, שעון ההתיישנות של שנה אחת מתחיל ביום ביצוע העבירה ומסתיים בדיוק כעבור שנה — ללא שום קשר לפעולות המשטרה או התביעה. אפילו אם המשטרה חוקרת, מגישה כתב אישום, או שבית המשפט פועל — שום דבר לא \"מאפס\" את השעון בעבירת חטא.\u003c/p>\n    \u003c/div>\n\n    \u003cdiv class=\"callout warn\">\n      \u003cspan class=\"callout-title\">אבל — יש תקרה! (\"התקופה הנוספת\")\u003c/span>\n      \u003cp>אם לא הייתה שום הגבלה, המשטרה הייתה יכולה \"להחיות\" תיק ישן לנצח רק בעצם פתיחת חקירה. לכן החוק קובע תקרה: כאשר האירוע המנתק הוא \u003cb>הליך חקירה\u003c/b>, ההארכה מעבר לתקופת ההתיישנות המקורית (הנספרת מיום ביצוע העבירה) מוגבלת ל\"תקופה נוספת\" בלבד:\u003c/p>\n      \u003cul style=\"margin:10px 0 0;\">\n        \u003cli>פשע שדינו מיתה/מאסר עולם — עד 5 שנים נוספות (תקרה כוללת: 35 שנה מהמעשה)\u003c/li>\n        \u003cli>פשע חמור מהתוספת (15 שנה בסיס) — עד 3 שנים נוספות (תקרה כוללת: 18 שנה מהמעשה)\u003c/li>\n        \u003cli>פשע \"רגיל\" (10 שנה בסיס) — עד 3 שנים נוספות (תקרה כוללת: 13 שנה מהמעשה)\u003c/li>\n        \u003cli>עוון שאינו מהתוספת (5 שנה בסיס) — עד שנתיים נוספות (תקרה כוללת: 7 שנים מהמעשה)\u003c/li>\n      \u003c/ul>\n      \u003cp style=\"margin-top:10px\">\u003ci>שיטת זיכרון מהירה: בכל קטגוריה — לוקחים את מספר השנים הבסיסי ומוסיפים לו את \"התקופה הנוספת\" כדי לקבל את התקרה הסופית.\u003c/i>\u003c/p>\n    \u003c/div>\n\n    \u003cdiv class=\"example-box\">\n      \u003cspan class=\"ex-title\">💡 דוגמה מהמצגת\u003c/span>\n      \u003cp style=\"margin-bottom:10px;\">עבירת פשע \"רגילה\" (4 שנות מאסר, תקופת התיישנות בסיסית של 10 שנים) בוצעה ב-1/2020. התנהל הליך חקירה שהסתיים ב-1/2025.\u003c/p>\n      \u003cdiv class=\"timeline\">\n        \u003cdiv class=\"timeline-step\">\u003cdiv class=\"timeline-date\">1/2020\u003c/div>\u003cdiv class=\"timeline-dot\">\u003c/div>\u003cdiv class=\"timeline-label\">יום ביצוע\u003cbr>העבירה\u003c/div>\u003c/div>\n        \u003cdiv class=\"timeline-line\">\u003c/div>\n        \u003cdiv class=\"timeline-step\">\u003cdiv class=\"timeline-date\">1/2025\u003c/div>\u003cdiv class=\"timeline-dot\">\u003c/div>\u003cdiv class=\"timeline-label\">הליך החקירה\u003cbr>האחרון\u003c/div>\u003c/div>\n        \u003cdiv class=\"timeline-line\">\u003c/div>\n        \u003cdiv class=\"timeline-step\">\u003cdiv class=\"timeline-date\">1/2030\u003c/div>\u003cdiv class=\"timeline-dot\">\u003c/div>\u003cdiv class=\"timeline-label\">10 שנים מהמעשה\u003cbr>(ההתיישנות \"המקורית\")\u003c/div>\u003c/div>\n        \u003cdiv class=\"timeline-line\">\u003c/div>\n        \u003cdiv class=\"timeline-step\">\u003cdiv class=\"timeline-date\">1/2033\u003c/div>\u003cdiv class=\"timeline-dot end\">\u003c/div>\u003cdiv class=\"timeline-label\">התיישנות סופית\u003cbr>(1/2030 + 3 שנים)\u003c/div>\u003c/div>\n      \u003c/div>\n      \u003cp>למרות שהחקירה \"אפסה\" את השעון והחלה תקופה חדשה של 10 שנים מ-1/2025 (שהייתה מגיעה עד 1/2035) — ה\"תקופה הנוספת\" בעבירת פשע רגילה מוגבלת ל-3 שנים \u003cb>מעבר לתאריך ההתיישנות המקורי\u003c/b> (1/2030). לכן ההתיישנות הסופית היא \u003cb>1/2033\u003c/b>, לא 1/2035.\u003c/p>\n    \u003c/div>\n\n    \u003cdiv class=\"callout\">\n      \u003cspan class=\"callout-title\">ואם יש כמה הליכי חקירה ברצף? (הדוגמה הנוספת במצגת)\u003c/span>\n      \u003cp>המצגת מציגה גם תרחיש שבו יש הליך חקירה נוסף מאוחר יותר (למשל ב-1/2031, שהוא כבר בתוך \"התקופה הנוספת\"). במקרה כזה ה\"תקופה הנוספת\" יכולה להתארך שוב באותה לוגיקה — כל עוד לא חורגים מהתקרה שקבע החוק לאותו סוג עבירה, ובכפוף לכך שגורמים מוסמכים אישרו את ההארכה (ראו בהמשך).\u003c/p>\n    \u003c/div>\n\n    \u003cdetails class=\"enrichment\">\u003csummary>הרחבה שאינה לבחינה: הארכת התקופה הנוספת\u003c/summary>\u003cp>\u003cb>המרצה הוציא טבלה זו מהחומר בשיעור 7.\u003c/b> התוכן הקיים נשמר לעיון; לא בוצע כאן אימות פרטני לכל סמכות ומועד.\u003c/p>\n    \u003cp>בתנאי שקיים אינטרס ציבורי להארכה, גורמים בכירים יכולים להאריך את התקופה הנוספת בשלבים, כשכל הארכה מצטרפת לקודמותיה:\u003c/p>\n    \u003cul>\n      \u003cli>\u003cb>ראש אגף החקירות\u003c/b> (או מקביל) — הארכה של עד 6 חודשים בכל פעם\u003c/li>\n      \u003cli>\u003cb>פרקליט מחוז / ראש ענף חקירות\u003c/b> — לצורך השלמת חקירה, הוצאת תעודת חיסיון, שימוע או החלטה בערר: הארכה של עד שנה–שנתיים בכל פעם, תלוי סוג העבירה\u003c/li>\n      \u003cli>\u003cb>היועץ המשפטי לממשלה\u003c/b> — כשיש גם אינטרס ציבורי וגם נסיבות מיוחדות שיירשמו: הארכה מעת לעת, עד תקרה מצטברת של 3–5 שנים (תלוי סוג העבירה)\u003c/li>\n    \u003c/ul>\n\n    \u003c/details>\u003ch3>אילו פרקי זמן פשוט \"לא נספרים\" (מוקפאים, לא מתאפסים)?\u003c/h3>\n    \u003cp>בשונה מ\"אירוע מנתק\" (שמאפס ומתחיל את השעון מחדש), יש פרקי זמן שפשוט \u003cb>לא נכללים במניין\u003c/b> — השעון נעצר ופשוט ממשיך מהנקודה שבה נעצר, בלי לחזור להתחלה:\u003c/p>\n    \u003cul>\n      \u003cli>החשוד נמצא בחו\"ל, או שלא ניתן לאתרו למרות שקידה סבירה של הרשויות\u003c/li>\n      \u003cli>החשוד מתחמק מהליכי חקירה או העמדה לדין\u003c/li>\n      \u003cli>מצבו הרפואי/הנפשי של החשוד או של עד מרכזי אינו מאפשר את קיום ההליך\u003c/li>\n      \u003cli>עד מרכזי בחו\"ל/לא ניתן לאתרו — ובנוסף מתקיים אחד מאלה: יש יסוד להניח שזה בגלל פעולות החשוד; או שמדובר בעבירת טרור/ארגון פשיעה; או שמדובר בפשע חמור (7+ שנים) — ואז ההקפאה מוגבלת ל-3 שנים לכל היותר\u003c/li>\n      \u003cli>בקשת עזרה משפטית ממדינה אחרת\u003c/li>\n      \u003cli>הליכים משפטיים שנוקט החשוד עצמו\u003c/li>\n      \u003cli>חסינות שנתונה לחשוד לפי דין\u003c/li>\n      \u003cli>מיום החתימה על הסדר מותנה ועד תום התקופה שנקבעה לקיום תנאיו (או עד הפרתם/גילוי מרמה)\u003c/li>\n    \u003c/ul>\n\n    \u003ch3>מה קורה בסוף?\u003c/h3>\n    \u003cdiv class=\"scenario-row\">\n      \u003cspan class=\"verdict need\">חלפה ההתיישנות\u003c/span>\n      \u003cdiv>לא ניתן עוד להעמיד לדין על העבירה — הדבר יוביל לביטול כתב האישום.\u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"scenario-row\">\n      \u003cspan class=\"verdict ok\">לא חלפה\u003c/span>\n      \u003cdiv>ניתן להעמיד לדין כרגיל.\u003c/div>\n    \u003c/div>\n\n    \u003c!-- ============ SECTION B ============ -->\n    \u003cdiv class=\"lim-section-badge b\">ב. התיישנות בעבירות מין שנעברו בקטינים\u003c/div>\n    \u003cdiv class=\"callout warn\">\n      \u003cspan class=\"callout-title\">⚠ הוסר מחומר הבחינה — הודעת המרצה בשיעור 7\u003c/span>\n      \u003cp>בפתיחת שיעור 7 הודיע המרצה במפורש כי בשל המורכבות המשפטית ותכיפות שינויי החקיקה בנושא, הוא \u003cb>מסיר לחלוטין את נושא התיישנות עבירות מין בקטינים מחומר החובה של הקורס ומהבחינה המסכמת\u003c/b>. הנושא יילמד בהרחבה בשנה הבאה, בקורס המתקדם \"סדר דין פלילי מהלכה למעשה\". התוכן שלהלן נשאר לעיונכם (לא נבדקה עדכניותו מעבר למקורות המחברת), אך \u003cb>אינו לחומר הבחינה\u003c/b>.\u003c/p>\n    \u003c/div>\n    \u003cp>כאן החוק \"דוחה\" את תחילת מרוץ ההתיישנות הרבה מעבר ליום ביצוע העבירה — כדי לתת לקורבן, שהיה קטין בזמן העבירה, זמן ממשי להתבגר ולבחור להתלונן.\u003c/p>\n\n    \u003ch3>פגיעה בידי בן משפחה או אחראי על הקטין\u003c/h3>\n    \u003cp>מניין ההתיישנות (15 שנה, כדין עבירת מין) \u003cb>מתחיל רק ביום שבו מלאו לקורבן 34 שנים\u003c/b> — ולא ביום ביצוע העבירה.\u003c/p>\n    \u003cdiv class=\"example-box\">\n      \u003cspan class=\"ex-title\">💡 דוגמה\u003c/span>\n      \u003cp>הורה ביצע עבירת אינוס בילדתו כשהייתה בת 16. מרוץ 15 השנים מתחיל רק ביום שבו היא תמלא 34 — כלומר ניתן להעמיד את ההורה לדין \u003cb>עד שהילדה תמלא 49\u003c/b>.\u003c/p>\n    \u003c/div>\n\n    \u003ch3>פגיעה בידי מי שאינו בן משפחה/אחראי (ובן 15+)\u003c/h3>\n    \u003cp>מניין ההתיישנות מתחיל ביום שבו מלאו לקטין \u003cb>33 שנים\u003c/b>.\u003c/p>\n    \u003cdiv class=\"example-box\">\n      \u003cspan class=\"ex-title\">💡 דוגמה\u003c/span>\n      \u003cp>לוי (בן 30) ביצע עבירת אינוס בשכנתו חן, כשהייתה בת 16. ניתן להעמיד את לוי לדין \u003cb>עד שחן תמלא 48\u003c/b> (15 שנה החל מיום שתמלא 33).\u003c/p>\n    \u003c/div>\n\n    \u003ch3>מתי צריך \"תוספת ראייתית\" (חיזוק) כדי להרשיע?\u003c/h3>\n    \u003cp>אם התלונה במשטרה הוגשה \u003cb>גם\u003c/b> אחרי שהקורבן עבר את גיל הסף (28 למשפחה/אחראי, 18 לאחרים) \u003cb>וגם\u003c/b> אחרי שחלפו 15 השנה מיום ביצוע העבירה עצמו — ניתן להרשיע על סמך עדות הקטין בלבד \u003cb>רק אם יש בחומר הראיות דבר לחיזוקה\u003c/b>.\u003c/p>\n\n    \u003cdiv class=\"callout warn\">\n      \u003cspan class=\"callout-title\">אין להתבלבל! מלכודת ניסוח\u003c/span>\n      \u003cp>הניסוח בחוק \"...או... לפי המאוחר\" עלול להישמע כאילו מספיק תנאי אחד. בפועל \u003cb>מדובר בתנאים מצטברים\u003c/b> — צריך גם שחלף גיל הסף וגם שחלפה תקופת ה-15 שנה, כדי שיידרש חיזוק.\u003c/p>\n    \u003c/div>\n\n    \u003cp>\u003cb>עבירה בידי בן משפחה/אחראי\u003c/b> (גיל סף 28):\u003c/p>\n    \u003cdiv class=\"scenario-row\">\u003cspan class=\"verdict need\">נדרש חיזוק\u003c/span>\u003cdiv>עבירה בגיל 13, תלונה בגיל 29 — גם מלאו לקורבן 28 וגם חלפו 15 השנה\u003c/div>\u003c/div>\n    \u003cdiv class=\"scenario-row\">\u003cspan class=\"verdict ok\">אין צורך בחיזוק\u003c/span>\u003cdiv>עבירה בגיל 15, תלונה בגיל 29 — מלאו 28, אך טרם חלפה תקופת ה-15 שנה\u003c/div>\u003c/div>\n    \u003cdiv class=\"scenario-row\">\u003cspan class=\"verdict ok\">אין צורך בחיזוק\u003c/span>\u003cdiv>עבירה בגיל 11, תלונה בגיל 27 — חלפה תקופת ה-15 שנה, אך טרם מלאו לקורבן 28\u003c/div>\u003c/div>\n\n    \u003cp style=\"margin-top:14px;\">\u003cb>עבירה בידי מי שאינו בן משפחה/אחראי\u003c/b> (גיל סף 18):\u003c/p>\n    \u003cdiv class=\"scenario-row\">\u003cspan class=\"verdict need\">נדרש חיזוק\u003c/span>\u003cdiv>עבירה בגיל 8, תלונה בגיל 24 — גם מלאו 18 וגם חלפו 15 השנה\u003c/div>\u003c/div>\n    \u003cdiv class=\"scenario-row\">\u003cspan class=\"verdict ok\">אין צורך בחיזוק\u003c/span>\u003cdiv>עבירה בגיל 10, תלונה בגיל 19 — מלאו 18, אך טרם חלפה תקופת ה-15 שנה\u003c/div>\u003c/div>\n    \u003cdiv class=\"scenario-row\">\u003cspan class=\"verdict ok\">אין צורך בחיזוק\u003c/span>\u003cdiv>עבירה בגיל שנתיים, תלונה בגיל 17 וחצי — חלפה תקופת ה-15 שנה, אך טרם מלאו 18\u003c/div>\u003c/div>\n\n    \u003ch3>הגשת כתב אישום אחרי חלוף 15 השנה מהמעשה\u003c/h3>\n    \u003cp>אם חלפה תקופת ההתיישנות הנמנית \u003cb>מיום ביצוע העבירה עצמה\u003c/b> (15 שנה) — ניתן להגיש כתב אישום רק \u003cb>באישור היועץ המשפטי לממשלה\u003c/b> (גם אם עדיין לא חלפה ההתיישנות \"הדחויה\" הנמנית מגיל 33/34).\u003c/p>\n\n    \u003c!-- ============ SECTION C ============ -->\n    \u003cdiv class=\"lim-section-badge c\">ג. התיישנות עונשים\u003c/div>\n    \u003cp>נושא שונה לגמרי: לא אם ניתן להעמיד לדין, אלא — לאחר שכבר \u003cb>הורשע\u003c/b> הנאשם ונגזר עליו עונש — עד מתי ניתן עוד לבצע את אותו עונש בפועל.\u003c/p>\n\n    \u003ch3>כמה זמן יש לבצע את העונש?\u003c/h3>\n    \u003cul>\n      \u003cli>\u003cb>פשע\u003c/b> — 20 שנים\u003c/li>\n      \u003cli>\u003cb>עוון\u003c/b> — 10 שנים\u003c/li>\n      \u003cli>\u003cb>חטא\u003c/b> — 3 שנים\u003c/li>\n    \u003c/ul>\n    \u003cp>זה חל על עונש שהוטל ולא התחיל בביצועו, וגם על עונש שהופסק ביצועו ולא נמשך.\u003c/p>\n\n    \u003cdiv class=\"callout warn\">\n      \u003cspan class=\"callout-title\">דגש למבחן\u003c/span>\n      \u003cp>בעבירה שאין לה התיישנות (למשל רצח) — \u003cb>גם אין התיישנות על העונש\u003c/b> שהוטל בגינה. עונש מאסר עולם על רצח לעולם לא \"יתיישן\".\u003c/p>\n    \u003c/div>\n\n    \u003ch3>מתי מתחיל השעון?\u003c/h3>\n    \u003cp>מיום שפסק הדין נעשה \u003cb>חלוט\u003c/b> (אין עליו עוד ערעור), או מיום ההפסקה בביצוע העונש — \u003cb>לפי המאוחר מביניהם\u003c/b>.\u003c/p>\n\n    \u003cdiv class=\"callout warn\">\n      \u003cspan class=\"callout-title\">דגש למבחן — התנאי המכריע: \"באשמת מי\" נעצר הביצוע\u003c/span>\n      \u003cp>השעון ממשיך לרוץ \u003cb>רק כאשר\u003c/b> העיכוב או ההפסקה בביצוע העונש אירעו \u003cb>באשמת המדינה או הרשות\u003c/b> — למשל שירות בתי הסוהר שחרר אסיר מוקדם עקב צפיפות או מגפה ולא קרא לו לשוב. לעומת זאת, אם האסיר עצמו נמלט, התחמק, או ברח לחוץ לארץ — פרק הזמן הזה \u003cb>אינו נספר כלל\u003c/b>, והשעון קופא לחלוטין.\u003c/p>\n    \u003c/div>\n\n    \u003ch3>מה לא נספר?\u003c/h3>\n    \u003cp>פרק הזמן שבו מי שהוטל עליו העונש שהה בחו\"ל, או שלא ניתן היה לאתרו בשל התחמקותו מריצוי העונש.\u003c/p>\n\n    \u003cdiv class=\"example-box\">\n      \u003cspan class=\"ex-title\">💡 מקרה אמיתי — יוסי בן ארי, 30 שנה בפרגוואי\u003c/span>\n      \u003cp>בן ארי נידון בשנות ה-90 לתריסר שנות מאסר בעבירות סמים חמורות מסוג פשע. לאחר שריצה 4 שנים בלבד, נמלט מהכלא וברח לפרגוואי, שם חי תחת זהות בדויה כמעט 30 שנה — עד שאותר, נעצר והוחזר לישראל ב-2021. הוא עתר לשחרורו בטענה שחלפו מעל 20 שנה מאז הפסקת ריצוי העונש, ולכן העונש התיישן לפי סעיף 10(א). המדינה השיבה כי לפי סעיף 10(ג), תקופת ההימלטות אינה נספרת כלל. השופט אלכס שטיין דחה את העתירה וקבע: מוסד ההתיישנות נועד להעניק מחילה למי ששהה בקהילה וסבל מחרדת העונש המתמדת — לא למי שנמלט וחי בשקט תחת זהות בדויה.\u003c/p>\n    \u003c/div>\n    \u003cdiv class=\"callout case-callout\">\u003cspan class=\"callout-title\">קשור לפסק דין\u003c/span>\u003cbutton class=\"case-link\" data-case=\"23\">⚖ יוסי בן ארי נגד השר לביטחון פנים (2021)\u003c/button>\u003c/div>\n  \u003c/div>\n";
const MCQ = [{"q":"עבירה שהעונש המרבי עליה הוא בדיוק 3 שנות מאסר מסווגת כ:","opts":["חטא","עוון","פשע","תלוי בבית המשפט הדן בעניין"],"correct":1,"explain":"לפי סעיף 24 לחוק העונשין, \"עוון\" כולל עונש מרבי העולה על 3 חודשים ועד 3 שנים <b>כולל</b>. רק מעל 3 שנים מדובר ב\"פשע\".","id":"mcq-1","topic":"classify","lesson":"1","extra":false},{"q":"מתי רשאית המשטרה שלא לחקור תלונה על עבירת פשע?","opts":["בכל מקרה שבו יש חוסר בכוח אדם","רק באישור פרקליט המחוז","במקרים חריגים שבהם התלונה מופרכת לחלוטין ונעדרת תשתית ראייתית מינימלית (הלכת צדוק)","לעולם לא — חובת החקירה בפשע היא מוחלטת"],"correct":2,"explain":"בהלכת בג\"ץ צדוק נקבע חריג מצומצם: כשאין כל תשתית ראייתית מינימלית וברור שאין יסוד לחשד, המשטרה רשאית להימנע מחקירה גם בעבירת פשע.","id":"mcq-2","topic":"sec59","lesson":"1","extra":false,"source":"שיעור 1.mp3 — הדיון בסעיף 59 ובדוגמת גניבה ממעסיק"},{"q":"מיהו הגורם המכריע בערר על החלטת פרקליט מחוז שלא להעמיד לדין מטעמי מדיניות (נסיבות העניין)?","opts":["פרקליט המדינה","היועץ המשפטי לממשלה","בית המשפט לעניינים מנהליים","מנהל תחום עררים בפרקליטות המדינה"],"correct":1,"explain":"כאשר ההחלטה מבוססת על עילת מדיניות (נסיבות העניין), הערר מוכרע בידי היועץ המשפטי לממשלה. עילה מקצועית (חוסר ראיות/אשמה) מוכרעת בידי פרקליט המדינה.","id":"mcq-3","topic":"appeal","lesson":"3","extra":false},{"q":"לפי המסגרת שלימד המרצה בשיעור 3, איזה נתון מונע הסדר מותנה?","opts":["העבירה מסוג עוון","העונש הצפוי אינו כולל מאסר בפועל","העבירה מסוג פשע","עבר פלילי נקי ב-5 השנים האחרונות"],"correct":2,"explain":"המרצה תחם את ההסדר הנלמד לעבירות חטא ועוון והדגיש שאין להסיק מהיעדר בקשת מאסר שהסיווג של עבירת פשע השתנה.","id":"mcq-4","topic":"conditional","lesson":"3","extra":false,"source":"שיעור 3.mp3 — הסבר המרצה על סגירת תיק בהסדר, תנאי הסף והעיון לפני חתימה"},{"q":"שני שותפים הועמדו לדין בכתבי אישום נפרדים. לפי בג״ץ 11339/05, האם סיום משפטו של העד הוא תנאי גורף להעדתו?","opts":["כן, בכל מקרה","לא; ככלל ניתן להעידו, ודחייה עד לסיום משפטו היא חריגה ומנומקת","כן, אלא אם הנאשם הודה","לא ניתן להעיד שותף לעולם"],"correct":1,"explain":"בוטל החסם הגורף של הלכת קנזי. הושארה אפשרות לדחייה במקרים חריגים ביותר ומטעמים שיירשמו.","id":"mcq-5","topic":"kanzi","source":"מדינת ישראל נ׳ בית המשפט המחוזי באר שבע 11339-05.pdf — ההכרעה הסופית ודעת הנשיאה ביניש, פסקה 3","lesson":"3","extra":false},{"q":"מהי המלכודת בהחלת הלכת קנזי ההיסטורית על כל מקרה של עדות שותף?","opts":["התעלמות מהשינוי בבג״ץ 11339/05 ומההבחנה בין משפטים נפרדים למשותפים","הכלל חל רק על עבירות חטא","ביטול החסם הופך כל עדות למהימנה","משפט נפרד הוא תמיד כתב אישום משותף"],"correct":0,"explain":"יש להפריד בין הדין ההיסטורי, הכלל המאוחר והמסלול הדיוני. הסרת החסם אינה קביעה שכל עדות שותף מהימנה.","id":"mcq-6","topic":"kanzi","source":"מדינת ישראל נ׳ בית המשפט המחוזי באר שבע 11339-05.pdf — ההכרעה הסופית ודעת הנשיאה ביניש, פסקה 3","lesson":"3","extra":false},{"q":"מה ההבדל בין תיקון כתב אישום לפני ההקראה לבין תיקון לאחריה?","opts":["אין הבדל — התובע תמיד צריך אישור שופט","לפני ההקראה התובע מתקן בחופשיות; אחריה נדרשת בקשה רשמית ואישור שהנאשם קיבל הזדמנות סבירה להתגונן","לפני ההקראה נדרש אישור היועמ\"ש; אחריה התובע חופשי","התיקון אפשרי רק אחרי ההקראה"],"correct":1,"explain":"לפני תחילת המשפט התובע הוא הבעלים הבלעדי של כתב האישום. לאחר ההקראה, כל תיקון טעון בקשה רשמית ואישור שניתנה לנאשם הזדמנות סבירה להתגונן מפני השינוי.","id":"mcq-7","topic":"amend","lesson":"4","extra":false},{"q":"נאשם הודה בעובדות כתב האישום, אך אין בהן כדי להרשיע, והתביעה מבקשת לחזור בה מהאישום. מה התוצאה?","opts":["הרשעה אוטומטית","זיכוי מוחלט, ברשות בית המשפט","ביטול כתב האישום בלבד, ללא זיכוי","התיק ממשיך כרגיל"],"correct":1,"explain":"כאשר ההודאה אינה מספיקה להרשעה, התביעה רשאית לחזור מהאישום ברשות בית המשפט, והתוצאה היא זיכוי מוחלט.","id":"mcq-8","topic":"withdraw","lesson":"4","extra":false},{"q":"מתי חלה זכות העיון בחומר חקירה לפי סעיף 74?","opts":["מרגע פתיחת החקירה, לכל עבירה","רק בעבירות חטא","עם הגשת כתב האישום, ורק בעבירות פשע ועוון","רק לאחר תחילת שמיעת הראיות"],"correct":2,"explain":"זכות העיון קמה עם הגשת כתב האישום, וחלה רק בעבירות מסוג פשע או עוון — לא בעבירות חטא כגון תעבורה פשוטה.","id":"mcq-9","topic":"review","lesson":"5","extra":false},{"q":"התביעה סירבה לחשוף חומר חסוי, ובית המשפט הורה על חשיפתו. מה אינה אחת משלוש האפשרויות העומדות בפני המדינה?","opts":["לחשוף את החומר לנאשם","להמשיך במשפט בלי להשתמש בחומר כראיה","לבקש מבית המשפט להאריך את מעצר הנאשם","לחזור מכתב האישום כדי להגן על מקור מודיעיני"],"correct":2,"explain":"שלוש האפשרויות הן: לחשוף, להמשיך בלי להשתמש בחומר כראיה, או לחזור מכתב האישום. הארכת מעצר אינה קשורה לדילמת החשיפה.","id":"mcq-10","topic":"review","lesson":"5","extra":false},{"q":"מהם ארבעת התנאים המצטברים לוויתור על הקראת כתב האישום בקול רם?","opts":["הנאשם משלם קנס, מודה ומוותר על סנגור","ייצוג על ידי סנגור, הצהרת הסנגור שהקריא או הסביר את כתב האישום, אישור הנאשם בפני בית המשפט, ואישור בית המשפט לוויתור","הודאה בכתב בלבד ואישור התביעה","בקשה בעל־פה של התובע ללא נוכחות הנאשם"],"correct":1,"explain":"ארבעת התנאים המצטברים: הנאשם מיוצג בידי סנגור; הסנגור מצהיר שהקריא או הסביר לנאשם את כתב האישום; הנאשם מאשר את הוויתור בפני בית המשפט; ובית המשפט מאשר את הוויתור לאחר שבחן שהנאשם מבין את משמעותו.","id":"mcq-11","topic":"reading","lesson":"5","extra":false},{"q":"מהי דוקטרינת הפסילה הראייתית הנהוגה בישראל (הלכת יששכרוב)?","opts":["פסילה אוטומטית של כל ראיה שהושגה שלא כדין (\"פירות העץ המורעל\")","פסילה פסיקתית יחסית — שיקול דעת לפי איזון אינטרסים","אין פסילה בישראל בשום מקרה","פסילה רק בעבירות ביטחון"],"correct":1,"explain":"בניגוד לדוקטרינה האמריקאית הקטגורית, בישראל נקבעה בהלכת יששכרוב פסילה פסיקתית יחסית: שיקול דעת של בית המשפט לפי איזון אינטרסים, לא פסילה אוטומטית.","id":"mcq-12","topic":"packer","lesson":"1","extra":false},{"q":"על פי סעיף 184 לחסד״פ, אילו תנאים מצטברים הדגיש המרצה להרשעה בעבירה אחרת שהתגלתה מן העובדות?","opts":["שהעבירה האחרת חמורה יותר ושנמסרה הודעה לתביעה","הזדמנות סבירה להתגונן; ואיסור להטיל עונש חמור מזה שהיה אפשר להטיל בעבירה המקורית","הסכמת הנאשם בלבד","שהעבירה האחרת הופיעה מראש בכתב האישום"],"correct":1,"explain":"בשיעור 1 הוצגו שני תנאים מצטברים: הזדמנות סבירה להתגונן, והגבלת חומרת העונש. בפרשת דמיאניוק המוקד היה בתנאי הראשון.","id":"mcq-13","topic":"sec184","lesson":"1","extra":false,"source":"שיעור 1.mp3 — סעיף 184"},{"q":"מה קורה כאשר בית המשפט המחוזי מוסמך לדון בנאשם אחד מתוך כתב אישום משותף, ואילו נאשם אחר מואשם רק בעבירות שבסמכות בית משפט השלום?","opts":["התיק כולו מפוצל אוטומטית לשני בתי משפט","המחוזי רוכש סמכות \"נגררת\" לדון גם בנאשם השני (הלכת סוסן)","הנאשם השני זכאי לזיכוי אוטומטי","יש צורך באישור היועמ\"ש לדיון משותף"],"correct":1,"explain":"הלכת סוסן קובעת שכאשר למחוזי סמכות עניינית לגבי נאשם אחד בכתב אישום משותף, הוא רוכש סמכות נגררת לדון גם ביתר הנאשמים, למניעת פיצול הליכים.","id":"mcq-14","topic":"joinder","lesson":"4","extra":false},{"q":"מהי \"עילת הזהב\" מבין עילות סגירת התיק לפי סעיף 62?","opts":["חוסר ראיות מספיקות","נסיבות העניין בכללותן","חוסר אשמה — מביאה למחיקה מוחלטת ומיידית של הרישום","חוסר סמכות עניינית"],"correct":2,"explain":"עילת חוסר אשמה נחשבת \"עילת הזהב\" משום שהיא מביאה למחיקה מוחלטת ומיידית של הרישום המשטרתי, בשונה משתי העילות האחרות שמותירות רישום פנימי.","id":"mcq-15","topic":"closure","lesson":"2","extra":false},{"q":"בעבירת פשע רגילה, מהו תפקיד \"התקופה הנוספת\" לפי ההסבר בשיעור 7?","opts":["היא חלה על כל אירוע מנתק ללא הבחנה","היא רלוונטית רק כאשר האירוע המנתק הוא פעולת חקירה","היא מבטלת כל התיישנות בעבירות פשע","היא חלה רק לאחר גזר הדין"],"correct":1,"explain":"המרצה הדגיש שהמנגנון נוגע לאירוע מנתק מסוג פעולת חקירה בלבד, ולא לכתב אישום או להליך מטעם בית המשפט. טבלת ההארכות עצמה הוצאה מחומר הבחינה.","id":"mcq-16","topic":"limitations-pointer","lesson":"6","extra":false,"source":"שיעור 7 ערוך.mp3 — דברי המרצה בתחילת הדיון בהתיישנות"},{"q":"איזו קביעה תואמת את ההנחיה המפורשת בשיעור 7 לגבי בחינה?","opts":["יש ללמוד את טבלת ההארכות בעבירות מין בקטינים","נושא התיישנות עבירות המין בקטינים וטבלת ההארכות אינם חלק מחומר הבחינה","אין התיישנות לעבירות מין בקטינים בכל מצב","התיישנות עבירות מין בקטינים נלמדת רק בשיעור 8"],"correct":1,"explain":"המרצה הורה להתעלם מן השקפים בנושא זה לצורך הבחינה ולהוציא גם את טבלת ההארכות מחומר הלימוד.","id":"mcq-17","topic":"limitations-pointer","lesson":"6","extra":false,"source":"שיעור 7 ערוך.mp3 — דברי המרצה בתחילת הדיון בהתיישנות"},{"q":"נאשם ערער על חומרת עונשו בלבד (המדינה לא ערערה). בערעור התגלה שביצע עבירה חמורה יותר מזו שהורשע בה. מה רשאי בית המשפט שלערעור לעשות?","opts":["להרשיע בעבירה החמורה ולהחמיר בעונש כרצונו","להרשיע בעבירה החמורה (סעיף 216), אך לא להחמיר בעונש מעבר למה שנגזר במקור","לא לגעת בתיק כלל, כי הנאשם הוא היחיד שערער","לבטל את כתב האישום אוטומטית"],"correct":1,"explain":"סעיף 216 מתיר הרשעה בעבירה שהתגלתה מהעובדות, ובלבד שניתנה הזדמנות סבירה להתגונן. אך סעיף 217 קובע שבערעור שהגיש הנאשם על חומרת העונש, בית המשפט לא יחמיר — ההחמרה אפשרית רק אם המדינה ערערה על קולת העונש.","id":"mcq-18","topic":"appeals","lesson":"8","extra":false},{"q":"מהו ההבדל בין טענת \"סיכון כפול\" לטענת \"כבר נשפטתי\" לפי סעיף 5 לחסד\"פ?","opts":["אין הבדל, מדובר באותה טענה","\"כבר נשפטתי\" מבוססת על מעשה בית-דין; \"סיכון כפול\" מבוססת על כך שאין להעמיד אדם פעמיים בסיכון הרשעה, גם אם ההליך הקודם לא הסתיים בפסק דין","\"סיכון כפול\" חלה רק בעבירות מס","\"כבר נשפטתי\" חלה רק בערעור"],"correct":1,"explain":"טענת \"כבר נשפטתי\" (סעיף 5) דורשת זיכוי או הרשעה קודמים בפועל (מעשה בית-דין). טענת \"סיכון כפול\" רחבה יותר עקרונית אך נדירה מאוד בפועל — היא נטענת כשההליך הקודם הופסק באמצע בלי שהסתיים בפסק דין, ובתי המשפט תמיד דחו אותה לגופה עד כה.","id":"mcq-19","topic":"double-jeopardy-justice","lesson":"6","extra":false},{"q":"עבירת חטא בוצעה ב־1.1.2023. בהנחה שאין תקופה שיש לגרוע מהמניין, מהו המועד כעבור שנת ההתיישנות הבסיסית?","opts":["1.1.2024","1.1.2025","1.8.2024","אין התיישנות לחטא"],"correct":0,"explain":"שנה מ־1.1.2023 היא 1.1.2024. לפי ההסבר בשיעור 7, פעולת חקירה אינה מאפסת את מניין ההתיישנות בחטא.","id":"mcq-20","topic":"limitations-pointer","source":"שיעור 7 ערוך.mp3 — דברי המרצה בתחילת הדיון בהתיישנות","lesson":"6","extra":false},{"q":"בכתב אישום אחד נגד שני נאשמים, אחד הודה והאחר כופר. מהו הכלל שנלמד בשיעור 7?","opts":["גוזרים מיד את דינו של המודה","לא גוזרים את דין המודה לפני סיום בירור משפטו של מי שלא הודה","מוחקים את כתב האישום נגד מי שהודה","מפצלים תמיד את כתב האישום"],"correct":1,"explain":"סעיף 155 הוצג בהקלטה ככלל של דחיית גזר הדין של מי שהודה עד לסיום בירור משפטם של מי שלא הודו. ההסבר שניתן: לאפשר לבית המשפט לראות את התמונה הכוללת ואת חלקו של כל נאשם.","id":"mcq-21","topic":"multi-defendants","lesson":"7","extra":false,"source":"שיעור 7 ערוך.mp3 — דברי המרצה"},{"q":"חשוד הועמד לדין בעבירה שעונשה המרבי 3 שנות מאסר בדיוק, במסגרת כתב אישום משותף עם נאשם נוסף שהעבירה שיוחסה לו היא בסמכות המחוזי. איזה בית משפט ידון בעניינו של הראשון?","opts":["בית משפט השלום בלבד, כי עבירתו היא עוון","בית המשפט המחוזי, מכוח סמכות נגררת (הלכת סוסן)","יש לפצל את הדיון בין שני בתי המשפט","אין לבית משפט כלשהו סמכות לדון בו"],"correct":1,"explain":"עבירה בעונש מרבי של בדיוק 3 שנים מסווגת כעוון (סעיף 24), הנתון עקרונית לסמכות השלום. אך מכוח הלכת סוסן, כשלמחוזי סמכות עניינית לגבי נאשם אחד בכתב אישום משותף, הוא רוכש סמכות נגררת לדון גם בנאשם השני — גם אם עבירתו הפרטנית בסמכות השלום.","id":"mcq-22","topic":"joinder","lesson":"4","extra":false},{"q":"חשוד נחקר וזוכה בעבר מעבירת גניבה מסוימת. כעבור שנתיים מתגלות ראיות חדשות, והתביעה מבקשת להעמידו לדין שוב על אותה גניבה בדיוק. מה הדין?","opts":["מותר, כי יש ראיות חדשות","אסור — סעיף 5 לחסד\"פ אוסר דיון חוזר על מעשה שממנו זוכה, למעט חריג מצומצם של מוות מאוחר לקורבן","מותר רק באישור היועמ\"ש","אסור לחלוטין, ואף לא ניתן לפתוח חקירה חדשה בעתיד על עבירה אחרת"],"correct":1,"explain":"סעיף 5 לחסד\"פ קובע איסור עקרוני לדון באדם על מעשה שממנו כבר זוכה, כטענה מקדמית עצמאית — ללא קשר לגילוי ראיות חדשות. החריג היחיד הוא מקרה מוות מאוחר של הקורבן.","id":"mcq-23","topic":"double-jeopardy-justice","lesson":"6","extra":false},{"q":"טרם הוגש כתב אישום והוצע לחשוד הסדר מותנה. מדוע יש לאפשר לו עיון בחומר החקירה ובטיוטת האישום?","opts":["כדי שיוכל להחליט באופן מושכל אם להסכים להסדר ולהודות בעובדות","משום שכל חשוד זכאי תמיד לכל תיק החקירה מיד עם פתיחתו","משום שכבר הורשע בבית המשפט","אין לו אפשרות לעיין לפני החתימה בשום מקרה"],"correct":0,"explain":"זו זכות עיון במסגרת ההסדר המוצע לפני אישום, שנועדה לאפשר בחינה של הראיות וההסכמה. אין לבלבל אותה עם העיון הרגיל של נאשם לאחר הגשת אישום לפי סעיף 74. השאלה הקודמת הציעה מסלול תקיפה שלא אומת והוחלפה.","id":"mcq-24","topic":"conditional","lesson":"3","extra":false,"source":"שיעור 3.mp3 — הסבר המרצה על סגירת תיק בהסדר, תנאי הסף והעיון לפני חתימה"},{"q":"מה משותף לסעיף 167 לחסד\"פ (הבאת ראיות מיוזמת בית המשפט) ולהלכת יששכרוב (פסילת ראיות)?","opts":["שניהם עוסקים בסמכות מעצר","שניהם דוגמאות למתח בין חשיפת האמת/יעילות לבין זכויות והגינות ההליך, ומעניקים לבית המשפט שיקול דעת ולא כלל נוקשה","אין ביניהם שום קשר","שניהם חלים רק בבית המשפט העליון"],"correct":1,"explain":"סעיף 167 מבטא נסיגה אינקוויזיטורית לטובת חשיפת האמת, ופסילה פסיקתית יחסית (יששכרוב) מבטאת איזון בין מיגור פשיעה להליך ראוי — בשני המקרים לבית המשפט שיקול דעת רחב, לא כלל אוטומטי.","id":"mcq-25","topic":"adversarial","lesson":"1","extra":false},{"q":"פרקליט המחוז החליט לחרוג מחלוקת העבודה הרגילה בין הפרקליטות לתביעה המשטרתית (סעיף 60(ו)). כעבור זמן, במהלך המשפט, מבקשת התביעה לתקן את כתב האישום כדי להוסיף עבירה חמורה יותר. מה משותף לשני המצבים מבחינת תוצאת החריגה?","opts":["שניהם פוסלים אוטומטית את ההליך","בשניהם יש לבחון את תנאי הדין ואת הפגיעה בהגנה; לא כל חריגה טכנית מבטלת את ההליך","שניהם דורשים אישור בית המשפט העליון","אין ביניהם שום קשר עקרוני"],"correct":1,"explain":"בשני המקרים החוק מאפשר גמישות (חריגה מחלוקת עבודה; תיקון כתב אישום), ובשניהם המבחן המכריע הוא אם נגרם עיוות דין/נפגעה הזדמנות סבירה להתגונן — לא פגם טכני כשלעצמו.","id":"mcq-26","topic":"amend","lesson":"4","extra":false,"source":"חוק סדר הדין הפלילי [נוסח משולב] תשמ\"ב-1982 — סעיף 60(ו)"},{"q":"מהו ההבדל המהותי בין \"עיכוב\" ל\"מעצר\" לפי חוק המעצרים?","opts":["אין הבדל, אלו מונחים נרדפים","עיכוב הוא הגבלת חירות קלה ומתוחמת בזמן/במקום; מעצר הוא שלילת חירות מלאה","עיכוב חל רק על עדים, מעצר חל רק על חשודים","עיכוב דורש צו שופט, מעצר לא"],"correct":1,"explain":"עיכוב הוא הגבלה קלה ומתוחמת (לבירור/חקירה במקום, עד 3 שעות ובנסיבות מסוימות 6 שעות), בעוד מעצר הוא שלילת חירות מלאה. כלל הברזל: לא ייעצר אדם אם ניתן להסתפק בעיכוב.","id":"mcq-27","topic":"arrest-basics","lesson":"extra","extra":true},{"q":"שוטר רוצה לעצור חשוד ללא צו שופט לפי סעיף 23(א) לחוק המעצרים. אילו תנאים נדרשים במצטבר?","opts":["חשד סביר בלבד, ללא צורך בעילה נוספת","יסוד סביר לחשד שהאדם עבר עבירה שאינה חטא, וגם התקיימות עילת מעצר סטטוטורית (למשל חשש לשיבוש הליכים)","אישור בעל פה מהתובע התורן בלבד","רק אם העבירה היא פשע חמור"],"correct":1,"explain":"סעיף 23(א) דורש שני תנאים מצטברים: (1) יסוד סביר לחשד בעוון/פשע (לא חטא), וגם (2) עילת מעצר סטטוטורית — כגון חשש לשיבוש הליכים, סכנה לציבור, או חזקת מסוכנות.","id":"mcq-28","topic":"arrest-nowarrant","lesson":"extra","extra":true},{"q":"מהי תכליתו של \"מעצר גישור\" לפי סעיף 17(ד) לחוק המעצרים?","opts":["לאפשר לתביעה להמשיך בחקירה עוד מספר ימים","לגשר על פרק הזמן הדרוש לניסוח כתב האישום והבקשה למעצר עד תום ההליכים, ולא להמשך חקירה","להאריך את המעצר ללא הגבלת זמן","לאפשר לחשוד להתייעץ עם משפחתו"],"correct":1,"explain":"מעצר גישור (עד 5 ימים) נועד אך ורק לגישור על הזמן הדרוש להכנת כתב האישום ובקשת המעצר עד תום ההליכים — לא להמשך חקירה (הלכת אלטויל), והוא כפוף לתקרת ימי המעצר הרגילה.","id":"mcq-29","topic":"arrest-bridge","lesson":"extra","extra":true},{"q":"מהי ההגדרה המקובלת ל\"ראיות לכאורה\" הנדרשות למעצר עד תום ההליכים (הלכת זאדה)?","opts":["ראיות שמוכיחות אשמה מעבר לספק סביר, כמו בהרשעה","ראיות גולמיות שקיים לגביהן סיכוי סביר שיהפכו בסוף ההליך לראיות שעל בסיסן ניתן להרשיע, מבלי שבית המשפט קובע מהימנות בשלב זה","כל מסמך שהוגש על ידי התביעה, ללא בחינה","עדות של שוטר אחד בלבד, תמיד מספיקה"],"correct":1,"explain":"הלכת זאדה (השופט ברק) קבעה שראיות לכאורה הן ראיות גולמיות בעלות סיכוי סביר להפוך לראיות מרשיעות — בית המשפט אינו קובע מהימנות בשלב המעצר, אלא אם נפער \"חור שחור\" מהותי בחומר הראיות.","id":"mcq-30","topic":"arrest-pending","lesson":"extra","extra":true},{"q":"נאשם בעבירת רכוש חמורה (לא אלימות) מתבקש להיעצר עד תום ההליכים רק בשל חומרת העבירה וריבוי מקרים דומים (\"מכת מדינה\"). האם די בכך?","opts":["כן, חומרת העבירה וההיקף התופעתי מספיקים כעילת מעצר עצמאית","לא — לפי הלכת גנימאת, חומרת העבירה כשלעצמה אינה עילת מעצר עצמאית; יש לבחון מסוכנות אישית וחלופת מעצר","כן, אך רק אם מדובר בעבירת ביטחון","לא, אין כלל אפשרות לעצור בעבירות רכוש"],"correct":1,"explain":"הלכת גנימאת (דיון נוסף, שמגר וברק) קבעה שחומרת העבירה או היותה \"מכת מדינה\" אינן עילת מעצר עצמאית — חובה חוקתית לבחון את מסוכנותו האישית של הנאשם הספציפי ואת קיומה של חלופת מעצר.","id":"mcq-31","topic":"arrest-pending","lesson":"extra","extra":true},{"q":"נאשם נתון במעצר עד תום ההליכים 9 חודשים מאז הגשת כתב האישום, וטרם ניתנה הכרעת דין. מה הדין?","opts":["הוא ממשיך להיות עצור ללא הגבלה עד תום המשפט","קמה לו זכות עקרונית לשחרור לפי סעיף 61, אלא אם שופט עליון מאריך את המעצר (בד\"כ בפרקי זמן של 90 יום)","הוא משתחרר אוטומטית ולא ניתן להאריך בשום מקרה","הספירה מתחילה מיום המעצר הראשוני, גם אם קדם להגשת כתב האישום"],"correct":1,"explain":"סעיף 61 קובע שחלוף 9 חודשים ממעצר לאחר כתב אישום ללא הכרעת דין מקים זכות עקרונית לשחרור — אך שופט עליון (בהלכת איבדיוב, המונה מיום הגשת כתב האישום בלבד) רשאי להאריך, בדרך כלל בפרקי זמן של 90 יום.","id":"mcq-32","topic":"arrest-release","lesson":"extra","extra":true},{"q":"במעצר עד תום ההליכים, מה קורה אם הנאשם אינו מיוצג ואינו מוותר על ייצוג?","opts":["בית המשפט יכול לעצור אותו ללא הגבלת זמן עד שימצא סנגור בעצמו","ניתן לעצור לתקופות של עד 7 ימים בכל פעם ועד 30 יום סה\"כ, שבמהלכם ימונה סנגור מטעם הסנגוריה הציבורית","המשפט לא יכול להתחיל כלל","התנאי של ייצוג אינו רלוונטי למעצר עד תום ההליכים"],"correct":1,"explain":"ייצוג הוא אחד מארבעת התנאים המצטברים למעצר עד תום ההליכים (סעיף 21). נאשם שאינו מיוצג ואינו מוותר — ניתן לעצור עד 7 ימים בכל פעם, עד 30 יום סה\"כ, שבמהלכם תמונה לו סנגוריה ציבורית.","id":"mcq-33","topic":"arrest-pending","lesson":"extra","extra":true},{"q":"מהו רף ההוכחה הנדרש במשפט האזרחי לעומת המשפט הפלילי?","opts":["זהה בשני המקרים — מעבר לספק סביר","אזרחי: מאזן הסתברויות (מעל 50%, הלכה: 51%). פלילי: מעבר לספק סביר, ללא מספר מוגדר בפסיקה","אזרחי: מעבר לספק סביר. פלילי: מאזן הסתברויות","אין רף הוכחה קבוע באף אחד מהמקרים"],"correct":1,"explain":"במשפט האזרחי הרף הוא מאזן ההסתברויות (מעל 50%, עם הלכה המצמידה את המספר 51%). במשפט הפלילי הרף הוא מעבר לכל ספק סביר — מבחן איכותי, ללא אחוז מוגדר בפסיקה.","id":"mcq-34","topic":"circles","lesson":"1","extra":false},{"q":"מה חייב להיכלל בפרק העובדות בכתב האישום, ומה אסור לכלול בו?","opts":["עובדות בלבד; אסור לצרף ראיות גולמיות או עדויות","רק סעיפי החוק הרלוונטיים","רשימת כל הראיות שבידי התביעה","תמצית טיעוני הסנגור מראש"],"correct":0,"explain":"פרק העובדות בכתב האישום (סעיף 85) כולל תיאור עובדתי של העבירה בלבד. חל איסור מוחלט לצרף אליו ראיות גולמיות או עדויות — אלו יובאו בנפרד במהלך המשפט.","id":"mcq-35","topic":"structure","lesson":"4","extra":false},{"q":"מתי הופך אדם ממעמד \"חשוד\" למעמד \"נאשם\"?","opts":["ברגע שהוא נעצר לראשונה","ברגע שהוגש נגדו כתב אישום רשמית למזכירות בית המשפט","ברגע שהתביעה מחליטה להעמידו לדין, גם אם טרם הוגש כתב אישום","רק לאחר תשובתו לכתב האישום"],"correct":1,"explain":"המעבר ממעמד חשוד למעמד נאשם הוא פעולה טכנית וברורה: ברגע שכתב האישום מוגש רשמית למזכירות בית המשפט, הוא הופך מיידית ל\"נאשם\" — לא לפני כן.","id":"mcq-36","topic":"defendant","lesson":"5","extra":false},{"q":"נאשם נשאל לתשובתו לכתב האישום ובחר לשתוק, בלי לכפור ובלי להודות. מה המשמעות הראייתית?","opts":["השתיקה חסרת כל משמעות ראייתית","השתיקה עשויה לשמש חיזוק לראיות התביעה","השתיקה שקולה להודאה מלאה בעובדות","השתיקה מחייבת זיכוי אוטומטי"],"correct":1,"explain":"לפי סעיף 152, הימנעות מהשבה לאישום (שתיקה) עשויה לשמש חיזוק למשקל ראיות התביעה — אף שאינה שקולה להודאה, ואינה חסרת משמעות ראייתית.","id":"mcq-37","topic":"defendant-response","lesson":"6","extra":false},{"q":"מהי תכלית ה\"הסכמה בדבר עובדות וראיות\" לפי סעיף 144 לחסד\"פ?","opts":["לחייב את הנאשם להודות בכל האישומים","לחסוך זימון עדים טכניים לעובדות ומסמכים שאינם שנויים במחלוקת, ולמקד את הדיון בליבת המחלוקת","לבטל את זכות הנאשם לחקור עדי תביעה","להחליף לחלוטין את שלב הראיות במשפט"],"correct":1,"explain":"סעיף 144 מאפשר לצדדים המיוצגים להסכים על עובדות או קבילות מסמכים/מוצגים שאינם שנויים במחלוקת מהותית — כך נחסך זימון עדים טכניים (כגון שוטר שערך דוח), והדיון מתמקד בשאלות האמיתיות השנויות במחלוקת.","id":"mcq-38","topic":"reading","lesson":"5","extra":false},{"q":"מהי המשמעות של טענת \"אין להשיב לאשמה\" בסיום פרשת התביעה?","opts":["הנאשם מודה בעובדות","הטענה היא שהתביעה לא הוכיחה אפילו לכאורה את רכיבי העבירה","היא מחייבת את התביעה לסכם בכתב","היא מבטלת אוטומטית את כתב האישום"],"correct":1,"explain":"כך הוצגה הטענה בשיעור. המרצה אף הזהיר מהשיקול האסטרטגי בהעלאתה: אם תידחה, השופט כבר קבע שקיימת תשתית ראשונית.","id":"mcq-39","topic":"trial-conduct","lesson":"7","extra":false,"source":"שיעור 7 ערוך.mp3 — דברי המרצה"},{"q":"נאשם בחר להעיד בפרשת ההגנה. מהו סדר העדות שנלמד בשיעור 7?","opts":["הוא רשאי להעיד רק אחרי כל עדי ההגנה","עדותו נשמעת תחילה בפרשת ההגנה","הוא חייב להעיד בפרשת התביעה","אסור לו להעיד במשפטו"],"correct":1,"explain":"המרצה הסביר שהנאשם שמעיד עושה זאת תחילה בפרשת ההגנה, כדי שלא יתאים בדיעבד את גרסתו לעדי הגנה ששמע לפניו.","id":"mcq-40","topic":"trial-conduct","lesson":"7","extra":false,"source":"שיעור 7 ערוך.mp3 — דברי המרצה"},{"q":"מהם שלושת שלבי קביעת העונש לפי סעיפים 40ג–40טו לחוק העונשין?","opts":["קביעת עונש מקסימלי בלבד, ללא שלבים נוספים","(1) קביעת מתחם עונש הולם, (2) אפשרות חריגה ממנו לקולא/לחומרא, (3) קביעת העונש הסופי בתוך המתחם","רק בחינת עברו הפלילי של הנאשם","הכרעה לפי שיקול דעת שרירותי של השופט בלבד"],"correct":1,"explain":"שלושת השלבים: (1) קביעת מתחם עונש הולם לפי חומרת הפגיעה בערך החברתי; (2) אפשרות חריגה — לקולא משיקולי שיקום, או לחומרא להגנה על הציבור; (3) קביעת העונש הסופי בתוך המתחם, לפי נסיבות שאינן קשורות לביצוע העבירה.","id":"mcq-41","topic":"sentencing","lesson":"8","extra":false},{"q":"מהו סדר הסיכומים שנלמד בשיעור 8?","opts":["הנאשם ואחריו התובע","התובע ואחריו הנאשם, שלו נשמרת המילה האחרונה","בית המשפט מסכם לבדו","הצדדים מסכמים במקביל"],"correct":1,"explain":"המרצה הדגיש כי התובע sson":"extra","extra":true},{"id":"mcq-47","topic":"arrest-basics","q":"איזה סעיף מסדיר הבאה לתחנה בשל אי־ציות להוראות עיכוב חוקיות?","opts":["23(ז)","23(ב)","סעיף 184 לחסד״פ","סעיף 155 לחסד״פ"],"correct":1,"explain":"סעיף 23(ב) מסדיר את הסמכות לתכלית שלשמה התבקש העיכוב.","source":"חוק סדר הדין הפלילי סמכויות אכיפה מעצרים התשנו 1996.pdf — סעיף 23(ב)","lesson":"extra","extra":true},{"id":"mcq-48","topic":"reading","q":"לפי סעיף 10א, מה נדרש כדי לקבל אמרת חוץ של עד?","opts":["תנאי אחד בלבד: שהאמרה כתובה","הוכחת האמרה, העדת מוסרה והזדמנות לחקירה, ושוני מהותי/הכחשה/אי־זכירה","רק הודאת הנאשם","צו חיפוש"],"correct":1,"explain":"אלה התנאים המצטברים שנוספו בעקבות אלעוקה.","source":"אלעוקה נ' מדינת ישראל.pdf — ניתוח קבוצה C"},{"id":"mcq-49","topic":"arrest-basics","q":"מהו הכלל הנכון בחיפוש בטלפון לפי סעיף 23א?","opts":["תפיסת הטלפון מתירה עיון מלא","יש לבחון מקור סמכות והיקף צו; פגם מוקדם נבחן בנפרד ואינו מוביל אוטומטית לתוצאה אחת","אין צורך בצו לעולם","כל פגם מחייב זיכוי אוטומטי"],"correct":1,"explain":"זהו סדר הניתוח שנוסף בעקבות אוריך.","source":"יונתן אוריך נ' מדינת ישראל.pdf — ניתוח קבוצה C"},{"id":"mcq-50","topic":"summations","lesson":"8","extra":false,"q":"לפי סעיף 169 כפי שהוסבר בשיעור 8, מה סדר הסיכומים לעניין האשמה?","opts":["הנאשם ואחריו התובע","התובע ואחריו הנאשם","רק התובע מסכם","בית המשפט מסכם במקום הצדדים"],"correct":1,"explain":"התובע מסכם תחילה ואחריו הנאשם. המרצה הדגיש את זכות הנאשם למילה האחרונה.","source":"שיעור8 ערוך.mp3 — שלב הסיכומים"},{"q":"תחנת משטרה ביקשה לבצע מישוש בכיסי אדם. לא היה צו, ולא נמצא בסיס עובדתי לחשד, אך השוטר ביקש הסכמה בלי להסביר שניתן לסרב. מה התוצאה?","opts":["החיפוש תקף כי האדם לא התנגד","החיפוש פגום כי בהיעדר חשד נדרשת הסכמה מדעת לאחר הבהרת זכות הסירוב","החיפוש תקף כי כל מישוש הוא חיפוש פנימי","החיפוש תקף רק אם קצין אישר אותו"],"correct":0,"explain":"בהיעדר חשד סביר, הסכמה סתמית או אי־התנגדות אינן מספיקות; נדרשת הסכמה מדעת והבהרת זכות הסירוב.","id":"release1-search-01","topic":"search-seizure","lesson":"extra","extra":false,"sou const CASE_Q = [{"title":"קייס 1 — פגם בכתב האישום","scenario":"נאשם הורשע בעבירת מרמה. בערעור טוען סנגורו כי בכתב האישום נפלה טעות בציון התאריך המדויק של אחת מהעברות הכספיות, וכי בשל כך יש לבטל את ההרשעה כולה — למרות שכל שאר העובדות הוכחו כדבעי ולא נטען שהדבר פגע ביכולתו של הנאשם להתגונן.","question":"האם יש לקבל את הטענה? נמקו את תשובתכם תוך הפניה לפסיקה הרלוונטית.","points":["יש להזכיר את הלכת סילוסטר (ע\"פ 1/48): הדיון הפלילי אינו \"אשקוקי\" — פגם דיוני/טכני שלא גרם לעיוות דין ולא מנע הגנה הוגנת אינו מביא לביטול ההליך.","יש לבחון האם הפגם (טעות בתאריך) פגע בפועל ביכולת הנאשם להתגונן — כאן נמסר בעובדה שלא נטען כך.","ניתן להזכיר את סעיף 215 לחסד\"פ, שבו עוגנה ההלכה.","מסקנה סבירה: יש לדחות את הטענה, שכן מדובר בפגם טכני גרידא."],"id":"caseq-1","topic":"sec184","source":"פרדריק וילאם סילוסטר נ׳ היועץ המשפטי לממשלה 1-48.pdf — פסקאות 9-10; חוק סדר הדין הפלילי [נוסח משולב] סעיפים 149(3), 215","lesson":"1","extra":false},{"title":"קייס 2 — חיפוש בהסכמה","scenario":"שוטר עוצר אזרח ברחוב ללא כל חשד מוקדם, ומבקש לחפש בתיקו. השוטר אומר לו רק \"אתה מסכים שאבדוק לך בתיק?\" והאזרח עונה \"בסדר, בכיף\". בחיפוש נמצאים סמים.","question":"האם החיפוש חוקי, והאם הראיה קבילה? התייחסו לתנאים הנדרשים.","points":["יש להזכיר את רע״פ 10141/09 בן חיים: בהיעדר מקור סמכות אחר, נדרשת הסכמה אמיתית, מודעת ורצונית מהסוג שנדון בפסק הדין.","השוטר חייב להבהיר לאזרח באופן מפורש את זכותו המלאה לסרב, ושסירובו לא ייזקף לחובתו.","כאן השוטר לא הבהיר דבר מזה — ההסכמה אינה \"מדעת\".","מסקנה: החיפוש אינו חוקי, והראיה (הסמים) עלולה להיפסל מכוח הלכת יששכרוב (פסילה פסיקתית יחסית, בכפוף לאיזון אינטרסים)."],"id":"caseq-2","topic":"packer","lesson":"1","extra":false,"source":"אברהם בן חיים נ׳ מדינת ישראל.pdf — רע״פ 10141/09, פסקאות 3–5, 13, 31–35 וההכרעה הסופית"},{"title":"קייס 3 — עדות שותף","scenario":"שני שותפים הועמדו לדין בכתבי אישום נפרדים. האחד הורשע אך טרם נגזר דינו. התביעה מבקשת להעידו במשפט שותפו. הסנגור טוען שהלכת קנזי מחייבת לפסול את העדות באופן אוטומטי.","question":"האם הטענה הגורפת נכונה? הציגו כלל, חריג ויישום.","points":["מזהים שמדובר בכתבי אישום נפרדים.","מבחינים בין הלכת קנזי ההיסטורית לבין בג״ץ 11339/05 שביטל את החסם הגורף.","ככלל ניתן להעיד את השותף גם לפני סיום משפטו; ניתן לדחות במקרים חריגים ביותר ומטעמים שיירשמו.","העובדה שגזר הדין טרם ניתן אינה לבדה בסיס לפסילה אוטומטית. שאלת משקל העדות נפרדת מעצם האפשרות להעיד."],"id":"caseq-3","topic":"kanzi","source":"מדינת ישראל נ׳ בית המשפט המחוזי באר שבע 11339-05.pdf — ההכרעה הסופית ודעת הנשיאה ביניש, פסקה 3","lesson":"3","extra":false},{"title":"קייס 4 — הסדר מותנה","scenario":"חשוד בעבירת תקיפה (עוון) מוזמן על ידי התביעה להצעת הסדר מותנה. הוא מבקש מסנגורו לעיין בחומרי החקירה לפני שיחליט אם לחתום, אך התביעה משיבה שזכות העיון קמה רק לאחר הגשת כתב אישום, ולכן היא מסרבת למסור את החומרים.","question":"האם עמדת התביעה נכונה? נמקו את תשובתכם.","points":["יש להבחין בין זכות העיון הרגילה (סעיף 74 לחסד\"פ) — הקמה רק לאחר הגשת כתב אישום, ורק בפשע/עוון — לבין זכות העיון המיוחדת והמוקדמת בהליך של הסדר מותנה (סעיף 67ד לחסד\"פ).","סעיף 67ד קובע במפורש: \"בטרם ייחתם הסדר, רשאי החשוד לעיין בחומר החקירה ובטיוטת כתב האישום אם אינה זהה למתואר בהסדר\" — כלומר החובה קמה עוד לפני הגשת כתב אישום, כדי שהחשוד יוכל להחליט מדעת אם לחתום.","מסקנה: עמדת התביעה שגויה — סעיף 67ד קובע חובת חשיפה מיוחדת ומוקדמת לחתימה על הסדר מותנה, נפרדת מזכות העיון הרגילה שבסעיף 74."],"id":"caseq-4","topic":"conditional","source":"חוק סדר הדין הפלילי [נוסח משולב] תשמ\"ב-1982 — סעיף 67ד","lesson":"3","extra":false},{"title":"קייס 5 — התיישנות: גבולות חומר הבחינה","scenario":"בתרגיל מוצגת עבירת פשע רגילה ופעולת חקירה מאוחרת. סטודנט מבקש לפתור את השאלה באמצעות טבלת הארכות מפורטת המופיעה במצגת, וכן להסתמך על שקפים בעניין עבירות מין בקטינים.","question":"כיצד יש לבנות את התשובה לפי הנחיית המרצה בשיעור 7?","points":["מזהים את תקופת ההתיישנות הבסיסית לפי סיווג העבירה.","מסבירים שפעולת חקירה היא אירוע מנתק, ושמנגנון התקופה הנוספת קשור לפי השיעור לפעולת חקירה.","לא בונים את התשובה על טבלת הארכות שהמרצה הוציא מחומר הבחינה.","לא מייבאים את דיני עבירות המין בקטינים, שהמרצה הורה להתעלם מהם בבחינה."],"id":"caseq-5","topic":"limitations-pointer","lesson":"6","extra":false,"source":"שיעור 7 ערוך.mp3 — דברי המרצה בתחילת הדיון בהתיישנות"},{"title":"קייס 6 — סיווג העבירה לפני הצעת הסדר","scenario":"רונן חשוד בעבירה שעונשה המרבי חמש שנות מאסר. הוא נעדר עבר פלילי בחמש השנים שקדמו לה ואין נגדו תיקים נוספים. התובע סבור שאין מקום לבקש מאסר בפועל ולכן מציע הסדר מותנה. סטודנט טוען שהיעדר עבר פלילי והיעדר בקשת מאסר מספיקים לכך.","question":"מהו תנאי הסף שהסטודנט דילג עליו, לפי המסגרת שנלמדה בשיעור 3?","points":["מפרידים בין העונש המרבי הקבוע לעבירה לבין העונש שהתובע סבור שמתאים בנסיבות המקרה.","עונש מרבי של חמש שנים מציב את העבירה בסוג פשע.","לפי המסגרת שהמרצה לימד, הסדר מותנה מיועד לחטא ולעוון, ולא לפשע.","עבר נקי והערכת התובע שאין צורך במאסר אינם מחליפים את תנאי סיווג העבירה; לכן המסקנה של הסטודנט אינה נכונה."],"id":"caseq-6","topic":"conditional","withheld":false,"lesson":"3","extra":false,"source":"שיעור 3.mp3 — הסבר המרצה על סגירת תיק בהסדר, תנאי הסף והעיון לפני חתימה"},{"title":"קייס 7 — התיישנות, סיכון כפול וערעור באיחור","scenario":"שרה ביצעה עבירת פשע (תקופת התיישנות בסיסית 10 שנים) ב-1/2014. ב-1/2018 החל הליך חקירה שהסתיים ב-6/2018. ב-2/2025 הוגש נגדה כתב אישום ומשפטה החל. באותו משפט טענה שרה שכבר זוכתה בעבר, בשנת 2016, מאישום שונה לחלוטין שנבע מאותו אירוע עובדתי — אך התביעה חוזרת וטוענת לעובדות דומות. שרה הורשעה בסופו של דבר, וסנגורה פספס את מועד הגשת הערעור בשבועיים בשל תקלה משרדית.","question":"התייחסו לשלוש הסוגיות: (1) האם ניתן היה להגיש את כתב האישום ב-2/2025 מבחינת התיישנות? (2) האם טענת הסיכון הכפול/הזיכוי הקודם תתקבל? (3) האם ניתן עדיין לערער חרף האיחור?","points":["(1) תקופת ההתיישנות הבסיסית: 1/2014 + 10 שנים = 1/2024. הליך החקירה (אירוע מנתק) מאפס ומתחיל שוב מ-6/2018, אך מוגבל ל\"תקופה נוספת\" של עד 3 שנים מעבר ל-1/2024 — כלומר עד 1/2027. הגשת האישום ב-2/2025 היא במועד.","(2) סעיף 5 חוסם רק דיון חוזר על אותו מעשה שממנו זוכתה — אם האישום הנוכחי מבוסס על עובדות שונות (גם אם מאותו אירוע כללי), הטענה עלולה להידחות; יש לבחון האם מדובר ב\"אותו מעשה\" ממש.","(3) בהליך פלילי ניתן להאריך את מועד הגשת הערעור גם ללא \"טעמים מיוחדים שיירשמו\" (בשונה מהליך אזרחי) — ולכן תקלה משרדית עשויה להצדיק הארכה; דחיית בקשת ההארכה עצמה נחשבת \"פסק דין\" הניתן לערעור בזכות (הלכת חילף)."],"id":"caseq-7","topic":"appeals","source":"חוק סדר הדין הפלילי [נוסח משולב] סעיפים 5, 9; חילף נ׳ מדינת ישראל.pdf","lesson":"8","extra":false},{"title":"קייס 8 — נאשמים באותו כתב אישום","scenario":"א׳ וב׳ מואשמים באותו כתב אישום בשוד. א׳ הודה בעובדות, וב׳ כופר. התביעה מבקשת לגזור את דינו של א׳ מיד כדי לסיים את עניינו.","question":"מהו הכלל שנלמד בשיעור 7 ומהו ההיגיון שניתן לו?","points":["מזהים שמדובר בכתב אישום אחד, תנאי מרכזי לדיון בסעיף 155 כפי שנלמד.","לא גוזרים את דינו של מי שהודה לפני שהסתיים בירור משפטו של מי שלא הודה.","ההסבר בשיעור הוא הצורך לראות את התמונה הכוללת ואת חלקו של כל נאשם לפני הענישה.","אין להוסיף חריגים או מסלולים שאינם מבוססים במפורש בחומר שנלמד."],"id":"caseq-8","topic":"multi-defendants","lesson":"6","extra":false,"source":"שיעור 7 ערוך.mp3 — דברי המרצה בתחילת הדיון בהתיישנות"},{"title":"קייס 9 — מעצר ועיכוב: הרחבה מעבר להקלטות 1–8","scenario":"שוטר עיכב את דני ברחוב בחשד לתקיפה (עוון) לפני כשלוש שעות, וביקש לבדוק את זהותו. דני סירב לשתף פעולה, ובתגובה עצר אותו השוטר ללא צו. בתחנה נמנע ממנו לפגוש את עורך דינו למשך 20 שעות ללא נימוק מיוחד, ובמהלך אותה תקופה נגבתה ממנו הודאה בעבירה חמורה יותר — ניסיון לשוד (פשע). דני הובא בפני שופט לאחר 30 שעות. בשלב מאוחר יותר ביקשה התביעה מעצר גישור, ולאחר מכן מעצר עד תום ההליכים, בטענה שמדובר ב\"מכת מדינה\" של שוד ברחובות.","question":"נתחו, לפי הסדר: (1) האם העיכוב והמעצר ללא צו היו כדין? (2) מה דין מניעת הפגישה עם עורך הדין וההודאה שנגבתה? (3) האם הזמן עד ההבאה בפני שופט תקין? (4) האם טענת \"מכת מדינה\" מספיקה למעצר עד תום ההליכים?","points":["(1) תחילה בודקים שהעיכוב נעשה בסמכות. אי־ציות להוראות עיכוב חוקיות עשוי להקים סמכות לפי סעיף 23(ב) להבאה לתחנה לתכלית העיכוב. אין לייבא אוטומטית את תנאי מסלול 23(א); יש לבחון את הנסיבות ואת האפשרות להסתפק בעיכוב.","(2) מניעת פגישה עם עו\"ד ללא נימוק מיוחד לאורך 20 שעות פוגעת בזכות יסוד — בהתאם להלכת אסף שי, פגיעה בלתי חוקית כזו עלולה להוביל לפסילת ההודאה שנגבתה בעקבותיה מכוח הלכת יששכרוב.","(3) הכלל הוא הבאה בפני שופט תוך 24 שעות בלבד (סעיפים 17(ג)/27/29 לחוק המעצרים) — אין בחוק כלל כללי של הארכה ל-48 שעות \"בנסיבות מיוחדות\"; הארכה מעבר ל-24 שעות מותרת רק במקרה ספציפי של שבת/חג (עד 32-36 שעות, סעיף 29). 30 שעות ללא הצדקה כזו חורגות מהכלל וסביר שפוגמות בחוקיות המעצר.","(4) לפי הלכת גנימאת, \"מכת מדינה\" או חומרת העבירה כשלעצמה אינן עילת מעצר עצמאית — יש לבחון את מסוכנותו האישית הספציפית של דני ואת קיומה של חלופת מעצר, ולא להסתפק בנימוק הכללי."],"id":"caseq-9","topic":"arrest-nowarrant","source":"חוק סדר הדין הפלילי סמכויות אכיפה מעצרים התשנו 1996.pdf — סעיפים 17(ג), 23(ב), 27, 29; אסף שי נ׳ מדינת ישראל.pdf; עימאד גנימאת נ׳ מדינת ישראל.pdf","lesson":"extra","extra":true},{"id":"caseq-10","title":"קייס 10 — שני מועדים בערעור ברשות","scenario":"בקשת רשות ערעור הוגשה בתוך 45 ימים מפסק הדין. ההחלטה המתירה ערעור ניתנה כעבור חודשיים. סטודנט טוען שהמועד חלף, כי עברו יותר מ־75 ימים מפסק הדין.","question":"האם חיבור פשוט של 45+30 פותר את השאלה? נמקו.","points":["מבדילים בין בקשת רשות הערעור לבין הערעור לאחר מתן הרשות.","45 הימים מתייחסים לבקשת הרשות לפי הכלל שנלמד.","30 הימים נמנים ממועד מתן הרשות, לא אוטומטית מתום 45 הימים.","ההמתנה להחלטה אינה מצדיקה כשלעצמה את מסקנת הסטודנט; בודקים את המועד בפועל לאחר מתן הרשות."],"topic":"appeals","source":"שיעור8 ערוך.mp3 — דיון בסיום המשפט ובערעור","lesson":"8","extra":false},{"id":"caseq-11","title":"קייס 11 — חזרה מערעור","scenario":"נאשם הגיש ערעור ומבקש לחזור בו. השוו בין בקשה לפני סיום טענות הצדדים לבין בקשה לאחר סיומן.","question":"מהי נקודת המעבר ומה נדרש בכל מצב?","points":["מזהים שהשאלה היא חזרה מערעור, לא חזרת תובע מאישום.","לפני סיום טענות בעלי הדין אין צורך ברשות בית המשפט.","אחרי סיום הטענות נדרשת רשות בית המשפט.","אין להעתיק לכאן את ההבחנה בין ביטול לזיכוי הנוגעת לחזרה מאישום."],"topic":"appeals","source":"שיעור8 ערוך.mp3 — דיון בסיום המשפט ובערעור","lesson":"8","extra":false},{"id":"caseq-12","topic":"summations","lesson":"8","extra":false,"title":"קייס 12 — האם סיכומים כתובים מבטלים את המשפט?","scenario":"בתיק כלכלי הסכימו הצדדים להגיש סיכומים בכתב. לאחר הרשעתו דורש הנאשם ביטול אוטומטי של המשפט משום שלא סיכם בעל־פה, בלי להצביע על פגיעה מסוימת בהגנתו.","question":"כיצד יש לנתח את הטענה לפי פלוני 5333/11? השוו בקצרה לזכריא.","points":["מזהים סוגיה של מתכונת הסיכומים, לא של עדות שותפים.","מציינים שטיעון בעל־פה הוא דרך המלך, אך אין ביטול אוטומטי עקב סיכומים בכתב בהסכמה.","בוחנים את ההסכמה ואת הטענה לנזק או עיוות דין; כאן לא פורטה פגיעה קונקרטית.","בזכריא יש חשיבות לכך שהתקיים דיון והסנגור עצמו בחר להסתפק בנימוקיו הכתובים.","המסקנה לפי נתוני הדוגמה: הדרישה לביטול אוטומטי אינה מבוססת; אין בכך היתר גורף לוותר על דיון בכל מקרה."],"source":"פלוני נ׳ מדינת ישראל 5333-11.pdf — רע״פ 5333/11, פסקאות א–ט; זכריא נ׳ מדינת ישראל.pdf — רע״פ 11160/03, פסקאות 2–4 והערת השופטת פרוקצ׳יה"}];
