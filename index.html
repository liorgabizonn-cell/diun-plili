ט</button><button type="button" data-prompt="תן דוגמה">תן דוגמה</button><button type="button" data-prompt="עשה לי שאלה">עשה לי שאלה</button><button type="button" data-prompt="מה חשוב למבחן?">מה חשוב למבחן?</button></div><label for="chat-input">השאלה שלי</label><textarea id="chat-input" rows="3"></textarea><button type="button" id="send-chat">שלח</button><div class="chat-sources"><strong>מקורות לתשובה</strong><p>מקורות יופיעו לצד תשובות זמינות.</p><button type="button" data-open-notebook>לעבודה מעמיקה → מחברת הקורס</button></div></aside><div id="screen" hidden></div><div id="toast" role="status" aria-live="polite"></div><footer>דיון פלילי · סביבת למידה לחברי הקורס</footer><script>const EXPANSIONS = {"circles":{"title":"שלושת המעגלים של התיק הפלילי","html":"\n      \u003cdiv class=\"eyebrow\">יסודות\u003c/div>\n      \u003ch2>שלושת המעגלים המרכיבים את התיק הפלילי\u003c/h2>\n      \u003cp>ההליך הפלילי הוא הליך מעשי ודינמי שמטרתו להקנות לנו ארגז כלים שלם לניהול תיק פלילי בבית המשפט. בניגוד לעולם האזרחי, התיק הפלילי לא מתחיל בבית המשפט — הוא מתחיל הרבה קודם, ברגע שנפתחת חקירת משטרה. כל תיק פלילי בנוי משלושה מעגלים שלובים, שחשיבותם זהה לגמרי:\u003c/p>\n      \u003cul>\n        \u003cli>\u003cb>דיני העונשין (הדין המהותי)\u003c/b> — עוסק בשאלת האחריות הפלילית עצמה: להרשיע או לזכות. בית המשפט בוחן אם הוכחו מעבר לספק סביר כל יסודות העבירה — היסוד העובדתי (התנהגות, נסיבות, ותוצאה בעבירות תוצאתיות) והיסוד הנפשי (כוונה, פזיזות או רשלנות). בעבירת הרצח, למשל, ה\"התנהגות\" היא הגרימה, ה\"תוצאה\" היא מותו של אדם, וה\"נסיבה\" היא שמדובר באדם — אם נגרם מותה של חיה, זו פשוט לא אותה עבירה.\u003c/li>\n        \u003cli>\u003cb>דיני הראיות (הדין הקדם־דיוני)\u003c/b> — עוסק בשתי שאלות ליבה: שאלת הקבילות (האם הראיה בכלל רשאית להיכנס לבית המשפט — למשל בדיקת פוליגרף אינה קבילה בכלל במשפט פלילי), ושאלת המשקל (מה ערכה הראייתי של ראיה שכן קבילה — למשל עדות מומחה בליסטיקה המזהה קליע ספציפי, או עדות טביעות אצבע ו-DNA, לעומת עדות ראייה רגילה).\u003c/li>\n        \u003cli>\u003cb>סדרי הדין (הדין הפרוצדורלי)\u003c/b> — כללי המשחק לניהול ההליך: מעצר, עיכוב, וחיפוש בגוף (לרבות ההבחנה בין חיפוש חיצוני לחיפוש פנימי, כגון צילום רנטגן או הפשטה מלאה), ועד ניהול הדיונים בבית המשפט. חשוב שלא \"לערבב בשר בחלב\" בין העולם האזרחי לפלילי — אלו מערכות כללים שונות לחלוטין.\u003c/li>\n      \u003c/ul>\n      \u003ch3>שרשרת המוצג — למה זה קריטי\u003c/h3>\n      \u003cp>שאלת המשקל קשורה למושג \u003cb>שרשרת המוצג\u003c/b>: הוכחה מדויקת של המסלול שעברה הראיה מזירת העבירה ועד הגשתה בבית המשפט, כדי לוודא שלא הושפעה מגורמים חיצוניים. דוגמה קלאסית: מה קורה כשדגימת DNA נזרקת בניידת משטרה ונשארת שם בחום של 40 מעלות בחוץ? המומחה יידרש להסביר זאת בבית המשפט, וזה ישפיע ישירות על משקל הראיה.\u003c/p>\n      \u003cdiv class=\"callout\">\u003cspan class=\"callout-title\">מקרה מהשטח — הוכחת רצח בלי גופה\u003c/span>\u003cp>איך מוכיחים את \"התוצאה\" של רצח כשאין גופה? במקרה שליווה את המרצה מתקופת שירותו במשטרה, גופתה של קורבן לא נמצאה מעולם. בזירה נמצא שטיח עם כתם דם ענקי, וחוות דעת פתולוג קבעה שאיבוד דם בהיקף כזה אינו מותיר אפשרות לשרוד. עדות מומחה זו שכנעה את בית המשפט שהתגבשה התוצאה של מוות, חרף היעדר הגופה — וכך הורשעו הנאשמים ברצח.\u003c/p>\u003c/div>\n      \u003ch3>דין מהותי מול דין דיוני\u003c/h3>\n      \u003cp>לכלל מהותי \u003cb>אין תחולה רטרואקטיבית\u003c/b> — לא ניתן להעניש על מעשה שלא היה עבירה בזמן ביצועו. החריג המקל מעוגן בסעיפים 4–5 לחוק העונשין: שינוי מקל בחוק לטובת הנאשם חל באופן רטרואקטיבי ומיידי. חריג נוסף: חוק עשיית דין בנאצים ובעוזריהם — חוק מהותי שהוחל באופן רטרואקטיבי מטעמי צדק היסטורי. לעומת זאת, לכלל דיוני \u003cb>יש תחולה רטרואקטיבית ומיידית\u003c/b> גם על הליכים תלויים ועומדים, שכן הוא לא יוצר אחריות פלילית חדשה אלא רק קובע כיצד מבררים אותה — וניתן לסטות ממנו כל עוד לא נגרם עיוות דין.\u003c/p>\n      \u003ch3>רף ההוכחה: אזרחי מול פלילי\u003c/h3>\n      \u003cp>במשפט \u003cb>האזרחי\u003c/b> הרף הוא מאזן ההסתברויות — הוכחה ברמה של מעל 50%, ויש הלכה מפורשת של בית המשפט העליון שמצמידה לכך את המספר 51%. במשפט \u003cb>הפלילי\u003c/b> הרף הוא מעבר לכל ספק סביר, ובניגוד לעולם האזרחי — הפסיקה מעולם לא הגדירה לכך מספר מדויק. כשהמרצה משתמש במספרים כמו 97–98%, זהו כלי פדגוגי בלבד להמחשת החומרה שבהרשעת חף מפשע. הנאשם לא צריך להוכיח את חפותו — רק \"לכרסם\" בתיק התביעה ולהוריד את רמת הוודאות של השופט, וזה מוביל לזיכוי מחמת הספק.\u003c/p>\n      \u003cdiv class=\"callout case-callout\">\u003cspan class=\"callout-title\">קשור לפסק דין\u003c/span>\u003cbutton class=\"case-link\" data-case=\"0\">⚖ פרדריק וילאם סילוסטר נגד היועץ המשפטי לממשלה (1948)\u003c/button>\u003c/div>\n    \n      \u003ch3>המחשה מספרית לרף ההוכחה\u003c/h3>\n      \u003cdiv class=\"example-box\">\n        \u003cspan class=\"ex-title\">💡 למה אין מספר מדויק?\u003c/span>\n        \u003cp>נניח שהיה קיים מספר רשמי, למשל 90% ודאות. תובע שמגיע ל-89% היה צריך לזכות אוטומטית, גם אם ברור לחלוטין שהנאשם אשם — תוצאה אבסורדית. לכן הפסיקה משאירה זאת כמבחן איכותי (\"ספק סביר\"), לא כמותי. ה-97–98% שהמרצה מזכיר הוא כלי המחשה בלבד, לא סף משפטי.\u003c/p>\n      \u003c/div>\n      \u003cdiv class=\"scenario-row\">\u003cspan class=\"verdict ok\">אזרחי\u003c/span>\u003cdiv>מאזן הסתברויות — מעל 50% (הלכה: 51%)\u003c/div>\u003c/div>\n      \u003cdiv class=\"scenario-row\">\u003cspan class=\"verdict need\">פלילי\u003c/span>\u003cdiv>מעבר לספק סביר — ללא אחוז מוגדר בפסיקה\u003c/div>\u003c/div>\n"},"adversarial":{"title":"אדברסרית מול אינקוויזיטורית","html":"\u003cdiv class=\"eyebrow\">שיעור 1\u003c/div>\u003ch2>השיטה האדברסרית — מודל והסתייגות\u003c/h2>\u003cp>המרצה הציג את השיטה האדברסרית כשיטה שבה הצדדים מנהלים את הבאת הראיות והטיעון, והשופט מכריע. הוא הדגיש שאין מדינה הפועלת לפי מודל טהור לחלוטין: בישראל השיטה בעיקרה אדברסרית, לצד חריגים.\u003c/p>\u003cp>החריג שנלמד הוא סעיף 167, המאפשר לבית המשפט להביא ראיה מיוזמתו לאחר שהצדדים סיימו את ראיותיהם, במקרים המתאימים.\u003c/p>"},"packer":{"title":"שני המודלים של הרברט פקר","html":"\n      \u003cdiv class=\"eyebrow\">תיאוריה\u003c/div>\n      \u003ch2>שני מודלים למשפט הפלילי — הרברט פקר\u003c/h2>\n      \u003cul>\n        \u003cli>\u003cb>מודל מיגור הפשיעה (Crime Control)\u003c/b> — המדינה תעשה כל שביכולתה כדי להילחם בפשע ולהגיע לחקר האמת, גם במחיר פגיעה מסוימת בזכויות חשודים ונאשמים. המטרה מקדשת את האמצעים, ונותנים למשטרה יד חופשית יחסית.\u003c/li>\n        \u003cli>\u003cb>מודל ההליך הראוי (Due Process)\u003c/b> — המטרה אינה מקדשת את האמצעים: זכויות החשוד והנאשם הן ערך עליון, ויש לשמור עליהן בקנאות גם במחיר פגיעה ביעילות המלחמה בפשיעה.\u003c/li>\n      \u003c/ul>\n      \u003ch3>הביטוי הראייתי למתח שבין המודלים\u003c/h3>\n      \u003cp>\u003cb>בארה\"ב\u003c/b> חלה דוקטרינת \"פירות העץ המורעל\" — ראיה שהושגה שלא כדין, וכל מה שהתגלה בעקבותיה, נפסלת אוטומטית וקטגורית. \u003cb>בישראל\u003c/b> המערכת קרובה יותר, באופן כללי, למודל מיגור הפשיעה, ובית המשפט העליון הבהיר במפורש כי אינו מאמץ את דוקטרינת פירות העץ המורעל במלואה. במקומה, בהלכת יששכרוב נקבעה דוקטרינת \u003cb>הפסילה הפסיקתית היחסית\u003c/b> — שיקול דעת של בית המשפט לפסול ראיה שהושגה שלא כדין לפי איזון אינטרסים, ולא פסילה אוטומטית.\u003c/p>\n      \u003cdiv class=\"callout case-callout\">\u003cspan class=\"callout-title\">קשור לפסק דין\u003c/span>\u003cbutton class=\"case-link\" data-case=\"25\">⚖ רפאל יששכרוב נגד התובע הצבאי הראשי\u003c/button>\u003c/div>\n      \u003cdiv class=\"callout case-callout\">\u003cspan class=\"callout-title\">קשור לפסק דין\u003c/span>\u003cbutton class=\"case-link\" data-case=\"2\">⚖ אברהם בן חיים נגד מדינת ישראל\u003c/button>\u003c/div>\n    \n      \u003ch3>אותו מצב, שתי מערכות\u003c/h3>\n      \u003cdiv class=\"example-box\">\n        \u003cspan class=\"ex-title\">💡 דוגמה — סכין שנמצאה בחיפוש פסול\u003c/span>\n        \u003cp>נניח ששוטר חיפש על גופו של אזרח ללא חשד סביר וללא שהבהיר לו את זכותו לסרב. בארה\"ב, פירות העץ המורעל היו פוסלים את הסכין אוטומטית וקטגורית. בישראל (הלכת בן חיים), בית המשפט בוחן לפי מבחן איזון — ובמקרה זה אכן פסל, אך זו תוצאה של שקילה, לא כלל אוטומטי.\u003c/p>\n      \u003c/div>\n"},"sec184":{"title":"סעיף 184 — הרשעה בעבירה שהתגלתה","html":"\u003cdiv class=\"eyebrow\">חסד״פ\u003c/div>\u003ch2>סעיף 184 לחסד״פ והלכת דמיאניוק\u003c/h2>\u003cp>הסעיף מאפשר להרשיע בעבירה שאשמתו בה נתגלתה מן העובדות שהוכחו, אף אם היא שונה מן העבירה שבכתב האישום. לפי ההסבר בשיעור 1, נדרשים \u003cb>שני תנאים מצטברים\u003c/b>: ניתנה לנאשם הזדמנות סבירה להתגונן מפני העבירה האחרת; ולא יוטל עליו בשל אותה עבירה עונש חמור מזה שהיה אפשר להטיל בשל העבירה המקורית.\u003c/p>\u003cdiv class=\"callout warn\">\u003cspan class=\"callout-title\">יישום בדמיאניוק\u003c/span>\u003cp>העובדה שהוכחה עבירה אחרת אינה מספיקה. המרצה הסביר כי דמיאניוק התגונן לאורך המשפט מפני האישום המסוים שיוחס לו, ולא מפני האישום החלופי; לכן לא הייתה לו הזדמנות סבירה להתגונן מפניו.\u003c/p>\u003c/div>\u003cdiv class=\"callout case-callout\">\u003cspan class=\"callout-title\">קשור לפסק דין\u003c/span>\u003cbutton class=\"case-link\" data-case=\"3\">⚖ דמיאניוק נגד מדינת ישראל (1988)\u003c/button>\u003c/div>"},"classify":{"title":"סיווג עבירות — סעיף 24","html":"\n      \u003cdiv class=\"eyebrow\">חובה לבחינה\u003c/div>\n      \u003ch2>סיווג העבירות — סעיף 24 לחוק העונשין\u003c/h2>\n      \u003cdiv class=\"callout warn\">\u003cspan class=\"callout-title\">דגש למבחן\u003c/span>\u003cp>המרצה הדגיש שזהו שורש הדיון הפלילי — הבסיס לקביעת סמכויות מעצר וחיפוש!\u003c/p>\u003c/div>\n      \u003cul>\n        \u003cli>\u003cb>חטא\u003c/b> — העונש המרבי הוא מאסר עד 3 חודשים, או קנס בלבד.\u003c/li>\n        \u003cli>\u003cb>עוון\u003c/b> — העונש המרבי עולה על 3 חודשים ואינו עולה על 3 שנים (כולל), או קנס בלבד.\u003c/li>\n        \u003cli>\u003cb>פשע\u003c/b> — העונש המרבי עולה על 3 שנים, ועד עונש מוות.\u003c/li>\n      \u003c/ul>\n      \u003ch3>סעיף 42 לחוק העונשין — כשאין תקופת מאסר קצובה\u003c/h3>\n      \u003cp>אם לעבירה נקבע עונש מאסר אך \u003cb>לא נקצבה\u003c/b> לה תקופה בחוק, העונש המקסימלי שבית המשפט מוסמך להטיל הוא שנה אחת — ומכאן שהיא מסווגת אוטומטית כ\u003cb>עוון\u003c/b>.\u003c/p>\n      \u003cp>\u003cb>מלכודת קלאסית:\u003c/b> עבירה שהעונש המרבי עליה הוא \u003cb>בדיוק 3 שנים\u003c/b> מסווגת כ\"עוון\" — ורק מעל 3 שנים נחשבת \"פשע\". ההבחנה הזו קריטית כי היא משנה דרמטית את סמכויות המעצר והחיפוש.\u003c/p>\n    \n      \u003ch3>דוגמאות מהחיים\u003c/h3>\n      \u003cdiv class=\"scenario-row\">\u003cspan class=\"verdict ok\">חטא\u003c/span>\u003cdiv>עבירות תעבורה קלות, הפרעה לרעש בניגוד לחוק עזר\u003c/div>\u003c/div>\n      \u003cdiv class=\"scenario-row\">\u003cspan class=\"verdict ok\">עוון\u003c/span>\u003cdiv>תקיפה קלה, גניבה פשוטה\u003c/div>\u003c/div>\n      \u003cdiv class=\"scenario-row\">\u003cspan class=\"verdict need\">פשע\u003c/span>\u003cdiv>שוד, אונס, רצח, שוחד\u003c/div>\u003c/div>\n"},"sec59":{"title":"תחילת ההליך הפלילי — סעיף 59","html":"\n      \u003cdiv class=\"eyebrow\">חסד\"פ\u003c/div>\n      \u003ch2>תחילת ההליך הפלילי — סעיף 59 לחסד\"פ\u003c/h2>\n      \u003cp>נפתח כשנודע למשטרה על עבירה. חובה מוחלטת לרשום כל תלונה.\u003c/p>\n      \u003cul>\n        \u003cli>\u003cb>פשע\u003c/b> — חובת חקירה מוחלטת. חריג: הלכת צדוק (תלונה מופרכת).\u003c/li>\n        \u003cli>\u003cb>חטא/עוון\u003c/b> — קצין פקד+ רשאי שלא לחקור, משיקולי מדיניות או רשות אחרת מוסמכת.\u003c/li>\n      \u003c/ul>\n      \u003cdiv class=\"callout case-callout\">\u003cspan class=\"callout-title\">קשור לפסק דין\u003c/span>\u003cbutton class=\"case-link\" data-case=\"4\">⚖ צדוק נגד ראש אגף חקירות ומודיעין (2007)\u003c/button>\u003c/div>\n      \u003cbutton class=\"expand-link\" data-topic=\"sec59\">🔎 קריאה מורחבת\u003c/button>\n    "},"bodies":{"title":"גופי התביעה — סעיף 60","html":"\n      \u003cdiv class=\"eyebrow\">חלוקת עבודה\u003c/div>\n      \u003ch2>גופי התביעה — חלוקת עבודה לפי סעיף 60\u003c/h2>\n      \u003cp>ברגע שגוף החקירה מסיים לאסוף את הראיות, הוא מעביר את התיק אל יחידת התביעה המוסמכת. בישראל קיימים שני גופי תביעה מרכזיים המוסמכים להגיש כתבי אישום בשם המדינה:\u003c/p>\n      \u003cul>\n        \u003cli>\u003cb>הפרקליטות (משרד המשפטים)\u003c/b> — מייצגת את המדינה בבתי המשפט המחוזיים והשלום דרך הפרקליטויות המחוזיות הפליליות, ומייצגת באופן בלעדי בבית המשפט העליון דרך פרקליטות המדינה. מטפלת בפשע חמור — רצח, אונס, שוחד, מרמה חמורה, עבירות ביטחון וצווארון לבן — וכן בעבירות עוון ספציפיות בעלות רגישות ציבורית מיוחדת, כגון גרימת מוות ברשלנות.\u003c/li>\n        \u003cli>\u003cb>התביעה המשטרתית (יחידת התביעות של משטרת ישראל)\u003c/b> — מורכבת מתובעים משטרתיים המשרתים כקציני משטרה. מטפלת בפשע קל יותר — עבירות רכוש, אלימות קלה, סמים קלים — וברוב עבירות העוון והחטא, המכונות \"עבירות רחוב\".\u003c/li>\n      \u003c/ul>\n      \u003cdiv class=\"callout warn\">\u003cspan class=\"callout-title\">נקודת מפתח למבחן — סמכות חריגה\u003c/span>\u003cp>פרקליט המחוז רשאי (מכוח סעיף 60(יא) לחסד\"פ) להורות על חריגה מחלוקת הטיפול הסטטוטורית — למשל למשוך תיק סמים קל לטיפול הפרקליטות, או להעביר תיק הונאה קל לתביעה המשטרתית. חריגה זו חוקית לחלוטין ולא תפסול את ההליך, ובלבד שלא נגרם עקב כך חוסר צדק או עיוות דין לנאשם.\u003c/p>\u003c/div>\n      \u003ch3>חוק ההמלצות (סעיף 60(יא), תיקון 2018)\u003c/h3>\n      \u003cp>התיקון נועד למנוע פרסום המלצות אקטיביות להעמיד לדין חשודים — בפרט אנשי ציבור — לפני שהתביעה בחנה את התיק. שני כללים מרכזיים:\u003c/p>\n      \u003cul>\n        \u003cli>\u003cb>איסור הבעת עמדה בכתב לגבי הגשת כתב אישום\u003c/b> — המשטרה אינה רשאית לצרף לתיק עמדה בכתב הממליצה להעמיד לדין (בעל־פה מותר לשוחח, אך בכתב חל איסור מוחלט). החריג: אם החקירה התנהלה ללא פרקליט מלווה והמשטרה סבורה שיש לסגור את התיק, מותר להעביר בכתב את עמדתה בדבר סגירתו.\u003c/li>\n        \u003cli>\u003cb>חובת סיכום התשתית הראייתית\u003c/b> — המשטרה חייבת להביע בכתב עמדה לגבי מכלול הראיות שנאספו, מה כוחן הראייתי ואילו עדויות נגבו. החריג: אם ליווה את החקירה פרקליט מלווה מהרגע הראשון, אין חובה כזו — אלא אם ביקש זאת במפורש פרקליט המדינה או היועץ המשפטי לממשלה.\u003c/li>\n      \u003c/ul>\n    \n      \u003ch3>מי מטפל במה — בקצרה\u003c/h3>\n      \u003cdiv class=\"scenario-row\">\u003cspan class=\"verdict need\">פרקליטות\u003c/span>\u003cdiv>רצח, אונס, שוחד, ביטחוני, צווארון לבן, גרימת מוות ברשלנות\u003c/div>\u003c/div>\n      \u003cdiv class=\"scenario-row\">\u003cspan class=\"verdict ok\">תביעה משטרתית\u003c/span>\u003cdiv>רכוש קל, אלימות קלה, סמים קלים, רוב העוון/חטא (\"עבירות רחוב\")\u003c/div>\u003c/div>\n"},"hearing":{"title":"זכות השימוע — סעיף 60א","html":"\n      \u003cdiv class=\"eyebrow\">זכויות החשוד\u003c/div>\n      \u003ch2>חובת היידוע וזכות השימוע — סעיף 60א\u003c/h2>\n      \u003cp>זכות השימוע מאפשרת לחשוד לנסות למנוע את הגשת כתב האישום עוד לפני שנדבק בו הכתם הציבורי של \"נאשם\".\u003c/p>\n      \u003cp>\u003cb>חובת היידוע:\u003c/b> ברגע שחומר החקירה מועבר לתביעה \u003cb>בעבירה מסוג פשע בלבד\u003c/b>, חובה לשלוח לחשוד הודעה בכתב על כך. בעבירות עוון או חטא — החשוד כלל אינו זכאי למכתב יידוע.\u003c/p>\n      \u003cp>\u003cb>זכות השימוע:\u003c/b> לחשוד עומדת הזכות לפנות לתובע בכתב, תוך \u003cb>30 יום\u003c/b> מיום קבלת ההודעה, בבקשה מנומקת להימנע מהגשת כתב אישום.\u003c/p>\n      \u003cdiv class=\"callout warn\">\u003cspan class=\"callout-title\">הבחנה חשובה למבחן\u003c/span>\u003cp>השימוע \u003cb>בכתב\u003c/b> הוא זכות מוקנית וחובה. לעומת זאת, הזמנת החשוד או סנגורו להציג טיעונים \u003cb>בעל־פה\u003c/b> היא סמכות רשות בלבד, בשיקול דעתה הבלעדי של התביעה.\u003c/p>\u003c/div>\n      \u003ch3>חריגים — מתי לא נשלח מכתב יידוע\u003c/h3>\n      \u003cul>\n        \u003cli>החשוד היה נתון במעצר בעת העברת חומר החקירה, וכתב האישום הוגש נגדו במהלך תקופת המעצר\u003c/li>\n        \u003cli>פרקליט המחוז או ראש יחידת התביעות החליט שקיימת מניעה מנהלית או ביטחונית\u003c/li>\n        \u003cli>עבירות אלימות במשפחה כלפי בן זוג, או עבירות מין בתוך המשפחה — הרציונל: מניעת סכנה מיידית לקורבן, מחשש שקבלת מכתב היידוע בבית תצית אלימות מיידית כלפי בן הזוג או הקטין החיים עם החשוד\u003c/li>\n      \u003c/ul>\n      \u003cdiv class=\"callout case-callout\">\u003cspan class=\"callout-title\">קשור לפסק דין\u003c/span>\u003cbutton class=\"case-link\" data-case=\"5\">⚖ שמואל נגד היועץ המשפטי לממשלה (2008)\u003c/button>\u003c/div>\n    \n      \u003ch3>ציר הזמן של השימוע\u003c/h3>\n      \u003cdiv class=\"timeline\">\n        \u003cdiv class=\"timeline-step\">\u003cdiv class=\"timeline-date\">יום 0\u003c/div>\u003cdiv class=\"timeline-dot\">\u003c/div>\u003cdiv class=\"timeline-label\">תיק פשע\u003cbr>מגיע לתביעה\u003c/div>\u003c/div>\n        \u003cdiv class=\"timeline-line\">\u003c/div>\n        \u003cdiv class=\"timeline-step\">\u003cdiv class=\"timeline-date\">מיידי\u003c/div>\u003cdiv class=\"timeline-dot\">\u003c/div>\u003cdiv class=\"timeline-label\">מכתב יידוע\u003cbr>לחשוד\u003c/div>\u003c/div>\n        \u003cdiv class=\"timeline-line\">\u003c/div>\n        \u003cdiv class=\"timeline-step\">\u003cdiv class=\"timeline-date\">עד 30 יום\u003c/div>\u003cdiv class=\"timeline-dot end\">\u003c/div>\u003cdiv class=\"timeline-label\">שימוע בכתב\u003cbr>(חובה)\u003c/div>\u003c/div>\n      \u003c/div>\n"},"closure":{"title":"עילות סגירת תיק — סעיף 62","html":"\n      \u003cdiv class=\"eyebrow\">חסד\"פ\u003c/div>\n      \u003ch2>עילות סגירת תיק — סעיף 62\u003c/h2>\n      \u003cp>כשתובע מחליט שלא להעמיד לדין, עליו לסגור את התיק באחת משלוש עילות:\u003c/p>\n      \u003cul>\n        \u003cli>\u003cb>חוסר ראיות מספיקות\u003c/b> — אף שקיים חשד סביר, אין סיכוי סביר להרשעה מעבר לספק סביר. נותר רישום משטרתי פנימי.\u003c/li>\n        \u003cli>\u003cb>נסיבות העניין בכללותן אינן מתאימות\u003c/b> — קיימות ראיות מספיקות, אך משיקולי מדיניות ותועלת ציבורית התובע סבור שהאינטרס הציבורי אינו מצדיק ניהול משפט, למשל עבירה קלת ערך ביותר או נסיבות אישיות קשות של החשוד. נותר רישום פנימי.\u003c/li>\n        \u003cli>\u003cb>חוסר אשמה\u003c/b> — אין כל ראיה הקושרת את החשוד לעבירה, או שהראיות מוכיחות פוזיטיבית שהוא חף מפשע (למשל אליבי מוחלט). \"עילת הזהב\" — מחיקה מוחלטת ומיידית של הרישום ממחשבי המשטרה.\u003c/li>\n      \u003c/ul>\n      \u003cdiv class=\"callout warn\">\u003cspan class=\"callout-title\">דגש חובה למבחן — חובת אישור מוגברת\u003c/span>\u003cp>בעילת \"נסיבות העניין\" קיימות ראיות והסגירה נובעת משיקולי מדיניות בלבד — ולכן קיים חשש לניצול לרעה. סגירה בעילה זו מחייבת אישור בכתב של גורם בכיר: בתיק פרקליטות — פרקליט המחוז או פרקליט בכיר מוסמך; בתיק פשע של התביעה המשטרתית — ראש יחידת התביעות או תובע משטרתי בכיר; ביתר התיקים — קצין משטרה שהוסמך לכך על ידי המפכ\"ל.\u003c/p>\u003c/div>\n      \u003cdiv class=\"callout case-callout\">\u003cspan class=\"callout-title\">קשור לפסק דין\u003c/span>\u003cbutton class=\"case-link\" data-case=\"6\">⚖ אפרים נוה נגד מדינת ישראל (2019)\u003c/button>\u003c/div>\n      \u003ch3>עד כמה בג\"ץ מתערב בהחלטות התביעה?\u003c/h3>\n      \u003cp>שאלה נפרדת אך קשורה: מה קורה כשחשוד תוקף ישירות בבג\"ץ את החלטת התביעה להעמידו לדין (ולא רק עורר על סגירת תיק)?\u003c/p>\n      \u003cdiv class=\"callout case-callout\">\u003cspan class=\"callout-title\">קשור לפסק דין\u003c/span>\u003cbutton class=\"case-link\" data-case=\"24\">⚖ דוד אפל נגד פרקליטת המדינה (1999)\u003c/button>\u003c/div>\n    \n      \u003ch3>שלוש העילות — במבט אחד\u003c/h3>\n      \u003cdiv class=\"scenario-row\">\u003cspan class=\"verdict need\">חוסר ראיות\u003c/span>\u003cdiv>יש חשד, ראיות חלשות מדי — רישום פנימי\u003c/div>\u003c/div>\n      \u003cdiv class=\"scenario-row\">\u003cspan class=\"verdict need\">נסיבות העניין\u003c/span>\u003cdiv>ראיות מספיקות, שיקולי מדיניות — רישום פנימי + אישור גורם בכיר\u003c/div>\u003c/div>\n      \u003cdiv class=\"scenario-row\">\u003cspan class=\"verdict ok\">חוסר אשמה\u003c/span>\u003cdiv>עילת הזהב — מחיקה מוחלטת ומיידית\u003c/div>\u003c/div>\n"},"appeal":{"title":"מסלול העררים — סעיפים 64–65","html":"\n      \u003cdiv class=\"eyebrow\">זכויות המתלונן\u003c/div>\n      \u003ch2>מסלול העררים של המתלונן — סעיפים 64–65\u003c/h2>\n      \u003cp>מתלונן (נפגע העבירה) רשאי להגיש ערר בכתב תוך \u003cb>60 יום\u003c/b> מקבלת הודעת הסגירה.\u003c/p>\n      \u003cdiv class=\"callout warn\">\u003cspan class=\"callout-title\">דגש למבחן\u003c/span>\u003cp>מפת הסמכויות להכרעה בערר — נושא חובה מובהק לבחינה!\u003c/p>\u003c/div>\n      \u003cul>\n        \u003cli>החלטת גוף חוקר/תובע משטרתי שלא לחקור או להעמיד לדין → \u003cb>פרקליט המחוז / מנהל תחום עררים בפרקליטות המדינה\u003c/b>.\u003c/li>\n        \u003cli>החלטת פרקליט מחוז/מדינה מטעם מקצועי (חוסר ראיות/אשמה) → \u003cb>פרקליט המדינה\u003c/b>.\u003c/li>\n        \u003cli>החלטת פרקליט מחוז/מדינה מטעם מדיניות (נסיבות העניין) → \u003cb>היועץ המשפטי לממשלה\u003c/b>.\u003c/li>\n        \u003cli>החלטת פרקליט המדינה או משנהו שלא להעמיד לדין → \u003cb>היועץ המשפטי לממשלה\u003c/b>.\u003c/li>\n      \u003c/ul>\n      \u003cp>\u003cb>על החלטה בערר לא ניתן לערור פעם נוספת בתוך המערכת.\u003c/b>\u003c/p>\n      \u003cp>מלכודת בחינה: החשוד \u003cb>אינו\u003c/b> מקבל הודעה אוטומטית על הגשת ערר נגדו (סעיף 65ב). חובת יידוע קמה רק אם שוקלים לקבל את הערר ולהעמיד לדין.\u003c/p>\n    \n      \u003ch3>ציר הזמן של הערר\u003c/h3>\n      \u003cdiv class=\"timeline\">\n        \u003cdiv class=\"timeline-step\">\u003cdiv class=\"timeline-date\">יום 0\u003c/div>\u003cdiv class=\"timeline-dot\">\u003c/div>\u003cdiv class=\"timeline-label\">הודעת סגירת\u003cbr>התיק למתלונן\u003c/div>\u003c/div>\n        \u003cdiv class=\"timeline-line\">\u003c/div>\n        \u003cdiv class=\"timeline-step\">\u003cdiv class=\"timeline-date\">עד 60 יום\u003c/div>\u003cdiv class=\"timeline-dot\">\u003c/div>\u003cdiv class=\"timeline-label\">הגשת ערר\u003cbr>בכתב\u003c/div>\u003c/div>\n        \u003cdiv class=\"timeline-line\">\u003c/div>\n        \u003cdiv class=\"timeline-step\">\u003cdiv class=\"timeline-date\">סופי\u003c/div>\u003cdiv class=\"timeline-dot end\">\u003c/div>\u003cdiv class=\"timeline-label\">הכרעה — אין\u003cbr>ערר נוסף\u003c/div>\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"example-box\">\n        \u003cspan class=\"ex-title\">💡 מלכודת בחינה\u003c/span>\n        \u003cp>אם רשות הערר שוקלת \u003cb>לקבל\u003c/b> את הערר ולהעמיד לדין — קמה חובה לשלוח לחשוד הודעה ולאפשר לו טיעונים. אם הרשות פשוט דוחה את הערר ומשאירה את התיק סגור — \u003cb>אין\u003c/b> כל חובת יידוע לחשוד, שכן מצבו לא משתנה.\u003c/p>\n      \u003c/div>\n"},"conditional":{"title":"ההסדר המותנה — סעיפים 67א–ו","html":"\n      \u003cdiv class=\"eyebrow\">מסלול חלופי\u003c/div>\n      \u003ch2>ההסדר המותנה — סעיפים 67א–ו\u003c/h2>\n      \u003cp>כלי המאפשר סגירת תיק ללא כתב אישום, בתמורה להודאת החשוד ומילוי תנאים שיקומיים.\u003c/p>\n      \u003ch3>תנאי סף מצטברים\u003c/h3>\n      \u003cul>\n        \u003cli>קיימות ראיות מספיקות לאישום\u003c/li>\n        \u003cli>העבירה מסוג חטא/עוון בלבד — \u003cb>איסור מוחלט בפשע\u003c/b>\u003c/li>\n        \u003cli>העונש הצפוי אינו כולל מאסר בפועל\u003c/li>\n        \u003cli>לחשוד עבר פלילי נקי בחמש השנים האחרונות\u003c/li>\n      \u003c/ul>\n      \u003cp>מאחר שהחשוד נדרש להודות, התביעה חייבת לחשוף בפניו את טיוטת כתב האישום וכל חומרי החקירה — עוד \u003cb>לפני\u003c/b> הגשת כתב האישום.\u003c/p>\n      \u003cp>אם החשוד מפר את התנאים או מסרב לחתום, התביעה תגיש את כתב האישום המקורי, אך \u003cb>לא תוכל לבקש מאסר בפועל\u003c/b> — אלא אם התגלה מידע חדש ומפתיע (באישור תובע בכיר) או שההסדר הושג במרמה.\u003c/p>\n      \u003cdiv class=\"callout\">\u003cspan class=\"callout-title\">להלכה למעשה\u003c/span>\u003cp>התנאים במסגרת ההסדר המותנה הם לרוב שעות לתועלת הציבור, המפוקחות על ידי שירות המבחן ומבוצעות בזמנו הפנוי של החשוד — לעולם לא מאסר בפועל. שימוש בהודאת ההסדר לצורך תביעה אזרחית נזיקית נפרדת הוא עניין מוגבל ומורכב, ולא עניין פשוט וישיר.\u003c/p>\u003c/div>\n    \n      \u003ch3>בדיקת התאמה — כל התנאים ביחד\u003c/h3>\n      \u003cdiv class=\"example-box\">\n        \u003cspan class=\"ex-title\">💡 דוגמה\u003c/span>\n        \u003cp>חשוד בתקיפה (עוון), ראיות מספיקות, התובע מעריך שהעונש הראוי הוא קנס ושעות שירות — ולחשוד אין עבר פלילי. \u003cb>מתאים\u003c/b> להסדר מותנה. אילו היה חשוד בשוד (פשע) — לא מתאים, ללא קשר לחוזק הראיות או לעברו הנקי.\u003c/p>\n      \u003c/div>\n"},"kanzi":{"title":"עדות שותפים — מקנזי לביטול הכלל","html":"\u003ch2>עדות שותף: קנזי והשינוי בהלכה\u003c/h2>\u003cp>\u003cb>הבחנה מכרעת:\u003c/b> הלכת קנזי היא נקודת המוצא ההיסטורית, לא סוף ההתפתחות. בבג״ץ 11339/05 בוטל הכלל החוסם ככלל העדת שותף שמשפטו הנפרד תלוי ועומד.\u003c/p>\u003cp>הכלל שנקבע: ניתן להעידו; דחיית העדות עד תום משפטו אפשרית במקרים חריגים ביותר, מטעמים שיירשמו. אין לערבב זאת עם נאשמים באותו כתב אישום וההסדר שבסעיף 155.\u003c/p>\u003ch3>מדוע השתנה הכלל?\u003c/h3>\u003cp>הכלל ההיסטורי ביקש לצמצם את החשש ששותף יעיד כדי להיטיב את מצבו במשפטו שלו. בפסק הדין המאוחר נבחן גם המחיר: עיכובים במשפט, פגיעה בניהולו וסיכון לשימוש לרעה בכלל. הוחלט להסיר את החסם הגורף ולהותיר שיקול דעת צר לדחייה חריגה.\u003c/p>\u003ch3>איך פותרים קייס?\u003c/h3>\u003col>\u003cli>מזהים אם כתבי האישום נפרדים או משותפים.\u003c/li>\u003cli>מבדילים בין האפשרות להעיד לבין הערכת משקל העדות וההגנות הראייתיות.\u003c/li>\u003cli>במשפטים נפרדים אין לפסול עדות רק מפני שטרם ניתן גזר הדין.\u003c/li>\u003cli>אם נטען לחריג — בוחנים את הנסיבות המיוחדות ואת ההנמקה, ולא מניחים דחייה אוטומטית.\u003c/li>\u003c/ol>\u003cbutton class=\"case-link\" data-case=\"15\">לניתוח פסק הדין ששינה את ההלכה\u003c/button>"},"structure":{"title":"מבנה כתב האישום — סעיף 85","html":"\n      \u003cdiv class=\"eyebrow\">חסד\"פ\u003c/div>\n      \u003ch2>מבנה כתב האישום — סעיף 85 לחסד\"פ\u003c/h2>\n      \u003cul>\n        \u003cli>שם בית המשפט, לפי כללי הסמכות העניינית והמקומית\u003c/li>\n        \u003cli>ציון מדינת ישראל כמאשימה, באמצעות הגוף המגיש\u003c/li>\n        \u003cli>שם הנאשם, מספר זהותו, גילו ומענו\u003c/li>\n        \u003cli>\u003cb>פרק העובדות\u003c/b> — עובדות בלבד! איסור מוחלט לצרף ראיות גולמיות או עדויות.\u003c/li>\n        \u003cli>הוראות החיקוק לפיהן מואשם הנאשם\u003c/li>\n        \u003cli>\u003cb>רשימת עדי התביעה\u003c/b> — רשימה קשיחה וסגורה. עד שאינו ברשימה לא ניתן לזמנו לעדות במהלך המשפט.\u003c/li>\n      \u003c/ul>\n    \n      \u003cdiv class=\"example-box\">\n        \u003cspan class=\"ex-title\">💡 דוגמה\u003c/span>\n        \u003cp>שוטר ערך דוח חיפוש ותפס סכין, אך שמו לא נכלל ברשימת עדי התביעה בכתב האישום. בשלב המשפט מתברר שהסנגור חולק על נסיבות התפיסה — התביעה תיתקל בבעיה: לא ניתן לזמן את השוטר להעיד, ודוח החיפוש עלול שלא להתקבל כראיה כלל.\u003c/p>\n      \u003c/div>\n"},"amend":{"title":"תיקון כתב האישום — סעיף 92","html":"\n      \u003cdiv class=\"eyebrow\">קו פרשת המים\u003c/div>\n      \u003ch2>תיקון כתב האישום — סעיף 92\u003c/h2>\n      \u003cp>\u003cb>לפני תחילת המשפט (לפני ההקראה):\u003c/b> התובע הוא הבעלים הבלעדי של כתב האישום — רשאי לתקן בחופשיות, כולל הוספת עבירות או נאשמים, בהודעה פשוטה לבית המשפט וללא צורך באישור שופט.\u003c/p>\n      \u003cp>\u003cb>לאחר תחילת המשפט (אחרי ההקראה):\u003c/b> כתב האישום עובר לאחריות בית המשפט. התובע צריך להגיש בקשה רשמית, שתתקבל רק אם ניתנה לנאשם הזדמנות סבירה להתגונן מפני השינוי.\u003c/p>\n      \u003cp>השלכה על סמכות: תיקון שחושף עבירה חמורה יותר → התיק עובר לבית משפט בכיר יותר. תיקון לעבירה קלה יותר → הבית המשפט הבכיר רשאי (לא חייב) להמשיך לדון.\u003c/p>\n    \n      \u003cdiv class=\"scenario-row\">\u003cspan class=\"verdict ok\">לפני הקראה\u003c/span>\u003cdiv>תיקון חופשי, הודעה בלבד, ללא אישור שופט\u003c/div>\u003c/div>\n      \u003cdiv class=\"scenario-row\">\u003cspan class=\"verdict need\">אחרי הקראה\u003c/span>\u003cdiv>בקשה רשמית + הזדמנות סבירה להתגונן\u003c/div>\u003c/div>\n"},"joinder":{"title":"צירוף אישומים ונאשמים — 86-87","html":"\n      \u003cdiv class=\"eyebrow\">יעילות דיונית\u003c/div>\n      \u003ch2>צירוף אישומים וצירוף נאשמים — סעיפים 86–87\u003c/h2>\n      \u003cp>מותר לצרף אישומים נגד אותו נאשם המבוססים על אותן עובדות, עובדות דומות, או פרשה עובדתית אחת (86). מותר לצרף נאשמים שהיו צד לעבירות — מבצע בצוותא, משדל, מסייע — או שמדובר בפרשה עובדתית אחת (87).\u003c/p>\n      \u003cdiv class=\"callout case-callout\">\u003cspan class=\"callout-title\">קשור לפסק דין\u003c/span>\u003cbutton class=\"case-link\" data-case=\"10\">⚖ סוסן נגד מדינת ישראל (1995) — סמכות נגררת\u003c/button>\u003c/div>\n    \n      \u003cdiv class=\"example-box\">\n        \u003cspan class=\"ex-title\">💡 דוגמה\u003c/span>\n        \u003cp>שני שותפים פרצו יחד לבית עסק. ניתן לצרפם לכתב אישום אחד (87 — פרשה עובדתית אחת), וגם לצרף אישום נוסף נגד אחד מהם על עבירה קודמת דומה של אותו נאשם (86), אם היא קשורה מבחינה עובדתית.\u003c/p>\n      \u003c/div>\n"},"withdraw":{"title":"חזרה מכתב אישום — סעיף 94","html":"\n      \u003cdiv class=\"eyebrow\">חסד\"פ\u003c/div>\n      \u003ch2>חזרה מכתב אישום — סעיף 94\u003c/h2>\n      \u003cul>\n        \u003cli>\u003cb>לפני תשובת הנאשם לאישום\u003c/b> — ביטול כתב האישום בלבד. ניתן להגיש מחדש בעתיד, אין מעשה בית דין.\u003c/li>\n        \u003cli>\u003cb>לאחר תשובה, כפר בעובדות או שתק\u003c/b> — זיכוי מוחלט, מעשה בית דין החוסם הגשה מחדש.\u003c/li>\n        \u003cli>\u003cb>לאחר תשובה, הודה בעובדות מרשיעות\u003c/b> — בית המשפט מרשיע; לא ניתן לחזור מהאישום בתוצאה של זיכוי.\u003c/li>\n        \u003cli>\u003cb>לאחר תשובה, הודה אך אין בעובדות כדי להרשיע\u003c/b> — התביעה רשאית לחזור מהאישום ברשות בית המשפט; התוצאה זיכוי מוחלט.\u003c/li>\n        \u003cli>\u003cb>חזרה בהסכמת הנאשם לאחר תשובה\u003c/b> — ביטול בלבד (לא זיכוי), עם דרישת אישור אישי בכתב של היועמ\"ש להגשה מחדש.\u003c/li>\n      \u003c/ul>\n    \n      \u003ch3>ארבע התוצאות במבט אחד\u003c/h3>\n      \u003cdiv class=\"scenario-row\">\u003cspan class=\"verdict ok\">לפני תשובה\u003c/span>\u003cdiv>ביטול בלבד — ניתן להגיש מחדש\u003c/div>\u003c/div>\n      \u003cdiv class=\"scenario-row\">\u003cspan class=\"verdict need\">אחרי תשובה, כפר/שתק\u003c/span>\u003cdiv>זיכוי מוחלט — חסום לצמיתות\u003c/div>\u003c/div>\n      \u003cdiv class=\"scenario-row\">\u003cspan class=\"verdict need\">אחרי תשובה, הודה (מרשיע)\u003c/span>\u003cdiv>הרשעה — לא ניתן לחזור\u003c/div>\u003c/div>\n      \u003cdiv class=\"scenario-row\">\u003cspan class=\"verdict ok\">אחרי תשובה, הודה (לא מספיק)\u003c/span>\u003cdiv>זיכוי ברשות בית המשפט\u003c/div>\u003c/div>\n"},"defendant":{"title":"מחשוד לנאשם","html":"\n      \u003cdiv class=\"eyebrow\">מעמד\u003c/div>\n      \u003ch2>מחשוד לנאשם\u003c/h2>\n      \u003cp>כל עוד חקירת המשטרה מתנהלת והתיק נבחן בתביעה, האדם מוגדר \u003cb>\"חשוד\"\u003c/b>. ברגע שכתב האישום מוגש רשמית למזכירות בית המשפט, הוא הופך מיידית ל\u003cb>\"נאשם\"\u003c/b>.\u003c/p>\n    \n      \u003cdiv class=\"timeline\">\n        \u003cdiv class=\"timeline-step\">\u003cdiv class=\"timeline-date\">שלב א׳\u003c/div>\u003cdiv class=\"timeline-dot\">\u003c/div>\u003cdiv class=\"timeline-label\">חקירה\u003cbr>\"חשוד\"\u003c/div>\u003c/div>\n        \u003cdiv class=\"timeline-line\">\u003c/div>\n        \u003cdiv class=\"timeline-step\">\u003cdiv class=\"timeline-date\">שלב ב׳\u003c/div>\u003cdiv class=\"timeline-dot end\">\u003c/div>\u003cdiv class=\"timeline-label\">הגשת כתב אישום\u003cbr>\"נאשם\"\u003c/div>\u003c/div>\n      \u003c/div>\n\n      \u003cdiv class=\"timeline\">\n        \u003cdiv class=\"timeline-step\">\u003cdiv class=\"timeline-date\">שלב חקירה\u003c/div>\u003cdiv class=\"timeline-dot\">\u003c/div>\u003cdiv class=\"timeline-label\">חשוד\u003c/div>\u003c/div>\n        \u003cdiv class=\"timeline-line\">\u003c/div>\n        \u003cdiv class=\"timeline-step\">\u003cdiv class=\"timeline-date\">הגשת כתא\"ש\u003cbr>למזכירות\u003c/div>\u003cdiv class=\"timeline-dot end\">\u003c/div>\u003cdiv class=\"timeline-label\">נאשם\u003c/div>\u003c/div>\n      \u003c/div>\n"},"review":{"title":"זכות העיון — סעיף 74","html":"\n      \u003cdiv class=\"eyebrow\">זכויות הנאשם\u003c/div>\n      \u003ch2>זכות העיון בחומר חקירה — סעיף 74\u003c/h2>\n      \u003cp>קמה עם הגשת כתב האישום. חלה \u003cb>רק בפשע/עוון\u003c/b>, לא בחטא.\u003c/p>\n      \u003cp>כשמסרבים לחשוף: בקשה לביהמ\"ש → ערר יחיד לערכאה בכירה → 3 אפשרויות (לחשוף / לא להשתמש כראיה / לחזור מהאישום).\u003c/p>\n      \u003cdiv class=\"callout case-callout\">\u003cspan class=\"callout-title\">קשור לפסק דין\u003c/span>\u003cbutton class=\"case-link\" data-case=\"5\">⚖ שמואל (2008)\u003c/button>\u003c/div>\n      \u003cbutton class=\"expand-link\" data-topic=\"review\">🔎 קריאה מורחבת\u003c/button>\n    \u003ch3>פומביות הדיון ואיסור פרסום חומרי חקירה\u003c/h3>\u003cp>פומביות הדיון וחופש הביטוי אינם מוחלטים. בבקשה לפרסם חומרי חקירה או תיעוד מהליך פלילי יש לאזן בין עניין הציבור ופומביות ההליך לבין פרטיות, שם טוב, הגינות ההליך והחשש להשפעה על עדים או לזיהום המשפט. ככל שהחקירה או המשפט פעילים והפרסום עלול לפגוע ממשית בהליך, ניתן למנוע או לעכב את הפרסום מכוח סעיף 70 לחוק בתי המשפט וההסדרים שנלמדו. התרומה של עניין תורג׳מן ורשות השידור היא יישום אותו איזון על פרסום תקשורתי של חומרי חקירה, ולא יצירת כלל נפרד לכל אחד מהם.\u003c/p>"},"reading":{"title":"הקראת כתב האישום והסכמות","html":"\u003cdiv class=\"eyebrow\">מצגת 2 · סעיפים 74–84\u003c/div>\u003ch2>עיון בחומר החקירה\u003c/h2>\u003cp>לאחר כתב אישום בעוון או בפשע זכאים הנאשם וסנגורו לעיין ולהעתיק את חומר החקירה. הרשימה הנלווית כוללת גם ציון קיומם של חומר שאינו חומר חקירה, חומר חסוי וחומר מודיעיני, עם סוג, נושא ומועד — בכפוף לחיסיון.\u003c/p>\u003cp>הסייגים שנלמדו: ראיות הזמה, עניינים פורמליים שאינם מהותיים, חומר חסוי, והסדרים מיוחדים בבגידה או ריגול. אם לא ניתנה הזדמנות סבירה לעיין, סעיף 77(א) מונע מן התובע להגיש את הראיה או להשמיע את העד, אלא אם ויתרו על כך.\u003c/p>\u003cp>בקשת עיון נדונה ככלל בפני שופט אחד; ערר בזכות יוגש בתוך 30 ימים. לפי פרידן, יש מסלול ערר אחד בלבד.\u003c/p>\u003ch3>אמרת חוץ של עד — סעיף 10א לפקודת הראיות\u003c/h3>\u003cp>קבלת אמרת חוץ של עד אינה תחליף אוטומטי לעדות בבית המשפט. לפי המסגרת שנלמדה, נדרשים תנאים מצטברים: האמרה הוכחה במשפט; מוסר האמרה הוא עד במשפט וניתנה לצדדים הזדמנות לחקרו; והעדות בבית המשפט שונה בפרט מהותי מן האמרה, או שהעד מכחיש את תוכנה או טוען שאינו זוכר. לצד קבילות האמרה יש לבחון את משקלה ואת הראיות המחזקות.\u003c/p>\u003cp>תחבולת חקירה אינה נפסלת כשלעצמה. הגבול הוא פגיעה באוטונומיית הרצון החופשי או פגיעה חמורה בהגינות ההליך; אין לשכפל מכאן את מבחני החיפוש או את דוקטרינת יששכרוב.\u003c/p>"},"trial-open6":{"title":"תזכורת: פתיחת המשפט וזכויות הנאשם","html":"\u003cdiv class=\"eyebrow\">מצגת 3 · סעיפים 143–145\u003c/div>\u003ch2>פתיחת המשפט: הקראה והסכמות\u003c/h2>\u003cp>הכלל הוא שהמשפט נפתח בהקראת כתב האישום. הוויתור אפשרי רק בארבעה תנאים מצטברים: הנאשם מיוצג; הסנגור הודיע שקרא לנאשם את כתב האישום; הנאשם אישר זאת; והדברים נרשמו בפרוטוקול.\u003c/p>\u003cp>לאחר תחילת המשפט, כאשר הנאשם מיוצג, בית המשפט רשאי לברר הסכמות לעובדות ולקבילות מסמכים ומוצגים, לרבות הגשתם שלא באמצעות עדים (סעיף 144). לפי סעיף 145, בית המשפט יסביר לנאשם את זכויות ההגנה אם ראה צורך בכך.\u003c/p>"},"prelim-claims":{"title":"טענות מקדמיות — סעיף 149","html":"\u003cdiv class=\"eyebrow\">מצגת 3 · סעיפים 149–151\u003c/div>\u003ch2>טענות מקדמיות\u003c/h2>\u003cp>הרשימה שבסעיף 149 אינה סגורה. הטענה מועלית בתחילת המשפט, אך ככלל אפשר להעלותה גם בהמשך ואף בערעור. החריג: חוסר סמכות מקומית ופגם או פסול בכתב האישום בשלב מאוחר דורשים רשות בית המשפט.\u003c/p>\u003cp>פגם הוא השמטת פרט ענייני מכתב האישום; פסול הוא אי־עמידה בדרישת כשרות דיונית, כגון כתב אישום שלא הוגש בידי תובע מוסמך. בקבלת טענה בית המשפט יכול לתקן, לבטל או להעביר לבית משפט מוסמך — לא לזכות.\u003c/p>\u003ch3>טענות נוספות\u003c/h3>\u003cp>משפט פלילי אחר התלוי ועומד באותו עניין מוביל לביטול כתב האישום. חסינות וחנינה חוסמות העמדה לדין לפי התנאים שנלמדו; הגנה מן הצדק לפי בורוביץ, נוה ורותם מאפשרת ביטול כאשר ההליך עומד בסתירה מהותית לצדק ולהגינות.\u003c/p>"},"court-jurisdiction":{"title":"סמכות מקומית ועניינית של בתי המשפט","html":"\u003cdiv class=\"eyebrow\">מצגת 3 · סעיפים 6–8\u003c/div>\u003ch2>סמכות מקומית\u003c/h2>\u003cp>הסמכות מתקיימת במקום ביצוע העבירה או מקום מגורי הנאשם. אם שניהם אינם ידועים — במקום תפיסתו; בעבירת חוץ, כשמקום מגוריו אינו בישראל או אינו ידוע — במקום היחידה החוקרת. בצירוף אישומים או נאשמים מוסמך כל בית משפט שיש לו שיפוט באחת העבירות או על אחד הנאשמים.\u003c/p>\u003cp>כאשר היועץ המשפטי לממשלה קובע שאין בית משפט מוסמך לפי הכללים הרגילים, הסמכות בירושלים. העברה מחמת חוסר סמכות אפשרית לפי סעיף 79 לחוק בתי המשפט; בית המשפט המקבל רשאי להמשיך מן השלב שאליו הגיע קודמו ואינו מעביר שוב.\u003c/p>"},"double-jeopardy-justice":{"title":"סיכון כפול, חסינות, חנינה והגנה מן הצדק","html":"\n      \u003cdiv class=\"eyebrow\">טענות מקדמיות 4–7\u003c/div>\n      \u003ch2>סיכון כפול, חסינות, חנינה והגנה מן הצדק\u003c/h2>\n      \u003cp>זיכוי/הרשעה קודמים (5), סיכון כפול (נדיר, אף פעם לא התקבל בפועל), חסינויות וחנינה, הגנה מן הצדק.\u003c/p>\n      \u003cdiv class=\"callout case-callout\">\u003cspan class=\"callout-title\">קשור לפסקי דין\u003c/span>\u003cbutton class=\"case-link\" data-case=\"13\">⚖ קרישניסקי\u003c/button> \u003cbutton class=\"case-link\" data-case=\"12\">⚖ הגנה מן הצדק\u003c/button>\u003c/div>\n      \u003cbutton class=\"expand-link\" data-topic=\"double-jeopardy-justice\">🔎 קריאה מורחבת\u003c/button>\n    \u003cdiv class=\"callout\">\u003cspan class=\"callout-title\">חריג לסיכון כפול\u003c/span>\u003cp>כאשר המעשה גרם למות אדם לאחר הדיון הראשון, ניתן להעמיד לדין פעם נוספת בשל אותו מעשה אם בדיון הראשון נמצא הנאשם אשם, לרבות העמדה למבחן ללא הרשעה.\u003c/p>\u003c/div>\u003ch3>הבחנות נוספות\u003c/h3>\u003cp>\"סיכון כפול\" שונה מטענת \"כבר נשפטתי\" לפי סעיף 5: הראשונה עוסקת בחשיפה חוזרת לסיכון הרשעה כאשר ההליך הקודם לא הסתיים בפסק דין; השנייה מבוססת על מעשה בית דין. הטענה נדירה ואינה חלה כשההליך הקודם בטל מעיקרו, למשל מחוסר סמכות מלכתחילה.\u003c/p>"},"defendant-response":{"title":"תשובת הנאשם, הודאה וחזרה ממנה","html":"\n      \u003cdiv class=\"eyebrow\">סעיפים 152–154\u003c/div>\n      \u003ch2>תשובת הנאשם, הודאה וחזרה ממנה\u003c/h2>\n      \u003cp>שתיקה עשויה לשמש חיזוק. טענת אליבי — מייד. חזרה מהודאה ברשות ביהמ\"ש, מנימוקים מיוחדים.\u003c/p>\n      \u003cbutton class=\"expand-link\" data-topic=\"defendant-response\">🔎 קריאה מורחבת\u003c/button>\n    \u003ch3>סעיף 152\u003c/h3>\u003cp>הנאשם רשאי שלא להשיב, להודות, לכפור או להוסיף עובדות. בית המשפט רשאי לשאול שאלות הבהרה שאינן חורגות מהדרוש. הימנעות מתשובה עשויה לשמש חיזוק, ובית המשפט חייב להסביר זאת. טענת אליבי יש להעלות מיד; איחור מגביל הבאת ראיות אלא ברשות בית המשפט, בלי לגרוע מזכות לחזור מהודאה בנוכחות בזירת העבירה.\u003c/p>"},"multi-defendants":{"html":"\u003cdiv class=\"eyebrow\">שיעור 7 · סעיף 155\u003c/div>\u003ch2>נאשמים בכתב אישום אחד\u003c/h2>\u003cp>כאשר כמה נאשמים הועמדו לדין \u003cb>באותו כתב אישום\u003c/b> וחלקם הודו בעובדות שיש בהן כדי הרשעה, לא ייגזר דינם של מי שהודו לפני שהסתיים בירור משפטם של מי שלא הודו.\u003c/p>\u003cp>הנימוק שהדגיש המרצה: רק לאחר בירור התמונה המלאה אפשר להעריך את חלקו של כל נאשם בעבירה ואת הענישה המתאימה. אין להשליך מכאן אוטומטית על כתבי אישום נפרדים; אלה מסלולים שונים.\u003c/p>"},"trial-conduct":{"html":"\u003cdiv class=\"eyebrow\">שיעור 7 · סעיפים 156–165\u003c/div>\u003ch2>ניהול המשפט — שלד העבודה\u003c/h2>\u003cp>המרצה עבר על פרשת התביעה, טענת \"אין להשיב לאשמה\" בסיומה, פרשת ההגנה וראיות ההזמה. סעיף 77א הוזכר בהקשר של מניעת הגשת ראיה שלא ניתנה לנאשם הזדמנות לעיין בה.\u003c/p>\u003cp>אם הנאשם בוחר להעיד בפרשת ההגנה, עדותו נשמעת תחילה. הימנעות מהעיד עשויה לשמש חיזוק לראיות התביעה. ראיות הזמה טעונות רשות ונועדו לסתור טענה שעלתה בהגנה ושלא הייתה צפויה לתביעה מראש; לאחר שהובאו, רשאי הנאשם להביא ראיות לסתור אותן.\u003c/p>\u003ch3>הערכת מהימנות וחובת הגינות התביעה\u003c/h3>\u003cp>הערכת מהימנות היא מלאכת בית המשפט: יש לבחון את עדות העד במכלול, את עקביותה, את הסתירות ואת התמיכה החיצונית, בלי להפוך כלל כללי על מהימנות לתחליף להנמקה. לצד זאת, על התביעה לנהל את ההליך בהגינות ולגלות חומר רלוונטי; מחדל דיוני אינו מוביל אוטומטית לתוצאה אחת, אלא נבחן לפי השפעתו על ההגנה ועל הוגנות ההליך.\u003c/p>"},"verdict-sentence":{"title":"הכרעת הדין וגזר הדין","html":"\u003cdiv class=\"eyebrow\">שיעור 8\u003c/div>\u003ch2>מן הראיות אל פסק הדין\u003c/h2>\u003cp>לאחר פרשת ההגנה רשאי בית המשפט, אך אינו חייב, להביא ראיות מטעמו. גם לאחר הכרעת הדין הדבר אפשרי רק בנסיבות חריגות מאוד, כשהתגלתה ראיה חדשה שלא הייתה בהישג יד ונדרש הדבר לעשיית צדק ולמניעת עיוות דין.\u003c/p>\u003cp>בתום הראיות באים הסיכומים: התובע מסכם ראשון והנאשם אחריו; לנאשם שמורה זכות המילה האחרונה. פסק הדין הפלילי בנוי מהכרעת דין ומגזר דין.\u003c/p>\u003ch3>השלמות משקפים 71–105\u003c/h3>\u003cp>הודאה בעובדה נחשבת כמוכחת, אלא אם בית המשפט אינו מקבלה או התיר חזרה ממנה בנימוקים מיוחדים. לאחר הכרעת הדין, ביטול ההכרעה נדרש רק אם היא מבוססת על ההודאה. לפי סעיף 155, בכתב אישום משותף ניתן לגזור לפני סיום משפט האחרים רק בנסיבות מיוחדות שיירשמו או כאשר המודה נקרא להעיד ולאחר שנגזר דינו.\u003c/p>\u003cp>פרשת התביעה לפי סעיפים 156–157 קודמת לטענת אין להשיב לאשמה; פרשת ההגנה לפי 159–164. נאשמים מביאים פתיחה וראיות לפי סדר רישומם, אלא אם בית המשפט הורה אחרת. התביעה אינה חוקרת על הרשעות קודמות אלא בחריגי אופי טוב. ראיות הזמה דורשות רשות; ראיות ההגנה לסתירתן אינן דורשות רשות.\u003c/p>\u003cp>סעיף 181א קובע הכרעת דין בתוך 30 ימים מהסיכומים, עם אפשרות הארכה מטעמים מיוחדים. זיכוי הוא פסק הדין; מועד הערעור מתחיל ממתן הנימוקים. ניתן לבטל הרשעה לפני גזר דין לפי סעיף 192א, להרשיע בכמה עבירות בלי להעניש יותר מפעם אחת על אותו מעשה, ולצרף תיקים לפי סעיף 39. סעיף 185 מסדיר העברה בין שלום למחוזי בעבירה שאינה בסמכות הערכאה.\u003c/p>"},"sentencing":{"title":"קביעת העונש","html":"\n      \u003cdiv class=\"eyebrow\">40ב–40טו לחוק העונשין\u003c/div>\n      \u003ch2>קביעת העונש\u003c/h2>\n      \u003cp>3 שלבים: מתחם עונש הולם → חריגה (קולא/חומרא) → עונש סופי בתוך המתחם.\u003c/p>\n      \u003cdiv class=\"callout case-callout\">\u003cspan class=\"callout-title\">קשור לפסק דין\u003c/span>\u003cbutton class=\"case-link\" data-case=\"18\">⚖ תיקי מב\"ד\u003c/button>\u003c/div>\n      \u003cbutton class=\"expand-link\" data-topic=\"sentencing\">🔎 קריאה מורחבת\u003c/button>\n    \u003ch3>השלמות משקפים 106–136\u003c/h3>\u003cp>בשלב הטיעונים לעונש התביעה מביאה הרשעות קודמות והחלטות על ביצוע עבירות, והנאשם רשאי להביא ראיות להקלה שאינן סותרות את גרסתו בשלב האשמה. תיקים הממתינים לבירור דין אינם ראיה בשלב בירור האשמה, אך שירות המבחן רשאי להתייחס אליהם בתסקיר. הענישה נעשית בשלושה שלבים: מתחם הולם, חריגה לשיקום או להגנת שלום הציבור בתנאים שנלמדו, וקביעת העונש בתוך המתחם; נסיבה מחמירה טעונה הוכחה מעבר לספק סביר ומקלה ברמת הוכחה אזרחית.\u003c/p>"},"appeals":{"title":"ערעור: זכות, מסלולים ומועדים","html":"\n      \u003cdiv class=\"eyebrow\">סעיפים 199–217\u003c/div>\n      \u003ch2>ערעור: זכות, מסלולים ומועדים\u003c/h2>\n      \u003cp>לא ניתן לערער על החלטות ביניים (מלבד חריגים). מועדים: 45 יום (בזכות), 45+30 (ברשות).\u003c/p>\n      \u003cdiv class=\"callout case-callout\">\u003cspan class=\"callout-title\">קשור לפסקי דין\u003c/span>\u003cbutton class=\"case-link\" data-case=\"11\">⚖ פלדמן\u003c/button> \u003cbutton class=\"case-link\" data-case=\"20\">⚖ צ'ירנסקי\u003c/button> \u003cbutton class=\"case-link\" data-case=\"22\">⚖ חילף\u003c/button>\u003c/div>\n      \u003cbutton class=\"expand-link\" data-topic=\"appeals\">🔎 קריאה מורחבת\u003c/button>\n    \u003ch3>השלמות משקפים 106–136\u003c/h3>\u003cp>הכלל הוא שאין ערעור על החלטות ביניים אלא בהוראה מפורשת; חריגים שנלמדו כוללים פסלות, פומביות, עיון בחומר, עיכוב ביצוע וערעור עצמאי של סנגור על אי־שחרורו מייצוג. בקשת רשות לערעור שני דורשת שאלה משפטית בעלת חשיבות ציבורית או מקרה חריג בחומרת העונש. ערעור בזכות מוגש בתוך 45 ימים; בקשת רשות בתוך 45 ימים והערעור בתוך 30 ימים ממועד הרשות. חזרה מערעור לאחר סיום הטענות טעונה רשות. בערעור אין להחמיר בעונש ללא ערעור מדינה.\u003c/p>"},"arrest-basics":{"title":"יסודות דיני מעצרים","html":"\n      \u003cdiv class=\"eyebrow\">חוק המעצרים · חוק יסוד כבוד האדם וחירותו\u003c/div>\n      \u003ch2>יסודות דיני המעצרים\u003c/h2>\n      \u003cp>\u003cb>אסיר\u003c/b> — הורשע ונגזר עליו מאסר בפועל, מוחזק לריצוי עונשו. \u003cb>עצור\u003c/b> — מוחזק לפני/בזמן ההליך, נהנה מחזקת החפות.\u003c/p>\n      \u003cp>\u003cb>עיכוב\u003c/b> — הגבלת חירות קלה ומתוחמת (בירור/חקירה במקום). \u003cb>מעצר\u003c/b> — שלילת חירות מלאה.\u003c/p>\n      \u003cp>כללי הברזל: במסלול סעיף 23(א) נדרשת עבירה שאינה חטא; סעיף 23(ב) הוא מסלול נפרד הנוגע לעיכוב חוקי; אין לעצור אם ניתן להסתפק בעיכוב; אין לעצור אם ניתן להשיג את התכלית בחלופת מעצר.\u003c/p>\n      \u003cdiv class=\"callout case-callout\">\u003cspan class=\"callout-title\">קשור לפסק דין\u003c/span>\u003cbutton class=\"case-link\" data-case=\"26\">⚖ קסאי — זכות התנגדות למעצר בלתי חוקי\u003c/button>\u003c/div>\n      \u003cbutton class=\"expand-link\" data-topic=\"arrest-basics\">🔎 קריאה מורחבת\u003c/button>\n    \u003ch3>חיפוש במכשיר נייד ובחומר מחשב — סעיף 23א לפקודת החיפוש\u003c/h3>\u003cp>חיפוש בטלפון או בחומר מחשב הוא חיפוש בעל מאפיינים ייחודיים, ולכן יש לבחון את מקור הסמכות ואת היקף הצו באופן קונקרטי. עצם העובדה שהמכשיר נתפס אינה מתירה עיון גורף בתוכנו. כאשר נטען שחיפוש בלתי חוקי קדם לבקשת הצו, יש להפריד בין חוקיות האיסוף המוקדם לבין תוקף הצו והראיות שנאספו מכוחו, ולבחון את התוצאה לפי ההגנות והאיזונים שנלמדו בבן חיים וביששכרוב.\u003c/p>"},"arrest-nowarrant":{"title":"מעצר שוטר ללא צו וזכויות העצור","html":"\n      \u003cdiv class=\"eyebrow\">סעיפים 23, 26–36 לחוק המעצרים · הרחבה — לא נלמד בהקלטת שיעור 8\u003c/div>\n      \u003ch2>מעצר שוטר ללא צו שופט וזכויות העצור בתחנה\u003c/h2>\n      \u003cp>זהו המעצר התקוף ביותר בשטח — מבוצע על ידי שוטר בודד ללא פנייה מוקדמת לבית משפט, לפי סעיף 23 לחוק המעצרים.\u003c/p>\n      \u003ch3>תנאים במסלול סעיף 23(א)\u003c/h3>\n      \u003cp>\u003cb>1.\u003c/b> יסוד סביר לחשד שהאדם עבר עבירה שאינה חטא (עוון או פשע). \u003cb>2.\u003c/b> התקיימות עילת מעצר סטטוטורית: העבירה בוצעה בפניו או \"זה מקרוב\"; חשש לאי-הופעה לחקירה; חשש לשיבוש הליכי משפט (השפעה על עדים/העלמת ראיות); סכנה לביטחון אדם/ציבור/מדינה; חזקת מסוכנות (עבירת מיתה/עולם, ביטחון, סמים, אלימות חמורה או במשפחה); הפרת ערובה או בריחה. אי־ציות לעיכוב חוקי מוסדר בנפרד בסעיף 23(ב), לתכלית שלשמה התבקש העיכוב.\u003c/p>\n      \u003cdiv class=\"callout case-callout\">\u003cspan class=\"callout-title\">קשור לפסק דין\u003c/span>\u003cbutton class=\"case-link\" data-case=\"27\">⚖ כהן נגד הפצ\"ר (1988)\u003c/button>\u003c/div>\n      \u003ch3>זכויות העצור בתחנה\u003c/h3>\n      \u003cp>הובא עצור לתחנה, סעיף 26 מחייב הבאה מיידית בפני הקצין הממונה, הבוחן אם קיימת עילת מעצר חוקית — ואם לא, מחויב לשחרר מיד. אם קיימת עילה, יבחן חלופת ערובה לפני מעצר בפועל.\u003c/p>\n      \u003cdiv class=\"scenario-row\">\u003cspan class=\"verdict need\">אזהרה (28, 32)\u003c/span>\u003cdiv>אינו חייב לומר דבר, שתיקה עשויה לחזק ראיות; הסבר סיבת המעצר וזכויותיו\u003c/div>\u003c/div>\n      \u003cdiv class=\"scenario-row\">\u003cspan class=\"verdict need\">מפגש עו\"ד (34)\u003c/span>\u003cdiv>ללא דיחוי — ניתן לדחות בשעות ספורות/עד 24 שעות/עד 48 שעות, לפי חומרת הנימוק\u003c/div>\u003c/div>\n      \u003cdiv class=\"scenario-row\">\u003cspan class=\"verdict need\">הודעה לקרוב (33, 36)\u003c/span>\u003cdiv>ללא דיחוי, אלא בעבירת ביטחון/פשע חמור — עד 48 שעות (שר הביטחון/מפכ\"ל), עד 7 ימים בפשע חמור, עד 15 יום בעבירת ביטחון\u003c/div>\u003c/div>\n      \u003cdiv class=\"callout case-callout\">\u003cspan class=\"callout-title\">קשור לפסק דין\u003c/span>\u003cbutton class=\"case-link\" data-case=\"28\">⚖ אסף שי נגד מדינת ישראל (2005)\u003c/button>\u003c/div>\n      \u003ch3>הבאה בפני שופט ומעצר ימים\u003c/h3>\n      \u003cp>עצור ללא צו יובא בפני שופט בהקדם, לא יאוחר מ-24 שעות (הקצין הממונה רשאי להאריך ב-24 שעות נוספות לפעולת חקירה דחופה — סה\"כ עד 48 שעות; בשבת/חג — לפני כניסתה או עד 4 שעות מצאתה).\u003c/p>\n      \u003cp>הסמכות הבלעדית לדון במעצר בצו שופט (סעיף 13) נתונה לבית משפט השלום. תנאים: חשד לעוון/פשע, עילת מעצר, היעדר חלופה. עילה מיוחדת: צורכי חקירה מיוחדים — מוגבלת ל-5 ימים בכל פעם, עד מקסימום מצטבר של 15 יום בעילה זו בלבד.\u003c/p>\n      \u003cdiv class=\"timeline\">\n        \u003cdiv class=\"timeline-step\">\u003cdiv class=\"timeline-date\">15 יום\u003c/div>\u003cdiv class=\"timeline-dot\">\u003c/div>\u003cdiv class=\"timeline-label\">צו ראשון\u003cbr>והארכות\u003c/div>\u003c/div>\n        \u003cdiv class=\"timeline-line\">\u003c/div>\n        \u003cdiv class=\"timeline-step\">\u003cdiv class=\"timeline-date\">30 יום\u003c/div>\u003cdiv class=\"timeline-dot\">\u003c/div>\u003cdiv class=\"timeline-label\">תקרה בסיסית\u003cbr>בשלום\u003c/div>\u003c/div>\n        \u003cdiv class=\"timeline-line\">\u003c/div>\n        \u003cdiv class=\"timeline-step\">\u003cdiv class=\"timeline-date\">75 יום\u003c/div>\u003cdiv class=\"timeline-dot\">\u003c/div>\u003cdiv class=\"timeline-label\">בהסכמת\u003cbr>היועמ\"ש\u003c/div>\u003c/div>\n        \u003cdiv class=\"timeline-line\">\u003c/div>\n        \u003cdiv class=\"timeline-step\">\u003cdiv class=\"timeline-date\">90+ יום\u003c/div>\u003cdiv class=\"timeline-dot end\">\u003c/div>\u003cdiv class=\"timeline-label\">רק שופט\u003cbr>עליון\u003c/div>\u003c/div>\n      \u003c/div>\n"},"arrest-bridge":{"title":"הצהרת תובע ומעצר גישור","html":"\n      \u003cdiv class=\"eyebrow\">סעיף 17(ד) לחוק המעצרים · הרחבה — לא נלמד בהקלטת שיעור 8\u003c/div>\n      \u003ch2>הצהרת תובע ומעצר גישור\u003c/h2>\n      \u003cp>כאשר חקירת המשטרה נסתיימה והחשוד במעצר, הכלל הוא שחרור. אולם סעיף 17(ד) מעניק לבית המשפט סמכות להאריך את המעצר עד 5 ימים — \"מעצר גישור\" — לשם הגשת כתב אישום ובקשה למעצר עד תום ההליכים.\u003c/p>\n      \u003ch3>תנאים מצטברים\u003c/h3>\n      \u003cp>\u003cb>1.\u003c/b> הצהרה בכתב חתומה על ידי תובע, לפיה לאחר עיון בחומר החקירה יש מקום לכאורה להגיש כתב אישום. \u003cb>2.\u003c/b> בית המשפט שוכנע כי יש עילה לכאורה לבקש מעצר עד תום ההליכים.\u003c/p>\n      \u003cdiv class=\"callout warn\">\u003cspan class=\"callout-title\">דגש למבחן\u003c/span>\u003cp>מעצר גישור כפוף לחלוטין לתקרת ימי המעצר הרגילים לפני כתב אישום. אם חלפו כבר 30 יום מעצר — נדרש אישור בכתב של היועץ המשפטי לממשלה להגשת הבקשה.\u003c/p>\u003c/div>\n      \u003cdiv class=\"callout case-callout\">\u003cspan class=\"callout-title\">קשור לפסק דין\u003c/span>\u003cbutton class=\"case-link\" data-case=\"29\">⚖ מוצעב אלטויל נגד מדינת ישראל (2004)\u003c/button>\u003c/div>\n      \u003cdiv class=\"example-box\">\n        \u003cspan class=\"ex-title\">💡 דוגמה — מתי הצהרת תובע פסולה\u003c/span>\n        \u003cp>אם מתברר שהתביעה מתכננת לבצע פעולות חקירה נוספות ומשמעותיות במהלך ימי הגישור עצמם — הצהרת התובע פסולה, ועל המשטרה לפעול במסלול הרגיל של מעצר ימים לצורכי חקירה (פרשת יגמור סאמר).\u003c/p>\n      \u003c/div>\n"},"arrest-pending":{"title":"מעצר עד תום ההליכים","html":"\n      \u003cdiv class=\"eyebrow\">סעיף 21 לחוק המעצרים · הרחבה — לא נלמד בהקלטת שיעור 8\u003c/div>\n      \u003ch2>מעצר עד תום ההליכים\u003c/h2>\n      \u003cp>לאחר הגשת כתב אישום רשמי, המעצר הופך ממעצר חשוד למעצר נאשם עד תום ההליכים. הסמכות העניינית והמקומית נתונה באופן בלעדי לבית המשפט שאליו הוגש כתב האישום — לא בהכרח לשלום.\u003c/p>\n      \u003ch3>ארבעה תנאים מצטברים (21(א))\u003c/h3>\n      \u003cdiv class=\"scenario-row\">\u003cspan class=\"verdict need\">1\u003c/span>\u003cdiv>התקיימות עילת מעצר סטטוטורית\u003c/div>\u003c/div>\n      \u003cdiv class=\"scenario-row\">\u003cspan class=\"verdict need\">2\u003c/span>\u003cdiv>קיומן של ראיות לכאורה להוכחת האשמה\u003c/div>\u003c/div>\n      \u003cdiv class=\"scenario-row\">\u003cspan class=\"verdict need\">3\u003c/span>\u003cdiv>היעדר חלופת מעצר פחות פוגענית\u003c/div>\u003c/div>\n      \u003cdiv class=\"scenario-row\">\u003cspan class=\"verdict need\">4\u003c/span>\u003cdiv>ייצוג הנאשם — או שהודיע שאינו מעוניין בייצוג\u003c/div>\u003c/div>\n      \u003cp>נאשם שאינו מיוצג ואינו מוותר — ניתן לעצור לתקופות עד 7 ימים בכל פעם, עד 30 יום סה\"כ, שבמהלכם ימונה סנגור מטעם הסנגוריה הציבורית.\u003c/p>\n      \u003cdiv class=\"callout case-callout\">\u003cspan class=\"callout-title\">קשור לפסק דין — ראיות לכאורה\u003c/span>\u003cbutton class=\"case-link\" data-case=\"30\">⚖ שלמה זאדה נגד מדינת ישראל (1995)\u003c/button>\u003c/div>\n      \u003ch3>עילות המעצר (21(א)(1))\u003c/h3>\n      \u003cul>\n        \u003cli>חשש לשיבוש הליכי משפט (השפעה על עדים, העלמת ראיות, פגיעה ברכוש)\u003c/li>\n        \u003cli>סכנה לביטחון אדם/ציבור/מדינה\u003c/li>\n        \u003cli>חזקת מסוכנות סטטוטורית (עבירת מיתה/עולם, ביטחון, סמים, אלימות חמורה/במשפחה) — הנטל עובר לנאשם להפריכה\u003c/li>\n        \u003cli>הפרת תנאי ערובה\u003c/li>\n      \u003c/ul>\n      \u003cdiv class=\"callout case-callout\">\u003cspan class=\"callout-title\">קשור לפסק דין — חוקתיות ומסוכנות אישית\u003c/span>\u003cbutton class=\"case-link\" data-case=\"31\">⚖ עימאד גנימאת נגד מדינת ישראל (1995)\u003c/button>\u003c/div>\n      \u003cdiv class=\"example-box\">\n        \u003cspan class=\"ex-title\">💡 דוגמה — חלופת מעצר גם בעבירות חמורות\u003c/span>\n        \u003cp>גם בעבירות מרמה מורכבות או הלבנת הון, חובה לבחון חלופת מעצר כגון מעצר בית או פיקוח אלקטרוני — ואין לעצור אדם מאחורי סורג ובריח רק בשל \"חמת זעם\" ציבורית (פרשת רפי רותם).\u003c/p>\n      \u003c/div>\n      \u003cp>לאחר הגשת כתב אישום, נאשם או סנגורו המבקשים דחייה כדי לעיין בחומרי חקירה מלאים (סעיף 74) — ביהמ\"ש מוסמך לעצור לתקופות קצרות על בסיס \"ניצוץ ראייתי\" בלבד, בפרקטיקה עד 30 יום.\u003c/p>\n"},"arrest-release":{"title":"שחרור אוטומטי, מעצר לאחר הרשעה וערר","html":"\n      \u003cdiv class=\"eyebrow\">סעיפים 52–53, 60–62 לחוק המעצרים · הרחבה — לא נלמד בהקלטת שיעור 8\u003c/div>\n      \u003ch2>שחרור באין משפט/הכרעת דין, מעצר לאחר הרשעה וערר\u003c/h2>\n      \u003ch3>שחרור אוטומטי\u003c/h3>\n      \u003cdiv class=\"scenario-row\">\u003cspan class=\"verdict ok\">סעיף 60 — אין משפט\u003c/span>\u003cdiv>30 יום מהגשת כתב אישום ללא תחילת משפט → שחרור. חריג: 30 יום נוספים לבקשת הנאשם, או הארכות עליון של 90 יום בכל פעם\u003c/div>\u003c/div>\n      \u003cdiv class=\"scenario-row\">\u003cspan class=\"verdict ok\">סעיפים 61–62 — אין הכרעת דין\u003c/span>\u003cdiv>9 חודשים מצטברים ממעצר לאחר כתב אישום ללא הכרעת דין → שחרור. חריג: הארכות עליון של 90 יום, ועד 150 יום בתיק מורכב (ריבוי נאשמים/עדים)\u003c/div>\u003c/div>\n      \u003cdiv class=\"callout case-callout\">\u003cspan class=\"callout-title\">קשור לפסק דין\u003c/span>\u003cbutton class=\"case-link\" data-case=\"32\">⚖ מדינת ישראל נגד איבדיוב (1998)\u003c/button>\u003c/div>\n      \u003cdiv class=\"example-box\">\n        \u003cspan class=\"ex-title\">💡 מורוזובה — מצרפים ימי מעצר, לא מאפסים\u003c/span>\n        \u003cp>לפי דעת הרוב במורוזובה, לאחר ביטול הכרעת הדין מצרפים את ימי המעצר שקדמו להכרעה לימי המעצר לאחר החזרת הדיון. תקופת המאסר אינה נכללת במניין זה. אין להתחיל אוטומטית תשעה חודשים חדשים. אם תקופת המעצר הקודמת קצרה מתשעה חודשים, סמכות הערכאה הדיונית היא ליתרה עד להשלמת התקופה. שאלת האיפוס הופיעה בדעת המיעוט, לא בהלכה שנקבעה.\u003c/p>\n      \u003c/div>\n      \u003ch3>מעצר לאחר הרשעה\u003c/h3>\n      \u003cp>ניתנה הכרעת דין מרשיעה נגד נאשם שהיה עצור 9 חודשים — ביהמ\"ש שהרשיע מוסמך להאריך את מעצרו עד גזר הדין. אם לא ניתן גזר דין תוך 90 יום מההרשעה — שחרור, אלא אם שופט עליון האריך.\u003c/p>\n      \u003ch3>ערר על החלטות מעצר וכן עיכוב שחרור\u003c/h3>\n      \u003cp>על החלטת שלום/מחוזי בעניין מעצר, שחרור או ערובה — ערר בזכות פעם אחת לערכאה הגבוהה יותר, בשופט יחיד (52-53). אם ביהמ\"ש מחליט לשחרר עצור, והתביעה מודיעה במעמד ההחלטה שבכוונתה לערור — ביהמ\"ש רשאי להשהות את השחרור עד 48 שעות, כדי לאפשר הגשת ערר כשהחשוד עדיין במעצר.\u003c/p>\n"},"limitations-pointer":{"html":"\u003cdiv class=\"eyebrow\">טענה מקדמית — סעיף 149(6)\u003c/div>\u003ch2>התיישנות: תזכורת ממוקדת\u003c/h2>\u003cp>בשיעור 7 חזר המרצה על התיישנות העבירה: חטא — שנה; עוון — חמש שנים; ופשע רגיל — עשר שנים. בפשע חמור נדרשים \u003cb>שני תנאים מצטברים\u003c/b>: עונש של יותר משבע שנות מאסר והופעה בתוספת; התקופה היא 15 שנים. עבירות שעונשן מיתה או מאסר עולם מתיישנות לאחר 30 שנים, ולרשימת העבירות המצומצמת שהמרצה מנה אין התיישנות.\u003c/p>\u003cp>פעולת חקירה, כתב אישום והליך מטעם בית המשפט הם אירועים מנתקים. מנגנון \"התקופה הנוספת\" נוגע, לפי ההסבר בשיעור, לאירוע מנתק מסוג פעולת חקירה בלבד. המרצה הורה \u003cb>לא ללמוד למבחן\u003c/b> את טבלת ההארכות ואת נושא התיישנות עבירות המין בקטינים, אף שהם מופיעים במצגת.\u003c/p>\u003cp>בהתיישנות עונש: הדיון הוא בעונש שלא התחיל להתבצע או שביצועו הופסק שלא באשמת הנידון. בפשע, עוון וחטא ציין המרצה תקופות של 20, 10 ו־3 שנים בהתאמה; זמן התחמקות או שהייה בחו״ל אינו בא במניין בפשע ובעוון.\u003c/p>\u003cbutton class=\"case-link\" id=\"open-limitations-btn\">⏳ עבור/י ללשונית ההתיישנות\u003c/button>\u003ch3>פרטים שנוספו במצגת\u003c/h3>\u003cp>המצגת מפרטת אירועים ותקופות שאינם מובאים במניין ההתיישנות, לרבות אי־יכולת לאתר חשוד או עד מרכזי, התחמקות, מצב רפואי/נפשי, עזרה משפטית ממדינה אחרת, הליכים שנוקט החשוד, חסינות והתקופה שבה מתקיים הסדר סגירת תיק. בהליכי חקירה, \"התקופה הנוספת\" והארכותיה תלויות בסיווג העבירה ובגורם המאשר; אין להחילן על חטא.\u003c/p>"},"summations":{"title":"סיכומים בכתב ובעל־פה","html":"\u003ch2>סיכומים: מי מדבר אחרון ובאיזו מתכונת?\u003c/h2>\u003cp>\u003cb>תקציר:\u003c/b> בתום הראיות הצדדים מסכמים את התמונה ומסבירים איזו מסקנה יש להסיק. לפי הסבר המרצה על סעיף 169, התובע מסכם תחילה ואחריו הנאשם. יש להבחין בין סדר הטיעון, מתכונתו והסעד כשנטען לפגם.\u003c/p>\u003ch3>מה הדגיש המרצה?\u003c/h3>\u003cp>הסיכומים מרכזים את הראיות והטענות; זכות המילה האחרונה ניתנת לנאשם. המרצה הבהיר גם שסיום הסיכומים אינו מחסום מוחלט בפני הסמכות להביא ראיות מטעם בית המשפט. אין לערבב בין סיכומים לעניין האשמה לבין הטיעונים לעונש.\u003c/p>\u003ch3>שני מקרים שמחדדים את ההבחנה\u003c/h3>\u003cp>\u003cb>זכריא:\u003c/b> דיון התקיים, והסנגור בחר להסתפק בכתב. הטענה המאוחרת לכפייה לא נתמכה בפרוטוקול. ההחלטה מדגישה את חשיבות הטיעון בעל־פה, בלי לבטל את ההליך בנסיבות אלה.\u003c/p>\u003cbutton class=\"case-link\" data-case=\"8\">ניתוח זכריא\u003c/button>\u003cp>\u003cb>פלוני:\u003c/b> תיק עבירות מס שבו הוגשו סיכומים בכתב בהסכמה. לא הוכח עיוות דין, ולכן ההליך לא בוטל רק בשל המתכונת הכתובה.\u003c/p>\u003cbutton class=\"case-link\" data-case=\"9\">ניתוח פלוני\u003c/button>\u003ch3>סדר פתרון לקייס\u003c/h3>\u003col>\u003cli>מהו השלב — משפט או ערעור?\u003c/li>\u003cli>האם התקיים דיון והאם ניתנה הזדמנות לטעון?\u003c/li>\u003cli>האם הושגה הסכמה, ומה נרשם בפרוטוקול?\u003c/li>\u003cli>איזו פגיעה קונקרטית בהגנה נטענת?\u003c/li>\u003cli>מפרידים בין פגם נטען לבין השאלה אם הוא מצדיק ביטול.\u003c/li>\u003c/ol>"}};
const TOPICS = [{"group":"🔍 שקיפות ומקורות","items":[{"id":"lesson6-note","tag":"⚠","title":"הערה חשובה על מקורות ואימות התוכן","html":"\u003ch2>מקורות, מיקוד ומה עוד נבדק\u003c/h2>\u003cp>התוכן מבוסס על מחברת הקורס בלבד. בוצעה ביקורת ממוקדת ותוקנו הממצאים המתועדים כאן; \u003cb>אין הצהרה שכל ההקלטות וכל ההלכות אומתו במלואן.\u003c/b>\u003c/p>\u003cul>\u003cli>שיעור 7: התיישנות עבירות מין בקטינים וטבלת הארכת התקופה הנוספת הוצאו מהחומר. התקופה הנוספת הבסיסית עצמה לא הוצאה.\u003c/li>\u003cli>שיעור 8: סיום המשפט, ענישה וערעור. חומר המעצרים אינו מיוחס עוד להקלטה זו.\u003c/li>\u003cli>תוקנו קנזי, מורוזובה, סעיף 23(ב) ושאלת תאריך ההתיישנות.\u003c/li>\u003cli>סיכומי פסיקה שטרם אומתו מסומנים כך. אין להסיק מהיעדר עדכון במחברת שהלכה תקפה כיום.\u003c/li>\u003c/ul>\u003cp>צ׳אט המחברת מסייע באיתור, אך אינו תחליף למקור: נמצאה בו גם טעות בזיהוי דעת הרוב במורוזובה.\u003c/p>\u003cp>\u003cb>מצגת 4 — שקפים 1–35:\u003c/b> נבדקו מול האתר. הנושאים המהותיים שנבדקו (הלכת יששכרוב ופסילת ראיות, חיפוש בהסכמה, סעיפים 5–6 ו־66–74 לחסד״פ, מעצר/עיכוב ומועדי סעיף 61) כבר מכוסים; לא נמצא פער המחייב תיקון.\u003c/p>\u003cp>\u003cb>מצגת 4 — שקפים 36–70:\u003c/b> נבדקו מול האתר. הנושאים המהותיים שנבדקו (סמכויות מעצר ועיכוב לפי סעיפים 23–37, הבאה בפני שופט, זכויות העצור, חלופות, מועדי 24/48 שעות, סעיפי 59–62 והארכות מעצר) כבר מכוסים; לא נמצא פער המחייב תיקון.\u003c/p>\u003cp>\u003cb>מצגת 4 — שקפים 71–100:\u003c/b> נבדקו מול האתר. הנושאים המהותיים שנבדקו (מעצר עד תום ההליכים לפי סעיף 21, ראיות לכאורה, עילות מעצר, חלופות, חזקות, מועדי 30 יום/9 חודשים והארכות 90/150 ימים) כבר מכוסים; לא נמצא פער המחייב תיקון.\u003c/p>","lesson":"info","status":"ממצאי ביקורת מתועדים","source":"שיעור 7 ערוך.mp3 — דברי המרצה בתחילת הדיון בהתיישנות; שיעור8 ערוך.mp3 — דיון בסיום המשפט ובערעור","lessons":["info"]}]},{"group":"יסודות ועקרונות יסוד","items":[{"id":"circles","tag":"1","title":"שלושת המעגלים של התיק הפלילי (נלמד בשיעור 1)","html":"\n      \u003cdiv class=\"eyebrow\">יסודות\u003c/div>\n      \u003ch2>שלושת המעגלים המרכיבים את התיק הפלילי\u003c/h2>\n      \u003cul>\n        \u003cli>\u003cb>דיני העונשין (הדין המהותי)\u003c/b> — מה מותר/אסור והעונש בצידו. יסוד עובדתי + יסוד נפשי, מעבר לספק סביר.\u003c/li>\n        \u003cli>\u003cb>דיני הראיות (הדין הקדם־דיוני)\u003c/b> — קבילות (למשל פוליגרף אינו קביל) ומשקל (כגון שרשרת המוצג).\u003c/li>\n        \u003cli>\u003cb>סדרי הדין (הדין הפרוצדורלי)\u003c/b> — כללי המעצר, החיפוש וניהול הדיונים.\u003c/li>\n      \u003c/ul>\n      \u003cp>\u003cb>רף ההוכחה:\u003c/b> אזרחי — מאזן הסתברויות (51%). פלילי — מעבר לספק סביר, ללא מספר מוגדר בפסיקה.\u003c/p>\n      \u003cdiv class=\"callout case-callout\">\u003cspan class=\"callout-title\">קשור לפסק דין\u003c/span>\u003cbutton class=\"case-link\" data-case=\"0\">⚖ סילוסטר נגד היועץ המשפטי לממשלה (1948)\u003c/button>\u003c/div>\n      \u003cbutton class=\"expand-link\" data-topic=\"circles\">🔎 קריאה מורחבת — כל דברי המרצה, דוגמאות וסיפור מהשטח\u003c/button>\n    ","lesson":"1","status":"אומת מול הקלטת שיעור 1","lessons":["1"],"source":"שיעור 1.mp3 — דברי המרצה"},{"id":"adversarial","tag":"2","title":"אדברסרית מול אינקוויזיטורית (נלמד בשיעור 1)","html":"\u003cdiv class=\"eyebrow\">שיעור 1\u003c/div>\u003ch2>השיטה האדברסרית — מודל והסתייגות\u003c/h2>\u003cp>המרצה הציג את השיטה האדברסרית כשיטה שבה הצדדים מנהלים את הבאת הראיות והטיעון, והשופט מכריע. הוא הדגיש שאין מדינה הפועלת לפי מודל טהור לחלוטין: בישראל השיטה בעיקרה אדברסרית, לצד חריגים.\u003c/p>\u003cp>החריג שנלמד הוא סעיף 167, המאפשר לבית המשפט להביא ראיה מיוזמתו לאחר שהצדדים סיימו את ראיותיהם, במקרים המתאימים.\u003c/p>","lesson":"1","status":"אומת מול הקלטת שיעור 1","lessons":["1"],"source":"שיעור 1.mp3 — דברי המרצה"},{"id":"packer","tag":"3","title":"שני המודלים של הרברט פקר (נלמד בשיעור 1)","html":"\n      \u003cdiv class=\"eyebrow\">תיאוריה\u003c/div>\n      \u003ch2>שני מודלים למשפט הפלילי — הרברט פקר\u003c/h2>\n      \u003cul>\n        \u003cli>\u003cb>מיגור הפשיעה\u003c/b> — המטרה מקדשת את האמצעים.\u003c/li>\n        \u003cli>\u003cb>ההליך הראוי\u003c/b> — זכויות הנאשם עליונות.\u003c/li>\n      \u003c/ul>\n      \u003cp>בארה\"ב: פירות העץ המורעל (פסילה אוטומטית). בישראל (הלכת יששכרוב): \u003cb>פסילה פסיקתית יחסית\u003c/b> — שיקול דעת לפי איזון אינטרסים.\u003c/p>\n      \u003cdiv class=\"callout case-callout\">\u003cspan class=\"callout-title\">קשור לפסקי דין\u003c/span>\u003cbutton class=\"case-link\" data-case=\"25\">⚖ יששכרוב\u003c/button> \u003cbutton class=\"case-link\" data-case=\"2\">⚖ בן חיים\u003c/button>\u003c/div>\n      \u003cbutton class=\"expand-link\" data-topic=\"packer\">🔎 קריאה מורחבת\u003c/button>\n    ","lesson":"1","status":"אומת מול הקלטת שיעור 1","lessons":["1"],"source":"שיעור 1.mp3 — דברי המרצה"},{"id":"sec184","tag":"4","title":"סעיף 184 — הרשעה בעבירה שהתגלתה (נלמד בשיעור 1)","html":"\u003cdiv class=\"eyebrow\">חסד״פ\u003c/div>\u003ch2>סעיף 184 לחסד״פ והלכת דמיאניוק\u003c/h2>\u003cp>הסעיף מאפשר להרשיע בעבירה שאשמתו בה נתגלתה מן העובדות שהוכחו, אף אם היא שונה מן העבירה שבכתב האישום. לפי ההסבר בשיעור 1, נדרשים \u003cb>שני תנאים מצטברים\u003c/b>: ניתנה לנאשם הזדמנות סבירה להתגונן מפני העבירה האחרת; ולא יוטל עליו בשל אותה עבירה עונש חמור מזה שהיה אפשר להטיל בשל העבירה המקורית.\u003c/p>\u003cdiv class=\"callout warn\">\u003cspan class=\"callout-title\">יישום בדמיאניוק\u003c/span>\u003cp>העובדה שהוכחה עבירה אחרת אינה מספיקה. המרצה הסביר כי דמיאניוק התגונן לאורך המשפט מפני האישום המסוים שיוחס לו, ולא מפני האישום החלופי; לכן לא הייתה לו הזדמנות סבירה להתגונן מפניו.\u003c/p>\u003c/div>\u003cdiv class=\"callout case-callout\">\u003cspan class=\"callout-title\">קשור לפסק דין\u003c/span>\u003cbutton class=\"case-link\" data-case=\"3\">⚖ דמיאניוק נגד מדינת ישראל (1988)\u003c/button>\u003c/div>","lesson":"1","status":"אומת מול הקלטת שיעור 1","lessons":["1"],"source":"שיעור 1.mp3 — הדיון בסעיף 184 ובהלכת דמיאניוק"},{"id":"classify","tag":"5","title":"סיווג עבירות — סעיף 24 (נלמד בשיעור 1)","html":"\n      \u003cdiv class=\"eyebrow\">חובה לבחינה\u003c/div>\n      \u003ch2>סיווג העבירות — סעיף 24 לחוק העונשין\u003c/h2>\n      \u003cul>\n        \u003cli>\u003cb>חטא\u003c/b> — עד 3 חודשים מאסר, או קנס.\u003c/li>\n        \u003cli>\u003cb>עוון\u003c/b> — מעל 3 חודשים ועד 3 שנים (כולל).\u003c/li>\n        \u003cli>\u003cb>פשע\u003c/b> — מעל 3 שנים.\u003c/li>\n      \u003c/ul>\n      \u003cp>\u003cb>מלכודת:\u003c/b> בדיוק 3 שנים = עוון. סעיף 42: אין תקופה קצובה = שנה אחת = עוון אוטומטית.\u003c/p>\n      \u003cbutton class=\"expand-link\" data-topic=\"classify\">🔎 קריאה מורחבת\u003c/button>\n    ","lesson":"1","status":"אומת מול הקלטת שיעור 1","lessons":["1"],"source":"שיעור 1.mp3 — דברי המרצה"},{"id":"sec59","tag":"6","title":"תחילת ההליך הפלילי — סעיף 59 (נלמד בשיעור 1)","html":"\n      \u003cdiv class=\"eyebrow\">חסד\"פ\u003c/div>\n      \u003ch2>תחילת ההליך הפלילי — סעיף 59 לחסד\"פ\u003c/h2>\n      \u003cp>נפתח כשנודע למשטרה על עבירה. חובה מוחלטת לרשום כל תלונה.\u003c/p>\n      \u003cul>\n        \u003cli>\u003cb>פשע\u003c/b> — חובת חקירה מוחלטת. חריג: הלכת צדוק (תלונה מופרכת).\u003c/li>\n        \u003cli>\u003cb>חטא/עוון\u003c/b> — קצין פקד+ רשאי שלא לחקור, משיקולי מדיניות או רשות אחרת מוסמכת.\u003c/li>\n      \u003c/ul>\n      \u003cdiv class=\"callout case-callout\">\u003cspan class=\"callout-title\">קשור לפסק דין\u003c/span>\u003cbutton class=\"case-link\" data-case=\"4\">⚖ צדוק נגד ראש אגף חקירות ומודיעין (2007)\u003c/button>\u003c/div>\n      \u003cbutton class=\"expand-link\" data-topic=\"sec59\">🔎 קריאה מורחבת\u003c/button>\n    ","lesson":"1","status":"אומת מול הקלטת שיעור 1","lessons":["1"],"source":"שיעור 1.mp3 — הדיון בסעיף 59 ובדוגמת גניבה ממעסיק"}]},{"group":"התביעה וסגירת תיקים","items":[{"id":"bodies","tag":"7","title":"גופי התביעה — סעיף 60 (נלמד בשיעור 2)","html":"\n      \u003cdiv class=\"eyebrow\">חלוקת עבודה\u003c/div>\n      \u003ch2>גופי התביעה — חלוקת עבודה לפי סעיף 60\u003c/h2>\n      \u003cul>\n        \u003cli>\u003cb>הפרקליטות\u003c/b> — פשע חמור (רצח, אונס, שוחד, ביטחוני, צווארון לבן) + עוון רגיש ציבורית.\u003c/li>\n        \u003cli>\u003cb>התביעה המשטרתית\u003c/b> — פשע קל ורוב העוון/חטא.\u003c/li>\n      \u003c/ul>\n      \u003cp>פרקליט המחוז רשאי לחרוג מהחלוקה — לא פוסל את ההליך.\u003c/p>\n      \u003cp>\u003cb>חוק ההמלצות:\u003c/b> איסור המלצה בכתב להעמדה לדין, וחובת סיכום תשתית ראייתית (עם חריגים לכל אחד).\u003c/p>\n      \u003cbutton class=\"expand-link\" data-topic=\"bodies\">🔎 קריאה מורחבת\u003c/button>\n    ","lesson":"2","status":"תוכן קיים — טרם הושלם אימות פרטני","lessons":["2"]},{"id":"hearing","tag":"8","title":"זכות השימוע — סעיף 60א (נלמד בשיעור 2)","html":"\n      \u003cdiv class=\"eyebrow\">זכויות החשוד\u003c/div>\n      \u003ch2>חובת היידוע וזכות השימוע — סעיף 60א\u003c/h2>\n      \u003cp>בעבירת פשע בלבד — מכתב יידוע. שימוע \u003cb>בכתב תוך 30 יום = חובה\u003c/b>; בעל־פה = רשות.\u003c/p>\n      \u003cp>חריגים לחובת יידוע: מעצר, מניעה ביטחונית, אלימות במשפחה/עבירות מין במשפחה.\u003c/p>\n      \u003cdiv class=\"callout case-callout\">\u003cspan class=\"callout-title\">קשור לפסק דין\u003c/span>\u003cbutton class=\"case-link\" data-case=\"5\">⚖ שמואל נגד היועץ המשפטי לממשלה (2008)\u003c/button>\u003c/div>\n      \u003cbutton class=\"expand-link\" data-topic=\"hearing\">🔎 קריאה מורחבת\u003c/button>\n    ","lesson":"2","status":"תוכן קיים — טרם הושלם אימות פרטני","lessons":["2"]},{"id":"closure","tag":"9","title":"עילות סגירת תיק — סעיף 62 (נלמד בשיעור 2)","html":"\n      \u003cdiv class=\"eyebrow\">חסד\"פ\u003c/div>\n      \u003ch2>עילות סגירת תיק — סעיף 62\u003c/h2>\n      \u003cul>\n        \u003cli>\u003cb>חוסר ראיות מספיקות\u003c/b> — רישום פנימי.\u003c/li>\n        \u003cli>\u003cb>נסיבות העניין\u003c/b> — רישום פנימי + אישור גורם בכיר (3 דרגות).\u003c/li>\n        \u003cli>\u003cb>חוסר אשמה\u003c/b> — \"עילת הזהב\" — מחיקה מוחלטת.\u003c/li>\n      \u003c/ul>\n      \u003cdiv class=\"callout case-callout\">\u003cspan class=\"callout-title\">קשור לפסקי דין\u003c/span>\u003cbutton class=\"case-link\" data-case=\"6\">⚖ נוה\u003c/button> \u003cbutton class=\"case-link\" data-case=\"24\">⚖ אפל\u003c/button>\u003c/div>\n      \u003cbutton class=\"expand-link\" data-topic=\"closure\">🔎 קריאה מורחבת\u003c/button>\n    ","lesson":"2","status":"תוכן קיים — טרם הושלם אימות פרטני","lessons":["2"]}]},{"group":"עררים והסדר מותנה","items":[{"id":"appeal","tag":"10","title":"מסלול העררים — סעיפים 64–65 (נלמד בשיעור 3)","html":"\n      \u003cdiv class=\"eyebrow\">זכויות המתלונן\u003c/div>\n      \u003ch2>מסלול העררים — סעיפים 64–65\u003c/h2>\n      \u003cp>ערר בכתב תוך \u003cb>60 יום\u003c/b> מהודעת הסגירה.\u003c/p>\n      \u003cul>\n        \u003cli>גוף חוקר/תובע משטרתי → פרקליט המחוז / מנהל תחום עררים\u003c/li>\n        \u003cli>פרקליט מחוז/מדינה, עילה מקצועית → פרקליט המדינה\u003c/li>\n        \u003cli>פרקליט מחוז/מדינה, עילת מדיניות → היועמ\"ש\u003c/li>\n        \u003cli>פרקליט המדינה עצמו → היועמ\"ש\u003c/li>\n      \u003c/ul>\n      \u003cp>\u003cb>אין לערור פעמיים.\u003c/b> חשוד לא מקבל הודעה אוטומטית על ערר, אלא רק אם שוקלים לקבלו.\u003c/p>\n      \u003cbutton class=\"expand-link\" data-topic=\"appeal\">🔎 קריאה מורחבת\u003c/button>\n    ","lesson":"3","status":"תוכן קיים — טרם הושלם אימות פרטני","lessons":["3"]},{"id":"conditional","tag":"11","title":"ההסדר המותנה — סעיפים 67א–ו (נלמד בשיעור 3)","html":"\n      \u003cdiv class=\"eyebrow\">מסלול חלופי\u003c/div>\n      \u003ch2>ההסדר המותנה — סעיפים 67א–ו\u003c/h2>\n      \u003cp>סגירת תיק ללא כתב אישום, בתמורה להודאה ותנאים שיקומיים.\u003c/p>\n      \u003cul>\n        \u003cli>לפי המסגרת שהמרצה לימד: ראיות מספיקות; חטא/עוון; העונש המתאים אינו כולל מאסר בפועל; אין תיקים תלויים ועומדים ועבר נקי בחמש השנים שקדמו לעבירה, לרבות הסדרים קודמים\u003c/li>\n      \u003c/ul>\n      \u003cp>חובת חשיפה מיוחדת של טיוטת כתב האישום \u003cb>לפני\u003c/b> הגשתו. הפרה → כתב אישום מקורי, אך בלי בקשת מאסר בפועל.\u003c/p>\n      \u003cbutton class=\"expand-link\" data-topic=\"conditional\">🔎 קריאה מורחבת\u003c/button>\n    ","lesson":"3","status":"תנאי הסף והעיון נבדקו; יתר ההרחבה עדיין בביקורת","lessons":["3"],"source":"שיעור 3.mp3 — הסבר המרצה על סגירת תיק בהסדר, תנאי הסף והעיון לפני חתימה"},{"id":"kanzi","tag":"12","title":"עדות שותפים — מקנזי לביטול הכלל","html":"\u003ch2>עדות שותף: קנזי והשינוי בהלכה\u003c/h2>\u003cp>\u003cb>הבחנה מכרעת:\u003c/b> הלכת קנזי היא נקודת המוצא ההיסטורית, לא סוף ההתפתחות. בבג״ץ 11339/05 בוטל הכלל החוסם ככלל העדת שותף שמשפטו הנפרד תלוי ועומד.\u003c/p>\u003cp>הכלל שנקבע: ניתן להעידו; דחיית העדות עד תום משפטו אפשרית במקרים חריגים ביותר, מטעמים שיירשמו. אין לערבב זאת עם נאשמים באותו כתב אישום וההסדר שבסעיף 155.\u003c/p>","lesson":"3","status":"תוקן מול פסק הדין","source":"מדינת ישראל נ׳ בית המשפט המחוזי באר שבע 11339-05.pdf — ההכרעה הסופית ודעת הנשיאה ביניש, פסקה 3","lessons":["3","7"]}]},{"group":"כתב האישום","items":[{"id":"structure","tag":"13","title":"מבנה כתב האישום — סעיף 85 (נלמד בשיעור 4)","html":"\n      \u003cdiv class=\"eyebrow\">חסד\"פ\u003c/div>\n      \u003ch2>מבנה כתב האישום — סעיף 85\u003c/h2>\n      \u003cul>\n        \u003cli>בית משפט מוסמך, מדינת ישראל כמאשימה, פרטי הנאשם\u003c/li>\n        \u003cli>פרק העובדות (עובדות בלבד, לא ראיות)\u003c/li>\n        \u003cli>הוראות החיקוק\u003c/li>\n        \u003cli>\u003cb>רשימת עדי תביעה — סגורה וקשיחה\u003c/b>, כולל שוטרים טכניים\u003c/li>\n      \u003c/ul>\n      \u003cbutton class=\"expand-link\" data-topic=\"structure\">🔎 קריאה מורחבת\u003c/button>\n    ","lesson":"4","status":"תוכן קיים — טרם הושלם אימות פרטני","lessons":["4"]},{"id":"amend","tag":"14","title":"תיקון כתב האישום — סעיף 92 (נלמד בשיעור 4)","html":"\n      \u003cdiv class=\"eyebrow\">קו פרשת המים\u003c/div>\n      \u003ch2>תיקון כתב האישום — סעיף 92\u003c/h2>\n      \u003cp>\u003cb>לפני הקראה\u003c/b> — תיקון חופשי. \u003cb>אחרי הקראה\u003c/b> — בקשה רשמית + הזדמנות סבירה להתגונן.\u003c/p>\n      \u003cbutton class=\"expand-link\" data-topic=\"amend\">🔎 קריאה מורחבת\u003c/button>\n    ","lesson":"4","status":"תוכן קיים — טרם הושלם אימות פרטני","lessons":["4"]},{"id":"joinder","tag":"15","title":"צירוף אישומים ונאשמים — 86-87 (נלמד בשיעור 4)","html":"\n      \u003cdiv class=\"eyebrow\">יעילות דיונית\u003c/div>\n      \u003ch2>צירוף אישומים ונאשמים — 86–87\u003c/h2>\n      \u003cp>צירוף לפי עובדות משותפות/דומות, או שותפות בעבירה.\u003c/p>\n      \u003cdiv class=\"callout case-callout\">\u003cspan class=\"callout-title\">קשור לפסק דין\u003c/span>\u003cbutton class=\"case-link\" data-case=\"10\">⚖ סוסן (1995) — סמכות נגררת\u003c/button>\u003c/div>\n      \u003cbutton class=\"expand-link\" data-topic=\"joinder\">🔎 קריאה מורחבת\u003c/button>\n    ","lesson":"4","status":"תוכן קיים — טרם הושלם אימות פרטני","lessons":["4"]},{"id":"withdraw","tag":"16","title":"חזרה מכתב אישום — סעיף 94 (נלמד בשיעור 4)","html":"\n      \u003cdiv class=\"eyebrow\">חסד\"פ\u003c/div>\n      \u003ch2>חזרה מכתב אישום — סעיף 94\u003c/h2>\n      \u003cp>\u003cb>לפני תשובה\u003c/b> — ביטול בלבד. \u003cb>אחרי תשובה\u003c/b> — זיכוי מוחלט (או ביטול בהסכמה, עם דרישת אישור היועמ\"ש להגשה מחדש).\u003c/p>\n      \u003cbutton class=\"expand-link\" data-topic=\"withdraw\">🔎 קריאה מורחבת\u003c/button>\n    ","lesson":"4","status":"תוכן קיים — טרם הושלם אימות פרטני","lessons":["4"]}]},{"group":"זכויות הנאשם וקדם-משפט","items":[{"id":"defendant","tag":"17","title":"מחשוד לנאשם (נלמד בשיעור 5)","html":"\n      \u003cdiv class=\"eyebrow\">מעמד\u003c/div>\n      \u003ch2>מחשוד לנאשם\u003c/h2>\n      \u003cp>עם הגשת כתב האישום למזכירות ביהמ\"ש — החשוד הופך מיידית ל\"נאשם\".\u003c/p>\n    ","lesson":"5","status":"תוכן קיים — טרם הושלם אימות פרטני","lessons":["5"]},{"id":"review","tag":"18","title":"זכות העיון — סעיף 74 (נלמד בשיעור 5)","html":"\n      \u003cdiv class=\"eyebrow\">זכויות הנאשם\u003c/div>\n      \u003ch2>זכות העיון בחומר חקירה — סעיף 74\u003c/h2>\n      \u003cp>קמה עם הגשת כתב האישום. חלה \u003cb>רק בפשע/עוון\u003c/b>, לא בחטא.\u003c/p>\n      \u003cp>כשמסרבים לחשוף: בקשה לביהמ\"ש → ערר יחיד לערכאה בכירה → 3 אפשרויות (לחשוף / לא להשתמש כראיה / לחזור מהאישום).\u003c/p>\n      \u003cdiv class=\"callout case-callout\">\u003cspan class=\"callout-title\">קשור לפסק דין\u003c/span>\u003cbutton class=\"case-link\" data-case=\"5\">⚖ שמואל (2008)\u003c/button>\u003c/div>\n      \u003cbutton class=\"expand-link\" data-topic=\"review\">🔎 קריאה מורחבת\u003c/button>\n    \u003ch3>פומביות הדיון ואיסור פרסום חומרי חקירה\u003c/h3>\u003cp>פומביות הדיון וחופש הביטוי אינם מוחלטים. בבקשה לפרסם חומרי חקירה או תיעוד מהליך פלילי יש לאזן בין עניין הציבור ופומביות ההליך לבין פרטיות, שם טוב, הגינות ההליך והחשש להשפעה על עדים או לזיהום המשפט. ככל שהחקירה או המשפט פעילים והפרסום עלול לפגוע ממשית בהליך, ניתן למנוע או לעכב את הפרסום מכוח סעיף 70 לחוק בתי המשפט וההסדרים שנלמדו. התרומה של עניין תורג׳מן ורשות השידור היא יישום אותו איזון על פרסום תקשורתי של חומרי חקירה, ולא יצירת כלל נפרד לכל אחד מהם.\u003c/p>","lesson":"5","status":"הורחב מול ניתוחי פסקי דין מקבוצה C","lessons":["5"],"source":"מדינת ישראל נ' המשיבים רון תורג'מן.pdf — ניתוח קבוצה C; רשות השידור נ' מדינת ישראל.pdf — ניתוח קבוצה C"},{"id":"reading","tag":"19","title":"הקראת כתב האישום והסכמות (נלמד בשיעור 5)","html":"\u003cdiv class=\"eyebrow\">מצגת 2 · סעיפים 74–84\u003c/div>\u003ch2>עיון בחומר החקירה\u003c/h2>\u003cp>לאחר כתב אישום בעוון או בפשע זכאים הנאשם וסנגורו לעיין ולהעתיק את חומר החקירה. הרשימה הנלווית כוללת גם ציון קיומם של חומר שאינו חומר חקירה, חומר חסוי וחומר מודיעיני, עם סוג, נושא ומועד — בכפוף לחיסיון.\u003c/p>\u003cp>הסייגים שנלמדו: ראיות הזמה, עניינים פורמליים שאינם מהותיים, חומר חסוי, והסדרים מיוחדים בבגידה או ריגול. אם לא ניתנה הזדמנות סבירה לעיין, סעיף 77(א) מונע מן התובע להגיש את הראיה או להשמיע את העד, אלא אם ויתרו על כך.\u003c/p>\u003cp>בקשת עיון נדונה ככלל בפני שופט אחד; ערר בזכות יוגש בתוך 30 ימים. לפי פרידן, יש מסלול ערר אחד בלבד.\u003c/p>\u003ch3>אמרת חוץ של עד — סעיף 10א לפקודת הראיות\u003c/h3>\u003cp>קבלת אמרת חוץ של עד אינה תחליף אוטומטי לעדות בבית המשפט. לפי המסגרת שנלמדה, נדרשים תנאים מצטברים: האמרה הוכחה במשפט; מוסר האמרה הוא עד במשפט וניתנה לצדדים הזדמנות לחקרו; והעדות בבית המשפט שונה בפרט מהותי מן האמרה, או שהעד מכחיש את תוכנה או טוען שאינו זוכר. לצד קבילות האמרה יש לבחון את משקלה ואת הראיות המחזקות.\u003c/p>\u003cp>תחבולת חקירה אינה נפסלת כשלעצמה. הגבול הוא פגיעה באוטונומיית הרצון החופשי או פגיעה חמורה בהגינות ההליך; אין לשכפל מכאן את מבחני החיפוש או את דוקטרינת יששכרוב.\u003c/p>\u003cdiv class=\"callout\">\u003cb>השלמת Audit חקיקה:\u003c/b> ויתור על הקראה מחייב את ארבעת התנאים המצטברים המפורטים בשאלה המתוקנת; אין להציג את הכלל כשלושה תנאים בלבד.\u003c/div>","lesson":"5","status":"הורחב מול ניתוח פסק דין מקבוצה C","lessons":["5"],"source":"אלעוקה נ' מדינת ישראל.pdf — ניתוח קבוצה C"}]},{"group":"טענות מקדמיות וסמכות בתי המשפט","items":[{"id":"trial-open6","tag":"20","title":"תזכורת: פתיחת המשפט וזכויות הנאשם (נלמד בשיעור 6)","html":"\u003cdiv class=\"eyebrow\">מצגת 3 · סעיפים 143–145\u003c/div>\u003ch2>פתיחת המשפט: הקראה והסכמות\u003c/h2>\u003cp>הכלל הוא שהמשפט נפתח בהקראת כתב האישום. הוויתור אפשרי רק בארבעה תנאים מצטברים: הנאשם מיוצג; הסנגור הודיע שקרא לנאשם את כתב האישום; הנאשם אישר זאת; והדברים נרשמו בפרוטוקול.\u003c/p>\u003cp>לאחר תחילת המשפט, כאשר הנאשם מיוצג, בית המשפט רשאי לברר הסכמות לעובדות ולקבילות מסמכים ומוצגים, לרבות הגשתם שלא באמצעות עדים (סעיף 144). לפי סעיף 145, בית המשפט יסביר לנאשם את זכויות ההגנה אם ראה צורך בכך.\u003c/p>","lesson":"6","status":"הורחב ואומת מול מצגת 3","lessons":["6"],"source":"דיון פלילי - מצגת שלישית - 234907.PDF, שקפים 1–35"},{"id":"prelim-claims","tag":"21","title":"טענות מקדמיות — סעיף 149 (נלמד בשיעור 6)","html":"\u003cdiv class=\"eyebrow\">מצגת 3 · סעיפים 149–151\u003c/div>\u003ch2>טענות מקדמיות\u003c/h2>\u003cp>הרשימה שבסעיף 149 אינה סגורה. הטענה מועלית בתחילת המשפט, אך ככלל אפשר להעלותה גם בהמשך ואף בערעור. החריג: חוסר סמכות מקומית ופגם או פסול בכתב האישום בשלב מאוחר דורשים רשות בית המשפט.\u003c/p>\u003cp>פגם הוא השמטת פרט ענייני מכתב האישום; פסול הוא אי־עמידה בדרישת כשרות דיונית, כגון כתב אישום שלא הוגש בידי תובע מוסמך. בקבלת טענה בית המשפט יכול לתקן, לבטל או להעביר לבית משפט מוסמך — לא לזכות.\u003c/p>\u003ch3>טענות נוספות\u003c/h3>\u003cp>משפט פלילי אחר התלוי ועומד באותו עניין מוביל לביטול כתב האישום. חסינות וחנינה חוסמות העמדה לדין לפי התנאים שנלמדו; הגנה מן הצדק לפי בורוביץ, נוה ורותם מאפשרת ביטול כאשר ההליך עומד בסתירה מהותית לצדק ולהגינות.\u003c/p>","lesson":"6","status":"הורחב ואומת מול מצגת 3","lessons":["6"],"source":"דיון פלילי - מצגת שלישית - 234907.PDF, שקפים 36–70"},{"id":"court-jurisdiction","tag":"22","title":"סמכות מקומית ועניינית של בתי המשפט (נלמד בשיעור 6)","html":"\u003cdiv class=\"eyebrow\">מצגת 3 · סעיפים 6–8\u003c/div>\u003ch2>סמכות מקומית\u003c/h2>\u003cp>הסמכות מתקיימת במקום ביצוע העבירה או מקום מגורי הנאשם. אם שניהם אינם ידועים — במקום תפיסתו; בעבירת חוץ, כשמקום מגוריו אינו בישראל או אינו ידוע — במקום היחידה החוקרת. בצירוף אישומים או נאשמים מוסמך כל בית משפט שיש לו שיפוט באחת העבירות או על אחד הנאשמים.\u003c/p>\u003cp>כאשר היועץ המשפטי לממשלה קובע שאין בית משפט מוסמך לפי הכללים הרגילים, הסמכות בירושלים. העברה מחמת חוסר סמכות אפשרית לפי סעיף 79 לחוק בתי המשפט; בית המשפט המקבל רשאי להמשיך מן השלב שאליו הגיע קודמו ואינו מעביר שוב.\u003c/p>","lesson":"6","status":"הורחב ואומת מול מצגת 3","lessons":["6"],"source":"דיון פלילי - מצגת שלישית - 234907.PDF, שקפים 1–35"},{"id":"double-jeopardy-justice","tag":"23","title":"סיכון כפול, חסינות, חנינה והגנה מן הצדק (נלמד בשיעור 6)","html":"\n      \u003cdiv class=\"eyebrow\">טענות מקדמיות 4–7\u003c/div>\n      \u003ch2>סיכון כפול, חסינות, חנינה והגנה מן הצדק\u003c/h2>\n      \u003cp>זיכוי/הרשעה קודמים (5), סיכון כפול (נדיר, אף פעם לא התקבל בפועל), חסינויות וחנינה, הגנה מן הצדק.\u003c/p>\n      \u003cdiv class=\"callout case-callout\">\u003cspan class=\"callout-title\">קשור לפסקי דין\u003c/span>\u003cbutton class=\"case-link\" data-case=\"13\">⚖ קרישניסקי\u003c/button> \u003cbutton class=\"case-link\" data-case=\"12\">⚖ הגנה מן הצדק\u003c/button>\u003c/div>\n      \u003cbutton class=\"expand-link\" data-topic=\"double-jeopardy-justice\">🔎 קריאה מורחבת\u003c/button>\n    \u003cdiv class=\"callout\">\u003cspan class=\"callout-ti
