   <div class=\"eyebrow\">חסד\"פ</div>\n      <h2>תחילת ההליך הפלילי — סעיף 59 לחסד\"פ</h2>\n      <p>נפתח כשנודע למשטרה על עבירה. חובה מוחלטת לרשום כל תלונה.</p>\n      <ul>\n        <li><b>פשע</b> — חובת חקירה מוחלטת. חריג: הלכת צדוק (תלונה מופרכת).</li>\n        <li><b>חטא/עוון</b> — קצין פקד+ רשאי שלא לחקור, משיקולי מדיניות או רשות אחרת מוסמכת.</li>\n      </ul>\n      <div class=\"callout case-callout\"><span class=\"callout-title\">קשור לפסק דין</span><button class=\"case-link\" data-case=\"4\">⚖ צדוק נגד ראש אגף חקירות ומודיעין (2007)</button></div>\n      <button class=\"expand-link\" data-topic=\"sec59\">🔎 קריאה מורחבת</button>\n    ","lesson":"1","status":"אומת מול הקלטת שיעור 1","lessons":["1"],"source":"שיעור 1.mp3 — הדיון בסעיף 59 ובדוגמת גניבה ממעסיק"}]},{"group":"התביעה וסגירת תיקים","items":[{"id":"bodies","tag":"7","title":"גופי התביעה — סעיף 60 (נלמד בשיעור 2)","html":"\n      <div class=\"eyebrow\">חלוקת עבודה</div>\n      <h2>גופי התביעה — חלוקת עבודה לפי סעיף 60</h2>\n      <ul>\n        <li><b>הפרקליטות</b> — פשע חמור (רצח, אונס, שוחד, ביטחוני, צווארון לבן) + עוון רגיש ציבורית.</li>\n        <li><b>התביעה המשטרתית</b> — פשע קל ורוב העוון/חטא.</li>\n      </ul>\n      <p>פרקליט המחוז רשאי לחרוג מהחלוקה — לא פוסל את ההליך.</p>\n      <p><b>חוק ההמלצות:</b> איסור המלצה בכתב להעמדה לדין, וחובת סיכום תשתית ראייתית (עם חריגים לכל אחד).</p>\n      <button class=\"expand-link\" data-topic=\"bodies\">🔎 קריאה מורחבת</button>\n    ","lesson":"2","status":"תוכן קיים — טרם הושלם אימות פרטני","lessons":["2"]},{"id":"hearing","tag":"8","title":"זכות השימוע — סעיף 60א (נלמד בשיעור 2)","html":"\n      <div class=\"eyebrow\">זכויות החשוד</div>\n      <h2>חובת היידוע וזכות השימוע — סעיף 60א</h2>\n      <p>בעבירת פשע בלבד — מכתב יידוע. שימוע <b>בכתב תוך 30 יום = חובה</b>; בעל־פה = רשות.</p>\n      <p>חריגים לחובת יידוע: מעצר, מניעה ביטחונית, אלימות במשפחה/עבירות מין במשפחה.</p>\n      <div class=\"callout case-callout\"><span class=\"callout-title\">קשור לפסק דין</span><button class=\"case-link\" data-case=\"5\">⚖ שמואל נגד היועץ המשפטי לממשלה (2008)</button></div>\n      <button class=\"expand-link\" data-topic=\"hearing\">🔎 קריאה מורחבת</button>\n    ","lesson":"2","status":"תוכן קיים — טרם הושלם אימות פרטני","lessons":["2"]},{"id":"closure","tag":"9","title":"עילות סגירת תיק — סעיף 62 (נלמד בשיעור 2)","html":"\n      <div class=\"eyebrow\">חסד\"פ</div>\n      <h2>עילות סגירת תיק — סעיף 62</h2>\n      <ul>\n        <li><b>חוסר ראיות מספיקות</b> — רישום פנימי.</li>\n        <li><b>נסיבות העניין</b> — רישום פנימי + אישור גורם בכיר (3 דרגות).</li>\n        <li><b>חוסר אשמה</b> — \"עילת הזהב\" — מחיקה מוחלטת.</li>\n      </ul>\n      <div class=\"callout case-callout\"><span class=\"callout-title\">קשור לפסקי דין</span><button class=\"case-link\" data-case=\"6\">⚖ נוה</button> <button class=\"case-link\" data-case=\"24\">⚖ אפל</button></div>\n      <button class=\"expand-link\" data-topic=\"closure\">🔎 קריאה מורחבת</button>\n    ","lesson":"2","status":"תוכן קיים — טרם הושלם אימות פרטני","lessons":["2"]}]},{"group":"עררים והסדר מותנה","items":[{"id":"appeal","tag":"10","title":"מסלול העררים — סעיפים 64–65 (נלמד בשיעור 3)","html":"\n      <div class=\"eyebrow\">זכויות המתלונן</div>\n      <h2>מסלול העררים — סעיפים 64–65</h2>\n      <p>ערר בכתב תוך <b>60 יום</b> מהודעת הסגירה.</p>\n      <ul>\n        <li>גוף חוקר/תובע משטרתי → פרקליט המחוז / מנהל תחום עררים</li>\n        <li>פרקליט מחוז/מדינה, עילה מקצועית → פרקליט המדינה</li>\n        <li>פרקליט מחוז/מדינה, עילת מדיניות → היועמ\"ש</li>\n        <li>פרקליט המדינה עצמו → היועמ\"ש</li>\n      </ul>\n      <p><b>אין לערור פעמיים.</b> חשוד לא מקבל הודעה אוטומטית על ערר, אלא רק אם שוקלים לקבלו.</p>\n      <button class=\"expand-link\" data-topic=\"appeal\">🔎 קריאה מורחבת</button>\n    ","lesson":"3","status":"תוכן קיים — טרם הושלם אימות פרטני","lessons":["3"]},{"id":"conditional","tag":"11","title":"ההסדר המותנה — סעיפים 67א–ו (נלמד בשיעור 3)","html":"\n      <div class=\"eyebrow\">מסלול חלופי</div>\n      <h2>ההסדר המותנה — סעיפים 67א–ו</h2>\n      <p>סגירת תיק ללא כתב אישום, בתמורה להודאה ותנאים שיקומיים.</p>\n      <ul>\n        <li>לפי המסגרת שהמרצה לימד: ראיות מספיקות; חטא/עוון; העונש המתאים אינו כולל מאסר בפועל; אין תיקים תלויים ועומדים ועבר נקי בחמש השנים שקדמו לעבירה, לרבות הסדרים קודמים</li>\n      </ul>\n      <p>חובת חשיפה מיוחדת של טיוטת כתב האישום <b>לפני</b> הגשתו. הפרה → כתב אישום מקורי, אך בלי בקשת מאסר בפועל.</p>\n      <button class=\"expand-link\" data-topic=\"conditional\">🔎 קריאה מורחבת</button>\n    ","lesson":"3","status":"תנאי הסף והעיון נבדקו; יתר ההרחבה עדיין בביקורת","lessons":["3"],"source":"שיעור 3.mp3 — הסבר המרצה על סגירת תיק בהסדר, תנאי הסף והעיון לפני חתימה"},{"id":"kanzi","tag":"12","title":"עדות שותפים — מקנזי לביטול הכלל","html":"<h2>עדות שותף: קנזי והשינוי בהלכה</h2><p><b>הבחנה מכרעת:</b> הלכת קנזי היא נקודת המוצא ההיסטורית, לא סוף ההתפתחות. בבג״ץ 11339/05 בוטל הכלל החוסם ככלל העדת שותף שמשפטו הנפרד תלוי ועומד.</p><p>הכלל שנקבע: ניתן להעידו; דחיית העדות עד תום משפטו אפשרית במקרים חריגים ביותר, מטעמים שיירשמו. אין לערבב זאת עם נאשמים באותו כתב אישום וההסדר שבסעיף 155.</p>","lesson":"3","status":"תוקן מול פסק הדין","source":"מדינת ישראל נ׳ בית המשפט המחוזי באר שבע 11339-05.pdf — ההכרעה הסופית ודעת הנשיאה ביניש, פסקה 3","lessons":["3","7"]}]},{"group":"כתב האישום","items":[{"id":"structure","tag":"13","title":"מבנה כתב האישום — סעיף 85 (נלמד בשיעור 4)","html":"\n      <div class=\"eyebrow\">חסד\"פ</div>\n      <h2>מבנה כתב האישום — סעיף 85</h2>\n      <ul>\n        <li>בית משפט מוסמך, מדינת ישראל כמאשימה, פרטי הנאשם</li>\n        <li>פרק העובדות (עובדות בלבד, לא ראיות)</li>\n        <li>הוראות החיקוק</li>\n        <li><b>רשימת עדי תביעה — סגורה וקשיחה</b>, כולל שוטרים טכניים</li>\n      </ul>\n      <button class=\"expand-link\" data-topic=\"structure\">🔎 קריאה מורחבת</button>\n    ","lesson":"4","status":"תוכן קיים — טרם הושלם אימות פרטני","lessons":["4"]},{"id":"amend","tag":"14","title":"תיקון כתב האישום — סעיף 92 (נלמד בשיעור 4)","html":"\n      <div class=\"eyebrow\">קו פרשת המים</div>\n      <h2>תיקון כתב האישום — סעיף 92</h2>\n      <p><b>לפני הקראה</b> — תיקון חופשי. <b>אחרי הקראה</b> — בקשה רשמית + הזדמנות סבירה להתגונן.</p>\n      <button class=\"expand-link\" data-topic=\"amend\">🔎 קריאה מורחבת</button>\n    ","lesson":"4","status":"תוכן קיים — טרם הושלם אימות פרטני","lessons":["4"]},{"id":"joinder","tag":"15","title":"צירוף אישומים ונאשמים — 86-87 (נלמד בשיעור 4)","html":"\n      <div class=\"eyebrow\">יעילות דיונית</div>\n      <h2>צירוף אישומים ונאשמים — 86–87</h2>\n      <p>צירוף לפי עובדות משותפות/דומות, או שותפות בעבירה.</p>\n      <div class=\"callout case-callout\"><span class=\"callout-title\">קשור לפסק דין</span><button class=\"case-link\" data-case=\"10\">⚖ סוסן (1995) — סמכות נגררת</button></div>\n      <button class=\"expand-link\" data-topic=\"joinder\">🔎 קריאה מורחבת</button>\n    ","lesson":"4","status":"תוכן קיים — טרם הושלם אימות פרטני","lessons":["4"]},{"id":"withdraw","tag":"16","title":"חזרה מכתב אישום — סעיף 94 (נלמד בשיעור 4)","html":"\n      <div class=\"eyebrow\">חסד\"פ</div>\n      <h2>חזרה מכתב אישום — סעיף 94</h2>\n      <p><b>לפני תשובה</b> — ביטול בלבד. <b>אחרי תשובה</b> — זיכוי מוחלט (או ביטול בהסכמה, עם דרישת אישור היועמ\"ש להגשה מחדש).</p>\n      <button class=\"expand-link\" data-topic=\"withdraw\">🔎 קריאה מורחבת</button>\n    ","lesson":"4","status":"תוכן קיים — טרם הושלם אימות פרטני","lessons":["4"]}]},{"group":"זכויות הנאשם וקדם-משפט","items":[{"id":"defendant","tag":"17","title":"מחשוד לנאשם (נלמד בשיעור 5)","html":"\n      <div class=\"eyebrow\">מעמד</div>\n      <h2>מחשוד לנאשם</h2>\n      <p>עם הגשת כתב האישום למזכירות ביהמ\"ש — החשוד הופך מיידית ל\"נאשם\".</p>\n    ","lesson":"5","status":"תוכן קיים — טרם הושלם אימות פרטני","lessons":["5"]},{"id":"review","tag":"18","title":"זכות העיון — סעיף 74 (נלמד בשיעור 5)","html":"\n      <div class=\"eyebrow\">זכויות הנאשם</div>\n      <h2>זכות העיון בחומר חקירה — סעיף 74</h2>\n      <p>קמה עם הגשת כתב האישום. חלה <b>רק בפשע/עוון</b>, לא בחטא.</p>\n      <p>כשמסרבים לחשוף: בקשה לביהמ\"ש → ערר יחיד לערכאה בכירה → 3 אפשרויות (לחשוף / לא להשתמש כראיה / לחזור מהאישום).</p>\n      <div class=\"callout case-callout\"><span class=\"callout-title\">קשור לפסק דין</span><button class=\"case-link\" data-case=\"5\">⚖ שמואל (2008)</button></div>\n      <button class=\"expand-link\" data-topic=\"review\">🔎 קריאה מורחבת</button>\n    <h3>פומביות הדיון ואיסור פרסום חומרי חקירה</h3><p>פומביות הדיון וחופש הביטוי אינם מוחלטים. בבקשה לפרסם חומרי חקירה או תיעוד מהליך פלילי יש לאזן בין עניין הציבור ופומביות ההליך לבין פרטיות, שם טוב, הגינות ההליך והחשש להשפעה על עדים או לזיהום המשפט. ככל שהחקירה או המשפט פעילים והפרסום עלול לפגוע ממשית בהליך, ניתן למנוע או לעכב את הפרסום מכוח סעיף 70 לחוק בתי המשפט וההסדרים שנלמדו. התרומה של עניין תורג׳מן ורשות השידור היא יישום אותו איזון על פרסום תקשורתי של חומרי חקירה, ולא יצירת כלל נפרד לכל אחד מהם.</p>","lesson":"5","status":"הורחב מול ניתוחי פסקי דין מקבוצה C","lessons":["5"],"source":"מדינת ישראל נ' המשיבים רון תורג'מן.pdf — ניתוח קבוצה C; רשות השידור נ' מדינת ישראל.pdf — ניתוח קבוצה C"},{"id":"reading","tag":"19","title":"הקראת כתב האישום והסכמות (נלמד בשיעור 5)","html":"<div class=\"eyebrow\">מצגת 2 · סעיפים 74–84</div><h2>עיון בחומר החקירה</h2><p>לאחר כתב אישום בעוון או בפשע זכאים הנאשם וסנגורו לעיין ולהעתיק את חומר החקירה. הרשימה הנלווית כוללת גם ציון קיומם של חומר שאינו חומר חקירה, חומר חסוי וחומר מודיעיני, עם סוג, נושא ומועד — בכפוף לחיסיון.</p><p>הסייגים שנלמדו: ראיות הזמה, עניינים פורמליים שאינם מהותיים, חומר חסוי, והסדרים מיוחדים בבגידה או ריגול. אם לא ניתנה הזדמנות סבירה לעיין, סעיף 77(א) מונע מן התובע להגיש את הראיה או להשמיע את העד, אלא אם ויתרו על כך.</p><p>בקשת עיון נדונה ככלל בפני שופט אחד; ערר בזכות יוגש בתוך 30 ימים. לפי פרידן, יש מסלול ערר אחד בלבד.</p><h3>אמרת חוץ של עד — סעיף 10א לפקודת הראיות</h3><p>קבלת אמרת חוץ של עד אינה תחליף אוטומטי לעדות בבית המשפט. לפי המסגרת שנלמדה, נדרשים תנאים מצטברים: האמרה הוכחה במשפט; מוסר האמרה הוא עד במשפט וניתנה לצדדים הזדמנות לחקרו; והעדות בבית המשפט שונה בפרט מהותי מן האמרה, או שהעד מכחיש את תוכנה או טוען שאינו זוכר. לצד קבילות האמרה יש לבחון את משקלה ואת הראיות המחזקות.</p><p>תחבולת חקירה אינה נפסלת כשלעצמה. הגבול הוא פגיעה באוטונומיית הרצון החופשי או פגיעה חמורה בהגינות ההליך; אין לשכפל מכאן את מבחני החיפוש או את דוקטרינת יששכרוב.</p><div class=\"callout\"><b>השלמת Audit חקיקה:</b> ויתור על הקראה מחייב את ארבעת התנאים המצטברים המפורטים בשאלה המתוקנת; אין להציג את הכלל כשלושה תנאים בלבד.</div>","lesson":"5","status":"הורחב מול ניתוח פסק דין מקבוצה C","lessons":["5"],"source":"אלעוקה נ' מדינת ישראל.pdf — ניתוח קבוצה C"}]},{"group":"טענות מקדמיות וסמכות בתי המשפט","items":[{"id":"trial-open6","tag":"20","title":"תזכורת: פתיחת המשפט וזכויות הנאשם (נלמד בשיעור 6)","html":"<div class=\"eyebrow\">מצגת 3 · סעיפים 143–145</div><h2>פתיחת המשפט: הקראה והסכמות</h2><p>הכלל הוא שהמשפט נפתח בהקראת כתב האישום. הוויתור אפשרי רק בארבעה תנאים מצטברים: הנאשם מיוצג; הסנגור הודיע שקרא לנאשם את כתב האישום; הנאשם אישר זאת; והדברים נרשמו בפרוטוקול.</p><p>לאחר תחילת המשפט, כאשר הנאשם מיוצג, בית המשפט רשאי לברר הסכמות לעובדות ולקבילות מסמכים ומוצגים, לרבות הגשתם שלא באמצעות עדים (סעיף 144). לפי סעיף 145, בית המשפט יסביר לנאשם את זכויות ההגנה אם ראה צורך בכך.</p>","lesson":"6","status":"הורחב ואומת מול מצגת 3","lessons":["6"],"source":"דיון פלילי - מצגת שלישית - 234907.PDF, שקפים 1–35"},{"id":"prelim-claims","tag":"21","title":"טענות מקדמיות — סעיף 149 (נלמד בשיעור 6)","html":"<div class=\"eyebrow\">מצגת 3 · סעיפים 149–151</div><h2>טענות מקדמיות</h2><p>הרשימה שבסעיף 149 אינה סגורה. הטענה מועלית בתחילת המשפט, אך ככלל אפשר להעלותה גם בהמשך ואף בערעור. החריג: חוסר סמכות מקומית ופגם או פסול בכתב האישום בשלב מאוחר דורשים רשות בית המשפט.</p><p>פגם הוא השמטת פרט ענייני מכתב האישום; פסול הוא אי־עמידה בדרישת כשרות דיונית, כגון כתב אישום שלא הוגש בידי תובע מוסמך. בקבלת טענה בית המשפט יכול לתקן, לבטל או להעביר לבית משפט מוסמך — לא לזכות.</p><h3>טענות נוספות</h3><p>משפט פלילי אחר התלוי ועומד באותו עניין מוביל לביטול כתב האישום. חסינות וחנינה חוסמות העמדה לדין לפי התנאים שנלמדו; הגנה מן הצדק לפי בורוביץ, נוה ורותם מאפשרת ביטול כאשר ההליך עומד בסתירה מהותית לצדק ולהגינות.</p>","lesson":"6","status":"הורחב ואומת מול מצגת 3","lessons":["6"],"source":"דיון פלילי - מצגת שלישית - 234907.PDF, שקפים 36–70"},{"id":"court-jurisdiction","tag":"22","title":"סמכות מקומית ועניינית של בתי המשפט (נלמד בשיעור 6)","html":"<div class=\"eyebrow\">מצגת 3 · סעיפים 6–8</div><h2>סמכות מקומית</h2><p>הסמכות מתקיימת במקום ביצוע העבירה או מקום מגורי הנאשם. אם שניהם אינם ידועים — במקום תפיסתו; בעבירת חוץ, כשמקום מגוריו אינו בישראל או אינו ידוע — במקום היחידה החוקרת. בצירוף אישומים או נאשמים מוסמך כל בית משפט שיש לו שיפוט באחת העבירות או על אחד הנאשמים.</p><p>כאשר היועץ המשפטי לממשלה קובע שאין בית משפט מוסמך לפי הכללים הרגילים, הסמכות בירושלים. העברה מחמת חוסר סמכות אפשרית לפי סעיף 79 לחוק בתי המשפט; בית המשפט המקבל רשאי להמשיך מן השלב שאליו הגיע קודמו ואינו מעביר שוב.</p>","lesson":"6","status":"הורחב ואומת מול מצגת 3","lessons":["6"],"source":"דיון פלילי - מצגת שלישית - 234907.PDF, שקפים 1–35"},{"id":"double-jeopardy-justice","tag":"23","title":"סיכון כפול, חסינות, חנינה והגנה מן הצדק (נלמד בשיעור 6)","html":"\n      <div class=\"eyebrow\">טענות מקדמיות 4–7</div>\n      <h2>סיכון כפול, חסינות, חנינה והגנה מן הצדק</h2>\n      <p>זיכוי/הרשעה קודמים (5), סיכון כפול (נדיר, אף פעם לא התקבל בפועל), חסינויות וחנינה, הגנה מן הצדק.</p>\n      <div class=\"callout case-callout\"><span class=\"callout-title\">קשור לפסקי דין</span><button class=\"case-link\" data-case=\"13\">⚖ קרישניסקי</button> <button class=\"case-link\" data-case=\"12\">⚖ הגנה מן הצדק</button></div>\n      <button class=\"expand-link\" data-topic=\"double-jeopardy-justice\">🔎 קריאה מורחבת</button>\n    <div class=\"callout\"><span class=\"callout-title\">חריג לסיכון כפול</span><p>כאשר המעשה גרם למות אדם לאחר הדיון הראשון, ניתן להעמיד לדין פעם נוספת בשל אותו מעשה אם בדיון הראשון נמצא הנאשם אשם, לרבות העמדה למבחן ללא הרשעה.</p></div><h3>הבחנות נוספות</h3><p>\"סיכון כפול\" שונה מטענת \"כבר נשפטתי\" לפי סעיף 5: הראשונה עוסקת בחשיפה חוזרת לסיכון הרשעה כאשר ההליך הקודם לא הסתיים בפסק דין; השנייה מבוססת על מעשה בית דין. הטענה נדירה ואינה חלה כשההליך הקודם בטל מעיקרו, למשל מחוסר סמכות מלכתחילה.</p>","lesson":"6","status":"הורחב ואומת מול מצגת 3","lessons":["6"],"source":"דיון פלילי - מצגת שלישית - 234907.PDF, שקפים 36–70"},{"id":"limitations-pointer","tag":"24","title":"⏳ התיישנות — עיקרי שיעור 7 ולשונית ייעודית","html":"<div class=\"eyebrow\">טענה מקדמית — סעיף 149(6)</div><h2>התיישנות: תזכורת ממוקדת</h2><p>בשיעור 7 חזר המרצה על התיישנות העבירה: חטא — שנה; עוון — חמש שנים; ופשע רגיל — עשר שנים. בפשע חמור נדרשים <b>שני תנאים מצטברים</b>: עונש של יותר משבע שנות מאסר והופעה בתוספת; התקופה היא 15 שנים. עבירות שעונשן מיתה או מאסר עולם מתיישנות לאחר 30 שנים, ולרשימת העבירות המצומצמת שהמרצה מנה אין התיישנות.</p><p>פעולת חקירה, כתב אישום והליך מטעם בית המשפט הם אירועים מנתקים. מנגנון \"התקופה הנוספת\" נוגע, לפי ההסבר בשיעור, לאירוע מנתק מסוג פעולת חקירה בלבד. המרצה הורה <b>לא ללמוד למבחן</b> את טבלת ההארכות ואת נושא התיישנות עבירות המין בקטינים, אף שהם מופיעים במצגת.</p><p>בהתיישנות עונש: הדיון הוא בעונש שלא התחיל להתבצע או שביצועו הופסק שלא באשמת הנידון. בפשע, עוון וחטא ציין המרצה תקופות של 20, 10 ו־3 שנים בהתאמה; זמן התחמקות או שהייה בחו״ל אינו בא במניין בפשע ובעוון.</p><button class=\"case-link\" id=\"open-limitations-btn\">⏳ עבור/י ללשונית ההתיישנות</button><h3>פרטים שנוספו במצגת</h3><p>המצגת מפרטת אירועים ותקופות שאינם מובאים במניין ההתיישנות, לרבות אי־יכולת לאתר חשוד או עד מרכזי, התחמקות, מצב רפואי/נפשי, עזרה משפטית ממדינה אחרת, הליכים שנוקט החשוד, חסינות והתקופה שבה מתקיים הסדר סגירת תיק. בהליכי חקירה, \"התקופה הנוספת\" והארכותיה תלויות בסיווג העבירה ובגורם המאשר; אין להחילן על חטא.</p>","lesson":"7","status":"הורחב ואומת מול מצגת 3","lessons":["7"],"source":"דיון פלילי - מצגת שלישית - 234907.PDF, שקפים 36–70"}]},{"group":"ניהול המשפט","items":[{"id":"defendant-response","tag":"25","title":"תשובת הנאשם, הודאה וחזרה ממנה (נלמד בשיעור 6)","html":"\n      <div class=\"eyebrow\">סעיפים 152–154</div>\n      <h2>תשובת הנאשם, הודאה וחזרה ממנה</h2>\n      <p>שתיקה עשויה לשמש חיזוק. טענת אליבי — מייד. חזרה מהודאה ברשות ביהמ\"ש, מנימוקים מיוחדים.</p>\n      <button class=\"expand-link\" data-topic=\"defendant-response\">🔎 קריאה מורחבת</button>\n    <h3>סעיף 152</h3><p>הנאשם רשאי שלא להשיב, להודות, לכפור או להוסיף עובדות. בית המשפט רשאי לשאול שאלות הבהרה שאינן חורגות מהדרוש. הימנעות מתשובה עשויה לשמש חיזוק, ובית המשפט חייב להסביר זאת. טענת אליבי יש להעלות מיד; איחור מגביל הבאת ראיות אלא ברשות בית המשפט, בלי לגרוע מזכות לחזור מהודאה בנוכחות בזירת העבירה.</p>","lesson":"6","status":"הורחב ואומת מול מצגת 3","lessons":["6"],"source":"דיון פלילי - מצגת שלישית - 234907.PDF, שקפים 36–70"},{"id":"multi-defendants","tag":"26","title":"נאשמים בכתב אישום אחד — סעיף 155","html":"<div class=\"eyebrow\">שיעור 7 · סעיף 155</div><h2>נאשמים בכתב אישום אחד</h2><p>כאשר כמה נאשמים הועמדו לדין <b>באותו כתב אישום</b> וחלקם הודו בעובדות שיש בהן כדי הרשעה, לא ייגזר דינם של מי שהודו לפני שהסתיים בירור משפטם של מי שלא הודו.</p><p>הנימוק שהדגיש המרצה: רק לאחר בירור התמונה המלאה אפשר להעריך את חלקו של כל נאשם בעבירה ואת הענישה המתאימה. אין להשליך מכאן אוטומטית על כתבי אישום נפרדים; אלה מסלולים שונים.</p>","lesson":"7","status":"אומת מול הקלטת שיעור 7","lessons":["7"],"source":"שיעור 7 ערוך.mp3 — דברי המרצה"},{"id":"trial-conduct","tag":"27","title":"ניהול המשפט: תביעה, הגנה והזמה","html":"<div class=\"eyebrow\">שיעור 7 · סעיפים 156–165</div><h2>ניהול המשפט — שלד העבודה</h2><p>המרצה עבר על פרשת התביעה, טענת \"אין להשיב לאשמה\" בסיומה, פרשת ההגנה וראיות ההזמה. סעיף 77א הוזכר בהקשר של מניעת הגשת ראיה שלא ניתנה לנאשם הזדמנות לעיין בה.</p><p>אם הנאשם בוחר להעיד בפרשת ההגנה, עדותו נשמעת תחילה. הימנעות מהעיד עשויה לשמש חיזוק לראיות התביעה. ראיות הזמה טעונות רשות ונועדו לסתור טענה שעלתה בהגנה ושלא הייתה צפויה לתביעה מראש; לאחר שהובאו, רשאי הנאשם להביא ראיות לסתור אותן.</p><h3>הערכת מהימנות וחובת הגינות התביעה</h3><p>הערכת מהימנות היא מלאכת בית המשפט: יש לבחון את עדות העד במכלול, את עקביותה, את הסתירות ואת התמיכה החיצונית, בלי להפוך כלל כללי על מהימנות לתחליף להנמקה. לצד זאת, על התביעה לנהל את ההליך בהגינות ולגלות חומר רלוונטי; מחדל דיוני אינו מוביל אוטומטית לתוצאה אחת, אלא נבחן לפי השפעתו על ההגנה ועל הוגנות ההליך.</p><div class=\"callout\"><b>השלמת Audit חקיקה:</b> בהערכת מהימנות ובחובת ההגינות יש לבחון את העדות במכלול ואת השפעת המחדל על ההגנה; אין תוצאה אוטומטית ללא בחינת הפגיעה.</div>","lesson":"7","status":"הורחב מול ניתוח פסק דין מקבוצה C","lessons":["7"],"source":"חאתם פאיז אלמע'ארי נ' התביעה הצבאית.pdf — ניתוח קבוצה C"}]},{"group":"פסק דין, ענישה וערעור","items":[{"id":"summations","title":"סיכומים בכתב ובעל־פה (שיעור 8)","lesson":"8","lessons":["8"],"status":"נוסף מתוך ההקלטה ופסקי הדין שנבדקו","source":"שיעור8 ערוך.mp3 — לאחר ראיות מטעם בית המשפט; זכריא נ׳ מדינת ישראל.pdf — רע״פ 11160/03, פסקאות 2–4 והערת השופטת פרוקצ׳יה; פלוני נ׳ מדינת ישראל 5333-11.pdf — רע״פ 5333/11, פסקאות א–ט","html":"<h2>סיכומים: מי מדבר אחרון ובאיזו מתכונת?</h2><p><b>תקציר:</b> בתום הראיות הצדדים מסכמים את התמונה ומסבירים איזו מסקנה יש להסיק. לפי הסבר המרצה על סעיף 169, התובע מסכם תחילה ואחריו הנאשם. יש להבחין בין סדר הטיעון, מתכונתו והסעד כשנטען לפגם.</p>"},{"id":"verdict-sentence","tag":"28","title":"הכרעת הדין וגזר הדין — שיעורים 7–8","html":"<div class=\"eyebrow\">שיעור 8</div><h2>מן הראיות אל פסק הדין</h2><p>לאחר פרשת ההגנה רשאי בית המשפט, אך אינו חייב, להביא ראיות מטעמו. גם לאחר הכרעת הדין הדבר אפשרי רק בנסיבות חריגות מאוד, כשהתגלתה ראיה חדשה שלא הייתה בהישג יד ונדרש הדבר לעשיית צדק ולמניעת עיוות דין.</p><p>בתום הראיות באים הסיכומים: התובע מסכם ראשון והנאשם אחריו; לנאשם שמורה זכות המילה האחרונה. פסק הדין הפלילי בנוי מהכרעת דין ומגזר דין.</p><h3>השלמות משקפים 71–105</h3><p>הודאה בעובדה נחשבת כמוכחת, אלא אם בית המשפט אינו מקבלה או התיר חזרה ממנה בנימוקים מיוחדים. לאחר הכרעת הדין, ביטול ההכרעה נדרש רק אם היא מבוססת על ההודאה. לפי סעיף 155, בכתב אישום משותף ניתן לגזור לפני סיום משפט האחרים רק בנסיבות מיוחדות שיירשמו או כאשר המודה נקרא להעיד ולאחר שנגזר דינו.</p><p>פרשת התביעה לפי סעיפים 156–157 קודמת לטענת אין להשיב לאשמה; פרשת ההגנה לפי 159–164. נאשמים מביאים פתיחה וראיות לפי סדר רישומם, אלא אם בית המשפט הורה אחרת. התביעה אינה חוקרת על הרשעות קודמות אלא בחריגי אופי טוב. ראיות הזמה דורשות רשות; ראיות ההגנה לסתירתן אינן דורשות רשות.</p><p>סעיף 181א קובע הכרעת דין בתוך 30 ימים מהסיכומים, עם אפשרות הארכה מטעמים מיוחדים. זיכוי הוא פסק הדין; מועד הערעור מתחיל ממתן הנימוקים. ניתן לבטל הרשעה לפני גזר דין לפי סעיף 192א, להרשיע בכמה עבירות בלי להעניש יותר מפעם אחת על אותו מעשה, ולצרף תיקים לפי סעיף 39. סעיף 185 מסדיר העברה בין שלום למחוזי בעבירה שאינה בסמכות הערכאה.</p>","lesson":"8","status":"הורחב ואומת מול מצגת 3","lessons":["8"],"source":"דיון פלילי - מצגת שלישית - 234907.PDF, שקפים 36–70"},{"id":"sentencing","tag":"29","title":"קביעת העונש (נלמד בשיעור 8)","html":"\n      <div class=\"eyebrow\">40ב–40טו לחוק העונשין</div>\n      <h2>קביעת העונש</h2>\n      <p>3 שלבים: מתחם עונש הולם → חריגה (קולא/חומרא) → עונש סופי בתוך המתחם.</p>\n      <div class=\"callout case-callout\"><span class=\"callout-title\">קשור לפסק דין</span><button class=\"case-link\" data-case=\"18\">⚖ תיקי מב\"ד</button></div>\n      <button class=\"expand-link\" data-topic=\"sentencing\">🔎 קריאה מורחבת</button>\n    <h3>השלמות משקפים 106–136</h3><p>בשלב הטיעונים לעונש התביעה מביאה הרשעות קודמות והחלטות על ביצוע עבירות, והנאשם רשאי להביא ראיות להקלה שאינן סותרות את גרסתו בשלב האשמה. תיקים הממתינים לבירור דין אינם ראיה בשלב בירור האשמה, אך שירות המבחן רשאי להתייחס אליהם בתסקיר. הענישה נעשית בשלושה שלבים: מתחם הולם, חריגה לשיקום או להגנת שלום הציבור בתנאים שנלמדו, וקביעת העונש בתוך המתחם; נסיבה מחמירה טעונה הוכחה מעבר לספק סביר ומקלה ברמת הוכחה אזרחית.</p>","lesson":"8","status":"הורחב ואומת מול מצגת 3","source":"דיון פלילי - מצגת שלישית - 234907.PDF, שקפים 106–136","lessons":["8"]},{"id":"appeals","tag":"30","title":"ערעור: זכות, מסלולים ומועדים (נלמד בשיעור 8)","html":"\n      <div class=\"eyebrow\">סעיפים 199–217</div>\n      <h2>ערעור: זכות, מסלולים ומועדים</h2>\n      <p>לא ניתן לערער על החלטות ביניים (מלבד חריגים). מועדים: 45 יום (בזכות), 45+30 (ברשות).</p>\n      <div class=\"callout case-callout\"><span class=\"callout-title\">קשור לפסקי דין</span><button class=\"case-link\" data-case=\"11\">⚖ פלדמן</button> <button class=\"case-link\" data-case=\"20\">⚖ צ'ירנסקי</button> <button class=\"case-link\" data-case=\"22\">⚖ חילף</button></div>\n      <button class=\"expand-link\" data-topic=\"appeals\">🔎 קריאה מורחבת</button>\n    <h3>השלמות משקפים 106–136</h3><p>הכלל הוא שאין ערעור על החלטות ביניים אלא בהוראה מפורשת; חריגים שנלמדו כוללים פסלות, פומביות, עיון בחומר, עיכוב ביצוע וערעור עצמאי של סנגור על אי־שחרורו מייצוג. בקשת רשות לערעור שני דורשת שאלה משפטית בעלת חשיבות ציבורית או מקרה חריג בחומרת העונש. ערעור בזכות מוגש בתוך 45 ימים; בקשת רשות בתוך 45 ימים והערעור בתוך 30 ימים ממועד הרשות. חזרה מערעור לאחר סיום הטענות טעונה רשות. בערעור אין להחמיר בעונש ללא ערעור מדינה.</p>","lesson":"8","status":"הורחב ואומת מול מצגת 3","source":"דיון פלילי - מצגת שלישית - 234907.PDF, שקפים 106–136","lessons":["8"]}]},{"group":"דיני מעצרים","items":[{"id":"arrest-basics","tag":"31","title":"יסודות דיני מעצרים: עיכוב, מעצר, עצור מול אסיר (הרחבה מהמצגות — לא שיעור 8)","html":"\n      <div class=\"eyebrow\">חוק המעצרים · חוק יסוד כבוד האדם וחירותו</div>\n      <h2>יסודות דיני המעצרים</h2>\n      <p><b>אסיר</b> — הורשע ונגזר עליו מאסר בפועל, מוחזק לריצוי עונשו. <b>עצור</b> — מוחזק לפני/בזמן ההליך, נהנה מחזקת החפות.</p>\n      <p><b>עיכוב</b> — הגבלת חירות קלה ומתוחמת (בירור/חקירה במקום). <b>מעצר</b> — שלילת חירות מלאה.</p>\n      <p>כללי הברזל: במסלול סעיף 23(א) נדרשת עבירה שאינה חטא; סעיף 23(ב) הוא מסלול נפרד הנוגע לעיכוב חוקי; אין לעצור אם ניתן להסתפק בעיכוב; אין לעצור אם ניתן להשיג את התכלית בחלופת מעצר.</p>\n      <div class=\"callout case-callout\"><span class=\"callout-title\">קשור לפסק דין</span><button class=\"case-link\" data-case=\"26\">⚖ קסאי — זכות התנגדות למעצר בלתי חוקי</button></div>\n      <button class=\"expand-link\" data-topic=\"arrest-basics\">🔎 קריאה מורחבת</button>\n    <h3>חיפוש במכשיר נייד ובחומר מחשב — סעיף 23א לפקודת החיפוש</h3><p>חיפוש בטלפון או בחומר מחשב הוא חיפוש בעל מאפיינים ייחודיים, ולכן יש לבחון את מקור הסמכות ואת היקף הצו באופן קונקרטי. עצם העובדה שהמכשיר נתפס אינה מתירה עיון גורף בתוכנו. כאשר נטען שחיפוש בלתי חוקי קדם לבקשת הצו, יש להפריד בין חוקיות האיסוף המוקדם לבין תוקף הצו והראיות שנאספו מכוחו, ולבחון את התוצאה לפי ההגנות והאיזונים שנלמדו בבן חיים וביששכרוב.</p><div class=\"callout\"><b>השלמת Audit חקיקה:</b> בחיפוש בטלפון יש להבחין בין תפיסת המכשיר לבין עיון בתוכנו: נבחנים מקור הסמכות והיקף הצו, וחיפוש מוקדם פגום נבחן בנפרד לפי הזיקה והחומרה שנלמדו.</div>","lesson":"extra","status":"הורחב מול ניתוח פסק דין מקבוצה C","lessons":["extra"],"source":"יונתן אוריך נ' מדינת ישראל.pdf — ניתוח קבוצה C"},{"id":"arrest-nowarrant","tag":"32","title":"מעצר שוטר ללא צו וזכויות העצור בתחנה (הרחבה מהמצגות — לא שיעור 8)","html":"\n      <div class=\"eyebrow\">סעיפים 23, 26–36 לחוק המעצרים</div>\n      <h2>מעצר שוטר ללא צו וזכויות העצור</h2>\n      <p>במסלול סעיף 23(א): חשד לעוון/פשע ועילת מעצר סטטוטורית. סעיף 23(ב), הנוגע לאי־ציות לעיכוב חוקי, הוא מסלול נפרד.</p>\n      <p>זכויות: אזהרה, הסבר זכויות, מפגש עו\"ד ללא דיחוי (עם חריגי דחייה), הודעה לקרוב.</p>\n      <div class=\"callout case-callout\"><span class=\"callout-title\">קשור לפסקי דין</span><button class=\"case-link\" data-case=\"27\">⚖ כהן — \"זה מקרוב\"</button> <button class=\"case-link\" data-case=\"28\">⚖ אסף שי — זכות עו\"ד</button></div>\n      <button class=\"expand-link\" data-topic=\"arrest-nowarrant\">🔎 קריאה מורחבת</button>\n    <div class=\"callout\"><b>השלמת Audit חקיקה:</b> במסלול סעיף 23(א) נבחנים חשד סביר ועילת מעצר; סעיף 23(ב) הוא מסלול נפרד להבאה לתחנה לצורך העיכוב, ואין לייבא אליו אוטומטית את תנאי 23(א).</div>","lesson":"extra","status":"הרחבה — לא מהקלטת שיעור 8","lessons":["extra"]},{"id":"arrest-bridge","tag":"33","title":"הצהרת תובע ומעצר גישור (הרחבה מהמצגות — לא שיעור 8)","html":"\n      <div class=\"eyebrow\">סעיף 17(ד) לחוק המעצרים</div>\n      <h2>הצהרת תובע ומעצר גישור</h2>\n      <p>עד 5 ימים לגישור עד הגשת כתא\"ש, בכפוף לתקרת 75 הימים הרגילה.</p>\n      <div class=\"callout case-callout\"><span class=\"callout-title\">קשור לפסק דין</span><button class=\"case-link\" data-case=\"29\">⚖ אלטויל — תכלית מצומצמת</button></div>\n      <button class=\"expand-link\" data-topic=\"arrest-bridge\">🔎 קריאה מורחבת</button>\n    <div class=\"callout\"><b>השלמת Audit חקיקה:</b> מעצר גישור לפי סעיף 17(ד) נועד רק לזמן הטכני להכנת כתב אישום ובקשת מעצר עד תום ההליכים; הוא אינו מסלול להמשך פעולות חקירה.</div>","lesson":"extra","status":"הרחבה — לא מהקלטת שיעור 8","lessons":["extra"]},{"id":"arrest-pending","tag":"34","title":"מעצר עד תום ההליכים (הרחבה מהמצגות — לא שיעור 8)","html":"\n      <div class=\"eyebrow\">סעיף 21 לחוק המעצרים</div>\n      <h2>מעצר עד תום ההליכים</h2>\n      <p>4 תנאים מצטברים: עילת מעצר + ראיות לכאורה + היעדר חלופה + ייצוג.</p>\n      <div class=\"callout case-callout\"><span class=\"callout-title\">קשור לפסקי דין</span><button class=\"case-link\" data-case=\"30\">⚖ זאדה — ראיות לכאורה</button> <button class=\"case-link\" data-case=\"31\">⚖ גנימאת — אין עילה מחומרה בלבד</button></div>\n      <button class=\"expand-link\" data-topic=\"arrest-pending\">🔎 קריאה מורחבת</button>\n    ","lesson":"extra","status":"הרחבה — לא מהקלטת שיעור 8","lessons":["extra"]},{"id":"arrest-release","tag":"35","title":"שחרור אוטומטי, מעצר לאחר הרשעה וערר (הרחבה מהמצגות — לא שיעור 8)","html":"\n      <div class=\"eyebrow\">סעיפים 52–53, 60–62 לחוק המעצרים</div>\n      <h2>שחרור אוטומטי ומעצר לאחר הרשעה</h2>\n      <p>30 יום ללא תחילת משפט, 9 חודשים ללא הכרעת דין — שחרור, בכפוף להארכות עליון.</p>\n      <div class=\"callout case-callout\"><span class=\"callout-title\">קשור לפסק דין</span><button class=\"case-link\" data-case=\"32\">⚖ איבדיוב — מניין 9 החודשים</button></div>\n      <button class=\"expand-link\" data-topic=\"arrest-release\">🔎 קריאה מורחבת</button>\n    <div class=\"callout\"><b>השלמת Audit חקיקה:</b> סעיף 61 עוסק במעצר עד הכרעת הדין. לאחר הכרעת דין מרשיעה יש להבחין בין מגבלת המעצר שלפני ההכרעה לבין הסמכות הדיונית להמשך מעצר עד גזר הדין.</div>","lesson":"extra","status":"הרחבה — לא מהקלטת שיעור 8","lessons":["extra"]}]},{"group":"דיני חיפוש ותפיסה","items":[{"id":"search-seizure","tag":"חדש","title":"דיני חיפוש ותפיסה","html":"<div class=\"eyebrow\">Release 1</div><div class=\"release-layer\"><h2>תקציר הנושא</h2><section class=\"release-subtopic\"><h3>המסגרת הנורמטיבית של דיני החיפוש והבחנת היסוד בין חיפוש \"על גוף\" לחיפוש \"בגוף\"</h3><ul><li><strong>הכלל המשפטי</strong>: דיני החיפוש בשיטת המשפט הישראלית מבוססים על פיצול נורמטיבי בין שני דברי חקיקה מרכזיים: <strong>פקודת סדר הדין הפלילי (מעצר וחיפוש) [נוסח חדש], התשכ\"ט-1969</strong> (להלן: \"הפקודה\") לבין <strong>חוק סדר הדין הפלילי (סמכויות אכיפה – חיפוש בגוף החשוד ונטילת אמצעי זיהוי), התשנ\"ו-1996</strong> (להלן: \"חוק החיפוש\").</li><li><strong>סמכות שיפוטית (\"שופט\")</strong>: סעיף 1 לפקודה מגדיר \"שופט\" כ<strong>שופט בית משפט מחוזי או שופט בית משפט שלום</strong>. לשתי הערכאות נתונה סמכות מקבילה להוצאת צווי חיפוש מכוח הפקודה.</li><li><strong>הבחנת היסוד המושגית</strong>: <em> <strong>חיפוש \"על גוף\"</strong>: חיפוש על פני גופו של אדם, בבגדיו או בכליו (Pat-down / מישוש). מוסדר בפקודת מעצר וחיפוש. </em> <strong>חיפוש \"בגוף\"</strong>: חיפוש בגופו של אדם המוסדר בחוק החיפוש (1996), והנחלק לשתי קטגוריות: 1. <strong>חיפוש חיצוני</strong>: חיפוש בגוף <em>ללא חדירה</em> לתוכו. 2. <strong>חיפוש פנימי</strong>: חיפוש בגוף בעל מאפיינים <em>חודרניים</em> (חדירה פיזית או וירטואלית).</li><li><strong>נקודת מבחן קריטית</strong>: במבחן אקדמי חובה להשיב לפי הדין המהותי ולא לפי הפרקטיקה בשטח; אף שבפועל המשטרה פונה כמעט מיוזמתה רק לשופטי שלום, החוק מעניק סמכות מקבילה מלאה גם לשופט מחוזי.</li></ul></section><section class=\"release-subtopic\"><h3>חיפוש על גוף ללא צו, חיפוש בעצור וחיפוש על אישה</h3><ul><li><strong>הכלל המשפטי</strong>: חיפוש \"על גוף\" (Pat-down / מישוש בגדים, כיסים וכלים) ללא צו שופט מוסדר בפקודת מעצר וחיפוש ומותר <strong>אך ורק בארבעה מסלולים חלופיים</strong>: 1. קיומו של <strong>חשד סביר</strong> שהאדם מחזיק בחפץ אסור או שהוא מושא לחיפוש. 2. <strong>הסכמה מדעת</strong> בהיעדר חשד סביר (הלכת בן חיים - ). 3. <strong>חיפוש בעצור</strong> (סעיף 22 לפקודה). 4. מכוח <strong>פקודת הסמים המסוכנים</strong> (צוין במפורש כי סמכות זו אינה נלמדת בקורס זה).</li><li><strong>סמכות בעצור וכלל חילוף הידיים (סעיף 22)</strong>: ברגע שנעצר אדם קמה לשוטר סמכות מיידית לבצע חיפוש על גופו. סמכות זו מתחדשת בכל פעם שהעצור <strong>\"מחליף ידיים\"</strong> (מועבר בין שוטרים, חוקרים או סוהרים).</li><li><strong>חיפוש על אישה (סעיף 46)</strong>: חיפוש על גופה של אישה ייעשה <strong>אך ורק בידי אישה</strong> (שוטרת או סוהרת).</li><li><strong>נקודת מבחן קריטית</strong>: לפי סעיף 46 לפקודה, הכלל שחיפוש על גוף אישה ייעשה בידי אישה הוא <strong>קשיח ולא קיימים לו חריגים!</strong> (זאת להבדיל מחיפוש <em>בגוף</em> לפי חוק החיפוש 1996, שבו קיימים 3 חריגים המתירים חיפוש שלא בידי בן מינו).</li></ul></section><section class=\"release-subtopic\"><h3>חיפוש בחצרים ועל אדם בחצרים מכוח צו שופט והסמכויות הנלוות</h3><ul><li><strong>הכלל המשפטי</strong>: חיפוש בחצרים (הבית, קומותיו, שטחו שמתחתיו, הגג, החניה, הגינה, המרפסת והמחסן) מבוצע ככלל מכוח צו שיפוטי.</li><li><strong>סמכות שיפוטית</strong>: לפי סעיף 1 וסעיף 23 לפקודת מעצר וחיפוש, הסמכות להוצאת צו חיפוש בחצרים נתונה ל<strong>שופט בית משפט שלום או לשופט בית משפט מחוזי</strong>.</li><li><strong>שלושת התנאים/העילות החלופיות למתן צו (סעיף 23 לפקודה)</strong>: 1. החיפוש נחוץ כדי להבטיח הצגת חפץ לצורך חקירה, משפט או הליך אחר (שימור ראיות). 2. יש יסוד להניח שבמקום מוחזק חפץ גנוב, חפץ הקשור לעבירה או חפץ למטרה בלתי חוקית. 3. יש יסוד להניח שנעברה עבירה נגד אדם הנמצא במקום או שמתכוונים לעבור עבירה נגדו.</li><li><strong>סמכויות נלוות לצו החיפוש</strong>: <em> <strong>תפיסת חפצים</strong>: תפיסת החפצים המפורטים בצו, וכן תפיסת חפץ חשוד שלא נזכר בצו אם יש יסוד להניח שהוא קשור לביצוע עבירה פלילית (והבאתו בפני השופט שנתן את הצו). </em> <strong>סמכות מעצר נלווית (סעיף 24)</strong>: סמכות מעצר מיידית לגבי כל אדם הנמצא במקום והנחזה כמי שקשור בעבירה. <em> <strong>חיפוש על אדם בחצרים (סעיף 29)</strong>: סמכות לערוך חיפוש על גופו (Pat-down / מישוש בבגדים וכלים) של אדם הנמצא בחצרים, אם יש יסוד לחשוד שהוא מסתיר חפץ שמחפשים. </em> <strong>כניסה בכוח (סעיף 45)</strong>: חובת תופס המקום לאפשר כניסה חופשית והקלה סבירה; בסירוב – סמכות לפרוץ דלתות ומנעולים בכוח סביר. * <strong>עזרת הציבור (סעיף 20)</strong>: חובה על כל אדם לסייע לשוטר הדורש זאת באופן סביר לצורך מעצר או מניעת בריחה.</li><li><strong>נקודת מבחן קריטית</strong>: אף שבפרקטיקה פונים כמעט רק לשופטי שלום, בבחינה האקדמית לשופט מחוזי ולשופט שלום נתונה סמכות מקבילה מלאה לפי סעיף 1 לפקודה, וחל איסור להסתמך על הפרקטיקה בשטח!</li></ul></section><section class=\"release-subtopic\"><h3>חיפוש בחצרים ללא צו ונוהל החיפוש וחובת העדים</h3><ul><li><strong>הכלל המשפטי</strong>: כניסת שוטר לבית או למקום וביצוע חיפוש בחצרים בלא צו שופט מוגבלת באופן דווקני ל<strong>רשימה סגורה של ארבעה מקרים בלבד</strong> המנויים בסעיף 25 לפקודת מעצר וחיפוש.</li><li><strong>ארבעת המקרים לחיפוש ללא צו (סעיף 25 לפקודה - חלופות)</strong>: 1. קיים יסוד להניח שמבוצע במקום <strong>פשע</strong>, או שבוצע שם <strong>פשע זה מקרוב</strong>. 2. <strong>תופס הבית/המקום</strong> פונה בעצמו לעזרת המשטרה (מותר בכל מצב, גם ללא חשד לעבירה). 3. <strong>אדם המצוי שם</strong> פונה לעזרת המשטרה וקיים יסוד להניח שמבוצעת שם <strong>עבירה</strong> (לרבות עבירת עוון). 4. השוטר נמצא ב<strong>מרדף/רדיפה</strong> אחר אדם המתחמק ממעצר או נמלט ממשמורת חוקית (אף אם חלף זמן ניכר).</li><li><strong>נוהל עריכת חיפוש וחובת עדים (סעיף 26 לפקודה)</strong>: חיפוש בחצרים ייערך ככלל בנוכחות תופס המקום ו<strong>שני עדים שאינם שוטרים</strong>.</li><li><strong>שלושת החריגים לחובת שני עדים</strong>: (1) קיימת דחיפות בעריכת החיפוש; (2) ניתן היתר מפורש בצו שופט; (3) תופס הבית או בן משפחתו ביקש/אישר זאת בחתימתו.</li><li><strong>סמכויות נלוות בחצרים</strong>: <em> <strong>חיפוש על אדם בחצרים (סעיף 29)</strong>: סמכות לחיפוש על גופו (Pat-down) של אדם הנמצא בחצרים אם קיים חשד שהוא מסתיר חפץ שמחפשים. </em> <strong>שימוש בכוח (סעיף 45)</strong>: תופס המקום חייב לאפשר כניסה חופשית והקלה סבירה; בסירוב – סמכות לפרוץ דלתות וארונות נעולים בכוח סביר.</li><li><strong>נקודת מבחן קריטית</strong>: הבחנה בין פניית <em>תופס הבית</em> (סעיף 25(ב) – אינה דורשת חשד לעבירה פלילית כלל) לבין פניית <em>אדם המצוי שם</em> (סעיף 25(ג) – דורשת חשד לביצוע עבירה פלילית, אך מסתפקת בעבירת עוון).</li></ul></section><section class=\"release-subtopic\"><h3>חיפוש בחומר מחשב ובטלפון נייד</h3><ul><li><strong>הכלל המשפטי</strong>: חיפוש בחומר מחשב ובטלפון נייד נשלט על ידי פקודת סדר הדין הפלילי (מעצר וחיפוש) [נוסח חדש], התשכ\"ט-1969, ונקבע לגביו כלל קשיח: <strong>חיפוש בחומר מחשב ייערך אך ורק לפי צו שופט</strong>. אין חיפוש במחשב או בטלפון נייד ללא צו שיפוטי!</li><li><strong>תנאים מצטברים</strong>: 1. צו שופט הכולל <strong>היתר מפורש</strong> לחפש בחומר מחשב. 2. ביצוע החיפוש אך ורק על ידי <strong>בעל תפקיד מיומן</strong> (חוקר מחשב מוסמך).</li><li><strong>היקף ההגדרה בפסיקה (פסק דין אוריך)</strong>: טלפונים ניידים/חכמים, אייפדים וכל חפץ/מכשיר בעל יחידת עיבוד נתונים, זיכרון ושמירת נתונים בשבבים אלקטרוניים נחשבים משפטית כ\"חומר מחשב\".</li><li><strong>פרוצדורה וסדרי דין</strong>: בשלב החקירה, הבקשה לצו מוגשת <strong>במעמד צד אחד</strong> (בדלתיים סגורות) למניעת שיבוש/מחיקת נתונים, ועל החלטת בית המשפט בבקשה <strong>אין זכות לערור</strong>.</li><li><strong>נקודת מבחן קריטית</strong>: צו חיפוש בחצרים כללי אינו מעניק סמכות לחדור לטלפון נייד או למחשב הנמצאים בחצרים; נדרש היתר מפורש וספציפי בצו לחיפוש בחומר מחשב.</li></ul></section><section class=\"release-subtopic\"><h3>תפיסת חפצים ומחשב, זכויות העתקה והחזרת תפוסים</h3><ul><li><strong>הכלל המשפטי לסמכות תפיסה (סעיף 32 לפקודה)</strong>: מכוח עיקרון החוקיות, עצם קיומה של סמכות לחפש אינה מהווה כשלעצמה סמכות לתפוס. שוטר מוסמך לתפוס חפץ אם יש לו יסוד להניח שנעברה בו עבירה, עומדים לעבור בו עבירה, עשוי לשמש ראיה במשפט, או ניתן כשכר בעד ביצוע עבירה או כאמצעי לביצועה.</li><li><strong>חריגי תפיסת מחשבים</strong>: <em> <strong>מחשב של \"מוסד\" (עסק פרטי / רשות מדינה)</strong>: תפיסה אך ורק מכוח צו שופט מפורש. תפיסה שלא בנוכחות המחזיק מוגבלת לתקופה מרבית של <strong>עד 48 שעות בלבד</strong>; הארכה מותנית בשימוע למחזיק המחשב. </em> <strong>מחשב של אדם פרטי</strong>: אם אינו דרוש לחילוט או כראיה – חובה להחזירו לאדם שממנו נלקח <strong>תוך 30 ימים</strong>. שופט שלום רשאי להאריך מעת לעת בתקופות של <strong>עד 30 ימים בכל פעם</strong>.</li><li><strong>זכות העתקת חומר מחשב (סעיף 32א לפקודה)</strong>: המשתמש במחשב שנתפס זכאי לקבל העתק מחומר המחשב <strong>תוך 4 ימים</strong>. קצין משטרה בדרגת סגן ניצב (סנ\"צ) ומעלה רשאי לדחות ב-4 ימים בכל פעם עד תקרת <strong>16 ימים</strong>. שופט שלום רשאי להאריך מטעמים מיוחדים ב-<strong>15 ימים בכל פעם</strong>. קצין בדרגת מפקח משנה (ממ\"ש) ומעלה מוסמך למנוע מסירת העתק עקב חשש לשיבוש חקירה או ביצוע עבירה (כגון פדופיליה). על דחייה/מניעה ניתן לערור לבית משפט שלום.</li><li><strong>כלל החזרת תפוס (הוראות החוק לפקודה)</strong>: אם תוך <strong>6 חודשים</strong> מתפיסת חפץ לא הוגש כתב אישום ולא ניתן צו שיפוטי – חובה על המשטרה להחזיר את החפץ לאדם שממנו נלקח. בית משפט שלום רשאי להאריך את התקופה לבקשת שוטר או <strong>\"כל אדם מעוניין\"</strong>.</li><li><strong>חפצים אסורים בהחזקה (סעיף 31 לפקודה / סעיף 21 לחוק עוולות מסחריות)</strong>: חפץ שאסור בהחזקה (סמים, אקדח ללא מספר) – שופט מוסמך להורות על החרמתו או השמדתו <strong>אף בהיעדר העמדה לדין</strong>.</li><li><strong>נקודת מבחן קריטית</strong>: הארכת תפיסת חפץ מעבר ל-6 חודשים יכולה להיות מוגשת גם ע\"י \"כל אדם מעוניין\" (כגון אישה החוששת מאקדח של בעלה שתיק החקירה נגדו נסגר) ולא רק ע\"י המשטרה.</li></ul></section></div><div class=\"callout case-callout\"><span class=\"callout-title\">פסיקה קשורה ומאומתת</span><button class=\"case-link\" data-case=\"2\">⚖ אברהם בן חיים נגד מדינת ישראל</button><button class=\"case-link\" data-case=\"36\">⚖ יונתן אוריך נגד מדינת ישראל</button></div>","lesson":"extra","status":"מבוסס על מקור הקורס המסומן","lessons":["extra"],"source":"הקלטת שיעור 1 - דיני חיפוש-audio.mp4"},{"id":"body-search-identification","tag":"חדש","title":"חיפוש בגוף ונטילת אמצעי זיהוי","html":"<div class=\"eyebrow\">Release 1</div><div class=\"release-layer\"><h2>תקציר הנושא</h2><section class=\"release-subtopic\"><h3>חיפוש חיצוני בגוף — תנאים, סמכויות ושימוש בכוח</h3><ul><li><strong>הכלל המשפטי</strong>: חיפוש חיצוני הוא חיפוש בגופו של אדם <strong>ללא חדירה</strong> לתוכו, הכולל רשימה מוגדרת של 12 בדיקות לפי <strong>חוק סדר הדין הפלילי (סמכויות אכיפה – חיפוש בגוף החשוד ונטילת אמצעי זיהוי), התשנ\"ו-1996</strong> (להלן: \"חוק החיפוש\").</li><li><strong>תנאים מצטברים לחיפוש חיצוני בהסכמת החשוד (סעיף 3)</strong>: 1. <strong>גורם מוסמך</strong>: שוטר (שאינו בהכרח קצין משטרה). 2. יסוד סביר לחשוד שבגופו של החשוד נמצאת ראיה להוכחת ביצוע עבירה. 3. העבירה היא מסוג <strong>עוון או פשע</strong> (<strong>אין חיפוש חיצוני בעבירת חטא!</strong>). 4. <strong>הסכמת החשוד</strong>.</li><li><strong>סמכות שימוש בכוח סביר בהיעדר הסכמה</strong>: מותרת אך ורק באישור <strong>קצין משטרה בדרגת רב פקד (רפ\"ק) ומעלה</strong>, ולאחר עריכת שימוע והסבר לחשוד.</li><li><strong>החריג המרכזי והרשימה הסגורה לשימוש בכוח</strong>: הפעלת כוח סביר מוגבלת <strong>אך ורק לרשימה סגורה של 6 בדיקות</strong> (בחינת גוף ערום וצילומו, תביעה מכל חלק בגוף, חומר מתחת לציפורניים, שיער ראש, חומר מעל הגוף, בדיקת עור). בשאר הבדיקות החיצוניות – <strong>חלה איסור מוחלט על שימוש בכוח!</strong>.</li><li><strong>נקודת מבחן קריטית</strong>: הבחנה בין <em>לקיחת חומר מתחת לציפורניים</em> (מותר בכוח) לבין <em>גזירת ציפורניים</em> (אסור בכוח); ובין <em>תלישת שיער ראש</em> (מותר בכוח) לבין <em>תלישת שיער מחלקים מוצנעים</em> (אסור בכוח!).</li></ul></section><section class=\"release-subtopic\"><h3>חיפוש פנימי בגוף — תנאים, אישורים רפואיים והיתר שיפוטי</h3><ul><li><strong>הכלל המשפטי</strong>: חיפוש פנימי מוגדר בחוק סדר הדין הפלילי (סמכויות אכיפה – חיפוש בגוף החשוד ונטילת אמצעי זיהוי), התשנ\"ו-1996 (להלן: \"חוק החיפוש\") כחיפוש בגופו של אדם בעל מאפיינים <strong>חודרניים</strong> – פיזית או וירטואלית. מדובר ב-5 בדיקות מוגדרות: בדיקת דם רגילה, הדמיית פנים הגוף (CT, MRI, אולטרסאונד), שיקוף רנטגן, בדיקה גינקולוגית, ונטילת דגימת דם מזערית מהאצבע.</li><li><strong>4 התנאים המצטברים לחיפוש פנימי בהסכמה (סעיף 4)</strong>: 1. <strong>גורם מוסמך</strong>: קצין משטרה (בכל דרגה). 2. <strong>יסוד לחשד</strong>: יסוד סביר לחשוד שבגוף נמצאת ראיה להוכחת עבירה. 3. <strong>דרגת העבירה</strong>: עבירה מסוג <strong>פשע בלבד</strong>! (<strong>אין חיפוש פנימי בעבירת חטא או עוון!</strong>). 4. <strong>אישור רופא והסבר שלא בנוכחות שוטר</strong>: חובה שרופא נתן אישור בכתב שאין מניעה בריאותית, לאחר פגישה עם החשוד שנערכה <strong>שלא בנוכחות שוטר</strong>, וקבלת הסכמת החשוד בכתב.</li><li><strong>חריגים מרכזיים לכלל</strong>: <em> <strong>בדיקת דם ודגימת דם מזערית</strong>: מותרות <strong>גם בעבירת עוון</strong>. </em> <strong>דגימת דם מזערית מהאצבע (סעיף 4א)</strong>: מוסמך להורות בהסכמה <strong>גם שוטר שאינו קצין</strong>, <strong>אין צורך באישור רופא</strong> (אלא אם קים חשש בריאותי), ובסירוב – חובה להציע חיפוש חיצוני חלופי (שיער או תאי לחי). * <strong>בדיקה גינקולוגית</strong>: <strong>תמיד מחייבת היתר בית משפט (שופט שלום)</strong>, גם אם האישה מסכימה בכתב וגם אם ניתן אישור רופא!</li><li><strong>סמכות והיתר שיפוטי בהיעדר הסכמה </strong>: <strong>אין שום קצין משטרה המוסמך להורות על חיפוש פנימי בכוח!</strong> בהיעדר הסכמה, קצין המשטרה חייב להגיש בקשת היתר ל<strong>בית משפט השלום</strong>.</li><li><strong>מועדים ופרוצדורה</strong>: תוקף היתר שופט לחיפוש פנימי הוא <strong>עד 3 ימים</strong> (הארכות ב-3 ימים בכל פעם מטעמים מיוחדים).</li><li><strong>נקודת מבחן קריטית</strong>: הבחנה בין חיפוש חיצוני (שבו קצין ברמת רפ\"ק ומעלה מוסמך להתיר שימוש בכוח ברשימה סגורה) לבין חיפוש פנימי (שבו <strong>אין סמכות קצין לכוח</strong>, אלא חובה לקבל היתר מבית משפט שלום!).</li></ul></section><section class=\"release-subtopic\"><h3>חיפוש בגוף באוכלוסיות מיוחדות ובמי שאינו חשוד</h3><ul><li><strong>הכלל המשפטי</strong>: עריכת חיפוש בגוף (חיצוני או פנימי) באדם שאינו חשוד (עד או נפגע עבירה) או באוכלוסיות מיוחדות (קטינים ואנשים עם מוגבלות שכלית) מוסדרת ב<strong>חוק סדר הדין הפלילי (סמכויות אכיפה – חיפוש בגוף החשוד ונטילת אמצעי זיהוי), התשנ\"ו-1996</strong> (להלן: \"חוק החיפוש\").</li><li><strong>הסמכות השיפוטית בחוק החיפוש (סעיף 1)</strong>: בית המשפט המוסמך לכל עניין לפי חוק החיפוש הוא <strong>בית משפט השלום בלבד</strong>.</li><li><strong>חיפוש באדם שאינו חשוד (עד / נפגע עבירה)</strong>: מותר לבצע חיפוש בגופו אם יש יסוד סביר להניח שבגופו נמצאת ראיה לחקירה (כגון DNA מתחת לציפורניים) או לבדיקת זיקתו לעבירה. התנאים המתחייבים: מתן הסבר מפורש ו<strong>הסכמה בכתב</strong>.</li><li><strong>החריג והסייג המוחלט – בדיקה גינקולוגית</strong>: לא ייערך חיפוש שהוא בדיקה גינקולוגית אלא <strong>בהיתר בית משפט (שופט שלום)</strong> בלבד! הכלל חל על כל אדם – חשודה, עד, או נפגעת עבירה/קורבן אונס – ואין בהסכמתה בכתב או באישור רופא כדי לפתור מהיתר שיפוטי.</li><li><strong>קטינים ואנשים עם מוגבלות שכלית</strong>: נדרשת <strong>הסכמה כפולה בכתב</strong> (גם של הקטין/המוגבל וגם של האפוטרופוס). <strong>כלל הסירוב</strong>: מספיק שאחד מהם מסרב (הקטין מסרב או האפוטרופוס מסרב) כדי <strong>למנוע</strong> את החיפוש.</li><li><strong>נקודת מבחן קריטית</strong>: הסכמת נפגעת אונס לבדיקה גינקולוגית אינה פוטרת את המשטרה מלקבל היתר משופט שלום; וסירוב קטין לחיפוש בגופו אינו ניתן לעקיפה על ידי הסכמת הורהו!</li></ul></section><section class=\"release-subtopic\"><h3>משמעות סירוב לחיפוש בגוף וארבעת החריגים</h3><ul><li><strong>הכלל המשפטי</strong>: סירוב החשוד (באמירה או בהתנהגות) לעריכת חיפוש חיצוני, חיפוש פנימי, או להיפגש עם רופא – כאשר החיפוש לא נערך בשל סירובו – עשוי לשמש <strong>חיזוק לראיות התביעה</strong>. (בבדיקת נשיפה/אלכוהול, הסירוב מוליד חזקה משפטית כאילו נהג תחת השפעת אלכוהול).</li><li><strong>הסייג הכללי לכלל (ביצוע בפועל)</strong>: אם החיפוש בוצע בפועל (בכוח סביר בחיפוש חיצוני מותר, או מכוח היתר שופט בחיפוש פנימי) – <strong>אין עוד משמעות ראייתית לסירוב</strong>.</li><li><strong>ארבעת החריגים הקשיחים (שבהם סירוב לא ישמש חיזוק ראייתי)</strong>: 1. <strong>סירוב אפוטרופוס</strong>: הסירוב לחיפוש הפנימי היה של האפוטרופוס (ולא של החשוד הקטין/המוגבל בשכלו). 2. <strong>מחדל המשטרה בפנייה לבית המשפט</strong>: המשטרה לא הגישה בקשה לבית המשפט להתיר את החיפוש הפנימי בשל סירובו (זולת אם השהיית הפנייה הייתה פוגעת בראיה). 3. <strong>דחייה שיפוטית</strong>: בית המשפט דחה את בקשת המשטרה להיתר חיפוש פנימי.</li><li><strong>מקור נורמטיבי</strong>: <strong>חוק סדר הדין הפלילי (סמכויות אכיפה – חיפוש בגוף החשוד ונטילת אמצעי זיהוי), התשנ\"ו-1996</strong> (\"חוק החיפוש\"), סעיף 11.</li><li><strong>נקודת מבחן קריטית</strong>: אם החשוד סירב לחיפוש פנימי והמשטרה נמנעה מלהגיש בקשת היתר לבית משפט השלום (ולא התקיימה דחיפות של התכלות/פגיעה בראיה) – האי-ביצוע רובץ לפתחה של המשטרה, והסירוב נטרלי לחלוטין ולא ישמש כחיזוק!</li></ul></section></div><div class=\"callout case-callout\"><span class=\"callout-title\">פסיקה קשורה ומאומתת</span></div>","lesson":"extra","status":"מבוסס על מקור הקורס המסומן","lessons":["extra"],"source":"הקלטת שיעור 1 - דיני חיפוש-audio.mp4"}]},{"group":"דיני חקירה","items":[{"id":"investigation-law","tag":"חדש","title":"דיני חקירה","html":"<div class=\"eyebrow\">Release 1</div><div class=\"release-layer\"><h2>תקציר הנושא</h2><section class=\"release-subtopic\"><h3>המסגרת הנורמטיבית של דיני חקירה וההבחנה בין חקירת עד לחקירת חשוד</h3><ul><li><strong>הכלל המרכזי</strong>: דיני החיקוק והפסיקה קובעים הבחנה קשיחה בין <strong>\"חקירת עד\"</strong> (גביית עדות/הודעה מאדם שאינו חשוד בביצוע העבירה) לבין <strong>\"חקירת חשוד\"</strong> (חקירת אדם החשוד בביצוע עבירה פלילית).</li><li><strong>התנאים המרכזיים לגביית עדות מעד</strong>: 1. קצין משטרה המוסמך לכך רשאי לחקור כל אדם המכיר את עובדות העבירה ונסיבותיה (סעיף 2 לפקודת העדות). 2. העד כפוף ל<strong>חובת מענה נכונה</strong> על כל השאלות שמוצגות לו. 3. ההודעה נרשמת בכתב, נקראת באוזני העד, והעד נדרש לחתום עליה (הוראות החוק לפקודת העדות).</li><li><strong>החריג המרכזי לחובת המענה של עד</strong>: <strong>החיסיון מפני הפללה עצמית</strong> – העד פטור מלהשיב על שאלות שהתשובה עליהן עשויה להעמידו בסיכון של אישום פלילי (סעיף 2 לפקודת העדות / סעיף 47 לפקודת הראיות).</li><li><strong>זכות / חובה / סמכות קריטית (מעבר מעד לחשוד - סעיף 28א לחוק המעצרים)</strong>: <em> לחשוד נתונה <strong>זכות שתיקה מלאה</strong> (זכות שלא להשיב לשאלות כלל ולא להיחקר כעד). </em> ברגע שמהלך גביית עדות מעד עולה חשד שהוא ביצע עבירה פלילית – <strong>חובה מוחלטת על החוקר להפסיק מיד את גביית העדות</strong>, להודיע לנחקר כי הפך לחשוד, ולהזהירו מפורשות בדבר זכות השתיקה העומדת לו.</li><li><strong>מועד חשוב</strong>: הפסקת גביית העדות ומתן האזהרה חייבות להתבצע <strong>אופן מיידי ובסמוך ממש</strong> לרגע שבו עולה החשד לביצוע עבירה בידי העד.</li><li><strong>הבחנה טרמינולוגית מרכזית</strong>: <em> <strong>הודעה</strong> (ב-א'): הדיבור/העדות שמוסר עד או מתלונן במשטרה. </em> <strong>חקירה / חקירת חשוד</strong>: חקירה פרונטלית המנוהלת נגד אדם החשוד בביצוע עבירה. * <strong>הודיה</strong> (ב-י'): הודאה של חשוד/נאשם בביצוע העבירה המיוחסת לו.</li><li><strong>נקודת מבחן מרכזית</strong>: מחדל משטרתי של אי-הפסקת עדות עד והיעדר אזהרה בדבר זכות השתיקה בעת המעבר מעד לחשוד מביא לפגם חמור בחקירה, העשוי להוביל לפסילת ההודעה/ההודיה בבית המשפט (דוקטרינת הפסילה הפסיקתית - הלכת יששכרוב).</li></ul></section><section class=\"release-subtopic\"><h3>חקירת עד במשטרה, חובת המענה וחריג החיסיון מפני הפללה עצמית</h3><ul><li><strong>הכלל המרכזי</strong>: קצין משטרה המוסמך לכך רשאי לחקור כל אדם המכיר את עובדות העבירה ונסיבותיה, והעד הנחקר כפוף ל<strong>חובת מענה נכונה</strong> על כל השאלות המוצגות לו.</li><li><strong>התנאים המרכזיים לגביית עדות מעד</strong>: 1. קיומה של חקירה פלילית לגבי עבירה שנצברה לגביה סמכות חקירה לקצין משטרה מוסמך. 2. רישום ההודעה בכתב, הקראתה באוזני העד (או מסירתה לקריאה עצמית), וחתימת העד על גבי המסמך.</li><li><strong>החריג המרכזי לחובת המענה</strong>: <strong>החיסיון מפני הפללה עצמית</strong> – העד אינו חייב להשיב על שאלות שהתשובה עליהן עשויה להעמידו בסיכון של אישום פלילי.</li><li><strong>זכות / חובה / סמכות קריטית</strong>: <em> <strong>סמכות וחובת רישום סירוב (סעיף 3 לפקודת העדות)</strong>: סירב העד לחתום על ההודעה, קצין המשטרה מוסמך וחייב לרשום את דבר הסירוב ואת סיבתו, ולחתום בעצמו על ההודעה. </em> <strong>חובת הפסקת עדות (סעיף 28א לחוק המעצרים)</strong>: ברגע שמתעורר חשד שהעד ביצע עבירה פלילית, קמה <strong>חובה חקירתית מוחלטת</strong> להפסיק מיד את גביית העדות, להודיע לו כי הפך לחשוד, ולהזהירו בדבר זכות השתיקה.</li><li><strong>מועד חשוב</strong>: הפסקת גביית העדות ומתן האזהרה חייבות להתבצע <strong>אופן מיידי ובסמוך ממש</strong> לרגע שבו עולה החשד לביצוע עבירה בידי העד.</li><li><strong>הבחנה מרכזית</strong>: <em> <strong>\"הודעה\"</strong> (ב-א'): הדיבור/העדות שמודפסת ונמסרת מפי עד או מתלונן במשטרה. </em> <strong>\"הודיה\"</strong> (ב-י'): הודאה של חשוד בביצוע עבירה פלילית. * <strong>חובת מענה (עד)</strong> מול <strong>זכות שתיקה (חשוד)</strong>: לעד אין זכות שתיקה גורפת אלא רק חיסיון נקודתי מפני הפללה עצמית, בעוד לחשוד נתונה זכות שתיקה מלאה.</li><li><strong>נקודת מבחן מרכזית</strong>: מחדל משטרתי בהפסקת עדות עד ואי-אזהרתו כחשוד בדבר זכות השתיקה יוצרים פגם חמור בחקירה, אשר עשוי להוביל לפסילת הודעתו/הודאתו בבית המשפט מכוח דוקטרינת הפסילה הפסיקתית (הלכת יששכרוב).</li></ul></section><section class=\"release-subtopic\"><h3>מעבר מעד לחשוד, חובת הפסקת העדות ומתן אזהרה</h3><ul><li><strong>הכלל המרכזי</strong>: אם במהלך גביית עדות מעד (או קבלת תלונה ממתלונן) מתעורר חשד כי העד עצמו ביצע את העבירה נשוא החקירה (או עבירה נלווית), חייב החוקר <strong>להפסיק מיד את גביית העדות</strong>, להודיע לנחקר כי הפך לחשוד, ולהזהירו מפורשות בדבר זכות השתיקה העומדת לו.</li><li><strong>התנאים המרכזיים</strong>: 1. התנהלות הליך של גביית עדות/הודעה מעד או ממתלונן במשטרה. 2. התעוררות חשד לביצוע עבירה פלילית בידי העד תוך כדי מסירת דבריו.</li><li><strong>החריג המרכזי</strong>: כל עוד לא התעורר חשד פלילי נגד העד, גביית העדות נמשכת כסדרה והעד כפוף לחובת מענה נכונה על שאלות החוקר (בכפוף לחיסיון הנקודתי מפני הפללה עצמית).</li><li><strong>זכות / חובה / סמכות חשובה</strong>: <em> <strong>חובת החוקר</strong>: חובה מוחלטת לעצור את גביית העדות מיד, להודיע לנחקר על סיווגו כחשוד, ולמסור לו את נוסח האזהרה הרשמי. </em> <strong>זכות הנחקר</strong>: מעבר מיידי ממעמד עד לזכות שתיקה מלאה/גורפת כחשוד (זכותו שלא להשיב על שאלות כלל ושלא להיחקר עוד כעד).</li><li><strong>מועד חשוב</strong>: הפסקת העדות ומתן האזהרה חייבים להתבצע <strong>באופן מיידי ובסמוך ממש</strong> לרגע שבו עולה החשד לביצוע העבירה בדברי העד.</li><li><strong>הבחנה מרכזית</strong>: מעבר מהמנגנון של \"חובת מענה נכונה\" (החלה על עד לפי פקודת העדות) למנגנון של \"זכות שתיקה מלאה\" (העומדת לחשוד לפי חוק המעצרים).</li><li><strong>נקודת מבחן מרכזית</strong>: מחדל משטרתי בהפסקת העדות ואי-מתן אזהרה בדבר זכות השתיקה מהווים פגם חמור בחקירה, העשוי להוביל לפסילת הודעת/הודאת הנחקר בבית המשפט מכוח הלכת יששכרוב (פסילת ראיות שהושגו שלא כדין).</li></ul></section><section class=\"release-subtopic\"><h3>שפת חקירת החשוד</h3><ul><li><strong>התנאים המרכזיים</strong>:</li><li><strong>החריג המרכזי וכללי התיעוד המיוחדים</strong>:</li><li><strong>זכות / חובה / סמכות חשובה</strong>: * <strong>חובת החוקר</strong>: להבטיח חוקר/מתורגמן הדובר את שפת החשוד ולתעד את החקירה בהתאם לכללי השפה והתיעוד בחוק.</li></ul></section><section class=\"release-subtopic\"><h3>מקום חקירת החשוד ושני החריגים לחקירה מחוץ לתחנה</h3><ul><li><strong>הכלל המרכזי</strong>: חקירת חשוד חייבת להתנהל ככלל בתוך <strong>תחנת המשטרה</strong> (<strong>סעיף 3 לחוק סדר הדין הפלילי (חקירת חשודים), התשס\"ב-2002</strong>).</li><li><strong>התנאים המרכזיים לניהול החקירה בתחנה</strong>: * ביצוע החקירה הפרונטלית במתקן משטרתי מוסדר ומבוקר השומר על הגינות החקירה וזכויות החשוד.</li><li><strong>שני החריגים המרכזיים (המתירים חקירת חשוד מחוץ לתחנת המשטרה)</strong>: 1. <strong>חריג א' (דחיפות / אי-אפשרות - סמכות שוטר)</strong>: השוטר סבור שלא ניתן לנהל את החקירה בתחנה או שיש צורך ענייני לנהלה בדחיפות מחוץ לתחנה (כגון הצלת חיי חטופה/אדם המצוי בסכנה מיידית בשטח). 2. <strong>חריג ב' (צורך ענייני - סמכות קצין ממונה)</strong>: הקצין הממונה סבור שיש צורך ענייני בחקירת החשוד מחוץ לתחנה (כגון שחזור עבירה בשטח או השפעת זירת העבירה על החשוד).</li><li><strong>זכות / חובה / סמכות חשובה</strong>: <em> <strong>חובת תיעוד ההחלטה בכתב</strong>: החלטה על ניהול חקירת חשוד מחוץ לתחנה חייבת להתועד בכתב בסמוך ככל הניתן לאחר קבלתה. </em> <strong>פרוצדורת אישור החקירה בתחנה (בעבירות חמורות - 10 שנות מאסר ומעלה)</strong>: אם נחקר חשוד מחוץ לתחנה בעבירה שדינה 10 שנות מאסר ומעלה, חובה להציג בפניו את תיעוד החקירה בתחנה בהקדם האפשרי ולבקש ממנו לאשרו; הליך אישור זה יתועד בתיעוד חזותי או קולי.</li><li><strong>מועד חשוב</strong>: תיעוד ההחלטה בכתב חייב להתבצע בסמוך ככל הניתן לאחר קבלתה; הצגת התיעוד והאישור בתחנה יבוצעו בהקדם האפשרי.</li><li><strong>הבחנה מרכזית</strong>: הבחנה בין חקירה שוטפת ושגרתית בתחנה (הכלל) לבין חקירה בדחיפות בשטח או מטעמים ענייניים (החריגים).</li><li><strong>נקודת מבחן מרכזית</strong>: חקירת חשוד מחוץ לתחנת המשטרה ללא התקיימות אחד משני החריגים בחוק (דחיפות/אי-אפשרות או אישור קצין ממונה לצורך ענייני), או ללא תיעוד ההחלטה בכתב בסמוך לאחר קבלתה – מהווה פגם חקירתי.</li></ul></section><section class=\"release-subtopic\"><h3>אופני תיעוד חקירת חשוד (חזותי, קולי, בכתב) וכללי הרישום</h3><ul><li><strong>הכלל המרכזי</strong>: בחוק סדר הדין הפלילי (חקירת חשודים), התשס\"ב-2002, קיימות <strong>שלוש חלופות קבועות לתיעוד חקירת חשוד</strong>: תיעוד חזותי (וידאו וקול), תיעוד קולי (סאונד בלבד), ותיעוד בכתב.</li><li><strong>התנאים המרכזיים לכל חלופת תיעוד</strong>: 1. <strong>תיעוד חזותי / קולי</strong>: חייב להקיף את <strong>כל מהלכה של החקירה</strong>, ולכלול את חילופי הדברים בין החוקר לחשוד. בתיעוד חזותי – לרבות תגובות ותנועות גוף. 2. <strong>תיעוד בכתב</strong>: יכלול את עיקרי חילופי הדברים ותגובות/תנועות גוף המהוות תחליף לחילופי דברים, בדרך שתשקף נכונה את המתרחש. התיעוד בכתב ייערך <strong>בו-זמנית</strong> עם החקירה או בסמוך לה ככל האפשר.</li><li><strong>החריג המרכזי וכללי הרישום בפרקטיקה (\"הערת חוקר\")</strong>: * בתיעוד בכתב, כאשר אין צילום חזותי, חובה לתעד תופעות פיזיות ורגשיות של החשוד באמצעות שילוב מנגנון <strong>\"הערת חוקר\"</strong> בגוף הפרוטוקול (כגון: \"החשוד בוכה\", \"החשוד מזיע בצורה אובססיבית\").</li><li><strong>זכות / חובה / סמכות חשובה</strong>: * <strong>סמכות תיעוד סמוי (הקלטה/צילום מוסתר)</strong>: בחוק <strong>אין שום חובה לספר לחשוד שהחקירה מוקלטת בתיעוד חזותי!</strong> המשטרה מוסמכת לבצע תיעוד חזותי סמוי (מצלמה מוסתרת בעט, בתמונה, בקיר, בעציץ וכיו\"ב).</li><li><strong>מועד חשוב</strong>: התיעוד בכתב חייב להירשם <strong>בו-זמנית</strong> עם חקירת החשוד או בסמוך לה ככל האפשר.</li><li><strong>הבחנה מרכזית</strong>: * <strong>הדין בחוק מול הפרקטיקה המשטרתית</strong>: בחוק, לגבי עבירות חמורות (10 שנות מאסר ומעלה) נדרש תיעוד חזותי ואין דרישה בחוק לתיעוד בכתב במקביל; אולם <strong>בפרקטיקה המשטרתית מבוצע תמיד תיעוד בכתב במקביל לתיעוד החזותי/הקולי!</strong></li><li><strong>נקודת מבחן מרכזית</strong>: רישום חלק יחסי או חסר בתיעוד בכתב, הימנעות מתיעוד תגובות פיזיות (\"הערות חוקר\") כשאין צילום חזותי, או טענה מוטעית כאילו חובה לגלות לחשוד על צילום סמוי – מהווים נקודות כשל מרכזיות במבחן.</li></ul></section><section class=\"release-subtopic\"><h3>חובת תיעוד חזותי בחקירת עבירות חמורות (10 שנות מאסר ומעלה)</h3><ul><li><strong>הכלל המרכזי</strong>: חקירת חשוד בעבירה פלילית שדינה <strong>10 שנות מאסר או יותר</strong> (עד עונש מוות/מאסר עולם) <strong>חייבת להתועד בתיעוד חזותי</strong> (צילום וידאו וקול במקביל).</li><li><strong>המקור הנורמטיבי</strong>: <strong>חוק סדר הדין הפלילי (חקירת חשודים), התשס\"ב-2002</strong>, הוראות החוק.</li><li><strong>התנאים המרכזיים</strong>: 1. הנחקר הוא <strong>חשוד</strong> בביצוע עבירה פלילית (להבדיל מעד). 2. העבירה הנחקרת היא <strong>עבירה חמורה</strong> אשר העונש הקבוע לצדה בחוק הוא 10 שנות מאסר או יותר (כגון רצח, אונס, שוד חמור). 3. התיעוד החזותי מקיף את כל מהלכה של החקירה וכולל חילופי דברים, תגובות ותנועות גוף.</li><li><strong>שלושת החריגים המרכזיים לכלל</strong>: 1. <strong>תקלה טכנית / צורך ענייני</strong>: אם אירעה תקלה טכנית במכשירי ההקלטה או שהתעורר צורך ענייני, רשאי <strong>קצין ממונה</strong> להורות על מעבר לתיעוד קולי (אודיו) או לתיעוד בכתב. ברגע שחדלו הנסיבות המונעות – חובה לחזור לתיעוד חזותי. 2. <strong>סייג עבירת ביטחון (סעיף 17)</strong>: חובת התיעוד החזותי/הקולי <strong>אינה חלה</strong> בחקירת חשוד בעבירת ביטחון (מטעמי ביטחון מידע), ובלבד שמונה במשטרה גורם המבצע פיקוח ובקרה שוטפים. 3. <strong>חקירה מחוץ לתחנה ונוהל אישורה בתחנה</strong>: נחקר חשוד מחוץ לתחנה בעבירה של 10 שנות מאסר ומעלה, חובה להציג בפניו את התיעוד בתחנה בהקדם האפשרי ולבקש ממנו לאשרו; הליך הצגת התיעוד והאישור יתועד בתיעוד חזותי או קולי (קצין ממונה רשאי לדחות את הצגת התיעוד מטעמים מיוחדים שיירשמו).</li><li><strong>זכות / חובה / סמכות קריטית (סמכות תיעוד סמוי)</strong>: <em> בחוק <strong>אין שום חובה לגלות לחשוד שהחקירה מצולמת או מוקלטת!</strong>. </em> המשטרה מוסמכת לבצע תיעוד חזותי סמוי (מצלמה מוסתרת בעט, בתמונה, בקיר, בתוך הטיח, בעציץ וכדומה).</li><li><strong>הבחנה מרכזית (הדין בחוק מול הפרקטיקה המשטרתית)</strong>: <em> <strong>בחוק היבש</strong>: נדרש תיעוד חזותי בלבד, ואין חובה בחוק לתעד בכתב במקביל בעבירות אלה. </em> <strong>בפרקטיקה המשטרתית</strong>: מבוצע תמיד <strong>תיעוד משולב</strong> – המשטרה מפעילה תיעוד חזותי ובמקביל החוקר יושב ורושם בכתב פרוטוקול מלא מילה במילה.</li><li><strong>נקודת מבחן מרכזית</strong>: חקירת חשוד בעבירה שדינה 10 שנות מאסר ומעלה בתיעוד בכתב בלבד, ללא אישור קצין ממונה עקב תקלה טכנית/צורך ענייני מתועדים, מהווה פגם חקירתי חמור המעמיד בסכנה את קבילות ההודאה בבית המשפט.</li></ul></section><section class=\"release-subtopic\"><h3>חובת תיעוד חזותי/קולי בנסיבות מיוחדות (שחזור עבירה, שפת הסימנים, מוגבלות ואי-ידיעת קרוא וכתוב)</h3><ul><li><strong>הכלל המרכזי</strong>: <strong>חוק סדר הדין הפלילי (חקירת חשודים), התשס\"ב-2002</strong> קובע קטגוריות מיוחדות של חקירות ונסיבות שבהן קיימת <strong>חובה מוחלטת</strong> לתיעוד <strong>חזותי בלבד</strong> (וידאו + קול) או לתיעוד <strong>חזותי או קולי</strong> (אודיו).</li><li><strong>שלושת המצבים של חובת תיעוד חזותי בלבד (וידאו)</strong>: 1. <strong>עבירות חמורות</strong>: חקירת חשוד בעבירה שדינה 10 שנות מאסר ומעלה. 2. <strong>שחזור עבירה בשטח</strong>: שחזור עבירה המבוצע בידי חשוד מחוץ לתחנה.</li><li><strong>שלושת המצבים של חובת תיעוד חזותי או קולי (אודיו/וידאו)</strong>: 1. <strong>אי-ידיעת קרוא וכתוב או מוגבלות</strong>: חשוד שקיים לגביו חשד אינו יודע קרוא וכתוב (בכל שפה) או אדם עם מוגבלות המקשה עליו לאשר את נכונות התיעוד בכתב. 3. <strong>הליך אישור חקירה מחוץ לתחנה (בעבירות חמורות)</strong>: הצגת התיעוד והליך אישורו בתחנה בפני חשוד שנחקר מחוץ לתחנה בעבירה שדינה 10 שנות מאסר ומעלה.</li><li><strong>זכות / חובה / סמכות חשובה</strong>: * <strong>זכות החשוד המוגבל/האנאלפבית</strong>: הגנה מפני החתמתו על פרוטוקול בכתב שאינו מסוגל לקרוא או לאשר.</li><li><strong>מועד חשוב</strong>: הצגת התיעוד והליך אישורו בתחנה (בעבירות של 10+ שנות מאסר שנחקרו מחוץ לתחנה) יבוצעו <strong>בהקדם האפשרי</strong> מיום ההגעה לתחנה.</li><li><strong>הבחנה מרכזית</strong>: הבחנה בין מצבים המחייבים <strong>תיעוד חזותי בלבד</strong> (שחזור, שפת סימנים, עבירות 10+ שנים) לבין מצבים שבהם קיימת גמישות לביצוע <strong>תיעוד חזותי או קולי</strong> (אנאלפבית, מוגבלות, אישור חקירה מחוץ לתחנה).</li></ul></section><section class=\"release-subtopic\"><h3>הסייג לחובת תיעוד חזותי/קולי בעבירות ביטחון</h3><ul><li><strong>הכלל המרכזי</strong>: <strong>סעיף 17 לחוק סדר הדין הפלילי (חקירת חשודים), התשס\"ב-2002</strong>, קובע סייג ופטור מפורש מחובת התיעוד החזותי (וידאו) או הקולי (אודיו) בחקירת חשוד בעבירת ביטחון.</li><li><strong>התנאים המרכזיים</strong>: 1. הנחקר הוא <strong>חשוד</strong> בביצוע <strong>עבירת ביטחון</strong>. 2. במשטרה מונה גורם ייעודי המבצע פיקוח ובקרה שוטפים על חקירות אלה.</li><li><strong>החריג המרכזי והיקף הפטור</strong>: הפטור מתיעוד חזותי או קולי חל <strong>גם אם העבירה הביטחונית היא עבירה חמורה שדינה 10 שנות מאסר ומעלה</strong> (שככלל מחייבת תיעוד חזותי לפי סעיף 7 / סעיף א' בטבלה), וגם אם החקירה נערכה מחוץ לתחנת המשטרה (סעיף 10 / סעיף ה' בטבלה).</li><li><strong>חובה / מנגנון פיקוח ותיעוד</strong>: <em> מתן הפטור מותנה בכך שמונה במשטרה גורם שיערוך פיקוח ובקרה שוטפים על החקירות הביטחוניות. </em> התיעוד בכתב (פרוטוקול) נותר חובה, אך נשמר תחת סיווג של <strong>\"חומר סודי ביותר\"</strong>.</li><li><strong>הרציונל המשפטי</strong>: הגנה על <strong>ביטחון מידע</strong> ומניעת סיכון חיי אדם. בחקירות ביטחוניות נחשפים פרטים רגישים (כגון שיטות חדירה, פרצות בגדרות בסיסים, ושיטות איסוף מודיעין). דליפה של תיעוד חזותי או קולי מתוך החדר עלולה לסכן חיי אדם ואינטרסים ביטחוניים קריטיים.</li><li><strong>הבחנה מרכזית</strong>: הבחנה בין עבירה פלילית רגילה חמורה (המחייבת תיעוד חזותי קטגורי בשילוב תמונה וקול) לבין עבירת ביטחון חמורה (הפטורה מתיעוד חזותי/קולי מטעמי ביטחון מידע).</li><li><strong>נקודת מבחן מרכזית</strong>: היעדר תיעוד חזותי או קולי בחקירת חשוד בעבירת ביטחון (אפילו בעבירה שדינה מאסר עולם) <strong>אינו מהווה פגם חקירתי</strong>, ובלבד שמתקיים מנגנון הפיקוח והבקרה השוטף במשטרה.</li></ul></section><section class=\"release-subtopic\"><h3>איסור פרסום תיעוד חזותי או קולי של חקירה וארבעת עקרונותיו</h3><ul><li><strong>הכלל המרכזי</strong>: קיימים איסור מוחלט וסייג קשיח על פרסום תיעוד חזותי (וידאו) או קולי (אודיו) של חקירה פלילית שבוצעה בידי גוף חוקר, אלא אם כן ניתן היתר/רשות מפורשת מבית המשפט (<strong>סעיף 13 לחוק סדר הדין הפלילי (חקירת חשודים), התשס\"ב-2002</strong>).</li><li><strong>התנאים המרכזיים לפרסום</strong>: פנייה מוקדמת לבית המשפט לקבלת רשות מפורשת בטרם ביצוע הפרסום ברבים.</li><li><strong>החריג המרכזי (אי-קיומו של חריג עצמאי)</strong>: <strong>אין שום חריג המאפשר פרסום עצמאי!</strong> אפילו הסכמה מפורשת בכתב של החשוד/הנחקר אינה מהווה חריג ואינה מתירה את הפרסום ללא אישור שיפוטי.</li><li><strong>זכות / חובה / סמכות חשובה</strong>: <em> <strong>זכות הנחקר</strong>: הגנה חוקתית על כבודו, שמו הטוב ופרטיותו בעת חקירתו בחדר החקירות. </em> <strong>סמכות בית המשפט</strong>: סמכות בלעדית להתיר או לאסור את הפרסום לאחר איזון בין טוהר ההליך השיפוטי להגנת הפרטיות.</li><li><strong>מועד חשוב ותחולה בזמן</strong>: איסור הפרסום חל בכל שלבי ההליך הפלילי – <strong>בשלב החקירה, במהלך ניהול המשפט, ואף לאחר שהמשפט הסתיים לחלוטין!</strong></li><li><strong>הבחנה מרכזית (הדין בחוק ובפסיקה מול הפרקטיקה בשטח)</strong>: <em> <strong>לפי החוק והפסיקה</strong>: נקבע איסור פרסום קשיח וקטגורי ללא רשות שופט. </em> <strong>לפי הפרקטיקה בשטח</strong>: קיימות הדלפות רבות של הקלטות חקירה ע\"י גורמי משטרה, תביעה ותקשורת. המרצה מדגיש כי למבחן האקדמי נדרשים אך ורק לכלל המשפטי המחייב ולא להפרות בשטח.</li><li><strong>נקודת מבחן מרכזית</strong>: פרסום הקלטת חקירה על יסוד הסכמת החשוד בלבד, ללא רשות בית משפט, מהווה הפרה של סעיף 13 לחוק חקירת חשודים; והתנגדות הנחקר לפרסום מהווה \"שיקול נכבד ביותר\" עבור בית המשפט שלא להתיר את הפרסום.</li></ul></section><section class=\"release-subtopic\"><h3>פגמים בחקירה, אי-הודעה על זכויות ופסילת ראיות</h3><ul><li><strong>הכלל המרכזי</strong>: חקירה פלילית המתנהלת תוך הפרת זכויות יסוד פרוצדורליות של הנחקר – ובראשן אי-הודעה לחשוד על <strong>זכות השתיקה</strong>, הימנעות מהפסקת עדות מעד שהפך לחשוד, או הפרת כללי השפה, המקום והתיעוד בחוק – מהווה חקירה פגומה.</li><li><strong>תוצאת הפגם (דוקטרינת הפסילה הפסיקתית)</strong>: מחדל חקירתי של אי-הודעה על זכות השתיקה (או אי-מתן אזהרה בעת מעבר מעד לחשוד) מקים לבית המשפט סמכות <strong>לפסול את ההודאה או ההודעה</strong> שנגבתה מהנחקר, במסגרת דוקטרינת הפסילה הפסיקתית שנקבעה בבית המשפט העליון (<strong>הלכת יששכרוב</strong>).</li><li><strong>התנאים המרכזיים להחלת עילת הפסילה</strong>: 1. התרחשות פגם או מחדל חקירתי הפוגע בזכויות הנחקר לפי דין (כגון גביית אמרה ללא אזהרה בדבר זכות השתיקה). 2. יצירת פגיעה בזכותו של החשוד להליך הוגן. 3. זיקה וקשר סיבתי בין הפגם בחקירה לבין השגת הראיה/ההודאה.</li><li><strong>החריג המרכזי (נסיבות שאינן מהוות פגם)</strong>: <em> <strong>תיעוד סמוי</strong>: צילום חזותי סמוי בחדר החקירות במצלמה מוסתרת (בעציץ, בעט, בקיר וכדומה) ללא הודעה לחשוד <strong>אינו מהווה פגם חקירתי</strong> ומותר על פי דין. </em> <strong>סייג עבירות ביטחון</strong>: היעדר תיעוד חזותי או קולי בחקירת חשוד בעבירת ביטחון (סעיף 17 לחוק חקירת חשודים) <strong>אינו מהווה פגם</strong>, מטעמי ביטחון מידע.</li><li><strong>זכות / חובה / סמכות חשובה</strong>: <em> <strong>חובת החוקר</strong>: חובה מוחלטת להזהיר חשוד בדבר זכות השתיקה בטרם חקירתו, ולעצור מיד עדות עד ברגע שעולה נגדו חשד פלילי. </em> <strong>סמכות בית המשפט</strong>: סמכות לפסול הודאות/ראיות שהושגו שלא כדין תוך פגיעה בזכות השתיקה והזכות להליך הוגן.</li><li><strong>מועד חשוב</strong>: מתן האזהרה וההודעה על זכות השתיקה חייבים להתבצע <strong>אופן מיידי ובסמוך ממש</strong> לרגע שבו עולה החשד לביצוע עבירה בידי הנחקר.</li><li><strong>הבחנה מרכזית</strong>: הבחנה בין \"הודעה\" של עד (הכפופה לחובת מענה נכונה למעט חיסיון מפני הפללה עצמית) לבין \"חקירה\" ו\"הודיה\" של חשוד (הנהנה מזכות שתיקה מלאה).</li><li><strong>נקודת מבחן מרכזית</strong>: מחדל משטרתי בהודעה על זכות השתיקה או המשכת חקירת עד שהפך לחשוד ללא אזהרה מפעילים את הלכת יששכרוב ומקימים עילה לפסילת הראיה בבית המשפט.</li></ul></section></div><div class=\"callout case-callout\"><span class=\"callout-title\">פסיקה קשורה ומאומתת</span><button class=\"case-link\" data-case=\"25\">⚖ רפאל יששכרוב נגד התובע הצבאי הראשי</button></div>","lesson":"extra","status":"מבוסס על מקור הקורס המסומן","lessons":["extra"],"source":"שיעור דיני חקירה-audio.mp4"}]}];
const CASES = [{"name":"פרדריק וילאם סילוסטר נגד היועץ המשפטי לממשלה","cite":"ע\"פ 1/48 (1948) — התיק הפלילי הראשון בעליון","facts":"אזרח בריטי הואשם בעבירות ריגול חמורות בזמן מלחמת העצמאות. המחוזי הרשיע וגזר 7 שנות מאסר. בערעור התמקד הסנגור בפגמים טכניים בניסוח כתב האישום.","claimant":"פגמים פרוצדורליים בכתב האישום יורדים לשורש העניין ומחייבים ביטול ההרשעה וההליך כולו.","respondent":"מדובר בפגמים צורניים קלים בלבד, שלא פגעו ביכולת הנאשם להתגונן.","question":"האם פגם דיוני או פורמלי מביא בהכרח לבטלות המשפט, גם כשהוכחו העובדות ולא נגרם עיוות דין?","ruling":"העליון זיכה מחמת הספק המהותי, אך קבע כי כללי הדיון נועדו להגן מפני עיוות דין, ואסור להפוך אותם למטרה בפני עצמה.","halacha":"הפרוצדורה הפלילית אינה משחק שחמט (\"אשקוקי\") שבו מהלך שגוי אחד קובע את גורל המשחק. פגם דיוני שלא גרם לעיוות דין ולא מנע הגנה הוגנת — לא יביא לפסילת ההליך (עוגן בהמשך בסעיף 215 לחסד\"פ).<p><b>השלמת A2: יש להבחין בין עצם קיומו של פגם דיוני לבין תוצאה של עיוות דין. אין להסיק ביטול אוטומטי מפגם שלא פגע בהגנה; הסעד תלוי בהשפעה הממשית ובהגינות ההליך.</b></p>","currency":"לא אומת עדכון מעבר למקורות הקורס"},{"name":"יצחק קניר נגד מדינת ישראל","cite":"ע\"פ 951/80 (1980) — מפי השופט אהרן ברק","facts":"לאחר שהצדדים סיימו להביא ראיות והמשפט הגיע לסיכומים, ביקשה התביעה להגיש ראיה נוספת. בית המשפט התיר זאת.","claimant":"סעיף 167 מתיר הבאת ראיות ביוזמת בית המשפט רק בין תום הראיות לתחילת הסיכומים — לא בשלב הסיכומים עצמו.","respondent":"חשיפת האמת ומניעת עיוות דין גוברות על סדר הבאת הראיות הפורמלי.","question":"האם לבית המשפט סמכות להתיר ראיות חדשות בשלבים מאוחרים, כגון הסיכומים?","ruling":"הערעור נדחה — המשפט הפלילי אינו תחרות ספורטיבית שבה הכללים קדושים יותר מחקר האמת.","halacha":"לבית המשפט סמכות טבועה ושיקול דעת רחב לסטות מסדר הראיות הרגיל ולהתיר ראיות גם בשלבים מאוחרים ביותר — ואף בערעור — ובלבד שנועד למניעת עיוות דין ותוך מתן הזדמנות הוגנת לנאשם להתמודד עם הראיה.","currency":"לא אומת עדכון מעבר למקורות הקורס"},{"name":"אברהם בן חיים נגד מדינת ישראל","cite":"רע״פ 10141/09, בצירוף רע״פ 617/10 ורע״פ 5758/10 (6.3.2012)","facts":"שוטרים פנו לבן חיים ברחוב. לאחר בירור נמצא שאינו דרוש אך יש לו רישום פלילי. שוטר ביקש שירוקן את כיסיו, וכך נמצאה סכין. בית משפט השלום זיכה אותו; המחוזי קיבל את ערעור המדינה והרשיעו. העליון דן יחד בשלושה הליכים שבהם עלתה שאלת קבילות ראיות מחיפושים שנערכו בהסכמה נטענת.","claimant":"הסנגוריה טענה שהסכמה אינה תחליף להסמכה בדין; לחלופין עליה להיות מדעת, לאחר הסבר על הזכות לסרב. היא ביקשה לפסול גם ראיות חפציות לפי יששכרוב. בעניינו של בן חיים לא היה חשד סביר ולא ניתן הסבר על הזכות לסרב.","respondent":"המדינה טענה שהסכמה יכולה להכשיר את החיפוש מתוך כיבוד האוטונומיה; שלא הכרחי לתת הודעה מפורשת או טופס; ושבנסיבות בן חיים מדובר בפגיעה מינימלית ובספק אם זו פעולת חיפוש. היא הדגישה גם את צורכי האכיפה.","question":"האם הסכמה יכולה לשמש מקור לחיפוש בהיעדר סמכות אחרת, מה נדרש להסכמה מדעת, והאם אי־חוקיות החיפוש מחייבת לפסול את הראיה?","ruling":"ערעוריהם של בן חיים וג׳בלי התקבלו והם זוכו בעקבות פסילת הראיות. ערעור עייש בעניין חוקיות החיפוש נדחה והרשעתו נותרה: בעניינו נמצא גם מקור סמכות עצמאי, ולא רק הסכמה.","halacha":"לפי הרוב, בנסיבות המתאימות הסכמה אמיתית, מודעת ורצונית יכולה לשמש מקור לחיפוש מהסוג שנדון, לאחר הסבר מפורש על הזכות לסרב והיעדר השלכה לרעת המסרב. אין להסיק מכאן היתר לכל סוג חיפוש. חיפוש לא חוקי אינו גורר פסילה אוטומטית: יש לדון בנפרד בדוקטרינת הפסילה היחסית.<p><b>השלמת A2: בהיעדר מקור סמכות עצמאי, הסכמה לחיפוש צריכה להיות אמיתית, מודעת ורצונית; יש להעמיד את האדם על זכותו לסרב. שאלת קבילות הראיה נבחנת בנפרד ובאופן יחסי.</b></p>","currency":"מוצגת ההכרעה במקור שבמחברת. לא אומתו שינויים מאוחרים מחוץ למקורות הקורס.","reasoning":"הרוב הבחין בין סמכות החיפוש לבין קבילות הראיה. בשל פערי הכוחות אין להסתפק בהיענות לבקשת שוטר: דרוש הסבר ברור על הזכות לסרב ועל כך שהסירוב לא ייזקף לחובת האדם. אין חובה גורפת לקבל הסכמה בכתב. בנפרד, הפסילה לפי יששכרוב היא יחסית ותלויה באיזון נסיבות המקרה; גם ראיה חפצית אינה חסינה מפסילה.","dissent":"השופט דנציגר הסכים לתוצאה אך חלק על האפשרות שהסכמה כשלעצמה תחליף הסמכה בחוק, מטעמי חוקיות המינהל ופערי הכוחות. השופטת ארבל הצטרפה לנשיאה ביניש.","exam":"סדר הניתוח: מקור סמכות עצמאי → תוקף ההסכמה → חוקיות החיפוש → קבילות הראיה. אין לדלג מהיעדר הסכמה מדעת ישירות למסקנה שכל ראיה נפסלת.","source":"אברהם בן חיים נ׳ מדינת ישראל.pdf — רע״פ 10141/09, פסקאות 3–5, 13, 31–35 וההכרעה הסופית"},{"name":"ג'ון איוון דמיאניוק נגד מדינת ישראל","cite":"ע\"פ 347/88 (1988)","facts":"דמיאניוק הואשם בהיותו \"איוון האיום\" מטרבלינקה והורשע במחוזי למוות. בערעור התעורר ספק בזיהוי, אך הוכח כי שירת כשומר נאצי בסוביבור. התביעה ביקשה להרשיעו בכך מכוח סעיף 184.","claimant":"כל אסטרטגיית ההגנה נועדה להפריך זיהוי כאיוון האיום; אילו הואשם בסוביבור, קו ההגנה היה שונה לגמרי.","respondent":"העובדות שהוכחו מבססות שירות כשומר נאצי, ולכן ניתן להרשיע מכוח סעיף 184.","question":"האם ניתן, בערעור, להרשיע בעבירה שונה לחלוטין מזו שבכתב האישום כשההגנה התמקדה בזיהוי ספציפי?","ruling":"זיכוי מלא — הזכות להזדמנות סבירה להתגונן היא זכות מהותית ודינמית, ולא פורמלית.","halacha":"תנאי בלעדי להפעלת סעיף 184: הזדמנות סבירה וממשית להתגונן מפני העבירה ה'חדשה'. כשקו ההגנה היה משתנה מהותית אילו ידע הנאשם מראש — לא ניתן להרשיעו בעבירה האחרת.","currency":"לא אומת עדכון מעבר למקורות הקורס"},{"name":"צדוק נגד ראש אגף חקירות ומודיעין","cite":"בג\"ץ 1113/07 (2007)","facts":"העותר הגיש תלונה נגד אנשי ציבור בעבירות פשע חמורות. הקצין החליט שלא לחקור — התלונה נעדרת בסיס עובדתי ראשוני.","claimant":"סעיף 59 קובע חובה מוחלטת לחקור עבירת פשע, ללא שיקול דעת.","respondent":"אין לחייב את המשטרה לבזבז משאבים על תלונות מופרכות על פניהן.","question":"האם חובת החקירה בפשע היא מוחלטת, או שקיים חריג לתלונות מופרכות?","ruling":"העתירה נדחתה — החוק אינו דורש פעולה אוטומטית חסרת שיקול דעת.","halacha":"למשטרה שיקול דעת מקדמי ומצומצם ביותר שלא לפתוח בחקירת פשע, רק במקרים חריגים בהם התלונה מופרכת לחלוטין ונעדרת תשתית ראייתית מינימלית.","currency":"לא אומת עדכון מעבר למקורות הקורס"},{"name":"שמואל נגד היועץ המשפטי לממשלה","cite":"בג\"ץ 4388/08 (2008)","facts":"שמואל קיבל מכתב יידוע. עורך דינו דרש את טיוטת כתב האישום וכל חומרי החקירה כדי לערוך שימוע אפקטיבי. התביעה סירבה.","claimant":"לא ניתן לקיים שימוע הוגן כשהחשוד מגשש באפלה, ללא ידיעת הראיות נגדו.","respondent":"זכות העיון המלאה (סעיף 74) קמה רק לאחר הגשת כתב אישום, כשהחשוד הופך לנאשם.","question":"האם זכות השימוע כוללת עיון בחומרי החקירה המלאים או בטיוטת כתב האישום, לפני הגשתו בפועל?","ruling":"העתירה נדחתה — אין לחשוד זכות עיון מלא בשלב השימוע.","halacha":"זכות העיון המלאה שמורה לנאשם לאחר הגשת כתב אישום בלבד. עם זאת, כדי שהשימוע לא יהיה טקס ריק, על התביעה למסור לחשוד את עיקרי העובדות והחשדות המתגבשים נגדו.","currency":"לא אומת עדכון מעבר למקורות הקורס"},{"name":"אפרים נוה נגד מדינת ישראל","cite":"בג\"ץ 4922/19 (2019) — מפי השופט יצחק עמית","facts":"נוה, נאשם במרמה, ביקש לבסס טענת אכיפה בררנית ודרש נתונים מתיקים דומים. משסורבה בקשתו, פתח בעתירה מנהלית מקבילה מכוח חוק חופש המידע.","claimant":"חוק חופש המידע מעניק זכות אזרחית לקבל את הנתונים במקביל למשפט הפלילי.","respondent":"חומרים מתיקים אחרים אינם חומר חקירה בתיק הנוכחי; הליכים מקבילים פוגעים ביעילות.","question":"האם נאשם רשאי לפעול במסלול מקביל של חופש המידע כדי להשיג חומרים למשפטו הפלילי התלוי ועומד?","ruling":"העתירה נדחתה — נקבעה הלכת ייחוד ההליך הפלילי.","halacha":"כל בקשות הגילוי לצורך הגנת הנאשם יתבררו אך ורק בפני בית המשפט הפלילי הדן בתיק — באמצעות בקשה לצו הבאת מסמכים (סעיף 108) בשילוב טענת אכיפה בררנית (סעיף 149(10)).<p><b>השלמת A2: יש להבחין בין החלטת מדיניות כללית של התביעה לבין פגם פרטני בהחלטה קונקרטית; הביקורת אינה מחליפה את שיקול דעת התביעה.</b></p>","currency":"לא אומת עדכון מעבר למקורות הקורס"},{"name":"מנחם קנזי נגד מדינת ישראל","cite":"ע\"פ 194/75 (1975)","facts":"קנזי וביטון הועמדו לדין נפרד בגין פריצה וגניבה. התביעה זימנה את ביטון להעיד נגד קנזי, בעוד משפטו של ביטון עצמו עדיין תלוי ועומד.","claimant":"לשותף שמשפטו תלוי ועומד אינטרס כבד לשקר ולהחמיר, כדי לזכות בהקלות בעונשו שלו.","respondent":"כל אדם כשר להעיד; החשש מפני שקר משפיע על המשקל בלבד, לא על הקבילות.","question":"האם שותף שמשפטו תלוי ועומד כשר להעיד נגד שותפו?","ruling":"הערעור התקבל — נקבע איסור על העדת שותף כזה.","halacha":"זהו הכלל ההיסטורי. אין ליישמו כיום ככלל חוסם במשפטים נפרדים בלי להתייחס לבג״ץ 11339/05, שביטל את החסם הגורף והותיר חריג מצומצם. ראו את הניתוח המקושר בנושא עדות שותפים.<p><b>השלמת A2: אין להחיל את כלל הסופיות באופן מכני. יש לזהות את סוג המחדל, את הפגיעה בהגינות ואת הסעד המתאים, בלי לקבוע חריג שלא נתמך בחומר הקורס.</b></p>","currency":"לא אומת עדכון מעבר למקורות הקורס","source":"מדינת ישראל נ׳ בית המשפט המחוזי באר שבע 11339-05.pdf — ההכרעה הסופית ודעת הנשיאה ביניש, פסקה 3"},{"name":"רע\"פ סלימאן זכריא נגד מדינת ישראל","cite":"רע״פ 11160/03 (3.11.2004)","facts":"זכריא הועמד לדין על תקיפה הגורמת חבלה ממשית ואיומים, זוכה מעבירות אלה והורשע בתקיפה לפי סעיף 379. בערעור התייצבו הצדדים, וסנגורו הודיע שהוא מסתפק בהודעת הערעור. המדינה הגישה תשובה בכתב בהסכמתו. לאחר מכן ביקש דיון נוסף בעל־פה; בקשתו והערעור נדחו.","claimant":"המבקש טען שנפגעה זכותו לטעון בעל־פה וכי בית המשפט כפה עליו מסלול כתוב. הוא נימק את בקשת הדיון הנוסף בכך שתשובת המדינה לא כללה מענה משפטי מספק.","respondent":"המקור אינו מפרט בנפרד את מלוא טענות המדינה בפני העליון. מתואר כי בערעור ביקשה להשיב בכתב, ללא התנגדות הסנגור.","question":"מה מקומו של טיעון בעל־פה בערעור פלילי, והאם בנסיבות אלה נמנעה מהמבקש האפשרות לטעון?","ruling":"בקשת רשות הערעור נדחתה. בנסיבות שתועדו לא הוכח פגם בהליך המצדיק התערבות.","halacha":"אין ללמוד מההחלטה היתר גורף להחלפת הטיעון בערעור פלילי בכתב בלבד. יש להבחין בין שלילת הזכות לטעון לבין בחירה של בעל דין שהופיע להסתפק בטיעון כתוב.","currency":"לצד ההחלטה יש ללמוד את הדיון המאוחר בפלוני 5333/11 שבמחברת. אין כאן אימות עדכניות חיצוני.","withheld":false,"reasoning":"השופט לוי הדגיש את הדיון בנוכחות הצדדים לפי סעיף 208 ואת תפקיד הכתב כהכנה לטיעון ישיר. אולם בפרוטוקול הופיע שהמבקש עצמו הסתפק בנימוקיו הכתובים; לא נמצאה בו כפייה, ולא התבקש תיקונו. גם האפשרות להגיב לתשובת המדינה ניתנה ולא נוצלה.","dissent":"ברק הסכים ללוי. פרוקצ׳יה הסכימה לתוצאה אך הותירה בצריך עיון את השאלה אם הסכמה מוקדמת למסלול כתוב בלבד, ללא פגיעה או עיוות דין, יכולה להכשירו מכוח תום לב ומניעות.","exam":"בדקו מה קרה בדיון ומה רשום בפרוטוקול. אין להסיק מבקשה מאוחרת לדיון שהזכות נשללה מלכתחילה. השוו לפלוני 5333/11.","source":"זכריא נ׳ מדינת ישראל.pdf — רע״פ 11160/03, פסקאות 2–4 והערת השופטת פרוקצ׳יה"},{"name":"פלוני נגד מדינת ישראל","cite":"רע״פ 5333/11 (20.7.2011)","facts":"בעל מסעדה הורשע בהשמטת הכנסות של כשני מיליון ש״ח מדוחות המס. הסיכומים הוגשו בכתב בהסכמת סנגורו. לאחר שערעורו למחוזי נדחה, ביקש רשות ערעור וטען בין היתר שהיעדר סיכומים בעל־פה פגע בהליך ההוגן.","claimant":"המבקש טען כי יש לבטל את ההליך ולהחזירו לשופט אחר משום שלא נשמעו סיכומים בעל־פה; כן חלק על התשתית החשבונאית להרשעה.","respondent":"ההחלטה אינה מפרטת בנפרד את טענות המדינה בבקשת הרשות. אין לייחס לה טענות משוערות; מובאים כאן נימוקי בית המשפט.","question":"האם הגשת סיכומים בכתב בהסכמת הצדדים, ללא סיכומים בעל־פה, מחייבת ביטול ההליך?","ruling":"בקשת רשות הערעור נדחתה. לא נמצא פגם המצדיק ביטול ההליך; הבקשה לעיכוב ביצוע התייתרה.","halacha":"אין לבטל אוטומטית פסק דין רק משום שהסיכומים הוגשו בכתב בהסכמה. יש להבחין בין דרך המלך של טיעון בעל־פה לבין תוצאת הסטייה ממנה, ולבחון הסכמה ופגיעה בפועל בהגנה.","currency":"ההחלטה מוצגת לפי מקור המחברת; לא אומתה התפתחות מאוחרת מעבר למקורותיה.","withheld":false,"reasoning":"רובינשטיין הדגיש שטיעון בעל־פה הוא דרך המלך, אך הפסיקה והנוהג מאפשרים סיכומים בכתב בהסכמה. גם לשון סעיף 181א, המזכירה שמיעת סיכומים או הגשתם, מכירה בפרקטיקה. בעניינו של המבקש ניתנה הסכמה ולא הוצבע על נזק או עיוות דין. מורכבות כלכלית וטכנית עשויה אף להקנות יתרון לסיכומים כתובים.","dissent":"החלטה של שופט יחיד — אין דעת רוב ומיעוט.","exam":"זה אינו פסק דין על עדות שותף או על קטין בעבירת מין. השאלות הרלוונטיות הן מתכונת הסיכומים, הסכמת הצדדים ועיוות דין.","source":"פלוני נ׳ מדינת ישראל 5333-11.pdf — רע״פ 5333/11, פסקאות א–ט"},{"name":"סוסן נגד מדינת ישראל","cite":"ע\"פ 866/95 (1995) — הלכת סוסן","facts":"מספר נאשמים הועמדו לדין משותף במחוזי בפרשת מרמה. סוסן טען שכל העבירות המיוחסות לו אישית הן בסמכות בית משפט השלום בלבד.","claimant":"צירוף נאשמים אינו יכול לעקוף את כללי הסמכות העניינית הסטטוטוריים — יש לפצל את התיק.","respondent":"יעילות הדיון ומניעת החלטות סותרות מחייבות שמיעה משותפת תחת בית המשפט הבכיר.","question":"האם המחוזי רוכש סמכות עניינית לדון בנאשם שעבירותיו הן בסמכות השלום, מכוח צירופו לכתב אישום משותף?","ruling":"הערעור נדחה.","halacha":"כשמוקנית למחוזי סמכות עניינית לגבי נאשם אחד בכתב אישום משותף, הוא רוכש סמכות \"נגררת\" לדון גם ביתר הנאשמים — גם אם עבירותיהם הפרטניות בסמכות השלום — כדי למנוע פיצול הליכים.","currency":"לא אומת עדכון מעבר למקורות הקורס"},{"name":"אביגדור פלדמן נגד בית המשפט המחוזי","cite":"ע\"פ 4865/09 (2009) — פרשת משה קצב","facts":"בית המשפט קבע יומן אינטנסיבי של 4 ימי דיון בשבוע. סנגוריו של קצב ביקשו להשתחרר מייצוג עקב עומס עבודה — הבקשה נדחתה, והוגש ערעור עצמאי ומיידי.","claimant":"קצב הדיונים פוגע בהגנה ראויה ובזכויות מקצועיות; יש זכות ערעור מיידית על דחיית בקשת השחרור.","respondent":"החלטת ביניים אינה ניתנת לערעור מיידי; קצב הדיונים תואם את חובת השמיעה הרציפה (סעיף 125).","question":"האם לסנגור זכות ערעור מיידית על דחיית בקשת שחרור מייצוג? והאם עומס עבודה מצדיק פגיעה ברציפות הדיון?","ruling":"הערעור נדחה לגופו, אך התקבלה הטענה המקדמית בדבר זכות הערעור.","halacha":"לסנגור זכות ערעור עצמאית ומיידית על דחיית בקשת שחרור — חריג נדיר לכלל אי־ההתערבות בהחלטות ביניים. סעיף 125 מחייב שמיעת ראיות רציפה יום־יום; עומס עבודה של סנגור אינו טעם מיוחד לפגיעה ברציפות.<p><b>השלמת A2: יש להבחין בין אילוץ דיוני בניהול הייצוג לבין ויתור מדעת על זכות; יעילות הדיון לבדה אינה מוכיחה ויתור.</b></p>","currency":"לא אומת עדכון מעבר למקורות הקורס"},{"name":"מדינת ישראל נגד בורוביץ, נוה, ורותם — הגנה מן הצדק","cite":"ע\"פ 4855/02 בורוביץ; בג\"ץ 4922/19 נוה; דנ\"פ 5387/20 רותם","facts":"שלושה פסקי דין מרכזיים שעיצבו יחד את דוקטרינת ההגנה מן הצדק בישראל — כל אחד עסק במקרה שונה שבו נטען כי הגשת כתב אישום או ניהול ההליך פוגעים באופן מהותי בעקרונות של צדק והגינות משפטית.","claimant":"כאשר התנהלות הרשויות (למשל אכיפה בררנית, שיהוי בלתי סביר, או פגיעה בהליך התקין) חמורה במיוחד, יש לבטל את כתב האישום גם אם לא נפל בו פגם משפטי \"טכני\".","respondent":"הביטול על בסיס הגנה מן הצדק צריך להישמר למקרים חריגים ביותר,
