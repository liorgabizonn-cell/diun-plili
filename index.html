וי\u003c/b> — זכויות הנאשם עליונות.\u003c/li>\n      \u003c/ul>\n      \u003cp>בארה\"ב: פירות העץ המורעל (פסילה אוטומטית). בישראל (הלכת יששכרוב): \u003cb>פסילה פסיקתית יחסית\u003c/b> — שיקול דעת לפי איזון אינטרסים.\u003c/p>\n      \u003cdiv class=\"callout case-callout\">\u003cspan class=\"callout-title\">קשור לפסקי דין\u003c/span>\u003cbutton class=\"case-link\" data-case=\"25\">⚖ יששכרוב\u003c/button> \u003cbutton class=\"case-link\" data-case=\"2\">⚖ בן חיים\u003c/button>\u003c/div>\n      \u003cbutton class=\"expand-link\" data-topic=\"packer\">🔎 קריאה מורחבת\u003c/button>\n    ","lesson":"1","status":"אומת מול הקלטת שיעור 1","lessons":["1"],"source":"שיעור 1.mp3 — דברי המרצה"},{"id":"sec184","tag":"4","title":"סעיף 184 — הרשעה בעבירה שהתגלתה (נלמד בשיעור 1)","html":"\u003cdiv class=\"eyebrow\">חסד״פ\u003c/div>\u003ch2>סעיף 184 לחסד״פ והלכת דמיאניוק\u003c/h2>\u003cp>הסעיף מאפשר להרשיע בעבירה שאשמתו בה נתגלתה מן העובדות שהוכחו, אף אם היא שונה מן העבירה שבכתב האישום. לפי ההסבר בשיעור 1, נדרשים \u003cb>שני תנאים מצטברים\u003c/b>: ניתנה לנאשם הזדמנות סבירה להתגונן מפני העבירה האחרת; ולא יוטל עליו בשל אותה עבירה עונש חמור מזה שהיה אפשר להטיל בשל העבירה המקורית.\u003c/p>\u003cdiv class=\"callout warn\">\u003cspan class=\"callout-title\">יישום בדמיאניוק\u003c/span>\u003cp>העובדה שהוכחה עבירה אחרת אינה מספיקה. המרצה הסביר כי דמיאניוק התגונן לאורך המשפט מפני האישום המסוים שיוחס לו, ולא מפני האישום החלופי; לכן לא הייתה לו הזדמנות סבירה להתגונן מפניו.\u003c/p>\u003c/div>\u003cdiv class=\"callout case-callout\">\u003cspan class=\"callout-title\">קשור לפסק דין\u003c/span>\u003cbutton class=\"case-link\" data-case=\"3\">⚖ דמיאניוק נגד מדינת ישראל (1988)\u003c/button>\u003c/div>","lesson":"1","status":"אומת מול הקלטת שיעור 1","lessons":["1"],"source":"שיעור 1.mp3 — הדיון בסעיף 184 ובהלכת דמיאניוק"},{"id":"classify","tag":"5","title":"סיווג עבירות — סעיף 24 (נלמד בשיעור 1)","html":"\n      \u003cdiv class=\"eyebrow\">חובה לבחינה\u003c/div>\n      \u003ch2>סיווג העבירות — סעיף 24 לחוק העונשין\u003c/h2>\n      \u003cul>\n        \u003cli>\u003cb>חטא\u003c/b> — עד 3 חודשים מאסר, או קנס.\u003c/li>\n        \u003cli>\u003cb>עוון\u003c/b> — מעל 3 חודשים ועד 3 שנים (כולל).\u003c/li>\n        \u003cli>\u003cb>פשע\u003c/b> — מעל 3 שנים.\u003c/li>\n      \u003c/ul>\n      \u003cp>\u003cb>מלכודת:\u003c/b> בדיוק 3 שנים = עוון. סעיף 42: אין תקופה קצובה = שנה אחת = עוון אוטומטית.\u003c/p>\n      \u003cbutton class=\"expand-link\" data-topic=\"classify\">🔎 קריאה מורחבת\u003c/button>\n    ","lesson":"1","status":"אומת מול הקלטת שיעור 1","lessons":["1"],"source":"שיעור 1.mp3 — דברי המרצה"},{"id":"sec59","tag":"6","title":"תחילת ההליך הפלילי — סעיף 59 (נלמד בשיעור 1)","html":"\n      \u003cdiv class=\"eyebrow\">חסד\"פ\u003c/div>\n      \u003ch2>תחילת ההליך הפלילי — סעיף 59 לחסד\"פ\u003c/h2>\n      \u003cp>נפתח כשנודע למשטרה על עבירה. חובה מוחלטת לרשום כל תלונה.\u003c/p>\n      \u003cul>\n        \u003cli>\u003cb>פשע\u003c/b> — חובת חקירה מוחלטת. חריג: הלכת צדוק (תלונה מופרכת).\u003c/li>\n        \u003cli>\u003cb>חטא/עוון\u003c/b> — קצין פקד+ רשאי שלא לחקור, משיקולי מדיניות או רשות אחרת מוסמכת.\u003c/li>\n      \u003c/ul>\n      \u003cdiv class=\"callout case-callout\">\u003cspan class=\"callout-title\">קשור לפסק דין\u003c/span>\u003cbutton class=\"case-link\" data-case=\"4\">⚖ צדוק נגד ראש אגף חקירות ומודיעין (2007)\u003c/button>\u003c/div>\n      \u003cbutton class=\"expand-link\" data-topic=\"sec59\">🔎 קריאה מורחבת\u003c/button>\n    ","lesson":"1","status":"אומת מול הקלטת שיעור 1","lessons":["1"],"source":"שיעור 1.mp3 — הדיון בסעיף 59 ובדוגמת גניבה ממעסיק"}]},{"group":"התביעה וסגירת תיקים","items":[{"id":"bodies","tag":"7","title":"גופי התביעה — סעיף 60 (נלמד בשיעור 2)","html":"\n      \u003cdiv class=\"eyebrow\">חלוקת עבודה\u003c/div>\n      \u003ch2>גופי התביעה — חלוקת עבודה לפי סעיף 60\u003c/h2>\n      \u003cul>\n        \u003cli>\u003cb>הפרקליטות\u003c/b> — פשע חמור (רצח, אונס, שוחד, ביטחוני, צווארון לבן) + עוון רגיש ציבורית.\u003c/li>\n        \u003cli>\u003cb>התביעה המשטרתית\u003c/b> — פשע קל ורוב העוון/חטא.\u003c/li>\n      \u003c/ul>\n      \u003cp>פרקליט המחוז רשאי לחרוג מהחלוקה — לא פוסל את ההליך.\u003c/p>\n      \u003cp>\u003cb>חוק ההמלצות:\u003c/b> איסור המלצה בכתב להעמדה לדין, וחובת סיכום תשתית ראייתית (עם חריגים לכל אחד).\u003c/p>\n      \u003cbutton class=\"expand-link\" data-topic=\"bodies\">🔎 קריאה מורחבת\u003c/button>\n    ","lesson":"2","status":"תוכן קיים — טרם הושלם אימות פרטני","lessons":["2"]},{"id":"hearing","tag":"8","title":"זכות השימוע — סעיף 60א (נלמד בשיעור 2)","html":"\n      \u003cdiv class=\"eyebrow\">זכויות החשוד\u003c/div>\n      \u003ch2>חובת היידוע וזכות השימוע — סעיף 60א\u003c/h2>\n      \u003cp>בעבירת פשע בלבד — מכתב יידוע. שימוע \u003cb>בכתב תוך 30 יום = חובה\u003c/b>; בעל־פה = רשות.\u003c/p>\n      \u003cp>חריגים לחובת יידוע: מעצר, מניעה ביטחונית, אלימות במשפחה/עבירות מין במשפחה.\u003c/p>\n      \u003cdiv class=\"callout case-callout\">\u003cspan class=\"callout-title\">קשור לפסק דין\u003c/span>\u003cbutton class=\"case-link\" data-case=\"5\">⚖ שמואל נגד היועץ המשפטי לממשלה (2008)\u003c/button>\u003c/div>\n      \u003cbutton class=\"expand-link\" data-topic=\"hearing\">🔎 קריאה מורחבת\u003c/button>\n    ","lesson":"2","status":"תוכן קיים — טרם הושלם אימות פרטני","lessons":["2"]},{"id":"closure","tag":"9","title":"עילות סגירת תיק — סעיף 62 (נלמד בשיעור 2)","html":"\n      \u003cdiv class=\"eyebrow\">חסד\"פ\u003c/div>\n      \u003ch2>עילות סגירת תיק — סעיף 62\u003c/h2>\n      \u003cul>\n        \u003cli>\u003cb>חוסר ראיות מספיקות\u003c/b> — רישום פנימי.\u003c/li>\n        \u003cli>\u003cb>נסיבות העניין\u003c/b> — רישום פנימי + אישור גורם בכיר (3 דרגות).\u003c/li>\n        \u003cli>\u003cb>חוסר אשמה\u003c/b> — \"עילת הזהב\" — מחיקה מוחלטת.\u003c/li>\n      \u003c/ul>\n      \u003cdiv class=\"callout case-callout\">\u003cspan class=\"callout-title\">קשור לפסקי דין\u003c/span>\u003cbutton class=\"case-link\" data-case=\"6\">⚖ נוה\u003c/button> \u003cbutton class=\"case-link\" data-case=\"24\">⚖ אפל\u003c/button>\u003c/div>\n      \u003cbutton class=\"expand-link\" data-topic=\"closure\">🔎 קריאה מורחבת\u003c/button>\n    ","lesson":"2","status":"תוכן קיים — טרם הושלם אימות פרטני","lessons":["2"]}]},{"group":"עררים והסדר מותנה","items":[{"id":"appeal","tag":"10","title":"מסלול העררים — סעיפים 64–65 (נלמד בשיעור 3)","html":"\n      \u003cdiv class=\"eyebrow\">זכויות המתלונן\u003c/div>\n      \u003ch2>מסלול העררים — סעיפים 64–65\u003c/h2>\n      \u003cp>ערר בכתב תוך \u003cb>60 יום\u003c/b> מהודעת הסגירה.\u003c/p>\n      \u003cul>\n        \u003cli>גוף חוקר/תובע משטרתי → פרקליט המחוז / מנהל תחום עררים\u003c/li>\n        \u003cli>פרקליט מחוז/מדינה, עילה מקצועית → פרקליט המדינה\u003c/li>\n        \u003cli>פרקליט מחוז/מדינה, עילת מדיניות → היועמ\"ש\u003c/li>\n        \u003cli>פרקליט המדינה עצמו → היועמ\"ש\u003c/li>\n      \u003c/ul>\n      \u003cp>\u003cb>אין לערור פעמיים.\u003c/b> חשוד לא מקבל הודעה אוטומטית על ערר, אלא רק אם שוקלים לקבלו.\u003c/p>\n      \u003cbutton class=\"expand-link\" data-topic=\"appeal\">🔎 קריאה מורחבת\u003c/button>\n    ","lesson":"3","status":"תוכן קיים — טרם הושלם אימות פרטני","lessons":["3"]},{"id":"conditional","tag":"11","title":"ההסדר המותנה — סעיפים 67א–ו (נלמד בשיעור 3)","html":"\n      \u003cdiv class=\"eyebrow\">מסלול חלופי\u003c/div>\n      \u003ch2>ההסדר המותנה — סעיפים 67א–ו\u003c/h2>\n      \u003cp>סגירת תיק ללא כתב אישום, בתמורה להודאה ותנאים שיקומיים.\u003c/p>\n      \u003cul>\n        \u003cli>לפי המסגרת שהמרצה לימד: ראיות מספיקות; חטא/עוון; העונש המתאים אינו כולל מאסר בפועל; אין תיקים תלויים ועומדים ועבר נקי בחמש השנים שקדמו לעבירה, לרבות הסדרים קודמים\u003c/li>\n      \u003c/ul>\n      \u003cp>חובת חשיפה מיוחדת של טיוטת כתב האישום \u003cb>לפני\u003c/b> הגשתו. הפרה → כתב אישום מקורי, אך בלי בקשת מאסר בפועל.\u003c/p>\n      \u003cbutton class=\"expand-link\" data-topic=\"conditional\">🔎 קריאה מורחבת\u003c/button>\n    ","lesson":"3","status":"תנאי הסף והעיון נבדקו; יתר ההרחבה עדיין בביקורת","lessons":["3"],"source":"שיעור 3.mp3 — הסבר המרצה על סגירת תיק בהסדר, תנאי הסף והעיון לפני חתימה"},{"id":"kanzi","tag":"12","title":"עדות שותפים — מקנזי לביטול הכלל","html":"\u003ch2>עדות שותף: קנזי והשינוי בהלכה\u003c/h2>\u003cp>\u003cb>הבחנה מכרעת:\u003c/b> הלכת קנזי היא נקודת המוצא ההיסטורית, לא סוף ההתפתחות. בבג״ץ 11339/05 בוטל הכלל החוסם ככלל העדת שותף שמשפטו הנפרד תלוי ועומד.\u003c/p>\u003cp>הכלל שנקבע: ניתן להעידו; דחיית העדות עד תום משפטו אפשרית במקרים חריגים ביותר, מטעמים שיירשמו. אין לערבב זאת עם נאשמים באותו כתב אישום וההסדר שבסעיף 155.\u003c/p>","lesson":"3","status":"תוקן מול פסק הדין","source":"מדינת ישראל נ׳ בית המשפט המחוזי באר שבע 11339-05.pdf — ההכרעה הסופית ודעת הנשיאה ביניש, פסקה 3","lessons":["3","7"]}]},{"group":"כתב האישום","items":[{"id":"structure","tag":"13","title":"מבנה כתב האישום — סעיף 85 (נלמד בשיעור 4)","html":"\n      \u003cdiv class=\"eyebrow\">חסד\"פ\u003c/div>\n      \u003ch2>מבנה כתב האישום — סעיף 85\u003c/h2>\n      \u003cul>\n        \u003cli>בית משפט מוסמך, מדינת ישראל כמאשימה, פרטי הנאשם\u003c/li>\n        \u003cli>פרק העובדות (עובדות בלבד, לא ראיות)\u003c/li>\n        \u003cli>הוראות החיקוק\u003c/li>\n        \u003cli>\u003cb>רשימת עדי תביעה — סגורה וקשיחה\u003c/b>, כולל שוטרים טכניים\u003c/li>\n      \u003c/ul>\n      \u003cbutton class=\"expand-link\" data-topic=\"structure\">🔎 קריאה מורחבת\u003c/button>\n    ","lesson":"4","status":"תוכן קיים — טרם הושלם אימות פרטני","lessons":["4"]},{"id":"amend","tag":"14","title":"תיקון כתב האישום — סעיף 92 (נלמד בשיעור 4)","html":"\n      \u003cdiv class=\"eyebrow\">קו פרשת המים\u003c/div>\n      \u003ch2>תיקון כתב האישום — סעיף 92\u003c/h2>\n      \u003cp>\u003cb>לפני הקראה\u003c/b> — תיקון חופשי. \u003cb>אחרי הקראה\u003c/b> — בקשה רשמית + הזדמנות סבירה להתגונן.\u003c/p>\n      \u003cbutton class=\"expand-link\" data-topic=\"amend\">🔎 קריאה מורחבת\u003c/button>\n    ","lesson":"4","status":"תוכן קיים — טרם הושלם אימות פרטני","lessons":["4"]},{"id":"joinder","tag":"15","title":"צירוף אישומים ונאשמים — 86-87 (נלמד בשיעור 4)","html":"\n      \u003cdiv class=\"eyebrow\">יעילות דיונית\u003c/div>\n      \u003ch2>צירוף אישומים ונאשמים — 86–87\u003c/h2>\n      \u003cp>צירוף לפי עובדות משותפות/דומות, או שותפות בעבירה.\u003c/p>\n      \u003cdiv class=\"callout case-callout\">\u003cspan class=\"callout-title\">קשור לפסק דין\u003c/span>\u003cbutton class=\"case-link\" data-case=\"10\">⚖ סוסן (1995) — סמכות נגררת\u003c/button>\u003c/div>\n      \u003cbutton class=\"expand-link\" data-topic=\"joinder\">🔎 קריאה מורחבת\u003c/button>\n    ","lesson":"4","status":"תוכן קיים — טרם הושלם אימות פרטני","lessons":["4"]},{"id":"withdraw","tag":"16","title":"חזרה מכתב אישום — סעיף 94 (נלמד בשיעור 4)","html":"\n      \u003cdiv class=\"eyebrow\">חסד\"פ\u003c/div>\n      \u003ch2>חזרה מכתב אישום — סעיף 94\u003c/h2>\n      \u003cp>\u003cb>לפני תשובה\u003c/b> — ביטול בלבד. \u003cb>אחרי תשובה\u003c/b> — זיכוי מוחלט (או ביטול בהסכמה, עם דרישת אישור היועמ\"ש להגשה מחדש).\u003c/p>\n      \u003cbutton class=\"expand-link\" data-topic=\"withdraw\">🔎 קריאה מורחבת\u003c/button>\n    ","lesson":"4","status":"תוכן קיים — טרם הושלם אימות פרטני","lessons":["4"]}]},{"group":"זכויות הנאשם וקדם-משפט","items":[{"id":"defendant","tag":"17","title":"מחשוד לנאשם (נלמד בשיעור 5)","html":"\n      \u003cdiv class=\"eyebrow\">מעמד\u003c/div>\n      \u003ch2>מחשוד לנאשם\u003c/h2>\n      \u003cp>עם הגשת כתב האישום למזכירות ביהמ\"ש — החשוד הופך מיידית ל\"נאשם\".\u003c/p>\n    ","lesson":"5","status":"תוכן קיים — טרם הושלם אימות פרטני","lessons":["5"]},{"id":"review","tag":"18","title":"זכות העיון — סעיף 74 (נלמד בשיעור 5)","html":"\n      \u003cdiv class=\"eyebrow\">זכויות הנאשם\u003c/div>\n      \u003ch2>זכות העיון בחומר חקירה — סעיף 74\u003c/h2>\n      \u003cp>קמה עם הגשת כתב האישום. חלה \u003cb>רק בפשע/עוון\u003c/b>, לא בחטא.\u003c/p>\n      \u003cp>כשמסרבים לחשוף: בקשה לביהמ\"ש → ערר יחיד לערכאה בכירה → 3 אפשרויות (לחשוף / לא להשתמש כראיה / לחזור מהאישום).\u003c/p>\n      \u003cdiv class=\"callout case-callout\">\u003cspan class=\"callout-title\">קשור לפסק דין\u003c/span>\u003cbutton class=\"case-link\" data-case=\"5\">⚖ שמואל (2008)\u003c/button>\u003c/div>\n      \u003cbutton class=\"expand-link\" data-topic=\"review\">🔎 קריאה מורחבת\u003c/button>\n    \u003ch3>פומביות הדיון ואיסור פרסום חומרי חקירה\u003c/h3>\u003cp>פומביות הדיון וחופש הביטוי אינם מוחלטים. בבקשה לפרסם חומרי חקירה או תיעוד מהליך פלילי יש לאזן בין עניין הציבור ופומביות ההליך לבין פרטיות, שם טוב, הגינות ההליך והחשש להשפעה על עדים או לזיהום המשפט. ככל שהחקירה או המשפט פעילים והפרסום עלול לפגוע ממשית בהליך, ניתן למנוע או לעכב את הפרסום מכוח סעיף 70 לחוק בתי המשפט וההסדרים שנלמדו. התרומה של עניין תורג׳מן ורשות השידור היא יישום אותו איזון על פרסום תקשורתי של חומרי חקירה, ולא יצירת כלל נפרד לכל אחד מהם.\u003c/p>","lesson":"5","status":"הורחב מול ניתוחי פסקי דין מקבוצה C","lessons":["5"],"source":"מדינת ישראל נ' המשיבים רון תורג'מן.pdf — ניתוח קבוצה C; רשות השידור נ' מדינת ישראל.pdf — ניתוח קבוצה C"},{"id":"reading","tag":"19","title":"הקראת כתב האישום והסכמות (נלמד בשיעור 5)","html":"\u003cdiv class=\"eyebrow\">מצגת 2 · סעיפים 74–84\u003c/div>\u003ch2>עיון בחומר החקירה\u003c/h2>\u003cp>לאחר כתב אישום בעוון או בפשע זכאים הנאשם וסנגורו לעיין ולהעתיק את חומר החקירה. הרשימה הנלווית כוללת גם ציון קיומם של חומר שאינו חומר חקירה, חומר חסוי וחומר מודיעיני, עם סוג, נושא ומועד — בכפוף לחיסיון.\u003c/p>\u003cp>הסייגים שנלמדו: ראיות הזמה, עניינים פורמליים שאינם מהותיים, חומר חסוי, והסדרים מיוחדים בבגידה או ריגול. אם לא ניתנה הזדמנות סבירה לעיין, סעיף 77(א) מונע מן התובע להגיש את הראיה או להשמיע את העד, אלא אם ויתרו על כך.\u003c/p>\u003cp>בקשת עיון נדונה ככלל בפני שופט אחד; ערר בזכות יוגש בתוך 30 ימים. לפי פרידן, יש מסלול ערר אחד בלבד.\u003c/p>\u003ch3>אמרת חוץ של עד — סעיף 10א לפקודת הראיות\u003c/h3>\u003cp>קבלת אמרת חוץ של עד אינה תחליף אוטומטי לעדות בבית המשפט. לפי המסגרת שנלמדה, נדרשים תנאים מצטברים: האמרה הוכחה במשפט; מוסר האמרה הוא עד במשפט וניתנה לצדדים הזדמנות לחקרו; והעדות בבית המשפט שונה בפרט מהותי מן האמרה, או שהעד מכחיש את תוכנה או טוען שאינו זוכר. לצד קבילות האמרה יש לבחון את משקלה ואת הראיות המחזקות.\u003c/p>\u003cp>תחבולת חקירה אינה נפסלת כשלעצמה. הגבול הוא פגיעה באוטונומיית הרצון החופשי או פגיעה חמורה בהגינות ההליך; אין לשכפל מכאן את מבחני החיפוש או את דוקטרינת יששכרוב.\u003c/p>\u003cdiv class=\"callout\">\u003cb>השלמת Audit חקיקה:\u003c/b> ויתור על הקראה מחייב את ארבעת התנאים המצטברים המפורטים בשאלה המתוקנת; אין להציג את הכלל כשלושה תנאים בלבד.\u003c/div>","lesson":"5","status":"הורחב מול ניתוח פסק דין מקבוצה C","lessons":["5"],"source":"אלעוקה נ' מדינת ישראל.pdf — ניתוח קבוצה C"}]},{"group":"טענות מקדמיות וסמכות בתי המשפט","items":[{"id":"trial-open6","tag":"20","title":"תזכורת: פתיחת המשפט וזכויות הנאשם (נלמד בשיעור 6)","html":"\u003cdiv class=\"eyebrow\">מצגת 3 · סעיפים 143–145\u003c/div>\u003ch2>פתיחת המשפט: הקראה והסכמות\u003c/h2>\u003cp>הכלל הוא שהמשפט נפתח בהקראת כתב האישום. הוויתור אפשרי רק בארבעה תנאים מצטברים: הנאשם מיוצג; הסנגור הודיע שקרא לנאשם את כתב האישום; הנאשם אישר זאת; והדברים נרשמו בפרוטוקול.\u003c/p>\u003cp>לאחר תחילת המשפט, כאשר הנאשם מיוצג, בית המשפט רשאי לברר הסכמות לעובדות ולקבילות מסמכים ומוצגים, לרבות הגשתם שלא באמצעות עדים (סעיף 144). לפי סעיף 145, בית המשפט יסביר לנאשם את זכויות ההגנה אם ראה צורך בכך.\u003c/p>","lesson":"6","status":"הורחב ואומת מול מצגת 3","lessons":["6"],"source":"דיון פלילי - מצגת שלישית - 234907.PDF, שקפים 1–35"},{"id":"prelim-claims","tag":"21","title":"טענות מקדמיות — סעיף 149 (נלמד בשיעור 6)","html":"\u003cdiv class=\"eyebrow\">מצגת 3 · סעיפים 149–151\u003c/div>\u003ch2>טענות מקדמיות\u003c/h2>\u003cp>הרשימה שבסעיף 149 אינה סגורה. הטענה מועלית בתחילת המשפט, אך ככלל אפשר להעלותה גם בהמשך ואף בערעור. החריג: חוסר סמכות מקומית ופגם או פסול בכתב האישום בשלב מאוחר דורשים רשות בית המשפט.\u003c/p>\u003cp>פגם הוא השמטת פרט ענייני מכתב האישום; פסול הוא אי־עמידה בדרישת כשרות דיונית, כגון כתב אישום שלא הוגש בידי תובע מוסמך. בקבלת טענה בית המשפט יכול לתקן, לבטל או להעביר לבית משפט מוסמך — לא לזכות.\u003c/p>\u003ch3>טענות נוספות\u003c/h3>\u003cp>משפט פלילי אחר התלוי ועומד באותו עניין מוביל לביטול כתב האישום. חסינות וחנינה חוסמות העמדה לדין לפי התנאים שנלמדו; הגנה מן הצדק לפי בורוביץ, נוה ורותם מאפשרת ביטול כאשר ההליך עומד בסתירה מהותית לצדק ולהגינות.\u003c/p>","lesson":"6","status":"הורחב ואומת מול מצגת 3","lessons":["6"],"source":"דיון פלילי - מצגת שלישית - 234907.PDF, שקפים 36–70"},{"id":"court-jurisdiction","tag":"22","title":"סמכות מקומית ועניינית של בתי המשפט (נלמד בשיעור 6)","html":"\u003cdiv class=\"eyebrow\">מצגת 3 · סעיפים 6–8\u003c/div>\u003ch2>סמכות מקומית\u003c/h2>\u003cp>הסמכות מתקיימת במקום ביצוע העבירה או מקום מגורי הנאשם. אם שניהם אינם ידועים — במקום תפיסתו; בעבירת חוץ, כשמקום מגוריו אינו בישראל או אינו ידוע — במקום היחידה החוקרת. בצירוף אישומים או נאשמים מוסמך כל בית משפט שיש לו שיפוט באחת העבירות או על אחד הנאשמים.\u003c/p>\u003cp>כאשר היועץ המשפטי לממשלה קובע שאין בית משפט מוסמך לפי הכללים הרגילים, הסמכות בירושלים. העברה מחמת חוסר סמכות אפשרית לפי סעיף 79 לחוק בתי המשפט; בית המשפט המקבל רשאי להמשיך מן השלב שאליו הגיע קודמו ואינו מעביר שוב.\u003c/p>","lesson":"6","status":"הורחב ואומת מול מצגת 3","lessons":["6"],"source":"דיון פלילי - מצגת שלישית - 234907.PDF, שקפים 1–35"},{"id":"double-jeopardy-justice","tag":"23","title":"סיכון כפול, חסינות, חנינה והגנה מן הצדק (נלמד בשיעור 6)","html":"\n      \u003cdiv class=\"eyebrow\">טענות מקדמיות 4–7\u003c/div>\n      \u003ch2>סיכון כפול, חסינות, חנינה והגנה מן הצדק\u003c/h2>\n      \u003cp>זיכוי/הרשעה קודמים (5), סיכון כפול (נדיר, אף פעם לא התקבל בפועל), חסינויות וחנינה, הגנה מן הצדק.\u003c/p>\n      \u003cdiv class=\"callout case-callout\">\u003cspan class=\"callout-title\">קשור לפסקי דין\u003c/span>\u003cbutton class=\"case-link\" data-case=\"13\">⚖ קרישניסקי\u003c/button> \u003cbutton class=\"case-link\" data-case=\"12\">⚖ הגנה מן הצדק\u003c/button>\u003c/div>\n      \u003cbutton class=\"expand-link\" data-topic=\"double-jeopardy-justice\">🔎 קריאה מורחבת\u003c/button>\n    \u003cdiv class=\"callout\">\u003cspan class=\"callout-title\">חריג לסיכון כפול\u003c/span>\u003cp>כאשר המעשה גרם למות אדם לאחר הדיון הראשון, ניתן להעמיד לדין פעם נוספת בשל אותו מעשה אם בדיון הראשון נמצא הנאשם אשם, לרבות העמדה למבחן ללא הרשעה.\u003c/p>\u003c/div>\u003ch3>הבחנות נוספות\u003c/h3>\u003cp>\"סיכון כפול\" שונה מטענת \"כבר נשפטתי\" לפי סעיף 5: הראשונה עוסקת בחשיפה חוזרת לסיכון הרשעה כאשר ההליך הקודם לא הסתיים בפסק דין; השנייה מבוססת על מעשה בית דין. הטענה נדירה ואינה חלה כשההליך הקודם בטל מעיקרו, למשל מחוסר סמכות מלכתחילה.\u003c/p>","lesson":"6","status":"הורחב ואומת מול מצגת 3","lessons":["6"],"source":"דיון פלילי - מצגת שלישית - 234907.PDF, שקפים 36–70"},{"id":"limitations-pointer","tag":"24","title":"⏳ התיישנות — עיקרי שיעור 7 ולשונית ייעודית","html":"\u003cdiv class=\"eyebrow\">טענה מקדמית — סעיף 149(6)\u003c/div>\u003ch2>התיישנות: תזכורת ממוקדת\u003c/h2>\u003cp>בשיעור 7 חזר המרצה על התיישנות העבירה: חטא — שנה; עוון — חמש שנים; ופשע רגיל — עשר שנים. בפשע חמור נדרשים \u003cb>שני תנאים מצטברים\u003c/b>: עונש של יותר משבע שנות מאסר והופעה בתוספת; התקופה היא 15 שנים. עבירות שעונשן מיתה או מאסר עולם מתיישנות לאחר 30 שנים, ולרשימת העבירות המצומצמת שהמרצה מנה אין התיישנות.\u003c/p>\u003cp>פעולת חקירה, כתב אישום והליך מטעם בית המשפט הם אירועים מנתקים. מנגנון \"התקופה הנוספת\" נוגע, לפי ההסבר בשיעור, לאירוע מנתק מסוג פעולת חקירה בלבד. המרצה הורה \u003cb>לא ללמוד למבחן\u003c/b> את טבלת ההארכות ואת נושא התיישנות עבירות המין בקטינים, אף שהם מופיעים במצגת.\u003c/p>\u003cp>בהתיישנות עונש: הדיון הוא בעונש שלא התחיל להתבצע או שביצועו הופסק שלא באשמת הנידון. בפשע, עוון וחטא ציין המרצה תקופות של 20, 10 ו־3 שנים בהתאמה; זמן התחמקות או שהייה בחו״ל אינו בא במניין בפשע ובעוון.\u003c/p>\u003cbutton class=\"case-link\" id=\"open-limitations-btn\">⏳ עבור/י ללשונית ההתיישנות\u003c/button>\u003ch3>פרטים שנוספו במצגת\u003c/h3>\u003cp>המצגת מפרטת אירועים ותקופות שאינם מובאים במניין ההתיישנות, לרבות אי־יכולת לאתר חשוד או עד מרכזי, התחמקות, מצב רפואי/נפשי, עזרה משפטית ממדינה אחרת, הליכים שנוקט החשוד, חסינות והתקופה שבה מתקיים הסדר סגירת תיק. בהליכי חקירה, \"התקופה הנוספת\" והארכותיה תלויות בסיווג העבירה ובגורם המאשר; אין להחילן על חטא.\u003c/p>","lesson":"7","status":"הורחב ואומת מול מצגת 3","lessons":["7"],"source":"דיון פלילי - מצגת שלישית - 234907.PDF, שקפים 36–70"}]},{"group":"ניהול המשפט","items":[{"id":"defendant-response","tag":"25","title":"תשובת הנאשם, הודאה וחזרה ממנה (נלמד בשיעור 6)","html":"\n      \u003cdiv class=\"eyebrow\">סעיפים 152–154\u003c/div>\n      \u003ch2>תשובת הנאשם, הודאה וחזרה ממנה\u003c/h2>\n      \u003cp>שתיקה עשויה לשמש חיזוק. טענת אליבי — מייד. חזרה מהודאה ברשות ביהמ\"ש, מנימוקים מיוחדים.\u003c/p>\n      \u003cbutton class=\"expand-link\" data-topic=\"defendant-response\">🔎 קריאה מורחבת\u003c/button>\n    \u003ch3>סעיף 152\u003c/h3>\u003cp>הנאשם רשאי שלא להשיב, להודות, לכפור או להוסיף עובדות. בית המשפט רשאי לשאול שאלות הבהרה שאינן חורגות מהדרוש. הימנעות מתשובה עשויה לשמש חיזוק, ובית המשפט חייב להסביר זאת. טענת אליבי יש להעלות מיד; איחור מגביל הבאת ראיות אלא ברשות בית המשפט, בלי לגרוע מזכות לחזור מהודאה בנוכחות בזירת העבירה.\u003c/p>","lesson":"6","status":"הורחב ואומת מול מצגת 3","lessons":["6"],"source":"דיון פלילי - מצגת שלישית - 234907.PDF, שקפים 36–70"},{"id":"multi-defendants","tag":"26","title":"נאשמים בכתב אישום אחד — סעיף 155","html":"\u003cdiv class=\"eyebrow\">שיעור 7 · סעיף 155\u003c/div>\u003ch2>נאשמים בכתב אישום אחד\u003c/h2>\u003cp>כאשר כמה נאשמים הועמדו לדין \u003cb>באותו כתב אישום\u003c/b> וחלקם הודו בעובדות שיש בהן כדי הרשעה, לא ייגזר דינם של מי שהודו לפני שהסתיים בירור משפטם של מי שלא הודו.\u003c/p>\u003cp>הנימוק שהדגיש המרצה: רק לאחר בירור התמונה המלאה אפשר להעריך את חלקו של כל נאשם בעבירה ואת הענישה המתאימה. אין להשליך מכאן אוטומטית על כתבי אישום נפרדים; אלה מסלולים שונים.\u003c/p>","lesson":"7","status":"אומת מול הקלטת שיעור 7","lessons":["7"],"source":"שיעור 7 ערוך.mp3 — דברי המרצה"},{"id":"trial-conduct","tag":"27","title":"ניהול המשפט: תביעה, הגנה והזמה","html":"\u003cdiv class=\"eyebrow\">שיעור 7 · סעיפים 156–165\u003c/div>\u003ch2>ניהול המשפט — שלד העבודה\u003c/h2>\u003cp>המרצה עבר על פרשת התביעה, טענת \"אין להשיב לאשמה\" בסיומה, פרשת ההגנה וראיות ההזמה. סעיף 77א הוזכר בהקשר של מניעת הגשת ראיה שלא ניתנה לנאשם הזדמנות לעיין בה.\u003c/p>\u003cp>אם הנאשם בוחר להעיד בפרשת ההגנה, עדותו נשמעת תחילה. הימנעות מהעיד עשויה לשמש חיזוק לראיות התביעה. ראיות הזמה טעונות רשות ונועדו לסתור טענה שעלתה בהגנה ושלא הייתה צפויה לתביעה מראש; לאחר שהובאו, רשאי הנאשם להביא ראיות לסתור אותן.\u003c/p>\u003ch3>הערכת מהימנות וחובת הגינות התביעה\u003c/h3>\u003cp>הערכת מהימנות היא מלאכת בית המשפט: יש לבחון את עדות העד במכלול, את עקביותה, את הסתירות ואת התמיכה החיצונית, בלי להפוך כלל כללי על מהימנות לתחליף להנמקה. לצד זאת, על התביעה לנהל את ההליך בהגינות ולגלות חומר רלוונטי; מחדל דיוני אינו מוביל אוטומטית לתוצאה אחת, אלא נבחן לפי השפעתו על ההגנה ועל הוגנות ההליך.\u003c/p>\u003cdiv class=\"callout\">\u003cb>השלמת Audit חקיקה:\u003c/b> בהערכת מהימנות ובחובת ההגינות יש לבחון את העדות במכלול ואת השפעת המחדל על ההגנה; אין תוצאה אוטומטית ללא בחינת הפגיעה.\u003c/div>","lesson":"7","status":"הורחב מול ניתוח פסק דין מקבוצה C","lessons":["7"],"source":"חאתם פאיז אלמע'ארי נ' התביעה הצבאית.pdf — ניתוח קבוצה C"}]},{"group":"פסק דין, ענישה וערעור","items":[{"id":"summations","title":"סיכומים בכתב ובעל־פה (שיעור 8)","lesson":"8","lessons":["8"],"status":"נוסף מתוך ההקלטה ופסקי הדין שנבדקו","source":"שיעור8 ערוך.mp3 — לאחר ראיות מטעם בית המשפט; זכריא נ׳ מדינת ישראל.pdf — רע״פ 11160/03, פסקאות 2–4 והערת השופטת פרוקצ׳יה; פלוני נ׳ מדינת ישראל 5333-11.pdf — רע״פ 5333/11, פסקאות א–ט","html":"\u003ch2>סיכומים: מי מדבר אחרון ובאיזו מתכונת?\u003c/h2>\u003cp>\u003cb>תקציר:\u003c/b> בתום הראיות הצדדים מסכמים את התמונה ומסבירים איזו מסקנה יש להסיק. לפי הסבר המרצה על סעיף 169, התובע מסכם תחילה ואחריו הנאשם. יש להבחין בין סדר הטיעון, מתכונתו והסעד כשנטען לפגם.\u003c/p>"},{"id":"verdict-sentence","tag":"28","title":"הכרעת הדין וגזר הדין — שיעורים 7–8","html":"\u003cdiv class=\"eyebrow\">שיעור 8\u003c/div>\u003ch2>מן הראיות אל פסק הדין\u003c/h2>\u003cp>לאחר פרשת ההגנה רשאי בית המשפט, אך אינו חייב, להביא ראיות מטעמו. גם לאחר הכרעת הדין הדבר אפשרי רק בנסיבות חריגות מאוד, כשהתגלתה ראיה חדשה שלא הייתה בהישג יד ונדרש הדבר לעשיית צדק ולמניעת עיוות דין.\u003c/p>\u003cp>בתום הראיות באים הסיכומים: התובע מסכם ראשון והנאשם אחריו; לנאשם שמורה זכות המילה האחרונה. פסק הדין הפלילי בנוי מהכרעת דין ומגזר דין.\u003c/p>\u003ch3>השלמות משקפים 71–105\u003c/h3>\u003cp>הודאה בעובדה נחשבת כמוכחת, אלא אם בית המשפט אינו מקבלה או התיר חזרה ממנה בנימוקים מיוחדים. לאחר הכרעת הדין, ביטול ההכרעה נדרש רק אם היא מבוססת על ההודאה. לפי סעיף 155, בכתב אישום משותף ניתן לגזור לפני סיום משפט האחרים רק בנסיבות מיוחדות שיירשמו או כאשר המודה נקרא להעיד ולאחר שנגזר דינו.\u003c/p>\u003cp>פרשת התביעה לפי סעיפים 156–157 קודמת לטענת אין להשיב לאשמה; פרשת ההגנה לפי 159–164. נאשמים מביאים פתיחה וראיות לפי סדר רישומם, אלא אם בית המשפט הורה אחרת. התביעה אינה חוקרת על הרשעות קודמות אלא בחריגי אופי טוב. ראיות הזמה דורשות רשות; ראיות ההגנה לסתירתן אינן דורשות רשות.\u003c/p>\u003cp>סעיף 181א קובע הכרעת דין בתוך 30 ימים מהסיכומים, עם אפשרות הארכה מטעמים מיוחדים. זיכוי הוא פסק הדין; מועד הערעור מתחיל ממתן הנימוקים. ניתן לבטל הרשעה לפני גזר דין לפי סעיף 192א, להרשיע בכמה עבירות בלי להעניש יותר מפעם אחת על אותו מעשה, ולצרף תיקים לפי סעיף 39. סעיף 185 מסדיר העברה בין שלום למחוזי בעבירה שאינה בסמכות הערכאה.\u003c/p>","lesson":"8","status":"הורחב ואומת מול מצגת 3","lessons":["8"],"source":"דיון פלילי - מצגת שלישית - 234907.PDF, שקפים 36–70"},{"id":"sentencing","tag":"29","title":"קביעת העונש (נלמד בשיעור 8)","html":"\n      \u003cdiv class=\"eyebrow\">40ב–40טו לחוק העונשין\u003c/div>\n      \u003ch2>קביעת העונש\u003c/h2>\n      \u003cp>3 שלבים: מתחם עונש הולם → חריגה (קולא/חומרא) → עונש סופי בתוך המתחם.\u003c/p>\n      \u003cdiv class=\"callout case-callout\">\u003cspan class=\"callout-title\">קשור לפסק דין\u003c/span>\u003cbutton class=\"case-link\" data-case=\"18\">⚖ תיקי מב\"ד\u003c/button>\u003c/div>\n      \u003cbutton class=\"expand-link\" data-topic=\"sentencing\">🔎 קריאה מורחבת\u003c/button>\n    \u003ch3>השלמות משקפים 106–136\u003c/h3>\u003cp>בשלב הטיעונים לעונש התביעה מביאה הרשעות קודמות והחלטות על ביצוע עבירות, והנאשם רשאי להביא ראיות להקלה שאינן סותרות את גרסתו בשלב האשמה. תיקים הממתינים לבירור דין אינם ראיה בשלב בירור האשמה, אך שירות המבחן רשאי להתייחס אליהם בתסקיר. הענישה נעשית בשלושה שלבים: מתחם הולם, חריגה לשיקום או להגנת שלום הציבור בתנאים שנלמדו, וקביעת העונש בתוך המתחם; נסיבה מחמירה טעונה הוכחה מעבר לספק סביר ומקלה ברמת הוכחה אזרחית.\u003c/p>","lesson":"8","status":"הורחב ואומת מול מצגת 3","source":"דיון פלילי - מצגת שלישית - 234907.PDF, שקפים 106–136","lessons":["8"]},{"id":"appeals","tag":"30","title":"ערעור: זכות, מסלולים ומועדים (נלמד בשיעור 8)","html":"\n      \u003cdiv class=\"eyebrow\">סעיפים 199–217\u003c/div>\n      \u003ch2>ערעור: זכות, מסלולים ומועדים\u003c/h2>\n      \u003cp>לא ניתן לערער על החלטות ביניים (מלבד חריגים). מועדים: 45 יום (בזכות), 45+30 (ברשות).\u003c/p>\n      \u003cdiv class=\"callout case-callout\">\u003cspan class=\"callout-title\">קשור לפסקי דין\u003c/span>\u003cbutton class=\"case-link\" data-case=\"11\">⚖ פלדמן\u003c/button> \u003cbutton class=\"case-link\" data-case=\"20\">⚖ צ'ירנסקי\u003c/button> \u003cbutton class=\"case-link\" data-case=\"22\">⚖ חילף\u003c/button>\u003c/div>\n      \u003cbutton class=\"expand-link\" data-topic=\"appeals\">🔎 קריאה מורחבת\u003c/button>\n    \u003ch3>השלמות משקפים 106–136\u003c/h3>\u003cp>הכלל הוא שאין ערעור על החלטות ביניים אלא בהוראה מפורשת; חריגים שנלמדו כוללים פסלות, פומביות, עיון בחומר, עיכוב ביצוע וערעור עצמאי של סנגור על אי־שחרורו מייצוג. בקשת רשות לערעור שני דורשת שאלה משפטית בעלת חשיבות ציבורית או מקרה חריג בחומרת העונש. ערעור בזכות מוגש בתוך 45 ימים; בקשת רשות בתוך 45 ימים והערעור בתוך 30 ימים ממועד הרשות. חזרה מערעור לאחר סיום הטענות טעונה רשות. בערעור אין להחמיר בעונש ללא ערעור מדינה.\u003c/p>","lesson":"8","status":"הורחב ואומת מול מצגת 3","source":"דיון פלילי - מצגת שלישית - 234907.PDF, שקפים 106–136","lessons":["8"]}]},{"group":"דיני מעצרים","items":[{"id":"arrest-basics","tag":"31","title":"יסודות דיני מעצרים: עיכוב, מעצר, עצור מול אסיר (הרחבה מהמצגות — לא שיעור 8)","html":"\n      \u003cdiv class=\"eyebrow\">חוק המעצרים · חוק יסוד כבוד האדם וחירותו\u003c/div>\n      \u003ch2>יסודות דיני המעצרים\u003c/h2>\n      \u003cp>\u003cb>אסיר\u003c/b> — הורשע ונגזר עליו מאסר בפועל, מוחזק לריצוי עונשו. \u003cb>עצור\u003c/b> — מוחזק לפני/בזמן ההליך, נהנה מחזקת החפות.\u003c/p>\n      \u003cp>\u003cb>עיכוב\u003c/b> — הגבלת חירות קלה ומתוחמת (בירור/חקירה במקום). \u003cb>מעצר\u003c/b> — שלילת חירות מלאה.\u003c/p>\n      \u003cp>כללי הברזל: במסלול סעיף 23(א) נדרשת עבירה שאינה חטא; סעיף 23(ב) הוא מסלול נפרד הנוגע לעיכוב חוקי; אין לעצור אם ניתן להסתפק בעיכוב; אין לעצור אם ניתן להשיג את התכלית בחלופת מעצר.\u003c/p>\n      \u003cdiv class=\"callout case-callout\">\u003cspan class=\"callout-title\">קשור לפסק דין\u003c/span>\u003cbutton class=\"case-link\" data-case=\"26\">⚖ קסאי — זכות התנגדות למעצר בלתי חוקי\u003c/button>\u003c/div>\n      \u003cbutton class=\"expand-link\" data-topic=\"arrest-basics\">🔎 קריאה מורחבת\u003c/button>\n    \u003ch3>חיפוש במכשיר נייד ובחומר מחשב — סעיף 23א לפקודת החיפוש\u003c/h3>\u003cp>חיפוש בטלפון או בחומר מחשב הוא חיפוש בעל מאפיינים ייחודיים, ולכן יש לבחון את מקור הסמכות ואת היקף הצו באופן קונקרטי. עצם העובדה שהמכשיר נתפס אינה מתירה עיון גורף בתוכנו. כאשר נטען שחיפוש בלתי חוקי קדם לבקשת הצו, יש להפריד בין חוקיות האיסוף המוקדם לבין תוקף הצו והראיות שנאספו מכוחו, ולבחון את התוצאה לפי ההגנות והאיזונים שנלמדו בבן חיים וביששכרוב.\u003c/p>\u003cdiv class=\"callout\">\u003cb>השלמת Audit חקיקה:\u003c/b> בחיפוש בטלפון יש להבחין בין תפיסת המכשיר לבין עיון בתוכנו: נבחנים מקור הסמכות והיקף הצו, וחיפוש מוקדם פגום נבחן בנפרד לפי הזיקה והחומרה שנלמדו.\u003c/div>","lesson":"extra","status":"הורחב מול ניתוח פסק דין מקבוצה C","lessons":["extra"],"source":"יונתן אוריך נ' מדינת ישראל.pdf — ניתוח קבוצה C"},{"id":"arrest-nowarrant","tag":"32","title":"מעצר שוטר ללא צו וזכויות העצור בתחנה (הרחבה מהמצגות — לא שיעור 8)","html":"\n      \u003cdiv class=\"eyebrow\">סעיפים 23, 26–36 לחוק המעצרים\u003c/div>\n      \u003ch2>מעצר שוטר ללא צו וזכויות העצור\u003c/h2>\n      \u003cp>במסלול סעיף 23(א): חשד לעוון/פשע ועילת מעצר סטטוטורית. סעיף 23(ב), הנוגע לאי־ציות לעיכוב חוקי, הוא מסלול נפרד.\u003c/p>\n      \u003cp>זכויות: אזהרה, הסבר זכויות, מפגש עו\"ד ללא דיחוי (עם חריגי דחייה), הודעה לקרוב.\u003c/p>\n      \u003cdiv class=\"callout case-callout\">\u003cspan class=\"callout-title\">קשור לפסקי דין\u003c/span>\u003cbutton class=\"case-link\" data-case=\"27\">⚖ כהן — \"זה מקרוב\"\u003c/button> \u003cbutton class=\"case-link\" data-case=\"28\">⚖ אסף שי — זכות עו\"ד\u003c/button>\u003c/div>\n      \u003cbutton class=\"expand-link\" data-topic=\"arrest-nowarrant\">🔎 קריאה מורחבת\u003c/button>\n    \u003cdiv class=\"callout\">\u003cb>השלמת Audit חקיקה:\u003c/b> במסלול סעיף 23(א) נבחנים חשד סביר ועילת מעצר; סעיף 23(ב) הוא מסלול נפרד להבאה לתחנה לצורך העיכוב, ואין לייבא אליו אוטומטית את תנאי 23(א).\u003c/div>","lesson":"extra","status":"הרחבה — לא מהקלטת שיעור 8","lessons":["extra"]},{"id":"arrest-bridge","tag":"33","title":"הצהרת תובע ומעצר גישור (הרחבה מהמצגות — לא שיעור 8)","html":"\n      \u003cdiv class=\"eyebrow\">סעיף 17(ד) לחוק המעצרים\u003c/div>\n      \u003ch2>הצהרת תובע ומעצר גישור\u003c/h2>\n      \u003cp>עד 5 ימים לגישור עד הגשת כתא\"ש, בכפוף לתקרת 75 הימים הרגילה.\u003c/p>\n      \u003cdiv class=\"callout case-callout\">\u003cspan class=\"callout-title\">קשור לפסק דין\u003c/span>\u003cbutton class=\"case-link\" data-case=\"29\">⚖ אלטויל — תכלית מצומצמת\u003c/button>\u003c/div>\n      \u003cbutton class=\"expand-link\" data-topic=\"arrest-bridge\">🔎 קריאה מורחבת\u003c/button>\n    \u003cdiv class=\"callout\">\u003cb>השלמת Audit חקיקה:\u003c/b> מעצר גישור לפי סעיף 17(ד) נועד רק לזמן הטכני להכנת כתב אישום ובקשת מעצר עד תום ההליכים; הוא אינו מסלול להמשך פעולות חקירה.\u003c/div>","lesson":"extra","status":"הרחבה — לא מהקלטת שיעור 8","lessons":["extra"]},{"id":"arrest-pending","tag":"34","title":"מעצר עד תום ההליכים (הרחבה מהמצגות — לא שיעור 8)","html":"\n      \u003cdiv class=\"eyebrow\">סעיף 21 לחוק המעצרים\u003c/div>\n      \u003ch2>מעצר עד תום ההליכים\u003c/h2>\n      \u003cp>4 תנאים מצטברים: עילת מעצר + ראיות לכאורה + היעדר חלופה + ייצוג.\u003c/p>\n      \u003cdiv class=\"callout case-callout\">\u003cspan class=\"callout-title\">קשור לפסקי דין\u003c/span>\u003cbutton class=\"case-link\" data-case=\"30\">⚖ זאדה — ראיות לכאורה\u003c/button> \u003cbutton class=\"case-link\" data-case=\"31\">⚖ גנימאת — אין עילה מחומרה בלבד\u003c/button>\u003c/div>\n      \u003cbutton class=\"expand-link\" data-topic=\"arrest-pending\">🔎 קריאה מורחבת\u003c/button>\n    ","lesson":"extra","status":"הרחבה — לא מהקלטת שיעור 8","lessons":["extra"]},{"id":"arrest-release","tag":"35","title":"שחרור אוטומטי, מעצר לאחר הרשעה וערר (הרחבה מהמצגות — לא שיעור 8)","html":"\n      \u003cdiv class=\"eyebrow\">סעיפים 52–53, 60–62 לחוק המעצרים\u003c/div>\n      \u003ch2>שחרור אוטומטי ומעצר לאחר הרשעה\u003c/h2>\n      \u003cp>30 יום ללא תחילת משפט, 9 חודשים ללא הכרעת דין — שחרור, בכפוף להארכות עליון.\u003c/p>\n      \u003cdiv class=\"callout case-callout\">\u003cspan class=\"callout-title\">קשור לפסק דין\u003c/span>\u003cbutton class=\"case-link\" data-case=\"32\">⚖ איבדיוב — מניין 9 החודשים\u003c/button>\u003c/div>\n      \u003cbutton class=\"expand-link\" data-topic=\"arrest-release\">🔎 קריאה מורחבת\u003c/button>\n    \u003cdiv class=\"callout\">\u003cb>השלמת Audit חקיקה:\u003c/b> סעיף 61 עוסק במעצר עד הכרעת הדין. לאחר הכרעת דין מרשיעה יש להבחין בין מגבלת המעצר שלפני ההכרעה לבין הסמכות הדיונית להמשך מעצר עד גזר הדין.\u003c/div>","lesson":"extra","status":"הרחבה — לא מהקלטת שיעור 8","lessons":["extra"]}]}];
const CASES = [{"name":"פרדריק וילאם סילוסטר נגד היועץ המשפטי לממשלה","cite":"ע\"פ 1/48 (1948) — התיק הפלילי הראשון בעליון","facts":"אזרח בריטי הואשם בעבירות ריגול חמורות בזמן מלחמת העצמאות. המחוזי הרשיע וגזר 7 שנות מאסר. בערעור התמקד הסנגור בפגמים טכניים בניסוח כתב האישום.","claimant":"פגמים פרוצדורליים בכתב האישום יורדים לשורש העניין ומחייבים ביטול ההרשעה וההליך כולו.","respondent":"מדובר בפגמים צורניים קלים בלבד, שלא פגעו ביכולת הנאשם להתגונן.","question":"האם פגם דיוני או פורמלי מביא בהכרח לבטלות המשפט, גם כשהוכחו העובדות ולא נגרם עיוות דין?","ruling":"העליון זיכה מחמת הספק המהותי, אך קבע כי כללי הדיון נועדו להגן מפני עיוות דין, ואסור להפוך אותם למטרה בפני עצמה.","halacha":"הפרוצדורה הפלילית אינה משחק שחמט (\"אשקוקי\") שבו מהלך שגוי אחד קובע את גורל המשחק. פגם דיוני שלא גרם לעיוות דין ולא מנע הגנה הוגנת — לא יביא לפסילת ההליך (עוגן בהמשך בסעיף 215 לחסד\"פ).\u003cp>\u003cb>השלמת A2: יש להבחין בין עצם קיומו של פגם דיוני לבין תוצאה של עיוות דין. אין להסיק ביטול אוטומטי מפגם שלא פגע בהגנה; הסעד תלוי בהשפעה הממשית ובהגינות ההליך.\u003c/b>\u003c/p>","status":"הושלם A2 על בסיס חומרי הקורס","currency":"לא אומת עדכון מעבר למקורות הקורס"},{"name":"יצחק קניר נגד מדינת ישראל","cite":"ע\"פ 951/80 (1980) — מפי השופט אהרן ברק","facts":"לאחר שהצדדים סיימו להביא ראיות והמשפט הגיע לסיכומים, ביקשה התביעה להגיש ראיה נוספת. בית המשפט התיר זאת.","claimant":"סעיף 167 מתיר הבאת ראיות ביוזמת בית המשפט רק בין תום הראיות לתחילת הסיכומים — לא בשלב הסיכומים עצמו.","respondent":"חשיפת האמת ומניעת עיוות דין גוברות על סדר הבאת הראיות הפורמלי.","question":"האם לבית המשפט סמכות להתיר ראיות חדשות בשלבים מאוחרים, כגון הסיכומים?","ruling":"הערעור נדחה — המשפט הפלילי אינו תחרות ספורטיבית שבה הכללים קדושים יותר מחקר האמת.","halacha":"לבית המשפט סמכות טבועה ושיקול דעת רחב לסטות מסדר הראיות הרגיל ולהתיר ראיות גם בשלבים מאוחרים ביותר — ואף בערעור — ובלבד שנועד למניעת עיוות דין ותוך מתן הזדמנות הוגנת לנאשם להתמודד עם הראיה.","status":"לא הושלם אימות פרטני","currency":"לא אומת עדכון מעבר למקורות הקורס"},{"name":"אברהם בן חיים נגד מדינת ישראל","cite":"רע״פ 10141/09, בצירוף רע״פ 617/10 ורע״פ 5758/10 (6.3.2012)","facts":"שוטרים פנו לבן חיים ברחוב. לאחר בירור נמצא שאינו דרוש אך יש לו רישום פלילי. שוטר ביקש שירוקן את כיסיו, וכך נמצאה סכין. בית משפט השלום זיכה אותו; המחוזי קיבל את ערעור המדינה והרשיעו. העליון דן יחד בשלושה הליכים שבהם עלתה שאלת קבילות ראיות מחיפושים שנערכו בהסכמה נטענת.","claimant":"הסנגוריה טענה שהסכמה אינה תחליף להסמכה בדין; לחלופין עליה להיות מדעת, לאחר הסבר על הזכות לסרב. היא ביקשה לפסול גם ראיות חפציות לפי יששכרוב. בעניינו של בן חיים לא היה חשד סביר ולא ניתן הסבר על הזכות לסרב.","respondent":"המדינה טענה שהסכמה יכולה להכשיר את החיפוש מתוך כיבוד האוטונומיה; שלא הכרחי לתת הודעה מפורשת או טופס; ושבנסיבות בן חיים מדובר בפגיעה מינימלית ובספק אם זו פעולת חיפוש. היא הדגישה גם את צורכי האכיפה.","question":"האם הסכמה יכולה לשמש מקור לחיפוש בהיעדר סמכות אחרת, מה נדרש להסכמה מדעת, והאם אי־חוקיות החיפוש מחייבת לפסול את הראיה?","ruling":"ערעוריהם של בן חיים וג׳בלי התקבלו והם זוכו בעקבות פסילת הראיות. ערעור עייש בעניין חוקיות החיפוש נדחה והרשעתו נותרה: בעניינו נמצא גם מקור סמכות עצמאי, ולא רק הסכמה.","halacha":"לפי הרוב, בנסיבות המתאימות הסכמה אמיתית, מודעת ורצונית יכולה לשמש מקור לחיפוש מהסוג שנדון, לאחר הסבר מפורש על הזכות לסרב והיעדר השלכה לרעת המסרב. אין להסיק מכאן היתר לכל סוג חיפוש. חיפוש לא חוקי אינו גורר פסילה אוטומטית: יש לדון בנפרד בדוקטרינת הפסילה היחסית.\u003cp>\u003cb>השלמת A2: בהיעדר מקור סמכות עצמאי, הסכמה לחיפוש צריכה להיות אמיתית, מודעת ורצונית; יש להעמיד את האדם על זכותו לסרב. שאלת קבילות הראיה נבחנת בנפרד ובאופן יחסי.\u003c/b>\u003c/p>","status":"הושלם A2 על בסיס חומרי הקורס","currency":"מוצגת ההכרעה במקור שבמחברת. לא אומתו שינויים מאוחרים מחוץ למקורות הקורס.","reasoning":"הרוב הבחין בין סמכות החיפוש לבין קבילות הראיה. בשל פערי הכוחות אין להסתפק בהיענות לבקשת שוטר: דרוש הסבר ברור על הזכות לסרב ועל כך שהסירוב לא ייזקף לחובת האדם. אין חובה גורפת לקבל הסכמה בכתב. בנפרד, הפסילה לפי יששכרוב היא יחסית ותלויה באיזון נסיבות המקרה; גם ראיה חפצית אינה חסינה מפסילה.","dissent":"השופט דנציגר הסכים לתוצאה אך חלק על האפשרות שהסכמה כשלעצמה תחליף הסמכה בחוק, מטעמי חוקיות המינהל ופערי הכוחות. השופטת ארבל הצטרפה לנשיאה ביניש.","exam":"סדר הניתוח: מקור סמכות עצמאי → תוקף ההסכמה → חוקיות החיפוש → קבילות הראיה. אין לדלג מהיעדר הסכמה מדעת ישירות למסקנה שכל ראיה נפסלת.","source":"אברהם בן חיים נ׳ מדינת ישראל.pdf — רע״פ 10141/09, פסקאות 3–5, 13, 31–35 וההכרעה הסופית"},{"name":"ג'ון איוון דמיאניוק נגד מדינת ישראל","cite":"ע\"פ 347/88 (1988)","facts":"דמיאניוק הואשם בהיותו \"איוון האיום\" מטרבלינקה והורשע במחוזי למוות. בערעור התעורר ספק בזיהוי, אך הוכח כי שירת כשומר נאצי בסוביבור. התביעה ביקשה להרשיעו בכך מכוח סעיף 184.","claimant":"כל אסטרטגיית ההגנה נועדה להפריך זיהוי כאיוון האיום; אילו הואשם בסוביבור, קו ההגנה היה שונה לגמרי.","respondent":"העובדות שהוכחו מבססות שירות כשומר נאצי, ולכן ניתן להרשיע מכוח סעיף 184.","question":"האם ניתן, בערעור, להרשיע בעבירה שונה לחלוטין מזו שבכתב האישום כשההגנה התמקדה בזיהוי ספציפי?","ruling":"זיכוי מלא — הזכות להזדמנות סבירה להתגונן היא זכות מהותית ודינמית, ולא פורמלית.","halacha":"תנאי בלעדי להפעלת סעיף 184: הזדמנות סבירה וממשית להתגונן מפני העבירה ה'חדשה'. כשקו ההגנה היה משתנה מהותית אילו ידע הנאשם מראש — לא ניתן להרשיעו בעבירה האחרת.","status":"לא הושלם אימות פרטני","currency":"לא אומת עדכון מעבר למקורות הקורס"},{"name":"צדוק נגד ראש אגף חקירות ומודיעין","cite":"בג\"ץ 1113/07 (2007)","facts":"העותר הגיש תלונה נגד אנשי ציבור בעבירות פשע חמורות. הקצין החליט שלא לחקור — התלונה נעדרת בסיס עובדתי ראשוני.","claimant":"סעיף 59 קובע חובה מוחלטת לחקור עבירת פשע, ללא שיקול דעת.","respondent":"אין לחייב את המשטרה לבזבז משאבים על תלונות מופרכות על פניהן.","question":"האם חובת החקירה בפשע היא מוחלטת, או שקיים חריג לתלונות מופרכות?","ruling":"העתירה נדחתה — החוק אינו דורש פעולה אוטומטית חסרת שיקול דעת.","halacha":"למשטרה שיקול דעת מקדמי ומצומצם ביותר שלא לפתוח בחקירת פשע, רק במקרים חריגים בהם התלונה מופרכת לחלוטין ונעדרת תשתית ראייתית מינימלית.","status":"לא הושלם אימות פרטני","currency":"לא אומת עדכון מעבר למקורות הקורס"},{"name":"שמואל נגד היועץ המשפטי לממשלה","cite":"בג\"ץ 4388/08 (2008)","facts":"שמואל קיבל מכתב יידוע. עורך דינו דרש את טיוטת כתב האישום וכל חומרי החקירה כדי לערוך שימוע אפקטיבי. התביעה סירבה.","claimant":"לא ניתן לקיים שימוע הוגן כשהחשוד מגשש באפלה, ללא ידיעת הראיות נגדו.","respondent":"זכות העיון המלאה (סעיף 74) קמה רק לאחר הגשת כתב אישום, כשהחשוד הופך לנאשם.","question":"האם זכות השימוע כוללת עיון בחומרי החקירה המלאים או בטיוטת כתב האישום, לפני הגשתו בפועל?","ruling":"העתירה נדחתה — אין לחשוד זכות עיון מלא בשלב השימוע.","halacha":"זכות העיון המלאה שמורה לנאשם לאחר הגשת כתב אישום בלבד. עם זאת, כדי שהשימוע לא יהיה טקס ריק, על התביעה למסור לחשוד את עיקרי העובדות והחשדות המתגבשים נגדו.","status":"לא הושלם אימות פרטני","currency":"לא אומת עדכון מעבר למקורות הקורס"},{"name":"אפרים נוה נגד מדינת ישראל","cite":"בג\"ץ 4922/19 (2019) — מפי השופט יצחק עמית","facts":"נוה, נאשם במרמה, ביקש לבסס טענת אכיפה בררנית ודרש נתונים מתיקים דומים. משסורבה בקשתו, פתח בעתירה מנהלית מקבילה מכוח חוק חופש המידע.","claimant":"חוק חופש המידע מעניק זכות אזרחית לקבל את הנתונים במקביל למשפט הפלילי.","respondent":"חומרים מתיקים אחרים אינם חומר חקירה בתיק הנוכחי; הליכים מקבילים פוגעים ביעילות.","question":"האם נאשם רשאי לפעול במסלול מקביל של חופש המידע כדי להשיג חומרים למשפטו הפלילי התלוי ועומד?","ruling":"העתירה נדחתה — נקבעה הלכת ייחוד ההליך הפלילי.","halacha":"כל בקשות הגילוי לצורך הגנת הנאשם יתבררו אך ורק בפני בית המשפט הפלילי הדן בתיק — באמצעות בקשה לצו הבאת מסמכים (סעיף 108) בשילוב טענת אכיפה בררנית (סעיף 149(10)).\u003cp>\u003cb>השלמת A2: יש להבחין בין החלטת מדיניות כללית של התביעה לבין פגם פרטני בהחלטה קונקרטית; הביקורת אינה מחליפה את שיקול דעת התביעה.\u003c/b>\u003c/p>","status":"הושלם A2 על בסיס חומרי הקורס","currency":"לא אומת עדכון מעבר למקורות הקורס"},{"name":"מנחם קנזי נגד מדינת ישראל","cite":"ע\"פ 194/75 (1975)","facts":"קנזי וביטון הועמדו לדין נפרד בגין פריצה וגניבה. התביעה זימנה את ביטון להעיד נגד קנזי, בעוד משפטו של ביטון עצמו עדיין תלוי ועומד.","claimant":"לשותף שמשפטו תלוי ועומד אינטרס כבד לשקר ולהחמיר, כדי לזכות בהקלות בעונשו שלו.","respondent":"כל אדם כשר להעיד; החשש מפני שקר משפיע על המשקל בלבד, לא על הקבילות.","question":"האם שותף שמשפטו תלוי ועומד כשר להעיד נגד שותפו?","ruling":"הערעור התקבל — נקבע איסור על העדת שותף כזה.","halacha":"זהו הכלל ההיסטורי. אין ליישמו כיום ככלל חוסם במשפטים נפרדים בלי להתייחס לבג״ץ 11339/05, שביטל את החסם הגורף והותיר חריג מצומצם. ראו את הניתוח המקושר בנושא עדות שותפים.\u003cp>\u003cb>השלמת A2: אין להחיל את כלל הסופיות באופן מכני. יש לזהות את סוג המחדל, את הפגיעה בהגינות ואת הסעד המתאים, בלי לקבוע חריג שלא נתמך בחומר הקורס.\u003c/b>\u003c/p>","status":"הושלם A2 על בסיס חומרי הקורס","currency":"לא אומת עדכון מעבר למקורות הקורס","source":"מדינת ישראל נ׳ בית המשפט המחוזי באר שבע 11339-05.pdf — ההכרעה הסופית ודעת הנשיאה ביניש, פסקה 3"},{"name":"רע\"פ סלימאן זכריא נגד מדינת ישראל","cite":"רע״פ 11160/03 (3.11.2004)","facts":"זכריא הועמד לדין על תקיפה הגורמת חבלה ממשית ואיומים, זוכה מעבירות אלה והורשע בתקיפה לפי סעיף 379. בערעור התייצבו הצדדים, וסנגורו הודיע שהוא מסתפק בהודעת הערעור. המדינה הגישה תשובה בכתב בהסכמתו. לאחר מכן ביקש דיון נוסף בעל־פה; בקשתו והערעור נדחו.","claimant":"המבקש טען שנפגעה זכותו לטעון בעל־פה וכי בית המשפט כפה עליו מסלול כתוב. הוא נימק את בקשת הדיון הנוסף בכך שתשובת המדינה לא כללה מענה משפטי מספק.","respondent":"המקור אינו מפרט בנפרד את מלוא טענות המדינה בפני העליון. מתואר כי בערעור ביקשה להשיב בכתב, ללא התנגדות הסנגור.","question":"מה מקומו של טיעון בעל־פה בערעור פלילי, והאם בנסיבות אלה נמנעה מהמבקש האפשרות לטעון?","ruling":"בקשת רשות הערעור נדחתה. בנסיבות שתועדו לא הוכח פגם בהליך המצדיק התערבות.","halacha":"אין ללמוד מההחלטה היתר גורף להחלפת הטיעון בערעור פלילי בכתב בלבד. יש להבחין בין שלילת הזכות לטעון לבין בחירה של בעל דין שהופיע להסתפק בטיעון כתוב.","status":"הסיכום השגוי הוחלף לאחר בדיקת המקור","currency":"לצד ההחלטה יש ללמוד את הדיון המאוחר בפלוני 5333/11 שבמחברת. אין כאן אימות עדכניות חיצוני.","withheld":false,"reasoning":"השופט לוי הדגיש את הדיון בנוכחות הצדדים לפי סעיף 208 ואת תפקיד הכתב כהכנה לטיעון ישיר. אולם בפרוטוקול הופיע שהמבקש עצמו הסתפק בנימוקיו הכתובים; לא נמצאה בו כפייה, ולא התבקש תיקונו. גם האפשרות להגיב לתשובת המדינה ניתנה ולא נוצלה.","dissent":"ברק הסכים ללוי. פרוקצ׳יה הסכימה לתוצאה אך הותירה בצריך עיון את השאלה אם הסכמה מוקדמת למסלול כתוב בלבד, ללא פגיעה או עיוות דין, יכולה להכשירו מכוח תום לב ומניעות.","exam":"בדקו מה קרה בדיון ומה רשום בפרוטוקול. אין להסיק מבקשה מאוחרת לדיון שהזכות נשללה מלכתחילה. השוו לפלוני 5333/11.","source":"זכריא נ׳ מדינת ישראל.pdf — רע״פ 11160/03, פסקאות 2–4 והערת השופטת פרוקצ׳יה"},{"name":"פלוני נגד מדינת ישראל","cite":"רע״פ 5333/11 (20.7.2011)","facts":"בעל מסעדה הורשע בהשמטת הכנסות של כשני מיליון ש״ח מדוחות המס. הסיכומים הוגשו בכתב בהסכמת סנגורו. לאחר שערעורו למחוזי נדחה, ביקש רשות ערעור וטען בין היתר שהיעדר סיכומים בעל־פה פגע בהליך ההוגן.","claimant":"המבקש טען כי יש לבטל את ההליך ולהחזירו לשופט אחר משום שלא נשמעו סיכומים בעל־פה; כן חלק על התשתית החשבונאית להרשעה.","respondent":"ההחלטה אינה מפרטת בנפרד את טענות המדינה בבקשת הרשות. אין לייחס לה טענות משוערות; מובאים כאן נימוקי בית המשפט.","question":"האם הגשת סיכומים בכתב בהסכמת הצדדים, ללא סיכומים בעל־פה, מחייבת ביטול ההליך?","ruling":"בקשת רשות הערעור נדחתה. לא נמצא פגם המצדיק ביטול ההליך; הבקשה לעיכוב ביצוע התייתרה.","halacha":"אין לבטל אוטומטית פסק דין רק משום שהסיכומים הוגשו בכתב בהסכמה. יש להבחין בין דרך המלך של טיעון בעל־פה לבין תוצאת הסטייה ממנה, ולבחון הסכמה ופגיעה בפועל בהגנה.","status":"הסיכום השגוי הוחלף לאחר בדיקת המקור","currency":"ההחלטה מוצגת לפי מקור המחברת; לא אומתה התפתחות מאוחרת מעבר למקורותיה.","withheld":false,"reasoning":"רובינשטיין הדגיש שטיעון בעל־פה הוא דרך המלך, אך הפסיקה והנוהג מאפשרים סיכומים בכתב בהסכמה. גם לשון סעיף 181א, המזכירה שמיעת סיכומים או הגשתם, מכירה בפרקטיקה. בעניינו של המבקש ניתנה הסכמה ולא הוצבע על נזק או עיוות דין. מורכבות כלכלית וטכנית עשויה אף להקנות יתרון לסיכומים כתובים.","dissent":"החלטה של שופט יחיד — אין דעת רוב ומיעוט.","exam":"זה אינו פסק דין על עדות שותף או על קטין בעבירת מין. השאלות הרלוונטיות הן מתכונת הסיכומים, הסכמת הצדדים ועיוות דין.","source":"פלוני נ׳ מדינת ישראל 5333-11.pdf — רע״פ 5333/11, פסקאות א–ט"},{"name":"סוסן נגד מדינת ישראל","cite":"ע\"פ 866/95 (1995) — הלכת סוסן","facts":"מספר נאשמים הועמדו לדין משותף במחוזי בפרשת מרמה. סוסן טען שכל העבירות המיוחסות לו אישית הן בסמכות בית משפט השלום בלבד.","claimant":"צירוף נאשמים אינו יכול לעקוף את כללי הסמכות העניינית הסטטוטוריים — יש לפצל את התיק.","respondent":"יעילות הדיון ומניעת החלטות סותרות מחייבות שמיעה משותפת תחת בית המשפט הבכיר.","question":"האם המחוזי רוכש סמכות עניינית לדון בנאשם שעבירותיו הן בסמכות השלום, מכוח צירופו לכתב אישום משותף?","ruling":"הערעור נדחה.","halacha":"כשמוקנית למחוזי סמכות עניינית לגבי נאשם אחד בכתב אישום משותף, הוא רוכש סמכות \"נגררת\" לדון גם ביתר הנאשמים — גם אם עבירותיהם הפרטניות בסמכות השלום — כדי למנוע פיצול הליכים.","status":"לא הושלם אימות פרטני","currency":"לא אומת עדכון מעבר למקורות הקורס"},{"name":"אביגדור פלדמן נגד בית המשפט המחוזי","cite":"ע\"פ 4865/09 (2009) — פרשת משה קצב","facts":"בית המשפט קבע יומן אינטנסיבי של 4 ימי דיון בשבוע. סנגוריו של קצב ביקשו להשתחרר מייצוג עקב עומס עבודה — הבקשה נדחתה, והוגש ערעור עצמאי ומיידי.","claimant":"קצב הדיונים פוגע בהגנה ראויה ובזכויות מקצועיות; יש זכות ערעור מיידית על דחיית בקשת השחרור.","respondent":"החלטת ביניים אינה ניתנת לערעור מיידי; קצב הדיונים תואם את חובת השמיעה הרציפה (סעיף 125).","question":"האם לסנגור זכות ערעור מיידית על דחיית בקשת שחרור מייצוג? והאם עומס עבודה מצדיק פגיעה ברציפות הדיון?","ruling":"הערעור נדחה לגופו, אך התקבלה הטענה המקדמית בדבר זכות הערעור.","halacha":"לסנגור זכות ערעור עצמאית ומיידית על דחיית בקשת שחרור — חריג נדיר לכלל אי־ההתערבות בהחלטות ביניים. סעיף 125 מחייב שמיעת ראיות רציפה יום־יום; עומס עבודה של סנגור אינו טעם מיוחד לפגיעה ברציפות.\u003cp>\u003cb>השלמת A2: יש להבחין בין אילוץ דיוני בניהול הייצוג לבין ויתור מדעת על זכות; יעילות הדיון לבדה אינה מוכיחה ויתור.\u003c/b>\u003c/p>","status":"הושלם A2 על בסיס חומרי הקורס","currency":"לא אומת עדכון מעבר למקורות הקורס"},{"name":"מדינת ישראל נגד בורוביץ, נוה, ורותם — הגנה מן הצדק","cite":"ע\"פ 4855/02 בורוביץ; בג\"ץ 4922/19 נוה; דנ\"פ 5387/20 רותם","facts":"שלושה פסקי דין מרכזיים שעיצבו יחד את דוקטרינת ההגנה מן הצדק בישראל — כל אחד עסק במקרה שונה שבו נטען כי הגשת כתב אישום או ניהול ההליך פוגעים באופן מהותי בעקרונות של צדק והגינות משפטית.","claimant":"כאשר התנהלות הרשויות (למשל אכיפה בררנית, שיהוי בלתי סביר, או פגיעה בהליך התקין) חמורה במיוחד, יש לבטל את כתב האישום גם אם לא נפל בו פגם משפטי \"טכני\".","respondent":"הביטול על בסיס הגנה מן הצדק צריך להישמר למקרים חריגים ביותר, שאחרת כל נאשם יטען זאת כדי לחמוק מדין.","question":"מהם התנאים והיקף השימוש בדוקטרינת ההגנה מן הצדק כטענה מקדמית לביטול כתב אישום?","ruling":"בפסיקה גובשה דוקטרינה בעלת מבחן תלת-שלבי (זיהוי הפגם, בחינת האפשרות לרפא אותו באמצעים מתונים יותר, ואיזון האינטרסים) המוחלת במשורה.","halacha":"בית המשפט רשאי לבטל כתב אישום כאשר הגשתו או ניהול ההליך הפלילי עומדים בסתירה מהותית לעקרונות של צדק והגינות משפטית — זוהי טענה מקדמית עצמאית מכוח סעיף 149(7) לחסד\"פ, הנבחנת במשורה ובזהירות.","status":"לא הושלם אימות פרטני","currency":"לא אומת עדכון מעבר למקורות הקורס"},{"name":"מדינת ישראל נגד יגאל קרישניסקי","cite":"ע\"פ 250/77 (1977)","facts":"נאשם ניסה לטעון טענת \"סיכון כפול\" ביחס להליך קודם שהתנהל נגדו, כשההליך הקודם היה למעשה בטל מעיקרו (בית המשפט לא היה מוסמך לדון בו מלכתחילה).","claimant":"עמד בעבר ב\"סיכון\" של הרשעה באותו עניין, ולכן אין להעמידו לדין פעם נוספת.","respondent":"מכיוון שההליך הקודם היה בטל מעיקרו (חוסר סמכות), הוא לא היה הליך תקף שממנו נובע \"סיכון\" משפטי כלל.","question":"האם ניתן לטעון \"סיכון כפול\" כאשר ההליך הקודם שממנו נטען הסיכון היה בטל מעיקרו?","ruling":"נקבע כי הטענה אינה חלה במצב זה.","halacha":"טענת \"סיכון כפול\" אינה חלה כאשר ההליך הקודם בטל מעיקרו — למשל כשבית המשפט לא היה מוסמך לדון בו מלכתחילה. הליך בטל אינו יוצר \"סיכון\" משפטי מוכר.","status":"לא הושלם אימות פרטני","currency":"לא אומת עדכון מעבר למקורות הקורס"},{"name":"דרורי נגד מדינת ישראל","cite":"ע\"פ 104/89 (1989)","facts":"נאשם הועמד לדין בכתב אישום הכולל כמה עבירות שונות, בעלות עונשים מרביים שונים, ונדרשה הכרעה איזה בית משפט מוסמך לדון בתיק כולו.","claimant":"לא פורט בסיכום הקיים; יש להשלים מהמקור, ולא להסיק טענה משוערת.","respondent":"לא פורט בסיכום הקיים; יש להשלים מהמקור, ולא להסיק טענה משוערת.","question":"כיצד נקבעת הסמכות העניינית כאשר כתב אישום אחד כולל כמה עבירות בחומרה שונה?","ruling":"נקבע מבחן ברור המבוסס על העבירה החמורה ביותר בכתב האישום.","halacha":"כתב אישום הכולל כמה עבירות — הסמכות העניינית נקבעת לפי העונש המקסימלי של העבירה החמורה ביותר שבו. למשל: שלוש עבירות בנות 5 שנים כל אחת → שלום; שילוב של עבירת 3 שנים ועבירת 10 שנים → מחוזי.","status":"לא הושלם אימות פרטני","currency":"לא אומת עדכון מעבר למקורות הקורס"},{"name":"מדינת ישראל נגד בית המשפט המחוזי בבאר שבע","cite":"בג״ץ 11339/05 — הכרעה מיום 8.10.2006","facts":"בפרשה שבה הוגשו כתבי אישום נפרדים, התעוררה השאלה אם התביעה תוכל להעיד שותף שמשפטו שלו עדיין תלוי ועומד. המדינה פנתה נגד החלטת בית המשפט המחוזי בבאר שבע, ודיון בהרכב מורחב בחן מחדש את הלכת קנזי.","claimant":"המדינה ביקשה להסיר את החסם להעדת השותף לפני סיום משפטו הנפרד.","respondent":"במוקד העמדה התומכת בשימור ההגבלה עמד החשש לעדות מוטה של שותף המבקש להיטיב את מצבו ולפגיעה בזכויות. זהו תמצות הסוגיה; אין לייחס לכל משיב טיעון זהה.","question":"האם להמשיך בכלל המעכב העדת שותף כל עוד משפטו הנפרד לא הסתיים, ובאיזה היקף להשאיר שיקול דעת לדחייה?","ruling":"בדעת רוב נקבע שאין מניעה ככלל להעיד עד תביעה הקשור באותה פרשה ומשפטו תלוי ועומד. החלטת המחוזי שבמוקד העתירה בוטלה.","halacha":"במשפטים נפרדים ניתן להעיד שותף גם לפני סיום משפטו. רק במקרים חריגים ביותר, מטעמים שיירשמו, רשאי בית המשפט לדחות את שמיעתו עד לסיום משפטו.\u003cp>\u003cb>השלמת A2: בעדות שותף במשפטים נפרדים אין חסם גורף; דחייה אפשרית רק במקרים חריגים ביותר ומטעמים שיירשמו. עצם האפשרות להעיד נפרדת ממשקל העדות.\u003c/b>\u003c/p>","status":"הושלם A2 על בסיס חומרי הקורס","currency":"לא אומת עדכון מעבר למקורות הקורס","reasoning":"בית המשפט שקל את החשש מעדות אינטרסנטית מול עיכוב ההליך והקשיים שיצר הכלל הגורף. דעת הרוב העדיפה להסיר את החסם ולהותיר דחייה במקרים חריגים ביותר ובהנמקה. ההבחנה בין עצם העדת השותף לבין משקל עדותו נותרת חשובה.","dissent":"השופטים נבדלו בהיקף שיקול הדעת שיש להשאיר. ההכרעה אימצה את המסלול המצומצם המתואר בדעת הנשיאה ביניש.","source":"מדינת ישראל נ׳ בית המשפט המחוזי באר שבע 11339-05.pdf — ההכרעה הסופית ודעת הנשיאה ביניש, פסקה 3","exam":"אין לפתור קייס של כתבי אישום נפרדים באמצעות האיסור ההיסטורי בלבד. יש לזהות את השינוי ואת החריג."},{"name":"אשורנס נגד הכונס הרשמי","cite":"רע\"א 3312/04 (2004)","facts":"בתום פרשת התביעה במשפט, נטענה טענת \"אין להשיב לאשמה\" — כלומר שהאשמה לא הוכחה אף לכאורה על סמך ראיות התביעה בלבד.","claimant":"לא פורט בסיכום הקיים; יש להשלים מהמקור, ולא להסיק טענה משוערת.","respondent":"לא פורט בסיכום הקיים; יש להשלים מהמקור, ולא להסיק טענה משוערת.","question":"מהם התנאים לקבלת טענת \"אין להשיב לאשמה\" בתום פרשת התביעה?","ruling":"נקבעו העקרונות המנחים להפעלת סעיף 158 לחסד\"פ.","halacha":"אם בתום פרשת התביעה לא הוכחה האשמה אף לכאורה, יזכה בית המשפט את הנאשם — הן מיוזמתו והן לבקשת הנאשם — לאחר שנתן לתובע הזדמנות להשמיע את דברו בעניין.\u003cp>\u003cb>השלמת A2: בהקשר הפלילי יש לבחון גילוי והגינות לפי השפעתם על ההליך וההגנה, ולא להעתיק מסקנה מהליך אחר בלי בסיס בחומר הקורס.\u003c/b>\u003c/p>","status":"הושלם A2 על בסיס חומרי הקורס","currency":"לא אומת עדכון מעבר למקורות הקורס"},{"name":"לזרובסקי נגד מדינת ישראל","cite":"ע\"פ 5874/00 (2000)","facts":"במהלך המשפט ביקש בית המשפט לעשות שימוש בסמכותו להזמין ראיות או עדים מיוזמתו, לאחר שהצדדים סיימו להביא את ראיותיהם.","claimant":"לא פורט בסיכום הקיים; יש להשלים מהמקור, ולא להסיק טענה משוערת.","respondent":"לא פורט בסיכום הקיים; יש להשלים מהמקור, ולא להסיק טענה משוערת.","question":"מהו היקף סמכותו של בית המשפט להביא ראיות מיוזמתו לפי סעיף 167 לחסד\"פ, ובאילו שלבים ניתן להפעילה?","ruling":"אושרה סמכותו הרחבה של בית המשפט להביא ראיות מטעמו, לרבות בשלבים מאוחרים.","halacha":"סיימו הצדדים להביא ראיותיהם, רשאי בית המשפט להורות על הזמנת עד (גם אם כבר העיד) או ראיות נוספות, מיוזמתו או לבקשת בעל דין. גם לאחר הכרעת הדין ניתן לקבל ראיות חדשות — אך במקרים נדירים וחריגים ביותר, כשהדבר נדרש לעשיית צדק ולמניעת עיוות דין.","status":"לא הושלם אימות פרטני","currency":"לא אומת עדכון מעבר למקורות הקורס"},{"name":"תיקים הממתינים לבירור דין (מב\"ד)","cite":"בש\"פ 6718/06 פלוני; רע\"פ 1021/07 פלוני","facts":"בשני מקרים נדונה השאלה האם ניתן להגיש כראיה נגד נאשם פלט ממחשב המשטרה על תיקים פתוחים שטרם הוחלט אם להגיש בגינם כתב אישום (מב\"ד — ממתינים לבירור דין).","claimant":"לא פורט בסיכום הקיים; יש להשלים מהמקור, ולא להסיק טענה משוערת.","respondent":"לא פורט בסיכום הקיים; יש להשלים מהמקור, ולא להסיק טענה משוערת.","question":"האם ניתן להגיש תיקי מב\"ד כראיה, ובאיזה שלב של ההליך?","ruling":"נקבעה הבחנה בין שלב הכרעת האשמה לשלב גזירת העונש.","halacha":"בשלב בירור האשמה אין להגיש פלט מב\"ד (אלא אם הנאשם טוען שלא נפתחה נגדו חקירה כלל), שכן אין להביא ראיות על עברו הפלילי בשלב זה. בשלב גזירת הדין, לעומת זאת, שירות המבחן רשאי לכלול מידע על תיקי מב\"ד בתסקיר, ובית המשפט רשאי להידרש לכך בזהירות הראויה.","status":"לא הושלם אימות פרטני","currency":"לא אומת עדכון מעבר למקורות הקורס"},{"name":"שם טוב ופלוני — חריגים נוספים לערעור על החלטות ביניים","cite":"ע\"פ 6907/19 שם טוב; בג\"ץ 10683/08 פלוני נ' בית משפט השלום חיפה","facts":"שני מקרים נוספים (מלבד עניין פלדמן) שבהם נדונה השאלה אילו החלטות ביניים בהליך הפלילי ניתנות לערעור עצמאי ומיידי, חרף הכלל האוסר זאת.","claimant":"לא פורט בסיכום הקיים; יש להשלים מהמקור, ולא להסיק טענה משוערת.","respondent":"לא פורט בסיכום הקיים; יש להשלים מהמקור, ולא להסיק טענה משוערת.","question":"אילו סוגי החלטות ביניים בהליך הפלילי מהוות חריג לכלל האוסר ערעור עליהן במהלך ההליך?","ruling":"אושרה וחודדה רשימת החריגים לכלל.","halacha":"מלבד הכלל שאין לערער על החלטות ביניים אלא במסגרת הערעור על פסק הדין, קיימים חריגים שבהם ניתן לערער בזכות באופן מיידי: פסלות שופט; החלטה על דיון בדלתיים פתוחות; החלטה בעניין עיון בחומר חקירה; והחלטה בעניין עיכוב ביצוע עונש.\u003cp>\u003cb>השלמת A2: בהחלטות תביעה יש להבחין בין פגם מנהלי בהחלטה לבין מחלוקת על דיות הראיות; הסעד תלוי בסוג הפגם ובעוצמת הפגיעה.\u003c/b>\u003c/p>","status":"הושלם A2 על בסיס חומרי הקורס","currency":"לא אומת עדכון מעבר למקורות הקורס"},{"name":"צ'ירנסקי נגד סגן נשיא בית משפט השלום בחדרה","cite":"בג\"ץ 188/96 (1996)","facts":"נדונה שאלת זכות הערעור של מי שקיבל בפועל את התוצאה המבוקשת בפסק הדין, אך נקבעו בו קביעות עובדתיות שאינן נוחות לו, וכן שאלת זכות הערעור של עד.","claimant":"לא פורט בסיכום הקיים; יש להשלים מהמקור, ולא להסיק טענה משוערת.","respondent":"לא פורט בסיכום הקיים; יש להשלים מהמקור, ולא להסיק טענה משוערת.","question":"האם מי שזכה בפסק הדין, וכן עד במשפט, רשאים לערער על קביעות מסוימות שנקבעו בפסק הדין או במהלכו?","ruling":"נקבע כי שניהם אינם \"נפגעים\" במובן המקנה זכות ערעור.","halacha":"מי שקיבל פסק דין לטובתו אינו רשאי לערער עליו, גם אם נקבעו בו ממצאים לחובתו, מכיוון שאין לראות בו \"נפגע\" מפסק הדין. עד במשפט אינו רשאי לערער על אמרת אגב של שופט שבה הוטל ספק במהימנותו.","status":"לא הושלם אימות פרטני","currency":"לא אומת עדכון מעבר למקורות הקורס"},{"name":"חניון חיפה, גבארה וסורפין — מתי תינתן רשות ערעור","cite":"ר\"ע 103/82 חניון חיפה; רע\"פ 4049/05 גבארה; רע\"פ 4732/02 סורפין","facts":"שלושה פסקי דין שגיבשו יחד את המבחנים למתן רשות לערער בהליך פלילי (ערעור \"שני\", לאחר ערעור בזכות), הן ביחס להכרעת הדין והן ביחס לחומרת העונש.","claimant":"לא פורט בסיכום הקיים; יש להשלים מהמקור, ולא להסיק טענה משוערת.","respondent":"לא פורט בסיכום הקיים; יש להשלים מהמקור, ולא להסיק טענה משוערת.","question":"מתי תינתן רשות ערעור בהליך פלילי?","ruling":"גובשו הקריטריונים העיקריים למתן הרשות.","halacha":"רשות ערעור תינתן כאשר הבקשה מעלה שאלה משפטית חשובה שלהכרעה בה חשיבות ציבורית כללית, החורגת מעניינם הספציפי של בעלי הדין — או, בערעור על חומרת העונש, כאשר המקרה חריג ותחושת הצדק מחייבת מתן רשות (למשל פער ניכר בין העונש שנגזר בערכאה הראשונה לזה שנגזר בערעור).","status":"לא הושלם אימות פרטני","currency":"לא אומת עדכון מעבר למקורות הקורס"},{"name":"חילף נגד מדינת ישראל","cite":"רע\"פ 8274/99 (1999)","facts":"מערער ביקש להגיש ערעור (או בקשת רשות ערעור) לאחר שחלפו המועדים הקבועים בחוק להגשתו.","claimant":"לא פורט בסיכום הקיים; יש להשלים מהמקור, ולא להסיק טענה משוערת.","respondent":"לא פורט בסיכום הקיים; יש להשלים מהמקור, ולא להסיק טענה משוערת.","question":"באילו תנאים רשאי בית המשפט להאריך את המועד להגשת ערעור פלילי שהוגש באיחור?","ruling":"נקבע כי ניתן להאריך את המועד גם ללא \"טעמים מיוחדים שיירשמו\", בשונה מהליך אזרחי.","halacha":"בית המשפט רשאי, לבקשת מערער, להרשות הגשת ערעור או בקשת רשות ערעור גם לאחר חלוף המועדים — ללא צורך בטעמים מיוחדים שיירשמו (בשונה מהליך אזרחי). החלטת בית משפט לדחות בקשת הארכת מועד מהווה \"פסק דין\", והערעור עליה הוא בזכות.","status":"לא הושלם אימות פרטני","currency":"לא אומת עדכון מעבר למקורות הקורס"},{"name":"יוסי בן ארי נגד השר לביטחון פנים","cite":"בג\"ץ 8029/21 (2021) — מפי השופט אלכס שטיין","facts":"בן ארי נידון בשנות ה-90 לתריסר שנות מאסר בעבירות סמים חמורות מסוג פשע. לאחר שריצה 4 שנים בלבד, נמלט מהכלא וברח לפרגוואי, שם חי תחת זהות בדויה כמעט 30 שנה — עד שאותר, נעצר והוחזר לישראל ב-2021.","claimant":"חלפו מעל 20 שנה מיום הפסקת ריצוי העונש בפועל, ולפי סעיף 10(א) לחוק סדר הדין הפלילי העונש התיישן לחלוטין והמדינה אינה מוסמכת להחזיקו במאסר.","respondent":"לפי סעיף 10(ג) לחוק, תקופת ההימלטות לחוץ לארץ וההתחמקות ממאסר אינן נספרות במניין — השעון נעצר ביום הבריחה.","question":"האם עונש מאסר של אסיר שנמלט מהכלא ושהה בחוץ לארץ כמעט 30 שנה מתיישן, או שבריחתו האקטיבית מקפיאה את מרוץ ההתיישנות?","ruling":"בית המשפט העליון דחה את העתירה — הבריחה מקפיאה את מרוץ ההתיישנות באופן מוחלט.","halacha":"בריחה אקטיבית של אסיר מהכלא והתחמקות ממאסר מקפיאות לחלוטין את שעון התיישנות העונש (סעיף 10(ג)). מוסד ההתיישנות נועד להעניק מחילה למי ששהה בקהילה וסבל מחרדת העונש המתמדת — לא למי שנמלט וחי בשקט תחת זהות בדויה.\u003cp>\u003cb>השלמת A2: בביקורת מנהלית יש להציג את האיזון בין זכויות הפרט לבין האינטרס הציבורי ואת גבולות ההתערבות, בלי לייחס חריג עובדתי שלא אומת.\u003c/b>\u003c/p>","status":"הושלם A2 על בסיס חומרי הקורס","currency":"לא אומת עדכון מעבר למקורות הקורס"},{"name":"דוד אפל נגד פרקליטת המדינה","cite":"בג\"ץ 2682/99 (1999)","facts":"דוד אפל, איש עסקים, הועמד לדין פלילי בגין עבירות שוחד ומרמה חמורות. אפל הגיש עתירה לבג\"ץ בדרישה לבטל את כתב האישום נגדו, בטענה שההחלטה להעמידו לדין לוקה בחוסר סבירות קיצוני ונשענת על תשתית ראייתית רעועה.","claimant":"החלטת התביעה להעמידו לדין היא החלטה מנהלית הכפופה לביקורת שיפוטית מלאה של בג\"ץ, וההחלטה להגיש כתב אישום עולה כדי חוסר סבירות קיצוני.","respondent":"ההחלטה על הגשת כתב אישום או סגירת תיק מצויה בליבת הסמכות המקצועית של התביעה הכללית, שלה המומחיות הייחודית בהערכת סיכויי הרשעה — ובית המשפט אינו \"תובע-על\".","question":"באילו נסיבות ובאיזו מידה יתערב בית המשפט הגבוה לצדק בשיקול הדעת המקצועי של רשויות התביעה בעניין הגשת כתב אישום או סגירת תיק פלילי?","ruling":"בית המשפט העליון דחה את העתירה וקבע הלכת התערבות מצומצמת ביותר.","halacha":"החלטת התביעה להעמיד אדם לדין היא אכן החלטה מנהלית הכפופה לביקורת שיפוטית, אך בג\"ץ יתערב בה רק במקרים נדירים וחריגים ביותר שבהם נפל בהחלטה פגם חמור היורד לשורש העניין — חוסר סבירות קיצוני ביותר, חוסר תום לב מובהק, שיקולים זרים ברורים או אפליה בררנית פסולה. כל עוד ההחלטה במתחם הסבירות המקצועי של התובע — אין התערבות.","status":"לא הושלם אימות פרטני","currency":"לא אומת עדכון מעבר למקורות הקורס"},{"name":"רפאל יששכרוב נגד התובע הצבאי הראשי","cite":"ע\"פ 5121/98","facts":"חייל נחקר בגין עבירה והודה בחקירה, מבלי שחוקריו הודיעו לו כדין על זכותו להיוועץ בעורך דין לפני החקירה.","claimant":"פגיעה בזכות ההיוועצות בעורך דין, המעוגנת בחוק יסוד כבוד האדם וחירותו, פוגעת בהגינות ההליך ומצדיקה פסילת ההודאה שהושגה עקב כך.","respondent":"האינטרס הציבורי בחשיפת האמת ובמלחמה בפשיעה מצדיק קבלת ההודאה כראיה, חרף הפגם בחקירה.","question":"האם חוק יסוד כבוד האדם וחירותו מחייב פסילה של ראיה שהושגה תוך פגיעה בזכות חוקתית של הנחקר, ובאילו תנאים?","ruling":"בית המשפט העליון קבע כי לבתי המשפט שיקול דעת לפסול ראיה שהושגה שלא כדין, כאשר קבלתה תפגע באופן מהותי בזכות להליך הוגן.","halacha":"נקבעה דוקטרינת \u003cb>הפסילה הפסיקתית היחסית\u003c/b> — לבית המשפט שיקול דעת לפסול ראיה שהושגה באמצעים פסולים, לפי מבחן איזון בין האינטרס הציבורי בחשיפת האמת לבין ההגנה על זכויות הנחקר וטוהר ההליך השיפוטי, ולא פסילה אוטומטית וקטגורית כבארה\"ב. זוהי ההלכה העומדת בבסיס הדיון על מודל מיגור הפשיעה מול מודל ההליך הראוי (ראו שיעור 1).","status":"לא הושלם אימות פרטני","currency":"לא אומת עדכון מעבר למקורות הקורס"},{"name":"ירדאו קסאי נגד מדינת ישראל","cite":"רע\"פ 3829/15","facts":"קסאי עוכב ונעצר ברחוב על ידי שוטרים בנסיבות שבהן לא התקיימו עילות המעצר החוקיות. קסאי התנגד למעצר פיזית תוך שימוש בכוח מול השוטרים, והועמד לדין בגין תקיפת שוטר בעת מילוי תפקידו.","claimant":"מאחר שהמעצר היה בלתי חוקי מיסודו, השוטר לא פעל כחוק בעת מילוי תפקידו, ולכן עמדה לו זכות טבעית להתנגד למעצר הבלתי חוקי.","respondent":"חובה על אזרח לציית להוראות שוטר בשטח, ואין להתיר שימוש בכוח נגד אנשי חוק גם אם נפלה שגגה בחוקיות המעצר.","question":"האם עומדת לאדם זכות להתנגד פיזית למעצר בלתי חוקי שמבצע שוטר, ובאיזו מידה?","ruling":"בית המשפט העליון קיבל את טענת המערער.","halacha":"לכל אדם שמורה זכות יסוד להתנגד למעצר בלתי חוקי, ואף לעשות שימוש בכוח סביר ומידתי לצורך שמירה על חירותו. מעצר בלתי חוקי שולל מהשוטר את ההגנה של מילוי תפקידו כחוק.\u003cp>\u003cb>השלמת A2: חיפוש בהסכמה נבחן לפי מקור הסמכות, תוקף ההסכמה וחוקיות הפעולה; יש להפריד בין היישום העובדתי לבין מבחן הפסילה היחסי.\u003c/b>\u003c/p>","status":"הושלם A2 על בסיס חומרי הקורס","currency":"לא אומת עדכון מעבר למקורות הקורס"},{"name":"כהן נגד הפצ\"ר","cite":"ע\"פ 349/88","facts":"חייל בצבא נחשד בביצוע עבירה צבאית. המפקד והמשטרה הצבאית השתמשו בסמכות מעצר ללא צו תחת העילה של עבירה שבוצעה \"זה מקרוב\", חרף חלוף מספר ימים מהמעשה.","claimant":"חלפו ימים ממועד ביצוע המעשה, ולכן סמכות מעצר ללא צו תחת התיבה \"זה מקרוב\" פקעה, והיה חובה לפנות לשופט להוצאת צו מעצר מסודר.","respondent":"הביטוי \"זה מקרוב\" מעניק גמישות חקירתית של מספר ימים.","question":"מהו פרק הזמן המדויק המוגדר תחת התיבה \"זה מקרוב\" לצורך ביצוע מעצר שוטר ללא צו שופט?","ruling":"בית המשפט העליון קבע כי הביטוי מבטא משך זמן מצומצם ביותר.","halacha":"\"זה מקרוב\" נמדד בשעות בודדות בלבד ולא בימים. ברגע שחלפו ימים מאירוע העבירה, פוקעת סמכות השוטר לעצור ללא צו, וחובה לפנות לבית המשפט לקבלת צו מעצר.\u003cp>\u003cb>השלמת A2: ההבחנות מן ההליך הצבאי אינן מועברות אוטומטית להליך האזרחי; יש להסתמך על כלל ההוגנות ונטל ההוכחה כפי שנלמדו בקורס.\u003c/b>\u003c/p>","status":"הושלם A2 על בסיס חומרי הקורס","currency":"לא אומת עדכון מעבר למקורות הקורס"},{"name":"אסף שי נגד מדינת ישראל","cite":"ע\"פ 9956/05","facts":"אסף שי נחשד בביצוע עבירת הריגה בתאונת דרכים. במהלך חקירתו בתחנה ביקש להיפגש עם עורך דינו. החוקרים השהו את המפגש שלא כדין, והמשיכו לחקור אותו עד שמסר הודאה מפלילה בכתב.","claimant":"מניעת המפגש עם עורך דינו הייתה בלתי חוקית, פגעה באוטונומיה שלו וזיהמה את החקירה, ולכן יש לפסול את ההודאה מכוח הלכת יששכרוב.","respondent":"ההודאה ניתנה מרצון חופשי והחוקרים היו מוטרדים מדחיפות גביית הגרסה.","question":"מהי נפקות הפגיעה הבלתי חוקית בזכות היסוד של החשוד להיוועץ בעורך דין על קבילות הודאתו בחקירה?","ruling":"בית המשפט העליון פסל את קבילות ההודאה וזיכה את שי מעבירת ההריגה.","halacha":"זכות המפגש וההיוועצות עם עורך דין היא זכות יסוד חוקתית מן המעלה הראשונה. פגיעה בלתי חוקית בזכות זו פוגעת בהגינות ההליך הפלילי ותוביל לפסילת הודאה שנגבתה בעקבותיה.","status":"לא הושלם אימות פרטני","currency":"לא אומת עדכון מעבר למקורות הקורס"},{"name":"מוצעב אלטויל נגד מדינת ישראל","cite":"בש\"פ 8845/04","facts":"אלטויל נעצר בחשד לביצוע עבירות ביטחון חמורות. בתום החקירה הגישה המדינה הצהרת תובע לפי סעיף 17(ד) וביקשה חמישה ימי מעצר גישור.","claimant":"הצהרת תובע השוללת חירות מנעצר שחקירתו הסתיימה חייבת להתפרש בצמצום דווקני; המדינה אינה מוסמכת להשתמש בימי הגישור להשלמת חקירה אלא רק לניסוח טכני של כתב האישום.","respondent":"מעצר הגישור נועד לגשר על הפער הזמני הנדרש לתובע ללמוד את תיק החקירה המורכב ולנסח את כתב האישום והבקשה למעצר עד תום ההליכים.","question":"מהו גדר סמכותו של בית המשפט בהענקת מעצר גישור לפי סעיף 17(ד), ומהן החובות המוטלות על התביעה בעת מתן הצהרת תובע?","ruling":"בית המשפט העליון תחם את מוסד מעצר הגישור לתכליתו הצרה.","halacha":"הצהרת תובע היא כלי דיוני המיועד אך ורק לגישור על פרק הזמן הדרוש להכנת כתב האישום והבקשה למעצר עד תום ההליכים, ולא נועד להמשך חקירה. בית המשפט מחויב לבחון בקפדנות אם קיימת עילת מעצר לכאורה, ולקצוב את ימי הגישור למינימום הנדרש.","status":"לא הושלם אימות פרטני","currency":"לא אומת עדכון מעבר למקורות הקורס"},{"name":"שלמה זאדה נגד מדינת ישראל","cite":"בש\"פ 8087/95 — מפי הנשיא אהרן ברק","facts":"זאדה נעצר והועמד לדין בגין עבירות סמים ורכוש חמורות. התביעה ביקשה לעוצרו עד תום ההליכים. זאדה טען כי חומר הראיות מלא בסתירות פנימיות וקשיים במהימנות העדים.","claimant":"בשלב המעצר עד תום ההליכים, בית המשפט מחויב לבחון את מהימנות העדים ואת משקל הראיות; סתירות קשות בחומר החקירה שוללות קיום \"ראיות לכאורה\".","respondent":"בשלב המעצר בית המשפט אינו קובע ממצאי מהימנות או משקל, אלא בוחן רק את הפוטנציאל ההוכחתי הגולמי האצור בחומר החקירה.","question":"מהי הגדרתן המדויקת של \"ראיות לכאורה\" לצורך מעצר עד תום ההליכים, וכיצד על בית המשפט להעריך סתירות ופגמים בחומר הראיות בשלב זה?","ruling":"נקבעה הלכת זאדה המכוננת, המגדירה את מבחן הראיות לכאורה.","halacha":"ראיות לכאורה הן ראיות גולמיות שלגביהן קיים סיכוי סביר שתהפוכנה בסוף ההליך לראיות רגילות שעל פיהן ניתן להרשיע מעבר לספק סביר. בית המשפט אינו קובע מהימנות בשלב זה — רק אם נפער בחומר הראיות \"חור שחור\" או כרסום מהותי היורד לשורש העניין, תישלל קיומן של ראיות לכאורה.","status":"לא הושלם אימות פרטני","currency":"לא אומת עדכון מעבר למקורות הקורס"},{"name":"עימאד גנימאת נגד מדינת ישראל","cite":"דנ\"פ 2316/95 — מפי הנשיא מאיר שמגר והשופט אהרן ברק","facts":"גנימאת הועמד לדין בגין עבירות רכוש מרובות של גניבת כלי רכב. התביעה ביקשה לעוצרו עד תום ההליכים בטענה שמדובר ב\"מכת מדינה\" המקימה עילת מעצר עצמאית.","claimant":"בעקבות חוק יסוד כבוד האדם וחירותו, חומרת העבירה כשלעצמה או היותה \"מכת מדינה\" אינן מהוות עילת מעצר עצמאית — חובה לבחון את מסוכנותו האישית של הנאשם הספציפי.","respondent":"הפגיעה הרכושית הקשה והיקף התופעה של גניבות רכב מחייבים הגנה על הציבור באמצעות מעצר עד תום ההליכים.","question":"האם חומרת העבירה או היותה \"מכת מדינה\" מקימות עילת מעצר עצמאית עד תום ההליכים, וכיצד משפיע חוק יסוד כבוד האדם וחירותו על דיני המעצרים?","ruling":"בדיון הנוסף נקבעה הלכה חוקתית מכוננת בדיני המעצרים.","halacha":"חומרת העבירה כשלעצמה או היותה \"מכת מדינה\" אינן מהוות עילת מעצר עצמאית. חוק יסוד כבוד האדם וחירותו מחייב לבחון את המסוכנות האישית של הנאשם, וקיימת חובה חוקתית לבחון תמיד חלופת מעצר פחות פוגענית.\u003cp>\u003cb>השלמת A2: חומרת עבירה או תיוגה כ\"מכת מדינה\" אינם תחליף לבחינה קונקרטית של מסוכנות וחלופת מעצר.\u003c/b>\u003c/p>","status":"הושלם A2 על בסיס חומרי הקורס","currency":"לא אומת עדכון מעבר למקורות הקורס"},{"name":"מדינת ישראל נגד איבדיוב","cite":"בש\"פ 433/98","facts":"איבדיוב היה נתון במעצר עד תום ההליכים במשך תשעה חודשים מיום הגשת כתב האישום. משפטו התארך עקב בקשות דחייה של הסניגוריה והעומס השיפוטי. בחלוף תשעת החודשים דרש להשתחרר מיד לפי סעיף 61.","claimant":"חלוף תשעת החודשים מקים זכות חוקתית מוחלטת לשחרור ממעצר, ללא קשר לעובדה שהמשפט טרם הסתיים.","respondent":"העיכובים נגרמו בחלקם בעטיו של הנאשם, והמסוכנות הנשקפת ממנו מחייבת את הארכת מעצרו בעליון.","question":"כיצד נמנים תשעת החודשים לשחרור באין הכרעת דין לפי סעיף 61, ומהם השיקולים המנחים את בית המשפט העליון בהארכת מעצר מעבר לתקופה זו?","ruling":"בית המשפט העליון קבע את הלכת איבדיוב, המגדירה את אופן מניין התקופה.","halacha":"תקופת תשעת החודשים נמנית אך ורק מיום הגשת כתב האישום, ואינה כוללת ימי מעצר שקדמו לו; מניין הימים אינו חייב להיות רציף. בחלוף תשעה חודשים נקודת המוצא היא שחרור, והארכת מעצר בעליון תינתן במשורה תוך איזון בין קצב ההליך למסוכנות הנאשם.","status":"לא הושלם אימות פרטני","currency":"לא אומת עדכון מעבר למקורות הקורס"},{"name":"ילנה מורוזובה נגד מדינת ישראל","cite":"בש״פ 5142/99 — 22.11.1999","facts":"מורוזובה הואשמה ברצח בת זוגה. בהסדר טיעון הורשעה בהריגה ונגזרו עליה 11 שנות מאסר. לאחר שריצתה למעלה משלוש שנות מאסר, הותר לה בערעור לחזור מההודאה והתיק הוחזר למחוזי. נדרשה הכרעה מי מוסמך לדון במעצר וכיצד למנות את התקופות.","claimant":"הסנגוריה ביקשה לכלול גם את שנות המאסר במניין התקופה ולראות בסמכות ההארכה סמכות הנתונה לעליון; כן ביקשה שחרור בחלופה.","respondent":"המדינה הבחינה בין מעצר למאסר, וטענה שיש למנות את ימי המעצר המצטברים בגין אותו כתב אישום, בלי תקופת המאסר.","question":"האם החזרת התיק פותחת תשעה חודשי מעצר חדשים, והאם המאסר שכבר רוּצה נכלל במניין?","reasoning":"דעת הרוב ראתה את המעצר לפני ביטול ההכרעה ולאחריה כמעצר בשל אותו כתב אישום. הגנת החירות ומגבלת הסמכות אינן מאפשרות לאפס את המניין בדרך פרשנית. לצד זאת, מעצר ומאסר כפופים למשטרים שונים ולכן המאסר אינו נספר לצורך מגבלת המעצר.","ruling":"הערר נדחה; ההכרעה העקרונית התקבלה ברוב דעות לפי דעת ביניש.","halacha":"ימי המעצר שלפני ההכרעה מצטרפים לימי המעצר לאחר החזרת התיק. אין איפוס אוטומטי. תקופת המאסר אינה כלולה במניין לצורך זה. צו מעצר שפקע אינו מתחדש מעצמו ונדרשת החלטת מעצר.\u003cp>\u003cb>השלמת A2: לאחר שינוי דיוני יש להבחין בין תקופות מעצר לבין תקופת מאסר וליישם את כלל המניין שאומת בחומר הקורס; אין להציג איפוס אוטומטי ללא בסיס.\u003c/b>\u003c/p>","dissent":"קדמי, שאליו הצטרפו מצא וטירקל, תמך בתפיסה של חטיבת דיון חדשה ומניין חדש. זו אינה דעת הרוב.","source":"ילנה מורוזובה נ׳ מדינת ישראל.pdf — בש״פ 5142/99, פסקאות 10–12 לדעת ביניש וההכרעה הסופית","status":"הושלם A2 על בסיס חומרי הקורס","currency":"מוצגת ההלכה בפסק הדין שבמחברת; לא נבדקו שינויים מאוחרים מחוץ למחברת","exam":"מפרידים בין שלושה פרקי זמן: מעצר קודם, מאסר, ומעצר לאחר החזרת התיק. מונים במצטבר את פרקי המעצר, לא את המאסר."},{"name":"אלעוקה נגד מדינת ישראל","cite":"ע״פ 10683/08","facts":"ההליך עסק באמרות חוץ של עד שנמסרו במהלך חקירה ובשאלה אם ניתן להעדיפן על פני עדות שונה בבית המשפט.","claimant":"המערער טען לפסילת האמרות ולפגיעה ברצון החופשי באמצעות תחבולות חקירה.","respondent":"המדינה טענה שהאמרות עומדות בתנאי סעיף 10א ושהתחבולה לא שללה את הרצון החופשי.","question":"מתי ניתן לקבל אמרת חוץ של עד ומה גבולות תחבולת חקירה?","reasoning":"בית המשפט הפריד בין תנאי הקבילות המצטברים של סעיף 10א לבין שאלת המשקל, ובחן אם התחבולה חצתה את גבולות הרצון החופשי והגינות ההליך.","ruling":"הכלל שנלמד הוא שאין די בעצם קיומה של אמרה; יש לעמוד בתנאים המצטברים ולבחון את משקלה ואת נסיבות גבייתה.","halacha":"סעיף 10א דורש הוכחת האמרה, העדת מוסרה והזדמנות לחקירה, ושוני מהותי/הכחשה/אי־זכירה; תחבולה אינה פסולה כשלעצמה.","source":"אלעוקה נ' מדינת ישראל.pdf — ניתוח קבוצה C","status":"נוסף בעקבות Gap Analysis","currency":"מוצג לפי ניתוח המקור במחברת; לא נטענה קביעה בדבר שינוי מאוחר."},{"name":"חאתם פאיז אלמע׳ארי נגד התביעה הצבאית","cite":"חאתם פאיז אלמע׳ארי נ׳ התביעה הצבאית","facts":"ההליך עסק בהערכת מהימנות ובטענות הנוגעות להתנהלות התביעה.","claimant":"ההגנה תקפה את המשקל שניתן לעדות ואת הגינות ההתנהלות הדיונית.","respondent":"התביעה עמדה על כך שהערכת מהימנות מסורה לערכאה הדיונית ושאין במחדל נטען כדי להביא לתוצאה אוטומטית.","question":"כיצד מעריכים מהימנות ומה משמעותה של טענת חוסר הגינות?","reasoning":"ההערכה נעשית במכלול ובהנמקה; מחדל נבחן לפי השפעתו על ההגנה והוגנות ההליך.","ruling":"אין כלל אוטומטי הפוסל עדות או מבטל הליך; נדרשת בחינה קונקרטית של מהימנות, הסתירות והפגיעה הנטענת.","halacha":"סעיף 53 לפקודת הראיות הוא מסגרת להערכת מהימנות, לצד חובת הגינות התביעה.","source":"חאתם פאיז אלמע'ארי נ' התביעה הצבאית.pdf — ניתוח קבוצה C","status":"נוסף בעקבות Gap Analysis","currency":"מוצג לפי ניתוח המקור במחברת; לא נטענה קביעה בדבר שינוי מאוחר."},{"name":"יונתן אוריך נגד מדינת ישראל","cite":"דנ״פ 1062/21","facts":"ההליך עסק בחיפוש בטלפון ובחומר מחשב ובטענה שחיפוש מוקדם קדם לבקשת צו.","claimant":"ההגנה טענה שהחיפוש המוקדם פגם בתשתית ובצו וביקשה לבחון את הראיות בהתאם.","respondent":"המדינה טענה שיש לבחון בנפרד את מקור הסמכות ואת הראיות שהופקו מכוח הצו.","question":"כיצד מנתחים חיפוש בטלפון כאשר נטען לחיפוש בלתי חוקי שקדם לצו?","reasoning":"מפרידים בין תפיסת המכשיר, החיפוש המוקדם, תוקף הצו והראיות שהופקו; לאחר מכן מפעילים את האיזונים שנלמדו בדיני החיפוש והפסילה.","ruling":"סעיף 23א מחייב בחינה קונקרטית של מקור הסמכות והיקף החיפוש; תפיסת מכשיר אינה היתר לעיון גורף.","halacha":"חיפוש דיגיטלי דורש מקור סמכות והיקף מוגדר. פגם מוקדם אינו מוכרע אוטומטית אלא נבחן לפי חוקיות הפעולות והאיזונים הראייתיים.","source":"יונתן אוריך נ' מדינת ישראל.pdf — ניתוח קבוצה C","status":"נוסף בעקבות Gap Analysis","currency":"מוצג לפי ניתוח המקור במחברת; לא נטענה קביעה בדבר שינוי מאוחר."},{"name":"מדינת ישראל נגד המשיבים רון תורג׳מן","cite":"ע״פ 7014/06; בש״פ","facts":"ההליך עסק בבקשה לפרסם חומרי חקירה או תיעוד תקשורתי בזמן שההליך הפלילי טרם הסתיים.","claimant":"התקשורת ביקשה להגן על פומביות הדיון ועל עניין הציבור.","respondent":"המדינה והנחקרים טענו שפרסום מוקדם יפגע בפרטיות, בהגינות ההליך ובאיסור זיהום המשפט.","question":"כיצד מאזנים בין פומביות הדיון לבין איסור פרסום חומרי חקירה?","reasoning":"נבחנות עוצמת העניין הציבורי, שלב ההליך והסיכון הממשי לפגיעה בפרטיות, בעדים ובהגינות המשפט.","ruling":"פומביות וחופש הביטוי אינם מוחלטים; ניתן להגביל או לעכב פרסום כאשר נדרש להגן על ההליך ועל זכויות המעורבים.","halacha":"סעיף 70 לחוק בתי המשפט הוא מסגרת האיזון, ולא כלל של היתר או איסור מוחלט.","source":"מדינת ישראל נ' המשיבים רון תורג'מן.pdf — ניתוח קבוצה C","status":"נוסף במסגרת משותפת עם רשות השידור","currency":"מוצג לפי ניתוח המקור במחברת; לא נטענה קביעה בדבר שינוי מאוחר."},{"name":"רשות השידור נגד מדינת ישראל","cite":"בג״ץ 389/80","facts":"ההליך עסק בפרסום תקשורתי של חומרי חקירה ובהתנגשות בין פומביות לבין פרטיות והגינות ההליך.","claimant":"רשות השידור טענה לחשיבות הציבורית של חשיפת המידע.","respondent":"המדינה והמעורבים טענו שפרסום מוקדם עלול לפגוע בפרטיות, בעדים ובתקינות ההליך.","question":"מהו מבחן האיזון בבקשה לפרסם חומרי חקירה?","reasoning":"בית המשפט שקל את פומביות הדיון מול הפגיעה האפשרית בהליך הפלילי ובזכויות המעורבים.","ruling":"יש לערוך איזון זהיר וקונקרטי; פרסום מוקדם עשוי להיאסר או להידחות כאשר הוא מסכן את ההליך או את הפרטיות.","halacha":"הפסק משלים את תורג׳מן ומדגים את יישום סעיף 70 וחוקי היסוד על פרסום תקשורתי.","source":"רשות השידור נ' מדינת ישראל.pdf — ניתוח קבוצה C","status":"נוסף במסגרת משותפת עם תורג׳מן","currency":"מוצג לפי ניתוח המקור במחברת; לא נטענה קביעה בדבר שינוי מאוחר."}];
const LIMITATIONS_HTML = "\n  \u003cdiv class=\"panel\">\n    \u003cdiv class=\"eyebrow\">שיעור 6 · טענה מקדמית #6 · סעיף 9–10 לחסד\"פ\u003c/div>\n    \u003ch2>⏳ התיישנות — כל מה שצריך לדעת, בפשטות\u003c/h2>\n\n    \u003cp>ההתיישנות היא אחת משבע הטענות המקדמיות (סעיף 149(6) לחסד\"פ), אך יש לה שלושה \"ראשים\" נפרדים לגמרי, שקל להתבלבל ביניהם. זו הסיבה המרכזית ל\"בלגן\": \u003cb>לא מדובר בכלל אחד, אלא בשלושה נושאים שונים תחת אותה כותרת.\u003c/b>\u003c/p>\n\n    \u003cdiv class=\"scenario-row\" style=\"margin-top:16px;\">\n      \u003cspan class=\"verdict ok\">א\u003c/span>\n      \u003cdiv>\u003cb>התיישנות עבירות\u003c/b> — מתי כבר לא ניתן להעמיד לדין בשל חלוף הזמן מביצוע העבירה. זהו הראש המרכזי והמורכב ביותר.\u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"scenario-row\">\n      \u003cspan class=\"verdict ok\">ב\u003c/span>\n      \u003cdiv>\u003cb>התיישנות עבירות מין בקטינים\u003c/b> — כללים מיוחדים שדוחים את תחילת מניין הזמן, כדי לתת לקורבן זמן להתבגר לפני שהשעון \"מתחיל לרוץ\".\u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"scenario-row\">\n      \u003cspan class=\"verdict ok\">ג\u003c/span>\n      \u003cdiv>\u003cb>התיישנות עונשים\u003c/b> — נושא נפרד לגמרי: לא \"האם אפשר להעמיד לדין\", אלא \"האם אפשר עוד לבצע עונש שכבר נגזר\".\u003c/div>\n    \u003c/div>\n\n    \u003c!-- ============ SECTION A ============ -->\n    \u003cdiv class=\"lim-section-badge\">א. התיישנות עבירות — הכלל הבסיסי\u003c/div>\n    \u003cp>\u003cb>הרעיון:\u003c/b> ככל שעובר יותר זמן מביצוע העבירה, כך קשה יותר לברר את האמת (עדים שוכחים, ראיות נעלמות) וגם פוחת הצורך החברתי בענישה. לכן החוק קובע \"תאריך תפוגה\" להעמדה לדין — התלוי בחומרת העבירה.\u003c/p>\n\n    \u003ch3>כמה זמן יש? (סעיף 9 לחסד\"פ)\u003c/h3>\n    \u003cul>\n      \u003cli>\u003cb>פשע שדינו מיתה או מאסר עולם\u003c/b> — 30 שנים\u003c/li>\n      \u003cli>\u003cb>פשע חמור, דינו 7+ שנות מאסר ומנוי בתוספת לחוק\u003c/b> — 15 שנים\u003c/li>\n      \u003cli>\u003cb>פשע \"רגיל\"\u003c/b> (מעל 3 שנות מאסר, לא מהתוספת) — 10 שנים\u003c/li>\n      \u003cli>\u003cb>עוון\u003c/b> (מאסר 3 חודשים עד 3 שנים) — 5 שנים\u003c/li>\n      \u003cli>\u003cb>חטא\u003c/b> (מאסר עד 3 חודשים) — שנה אחת\u003c/li>\n    \u003c/ul>\n\n    \u003cdiv class=\"callout\">\n      \u003cspan class=\"callout-title\">חריג \"טכנולוגי\" — עדות DNA/טביעת אצבע/תצלום\u003c/span>\n      \u003cp>גם אחרי 15 שנה מיום ביצוע העבירה (ולא יותר מ-23 שנה מהמעשה), עדיין ניתן להעמיד חשוד לדין אם: (1) החשוד אותר רק אחרי 15 השנים; וגם (2) יש בידי הרשות ראיה ביומטרית (DNA, טביעת אצבע, או תצלום פנים) שיש בה יסוד סביר להוכיח את זהותו או את קשרו לעבירה.\u003c/p>\n    \u003c/div>\n\n    \u003ch3>עבירות שלעולם לא מתיישנות\u003c/h3>\n    \u003cp>רצח (לרבות בנסיבות מחמירות); עבירות לפי חוק מניעת פשע השמדת עם ולפי חוק עשיית דין בנאצים ובעוזריהם; ניסיון לרצח ראש ממשלה מכהן או קשירת קשר לכך.\u003c/p>\n\n    \u003ch3>מתי מתחיל השעון לרוץ?\u003c/h3>\n    \u003cp>\u003cb>הכלל:\u003c/b> מיום ביצוע העבירה. אם אדם נחקר על כמה עבירות שמהוות \"פרשה\" אחת — היום הקובע הוא יום ביצוע \u003cb>העבירה החמורה מביניהן\u003c/b>.\u003c/p>\n\n    \u003ch3>מה \"עוצר\" את השעון? — \"אירוע מנתק\"\u003c/h3>\n    \u003cp>זהו החלק הכי מבלבל, אז בואו נפשט: בעבירות פשע או עוון, שלושה סוגי אירועים \"מנתקים\" את מרוץ ההתיישנות — \u003cb>הליכי חקירה, הגשת כתב אישום, או הליך מטעם בית המשפט.\u003c/b> כשקורה אחד מהם, מרוץ ההתיישנות \u003cb>נפסק ומתחיל מחדש מאפס\u003c/b> בתום אותו אירוע.\u003c/p>\n\n    \u003cdiv class=\"callout warn\">\n      \u003cspan class=\"callout-title\">דגש למבחן — בעבירת חטא אין בכלל \"אירוע מנתק\"\u003c/span>\n      \u003cp>שימו לב: מושג ה\"אירוע מנתק\" חל \u003cb>רק על עבירות פשע ועוון\u003c/b>. בעבירת \u003cb>חטא\u003c/b>, שעון ההתיישנות של שנה אחת מתחיל ביום ביצוע העבירה ומסתיים בדיוק כעבור שנה — ללא שום קשר לפעולות המשטרה או התביעה. אפילו אם המשטרה חוקרת, מגישה כתב אישום, או שבית המשפט פועל — שום דבר לא \"מאפס\" את השעון בעבירת חטא.\u003c/p>\n    \u003c/div>\n\n    \u003cdiv class=\"callout warn\">\n      \u003cspan class=\"callout-title\">אבל — יש תקרה! (\"
