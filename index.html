/* V2: focused polish within the existing navy/ivory/gold/sage language. */
.mobile-search-toggle{display:none}
.drawer-subtitle{margin:3px 0 0;color:var(--muted);font-size:13px;line-height:1.35}
.study-progress{margin-top:17px;max-width:320px}
.study-progress span{display:block;color:#e7e0cc;font-weight:700;font-size:14px}
.study-progress progress{display:block;width:100%;height:9px;margin-top:6px;accent-color:var(--sage)}
.study-progress progress::-webkit-progress-value{background:var(--sage)}
.study-progress progress::-webkit-progress-bar{background:#fff9}
.resume-callout{display:flex;align-items:center;justify-content:space-between;gap:15px;margin:18px 0;padding:12px 17px;border-right:4px solid var(--sage);background:var(--pale);border-radius:8px}
.stats{grid-template-columns:repeat(3,minmax(0,1fr))}
.stat{box-shadow:none;border-color:#e9e8e4}
.stat-minor{display:none;background:transparent;border:0;box-shadow:none;padding-top:8px}
.stat-minor strong{font-size:22px}
.card{box-shadow:none;border-color:#e8e7e2;min-height:160px}
.grid4{gap:18px}
.section-title{margin-top:38px}
.text-action{border:0;padding:0;background:none;color:var(--navy);font-weight:800;min-height:44px;text-align:right}
.inline-link{margin:24px 0;padding-top:14px;border-top:1px solid var(--line)}
.advanced-options{margin:14px 0;border-top:1px solid var(--line);padding-top:9px}
.advanced-options summary{font-weight:800;color:var(--navy);cursor:pointer;min-height:44px;display:flex;align-items:center}
.advanced-options .setup-grid{padding-top:8px}
.topic-layout .content-block{box-shadow:none;border-color:#eceae4;margin-bottom:23px}
.topic-actions{margin:30px 0 10px;padding-top:20px;border-top:1px solid var(--line)}
.topic-actions .practice-before{border-color:var(--sage);color:var(--sage)}
.case-card{box-shadow:none}
.case-fields{gap:14px}
.case-field{border:0;background:#fafaf8}
.case-field.halacha,.case-field.exam-point{border-right:4px solid var(--gold);background:#f8f3e7;padding:18px}
.case-field.halacha h3,.case-field.exam-point h3{font-size:18px}
.case-field.exam-point{border-right-color:var(--sage);background:var(--pale)}
.question-card .meta-row .small.muted{display:none}
.chat-drawer button,.mobile-search-toggle{min-height:44px}
.case-return{display:inline-flex;flex-direction:column;align-items:flex-start;gap:2px;background:var(--navy);border:1px solid var(--navy);color:#fff;border-radius:9px;padding:9px 14px;text-decoration:none;font-weight:800;min-height:44px;justify-content:center;margin:0 0 16px}
.case-return:hover{background:var(--navy2);border-color:var(--navy2)}
.case-return:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.case-return-topic{font-size:12px;font-weight:600;color:#e6ce94}

/* V3: content richness + visual identity (design pass, 2026-09-26) */
:root{--rose:#8a4a52;--rose-bg:#f7ebe9;--teal:#2f6f78;--teal-bg:#eaf3f3;--plum:#5c4a78;--plum-bg:#f1edf6}

/* --- Callouts & highlighted notes (previously authored in content but unstyled) --- */
.callout{position:relative;margin:18px 0;padding:16px 20px;border-radius:11px;background:var(--pale);border-right:4px solid var(--sage)}
.callout-title{display:block;font-weight:800;color:var(--sage);font-size:14px;letter-spacing:.01em;margin-bottom:6px}
.callout p{margin:0}
.callout p+p{margin-top:8px}
.callout.warn{background:#fbf2dd;border-right-color:var(--gold)}
.callout.warn .callout-title{color:#8a6a1e}
.callout.case-callout{background:#eef2f7;border-right-color:var(--navy);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.callout.case-callout .callout-title{color:var(--navy);margin-bottom:0}

/* --- Worked examples --- */
.example-box{margin:18px 0;padding:16px 20px;border-radius:11px;background:var(--teal-bg);border:1px dashed var(--teal)}
.ex-title{display:block;font-weight:800;color:var(--teal);font-size:14px;margin-bottom:6px}

/* --- "Read more" expand link --- */
.expand-link{display:inline-flex;align-items:center;gap:6px;margin-top:14px;border:1px solid var(--gold);background:#fbf6ea;color:#7a5b1f;border-radius:20px;padding:7px 16px;font-weight:800;font-size:14px;min-height:40px;transition:transform .15s,box-shadow .15s,background .15s,color .15s}
.expand-link:hover{background:var(--gold);color:#20304a;box-shadow:0 4px 14px rgba(169,133,67,.35);transform:translateY(-1px)}

/* --- Procedural timeline --- */
.timeline{display:flex;align-items:flex-start;gap:0;margin:22px 0;overflow-x:auto;padding:6px 2px 10px}
.timeline-step{display:flex;flex-direction:column;align-items:center;min-width:112px;text-align:center;flex-shrink:0}
.timeline-date{font-weight:800;color:var(--navy);font-size:13px;margin-bottom:6px;white-space:nowrap}
.timeline-dot{width:16px;height:16px;border-radius:50%;background:var(--gold);border:3px solid #fff;box-shadow:0 0 0 2px var(--gold);flex-shrink:0}
.timeline-line{align-self:flex-start;margin-top:8px;flex:1 1 24px;height:3px;min-width:24px;background:linear-gradient(90deg,var(--gold),var(--sage))}
.timeline-label{font-size:13px;color:var(--muted);margin-top:8px;line-height:1.35;max-width:130px}

/* --- Scenario / verdict comparison rows --- */
.scenario-row{display:flex;align-items:center;gap:12px;margin:8px 0;padding:11px 15px;background:#fff;border:1px solid var(--line);border-radius:9px}
.verdict{font-weight:800;font-size:13px;border-radius:20px;padding:5px 13px;white-space:nowrap}
.verdict.ok{background:var(--pale);color:var(--sage)}
.verdict.need{background:var(--rose-bg);color:var(--rose)}

/* --- Section badges (e.g. limitations page) --- */
.lim-section-badge{display:inline-block;font-weight:800;color:#fff;background:var(--navy);border-radius:8px;padding:6px 14px;margin:24px 0 10px;font-size:15px}

/* --- Deep-dive "layer" wrappers inside expansions --- */
.release-layer{padding-top:4px}
.release-subtopic{margin:20px 0;padding:16px 18px;background:#fbfbf8;border:1px solid #ece9df;border-radius:12px}
.release-subtopic h3{margin-top:0;color:var(--navy)}
.presentation5-addition,.release-2a-addition{margin:20px 0;padding:16px 18px;background:var(--plum-bg);border-right:4px solid var(--plum);border-radius:11px}
.presentation5-addition h3,.release-2a-addition h3{margin-top:0;color:var(--plum)}

/* --- Optional / not-for-exam enrichment --- */
.enrichment{margin:16px 0;border:1px dashed var(--line);border-radius:10px;padding:2px 16px;background:#fcfcfa}
.enrichment summary{cursor:pointer;font-weight:700;color:var(--muted);padding:11px 0;min-height:44px;display:flex;align-items:center}
.enrichment[open] summary{color:var(--navy)}
.enrichment[open]{padding-bottom:12px}

/* --- Content typography polish --- */
.content-block{line-height:1.72}
.content-block p{margin:0 0 14px}
.content-block ul,.content-block ol{padding-inline-start:22px;margin:0 0 14px}
.content-block li{margin-bottom:6px}
.content-block strong,.content-block b{color:var(--navy)}
.content-block h3{color:var(--navy);font-size:19px;margin:28px 0 10px}
.content-block h2{margin-bottom:12px}

/* --- Interactive polish: cards & buttons --- */
.button,.button-quiet,.chip{transition:transform .12s,box-shadow .12s,filter .12s}
.button:hover,.chip:hover{transform:translateY(-1px)}
.card{transition:transform .15s,box-shadow .15s}
.card:hover{transform:translateY(-3px);box-shadow:0 16px 34px rgba(20,38,65,.12)}
.hero{background:linear-gradient(135deg,var(--navy) 0%,var(--navy2) 100%)}

/* --- Topic-group visual identity: colored accent per group, no more flat-white cards --- */
.section-title.topic-group-heading{display:flex;align-items:center;justify-content:center;gap:12px;font:800 26px/1.3 'Frank Ruhl Libre',serif;color:var(--navy);padding-bottom:12px;border-bottom:2px solid var(--line);text-align:center}

עשה לי שאלה">עשה לי שאלה</button><button type="button" data-prompt="מה חשוב למבחן?">מה חשוב למבחן?</button></div><div class="chat-ask-row"><label for="chat-input">שאל את מחברת הקורס</label><div class="chat-ask-inputs"><textarea id="chat-input" rows="2" placeholder="הקלד/י כאן את השאלה שלך על חומרי הקורס..."></textarea><button type="button" id="send-chat">שלח שאלה</button></div><p class="chat-note">⚠ התשובה ניתנת אך ורק על סמך חומרי הקורס (מחברת NotebookLM) — ללא מקורות חיצוניים.</p></div><div id="chat-history" class="chat-history" role="log" aria-live="polite"></div><div class="chat-sources"><button type="button" data-open-notebook>לעבודה מעמיקה → מחברת הקורס</button></div></aside><div id="screen" hidden></div><div id="toast" role="status" aria-live="polite"></div><footer>דיון פלילי · סביבת למידה לחברי הקורס</footer><script>const EXPANSIONS = {"circles":{"title":"שלושת המעגלים של התיק הפלילי","html":"\n      <div class=\"eyebrow\">יסודות</div>\n      <h2>שלושת המעגלים המרכיבים את התיק הפלילי</h2>\n      <p>ההליך הפלילי הוא הליך מעשי ודינמי שמטרתו להקנות לנו ארגז כלים שלם לניהול תיק פלילי בבית המשפט. בניגוד לעולם האזרחי, התיק הפלילי לא מתחיל בבית המשפט — הוא מתחיל הרבה קודם, ברגע שנפתחת חקירת משטרה. כל תיק פלילי בנוי משלושה מעגלים שלובים, שחשיבותם זהה לגמרי:</p>\n      <ul>\n        <li><b>דיני העונשין (הדין המהותי)</b> — עוסק בשאלת האחריות הפלילית עצמה: להרשיע או לזכות. בית המשפט בוחן אם הוכחו מעבר לספק סביר כל יסודות העבירה — היסוד העובדתי (התנהגות, נסיבות, ותוצאה בעבירות תוצאתיות) והיסוד הנפשי (כוונה, פזיזות או רשלנות). בעבירת הרצח, למשל, ה\"התנהגות\" היא הגרימה, ה\"תוצאה\" היא מותו של אדם, וה\"נסיבה\" היא שמדובר באדם — אם נגרם מותה של חיה, זו פשוט לא אותה עבירה.</li>\n        <li><b>דיני הראיות (הדין הקדם־דיוני)</b> — עוסק בשתי שאלות ליבה: שאלת הקבילות (האם הראיה בכלל רשאית להיכנס לבית המשפט — למשל בדיקת פוליגרף אינה קבילה בכלל במשפט פלילי), ושאלת המשקל (מה ערכה הראייתי של ראיה שכן קבילה — למשל עדות מומחה בליסטיקה המזהה קליע ספציפי, או עדות טביעות אצבע ו-DNA, לעומת עדות ראייה רגילה).</li>\n        <li><b>סדרי הדין (הדין הפרוצדורלי)</b> — כללי המשחק לניהול ההליך: מעצר, עיכוב, וחיפוש בגוף (לרבות ההבחנה בין חיפוש חיצוני לחיפוש פנימי, כגון צילום רנטגן או הפשטה מלאה), ועד ניהול הדיונים בבית המשפט. חשוב שלא \"לערבב בשר בחלב\" בין העולם האזרחי לפלילי — אלו מערכות כללים שונות לחלוטין.</li>\n      </ul>\n      <h3>שרשרת המוצג — למה זה קריטי</h3>\n      <p>שאלת המשקל קשורה למושג <b>שרשרת המוצג</b>: הוכחה מדויקת של המסלול שעברה הראיה מזירת העבירה ועד הגשתה בבית המשפט, כדי לוודא שלא הושפעה מגורמים חיצוניים. דוגמה קלאסית: מה קורה כשדגימת DNA נזרקת בניידת משטרה ונשארת שם בחום של 40 מעלות בחוץ? המומחה יידרש להסביר זאת בבית המשפט, וזה ישפיע ישירות על משקל הראיה.</p>\n      <div class=\"callout\"><span class=\"callout-title\">מקרה מהשטח — הוכחת רצח בלי גופה</span><p>איך מוכיחים את \"התוצאה\" של רצח כשאין גופה? במקרה שליווה את המרצה מתקופת שירותו במשטרה, גופתה של קורבן לא נמצאה מעולם. בזירה נמצא שטיח עם כתם דם ענקי, וחוות דעת פתולוג קבעה שאיבוד דם בהיקף כזה אינו מותיר אפשרות לשרוד. עדות מומחה זו שכנעה את בית המשפט שהתגבשה התוצאה של מוות, חרף היעדר הגופה — וכך הורשעו הנאשמים ברצח.</p></div>\n      <h3>דין מהותי מול דין דיוני</h3>\n      <p>לכלל מהותי <b>אין תחולה רטרואקטיבית</b> — לא ניתן להעניש על מעשה שלא היה עבירה בזמן ביצועו. החריג המקל מעוגן בסעיפים 4–5 לחוק העונשין: שינוי מקל בחוק לטובת הנאשם חל באופן רטרואקטיבי ומיידי. חריג נוסף: חוק עשיית דין בנאצים ובעוזריהם — חוק מהותי שהוחל באופן רטרואקטיבי מטעמי צדק היסטורי. לעומת זאת, לכלל דיוני <b>יש תחולה רטרואקטיבית ומיידית</b> גם על הליכים תלויים ועומדים, שכן הוא לא יוצר אחריות פלילית חדשה אלא רק קובע כיצד מבררים אותה — וניתן לסטות ממנו כל עוד לא נגרם עיוות דין.</p>\n      <h3>רף ההוכחה: אזרחי מול פלילי</h3>\n      <p>במשפט <b>האזרחי</b> הרף הוא מאזן ההסתברויות — הוכחה ברמה של מעל 50%, ויש הלכה מפורשת של בית המשפט העליון הקובעת שהרף הוא 50% ומעלה. במשפט <b>הפלילי</b> הרף הוא מעבר לכל ספק סביר, ובניגוד לעולם האזרחי — הפסיקה מעולם לא הגדירה לכך מספר מדויק. כשהמרצה משתמש במספרים כמו 97–98%, זהו כלי פדגוגי בלבד להמחשת החומרה שבהרשעת חף מפשע. הנאשם לא צריך להוכיח את חפותו — רק \"לכרסם\" בתיק התביעה ולהוריד את רמת הוודאות של השופט, וזה מוביל לזיכוי מחמת הספק.</p>\n      <div class=\"callout case-callout\"><span class=\"callout-title\">קשור לפסק דין</span><button class=\"case-link\" data-case=\"0\">⚖ פרדריק וילאם סילוסטר נגד היועץ המשפטי לממשלה (1948)</button></div>\n    \n      <h3>המחשה מספרית לרף ההוכחה</h3>\n      <div class=\"example-box\">\n        <span class=\"ex-title\">💡 למה אין מספר מדויק?</span>\n        <p>נניח שהיה קיים מספר רשמי, למשל 90% ודאות. תובע שמגיע ל-89% היה צריך לזכות אוטומטית, גם אם ברור לחלוטין שהנאשם אשם — תוצאה אבסורדית. לכן הפסיקה משאירה זאת כמבחן איכותי (\"ספק סביר\"), לא כמותי. ה-97–98% שהמרצה מזכיר הוא כלי המחשה בלבד, לא סף משפטי.</p>\n      </div>\n      <div class=\"scenario-row\"><span class=\"verdict ok\">אזרחי</span><div>מאזן הסתברויות — מעל 50% (הלכה מפורשת: 50% ומעלה)</div></div>\n      <div class=\"scenario-row\"><span class=\"verdict need\">פלילי</span><div>מעבר לספק סביר — ללא אחוז מוגדר בפסיקה</div></div>\n"},"adversarial":{"title":"אדברסרית מול אינקוויזיטורית","html":"<div class=\"eyebrow\">שיעור 1</div><h2>השיטה האדברסרית — מודל והסתייגות</h2><p>המרצה הציג את השיטה האדברסרית כשיטה שבה הצדדים מנהלים את הבאת הראיות והטיעון, והשופט מכריע. הוא הדגיש שאין מדינה הפועלת לפי מודל טהור לחלוטין: בישראל השיטה בעיקרה אדברסרית, לצד חריגים.</p><p>החריג שנלמד הוא סעיף 167, המאפשר לבית המשפט להביא ראיה מיוזמתו לאחר שהצדדים סיימו את ראיותיהם, במקרים המתאימים.</p>"},"packer":{"title":"שני המודלים של הרברט פקר","html":"\n      <div class=\"eyebrow\">תיאוריה</div>\n      <h2>שני מודלים למשפט הפלילי — הרברט פקר</h2>\n      <ul>\n        <li><b>מודל מיגור הפשיעה (Crime Control)</b> — המדינה תעשה כל שביכולתה כדי להילחם בפשע ולהגיע לחקר האמת, גם במחיר פגיעה מסוימת בזכויות חשודים ונאשמים. המטרה מקדשת את האמצעים, ונותנים למשטרה יד חופשית יחסית.</li>\n        <li><b>מודל ההליך הראוי (Due Process)</b> — המטרה אינה מקדשת את האמצעים: זכויות החשוד והנאשם הן ערך עליון, ויש לשמור עליהן בקנאות גם במחיר פגיעה ביעילות המלחמה בפשיעה.</li>\n      </ul>\n      <h3>הביטוי הראייתי למתח שבין המודלים</h3>\n      <p><b>בארה\"ב</b> חלה דוקטרינת \"פירות העץ המורעל\" — ראיה שהושגה שלא כדין, וכל מה שהתגלה בעקבותיה, נפסלת אוטומטית וקטגורית. <b>בישראל</b> המערכת קרובה יותר, באופן כללי, למודל מיגור הפשיעה, ובית המשפט העליון הבהיר במפורש כי אינו מאמץ את דוקטרינת פירות העץ המורעל במלואה. במקומה, בהלכת יששכרוב נקבעה דוקטרינת <b>הפסילה הפסיקתית היחסית</b> — שיקול דעת של בית המשפט לפסול ראיה שהושגה שלא כדין לפי איזון אינטרסים, ולא פסילה אוטומטית.</p>\n      <div class=\"callout case-callout\"><span class=\"callout-title\">קשור לפסק דין</span><button class=\"case-link\" data-case=\"25\">⚖ רפאל יששכרוב נגד התובע הצבאי הראשי</button></div>\n      <div class=\"callout case-callout\"><span class=\"callout-title\">קשור לפסק דין</span><button class=\"case-link\" data-case=\"2\">⚖ אברהם בן חיים נגד מדינת ישראל</button></div>\n    \n      <h3>אותו מצב, שתי מערכות</h3>\n      <div class=\"example-box\">\n        <span class=\"ex-title\">💡 דוגמה — סכין שנמצאה בחיפוש פסול</span>\n        <p>נניח ששוטר חיפש על גופו של אזרח ללא חשד סביר וללא שהבהיר לו את זכותו לסרב. בארה\"ב, פירות העץ המורעל היו פוסלים את הסכין אוטומטית וקטגורית. בישראל (הלכת בן חיים), בית המשפט בוחן לפי מבחן איזון — ובמקרה זה אכן פסל, אך זו תוצאה של שקילה, לא כלל אוטומטי.</p>\n      </div>\n<section class=\"release-2a-addition\"><h3>הרחבת שיעור 9 — exclusionary rule issacharov</h3><h4>📚 דוקטרינת הפסילה הפסיקתית היחסית וההבחנה מ\"פירות העץ המורעל\" (הלכת יששכרוב)</h4><p>---</p><h4>1. תקציר הנושא</h4><p>הכלל המרכזי: המשפט הפלילי בישראל לא אימץ את דוקטרינת \"פירות העץ המורעל\" האמריקאית, ולפיה ראיה שהושגה שלא כדין נפסלת אוטומטית יחד עם כל הראיות הנגזרות ממנה. תחת זאת, נקבעה בהלכת יששכרוב \"דוקטרינת הפסילה הפסיקתית היחסית\", המעניקה לבית המשפט שיקול דעת לפסול ראיה שהושגה שלא כדין בהתאם לאיזון בין שלוש קבוצות שיקולים מרכזיות.</p><p>התנאים המרכזיים (שלוש קבוצות השיקולים בפסילה יחסית):</p><p>1. אופיה וחומרתה של אי-החוקיות: בחינת עוצמת הפגיעה בזכות, חומרת מעשה הרשות, ותום לב מול זדון של רשויות האכיפה.</p><p>2. סוג הראיה: הבחנה בין ראיה המושפעת מאי-החוקיות (כגון הודאה שנמסרה תוך שלילת זכות היוועצות) לבין ראיה בעלת ערך עצמאי שאינה מושפעת מאי-החוקיות (כגון ראיה חפצית/פורנזית).</p><p>3. הנזק מול התועלת החברתיים: איזון בין זיהום ההליך הפלילי בראיה פסולה לבין הפגיעה באינטרס הציבורי ובהגנה על הציבור שבהסרת הראיה.</p><p>החריג המרכזי (שלושת חריגי הפסילה הסטטוטוריים הקשיחים בחוק):</p><p>1. סעיף 13 לחוק האזנת סתר: ראיה שהושגה בהאזנת סתר שלא כדין אינה קבילה.</p><p>2. סעיף 32 לחוק הגנת הפרטיות: ראיה שהושגה תוך פגיעה בהגנת הפרטיות אינה קבילה.</p><p>3. סעיף 12 לפקודת הראיות: הודית נאשם קבילה רק אם ניתנה מרצון ובאופן חופשי.</p><p>סמכות או מועד חשוב:</p><p>לבית המשפט מוקנית סמכות ושיקול דעת שיפוטי רחב להכריע האם לפסול ראיה שהושגה שלא כדין, להכשירה, או ליתן לה משקל נמוך.</p><p>הבחנה חשובה: הבחנה בין הדוקטרינה האמריקאית הקשיחה (\"פירות העץ המורעל\" וזכויות מירנדה) הפוסלת ראיות באופן אוטומטי ובלא שיקול דעת, לבין הדוקטרינה הישראלית היחסית המעניקה שיקול דעת שיפוטי רחב לאיזון בין השיקולים בכל מקרה לגופו.</p><p>נקודת מבחן מרכזית: שלילת זכות ההיוועצות בעורך דין מטעם המשטרה/מצ\"ח בזדון הופכת את הודאת החשוד לראיה מושפעת ומביאה לפסילתה מכוח הלכת יששכרוב.</p><p>---</p><h4>2. קריאה מורחבת</h4><h4>א. מקור נורמטיבי וסעיפי חוק</h4><p>פסיקת בית המשפט העליון: ע\"פ 5121/98 רפאל יששכרוב נ' התובע הצבאי.</p><p>פקודת הראיות [נוסח חדש], התשל\"א-1971: סעיף 12 (קבילות הודית נאשם מרצון ובאופן חופשי).</p><p>חוק האזנת סתר, התשל\"ט-1979: סעיף 13 (אי-קבילות ראיה מהאזנת סתר שלא כדין).</p><p>חוק הגנת הפרטיות, התשמ\"א-1981: סעיף 32 (אי-קבילות ראיה שהושגה תוך פגיעה בפרטיות).</p><h4>ב. הכלל המשפטי והחריגים בחוק</h4><p>הכלל בישראל: בישראל, קיומה של אי-חוקיות בהשגת ראיה אינו מוביל לפסילתה האוטומטית.</p><p>החריגים הסטטוטוריים: רק בשלושה מקרים בודדים בחוק נקבעה אי-קבילות קשיחה ומוחלטת לראיה שהושגה שלא כדין: האזנת סתר שלא כדין (סעיף 13), פגיעה בהגנת הפרטיות (סעיף 32), והודאה שלא ניתנה מרצון חופשי לפי סעיף 12 לפקודת הראיות.</p><p>הסינון לפי הלכת יששכרוב: בכל שאר המקרים שבהם המדינה השיגה ראיה בפעולה אסורה או בלתי חוקית, הראיה מועברת דרך \"המסננת\" של הלכת יששכרוב לבחינת קבילותה.</p><h4>ג. שתי ההלכות המרכזיות שנקבעו בהלכת יששכרוב</h4><p>1. הלכה ראשונה: כלל הפסלות הפסיקתי היחסי:</p><p>מעניק לבית המשפט שיקול דעת לפסול ראיה שהושגה שלא כדין בהתאם לשלוש קבוצות שיקולים:</p><p>קבוצה 1 – אופיה וחומרתה של אי-החוקיות: בוחנים עד כמה חמור היה המעשה הבלתי חוקי של רשויות האכיפה, איזו זכות נפגעה, והאם הרשויות פגעו בזכות בזדון או בתום לב.</p><p>קבוצה 2 – סוג הראיה (ראיה מושפעת מול ראיה עצמאית): בוחנים האם הראיה מושפעת מאי-החוקיות (כגון הודאה שנמסרה עקב מניעת היוועצות בעורך דין) או בעלת ערך עצמאי שתוכנה לא ישתנה (כגון ראיות פורנזיות, DNA, תביעות אצבע, או הקלטת וידאו עצמאית). ראיה מושפעת מטה את הכף לפסילה; ראיה עצמאית מטה את הכף להכשרה.</p><p>קבוצה 3 – הנזק מול התועלת החברתיים: איזון מוסרי ומשפטי – מה חמור יותר: לזהם את ההליך הפלילי בראיה שהושגה בדרך פסולה, או לפגוע באינטרס הציבורי שבהגנה על החברה מפני הנאשם והעבירה.</p><p>(הערה לימודית: קבוצת שיקולים רביעית שהופיעה במקור בפס\"ד יששכרוב בוטלה בפסק דין אלעוקה, ולכן אינה נלמדת עוד).</p><p>2. הלכה שנייה: הרחבת הפרשנות של סעיף 12 לפקודת הראיות:</p><p>עובר להלכת יששכרוב, סעיף 12 פורש כבא להגן אך ורק על אמיתות ההודעה במקרים שבהם הופעלה אלימות פיזית או מילולית על הנחקר.</p><p>השופטת דורית ביניש קבעה בדעת הרוב כי יש לפרש את סעיף 12 ברוח חוקי היסוד, כך שהסעיף מגן לא רק על אמיתות ההודעה אלא גם על האוטונומיה של הרצון החופשי של החשוד.</p><p>פגיעה קשה ביכולתו של החשוד להחליט באופן חופשי אם להודות או לא (גם ללא אלימות פיזית) תביא לפסילת ההודאה מכוח סעיף 12.</p><h4>ד. דוגמאות המרצה</h4><p>1. דוגמת דוקטרינת \"פירות העץ המורעל\" בארה\"ב:</p><p>שוטר אמריקאי נכנס לבית של אביב ללא צו חיפוש ומצא סמים. אביב טען שהסמים שייכים לאימנואל. המשטרה עצרה את אימנואל, וזה הפנה אותה ליצרנית הסמים סיוון. המשטרה הוציאה צו ופשטה על המעבדה של סיוון.</p><p>היישום בארה\"ב: כיוון שהחיפוש הראשוני בבית של אביב היה בלתי חוקי (\"השורש מורעל\"), כל השרשרת הראייתית שצמחה ממנו (עדויות אימנואל וסיוון והסמים שנתפסו) קורסת ונפסלת אוטומטית (Exclusionary Rule).</p><p>2. דוגמת פרשת מירנדה (Miranda v. Arizona, 1966):</p><p>ארנסטו מירנדה נעצר בפיניקס אריזונה בחשד לחטיפה, אונס ושוד. מירנדה לא ידע על זכות השתיקה והזכות נגד הפללה עצמית (התיקון החמישי והשישי לחוקה) והודה.</p><p>הכרעת בית המשפט הפדרלי (השופט ארל וורן): פסילת ההודאה כיוון שהושגה ללא אזהרה בדבר \"זכויות מירנדה\", והוראה על משפט חוזר.</p><p>3. דוגמת המצלמה שהותקנה בטעות בדירה הלא נכונה:</p><p>שוטר קיבל צו חיפוש להתקנת מצלמות סמויות ברוטשילד 15 דירה 11. בשל טעות בתום לב, התקין את המצלמות בדירה 15 וצילם את אביב סוחר בסמים.</p><p>היישום לפי יששכרוב: מדובר בטעות בתום לב (קבוצה 1) וההקלטה היא ראיה עצמאית שאינה מושפעת מאי-החוקיות (קבוצה 2). לפיכך הכף תיטה שלא לפסול את ההקלטה.</p><p>4. דוגמת הפגיעה באוטונומיה לפי סעיף 12:</p><p>חוקר אומר לחשודה באזיקים \"תודי ואני אשחרר אותך\". אמירה זו פוגעת באוטונומיה של הרצון החופשי, שכן החשודה עשויה להודות רק כדי להשתחרר מהאזיקים, והדבר פוסל את ההודאה.</p><h4>ה. משמעות מעשית למבחן</h4><p>בפתרון קייס במבחן:</p><p>1. אין לטעון לפסילה אוטומטית מכוח \"פירות העץ המורעל\", אלא ליישם את ניתוח יששכרוב.</p><p>2. יש להבחין האם הראיה נופלת לאחד משלושת החריגים הסטטוטוריים הקשיחים.</p><p>3. יש ליישם באופן סדור את שלוש קבוצות השיקולים: לבחון את תום הלב/זדון הרשות, לסווג את הראיה כראיה מושפעת או עצמאית, ולאזן את הנזק מול התועלת החברתיים.</p><p>---</p><h4>3. הרחבה מקיפה</h4><h4>א. ניתוח מעמיק של פסק דין יששכרוב (עובדות, ניתוח ויישום)</h4><p>עובדות המקרה:</p><p>בשנת 1996, טוראי רפאל יששכרוב נכלוא בכלא צבאי בגין עבירת נפקדות.</p><p>במהלך הליך הקליטה בכלא התבקש להתפשט, ומהתחתונים שלו נפלה חבילה קטנה. יששכרוב שים עליה את הרגל ואמר \"זה גראס אני יכול להסביר\".</p><p>כ-3 שעות לאחר מכן נחקר בידי חוקר מצ\"ח (משטרה צבאית חוקרת). בחקירה תחת אזהרה הודה יששכרוב לא רק בהחזקת הגראס שנתפס, אלא מסר הודעה מפורטת על שימוש והחזקת סמים בהזדמנויות רבות נוספות במהלך שירותו הצבאי.</p><p>הפגם בחקירה: החוקר הצבאי הודיע ליששכרוב על זכותו להיוועץ בעורך דין רק בתום החקירה, ולאחר שכבר מסר את כל ההודאה המפלילה והודע לו שהוא עצור.</p><p>למחרת נועץ בסנגורית צבאית, ובחקירתו השנייה שמר על זכות השתיקה. נגדו הוגש כתב אישום בגין השימוש וההחזקה בסמים במהלך השירות.</p><p>הניתוח והיישום של שלוש קבוצות השיקולים על עובדות יששכרוב:</p><p>1. קבוצה 1 (אופי אי-החוקיות וחומרתה): בית המשפט העליון קבע כי הפגיעה בזכות ההיוועצות הייתה חמורה ביותר ונעשתה בזדון / בחוסר תום לב מצד חוקרי מצ\"ח. החוקרים נמנעו במכוון מלהודיע לו על זכותו כדי שלא יבקש עורך דין וישתוק.</p><p>2. קבוצה 2 (סוג הראיה): הודאתו של יששכרוב לגבי שימושים קודמים בסמים היא ראיה מושפעת מאי-החוקיות. אילו היו מודיעים לו על זכות ההיוועצות מראש, הוא היה נועץ בסנגור ושומר על שתיקה.</p><p>3. קבוצה 3 (נזק מול תועלת חברתיים): הנזק שיגרם מפסילת הראיה נמוך (שימוש עצמי בסמים קלים של חייל עריק), בעוד הנזק מזיהום ההליך הפלילי בראיה שהושגה תוך שלילת זכות יסוד הוא חמור ביותר.</p><p>הכרעת בית המשפט העליון והתוצאה המשפטית:</p><p>בית המשפט העליון פסל את הודאתו של יששכרוב מכוח ההלכה הראשונה (כלל הפסלות הפסיקתי היחסי).</p><p>לגבי ההלכה השנייה (הרחבת סעיף 12), נקבע כי לא הייתה פגיעה קשה באוטונומיה הרצונית בנסיבות העניין, ולכן הפסילה לא בוצעה מכוח סעיף 12 אלא מכוח הכלל היחסי בלבד.</p><p>תוצאה פועלית: יששכרוב זוכה מכל עבירות השימוש וההחזקה הנוספות בהן הודה, והורשע אך ורק בעבירת ההחזקה של הסמים שנתפסו פיזית על גופו בעת החיפוש בכלא.</p><h4>ב. תפיסת העולם השיפוטית והבחנות עדינות</h4><p>שיקול דעת שיפוטי רחב (תורת ברק וביניש): פסק דין יששכרוב ניסח את כלל הפסלות בצורה שמעניקה מרחב תמרון ושיקול דעת נרחב לבתי המשפט הנמוכים לאזן בין קבוצות השיקולים בכל מקרה לגופו. זאת בניגוד לכלל הפורמליסטי והקשיח בארה\"ב שאינו מותיר שיקול דעת.</p><p>תחולה על קובלנה פרטית: האיזונים והכללים של הלכת יששכרוב חלים באופן זהה גם כאשר ההליך הפלילי אינו מנוהל בידי המדינה אלא בידי אדם פרטי במסגרת קובלנה פרטית.</p><h4>ג. מלכודות למבחן ודגשים מפורשים של המרצה</h4><p>1. חובת הכרת הלכת יששכרוב: המרצה מזהיר כי אי-הכרת הלכת יששכרוב על בוריה היא \"המסמר האחרון בארון הקבורה\" של כל מועמד בתחום הפלילי, וכי מדובר בהלכת יסוד קריטית.</p><p>2. ביטול קבוצת השיקולים הרביעית: במקור הופיעה בפס\"ד יששכרוב קבוצת שיקולים רביעית. המרצה מדגיש כי קבוצת שיקולים זו בוטלה בפסק דין אלעוקה, ואין לעשות בה שימוש במבחן.</p><p>3. מלכודת פסילה אוטומטית: במבחן, טענה כאילו ראיה שהושגה שלא כדין נפסלת אוטומטית בישראל היא טעות קשה!. הראיה נפסלת אוטומטית רק אם היא נופלת לאחד משלושת החריגים הסטטוטוריים (האזנת סתר, הגנת הפרטיות, סעיף 12), ואם לא – היא נבחנת בשיקול דעת לפי שלוש קבוצות השיקולים ביששכרוב.</p><p>4. סיווג הראיה (מושפעת מול עצמאית): ראיה חפצית או פורנזית שהייתה קיימת בכל מקרה ללא קשר לאי-החוקיות (כגון הקלטה, DNA, תביעות אצבע) תיטה להיקבל, בעוד הודאה או אמירה שחלצה מהנחקר עקב הפרת זכותו תיטה להיפסל.</p><p>---</p><h4>4. פסיקה וחקיקה</h4><h4>א. פסיקה שהוזכרה בנושא</h4><p>ע\"פ 5121/98 רפאל יששכרוב נ' התובע הצבאי (אוזכר בשיעור כ\"פסק דין יששכרוב / ססחררוב\"):</p><p>משמעות לנושא: פסק הדין המכונן שקבע את דוקטרינת הפסילה הפסיקתית היחסית (שלוש קבוצות שיקולים) ואת הרחבת הפרשנות של סעיף 12 לפקודת הראיות להגנה על אוטונומיית הרצון החופשי של הנחקר.</p><p>פסק דין אלעוקה:</p><p>משמעות לנושא: ביטל את קבוצת השיקולים הרביעית שהופיעה במקור בפסק דין יששכרוב.</p><p>פסק דין מירנדה נ' אריזונה (Miranda v. Arizona, 1966):</p><p>משמעות לנושא: פסק דין של בית המשפט העליון הפדרלי בארה\"ב (השופט ארל וורן) הקובע פסילה אוטומטית של הודאה שנגבתה ללא קריאת אזהרת זכויות מירנדה.</p><h4>ב. חקיקה שהוזכרה בנושא</h4><p>פקודת הראיות [נוסח חדש], התשל\"א-1971:</p><p>סעיף 12: קובע כי הודית נאשם קבילה רק אם ניתנה מרצון ובאופן חופשי.</p><p>חוק האזנת סתר, התשל\"ט-1979:</p><p>סעיף 13: קובע אי-קבילות של ראיה שהושגה בהאזנת סתר שלא כדין.</p><p>חוק הגנת הפרטיות, התשמ\"א-1981:</p><p>סעיף 32: קובע אי-קבילות של ראיה שהושגה תוך פגיעה בהגנת הפרטיות.</p><p>חוקת ארצות הברית:</p><p>התיקון החמישי והשישי: התיקון ה-5 מגן מפני הפללה עצמית (זכות השתיקה); התיקון ה-6 מגן על הזכות למשפט הוגן.</p><p>---</p><li>או לבחור כל נושא אחר מרשימת הנושאים של שיעור 9. במה תעדיף להתמקד?</li></section>"},"sec184":{"title":"סעיף 184 — הרשעה בעבירה שהתגלתה","html":"<div class=\"eyebrow\">חסד״פ</div><h2>סעיף 184 לחסד״פ והלכת דמיאניוק</h2><p>הסעיף מאפשר להרשיע בעבירה שאשמתו בה נתגלתה מן העובדות שהוכחו, אף אם היא שונה מן העבירה שבכתב האישום. לפי ההסבר בשיעור 1, נדרשים <b>שני תנאים מצטברים</b>: ניתנה לנאשם הזדמנות סבירה להתגונן מפני העבירה האחרת; ולא יוטל עליו בשל אותה עבירה עונש חמור מזה שהיה אפשר להטיל בשל העבירה המקורית.</p><div class=\"callout warn\"><span class=\"callout-title\">יישום בדמיאניוק</span><p>העובדה שהוכחה עבירה אחרת אינה מספיקה. המרצה הסביר כי דמיאניוק התגונן לאורך המשפט מפני האישום המסוים שיוחס לו, ולא מפני האישום החלופי; לכן לא הייתה לו הזדמנות סבירה להתגונן מפניו.</p></div><div class=\"callout case-callout\"><span class=\"callout-title\">קשור לפסק דין</span><button class=\"case-link\" data-case=\"3\">⚖ דמיאניוק נגד מדינת ישראל (1988)</button></div>"},"classify":{"title":"סיווג עבירות — סעיף 24","html":"\n      <div class=\"eyebrow\">חובה לבחינה</div>\n      <h2>סיווג העבירות — סעיף 24 לחוק העונשין</h2>\n      <div class=\"callout warn\"><span class=\"callout-title\">דגש למבחן</span><p>המרצה הדגיש שזהו שורש הדיון הפלילי — הבסיס לקביעת סמכויות מעצר וחיפוש!</p></div>\n      <ul>\n        <li><b>חטא</b> — העונש המרבי הוא מאסר עד 3 חודשים, או קנס בלבד.</li>\n        <li><b>עוון</b> — העונש המרבי עולה על 3 חודשים ואינו עולה על 3 שנים (כולל), או קנס בלבד.</li>\n        <li><b>פשע</b> — העונש המרבי עולה על 3 שנים, ועד עונש מוות.</li>\n      </ul>\n      <h3>סעיף 42 לחוק העונשין — כשאין תקופת מאסר קצובה</h3>\n      <p>אם לעבירה נקבע עונש מאסר אך <b>לא נקצבה</b> לה תקופה בחוק, העונש המקסימלי שבית המשפט מוסמך להטיל הוא שנה אחת — ומכאן שהיא מסווגת אוטומטית כ<b>עוון</b>.</p>\n      <p><b>מלכודת קלאסית:</b> עבירה שהעונש המרבי עליה הוא <b>בדיוק 3 שנים</b> מסווגת כ\"עוון\" — ורק מעל 3 שנים נחשבת \"פשע\". ההבחנה הזו קריטית כי היא משנה דרמטית את סמכויות המעצר והחיפוש.</p>\n    \n      <h3>דוגמאות מהחיים</h3>\n      <div class=\"scenario-row\"><span class=\"verdict ok\">חטא</span><div>עבירות תעבורה קלות, הפרעה לרעש בניגוד לחוק עזר</div></div>\n      <div class=\"scenario-row\"><span class=\"verdict ok\">עוון</span><div>תקיפה קלה, גניבה פשוטה</div></div>\n      <div class=\"scenario-row\"><span class=\"verdict need\">פשע</span><div>שוד, אונס, רצח, שוחד</div></div>\n"},"sec59":{"title":"תחילת ההליך הפלילי — סעיף 59","html":"\n      <div class=\"eyebrow\">חסד\"פ</div>\n      <h2>תחילת ההליך הפלילי — סעיף 59 לחסד\"פ</h2>\n      <p>נפתח כשנודע למשטרה על עבירה. חובה מוחלטת לרשום כל תלונה.</p>\n      <ul>\n        <li><b>פשע</b> — חובת חקירה מוחלטת. חריג: הלכת צדוק (תלונה מופרכת).</li>\n        <li><b>חטא/עוון</b> — קצין פקד+ רשאי שלא לחקור, משיקולי מדיניות או רשות אחרת מוסמכת.</li>\n      </ul>\n      <div class=\"callout case-callout\"><span class=\"callout-title\">קשור לפסק דין</span><button class=\"case-link\" data-case=\"4\">⚖ צדוק נגד ראש אגף חקירות ומודיעין (2007)</button></div>\n      <button class=\"expand-link\" data-topic=\"sec59\">🔎 קריאה מורחבת</button>\n    "},"bodies":{"title":"גופי התביעה — סעיף 60","html":"\n      <div class=\"eyebrow\">חלוקת עבודה</div>\n      <h2>גופי התביעה — חלוקת עבודה לפי סעיף 60</h2>\n      <p>ברגע שגוף החקירה מסיים לאסוף את הראיות, הוא מעביר את התיק אל יחידת התביעה המוסמכת. בישראל קיימים שני גופי תביעה מרכזיים המוסמכים להגיש כתבי אישום בשם המדינה:</p>\n      <ul>\n        <li><b>הפרקליטות (משרד המשפטים)</b> — מייצגת את המדינה בבתי המשפט המחוזיים והשלום דרך הפרקליטויות המחוזיות הפליליות, ומייצגת באופן בלעדי בבית המשפט העליון דרך פרקליטות המדינה. מטפלת בפשע חמור — רצח, אונס, שוחד, מרמה חמורה, עבירות ביטחון וצווארון לבן — וכן בעבירות עוון ספציפיות בעלות רגישות ציבורית מיוחדת, כגון גרימת מוות ברשלנות.</li>\n        <li><b>התביעה המשטרתית (יחידת התביעות של משטרת ישראל)</b> — מורכבת מתובעים משטרתיים המשרתים כקציני משטרה. מטפלת בפשע קל יותר — עבירות רכוש, אלימות קלה, סמים קלים — וברוב עבירות העוון והחטא, המכונות \"עבירות רחוב\".</li>\n      </ul>\n      <div class=\"callout warn\"><span class=\"callout-title\">נקודת מפתח למבחן — סמכות חריגה</span><p>פרקליט המחוז רשאי (מכוח סעיף 60(יא) לחסד\"פ) להורות על חריגה מחלוקת הטיפול הסטטוטורית — למשל למשוך תיק סמים קל לטיפול הפרקליטות, או להעביר תיק הונאה קל לתביעה המשטרתית. חריגה זו חוקית לחלוטין ולא תפסול את ההליך, ובלבד שלא נגרם עקב כך חוסר צדק או עיוות דין לנאשם.</p></div>\n      <h3>חוק ההמלצות (סעיף 60(יא), תיקון 2018)</h3>\n      <p>התיקון נועד למנוע פרסום המלצות אקטיביות להעמיד לדין חשודים — בפרט אנשי ציבור — לפני שהתביעה בחנה את התיק. שני כללים מרכזיים:</p>\n      <ul>\n        <li><b>איסור הבעת עמדה בכתב לגבי הגשת כתב אישום</b> — המשטרה אינה רשאית לצרף לתיק עמדה בכתב הממליצה להעמיד לדין (בעל־פה מותר לשוחח, אך בכתב חל איסור מוחלט). החריג: אם החקירה התנהלה ללא פרקליט מלווה והמשטרה סבורה שיש לסגור את התיק, מותר להעביר בכתב את עמדתה בדבר סגירתו.</li>\n        <li><b>חובת סיכום התשתית הראייתית</b> — המשטרה חייבת להביע בכתב עמדה לגבי מכלול הראיות שנאספו, מה כוחן הראייתי ואילו עדויות נגבו. החריג: אם ליווה את החקירה פרקליט מלווה מהרגע הראשון, אין חובה כזו — אלא אם ביקש זאת במפורש פרקליט המדינה או היועץ המשפטי לממשלה.</li>\n      </ul>\n    \n      <h3>מי מטפל במה — בקצרה</h3>\n      <div class=\"scenario-row\"><span class=\"verdict need\">פרקליטות</span><div>רצח, אונס, שוחד, ביטחוני, צווארון לבן, גרימת מוות ברשלנות</div></div>\n      <div class=\"scenario-row\"><span class=\"verdict ok\">תביעה משטרתית</span><div>רכוש קל, אלימות קלה, סמים קלים, רוב העוון/חטא (\"עבירות רחוב\")</div></div>\n"},"hearing":{"title":"זכות השימוע — סעיף 60א","html":"\n      <div class=\"eyebrow\">זכויות החשוד</div>\n      <h2>חובת היידוע וזכות השימוע — סעיף 60א</h2>\n      <p>זכות השימוע מאפשרת לחשוד לנסות למנוע את הגשת כתב האישום עוד לפני שנדבק בו הכתם הציבורי של \"נאשם\".</p>\n      <p><b>חובת היידוע:</b> ברגע שחומר החקירה מועבר לתביעה <b>בעבירה מסוג פשע בלבד</b>, חובה לשלוח לחשוד הודעה בכתב על כך. בעבירות עוון או חטא — החשוד כלל אינו זכאי למכתב יידוע.</p>\n      <p><b>זכות השימוע:</b> לחשוד עומדת הזכות לפנות לתובע בכתב, תוך <b>30 יום</b> מיום קבלת ההודעה, בבקשה מנומקת להימנע מהגשת כתב אישום.</p>\n      <div class=\"callout warn\"><span class=\"callout-title\">הבחנה חשובה למבחן</span><p>השימוע <b>בכתב</b> הוא זכות מוקנית וחובה. לעומת זאת, הזמנת החשוד או סנגורו להציג טיעונים <b>בעל־פה</b> היא סמכות רשות בלבד, בשיקול דעתה הבלעדי של התביעה.</p></div>\n      <h3>חריגים — מתי לא נשלח מכתב יידוע</h3>\n      <ul>\n        <li>החשוד היה נתון במעצר בעת העברת חומר החקירה, וכתב האישום הוגש נגדו במהלך תקופת המעצר</li>\n        <li>פרקליט המחוז או ראש יחידת התביעות החליט שקיימת מניעה מנהלית או ביטחונית</li>\n        <li>עבירות אלימות במשפחה כלפי בן זוג, או עבירות מין בתוך המשפחה — הרציונל: מניעת סכנה מיידית לקורבן, מחשש שקבלת מכתב היידוע בבית תצית אלימות מיידית כלפי בן הזוג או הקטין החיים עם החשוד</li>\n      </ul>\n      <div class=\"callout case-callout\"><span class=\"callout-title\">קשור לפסק דין</span><button class=\"case-link\" data-case=\"5\">⚖ שמואל נגד היועץ המשפטי לממשלה (2008)</button></div>\n    \n      <h3>ציר הזמן של השימוע</h3>\n      <div class=\"timeline\">\n        <div class=\"timeline-step\"><div class=\"timeline-date\">יום 0</div><div class=\"timeline-dot\"></div><div class=\"timeline-label\">תיק פשע<br>מגיע לתביעה</div></div>\n        <div class=\"timeline-line\"></div>\n        <div class=\"timeline-step\"><div class=\"timeline-date\">מיידי</div><div class=\"timeline-dot\"></div><div class=\"timeline-label\">מכתב יידוע<br>לחשוד</div></div>\n        <div class=\"timeline-line\"></div>\n        <div class=\"timeline-step\"><div class=\"timeline-date\">עד 30 יום</div><div class=\"timeline-dot end\"></div><div class=\"timeline-label\">שימוע בכתב<br>(חובה)</div></div>\n      </div>\n"},"closure":{"title":"עילות סגירת תיק — סעיף 62","html":"\n      <div class=\"eyebrow\">חסד\"פ</div>\n      <h2>עילות סגירת תיק — סעיף 62</h2>\n      <p>כשתובע מחליט שלא להעמיד לדין, עליו לסגור את התיק באחת משלוש עילות:</p>\n      <ul>\n        <li><b>חוסר ראיות מספיקות</b> — אף שקיים חשד סביר, אין סיכוי סביר להרשעה מעבר לספק סביר. נותר רישום פלילי.</li>\n        <li><b>נסיבות העניין בכללותן אינן מתאימות</b> (מכונה בשיעור \"עילת הקומבינה\") — קיימות ראיות מספיקות, אך משיקולי מדיניות ותועלת ציבורית התובע סבור שהאינטרס הציבורי אינו מצדיק ניהול משפט, למשל עבירה קלת ערך ביותר או נסיבות אישיות קשות של החשוד. נותר רישום פלילי, וסגירה בעילה זו טעונה אישור גורם בכיר אחד (ראו בהמשך).</li>\n        <li><b>חוסר אשמה</b> — אין כל ראיה הקושרת את החשוד לעבירה, או שהראיות מוכיחות פוזיטיבית שהוא חף מפשע (למשל אליבי מוחלט). זהו המקרה היחיד שבו הרישום נמחק לחלוטין וממחשבי המשטרה.</li>\n      </ul>\n      <div class=\"callout warn\"><span class=\"callout-title\">דגש חובה למבחן — חובת אישור מוגברת</span><p>בעילת \"נסיבות העניין\"/\"עילת הקומבינה\" קיימות ראיות והסגירה נובעת משיקולי מדיניות בלבד — ולכן קיים חשש לניצול לרעה. לפי המרצה, סגירה בעילה זו טעונה אישור בכתב של גורם בכיר אחד בלבד, בהתאם למסלול הטיפול בתיק: בתיק שמטופל בפרקליטות — פרקליט המחוז, או פרקליט בכיר שהוסמך לכך; בתיק שמטופל על ידי התביעה המשטרתית — ראש יחידת התביעות במשטרה, או תובע משטרתי בכיר. (אין לבלבל זאת עם מדרג האישורים השונה החל על החלטת שוטר/קצין שלא לפתוח כלל בחקירה לפי סעיף 59.)</p></div>\n      <div class=\"callout warn\"><span class=\"callout-title\">אל תבלבלו: סגירת תיק בהסדר מול עסקת טיעון</span><p>\"סגירת תיק בהסדר\" (סעיף 67א) היא הסדר לפני הגשת כתב אישום — לאחר תשלום, שירות לתועלת הציבור או תקופת מבחן, נסגר התיק ולא מוגש כתב אישום כלל. \"עסקת טיעון\" היא הסדר לאחר הגשת כתב אישום — הנאשם מודה תמורת אישום ו/או עונש מוסכם. לדברי המרצה, גם עורכי דין מתבלבלים בין השניים לעיתים — זו נקודת בלבול נפוצה שכדאי לשים לב אליה במבחן.</p></div>\n      <p><b>הודעה למתלונן ולחשוד ובקרה שיפוטית:</b> על הרשות להודיע בכתב על החלטה שלא להעמיד לדין — למתלונן בכל מקרה, ולחשוד/לנאשם בנוסף אם התיק כבר הגיע לטיפול התביעה. ניתן לפנות בבקשה לעיון חוזר במסגרת הרשות עצמה, ובסופו של דבר לעתור לבג\"ץ. היקף ההתערבות של בג\"ץ בהחלטות סגירת תיק צר מאוד, ומוגבל למקרים חריגים שבהם ההחלטה בלתי סבירה באופן קיצוני.</p>\n      <div class=\"callout case-callout\"><span class=\"callout-title\">קשור לפסק דין</span><button class=\"case-link\" data-case=\"6\">⚖ אפרים נוה נגד מדינת ישראל (2019)</button></div>\n      <h3>עד כמה בג\"ץ מתערב בהחלטות התביעה?</h3>\n      <p>שאלה נפרדת אך קשורה: מה קורה כשחשוד תוקף ישירות בבג\"ץ את החלטת התביעה להעמידו לדין (ולא רק עורר על סגירת תיק)?</p>\n      <div class=\"callout case-callout\"><span class=\"callout-title\">קשור לפסק דין</span><button class=\"case-link\" data-case=\"24\">⚖ דוד אפל נגד פרקליטת המדינה (1999)</button></div>\n    \n      <h3>שלוש העילות — במבט אחד</h3>\n      <div class=\"scenario-row\"><span class=\"verdict need\">חוסר ראיות</span><div>יש חשד, ראיות חלשות מדי — רישום פלילי</div></div>\n      <div class=\"scenario-row\"><span class=\"verdict need\">נסיבות העניין (עילת הקומבינה)</span><div>ראיות מספיקות, שיקולי מדיניות — רישום פלילי + אישור גורם בכיר אחד</div></div>\n      <div class=\"scenario-row\"><span class=\"verdict ok\">חוסר אשמה</span><div>מחיקה מוחלטת ומיידית</div></div>\n"},"appeal":{"title":"מסלול העררים — סעיפים 64–65","html":"\n      <div class=\"eyebrow\">זכויות המתלונן</div>\n      <h2>מסלול העררים של המתלונן — סעיפים 64–65</h2>\n      <p>מתלונן (נפגע העבירה) רשאי להגיש ערר בכתב תוך <b>60 יום</b> מקבלת הודעת הסגירה.</p>\n      <div class=\"callout warn\"><span class=\"callout-title\">דגש למבחן</span><p>מפת הסמכויות להכרעה בערר — נושא חובה מובהק לבחינה!</p></div>\n      <ul>\n        <li>החלטת גוף חוקר/תובע משטרתי שלא לחקור או להעמיד לדין → <b>פרקליט המחוז / מנהל תחום עררים בפרקליטות המדינה</b>.</li>\n        <li>החלטת פרקליט מחוז/מדינה מטעם מקצועי (חוסר ראיות/אשמה) → <b>פרקליט המדינה</b>.</li>\n        <li>החלטת פרקליט מחוז/מדינה מטעם מדיניות (נסיבות העניין) → <b>היועץ המשפטי לממשלה</b>.</li>\n        <li>החלטת פרקליט המדינה או משנהו שלא להעמיד לדין → <b>היועץ המשפטי לממשלה</b>.</li>\n      </ul>\n      <p><b>על החלטה בערר לא ניתן לערור פעם נוספת בתוך המערכת.</b></p>\n      <p>מלכודת בחינה: החשוד <b>אינו</b> מקבל הודעה אוטומטית על הגשת ערר נגדו (סעיף 65ב). חובת יידוע קמה רק אם שוקלים לקבל את הערר ולהעמיד לדין.</p>\n    \n      <h3>ציר הזמן של הערר</h3>\n      <div class=\"timeline\">\n        <div class=\"timeline-step\"><div class=\"timeline-date\">יום 0</div><div class=\"timeline-dot\"></div><div class=\"timeline-label\">הודעת סגירת<br>התיק למתלונן</div></div>\n        <div class=\"timeline-line\"></div>\n        <div class=\"timeline-step\"><div class=\"timeline-date\">עד 60 יום</div><div class=\"timeline-dot\"></div><div class=\"timeline-label\">הגשת ערר<br>בכתב</div></div>\n        <div class=\"timeline-line\"></div>\n        <div class=\"timeline-step\"><div class=\"timeline-date\">סופי</div><div class=\"timeline-dot end\"></div><div class=\"timeline-label\">הכרעה — אין<br>ערר נוסף</div></div>\n      </div>\n      <div class=\"example-box\">\n        <span class=\"ex-title\">💡 מלכודת בחינה</span>\n        <p>אם רשות הערר שוקלת <b>לקבל</b> את הערר ולהעמיד לדין — קמה חובה לשלוח לחשוד הודעה ולאפשר לו טיעונים. אם הרשות פשוט דוחה את הערר ומשאירה את התיק סגור — <b>אין</b> כל חובת יידוע לחשוד, שכן מצבו לא משתנה.</p>\n      </div>\n<h3>תוספת מאומתת מול תמלול שיעור 3</h3><ul><li>ככלל <b>אין מגבלת זמן סטטוטורית</b> להכרעה בערר.</li><li><b>חריג:</b> בעבירות אלימות מסוג פשע — ההחלטה בערר תימסר למתלונן <b>עד תום 6 חודשים</b> מיום הגשתו, אלא אם קיימים טעמים מיוחדים המצדיקים חריגה.</li><li>הכלל \"אין ערר על ערר\" אינו סוף פסוק — נותרת למתלונן האפשרות לעתור לבג\"ץ.</li></ul>"},"conditional":{"title":"ההסדר המותנה — סעיפים 67א–ו","html":"\n      <div class=\"eyebrow\">מסלול חלופי</div>\n      <h2>ההסדר המותנה — סעיפים 67א–ו</h2>\n      <p>כלי המאפשר סגירת תיק ללא כתב אישום, בתמורה להודאת החשוד ומילוי תנאים שיקומיים.</p>\n      <h3>תנאי סף מצטברים</h3>\n      <ul>\n        <li>קיימות ראיות מספיקות לאישום</li>\n        <li>העבירה מסוג חטא/עוון בלבד — <b>איסור מוחלט בפשע</b></li>\n        <li>העונש הצפוי אינו כולל מאסר בפועל</li>\n        <li>לחשוד עבר פלילי נקי בחמש השנים האחרונות</li>\n      </ul>\n      <p>מאחר שהחשוד נדרש להודות, התביעה חייבת לחשוף בפניו את טיוטת כתב האישום וכל חומרי החקירה — עוד <b>לפני</b> הגשת כתב האישום.</p>\n      <p>אם החשוד מפר את התנאים או מסרב לחתום, התביעה תגיש את כתב האישום המקורי, אך <b>לא תוכל לבקש מאסר בפועל</b> — אלא אם התגלה מידע חדש ומפתיע (באישור תובע בכיר) או שההסדר הושג במרמה.</p>\n      <div class=\"callout\"><span class=\"callout-title\">להלכה למעשה</span><p>התנאים במסגרת ההסדר המותנה הם לרוב שעות לתועלת הציבור, המפוקחות על ידי שירות המבחן ומבוצעות בזמנו הפנוי של החשוד — לעולם לא מאסר בפועל. שימוש בהודאת ההסדר לצורך תביעה אזרחית נזיקית נפרדת הוא עניין מוגבל ומורכב, ולא עניין פשוט וישיר.</p></div>\n    \n      <h3>בדיקת התאמה — כל התנאים ביחד</h3>\n      <div class=\"example-box\">\n        <span class=\"ex-title\">💡 דוגמה</span>\n        <p>חשוד בתקיפה (עוון), ראיות מספיקות, התובע מעריך שהעונש הראוי הוא קנס ושעות שירות — ולחשוד אין עבר פלילי. <b>מתאים</b> להסדר מותנה. אילו היה חשוד בשוד (פשע) — לא מתאים, ללא קשר לחוזק הראיות או לעברו הנקי.</p>\n      </div>\n<h3>תוספת מאומתת מול תמלול שיעור 3</h3><ul><li>תשלום לאוצר המדינה: מוגבל עד <b>29,200 ₪</b> — גם אם ההסדר חל על כמה עבירות יחד, וגם אם יש כמה חשודים (התקרה על כלל החשודים יחד, לא לכל אחד).</li><li>פיצוי לנפגע העבירה: מוגבל בנפרד עד 29,200 ₪, ובלבד שתקופת התשלום לא תעלה על שנה אחת.</li><li>תוקף ההסדר (\"אורך החיים\" שלו): שנה אחת, ובמקרים מיוחדים בהמלצת קצין מבחן — עד 18 חודשים.</li><li>למתלונן <b>אין</b> זכות להגיש ערר על החלטה לסגור תיק בהסדר מותנה.</li></ul>"},"kanzi":{"title":"עדות שותפים — מקנזי לביטול הכלל","html":"<h2>עדות שותף: קנזי והשינוי בהלכה</h2><p><b>הבחנה מכרעת:</b> הלכת קנזי היא נקודת המוצא ההיסטורית, לא סוף ההתפתחות. בבג״ץ 11339/05 בוטל הכלל החוסם ככלל העדת שותף שמשפטו הנפרד תלוי ועומד.</p><p>הכלל שנקבע: ניתן להעידו; דחיית העדות עד תום משפטו אפשרית במקרים חריגים ביותר, מטעמים שיירשמו. אין לערבב זאת עם נאשמים באותו כתב אישום וההסדר שבסעיף 155.</p><h3>מדוע השתנה הכלל?</h3><p>הכלל ההיסטורי ביקש לצמצם את החשש ששותף יעיד כדי להיטיב את מצבו במשפטו שלו. בפסק הדין המאוחר נבחן גם המחיר: עיכובים במשפט, פגיעה בניהולו וסיכון לשימוש לרעה בכלל. הוחלט להסיר את החסם הגורף ולהותיר שיקול דעת צר לדחייה חריגה.</p><h3>איך פותרים קייס?</h3><ol><li>מזהים אם כתבי האישום נפרדים או משותפים.</li><li>מבדילים בין האפשרות להעיד לבין הערכת משקל העדות וההגנות הראייתיות.</li><li>במשפטים נפרדים אין לפסול עדות רק מפני שטרם ניתן גזר הדין.</li><li>אם נטען לחריג — בוחנים את הנסיבות המיוחדות ואת ההנמקה, ולא מניחים דחייה אוטומטית.</li></ol><button class=\"case-link\" data-case=\"15\">לניתוח פסק הדין ששינה את ההלכה</button>"},"structure":{"title":"מבנה כתב האישום — סעיף 85","html":"\n      <div class=\"eyebrow\">חסד\"פ</div>\n      <h2>מבנה כתב האישום — סעיף 85 לחסד\"פ</h2>\n      <ul>\n        <li>שם בית המשפט, לפי כללי הסמכות העניינית והמקומית</li>\n        <li>ציון מדינת ישראל כמאשימה, באמצעות הגוף המגיש</li>\n        <li>שם הנאשם, מספר זהותו, גילו ומענו</li>\n        <li><b>פרק העובדות</b> — עובדות בלבד! איסור מוחלט לצרף ראיות גולמיות או עדויות.</li>\n        <li>הוראות החיקוק לפיהן מואשם הנאשם</li>\n        <li><b>רשימת עדי התביעה</b> — רשימה קשיחה וסגורה. עד שאינו ברשימה לא ניתן לזמנו לעדות במהלך המשפט.</li>\n      </ul>\n    \n      <div class=\"example-box\">\n        <span class=\"ex-title\">💡 דוגמה</span>\n        <p>שוטר ערך דוח חיפוש ותפס סכין, אך שמו לא נכלל ברשימת עדי התביעה בכתב האישום. בשלב המשפט מתברר שהסנגור חולק על נסיבות התפיסה — התביעה תיתקל בבעיה: לא ניתן לזמן את השוטר להעיד, ודוח החיפוש עלול שלא להתקבל כראיה כלל.</p>\n      </div>\n<h3>תוספת מאומתת מול תמלול שיעור 4</h3><p>רכיבים נוספים שנדרשים בכתב אישום, לפי הצורך: <b>בקשה לחילוט רכוש</b> (בעבירות כגון סמים והלבנת הון), ו<b>הודעה לנאשם על זכותו לבקש סנגור ציבורי</b>.</p>"},"amend":{"title":"תיקון כתב האישום — סעיף 92","html":"\n      <div class=\"eyebrow\">קו פרשת המים</div>\n      <h2>תיקון כתב האישום — סעיף 92</h2>\n      <p><b>לפני תחילת המשפט (לפני ההקראה):</b> התובע הוא הבעלים הבלעדי של כתב האישום — רשאי לתקן בחופשיות, כולל הוספת עבירות או נאשמים, בהודעה פשוטה לבית המשפט וללא צורך באישור שופט.</p>\n      <p><b>לאחר תחילת המשפט (אחרי ההקראה):</b> כתב האישום עובר לאחריות בית המשפט. התובע צריך להגיש בקשה רשמית, שתתקבל רק אם ניתנה לנאשם הזדמנות סבירה להתגונן מפני השינוי.</p>\n      <p>השלכה על סמכות: תיקון שחושף עבירה חמורה יותר → התיק עובר לבית משפט בכיר יותר. תיקון לעבירה קלה יותר → הבית המשפט הבכיר רשאי (לא חייב) להמשיך לדון.</p>\n    \n      <div class=\"scenario-row\"><span class=\"verdict ok\">לפני הקראה</span><div>תיקון חופשי, הודעה בלבד, ללא אישור שופט</div></div>\n      <div class=\"scenario-row\"><span class=\"verdict need\">אחרי הקראה</span><div>בקשה רשמית + הזדמנות סבירה להתגונן</div></div>\n<h3>תוספת מאומתת מול תמלול שיעור 4</h3><p>חריג צר: תיקון כתב אישום להוספת בקשת חילוט לאחר גילוי נכסים חדשים אפשרי גם ללא רשות בית המשפט.</p>"},"joinder":{"title":"צירוף אישומים ונאשמים — 86-87","html":"\n      <div class=\"eyebrow\">יעילות דיונית</div>\n      <h2>צירוף אישומים וצירוף נאשמים — סעיפים 86–87</h2>\n      <p>מותר לצרף אישומים נגד אותו נאשם המבוססים על אותן עובדות, עובדות דומות, או פרשה עובדתית אחת (86). מותר לצרף נאשמים שהיו צד לעבירות — מבצע בצוותא, משדל, מסייע — או שמדובר בפרשה עובדתית אחת (87).</p>\n      <div class=\"callout case-callout\"><span class=\"callout-title\">קשור לפסק דין</span><button class=\"case-link\" data-case=\"10\">⚖ סוסן נגד מדינת ישראל (1995) — סמכות נגררת</button></div>\n    \n      <div class=\"example-box\">\n        <span class=\"ex-title\">💡 דוגמה</span>\n        <p>שני שותפים פרצו יחד לבית עסק. ניתן לצרפם לכתב אישום אחד (87 — פרשה עובדתית אחת), וגם לצרף אישום נוסף נגד אחד מהם על עבירה קודמת דומה של אותו נאשם (86), אם היא קשורה מבחינה עובדתית.</p>\n      </div>\n<h3>תוספת מאומתת מול תמלול שיעור 4 — הפרדת הדיון</h3><p>לצד הצירוף, בית המשפט מוסמך להורות על <b>הפרדת הדיון</b> — פיצול אישומים או נאשמים שצורפו, ולדון בהם בנפרד — בכל שלב לפני מתן הכרעת הדין, כאשר הצירוף עלול לגרום לעיוות דין לאחד הנאשמים.</p>"},"withdraw":{"title":"חזרה מכתב אישום — סעיף 94","html":"\n      <div class=\"eyebrow\">חסד\"פ</div>\n      <h2>חזרה מכתב אישום — סעיף 94</h2>\n      <ul>\n        <li><b>לפני תשובת הנאשם לאישום</b> — ביטול כתב האישום בלבד. ניתן להגיש מחדש בעתיד, אין מעשה בית דין.</li>\n        <li><b>לאחר תשובה, כפר בעובדות או שתק</b> — זיכוי מוחלט, מעשה בית דין החוסם הגשה מחדש.</li>\n        <li><b>לאחר תשובה, הודה בעובדות מרשיעות</b> — בית המשפט מרשיע; לא ניתן לחזור מהאישום בתוצאה של זיכוי.</li>\n        <li><b>לאחר תשובה, הודה אך אין בעובדות כדי להרשיע</b> — התביעה רשאית לחזור מהאישום ברשות בית המשפט; התוצאה זיכוי מוחלט.</li>\n        <li><b>חזרה בהסכמת הנאשם לאחר תשובה</b> — ביטול בלבד (לא זיכוי), עם דרישת אישור אישי בכתב של היועמ\"ש להגשה מחדש.</li>\n      </ul>\n    \n      <h3>ארבע התוצאות במבט אחד</h3>\n      <div class=\"scenario-row\"><span class=\"verdict ok\">לפני תשובה</span><div>ביטול בלבד — ניתן להגיש מחדש</div></div>\n      <div class=\"scenario-row\"><span class=\"verdict need\">אחרי תשובה, כפר/שתק</span><div>זיכוי מוחלט — חסום לצמיתות</div></div>\n      <div class=\"scenario-row\"><span class=\"verdict need\">אחרי תשובה, הודה (מרשיע)</span><div>הרשעה — לא ניתן לחזור</div></div>\n      <div class=\"scenario-row\"><span class=\"verdict ok\">אחרי תשובה, הודה (לא מספיק)</span><div>זיכוי ברשות בית המשפט</div></div>\n<h3>תוספת מאומתת מול תמלול שיעור 4</h3><ul><li><b>החריג היחיד למעשה בית דין:</b> אם המתלונן נפטר בעקבות העבירה לאחר שכבר ניתן פסק דין סופי (למשל הרשעה בחבלה/ניסיון רצח), ניתן להגיש כתב אישום חדש בעבירת רצח — זהו החריג היחיד שהמרצה מציינת לכלל שאסור להגיש כתב אישום מחדש על אותן עובדות.</li><li>ביטול כתב אישום בהסכמה: שרשרת האישור עוברת דרך התובע ← פרקליט המחוז ← פרקליט המדינה ← היועץ המשפטי לממשלה (אישור אישי ובכתב). לא ניתן לתת הסכמה על תנאי — אין דבר כזה.</li></ul>"},"defendant":{"title":"מחשוד לנאשם","html":"\n      <div class=\"eyebrow\">מעמד</div>\n      <h2>מחשוד לנאשם</h2>\n      <p>כל עוד חקירת המשטרה מתנהלת והתיק נבחן בתביעה, האדם מוגדר <b>\"חשוד\"</b>. ברגע שכתב האישום מוגש רשמית למזכירות בית המשפט, הוא הופך מיידית ל<b>\"נאשם\"</b>.</p>\n    \n      <div class=\"timeline\">\n        <div class=\"timeline-step\"><div class=\"timeline-date\">שלב א׳</div><div class=\"timeline-dot\"></div><div class=\"timeline-label\">חקירה<br>\"חשוד\"</div></div>\n        <div class=\"timeline-line\"></div>\n        <div class=\"timeline-step\"><div class=\"timeline-date\">שלב ב׳</div><div class=\"timeline-dot end\"></div><div class=\"timeline-label\">הגשת כתב אישום<br>\"נאשם\"</div></div>\n      </div>\n\n      <div class=\"timeline\">\n        <div class=\"timeline-step\"><div class=\"timeline-date\">שלב חקירה</div><div class=\"timeline-dot\"></div><div class=\"timeline-label\">חשוד</div></div>\n        <div class=\"timeline-line\"></div>\n        <div class=\"timeline-step\"><div class=\"timeline-date\">הגשת כתא\"ש<br>למזכירות</div><div class=\"timeline-dot end\"></div><div class=\"timeline-label\">נאשם</div></div>\n      </div>\n"},"review":{"title":"זכות העיון — סעיף 74","html":"\n      <div class=\"eyebrow\">זכויות הנאשם</div>\n      <h2>זכות העיון בחומר חקירה — סעיף 74</h2>\n      <p>קמה עם הגשת כתב האישום. חלה <b>רק בפשע/עוון</b>, לא בחטא.</p>\n      <p>כשמסרבים לחשוף: בקשה לביהמ\"ש → ערר יחיד לערכאה בכירה → 3 אפשרויות (לחשוף / לא להשתמש כראיה / לחזור מהאישום).</p>\n      <div class=\"callout case-callout\"><span class=\"callout-title\">קשור לפסק דין</span><button class=\"case-link\" data-case=\"5\">⚖ שמואל (2008)</button></div>\n      <button class=\"expand-link\" data-topic=\"review\">🔎 קריאה מורחבת</button>\n    <h3>פומביות הדיון ואיסור פרסום חומרי חקירה</h3><p>פומביות הדיון וחופש הביטוי אינם מוחלטים. בבקשה לפרסם חומרי חקירה או תיעוד מהליך פלילי יש לאזן בין עניין הציבור ופומביות ההליך לבין פרטיות, שם טוב, הגינות ההליך והחשש להשפעה על עדים או לזיהום המשפט. ככל שהחקירה או המשפט פעילים והפרסום עלול לפגוע ממשית בהליך, ניתן למנוע או לעכב את הפרסום מכוח סעיף 13 לחוק חקירת חשודים (איסור פרסום תיעוד חזותי/קולי של חקירה ללא רשות בית המשפט) וההסדרים הכלליים שנלמדו. התרומה של עניין תורג׳מן ורשות השידור היא יישום אותו איזון על פרסום תקשורתי של חומרי חקירה, ולא יצירת כלל נפרד לכל אחד מהם.</p>"},"reading":{"title":"הקראת כתב האישום והסכמות","html":"<div class=\"eyebrow\">מצגת 2 · סעיפים 74–84</div><h2>עיון בחומר החקירה</h2><p>לאחר כתב אישום בעוון או בפשע זכאים הנאשם וסנגורו לעיין ולהעתיק את חומר החקירה. הרשימה הנלווית כוללת גם ציון קיומם של חומר שאינו חומר חקירה, חומר חסוי וחומר מודיעיני, עם סוג, נושא ומועד — בכפוף לחיסיון.</p><p>הסייגים שנלמדו: ראיות הזמה, עניינים פורמליים שאינם מהותיים, חומר חסוי, והסדרים מיוחדים בבגידה או ריגול. אם לא ניתנה הזדמנות סבירה לעיין, סעיף 77(א) מונע מן התובע להגיש את הראיה או להשמיע את העד, אלא אם ויתרו על כך.</p><p>בקשת עיון נדונה ככלל בפני שופט אחד; ערר בזכות יוגש בתוך 30 ימים. לפי פרידן, יש מסלול ערר אחד בלבד.</p><h3>אמרת חוץ של עד — סעיף 10א לפקודת הראיות</h3><p>קבלת אמרת חוץ של עד אינה תחליף אוטומטי לעדות בבית המשפט. לפי המסגרת שנלמדה, נדרשים תנאים מצטברים: האמרה הוכחה במשפט; מוסר האמרה הוא עד במשפט וניתנה לצדדים הזדמנות לחקרו; והעדות בבית המשפט שונה בפרט מהותי מן האמרה, או שהעד מכחיש את תוכנה או טוען שאינו זוכר. לצד קבילות האמרה יש לבחון את משקלה ואת הראיות המחזקות.</p><p>תחבולת חקירה אינה נפסלת כשלעצמה. הגבול הוא פגיעה באוטונומיית הרצון החופשי או פגיעה חמורה בהגינות ההליך; אין לשכפל מכאן את מבחני החיפוש או את דוקטרינת יששכרוב.</p>"},"trial-open6":{"title":"תזכורת: פתיחת המשפט וזכויות הנאשם","html":"<div class=\"eyebrow\">מצגת 3 · סעיפים 143–145</div><h2>פתיחת המשפט: הקראה והסכמות</h2><p>הכלל הוא שהמשפט נפתח בהקראת כתב האישום. הוויתור אפשרי רק בארבעה תנאים מצטברים: הנאשם מיוצג; הסנגור הודיע שקרא לנאשם את כתב האישום; הנאשם אישר זאת; והדברים נרשמו בפרוטוקול.</p><p>לאחר תחילת המשפט, כאשר הנאשם מיוצג, בית המשפט רשאי לברר הסכמות לעובדות ולקבילות מסמכים ומוצגים, לרבות הגשתם שלא באמצעות עדים (סעיף 144). לפי סעיף 145, בית המשפט יסביר לנאשם את זכויות ההגנה אם ראה צורך בכך.</p>"},"prelim-claims":{"title":"טענות מקדמיות — סעיף 149","html":"<div class=\"eyebrow\">מצגת 3 · סעיפים 149–151</div><h2>טענות מקדמיות</h2><p>הרשימה שבסעיף 149 אינה סגורה. הטענה מועלית בתחילת המשפט, אך ככלל אפשר להעלותה גם בהמשך ואף בערעור. החריג: חוסר סמכות מקומית ופגם או פסול בכתב האישום בשלב מאוחר דורשים רשות בית המשפט.</p><p>פגם הוא השמטת פרט ענייני מכתב האישום; פסול הוא אי־עמידה בדרישת כשרות דיונית, כגון כתב אישום שלא הוגש בידי תובע מוסמך. בקבלת טענה בית המשפט יכול לתקן, לבטל או להעביר לבית משפט מוסמך — לא לזכות.</p><h3>טענות נוספות</h3><p>משפט פלילי אחר התלוי ועומד באותו עניין מוביל לביטול כתב האישום. חסינות וחנינה חוסמות העמדה לדין לפי התנאים שנלמדו; הגנה מן הצדק לפי בורוביץ, נוה ורותם מאפשרת ביטול כאשר ההליך עומד בסתירה מהותית לצדק ולהגינות.</p>"},"court-jurisdiction":{"title":"סמכות מקומית ועניינית של בתי המשפט","html":"<div class=\"eyebrow\">מצגת 3 · סעיפים 6–8</div><h2>סמכות מקומית</h2><p>הסמכות מתקיימת במקום ביצוע העבירה או מקום מגורי הנאשם. אם שניהם אינם ידועים — במקום תפיסתו; בעבירת חוץ, כשמקום מגוריו אינו בישראל או אינו ידוע — במקום היחידה החוקרת. בצירוף אישומים או נאשמים מוסמך כל בית משפט שיש לו שיפוט באחת העבירות או על אחד הנאשמים.</p><p>כאשר היועץ המשפטי לממשלה קובע שאין בית משפט מוסמך לפי הכללים הרגילים, הסמכות בירושלים. העברה מחמת חוסר סמכות אפשרית לפי סעיף 79 לחוק בתי המשפט; בית המשפט המקבל רשאי להמשיך מן השלב שאליו הגיע קודמו ואינו מעביר שוב.</p>"},"double-jeopardy-justice":{"title":"סיכון כפול, חסינות, חנינה והגנה מן הצדק","html":"\n      <div class=\"eyebrow\">טענות מקדמיות 4–7</div>\n      <h2>סיכון כפול, חסינות, חנינה והגנה מן הצדק</h2>\n      <p>זיכוי/הרשעה קודמים (5), סיכון כפול (נדיר, אף פעם לא התקבל בפועל), חסינויות וחנינה, הגנה מן הצדק.</p>\n      <div class=\"callout case-callout\"><span class=\"callout-title\">קשור לפסקי דין</span><button class=\"case-link\" data-case=\"13\">⚖ קרישניסקי</button> <button class=\"case-link\" data-case=\"12\">⚖ הגנה מן הצדק</button></div>\n      <button class=\"expand-link\" data-topic=\"double-jeopardy-justice\">🔎 קריאה מורחבת</button>\n    <div class=\"callout\"><span class=\"callout-title\">חריג לסיכון כפול</span><p>כאשר המעשה גרם למות אדם לאחר הדיון הראשון, ניתן להעמיד לדין פעם נוספת בשל אותו מעשה אם בדיון הראשון נמצא הנאשם אשם, לרבות העמדה למבחן ללא הרשעה.</p></div><h3>הבחנות נוספות</h3><p>\"סיכון כפול\" שונה מטענת \"כבר נשפטתי\" לפי סעיף 5: הראשונה עוסקת בחשיפה חוזרת לסיכון הרשעה כאשר ההליך הקודם לא הסתיים בפסק דין; השנייה מבוססת על מעשה בית דין. הטענה נדירה ואינה חלה כשההליך הקודם בטל מעיקרו, למשל מחוסר סמכות מלכתחילה.</p>"},"defendant-response":{"title":"תשובת הנאשם, הודאה וחזרה ממנה","html":"\n      <div class=\"eyebrow\">סעיפים 152–154</div>\n      <h2>תשובת הנאשם, הודאה וחזרה ממנה</h2>\n      <p>שתיקה עשויה לשמש חיזוק. טענת אליבי — מייד. חזרה מהודאה ברשות ביהמ\"ש, מנימוקים מיוחדים.</p>\n      <button class=\"expand-link\" data-topic=\"defendant-response\">🔎 קריאה מורחבת</button>\n    <h3>סעיף 152</h3><p>הנאשם רשאי שלא להשיב, להודות, לכפור או להוסיף עובדות. בית המשפט רשאי לשאול שאלות הבהרה שאינן חורגות מהדרוש. הימנעות מתשובה עשויה לשמש חיזוק, ובית המשפט חייב להסביר זאת. טענת אליבי יש להעלות מיד; איחור מגביל הבאת ראיות אלא ברשות בית המשפט, בלי לגרוע מזכות לחזור מהודאה בנוכחות בזירת העבירה.</p>"},"multi-defendants":{"html":"<div class=\"eyebrow\">שיעור 7 · סעיף 155</div><h2>נאשמים בכתב אישום אחד</h2><p>כאשר כמה נאשמים הועמדו לדין <b>באותו כתב אישום</b> וחלקם הודו בעובדות שיש בהן כדי הרשעה, לא ייגזר דינם של מי שהודו לפני שהסתיים בירור משפטם של מי שלא הודו.</p><p>הנימוק שהדגיש המרצה: רק לאחר בירור התמונה המלאה אפשר להעריך את חלקו של כל נאשם בעבירה ואת הענישה המתאימה. אין להשליך מכאן אוטומטית על כתבי אישום נפרדים; אלה מסלולים שונים.</p>"},"trial-conduct":{"html":"<div class=\"eyebrow\">שיעור 7 · סעיפים 156–165</div><h2>ניהול המשפט — שלד העבודה</h2><p>המרצה עבר על פרשת התביעה, טענת \"אין להשיב לאשמה\" בסיומה, פרשת ההגנה וראיות ההזמה. סעיף 77(א) הוזכר בהקשר של מניעת הגשת ראיה שלא ניתנה לנאשם הזדמנות לעיין בה.</p><p>אם הנאשם בוחר להעיד בפרשת ההגנה, עדותו נשמעת תחילה. הימנעות מהעיד עשויה לשמש חיזוק לראיות התביעה. ראיות הזמה טעונות רשות ונועדו לסתור טענה שעלתה בהגנה ושלא הייתה צפויה לתביעה מראש; לאחר שהובאו, רשאי הנאשם להביא ראיות לסתור אותן.</p><h3>הערכת מהימנות וחובת הגינות התביעה</h3><p>הערכת מהימנות היא מלאכת בית המשפט: יש לבחון את עדות העד במכלול, את עקביותה, את הסתירות ואת התמיכה החיצונית, בלי להפוך כלל כללי על מהימנות לתחליף להנמקה. לצד זאת, על התביעה לנהל את ההליך בהגינות ולגלות חומר רלוונטי; מחדל דיוני אינו מוביל אוטומטית לתוצאה אחת, אלא נבחן לפי השפעתו על ההגנה ועל הוגנות ההליך.</p>"},"verdict-sentence":{"title":"הכרעת הדין וגזר הדין","html":"<div class=\"eyebrow\">שיעור 8</div><h2>מן הראיות אל פסק הדין</h2><p>לאחר פרשת ההגנה רשאי בית המשפט, אך אינו חייב, להביא ראיות מטעמו. גם לאחר הכרעת הדין הדבר אפשרי רק בנסיבות חריגות מאוד, כשהתגלתה ראיה חדשה שלא הייתה בהישג יד ונדרש הדבר לעשיית צדק ולמניעת עיוות דין.</p><p>בתום הראיות באים הסיכומים: התובע מסכם ראשון והנאשם אחריו; לנאשם שמורה זכות המילה האחרונה. פסק הדין הפלילי בנוי מהכרעת דין ומגזר דין.</p><h3>השלמות משקפים 71–105</h3><p>הודאה בעובדה נחשבת כמוכחת, אלא אם בית המשפט אינו מקבלה או התיר חזרה ממנה בנימוקים מיוחדים. לאחר הכרעת הדין, ביטול ההכרעה נדרש רק אם היא מבוססת על ההודאה. לפי סעיף 155, בכתב אישום משותף ניתן לגזור לפני סיום משפט האחרים רק בנסיבות מיוחדות שיירשמו או כאשר המודה נקרא להעיד ולאחר שנגזר דינו.</p><p>פרשת התביעה לפי סעיפים 156–157 קודמת לטענת אין להשיב לאשמה; פרשת ההגנה לפי 159–164. נאשמים מביאים פתיחה וראיות לפי סדר רישומם, אלא אם בית המשפט הורה אחרת. התביעה אינה חוקרת על הרשעות קודמות אלא בחריגי אופי טוב. ראיות הזמה דורשות רשות; ראיות ההגנה לסתירתן אינן דורשות רשות.</p><p>סעיף 181א קובע הכרעת דין בתוך 30 ימים מהסיכומים, עם אפשרות הארכה מטעמים מיוחדים. זיכוי הוא פסק הדין; מועד הערעור מתחיל ממתן הנימוקים. ניתן לבטל הרשעה לפני גזר דין לפי סעיף 192א, להרשיע בכמה עבירות בלי להעניש יותר מפעם אחת על אותו מעשה, ולצרף תיקים לגזירת עונש כולל. סעיף 185 מסדיר העברה בין שלום למחוזי בעבירה שאינה בסמכות הערכאה.</p>"},"sentencing":{"title":"קביעת העונש","html":"\n      <div class=\"eyebrow\">40ב–40טו לחוק העונשין</div>\n      <h2>קביעת העונש</h2>\n      <p>3 שלבים: מתחם עונש הולם → חריגה (קולא/חומרא) → עונש סופי בתוך המתחם.</p>\n      <div class=\"callout case-callout\"><span class=\"callout-title\">קשור לפסק דין</span><button class=\"case-link\" data-case=\"18\">⚖ תיקי מב\"ד</button></div>\n      <button class=\"expand-link\" data-topic=\"sentencing\">🔎 קריאה מורחבת</button>\n    <h3>השלמות משקפים 106–136</h3><p>בשלב הטיעונים לעונש התביעה מביאה הרשעות קודמות והחלטות על ביצוע עבירות, והנאשם רשאי להביא ראיות להקלה שאינן סותרות את גרסתו בשלב האשמה. תיקים הממתינים לבירור דין אינם ראיה בשלב בירור האשמה, אך שירות המבחן רשאי להתייחס אליהם בתסקיר. הענישה נעשית בשלושה שלבים: מתחם הולם, חריגה לשיקום או להגנת שלום הציבור בתנאים שנלמדו, וקביעת העונש בתוך המתחם; נסיבה מחמירה טעונה הוכחה מעבר לספק סביר ומקלה ברמת הוכחה אזרחית.</p>"},"appeals":{"title":"ערעור: זכות, מסלולים ומועדים","html":"\n      <div class=\"eyebrow\">סעיפים 199–217</div>\n      <h2>ערעור: זכות, מסלולים ומועדים</h2>\n      <p>לא ניתן לערער על החלטות ביניים (מלבד חריגים). מועדים: 45 יום (בזכות), 45+30 (ברשות).</p>\n      <div class=\"callout case-callout\"><span class=\"callout-title\">קשור לפסקי דין</span><button class=\"case-link\" data-case=\"11\">⚖ פלדמן</button> <button class=\"case-link\" data-case=\"20\">⚖ צ'ירנסקי</button> <button class=\"case-link\" data-case=\"22\">⚖ חילף</button></div>\n      <button class=\"expand-link\" data-topic=\"appeals\">🔎 קריאה מורחבת</button>\n    <h3>השלמות משקפים 106–136</h3><p>הכלל הוא שאין ערעור על החלטות ביניים אלא בהוראה מפורשת; חריגים שנלמדו כוללים פסלות, פומביות, עיון בחומר, עיכוב ביצוע וערעור עצמאי של סנגור על אי־שחרורו מייצוג. בקשת רשות לערעור שני דורשת שאלה משפטית בעלת חשיבות ציבורית או מקרה חריג בחומרת העונש. ערעור בזכות מוגש בתוך 45 ימים; בקשת רשות בתוך 45 ימים והערעור בתוך 30 ימים ממועד הרשות. חזרה מערעור לאחר סיום הטענות טעונה רשות. בערעור אין להחמיר בעונש ללא ערעור מדינה.</p><section class=\"release-2a-addition\"><h3>הרחבת שיעור 9 — appeal court powers section 216</h3><h4>📚 סמכויות בית המשפט הדן בערעור פלילי (סעיף 216 לחסד\"פ)</h4><p>---</p><h4>1. תקציר הנושא</h4><p>הכלל המרכזי: לבית המשפט הדן בערעור פלילי עומדות ארבע סמכויות הכרעה מרכזיות: קבלת הערעור (ושינוי פסק הדין), דחיית הערעור, החזרת המשפט להערכאה הקודמת, והרשעה בעבירה שונה.</p><p>התנאים המרכזיים להרשעה בעבירה שונה (סעיף 216 לחסד\"פ):</p><p>1. אשמתו של הנאשם בעבירה השונה נתגלתה מתוך העובדות שהוכחו בערכאה הקודמת.</p><p>2. ניתנה לנאשם הזדמנות סבירה להתגונן.</p><p>3. סייג לענישה: לא יוטל עונש חמור מזה שאפשר היה להטיל אילו הוכחו העובדות בכתב האישום המקורי.</p><p>החריג המרכזי וסייגי הענישה בערעור:</p><p>דחייה בהיעדר עיוות דין: בית המשפט רשאי לדחות ערעור גם אם קיבל טענה מטענות המערער, אם נוכח כי ניכוי הראיה/הטענה אינו משנה את התוצאה הסופית וניזוקה עיוות דין.</p><p>היעדר סמכות החמרה בערעור נאשם בלבד: אם רק הנאשם ערער, בית המשפט אינו מוסמך להחמיר בעונשו מעבר לגזר הדין של הערכאה הקודמת.</p><p>סמכות ומועד חשוב:</p><p>החזרת התיק להערכאה הדיונית: סמכות להחזיר את התיק לערכאה הקודמת עם הוראות מפורשות לשמיעת עד/ראיה מחדש, הנובעת מכך שערכאת הערעור אינה גובה ראיות ואינה שומעת עדים.</p><p>פתיחת סמכות ההחמרה בעונש: נפתחת אך ורק כאשר המדינה מגישה ערעור (או ערעור נגדי) על קולת העונש.</p><p>הבחנה חשובה: הבחנה בין ערעור הנאשם בלבד (החוסם החמרה בעונש) לבין ערעור המדינה על קולת העונש (הפותח את הסמכות להחמיר בעונש, עד לתקרת העבירה המקורית).</p><p>נקודת מבחן מרכזית: כאשר מתגלה בערעור עבירה חמורה בהרבה מכתב האישום אך המדינה לא ערערה על קולת העונש, תקרת הענישה חסומה בגובה גזר הדין של הערכאה הקודמת; אם נדרשת ענישה חמורה יותר, בית המשפט יורה על \"הפרדת תיקים\" והגשת כתב אישום חדש.</p><p>---</p><h4>2. קריאה מורחבת</h4><h4>א. מקור נורמטיבי וסעיפי חוק</h4><p>חוק סדר הדין הפלילי [נוסח משולב], התשמ\"ב-1984 (חסד\"פ):</p><p>סעיף 216: מסדיר מפורשות את סמכות ערכאת הערעור להרשיע נאשם בעבירה שאשמתו בה נתגלתה מן העובדות שהוכחו, אף אם היא שונה מזו שהורשע בה ואף אם העובדות לא נטענו בכתב האישום המקורי, ובלבד שניתנה לו הזדמנות סבירה להתגונן.</p><h4>ב. הכלל וארבע סמכויות ההכרעה בערעור</h4><p>1. קבלת הערעור: בית המשפט רשאי לקבל את הערעור, לבטל או לשנות את פסק הדין של הערכאה הקודמת, או לתת פסק דין אחר במקומו. במקרה כזה, מוסמך בית המשפט להטיל כל עונש שהערכאה הקודמת הייתה מוסמכת להטיל.</p><p>2. דחיית הערעור: בית המשפט רשאי לדחות את הערעור ולהשאיר את ההרשעה והעונש על כנם.</p><p>חריג/כלל גמישות: בית המשפט רשאי לדחות את הערעור גם אם קיבל טענה מטענות המערער (למשל, טענה שניתן משקל יתר פסול לעדות מסוימת), במידה והוא סבור שגם ללא אותה עדות קיימות מספיק ראיות להרשעה ולא נגרם עיוות דין.</p><p>3. החזרת המשפט להערכאה הקודמת: בית המשפט מוסמך להחזיר את התיק לערכאה הדיונית הנמוכה בצירוף הוראות מפורשות (למשל, לגבות מחדש עדות או לשמוע עד נוסף).</p><p>הרציונל המשפטי: ערכאת הערעור אינה גובה ראיות ואינה שומעת עדים באופן בלתי אמצעי.</p><p>4. הרשעה בעבירה שונה (סעיף 216 לחסד\"פ): סמכות להרשיע את הנאשם בעבירה שונה מזו שהורשע בה בערכאה הדיונית, על בסיס עובדות שהוכחו.</p><h4>ג. התנאים והסייגים להרשעה בעבירה שונה (סעיף 216)</h4><p>הוכחת העובדות: אשמת הנאשם בעבירה החדשה נתגלתה מתוך העובדות שהוכחו בערכאה הקודמת.</p><p>הזדמנות סבירה להתגונן: חובה להבטיח כי לנאשם ניתנה הזדמנות כהלכה להתגונן מול היסודות של העבירה החדשה.</p><p>סייג הענישה הקשיח: לא יוטל על הנאשם עונש חמור מזה שאפשר היה להטיל אילו הוכחו העובדות שניתנו בכתב האישום המקורי.</p><h4>ד. כללי הענישה וההחמרה בערעור</h4><p>כאשר רק הנאשם מערער: אם הנאשם ערער על הרשעתו או על חומרת עונשו והמדינה לא הגישה ערעור נגדי, ערכאת הערעור אינה מוסמכת להחמיר בעונשו מעבר לגזר הדין של הערכאה הקודמת.</p><p>כאשר המדינה מערערת על קולת העונש: רק הגשת ערעור (או ערעור נגדי) מטעם המדינה על קולת העונש פותחת לבית המשפט את הסמכות להחמיר בעונש.</p><p>הטקטיקה התביעתית: במציאות, כשהנאשם מגיש ערעור על חומרת העונש, המדינה מגישה כמעט תמיד \"ערעור נגדי\" על קולת העונש כדי לחשוף את הנאשם לסיכון של החמרה ולאזן את מגרש המשחקים.</p><h4>ה. דוגמאות המרצה</h4><p>1. דוגמת האינטונציה במצלמת הטסלה (מדוע מחזירים תיק להערכאה הקודמת):</p><p>התרחיש: תביעה נזיקית/פלילית עקב תאונת דרכים ברחוב בן גוריון. הטובעת (סיון) נשאלת בחקירה נגדית מדוע מצלמת הטסלה שלה לא תיעדה את התאונה והיא משיבה שהייתה תקלה.</p><p>ההבדל באינטונציה: המרצה מציג אותה שאלה בשתי אינטונציות – אחת תוקפנית המרמזת כי העדה שקרנית, והשנייה ניטרלית ועובדתית.</p><p>הלקח המשפטי: מי שקורא את פרוטוקול הנייר (ערכאת הערעור) אינו שומע את האינטונציה ואינו רואה את שפת הגוף. השופט בערכאה הדיונית שיושב ורואה את העדים הוא היחיד שמוסמך להכריע במשקל הראייתי, ולכן ערכאת הערעור מחזירה אליו את התיק לגביית העדות מחדש.</p><p>2. דוגמת תיק משה קצב (החמרה בעונש בערעור):</p><p>בית המשפט המחוזי גזר על משה קצב עונש מאסר (בדוגמת המרצה (שהעיד שאינו זוכר את המספר המדויק): כארבע שנות מאסר). הנאשם ערער, והמדינה הגישה ערעור על קולת העונש. בעקבות ערעור המדינה, בית המשפט העליון החמיר את עונשו ל-7 שנות מאסר בפועל.</p><p>3. דוגמת אייל והפרדת התיקים (תקרת הענישה בסעיף 216):</p><p>העובדות: אייל הורשע בבית משפט השלום בעבירה של גרימת מוות ברשלנות (עונש מרבי בחוק: 3 שנות מאסר) ונגזרו עליו 2 שנות מאסר בפועל. אייל ערער על הרשעתו למחוזי, והמדינה לא הגישה ערעור.</p><p>בדיון במחוזי: לאחר שניתנה לאייל הזדמנות סבירה להתגונן, התברר מעובדות התיק כי ביצע עבירת המתה חמורה שעונשה 12 שנות מאסר.</p><p>היישום המשפטי: בית המשפט המחוזי מוסמך להרשיע את אייל לפי סעיף 216 בעבירת ההמתה, אך אינו מוסמך להטיל עליו עונש הגבוה מ-2 שנות מאסר! (משום שהמדינה לא ערערה על קולת העונש).</p><p>ניתוח חלופי: אילו המדינה הייתה מערערת על קולת העונש, התקרה הייתה 3 שנות מאסר (העונש המרבי של העבירה המקורית בכתב האישום).</p><p>הפתרון המעשי למציאות: אם המדינה מעוניינת בענישה חמורה יותר המתחייבת מ-12 שנות המאסר, בית המשפט יורה על \"הפרדת תיקים\" וינחה את המדינה להגיש כתב אישום חדש ונפרד בגין עבירת ההמתה.</p><h4>ו. משמעות מעשית למבחן</h4><p>בפתרון קייס במבחן, כאשר מיושם סעיף 216 לחסד\"פ בערעור:</p><p>1. יש לבדוק האם ניתנה לנאשם הזדמנות סבירה להתגונן.</p><p>2. יש לבדוק האם המדינה הגישה ערעור על קולת העונש. אם המדינה לא ערערה – העונש המרבי חסום בגובה העונש שנגזר בערכאה הדיונית!.</p><p>3. אם נדרשת ענישה חמורה מרובות מעבר לתקרת האישום המקורי, יש להורות על הפרדת תיקים והגשת כתב אישום חדש.</p><p>---</p><h4>3. הרחבה מקיפה</h4><h4>א. ניתוח המבנה הנורמטיבי והאיזון הדיוני</h4><p>סעיף 216 לחסד\"פ מהווה נגזרת אפילטיבית של סעיף 184 לחסד\"פ (הרשעה בעבירה שונה בערכאה הדיונית).</p><p>המחוקק ביקש למנוע מצב שבו נאשם יצא פטור בלא כלום עקב סיווג משפטי מוטעה של עובדות המקרה, אך בד בבד קבע שתי ערובות חוקתיות קשיחות:</p><p>1. הגנה על זכות ההתגוננות (הזדמנות סבירה להתגונן): מניעת הפתעת הנאשם בערעור בעבירה שלא הייתה לו אפשרות להביא לגביה ראיות או לחקור לגביה עדים.</p><p>2. הגנה מאימת הערעור (תקרת הענישה המקורית): מניעת יצירת \"אפקט מצנן\" המרתיע נאשמים מלממש את זכות הערעור החוקתית שלהם מחשש שבית המשפט יחמיר עמם מיוזמתו עקב שינוי הסיווג.</p><h4>ב. ניתוח מנגנון תקרות הענישה בערעור (הגיונות ותרחישים)</h4><p>תרחיש 1: ערעור נאשם בלבד (ללא ערעור מדינה):</p><p>הנאשם נשפט בשלום ונגזרו עליו X שנות מאסר. המדינה לא ערערה.</p><p>התקרה העליונה והמוחלטת לענישה בערכאת הערעור היא X שנות מאסר. גם אם בערעור הורשע לפי סעיף 216 בעבירה חמורה בהרבה, בית המשפט אינו רשאי לעבור את תקרת X השנים.</p><p>תרחיש 2: ערעור נאשם + ערעור נגדי של המדינה על קולת העונש:</p><p>נפתחת לערכאת הערעור הסמכות לחרוג מעבר ל-X שנות המאסר שנפסק בשלום.</p><p>אולם, התקרה החדשה מוגבלת לעונש המרבי של העבירה המקורית בכתב האישום (למשל, 3 שנות מאסר).</p><p>תרחיש 3: חריגה מתקרת כתב האישום המקורי והפרדת תיקים:</p><p>אם העובדות שהוכחו בערעור מגלות עבירה חמורה בהרבה (למשל עבירה של 12 שנות מאסר) והאינטרס הציבורי מחייב ענישה של 8 שנות מאסר – סעיף 216 כובל את ידי ערכאת הערעור מלהטיל עונש זה.</p><p>הפתרון המשפטי: ערכאת הערעור תורה על \"הפרדת תיקים\" ותנחה את המדינה להגיש כתב אישום חדש בגין העבירה החמורה, שבו יתנהל הליך דיוני מלא מהתחלה.</p><h4>ג. ניתוח פסק דין משה קצב (אוזכר בשיעור)</h4><p>1. סיפור המסגרת בקצרה: משה קצב הורשע בבית המשפט המחוזי בעבירות מין חמורות ונגזר עליו עונש מאסר בפועל (בדוגמת המרצה (שהעיד שאינו זוכר את המספר המדויק): כארבע שנות מאסר במחוזי). הנאשם ערער על הרשעתו, והמדינה הגישה ערעור על קולת העונש.</p><p>2. טיעוני הצדדים: הנאשם טען כי יש לזכותו או להקל בעונשו, בעוד המדינה טענה כי העונש קל מדי ואינו הולם את חומרת העבירות.</p><p>3. השאלה המשפטית: האם רשאית ערכאת הערעור להחמיר בעונשו של הנאשם מעבר לעונש שנגזר עליו בערכאה הדיונית?.</p><p>4. ההלכה שהוצאה: הגשת ערעור על קולת העונש בידי המדינה פותחת לבית המשפט העליון את הסמכות להחמיר בעונש (ובמקרה זה הוחמר עונשו ל-7 שנות מאסר בפועל).</p><p>5. תכלית השימוש בפסק הדין בידי המרצה: להדגים את הכלל לפיו סמכות ההחמרה בערעור אינה נפתחת מאליה, אלא מותנית בצעד אקטיבי של הגשת ערעור/ערעור נגדי מטעם המדינה.</p><h4>ד. מלכודות למבחן ודגשים מפורשים של המרצה</h4><p>1. מלכודת תקרת הענישה לפי סעיף 216: במבחן, אם נאשם הורשע בערעור לפי סעיף 216 בעבירה של 12 שנות מאסר אך המדינה לא ערערה על העונש המקורי (שהיה 2 שנים מתוך עבירה של 3 שנים) – קביעה כאילו מותר לגזור עליו 12 שנים היא טעות קשה! המקסימום המותר הוא 2 שנים בלבד.</p><p>2. מלכודת \"החזרת תיק\" מול \"משפט חוזר\": המרצה מדגיש מפורשות: החזרת תיק לערכאה הקודמת לשמיעת ראיה/עדות אינה משפט חוזר!. מדובר בהחזרת התיק לערכאה הדיונית בשל חוסר יכולתה של ערכאת הערעור לגבות ראיות ולהתרשם מאינטונציה ומעדים.</p><p>3. מלכודת \"הערעור הנגדי\": במבחן, יש לשים לב שהמדינה מגישה ערעור נגדי על קולת העונש לא כדי \"להעניש\" את הנאשם על עצם הערעור, אלא כדי לחשוף אותו לסיכון משפטי שיאזן את הדיון.</p><p>---</p><h4>4. פסיקה וחקיקה</h4><h4>א. פסיקה שהוזכרה בנושא</h4><p>מדינת ישראל נ' משה קצב (אוזכר בשיעור כ\"תיק קצב\"):</p><p>מה פסק הדין מלמד בנושא: מדגים כי הגשת ערעור על קולת העונש מטעם המדינה פותחת לערכאת הערעור את הסמכות להחמיר בעונשו של הנאשם (בדוגמת המרצה: החמרה מ-4 ל-7 שנות מאסר עקב ערעור המדינה).</p><h4>ב. חקיקה שהוזכרה בנושא</h4><p>חוק סדר הדין הפלילי [נוסח משולב], התשמ\"ב-1984 (חסד\"פ):</p><p>סעיף 216: מסדיר את סמכות בית המשפט בערעור להרשיע נאשם בעבירה שאשמתו בה נתגלתה מן העובדות שהוכחו, ובלבד שניתנה לו הזדמנות סבירה להתגונן ושלא יוטל עונש חמור מזה שאפשר היה להטיל לפי כתב האישום המקורי.</p><p>---</p><li>אשמח לדעת במה תעדיף להתמקד!</li></section><section class=\"release-2a-addition\"><h3>הרחבת שיעור 9 — appeal sentencing cross appeal</h3><h4>📚 גבולות הענישה בערעור, ערעור נגדי והסייג להחמרת עונש</h4><p>---</p><h4>1. תקציר הנושא</h4><p>הכלל המרכזי: כאשר רק הנאשם מגיש ערעור פלילי (על הכרעת הדין או על חומרת העונש), לערכאת הערעור אין סמכות להחמיר בעונשו מעבר לעונש שנגזר עליו בערכאה הדיונית.</p><p>התנאים המרכזיים לפתיחת סמכות ההחמרה בעונש:</p><p>1. הגשת ערעור (או ערעור נגדי) מטעם המדינה/התביעה מפורשות בגין קולת העונש.</p><p>2. מתן הזדמנות לנאשם להתגונן בפני טענות ההחמרה.</p><p>החריג המרכזי וסייגי התקרה בענישה:</p><p>היעדר ערעור מדינה: העונש שנגזר בערכאה הדיונית מהווה תצפית ותקרה מוחלטת שלא ניתן לעבור אותה.</p><p>הסייג בסעיף 216 לחסד\"פ (בהרשעה בעבירה שונה): גם אם המדינה ערערה על קולת העונש והנאשם הורשע בערעור בעבירה חמורה בהרבה מזו שהורשע בה בערכאה הקודמת, העונש המרבי שניתן להטיל מוגבל לעונש המרבי של העבירה המקורית בכתב האישום המקורי.</p><p>סמכות או מועד חשוב:</p><p>סמכות ל\"הפרדת תיקים\": אם העובדות שהוכחו בערעור מגלות עבירה חמורה בהרבה המצריכה ענישה קשה שאינה אפשרית בשל תקרת הערעור/כתב האישום המקורי, מוסמכת ערכאת הערעור להורות על הפרדת תיקים והנחיית המדינה להגיש כתב אישום חדש.</p><p>הבחנה חשובה: הבחנה בין ערעור עצמאי של המדינה על קולת העונש לבין \"ערעור נגדי\" שהמדינה מגישה כתגובה טקטית לערעור הנאשם כדי לחשוף אותו לסיכון סימטרי של החמרה.</p><p>נקודת מבחן מרכזית: בפתרון קייס במבחן, יש לבדוק תחילה מי הגיש את הערעור; אם רק הנאשם ערער, העונש שנגזר בערכאה הדיונית הוא התיקרה המוחלטת, ואי-הגשת ערעור נגדי בידי המדינה כובלת לחלוטין את ידי ערכאת הערעור מלהחמיר בעונש.</p><p>---</p><h4>2. קריאה מורחבת</h4><h4>א. מקור נורמטיבי וסעיפי חוק</h4><p>חוק סדר הדין הפלילי [נוסח משולב], התשמ\"ב-1984 (חסד\"פ):</p><p>סעיף 216: מסדיר את הסייג הקובע כי בהרשעה בעבירה שונה בערעור \"לא יוטל עונש חמור מזה שאפשר היה להטיל אילו הוכחו העובדות שניתנו בכתב האישום המקורי\".</p><h4>ב. הכלל המשפטי: אי-החמרה בערעור הנאשם בלבד</h4><p>זכויות המערער מול סיכון ההחמרה: נחקר/נאשם המממש את זכותו החוקתית לערער על הרשעתו או על חומרת עונשו אינו צפוי להחמרה בעונשו מיוזמת בית המשפט.</p><p>הכלל: אם הנאשם מגיש ערעור על הכרעת הדין (מבקש זיכוי) או על חומרת העונש (מבקש הקלה), וערכאת הערעור דוחה את טענותיו – היא רשאית להשאיר את העונש על כנו או להקל בו, אך אינה מוסמכת להחמיר עמו מעבר לעונש שנגזר עליו בערכאה הדיונית.</p><h4>ג. התנאי להחמרה: ערעור/ערעור נגדי מטעם המדינה</h4><p>סמכות ההחמרה: הסמכות להחמיר בעונשו של נאשם בערכאת הערעור נפתחת אך ורק כאשר המדינה מגישה ערעור (או ערעור נגדי) המלין במפורש על קולת העונש.</p><p>הטקטיקה המשפטית בפרקטיקה (\"ערעור נגדי\"):</p><p>במציאות המשפטית, ברגע שנאשם מגיש ערעור על חומרת העונש, התביעה/המדינה מגישה כמעט כדבר שבשגרה ערעור נגדי על קולת העונש.</p><p>הרציונל התביעתי: יצירת מאזן הרתעתי וסיכון משפטי; להבהיר לנאשם כי ניסיונו להפחית בעונשו פותח פתח מקביל להחמרת עונשו.</p><p>עצמאות ערעור המדינה: המדינה רשאית לערער על קולת העונש באופן עצמאי בלא קשר לערעור הנאשם, אך כשהנאשם מערער – הערעור הנגדי משמש כלי טקטי מרכזי.</p><h4>ד. תקרות הענישה בערעור והסייג לפי סעיף 216 לחסד\"פ</h4><p>1. תקרה 1 (היעדר ערעור מדינה):</p><p>העונש שנגזר בערכאה הדיונית (למשל שנתיים מאסר) מהווה תקרת ענישה עליונה. לא ניתן לגזור אפילו יום אחד מעבר לכך.</p><p>2. תקרה 2 (עם ערעור מדינה על קולת העונש):</p><p>נפתחת הסמכות להחמיר בעונש מעבר לגזר הדין של הערכאה הדיונית.</p><p>אולם, אם ההרשעה בערעור מבוססת על סעיף 216 לחסד\"פ (הרשעה בעבירה שונה), נקבע סייג קשיח בחוק: העונש לא יעלה על העונש המרבי הקבוע לעבירה המקורית בכתב האישום המקורי (למשל 3 שנות מאסר).</p><p>3. פתרון חריגה מתקרה – הפרדת תיקים:</p><p>אם בערעור מתגלה עבירה חמורה בהרבה (למשל עבירת המתה שדינה 12 שנות מאסר) והאינטרס הציבורי מחייב ענישה חמורה מעבר לתקרת כתב האישום המקורי, ערכאת הערעור כבולה מלהטיל עונש זה.</p><p>הפתרון המשפטי: ערכאת הערעור תורה על \"הפרדת תיקים\" ותנחה את המדינה להגיש כתב אישום חדש.</p><h4>ה. דוגמאות המרצה</h4><p>1. דוגמת תיק משה קצב (מימוש סמכות ההחמרה בערעור):</p><p>בית המשפט המחוזי גזר על משה קצב עונש מאסר בפועל (בדוגמת המרצה (שהעיד שאינו זוכר את המספר המדויק): כארבע שנות מאסר).</p><p>הנאשם ערער על הרשעתו/עונשו לעליון, והמדינה מצידה הגישה ערעור נגדי על קולת העונש.</p><p>התוצאה: כיוון שהמדינה הגישה ערעור על קולת העונש, נפתחה לבית המשפט העליון הסמכות להחמיר, והעליון החמיר את עונשו ל-7 שנות מאסר בפועל.</p><p>2. דוגמת אייל (ניתוח מדרגות התקרה והפרדת תיקים):</p><p>העובדות: אייל הורשע בבית משפט השלום בעבירה של גרימת מוות ברשלנות (עונש מרבי בחוק: 3 שנות מאסר), ובית משפט השלום גזר עליו שנתיים מאסר בפועל. אייל ערער על הרשעתו לבית המשפט המחוזי. המדינה לא הגישה ערעור.</p><p>תרחיש א' (ללא ערעור מדינה): במהלך הדיון במחוזי, לאחר שניתנה לו הזדמנות סבירה להתגונן (לפי סעיף 216), התברר מעובדות התיק שאייל ביצע עבירת המתה חמורה שעונשה 12 שנות מאסר. המחוזי מוסמך להרשיעו לפי סעיף 216 בעבירת ההמתה, אך אינו מוסמך להטיל עליו עונש הגבוה משנתיים מאסר! (משום שהמדינה לא ערערה על קולת העונש).</p><p>תרחיש ב' (אילו המדינה הייתה מגישה ערעור על קולת העונש): אילו המדינה הייתה מערערת על קולת העונש, המחוזי היה מוסמך להחמיר מעבר לשנתיים, אך היה חסום בתקרה של 3 שנות מאסר בלבד (העונש המרבי של עבירת גרימת המוות ברשלנות שהופיעה בכתב האישום המקורי, מכוח סעיף 216).</p><p>פתרון המקרה במציאות: בשל הפער בין העונש הראוי לעבירת המתה (12 שנים) לבין התקרה הבלתי אפשרית בערעור, בית המשפט המחוזי יורה על הפרדת תיקים וינחה את המדינה להגיש כתב אישום חדש בגין עבירת ההמתה.</p><h4>ו. משמעות מעשית למבחן</h4><p>בפתרון קייס במבחן:</p><p>1. יש לבחון מי הגיש את הערעור. אם המדינה לא ערערה על העונש – גזר הדין של הערכאה הדיונית הוא התיקרה המוחלטת.</p><p>2. אם מיושם סעיף 216 בערעור והמדינה ערערה על העונש – התקרה היא העונש המרבי של העבירה המקורית בכתב האישום המקורי.</p><p>3. אם נדרשת ענישה חמורה מעבר לכך – יש להורות על הפרדת תיקים והגשת כתב אישום חדש.</p><p>---</p><h4>3. הרחבה מקיפה</h4><h4>א. ניתוח המבנה הנורמטיבי והאיזון החוקתי</h4><p>דיני הענישה בערעור מאזנים בין שתי תכליות יסוד מתנגשות:</p><p>1. הגנה על זכות הערעור החוקתית של הנאשם: מניעת יצירת \"אפקט מצנן\" (Chilling effect) שירתיע נאשמים מלפנות לערכאת ערעור מחשש שערכאת הערעור תחמיר בעונשם מיוזמתה.</p><p>2. אינטרס הציבור בענישה הולמת ומאזן סימטרי: מתן אפשרות לתביעה לייצג את האינטרס הציבורי ולבקש החמרה בעונש מקל מדי, תוך הבטחה כי הסיכון בערעור יהיה הדדי.</p><h4>б. ניתוח מעמיק של שלוש מדרגות הענישה בערעור</h4><p>מדרגה 1: ערעור הנאשם בלבד (סייג ההחמרה המוחלט):</p><p>כלל: \\\\(תקרת\\, הענישה = העונש\\, שנגזר\\, בערכאה\\, הדיונית\\\\).</p><p>רציונל: בהיעדר טענה מטעם המדינה כי העונש קל, לבית המשפט אין סמכות להפוך לקטגור מיוזמתו.</p><p>מדרגה 2: ערעור נגדי של המדינה בתיק רגיל:</p><p>כלל: \\\\(תקרת\\, הענישה = העונש\\, המרבי\\, הקבוע\\, בחוק\\, לעבירה\\, שבה\\, הורשע\\\\).</p><p>רציונל: פניית המדינה פותחת את מלוא מתחם הענישה הסטטוטורי של העבירה.</p><p>מדרגה 3: ערעור נגדי של המדינה + הרשעה בעבירה שונה בערעור (סעיף 216):</p><p>כלל: \\\\(תקרת\\, הענישה = העונש\\, המרבי\\, הקבוע\\, בחוק\\, לעבירה\\, המקורית\\, בכתב\\, האישום\\, המקורי\\\\).</p><p>רציונל: מניעת קפנדריה תביעתית שבה שינוי הסיווג המשפטי בערעור ישמש מעקף להטלת עונשים חמורים שלא נכללו בכתב האישום המקורי שנגדו התגונן הנאשם.</p><h4>ג. ניתוח פסק דין משה קצב (אוזכר בשיעור)</h4><p>1. עובדות המקרה בשיעור: משה קצב הורשע בבית המשפט המחוזי ונגזרו עליו 4 שנות מאסר בפועל (כפי שהוצג בדוגמת המרצה). קצב ערער לבית המשפט העליון, והמדינה הגישה ערעור נגדי על קולת העונש.</p><p>2. השאלה המשפטית: האם מוסמך בית המשפט העליון להחמיר את העונש מ-4 ל-7 שנות מאסר בפועל?</p><p>3. הכרעת בית המשפט העליון וההלכה: נקבע כי מאחר והמדינה הגישה ערעור על קולת העונש, קמה לבית המשפט העליון הסמכות להחמיר בעונש, ועונשו הועלה ל-7 שנות מאסר בפועל.</p><p>4. תכלית השימוש בפסק הדין בידי המרצה: להדגים כי ערעור נגדי של המדינה אינו דיבור בעלמא, אלא כלי משפטי אופרטיבי המשנה באופן דרמטי את תקרת הענישה בערעור.</p><h4>ד. מלכודות למבחן ודגשים מפורשים של המרצה</h4><p>1. מלכודת הבלבול בין שנתיים לשלוש שנים (דוגמת אייל): במבחן, אם נאשם שנגזרו עליו שנתיים (מתוך 3 שנים) ערער למחוזי והמדינה לא ערערה, והתברר בערעור שביצע עבירה של 12 שנים – קביעה כאילו מותר לגזור עליו 3 שנים היא טעות! ללא ערעור מדינה, המקסימום הוא שנתיים בלבד. רק אם המדינה הייתה מערערת, התקרה הייתה עולה ל-3 שנים.</p><p>2. מלכודת הפרדת התיקים: במבחן, כאשר הפער בין הענשת סעיף 216 לבין תקרת כתב האישום המקורי הוא עצום, הפתרון המשפטי הנכון והיחיד שעל בית המשפט להורות עליו הוא הפרדת תיקים והנחיית המדינה להגיש כתב אישום חדש.</p><p>3. מלכודת עצמאות ערעור המדינה: המרצה מבהיר כי המדינה אינה מחויבת לחכות לערעור הנאשם כדי לערער על קולת העונש. היא רשאית לערער מיוזמתה, אך בפרקטיקה הערעור הנגדי מוגש כתגובה טקטית מאזנת.</p><p>---</p><h4>4. פסיקה וחקיקה</h4><h4>א. פסיקה שהוזכרה בנושא</h4><p>מדינת ישראל נ' משה קצב (אוזכר בשיעור כ\"תיק קצב\"):</p><p>משמעות לנושא: מראים כי הגשת ערעור על קולת העונש מטעם המדינה פותחת לערכאת הערעור את הסמכות להחמיר בעונשו של הנאשם (בדוגמת המרצה: החמרה מ-4 ל-7 שנות מאסר בפועל עקב ערעור המדינה).</p><h4>ב. חקיקה שהוזכרה בנושא</h4><p>חוק סדר הדין הפלילי [נוסח משולב], התשמ\"ב-1984 (חסד\"פ):</p><p>סעיף 216: מסדיר את הסייג הקובע כי בהרשעה בעבירה שונה בערעור לא יוטל עונש חמור מזה שאפשר היה להטיל אילו הוכחו העובדות שניתנו בכתב האישום המקורי.</p><p>---</p><li>או לבחור כל נושא אחר שתרצה מתוך הרשימה!</li></section>"},"arrest-basics":{"title":"יסודות דיני מעצרים","html":"\n      <div class=\"eyebrow\">חוק המעצרים · חוק יסוד כבוד האדם וחירותו</div>\n      <h2>יסודות דיני המעצרים</h2>\n      <p><b>אסיר</b> — הורשע ונגזר עליו מאסר בפועל, מוחזק לריצוי עונשו. <b>עצור</b> — מוחזק לפני/בזמן ההליך, נהנה מחזקת החפות.</p>\n      <p><b>עיכוב</b> — הגבלת חירות קלה ומתוחמת (בירור/חקירה במקום). <b>מעצר</b> — שלילת חירות מלאה.</p>\n      <p>כללי הברזל: במסלול סעיף 23(א) נדרשת עבירה שאינה חטא; סעיף 23(ב) הוא מסלול נפרד הנוגע לעיכוב חוקי; אין לעצור אם ניתן להסתפק בעיכוב; אין לעצור אם ניתן להשיג את התכלית בחלופת מעצר.</p>\n      <div class=\"callout case-callout\"><span class=\"callout-title\">קשור לפסק דין</span><button class=\"case-link\" data-case=\"26\">⚖ קסאי — זכות התנגדות למעצר בלתי חוקי</button></div>\n      <button class=\"expand-link\" data-topic=\"arrest-basics\">🔎 קריאה מורחבת</button>\n    <h3>חיפוש במכשיר נייד ובחומר מחשב — סעיף 23א לפקודת החיפוש</h3><p>חיפוש בטלפון או בחומר מחשב הוא חיפוש בעל מאפיינים ייחודיים, ולכן יש לבחון את מקור הסמכות ואת היקף הצו באופן קונקרטי. עצם העובדה שהמכשיר נתפס אינה מתירה עיון גורף בתוכנו. כאשר נטען שחיפוש בלתי חוקי קדם לבקשת הצו, יש להפריד בין חוקיות האיסוף המוקדם לבין תוקף הצו והראיות שנאספו מכוחו, ולבחון את התוצאה לפי ההגנות והאיזונים שנלמדו בבן חיים וביששכרוב.</p><section class=\"release-2a-addition\"><h3>הרחבת שיעור 9 — arrest search legality principle</h3><h4>📚 המסגרת הנורמטיבית של דיני מעצרים וחיפוש ועיקרון החוקיות (סעיף 1 לחוק המעצרים)</h4><p>---</p><h4>1. תקציר הנושא</h4><p>הכלל המרכזי: עיקרון החוקיות בסעיף 1 לחוק המעצרים קובע כי אין מעצר ואין עיכוב אלא בחוק או לפי חוק מכוח הסמכה מפורשת, ובדרך שיבטיחו שמירה מרבית על כבוד האדם וחירותו.</p><p>התנאים המרכ
