 העליון להאריך מעצר עד תום ההליכים מעבר לתקופות בסעיף 61.</p><p>הלכת בית המשפט העליון: בש\"פ ילנה מורוזובה נ' מדינת ישראל.</p><h4>ב. הכלל המשפטי: מהות מעצר עד תום ההליכים</h4><p>האיזון החוקתי: לאחר הגשת כתב אישום, הנאשם נהנה מחזקת החפות (הוא חף מפשע עד שבית המשפט יקבע אחרת). אולם, כאשר קיימת עילת מעצר מובהקת (כגון מסוכנות לשלום הציבור), המדינה אינה יכולה להרשות לעצמה שהנאשם יסתובב חופשי ברחוב במהלך ניהול משפטו.</p><p>צורות המעצר עד תום ההליכים:</p><p>1. מעצר רגיל: החזקת הנאשם מאחורי סורג ובריח במתקן מעצר/כלא.</p><p>2. מעצר בפיקוח אלקטרוני: החזקת הנאשם בביתו תוך ענידת אזיק אלקטרוני בקרסול המפקח על מיקומו. יציאה מהבית מפעילה התרעה צלילית וגוררת זינוק של שוטרים ומעבר למעצר רגיל.</p><h4>ג. תקרות הזמן והסמכות להארכה (סעיפים 61 ו-62)</h4><p>תקרות הזמן בחוק (סעיף 61):</p><p>9 חודשים: תקרת הזמן הסטטוטורית למעצר עד תום ההליכים במעצר רגיל.</p><p>18 חודשים: תקרת הזמן הסטטוטורית למעצר עד תום ההליכים בפיקוח אלקטרוני.</p><p>מנגנון ה\"טיימר\": ברגע שבית המשפט מורה על מעצר עד תום ההליכים, נפתח \"שעון מתקתק\" מעל ראש התביעה ובית המשפט, המחייב לנהל ולסיים את המשפט בתוך התקופה הקצובה.</p><p>הארכה בידי בית המשפט העליון (סעיף 62): אם המשפט לא הסתיים בתוך 9 חודשים (או 18 חודשים בפיקוח אלקטרוני), בית המשפט המחוזי/השלום אינו מוסמך להאריך את המעצר בעצמו. המדינה מחויבת לפנות בבקשה מיוחדת לבית המשפט העליון מכוח סעיף 62, ורק העליון מוסמך להורות על הארכת המעצר.</p><h4>ד. הלכת ילנה מורוזובה (אי-איפוס המרוץ)</h4><p>כאשר ערכאת הערעור (בית המשפט העליון) מבטלת הרשעה בשל פגם חמור בהליך ומחזירה את התיק לערכאה הדיונית (בית המשפט המחוזי) כדי להתחיל את המשפט מההתחלה, מרוץ 9 החודשים אינו מתאפס!</p><p>מכוח עיקרון החוקיות (סעיף 1), בית המשפט המחוזי אינו רשאי לקצוב מעצר עד תום ההליכים מחדש כ\"מעצר חדש\". אם חלפו 9 חודשים, המדינה מחויבת לפנות לבית המשפט העליון לפי סעיף 62 לקבלת צו הארכה; בהיעדר אישור מהעליון – הנאשם משוחרר.</p><h4>ה. דוגמאות המרצה</h4><p>1. דוגמת ראובן הרוצח:</p><p>ראובן דקר ורצח את שושנה. הוא נעצר במהלך החקירה. עם הגשת כתב האישום, הפרקליטות מבקשת לעצור אותו עד תום ההליכים.</p><p>הסבר המרצה: אף שראובן נהנה כרגע מחזקת החפות עד לתום המשפט, לא ניתן לאפשר לאדם שביצע רצח להסתובב חופשי ברחוב בשל הסכנה העצומה שהוא מהווה לשלום הציבור. לפיכך הוא מושם במעצר עד תום ההליכים, ועל המשפט להסתיים בתוך 9 חודשים.</p><p>2. דוגמת האזיק האלקטרוני בקרסול:</p><p>המרצה מדגים את מנגנון הפיקוח האלקטרוני: שמים אזיק בקרסול המנטר את המיקום. אם הנאשם מנסה לצאת מהבית, האזיק מצפצף; אם הוא מתעלם וממשיך לצאת, מוקפצים שוטרים שעוצרים אותו ומעבירים אותו למעצר רגיל מאחורי סורג ובריח.</p><h4>ו. משמעות מעשית למבחן</h4><p>בפתרון קייס במבחן:</p><p>1. יש לבדוק האם מדובר בנאשם שהוגש נגדו כתב אישום (מעצר עד תום ההליכים) ולבחון את סוג המעצר (רגיל = 9 חודשים; פיקוח אלקטרוני = 18 חודשים).</p><p>2. אם חלפה תקרת הזמן והמשפט טרם הסתיים, חובה לציין כי הסמכות הבלעדית להארכה שמורה לבית המשפט העליון לפי סעיף 62.</p><p>3. אם התיק הוחזר לדיון מחדש בערכאה הדיונית, יש ליישם את הלכת מורוזובה ולהתריע כי ניסיון לקצוב מעצר מחדש כ\"מעצר חדש\" הוא בלתי חוקי ומפר את עיקרון החוקיות (סעיף 1).</p><p>---</p><h4>3. הרחבה מקיפה</h4><h4>א. ניתוח מעמיק של המבנה הנורמטיבי והאיזון החוקתי</h4><p>ההסדר של מעצר עד תום ההליכים בסעיפים 61 ו-62 לחוק המעצרים מגלם את המתח החריף ביותר בדיון הפלילי בין חזקת החפות וזכות היסוד לחירות לבין הגנת שלום הציבור ותקינות ההליך המשפטי.</p><p>1. המתח מול חזקת החפות: בשלב המעצר עד תום ההליכים, הנאשם טרם הורשע. שלילת חירותו לתקופה مמושכת מהווה פגיעה קשה ביותר בחירותו בטרם נגזר דינו.</p><p>2. תכלית הקציבה בסטופר סטטוטורי (סעיף 61): המחוקק קבע תקרות קשיחות (9 חודשים / 18 חודשים) כדי ליצור לחץ מערכתי על התביעה ובית המשפט לנהל את המשפט ביעילות ובמהירות, ולמנוע מצב של \"מאסר מנהלי דה-פקטו\" ללא הכרעת דין.</p><p>3. הבקרה השיפוטית העליונה (סעיף 62): ההכרעה להחזיק אדם במעצר מעבר לתקרה הסטטוטורית הוצאה מידי הערכאה הדיונית והופקדה בידי הערכאה הגבוהה ביותר (בית המשפט העליון), כדי להבטיח פיקוח הדוק ומבוקר על כל יום נוסף של שלילת חירות.</p><h4>ב. ניתוח מעמיק של פסק דין ילנה מורוזובה</h4><p>1. סיפור המסגרת בקצרה:</p><p>נגד ילנה מורוזובה הוגש כתב אישום והיא נעצרה עד תום ההליכים לפי סעיף 61 לחוק המעצרים.</p><p>המשפט התנהל בבית המשפט המחוזי, ולאורכו שהתה מורוזובה במעצר. בתום המשפט היא הורשעה בדין.</p><p>מורוזובה הגישה ערעור לבית המשפט העליון. העליון מצא כי נפל פגם פרוצדורלי/ראייתי כבד מאוד בניהול המשפט בערכאה הדיונית, ביטל את הכרעת הדין, והורה להחזיר את התיק לבית המשפט המחוזי כדי להתחיל לנהל את המשפט מחדש מבראשית.</p><p>2. מה טיעוני הצדדים:</p><p>טיעון המדינה: המדינה טענה כי ברגע שהכרעת הדין בוטלה והמשפט הוחזר להתחלה, הדיון הפלילי \"מתחיל מאפס\". לפיכך, לטענת המדינה, מוקנית לבית המשפט המחוזי סמכות לקצוב מעצר עד תום ההליכים חדש לתקופה של 9 חודשים נוספים מראש.</p><p>טיעון הנאשמת: הנאשמת טענה כי תקרת 9 החודשים נספרת מיום המעצר המקורי. כיוון שאין בחוק סעיף המאפשר איפוס או קציבה מחדש, הרי שמכוח עיקרון החוקיות המעצר פקע, והדרך היחידה להמשיך להחזיקה במעצר היא הגשת בקשת הארכה לבית המשפט העליון לפי סעיף 62.</p><p>3. מה השאלות המשפטיות העומדות להכרעה:</p><p>האם החזרת תיק על ידי ערכאת הערעור לדיון מחדש בערכאה הדיונית מאפסת את מרוץ 9 החודשים של מעצר עד תום ההליכים ומאפשרת לקצוב מעצר חדש, או שמא מרוץ הזמנים ממשיך ונדרשת הארכה מהעליון לפי סעיף 62?</p><p>4. מה ההלכה שיצאה מפסק הדין:</p><p>בית המשפט העליון קבע הלכה קשיחה המבוססת על עיקרון החוקיות (סעיף 1 לחוק המעצרים): \"אין מעצר ללא סמכות לפי חוק\".</p><p>בחוק המעצרים אין שום הוראה המאפשרת איפוס או קציבה מחדש של תקופת מעצר עד תום ההליכים עקב החזרת תיק לדיון מחדש.</p><p>לפיכך, בית המשפט המחוזי אינו מוסמך לפסוק מעצר עד תום ההליכים חדש. המסלול החוקי היחיד להמשך המעצר הוא הגשת בקשת הארכה לבית המשפט העליון מכוח סעיף 62; בהיעדר אישור מהעליון – הנאשמת חייבת להשתחרר.</p><p>5. תכלית הלימוד ע\"י המרצה:</p><p>המרצה משתמש בהלכת מורוזובה כדי להדגים לסטודנטים את עוצמתו של עיקרון החוקיות בסעיף 1, וכדי להבהיר כי המערכת המשפטית אינה מוכנה לסבול יצירת סמכויות מעצר מכללא או איפוס זמנים הפוגע בחירות הנאשם ללא הסמכה חוקית מפורשת.</p><h4>ג. מלכודות למבחן ודגשים מפורשים של המרצה</h4><p>1. מלכודת איפוס ה\"טיימר\" (מורוזובה): במבחן, אם מוצג תרחיש שבו בית המשפט העליון החזיר תיק לדיון מחדש והתביעה מנסה לבקש מעצר עד תום ההליכים מחדש ל-9 חודשים בערכאה הדיונית – זוהי טעות משפטית חמורה! חובה לציין לפי הלכת מורוזובה שהמרוץ אינו מתאפס, והסמכות היחידה להארכה היא פנייה לעליון לפי סעיף 62.</p><p>2. מלכודת 9 חודשים מול 18 חודשים: במבחן, יש לדייק בסוג המעצר: מעצר רגיל מוגבל ל-9 חודשים, בעוד מעצר בפיקוח אלקטרוני מוגבל ל-18 חודשים.</p><p>3. דגש מפורש של המרצה: המרצה מזהיר מפורשות כי נושא זה (מעצר עד תום ההליכים, מגבלות הזמן והלכת מורוזובה) \"יופיע בבחינה בוודאות\" כיוון שהוא מהווה אבן דרך קריטית בדיני המעצרים.</p><p>---</p><h4>4. פסיקה וחקיקה</h4><h4>א. פסיקה שהוזכרה בנושא</h4><p>ילנה מורוזובה נ' מדינת ישראל (אוזכר בשיעור כ\"פסק דין ילנה מורוזובה\"):</p><p>מה פסק הדין מלמד בנושא: מעגן את עיקרון החוקיות (סעיף 1 לחוק המעצרים) וקובע כי החזרת תיק על ידי ערכאת הערעור לדיון מחדש בערכאה הדיונית אינה מאפסת את מרוץ 9 החודשים של מעצר עד תום ההליכים (סעיף 61), וכי הדרך החוקית היחידה להמשך המעצר היא פנייה לבית המשפט העליון לקבלת צו הארכה מכוח סעיף 62.</p><h4>ב. חקיקה שהוזכרה בנושא</h4><p>חוק סדר הדין הפלילי (סמכויות אכיפה – מעצרים), התשנ\"ו-1996 (\"חוק המעצרים\"):</p><p>סעיף 1: מעגן את עיקרון החוקיות בדיני מעצרים ועיכוב – אין מעצר ואין עיכוב אלא בחוק או לפי חוק מכוח הסמכה מפורשת.</p><p>סעיף 61: מסדיר את מגבלות הזמן הסטטוטוריות למעצר עד תום ההליכים (9 חודשים במעצר רגיל, 18 חודשים בפיקוח אלקטרוני).</p><p>סעיף 62: מסדיר את הסמכות הבלעדית של בית המשפט העליון להאריך מעצר עד תום ההליכים מעבר לתקופות בסעיף 61.</p><p>---</p><li>או לבחור כל נושא אחר שתרצה מתוך הרשימה!</li></section><section class=\"release-2a-addition\"><h3>הרחבת שיעור 9 — police delay powers time records</h3><h4>📚 מעצר עד תום ההליכים, מגבלות הזמן והלכת ילנה מורוזובה</h4><p>---</p><h4>1. תקציר הנושא</h4><p>הכלל המרכזי: מעצר עד תום ההליכים הוא שלילת חירותו של נאשם לאחר הגשת כתב אישום ועד לסיום משפטו, בשל מסוכנותו לשלום הציבור, וזאת על אף שקיימת לו חזקת החפות כל עוד לא הוכחה אשמתו.</p><p>חלופות המעצר ומגבלות הזמן הסטטוטוריות (סעיף 61 לחוק המעצרים):</p><p>1. מעצר רגיל (מאחורי סורג ובריח): מוגבל בחוק לתקופה מרבית של 9 חודשים.</p><p>2. מעצר בפיקוח אלקטרוני (אזיק אלקטרוני בקרסול): מוגבל בחוק לתקופה מרבית של 18 חודשים.</p><p>החריג המרכזי והארכת מעצר (סעיף 62 לחוק המעצרים):</p><p>הארכת מעצר מעבר לתקרה: הסמכות להאריך את המעצר עד תום ההליכים מעבר ל-9 חודשים (או 18 חודשים בפיקוח אלקטרוני) נתונה בסמכותו הבלעדית של בית המשפט העליון.</p><p>סמכות ומועד חשוב:</p><p>המרוץ הסטטוטורי (\"הטיימר\"): ממועד מתן צו המעצר עד תום ההליכים נפתחת ספירת זמן קשיחה (\"שעון מתקתק\") המחייבת את המערכת לסיים את המשפט בתוך תקרת הזמן הקבועה בחוק.</p><p>הבחנה חשובה: הבחנה בין מעצר ימים במהלך חקירה (הנמדד בימים ונערך לפני הגשת כתב אישום) לבין מעצר עד תום ההליכים (הנמדד בחודשים ונערך לאחר הגשת כתב אישום).</p><p>נקודת מבחן מרכזית (הלכת ילנה מורוזובה): ביטול הרשעה והחזרת תיק על ידי בית המשפט העליון לדיון מחדש בערכאה הדיונית אינם מאפסים (\"קוצבים מחדש\") את תקופת 9 החודשים של מעצר עד תום ההליכים. בהיעדר הסמכה מפורשת בחוק לאיפוס המרוץ, חל עיקרון החוקיות (סעיף 1 לחוק המעצרים), והדרך החוקית היחידה להמשך המעצר היא הגשת בקשת הארכה לבית המשפט העליון לפי סעיף 62.</p><p>---</p><h4>2. קריאה מורחבת</h4><h4>א. מקור נורמטיבי וסעיפי חוק</h4><p>חוק סדר הדין הפלילי (סמכויות אכיפה – מעצרים), התשנ\"ו-1996 (\"חוק המעצרים\"):</p><p>סעיף 1: מעגן את עיקרון החוקיות – אין מעצר ואין עיכוב אלא בחוק או לפי חוק מכוח הסמכה מפורשת.</p><p>סעיף 61: מסדיר את קציבת התקופה המרבית של מעצר עד תום ההליכים (9 חודשים במעצר רגיל, 18 חודשים בפיקוח אלקטרוני).</p><p>סעיף 62: מסדיר את הסמכות הבלעדית של בית המשפט העליון להאריך מעצר עד תום ההליכים מעבר לתקופות בסעיף 61.</p><p>הלכת בית המשפט העליון: בש\"פ ילנה מורוזובה נ' מדינת ישראל.</p><h4>ב. הכלל המשפטי: מהות מעצר עד תום ההליכים</h4><p>האיזון החוקתי: לאחר הגשת כתב אישום, הנאשם נהנה מחזקת החפות (הוא חף מפשע עד שבית המשפט יקבע אחרת). אולם, כאשר קיימת עילת מעצר מובהקת (כגון מסוכנות לשלום הציבור), המדינה אינה יכולה להרשות לעצמה שהנאשם יסתובב חופשי ברחוב במהלך ניהול משפטו.</p><p>צורות המעצר עד תום ההליכים:</p><p>1. מעצר רגיל: החזקת הנאשם מאחורי סורג ובריח במתקן מעצר/כלא.</p><p>2. מעצר בפיקוח אלקטרוני: החזקת הנאשם בביתו תוך ענידת אזיק אלקטרוני בקרסול המפקח על מיקומו. יציאה מהבית מפעילה התרעה צלילית וגוררת זינוק של שוטרים ומעבר למעצר רגיל.</p><h4>ג. תקרות הזמן והסמכות להארכה (סעיפים 61 ו-62)</h4><p>תקרות הזמן בחוק (סעיף 61):</p><p>9 חודשים: תקרת הזמן הסטטוטורית למעצר עד תום ההליכים במעצר רגיל.</p><p>18 חודשים: תקרת הזמן הסטטוטורית למעצר עד תום ההליכים בפיקוח אלקטרוני.</p><p>מנגנון ה\"טיימר\": ברגע שבית המשפט מורה על מעצר עד תום ההליכים, נפתח \"שעון מתקתק\" מעל ראש התביעה ובית המשפט, המחייב לנהל ולסיים את המשפט בתוך התקופה הקצובה.</p><p>הארכה בידי בית המשפט העליון (סעיף 62): אם המשפט לא הסתיים בתוך 9 חודשים (או 18 חודשים בפיקוח אלקטרוני), בית המשפט המחוזי/השלום אינו מוסמך להאריך את המעצר בעצמו. המדינה מחויבת לפנות בבקשה מיוחדת לבית המשפט העליון מכוח סעיף 62, ורק העליון מוסמך להורות על הארכת המעצר.</p><h4>ד. הלכת ילנה מורוזובה (אי-איפוס המרוץ)</h4><p>כאשר ערכאת הערעור (בית המשפט העליון) מבטלת הרשעה בשל פגם חמור בהליך ומחזירה את התיק לערכאה הדיונית (בית המשפט המחוזי) כדי להתחיל את המשפט מההתחלה, מרוץ 9 החודשים אינו מתאפס!</p><p>מכוח עיקרון החוקיות (סעיף 1), בית המשפט המחוזי אינו רשאי לקצוב מעצר עד תום ההליכים מחדש כ\"מעצר חדש\". אם חלפו 9 חודשים, המדינה מחויבת לפנות לבית המשפט העליון לפי סעיף 62 לקבלת צו הארכה; בהיעדר אישור מהעליון – הנאשם משוחרר.</p><h4>ה. דוגמאות המרצה</h4><p>1. דוגמת ראובן הרוצח:</p><p>ראובן דקר ורצח את שושנה. הוא נעצר במהלך החקירה. עם הגשת כתב האישום, הפרקליטות מבקשת לעצור אותו עד תום ההליכים.</p><p>הסבר המרצה: אף שראובן נהנה כרגע מחזקת החפות עד לתום המשפט, לא ניתן לאפשר לאדם שביצע רצח להסתובב חופשי ברחוב בשל הסכנה העצומה שהוא מהווה לשלום הציבור. לפיכך הוא מושם במעצר עד תום ההליכים, ועל המשפט להסתיים בתוך 9 חודשים.</p><p>2. דוגמת האזיק האלקטרוני בקרסול:</p><p>המרצה מדגים את מנגנון הפיקוח האלקטרוני: שמים אזיק בקרסול המנטר את המיקום. אם הנאשם מנסה לצאת מהבית, האזיק מצפצף; אם הוא מתעלם וממשיך לצאת, מוקפצים שוטרים שעוצרים אותו ומעבירים אותו למעצר רגיל מאחורי סורג ובריח.</p><h4>ו. משמעות מעשית למבחן</h4><p>בפתרון קייס במבחן:</p><p>1. יש לבדוק האם מדובר בנאשם שהוגש נגדו כתב אישום (מעצר עד תום ההליכים) ולבחון את סוג המעצר (רגיל = 9 חודשים; פיקוח אלקטרוני = 18 חודשים).</p><p>2. אם חלפה תקרת הזמן והמשפט טרם הסתיים, חובה לציין כי הסמכות הבלעדית להארכה שמורה לבית המשפט העליון לפי סעיף 62.</p><p>3. אם התיק הוחזר לדיון מחדש בערכאה הדיונית, יש ליישם את הלכת מורוזובה ולהתריע כי ניסיון לקצוב מעצר מחדש כ\"מעצר חדש\" הוא בלתי חוקי ומפר את עיקרון החוקיות (סעיף 1).</p><p>---</p><h4>3. הרחבה מקיפה</h4><h4>א. ניתוח מעמיק של המבנה הנורמטיבי והאיזון החוקתי</h4><p>ההסדר של מעצר עד תום ההליכים בסעיפים 61 ו-62 לחוק המעצרים מגלם את המתח החריף ביותר בדיון הפלילי בין חזקת החפות וזכות היסוד לחירות לבין הגנת שלום הציבור ותקינות ההליך המשפטי.</p><p>1. המתח מול חזקת החפות: בשלב המעצר עד תום ההליכים, הנאשם טרם הורשע. שלילת חירותו לתקופה مמושכת מהווה פגיעה קשה ביותר בחירותו בטרם נגזר דינו.</p><p>2. תכלית הקציבה בסטופר סטטוטורי (סעיף 61): המחוקק קבע תקרות קשיחות (9 חודשים / 18 חודשים) כדי ליצור לחץ מערכתי על התביעה ובית המשפט לנהל את המשפט ביעילות ובמהירות, ולמנוע מצב של \"מאסר מנהלי דה-פקטו\" ללא הכרעת דין.</p><p>3. הבקרה השיפוטית העליונה (סעיף 62): ההכרעה להחזיק אדם במעצר מעבר לתקרה הסטטוטורית הוצאה מידי הערכאה הדיונית והופקדה בידי הערכאה הגבוהה ביותר (בית המשפט העליון), כדי להבטיח פיקוח הדוק ומבוקר על כל יום נוסף של שלילת חירות.</p><h4>ב. ניתוח מעמיק של פסק דין ילנה מורוזובה</h4><p>1. סיפור המסגרת בקצרה:</p><p>נגד ילנה מורוזובה הוגש כתב אישום והיא נעצרה עד תום ההליכים לפי סעיף 61 לחוק המעצרים.</p><p>המשפט התנהל בבית המשפט המחוזי, ולאורכו שהתה מורוזובה במעצר. בתום המשפט היא הורשעה בדין.</p><p>מורוזובה הגישה ערעור לבית המשפט העליון. העליון מצא כי נפל פגם פרוצדורלי/ראייתי כבד מאוד בניהול המשפט בערכאה הדיונית, ביטל את הכרעת הדין, והורה להחזיר את התיק לבית המשפט המחוזי כדי להתחיל לנהל את המשפט מחדש מבראשית.</p><p>2. מה טיעוני הצדדים:</p><p>טיעון המדינה: המדינה טענה כי ברגע שהכרעת הדין בוטלה והמשפט הוחזר להתחלה, הדיון הפלילי \"מתחיל מאפס\". לפיכך, לטענת המדינה, מוקנית לבית המשפט המחוזי סמכות לקצוב מעצר עד תום ההליכים חדש לתקופה של 9 חודשים נוספים מראש.</p><p>טיעון הנאשמת: הנאשמת טענה כי תקרת 9 החודשים נספרת מיום המעצר המקורי. כיוון שאין בחוק סעיף המאפשר איפוס או קציבה מחדש, הרי שמכוח עיקרון החוקיות המעצר פקע, והדרך היחידה להמשיך להחזיקה במעצר היא הגשת בקשת הארכה לבית המשפט העליון לפי סעיף 62.</p><p>3. מה השאלות המשפטיות העומדות להכרעה:</p><p>האם החזרת תיק על ידי ערכאת הערעור לדיון מחדש בערכאה הדיונית מאפסת את מרוץ 9 החודשים של מעצר עד תום ההליכים ומאפשרת לקצוב מעצר חדש, או שמא מרוץ הזמנים ממשיך ונדרשת הארכה מהעליון לפי סעיף 62?</p><p>4. מה ההלכה שיצאה מפסק הדין:</p><p>בית המשפט העליון קבע הלכה קשיחה המבוססת על עיקרון החוקיות (סעיף 1 לחוק המעצרים): \"אין מעצר ללא סמכות לפי חוק\".</p><p>בחוק המעצרים אין שום הוראה המאפשרת איפוס או קציבה מחדש של תקופת מעצר עד תום ההליכים עקב החזרת תיק לדיון מחדש.</p><p>לפיכך, בית המשפט המחוזי אינו מוסמך לפסוק מעצר עד תום ההליכים חדש. המסלול החוקי היחיד להמשך המעצר הוא הגשת בקשת הארכה לבית המשפט העליון מכוח סעיף 62; בהיעדר אישור מהעליון – הנאשמת חייבת להשתחרר.</p><p>5. תכלית הלימוד ע\"י המרצה:</p><p>המרצה משתמש בהלכת מורוזובה כדי להדגים לסטודנטים את עוצמתו של עיקרון החוקיות בסעיף 1, וכדי להבהיר כי המערכת המשפטית אינה מוכנה לסבול יצירת סמכויות מעצר מכללא או איפוס זמנים הפוגע בחירות הנאשם ללא הסמכה חוקית מפורשת.</p><h4>ג. מלכודות למבחן ודגשים מפורשים של המרצה</h4><p>1. מלכודת איפוס ה\"טיימר\" (מורוזובה): במבחן, אם מוצג תרחיש שבו בית המשפט העליון החזיר תיק לדיון מחדש והתביעה מנסה לבקש מעצר עד תום ההליכים מחדש ל-9 חודשים בערכאה הדיונית – זוהי טעות משפטית חמורה! חובה לציין לפי הלכת מורוזובה שהמרוץ אינו מתאפס, והסמכות היחידה להארכה היא פנייה לעליון לפי סעיף 62.</p><p>2. מלכודת 9 חודשים מול 18 חודשים: במבחן, יש לדייק בסוג המעצר: מעצר רגיל מוגבל ל-9 חודשים, בעוד מעצר בפיקוח אלקטרוני מוגבל ל-18 חודשים.</p><p>3. דגש מפורש של המרצה: המרצה מזהיר מפורשות כי נושא זה (מעצר עד תום ההליכים, מגבלות הזמן והלכת מורוזובה) \"יופיע בבחינה בוודאות\" כיוון שהוא מהווה אבן דרך קריטית בדיני המעצרים.</p><p>---</p><h4>4. פסיקה וחקיקה</h4><h4>א. פסיקה שהוזכרה בנושא</h4><p>ילנה מורוזובה נ' מדינת ישראל (אוזכר בשיעור כ\"פסק דין ילנה מורוזובה\"):</p><p>מה פסק הדין מלמד בנושא: מעגן את עיקרון החוקיות (סעיף 1 לחוק המעצרים) וקובע כי החזרת תיק על ידי ערכאת הערעור לדיון מחדש בערכאה הדיונית אינה מאפסת את מרוץ 9 החודשים של מעצר עד תום ההליכים (סעיף 61), וכי הדרך החוקית היחידה להמשך המעצר היא פנייה לבית המשפט העליון לקבלת צו הארכה מכוח סעיף 62.</p><h4>ב. חקיקה שהוזכרה בנושא</h4><p>חוק סדר הדין הפלילי (סמכויות אכיפה – מעצרים), התשנ\"ו-1996 (\"חוק המעצרים\"):</p><p>סעיף 1: מעגן את עיקרון החוקיות בדיני מעצרים ועיכוב – אין מעצר ואין עיכוב אלא בחוק או לפי חוק מכוח הסמכה מפורשת.</p><p>סעיף 61: מסדיר את מגבלות הזמן הסטטוטוריות למעצר עד תום ההליכים (9 חודשים במעצר רגיל, 18 חודשים בפיקוח אלקטרוני).</p><p>סעיף 62: מסדיר את הסמכות הבלעדית של בית המשפט העליון להאריך מעצר עד תום ההליכים מעבר לתקופות בסעיף 61.</p><p>---</p><li>או לבחור כל נושא אחר שתרצה מתוך הרשימה!</li></section><section class=\"release-2a-addition\"><h3>הרחבת שיעור 9 — special delay powers</h3><h4>📚 מעצר עד תום ההליכים, מגבלות הזמן והלכת ילנה מורוזובה</h4><p>---</p><h4>1. תקציר הנושא</h4><p>הכלל המרכזי: מעצר עד תום ההליכים הוא שלילת חירותו של נאשם לאחר הגשת כתב אישום ועד לסיום משפטו, בשל מסוכנותו לשלום הציבור, וזאת על אף שקיימת לו חזקת החפות כל עוד לא הוכחה אשמתו.</p><p>חלופות המעצר ומגבלות הזמן הסטטוטוריות (סעיף 61 לחוק המעצרים):</p><p>1. מעצר רגיל (מאחורי סורג ובריח): מוגבל בחוק לתקופה מרבית של 9 חודשים.</p><p>2. מעצר בפיקוח אלקטרוני (אזיק אלקטרוני בקרסול): מוגבל בחוק לתקופה מרבית של 18 חודשים.</p><p>החריג המרכזי והארכת מעצר (סעיף 62 לחוק המעצרים):</p><p>הארכת מעצר מעבר לתקרה: הסמכות להאריך את המעצר עד תום ההליכים מעבר ל-9 חודשים (או 18 חודשים בפיקוח אלקטרוני) נתונה בסמכותו הבלעדית של בית המשפט העליון.</p><p>סמכות ומועד חשוב:</p><p>המרוץ הסטטוטורי (\"הטיימר\"): ממועד מתן צו המעצר עד תום ההליכים נפתחת ספירת זמן קשיחה (\"שעון מתקתק\") המחייבת את המערכת לסיים את המשפט בתוך תקרת הזמן הקבועה בחוק.</p><p>הבחנה חשובה: הבחנה בין מעצר ימים במהלך חקירה (הנמדד בימים ונערך לפני הגשת כתב אישום) לבין מעצר עד תום ההליכים (הנמדד בחודשים ונערך לאחר הגשת כתב אישום).</p><p>נקודת מבחן מרכזית (הלכת ילנה מורוזובה): ביטול הרשעה והחזרת תיק על ידי בית המשפט העליון לדיון מחדש בערכאה הדיונית אינם מאפסים (\"קוצבים מחדש\") את תקופת 9 החודשים של מעצר עד תום ההליכים. בהיעדר הסמכה מפורשת בחוק לאיפוס המרוץ, חל עיקרון החוקיות (סעיף 1 לחוק המעצרים), והדרך החוקית היחידה להמשך המעצר היא הגשת בקשת הארכה לבית המשפט העליון לפי סעיף 62.</p><p>---</p><h4>2. קריאה מורחבת</h4><h4>א. מקור נורמטיבי וסעיפי חוק</h4><p>חוק סדר הדין הפלילי (סמכויות אכיפה – מעצרים), התשנ\"ו-1996 (\"חוק המעצרים\"):</p><p>סעיף 1: מעגן את עיקרון החוקיות – אין מעצר ואין עיכוב אלא בחוק או לפי חוק מכוח הסמכה מפורשת.</p><p>סעיף 61: מסדיר את קציבת התקופה המרבית של מעצר עד תום ההליכים (9 חודשים במעצר רגיל, 18 חודשים בפיקוח אלקטרוני).</p><p>סעיף 62: מסדיר את הסמכות הבלעדית של בית המשפט העליון להאריך מעצר עד תום ההליכים מעבר לתקופות בסעיף 61.</p><p>הלכת בית המשפט העליון: בש\"פ ילנה מורוזובה נ' מדינת ישראל.</p><h4>ב. הכלל המשפטי: מהות מעצר עד תום ההליכים</h4><p>האיזון החוקתי: לאחר הגשת כתב אישום, הנאשם נהנה מחזקת החפות (הוא חף מפשע עד שבית המשפט יקבע אחרת). אולם, כאשר קיימת עילת מעצר מובהקת (כגון מסוכנות לשלום הציבור), המדינה אינה יכולה להרשות לעצמה שהנאשם יסתובב חופשי ברחוב במהלך ניהול משפטו.</p><p>צורות המעצר עד תום ההליכים:</p><p>1. מעצר רגיל: החזקת הנאשם מאחורי סורג ובריח במתקן מעצר/כלא.</p><p>2. מעצר בפיקוח אלקטרוני: החזקת הנאשם בביתו תוך ענידת אזיק אלקטרוני בקרסול המפקח על מיקומו. יציאה מהבית מפעילה התרעה צלילית וגוררת זינוק של שוטרים ומעבר למעצר רגיל.</p><h4>ג. תקרות הזמן והסמכות להארכה (סעיפים 61 ו-62)</h4><p>תקרות הזמן בחוק (סעיף 61):</p><p>9 חודשים: תקרת הזמן הסטטוטורית למעצר עד תום ההליכים במעצר רגיל.</p><p>18 חודשים: תקרת הזמן הסטטוטורית למעצר עד תום ההליכים בפיקוח אלקטרוני.</p><p>מנגנון ה\"טיימר\": ברגע שבית המשפט מורה על מעצר עד תום ההליכים, נפתח \"שעון מתקתק\" מעל ראש התביעה ובית המשפט, המחייב לנהל ולסיים את המשפט בתוך התקופה הקצובה.</p><p>הארכה בידי בית המשפט העליון (סעיף 62): אם המשפט לא הסתיים בתוך 9 חודשים (או 18 חודשים בפיקוח אלקטרוני), בית המשפט המחוזי/השלום אינו מוסמך להאריך את המעצר בעצמו. המדינה מחויבת לפנות בבקשה מיוחדת לבית המשפט העליון מכוח סעיף 62, ורק העליון מוסמך להורות על הארכת המעצר.</p><h4>ד. הלכת ילנה מורוזובה (אי-איפוס המרוץ)</h4><p>כאשר ערכאת הערעור (בית המשפט העליון) מבטלת הרשעה בשל פגם חמור בהליך ומחזירה את התיק לערכאה הדיונית (בית המשפט המחוזי) כדי להתחיל את המשפט מההתחלה, מרוץ 9 החודשים אינו מתאפס!</p><p>מכוח עיקרון החוקיות (סעיף 1), בית המשפט המחוזי אינו רשאי לקצוב מעצר עד תום ההליכים מחדש כ\"מעצר חדש\". אם חלפו 9 חודשים, המדינה מחויבת לפנות לבית המשפט העליון לפי סעיף 62 לקבלת צו הארכה; בהיעדר אישור מהעליון – הנאשם משוחרר.</p><h4>ה. דוגמאות המרצה</h4><p>1. דוגמת ראובן הרוצח:</p><p>ראובן דקר ורצח את שושנה. הוא נעצר במהלך החקירה. עם הגשת כתב האישום, הפרקליטות מבקשת לעצור אותו עד תום ההליכים.</p><p>הסבר המרצה: אף שראובן נהנה כרגע מחזקת החפות עד לתום המשפט, לא ניתן לאפשר לאדם שביצע רצח להסתובב חופשי ברחוב בשל הסכנה העצומה שהוא מהווה לשלום הציבור. לפיכך הוא מושם במעצר עד תום ההליכים, ועל המשפט להסתיים בתוך 9 חודשים.</p><p>2. דוגמת האזיק האלקטרוני בקרסול:</p><p>המרצה מדגים את מנגנון הפיקוח האלקטרוני: שמים אזיק בקרסול המנטר את המיקום. אם הנאשם מנסה לצאת מהבית, האזיק מצפצף; אם הוא מתעלם וממשיך לצאת, מוקפצים שוטרים שעוצרים אותו ומעבירים אותו למעצר רגיל מאחורי סורג ובריח.</p><h4>ו. משמעות מעשית למבחן</h4><p>בפתרון קייס במבחן:</p><p>1. יש לבדוק האם מדובר בנאשם שהוגש נגדו כתב אישום (מעצר עד תום ההליכים) ולבחון את סוג המעצר (רגיל = 9 חודשים; פיקוח אלקטרוני = 18 חודשים).</p><p>2. אם חלפה תקרת הזמן והמשפט טרם הסתיים, חובה לציין כי הסמכות הבלעדית להארכה שמורה לבית המשפט העליון לפי סעיף 62.</p><p>3. אם התיק הוחזר לדיון מחדש בערכאה הדיונית, יש ליישם את הלכת מורוזובה ולהתריע כי ניסיון לקצוב מעצר מחדש כ\"מעצר חדש\" הוא בלתי חוקי ומפר את עיקרון החוקיות (סעיף 1).</p><p>---</p><h4>3. הרחבה מקיפה</h4><h4>א. ניתוח מעמיק של המבנה הנורמטיבי והאיזון החוקתי</h4><p>ההסדר של מעצר עד תום ההליכים בסעיפים 61 ו-62 לחוק המעצרים מגלם את המתח החריף ביותר בדיון הפלילי בין חזקת החפות וזכות היסוד לחירות לבין הגנת שלום הציבור ותקינות ההליך המשפטי.</p><p>1. המתח מול חזקת החפות: בשלב המעצר עד תום ההליכים, הנאשם טרם הורשע. שלילת חירותו לתקופה مמושכת מהווה פגיעה קשה ביותר בחירותו בטרם נגזר דינו.</p><p>2. תכלית הקציבה בסטופר סטטוטורי (סעיף 61): המחוקק קבע תקרות קשיחות (9 חודשים / 18 חודשים) כדי ליצור לחץ מערכתי על התביעה ובית המשפט לנהל את המשפט ביעילות ובמהירות, ולמנוע מצב של \"מאסר מנהלי דה-פקטו\" ללא הכרעת דין.</p><p>3. הבקרה השיפוטית העליונה (סעיף 62): ההכרעה להחזיק אדם במעצר מעבר לתקרה הסטטוטורית הוצאה מידי הערכאה הדיונית והופקדה בידי הערכאה הגבוהה ביותר (בית המשפט העליון), כדי להבטיח פיקוח הדוק ומבוקר על כל יום נוסף של שלילת חירות.</p><h4>ב. ניתוח מעמיק של פסק דין ילנה מורוזובה</h4><p>1. סיפור המסגרת בקצרה:</p><p>נגד ילנה מורוזובה הוגש כתב אישום והיא נעצרה עד תום ההליכים לפי סעיף 61 לחוק המעצרים.</p><p>המשפט התנהל בבית המשפט המחוזי, ולאורכו שהתה מורוזובה במעצר. בתום המשפט היא הורשעה בדין.</p><p>מורוזובה הגישה ערעור לבית המשפט העליון. העליון מצא כי נפל פגם פרוצדורלי/ראייתי כבד מאוד בניהול המשפט בערכאה הדיונית, ביטל את הכרעת הדין, והורה להחזיר את התיק לבית המשפט המחוזי כדי להתחיל לנהל את המשפט מחדש מבראשית.</p><p>2. מה טיעוני הצדדים:</p><p>טיעון המדינה: המדינה טענה כי ברגע שהכרעת הדין בוטלה והמשפט הוחזר להתחלה, הדיון הפלילי \"מתחיל מאפס\". לפיכך, לטענת המדינה, מוקנית לבית המשפט המחוזי סמכות לקצוב מעצר עד תום ההליכים חדש לתקופה של 9 חודשים נוספים מראש.</p><p>טיעון הנאשמת: הנאשמת טענה כי תקרת 9 החודשים נספרת מיום המעצר המקורי. כיוון שאין בחוק סעיף המאפשר איפוס או קציבה מחדש, הרי שמכוח עיקרון החוקיות המעצר פקע, והדרך היחידה להמשיך להחזיקה במעצר היא הגשת בקשת הארכה לבית המשפט העליון לפי סעיף 62.</p><p>3. מה השאלות המשפטיות העומדות להכרעה:</p><p>האם החזרת תיק על ידי ערכאת הערעור לדיון מחדש בערכאה הדיונית מאפסת את מרוץ 9 החודשים של מעצר עד תום ההליכים ומאפשרת לקצוב מעצר חדש, או שמא מרוץ הזמנים ממשיך ונדרשת הארכה מהעליון לפי סעיף 62?</p><p>4. מה ההלכה שיצאה מפסק הדין:</p><p>בית המשפט העליון קבע הלכה קשיחה המבוססת על עיקרון החוקיות (סעיף 1 לחוק המעצרים): \"אין מעצר ללא סמכות לפי חוק\".</p><p>בחוק המעצרים אין שום הוראה המאפשרת איפוס או קציבה מחדש של תקופת מעצר עד תום ההליכים עקב החזרת תיק לדיון מחדש.</p><p>לפיכך, בית המשפט המחוזי אינו מוסמך לפסוק מעצר עד תום ההליכים חדש. המסלול החוקי היחיד להמשך המעצר הוא הגשת בקשת הארכה לבית המשפט העליון מכוח סעיף 62; בהיעדר אישור מהעליון – הנאשמת חייבת להשתחרר.</p><p>5. תכלית הלימוד ע\"י המרצה:</p><p>המרצה משתמש בהלכת מורוזובה כדי להדגים לסטודנטים את עוצמתו של עיקרון החוקיות בסעיף 1, וכדי להבהיר כי המערכת המשפטית אינה מוכנה לסבול יצירת סמכויות מעצר מכללא או איפוס זמנים הפוגע בחירות הנאשם ללא הסמכה חוקית מפורשת.</p><h4>ג. מלכודות למבחן ודגשים מפורשים של המרצה</h4><p>1. מלכודת איפוס ה\"טיימר\" (מורוזובה): במבחן, אם מוצג תרחיש שבו בית המשפט העליון החזיר תיק לדיון מחדש והתביעה מנסה לבקש מעצר עד תום ההליכים מחדש ל-9 חודשים בערכאה הדיונית – זוהי טעות משפטית חמורה! חובה לציין לפי הלכת מורוזובה שהמרוץ אינו מתאפס, והסמכות היחידה להארכה היא פנייה לעליון לפי סעיף 62.</p><p>2. מלכודת 9 חודשים מול 18 חודשים: במבחן, יש לדייק בסוג המעצר: מעצר רגיל מוגבל ל-9 חודשים, בעוד מעצר בפיקוח אלקטרוני מוגבל ל-18 חודשים.</p><p>3. דגש מפורש של המרצה: המרצה מזהיר מפורשות כי נושא זה (מעצר עד תום ההליכים, מגבלות הזמן והלכת מורוזובה) \"יופיע בבחינה בוודאות\" כיוון שהוא מהווה אבן דרך קריטית בדיני המעצרים.</p><p>---</p><h4>4. פסיקה וחקיקה</h4><h4>א. פסיקה שהוזכרה בנושא</h4><p>ילנה מורוזובה נ' מדינת ישראל (אוזכר בשיעור כ\"פסק דין ילנה מורוזובה\"):</p><p>מה פסק הדין מלמד בנושא: מעגן את עיקרון החוקיות (סעיף 1 לחוק המעצרים) וקובע כי החזרת תיק על ידי ערכאת הערעור לדיון מחדש בערכאה הדיונית אינה מאפסת את מרוץ 9 החודשים של מעצר עד תום ההליכים (סעיף 61), וכי הדרך החוקית היחידה להמשך המעצר היא פנייה לבית המשפט העליון לקבלת צו הארכה מכוח סעיף 62.</p><h4>ב. חקיקה שהוזכרה בנושא</h4><p>חוק סדר הדין הפלילי (סמכויות אכיפה – מעצרים), התשנ\"ו-1996 (\"חוק המעצרים\"):</p><p>סעיף 1: מעגן את עיקרון החוקיות בדיני מעצרים ועיכוב – אין מעצר ואין עיכוב אלא בחוק או לפי חוק מכוח הסמכה מפורשת.</p><p>סעיף 61: מסדיר את מגבלות הזמן הסטטוטוריות למעצר עד תום ההליכים (9 חודשים במעצר רגיל, 18 חודשים בפיקוח אלקטרוני).</p><p>סעיף 62: מסדיר את הסמכות הבלעדית של בית המשפט העליון להאריך מעצר עד תום ההליכים מעבר לתקופות בסעיף 61.</p><p>---</p><li>או לבחור כל נושא אחר שתרצה מתוך הרשימה!</li></section><section class=\"release-2a-addition\"><h3>הרחבת שיעור 9 — arrest start end types</h3><p>שלום לך עמיתי וידידי היקר.</p><p>כפרופסור לסדר דין פלילי באקדמיה וכעוזר המחקר שלך, ניתחתי באופן מדוקדק וכירורגי את המקור המסומן בלבד (\"שיעור 9 ערוך.mp3\") והכנתי עבורך את תוכן הלימוד המפורט, המדויק והמוכן לאתר הקורס בנושא: \"דרכי תחילת מעצר, סיום מעצר, וההבחנה בין מעצר ימים למעצר עד תום ההליכים\".</p><p>---</p><h4>📚 דרכי תחילת מעצר, סיום מעצר, וההבחנה בין מעצר ימים למעצר עד תום ההליכים</h4><p>---</p><h4>1. תקציר הנושא</h4><p>הכלל המרכזי: מעצר מוגדר כשלילת חירותו של אדם והגבלתה באופן דרסטי. הדין מעגן מדרג נורמטיבי קפדני המבחין בין מעצר ימים (בשלב החקירה לגבי חשוד) לבין מעצר עד תום ההליכים (לאחר הגשת כתב אישום לגבי נאשם), וקובע פרוצדורות מוגדרות וקשיחות לתחילת המעצר ולסיומו.</p><p>ההבחנה המרכזית (מעצר ימים מול מעצר עד תום ההליכים):</p><p>מעצר ימים: חל על חשוד בשלב החקירה המשטרתית (בטרם כתב אישום); נמדד ונקצב בימים (למשל 24 שעות, 48 שעות או מספר ימים ספורים לפי החלטת שופט).</p><p>מעצר עד תום ההליכים: חל על נאשם ממועד הגשת כתב האישום ועד לסיום המשפט; נמדד בחודשים ומוגבל בחוק ל-9 חודשים במעצר רגיל או 18 חודשים בפיקוח אלקטרוני.</p><p>שלוש דרכי תחילת מעצר:</p><p>1. צו שופט בנוכחות האדם: צו שניתן באולם בבית המשפט בנוכחות החשוד/הנאשם תוך הודעה מפורשת מפי השופט.</p><p>2. צו שופט שלא בנוכחות האדם: צו מעצר שהוצא מראש בידי שופט לבקשת המשטרה (למשל בחקירה סמויה), ומבוצע לאחר מכן בשטח.</p><p>3. מעצר שוטר שלא על פי צו שופט: מעצר עצמאי המבוצע בשטח בידי שוטר בהתקיים תנאי החוק, המתחיל בהודעת מעצר מפורשת או במעשה גלוי (כגון כבילה באזיקים).</p><p>שלוש דרכי סיום מעצר:</p><p>1. תום התקופה הקצובה: חלוף 24 השעות של מעצר השוטר, או תום מספר הימים/החודשים שנקצבו בצו השיפוטי.</p><p>2. הודעה על סיום המעצר (שחרור): מתן הודעה רשמית לעצור מטעם שופט או קצין מוסמך על החלטה לסיים את המעצר.</p><p>3. התמלאות תנאים שנקבעו לשחרור: כאשר השחרור הותנה בתנאים (כגון הפקדת ערבות כספית) – המעצר מסתיים ברגע שהתנאים מולאו והסכום הופקד.</p><p>סמכות ומועד חשוב:</p><p>סמכות מעצר שוטר ללא צו: מוגבלת ל-24 שעות מקסימום.</p><p>העדפה נורמטיבית לצו שופט: בחוק המעצרים קיימת העדפה קבועה למעצר על פי צו שופט מראש בכל מקום שבו הנסיבות מאפשרות זאת.</p><p>נקודת מבחן מרכזית: שוטר מוסמך לבצע מעצר 24 שעות ביממה, 7 ימים בשבוע, גם כשהוא מחוץ לתפקיד ובבגדים אזרחיים/פיג'מה! חבישת כובע משטרתי אינה תנאי לחוקיות המעצר אלא נוהל מפכ\"ל משמעתי בלבד.</p><p>---</p><h4>2. קריאה מורחבת</h4><h4>א. מקור נורמטיבי וחוקים שהוזכרו</h4><p>חוק סדר הדין הפלילי (סמכויות אכיפה – מעצרים), התשנ\"ו-1996 (\"חוק המעצרים\"):</p><p>סעיף 1: מעגן את עיקרון החוקיות – אין מעצר אלא בחוק או לפי חוק מכוח הסמכה מפורשת.</p><p>סעיף 61: מסדיר מעצר עד תום ההליכים ותקרות 9 חודשים / 18 חודשים בפיקוח אלקטרוני.</p><p>סעיף 62: מסדיר את הסמכות הבלעדית של בית המשפט העליון להאריך מעצר עד תום ההליכים מעבר לתקרות הסטטוטוריות.</p><h4>ב. ההבחנה בין מעצר ימים למעצר עד תום ההליכים</h4><p>1. מעצר ימים:</p><p>המעמד הדיוני: מיועד לחשוד – אדם שנמצא בשלב החקירה המשטרתית וטרם הוגש נגדו כתב אישום.</p><p>יחידת המדידה והזמן: מודדים וקוטעים את המעצר בימים (24 שעות סמכות שוטר ראשונית, או הארכות בבית משפט השלום/המחוזי של 48 שעות, 3 ימים, 10 ימים וכדומה).</p><p>2. מעצר עד תום ההליכים:</p><p>המעמד הדיוני: מיועד לנאשם – אדם שהסתיימה חקירתו והוגש נגדו כתב אישום.</p><p>יחידת המדידה והזמן: מודדים את המעצר בחודשים ולא בימים, בהתאם לקצב ניהול המשפט.</p><p>תקרות קשיחות בחוק (סעיף 61): מוגבל בחוק לתקופה מרבית של 9 חודשים במעצר רגיל, או 18 חודשים במעצר בפיקוח אלקטרוני. הארכה מעבר לכך שמורה לבית המשפט העליון לפי סעיף 62.</p><h4>ג. פירוט שלוש דרכי תחילת מעצר</h4><p>1. אפשרות 1: מעצר על פי צו שופט שניתן בנוכחות האדם:</p><p>הצו ניתן באולם בית המשפט כאשר החשוד/הנאשם נמצא פיזית מול השופט, והשופט מודיע לו בפניו על מתן צו המעצר.</p><p>פרוצדורה: אם החשוד הגיע מיוזמתו ולא היה כבול, השופט מורה למשמר בתי המשפט לתפוס אותו, לאזוק אותו ולהחזיקו עד להגעת שוטר שימשיך את המעצר.</p><p>2. אפשרות 2: מעצר על פי צו שופט שניתן שלא בנוכחות האדם:</p><p>צו מעצר שהוצא מראש על ידי שופט במעמד צד אחד לבקשת המשטרה (למשל במסגרת חקירה סמויה).</p><p>פרוצדורה: השוטרים מגיעים לאחר מכן לביתו או למקום המצאו של החשוד (למשל בשעה 05:00 בבוקר) ומבצעים את המעצר מכוח הצו הקיים.</p><p>3. אפשרות 3: מעצר שוטר שלא על פי צו שופט:</p><p>מעצר עצמאי המבוצע בשטח על ידי שוטר ללא צו שיפוטי מוקדם, בהתקיים שלושת התנאים המצטברים בחוק (עוון/פשע, חשד סביר, ועילת מעצר).</p><p>פרוצדורה: מתחיל במתן הודעת מעצר מפורשת לחשוד, או בביצוע מעשה גלוי למימוש המעצר (כגון הידוק אזיקים) בנסיבות שבהן קים פטור מהודעה. מוגבל ל-24 שעות.</p><h4>ד. פירוט שלוש דרכי סיום מעצר</h4><p>1. אפשרות 1: תום התקופה שנקבעה לו:</p><p>המעצר מסתיים אוטומטית בחלוף התקופה המרבית בחוק (כגון תום 24 השעות של מעצר שוטר), או בחלוף תאריך והשעה המדויקים שקצב השופט בצו המעצר.</p><p>2. אפשרות 2: הודעה לעצור על החלטת שופט או אדם מוסמך על סיום מעצרו:</p><p>מתן הודעה רשמית לעצור מפי שופט או קצין משטרה מוסמך המורה על ביטול המעצר ושחרורו (למשל שחרור ללא תנאים בתחנה או באולם).</p><p>3. אפשרות 3: התמלאות תנאים שנקבעו לסיום המעצר:</p><p>כאשר השופט או הקצין המוסמך קובעים החלטת שחרור המיושמת בתנאים מתלים (כגון הפקדת ערבות כספית בסך 10,000 ש\"ח).</p><p>פרוצדורה: ההחלטה על התנאים מהווה למעשה צו מעצר נוסף לעוד 24 שעות לשם ביצוע ההפקדה. כל עוד הכסף לא הופקד – האדם נותר במעצר חוקי; ברגע שהתנאים מולאו והסכום הופקד – המעצר מסתיים באופן מיידי והוא משוחרר.</p><h4>ה. דוגמאות המרצה</h4><p>1. דוגמת הפריצה למחשבי בתי המשפט והאייפד של סיגל (מעצר בצו שלא בנוכחות):</p><p>העובדות: סיגל חשודה כי השתמשה באייפד שלה ופרצה למחשבי מערכת בתי המשפט ומשכה 5 מיליון ש\"ח. המשטרה מנהלת נגדה חקירה סמויה בעקבות תלונה. סיגל אינה יודעת כי נפתחה חקירה ואינה מנסה לברוח.</p><p>היישום המשפטי: כיוון שיש למשטרה זמן והחקירה סמויה, החוק מחייב להעדיף פנייה מוקדמת לשופט. המשטרה פונה לשופט שלום ומקבלת צו מעצר שלא בנוכחותה. רק לאחר קבלת הצו, מגיעים שוטרים ב-05:00 בבוקר לביתה ועוצרים אותה.</p><p>2. דוגמת חישוב ימי המעצר השיפוטי (ציר הזמנים של השופט):</p><p>התרחיש: שוטר עוצר חשודה ביום א' בשעה 13:00 (סמכות 24 שעות עד יום ב' ב-13:00). ביום ב' בשעה 12:00 מביאה המשטרה את החשודה לבית משפט השלום. השופט מורה על הארכת מעצרה ב-3 ימים.</p><p>חישוב הימים: יום 1 = מיום ב' ב-13:00 עד יום ג' ב-13:00; יום 2 = מיום ג' ב-13:00 עד יום ד' ב-13:00; יום 3 = מיום ד' ב-13:00 עד יום ה' ב-13:00. המעצר יפקע בדיוק ביום ה' בשעה 13:00.</p><p>3. דוגמת השוטר בפיג'מה באמצע הלילה (סמכות 24/7 ונוהל הכובע):</p><p>התרחיש: שוטר ישן בביתו באמצע הלילה, ושומע צעקות מהרחוב. הוא יורד לרחוב בפיג'מה ורואה חשודה מבצעת עבירת שוד חמורה.</p><p>היישום המשפטי: השוטר מוסמך לעצור אותה מיד! שוטר הוא שוטר 24 שעות ביממה, 7 ימים בשבוע, בכל לבוש שהוא.</p><p>סוגיית הכובע: המרצה מדגיש כי השמועה כאילו שוטר חייב לחבוש כובע כדי להפעיל סמכות מעצר/מתן דו\"ח היא מוטעית לחלוטין! חבישת כובע היא נוהל מפכ\"ל משמעתי בלבד, ואינה מהווה תנאי לחוקיות המעצר.</p><h4>ו. משמעות מעשית למבחן</h4><p>בפתרון קייס במבחן:</p><p>1. יש לסווג תחילה את הסטטוס: חשוד בשלב חקירה = מעצר ימים; נאשם לאחר כתב אישום = מעצר עד תום ההליכים (קצוב ב-9/18 חודשים).</p><p>2. יש לבחון את דרך תחילת המעצר: לציין האם המעצר בוצע מכוח צו שופט בנוכחות/שלא בנוכחות, או מכוח מעצר שוטר ללא צו (המוגבל ל-24 שעות).</p><p>3. יש לבדוק האם התקיימה העדפה לצו שופט במקום שבו החקירה הייתה סמויה והיה זמן לפנות לבית המשפט.</p><p>4. לגבי סיום מעצר בתנאים: זכור כי אי-הפקדת ערבות מותירה את צו המעצר בתוקף עד לביצוע ההפקדה (עד 24 שעות).</p><p>---</p><h4>3. הרחבה מקיפה</h4><h4>א. ניתוח המבנה הנורמטיבי והאיזון החוקתי</h4><p>דיני המעצרים מעגנים מנגנון בקרה שיפוטי הדוק שנועד לצמצם למינימום את שלילת החירות בטרם הרשעה, בהתאם לחוק-יסוד: כבוד האדם וחירותו.</p><p>1. העדפה נורמטיבית לצו שופט:</p><p>סמכות המעצר העצמאית של שוטר בשטח נועדה למצבי דחיפות מבצעית בזמן אמת.</p><p>המחוקק קובע העדפה קטגורית כי בכל מקום שבו המשטרה מנהלת חקירה ואינה עומדת בפני דחיפות סיכולית מיידית (כגון בחקירה סמויה), עליה לפנות מראש לשופט כדי שיפעיל שיקול דעת שיפוטי אובייקטיבי ויחתום על צו מעצר.</p><p>2. מנגנון הקציבה וה\"סטופר\" הסטטוטורי:</p><p>במעצר ימים: הקציבה ב-24 שעות בידי שוטר ובימים ספורים בידי שופט נועדה להבטיח פיקוח שיפוטי רציף ותכוף על התקדמות פעולות החקירה.</p><p>במעצר עד תום ההליכים: הסטופר הקשיח של 9 חודשים (או 18 חודשים בפיקוח אלקטרוני) נועד למנוע \"מאסר מנהלי דה-פקטו\" של נאשם שטרם הורשע בדין.</p><h4>ב. ניתוח מעמיק של הבחנות היסוד והפרוצדורות</h4><h4>1. טבלת ההבחנה: מעצר ימים מול מעצר עד תום ההליכים</h4><p>מעצר ימים:</p><p>מעמד האדם: חשוד (שלב החקירה המשטרתית, בטרם כתב אישום).</p><p>תכלית המעצר: צורכי חקירה, מניעת שיבוש הליכי חקירה, וסיכול מסוכנות מיידית.</p><p>יחידת קציבה: נמדד ונקצב בימים.</p><p>ערכאה מוסמכת: שוטר (עד 24 שעות), בית משפט השלום/המחוזי.</p><p>מעצר עד תום ההליכים:</p><p>מעמד האדם: נאשם (לאחר הגשת כתב אישום).</p><p>תכלית המעצר: הגנה על שלום הציבור מפני מסוכנות הנאשם, מניעת הימלטות מאימת הדין.</p><p>יחידת קציבה: נמדד בחודשים עד לסיום המשפט.</p><p>תקרה וערכאה: מוגבל בחוק ל-9 חודשים (רגיל) / 18 חודשים (פיקוח אלקטרוני); הארכה נוספת בשליטת בית המשפט העליון בלבד לפי סעיף 62.</p><h4>2. ניתוח מעמיק של 3 דרכי תחילת מעצר</h4><p>חלופה א' (צו בנוכחות): מיושמת כאשר האדם כבר נמצא בבית המשפט (כגון בדיון הארכת מעצר או בדיון פלילי). השופט מורה על המעצר ומודיע לו בפניו. אם האדם חופשי, משמר בתי המשפט תופס אותו פיזית עד להגעת שוטר.</p><p>חלופה ב' (צו שלא בנוכחות): מיושמת בחקירות סמויות. המשטרה מגישה יום קודם לכן בקשה במעמד צד אחד לשופט שלום. השופט בוחן את חומר החקירה הנסתר וחותם על הצו. הצו מבוצע בהפתעה בשטח.</p><p>חלופה ג' (מעצר שוטר ללא צו): מיושמת באירועים אקטיביים בשטח. המעצר מתחיל במתן הודעת מעצר מפורשת (\"אתה עצור\"). אם החשוד מפעיל התנגדות או בורח, כבילה באזיקים או תפיסה פיזית מהוות \"מעשה גלוי למימוש המעצר\" המקנה פטור מהודעה מוקדמת.</p><h4>3. ניתוח מעמיק של 3 דרכי סיום מעצר</h4><p>חלופה א' (תום התקופה): המעצר פוקע דה-יורה ודה-פקטו בתום השעה והדקה המדויקות הקבועות בחוק או בצו השיפוטי. החזקת אדם דקה מעבר לכך ללא צו הארכה חדש מהווה מעצר בלתי חוקי.</p><p>חלופה ב' (הודעת שחרור): החלטה אקטיבית של קצין משטרה או שופט לשחרר את העצור (למשל כאשר עילת המעצר נעלמה או שפעולות החקירה הסתיימו).</p><p>חלופה ג' (התמלאות תנאים): כאשר השחרור מותנה בתנאים מתלים (כגון הפקדת ערבות כספית או המצאת ערבים). החוק מעניק מנגנון מעבר שבו צו המעצר נותר בתוקף לעוד 24 שעות כדי לאפשר את הפקדת הערבות. ברגע שהערבות מופקדת במזכירות/בתחנה – המעצר מסתיים באופן מיידי והאדם משוחרר.</p><h4>ג. מלכודות למבחן, טעויות נפוצות ודגשי מרצה</h4><p>1. מלכודת חישוב ציר הזמנים של 24 השעות: במבחן, ספירת 24 השעות של מעצר שוטר מתחילה מהרגע הראשון שבו נשללה חירותו של החשוד בשטח (ולא ממועד הגעתו לתחנה ולא ממועד החלטת הקצין הממונה!).</p><p>2. מלכודת איפוס המרוץ במעצר עד תום ההליכים (הלכת מורוזובה): במבחן, אם תיק הוחזר לדיון מחדש בבית המשפט המחוזי, מרוץ 9 החודשים אינו מתאפס! הקציבה נמשכת מיום המעצר המקורי, והסמכות היחידה להמשך המעצר היא פנייה לעליון לפי סעיף 62.</p><p>3. מלכודת סמכות השוטר מחוץ לתפקיד: במבחן, טענה כאילו שוטר שהיה בחופשה, בביתו, בלבוש אזרחי או ללא כובע לא היה מוסמך לבצע מעצר – זוהי טעות משפטית! שוטר מחזיק בסמכויות מעצר 24/7, ונוהל הכובע הוא הנחיה משמעתית פנימית שאינה פוגעת בחוקיות המעצר.</p><p>4. מלכודת התנאים המתלים: במבחן, אם שופט הורה על שחרור בערבות והחשוד טרם הפקיד את הכסף – החזקתו במעצר באותו יום היא חוקית לחלוטין (מכוח צו המעצר המותנה ל-24 שעות).</p><p>---</p><h4>4. פסיקה וחקיקה</h4><h4>א. פסיקה שהוזכרה בנושא</h4><p>פסיקה בנושא דרכי תחילת/סיום מעצר ומעצר ימים מול תום ההליכים:</p><p>(הערה: במסגרת דיון זה בשיעור 9, המרצה פירט מתוך חוק המעצרים את שלוש דרכי תחילת המעצר, שלוש דרכי סיום המעצר, וההבחנה המושגית בין מעצר ימים למעצר עד תום ההליכים, תוך שימוש בדוגמאות הלימודיות של הפריצה למחשבים, הפיג'מה והכובע, ולא איזכר פסק דין ספציפי של בית המשפט העליון בשמו או במספר הליך לגבי סעיפים טכניים אלה).</p><h4>ב. חקיקה שהוזכרה בנושא</h4><p>חוק סדר הדין הפלילי (סמכויות אכיפה – מעצרים), התשנ\"ו-1996 (\"חוק המעצרים\"):</p><p>סעיף 1: מעגן את עיקרון החוקיות והחובה לשמור על כבוד האדם וחירותו.</p><p>סעיף 61: מסדיר מעצר עד תום ההליכים ותקרות 9 חודשים (רגיל) ו-18 חודשים (פיקוח אלקטרוני).</p><p>סעיף 62: מסדיר את הסמכות הבלעדית של בית המשפט העליון להאריך מעצר עד תום ההליכים.</p><p>---</p><li>נותר לנו לעבד את הנושא האחרון מרשימת הנושאים של שיעור 9: \"סמכות מעצר חשוד בידי שוטר ללא צו שופט ותנאיה המצטברים\".</li><li>תרצה שנפיק עבורו מיד את התוכן בשלוש שכבות?</li></section>"},"arrest-nowarrant":{"title":"מעצר שוטר ללא צו וזכויות העצור","html":"\n      <div class=\"eyebrow\">סעיפים 23, 26–36 לחוק המעצרים · הרחבה — לא נלמד בהקלטת שיעור 8</div>\n      <h2>מעצר שוטר ללא צו שופט וזכויות העצור בתחנה</h2>\n      <p>זהו המעצר התקוף ביותר בשטח — מבוצע על ידי שוטר בודד ללא פנייה מוקדמת לבית משפט, לפי סעיף 23 לחוק המעצרים.</p>\n      <h3>תנאים במסלול סעיף 23(א)</h3>\n      <p><b>1.</b> יסוד סביר לחשד שהאדם עבר עבירה שאינה חטא (עוון או פשע). <b>2.</b> התקיימות עילת מעצר סטטוטורית: העבירה בוצעה בפניו או \"זה מקרוב\"; חשש לאי-הופעה לחקירה; חשש לשיבוש הליכי משפט (השפעה על עדים/העלמת ראיות); סכנה לביטחון אדם/ציבור/מדינה; חזקת מסוכנות (עבירת מיתה/עולם, ביטחון, סמים, אלימות חמורה או במשפחה); הפרת ערובה או בריחה. אי־ציות לעיכוב חוקי מוסדר בנפרד בסעיף 23(ב), לתכלית שלשמה התבקש העיכוב.</p>\n      <div class=\"callout case-callout\"><span class=\"callout-title\">קשור לפסק דין</span><button class=\"case-link\" data-case=\"27\">⚖ כהן נגד הפצ\"ר (1988)</button></div>\n      <h3>זכויות העצור בתחנה</h3>\n      <p>הובא עצור לתחנה, סעיף 26 מחייב הבאה מיידית בפני הקצין הממונה, הבוחן אם קיימת עילת מעצר חוקית — ואם לא, מחויב לשחרר מיד. אם קיימת עילה, יבחן חלופת ערובה לפני מעצר בפועל.</p>\n      <div class=\"scenario-row\"><span class=\"verdict need\">אזהרה (28, 32)</span><div>אינו חייב לומר דבר, שתיקה עשויה לחזק ראיות; הסבר סיבת המעצר וזכויותיו</div></div>\n      <div class=\"scenario-row\"><span class=\"verdict need\">מפגש עו\"ד (34)</span><div>ללא דיחוי — ניתן לדחות בשעות ספורות/עד 24 שעות/עד 48 שעות, לפי חומרת הנימוק</div></div>\n      <div class=\"scenario-row\"><span class=\"verdict need\">הודעה לקרוב (33, 36)</span><div>ללא דיחוי, אלא בעבירת ביטחון/פשע חמור — עד 48 שעות (שר הביטחון/מפכ\"ל), עד 7 ימים בפשע חמור, עד 15 יום בעבירת ביטחון</div></div>\n      <div class=\"callout case-callout\"><span class=\"callout-title\">קשור לפסק דין</span><button class=\"case-link\" data-case=\"28\">⚖ אסף שי נגד מדינת ישראל (2005)</button></div>\n      <h3>הבאה בפני שופט ומעצר ימים</h3>\n      <p>עצור ללא צו יובא בפני שופט בהקדם, לא יאוחר מ-24 שעות (הקצין הממונה רשאי להאריך ב-24 שעות נוספות לפעולת חקירה דחופה — סה\"כ עד 48 שעות; בשבת/חג — לפני כניסתה או עד 4 שעות מצאתה).</p>\n      <p>הסמכות הבלעדית לדון במעצר בצו שופט (סעיף 13) נתונה לבית משפט השלום. תנאים: חשד לעוון/פשע, עילת מעצר, היעדר חלופה. עילה מיוחדת: צורכי חקירה מיוחדים — מוגבלת ל-5 ימים בכל פעם, עד מקסימום מצטבר של 15 יום בעילה זו בלבד.</p>\n      <div class=\"timeline\">\n        <div class=\"timeline-step\"><div class=\"timeline-date\">15 יום</div><div class=\"timeline-dot\"></div><div class=\"timeline-label\">צו ראשון<br>והארכות</div></div>\n        <div class=\"timeline-line\"></div>\n        <div class=\"timeline-step\"><div class=\"timeline-date\">30 יום</div><div class=\"timeline-dot\"></div><div class=\"timeline-label\">תקרה בסיסית<br>בשלום</div></div>\n        <div class=\"timeline-line\"></div>\n        <div class=\"timeline-step\"><div class=\"timeline-date\">75 יום</div><div class=\"timeline-dot\"></div><div class=\"timeline-label\">בהסכמת<br>היועמ\"ש</div></div>\n        <div class=\"timeline-line\"></div>\n        <div class=\"timeline-step\"><div class=\"timeline-date\">90+ יום</div><div class=\"timeline-dot end\"></div><div class=\"timeline-label\">רק שופט<br>עליון</div></div>\n      </div>\n<section class=\"release-2a-addition\"><h3>הרחבת שיעור 9 — delay to arrest illegal arrest resistance</h3><p>שלום לך עמיתי וידידי היקר.</p><p>כפרופסור לסדר דין פלילי באקדמיה וכעוזר המחקר שלך, ניתחתי באופן ממוקד וכירורגי את המקור המסומן בלבד (\"שיעור 9 ערוך.mp3\") והכנתי עבורך את תוכן הלימוד המפורט, המדויק והמוכן לאתר הקורס בנושא: \"סמכות חיפוש מוגבל על גופו של מעוכב ('חיפוש על גוף')\".</p><p>---</p><h4>📚 סמכות חיפוש מוגבל על גופו של מעוכב (\"חיפוש על גוף\")</h4><p>---</p><h4>1. תקציר הנושא</h4><p>הכלל המרכזי: שוטר המבצע עיכוב לאדם רשאי לערוך חיפוש מוגבל על גופו ובכליו (הידוע בלעז כ-Pat-down / \"חיפוש למשוש\"), בבגדיו ובחפצים שעמו (כגון תיק), ללא צורך בקיומו של חשד סביר, וזאת במטרה לשמור על שלום השוטר והמעוכב ולמנוע סיכון בעת ההובלה בניידת המשטרה או באמבולנס.</p><p>התנאים המרכזיים לביצוע החיפוש המוגבל:</p><p>1. התקיימות עיכוב חוקי של האדם.</p><p>2. תכלית ביטחונית: לוודא שהמעוכב אינו נושא על גופו כלי נשק, חפץ מסוכן או חפץ שעשוי לסייע בבריחתו.</p><p>3. עיתוי ומיקום: החיפוש נערך בעת כניסתו של האדם לניידת המשטרה או לאמבולנס.</p><p>גבולות ההגדרה של \"חיפוש מוגבל\":</p><p>מה כולל: חיפוש בבגדים, מישוש חיצוני, חיפוש בכליו (תיק), הוראה להסיר כיסוי מעל הפנים או הראש (כגון כובע, קסדה או רעלה), והוראה לחלוץ נעליים.</p><p>מה אינו כולל (איסור מוחלט): אינו כולל הסרת בגד החושפת איברי גוף שהיו מכוסים, ואינו כולל חיפוש גופני חיצוני או פנימי (כגון צילום רנטגן, בדיקת דם, או חיפוש רקטלי).</p><p>החריג המרכזי וביצוע בכוח סביר:</p><p>התנגדות לחיפוש: אם המעוכב חשוד בעבירה והוא מתנגד לעריכת החיפוש המוגבל – רשאי השוטר לבצע את החיפוש תוך שימוש בכוח סביר.</p><p>איסור התניית מיקום: המעוכב אינו רשאי לסרב לחיפוש בשטח או להתנותו בביצוע בתחנת המשטרה בלבד; החיפוש נועד להגן על השוטרים והמעוכב בעת ההובלה, ולכן ייערך בשטח לפני העלייה לניידת.</p><p>סמכות וכלל התאמת המין:</p><p>כלל בסיסי: חיפוש מוגבל ייערך בידי שוטר שהוא בן מינו של המעוכב (זכר לזכר, נקבה לנקבה).</p><p>חריגים להתאמת מין (בהם מותר לשוטר ממין שונה לבצע חיפוש מוגבל):</p><p>1. המעוכב הסכים מפורשות בעל פה לחיפוש בידי מי שאינו בן מינו (איסור שתיקה כהסכמה).</p><p>2. דחיית החיפוש תגרום לסיכון בלתי סביר לשלום הציבור או לשלומו של אדם (כגון חשש קונקרטי לחגורת נפץ, סכין או אקדח).</p><p>הבחנה חשובה: הבחנה בין חיפוש מוגבל על גוף (המותר ללא חשד סביר בעת העלאה לניידת/אמבולנס ללא הפשטה) לבין חיפוש גופני חיצוני או פנימי (המצריך חשד סביר, פרוצדורה מורכבת, ולעיתים הסכמה או אישור שופט).</p><p>נקודת מבחן מרכזית: טענת מעוכב כי החיפוש המוגבל בבגדיו בשטח הוא בלתי חוקי משום שהשוטר לא הציג \"חשד סביר\" למציאת אמצעי לחימה – תידחה לחלוטין; סמכות זו פטורה מתנאי של חשד סביר ונועדה להגנה עצמית וביטחון ההובלה.</p><p>---</p><h4>2. קריאה מורחבת</h4><h4>א. מקור נורמטיבי וחוקים שהוזכרו</h4><p>חוק סדר הדין הפלילי (סמכויות אכיפה – חיפוש בגוף חשוד ונטילת אמצעי זיהוי), התשנ\"ו-1996:</p><p>פקודת סדר הדין הפלילי (מעצר וחיפוש) [נוסח חדש], התשכ\"ט-1969:</p><p>מה הוא מסדיר: המסגרת הנורמטיבית הכללית של דיני החיפוש.</p><h4>ב. הכלל המשפטי, ההגדרה והמטרה (Pat-down)</h4><p>הגדרת \"חיפוש מוגבל על גוף\": מדובר בחיפוש בבגדיו של אדם ובכליו (כגון תיק או ארנק שהוא נושא עמו), וכן חיפוש גופני שאינו כולל הסרת בגד החושפת איברי גוף שהיו מכוסים. בלעז מוגדר החיפוש כ-Pat-down (\"חיפוש למשוש\").</p><p>הפעולות המותרות במסגרת החיפוש המוגבל:</p><p>1. מישוש ובדיקת כיסי הבגדים והבגדים שלבוש המעוכב.</p><p>2. חיפוש בכליו (בתיק, בתרמיל).</p><p>3. הוראה למעוכב להסיר כיסוי מעל הפנים או מעל הראש (כגון כובע, קסדה או רעלה).</p><p>4. הוראה למעוכב לחלוץ את נעליו.</p><p>התכלית והמטרה המשפטית: לוודא שהמעוכב אינו נושא על גופו כלי נשק, חפץ מסוכן, או חפץ שעשוי לסייע בבריחתו. החיפוש אינו נועד לאיסוף ראיות ראשי, אלא לשמירה על שלום השוטר, שלום המעוכב, ומניעת פגיעה עצמית או פגיעה בשוטרים בעת ההובלה.</p><h4>ג. עיתוי החיפוש והיעדר דרישת חשד סביר</h4><p>היעדר דרישת חשד סביר: בניגוד לחיפושים פליליים רגילים המחייבים קיומו של \"חשד סביר\" לביצוע עבירה או להחזקת תפוס, חיפוש מוגבל על גופו של מעוכב אינו דורש כל חשד סביר!. עצם העובדה שאדם מעוכב ומועלה לניידת/אמבולנס מקנה לשוטר את הסמכות האוטומטית לבצע את החיפוש המוגבל מטעמי בטיחות.</p><p>עיתוי הביצוע: החיפוש ייערך בעת כניסתו של האדם לניידת המשטרה או לאמבולנס (בשטח, בטרם הנסיעה).</p><p>תפיסת חפצים: אם נמצאו על גופו או בכליו כלי נשק או חפץ מסוכן – השוטר רשאי לתופסם. המרצה מבהיר כי גם אם יש לאדם רישיון נשק תקף, השוטר רשאי לתפוס ולהחזיק את הנשק אצלו במהלך העיכוב והשהות בתחנה כדי למנוע סיכון בטיחותי.</p><h4>ד. התנגדות לחיפוש והפעלת כוח סביר</h4><p>הפעלת כוח סביר בהתנגדות: אם האדם המעוכב חשוד בעבירה והוא מתנגד לעריכת החיפוש המוגבל – רשאי השוטר לבצע את החיפוש תוך שימוש בכוח סביר.</p><p>איסור התניית החיפוש בתחנה: מעוכב אינו רשאי לומר לשוטר \"אני מסרב שתגע בי ברחוב לעיני אנשים, קח אותי לתחנה ותעשה שם חיפוש\". השוטר זכאי וחייב לבצע את החיפוש בשטח לפני העלאתו לניידת, שכן תכלית החיפוש היא להבטיח שהמעוכב לא ישלוף סכין או נשק במהלך הנסיעה.</p><h4>ה. כלל התאמת המין והחריגים לו</h4><p>הכלל: חיפוש מוגבל ייערך בידי שוטר שהוא בן מינו של המעוכב (גבר יחפש על גבר, אישה תחפש על אישה).</p><p>שני החריגים המותרים:</p><p>1. הסכמת המעוכב: המעוכב הסכים מפורשות לערכת החיפוש בידי שוטר/ת שאינו בן מינו. המרצה מדגיש: חובה לקבל הסכמה מפורשת בעל פה, ואין דבר כזה \"שתיקה כהסכמה\"!.</p><p>2. דחיפות וסיכון בלתי סביר: דחיית החיפוש עד להגעת שוטר בן מינו תגרום לסיכון בלתי סביר לשלום הציבור או לשלומו של אדם (למשל: חשד קונקרטי לחגורת נפץ, סכין שלופה, או אקדח).</p><h4>ו. דוגמאות המרצה</h4><p>1. דוגמת החיפוש לפני העלאה לניידת והתיק (חיפוש בכליו):</p><p>שוטר מעכב אדם ומחליט להביאו לתחנה. לפני שהמעוכב נכנס לניידת המשטרה, השוטר מבצע עליו חיפוש מוגבל (Pat-down) בכיסים, בודק את התיק שהוא מחזיק (חיפוש בכליו), ומורה לו לחלוץ נעליים. החיפוש מבוצע בשטח כדי למנוע מצב שבו המעוכב ישלוף סכין במהלך הנסיעה.</p><p>2. דוגמת האקדח ברישיון (תפיסת חפץ מסוכן):</p><p>אישה מעוכבת מגיעה לתחנת המשטרה. בחיפוש המוגבל מתגלה כי היא נושאת אקדח בנרתיק. היא מציגה רישיון נשק בתוקף.</p><p>הכרעת המרצה: השוטרת מוסמכת לתפוס ולהחזיק את האקדח אצלה למשך הטיפול והחקירה בתחנה, משום שתכלית החיפוש המוגבל היא ניטרול כל סיכון ביטחוני בסביבת החקירה.</p><p>3. דוגמת הטרנסג'נדרים וסוגיית המין (פסיקה השוואתית):</p><p>המרצה מציין סוגיה מודרנית: כיצד נוהגים לגבי אדם הרשום כזכר בתעודת הזהות אך מזדהה ונראה כאישה (או להפך)?.</p><p>דגש המרצה: נכון להיום אין פסיקה של בית המשפט העליון בישראל המכריעה בשאלה מי רשאי לבצע חיפוש על טרנסג'נדרים ואיזה שוטר יבצע זאת. המרצה מציין כי סוגיה זו נדונה בימים אלה בבית המשפט העליון הפדרלי בארה\"ב.</p><h4>ז. משמעות מעשית למבחן</h4><p>בפתרון קייס במבחן:</p><p>1. יש לבחון את סוג החיפוש: אם מדובר במישוש בבגדים, בדיקת תיק, חליצת נעליים או הסרת כיסוי ראש – מדובר בחיפוש מוגבל המותר ללא חשד סביר.</p><p>2. אם הוסרו בגדים שחשפו איברי גוף מכוסים – החיפוש אינו חיפוש מוגבל אלא חיפוש גופני החייב בחשד סביר ובתנאים קפדניים.</p><p>3. אם המעוכב סירב לחיפוש בשטח – השוטר מוסמך להפעיל כוח סביר.</p><p>4. יש לבדוק את התאמת המין: חיפוש בידי שוטר ממין שונה מותר אך ורק בהסכמה מפורשת בעל פה או בנסיבות דחופות של סיכון בלתי סביר.</p><p>---</p><h4>3. הרחבה מקיפה</h4><h4>א. ניתוח המבנה הנורמטיבי והאיזון החוקתי</h4><p>דיני החיפוש מעגנים מדרג חוקתי קפדני השומר על הזכות לפרטיות ולשלמות הגוף מכוח חוק-יסוד: כבוד האדם וחירותו.</p><p>המחוקק יצר הבחנה ברורה בין דרגות שונות של פגיעה באוטונומיה של הפרט:</p><p>\\\\[\\text{חיפוש מוגבל (בבגדים/כלים)} \\longrightarrow \\text{חיפוש גופני חיצוני (על הגוף)} \\longrightarrow \\text{חיפוש גופני פנימי (בתוך הגוף)}\\\\]</p><p>1. עוצמת הפגיעה הנמוכה בחיפוש מוגבל: כיוון שחיפוש מוגבל אינו כולל הפשטה ואינו חושף איברים מוצנעים, עוצמת הפגיעה בפרטיות נמוכה יחסית.</p><p>2. הצדקת הפטור מחשד סביר: מתוך צורך הגנתי מידי על חיי השוטרים והמעוכב בעת הובלה בחלל סגור (ניידת/אמבולנס), פטר המחוקק את השוטר מהדרישה להוכיח \"חשד סביר\" מוקדם להחזקת אמצעי לחימה. עצם הסטטוס של עיכוב והובלה בניידת מקנים את הסמכות.</p><h4>ב. ניתוח מעמיק של הגדרת \"חיפוש מוגבל\" מול חיפושים גופניים אחרים</h4><p>מהו חיפוש מוגבל (Pat-down):</p><p>מוגבל לבגדים החיצוניים ולכליו של האדם.</p><p>מותר להורות על חליצת נעליים והסרת כיסוי ראש/פנים (קסדה, כובע, רעלה).</p><p>מהו חיפוש גופני חיצוני / פנימי (שאינו חיפוש מוגבל):</p><p>חיפוש גופני חיצוני: בדיקה על עורו החשוף של אדם, הסרת בגדים החושפת איברים מכוסים, בחינת שערות, גזירת ציפורניים, או נטילת תביעות אצבע.</p><p>חיפוש גופני פנימי: בדיקת דם, צילום רנטגן, בדיקת אולטרסאונד, בדיקה רקטלית או וגינלית (למשל בחשד לבליעת שקיות סמים).</p><p>הבדל נורמטיבי קריטי: חיפושים חיצוניים ופנימיים מחייבים חשד סביר, פרוצדורה מורכבת, הסכמה מדעת, ולעיתים אישור קצין ממונה או צו שופט. לעומת זאת, חיפוש מוגבל מותר מידית בשטח ללא חשד סביר.</p><h4>ג. ניתוח עומק של סוגיות מיוחדות ודגשי מרצה</h4><p>1. שימוש בכוח סביר: אם המעוכב מתנגד למישוש בבגדיו או לבדיקת התיק, השוטר מוסמך להפעיל כוח פיזי מדוד (אחיזת הידיים, הצמדה) כדי לבצע את החיפוש.</p><p>2. חובת ההסכמה המפורשת בחריג המין: אם שוטרת מבצעת חיפוש מוגבל על גבר (או שוטר על אישה), היעדר התנגדות של המעוכב אינו נחשב להסכמה!. החוק מחייב הסכמה אקטיבית ומפורשת בעל פה. בהיעדר הסכמה מפורשת או נסיבות דחיפות של סיכון חיי אדם – החיפוש ממין שונה הוא בלתי חוקי בעליל!.</p><p>3. תפיסת נשק ברישיון: הסמכות לתפוס כלי נשק בחיפוש מוגבל חלה גם כאשר הנשק מוחזק כדין וברישיון, מתוך התכלית של ניטרול סיכונים סביבתיים במהלך העיכוב.</p><h4>ד. מלכודות למבחן ודגשים מפורשים של המרצה</h4><p>1. מלכודת החשד הסביר: במבחן, אם נטענה טענה כי חיפוש מוגבל בבגדי מעוכב בכניסה לניידת היה בלתי חוקי כי לא היה לשוטר \"חשד סביר\" שהמעוכב נושא סכין – זוהי טעות משפטית!. חיפוש מוגבל על מעוכב פטור לחלוטין מדרישת חשד סביר.</p><p>2. מלכודת ההפשטה: אם שוטר הוראה למעוכב להוריד חולצה או מכנסיים ברחוב וחשף איברים מכוסים – קביעה כי זהו \"חיפוש מוגבל\" היא טעות חמורה!. ברגע שהוסרו בגדים המכסים איברי גוף, החיפוש חרג מחיפוש מוגבל והפך לחיפוש גופני החייב בחשד סביר.</p><p>3. מלכודת ה\"שתיקה כהסכמה\" בחיפוש ממין שונה: במבחן, שוטר ממין שונה שביצע חיפוש מוגבל מבלי שהמעוכב התנגד – ביצע חיפוש בלתי חוקי, שכן חובה לקבל הסכמה מפורשת בעל פה.</p><p>4. מלכודת בקשת החיפוש בתחנה: מעוכב אינו רשאי לסרב לחיפוש מוגבל בשטח בטענה שהוא דורש לעבור אותו בתחנה בלבד.</p><p>---</p><h4>4. פסיקה וחקיקה</h4><h4>א. פסיקה שהוזכרה בנושא</h4><p>פסיקה בנושא חיפוש מוגבל על גופו של מעוכב:</p><p>(הערה: במסגרת השיעור, המרצה פירט את הוראות החוק הסטטוטוריות לגבי חיפוש מוגבל [Pat-down], הדגיש את היעדר דרישת החשד הסביר, ואת כללי התאמת המין והכוח הסביר. המרצה ציין מפורשות כי בנושא התאמת מין לטרנסג'נדרים אין עדיין פסיקה של בית המשפט העליון בישראל [הסוגיה מונחת בעליון הפדרלי בארה\"ב], ולא איזכר פסק דין ישראלי ספציפי בשמו או במספר הליך לגבי סעיף זה).</p><h4>ב. חקיקה שהוזכרה בנושא</h4><p>חוק סדר הדין הפלילי (סמכויות אכיפה – חיפוש בגוף חשוד ונטילת אמצעי זיהוי), התשנ\"ו-1996:</p><p>פקודת סדר הדין הפלילי (מעצר וחיפוש) [נוסח חדש], התשכ\"ט-1969:</p><p>מה הוא מסדיר: המסגרת הנורמטיבית של דיני החיפוש הפליליים.</p><p>---</p><li>או לבחור כל נושא אחר מתוך הרשימה!</li></section><section class=\"release-2a-addition\"><h3>הרחבת שיעור 9 — police arrest without warrant</h3><p>שלום לך עמיתי וידידי היקר.</p><p>כפרופסור לסדר דין פלילי באקדמיה וכעוזר המחקר שלך, ניתחתי באופן ממוקד ומדוקדק את המקור המסומן בלבד (\"שיעור 9 ערוך.mp3\") והכנתי עבורך את תוכן הלימוד המפורט, המדויק והמוכן לאתר הקורס בנושא: \"סמכות מעצר חשוד בידי שוטר ללא צו שופט ותנאיה המצטברים\".</p><p>---</p><h4>📚 סמכות מעצר חשוד בידי שוטר ללא צו שופט ותנאיה המצטברים</h4><p>---</p><h4>1. תקציר הנושא</h4><p>הכלל המרכזי: מעצר שוטר ללא צו שופט הוא שלילה דרסטית של חירות החשוד בשטח, אשר מותרת אך ורק בהתקיים שלושה תנאים מצטברים קשיחים הקבועים בחוק המעצרים.</p><p>התנאים המצטברים המרכזיים למעצר שוטר ללא צו:</p><p>1. חשד סביר לעבירה שאינה חטא (עבירה בת מעצר): יסוד ראייתי סביר לכך שהחשוד ביצע עבירה מסוג עוון או פשע בלבד. איסור מוחלט: אין לעצור אדם בגין עבירה מסוג חטא!</p><p>2. קיומה של עילת מעצר בידי שוטר: התקיימות אחת מעילות המעצר המפורשות בחוק המוסרות לשוטר בשטח (כגון מסוכנות, שיבוש חקירה, או הימלטות).</p><p>3. אי-יכולת להסתפק בעיכוב (עיקרון המידתיות): חובה קטגורית להעדיף את האמצעי שפוגע פחות בחירות, ואיסור ביצוע מעצר כאשר ניתן להשיג את התכלית בדרך של עיכוב.</p><p>החריג המרכזי (הולדת עילת מעצר בעבירת חטא):</p><p>אף שאסור לעצור בגין עבירת חטא מקורית (כגון נהיגה במהירות מופרזת בכביש), אם החשוד מסרב להתעכב או מפריע לשוטר מלהשתמש בסמכויות העיכוב, הסירוב עצמו מוליד עילת מעצר חוקית ועצמאית המקנה לשוטר סמכות לעצרו.</p><p>סמכות ומועד חשוב:</p><p>תקרת הזמן הסטטוטורית: סמכות המעצר הראשונית של שוטר ללא צו מוגבלת ל-24 שעות מקסימום. בתוך חלון זמן זה מחויבת המשטרה לשחרר את החשוד או להביאו בפני שופט שלום לקבלת צו הארכה.</p><p>העדפה נורמטיבית לצו שופט: בחוק המעצרים קיימת העדפה קבועה למעצר על פי צו שופט מראש; בכל מקום שבו המשטרה מנהלת חקירה ואין דחיפות מבצעית מיידית (כגון בחקירה סמויה), חובה לפנות לשופט לקבלת צו ולא לעצור באופן עצמאי.</p><p>הבחנה חשובה: הבחנה בין סמכות שוטר לבין סמכות שופט – לשוטר מוקנית סמכות מעצר קצרה עד 24 שעות בלבד, בעוד לשופט מוקנית סמכות הארכה לתקופות ממושכות בהרבה.</p><p>נקודת מבחן מרכזית: כל שוטר הוא שוטר 24/7 בכל מקום ובכל לבוש (אפילו בפיג'מה בביתו באמצע הלילה או מזכירה במטה הארצי). חבישת כובע משטרתי אינה תנאי לחוקיות המעצר אלא נוהל מפכ\"ל משמעתי בלבד, וטענה כי מעצר ללא כובע הוא בלתי חוקי – תידחה מכל וכול.</p><p>---</p><h4>2. קריאה מורחבת</h4><h4>א. מקור נורמטיבי וחוקים שהוזכרו</h4><p>חוק סדר הדין הפלילי (סמכויות אכיפה – מעצרים), התשנ\"ו-1996 (\"חוק המעצרים\"):</p><p>סעיף 1: מעגן את עיקרון החוקיות – אין מעצר אלא בחוק או לפי חוק מכוח הסמכה מפורשת, ובדרך שיבטיחו שמירה על כבוד האדם.</p><p>חוק-יסוד: כבוד האדם וחירותו:</p><p>סעיף 8 (פסקת ההגבלה): מעגן את עיקרון המידתיות והחובה לבחור באחר מבין האמצעים הפוגע פחות בחירות (העדפת עיכוב על פני מעצר).</p><h4>ב. הכלל המשפטי: שלול חירות בדרגה הגבוהה ביותר</h4><p>מהות מעצר שוטר: מעצר שוטר ללא צו הוא מהלך דרסטי השולל באופן קשה את חופש התנועה והאוטונומיה של החשוד בשטח.</p><p>סמכות גורפת לכל שוטר: הסמכות מוקנית לכל שוטר הנושא תעודת מינוי/תעודת שוטר רשמית מהמפכ\"ל. הסמכות אינה תלויה בתפקידו הספציפי במשטרה (אפילו מזכירה במטה הארצי שביצעה קורס שוטרים בסיסי) ואינה מוגבלת לשעות המשמרת (שוטר מחזיק בסמכויות מעצר 24 שעות ביממה, 7 ימים בשבוע, גם בביתו ובבגדים אזרחיים/פיג'מה).</p><h4>ג. שלושת התנאים המצטברים למעצר שוטר ללא צו</h4><p>כדי שמעצר עצמאי בידי שוטר ללא צו שופט יהיה חוקי, חייבים להתקיים שלושה תנאים מצטברים:</p><p>1. תנאי 1: חשד סביר לעבירה שאינה חטא (עבירה בת מעצר):</p><p>המעצר מותר אך ורק בגין עבירות מסוג עוון (מעל 3 חודשים עד 3 שנות מאסר) או פשע (מעל 3 שנות מאסר).</p><p>איסור מעצר בחטא: אין לעצור אדם בגין עבירה מסוג חטא! (עבירה שהעונש עליה אינו עולה על 3 חודשי מאסר או קנס קל). מעצר בגין עבירת חטא מקורית הוא בלתי חוקי בעליל.</p><p>הרף הראייתי (\"חשד סביר\"): מבטא חשד של ממש המבוסס על תשתית עובדתית/ראייתית גלויה, להבדיל מחשד בעלמא.</p><p>2. תנאי 2: התקיימות עילת מעצר בידי שוטר:</p><p>קיומה של אחת מעילות המעצר הסטטוטוריות המעניקות לשוטר סמכות מעצר בשטח (כגון חשש לשיבוש הליכי חקירה, סיכון שלום הציבור/האדם, הימלטות, או מסוכנות).</p><p>3. תנאי 3: אי-יכולת להסתפק בעיכוב (עיקרון המידתיות):</p><p>מכוח פסקת ההגבלה (סעיף 8 לחוק-יסוד: כבוד האדם וחירותו) וסעיף 1 לחוק המעצרים, קיימת חובה משפטית להעדפת האמצעי הפוגע פחות.</p><p>אין לעצור אדם אם ניתן להשיג את תכלית האכיפה והחקירה בדרך של עיכוב.</p><h4>ד. פרוצדורה, מועדים וזכויות בעת המעצר</h4><p>תחילה ופרוצדורה: מעצר שוטר מתחיל ככלל בהודעת מעצר מפורשת לחשוד (\"אתה עצור\") והבהרת סיבת המעצר בהקדם האפשרי.</p><p>חריג הפטור מהודעה: אם החשוד מפעיל התנגדות פיזית או מנסה לברוח, ביצוע \"מעשה גלוי למימוש המעצר\" (כגון הידוק אזיקים בידיים/ברגליים או תפיסה פיזית) מעניק לשוטר פטור מהודעה מוקדמת.</p><p>זמנים ותקרת 24 השעות:</p><p>מעצר שוטר מוגבל ל-24 שעות ממועד שלילת החירות הראשונית בשטח.</p><p>בתוך 24 השעות, המשטרה מחויבת להביא את החשוד בפני שופט שלום בבקשת הארכת מעצר (מעצר ימים), או להורות על שחרורו בתחנה (בתנאים או ללא תנאים).</p><h4>ה. דוגמאות המרצה</h4><p>1. דוגמת השוטר בפיג'מה באמצע הלילה (24/7 ונוהל הכובע):</p><p>התרחיש: שוטר ישן בביתו באמצע הלילה, שומע צעקות מהרחוב, יורד למטה בפיג'מה ורואה חשודה מבצעת עבירת שוד חמורה (פשע).</p><p>היישום המשפטי: השוטר מוסמך לעצור אותה מיד! שוטר הוא שוטר 24 שעות ביממה, 7 ימים בשבוע, בכל לבוש.</p><p>סוגיית הכובע: המרצה מבהיר כי השמועה כאילו שוטר חייב לחבוש כובע כדי לבצע מעצר או לתת דו\"ח היא מוטעית לחלוטין! חבישת כובע היא נוהל מפכ\"ל משמעתי פנימי בלבד, ואינה פוגעת בחוקיות המעצר.</p><p>2. דוגמת המזכירה במטה הארצי:</p><p>מזכירה במטה הארצי של המשטרה שביצעה קורס שוטרים בסיסי ומחזיקה בתעודת שוטר – מחזיקה במלוא סמכויות המעצר של שוטר לפי חוק המעצרים.</p><p>3. דוגמת גולן והמהירות המופרזת (90 קמ\"ש במקום 70 קמ\"ש):</p><p>התרחיש: שוטר מדד נהג במכשיר לייזר (ממל\"ז) נוסע ב-90 קמ\"ש במקום 70 קמ\"ש (עבירת חטא).</p><p>היישום המשפטי: השוטר אינו מוסמך לעצור אותו בגין המהירות המופרזת (כי היא חטא). אולם, אם הנהג אמר \"קח תעודת זהות, אני הולך\" וצעד מן המקום – הנהג סירב לעיכוב חוקי, והסירוב עצמו מוליד עילת מעצר חוקית ועצמאית המאפשרת לשוטר לשים עליו אזיקים ולעצרו.</p><p>4. דוגמת הפריצה למחשבי בתי המשפט והאייפד של סיגל (העדפת צו שופט):</p><p>התרחיש: מנוהלת חקירה סמויה בגין פריצה למחשבי בתי המשפט וגניבת 5 מיליון ש\"ח. החשודה (סיגל) אינה יודעת שהיא חשודה ואינה מנסה לברוח.</p><p>היישום המשפטי: אף שמדובר בעבירה בת מעצר חמורה, החוק מחייב את המשטרה לפנות מראש לשופט לקבלת צו מעצר במעמד צד אחד ולא לעצור באופן עצמאי בשטח, כיוון שיש זמן והחקירה סמויה (העדפה קטגורית לצו שופט).</p><p>5. דוגמת השוד של שושנה ורובן (ספירת 24 השעות):</p><p>שוטר עצור חשודה בגין תקיפה/שוד ביום א' בשעה 13:00. לחשודה עומד \"סטופר\" קשיח של 24 שעות עד יום ב' בשעה 13:00, ועד למועד זה חייבת המשטרה להביאה לבית המשפט או לשחררה.</p><h4>ו. משמעות מעשית למבחן</h4><p>בפתרון קייס במבחן:</p><p>1. שלב 1 – סיווג העבירה (כמו מתמטיקה): חובה לסווג תחילה את סיווג העבירה (חטא, עוון, פשע). המרצה מדגיש כי סיווג לא נכון בתחילת השאלה יהרוס את כל הנוסחה המשפטית בהמשך. אם העבירה היא חטא – מעצר שוטר הוא בלתי חוקי!</p><p>2. שלב 2 – בדיקת 3 התנאים המצטברים:</p><p>א' – חשד סביר לעוון או פשע.</p><p>ב' – קיומה של עילת מעצר בידי שוטר.</p><p>ג' – אי-יכולת להסתפק בעיכוב (העדפת האמצעי הפוגע פחות).</p><p>3. שלב 3 – חריג הסירוב לעיכוב: אם מדובר בעבירת חטא אך החשוד סירב להתעכב – המעצר חוקי מכוח עילת הסירוב לעיכוב.</p><p>4. שלב 4 – בדיקת ציר הזמנים (24 שעות): לוודא כי המעצר המשטרתי לא חרג מ-24 שעות ממועד שלילת החירות בשטח.</p><p>---</p><h4>3. הרחבה מקיפה</h4><h4>א. ניתוח המבנה הנורמטיבי והאיזון החוקתי</h4><p>סמכות מעצר חשוד בידי שוטר ללא צו מעגנת נקודת חיכוך קריטית בין כוח האכיפה השלטוני לבין זכות היסוד לחירות מכוח חוק-יסוד: כבוד האדם וחירותו.</p><p>1. מנגנון הריסון הבלמים והאיזונים:</p><p>הכלל החוקתי: נטילת חירותו של אזרח צריכה להיעשות ככלל באישור מוקדם של הרשות השופטת (צו שופט מראש).</p><p>החריג המבצעי (מעצר שוטר ללא צו): הותר לשוטר לפעול ללא צו שיפוטי רק מתוך נסיבות של דחיפות מבצעית בשטח.</p><p>2. קשיחות התנאים המצטברים:</p><p>המחוקק קבע שלושה תנאים מצטברים (ולא חלופיים!) כדי להבטיח כי שוטר לא יפעיל מעצר כצעד ענישתי או שרירותי. העדר תנאי אחד משלושת התנאים מפיל את חוקיות המעצר והופך אותו למעצר בלתי חוקי.</p><p>3. הסיווג הראייתי והמשפטי כ\"מתמטיקה\":</p><p>המרצה מבהיר לסטודנטים כי ניתוח מעצר במבחן ובפרקטיקה עובד בדיוק כמו נוסחה מתמטית:</p><p>\\\\[\\text{עוון/פשע (חטא אסור)} + \\text{עילת מעצר שוטר} + \\text{אי-יכולת להסתפק בעיכוב} = \\text{מעצר שוטר חוקי (עד 24 שעות)}\\\\]</p><h4>ב. ניתוח מפורט של שלושת התנאים המצטברים והסייגים</h4><h4>1. ניתוח עומק – תנאי 1: עבירה בת מעצר ורף \"חשד סביר\"</h4><p>איסור מעצר בעבירת חטא: עבירת חטא (כגון מטרד קל או עבירת תנועה קלה) אינה מעמידה סמכות מעצר לשוטר.</p><p>סיווג העוון והפשע: מעצר מותר אך ורק בעוון או פשע.</p><p>רף החשד הסביר: אינו מצריך ראיות המוכיחות אשמה מעבר לכל ספק סביר (רף של הרשעה), אך חייב להתבסס על תשתית עובדתית אובייקטיבית ומוחשית (\"חשד של ממש\") ולא על תחושת בטן או חשד בעלמא.</p><h4>2. ניתוח עומק – תנאי 2: עילת מעצר בידי שוטר</h4><p>המרצה מציין כי עילות המעצר מפורטות בסעיף הבא בחוק (ילמדו בהרחבה בהמשך השיעורים), וכוללות בין היתר: חשש לשיבוש הליכי חקירה, סיכון שלום הציבור/אדם, הימלטות מאימת הדין, או זהות בלתי ידועה.</p><h4>3. ניתוח עומק – תנאי 3: אי-יכולת להסתפק בעיכוב (פסקת ההגבלה)</h4><p>עקרון האמצעי הפוגע פחות: שוטר חייב לבחון באופן אקטיבי האם ניתן להשיג את תכלית האכיפה (כגון בירור פרטים, חקירה במקום או מסירת מסמכים) בדרך של עיכוב בלבד. אם ניתן להשיג את התכלית בעיכוב – המעצר מוחרם ובלתי חוקי.</p><h4>ג. ניתוח מעמיק של סוגיית הסטטוס המשטרתי (24/7 ונוהל הכובע)</h4><p>1. סטטוס השוטר (24/7):</p><p>תעודת השוטר מעניקה לבעליה סמכויות אכיפה ומעצר רציפות 24 שעות ביממה, 365 ימים בשנה.</p><p>הסמכות חלה גם כשהשוטר בחופשה, בביתו, בלבוש אזרחי, או בפיג'מה.</p><p>2. נוהל הכובע המשטרתי (פער בין נוהל לחוק):</p><p>בציבור קיימת מיתולוגיה כאילו שוטר שאינו חובש כובע אינו מוסמך לעצור או לרשום דו\"ח.</p><p>קביעת המרצה: חבישת כובע היא הנחיה משמעתית פנימית בפקודות המפכ\"ל. אי-חבישת כובע עשויה לגרום לשוטר בירור משמעתי מול מפקדיו, אך אינה פוגמת כהוא זה בחוקיות המעצר!.</p><h4>ד. מלכודות למבחן, טעויות נפוצות ודגשי מרצה</h4><p>1. מלכודת סיווג העבירה (חטא מול עוון/פשע): במבחן, אם יוצג קייס שבו שוטר עצר אדם בגין עבירת חטא והנאשם שיתף פעולה – המעצר הוא בלתי חוקי מיסודו!.</p><p>2. מלכודת הסירוב לעיכוב בחטא: אם החשוד בעבירת חטא סירב להתעכב או אמר \"אני הולך\" – המעצר הופך לחוקי לחלוטין מכוח עילת הסירוב לעיכוב.</p><p>3. מלכודת ספירת 24 השעות: ספירת 24 השעות של מעצר השוטר מתחילה מהרגע הראשון שבו נשללה חירותו של החשוד בשטח (ולא ממועד הקלטתו בתחנה ולא ממועד החלטת הקצין הממונה).</p><p>4. מלכודת טענת \"שוטר מחוץ לתפקיד / ללא כובע\": טענה כי המעצר בלתי חוקי משום שהשוטר היה בלבוש אזרחי/פיג'מה או ללא כובע היא טעות משפטית!.</p><p>5. מלכודת העדפת צו שופט: בחקירה סמויה שבה החשוד אינו יודע על החקירה ויש זמן לפנות לבית המשפט – ביצוע מעצר שוטר עצמאי בשטח ללא צו שופט מראש מפר את ההנחיה הנורמטיבית להעדפת צו שופט.</p><p>---</p><h4>4. פסיקה וחקיקה</h4><h4>א. פסיקה שהוזכרה בנושא</h4><p>פסיקה בנושא סמכות מעצר חשוד בידי שוטר ללא צו שופט ותנאיה המצטברים:</p><p>(הערה: במסגרת דיון זה בשיעור 9, המרצה פירט מתוך חוק המעצרים את שלושת התנאים המצטברים למעצר שוטר ללא צו [חשד סביר לעוון/פשע, עילת מעצר, ואי-יכולת להסתפק בעיכוב], את תקרת 24 השעות, את ההעדפה לצו שופט בחקירה סמויה, ואת הדוגמאות הלימודיות של השוטר בפיג'מה, נוהל הכובע וגולן במהירות המופרזת, ולא איזכר פסק דין ספציפי של בית המשפט העליון בשמו או במספר הליך לגבי תנאים סטטוטוריים אלה).</p><h4>ב. חקיקה שהוזכרה בנושא</h4><p>חוק סדר הדין הפלילי (סמכויות אכיפה – מעצרים), התשנ\"ו-1996 (\"חוק המעצרים\"):</p><p>סעיף 1: מעגן את עיקרון החוקיות בדיני מעצרים ועיכוב – אין מעצר אלא בחוק או לפי חוק מכוח הסמכה מפורשת.</p><p>חוק-יסוד: כבוד האדם וחירותו:</p><p>סעיף 8 (פסקת ההגבלה): הנורמה החוקתית המחייבת את העדפת האמצעי הפוגע פחות בחירות (עיכוב על פני מעצר).</p><p>---</p><p>💡 רעיונות להמשך:</p><li>השלמנו בהצלחה את עיבוד כל שבעת הנושאים המרכזיים מתוך שיעור 9 בשלוש שכבות עומק עבור אתר הקורס!</li><li>אם תרצה, נוכל לעבור כעת לעבד נושאים משיעורים אחרים בקורס (כגון שיעורים 1-8 או 10 ואילך), ליצור מפת סיכום כוללת, או לבחור כל משימה לימודית אחרת שתעזור לך בהכנה למבחן! במה תעדיף להתמקד?</li></section>"},"arrest-bridge":{"title":"הצהרת תובע ומעצר גישור","html":"\n      <div class=\"eyebrow\">סעיף 17(ד) לחוק המעצרים · הרחבה — לא נלמד בהקלטת שיעור 8</div>\n      <h2>הצהרת תובע ומעצר גישור</h2>\n      <p>כאשר חקירת המשטרה נסתיימה והחשוד במעצר, הכלל הוא שחרור. אולם סעיף 17(ד) מעניק לבית המשפט סמכות להאריך את המעצר עד 5 ימים — \"מעצר גישור\" — לשם הגשת כתב אישום ובקשה למעצר עד תום ההליכים.</p>\n      <h3>תנאים מצטברים</h3>\n      <p><b>1.</b> הצהרה בכתב חתומה על ידי תובע, לפיה לאחר עיון בחומר החקירה יש מקום לכאורה להגיש כתב אישום. <b>2.</b> בית המשפט שוכנע כי יש עילה לכאורה לבקש מעצר עד תום ההליכים.</p>\n      <div class=\"callout warn\"><span class=\"callout-title\">דגש למבחן</span><p>מעצר גישור כפוף לחלוטין לתקרת ימי המעצר הרגילים לפני כתב אישום. אם חלפו כבר 30 יום מעצר — נדרש אישור בכתב של היועץ המשפטי לממשלה להגשת הבקשה.</p></div>\n      <div class=\"callout case-callout\"><span class=\"callout-title\">קשור לפסק דין</span><button class=\"case-link\" data-case=\"29\">⚖ מוצעב אלטויל נגד מדינת ישראל (2004)</button></div>\n      <div class=\"example-box\">\n        <span class=\"ex-title\">💡 דוגמה — מתי הצהרת תובע פסולה</span>\n        <p>אם מתברר שהתביעה מתכננת לבצע פעולות חקירה נוספות ומשמעותיות במהלך ימי הגישור עצמם — הצהרת התובע פסולה, ועל המשטרה לפעול במסלול הרגיל של מעצר ימים לצורכי חקירה (פרשת יגמור סאמר).</p>\n      </div>\n"},"arrest-pending":{"title":"מעצר עד תום ההליכים","html":"\n      <div class=\"eyebrow\">סעיף 21 לחוק המעצרים · הרחבה — לא נלמד בהקלטת שיעור 8</div>\n      <h2>מעצר עד תום ההליכים</h2>\n      <p>לאחר הגשת כתב אישום רשמי, המעצר הופך ממעצר חשוד למעצר נאשם עד תום ההליכים. הסמכות העניינית והמקומית נתונה באופן בלעדי לבית המשפט שאליו הוגש כתב האישום — לא בהכרח לשלום.</p>\n      <h3>ארבעה תנאים מצטברים (21(א))</h3>\n      <div class=\"scenario-row\"><span class=\"verdict need\">1</span><div>התקיימות עילת מעצר סטטוטורית</div></div>\n      <div class=\"scenario-row\"><span class=\"verdict need\">2</span><div>קיומן של ראיות לכאורה להוכחת האשמה</div></div>\n      <div class=\"scenario-row\"><span class=\"verdict need\">3</span><div>היעדר חלופת מעצר פחות פוגענית</div></div>\n      <div class=\"scenario-row\"><span class=\"verdict need\">4</span><div>ייצוג הנאשם — או שהודיע שאינו מעוניין בייצוג</div></div>\n      <p>נאשם שאינו מיוצג ואינו מוותר — ניתן לעצור לתקופות עד 7 ימים בכל פעם, עד 30 יום סה\"כ, שבמהלכם ימונה סנגור מטעם הסנגוריה הציבורית.</p>\n      <div class=\"callout case-callout\"><span class=\"callout-title\">קשור לפסק דין — ראיות לכאורה</span><button class=\"case-link\" data-case=\"30\">⚖ שלמה זאדה נגד מדינת ישראל (1995)</button></div>\n      <h3>עילות המעצר (21(א)(1))</h3>\n      <ul>\n        <li>חשש לשיבוש הליכי משפט (השפעה על עדים, העלמת ראיות, פגיעה ברכוש)</li>\n        <li>סכנה לביטחון אדם/ציבור/מדינה</li>\n        <li>חזקת מסוכנות סטטוטורית (עבירת מיתה/עולם, ביטחון, סמים, אלימות חמורה/במשפחה) — הנטל עובר לנאשם להפריכה</li>\n        <li>הפרת תנאי ערובה</li>\n      </ul>\n      <div class=\"callout case-callout\"><span class=\"callout-title\">קשור לפסק דין — חוקתיות ומסוכנות אישית</span><button class=\"case-link\" data-case=\"31\">⚖ עימאד גנימאת נגד מדינת ישראל (1995)</button></div>\n      <div class=\"example-box\">\n        <span class=\"ex-title\">💡 דוגמה — חלופת מעצר גם בעבירות חמורות</span>\n        <p>גם בעבירות מרמה מורכבות או הלבנת הון, חובה לבחון חלופת מעצר כגון מעצר בית או פיקוח אלקטרוני — ואין לעצור אדם מאחורי סורג ובריח רק בשל \"חמת זעם\" ציבורית (פרשת רפי רותם).</p>\n      </div>\n      <p>לאחר הגשת כתב אישום, נאשם או סנגורו המבקשים דחייה כדי לעיין בחומרי חקירה מלאים (סעיף 74) — ביהמ\"ש מוסמך לעצור לתקופות קצרות על בסיס \"ניצוץ ראייתי\" בלבד, בפרקטיקה עד 30 יום.</p>\n<section class=\"release-2a-addition\"><h3>הרחבת שיעור 9 — pretrial detention time limits morozova</h3><h4>📚 מעצר עד תום ההליכים, מגבלות הזמן והלכת ילנה מורוזובה</h4><p>---</p><h4>1. תקציר הנושא</h4><p>הכלל המרכזי: מעצר עד תום ההליכים הוא שלילת חירותו של נאשם לאחר הגשת כתב אישום ועד לסיום משפטו, בשל מסוכנותו לשלום הציבור, וזאת על אף שקיימת לו חזקת החפות כל עוד לא הוכחה אשמתו.</p><p>חלופות המעצר ומגבלות הזמן הסטטוטוריות (סעיף 61 לחוק המעצרים):</p><p>1. מעצר רגיל (מאחורי סורג ובריח): מוגבל בחוק לתקופה מרבית של 9 חודשים.</p><p>2. מעצר בפיקוח אלקטרוני (אזיק אלקטרוני בקרסול): מוגבל בחוק לתקופה מרבית של 18 חודשים.</p><p>החריג המרכזי והארכת מעצר (סעיף 62 לחוק המעצרים):</p><p>הארכת מעצר מעבר לתקרה: הסמכות להאריך את המעצר עד תום ההליכים מעבר ל-9 חודשים (או 18 חודשים בפיקוח אלקטרוני) נתונה בסמכותו הבלעדית של בית המשפט העליון.</p><p>סמכות ומועד חשוב:</p><p>המרוץ הסטטוטורי (\"הטיימר\"): ממועד מתן צו המעצר עד תום ההליכים נפתחת ספירת זמן קשיחה (\"שעון מתקתק\") המחייבת את המערכת לסיים את המשפט בתוך תקרת הזמן הקבועה בחוק.</p><p>הבחנה חשובה: הבחנה בין מעצר ימים במהלך חקירה (הנמדד בימים ונערך לפני הגשת כתב אישום) לבין מעצר עד תום ההליכים (הנמדד בחודשים ונערך לאחר הגשת כתב אישום).</p><p>נקודת מבחן מרכזית (הלכת ילנה מורוזובה): ביטול הרשעה והחזרת תיק על ידי בית המשפט העליון לדיון מחדש בערכאה הדיונית אינם מאפסים (\"קוצבים מחדש\") את תקופת 9 החודשים של מעצר עד תום ההליכים. בהיעדר הסמכה מפורשת בחוק לאיפוס המרוץ, חל עיקרון החוקיות (סעיף 1 לחוק המעצרים), והדרך החוקית היחידה להמשך המעצר היא הגשת בקשת הארכה לבית המשפט העליון לפי סעיף 62.</p><p>---</p><h4>2. קריאה מורחבת</h4><h4>א. מקור נורמטיבי וסעיפי חוק</h4><p>חוק סדר הדין הפלילי (סמכויות אכיפה – מעצרים), התשנ\"ו-1996 (\"חוק המעצרים\"):</p><p>סעיף 1: מעגן את עיקרון החוקיות – אין מעצר ואין עיכוב אלא בחוק או לפי חוק מכוח הסמכה מפורשת.</p><p>סעיף 61: מסדיר את קציבת התקופה המרבית של מעצר עד תום ההליכים (9 חודשים במעצר רגיל, 18 חודשים בפיקוח אלקטרוני).</p><p>סעיף 62: מסדיר את הסמכות הבלעדית של בית המשפט העליון להאריך מעצר עד תום ההליכים מעבר לתקופות בסעיף 61.</p><p>הלכת בית המשפט העליון: בש\"פ ילנה מורוזובה נ' מדינת ישראל.</p><h4>ב. הכלל המשפטי: מהות מעצר עד תום ההליכים</h4><p>האיזון החוקתי: לאחר הגשת כתב אישום, הנאשם נהנה מחזקת החפות (הוא חף מפשע עד שבית המשפט יקבע אחרת). אולם, כאשר קיימת עילת מעצר מובהקת (כגון מסוכנות לשלום הציבור), המדינה אינה יכולה להרשות לעצמה שהנאשם יסתובב חופשי ברחוב במהלך ניהול משפטו.</p><p>צורות המעצר עד תום ההליכים:</p><p>1. מעצר רגיל: החזקת הנאשם מאחורי סורג ובריח במתקן מעצר/כלא.</p><p>2. מעצר בפיקוח אלקטרוני: החזקת הנאשם בביתו תוך ענידת אזיק אלקטרוני בקרסול המפקח על מיקומו. יציאה מהבית מפעילה התרעה צלילית וגוררת זינוק של שוטרים ומעבר למעצר רגיל.</p><h4>ג. תקרות הזמן והסמכות להארכה (סעיפים 61 ו-62)</h4><p>תקרות הזמן בחוק (סעיף 61):</p><p>9 חודשים: תקרת הזמן הסטטוטורית למעצר עד תום ההליכים במעצר רגיל.</p><p>18 חודשים: תקרת הזמן הסטטוטורית למעצר עד תום ההליכים בפיקוח אלקטרוני.</p><p>מנגנון ה\"טיימר\": ברגע שבית המשפט מורה על מעצר עד תום ההליכים, נפתח \"שעון מתקתק\" מעל ראש התביעה ובית המשפט, המחייב לנהל ולסיים את המשפט בתוך התקופה הקצובה.</p><p>הארכה בידי בית המשפט העליון (סעיף 62): אם המשפט לא הסתיים בתוך 9 חודשים (או 18 חודשים בפיקוח אלקטרוני), בית המשפט המחוזי/השלום אינו מוסמך להאריך את המעצר בעצמו. המדינה מחויבת לפנות בבקשה מיוחדת לבית המשפט העליון מכוח סעיף 62, ורק העליון מוסמך להורות על הארכת המעצר.</p><h4>ד. הלכת ילנה מורוזובה (אי-איפוס המרוץ)</h4><p>כאשר ערכאת הערעור (בית המשפט העליון) מבטלת הרשעה בשל פגם חמור בהליך ומחזירה את התיק לערכאה הדיונית (בית המשפט המחוזי) כדי להתחיל את המשפט מההתחלה, מרוץ 9 החודשים אינו מתאפס!</p><p>מכוח עיקרון החוקיות (סעיף 1), בית המשפט המחוזי אינו רשאי לקצוב מעצר עד תום ההליכים מחדש כ\"מעצר חדש\". אם חלפו 9 חודשים, המדינה מחויבת לפנות לבית המשפט העליון לפי סעיף 62 לקבלת צו הארכה; בהיעדר אישור מהעליון – הנאשם משוחרר.</p><h4>ה. דוגמאות המרצה</h4><p>1. דוגמת ראובן הרוצח:</p><p>ראובן דקר ורצח את שושנה. הוא נעצר במהלך החקירה. עם הגשת כתב האישום, הפרקליטות מבקשת לעצור אותו עד תום ההליכים.</p><p>הסבר המרצה: אף שראובן נהנה כרגע מחזקת החפות עד לתום המשפט, לא ניתן לאפשר לאדם שביצע רצח להסתובב חופשי ברחוב בשל הסכנה העצומה שהוא מהווה לשלום הציבור. לפיכך הוא מושם במעצר עד תום ההליכים, ועל המשפט להסתיים בתוך 9 חודשים.</p><p>2. דוגמת האזיק האלקטרוני בקרסול:</p><p>המרצה מדגים את מנגנון הפיקוח האלקטרוני: שמים אזיק בקרסול המנטר את המיקום. אם הנאשם מנסה לצאת מהבית, האזיק מצפצף; אם הוא מתעלם וממשיך לצאת, מוקפצים שוטרים שעוצרים אותו ומעבירים אותו למעצר רגיל מאחורי סורג ובריח.</p><h4>ו. משמעות מעשית למבחן</h4><p>בפתרון קייס במבחן:</p><p>1. יש לבדוק האם מדובר בנאשם שהוגש נגדו כתב אישום (מעצר עד תום ההליכים) ולבחון את סוג המעצר (רגיל = 9 חודשים; פיקוח אלקטרוני = 18 חודשים).</p><p>2. אם חלפה תקרת הזמן והמשפט טרם הסתיים, חובה לציין כי הסמכות הבלעדית להארכה שמורה לבית המשפט העליון לפי סעיף 62.</p><p>3. אם התיק הוחזר לדיון מחדש בערכאה הדיונית, יש ליישם את הלכת מורוזובה ולהתריע כי ניסיון לקצוב מעצר מחדש כ\"מעצר חדש\" הוא בלתי חוקי ומפר את עיקרון החוקיות (סעיף 1).</p><p>---</p><h4>3. הרחבה מקיפה</h4><h4>א. ניתוח מעמיק של המבנה הנורמטיבי והאיזון החוקתי</h4><p>ההסדר של מעצר עד תום ההליכים בסעיפים 61 ו-62 לחוק המעצרים מגלם את המתח החריף ביותר בדיון הפלילי בין חזקת החפות וזכות היסוד לחירות לבין הגנת שלום הציבור ותקינות ההליך המשפטי.</p><p>1. המתח מול חזקת החפות: בשלב המעצר עד תום ההליכים, הנאשם טרם הורשע. שלילת חירותו לתקופה مמושכת מהווה פגיעה קשה ביותר בחירותו בטרם נגזר דינו.</p><p>2. תכלית הקציבה בסטופר סטטוטורי (סעיף 61): המחוקק קבע תקרות קשיחות (9 חודשים / 18 חודשים) כדי ליצור לחץ מערכתי על התביעה ובית המשפט לנהל את המשפט ביעילות ובמהירות, ולמנוע מצב של \"מאסר מנהלי דה-פקטו\" ללא הכרעת דין.</p><p>3. הבקרה השיפוטית העליונה (סעיף 62): ההכרעה להחזיק אדם במעצר מעבר לתקרה הסטטוטורית הוצאה מידי הערכאה הדיונית והופקדה בידי הערכאה הגבוהה ביותר (בית המשפט העליון), כדי להבטיח פיקוח הדוק ומבוקר על כל יום נוסף של שלילת חירות.</p><h4>ב. ניתוח מעמיק של פסק דין ילנה מורוזובה</h4><p>1. סיפור המסגרת בקצרה:</p><p>נגד ילנה מורוזובה הוגש כתב אישום והיא נעצרה עד תום ההליכים לפי סעיף 61 לחוק המעצרים.</p><p>המשפט התנהל בבית המשפט המחוזי, ולאורכו שהתה מורוזובה במעצר. בתום המשפט היא הורשעה בדין.</p><p>מורוזובה הגישה ערעור לבית המשפט העליון. העליון מצא כי נפל פגם פרוצדורלי/ראייתי כבד מאוד בניהול המשפט בערכאה הדיונית, ביטל את הכרעת הדין, והורה להחזיר את התיק לבית המשפט המחוזי כדי להתחיל לנהל את המשפט מחדש מבראשית.</p><p>2. מה טיעוני הצדדים:</p><p>טיעון המדינה: המדינה טענה כי ברגע שהכרעת הדין בוטלה והמשפט הוחזר להתחלה, הדיון הפלילי \"מתחיל מאפס\". לפיכך, לטענת המדינה, מוקנית לבית המשפט המחוזי סמכות לקצוב מעצר עד תום ההליכים חדש לתקופה של 9 חודשים נוספים מראש.</p><p>טיעון הנאשמת: הנאשמת טענה כי תקרת 9 החודשים נספרת מיום המעצר המקורי. כיוון שאין בחוק סעיף המאפשר איפוס או קציבה מחדש, הרי שמכוח עיקרון החוקיות המעצר פקע, והדרך היחידה להמשיך להחזיקה במעצר היא הגשת בקשת הארכה לבית המשפט העליון לפי סעיף 62.</p><p>3. מה השאלות המשפטיות העומדות להכרעה:</p><p>האם החזרת תיק על ידי ערכאת הערעור לדיון מחדש בערכאה הדיונית מאפסת את מרוץ 9 החודשים של מעצר עד תום ההליכים ומאפשרת לקצוב מעצר חדש, או שמא מרוץ הזמנים ממשיך ונדרשת הארכה מהעליון לפי סעיף 62?</p><p>4. מה ההלכה שיצאה מפסק הדין:</p><p>בית המשפט העליון קבע הלכה קשיחה המבוססת על עיקרון החוקיות (סעיף 1 לחוק המעצרים): \"אין מעצר ללא סמכות לפי חוק\".</p><p>בחוק המעצרים אין שום הוראה המאפשרת איפוס או קציבה מחדש של תקופת מעצר עד תום ההליכים עקב החזרת תיק לדיון מחדש.</p><p>לפיכך, בית המשפט המחוזי אינו מוסמך לפסוק מעצר עד תום ההליכים חדש. המסלול החוקי היחיד להמשך המעצר הוא הגשת בקשת הארכה לבית המשפט העליון מכוח סעיף 62; בהיעדר אישור מהעליון – הנאשמת חייבת להשתחרר.</p><p>5. תכלית הלימוד ע\"י המרצה:</p><p>המרצה משתמש בהלכת מורוזובה כדי להדגים לסטודנטים את עוצמתו של עיקרון החוקיות בסעיף 1, וכדי להבהיר כי המערכת המשפטית אינה מוכנה לסבול יצירת סמכויות מעצר מכללא או איפוס זמנים הפוגע בחירות הנאשם ללא הסמכה חוקית מפורשת.</p><h4>ג. מלכודות למבחן ודגשים מפורשים של המרצה</h4><p>1. מלכודת איפוס ה\"טיימר\" (מורוזובה): במבחן, אם מוצג תרחיש שבו בית המשפט העליון החזיר תיק לדיון מחדש והתביעה מנסה לבקש מעצר עד תום ההליכים מחדש ל-9 חודשים בערכאה הדיונית – זוהי טעות משפטית חמורה! חובה לציין לפי הלכת מורוזובה שהמרוץ אינו מתאפס, והסמכות היחידה להארכה היא פנייה לעליון לפי סעיף 62.</p><p>2. מלכודת 9 חודשים מול 18 חודשים: במבחן, יש לדייק בסוג המעצר: מעצר רגיל מוגבל ל-9 חודשים, בעוד מעצר בפיקוח אלקטרוני מוגבל ל-18 חודשים.</p><p>3. דגש מפורש של המרצה: המרצה מזהיר מפורשות כי נושא זה (מעצר עד תום ההליכים, מגבלות הזמן והלכת מורוזובה) \"יופיע בבחינה בוודאות\" כיוון שהוא מהווה אבן דרך קריטית בדיני המעצרים.</p><p>---</p><h4>4. פסיקה וחקיקה</h4><h4>א. פסיקה שהוזכרה בנושא</h4><p>ילנה מורוזובה נ' מדינת ישראל (אוזכר בשיעור כ\"פסק דין ילנה מורוזובה\"):</p><p>מה פסק הדין מלמד בנושא: מעגן את עיקרון החוקיות (סעיף 1 לחוק המעצרים) וקובע כי החזרת תיק על ידי ערכאת הערעור לדיון מחדש בערכאה הדיונית אינה מאפסת את מרוץ 9 החודשים של מעצר עד תום ההליכים (סעיף 61), וכי הדרך החוקית היחידה להמשך המעצר היא פנייה לבית המשפט העליון לקבלת צו הארכה מכוח סעיף 62.</p><h4>ב. חקיקה שהוזכרה בנושא</h4><p>חוק סדר הדין הפלילי (סמכויות אכיפה – מעצרים), התשנ\"ו-1996 (\"חוק המעצרים\"):</p><p>סעיף 1: מעגן את עיקרון החוקיות בדיני מעצרים ועיכוב – אין מעצר ואין עיכוב אלא בחוק או לפי חוק מכוח הסמכה מפורשת.</p><p>סעיף 61: מסדיר את מגבלות הזמן הסטטוטוריות למעצר עד תום ההליכים (9 חודשים במעצר רגיל, 18 חודשים בפיקוח אלקטרוני).</p><p>סעיף 62: מסדיר את הסמכות הבלעדית של בית המשפט העליון להאריך מעצר עד תום ההליכים מעבר לתקופות בסעיף 61.</p><p>---</p><li>או לבחור כל נושא אחר שתרצה מתוך הרשימה!</li></section>"},"arrest-release":{"title":"שחרור אוטומטי, מעצר לאחר הרשעה וערר","html":"\n      <div class=\"eyebrow\">סעיפים 52–53, 60–62 לחוק המעצרים · הרחבה — לא נלמד בהקלטת שיעור 8</div>\n      <h2>שחרור באין משפט/הכרעת דין, מעצר לאחר הרשעה וערר</h2>\n      <h3>שחרור אוטומטי</h3>\n      <div class=\"scenario-row\"><span class=\"verdict ok\">סעיף 60 — אין משפט</span><div>30 יום מהגשת כתב אישום ללא תחילת משפט → שחרור. חריג: 30 יום נוספים לבקשת הנאשם, או הארכות עליון של 90 יום בכל פעם</div></div>\n      <div class=\"scenario-row\"><span class=\"verdict ok\">סעיפים 61–62 — אין הכרעת דין</span><div>9 חודשים מצטברים ממעצר לאחר כתב אישום ללא הכרעת דין → שחרור. חריג: הארכות עליון של 90 יום, ועד 150 יום בתיק מורכב (ריבוי נאשמים/עדים)</div></div>\n      <div class=\"callout case-callout\"><span class=\"callout-title\">קשור לפסק דין</span><button class=\"case-link\" data-case=\"32\">⚖ מדינת ישראל נגד איבדיוב (1998)</button></div>\n      <div class=\"example-box\">\n        <span class=\"ex-title\">💡 מורוזובה — מצרפים ימי מעצר, לא מאפסים</span>\n        <p>לפי דעת הרוב במורוזובה, לאחר ביטול הכרעת הדין מצרפים את ימי המעצר שקדמו להכרעה לימי המעצר לאחר החזרת הדיון. תקופת המאסר אינה נכללת במניין זה. אין להתחיל אוטומטית תשעה חודשים חדשים. אם תקופת המעצר הקודמת קצרה מתשעה חודשים, סמכות הערכאה הדיונית היא ליתרה עד להשלמת התקופה. שאלת האיפוס הופיעה בדעת המיעוט, לא בהלכה שנקבעה.</p>\n      </div>\n      <h3>מעצר לאחר הרשעה</h3>\n      <p>ניתנה הכרעת דין מרשיעה נגד נאשם שהיה עצור 9 חודשים — ביהמ\"ש שהרשיע מוסמך להאריך את מעצרו עד גזר הדין. אם לא ניתן גזר דין תוך 90 יום מההרשעה — שחרור, אלא אם שופט עליון האריך.</p>\n      <h3>ערר על החלטות מעצר וכן עיכוב שחרור</h3>\n      <p>על החלטת שלום/מחוזי בעניין מעצר, שחרור או ערובה — ערר בזכות פעם אחת לערכאה הגבוהה יותר, בשופט יחיד (52-53). אם ביהמ\"ש מחליט לשחרר עצור, והתביעה מודיעה במעמד ההחלטה שבכוונתה לערור — ביהמ\"ש רשאי להשהות את השחרור עד 48 שעות, כדי לאפשר הגשת ערר כשהחשוד עדיין במעצר.</p>\n"},"limitations-pointer":{"html":"<div class=\"eyebrow\">טענה מקדמית — סעיף 149(6)</div><h2>התיישנות: תזכורת ממוקדת</h2><p>בשיעור 7 חזר המרצה על התיישנות העבירה: חטא — שנה; עוון — חמש שנים; ופשע רגיל — עשר שנים. בפשע חמור נדרשים <b>שני תנאים מצטברים</b>: עונש של יותר משבע שנות מאסר והופעה בתוספת; התקופה היא 15 שנים. עבירות שעונשן מיתה או מאסר עולם מתיישנות לאחר 30 שנים, ולרשימת העבירות המצומצמת שהמרצה מנה אין התיישנות.</p><p>פעולת חקירה, כתב אישום והליך מטעם בית המשפט הם אירועים מנתקים. מנגנון \"התקופה הנוספת\" נוגע, לפי ההסבר בשיעור, לאירוע מנתק מסוג פעולת חקירה בלבד. המרצה הורה <b>לא ללמוד למבחן</b> את טבלת ההארכות ואת נושא התיישנות עבירות המין בקטינים, אף שהם מופיעים במצגת.</p><p>בהתיישנות עונש: הדיון הוא בעונש שלא התחיל להתבצע או שביצועו הופסק שלא באשמת הנידון. בפשע, עוון וחטא ציין המרצה תקופות של 20, 10 ו־3 שנים בהתאמה; זמן התחמקות או שהייה בחו״ל אינו בא במניין בפשע ובעוון.</p><button class=\"case-link\" id=\"open-limitations-btn\">⏳ עבור/י ללשונית ההתיישנות</button><h3>פרטים שנוספו במצגת</h3><p>המצגת מפרטת אירועים ותקופות שאינם מובאים במניין ההתיישנות, לרבות אי־יכולת לאתר חשוד או עד מרכזי, התחמקות, מצב רפואי/נפשי, עזרה משפטית ממדינה אחרת, הליכים שנוקט החשוד, חסינות והתקופה שבה מתקיים הסדר סגירת תיק. בהליכי חקירה, \"התקופה הנוספת\" והארכותיה תלויות בסיווג העבירה ובגורם המאשר; אין להחילן על חטא.</p>"},"summations":{"title":"סיכומים בכתב ובעל־פה","html":"<h2>סיכומים: מי מדבר אחרון ובאיזו מתכונת?</h2><p><b>תקציר:</b> בתום הראיות הצדדים מסכמים את התמונה ומסבירים איזו מסקנה יש להסיק. לפי הסבר המרצה
