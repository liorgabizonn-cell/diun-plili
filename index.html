 ופגם או פסול בכתב האישום בשלב מאוחר דורשים רשות בית המשפט.</p><p>פגם הוא השמטת פרט ענייני מכתב האישום; פסול הוא אי־עמידה בדרישת כשרות דיונית, כגון כתב אישום שלא הוגש בידי תובע מוסמך. בקבלת טענה בית המשפט יכול לתקן, לבטל או להעביר לבית משפט מוסמך — לא לזכות.</p><h3>טענות נוספות</h3><p>משפט פלילי אחר התלוי ועומד באותו עניין מוביל לביטול כתב האישום. חסינות וחנינה חוסמות העמדה לדין לפי התנאים שנלמדו; הגנה מן הצדק לפי בורוביץ, נוה ורותם מאפשרת ביטול כאשר ההליך עומד בסתירה מהותית לצדק ולהגינות.</p>","lesson":"6","status":"הורחב ואומת מול מצגת 3","lessons":["6"],"source":"דיון פלילי - מצגת שלישית - 234907.PDF, שקפים 36–70"},{"id":"court-jurisdiction","tag":"22","title":"סמכות מקומית ועניינית של בתי המשפט (נלמד בשיעור 6)","html":"<div class=\"eyebrow\">מצגת 3 · סעיפים 6–8</div><h2>סמכות מקומית</h2><p>הסמכות מתקיימת במקום ביצוע העבירה או מקום מגורי הנאשם. אם שניהם אינם ידועים — במקום תפיסתו; בעבירת חוץ, כשמקום מגוריו אינו בישראל או אינו ידוע — במקום היחידה החוקרת. בצירוף אישומים או נאשמים מוסמך כל בית משפט שיש לו שיפוט באחת העבירות או על אחד הנאשמים.</p><p>כאשר היועץ המשפטי לממשלה קובע שאין בית משפט מוסמך לפי הכללים הרגילים, הסמכות בירושלים. העברה מחמת חוסר סמכות אפשרית לפי סעיף 79 לחוק בתי המשפט; בית המשפט המקבל רשאי להמשיך מן השלב שאליו הגיע קודמו ואינו מעביר שוב.</p>","lesson":"6","status":"הורחב ואומת מול מצגת 3","lessons":["6"],"source":"דיון פלילי - מצגת שלישית - 234907.PDF, שקפים 1–35"},{"id":"double-jeopardy-justice","tag":"23","title":"סיכון כפול, חסינות, חנינה והגנה מן הצדק (נלמד בשיעור 6)","html":"\n      <div class=\"eyebrow\">טענות מקדמיות 4–7</div>\n      <h2>סיכון כפול, חסינות, חנינה והגנה מן הצדק</h2>\n      <p>זיכוי/הרשעה קודמים (5), סיכון כפול (נדיר, אף פעם לא התקבל בפועל), חסינויות וחנינה, הגנה מן הצדק.</p>\n      <div class=\"callout case-callout\"><span class=\"callout-title\">קשור לפסקי דין</span><button class=\"case-link\" data-case=\"13\">⚖ קרישניסקי</button> <button class=\"case-link\" data-case=\"12\">⚖ הגנה מן הצדק</button></div>\n      <button class=\"expand-link\" data-topic=\"double-jeopardy-justice\">🔎 קריאה מורחבת</button>\n    <div class=\"callout\"><span class=\"callout-title\">חריג לסיכון כפול</span><p>כאשר המעשה גרם למות אדם לאחר הדיון הראשון, ניתן להעמיד לדין פעם נוספת בשל אותו מעשה אם בדיון הראשון נמצא הנאשם אשם, לרבות העמדה למבחן ללא הרשעה.</p></div><h3>הבחנות נוספות</h3><p>\"סיכון כפול\" שונה מטענת \"כבר נשפטתי\" לפי סעיף 5: הראשונה עוסקת בחשיפה חוזרת לסיכון הרשעה כאשר ההליך הקודם לא הסתיים בפסק דין; השנייה מבוססת על מעשה בית דין. הטענה נדירה ואינה חלה כשההליך הקודם בטל מעיקרו, למשל מחוסר סמכות מלכתחילה.</p>","lesson":"6","status":"הורחב ואומת מול מצגת 3","lessons":["6"],"source":"דיון פלילי - מצגת שלישית - 234907.PDF, שקפים 36–70"},{"id":"limitations-pointer","tag":"24","title":"⏳ התיישנות — עיקרי שיעור 7 ולשונית ייעודית","html":"<div class=\"eyebrow\">טענה מקדמית — סעיף 149(6)</div><h2>התיישנות: תזכורת ממוקדת</h2><p>בשיעור 7 חזר המרצה על התיישנות העבירה: חטא — שנה; עוון — חמש שנים; ופשע רגיל — עשר שנים. בפשע חמור נדרשים <b>שני תנאים מצטברים</b>: עונש של יותר משבע שנות מאסר והופעה בתוספת; התקופה היא 15 שנים. עבירות שעונשן מיתה או מאסר עולם מתיישנות לאחר 30 שנים, ולרשימת העבירות המצומצמת שהמרצה מנה אין התיישנות.</p><p>פעולת חקירה, כתב אישום והליך מטעם בית המשפט הם אירועים מנתקים. מנגנון \"התקופה הנוספת\" נוגע, לפי ההסבר בשיעור, לאירוע מנתק מסוג פעולת חקירה בלבד. המרצה הורה <b>לא ללמוד למבחן</b> את טבלת ההארכות ואת נושא התיישנות עבירות המין בקטינים, אף שהם מופיעים במצגת.</p><p>בהתיישנות עונש: הדיון הוא בעונש שלא התחיל להתבצע או שביצועו הופסק שלא באשמת הנידון. בפשע, עוון וחטא ציין המרצה תקופות של 20, 10 ו־3 שנים בהתאמה; זמן התחמקות או שהייה בחו״ל אינו בא במניין בפשע ובעוון.</p><button class=\"case-link\" id=\"open-limitations-btn\">⏳ עבור/י ללשונית ההתיישנות</button><h3>פרטים שנוספו במצגת</h3><p>המצגת מפרטת אירועים ותקופות שאינם מובאים במניין ההתיישנות, לרבות אי־יכולת לאתר חשוד או עד מרכזי, התחמקות, מצב רפואי/נפשי, עזרה משפטית ממדינה אחרת, הליכים שנוקט החשוד, חסינות והתקופה שבה מתקיים הסדר סגירת תיק. בהליכי חקירה, \"התקופה הנוספת\" והארכותיה תלויות בסיווג העבירה ובגורם המאשר; אין להחילן על חטא.</p>","lesson":"7","status":"הורחב ואומת מול מצגת 3","lessons":["7"],"source":"דיון פלילי - מצגת שלישית - 234907.PDF, שקפים 36–70"}]},{"group":"שלב 3: ניהול המשפט וסיומו","items":[{"id":"defendant-response","tag":"25","title":"תשובת הנאשם, הודאה וחזרה ממנה (נלמד בשיעור 6)","html":"\n      <div class=\"eyebrow\">סעיפים 152–154</div>\n      <h2>תשובת הנאשם, הודאה וחזרה ממנה</h2>\n      <p>שתיקה עשויה לשמש חיזוק. טענת אליבי — מייד. חזרה מהודאה ברשות ביהמ\"ש, מנימוקים מיוחדים.</p>\n      <button class=\"expand-link\" data-topic=\"defendant-response\">🔎 קריאה מורחבת</button>\n    <h3>סעיף 152</h3><p>הנאשם רשאי שלא להשיב, להודות, לכפור או להוסיף עובדות. בית המשפט רשאי לשאול שאלות הבהרה שאינן חורגות מהדרוש. הימנעות מתשובה עשויה לשמש חיזוק, ובית המשפט חייב להסביר זאת. טענת אליבי יש להעלות מיד; איחור מגביל הבאת ראיות אלא ברשות בית המשפט, בלי לגרוע מזכות לחזור מהודאה בנוכחות בזירת העבירה.</p>","lesson":"6","status":"הורחב ואומת מול מצגת 3","lessons":["6"],"source":"דיון פלילי - מצגת שלישית - 234907.PDF, שקפים 36–70"},{"id":"multi-defendants","tag":"26","title":"נאשמים בכתב אישום אחד — סעיף 155","html":"<div class=\"eyebrow\">שיעור 7 · סעיף 155</div><h2>נאשמים בכתב אישום אחד</h2><p>כאשר כמה נאשמים הועמדו לדין <b>באותו כתב אישום</b> וחלקם הודו בעובדות שיש בהן כדי הרשעה, לא ייגזר דינם של מי שהודו לפני שהסתיים בירור משפטם של מי שלא הודו.</p><p>הנימוק שהדגיש המרצה: רק לאחר בירור התמונה המלאה אפשר להעריך את חלקו של כל נאשם בעבירה ואת הענישה המתאימה. אין להשליך מכאן אוטומטית על כתבי אישום נפרדים; אלה מסלולים שונים.</p>","lesson":"7","status":"אומת מול הקלטת שיעור 7","lessons":["7"],"source":"שיעור 7 ערוך.mp3 — דברי המרצה"},{"id":"trial-conduct","tag":"27","title":"ניהול המשפט: תביעה, הגנה והזמה","html":"<div class=\"eyebrow\">שיעור 7 · סעיפים 156–165</div><h2>ניהול המשפט — שלד העבודה</h2><p>המרצה עבר על פרשת התביעה, טענת \"אין להשיב לאשמה\" בסיומה, פרשת ההגנה וראיות ההזמה. סעיף 77(א) הוזכר בהקשר של מניעת הגשת ראיה שלא ניתנה לנאשם הזדמנות לעיין בה.</p><p>אם הנאשם בוחר להעיד בפרשת ההגנה, עדותו נשמעת תחילה. הימנעות מהעיד עשויה לשמש חיזוק לראיות התביעה. ראיות הזמה טעונות רשות ונועדו לסתור טענה שעלתה בהגנה ושלא הייתה צפויה לתביעה מראש; לאחר שהובאו, רשאי הנאשם להביא ראיות לסתור אותן.</p><h3>הערכת מהימנות וחובת הגינות התביעה</h3><p>הערכת מהימנות היא מלאכת בית המשפט: יש לבחון את עדות העד במכלול, את עקביותה, את הסתירות ואת התמיכה החיצונית, בלי להפוך כלל כללי על מהימנות לתחליף להנמקה. לצד זאת, על התביעה לנהל את ההליך בהגינות ולגלות חומר רלוונטי; מחדל דיוני אינו מוביל אוטומטית לתוצאה אחת, אלא נבחן לפי השפעתו על ההגנה ועל הוגנות ההליך.</p><div class=\"callout\"><b>השלמת Audit חקיקה:</b> בהערכת מהימנות ובחובת ההגינות יש לבחון את העדות במכלול ואת השפעת המחדל על ההגנה; אין תוצאה אוטומטית ללא בחינת הפגיעה.</div>","lesson":"7","status":"הורחב מול ניתוח פסק דין מקבוצה C","lessons":["7"],"source":"חאתם פאיז אלמע'ארי נ' התביעה הצבאית.pdf — ניתוח קבוצה C"},{"id":"summations","title":"סיכומים בכתב ובעל־פה (שיעור 8)","lesson":"8","lessons":["8"],"status":"נוסף מתוך ההקלטה ופסקי הדין שנבדקו","source":"שיעור8 ערוך.mp3 — לאחר ראיות מטעם בית המשפט; זכריא נ׳ מדינת ישראל.pdf — רע״פ 11160/03, פסקאות 2–4 והערת השופטת פרוקצ׳יה; פלוני נ׳ מדינת ישראל 5333-11.pdf — רע״פ 5333/11, פסקאות א–ט","html":"<h2>סיכומים: מי מדבר אחרון ובאיזו מתכונת?</h2><p><b>תקציר:</b> בתום הראיות הצדדים מסכמים את התמונה ומסבירים איזו מסקנה יש להסיק. לפי הסבר המרצה על סעיף 169, התובע מסכם תחילה ואחריו הנאשם. יש להבחין בין סדר הטיעון, מתכונתו והסעד כשנטען לפגם.</p>"},{"id":"verdict-sentence","tag":"28","title":"הכרעת הדין וגזר הדין — שיעורים 7–8","html":"<div class=\"eyebrow\">שיעור 8</div><h2>מן הראיות אל פסק הדין</h2><p>לאחר פרשת ההגנה רשאי בית המשפט, אך אינו חייב, להביא ראיות מטעמו. גם לאחר הכרעת הדין הדבר אפשרי רק בנסיבות חריגות מאוד, כשהתגלתה ראיה חדשה שלא הייתה בהישג יד ונדרש הדבר לעשיית צדק ולמניעת עיוות דין.</p><p>בתום הראיות באים הסיכומים: התובע מסכם ראשון והנאשם אחריו; לנאשם שמורה זכות המילה האחרונה. פסק הדין הפלילי בנוי מהכרעת דין ומגזר דין.</p><h3>השלמות משקפים 71–105</h3><p>הודאה בעובדה נחשבת כמוכחת, אלא אם בית המשפט אינו מקבלה או התיר חזרה ממנה בנימוקים מיוחדים. לאחר הכרעת הדין, ביטול ההכרעה נדרש רק אם היא מבוססת על ההודאה. לפי סעיף 155, בכתב אישום משותף ניתן לגזור לפני סיום משפט האחרים רק בנסיבות מיוחדות שיירשמו או כאשר המודה נקרא להעיד ולאחר שנגזר דינו.</p><p>פרשת התביעה לפי סעיפים 156–157 קודמת לטענת אין להשיב לאשמה; פרשת ההגנה לפי 159–164. נאשמים מביאים פתיחה וראיות לפי סדר רישומם, אלא אם בית המשפט הורה אחרת. התביעה אינה חוקרת על הרשעות קודמות אלא בחריגי אופי טוב. ראיות הזמה דורשות רשות; ראיות ההגנה לסתירתן אינן דורשות רשות.</p><p>סעיף 181א קובע הכרעת דין בתוך 30 ימים מהסיכומים, עם אפשרות הארכה מטעמים מיוחדים. זיכוי הוא פסק הדין; מועד הערעור מתחיל ממתן הנימוקים. ניתן לבטל הרשעה לפני גזר דין לפי סעיף 192א, להרשיע בכמה עבירות בלי להעניש יותר מפעם אחת על אותו מעשה, ולצרף תיקים לגזירת עונש כולל. סעיף 185 מסדיר העברה בין שלום למחוזי בעבירה שאינה בסמכות הערכאה.</p>","lesson":"8","status":"הורחב ואומת מול מצגת 3","lessons":["8"],"source":"דיון פלילי - מצגת שלישית - 234907.PDF, שקפים 36–70"},{"id":"sentencing","tag":"29","title":"קביעת העונש (נלמד בשיעור 8)","html":"\n      <div class=\"eyebrow\">40ב–40טו לחוק העונשין</div>\n      <h2>קביעת העונש</h2><div class=\"callout case-callout\"><span class=\"callout-title\">קשור לפסק דין</span><button class=\"case-link\" data-case=\"47\">⚖ עמי פופר נגד מדינת ישראל</button></div><div class=\"callout case-callout\"><span class=\"callout-title\">קשור לפסק דין</span><button class=\"case-link\" data-case=\"50\">⚖ שלום ימיני נגד מדינת ישראל</button></div><div class=\"callout case-callout\"><span class=\"callout-title\">קשור לפסק דין</span><button class=\"case-link\" data-case=\"51\">⚖ פלוני נגד מדינת ישראל (תיקי מב\"ד בתסקיר)</button></div>\n      <p>3 שלבים: מתחם עונש הולם → חריגה (קולא/חומרא) → עונש סופי בתוך המתחם.</p>\n      <div class=\"callout case-callout\"><span class=\"callout-title\">קשור לפסק דין</span><button class=\"case-link\" data-case=\"18\">⚖ תיקי מב\"ד</button></div>\n      <button class=\"expand-link\" data-topic=\"sentencing\">🔎 קריאה מורחבת</button>\n    <h3>השלמות משקפים 106–136</h3><p>בשלב הטיעונים לעונש התביעה מביאה הרשעות קודמות והחלטות על ביצוע עבירות, והנאשם רשאי להביא ראיות להקלה שאינן סותרות את גרסתו בשלב האשמה. תיקים הממתינים לבירור דין אינם ראיה בשלב בירור האשמה, אך שירות המבחן רשאי להתייחס אליהם בתסקיר. הענישה נעשית בשלושה שלבים: מתחם הולם, חריגה לשיקום או להגנת שלום הציבור בתנאים שנלמדו, וקביעת העונש בתוך המתחם; נסיבה מחמירה טעונה הוכחה מעבר לספק סביר ומקלה ברמת הוכחה אזרחית.</p><div class=\"callout\" style=\"background:#fff;border:1px solid #dce2e6\"><div class=\"eyebrow\">תרשים זרימה</div>\n<h3>שלושת שלבי קביעת העונש — סעיפים 40ב–40טו</h3>\n<svg viewBox=\"0 0 920 430\" role=\"img\" aria-label=\"תרשים שלושת שלבי קביעת העונש: מתחם עונש הולם, בחינת חריגה, וקביעת העונש הסופי\" style=\"width:100%;height:auto;max-width:820px;display:block;margin:0 auto;font-family:Assistant,Arial,sans-serif\" xmlns=\"http://www.w3.org/2000/svg\">\n  <defs>\n    <marker id=\"ah5\" markerWidth=\"8\" markerHeight=\"8\" refX=\"4\" refY=\"4\" orient=\"auto\">\n      <path d=\"M0,0 L8,4 L0,8 Z\" fill=\"#142641\"/>\n    </marker>\n  </defs>\n\n  <rect x=\"30\" y=\"20\" width=\"260\" height=\"100\" rx=\"10\" fill=\"#142641\"/>\n  <text x=\"160\" y=\"52\" text-anchor=\"middle\" fill=\"#faf8f3\" font-size=\"15\" font-weight=\"700\">שלב 1</text>\n  <text x=\"160\" y=\"76\" text-anchor=\"middle\" fill=\"#faf8f3\" font-size=\"13.5\">קביעת מתחם</text>\n  <text x=\"160\" y=\"96\" text-anchor=\"middle\" fill=\"#faf8f3\" font-size=\"13.5\">העונש ההולם</text>\n\n  <line x1=\"290\" y1=\"70\" x2=\"330\" y2=\"70\" stroke=\"#142641\" stroke-width=\"2\" marker-end=\"url(#ah5)\"/>\n\n  <rect x=\"330\" y=\"20\" width=\"260\" height=\"100\" rx=\"10\" fill=\"#142641\"/>\n  <text x=\"460\" y=\"52\" text-anchor=\"middle\" fill=\"#faf8f3\" font-size=\"15\" font-weight=\"700\">שלב 2</text>\n  <text x=\"460\" y=\"76\" text-anchor=\"middle\" fill=\"#faf8f3\" font-size=\"13.5\">בחינת חריגה</text>\n  <text x=\"460\" y=\"96\" text-anchor=\"middle\" fill=\"#faf8f3\" font-size=\"13.5\">(לקולא או לחומרא)</text>\n\n  <line x1=\"590\" y1=\"70\" x2=\"630\" y2=\"70\" stroke=\"#142641\" stroke-width=\"2\" marker-end=\"url(#ah5)\"/>\n\n  <rect x=\"630\" y=\"20\" width=\"260\" height=\"100\" rx=\"10\" fill=\"#142641\"/>\n  <text x=\"760\" y=\"52\" text-anchor=\"middle\" fill=\"#faf8f3\" font-size=\"15\" font-weight=\"700\">שלב 3</text>\n  <text x=\"760\" y=\"76\" text-anchor=\"middle\" fill=\"#faf8f3\" font-size=\"13.5\">קביעת העונש הסופי</text>\n  <text x=\"760\" y=\"96\" text-anchor=\"middle\" fill=\"#faf8f3\" font-size=\"13.5\">בתוך המתחם</text>\n\n  <line x1=\"160\" y1=\"120\" x2=\"160\" y2=\"150\" stroke=\"#a98543\" stroke-width=\"2\" marker-end=\"url(#ah5)\"/>\n  <line x1=\"460\" y1=\"120\" x2=\"460\" y2=\"150\" stroke=\"#a98543\" stroke-width=\"2\" marker-end=\"url(#ah5)\"/>\n  <line x1=\"760\" y1=\"120\" x2=\"760\" y2=\"150\" stroke=\"#a98543\" stroke-width=\"2\" marker-end=\"url(#ah5)\"/>\n\n  <rect x=\"30\" y=\"152\" width=\"260\" height=\"80\" rx=\"8\" fill=\"#edf4f1\" stroke=\"#457462\" stroke-width=\"1.5\"/>\n  <text x=\"160\" y=\"176\" text-anchor=\"middle\" fill=\"#202a37\" font-size=\"12\" font-weight=\"700\">נקבע לפי חומרת</text>\n  <text x=\"160\" y=\"194\" text-anchor=\"middle\" fill=\"#202a37\" font-size=\"12\" font-weight=\"700\">המעשה ומדיניות הענישה</text>\n  <text x=\"160\" y=\"216\" text-anchor=\"middle\" fill=\"#607083\" font-size=\"10.5\">(לא תלוי בנסיבות אישיות)</text>\n\n  <rect x=\"330\" y=\"152\" width=\"260\" height=\"80\" rx=\"8\" fill=\"#edf4f1\" stroke=\"#457462\" stroke-width=\"1.5\"/>\n  <text x=\"460\" y=\"176\" text-anchor=\"middle\" fill=\"#202a37\" font-size=\"12\" font-weight=\"700\">נסיבה מחמירה:</text>\n  <text x=\"460\" y=\"194\" text-anchor=\"middle\" fill=\"#c0392b\" font-size=\"12\" font-weight=\"700\">מעבר לספק סביר</text>\n  <text x=\"460\" y=\"214\" text-anchor=\"middle\" fill=\"#202a37\" font-size=\"12\" font-weight=\"700\">נסיבה מקלה: מאזן הסתברויות</text>\n\n  <rect x=\"630\" y=\"152\" width=\"260\" height=\"80\" rx=\"8\" fill=\"#edf4f1\" stroke=\"#457462\" stroke-width=\"1.5\"/>\n  <text x=\"760\" y=\"176\" text-anchor=\"middle\" fill=\"#202a37\" font-size=\"12\" font-weight=\"700\">נסיבות אישיות</text>\n  <text x=\"760\" y=\"194\" text-anchor=\"middle\" fill=\"#202a37\" font-size=\"12\" font-weight=\"700\">של הנאשם (שיקום,</text>\n  <text x=\"760\" y=\"214\" text-anchor=\"middle\" fill=\"#202a37\" font-size=\"12\" font-weight=\"700\">עבר, נסיבות חיים)</text>\n\n  <rect x=\"60\" y=\"270\" width=\"800\" height=\"130\" rx=\"10\" fill=\"#faf8f3\" stroke=\"#a98543\" stroke-width=\"1.5\"/>\n  <text x=\"460\" y=\"298\" text-anchor=\"middle\" fill=\"#202a37\" font-size=\"13.5\" font-weight=\"700\">שלב הטיעונים לעונש</text>\n  <text x=\"460\" y=\"322\" text-anchor=\"middle\" fill=\"#607083\" font-size=\"12\">התביעה מביאה הרשעות קודמות; הנאשם רשאי להביא ראיות להקלה</text>\n  <text x=\"460\" y=\"344\" text-anchor=\"middle\" fill=\"#607083\" font-size=\"12\">שאינן סותרות את גרסתו בשלב האשמה</text>\n  <text x=\"460\" y=\"368\" text-anchor=\"middle\" fill=\"#607083\" font-size=\"12\">תיקים תלויים ועומדים (מב\"ד) אינם ראיה לאשמה, אך שירות המבחן</text>\n  <text x=\"460\" y=\"388\" text-anchor=\"middle\" fill=\"#607083\" font-size=\"12\">רשאי להתייחס אליהם בזהירות בתסקיר</text>\n</svg></div>","lesson":"8","status":"הורחב ואומת מול מצגת 3","source":"דיון פלילי - מצגת שלישית - 234907.PDF, שקפים 106–136","lessons":["8"]},{"id":"appeals","tag":"30","title":"ערעור: זכות, מסלולים ומועדים (נלמד בשיעור 8)","html":"\n      <div class=\"eyebrow\">סעיפים 199–217</div>\n      <h2>ערעור: זכות, מסלולים ומועדים</h2><div class=\"callout case-callout\"><span class=\"callout-title\">קשור לפסק דין</span><button class=\"case-link\" data-case=\"40\">⚖ אריק ניסנוב נגד מדינת ישראל</button></div><div class=\"callout case-callout\"><span class=\"callout-title\">קשור לפסק דין</span><button class=\"case-link\" data-case=\"41\">⚖ סלימאן זכריא נגד מדינת ישראל</button></div><div class=\"callout case-callout\"><span class=\"callout-title\">קשור לפסק דין</span><button class=\"case-link\" data-case=\"44\">⚖ מאהר גבארה נגד מדינת ישראל</button></div><div class=\"callout case-callout\"><span class=\"callout-title\">קשור לפסק דין</span><button class=\"case-link\" data-case=\"45\">⚖ פלוני נגד בית משפט השלום חיפה ומדינת ישראל</button></div><div class=\"callout case-callout\"><span class=\"callout-title\">קשור לפסק דין</span><button class=\"case-link\" data-case=\"47\">⚖ עמי פופר נגד מדינת ישראל</button></div>\n      <p>לא ניתן לערער על החלטות ביניים (מלבד חריגים). מועדים: 45 יום (בזכות), 45+30 (ברשות).</p>\n      <div class=\"callout case-callout\"><span class=\"callout-title\">קשור לפסקי דין</span><button class=\"case-link\" data-case=\"11\">⚖ פלדמן</button> <button class=\"case-link\" data-case=\"20\">⚖ צ'ירנסקי</button> <button class=\"case-link\" data-case=\"22\">⚖ חילף</button></div>\n      <button class=\"expand-link\" data-topic=\"appeals\">🔎 קריאה מורחבת</button>\n    <h3>השלמות משקפים 106–136</h3><p>הכלל הוא שאין ערעור על החלטות ביניים אלא בהוראה מפורשת; חריגים שנלמדו כוללים פסלות, פומביות, עיון בחומר, עיכוב ביצוע וערעור עצמאי של סנגור על אי־שחרורו מייצוג. בקשת רשות לערעור שני דורשת שאלה משפטית בעלת חשיבות ציבורית או מקרה חריג בחומרת העונש. ערעור בזכות מוגש בתוך 45 ימים; בקשת רשות בתוך 45 ימים והערעור בתוך 30 ימים ממועד הרשות. חזרה מערעור לאחר סיום הטענות טעונה רשות. בערעור אין להחמיר בעונש ללא ערעור מדינה.</p>","lesson":"8","status":"הורחב ואומת מול מצגת 3","source":"דיון פלילי - מצגת שלישית - 234907.PDF, שקפים 106–136","lessons":["8"]}]}];
const CASES = [{"name":"פרדריק וילאם סילוסטר נגד היועץ המשפטי לממשלה","cite":"ע\"פ 1/48 (1948) — התיק הפלילי הראשון בעליון","facts":"פסק הדין הפלילי הראשון של בית המשפט העליון (1948). סילוסטר, אזרח בריטי שעבד בחברת החשמל בירושלים בזמן מלחמת העצמאות, הואשם בריגול ובמסירת ידיעות לאויב. המחוזי הרשיע וגזר 7 שנות מאסר. בכתב האישום נפלו פגמים טכניים בניסוח הסעיפים והעובדות, והסנגוריה ביקשה לבסס על כך את הערעור.","claimant":"פגמים פרוצדורליים וטכניים בכתב האישום יורדים לשורש ההליך ומחייבים את ביטול כתב האישום וזיכוי הנאשם, גם אם העובדות המהותיות הוכחו.","respondent":"מדובר בפגמים צורניים קלים וניתנים לתיקון, שלא פגעו כלל ביכולתו של הנאשם להבין את האישום ולהתגונן מפניו.","question":"מהי נפקותם של פגמים וליקויים בכתב אישום — האם כל פגם דיוני מביא אוטומטית לבטלות ההליך, ומתי פגם יוביל לביטולו או לזיכוי הנאשם?","ruling":"הפגמים בכתב האישום נקבעו כפגמים טכניים שניתנים לתיקון ושלא קיפחו את הגנת סילוסטר; בית המשפט תיקן אותם והרשעתו נותרה על כנה (בכפוף לזיכוי מספק בעניינים עובדתיים אחרים).","currency":"לא אומת עדכון מעבר למקורות הקורס","reasoning":"השופט זמורה קבע את מבחן הפגיעה המהותית בהגנה: (א) יש להבחין בין פגם טכני/פרוצדורלי הניתן לתיקון, לבין פגם מהותי היורד לשורש העניין ומקפח את הגנת הנאשם. (ב) הדיון הפלילי אינו \"משחק שחמט\" שבו כל מהלך מוטעה מכריע את התוצאה — המבחן הוא תמיד השפעת הפגם על ההגנה בפועל. (ג) המטרה העליונה היא חשיפת האמת ואיזון בין זכויות הנאשם להגנת הציבור, לא שמירה טכנית על כללי הדיון כשלעצמם.","halacha":"פגם או ליקוי צורני בכתב אישום אינו מביא לביטולו האוטומטי של ההליך, אלא רק אם בית המשפט משתכנע שהפגם קיפח בפועל את הגנת הנאשם או מנע ממנו להתגונן כראוי. עוגן מאוחר יותר בסעיף 215 לחוק סדר הדין הפלילי.<p><b>השלמת A2: יש להבחין בין עצם קיומו של פגם דיוני לבין תוצאה של עיוות דין — אין להסיק ביטול אוטומטי מפגם שלא פגע בהגנה; הסעד תלוי בהשפעה הממשית ובהגינות ההליך.</b></p>","exam":"בקייס שבו נטענת טענת פגם בכתב אישום (טעות סופר, סעיף שגוי, תאריך שגוי וכד') — יש ליישם את מבחן הפגיעה המהותית של הלכת סילוסטר ולבחון האם הפגם קיפח בפועל את ההגנה, לפני שקובעים בטלות."},{"name":"יצחק קניר נגד מדינת ישראל","cite":"ע\"פ 951/80 (1980) — מפי השופט אהרן ברק","facts":"לאחר שהצדדים סיימו להביא ראיות והמשפט הגיע לסיכומים, ביקשה התביעה להגיש ראיה נוספת. בית המשפט התיר זאת.","claimant":"סעיף 167 מתיר הבאת ראיות ביוזמת בית המשפט רק בין תום הראיות לתחילת הסיכומים — לא בשלב הסיכומים עצמו.","respondent":"חשיפת האמת ומניעת עיוות דין גוברות על סדר הבאת הראיות הפורמלי.","question":"האם לבית המשפט סמכות להתיר ראיות חדשות בשלבים מאוחרים, כגון הסיכומים?","ruling":"הערעור נדחה — המשפט הפלילי אינו תחרות ספורטיבית שבה הכללים קדושים יותר מחקר האמת.","halacha":"לבית המשפט סמכות טבועה ושיקול דעת רחב לסטות מסדר הראיות הרגיל ולהתיר ראיות גם בשלבים מאוחרים ביותר — ואף בערעור — ובלבד שנועד למניעת עיוות דין ותוך מתן הזדמנות הוגנת לנאשם להתמודד עם הראיה.","currency":"לא אומת עדכון מעבר למקורות הקורס"},{"name":"אברהם בן חיים נגד מדינת ישראל","cite":"רע״פ 10141/09, בצירוף רע״פ 617/10 ורע״פ 5758/10 (6.3.2012)","facts":"שוטרים שסיירו ברחוב פנו לאברהם בן חיים ולאדם נוסף, שאלו אותם לפשר מעשיהם וביקשו לערוך חיפוש בבגדיהם ובכיסיהם — בלי שהיה לשוטרים חשד סביר מוקדם שהם מחזיקים בחפץ אסור. השניים לא התנגדו ואפשרו את החיפוש; בכיסיו של בן חיים נמצאה סכין, והוא הועמד לדין והורשע בהחזקתה שלא כדין.","claimant":"החיפוש היה בלתי חוקי מיסודו משום שלא התקיים חשד סביר מוקדם כנדרש בפקודת המעצר והחיפוש. ההסכמה הנטענת לא הייתה הסכמה חופשית — אזרח שפונה אליו שוטר ברחוב אינו יודע שהוא זכאי לסרב, ופועל מתוך הכנעה לסמכות.","respondent":"החיפוש חוקי מכוח הסכמת האזרח: משלא התנגד בן חיים ואף שיתף פעולה עם בקשת השוטר, נערך החיפוש בהסכמה מרצון ואינו טעון חשד סביר.","question":"האם הסכמת אזרח לחיפוש על גופו, בהיעדר חשד סביר, מכשירה את החיפוש, ואילו תנאים נדרשים כדי שההסכמה תיחשב ל\"הסכמה מדעת\" תקפה?","ruling":"מאחר שהשוטרים לא מסרו לבן חיים את ההסבר הכפול מראש, הסכמתו הפסיבית לא נחשבה ל\"הסכמה מדעת\". החיפוש נקבע כבלתי חוקי, הסכין נפסלה כראיה לפי הלכת יששכרוב, ובן חיים זוכה.","halacha":"חיפוש על גופו של אדם בהיעדר חשד סביר חוקי רק אם קדמה לו \"הסכמה מדעת\" — הסכמה המותנית בהסבר מפורש מצד השוטר שהאזרח רשאי לסרב וכי סירובו לא ייזקף לחובתו.","currency":"מוצגת ההכרעה במקור שבמחברת. לא אומתו שינויים מאוחרים מחוץ למקורות הקורס.","reasoning":"הנשיאה ביניש קבעה את מבחן ההסבר הכפול: (א) ככלל, חיפוש על גופו של אדם ללא צו שיפוטי מותנה בקיומו של חשד סביר אובייקטיבי. (ב) בהיעדר חשד סביר, מותר לבצע חיפוש רק מכוח \"הסכמה מדעת\" של האזרח. (ג) כדי שההסכמה תיחשב חופשית ומנוטרלת מפערי הכוחות בין שוטר לאזרח, על השוטר להבהיר לו מפורשות: (1) שעומדת לו הזכות לסרב לחיפוש; וכן (2) שסירובו לא ייזקף לחובתו ולא ייחשב כחשד סביר נגדו.","dissent":"פה אחד, ללא דעת מיעוט.","exam":"אם בשאלה שוטר ניגש לאדם ברחוב ללא חשד סביר ומבקש לבדוק את תיקו/כיסיו והאדם \"לא התנגד\"/\"הסכים\" בשתיקה — יש לקבוע שהחיפוש בלתי חוקי, אלא אם נמסר לו במפורש ההסבר הכפול. שימוש בעצם הסירוב כבסיס לחשד סביר אסור בהחלט.","source":"אברהם בן חיים נ׳ מדינת ישראל.pdf — רע״פ 10141/09, פסקאות 3–5, 13, 31–35 וההכרעה הסופית"},{"name":"ג'ון איוון דמיאניוק נגד מדינת ישראל","cite":"ע\"פ 347/88 (1988)","facts":"דמיאניוק הואשם בהיותו \"איוון האיום\" מטרבלינקה והורשע במחוזי למוות. בערעור התעורר ספק בזיהוי, אך הוכח כי שירת כשומר נאצי בסוביבור. התביעה ביקשה להרשיעו בכך מכוח סעיף 184.","claimant":"כל אסטרטגיית ההגנה נועדה להפריך זיהוי כאיוון האיום; אילו הואשם בסוביבור, קו ההגנה היה שונה לגמרי.","respondent":"העובדות שהוכחו מבססות שירות כשומר נאצי, ולכן ניתן להרשיע מכוח סעיף 184.","question":"האם ניתן, בערעור, להרשיע בעבירה שונה לחלוטין מזו שבכתב האישום כשההגנה התמקדה בזיהוי ספציפי?","ruling":"זיכוי מלא — הזכות להזדמנות סבירה להתגונן היא זכות מהותית ודינמית, ולא פורמלית.","halacha":"תנאי בלעדי להפעלת סעיף 184: הזדמנות סבירה וממשית להתגונן מפני העבירה ה'חדשה'. כשקו ההגנה היה משתנה מהותית אילו ידע הנאשם מראש — לא ניתן להרשיעו בעבירה האחרת.","currency":"לא אומת עדכון מעבר למקורות הקורס"},{"name":"צדוק נגד ראש אגף חקירות ומודיעין","cite":"בג\"ץ 1113/07 (2007)","facts":"אזרח הגיש למשטרה תלונה המייחסת לאנשים שונים עבירות פליליות חמורות מסוג פשע. התלונה הייתה מופרכת ותמהונית, נעדרת כל אחיזה במציאות או תשתית ראייתית מינימלית. קצין המשטרה החליט לסגור את התיק בלי לפתוח בחקירה, והמתלונן עתר לבג\"ץ בטענה שסעיף 59 לחוק סדר הדין הפלילי מחייב חקירה בכל תלונת פשע.","claimant":"סעיף 59 לחסד\"פ קובע בלשון ציווי כי משנודע למשטרה על ביצוע עבירה עליה לפתוח בחקירה; שיקול הדעת שלא לחקור נתון לקצין משטרה רק לגבי עבירות שאינן פשע (חטא ועוון). לכן בתלונת פשע אין למשטרה שיקול דעת שלא לחקור.","respondent":"אין לחייב את המשטרה לבזבז משאבי חקירה יקרים על תלונות סרק הזויות ותמהוניות הנעדרות כל תשתית עובדתית מינימלית, גם אם המתלונן הדביק להן כותרת של עבירת פשע.","question":"האם המשטרה מחויבת לפתוח בחקירה בכל תלונה על עבירת פשע, או שמא מוסמכת להימנע מכך כשהתלונה נעדרת תשתית ראייתית מינימלית?","ruling":"העתירה נדחתה — סגירת תלונת הפשע על ידי קצין המשטרה הייתה מוצדקת בנסיבות העניין.","halacha":"בהיעדר תשתית ראייתית מינימלית לביצוע העבירה, מוסמכת המשטרה להימנע מפתיחת חקירה גם כאשר מדובר בתלונה על עבירת פשע — זהו חריג צר לכלל שלפיו חובה על המשטרה לחקור כל תלונת פשע.","currency":"לא אומת עדכון מעבר למקורות הקורס","reasoning":"בג\"ץ קבע חריג צר: (א) ככלל, בעבירת פשע המשטרה מחויבת לפתוח בחקירה, והסמכות לסגור תיק נתונה לתביעה/לפרקליטות ולא למשטרה עצמה. (ב) חריג תלונת סרק: כאשר תלונה על פשע נעדרת על פניה תשתית ראייתית או עובדתית מינימלית (תלונה מופרכת, הזויה או תמהונית), מוסמך קצין המשטרה עצמו להימנע מפתיחת חקירה בלי להעביר את התיק לפרקליטות.","exam":"אם בשאלה מוגשת תלונת פשע הזויה שאין לה כל אחיזה עובדתית (למשל טענת סרק מוכחשת על פניה) וקצין המשטרה סגר את התיק בעצמו — הסגירה חוקית מכוח חריג הלכת צדוק. שים לב: בתלונת פשע רגילה שיש בה תשתית עובדתית מסוימת, קצין משטרה אינו מוסמך לסגור בעצמו — חובה להעביר לפרקליטות."},{"name":"שמואל נגד היועץ המשפטי לממשלה","cite":"בג\"ץ 4388/08 (2008)","facts":"שמואל קיבל מכתב יידוע. עורך דינו דרש את טיוטת כתב האישום וכל חומרי החקירה כדי לערוך שימוע אפקטיבי. התביעה סירבה.","claimant":"לא ניתן לקיים שימוע הוגן כשהחשוד מגשש באפלה, ללא ידיעת הראיות נגדו.","respondent":"זכות העיון המלאה (סעיף 74) קמה רק לאחר הגשת כתב אישום, כשהחשוד הופך לנאשם.","question":"האם זכות השימוע כוללת עיון בחומרי החקירה המלאים או בטיוטת כתב האישום, לפני הגשתו בפועל?","ruling":"העתירה נדחתה — אין לחשוד זכות עיון מלא בשלב השימוע.","halacha":"זכות העיון המלאה שמורה לנאשם לאחר הגשת כתב אישום בלבד. עם זאת, כדי שהשימוע לא יהיה טקס ריק, על התביעה למסור לחשוד את עיקרי העובדות והחשדות המתגבשים נגדו.","currency":"לא אומת עדכון מעבר למקורות הקורס"},{"name":"אפרים נוה נגד מדינת ישראל","cite":"בג\"ץ 4922/19 (2019) — מפי השופט יצחק עמית","facts":"אפרים נוה, יו\"ר לשכת עורכי הדין לשעבר, הועמד לדין פלילי וטען כי עומדת לו טענת \"הגנה מן הצדק\" בשל אכיפה בררנית — אכיפה מפלה ביחס למקרים דומים אחרים. כדי להוכיח את הטענה ביקש נוה לקבל תיקים וחומרי חקירה של חשודים/נאשמים אחרים, והגיש בקשת גילוי חומר חקירה מכוח סעיף 74 לחוק סדר הדין הפלילי.","claimant":"גילוי המידע והתיקים של אחרים דרוש כדי לבסס את טענת האכיפה הבררנית, ולכן יש לאפשר את הגילוי במסגרת סעיף 74, שמקנה לנאשם זכות עיון רחבה בחומר החקירה הרלוונטי לתיקו.","respondent":"תיקים של נאשמים אחרים אינם \"חומר חקירה\" בתיקו של נוה, ומתן גילוי גורף כזה עלול לפגוע בפרטיות צדדים שלישיים ובאינטרסים ציבוריים אחרים.","question":"האם בקשה לקבלת מידע ותיקים של אחרים לצורך ביסוס טענת אכיפה בררנית (הגנה מן הצדק) נדונה במסלול \"חומר חקירה\" של סעיף 74 לחסד\"פ, או שמא במסלול אחר?","ruling":"עתירתו של נוה לקבלת החומרים מכוח סעיף 74 נדחתה — אין זה המסלול הדיוני הנכון לטענתו.","halacha":"מידע ותיקים של אחרים המבוקשים כדי להוכיח אכיפה בררנית אינם \"חומר חקירה\" לפי סעיף 74 לחסד\"פ; יש לבקשם לפי סעיף 108 לחסד\"פ, במסגרת טענת הגנה מן הצדק לפי סעיף 149(10), ובכפוף להנחת תשתית ראייתית ראשונית לאכיפה הבררנית הנטענת.","currency":"לא אומת עדכון מעבר למקורות הקורס","reasoning":"השופט עמית קבע מבחן להפרדת מסלולי הגילוי: (א) סעיף 74 לחסד\"פ מיועד אך ורק ל\"חומר חקירה\" הנוגע ישירות לאישום ולראיות המבססות את אשמת הנאשם באותו תיק ספציפי — תיקים של נאשמים אחרים אינם בגדר כך. (ב) בקשה לקבלת מידע להוכחת אכיפה בררנית תידון לפי סעיף 108 לחסד\"פ (הזמנת מסמכים), במסגרת טענה מקדמית של הגנה מן הצדק לפי סעיף 149(10). (ג) על הנאשם להניח תחילה תשתית ראייתית ראשונית לקיומה של אכיפה בררנית, בטרם יחויבו רשויות האכיפה למסור נתונים משווים לפי סעיף 108.","exam":"כאשר בקייס נטענת אכיפה בררנית והנאשם מבקש \"לראות תיקים של אחרים\" — יש להפנות אותו למסלול הנכון (סעיף 108 + טענה מקדמית לפי 149(10)), ולא לטעות ולנתח זאת כבקשת גילוי חומר חקירה רגילה לפי סעיף 74."},{"name":"מנחם קנזי נגד מדינת ישראל","cite":"ע\"פ 194/75 (1975)","facts":"קנזי וביטון הועמדו לדין נפרד בגין פריצה וגניבה. התביעה זימנה את ביטון להעיד נגד קנזי, בעוד משפטו של ביטון עצמו עדיין תלוי ועומד.","claimant":"לשותף שמשפטו תלוי ועומד אינטרס כבד לשקר ולהחמיר, כדי לזכות בהקלות בעונשו שלו.","respondent":"כל אדם כשר להעיד; החשש מפני שקר משפיע על המשקל בלבד, לא על הקבילות.","question":"האם שותף שמשפטו תלוי ועומד כשר להעיד נגד שותפו?","ruling":"הערעור התקבל — נקבע איסור על העדת שותף כזה.","halacha":"זהו הכלל ההיסטורי. אין ליישמו כיום ככלל חוסם במשפטים נפרדים בלי להתייחס לבג״ץ 11339/05, שביטל את החסם הגורף והותיר חריג מצומצם. ראו את הניתוח המקושר בנושא עדות שותפים.<p><b>השלמת A2: אין להחיל את כלל הסופיות באופן מכני. יש לזהות את סוג המחדל, את הפגיעה בהגינות ואת הסעד המתאים, בלי לקבוע חריג שלא נתמך בחומר הקורס.</b></p>","currency":"לא אומת עדכון מעבר למקורות הקורס","source":"מדינת ישראל נ׳ בית המשפט המחוזי באר שבע 11339-05.pdf — ההכרעה הסופית ודעת הנשיאה ביניש, פסקה 3"},{"name":"רע\"פ סלימאן זכריא נגד מדינת ישראל","cite":"רע״פ 11160/03 (3.11.2004)","facts":"זכריא הועמד לדין על תקיפה הגורמת חבלה ממשית ואיומים, זוכה מעבירות אלה והורשע בתקיפה לפי סעיף 379. בערעור התייצבו הצדדים, וסנגורו הודיע שהוא מסתפק בהודעת הערעור. המדינה הגישה תשובה בכתב בהסכמתו. לאחר מכן ביקש דיון נוסף בעל־פה; בקשתו והערעור נדחו.","claimant":"המבקש טען שנפגעה זכותו לטעון בעל־פה וכי בית המשפט כפה עליו מסלול כתוב. הוא נימק את בקשת הדיון הנוסף בכך שתשובת המדינה לא כללה מענה משפטי מספק.","respondent":"המקור אינו מפרט בנפרד את מלוא טענות המדינה בפני העליון. מתואר כי בערעור ביקשה להשיב בכתב, ללא התנגדות הסנגור.","question":"מה מקומו של טיעון בעל־פה בערעור פלילי, והאם בנסיבות אלה נמנעה מהמבקש האפשרות לטעון?","ruling":"בקשת רשות הערעור נדחתה. בנסיבות שתועדו לא הוכח פגם בהליך המצדיק התערבות.","halacha":"אין ללמוד מההחלטה היתר גורף להחלפת הטיעון בערעור פלילי בכתב בלבד. יש להבחין בין שלילת הזכות לטעון לבין בחירה של בעל דין שהופיע להסתפק בטיעון כתוב.","currency":"לצד ההחלטה יש ללמוד את הדיון המאוחר בפלוני 5333/11 שבמחברת. אין כאן אימות עדכניות חיצוני.","withheld":false,"reasoning":"השופט לוי הדגיש את הדיון בנוכחות הצדדים לפי סעיף 208 ואת תפקיד הכתב כהכנה לטיעון ישיר. אולם בפרוטוקול הופיע שהמבקש עצמו הסתפק בנימוקיו הכתובים; לא נמצאה בו כפייה, ולא התבקש תיקונו. גם האפשרות להגיב לתשובת המדינה ניתנה ולא נוצלה.","dissent":"ברק הסכים ללוי. פרוקצ׳יה הסכימה לתוצאה אך הותירה בצריך עיון את השאלה אם הסכמה מוקדמת למסלול כתוב בלבד, ללא פגיעה או עיוות דין, יכולה להכשירו מכוח תום לב ומניעות.","exam":"בדקו מה קרה בדיון ומה רשום בפרוטוקול. אין להסיק מבקשה מאוחרת לדיון שהזכות נשללה מלכתחילה. השוו לפלוני 5333/11.","source":"זכריא נ׳ מדינת ישראל.pdf — רע״פ 11160/03, פסקאות 2–4 והערת השופטת פרוקצ׳יה"},{"name":"פלוני נגד מדינת ישראל","cite":"רע״פ 5333/11 (20.7.2011)","facts":"בעל מסעדה הורשע בהשמטת הכנסות של כשני מיליון ש״ח מדוחות המס. הסיכומים הוגשו בכתב בהסכמת סנגורו. לאחר שערעורו למחוזי נדחה, ביקש רשות ערעור וטען בין היתר שהיעדר סיכומים בעל־פה פגע בהליך ההוגן.","claimant":"המבקש טען כי יש לבטל את ההליך ולהחזירו לשופט אחר משום שלא נשמעו סיכומים בעל־פה; כן חלק על התשתית החשבונאית להרשעה.","respondent":"ההחלטה אינה מפרטת בנפרד את טענות המדינה בבקשת הרשות. אין לייחס לה טענות משוערות; מובאים כאן נימוקי בית המשפט.","question":"האם הגשת סיכומים בכתב בהסכמת הצדדים, ללא סיכומים בעל־פה, מחייבת ביטול ההליך?","ruling":"בקשת רשות הערעור נדחתה. לא נמצא פגם המצדיק ביטול ההליך; הבקשה לעיכוב ביצוע התייתרה.","halacha":"אין לבטל אוטומטית פסק דין רק משום שהסיכומים הוגשו בכתב בהסכמה. יש להבחין בין דרך המלך של טיעון בעל־פה לבין תוצאת הסטייה ממנה, ולבחון הסכמה ופגיעה בפועל בהגנה.","currency":"ההחלטה מוצגת לפי מקור המחברת; לא אומתה התפתחות מאוחרת מעבר למקורותיה.","withheld":false,"reasoning":"רובינשטיין הדגיש שטיעון בעל־פה הוא דרך המלך, אך הפסיקה והנוהג מאפשרים סיכומים בכתב בהסכמה. גם לשון סעיף 181א, המזכירה שמיעת סיכומים או הגשתם, מכירה בפרקטיקה. בעניינו של המבקש ניתנה הסכמה ולא הוצבע על נזק או עיוות דין. מורכבות כלכלית וטכנית עשויה אף להקנות יתרון לסיכומים כתובים.","dissent":"החלטה של שופט יחיד — אין דעת רוב ומיעוט.","exam":"זה אינו פסק דין על עדות שותף או על קטין בעבירת מין. השאלות הרלוונטיות הן מתכונת הסיכומים, הסכמת הצדדים ועיוות דין.","source":"פלוני נ׳ מדינת ישראל 5333-11.pdf — רע״פ 5333/11, פסקאות א–ט"},{"name":"סוסן נגד מדינת ישראל","cite":"ע\"פ 866/95 (1995) — הלכת סוסן","facts":"מספר נאשמים הועמדו לדין משותף במחוזי בפרשת מרמה. סוסן טען שכל העבירות המיוחסות לו אישית הן בסמכות בית משפט השלום בלבד.","claimant":"צירוף נאשמים אינו יכול לעקוף את כללי הסמכות העניינית הסטטוטוריים — יש לפצל את התיק.","respondent":"יעילות הדיון ומניעת החלטות סותרות מחייבות שמיעה משותפת תחת בית המשפט הבכיר.","question":"האם המחוזי רוכש סמכות עניינית לדון בנאשם שעבירותיו הן בסמכות השלום, מכוח צירופו לכתב אישום משותף?","ruling":"הערעור נדחה.","halacha":"כשמוקנית למחוזי סמכות עניינית לגבי נאשם אחד בכתב אישום משותף, הוא רוכש סמכות \"נגררת\" לדון גם ביתר הנאשמים — גם אם עבירותיהם הפרטניות בסמכות השלום — כדי למנוע פיצול הליכים.","currency":"לא אומת עדכון מעבר למקורות הקורס"},{"name":"אביגדור פלדמן נגד בית המשפט המחוזי","cite":"ע\"פ 4865/09 (2009) — פרשת משה קצב","facts":"בית המשפט קבע יומן אינטנסיבי של 4 ימי דיון בשבוע. סנגוריו של קצב ביקשו להשתחרר מייצוג עקב עומס עבודה — הבקשה נדחתה, והוגש ערעור עצמאי ומיידי.","claimant":"קצב הדיונים פוגע בהגנה ראויה ובזכויות מקצועיות; יש זכות ערעור מיידית על דחיית בקשת השחרור.","respondent":"החלטת ביניים אינה ניתנת לערעור מיידי; קצב הדיונים תואם את חובת השמיעה הרציפה (סעיף 125).","question":"האם לסנגור זכות ערעור מיידית על דחיית בקשת שחרור מייצוג? והאם עומס עבודה מצדיק פגיעה ברציפות הדיון?","ruling":"הערעור נדחה לגופו, אך התקבלה הטענה המקדמית בדבר זכות הערעור.","halacha":"לסנגור זכות ערעור עצמאית ומיידית על דחיית בקשת שחרור — חריג נדיר לכלל אי־ההתערבות בהחלטות ביניים. סעיף 125 מחייב שמיעת ראיות רציפה יום־יום; עומס עבודה של סנגור אינו טעם מיוחד לפגיעה ברציפות.<p><b>השלמת A2: יש להבחין בין אילוץ דיוני בניהול הייצוג לבין ויתור מדעת על זכות; יעילות הדיון לבדה אינה מוכיחה ויתור.</b></p>","currency":"לא אומת עדכון מעבר למקורות הקורס"},{"name":"מדינת ישראל נגד בורוביץ, נוה, ורותם — הגנה מן הצדק","cite":"ע\"פ 4855/02 בורוביץ; בג\"ץ 4922/19 נוה; דנ\"פ 5387/20 רותם","facts":"שלושה פסקי דין מרכזיים שעיצבו יחד את דוקטרינת ההגנה מן הצדק בישראל — כל אחד עסק במקרה שונה שבו נטען כי הגשת כתב אישום או ניהול ההליך פוגעים באופן מהותי בעקרונות של צדק והגינות משפטית.","claimant":"כאשר התנהלות הרשויות (למשל אכיפה בררנית, שיהוי בלתי סביר, או פגיעה בהליך התקין) חמורה במיוחד, יש לבטל את כתב האישום גם אם לא נפל בו פגם משפטי \"טכני\".","respondent":"הביטול על בסיס הגנה מן הצדק צריך להישמר למקרים חריגים ביותר, שאחרת כל נאשם יטען זאת כדי לחמוק מדין.","question":"מהם התנאים והיקף השימוש בדוקטרינת ההגנה מן הצדק כטענה מקדמית לביטול כתב אישום?","ruling":"בפסיקה גובשה דוקטרינה בעלת מבחן תלת-שלבי (זיהוי הפגם, בחינת האפשרות לרפא אותו באמצעים מתונים יותר, ואיזון האינטרסים) המוחלת במשורה.","halacha":"בית המשפט רשאי לבטל כתב אישום כאשר הגשתו או ניהול ההליך הפלילי עומדים בסתירה מהותית לעקרונות של צדק והגינות משפטית — זוהי טענה מקדמית עצמאית מכוח סעיף 149(7) לחסד\"פ, הנבחנת במשורה ובזהירות.","currency":"לא אומת עדכון מעבר למקורות הקורס"},{"name":"מדינת ישראל נגד יגאל קרישניסקי","cite":"ע\"פ 250/77 (1977)","facts":"נאשם ניסה לטעון טענת \"סיכון כפול\" ביחס להליך קודם שהתנהל נגדו, כשההליך הקודם היה למעשה בטל מעיקרו (בית המשפט לא היה מוסמך לדון בו מלכתחילה).","claimant":"עמד בעבר ב\"סיכון\" של הרשעה באותו עניין, ולכן אין להעמידו לדין פעם נוספת.","respondent":"מכיוון שההליך הקודם היה בטל מעיקרו (חוסר סמכות), הוא לא היה הליך תקף שממנו נובע \"סיכון\" משפטי כלל.","question":"האם ניתן לטעון \"סיכון כפול\" כאשר ההליך הקודם שממנו נטען הסיכון היה בטל מעיקרו?","ruling":"נקבע כי הטענה אינה חלה במצב זה.","halacha":"טענת \"סיכון כפול\" אינה חלה כאשר ההליך הקודם בטל מעיקרו — למשל כשבית המשפט לא היה מוסמך לדון בו מלכתחילה. הליך בטל אינו יוצר \"סיכון\" משפטי מוכר.","currency":"לא אומת עדכון מעבר למקורות הקורס"},{"name":"דרורי נגד מדינת ישראל","cite":"ע\"פ 104/89 (1989)","facts":"בתום פרשת התביעה במשפטו, הגיש הנאשם דרורי טענת \"אין להשיב לאשמה\" (No case to answer) לפי סעיף 158 לחוק סדר הדין הפלילי, בטענה שהתביעה לא הביאה ראיות מספיקות להוכחת אשמתו.","claimant":"חומר הראיות שהוצג על ידי התביעה חלש ורצוף סתירות במידה שאף אדם סביר לא היה מרשיע לפיו; יש לקבל את הטענה ולזכות במקום.","respondent":"התביעה הביאה ראיות ראשוניות המקימות תשתית מספקת להמשך ההליך, ועל ההגנה להשיב לאשמה ולהעמיד את גרסתה שלה.","question":"מהו הרף הראייתי הנדרש כדי לדחות טענת \"אין להשיב לאשמה\" לפי סעיף 158 לחסד\"פ ולהמשיך את המשפט לשלב פרשת ההגנה?","ruling":"טענתו של דרורי נדחתה, משום שהיו קיימות ראיות ראשוניות המקימות תשתית, והוא נדרש להשיב לאשמה בפרשת ההגנה.","halacha":"טענת \"אין להשיב לאשמה\" לפי סעיף 158 לחסד\"פ תתקבל רק בהיעדר מוחלט של ראיות, או כאשר הראיות שהובאו דלות וחסרות משקל ראשוני לחלוטין; רף זה נמוך במתכוון, כדי שלא לסגור הליכים בטרם עת.","currency":"לא אומת עדכון מעבר למקורות הקורס","reasoning":"בית המשפט קבע רף נמוך יחסית לדחיית הטענה: (א) די בכך שהתביעה הביאה ראיות דלות וראשוניות בלבד (prima facie) המקימות תשתית בסיסית לאשמה, כדי לדחות את הטענה ולהעביר את הדיון לפרשת ההגנה. (ב) הטענה תתקבל וייקבע זיכוי מיידי רק כאשר לא הובאה כל ראיה מטעם התביעה, או שהראיות שהובאו כה דלות וחסרות ערך עד שאף אדם סביר לא היה מרשיע על פיהן — בית המשפט אינו שוקל בשלב זה את מהימנות העדים או משקל סופי של הראיות.","exam":"בקייס שבו נשאלת השאלה האם לקבל טענת \"אין להשיב לאשמה\" — אין לבחון מהימנות עדים או משקל סופי; יש לבדוק רק האם קיימת \"תשתית ראייתית ראשונית כלשהי\" — ואם כן, לדחות את הטענה ולהמשיך לפרשת ההגנה."},{"name":"מדינת ישראל נגד בית המשפט המחוזי בבאר שבע","cite":"בג״ץ 11339/05 — הכרעה מיום 8.10.2006","facts":"בפרשה שבה הוגשו כתבי אישום נפרדים, התעוררה השאלה אם התביעה תוכל להעיד שותף שמשפטו שלו עדיין תלוי ועומד. המדינה פנתה נגד החלטת בית המשפט המחוזי בבאר שבע, ודיון בהרכב מורחב בחן מחדש את הלכת קנזי.","claimant":"המדינה ביקשה להסיר את החסם להעדת השותף לפני סיום משפטו הנפרד.","respondent":"במוקד העמדה התומכת בשימור ההגבלה עמד החשש לעדות מוטה של שותף המבקש להיטיב את מצבו ולפגיעה בזכויות. זהו תמצות הסוגיה; אין לייחס לכל משיב טיעון זהה.","question":"האם להמשיך בכלל המעכב העדת שותף כל עוד משפטו הנפרד לא הסתיים, ובאיזה היקף להשאיר שיקול דעת לדחייה?","ruling":"בדעת רוב נקבע שאין מניעה ככלל להעיד עד תביעה הקשור באותה פרשה ומשפטו תלוי ועומד. החלטת המחוזי שבמוקד העתירה בוטלה.","halacha":"במשפטים נפרדים ניתן להעיד שותף גם לפני סיום משפטו. רק במקרים חריגים ביותר, מטעמים שיירשמו, רשאי בית המשפט לדחות את שמיעתו עד לסיום משפטו.<p><b>השלמת A2: בעדות שותף במשפטים נפרדים אין חסם גורף; דחייה אפשרית רק במקרים חריגים ביותר ומטעמים שיירשמו. עצם האפשרות להעיד נפרדת ממשקל העדות.</b></p>","currency":"לא אומת עדכון מעבר למקורות הקורס","reasoning":"בית המשפט שקל את החשש מעדות אינטרסנטית מול עיכוב ההליך והקשיים שיצר הכלל הגורף. דעת הרוב העדיפה להסיר את החסם ולהותיר דחייה במקרים חריגים ביותר ובהנמקה. ההבחנה בין עצם העדת השותף לבין משקל עדותו נותרת חשובה.","dissent":"השופטים נבדלו בהיקף שיקול הדעת שיש להשאיר. ההכרעה אימצה את המסלול המצומצם המתואר בדעת הנשיאה ביניש.","source":"מדינת ישראל נ׳ בית המשפט המחוזי באר שבע 11339-05.pdf — ההכרעה הסופית ודעת הנשיאה ביניש, פסקה 3","exam":"אין לפתור קייס של כתבי אישום נפרדים באמצעות האיסור ההיסטורי בלבד. יש לזהות את השינוי ואת החריג."},{"name":"אשורנס נגד הכונס הרשמי","cite":"רע\"א 3312/04 (2004)","facts":"בתום פרשת התביעה במשפט, נטענה טענת \"אין להשיב לאשמה\" — כלומר שהאשמה לא הוכחה אף לכאורה על סמך ראיות התביעה בלבד.","claimant":"לא פורט בסיכום הקיים; יש להשלים מהמקור, ולא להסיק טענה משוערת.","respondent":"לא פורט בסיכום הקיים; יש להשלים מהמקור, ולא להסיק טענה משוערת.","question":"מהם התנאים לקבלת טענת \"אין להשיב לאשמה\" בתום פרשת התביעה?","ruling":"נקבעו העקרונות המנחים להפעלת סעיף 158 לחסד\"פ.","halacha":"אם בתום פרשת התביעה לא הוכחה האשמה אף לכאורה, יזכה בית המשפט את הנאשם — הן מיוזמתו והן לבקשת הנאשם — לאחר שנתן לתובע הזדמנות להשמיע את דברו בעניין.<p><b>השלמת A2: בהקשר הפלילי יש לבחון גילוי והגינות לפי השפעתם על ההליך וההגנה, ולא להעתיק מסקנה מהליך אחר בלי בסיס בחומר הקורס.</b></p>","currency":"לא אומת עדכון מעבר למקורות הקורס"},{"name":"לזרובסקי נגד מדינת ישראל","cite":"ע\"פ 5874/00 (2000)","facts":"במהלך המשפט ביקש בית המשפט לעשות שימוש בסמכותו להזמין ראיות או עדים מיוזמתו, לאחר שהצדדים סיימו להביא את ראיותיהם.","claimant":"לא פורט בסיכום הקיים; יש להשלים מהמקור, ולא להסיק טענה משוערת.","respondent":"לא פורט בסיכום הקיים; יש להשלים מהמקור, ולא להסיק טענה משוערת.","question":"מהו היקף סמכותו של בית המשפט להביא ראיות מיוזמתו לפי סעיף 167 לחסד\"פ, ובאילו שלבים ניתן להפעילה?","ruling":"אושרה סמכותו הרחבה של בית המשפט להביא ראיות מטעמו, לרבות בשלבים מאוחרים.","halacha":"סיימו הצדדים להביא ראיותיהם, רשאי בית המשפט להורות על הזמנת עד (גם אם כבר העיד) או ראיות נוספות, מיוזמתו או לבקשת בעל דין. גם לאחר הכרעת הדין ניתן לקבל ראיות חדשות — אך במקרים נדירים וחריגים ביותר, כשהדבר נדרש לעשיית צדק ולמניעת עיוות דין.","currency":"לא אומת עדכון מעבר למקורות הקורס"},{"name":"תיקים הממתינים לבירור דין (מב\"ד)","cite":"בש\"פ 6718/06 פלוני; רע\"פ 1021/07 פלוני","facts":"בשני מקרים נדונה השאלה האם ניתן להגיש כראיה נגד נאשם פלט ממחשב המשטרה על תיקים פתוחים שטרם הוחלט אם להגיש בגינם כתב אישום (מב\"ד — ממתינים לבירור דין).","claimant":"לא פורט בסיכום הקיים; יש להשלים מהמקור, ולא להסיק טענה משוערת.","respondent":"לא פורט בסיכום הקיים; יש להשלים מהמקור, ולא להסיק טענה משוערת.","question":"האם ניתן להגיש תיקי מב\"ד כראיה, ובאיזה שלב של ההליך?","ruling":"נקבעה הבחנה בין שלב הכרעת האשמה לשלב גזירת העונש.","halacha":"בשלב בירור האשמה אין להגיש פלט מב\"ד (אלא אם הנאשם טוען שלא נפתחה נגדו חקירה כלל), שכן אין להביא ראיות על עברו הפלילי בשלב זה. בשלב גזירת הדין, לעומת זאת, שירות המבחן רשאי לכלול מידע על תיקי מב\"ד בתסקיר, ובית המשפט רשאי להידרש לכך בזהירות הראויה.","currency":"לא אומת עדכון מעבר למקורות הקורס"},{"name":"שם טוב ופלוני — חריגים נוספים לערעור על החלטות ביניים","cite":"ע\"פ 6907/19 שם טוב; בג\"ץ 10683/08 פלוני נ' בית משפט השלום חיפה","facts":"שני מקרים נוספים (מלבד עניין פלדמן) שבהם נדונה השאלה אילו החלטות ביניים בהליך הפלילי ניתנות לערעור עצמאי ומיידי, חרף הכלל האוסר זאת.","claimant":"לא פורט בסיכום הקיים; יש להשלים מהמקור, ולא להסיק טענה משוערת.","respondent":"לא פורט בסיכום הקיים; יש להשלים מהמקור, ולא להסיק טענה משוערת.","question":"אילו סוגי החלטות ביניים בהליך הפלילי מהוות חריג לכלל האוסר ערעור עליהן במהלך ההליך?","ruling":"אושרה וחודדה רשימת החריגים לכלל.","halacha":"מלבד הכלל שאין לערער על החלטות ביניים אלא במסגרת הערעור על פסק הדין, קיימים חריגים שבהם ניתן לערער בזכות באופן מיידי: פסלות שופט; החלטה על דיון בדלתיים פתוחות; החלטה בעניין עיון בחומר חקירה; והחלטה בעניין עיכוב ביצוע עונש.<p><b>השלמת A2: בהחלטות תביעה יש להבחין בין פגם מנהלי בהחלטה לבין מחלוקת על דיות הראיות; הסעד תלוי בסוג הפגם ובעוצמת הפגיעה.</b></p>","currency":"לא אומת עדכון מעבר למקורות הקורס"},{"name":"צ'ירנסקי נגד סגן נשיא בית משפט השלום בחדרה","cite":"בג\"ץ 188/96 (1996)","facts":"נדונה שאלת זכות הערעור של מי שקיבל בפועל את התוצאה המבוקשת בפסק הדין, אך נקבעו בו קביעות עובדתיות שאינן נוחות לו, וכן שאלת זכות הערעור של עד.","claimant":"לא פורט בסיכום הקיים; יש להשלים מהמקור, ולא להסיק טענה משוערת.","respondent":"לא פורט בסיכום הקיים; יש להשלים מהמקור, ולא להסיק טענה משוערת.","question":"האם מי שזכה בפסק הדין, וכן עד במשפט, רשאים לערער על קביעות מסוימות שנקבעו בפסק הדין או במהלכו?","ruling":"נקבע כי שניהם אינם \"נפגעים\" במובן המקנה זכות ערעור.","halacha":"מי שקיבל פסק דין לטובתו אינו רשאי לערער עליו, גם אם נקבעו בו ממצאים לחובתו, מכיוון שאין לראות בו \"נפגע\" מפסק הדין. עד במשפט אינו רשאי לערער על אמרת אגב של שופט שבה הוטל ספק במהימנותו.","currency":"לא אומת עדכון מעבר למקורות הקורס"},{"name":"חניון חיפה, גבארה וסורפין — מתי תינתן רשות ערעור","cite":"ר\"ע 103/82 חניון חיפה; רע\"פ 4049/05 גבארה; רע\"פ 4732/02 סורפין","facts":"שלושה פסקי דין שגיבשו יחד את המבחנים למתן רשות לערער בהליך פלילי (ערעור \"שני\", לאחר ערעור בזכות), הן ביחס להכרעת הדין והן ביחס לחומרת העונש.","claimant":"לא פורט בסיכום הקיים; יש להשלים מהמקור, ולא להסיק טענה משוערת.","respondent":"לא פורט בסיכום הקיים; יש להשלים מהמקור, ולא להסיק טענה משוערת.","question":"מתי תינתן רשות ערעור בהליך פלילי?","ruling":"גובשו הקריטריונים העיקריים למתן הרשות.","halacha":"רשות ערעור תינתן כאשר הבקשה מעלה שאלה משפטית חשובה שלהכרעה בה חשיבות ציבורית כללית, החורגת מעניינם הספציפי של בעלי הדין — או, בערעור על חומרת העונש, כאשר המקרה חריג ותחושת הצדק מחייבת מתן רשות (למשל פער ניכר בין העונש שנגזר בערכאה הראשונה לזה שנגזר בערעור).","currency":"לא אומת עדכון מעבר למקורות הקורס"},{"name":"חילף נגד מדינת ישראל","cite":"רע\"פ 8274/99 (1999)","facts":"מערער ביקש להגיש ערעור (או בקשת רשות ערעור) לאחר שחלפו המועדים הקבועים בחוק להגשתו.","claimant":"לא פורט בסיכום הקיים; יש להשלים מהמקור, ולא להסיק טענה משוערת.","respondent":"לא פורט בסיכום הקיים; יש להשלים מהמקור, ולא להסיק טענה משוערת.","question":"באילו תנאים רשאי בית המשפט להאריך את המועד להגשת ערעור פלילי שהוגש באיחור?","ruling":"נקבע כי ניתן להאריך את המועד גם ללא \"טעמים מיוחדים שיירשמו\", בשונה מהליך אזרחי.","halacha":"בית המשפט רשאי, לבקשת מערער, להרשות הגשת ערעור או בקשת רשות ערעור גם לאחר חלוף המועדים — ללא צורך בטעמים מיוחדים שיירשמו (בשונה מהליך אזרחי). החלטת בית משפט לדחות בקשת הארכת מועד מהווה \"פסק דין\", והערעור עליה הוא בזכות.","currency":"לא אומת עדכון מעבר למקורות הקורס"},{"name":"יוסי בן ארי נגד השר לביטחון פנים","cite":"בג\"ץ 8029/21 (2021) — מפי השופט אלכס שטיין","facts":"בן ארי נידון בשנות ה-90 לתריסר שנות מאסר בעבירות סמים חמורות מסוג פשע. לאחר שריצה 4 שנים בלבד, נמלט מהכלא וברח לפרגוואי, שם חי תחת זהות בדויה כמעט 30 שנה — עד שאותר, נעצר והוחזר לישראל ב-2021.","claimant":"חלפו מעל 20 שנה מיום הפסקת ריצוי העונש בפועל, ולפי סעיף 10(א) לחוק סדר הדין הפלילי העונש התיישן לחלוטין והמדינה אינה מוסמכת להחזיקו במאסר.","respondent":"לפי סעיף 10(ג) לחוק, תקופת ההימלטות לחוץ לארץ וההתחמקות ממאסר אינן נספרות במניין — השעון נעצר ביום הבריחה.","question":"האם עונש מאסר של אסיר שנמלט מהכלא ושהה בחוץ לארץ כמעט 30 שנה מתיישן, או שבריחתו האקטיבית מקפיאה את מרוץ ההתיישנות?","ruling":"בית המשפט העליון דחה את העתירה — הבריחה מקפיאה את מרוץ ההתיישנות באופן מוחלט.","halacha":"בריחה אקטיבית של אסיר מהכלא והתחמקות ממאסר מקפיאות לחלוטין את שעון התיישנות העונש (סעיף 10(ג)). מוסד ההתיישנות נועד להעניק מחילה למי ששהה בקהילה וסבל מחרדת העונש המתמדת — לא למי שנמלט וחי בשקט תחת זהות בדויה.<p><b>השלמת A2: בביקורת מנהלית יש להציג את האיזון בין זכויות הפרט לבין האינטרס הציבורי ואת גבולות ההתערבות, בלי לייחס חריג עובדתי שלא אומת.</b></p>","currency":"לא אומת עדכון מעבר למקורות הקורס"},{"name":"דוד אפל נגד פרקליטת המדינה","cite":"בג\"ץ 2682/99 (1999)","facts":"דוד אפל, איש עסקים, הועמד לדין פלילי בגין עבירות שוחד ומרמה חמורות. אפל הגיש עתירה לבג\"ץ בדרישה לבטל את כתב האישום נגדו, בטענה שההחלטה להעמידו לדין לוקה בחוסר סבירות קיצוני ונשענת על תשתית ראייתית רעועה.","claimant":"החלטת התביעה להעמידו לדין היא החלטה מנהלית הכפופה לביקורת שיפוטית מלאה של בג\"ץ, וההחלטה להגיש כתב אישום עולה כדי חוסר סבירות קיצוני.","respondent":"ההחלטה על הגשת כתב אישום או סגירת תיק מצויה בליבת הסמכות המקצועית של התביעה הכללית, שלה המומחיות הייחודית בהערכת סיכויי הרשעה — ובית המשפט אינו \"תובע-על\".","question":"באילו נסיבות ובאיזו מידה יתערב בית המשפט הגבוה לצדק בשיקול הדעת המקצועי של רשויות התביעה בעניין הגשת כתב אישום או סגירת תיק פלילי?","ruling":"בית המשפט העליון דחה את העתירה וקבע הלכת התערבות מצומצמת ביותר.","halacha":"החלטת התביעה להעמיד אדם לדין היא אכן החלטה מנהלית הכפופה לביקורת שיפוטית, אך בג\"ץ יתערב בה רק במקרים נדירים וחריגים ביותר שבהם נפל בהחלטה פגם חמור היורד לשורש העניין — חוסר סבירות קיצוני ביותר, חוסר תום לב מובהק, שיקולים זרים ברורים או אפליה בררנית פסולה. כל עוד ההחלטה במתחם הסבירות המקצועי של התובע — אין התערבות.","currency":"לא אומת עדכון מעבר למקורות הקורס"},{"name":"רפאל יששכרוב נגד התובע הצבאי הראשי","cite":"ע\"פ 5121/98","facts":"טוראי רפאל יששכרוב, חייל בשירות חובה, נעצר בחשד לעבירות סמים. בחקירתו על ידי חוקר מצ\"ח לא הודע לו על זכותו להיוועץ בעורך דין בטרם החקירה, אלא נאמר לו בטעות כי זכות זו תקום רק לאחר סיום החקירה והמעצר. במהלך החקירה הודה יששכרוב בשימוש ובהחזקת סם מסוכן במספר אירועים נוספים בעבר. למחרת, לאחר שנועץ בסניגורית פיקודית, שמר על זכות השתיקה בחקירתו השנייה.","claimant":"פגיעה בזכות ההיוועצות בעורך דין, המעוגנת בחוק יסוד כבוד האדם וחירותו, פוגעת בהגינות ההליך ומצדיקה פסילת ההודאה שהושגה עקב כך.","respondent":"לפי סעיף 12 לפקודת הראיות, הודאה קבילה כל עוד ניתנה מרצון טוב וחופשי; משלא הופעלו על יששכרוב לחצים פיזיים או נפשיים פסולים, ההודאה קבילה. במשפט הישראלי אין דוקטרינת \"פירות העץ המורעל\" האמריקאית, ואין לפסול ראיה קבילה ואמינה בשל פגם פרוצדורלי בהשגתה.","question":"האם חוק יסוד כבוד האדם וחירותו מחייב פסילה של ראיה שהושגה תוך פגיעה בזכות חוקתית של הנחקר, ובאילו תנאים?","ruling":"בית המשפט העליון קבע כי לבתי המשפט שיקול דעת לפסול ראיה שהושגה שלא כדין, כאשר קבלתה תפגע באופן מהותי בזכות להליך הוגן.","halacha":"נקבעה דוקטרינת <b>הפסילה הפסיקתית היחסית</b> — לבית המשפט שיקול דעת לפסול ראיה שהושגה באמצעים פסולים, לפי מבחן איזון בין האינטרס הציבורי בחשיפת האמת לבין ההגנה על זכויות הנחקר וטוהר ההליך השיפוטי, ולא פסילה אוטומטית וקטגורית כבארה\"ב. זוהי ההלכה העומדת בבסיס הדיון על מודל מיגור הפשיעה מול מודל ההליך הראוי (ראו שיעור 1).","currency":"לא אומת עדכון מעבר למקורות הקורס","reasoning":"הנשיאה ביניש קבעה שני חידושים: (א) הרחבת פרשנות סעיף 12 — הסעיף אינו מגן רק על אמיתות ההודאה מפני אלימות וכפייה, אלא מגן גם על האוטונומיה של הרצון החופשי של החשוד; פגיעה קשה בזכות ההיוועצות הפוגעת ביכולתו להחליט מושכל אם להודות פוגעת באוטונומיה זו. (ב) קביעת כלל הפסלות הפסיקתי היחסי: לבית המשפט שיקול דעת (לא פסילה אוטומטית) לפסול ראיה שהושגה שלא כדין, לפי שלוש קבוצות שיקולים: אופייה וחומרתה של אי-החוקיות (זדון מול תום לב); מידת ההשפעה של הפגם על הראיה (ראיה \"עצמאית\" כמו חפץ, מול ראיה \"מושפעת\" כמו הודאה); והנזק מול התועלת החברתית בפסילתה.","dissent":"ההחלטה התקבלה פה אחד בהרכב מורחב של 9 שופטים.","exam":"בכל קייס שבו שוטר/חוקר פעל שלא כדין (לא הודיע על זכות היוועצות/שתיקה, לא הציג צו, ביצע חיפוש בלתי חוקי) — יש להעביר את הראיה שהושגה דרך מבחן שלוש קבוצות השיקולים של הלכת יששכרוב, ולזכור שאין \"פירות העץ המורעל\" בישראל: הפסילה תמיד יחסית ולפי שיקול דעת בית המשפט. יש להבחין בין ראיה חפצית עצמאית (נטייה קטנה יותר לפסילה) לבין הודאה מושפעת (נטייה גדולה יותר)."},{"name":"ירדאו קסאי נגד מדינת ישראל","cite":"רע\"פ 3829/15","facts":"קסאי עוכב ונעצר ברחוב על ידי שוטרים בנסיבות שבהן לא התקיימו עילות המעצר החוקיות. קסאי התנגד למעצר פיזית תוך שימוש בכוח מול השוטרים, והועמד לדין בגין תקיפת שוטר בעת מילוי תפקידו.","claimant":"מאחר שהמעצר היה בלתי חוקי מיסודו, השוטר לא פעל כחוק בעת מילוי תפקידו, ולכן עמדה לו זכות טבעית להתנגד למעצר הבלתי חוקי.","respondent":"חובה על אזרח לציית להוראות שוטר בשטח, ואין להתיר שימוש בכוח נגד אנשי חוק גם אם נפלה שגגה בחוקיות המעצר.","question":"האם עומדת לאדם זכות להתנגד פיזית למעצר בלתי חוקי שמבצע שוטר, ובאיזו מידה?","ruling":"בית המשפט העליון קיבל את טענת המערער.","halacha":"לכל אדם שמורה זכות יסוד להתנגד למעצר בלתי חוקי, ואף לעשות שימוש בכוח סביר ומידתי לצורך שמירה על חירותו. מעצר בלתי חוקי שולל מהשוטר את ההגנה של מילוי תפקידו כחוק.<p><b>השלמת A2: חיפוש בהסכמה נבחן לפי מקור הסמכות, תוקף ההסכמה וחוקיות הפעולה; יש להפריד בין היישום העובדתי לבין מבחן הפסילה היחסי.</b></p>","currency":"לא אומת עדכון מעבר למקורות הקורס"},{"name":"כהן נגד הפצ\"ר","cite":"ע\"פ 349/88","facts":"חייל בצבא נחשד בביצוע עבירה צבאית. המפקד והמשטרה הצבאית השתמשו בסמכות מעצר ללא צו תחת העילה של עבירה שבוצעה \"זה מקרוב\", חרף חלוף מספר ימים מהמעשה.","claimant":"חלפו ימים ממועד ביצוע המעשה, ולכן סמכות מעצר ללא צו תחת התיבה \"זה מקרוב\" פקעה, והיה חובה לפנות לשופט להוצאת צו מעצר מסודר.","respondent":"הביטוי \"זה מקרוב\" מעניק גמישות חקירתית של מספר ימים.","question":"מהו פרק הזמן המדויק המוגדר תחת התיבה \"זה מקרוב\" לצורך ביצוע מעצר שוטר ללא צו שופט?","ruling":"בית המשפט העליון קבע כי הביטוי מבטא משך זמן מצומצם ביותר.","halacha":"\"זה מקרוב\" נמדד בשעות בודדות בלבד ולא בימים. ברגע שחלפו ימים מאירוע העבירה, פוקעת סמכות השוטר לעצור ללא צו, וחובה לפנות לבית המשפט לקבלת צו מעצר.<p><b>השלמת A2: ההבחנות מן ההליך הצבאי אינן מועברות אוטומטית להליך האזרחי; יש להסתמך על כלל ההוגנות ונטל ההוכחה כפי שנלמדו בקורס.</b></p>","currency":"לא אומת עדכון מעבר למקורות הקורס"},{"name":"אסף שי נגד מדינת ישראל","cite":"ע\"פ 9956/05","facts":"אסף שי נחשד בביצוע עבירת הריגה בתאונת דרכים. במהלך חקירתו בתחנה ביקש להיפגש עם עורך דינו. החוקרים השהו את המפגש שלא כדין, והמשיכו לחקור אותו עד שמסר הודאה מפלילה בכתב.","claimant":"מניעת המפגש עם עורך דינו הייתה בלתי חוקית, פגעה באוטונומיה שלו וזיהמה את החקירה, ולכן יש לפסול את ההודאה מכוח הלכת יששכרוב.","respondent":"ההודאה ניתנה מרצון חופשי והחוקרים היו מוטרדים מדחיפות גביית הגרסה.","question":"מהי נפקות הפגיעה הבלתי חוקית בזכות היסוד של החשוד להיוועץ בעורך דין על קבילות הודאתו בחקירה?","ruling":"בית המשפט העליון פסל את קבילות ההודאה וזיכה את שי מעבירת ההריגה.","halacha":"זכות המפגש וההיוועצות עם עורך דין היא זכות יסוד חוקתית מן המעלה הראשונה. פגיעה בלתי חוקית בזכות זו פוגעת בהגינות ההליך הפלילי ותוביל לפסילת הודאה שנגבתה בעקבותיה.","currency":"לא אומת עדכון מעבר למקורות הקורס"},{"name":"מוצעב אלטויל נגד מדינת ישראל","cite":"בש\"פ 8845/04","facts":"אלטויל נעצר בחשד לביצוע עבירות ביטחון חמורות. בתום החקירה הגישה המדינה הצהרת תובע לפי סעיף 17(ד) וביקשה חמישה ימי מעצר גישור.","claimant":"הצהרת תובע השוללת חירות מנעצר שחקירתו הסתיימה חייבת להתפרש בצמצום דווקני; המדינה אינה מוסמכת להשתמש בימי הגישור להשלמת חקירה אלא רק לניסוח טכני של כתב האישום.","respondent":"מעצר הגישור נועד לגשר על הפער הזמני הנדרש לתובע ללמוד את תיק החקירה המורכב ולנסח את כתב האישום והבקשה למעצר עד תום ההליכים.","question":"מהו גדר סמכותו של בית המשפט בהענקת מעצר גישור לפי סעיף 17(ד), ומהן החובות המוטלות על התביעה בעת מתן הצהרת תובע?","ruling":"בית המשפט העליון תחם את מוסד מעצר הגישור לתכליתו הצרה.","halacha":"הצהרת תובע היא כלי דיוני המיועד אך ורק לגישור על פרק הזמן הדרוש להכנת כתב האישום והבקשה למעצר עד תום ההליכים, ולא נועד להמשך חקירה. בית המשפט מחויב לבחון בקפדנות אם קיימת עילת מעצר לכאורה, ולקצוב את ימי הגישור למינימום הנדרש.","currency":"לא אומת עדכון מעבר למקורות הקורס"},{"name":"שלמה זאדה נגד מדינת ישראל","cite":"בש\"פ 8087/95 — מפי הנשיא אהרן ברק","facts":"נגד שלמה זאדה ואחרים הוגש כתב אישום בעבירות סמים חמורות (החזקה וסחר בהרואין). המדינה ביקשה לעוצרו עד תום ההליכים לפי סעיף 21 לחוק המעצרים. חומר הראיות התבסס על הודאות חלקיות, גרסאות מתחלפות של שותפים וראיות נסיבתיות, וזאדה טען כי הראיות נגדו חלשות ואינן מגיעות לרף הנדרש למעצר.","respondent":"\"ראיות לכאורה\" בשלב המעצר אינן דורשות הוכחה מעבר לספק סביר; די בכך שקיים בחומר החקירה פוטנציאל ראייתי גולמי שאם יינתן בו אמון בסוף המשפט יביא להרשעה.","ruling":"נקבע כי כנגד זאדה התקיימו ראיות לכאורה המקימות סיכוי סביר להרשעה, והוא נעצר עד תום ההליכים.","currency":"לא אומת עדכון מעבר למקורות הקורס","claimant":"בשלב מעצר עד תום ההליכים על בית המשפט לבחון את אמינות העדים ואת משקל הראיות; משיש סתירות פנימיות וכרסום משמעותי בראיות התביעה, לא מתקיים תנאי \"הראיות לכאורה\" הנדרש, ואין לעצור מאחורי סורג ובריח.","question":"מהו הפירוש והמבחן המשפטי למונח \"ראיות לכאורה להוכחת האשמה\" לפי סעיף 21(ב) לחוק המעצרים, הנדרש לצורך מעצר עד תום ההליכים?","reasoning":"הנשיא ברק קבע את מבחן \"הסיכוי הסביר להרשעה\": (א) \"ראיות לכאורה\" הן ראיות שגלום בהן סיכוי סביר להרשעה בתום ההליך הפלילי — לא הוכחה מעבר לספק סביר. (ב) בשלב המעצר השופט אינו קובע ממצאי מהימנות או משקל סופי; הוא בוחן את חומר החקירה בפוטנציאל ההוכחתי המרבי שלו (\"בשיאו\"). (ג) חריג הכרסום המהותי: אם בחומר הראיות מובנים סתירות תהומיות או פגמים קשים הפוגעים מראש בסיכוי הסביר להרשעה — לא יתקיימו ראיות לכאורה, והנאשם ישוחרר.","halacha":"ראיות לכאורה למעצר עד תום ההליכים נבחנות במבחן \"הסיכוי הסביר להרשעה\", על בסיס הפוטנציאל ההוכחתי הגולמי שבחומר החקירה, ולא לפי מהימנות סופית של העדים.","exam":"כשנשאלים בקייס האם לעצור נאשם עד תום ההליכים — יש לצטט את הלכת זאדה, להגדיר \"ראיות לכאורה\" כסיכוי סביר להרשעה, ולבחון אם בחומר הראיות יש פוטנציאל הרשעתי או כרסום מהותי. אין לדרוש הוכחה מעבר לספק סביר בשלב זה."},{"name":"עימאד גנימאת נגד מדינת ישראל","cite":"דנ\"פ 2316/95 — מפי הנשיא מאיר שמגר והשופט אהרן ברק","facts":"גנימאת הועמד לדין בגין עבירות רכוש מרובות של גניבת כלי רכב. התביעה ביקשה לעוצרו עד תום ההליכים בטענה שמדובר ב\"מכת מדינה\" המקימה עילת מעצר עצמאית.","claimant":"בעקבות חוק יסוד כבוד האדם וחירותו, חומרת העבירה כשלעצמה או היותה \"מכת מדינה\" אינן מהוות עילת מעצר עצמאית — חובה לבחון את מסוכנותו האישית של הנאשם הספציפי.","respondent":"הפגיעה הרכושית הקשה והיקף התופעה של גניבות רכב מחייבים הגנה על הציבור באמצעות מעצר עד תום ההליכים.","question":"האם חומרת העבירה או היותה \"מכת מדינה\" מקימות עילת מעצר עצמאית עד תום ההליכים, וכיצד משפיע חוק יסוד כבוד האדם וחירותו על דיני המעצרים?","ruling":"בדיון הנוסף נקבעה הלכה חוקתית מכוננת בדיני המעצרים.","halacha":"חומרת העבירה כשלעצמה או היותה \"מכת מדינה\" אינן מהוות עילת מעצר עצמאית. חוק יסוד כבוד האדם וחירותו מחייב לבחון את המסוכנות האישית של הנאשם, וקיימת חובה חוקתית לבחון תמיד חלופת מעצר פחות פוגענית.<p><b>השלמת A2: חומרת עבירה או תיוגה כ\"מכת מדינה\" אינם תחליף לבחינה קונקרטית של מסוכנות וחלופת מעצר.</b></p>","currency":"לא אומת עדכון מעבר למקורות הקורס"},{"name":"מדינת ישראל נגד איבדיוב","cite":"בש\"פ 433/98","facts":"איבדיוב היה נתון במעצר עד תום ההליכים במשך תשעה חודשים מיום הגשת כתב האישום. משפטו התארך עקב בקשות דחייה של הסניגוריה והעומס השיפוטי. בחלוף תשעת החודשים דרש להשתחרר מיד לפי סעיף 61.","claimant":"חלוף תשעת החודשים מקים זכות חוקתית מוחלטת לשחרור ממעצר, ללא קשר לעובדה שהמשפט טרם הסתיים.","respondent":"העיכובים נגרמו בחלקם בעטיו של הנאשם, והמסוכנות הנשקפת ממנו מחייבת את הארכת מעצרו בעליון.","question":"כיצד נמנים תשעת החודשים לשחרור באין הכרעת דין לפי סעיף 61, ומהם השיקולים המנחים את בית המשפט העליון בהארכת מעצר מעבר לתקופה זו?","ruling":"בית המשפט העליון קבע את הלכת איבדיוב, המגדירה את אופן מניין התקופה.","halacha":"תקופת תשעת החודשים נמנית אך ורק מיום הגשת כתב האישום, ואינה כוללת ימי מעצר שקדמו לו; מניין הימים אינו חייב להיות רציף. בחלוף תשעה חודשים נקודת המוצא היא שחרור, והארכת מעצר בעליון תינתן במשורה תוך איזון בין קצב ההליך למסוכנות הנאשם.","currency":"לא אומת עדכון מעבר למקורות הקורס"},{"name":"ילנה מורוזובה נגד מדינת ישראל","cite":"בש״פ 5142/99 — 22.11.1999","facts":"נגד ילנה מורוזובה הוגש כתב אישום, והיא שהתה במעצר עד תום ההליכים. לאחר הרשעתה במחוזי הגישה ערעור לעליון, שהתקבל — הכרעת הדין בוטלה עקב פגם חמור והתיק הוחזר למחוזי לניהול מחדש. במועד זה כבר שהתה מורוזובה במעצר מצטבר של למעלה מ-9 חודשים (התקרה הסטטוטורית לפי סעיף 61(א) לחוק המעצרים). המדינה טענה שכיוון שהמשפט מתחיל מחדש, מתאפס גם מרוץ תשעת החודשים.","claimant":"מכוח עיקרון החוקיות (סעיף 1 לחוק המעצרים), אין לעצור אדם אלא לפי הסמכה מפורשת בחוק. סעיף 61(א) קובע תקרה קשיחה של 9 חודשים במעצר עד תום ההליכים; החזרת המשפט לדיון מחדש אינה מאפסת את השעון, ואין להחזיקה במעצר יום אחד נוסף בלי אישור מפורש של בית המשפט העליון לפי סעיף 62.","respondent":"פתיחת הדיון מחדש כמוה כהגשת כתב אישום חדש, ולכן מרוץ 9 החודשים מתחיל מחדש וניתן להמשיך להחזיקה במעצר עד תום ההליכים.","question":"האם החזרת הליך פלילי לניהול מחדש בערכאה הדיונית מאפסת את מרוץ 9 החודשים של מעצר עד תום ההליכים לפי סעיף 61(א) לחוק המעצרים?","reasoning":"השופטת דורנר קבעה: (א) עיקרון החוקיות במעצרים — שלילת חירות דורשת הסמכה מפורשת ודווקנית בחוק. (ב) איסור \"איפוס השעון\" — סעיף 61(א) קובע תקרת גג מוחלטת של 9 חודשים מיום המעצר המקורי, בגין אותו כתב אישום, ללא קשר לחזרות ולדיונים מחדש. (ג) בלעדיות סמכות סעיף 62 — הסמכות היחידה להאריך מעצר מעבר ל-9 חודשים נתונה אך ורק לבית המשפט העליון לפי סעיף 62 (לתקופות של עד 90 ימים בכל פעם), ולא לערכאה הדיונית.","ruling":"בית המשפט המחוזי אינו מוסמך להורות על מעצרה מחדש; בהיעדר צו הארכה מפורש מבית המשפט העליון לפי סעיף 62 — מורוזובה שוחררה מן המעצר.","halacha":"מרוץ 9 החודשים למעצר עד תום ההליכים אינו מתאפס גם אם התיק הוחזר לניהול מחדש בערכאה הדיונית; הסמכות היחידה להאריך את המעצר מעבר לתקרה זו נתונה לבית המשפט העליון בלבד, מכוח סעיף 62 לחוק המעצרים.","dissent":"קדמי, שאליו הצטרפו מצא וטירקל, תמך בתפיסה של חטיבת דיון חדשה ומניין חדש. זו אינה דעת הרוב.","source":"ילנה מורוזובה נ׳ מדינת ישראל.pdf — בש״פ 5142/99, פסקאות 10–12 לדעת ביניש וההכרעה הסופית","currency":"מוצגת ההלכה בפסק הדין שבמחברת; לא נבדקו שינויים מאוחרים מחוץ למחברת","exam":"בקייס שבו נאשם מוחזק במעצר למעלה מ-9 חודשים והמדינה טוענת ל\"איפוס השעון\" עקב דיון מחדש/ביטול הרשעה בערעור — יש לקבוע לפי הלכת מורוזובה שהמעצר בלתי חוקי, וכי רק שופט בית המשפט העליון מוסמך להאריכו לפי סעיף 62."},{"name":"אלעוקה נגד מדינת ישראל","cite":"ע״פ 10683/08","facts":"ההליך עסק באמרות חוץ של עד שנמסרו במהלך חקירה ובשאלה אם ניתן להעדיפן על פני עדות שונה בבית המשפט.","claimant":"המערער טען לפסילת האמרות ולפגיעה ברצון החופשי באמצעות תחבולות חקירה.","respondent":"המדינה טענה שהאמרות עומדות בתנאי סעיף 10א ושהתחבולה לא שללה את הרצון החופשי.","question":"מתי ניתן לקבל אמרת חוץ של עד ומה גבולות תחבולת חקירה?","reasoning":"בית המשפט הפריד בין תנאי הקבילות המצטברים של סעיף 10א לבין שאלת המשקל, ובחן אם התחבולה חצתה את גבולות הרצון החופשי והגינות ההליך.","ruling":"הכלל שנלמד הוא שאין די בעצם קיומה של אמרה; יש לעמוד בתנאים המצטברים ולבחון את משקלה ואת נסיבות גבייתה.","halacha":"סעיף 10א דורש הוכחת האמרה, העדת מוסרה והזדמנות לחקירה, ושוני מהותי/הכחשה/אי־זכירה; תחבולה אינה פסולה כשלעצמה.","source":"אלעוקה נ' מדינת ישראל.pdf — ניתוח קבוצה C","currency":"מוצג לפי ניתוח המקור במחברת; לא נטענה קביעה בדבר שינוי מאוחר."},{"name":"חאתם פאיז אלמע׳ארי נגד התביעה הצבאית","cite":"חאתם פאיז אלמע׳ארי נ׳ התביעה הצבאית","facts":"ההליך עסק בהערכת מהימנות ובטענות הנוגעות להתנהלות התביעה.","claimant":"ההגנה תקפה את המשקל שניתן לעדות ואת הגינות ההתנהלות הדיונית.","respondent":"התביעה עמדה על כך שהערכת מהימנות מסורה לערכאה הדיונית ושאין במחדל נטען כדי להביא לתוצאה אוטומטית.","question":"כיצד מעריכים מהימנות ומה משמעותה של טענת חוסר הגינות?","reasoning":"ההערכה נעשית במכלול ובהנמקה; מחדל נבחן לפי השפעתו על ההגנה והוגנות ההליך.","ruling":"אין כלל אוטומטי הפוסל עדות או מבטל הליך; נדרשת בחינה קונקרטית של מהימנות, הסתירות והפגיעה הנטענת.","halacha":"סעיף 53 לפקודת הראיות הוא מסגרת להערכת מהימנות, לצד חובת הגינות התביעה.","source":"חאתם פאיז אלמע'ארי נ' התביעה הצבאית.pdf — ניתוח קבוצה C","currency":"מוצג לפי ניתוח המקור במחברת; לא נטענה קביעה בדבר שינוי מאוחר."},{"name":"יונתן אוריך נגד מדינת ישראל","cite":"דנ״פ 1062/21","facts":"במסגרת חקירת הטרדת עד (בפרשת עד המדינה שלמה פילבר), חקרה המשטרה את יונתן אוריך, יועץ ראש הממשלה. בתחנה ביקש החוקר לעיין בטלפון הנייד החכם שלו; אוריך מסר את הקוד ונערך בטלפון חיפוש ללא צו חיפוש שיפוטי. רק לאחר שהמשטרה כבר נחשפה לתוכן הטלפון ומצאה ראיות מפלילות, פנתה בדיעבד לבית משפט השלום בבקשה להוציא צו חיפוש בחומר מחשב.","claimant":"החיפוש הראשוני בטלפון הנייד נעשה בניגוד קטגורי לסעיף 23א לחוק סדר הדין הפלילי, הדורש צו שופט מפורש מראש. הפנייה המאוחרת לבית המשפט נועדה \"להלבין\" בדיעבד חיפוש בלתי חוקי, ואין להיעתר לבקשת צו הנסמכת על ראיות שהושגו כך.","respondent":"בשלב הוצאת צו החיפוש השיפוטי (בשונה משלב קבילות הראיות במשפט עצמו), על בית המשפט לבחון רק אם מתקיים כעת חשד סביר המצדיק את הצו, ולא לעסוק בפסילת ראיות.","question":"כיצד על בית המשפט לדון בבקשת המשטרה להוצאת צו חיפוש בטלפון נייד/חומר מחשב, כאשר הבקשה נסמכת על מידע שהושג כבר בחיפוש מוקדם בלתי חוקי?","reasoning":"בית המשפט העליון, בדיון נוסף בהרכב מורחב, קבע: (א) טלפון נייד מוגדר \"חומר מחשב\" המכיל את עולמו, פרטיותו וסודותיו של האדם, ולכן ראוי להגנה מוגברת. (ב) סעיף 23א לחסד\"פ קובע כלל ברזל — חיפוש בחומר מחשב/טלפון נייד ייערך רק לפי צו שופט מפורש מראש, על ידי בעל תפקיד מיומן. (ג) כאשר המשטרה עורכת חיפוש מוקדם בלתי חוקי ולאחריו מבקשת צו \"מלבין\", על השופט הדן בבקשת הצו להביא בחשבון את אי-החוקיות המוקדמת במסגרת שיקול דעתו. (ד) ככל שאי-החוקיות המוקדמת חמורה ומכוונת יותר, כך תגבר הנטייה לדחות את בקשת הצו, אלא אם קיימים טעמים מיוחדים ואינטרס ציבורי כבד משקל.","ruling":"הדיון בבקשת הצו הוחזר לבית משפט השלום, בהנחיה מפורשת לשקול את אי-החוקיות המוקדמת שבה נהגו החוקרים כלפי זכויות הנחקר.","halacha":"אין לערוך חיפוש בטלפון נייד/חומר מחשב ללא צו שופט מפורש מראש; חיפוש מוקדם בלתי חוקי בטלפון נייד ישקול כנגד מתן צו חיפוש שיפוטי מאוחר, ובית המשפט לא ישמש כלי להלבנת מחדלי חקירה בדיעבד.","source":"יונתן אוריך נ' מדינת ישראל.pdf — ניתוח קבוצה C","currency":"מוצג לפי ניתוח המקור במחברת; לא נטענה קביעה בדבר שינוי מאוחר.","exam":"אם בשאלה חוקר מציץ בטלפון של חשוד ובודק הודעות בתחנה או ברחוב ללא צו, ורק לאחר מכן פונה לשופט לבקש צו — יש לציין שלפי הלכת אוריך החיפוש הראשוני פסול, וכי השופט רשאי לשקול לסרב לתת צו מאוחר בשל הפגם המוקדם. \"הסכמה\" מילולית ללא הסבר וללא צו שופט אינה מכשירה חיפוש כזה."},{"name":"מדינת ישראל נגד רון תורג׳מן","cite":"ע״פ 10994/08 (14.5.2009)","facts":"המדינה ערערה על החלטה שהתירה לפרסם קטעים מתיעוד חזותי של חקירת רון תורג׳מן. במהלך ההליך הושג הסדר טיעון ותורג׳מן הורשע לפני גזר הדין.","claimant":"המדינה טענה שסעיף 13 ממשיך לחול.","respondent":"בקשת הפרסום והשלב הדיוני המאוחר.","question":"האם סעיף 13 חדל לחול לאחר הצגת התיעוד כראיה, וכיצד מופעל שיקול הדעת להתיר פרסום?","ruling":"הערעור התקבל במישור העקרוני: סעיף 13 ממשיך לחול. בנסיבות השלב הדיוני הותר הפרסום ללא דיחוי, בכפוף לאי־חשיפת פרטי קטינים.","halacha":"סעיף 13 חל לאורך ציר הזמן ונדרשת רשות בית המשפט גם לאחר הצגת התיעוד. האיזון תלוי בשלב ההליך, תקינותו, פרטיות, עמדת הנחקר ועניין ציבורי.","exam":"יש להפריד בין תחולת האיסור, שנמשכת, לבין שיקול הדעת להתיר פרסום, המשתנה לפי הנסיבות.","dissent":"","source":"מדינת ישראל נ׳ המשיבים רון תורג׳מן.pdf — ע״פ 10994/08"},{"name":"רשות השידור נגד מדינת ישראל","cite":"בש״פ 4275/07 (17.9.2007)","facts":"לאחר הגשת כתב האישום נגד רומן זדורוב ביקשה רשות השידור היתר לפרסם בכתבה טלוויזיונית קטעים מהתיעוד החזותי של חקירתו במשטרה, לפי סעיף 13 לחוק חקירת חשודים, לפני תחילת פרשת הראיות.","claimant":"עניין ציבורי והבקשה לפרסום תיעוד החקירה.","respondent":"הגנת סעיף 13 על תקינות ההליך, פרטיות וכבוד הנחקרים.","question":"באילו נסיבות יינתן היתר לפרסום תיעוד חזותי או קולי של חקירה למרות איסור סעיף 13?","ruling":"הערעור נדחה; בשלב המוקדם של ההליך לא נמצא חריג המצדיק סטייה מכלל איסור הפרסום.","halacha":"נקודת המוצא היא איסור פרסום ללא רשות בית המשפט. נשקלים תקינות וטוהר ההליך, פרטיות וכבוד הנחקרים; הסכמת הנחקר לבדה אינה מכריעה.","exam":"סעיף 13 אינו מתאיין אוטומטית בשל עניין ציבורי או הסכמה.","dissent":"","source":"רשות השידור נ׳ המשיבים 1. מדינת ישראל.pdf — בש״פ 4275/07"},{"name":"לאוניד לוין נ׳ מדינת ישראל","cite":"דנ״פ 11742/04 (9.5.2005), בעקבות ע״פ 1641/04","facts":"לאחר תאונת דרכים קטלנית נלקחה מלוין דגימת דם לבדיקת שכרות ונמצא אלכוהול בריכוז 132 מ״ג ל־100 סמ״ק דם. נדונו פגמים באופן ביצוע הבדיקה לפי חוק החיפוש.","claimant":"טענות בדבר פגמים בזהות הגורם שהורה על הבדיקה ובהסברים לחשוד.","respondent":"המדינה הסתמכה על תוצאות הבדיקה ועל ראיות נוספות.","question":"מה הדין החל על נטילת דם לצורך בדיקת שכרות ומה משמעותם של פגמים בפרוצדורת חיפוש פנימי?","ruling":"העתירה לדיון נוסף נדחתה. לא נקבעה פסילה אוטומטית בשל כל הפרה, ובנסיבות המקרה היו ראיות נוספות לשכרותו של לוין.","halacha":"בדיקת דם היא חיפוש פנימי ויש לבצעה בהתאם לחוק החיפוש; פגם אינו מוביל בהכרח לפסילה אוטומטית, ונפקותו נבחנת לפי נסיבות המקרה והמסגרת הראייתית.","exam":"יש לזהות את הפגם, המסלול החוקי ונפקותו הראייתית; אין להסיק שכל חריגה פרוצדורלית מובילה לפסילה.","dissent":"","source":"לאוניד לוין נ׳ מדינת ישראל.pdf — דנ״פ 11742/04"},{"name":"אריק ניסנוב נגד מדינת ישראל","cite":"רע\"א 48886-03-25 (2025) — מפי השופט יחיאל כשר","facts":"המבקש נעצר ונחקר בחשד למעורבות בתקיפה, הועמד לדין, וההליך הפלילי נגדו נמשך כחמש שנים עד שהמדינה חזרה בה מכתב האישום. בית משפט השלום קיבל את תביעתו הנזיקית נגד המדינה וקבע כי התרשלה בחקירה, בהגשת כתב האישום ובניהול ההליך, אך בית המשפט המחוזי קיבל את ערעור המדינה וביטל את החיוב בפיצויים.","claimant":"המבקש טען כי פסק דינו של בית המשפט המחוזי מקנה, הלכה למעשה, חסינות מוחלטת בנזיקין לרשויות האכיפה, וכי המחדלים שנקבעו כממצאים עובדתיים על ידי בית משפט השלום הוגדרו בטעות כעומדים בסטנדרט התנהגות סביר.","respondent":"בית המשפט המחוזי קבע כי בית משפט השלום לא יישם את אמות המידה שנקבעו בהלכה הפסוקה, וכי קיומם של קשיים ראייתיים כשלעצמו אינו שולל סיכוי סביר להרשעה כל עוד הגרסה המפלילה אינה מופרכת.","question":"האם מתקיימים במקרה זה התנאים החריגים המצדיקים מתן רשות ערעור ב'גלגול שלישי', והאם רשויות אכיפה ותביעה חסינות מאחריות בנזיקין?","ruling":"הבקשה נדחתה. נקבע כי אין ברשויות האכיפה חסינות מוחלטת מנזיקין, וכי המחלוקת בין הערכאות נסבה על יישום העקרונות המשפטיים על נסיבות המקרה הפרטני, ולא על שאלה עקרונית המצדיקה דיון נוסף.","halacha":"רשות ערעור ב'גלגול שלישי' תינתן רק במקרים חריגים המעוררים שאלה משפטית עקרונית החורגת מעניינם של הצדדים, או כאשר דחיית הבקשה תגרום לעיוות דין. רשויות האכיפה והתביעה אינן חסינות מפני תביעה בנזיקין וניתן לחייבן בפיצויים כאשר הן מתרשלות בחקירה, בהחלטה על הגשת אישום או בניהול ההליך הפלילי, בכפוף לסטנדרט הזהירות הנגזר מהאיזון בין אכיפת החוק לזכויות הפרט.","currency":"לא אומת עדכון מעבר למקורות הקורס"},{"name":"סלימאן זכריא נגד מדינת ישראל","cite":"רע\"פ 11160/03 (2004) — מפי השופט א' א' לוי (הנשיא א' ברק והשופטת א' פרוקצ'יה מסכימים)","facts":"המבקש הורשע בבית משפט השלום בעבירת תקיפה. בערעורו לבית המשפט המחוזי בנצרת, בא-כוחו הודיע כי הוא מסתפק בהודעת הערעור בכתב, ולאחר שהוגשה תשובת המדינה, ביקש קיום דיון בעל-פה — בקשה שנדחתה ללא נימוק, וגם הערעור לגופו נדחה.","claimant":"המבקש טען כי בית המשפט המחוזי חייב אותו לטעון בכתב בלבד ושללה ממנו האפשרות להשמיע את דבריו בעל-פה, בניגוד לעיקרון הדיון בפני הנאשם.","respondent":"מפרוטוקול הדיון עלה כי המבקש עצמו בחר להסתפק בהודעת הערעור מבלי להוסיף דבר, וכי מתכונת הטיעון היתה על דעת הצדדים; ולמבקש ניתנה גם הזדמנות להגיב בכתב לתשובת המדינה אך הוא בחר שלא לעשות זאת.","question":"האם התנהלות בית המשפט המחוזי, שהסתפק בטיעון בכתב ודחה בקשה לדיון בעל-פה, פוגעת בעיקרון לפיו דיון פלילי מתקיים בנוכחות הנאשם ופוסלת את ההליך?","ruling":"הבקשה למתן רשות ערעור נדחתה — מפרוטוקול הדיון עלה כי המבקש עצמו בחר להסתפק בהודעת הערעור בכתב וכי לא נמנעה ממנו הזכות להגיב, ולכן לא נפל פגם בהליך.","halacha":"העיקרון המנחה הוא כי הדיון בערעור פלילי מתקיים בעל-פה ובנוכחות בעלי הדין (סעיף 208 לחסד\"פ), וסיכומים בכתב נועדו רק לסייע לבית המשפט להיערך לדיון ואינם יכולים לבוא במקום הטיעון בעל-פה; נוהג של טיעון בכתב בלבד בערעור פלילי חורג מהחוק ויש להימנע ממנו. עם זאת, כאשר מהפרוטוקול עולה כי הצדדים עצמם הסכימו למתכונת זו ולא נגרם עיוות דין, אין בכך עילה לביטול ההליך.","currency":"לא אומת עדכון מעבר למקורות הקורס"},{"name":"מדינת ישראל נגד רפי פרידן","cite":"רע\"פ 4207/96 (1997) — מפי השופט ש' לוין (המשנה לנשיא), בהסכמת השופט י' קדמי והשופטת ד' דורנר","facts":"בית משפט השלום נדרש לבקשה לעיון בחומר חקירה לפי סעיף 74 לחוק סדר הדין הפלילי. על החלטתו הוגש ערר לבית המשפט המחוזי, ולאחר החלטת בית המשפט המחוזי, ביקשה המדינה רשות לערער לבית המשפט העליון על החלטה זו.","claimant":"המדינה עתרה למתן רשות לערער לבית המשפט העליון על החלטת בית המשפט המחוזי שניתנה בערר על החלטת בית משפט השלום בעניין עיון בחומר חקירה.","respondent":"המשיב טען, ובית המשפט קיבל את עמדתו, כי לא קיימת הוראת חוק המסמיכה את בית המשפט העליון לדון בבקשת רשות ערעור על החלטה כאמור.","question":"האם קיימת זכות ערעור נוספת (רשות ערעור) לבית המשפט העליון על החלטת בית המשפט המחוזי, שניתנה בערר לפי סעיף 74(ה) לחוק סדר הדין הפלילי על החלטת בית משפט השלום בעניין עיון בחומר חקירה?","ruling":"הבקשה נדחתה — נקבע כי המדינה לא הצליחה להצביע על הוראת דין המסמיכה את בית המשפט העליון לדון בבקשה מסוג זה, ולכן בית המשפט אינו מוסמך לדון בה.","halacha":"אין זכות ערעור או זכות ערר אלא אם כן קבע המחוקק ערכאה המוסמכת לדון בהן. משסעיף 74(ה) לחוק סדר הדין הפלילי קבע רק זכות ערר אחת (לבית המשפט שלערעור, בשופט אחד) על החלטה לפי סעיף 74, ולא קבע זכות נוספת לבקש רשות ערעור לבית המשפט העליון, אין ערכאת הערעור-שברשות מוסמכת לדון בבקשה כזו.","currency":"לא אומת עדכון מעבר למקורות הקורס"},{"name":"מדינת ישראל נגד ינון בן רחמים","cite":"בש\"פ 433/98 (1998) — מפי השופט מ' חשין","facts":"המשיב נעצר עד תום ההליכים בעבירת שוד בנסיבות מחמירות. כעבור שנה הוארך מעצרו בשלושה חודשים נוספים בהסכמתו, ובתקופה זו הורשע על פי הודאתו, אך מתן גזר הדין נדחה לבקשתו. המדינה ביקשה כעת הארכת מעצר שניה נוספת בתשעים ימים, על רקע קשיי פרשנות בשינויי חקיקה בסוגיית הארכת מעצר לאחר תשעה חודשים.","claimant":"פרקליטות המדינה טענה שמיום מתן הכרעת הדין המרשיעה ואילך, אין עוד צורך בהארכות מעצר נפרדות: המעצר ממשיך מכוח הצו המקורי 'עד תום ההליכים', בין אם ניתנה הכרעת הדין בתוך תשעת חודשי המעצר הראשונים ובין לאחריהם.","respondent":"בטקסט לא מובאת עמדה משפטית נגדית מפורשת מטעם המשיב; המשיב הסכים הן להארכת המעצר הקודמת והן לבקשת ההארכה הנוכחית גופה.","question":"כיצד יש לפרש את סעיף 61 לחוק סדר הדין הפלילי (סמכויות אכיפה — מעצרים), תשנ\"ו-1996, ביחס להמשך מעצרו של נאשם שניתנה בעניינו הכרעת דין מרשיעה — בתוך תשעת חודשי המעצר הראשונים או לאחריהם?","ruling":"בית המשפט אימץ פרשנות המבחינה בין הכרעת דין הניתנת בתוך תשעת חודשי המעצר הראשונים לבין הכרעת דין הניתנת לאחריהם, והורה על הארכת מעצרו של המשיב בהתאם.","halacha":"נאשם שנעצר עד תום ההליכים וניתנה הכרעת דין מרשיעה במהלך תשעת חודשי המעצר הראשונים — מעצרו נמשך מכוח הצו המקורי, עד למתן גזר הדין, ואין צורך בצווי הארכת מעצר נפרדים. נאשם שהכרעת הדין בעניינו ניתנה רק לאחר תשעת החודשים — המשך מעצרו יימשך רק מכוח החלטה מפורשת של שופט בית המשפט העליון.","currency":"לא אומת עדכון מעבר למקורות הקורס"},{"name":"מאהר גבארה נגד מדינת ישראל","cite":"רע\"פ 4049/05 (2005) — מפי המשנה לנשיא מ' חשין","facts":"המבקש הורשע בבית המשפט לתעבורה בפתח-תקווה בעבירות נהיגה ללא רישיון ונהיגה ללא ביטוח, ונגזרו עליו קנס ופסילות. המדינה ערערה על קולת העונש, ובית המשפט המחוזי קיבל את הערעור והחמיר את העונש לחמישה חודשי מאסר בפועל. המבקש ביקש רשות ערעור לעליון וכן עיכוב ביצוע.","claimant":"המבקש טען כי מתעוררת שאלה בעלת חשיבות משפטית וציבורית המצדיקה רשות ערעור לערכאה שלישית; וכי בית המשפט המחוזי שגה בהתערבו בשיקול דעתו של בית המשפט לתעבורה ובהחמרת עונשו.","respondent":"על פי ההלכה הנוהגת (חניון חיפה), רשות ערעור לגלגול שלישי בפלילים שמורה למקרים המעוררים שאלה עקרונית החורגת מעניינם הפרטני של הצדדים, וטענות על חומרת עונש מצדיקות זאת רק במקרים חריגים ונדירים.","question":"האם יש להעניק למבקש רשות ערעור (בגלגול שלישי) על פסק דינו של בית המשפט המחוזי, שבו הוחמר עונשו בעקבות ערעור המדינה?","ruling":"הבקשה לרשות ערעור נדחתה, וכן נדחתה הבקשה לעיכוב ביצוע עונש המאסר.","halacha":"רשות ערעור לגלגול שלישי בפלילים תינתן רק כאשר מתעוררת שאלה משפטית עקרונית בעלת חשיבות כללית החורגת מעניינם הספציפי של בעלי הדין (הלכת חניון חיפה). טענות בדבר חומרת העונש או קולתו מקימות עילה לדיון בגלגול שלישי רק במקרים חריגים ונדירים.","currency":"לא אומת עדכון מעבר למקורות הקורס"},{"name":"פלוני נגד בית משפט השלום חיפה ומדינת ישראל","cite":"בג\"צ 10683/08 (2009) — מפי השופט א' רובינשטיין","facts":"העותר, המתמודד עם הליך פלילי בעבירת שהיה שלא כדין, ביקש מבית משפט השלום בחיפה לקיים את הדיונים בעניינו בדלתיים סגורות ותוך איסור פרסום שמו, בטענה לסכנת חיים ברשות הפלסטינאית. בית משפט השלום דחה את הבקשה. בג\"צ נתן צו ארעי, ולאחר מכן הודיעה המדינה כי אינה מתנגדת עתה לסגירת הדלתיים.","claimant":"קיום הדיון בפומבי פוגע בפרטיותו ובזכויותיו של העותר, ולנוכח נסיבותיו האישיות יש הצדקה לחרוג מעקרון פומביות הדיון ולקיימו בדלתיים סגורות.","respondent":"פומביות הדיון היא כלל יסוד חוקתי בשיטת המשפט הישראלית, המבטיח ביקורת ציבורית על מערכת המשפט; חריגה ממנו טעונה הצדקה כבדת משקל שאינה מתקיימת בנסיבות המקרה.","question":"כיצד יש להכריע בעתירה נגד החלטה שדחתה בקשה לסגירת דלתיים, משעה שהמדינה חדלה מהתנגדותה? ומהי הערכאה הנכונה להשיג על החלטה הדוחה בקשה לסגירת דלתיים — עתירה לבג\"צ או ערעור פלילי?","ruling":"העתירה נדחתה — לא נמצאה הצדקה מספקת לחרוג מעקרון הפומביות בנסיבות המקרה.","halacha":"אגב אורחא (מבלי לקבוע מסמרות) העיר בית המשפט כי בעוד שעל החלטה המקבלת בקשה לסגירת דלתיים חלה הוראת סעיף 74 לחוק בתי המשפט [נוסח משולב], הרי שעל החלטה הדוחה בקשה לסגירת דלתיים ניתן להשיג, ולדעת השופט רובינשטיין הדרך הראויה לכך היא לכאורה ערעור פלילי ולא עתירה לבג\"צ, שכן מדובר בהליך פרטני שמקומו הטבעי בבית המשפט הפלילי הדן בעיצומו של ההליך.","currency":"לא אומת עדכון מעבר למקורות הקורס"},{"name":"יגמור סאמר נגד מדינת ישראל, מחלקת חקירות מכס ומע\"מ","cite":"ע\"ח 5575-09-17 ו-16453-09-17 (מאוחדים), בית המשפט המחוזי מרכז-לוד (2017) — מפי השופט ארז יקואל","facts":"כנגד העורר התנהלה חקירה בחשד לעבירות מס ואיסור הלבנת הון בהיקף של כ-20 מיליון ש\"ח. נתפסו נכסיו, ובהם מספר כלי רכב, מכוח סעיף 32 לפקודת סדר הדין הפלילי (מעצר וחיפוש). בית משפט השלום הורה על הארכת צו ההחזקה ועל מכירת חלקם, ודחה בקשות להשבת רכב כנגד הפקדת בטוחה.","claimant":"העורר טען כי יש לשחרר לידיו את הרכבים כנגד הפקדת בטוחה של 30% מההפרש שבין שוויים לגובה ההלוואה הרובצת עליהם, וכי אין למכרם בטרם הוגש כתב אישום.","respondent":"המדינה טענה כי יש הצדקה להארכת ההחזקה ולמכירת התפוסים לשם שימור ערכם, כי גובה הבטוחה חייב להיגזר משווים המלא של הרכבים, וכי על מימוש התפוסים להתבצע על ידי יחידת החילוט ולא באמצעות כונס נכסים.","question":"האם רשאית המדינה למכור רכוש תפוס בטרם הוגש כתב אישום כדי לשמר את ערכו; מהו שיעור הבטוחה הנדרש לשחרור רכב תפוס; ומי הגורם הראוי למימוש התפוסים?","ruling":"הערר התקבל בחלקו — מכירת הרכבים הושהתה עד להגשת כתב אישום, טענת העורר לגבי גובה הבטוחה נדחתה, ונקבע כי מימוש הרכבים ייעשה באמצעות המדינה ולא באמצעות הכונס.","halacha":"תפיסת רכוש ומכירתו בטרם הוגש כתב אישום פוגעים בזכות הקניין ובחזקת החפות, ולכן יינתנו במשורה ורק כשקיים פער משמעותי בין שווי העבירות לשווי התפוסים. גובה ההפקדה הנדרש לשחרור רכב תפוס נגזר משוויו המלא (ולא מן ההפרש מהלוואה מובטחת), על מנת להבטיח את יכולת החילוט העתידית; שיעור של כ-30% משווי הרכב נחשב מידתי. ככלל, על המדינה — ולא כונס נכסים מטעם נושה מובטח — למכור תפוסים המוחזקים במסגרת הליך פלילי.","currency":"לא אומת עדכון מעבר למקורות הקורס"},{"name":"עמי פופר נגד מדינת ישראל","cite":"ע\"פ 1742/91, פ\"ד נא(5) 289 (1997) — לפני הנשיא ברק והשופטים חשין ודורנר, פסק דין מפי השופטת ד' דורנר","facts":"המערער הורשע ברצח שבעה פועלים ערבים וניסיון לרצח עשרה נוספים, לאחר שארב להם וירה בהם אש אוטומטית ממושכת. נגזרו עליו שבעה עונשי מאסר עולם במצטבר ועוד עשרים שנות מאסר. המערער טען שמעשיו נבעו ממחלת נפש שמקורה בטראומת אונס. חוות דעת פסיכיאטריות קבעו כי הוא כשיר לעמוד לדין ואינו סובל ממחלת נפש. המערער ביקש לצרף בערעור שלוש חוות דעת פסיכיאטריות נוספות.","claimant":"המערער טען כי פעל מתוך התקף פסיכוטי ואיבוד כושר ריסון, ולכן אינו נושא באחריות פלילית מלאה, או זכאי להקלה לפי סעיף 300א(א) לחוק העונשין; וכי מעשה הירי מהווה אירוע אחד רציף ולא ניתן לגזור עליו שבעה עונשי מאסר עולם מצטברים.","respondent":"המדינה טענה כי חוות הדעת שהוגשו בערכאה קמא קבעו חד-משמעית שהמערער כשיר ואינו סובל ממחלת נפש, וכי משבוצעו שבעה מעשי רצח נפרדים כלפי קורבנות שונים, מוצדק לגזור על כל אחד עונש מאסר עולם נפרד ומצטבר.","question":"האם רשאי בית משפט לערעורים להתיר הגשת ראיות פסיכיאטריות נוספות; האם נשא המערער באחריות פלילית מלאה או שמא מתקיימים תנאי ההקלה לפי סעיף 300א(א); והאם רצף ירי שגרם למותם של קורבנות אחדים מהווה עבירת רצח אחת או עבירות נפרדות?","ruling":"הערעור נדחה. הבקשה לצירוף חוות הדעת הנוספות נדחתה. נקבע כי המערער נשא באחריות פלילית מלאה, לא התקיימו תנאי סעיף 300א(א), וכי כל הרוג מהווה מעשה רצח בפני עצמו — ולכן אין פגם בשבעה עונשי מאסר עולם במצטבר.","halacha":"בית משפט של ערעור רשאי לקבל ראיות נוספות שלא הובאו קמא רק כאשר הדבר דרוש ל'עשיית צדק', בשקילת: האם ניתן היה להשיג את הראיה קודם; האינטרס שבסופיות הדיון; ומשקלה של הראיה. סערת נפש עשויה להחליש מעצורים, אך כל עוד לא נשלל כושר ההבנה או ההחלטה, האדם נושא באחריות פלילית מלאה; סעיף 300א(א) דורש הפרעה נפשית חמורה, ואינו מתקיים בהפרעת אישיות בלבד. כאשר אדם פוגע בקורבנות אחדים, אף במסגרת רצף מעשים פיזי אחד, פגיעה בקורבנות אחדים (שלכל אחד אינטרס עצמאי לחייו) מהווה עבירות נפרדות המצדיקות עונשי מאסר עולם נפרדים ומצטברים.","currency":"לא אומת עדכון מעבר למקורות הקורס"},{"name":"יונה יהב נגד פרקליטות המדינה","cite":"בג\"צ 2534/97 ואוחדים (1997) — פסק דין מפי השופט א' גולדברג (דעת רוב: גולדברג, אור, לוין, זמיר; דעת מיעוט: השופטת ד' דורנר)","facts":"בעקבות כתבה טלוויזיונית שהעלתה חשדות סביב מינויו של עו\"ד רוני בר-און ליועץ המשפטי לממשלה (\"פרשת בר-און–חברון\"), נפתחה חקירה משטרתית. חרף המלצת המשטרה להגיש כתבי אישום נגד ראש הממשלה ושר המשפטים, החליט היועץ המשפטי לממשלה לסגור את התיקים מחוסר ראיות מספיקות. חברי כנסת עתרו לבג\"צ נגד ההחלטה שלא להעמיד לדין.","claimant":"העותרים טענו כי החלטת היועץ המשפטי לממשלה לוקה בחוסר סבירות קיצונית, וכי הראיות הצדיקו הגשת כתב אישום בעבירת הפרת אמונים.","respondent":"פרקליטת המדינה והיועץ המשפטי לממשלה טענו כי אף שהראיות הנסיבתיות מעוררות חשד ממשי, אין בהן די להוכחה מעבר לספק סביר כנדרש להרשעה, ולכן אין סיכוי סביר להרשעה המצדיק הגשת כתב אישום.","question":"מהו מבחן דיות הראיות הנדרש לצורך העמדה לדין לפי סעיף 62 לחוק סדר הדין הפלילי, ובאיזה היקף רשאי בג\"צ להתערב בהחלטת היועץ המשפטי לממשלה שלא להגיש כתב אישום?","ruling":"העתירות נדחו ברוב דעות. נקבע כי המבחן הנכון הוא 'אפשרות סבירה להרשעה', וכי החלטת היועץ המשפטי לממשלה מצויה במתחם הסבירות הרחב, ולכן אין עילה להתערבות שיפוטית.","halacha":"תובע יגיש כתב אישום רק כאשר קיים 'סיכוי סביר להרשעה' — הסתברות סבירה שבית המשפט יפסוק שאין ספק סביר באשמת הנאשם. עקרון השוויון בפני החוק מחייב הפעלת אותה אמת-מידה כ
