topic":"packer","status":"קיים — טרם הושלם אימות פרטני","lesson":"1","extra":false},{"q":"על פי סעיף 184 לחסד״פ, אילו תנאים מצטברים הדגיש המרצה להרשעה בעבירה אחרת שהתגלתה מן העובדות?","opts":["שהעבירה האחרת חמורה יותר ושנמסרה הודעה לתביעה","הזדמנות סבירה להתגונן; ואיסור להטיל עונש חמור מזה שהיה אפשר להטיל בעבירה המקורית","הסכמת הנאשם בלבד","שהעבירה האחרת הופיעה מראש בכתב האישום"],"correct":1,"explain":"בשיעור 1 הוצגו שני תנאים מצטברים: הזדמנות סבירה להתגונן, והגבלת חומרת העונש. בפרשת דמיאניוק המוקד היה בתנאי הראשון.","id":"mcq-13","topic":"sec184","status":"אומת מול הקלטת שיעור 1","lesson":"1","extra":false,"source":"שיעור 1.mp3 — סעיף 184"},{"q":"מה קורה כאשר בית המשפט המחוזי מוסמך לדון בנאשם אחד מתוך כתב אישום משותף, ואילו נאשם אחר מואשם רק בעבירות שבסמכות בית משפט השלום?","opts":["התיק כולו מפוצל אוטומטית לשני בתי משפט","המחוזי רוכש סמכות \"נגררת\" לדון גם בנאשם השני (הלכת סוסן)","הנאשם השני זכאי לזיכוי אוטומטי","יש צורך באישור היועמ\"ש לדיון משותף"],"correct":1,"explain":"הלכת סוסן קובעת שכאשר למחוזי סמכות עניינית לגבי נאשם אחד בכתב אישום משותף, הוא רוכש סמכות נגררת לדון גם ביתר הנאשמים, למניעת פיצול הליכים.","id":"mcq-14","topic":"joinder","status":"קיים — טרם הושלם אימות פרטני","lesson":"4","extra":false},{"q":"מהי \"עילת הזהב\" מבין עילות סגירת התיק לפי סעיף 62?","opts":["חוסר ראיות מספיקות","נסיבות העניין בכללותן","חוסר אשמה — מביאה למחיקה מוחלטת ומיידית של הרישום","חוסר סמכות עניינית"],"correct":2,"explain":"עילת חוסר אשמה נחשבת \"עילת הזהב\" משום שהיא מביאה למחיקה מוחלטת ומיידית של הרישום המשטרתי, בשונה משתי העילות האחרות שמותירות רישום פנימי.","id":"mcq-15","topic":"closure","status":"קיים — טרם הושלם אימות פרטני","lesson":"2","extra":false},{"q":"בעבירת פשע רגילה, מהו תפקיד \"התקופה הנוספת\" לפי ההסבר בשיעור 7?","opts":["היא חלה על כל אירוע מנתק ללא הבחנה","היא רלוונטית רק כאשר האירוע המנתק הוא פעולת חקירה","היא מבטלת כל התיישנות בעבירות פשע","היא חלה רק לאחר גזר הדין"],"correct":1,"explain":"המרצה הדגיש שהמנגנון נוגע לאירוע מנתק מסוג פעולת חקירה בלבד, ולא לכתב אישום או להליך מטעם בית המשפט. טבלת ההארכות עצמה הוצאה מחומר הבחינה.","id":"mcq-16","topic":"limitations-pointer","status":"תוקן ואומת","lesson":"6","extra":false,"source":"שיעור 7 ערוך.mp3 — דברי המרצה בתחילת הדיון בהתיישנות"},{"q":"איזו קביעה תואמת את ההנחיה המפורשת בשיעור 7 לגבי בחינה?","opts":["יש ללמוד את טבלת ההארכות בעבירות מין בקטינים","נושא התיישנות עבירות המין בקטינים וטבלת ההארכות אינם חלק מחומר הבחינה","אין התיישנות לעבירות מין בקטינים בכל מצב","התיישנות עבירות מין בקטינים נלמדת רק בשיעור 8"],"correct":1,"explain":"המרצה הורה להתעלם מן השקפים בנושא זה לצורך הבחינה ולהוציא גם את טבלת ההארכות מחומר הלימוד.","id":"mcq-17","topic":"limitations-pointer","status":"תוקן ואומת","lesson":"6","extra":false,"source":"שיעור 7 ערוך.mp3 — דברי המרצה בתחילת הדיון בהתיישנות"},{"q":"נאשם ערער על חומרת עונשו בלבד (המדינה לא ערערה). בערעור התגלה שביצע עבירה חמורה יותר מזו שהורשע בה. מה רשאי בית המשפט שלערעור לעשות?","opts":["להרשיע בעבירה החמורה ולהחמיר בעונש כרצונו","להרשיע בעבירה החמורה (סעיף 216), אך לא להחמיר בעונש מעבר למה שנגזר במקור","לא לגעת בתיק כלל, כי הנאשם הוא היחיד שערער","לבטל את כתב האישום אוטומטית"],"correct":1,"explain":"סעיף 216 מתיר הרשעה בעבירה שהתגלתה מהעובדות, ובלבד שניתנה הזדמנות סבירה להתגונן. אך סעיף 217 קובע שבערעור שהגיש הנאשם על חומרת העונש, בית המשפט לא יחמיר — ההחמרה אפשרית רק אם המדינה ערערה על קולת העונש.","id":"mcq-18","topic":"appeals","status":"קיים — טרם הושלם אימות פרטני","lesson":"8","extra":false},{"q":"מהו ההבדל בין טענת \"סיכון כפול\" לטענת \"כבר נשפטתי\" לפי סעיף 5 לחסד\"פ?","opts":["אין הבדל, מדובר באותה טענה","\"כבר נשפטתי\" מבוססת על מעשה בית-דין; \"סיכון כפול\" מבוססת על כך שאין להעמיד אדם פעמיים בסיכון הרשעה, גם אם ההליך הקודם לא הסתיים בפסק דין","\"סיכון כפול\" חלה רק בעבירות מס","\"כבר נשפטתי\" חלה רק בערעור"],"correct":1,"explain":"טענת \"כבר נשפטתי\" (סעיף 5) דורשת זיכוי או הרשעה קודמים בפועל (מעשה בית-דין). טענת \"סיכון כפול\" רחבה יותר עקרונית אך נדירה מאוד בפועל — היא נטענת כשההליך הקודם הופסק באמצע בלי שהסתיים בפסק דין, ובתי המשפט תמיד דחו אותה לגופה עד כה.","id":"mcq-19","topic":"double-jeopardy-justice","status":"קיים — טרם הושלם אימות פרטני","lesson":"6","extra":false},{"q":"עבירת חטא בוצעה ב־1.1.2023. בהנחה שאין תקופה שיש לגרוע מהמניין, מהו המועד כעבור שנת ההתיישנות הבסיסית?","opts":["1.1.2024","1.1.2025","1.8.2024","אין התיישנות לחטא"],"correct":0,"explain":"שנה מ־1.1.2023 היא 1.1.2024. לפי ההסבר בשיעור 7, פעולת חקירה אינה מאפסת את מניין ההתיישנות בחטא.","id":"mcq-20","topic":"limitations-pointer","status":"תוקן ואומת","source":"שיעור 7 ערוך.mp3 — דברי המרצה בתחילת הדיון בהתיישנות","lesson":"6","extra":false},{"q":"בכתב אישום אחד נגד שני נאשמים, אחד הודה והאחר כופר. מהו הכלל שנלמד בשיעור 7?","opts":["גוזרים מיד את דינו של המודה","לא גוזרים את דין המודה לפני סיום בירור משפטו של מי שלא הודה","מוחקים את כתב האישום נגד מי שהודה","מפצלים תמיד את כתב האישום"],"correct":1,"explain":"סעיף 155 הוצג בהקלטה ככלל של דחיית גזר הדין של מי שהודה עד לסיום בירור משפטם של מי שלא הודו. ההסבר שניתן: לאפשר לבית המשפט לראות את התמונה הכוללת ואת חלקו של כל נאשם.","id":"mcq-21","topic":"multi-defendants","status":"תוקן ואומת","lesson":"7","extra":false,"source":"שיעור 7 ערוך.mp3 — דברי המרצה"},{"q":"חשוד הועמד לדין בעבירה שעונשה המרבי 3 שנות מאסר בדיוק, במסגרת כתב אישום משותף עם נאשם נוסף שהעבירה שיוחסה לו היא בסמכות המחוזי. איזה בית משפט ידון בעניינו של הראשון?","opts":["בית משפט השלום בלבד, כי עבירתו היא עוון","בית המשפט המחוזי, מכוח סמכות נגררת (הלכת סוסן)","יש לפצל את הדיון בין שני בתי המשפט","אין לבית משפט כלשהו סמכות לדון בו"],"correct":1,"explain":"עבירה בעונש מרבי של בדיוק 3 שנים מסווגת כעוון (סעיף 24), הנתון עקרונית לסמכות השלום. אך מכוח הלכת סוסן, כשלמחוזי סמכות עניינית לגבי נאשם אחד בכתב אישום משותף, הוא רוכש סמכות נגררת לדון גם בנאשם השני — גם אם עבירתו הפרטנית בסמכות השלום.","id":"mcq-22","topic":"joinder","status":"קיים — טרם הושלם אימות פרטני","lesson":"4","extra":false},{"q":"חשוד נחקר וזוכה בעבר מעבירת גניבה מסוימת. כעבור שנתיים מתגלות ראיות חדשות, והתביעה מבקשת להעמידו לדין שוב על אותה גניבה בדיוק. מה הדין?","opts":["מותר, כי יש ראיות חדשות","אסור — סעיף 5 לחסד\"פ אוסר דיון חוזר על מעשה שממנו זוכה, למעט חריג מצומצם של מוות מאוחר לקורבן","מותר רק באישור היועמ\"ש","אסור לחלוטין, ואף לא ניתן לפתוח חקירה חדשה בעתיד על עבירה אחרת"],"correct":1,"explain":"סעיף 5 לחסד\"פ קובע איסור עקרוני לדון באדם על מעשה שממנו כבר זוכה, כטענה מקדמית עצמאית — ללא קשר לגילוי ראיות חדשות. החריג היחיד הוא מקרה מוות מאוחר של הקורבן.","id":"mcq-23","topic":"double-jeopardy-justice","status":"קיים — טרם הושלם אימות פרטני","lesson":"6","extra":false},{"q":"טרם הוגש כתב אישום והוצע לחשוד הסדר מותנה. מדוע יש לאפשר לו עיון בחומר החקירה ובטיוטת האישום?","opts":["כדי שיוכל להחליט באופן מושכל אם להסכים להסדר ולהודות בעובדות","משום שכל חשוד זכאי תמיד לכל תיק החקירה מיד עם פתיחתו","משום שכבר הורשע בבית המשפט","אין לו אפשרות לעיין לפני החתימה בשום מקרה"],"correct":0,"explain":"זו זכות עיון במסגרת ההסדר המוצע לפני אישום, שנועדה לאפשר בחינה של הראיות וההסכמה. אין לבלבל אותה עם העיון הרגיל של נאשם לאחר הגשת אישום לפי סעיף 74. השאלה הקודמת הציעה מסלול תקיפה שלא אומת והוחלפה.","id":"mcq-24","topic":"conditional","status":"הוחלף ניסוח לא מבוסס בתרגיל מההרצאה","lesson":"3","extra":false,"source":"שיעור 3.mp3 — הסבר המרצה על סגירת תיק בהסדר, תנאי הסף והעיון לפני חתימה"},{"q":"מה משותף לסעיף 167 לחסד\"פ (הבאת ראיות מיוזמת בית המשפט) ולהלכת יששכרוב (פסילת ראיות)?","opts":["שניהם עוסקים בסמכות מעצר","שניהם דוגמאות למתח בין חשיפת האמת/יעילות לבין זכויות והגינות ההליך, ומעניקים לבית המשפט שיקול דעת ולא כלל נוקשה","אין ביניהם שום קשר","שניהם חלים רק בבית המשפט העליון"],"correct":1,"explain":"סעיף 167 מבטא נסיגה אינקוויזיטורית לטובת חשיפת האמת, ופסילה פסיקתית יחסית (יששכרוב) מבטאת איזון בין מיגור פשיעה להליך ראוי — בשני המקרים לבית המשפט שיקול דעת רחב, לא כלל אוטומטי.","id":"mcq-25","topic":"adversarial","status":"קיים — טרם הושלם אימות פרטני","lesson":"1","extra":false},{"q":"פרקליט המחוז החליט לחרוג מחלוקת העבודה הרגילה בין הפרקליטות לתביעה המשטרתית (סעיף 60(יא)). כעבור זמן, במהלך המשפט, מבקשת התביעה לתקן את כתב האישום כדי להוסיף עבירה חמורה יותר. מה משותף לשני המצבים מבחינת תוצאת החריגה?","opts":["שניהם פוסלים אוטומטית את ההליך","בשניהם יש לבחון את תנאי הדין ואת הפגיעה בהגנה; לא כל חריגה טכנית מבטלת את ההליך","שניהם דורשים אישור בית המשפט העליון","אין ביניהם שום קשר עקרוני"],"correct":1,"explain":"בשני המקרים החוק מאפשר גמישות (חריגה מחלוקת עבודה; תיקון כתב אישום), ובשניהם המבחן המכריע הוא אם נגרם עיוות דין/נפגעה הזדמנות סבירה להתגונן — לא פגם טכני כשלעצמו.","id":"mcq-26","topic":"amend","status":"קיים — טרם הושלם אימות פרטני","lesson":"4","extra":false},{"q":"מהו ההבדל המהותי בין \"עיכוב\" ל\"מעצר\" לפי חוק המעצרים?","opts":["אין הבדל, אלו מונחים נרדפים","עיכוב הוא הגבלת חירות קלה ומתוחמת בזמן/במקום; מעצר הוא שלילת חירות מלאה","עיכוב חל רק על עדים, מעצר חל רק על חשודים","עיכוב דורש צו שופט, מעצר לא"],"correct":1,"explain":"עיכוב הוא הגבלה קלה ומתוחמת (לבירור/חקירה במקום, עד 3 שעות ובנסיבות מסוימות 6 שעות), בעוד מעצר הוא שלילת חירות מלאה. כלל הברזל: לא ייעצר אדם אם ניתן להסתפק בעיכוב.","id":"mcq-27","topic":"arrest-basics","status":"קיים — טרם הושלם אימות פרטני","lesson":"extra","extra":true},{"q":"שוטר רוצה לעצור חשוד ללא צו שופט לפי סעיף 23(א) לחוק המעצרים. אילו תנאים נדרשים במצטבר?","opts":["חשד סביר בלבד, ללא צורך בעילה נוספת","יסוד סביר לחשד שהאדם עבר עבירה שאינה חטא, וגם התקיימות עילת מעצר סטטוטורית (למשל חשש לשיבוש הליכים)","אישור בעל פה מהתובע התורן בלבד","רק אם העבירה היא פשע חמור"],"correct":1,"explain":"סעיף 23(א) דורש שני תנאים מצטברים: (1) יסוד סביר לחשד בעוון/פשע (לא חטא), וגם (2) עילת מעצר סטטוטורית — כגון חשש לשיבוש הליכים, סכנה לציבור, או חזקת מסוכנות.","id":"mcq-28","topic":"arrest-nowarrant","status":"קיים — טרם הושלם אימות פרטני","lesson":"extra","extra":true},{"q":"מהי תכליתו של \"מעצר גישור\" לפי סעיף 17(ד) לחוק המעצרים?","opts":["לאפשר לתביעה להמשיך בחקירה עוד מספר ימים","לגשר על פרק הזמן הדרוש לניסוח כתב האישום והבקשה למעצר עד תום ההליכים, ולא להמשך חקירה","להאריך את המעצר ללא הגבלת זמן","לאפשר לחשוד להתייעץ עם משפחתו"],"correct":1,"explain":"מעצר גישור (עד 5 ימים) נועד אך ורק לגישור על הזמן הדרוש להכנת כתב האישום ובקשת המעצר עד תום ההליכים — לא להמשך חקירה (הלכת אלטויל), והוא כפוף לתקרת ימי המעצר הרגילה.","id":"mcq-29","topic":"arrest-bridge","status":"קיים — טרם הושלם אימות פרטני","lesson":"extra","extra":true},{"q":"מהי ההגדרה המקובלת ל\"ראיות לכאורה\" הנדרשות למעצר עד תום ההליכים (הלכת זאדה)?","opts":["ראיות שמוכיחות אשמה מעבר לספק סביר, כמו בהרשעה","ראיות גולמיות שקיים לגביהן סיכוי סביר שיהפכו בסוף ההליך לראיות שעל בסיסן ניתן להרשיע, מבלי שבית המשפט קובע מהימנות בשלב זה","כל מסמך שהוגש על ידי התביעה, ללא בחינה","עדות של שוטר אחד בלבד, תמיד מספיקה"],"correct":1,"explain":"הלכת זאדה (השופט ברק) קבעה שראיות לכאורה הן ראיות גולמיות בעלות סיכוי סביר להפוך לראיות מרשיעות — בית המשפט אינו קובע מהימנות בשלב המעצר, אלא אם נפער \"חור שחור\" מהותי בחומר הראיות.","id":"mcq-30","topic":"arrest-pending","status":"קיים — טרם הושלם אימות פרטני","lesson":"extra","extra":true},{"q":"נאשם בעבירת רכוש חמורה (לא אלימות) מתבקש להיעצר עד תום ההליכים רק בשל חומרת העבירה וריבוי מקרים דומים (\"מכת מדינה\"). האם די בכך?","opts":["כן, חומרת העבירה וההיקף התופעתי מספיקים כעילת מעצר עצמאית","לא — לפי הלכת גנימאת, חומרת העבירה כשלעצמה אינה עילת מעצר עצמאית; יש לבחון מסוכנות אישית וחלופת מעצר","כן, אך רק אם מדובר בעבירת ביטחון","לא, אין כלל אפשרות לעצור בעבירות רכוש"],"correct":1,"explain":"הלכת גנימאת (דיון נוסף, שמגר וברק) קבעה שחומרת העבירה או היותה \"מכת מדינה\" אינן עילת מעצר עצמאית — חובה חוקתית לבחון את מסוכנותו האישית של הנאשם הספציפי ואת קיומה של חלופת מעצר.","id":"mcq-31","topic":"arrest-pending","status":"קיים — טרם הושלם אימות פרטני","lesson":"extra","extra":true},{"q":"נאשם נתון במעצר עד תום ההליכים 9 חודשים מאז הגשת כתב האישום, וטרם ניתנה הכרעת דין. מה הדין?","opts":["הוא ממשיך להיות עצור ללא הגבלה עד תום המשפט","קמה לו זכות עקרונית לשחרור לפי סעיף 61, אלא אם שופט עליון מאריך את המעצר (בד\"כ בפרקי זמן של 90 יום)","הוא משתחרר אוטומטית ולא ניתן להאריך בשום מקרה","הספירה מתחילה מיום המעצר הראשוני, גם אם קדם להגשת כתב האישום"],"correct":1,"explain":"סעיף 61 קובע שחלוף 9 חודשים ממעצר לאחר כתב אישום ללא הכרעת דין מקים זכות עקרונית לשחרור — אך שופט עליון (בהלכת איבדיוב, המונה מיום הגשת כתב האישום בלבד) רשאי להאריך, בדרך כלל בפרקי זמן של 90 יום.","id":"mcq-32","topic":"arrest-release","status":"קיים — טרם הושלם אימות פרטני","lesson":"extra","extra":true},{"q":"במעצר עד תום ההליכים, מה קורה אם הנאשם אינו מיוצג ואינו מוותר על ייצוג?","opts":["בית המשפט יכול לעצור אותו ללא הגבלת זמן עד שימצא סנגור בעצמו","ניתן לעצור לתקופות של עד 7 ימים בכל פעם ועד 30 יום סה\"כ, שבמהלכם ימונה סנגור מטעם הסנגוריה הציבורית","המשפט לא יכול להתחיל כלל","התנאי של ייצוג אינו רלוונטי למעצר עד תום ההליכים"],"correct":1,"explain":"ייצוג הוא אחד מארבעת התנאים המצטברים למעצר עד תום ההליכים (סעיף 21). נאשם שאינו מיוצג ואינו מוותר — ניתן לעצור עד 7 ימים בכל פעם, עד 30 יום סה\"כ, שבמהלכם תמונה לו סנגוריה ציבורית.","id":"mcq-33","topic":"arrest-pending","status":"קיים — טרם הושלם אימות פרטני","lesson":"extra","extra":true},{"q":"מהו רף ההוכחה הנדרש במשפט האזרחי לעומת המשפט הפלילי?","opts":["זהה בשני המקרים — מעבר לספק סביר","אזרחי: מאזן הסתברויות (מעל 50%, הלכה: 51%). פלילי: מעבר לספק סביר, ללא מספר מוגדר בפסיקה","אזרחי: מעבר לספק סביר. פלילי: מאזן הסתברויות","אין רף הוכחה קבוע באף אחד מהמקרים"],"correct":1,"explain":"במשפט האזרחי הרף הוא מאזן ההסתברויות (מעל 50%, עם הלכה המצמידה את המספר 51%). במשפט הפלילי הרף הוא מעבר לכל ספק סביר — מבחן איכותי, ללא אחוז מוגדר בפסיקה.","id":"mcq-34","topic":"circles","status":"קיים — טרם הושלם אימות פרטני","lesson":"1","extra":false},{"q":"מה חייב להיכלל בפרק העובדות בכתב האישום, ומה אסור לכלול בו?","opts":["עובדות בלבד; אסור לצרף ראיות גולמיות או עדויות","רק סעיפי החוק הרלוונטיים","רשימת כל הראיות שבידי התביעה","תמצית טיעוני הסנגור מראש"],"correct":0,"explain":"פרק העובדות בכתב האישום (סעיף 85) כולל תיאור עובדתי של העבירה בלבד. חל איסור מוחלט לצרף אליו ראיות גולמיות או עדויות — אלו יובאו בנפרד במהלך המשפט.","id":"mcq-35","topic":"structure","status":"קיים — טרם הושלם אימות פרטני","lesson":"4","extra":false},{"q":"מתי הופך אדם ממעמד \"חשוד\" למעמד \"נאשם\"?","opts":["ברגע שהוא נעצר לראשונה","ברגע שהוגש נגדו כתב אישום רשמית למזכירות בית המשפט","ברגע שהתביעה מחליטה להעמידו לדין, גם אם טרם הוגש כתב אישום","רק לאחר תשובתו לכתב האישום"],"correct":1,"explain":"המעבר ממעמד חשוד למעמד נאשם הוא פעולה טכנית וברורה: ברגע שכתב האישום מוגש רשמית למזכירות בית המשפט, הוא הופך מיידית ל\"נאשם\" — לא לפני כן.","id":"mcq-36","topic":"defendant","status":"קיים — טרם הושלם אימות פרטני","lesson":"5","extra":false},{"q":"נאשם נשאל לתשובתו לכתב האישום ובחר לשתוק, בלי לכפור ובלי להודות. מה המשמעות הראייתית?","opts":["השתיקה חסרת כל משמעות ראייתית","השתיקה עשויה לשמש חיזוק לראיות התביעה","השתיקה שקולה להודאה מלאה בעובדות","השתיקה מחייבת זיכוי אוטומטי"],"correct":1,"explain":"לפי סעיף 152, הימנעות מהשבה לאישום (שתיקה) עשויה לשמש חיזוק למשקל ראיות התביעה — אף שאינה שקולה להודאה, ואינה חסרת משמעות ראייתית.","id":"mcq-37","topic":"defendant-response","status":"קיים — טרם הושלם אימות פרטני","lesson":"6","extra":false},{"q":"מהי תכלית ה\"הסכמה בדבר עובדות וראיות\" לפי סעיף 144 לחסד\"פ?","opts":["לחייב את הנאשם להודות בכל האישומים","לחסוך זימון עדים טכניים לעובדות ומסמכים שאינם שנויים במחלוקת, ולמקד את הדיון בליבת המחלוקת","לבטל את זכות הנאשם לחקור עדי תביעה","להחליף לחלוטין את שלב הראיות במשפט"],"correct":1,"explain":"סעיף 144 מאפשר לצדדים המיוצגים להסכים על עובדות או קבילות מסמכים/מוצגים שאינם שנויים במחלוקת מהותית — כך נחסך זימון עדים טכניים (כגון שוטר שערך דוח), והדיון מתמקד בשאלות האמיתיות השנויות במחלוקת.","id":"mcq-38","topic":"reading","status":"קיים — טרם הושלם אימות פרטני","lesson":"5","extra":false},{"q":"מהי המשמעות של טענת \"אין להשיב לאשמה\" בסיום פרשת התביעה?","opts":["הנאשם מודה בעובדות","הטענה היא שהתביעה לא הוכיחה אפילו לכאורה את רכיבי העבירה","היא מחייבת את התביעה לסכם בכתב","היא מבטלת אוטומטית את כתב האישום"],"correct":1,"explain":"כך הוצגה הטענה בשיעור. המרצה אף הזהיר מהשיקול האסטרטגי בהעלאתה: אם תידחה, השופט כבר קבע שקיימת תשתית ראשונית.","id":"mcq-39","topic":"trial-conduct","status":"תוקן ואומת","lesson":"7","extra":false,"source":"שיעור 7 ערוך.mp3 — דברי המרצה"},{"q":"נאשם בחר להעיד בפרשת ההגנה. מהו סדר העדות שנלמד בשיעור 7?","opts":["הוא רשאי להעיד רק אחרי כל עדי ההגנה","עדותו נשמעת תחילה בפרשת ההגנה","הוא חייב להעיד בפרשת התביעה","אסור לו להעיד במשפטו"],"correct":1,"explain":"המרצה הסביר שהנאשם שמעיד עושה זאת תחילה בפרשת ההגנה, כדי שלא יתאים בדיעבד את גרסתו לעדי הגנה ששמע לפניו.","id":"mcq-40","topic":"trial-conduct","status":"תוקן ואומת","lesson":"7","extra":false,"source":"שיעור 7 ערוך.mp3 — דברי המרצה"},{"q":"מהם שלושת שלבי קביעת העונש לפי סעיפים 40ג–40טו לחוק העונשין?","opts":["קביעת עונש מקסימלי בלבד, ללא שלבים נוספים","(1) קביעת מתחם עונש הולם, (2) אפשרות חריגה ממנו לקולא/לחומרא, (3) קביעת העונש הסופי בתוך המתחם","רק בחינת עברו הפלילי של הנאשם","הכרעה לפי שיקול דעת שרירותי של השופט בלבד"],"correct":1,"explain":"שלושת השלבים: (1) קביעת מתחם עונש הולם לפי חומרת הפגיעה בערך החברתי; (2) אפשרות חריגה — לקולא משיקולי שיקום, או לחומרא להגנה על הציבור; (3) קביעת העונש הסופי בתוך המתחם, לפי נסיבות שאינן קשורות לביצוע העבירה.","id":"mcq-41","topic":"sentencing","status":"קיים — טרם הושלם אימות פרטני","lesson":"8","extra":false},{"q":"מהו סדר הסיכומים שנלמד בשיעור 8?","opts":["הנאשם ואחריו התובע","התובע ואחריו הנאשם, שלו נשמרת המילה האחרונה","בית המשפט מסכם לבדו","הצדדים מסכמים במקביל"],"correct":1,"explain":"המרצה הדגיש כי התובע מסכם תחילה והנאשם אחריו; לנאשם זכות המילה האחרונה.","id":"mcq-42","topic":"verdict-sentence","status":"תוקן ואומת","lesson":"8","extra":false,"source":"שיעור8 ערוך.mp3 — דברי המרצה"},{"id":"mcq-43","topic":"verdict-sentence","q":"מתי אפשר להביא ראיה חדשה גם לאחר הכרעת הדין, לפי ההסבר בשיעור 8?","opts":["בכל פעם שאחד הצדדים מבקש","רק בנסיבות נדירות וחריגות: ראיה חדשה שלא הייתה בהישג יד ונדרשת לעשיית צדק ולמניעת עיוות דין","רק אם הנאשם מודה","לעולם לא"],"correct":1,"explain":"כך תחם המרצה את החריג. אין להפוך אותו להזדמנות לתיקון מחדל ראייתי של צד.","source":"שיעור8 ערוך.mp3 — דברי המרצה","status":"תוקן ואומת","lesson":"8","extra":false},{"id":"mcq-44","topic":"reading","q":"מהי התוצאה לפי סעיף 77(א) אם לנאשם או לסנגורו לא ניתנה הזדמנות סבירה לעיין בראיה או בהודעת העד?","opts":["התובע רשאי להגיש אותה תמיד","התובע אינו רשאי להגיש את הראיה או להשמיע את העד, אלא אם ויתרו על העיון","כתב האישום נמחק אוטומטית","הראיה עוברת לעיון בית המשפט בלבד"],"correct":1,"explain":"זהו הסייג להבאת ראיות מטעם התובע שנלמד במצגת 2.","source":"דיון פלילי - מצגת שניה - 234524.PDF","status":"נוסף ואומת","lesson":"2","extra":false},{"id":"mcq-45","topic":"appeals","q":"נאשם זוכה, אך אינו מרוצה מאמירה עובדתית עליו בנימוקי פסק הדין. מה ההבחנה שהמרצה הדגיש?","opts":["כל אמירה מקימה זכות ערעור עצמאית","אין לנאשם זכות ערעור רגילה על זיכויו רק כדי לשנות את הנימוקים","עליו להודות מחדש","הזיכוי מתבטל מעצמו"],"correct":1,"explain":"בשיעור 8 הופרדה פגיעה מהתוצאה מפגיעה מהנמקה בלבד. הזיכוי אינו מקנה לנאשם מסלול ערעור רגיל רק כדי לתקן אמירות.","source":"שיעור8 ערוך.mp3 — דיון בסיום המשפט ובערעור","status":"נוסף על בסיס מקור שנבדק","lesson":"8","extra":false},{"id":"mcq-46","topic":"arrest-release","q":"לפי דעת הרוב במורוזובה, מה קורה לימי המעצר שקדמו להכרעת דין שבוטלה בערעור?","opts":["נמחקים מהמניין","מצטרפים לימי המעצר לאחר החזרת התיק; המאסר אינו נספר במניין זה","נחשבים אוטומטית למאסר","תמיד נפתחים תשעה חודשים חדשים"],"correct":1,"explain":"זו ההבחנה בין דעת הרוב לבין גישת המיעוט בדבר חטיבת דיון חדשה.","source":"ילנה מורוזובה נ׳ מדינת ישראל.pdf — בש״פ 5142/99, פסקאות 10–12 לדעת ביניש וההכרעה הסופית","status":"נוסף על בסיס מקור שנבדק","lesson":"extra","extra":true},{"id":"mcq-47","topic":"arrest-basics","q":"איזה סעיף מסדיר הבאה לתחנה בשל אי־ציות להוראות עיכוב חוקיות?","opts":["23(ז)","23(ב)","סעיף 184 לחסד״פ","סעיף 155 לחסד״פ"],"correct":1,"explain":"סעיף 23(ב) מסדיר את הסמכות לתכלית שלשמה התבקש העיכוב.","source":"חוק סדר הדין הפלילי סמכויות אכיפה מעצרים התשנו 1996.pdf — סעיף 23(ב)","status":"נוסף על בסיס מקור שנבדק","lesson":"extra","extra":true},{"id":"mcq-48","topic":"reading","q":"לפי סעיף 10א, מה נדרש כדי לקבל אמרת חוץ של עד?","opts":["תנאי אחד בלבד: שהאמרה כתובה","הוכחת האמרה, העדת מוסרה והזדמנות לחקירה, ושוני מהותי/הכחשה/אי־זכירה","רק הודאת הנאשם","צו חיפוש"],"correct":1,"explain":"אלה התנאים המצטברים שנוספו בעקבות אלעוקה.","source":"אלעוקה נ' מדינת ישראל.pdf — ניתוח קבוצה C","status":"נוסף על בסיס מקור שנבדק"},{"id":"mcq-49","topic":"arrest-basics","q":"מהו הכלל הנכון בחיפוש בטלפון לפי סעיף 23א?","opts":["תפיסת הטלפון מתירה עיון מלא","יש לבחון מקור סמכות והיקף צו; פגם מוקדם נבחן בנפרד ואינו מוביל אוטומטית לתוצאה אחת","אין צורך בצו לעולם","כל פגם מחייב זיכוי אוטומטי"],"correct":1,"explain":"זהו סדר הניתוח שנוסף בעקבות אוריך.","source":"יונתן אוריך נ' מדינת ישראל.pdf — ניתוח קבוצה C","status":"נוסף על בסיס מקור שנבדק"},{"id":"mcq-50","topic":"summations","lesson":"8","extra":false,"q":"לפי סעיף 169 כפי שהוסבר בשיעור 8, מה סדר הסיכומים לעניין האשמה?","opts":["הנאשם ואחריו התובע","התובע ואחריו הנאשם","רק התובע מסכם","בית המשפט מסכם במקום הצדדים"],"correct":1,"explain":"התובע מסכם תחילה ואחריו הנאשם. המרצה הדגיש את זכות הנאשם למילה האחרונה.","source":"שיעור8 ערוך.mp3 — שלב הסיכומים","status":"נוסף על בסיס ההקלטה שנבדקה"}];
const CASE_Q = [{"title":"קייס 1 — פגם בכתב האישום","scenario":"נאשם הורשע בעבירת מרמה. בערעור טוען סנגורו כי בכתב האישום נפלה טעות בציון התאריך המדויק של אחת מהעברות הכספיות, וכי בשל כך יש לבטל את ההרשעה כולה — למרות שכל שאר העובדות הוכחו כדבעי ולא נטען שהדבר פגע ביכולתו של הנאשם להתגונן.","question":"האם יש לקבל את הטענה? נמקו את תשובתכם תוך הפניה לפסיקה הרלוונטית.","points":["יש להזכיר את הלכת סילוסטר (ע\"פ 1/48): הדיון הפלילי אינו \"אשקוקי\" — פגם דיוני/טכני שלא גרם לעיוות דין ולא מנע הגנה הוגנת אינו מביא לביטול ההליך.","יש לבחון האם הפגם (טעות בתאריך) פגע בפועל ביכולת הנאשם להתגונן — כאן נמסר בעובדה שלא נטען כך.","ניתן להזכיר את סעיף 215 לחסד\"פ, שבו עוגנה ההלכה.","מסקנה סבירה: יש לדחות את הטענה, שכן מדובר בפגם טכני גרידא."],"id":"caseq-1","topic":"sec184","status":"קיים — טרם הושלם אימות פרטני","lesson":"1","extra":false},{"title":"קייס 2 — חיפוש בהסכמה","scenario":"שוטר עוצר אזרח ברחוב ללא כל חשד מוקדם, ומבקש לחפש בתיקו. השוטר אומר לו רק \"אתה מסכים שאבדוק לך בתיק?\" והאזרח עונה \"בסדר, בכיף\". בחיפוש נמצאים סמים.","question":"האם החיפוש חוקי, והאם הראיה קבילה? התייחסו לתנאים הנדרשים.","points":["יש להזכיר את רע״פ 10141/09 בן חיים: בהיעדר מקור סמכות אחר, נדרשת הסכמה אמיתית, מודעת ורצונית מהסוג שנדון בפסק הדין.","השוטר חייב להבהיר לאזרח באופן מפורש את זכותו המלאה לסרב, ושסירובו לא ייזקף לחובתו.","כאן השוטר לא הבהיר דבר מזה — ההסכמה אינה \"מדעת\".","מסקנה: החיפוש אינו חוקי, והראיה (הסמים) עלולה להיפסל מכוח הלכת יששכרוב (פסילה פסיקתית יחסית, בכפוף לאיזון אינטרסים)."],"id":"caseq-2","topic":"packer","status":"תוקן מול פסק הדין","lesson":"1","extra":false,"source":"אברהם בן חיים נ׳ מדינת ישראל.pdf — רע״פ 10141/09, פסקאות 3–5, 13, 31–35 וההכרעה הסופית"},{"title":"קייס 3 — עדות שותף","scenario":"שני שותפים הועמדו לדין בכתבי אישום נפרדים. האחד הורשע אך טרם נגזר דינו. התביעה מבקשת להעידו במשפט שותפו. הסנגור טוען שהלכת קנזי מחייבת לפסול את העדות באופן אוטומטי.","question":"האם הטענה הגורפת נכונה? הציגו כלל, חריג ויישום.","points":["מזהים שמדובר בכתבי אישום נפרדים.","מבחינים בין הלכת קנזי ההיסטורית לבין בג״ץ 11339/05 שביטל את החסם הגורף.","ככלל ניתן להעיד את השותף גם לפני סיום משפטו; ניתן לדחות במקרים חריגים ביותר ומטעמים שיירשמו.","העובדה שגזר הדין טרם ניתן אינה לבדה בסיס לפסילה אוטומטית. שאלת משקל העדות נפרדת מעצם האפשרות להעיד."],"id":"caseq-3","topic":"kanzi","status":"תוקן ואומת","source":"מדינת ישראל נ׳ בית המשפט המחוזי באר שבע 11339-05.pdf — ההכרעה הסופית ודעת הנשיאה ביניש, פסקה 3","lesson":"3","extra":false},{"title":"קייס 4 — הסדר מותנה","scenario":"חשוד בעבירת תקיפה (עוון) מוזמן על ידי התביעה להצעת הסדר מותנה. הוא מבקש מסנגורו לעיין בחומרי החקירה לפני שיחליט אם לחתום, אך התביעה משיבה שזכות העיון קמה רק לאחר הגשת כתב אישום, ולכן היא מסרבת למסור את החומרים.","question":"האם עמדת התביעה נכונה? נמקו את תשובתכם.","points":["יש להבחין בין זכות העיון הרגילה (סעיף 74) — הקמה רק לאחר הגשת כתב אישום — לבין זכות העיון המיוחדת בהליך של הסדר מותנה.","בהסדר מותנה, מאחר שהחשוד נדרש להודות בעובדות המתגבשות, התביעה חייבת לחשוף את טיוטת כתב האישום וכל חומרי החקירה עוד לפני הגשת כתב אישום.","מסקנה: עמדת התביעה שגויה — במסגרת הצעת הסדר מותנה קמה חובת חשיפה מיוחדת ומוקדמת."],"id":"caseq-4","topic":"conditional","status":"קיים — טרם הושלם אימות פרטני","lesson":"3","extra":false},{"title":"קייס 5 — התיישנות: גבולות חומר הבחינה","scenario":"בתרגיל מוצגת עבירת פשע רגילה ופעולת חקירה מאוחרת. סטודנט מבקש לפתור את השאלה באמצעות טבלת הארכות מפורטת המופיעה במצגת, וכן להסתמך על שקפים בעניין עבירות מין בקטינים.","question":"כיצד יש לבנות את התשובה לפי הנחיית המרצה בשיעור 7?","points":["מזהים את תקופת ההתיישנות הבסיסית לפי סיווג העבירה.","מסבירים שפעולת חקירה היא אירוע מנתק, ושמנגנון התקופה הנוספת קשור לפי השיעור לפעולת חקירה.","לא בונים את התשובה על טבלת הארכות שהמרצה הוציא מחומר הבחינה.","לא מייבאים את דיני עבירות המין בקטינים, שהמרצה הורה להתעלם מהם בבחינה."],"id":"caseq-5","topic":"limitations-pointer","status":"הוחלף בקייס התואם את חומר שיעור 7","lesson":"6","extra":false,"source":"שיעור 7 ערוך.mp3 — דברי המרצה בתחילת הדיון בהתיישנות"},{"title":"קייס 6 — סיווג העבירה לפני הצעת הסדר","scenario":"רונן חשוד בעבירה שעונשה המרבי חמש שנות מאסר. הוא נעדר עבר פלילי בחמש השנים שקדמו לה ואין נגדו תיקים נוספים. התובע סבור שאין מקום לבקש מאסר בפועל ולכן מציע הסדר מותנה. סטודנט טוען שהיעדר עבר פלילי והיעדר בקשת מאסר מספיקים לכך.","question":"מהו תנאי הסף שהסטודנט דילג עליו, לפי המסגרת שנלמדה בשיעור 3?","points":["מפרידים בין העונש המרבי הקבוע לעבירה לבין העונש שהתובע סבור שמתאים בנסיבות המקרה.","עונש מרבי של חמש שנים מציב את העבירה בסוג פשע.","לפי המסגרת שהמרצה לימד, הסדר מותנה מיועד לחטא ולעוון, ולא לפשע.","עבר נקי והערכת התובע שאין צורך במאסר אינם מחליפים את תנאי סיווג העבירה; לכן המסקנה של הסטודנט אינה נכונה."],"id":"caseq-6","topic":"conditional","status":"הקייס הסותר הוחלף בדוגמה המבוססת על ההרצאה","withheld":false,"lesson":"3","extra":false,"source":"שיעור 3.mp3 — הסבר המרצה על סגירת תיק בהסדר, תנאי הסף והעיון לפני חתימה"},{"title":"קייס 7 — התיישנות, סיכון כפול וערעור באיחור","scenario":"שרה ביצעה עבירת פשע (תקופת התיישנות בסיסית 10 שנים) ב-1/2014. ב-1/2018 החל הליך חקירה שהסתיים ב-6/2018. ב-2/2025 הוגש נגדה כתב אישום ומשפטה החל. באותו משפט טענה שרה שכבר זוכתה בעבר, בשנת 2016, מאישום שונה לחלוטין שנבע מאותו אירוע עובדתי — אך התביעה חוזרת וטוענת לעובדות דומות. שרה הורשעה בסופו של דבר, וסנגורה פספס את מועד הגשת הערעור בשבועיים בשל תקלה משרדית.","question":"התייחסו לשלוש הסוגיות: (1) האם ניתן היה להגיש את כתב האישום ב-2/2025 מבחינת התיישנות? (2) האם טענת הסיכון הכפול/הזיכוי הקודם תתקבל? (3) האם ניתן עדיין לערער חרף האיחור?","points":["(1) תקופת ההתיישנות הבסיסית: 1/2014 + 10 שנים = 1/2024. הליך החקירה (אירוע מנתק) מאפס ומתחיל שוב מ-6/2018, אך מוגבל ל\"תקופה נוספת\" של עד 3 שנים מעבר ל-1/2024 — כלומר עד 1/2027. הגשת האישום ב-2/2025 היא במועד.","(2) סעיף 5 חוסם רק דיון חוזר על אותו מעשה שממנו זוכתה — אם האישום הנוכחי מבוסס על עובדות שונות (גם אם מאותו אירוע כללי), הטענה עלולה להידחות; יש לבחון האם מדובר ב\"אותו מעשה\" ממש.","(3) בהליך פלילי ניתן להאריך את מועד הגשת הערעור גם ללא \"טעמים מיוחדים שיירשמו\" (בשונה מהליך אזרחי) — ולכן תקלה משרדית עשויה להצדיק הארכה; דחיית בקשת ההארכה עצמה נחשבת \"פסק דין\" הניתן לערעור בזכות (הלכת חילף)."],"id":"caseq-7","topic":"appeals","status":"קיים — טרם הושלם אימות פרטני","lesson":"8","extra":false},{"title":"קייס 8 — נאשמים באותו כתב אישום","scenario":"א׳ וב׳ מואשמים באותו כתב אישום בשוד. א׳ הודה בעובדות, וב׳ כופר. התביעה מבקשת לגזור את דינו של א׳ מיד כדי לסיים את עניינו.","question":"מהו הכלל שנלמד בשיעור 7 ומהו ההיגיון שניתן לו?","points":["מזהים שמדובר בכתב אישום אחד, תנאי מרכזי לדיון בסעיף 155 כפי שנלמד.","לא גוזרים את דינו של מי שהודה לפני שהסתיים בירור משפטו של מי שלא הודה.","ההסבר בשיעור הוא הצורך לראות את התמונה הכוללת ואת חלקו של כל נאשם לפני הענישה.","אין להוסיף חריגים או מסלולים שאינם מבוססים במפורש בחומר שנלמד."],"id":"caseq-8","topic":"multi-defendants","status":"הוחלף בקייס ממוקד ומאומת","lesson":"6","extra":false,"source":"שיעור 7 ערוך.mp3 — דברי המרצה בתחילת הדיון בהתיישנות"},{"title":"קייס 9 — מעצר ועיכוב: הרחבה מעבר להקלטות 1–8","scenario":"שוטר עיכב את דני ברחוב בחשד לתקיפה (עוון) לפני כשלוש שעות, וביקש לבדוק את זהותו. דני סירב לשתף פעולה, ובתגובה עצר אותו השוטר ללא צו. בתחנה נמנע ממנו לפגוש את עורך דינו למשך 20 שעות ללא נימוק מיוחד, ובמהלך אותה תקופה נגבתה ממנו הודאה בעבירה חמורה יותר — ניסיון לשוד (פשע). דני הובא בפני שופט לאחר 30 שעות. בשלב מאוחר יותר ביקשה התביעה מעצר גישור, ולאחר מכן מעצר עד תום ההליכים, בטענה שמדובר ב\"מכת מדינה\" של שוד ברחובות.","question":"נתחו, לפי הסדר: (1) האם העיכוב והמעצר ללא צו היו כדין? (2) מה דין מניעת הפגישה עם עורך הדין וההודאה שנגבתה? (3) האם הזמן עד ההבאה בפני שופט תקין? (4) האם טענת \"מכת מדינה\" מספיקה למעצר עד תום ההליכים?","points":["(1) תחילה בודקים שהעיכוב נעשה בסמכות. אי־ציות להוראות עיכוב חוקיות עשוי להקים סמכות לפי סעיף 23(ב) להבאה לתחנה לתכלית העיכוב. אין לייבא אוטומטית את תנאי מסלול 23(א); יש לבחון את הנסיבות ואת האפשרות להסתפק בעיכוב.","(2) מניעת פגישה עם עו\"ד ללא נימוק מיוחד לאורך 20 שעות פוגעת בזכות יסוד — בהתאם להלכת אסף שי, פגיעה בלתי חוקית כזו עלולה להוביל לפסילת ההודאה שנגבתה בעקבותיה מכוח הלכת יששכרוב.","(3) הכלל הוא הבאה בפני שופט תוך 24 שעות, עם אפשרות הארכה ל-48 שעות לכל היותר בנסיבות מיוחדות — 30 שעות ללא הצדקה מתועדת חורגות מהכלל הרגיל וטעונות בדיקה.","(4) לפי הלכת גנימאת, \"מכת מדינה\" או חומרת העבירה כשלעצמה אינן עילת מעצר עצמאית — יש לבחון את מסוכנותו האישית הספציפית של דני ואת קיומה של חלופת מעצר, ולא להסתפק בנימוק הכללי."],"id":"caseq-9","topic":"arrest-nowarrant","status":"סעיף העיכוב תוקן; יתר הפתרון טעון אימות","source":"חוק סדר הדין הפלילי סמכויות אכיפה מעצרים התשנו 1996.pdf — סעיף 23(ב)","lesson":"extra","extra":true},{"id":"caseq-10","title":"קייס 10 — שני מועדים בערעור ברשות","scenario":"בקשת רשות ערעור הוגשה בתוך 45 ימים מפסק הדין. ההחלטה המתירה ערעור ניתנה כעבור חודשיים. סטודנט טוען שהמועד חלף, כי עברו יותר מ־75 ימים מפסק הדין.","question":"האם חיבור פשוט של 45+30 פותר את השאלה? נמקו.","points":["מבדילים בין בקשת רשות הערעור לבין הערעור לאחר מתן הרשות.","45 הימים מתייחסים לבקשת הרשות לפי הכלל שנלמד.","30 הימים נמנים ממועד מתן הרשות, לא אוטומטית מתום 45 הימים.","ההמתנה להחלטה אינה מצדיקה כשלעצמה את מסקנת הסטודנט; בודקים את המועד בפועל לאחר מתן הרשות."],"topic":"appeals","source":"שיעור8 ערוך.mp3 — דיון בסיום המשפט ובערעור","status":"דוגמה לימודית על בסיס מקור שנבדק","lesson":"8","extra":false},{"id":"caseq-11","title":"קייס 11 — חזרה מערעור","scenario":"נאשם הגיש ערעור ומבקש לחזור בו. השוו בין בקשה לפני סיום טענות הצדדים לבין בקשה לאחר סיומן.","question":"מהי נקודת המעבר ומה נדרש בכל מצב?","points":["מזהים שהשאלה היא חזרה מערעור, לא חזרת תובע מאישום.","לפני סיום טענות בעלי הדין אין צורך ברשות בית המשפט.","אחרי סיום הטענות נדרשת רשות בית המשפט.","אין להעתיק לכאן את ההבחנה בין ביטול לזיכוי הנוגעת לחזרה מאישום."],"topic":"appeals","source":"שיעור8 ערוך.mp3 — דיון בסיום המשפט ובערעור","status":"דוגמה לימודית על בסיס מקור שנבדק","lesson":"8","extra":false},{"id":"caseq-12","topic":"summations","lesson":"8","extra":false,"title":"קייס 12 — האם סיכומים כתובים מבטלים את המשפט?","scenario":"בתיק כלכלי הסכימו הצדדים להגיש סיכומים בכתב. לאחר הרשעתו דורש הנאשם ביטול אוטומטי של המשפט משום שלא סיכם בעל־פה, בלי להצביע על פגיעה מסוימת בהגנתו.","question":"כיצד יש לנתח את הטענה לפי פלוני 5333/11? השוו בקצרה לזכריא.","points":["מזהים סוגיה של מתכונת הסיכומים, לא של עדות שותפים.","מציינים שטיעון בעל־פה הוא דרך המלך, אך אין ביטול אוטומטי עקב סיכומים בכתב בהסכמה.","בוחנים את ההסכמה ואת הטענה לנזק או עיוות דין; כאן לא פורטה פגיעה קונקרטית.","בזכריא יש חשיבות לכך שהתקיים דיון והסנגור עצמו בחר להסתפק בנימוקיו הכתובים.","המסקנה לפי נתוני הדוגמה: הדרישה לביטול אוטומטי אינה מבוססת; אין בכך היתר גורף לוותר על דיון בכל מקרה."],"source":"פלוני נ׳ מדינת ישראל 5333-11.pdf — רע״פ 5333/11, פסקאות א–ט; זכריא נ׳ מדינת ישראל.pdf — רע״פ 11160/03, פסקאות 2–4 והערת השופטת פרוקצ׳יה","status":"דוגמה לימודית המבוססת על פסקי הדין שנבדקו"}];

function renderHome(){const study=ITEMS.filter(isStudy),done=study.filter(t=>store.learned[t.id]).length,answered=MCQ.filter(q=>Number.isInteger(store.answers[q.id])),correct=answered.filter(q=>store.answers[q.id]===q.correct).length,practiced=CASE_Q.filter(q=>store.casePractice[q.id]||store.drafts[q.id]).length,last=topic(store.last);setPage(`<section class="hero"><div><div class="eyebrow">מסלול אישי למבחן המסכם</div><h1>לומדים בהדרגה.<br>מתרגלים בביטחון.</h1><p>כל הנושאים, הפסיקה והתרגול במקום אחד. מתחילים בנושא, מיישמים בשאלה וחוזרים למה שעדיין לא ברור.</p><div class="actions"><a class="button gold" href="#learn">מצא נושא ללמוד</a><a class="button secondary" href="#practice">התחל תרגול</a></div></div><div class="hero-note"><strong>השלב הבא שלך</strong>${last?`המשך בנושא: ${esc(last.title)} <br><a class="button gold" href="#topic/${last.id}">המשך מהמקום שעצרתי</a>`:'בחר נושא ראשון וסמן אותו כנלמד לאחר העיון.'}</div></section>${last?`<div class="continue-card"><span><strong>המשך מהמקום שעצרתי</strong><br>${esc(last.title)}</span><a class="button primary" href="#topic/${last.id}">חזור לנושא</a></div>`:''}<div class="stats"><div class="stat"><strong>${ITEMS.length}</strong><span>נושאים במאגר · ${done} נלמדו</span></div><div class="stat"><strong>${CASES.length}</strong><span>רשומות פסיקה</span></div><div class="stat"><strong>${MCQ.length}</strong><span>שאלות אמריקאיות</span></div><div class="stat"><strong>${answered.length?Math.round(100*correct/answered.length):0}%</strong><span>הצלחה מתוך ${answered.length} שנענו</span></div><div class="stat"><strong>${practiced}/${CASE_Q.length}</strong><span>קייסים שתורגלו</span></div></div><h2 class="section-title">מה עושים עכשיו?</h2><div class="grid4"><article class="card"><div class="icon">01</div><h3>המשך ללמוד</h3><p>תקציר, הרחבה ופסיקה קשורה לכל נושא.</p><a href="#${last?'topic/'+last.id:'learn'}">כניסה ללמידה ←</a></article><article class="card"><div class="icon">02</div><h3>תרגול מהיר</h3><p>שאלות קצרות, הסבר מידי וחזרה ל function renderCases(open){const topics=ITEMS.filter(t=>relatedCaseIndexes(t).length);setPage(`${heading('פסיקה','כל 39 הרשומות מוצגות מתוך חומר הקורס. מצב האימות מופיע בתוך כל כרטיס.')}<div class="filters"><label>חיפוש בפסיקה<input id="case-search" type="search" placeholder="שם פסק דין או הלכה"></label><label>נושא<select id="case-topic"><option value="">כל הנושאים</option>${topics.map(t=>`<option value="${esc(t.id)}">${esc(t.title)}</option>`).join('')}</select></label><label>מצב אימות<select id="case-status"><option value="">כל המצבים</option>${[...new Set(CASES.map(c=>c.status).filter(Boolean))].map(s=>`<option value="${esc(s)}">${esc(s)}</option>`).join('')}</select></label><label>שמירה<select id="case-review"><option value="">הכול</option><option value="saved">לחזור אליו</option></select></label></div><p class="small muted" id="case-count" role="status"></p><div class="case-list" id="case-results"></div>`,'cases');for(const id of ['case-search','case-topic','case-status','case-review'])document.getElementById(id).addEventListener('input',()=>drawCases(open));drawCases(open)}

function renderPractice(param=''){const qs=new URLSearchParams(param);const caseMode=qs.get('mode')==='cases';setPage(`${heading('תרגול','בחר מסלול קצר וממוקד. אפשר לחזור לשאלות שטעית בהן.')}<div class="practice-setup panel"><div class="setup-grid"><label>סוג תרגול<select id="practice-kind"><option value="mcq">שאלות אמריקאיות · ${MCQ.length}</option><option value="cases" ${caseMode?'selected':''}>קייסים · ${CASE_Q.length}</option></select></label><label>נושא<select id="practice-topic"><option value="">כל הנושאים</option>${ITEMS.map(t=>`<option value="${esc(t.id)}">${esc(t.title)}</option>`).join('')}</select></label><label>מספר שאלות<select id="practice-count"><option value="5">5</option><option value="10">10</option><option value="20">20</option><option value="all">הכל</option></select></label><label>סדר<select id="practice-order"><option value="original">מקורי</option><option value="random">אקראי</option></select></label><label>בחירת שאלות<select id="practice-state"><option value="all">כולן</option><option value="unanswered">רק לא נענו</option><option value="wrong">רק טעויות</option></select></label><label>הרחבות<select id="practice-extra"><option value="yes">כולל הרחבות</option><option value="no">ללא הרחבות</option></select></label></div><p id="practice-availability" role="status" class="muted small"></p><button type="button" class="button primary" id="start-session">התחל תרגול</button></div>`,'practice');if(topic(qs.get('topic')))document.getElementById('practice-topic').value=qs.get('topic');for(const id of ['practice-kind','practice-topic','practice-state','practice-extra'])document.getElementById(id).addEventListener('change',availablePractice);document.getElementById('start-session').addEventListener('click',startSession);availablePractice()}
function selectedPool(){const kind=document.getElementById('practice-kind').value,topicId=document.getElementById('practice-topic').value,state=document.getElementById('practice-state').value,extra=document.getElementById('practice-extra').value;return (kind==='mcq'?MCQ:CASE_Q).filter(q=>!q.withheld&&(!topicId||q.topic===topicId)&&(extra==='yes'||!q.extra)&&(state==='all'||(state==='wrong'?kind==='mcq'&&Number.isInteger(store.answers[q.id])&&store.answers[q.id]!==q.correct:kind==='mcq'?!Number.isInteger(store.answers[q.id]):!store.drafts[q.id])))}

ocument.getElementById('next-question').addEventListener('click',()=>{session.index++;drawSession()})}document.getElementById('exit-session').addEventListener('click',()=>{session=null;location.hash='practice'})}

let chatSending=false;
async function sendCourseChat(){
  if(chatSending)return;
  const field=document.getElementById('chat-input'),question=field.value.trim();
  if(!question)return;
  const button=document.getElementById('send-chat'),log=document.getElementById('chat-history');
  const message=document.createElement('p');message.textContent=question;log.append(message);field.value='';
  const loading=document.createElement('p');loading.setAttribute('role','status');loading.textContent='Gemini מחפש בחומרי הקורס...';log.append(loading);
  chatSending=true;button.disabled=true;log.scrollTop=log.scrollHeight;
  const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),30000);
  try{
    const response=await fetch(COURSE_CHAT_ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question,...(currentTopic?{currentTopic}:{})}),signal:controller.signal});
    if(!response.ok)throw new Error('Course chat unavailable');
    const result=await response.json();
    if(!result||typeof result.answer!=='string'||!result.answer.trim())throw new Error('Missing answer');
    const answer=document.createElement('p');answer.dir='auto';answer.textContent=result.answer;log.append(answer);
    if(Array.isArray(result.sources)){
      const names=result.sources.map(source=>typeof source==='string'?source:(source&&typeof source==='object'?(source.title||source.name||source.displayName||source.fileName||source.filename):'')).filter(name=>typeof name==='string'&&name.trim()).map(name=>name.split('/').pop());
      if(names.length){const section=document.createElement('div'),title=document.createElement('strong'),list=document.createElement('ul');title.textContent='מקורות בחומרי הקורס';section.append(title);for(const name of names){const item=document.createElement('li');item.textContent=name;list.append(item)}section.append(list);log.append(section)}
    }
  }catch(error){const failure=document.createElement('p');failure.textContent='לא ניתן לקבל תשובה כרגע. אפשר לנסות שוב בעוד רגע או לפתוח את מחברת הקורס.';log.append(failure)}
  finally{clearTimeout(timer);loading.remove();chatSending=false;button.disabled=false;log.scrollTop=log.scrollHeight}
}

function quickPractice(){
  const candidates=MCQ.filter(q=>!q.withheld);
  const shuffle=list=>{for(let i=list.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[list[i],list[j]]=[list[j],list[i]]}return list};
  const unanswered=shuffle(candidates.filter(q=>!Number.isInteger(store.answers[q.id])));
  const others=shuffle(candidates.filter(q=>Number.isInteger(store.answers[q.id])));
  session={kind:'mcq',questions:[...unanswered,...others].slice(0,5),index:0,picked:{},started:Date.now()};
  drawSession();
}

  const n=paths.indexOf(id),next=paths[n+1],related=relatedCaseIndexes(t),deep=EXPANSIONS[id];
  const sectionNav=`<nav class="study-rail" aria-label="תוכן הנושא"><a href="#summary">תקציר</a>${deep?'<a href="#expanded">הרחבה</a>':''}<a href="#related-cases">פסיקה</a><a href="#related-practice">תרגול</a></nav>`;
  setPage(`<div class="page-head"><div><a class="small" href="#learn">← כל הנושאים</a><div class="meta-row">${badge(t)}<span>${esc(t.group)}</span><span class="badge ${store.learned[id]?'sage':''}">${store.learned[id]?'נלמד':'בלמידה'}</span></div><h1>${esc(t.title)}</h1></div></div><div class="topic-layout"><div><section class="panel content-block" id="summary"><h2>תקציר</h2>${visibleContent(t.html)}</section>${deep?`<section class="panel content-block" id="expanded"><h2>הרחבה</h2>${visibleContent(deep.html)}</section>`:''}<section class="panel content-block" id="related-cases"><h2>פסיקה קשורה</h2>${related.length?related.map(i=>`<p><a href="#case/${i}">${esc(CASES[i].name)}</a></p>`).join(''):'<p class="muted">אין הפניה מפורשת לפסיקה מתוך רשומת הנושא.</p>'}</section><section class="panel content-block" id="related-practice"><h2>תרגול בנושא</h2><p>${relatedCount(id)} תרגילים משויכים לנושא.</p><a class="button primary" href="#practice?topic=${encodeURIComponent(id)}">תרגל את הנושא</a></section><div class="topic-actions"><button type="button" class="button primary" id="learned-toggle">${store.learned[id]?'בטל סימון נלמד':'סיימתי ללמוד'}</button>${next?`<a class="button" href="#topic/${next}">לנושא הבא ←</a>`:'<a class="button" href="#learn">חזרה לנושאים ←</a>'}<a class="button practice-before" href="#practice?topic=${encodeURIComponent(id)}">תרגל לפני שממשיכים</a></div></div>${sectionNav}</div>`,'learn');
  document.getElementById('learned-toggle').addEventListener('click',()=>{store.learned[id]=!store.learned[id];save();renderTopic(id);notice('מצב הלמידה עודכן')});
  ROOT.querySelectorAll('.study-rail a').forEach(a=>a.addEventListener('click',e=>{e.preventDefault();document.querySelector(a.getAttribute('href')).scrollIntoView({behavior:'smooth'})}));
}

function caseField(label,value,cls=''){return value?`<div class="case-field ${cls}"><h3>${label}</h3><p>${visibleContent(value)}</p></div>`:''}
function caseCard(c,i,open=false){
  return `<details class="case-card" id="case-${i}" ${open?'open':''}><summary><span class="case-title"><strong>${esc(c.name)}</strong><small>${esc(c.cite)}</small></span></summary><div class="case-content"><button class="review" data-review="${i}" aria-pressed="${!!store.savedCases[i]}">${store.savedCases[i]?'✓ לחזור אליו':'לחזור אליו'}</button>${c.withheld?'<div class="warning">סיכום פסק הדין אינו זמין ברשומה זו.</div>':`<div class="case-fields">${caseField('סיפור המסגרת',c.facts)}${caseField('טענות הצד המבקש',c.claimant)}${caseField('טענות הצד שכנגד',c.respondent)}${caseField('השאלה המשפטית',c.question,'key')}${caseField('נימוקי בית המשפט',c.reasoning)}${caseField('התוצאה',c.ruling)}${caseField('ההלכה',c.halacha,'key halacha')}${caseField('דעת רוב ומיעוט',c.dissent)}${caseField('ליישום במבחן',c.exam,'wide exam-point')}</div>`}</div></details>`;
}
function renderCases(open){
  const topics=STUDY_ITEMS.filter(t=>relatedCaseIndexes(t).length);
  setPage(`${heading('פסיקה',`כל ${CASES.length} הרשומות מוצגות מתוך חומר הקורס.`)}<div class="filters"><label>חיפוש בפסיקה<input id="case-search" type="search" placeholder="שם פסק דין או הלכה"></label><label>נושא<select id="case-topic"><option value="">כל הנושאים</option>${topics.map(t=>`<option value="${esc(t.id)}">${esc(t.title)}</option>`).join('')}</select></label><label>שמירה<select id="case-review"><option value="">הכול</option><option value="saved">לחזור אליו</option></select></label></div><p class="small muted" id="case-count" role="status"></p><div class="case-list" id="case-results"></div>`,'cases');
  for(const id of ['case-search','case-topic','case-review'])document.getElementById(id).addEventListener('input',()=>drawCases(open));
  drawCases(open);
}
function drawCases(open){
  const term=document.getElementById('case-search').value.toLocaleLowerCase('he'),topicId=document.getElementById('case-topic').value,review=document.getElementById('case-review').value;
  const matches=CASES.map((c,i)=>({c,i})).filter(({c,i})=>(!term||plain(Object.values(c).join(' ')).toLocaleLowerCase('he').includes(term))&&(!topicId||relatedCaseIndexes(topic(topicId)).includes(i))&&(!review||!!store.savedCases[i]));
  document.getElementById('case-count').textContent=`${matches.length} מתוך ${CASES.length} רשומות פסיקה`;
  document.getElementById('case-results').innerHTML=matches.map(({c,i})=>caseCard(c,i,String(i)===String(open))).join('')||'<p>לא נמצאה פסיקה בסינון הנוכחי.</p>';
  document.querySelectorAll('[data-review]').forEach(b=>b.addEventListener('click',()=>{const i=b.dataset.review;store.savedCases[i]=!store.savedCases[i];save();b.setAttribute('aria-pressed',String(!!store.savedCases[i]));b.textContent=store.savedCases[i]?'✓ לחזור אליו':'לחזור אליו'}));
  if(open!==undefined)document.getElementById('case-'+open)?.scrollIntoView({block:'start'});
}
function renderLimitations(){setPage(`${heading('התיישנות — סדר בחישוב')}<div class="panel content-block">${visibleContent(LIMITATIONS_HTML)}</div><p><a class="button" href="#learn">חזרה לנושאים</a></p>`,'learn')}

function renderPractice(param=''){
  const qs=new URLSearchParams(param),single=qs.get('single');
  if(single){const mcq=MCQ.find(q=>q.id===single),caseQ=CASE_Q.find(q=>q.id===single),q=mcq||caseQ;if(q){session={kind:mcq?'mcq':'cases',questions:[q],index:0,picked:{},started:Date.now()};return drawSession()}}
  const caseMode=qs.get('mode')==='cases';
  setPage(`${heading('תרגול','בחר מסלול קצר וממוקד. אפשר לחזור לשאלות שטעית בהן.')}<div class="practice-setup panel">${session?`<div class="resume-callout"><span>תרגול קודם ממתין לך.</span>${resumeButton()}</div>`:''}<div class="setup-grid"><label>סוג תרגול<select id="practice-kind"><option value="mcq">שאלות אמריקאיות · ${MCQ.length}</option><option value="cases" ${caseMode?'selected':''}>קייסים · ${CASE_Q.length}</option></select></label><label>נושא<select id="practice-topic"><option value="">כל הנושאים</option>${STUDY_ITEMS.map(t=>`<option value="${esc(t.id)}">${esc(t.title)}</option>`).join('')}</select></label><label>מספר שאלות<select id="practice-count"><option value="5">5</option><option value="10">10</option><option value="20">20</option><option value="all">הכל</option></select></label></div><details class="advanced-options"><summary>אפשרויות נוספות</summary><div class="setup-grid"><label>סדר<select id="practice-order"><option value="original">מקורי</option><option value="random">אקראי</option></select></label><label>בחירת שאלות<select id="practice-state"><option value="all">כולן</option><option value="unanswered">רק לא נענו</option><option value="wrong">רק טעויות</option></select></label><label>הרחבות<select id="practice-extra"><option value="yes">כולל הרחבות</option><option value="no">ללא הרחבות</option></select></label></div></details><p id="practice-availability" role="status" class="muted small"></p><button type="button" class="button primary" id="start-session">התחל תרגול</button></div>`,'practice');
  if(topic(qs.get('topic'))&&isStudy(topic(qs.get('topic'))))document.getElementById('practice-topic').value=qs.get('topic');
  for(const id of ['practice-kind','practice-topic','practice-state','practice-extra'])document.getElementById(id).addEventListener('change',availablePractice);
  document.getElementById('start-session').addEventListener('click',startSession);availablePractice();bindResume();
}

function searchGlobal(){
  const input=document.getElementById('global-search'),box=document.getElementById('search-results'),term=input.value.trim().toLocaleLowerCase('he');
  if(term.length<2){box.hidden=true;box.innerHTML='';return}
  const matches=(list,textOf,urlOf)=>list.map((x,i)=>({x,i})).filter(({x})=>plain(textOf(x)).toLocaleLowerCase('he').includes(term)).slice(0,7).map(({x,i})=>`<a href="${esc(urlOf(x,i))}">${esc(x.title||x.name||x.q||x.question)}</a>`).join('');
  const groups=[['נושאים',matches(STUDY_ITEMS,x=>x.title+' '+x.html,x=>'#topic/'+x.id)],['פסיקה',matches(CASES,x=>Object.values(x).join(' '),(x,i)=>'#case/'+i)],['שאלות',matches(MCQ,x=>x.q+' '+x.explain,x=>'#practice?single='+encodeURIComponent(x.id))],['קייסים',matches(CASE_Q,x=>x.title+' '+x.scenario,x=>'#practice?single='+encodeURIComponent(x.id))]];
  box.innerHTML=groups.filter(([,html])=>html).map(([label,html])=>`<div class="search-group"><strong>${label}</strong>${html}</div>`).join('')||'<p>לא נמצאו תוצאות.</p>';box.hidden=false;
}
function route(){
  const raw=location.hash.slice(1)||'home';const [path,params='']=raw.split('?');const [view,id]=path.split('/');
  document.getElementById('more-panel').hidden=true;document.getElementById('search-results').hidden=true;
  currentTopic=view==='topic'?id:null;
  if(view==='learn')renderLearn();else if(view==='topic')renderTopic(decodeURIComponent(id||''));else if(view==='cases')renderCases();else if(view==='case')renderCases(id);else if(view==='limitations')renderLimitations();else if(view==='practice')renderPractice(view==='practice'&&id==='cases'?'mode=cases&'+params:params);else if(view==='exams')renderExams();else renderHome();
}

function openChat(event){
  chatReturnFocus=event?.currentTarget||document.activeElement;
  const drawer=document.getElementById('chat-drawer');drawer.hidden=false;document.getElementById('screen').hidden=false;
  document.querySelectorAll('[data-open-chat]').forEach(b=>b.setAttribute('aria-expanded','true'));
  const log=document.getElementById('chat-history');if(!log.children.length)log.innerHTML='<p>שאלו שאלה על חומרי הקורס.</p>';
  if(currentTopic){const p=document.createElement('p');p.textContent='נושא פתוח: '+topic(currentTopic)?.title;log.append(p)}
  document.getElementById('chat-input').focus();
}
function closeChat(){
  const drawer=document.getElementById('chat-drawer');if(drawer.hidden)return;
  drawer.hidden=true;document.getElementById('screen').hidden=true;
  document.querySelectorAll('[data-open-chat]').forEach(b=>b.setAttribute('aria-expanded','false'));
  if(chatReturnFocus?.isConnected)chatReturnFocus.focus();chatReturnFocus=null;
}
document.querySelectorAll('[data-open-chat]').forEach(b=>{b.setAttribute('aria-controls','chat-drawer');b.setAttribute('aria-expanded','false')});
document.getElementById('mobile-search-toggle').addEventListener('click',()=>{const box=document.getElementById('searchbar'),button=document.getElementById('mobile-search-toggle'),expanded=box.classList.toggle('mobile-open');button.setAttribute('aria-expanded',String(expanded));if(expanded)document.getElementById('global-search').focus()});
document.addEventListener('keydown',event=>{
  const drawer=document.getElementById('chat-drawer');if(drawer.hidden||event.key!=='Tab')return;
  const items=[...drawer.querySelectorAll('button,textarea,input,a[href]')].filter(el=>!el.disabled&&el.getClientRects().length);
  if(!items.length)return;
  const first=items[0],last=items.at(-1);
  if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus()}
  else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus()}
});
</script></body></html>
