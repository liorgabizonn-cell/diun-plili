על סעיף 169, התובע מסכם תחילה ואחריו הנאשם. יש להבחין בין סדר הטיעון, מתכונתו והסעד כשנטען לפגם.</p><h3>מה הדגיש המרצה?</h3><p>הסיכומים מרכזים את הראיות והטענות; זכות המילה האחרונה ניתנת לנאשם. המרצה הבהיר גם שסיום הסיכומים אינו מחסום מוחלט בפני הסמכות להביא ראיות מטעם בית המשפט. אין לערבב בין סיכומים לעניין האשמה לבין הטיעונים לעונש.</p><h3>שני מקרים שמחדדים את ההבחנה</h3><p><b>זכריא:</b> דיון התקיים, והסנגור בחר להסתפק בכתב. הטענה המאוחרת לכפייה לא נתמכה בפרוטוקול. ההחלטה מדגישה את חשיבות הטיעון בעל־פה, בלי לבטל את ההליך בנסיבות אלה.</p><button class=\"case-link\" data-case=\"8\">ניתוח זכריא</button><p><b>פלוני:</b> תיק עבירות מס שבו הוגשו סיכומים בכתב בהסכמה. לא הוכח עיוות דין, ולכן ההליך לא בוטל רק בשל המתכונת הכתובה.</p><button class=\"case-link\" data-case=\"9\">ניתוח פלוני</button><h3>סדר פתרון לקייס</h3><ol><li>מהו השלב — משפט או ערעור?</li><li>האם התקיים דיון והאם ניתנה הזדמנות לטעון?</li><li>האם הושגה הסכמה, ומה נרשם בפרוטוקול?</li><li>איזו פגיעה קונקרטית בהגנה נטענת?</li><li>מפרידים בין פגם נטען לבין השאלה אם הוא מצדיק ביטול.</li></ol>"},"search-seizure":{"title":"דיני חיפוש ותפיסה","html":"<div class=\"release-layer\"><h2>קריאה מורחבת</h2><section class=\"release-subtopic\"><h3>המסגרת הנורמטיבית של דיני החיפוש והבחנת היסוד בין חיפוש \"על גוף\" לחיפוש \"בגוף\"</h3><h4>א. המקורות הנורמטיביים והתפתחות החקיקה</h4><p>דיני החיפוש והחקירה נסמכים על ארבעה דברי חקיקה מרכזיים:</p><ol><li><strong>פקודת סדר הדין הפלילי (מעצר וחיפוש) [נוסח חדש], התשכ\"ט-1969</strong>: פקודה מנדטורית שעסקה בעבר גם בסמכויות מעצר. בעקבות חקיקת חוק המעצרים החדש (חסד\"פ מעצרים), אוחדו סעיפי המעצרים תחת חוק המעצרים, וסעיפי המעצר בפקודה דלו ובוטלו. עם זאת, יתר הוראות הפקודה עומדות בתוקפן ומסדירות את סמכויות המשטרה בתקופת החקירה בנושאי חיפוש בחצרים/מקומות, בחומר מחשב, תפיסת חפצים, חילוטם, וכן <strong>חיפוש \"על גוף\"</strong>.</li><li><strong>חוק סדר הדין הפלילי (סמכויות אכיפה – חיפוש בגוף החשוד ונטילת אמצעי זיהוי), התשנ\"ו-1996 (\"חוק החיפוש\")</strong>: חוק מודרני שנחקק ב-1996 בעקבות חקיקת <strong>חוק יסוד: כבוד האדם וחירותו</strong>. החוק ביטל סעיפים מסוימים מהפקודה ויצר הסדר מפורט ומודרני המגדיר לפרטי פרטים את הסמכויות, הדרישות והפרוצדורות לעריכת <strong>חיפוש \"בגוף\"</strong> (חיצוני ופנימי) ולנטילת אמצעי זיהוי (כגון DNA, תביעות אצבע ובדיקות גינקולוגיות).</li><li><strong>דברי חקיקה משלימים לדיני חקירה</strong>: חקירת חשודים מוסדרת בחוק סדר הדין הפלילי (חקירת חשודים), התשס\"ב-2002, וחקירת עדים מוסדרת בפקודת העדות. ### ב. הגדרת הגורם השיפוטי המוסמך (\"שופט\")</li></ol><p>סעיף 1 לפקודה מגדיר מפורשות כי \"שופט\" לעניין הפקודה הוא <strong>שופט בית משפט מחוזי או שופט בית משפט שלום</strong>, אלא אם נאמר אחרת. החוק מעניק סמכות מקבילה ומלאה לשתי הערכאות להוציא צווי חיפוש. ### ג. הבחנת היסוד: חיפוש \"על גוף\" מול חיפוש \"בגוף\"</p><p>בפתח הדיון בדיני חיפוש קיימת חובה להבחין בין שני מושגים שונים בעלי משמעות משפטית נפרדת:</p><ul><li><strong>חיפוש \"על גוף\" (Pat-down)</strong>: חיפוש שנערך על פני גופו של אדם, בבגדיו או בכליו (כגון בתיק שלו). הפעולה הפיזית היא <strong>מישוש</strong> של גוף האדם, כיסיו, בגדיו וחפציו בידי השוטר. חיפוש זה מוסדר בפקודת מעצר וחיפוש.</li><li><strong>חיפוש \"בגוף\"</strong>: חיפוש המוסדר בחוק החיפוש מ-1996, הנחלק לשני סוגים: <em> <strong>חיפוש חיצוני</strong>: חיפוש בגופו של אדם </em>ללא חדירה<em> לתוך הגוף. </em> <strong>חיפוש פנימי</strong>: חיפוש בגופו של אדם בעל מאפיינים <em>חודרניים</em> לתוך הגוף (חדירה פיזית או וירטואלית).</li></ul></section><section class=\"release-subtopic\"><h3>חיפוש על גוף ללא צו, חיפוש בעצור וחיפוש על אישה</h3><h4>א. מקורות נורמטיביים וסעיפי חוק</h4><ul><li><strong>פקודת סדר הדין הפלילי (מעצר וחיפוש) [נוסח חדש], התשכ\"ט-1969</strong> (להלן: \"הפקודה\"): <em> <strong>סעיף 22</strong>: חיפוש בעצור. </em> <strong>סעיף 46</strong>: חיפוש על גופה של אישה.</li><li><strong>הלכה פסיקתית מנחה</strong>: אברהם בן חיים נ' מדינת ישראל. ### ב. ארבעת המסלולים לחיפוש על גוף ללא צו שיפוטי (חלופות)</li></ul><ol><li><strong>מסלול 1: חשד סביר</strong>: קיומו של חשד סביר אובייקטיבי אצל השוטר שאותו אדם מחזיק בחפץ שהחזקתו אסורה (כגון סכין, או אקדח שלא ברישיון) או שהוא מושא לחיפוש על ידי המשטרה.</li><li><strong>מסלול 2: הסכמה מדעת בהיעדר חשד סביר (הלכת בן חיים)</strong>: בהיעדר חשד סביר, חיפוש על גוף מותר אם החשוד הסכים לכך מדעת – לאחר שהשוטר הבהיר לו מפורשות כי זכותו לסרב לחיפוש וכי סירובו לא יפעל לחובתו ולא ישמש נגדו.</li><li><strong>מסלול 3: חיפוש בעצור (סעיף 22 לפקודה)</strong>: ברגע שאדם נעצר, קמה לשוטר העוצר סמכות מיידית לבצע חיפוש על גופו.</li><li><strong>מסלול 4: פקודת הסמים המסוכנים</strong>: יסוד סביר להניח שהאדם נושא עמו שלא כדין סם מסוכן (כולל חיפוש ברכב). <em>[המקור מציין מפורשות כי סמכות זו אינה נלמדת בקורס זה]</em>. ### ג. פרוצדורת חיפוש בעצור וכלל \"חילוף הידיים\" (סעיף 22)</li></ol><ul><li><strong>תכלית החיפוש בעצור</strong>: לוודא שהעצור אינו נושא כלי נשק, סכינים או חומרים מסוכנים שיכולים לפגוע בו, בשוטר, בסוהר או בסביבה.</li><li><strong>כלל חילוף הידיים</strong>: הסמכות לביצוע חיפוש על גוף (Pat-down) קמה ברגע המעצר ברחוב, והיא <strong>מתחדשת וקמה מחדש בכל פעם שהעצור עובר גורם משמורת</strong>: <em> מעבר משוטר א' לשוטר ב'. </em> מעבר משוטר לחוקר בתחנת המשטרה. <em> מעבר משוטר לסוהר בשירות בתי הסוהר. </em> מעבר מסוהר לסוהר. ### ד. חיפוש על גופה של אישה (סעיף 46)</li><li><strong>הוראת החוק</strong>: חיפוש על גופה של אישה (מישוש בגדים/כיסים/כלים) ייעשה <strong>אך ורק בידי אישה</strong> (שוטרת או סוהרת) – לעולם לא בידי שוטר/סוהר זכר.</li><li><strong>תוצאת הפרה</strong>: חיפוש על גוף אישה שבוצע על ידי גבר מהווה הפרה ישירה של הוראת סעיף 46 לפקודה.</li></ul></section><section class=\"release-subtopic\"><h3>חיפוש בחצרים ועל אדם בחצרים מכוח צו שופט והסמכויות הנלוות</h3><h4>א. המקור הנורמטיבי וסעיפי החוק</h4><ul><li><strong>פקודת סדר הדין הפלילי (מעצר וחיפוש) [נוסח חדש], התשכ\"ט-1969</strong> (להלן: \"הפקודה\"): <em> <strong>סעיף 1</strong>: הגדרת שופט המוסמך לפיה. </em> <strong>הוראות החוק, 23, 24, 29, 30, 45</strong>: הסדרת צווי החיפוש בחצרים, היקפם והסמכויות הנלוות להם. * <strong>סעיף 20</strong>: חובת הסיוע מהציבור. ### ב. העילות החלופיות למתן צו חיפוש בחצרים (סעיף 23 לפקודה)</li></ul><p>שופט שלום או שופט מחוזי מוסמך להוציא צו חיפוש בכל בית או מקום בהתקיים אחד מאלה:</p><ol><li><em>הבטחת הצגת חפץ</em>: החיפוש נחוץ כדי להבטיח את הצגת החפץ הדרוש לצורך חקירה, משפט או הליך אחר (מנגנון לשמירת ראיות).</li><li><em>חפץ גנוב/אסור/קשור לעבירה</em>: יש יסוד להניח שבמקום מוחזק חפץ גנוב, חפץ הקשור לעבירה (כגון מוצגים), או חפץ למטרה בלתי חוקית (כגון מבחנות המיועדות לייצור קטמין).</li><li><em>עבירה נגד אדם במקום</em>: יש יסוד להניח שנעברה עבירה נגד אדם הנמצא במקום (כגון אדם שעובר עינויים) או שמתכוונים לעבור עבירה נגדו (כגון כוונה לחטוף אותו). ### ג. הגדרת היקף ה\"חצרים\" המכוסה בצו</li></ol><ul><li><strong>הכלל</strong>: המושג \"חצרים\" כולל את הבית עצמו, כל קומותיו, השטח שמתחת לבית, גג הבית, החניה, הגינה, המרפסת, המחסן וכל השטח הכלול בצו.</li><li><strong>החריג/הסייג</strong>: אם השופט הגביל מפורשות בצו את שטח החיפוש (כגון \"אני מתיר לחפש רק בחניה\"), החיפוש מוגבל אך ורק לשטח שהוגדר. אם הצו אינו מוגבל, הסמכות משתרעת על כל שטח החצרים של הדירה/הבית. ### ד. פרוצדורה וסמכויות נלוות בעת ביצוע צו חיפוש בחצרים</li><li><strong>נוכחות שופט (סעיף 30)</strong>: שופט רשאי להורות שיערך בפניו חיפוש בכל בית או מקום שהוא רשאי לתת צו חיפוש לגביו.</li><li><strong>סמכות מעצר נלווית (סעיף 24)</strong>: ברגע שניתן צו חיפוש, קמה לשוטר המבצע סמכות מעצר לגבי כל אדם הנמצא במקום והנחזה כמי שקשור בעבירה שנעברה או שמתכוונים לעבור באותו החפץ.</li><li><strong>תפיסת חפץ שלא הוזכר בצו</strong>: שוטר המבצע חיפוש מכוח צו ומוצא חפץ חשוד שלא נזכר בצו (כגון מקרר חכם או חפץ חשוד אחר), אך יש יסוד להניח שהוא קשור לביצוע עבירה פלילית – רשאי לתפסו ולהביאו בפני השופט שנתן את הצו, והשופט יורה כיצד לפעול.</li><li><strong>חיפוש על אדם בחצרים (סעיף 29)</strong>: סמכות לערוך חיפוש על גופו (Pat-down / מישוש בבגדים, כיסים וכלים) של אדם הנמצא בחצרים שמחפשים בהם, אם יש יסוד לחשוב שהוא מסתיר אצלו את החפץ שמחפשים.</li><li><strong>כניסה בכוח ופריצת מנעולים (סעיף 45)</strong>: אדם הגר במקום שניתנה הרשות להיכנס אליו חייב לאפשר כניסה חופשית והקלה סבירה (כגון פתיחת ארונות נעולים). סירב – רשאי הזכאי להיכנס לבצע את הכניסה בכוח (לפרוץ דלתות וארונות נעולים בכוח סביר).</li><li><strong>חובת סיוע מהציבור (סעיף 20)</strong>: כל אדם חייב לעזור לשוטר הדורש זאת באופן סביר לצורך מעצר אדם שהוא מוסמך לעצרו או למנוע את בריחתו.</li></ul></section><section class=\"release-subtopic\"><h3>חיפוש בחצרים ללא צו ונוהל החיפוש וחובת העדים</h3><h4>א. המקור הנורמטיבי וסעיפי החוק</h4><ul><li><strong>פקודת סדר הדין הפלילי (מעצר וחיפוש) [נוסח חדש], התשכ\"ט-1969</strong> (להלן: \"הפקודה\"): <em> <strong>סעיף 25</strong>: חיפוש בחצרים ללא צו שופט (4 המקרים). </em> <strong>סעיף 26</strong>: נוהל עריכת חיפוש וחובת שני עדים אזרחיים. <em> <strong>סעיף 29</strong>: חיפוש על אדם הנמצא בחצרים. </em> <strong>סעיף 45</strong>: דרישת כניסה חופשית ושימוש בכוח. ### ב. פירוט ארבעת המקרים לחיפוש בחצרים ללא צו (סעיף 25 לפקודה – רשימה סגורה)</li></ul><p>שוטר מוסמך להיכנס ולחפש בכל בית או מקום בלא צו חיפוש <strong>אך ורק באחד מ-4 המקרים הבאים (רשימה סגורה לחלוטין)</strong>:</p><ol><li><strong>פשע או פשע זה מקרוב (סעיף 25(א))</strong>: קיים יסוד להניח שמבצעים במקום עבירה מסוג פשע, או שבוצע שם פשע \"זה מקרוב\". <em> </em>דוגמאות מהשיעור<em>: </em> ריח חזק ביותר של סמים המעלים יסוד להניח שמתבצעת במקום עבירת סחר בסמים (פשע). <em> זיהוי אדם (כגון שושנה) המדדה מהבית עם מזרקים על הוריד ומתעלפת ברחוב, המלמד כי בוצע בבית פשע \"זה מקרוב\". </em> שמיעת יריית אקדח מתוך הבית.</li><li><strong>תופס הבית/המקום פנה לעזרת המשטרה (סעיף 25(ב))</strong>: תופס הבית פנה בעצמו לזמן את המשטרה ולבקש סיוע. <em> </em>היקף הסמכות*: מותר להיכנס ולחפש <strong>בכל מצב</strong> שבו תופס הבית פנה לסיוע, גם ללא חשד לביצוע עבירה פלילית (כגון קריאה לחילוץ מארון או כוננית שנפלו עליו).</li><li><strong>אדם המצוי שם פנה לעזרת המשטרה ויש יסוד להניח שמבוצעת שם עבירה (סעיף 25(ג))</strong>: אדם הנמצא במקום (שאינו בהכרח תופס הבית) פונה לסיוע המשטרה (כגון צרחות \"הצילו משטרה\"), וקיים יסוד להניח שמבוצעת במקום עבירה. <em> </em>סוג העבירה*: די בקיומו של יסוד להניח שמבוצעת <strong>כל עבירה פלילית</strong> (גם עבירת עוון, כגון תקיפה סתם שדינה 3 שנות מאסר, ולא נדרש פשע).</li><li><strong>מרדף / רדיפה אחר אדם בורח (סעיף 25(ד))</strong>: השוטר נמצא ברדיפה אחר אדם המתחמק ממעצר או נמלט ממשמורת חוקית, <strong>אף אם חלף זמן ניכר בין ההימלטות לבין הרדיפה</strong>. <em> </em>דוגמה מהשיעור*: המצוד והרדיפה שנערכו אחר האנס המורשע בני סלע שנמלט ממשמורת. ### ג. נוהל עריכת חיפוש וחובת עדים (סעיף 26 לפקודה)</li></ol><ul><li><strong>הכלל (חובת שני עדים אזרחיים)</strong>: חיפוש בחצרים ייערך בנוכחות תופס המקום וכן <strong>שני עדים שאינם שוטרים</strong> (כגון שכן או סבתא מהקומה למטה).</li><li><strong>שלושת החריגים המתירים חיפוש ללא שני עדים</strong>: 1. קיימת <strong>דחיפות</strong> בעריכת החיפוש (כגון חשש שחשוד נמלט מסתתר בבית). 2. ניתן <strong>היתר מפורש משופט</strong> בצו החיפוש. 3. ביקש זאת <strong>תופס הבית או אחד מבני משפחתו</strong> הנוכחים שם (באמצעות חתימה על רובריקה ייעודית בדוח החיפוש). ### ד. סמכויות נלוות לחיפוש בחצרים</li><li><strong>חיפוש על אדם בחצרים (סעיף 29)</strong>: מותר לערוך חיפוש על גופו (Pat-down / מישוש בבגדים וכלים) של אדם הנמצא בחצרים שמחפשים בהם, אם קיים יסוד לחשוד שהוא מסתיר אצלו חפץ שמחפשים.</li><li><strong>כניסה בכוח ושימוש באמצעים סבירים (סעיף 45)</strong>: אדם הגר במקום/בית שמותר להיכנס אליו חייב לאפשר כניסה חופשית והקלה סבירה (כגון פתיחת ארונות נעולים); נדרש וסירב – מוסמכת המשטרה להיכנס ולפרוץ דלתות ומנעולים בכוח סביר.</li></ul></section><section class=\"release-subtopic\"><h3>חיפוש בחומר מחשב ובטלפון נייד</h3><h4>א. המקור הנורמטיבי וסעיפי החוק ### ב. הכלל והתנאים לחדירה לטלפון נייד ולמחשב</h4><ul><li><strong>חובת צו שיפוטי מפורש</strong>: בניגוד לחפצים רגילים או לחיפוש בחצרים/על גוף במקרים מסוימים, לגבי חומר מחשב אין שום סמכות חיפוש ללא צו שופט. הצו חייב לכלול <strong>היתר מפורש ומיוחד</strong> המציין חדירה לחומר מחשב.</li><li><strong>בעל תפקיד מיומן</strong>: החיפוש אינו מבוצע בידי שוטר רגיל, אלא בידי חוקרי מחשב במשטרת ישראל שעברו קורס והסמכה ייעודית מיומנת.</li><li><strong>הגנה על החומר המקורי (פרקטיקה נלמדת)</strong>: מיומנות החוקר נדרשת כדי למנוע נזק נתונים. בפרקטיקה מוציאים את הכונן הקשיח, מעתיקים אותו, ומבצעים את החיפוש על העותק המועתק בלבד כדי שלא ייגרם נזק לחומר המקורי. ### ג. הגדרת המושג בפסיקה (פסק דין אוריך)</li><li>טלפונים סלולריים חכמים (סמארטפונים) ואייפדים הוכרו בפסיקה באופן מלא כחומר מחשב.</li><li>הפסיקה המצוטטת באוריך מרחיבה את הגדרת מחשב לכל מכשיר בעל כרטיסי זיכרון או שבבים אלקטרוניים המעבדים ושומרים נתונים (כגון מקרר חכם המחובר לרשת). ### ד. סדרי הדיון, זכויות והיעדר ערר</li><li><strong>דיון במעמד צד אחד</strong>: הבקשה לקבלת הצו מוגשת לשופט (שלום או מחוזי) בדלתיים סגורות בדיון סודי. הרציונל: סיכול הסיכון שהחשוד יידע על הליך הצו ויפעל למחיקת קבצים, הודעות או העלמת ראיות.</li><li><strong>סופיות ההחלטה והיעדר ערר</strong>: החוק אינו מעניק זכות לערור על החלטת בית המשפט בבקשה לצו חיפוש בחומר מחשב בשלב החקירה. ### ה. ממשק לתפיסת מחשב וזכויות העתקה</li><li><strong>מחשב של מוסד (עסק פרטי / רשות מדינה)</strong>: נדרש צו מיוחד; החזקה ללא נוכחות מחזיק מוגבלת ל-<strong>48 שעות</strong> (למנוע נזק כלכלי/ציבורי); הארכה מותנית בשימוע.</li><li><strong>מחשב פרטי</strong>: החזרה תוך <strong>30 ימים</strong> (אלא אם דרוש לחילוט/ראיה); הארכה בידי שופט שלום ב-30 ימים מעת לעת.</li><li><strong>זכות העתקת חומר (סעיף 32א לפקודה)</strong>: זכות המשתמש לקבל העתק תוך <strong>4 ימים</strong>; דחייה ע\"י סנ\"צ ב-4 ימים בכל פעם עד תקרת <strong>16 ימים</strong>; דחייה נוספת בידי שופט שלום עד <strong>15 ימים בכל פעם</strong>; <strong>סמכות מניעה</strong>: קצין (מפקח משנה ומעלה) רשאי למנוע העתק בשל חשש לשיבוש חקירה או ביצוע עבירה (כגון חומר פדופילי). על דחייה/מניעה ניתן לערור לבית משפט שלום.</li></ul></section><section class=\"release-subtopic\"><h3>תפיסת חפצים ומחשב, זכויות העתקה והחזרת תפוסים</h3><h4>א. המקור הנורמטיבי וסעיפי החוק</h4><ul><li><strong>פקודת סדר הדין הפלילי (מעצר וחיפוש) [נוסח חדש], התשכ\"ט-1969</strong> (להלן: \"הפקודה\"): <em> <strong>סעיף 31</strong>: טיפול בחפצים אסורים בהחזקה. </em> <strong>סעיף 32</strong>: סמכות תפיסה כללית ותפיסת מחשב (מוסד מול פרטי). <em> <strong>סעיף 32א</strong>: זכות העתקת חומר מחשב ומועדיה. </em> <strong>סעיף 35</strong>: כלל 6 החודשים להחזרת תפוס והארכת מועדים. * <strong>הוראות החוק</strong>: טיפול בחפץ שהוגש או לא הוגש כראיה.</li><li><strong>חוק עוולות מסחריות, התשנ\"ט-1999</strong>: * <strong>סעיף 21</strong>: השמדת נכסים שהופקו תוך עוולה או שימשו לביצועה. ### ב. סמכות התפיסה הכללית ועקרון החוקיות (סעיף 32)</li></ul><p>מכוח עיקרון החוקיות, עצם העובדה שלמשטרה נתונה סמכות לחפש בחצרים או על גוף, אינה מעניקה לה אוטומטית סמכות לתפוס חפצים. סמכות התפיסה היא סמכות נפרדת המעוגנת בסעיף 32 לפקודה.</p><p>שוטר מוסמך לתפוס חפץ בהתקיים יסוד להניח אחד מאלה (חלופות):</p><ol><li>באותו חפץ נעברה עבירה.</li><li>עומדים לעבור באותו חפץ עבירה.</li><li>החפץ עשוי לשמש ראיה במשפט (כגון סכין, סמים, או מסמכים).</li><li>החפץ ניתן כשכר בעד ביצוע עבירה (כגון ערמות מזומנים/דולרים אצל סוחר סמים או רוצח שכיר) או כאמצעי לביצועה. ### ג. חריגי תפיסת מחשבים: מוסד מול אדם פרטי</li></ol><ul><li><strong>תפיסת מחשב בשימוש \"מוסד\" (עסק פרטי או רשות מדינה)</strong>: <em> <strong>חובת צו</strong>: לא ייתפס מחשב של מוסד אלא <strong>לפי צו שופט מפורש</strong>. בהיעדר ציון מפורש בצו להתיר תפיסת מחשב, אסור למשטרה לתפוס אותו. </em> <strong>מגבלת 48 השעות</strong>: צו שניתן שלא בנוכחות המחזיק במחשב יאפשר תפיסה לתקופה של <strong>עד 48 שעות בלבד</strong>. <em> <strong>שימוע להארכה</strong>: הארכה מעבר ל-48 שעות מותנית במתן הזדמנות למחזיק המחשב (בעל העסק/מנהל המחלקה) להשמיע את טענותיו בפני השופט. </em> <strong>הרציונל</strong>: מניעת נזק כלכלי כבד לעסק פרטי, מניעת פגיעה בציבור הזקוק לשירותי רשות מדינה (כגון אזרח המבקש תיאום מס ברשות המסים), ומניעת בזבוז כספי ציבור. * <strong>הפרקטיקה</strong>: בפרקטיקה נדיר שניתנת הארכה מעבר ל-48 שעות, כיוון שחוקרי המחשב מעתיקים את הדיסק הקשיח תוך שעות ספורות ומחזירים את המחשב למוסד.</li><li><strong>תפיסת מחשב שאינו של מוסד (אדם פרטי)</strong>: <em> אם המחשב אינו דרוש לצורך חילוטו (מכירתו לטובת אוצר המדינה/פיצוי הקורבן) או להגשתו כראיה, <strong>חובה על המשטרה להחזירו תוך 30 ימים</strong>. </em> בית משפט השלום רשאי להאריך את התקופה מעת לעת בתקופות של <strong>עד 30 ימים בכל פעם</strong> (ללא הגבלה על מספר ההארכות). ### ד. זכות העתקת חומר מחשב וסמכויות עיכוב/מניעה (סעיף 32א)</li><li><strong>זכות היסוד של המשתמש</strong>: אדם המשתמש במחשב שנתפס (כגון סטודנט שכל חומרי הלימוד שלו למבחן בדיון פלילי שמורים במחשב) זכאי לקבל העתק מחומר המחשב <strong>תוך 4 ימים</strong> מיום התפיסה.</li><li><strong>מנגנון הדחייה המדורג</strong>: <em> <strong>סמכות קצין משטרה (סנ\"צ ומעלה)</strong>: רשאי להורות שמסירת ההעתק תידחה <strong>עד 4 ימים בכל פעם</strong>, ובלבד שסך כל תקופת הדחייה <strong>לא יעלה על 16 ימים</strong>. </em> <strong>סמכות בית משפט שלום</strong>: בנסיבות מיוחדות, רשאי לצוות שהמסירה תידחה לתקופות נוספות של <strong>עד 15 ימים בכל פעם</strong>.</li><li><strong>סמכות מניעה מוחלטת לכל קצין (ממ\"ש ומעלה)</strong>: * קצין משטרה בדרגת מפקח משנה (ממ\"ש) ומעלה (הדרגה הנמוכה ביותר = כל קצין) רשאי שלא לאפשר מסירת העתק אם קיים חשש סביר שמסירת ההעתק תביא לשיבוש חקירה או לביצוע עבירה (כגון מחשב המכיל חומר פדופילי).</li><li><strong>זכות ערר</strong>: על החלטה לדחות/למנוע מסירת העתק מחומר מחשב ניתן לערור בפני <strong>בית משפט השלום</strong>. ### ה. דיני החזרת תפוסים וטיפול בחפצים אסורים (סעיף 31)</li><li><strong>כלל השישה חודשים (סעיף 35)</strong>: אם תוך <strong>6 חודשים</strong> מיום תפיסת החפץ (כל חפץ: אקדח, סכין, מסמכים, מזומנים) לא הוגש כתב אישום במשפט שבו החפץ צריך לשמש ראיה ולא ניתן צו שיפוטי בעניינו – <strong>חובה על המשטרה להחזיר את החפץ</strong> לאדם שממנו נלקח.</li><li><strong>הארכת מועד התפיסה</strong>: בית משפט השלום רשאי להאריך את תקופת ה-6 חודשים לבקשת שוטר או <strong>\"כל אדם מעוניין\"</strong>.</li><li><strong>טיפול בחפץ שהוגש/לא הוגש כראיה </strong>: <em> הוגש החפץ כראיה – בית המשפט יורה בפסק הדין או בצו מיוחד מה ייעשה בו (כגון השמדת סמים בסוף המשפט). </em> לא הוגש החפץ כראיה – בית המשפט יורה על מסירתו לתובע הזכות בו או שינהגו בו בדרך אחרת (כגון החזרה או השמדה).</li><li><strong>טיפול בחפצים אסורים בהחזקה אף בהיעדר אישום (סעיף 31 לפקודה / סעיף 21 לחוק עוולות מסחריות)</strong>: <em> הובא בפני שופט חפץ שאסור להשתמש בו או להחזיקו לפי דין (כגון סמים או אקדח ללא מספר סידורי), רשאי השופט להורות על החרמתו או השמדתו <strong>אף בהיעדר העמדה לדין</strong> (אף אם תיק החקירה נסגר ולא הוגש כתב אישום). </em> הוראה מקבילה קיימת בסעיף 21 לחוק עוולות מסחריות לגבי השמדת נכסים שהופקו תוך ביצוע עוולה מסחרית או ששימשו לביצועה.</li></ul></section></div><div class=\"release-layer\"><h2>הרחבה מקיפה</h2><section class=\"release-subtopic\"><h3>המסגרת הנורמטיבית של דיני החיפוש והבחנת היסוד בין חיפוש \"על גוף\" לחיפוש \"בגוף\"</h3><h4>א. ניתוח היחס בין הפקודה המנדטורית לבין חוק החיפוש (1996)</h4><p>הניתוח הנורמטיבי מלמד על חלוקת עבודה קשיחה בין הפקודה המנדטורית לבין חוק החיפוש המודרני:</p><ul><li><strong>מה שנותר בפקודה</strong>: בעקבות רפורמת חוק המעצרים, נותקו סמכויות המעצר מהפקודה ועברו לחוק המעצרים. הפקודה נותרה המקור הנורמטיבי השולט על חיפוש במרחב הפיזי והחפצי (חצרים, מקומות, תפיסת חפצים, חילוט, חדירה לחומר מחשב) וכן על חיפוש פני השטח של הגוף – <strong>חיפוש \"על גוף\"</strong> (Pat-down / מישוש).</li><li><strong>מה שעבר לחוק החיפוש</strong>: בעקבות חוק יסוד: כבוד האדם וחירותו, ביקש המחוקק ליצור הסדר חוקתי מפורט וקפדני המגן על כבוד האדם ופרטיותו בעת פגיעה בגופו. לפיכך, כל חיפוש שנכנס אל תוך גבולות הגוף – בין אם באופן חיצוני ובין אם חודרני – הוצא מפקודת מעצר וחיפוש והוכפף בלעדית להוראותיו המפורטות של חוק החיפוש. ### ב. ניתוח מעמיק של הבחנות החיפוש (על גוף / חיצוני / פנימי)</li><li><strong>חיפוש \"על גוף\" (על פני הגוף)</strong>: התיחום המשפטי מוגבל למעטפת החיצונית ביותר – מישוש בגדי האדם, כיסיו והכלים/התיק שהוא נושא עמו. אין מדובר בהפשטה, בחשיפת איברים מוצנעים או בבדיקה חודרנית, אלא בבדיקת מגע ומישוש חיצונית בלבד.</li><li><strong>חיפוש \"בגוף\" – חיפוש חיצוני</strong>: מדובר בחיפוש בגוף עצמו לפי חוק החיפוש, אך כזה ש<strong>אינו כולל חדירה</strong> לתוך רקמות הגוף או נקביו.</li><li><strong>חיפוש \"בגוף\" – חיפוש פנימי</strong>: מדובר בחיפוש בעל מאפיינים חודרניים לתוך הגוף. חדירה זו יכולה להיות <strong>חדירה פיזית</strong> (כגון הוצאת נוזלי גוף או חדירה לנקבים) או <strong>חדירה וירטואלית</strong> (כגון צילום רנטגן או הדמיה הפורצת את מעטפת הגוף הפיזית). ### ג. דגשי מרצה, מלכודות מבחן והבחנה בין פרקטיקה לדין</li><li><strong>מלכודת סמכות השופט (סעיף 1 לפקודה)</strong>: <em> המרצה מזהיר שוב ושוב מפני נפילה במלכודת הפרקטיקה. בחיים המעשיים בשטח, חוקרי המשטרה פונים באופן כמעט בלעדי לשופטי בית משפט השלום לצורך הוצאת צווי חיפוש. </em> עם זאת, <strong>במבחן האקדמי חל איסור מוחלט להתייחס לפרקטיקה בשטח!</strong> לפי סעיף 1 לפקודה, לשופט בית משפט מחוזי נתונה סמכות חוקית מקבילה ושלמה להוציא צווי חיפוש בדיוק כמו לשופט בית משפט שלום. תשובה במבחן שתקבע כי רק לשופט שלום נתונה הסמכות להוציא צו לפי הפקודה – תיפסל.</li></ul></section><section class=\"release-subtopic\"><h3>חיפוש על גוף ללא צו, חיפוש בעצור וחיפוש על אישה</h3><h4>א. מהות הפעולה בחיפוש \"על גוף\" (Pat-down)</h4><p>חיפוש \"על גוף\" מוגבל למישוש פיזי של המעטפת החיצונית: השוטר המבצע ממשש את גופו של האדם, מחפש בכיסי בגדיו, בבגדיו עצמם, ובכליו (כגון בתיק שהוא נושא). אין מדובר בהפשטה, בחשיפת איברים מוצנעים או בחדירה לגוף. ### ב. ניתוח מעמיק של פסק דין בן חיים ()</p><ul><li><strong>סיפור המסגרת והעובדות</strong>: שוטרים פנו לאזרחים ברחוב בהיעדר חשד סביר וביקשו לערוך חיפוש על גופם. האזרחים נענו לבקשת השוטרים, ובחיפוש נתפסו אצלם חפצים אסורים (סכין/סמים).</li><li><strong>השאלה המשפטית</strong>: האם הסכמת אדם לחיפוש על גופו בהיעדר חשד סביר מכשירה את החיפוש, ומאיזה סוג צריכה להיות הסכמה זו?</li><li><strong>ההלכה שנקבעה</strong>: בית המשפט העליון קבע את מוסד <strong>\"ההסכמה מדעת\"</strong>. בהיעדר חשד סביר, הסכמת החשוד תכשיר חיפוש על גופו <strong>רק אם</strong> הובהר לו מפורשות מראש: 1. כי נתונה לו הזכות המלאה לסרב לביצוע החיפוש. 2. כי אם יבחר לסרב – סירובו לא יפעל לחובתו, לא ייזקף נגדו ולא ישמש כחשד סביר.</li><li><strong>מטרת אזכור פסק הדין בשיעור</strong>: לבסס את המסלול השני לחיפוש על גוף ללא צו (הסכמה מדעת כחלופה לחשד סביר) ולהדגיש את חובת ההסבר המוקדם המוטלת על השוטר. ### ג. ניתוח סעיף 46 לפקודה מול חוק החיפוש (1996) – דגש מרצה ומלכודות מבחן</li><li><strong>הכלל הקשיח בסעיף 46 לפקודה</strong>: סעיף 46 מורה באופן מוחלט כי חיפוש על גופה של אישה ייעשה <strong>אך ורק בידי אישה</strong>. בפקודת מעצר וחיפוש <strong>אין שום חריגים</strong> לכלל זה!</li><li><strong>ההבחנה מול חוק החיפוש (1996)</strong>: <em> בחוק החיפוש (1996) – העוסק בחיפוש </em>בגוף<em> (חיצוני ופנימי) – נקבע אמנם כלל של חיפוש בידי בן מינו, אך נקבעו לו <strong>3 חריגים</strong> המתירים חיפוש שלא בידי בן מינו (סיכון בלתי סביר לשלום הציבור, חיפוש ע\"י בעל מקצוע רפואי, או נטילת תביעת אצבע). </em> <strong>מלכודת מבחן קריטית</strong>: המרצה מזהיר מפורשות שלא להתבלבל ולא להעתיק את חריגי חוק החיפוש (1996) אל סעיף 46 לפקודה. כשמדובר בחיפוש <em>על גוף</em> לפי סעיף 46 לפקודה (Pat-down/מישוש בגדים) – <strong>החיפוש ייעשה תמיד אך ורק בידי אישה ללא שום חריגים!</strong></li></ul></section><section class=\"release-subtopic\"><h3>חיפוש בחצרים ועל אדם בחצרים מכוח צו שופט והסמכויות הנלוות</h3><h4>א. תרחיש החקירה הסמויה והדיון בדלתיים סגורות (תרחיש שושנה)</h4><p>המרצה ממחיש את המסלול לקבלת צו חיפוש בחצרים:</p><ul><li><em>התרחיש</em>: שושנה מגיעה לתחנת המשטרה ומדווחת על ריח חזק של סמים מהדירה מתחתיה. המשטרה פותחת בחקירה סמויה (תצפיות על לקוחות המגיעים לדירה, הגעת שוטרים לדירת שושנה והרחת הריח) כדי שהחשוד לא יעלים ראיות.</li><li><em>הפרוצדורה</em>: החוקר מגיע לשופט (שלום או מחוזי) עם תיק החקירה המכיל את עדות שושנה, עדויות השוטרים וצילומים. הבקשה מוגשת <strong>במעמד צד אחד</strong> בדלתיים סגורות ובדיון סודי ביותר, כדי שהמשיב לא ידע על הצו ולא יעלים את הראיות/הסמים. ### ב. ניתוח עומק של סמכות המעצר הנלווית (סעיף 24) – תרחיש משרד הביטחון</li><li><em>התרחיש המשפטי מהשיעור</em>: המשטרה פורצת לדירה עם צו חיפוש בגין עבירה של חדירה למחשבי משרד הביטחון. בחדר השינה נמצא הבן עם מחשבים מורכבים וחזקים. בדירה מתגוררת גם אמו, אישה ישישה בת 99 המשותקת בכיסא גלגלים.</li><li><em>היישום וההבחנה המשפטית</em>: הבן נעצר מיידית מכוח סעיף 24 כיוון שהוא נחזה כמי שקשור לעבירה. האם אינה נעצרת כיוון שברור לחלוטין שאינה נחזית כמי שקשורה לעבירה. סעיף 24 מעניק סמכות מעצר נלווית <strong>אך ורק לגבי אדם הנמצא במקום והנחזה כמי שקשור בעבירה</strong>. ### ג. ניתוח עומק של חיפוש על אדם בחצרים (סעיף 29) – תרחיש הפיג'מה</li><li><em>התרחיש המשפטי מהשיעור</em>: שוטרים מעירים את רובן מהמיטה בשעה 6 בבוקר לביצוע צו חיפוש בביתו, ועולה חשד שבכיס הפיג'מה שלו מוסתר דיסק-אונקי המכיל מידע הקשור לעבירה.</li><li><em>היישום המשפטי</em>: מכוח סעיף 29, הצו לחיפוש בחצרים כולל סמכות נלווית לבצע חיפוש על גופו (Pat-down) של אדם הנמצא בחצרים, אם יש יסוד לחשוב שהוא מסתיר אצלו חפץ שמחפשים. ### ד. דגשי מרצה ומלכודות מבחן</li></ul><ol><li><strong>סמכות מקבילה במבחן מול פרקטיקה</strong>: המרצה מזהיר שוב ושוב מפני נפילה במלכודת הפרקטיקה. בשטח המשטרה פונה כמעט מיוזמתה רק לשופטי שלום. במבחן האקדמי, לשופט בית משפט מחוזי ולשופט בית משפט שלום נתונה סמכות חוקית מקבילה לחלוטין לפי סעיף 1 לפקודה, ותשובה שתשלול סמכות משופט מחוזי תיפסל.</li><li><strong>היקף החצרים בצו</strong>: צו חיפוש סתמי מקיף את כל חצרי הדירה (בית, גג, מחסן, חניה, גינה, מרפסת). במבחן יש לבדוק האם השופט סייג את הצו מפורשות לשטח מסוים בלבד.</li></ol></section><section class=\"release-subtopic\"><h3>חיפוש בחצרים ללא צו ונוהל החיפוש וחובת העדים</h3><h4>א. ניתוח היחס וההבדלים המשפטיים בין חלופות סעיף 25</h4><p>המרצה מעמיד את ארבע החלופות של סעיף 25 על דיוקן המשפטי:</p><ol><li><strong>הבחנה בין סעיף 25(ב) לבין סעיף 25(ג)</strong>: <em> </em>סעיף 25(ב) (פניית תופס הבית)<em>: עוסק בפנייה של <strong>תופס הבית או המקום</strong>. המחוקק אינו מתנה סמכות זו בקיומו של חשד לעבירה פלילית! לפיכך, אם תופס הבית פונה למשטרה בבקשת חילוץ מאירוע אזרחי/בטיחותי (כגון ארון שנפל עליו), המשטרה מוסמכת להיכנס לחצרים ולבצע חיפוש. </em> <em>סעיף 25(ג) (פניית אדם המצוי שם)</em>: עוסק בפנייה של <strong>אדם המצוי במקום</strong> (שאינו בהכרח תופס הבית, כגון אורח או דייר משנה). מאחר שאין מדובר בתופס הבית, המחוקק מתנה את סמכות הכניסה והחיפוש בקיומו של יסוד להניח שמבוצעת במקום עבירה פלילית. <em> </em>רף העבירה בסעיף 25(ג)*: בשונה מסעיף 25(א) הדורש \"פשע\", סעיף 25(ג) מסתפק בכל <strong>עבירה</strong> פלילית, לרבות עבירת <strong>עוון</strong> (כגון עבירת תקיפה סתם שדינה 3 שנות מאסר).</li><li><strong>ניתוח סעיף 25(ד) והרדיפה (תרחיש בני סלע)</strong>: <em> הסעיף מעניק סמכות כניסה וחיפוש ללא צו בעת רדיפה אחר אדם המתחמק ממעצר או נמלט ממשמורת. </em> הסיפה של הסעיף קובעת כי הסמכות עומדת <strong>\"אף אם חלף זמן ניכר בין ההימלטות לבין הרדיפה\"</strong>. המרצה מדגים זאת באמצעות המצוד שנערך אחר האנס בני סלע: אף שחלפו ימים/שבועות מיום בריחתו, כל עוד המשטרה נמצאת בעיצומו של מרדף/מצוד אחר נמלט ממשמורת, קמה סמכות להיכנס ולחפש בחצרים שבהם נחשד שהוא מסתתר ללא צורך בהוצאת צו שיפוטי. ### ב. ניתוח עומק של נוהל העדים והפרקטיקה המשטרתית (סעיף 26)</li></ol><ul><li><strong>הפרוצדורה בדוח החיפוש</strong>: בדוח החיפוש המשטרתי הרשמי שממלא השוטר ושעליו חותם תופס הבית, קיימת רובריקה מובנית שבה תופס הבית חותם ומאשר כי הוא מבקש שמי מנוכחי הבית/בני משפחתו יהיו נוכחים, ומוותר על הבאת שני עדים אזרחיים חיצוניים. חתימה זו מפעילה את החריג השלישי בסעיף 26 ומכשירה את עריכת החיפוש ללא עדים.</li><li><strong>חריג הדחיפות (החריג הראשון)</strong>: כאשר מתקיים אירוע דחוף (כגון מרדף אחר עבריין נמלט המסתתר בבית), המשטרה פטורה מלהמתין להגעת עדים אזרחיים ומורשית לבצע את החיפוש באופן מיידי. ### ג. ניתוח סעיף 29 – חיפוש על אדם בחצרים (תרחיש הפיג'מה)</li><li><strong>היקף הסמכות</strong>: עצם הכניסה לבית מכוח סעיף 25 (או מכוח צו) אינה מעניקה סמכות אוטומטית לערוך חיפוש על גופו של כל אדם הנמצא במקום.</li><li><strong>התנאי בסעיף 29</strong>: חיפוש על גופו (Pat-down) של אדם הנמצא בחצרים מותנה בקיומו של <strong>יסוד לחשוד שהוא מסתיר אצלו חפץ שמחפשים</strong>.</li><li><strong>תרחיש הפיג'מה של המרצה</strong>: שוטרים נכנסים לביתו של רובן בשעה 6 בבוקר ועולה חשד שבכיס הפיג'מה שלו מוסתר דיסק-אונקי המכיל מידע קריטי הקשור לעבירה. במצב זה קמה סמכות לבצע חיפוש על גופו (Pat-down בכיס הפיג'מה) מכוח סעיף 29. ### ד. דגשי מרצה ומלכודות מבחן</li></ul><ol><li><strong>מלכודת דרגת העבירה בסעיף 25(א)</strong>: סעיף 25(א) דורש <strong>פשע בלבד</strong> (או פשע זה מקרוב). כניסת משטרה לבית ללא צו ביוזמתה (ללא פנייה מתוך הבית) בגין עבירת עוון בלבד – מהווה חיפוש בלתי חוקי!</li><li><strong>מלכודת דרגת העבירה בסעיף 25(ג)</strong>: בפניית אדם המצוי שם, הדין מסתפק ב<strong>כל עבירה</strong> (לרבות עוון).</li><li><strong>מלכודת סעיף 25(ב) מול 25(ג)</strong>: זכור כי פניית תופס הבית (25(ב)) אינה דורשת חשד לעבירה פלילית כלל, בעוד פניית אדם המצוי שם (25(ג)) דורשת חשד לעבירה פלילית.</li><li><strong>חובת העדים</strong>: חיפוש בחצרים שנערך ללא שני עדים אזרחיים וללא התקיימות אחד משלושת החריגים בסעיף 26 מהווה פגם דיוני קשה בעריכת החיפוש.</li></ol></section><section class=\"release-subtopic\"><h3>חיפוש בחומר מחשב ובטלפון נייד</h3><h4>א. מלוא העומק והגיונם של הכללים</h4><ul><li><strong>ייחודו של חומר מחשב וטלפון נייד</strong>: הטלפון הנייד והמחשב מכילים את מלוא צנעת חייו של אדם, נתונים אישיים, הודעות ומדיה. לפיכך נקבעה דרישה דווקנית של שתי משוכות קשיחות: צו שיפוטי הכולל היתר מפורש + ביצוע בידי בעל תפקיד מיומן בלבד.</li><li><strong>ניתוח פסק דין אוריך ומבחן הזיכרון/עיבוד הנתונים</strong>: <em> המרצה מפנה לפסק דין אוריך כדי להדגים כיצד בית המשפט יוצק תוכן מודרני להגדרת \"מחשב\". </em> ההגדרה המשפטית אינה מוגבלת למחשב נייח או נייד קלאסי. כל חפץ שיש לו יחידת עיבוד נתונים, זיכרון ושמירת נתונים בשבבים אלקטרוניים – ייחשב כמחשב. * <strong>דוגמת המקרר החכם מפי המרצה</strong>: המרצה מדגים כי ראה במו עיניו מקרר חכם עם מסך מגע וחיבור לרשת, המאפשר לצפות בטוויטר ולבדוק מוצרים חסרים. אם המשטרה מבקשת לחפש בזיכרון המחשב של מקרר כזה, חלים עליה בדיוק אותם כללים קשיחים: חובה להצטייד בצו שופט מפורש לחיפוש בחומר מחשב ולבצע את החדירה באמצעות חוקר מחשב מיומן.</li><li><strong>ניתוח סדרי הדיון והיעדר זכות ערר</strong>: <em> בשלב החקירה הסמויה/גלויה, הגשת הבקשה לצו במעמד צד אחד היא הכרח טקטי כדי למנוע את השמדת הראיה הדיגיטלית הקלה למחיקה בלחיצת כפתור. </em> היעדר זכות הערר מדגיש את סופיות החלטת השופט שדן בבקשה בשלב החקירה.</li><li><strong>ניתוח מנגנוני ההגנה והזמנים בתפיסת מחשב והעתקתו</strong>: <em> <strong>תפיסת מחשב מוסד (48 שעות)</strong>: המחוקק יצר איזון הדוק בין צורכי החקירה לבין מניעת שיתוק עסק פרטי או רשות ציבורית (כגון תפיסת מחשבים ברשות המסים). בפרקטיקה נדיר שניתנת הארכה מעבר ל-48 שעות, שכן חוקרי המחשב מעתיקים את הכונן תוך שעות ומחזירים את החומרה למוסד. </em> <strong>תפיסת מחשב פרטי (30 יום)</strong>: קצובה בזמן כדי למנוע פגיעה מתמשכת בחשוד, אך ניתנת להארכה מעת לעת ב-30 ימים בידי שופט שלום. <em> <strong>מנגנון העתקת חומר לסטודנט/משתמש (סעיף 32א)</strong>: מיועד למנוע נזק בלתי הפיך למשתמש (כגון סטודנט הלומד למבחן בדיון פלילי שחומרי הלימוד שלו נמצאים על המחשב שנתפס). זכותו לקבל העתק תוך 4 ימים. קצין (סנ\"צ ומעלה) רשאי לדחות ב-4 ימים כל פעם עד 16 ימים, ושופט שלום רשאי להאריך ב-15 ימים בכל פעם. </em> <strong>סמכות מניעה מוחלטת לכל קצין (ממ\"ש ומעלה)</strong>: כל קצין משטרה (אפילו בדרגה הנמוכה ביותר – מפקח משנה) מוסמך למנוע מסירת העתק אם קיים חשש סביר לשיבוש חקירה או לביצוע עבירה (כגון מחשב המכיל חומר פדופילי). על החלטה זו ניתן להגיש ערר לבית משפט שלום.</li></ul></section><section class=\"release-subtopic\"><h3>תפיסת חפצים ומחשב, זכויות העתקה והחזרת תפוסים</h3><h4>א. ניתוח עומק של תפיסת מחשבים והרציונל הכלכלי-ציבורי</h4><p>המרצה מבהיר את הרקע והגיונם של הכללים הדווקניים לגבי תפיסת מחשב מוסדי (סעיף 32(ב)):</p><ul><li><strong>האבחנה בין מוסד לאדם פרטי</strong>: המחוקק הבחין בין תפיסת מחשב של אדם פרטי לבין מחשב של \"מוסד\" (המוגדר בחוק כעסק פרטי או רשות מראשויות המדינה).</li><li><strong>אירועי העבר ברשות המסים (תרחיש שחיתות פקידי המסים 2008/2009)</strong>: המרצה מדגים כי המשטרה נדרשה בעבר להגיע ולתפוס מחשבים ברשויות מדינה (כגון רשות המסים ומע\"מ) במסגרת חקירות שחיתות.</li><li><strong>פגיעה בציבור ובזבוז כספי ציבור</strong>: תפיסת מחשבים ברשות מדינה משתקת את השירות לאזרח התמים (כגון אזרח המגיע לתיאום מס ואינו מקבל שירות) וגורמת לבזבוז כספי ציבור כאשר הפקידים יושבים בבטלה. בעסק פרטי, התפיסה עלולה להביא לקריסה כלכלית מידית ולפגיעה בעובדים ובלקוחות.</li><li><strong>סד הזמנים הקשיח של 48 השעות והפרקטיקה המשטרתית</strong>: בשל הנזק הכבד, נקצבה התפיסה ללא נוכחות המחזיק ל-48 שעות בלבד. בפרקטיקה, המשטרה אינה מגיעה לבקש הארכות מבית המשפט אלא חוקרי המחשב מעתיקים את הדיסק הקשיח תוך שעות ספורות ומחזירים את המחשב למוסד, והחיפוש ממשיך על הדיסק המועתק בלבד. ### ב. ניתוח עומק של מנגנון העתקת חומר מחשב (סעיף 32א) – תרחיש הסטודנט</li><li><strong>תרחיש הסטודנט מפי המרצה</strong>: שוטרים מגיעים עם צו חיפוש לביתו של סטודנט הלומד לקורס בדיון פלילי ותופסים את מחשבו הנייד שבוע לפני הבחינה. חומרי הלימוד והסיכומים שמורים במחשב.</li><li><strong>הסעד המשפטי</strong>: לפי סעיף 32א, קמה לסטודנט זכות מוקנית לקבל העתק מחומר המחשב תוך 4 ימים.</li><li><strong>סמכויות הדחייה והמניעה</strong>: <em> קצין בדרגת סנ\"צ ומעלה רשאי לדחות ב-4 ימים בכל פעם (עד 16 ימים). </em> שופט שלום רשאי להאריך ב-15 ימים בכל פעם. * <strong>חריג מניעה מוחלטת עקב פדופיליה/שיבוש</strong>: כל קצין משטרה (אפילו בדרגת מפקח משנה - ממ\"ש) מוסמך למנוע מסירת העתק אם יש חשש לשיבוש חקירה או אם המחשב מכיל חומר פדופילי, כדי למנוע ביצוע עבירה נוספת. על החלטה זו ניתן להגיש ערר לבית משפט השלום. ### ג. ניתוח עומק של מנגנון החזרת התפוסים והפרקטיקה המשטרתית</li><li><strong>כלל 6 החודשים והרציונל</strong>: תפיסת חפץ פוגעת בזכות הקניין. אם המדינה לא הגישה כתב אישום תוך 6 חודשים ולא קבלה צו הארכה שיפוטי, חובה עליה להחזיר את החפץ לבעליו.</li><li><strong>פרקטיקת שוטר המוצגים המשטרתי</strong>: המרצה מפרט כי במחלקת המוצגים המשטרתית מכהן שוטר שזהו תפקידו הבלעדי: לעקוב אחר מועדי 6 החודשים ולהגיע באופן שוטף לבית משפט השלום לבקש הארכות החזקה במוצגים (בייחוד בתיקי הונאה ומסמכים מורכבים שאינם מסתיימים תוך חצי שנה).</li><li><strong>מעמד \"כל אדם מעוניין\" – תרחיש האקדח והאישה המאויימת</strong>: <em> סעיף 35 מעניק מעמד להגשת בקשת הארכה לא רק למשטרה אלא ל<strong>\"כל אדם מעוניין\"</strong>. </em> <em>תרחיש המרצה</em>: המשטרה תפסה אקדח ברישיון מבעל עקב חשד לעבירה. תיק החקירה נסגר ולא הוגש כתב אישום תוך 6 חודשים. לפי הכלל, הבעל זכאי לקבל את האקדח בחזרה. עם זאת, אשתו המאויימת והחוששת מאלימות משפחתית נחשבת \"אדם מעוניין\", וקמה לה זכות לפנות בעצמה לבית משפט השלום בבקשה להאריך את תפיסת האקדח ולמנוע את החזרתו לידיו. ### ד. דגשי מרצה ומלכודות מבחן</li></ul><ol><li><strong>סמכות תפיסה מול סמכות חיפוש</strong>: חיפוש אינו מעניק סמכות תפיסה אוטומטית. תפיסה דורשת עמידה בתנאי סעיף 32 (נעברה עבירה, אמצעי, שכר, או ראיה).</li><li><strong>מלכודת זמני מחשב</strong>: <em> מחשב מוסד ללא מחזיק ← עד <strong>48 שעות</strong> (הארכה מותנית בשימוע). </em> מחשב פרטי ← החזרה תוך <strong>30 ימים</strong> (הארכות ב-30 ימים בידי שופט שלום). <em> העתקת מחשב למשתמש ← תוך <strong>4 ימים</strong>. </em> דחיית העתקה ע\"י סנ\"צ ← ב-4 ימים עד <strong>16 ימים</strong> מקסימום. * דחיית העתקה ע\"י שופט שלום ← ב-<strong>15 ימים</strong> בכל פעם.</li><li><strong>מלכודת דרגת הקצין למניעת העתקה</strong>: מניעת העתקת חומר מחשב בשל חשש לשיבוש/פדופיליה נתונה ל<strong>כל קצין משטרה</strong> (מפקח משנה - ממ\"ש ומעלה) ולא רק לקצין בכיר.</li><li><strong>מלכודת סגירת תיק וחפצים אסורים (סעיף 31)</strong>: סגירת תיק חקירה אינה מחייבת החזרת חפץ אסור בהחזקה (כגון אקדח ללא מספר או סמים). שופט מוסמך להורות על השמדתו גם ללא כתב אישום.</li></ol></section></div><section class=\"release-2a-addition\"><h3>הרחבת שיעור 9 — arrest search legality principle</h3><p>שלום לך עמיתי וידידי היקר.</p><p>כפרופסור לסדר דין פלילי באקדמיה וכעוזר המחקר שלך, ניתחתי באופן כירורגי ומדוקדק את המקור המסומן בלבד (\"שיעור 9 ערוך.mp3\") והכנתי עבורך את תוכן הלימוד המפורט, המדויק והמוכן לאתר הקורס בנושא: \"המסגרת הנורמטיבית של דיני מעצרים וחיפוש ועיקרון החוקיות (סעיף 1 לחוק המעצרים)\".</p><p>---</p><h4>📚 המסגרת הנורמטיבית של דיני מעצרים וחיפוש ועיקרון החוקיות (סעיף 1 לחוק המעצרים)</h4><p>---</p><h4>1. תקציר הנושא</h4><p>הכלל המרכזי: עיקרון החוקיות בסעיף 1 לחוק המעצרים קובע כי אין מעצר ואין עיכוב אלא בחוק או לפי חוק מכוח הסמכה מפורשת, ובדרך שיבטיחו שמירה מרבית על כבוד האדם וחירותו.</p><p>התנאים המרכזיים:</p><p>1. הסמכה מפורשת בחוק: קיומה של הוראה מפורשת בחוק המתירה את הפגיעה בחירות (מעצר או עיכוב).</p><p>2. רשות מוסמכת: הפעלת הסמכות על ידי רשות אכיפה מוסמכת בלבד (משטרה, שב\"כ, רשות המסים וכיו\"ב).</p><p>3. שמירה על כבוד האדם: ביצוע המעצר או העיכוב בדרך המבטיחה שמירה מרבית על כבוד האדם וזכויותיו בהתאם לחוק-יסוד: כבוד האדם וחירותו.</p><p>החריג המרכזי: הוראות חוק המעצרים חלות על כל סוגי המעצרים בכל החוקים, אלא אם כן נקבעו בחוק ספציפי הוראות מיוחדות אחרות (כגון מעצר מנהלי בעבירות ביטחון).</p><p>סמכות / מועד חשוב:</p><p>תקרות זמן סטטוטוריות למעצר עד תום ההליכים (סעיף 61): מוגבל בחוק ל-9 חודשים במעצר רגיל, ו-18 חודשים במעצר בפיקוח אלקטרוני.</p><p>הארכת מעצר מעבר לתקרה (סעיף 62): נתונה בסמכותו הבלעדית של בית המשפט העליון.</p><p>הבחנה חשובה: הבחנה בין סמכות אכיפה הפועלת מכוח הסמכה מפורשת בחוק לבין פעולה ללא הסמכה בחוק – כל פגיעה בחירות שאינה מעוגנת בהוראה מפורשת בחוק היא בלתי חוקית באופן מוחלט.</p><p>נקודת מבחן מרכזית (הלכת ילנה מורוזובה): ביטול הרשעה והחזרת תיק על ידי ערכאת הערעור לדיון מחדש בערכאה הדיונית אינם מאפסים/קצבים מחדש את תקופת 9 החודשים של מעצר עד תום ההליכים. היעדר הסמכה מפורשת בחוק לאיפוס המרוץ מחייב את שחרור הנאשם או הגשת בקשת הארכה לבית המשפט העליון מכוח סעיף 62.</p><p>---</p><h4>2. קריאה מורחבת</h4><h4>א. מקור נורמטיבי וחוקים שהוזכרו</h4><p>חוק סדר הדין הפלילי (סמכויות אכיפה – מעצרים), התשנ\"ו-1996 (\"חוק המעצרים\"):</p><p>סעיף 1: מעגן את עיקרון החוקיות במעצר ועיכוב ואת החובה לשמור על כבוד האדם וחירותו.</p><p>סעיף 61: מסדיר את קציבת תקופת מעצר עד תום ההליכים (9 חודשים / 18 חודשים בפיקוח אלקטרוני).</p><p>סעיף 62: מסדיר את הסמכות הבלעדית של בית המשפט העליון להאריך מעצר עד תום ההליכים מעבר לתקרות הסטטוטוריות.</p><p>פקודת סדר הדין הפלילי (מעצר וחיפוש) [נוסח חדש], התשכ\"ט-1969: מסדירה את הכללים וההוראות העוסקים בחיפוש.</p><p>חוק סדר הדין הפלילי (סמכויות אכיפה – חיפוש בגוף חשוד ונטילת אמצעי זיהוי), התשנ\"ו-1996: מסדיר חיפוש בגוף חשוד ונטילת אמצעי זיהוי.</p><p>חוק-יסוד: כבוד האדם וחירותו: בפרט סעיף 8 (פסקת ההגבלה), החולש על פרשנות דיני המעצרים והחיפוש.</p><h4>ב. הכלל המשפטי ועיקרון החוקיות (סעיף 1)</h4><p>מהות עיקרון החוקיות בדיני אכיפה: הרשות השלטונית (המשטרה, שב\"כ, רשות המסים) רשאית לעשות אך ורק מה שורשה והוסמכה לכך מפורשות בחוק. האזרח מנגד מותר לו לעשות כל מה שלא נאסר.</p><p>הסמכה מפורשת לשלילת חירות: אין לעצור אדם ואין לעכב אדם אלא בחוק או לפי חוק מכוח הסמכה מפורשת.</p><p>שמירה על כבוד האדם: ביצוע המעצר והעיכוב חייב להיעשות בדרך שיבטיחו שמירה מרבית על כבוד האדם וחירותו.</p><h4>ג. תחולת החוק והגנות על כבוד האדם</h4><p>תחולה רוחבית: הוראות חוק המעצרים רלוונטיות לכלל רשויות האכיפה המוסמכות לעצור (כגון המשטרה ורשות המסים), אלא אם נקבעו הוראות ספציפיות בחוק ספציפי (כגון מעצר מנהלי בעבירות ביטחון).</p><p>הגנות מעשיות על כבוד האדם במהלך מעצר וחיפוש:</p><p>התאמת מין בחיפוש: איסור ביצוע חיפוש על ידי שוטר/ת ממין שונה (גבר על אישה או אישה על גבר).</p><p>הצנעת החיפוש והמעצר: חובה לבצע חיפוש ומעצר במקום מוצנע ולא בפומבי, למעט מקרים מיוחדים ודחופים (כגון חשש לחגורת נפץ).</p><p>ביקורת המרצה: המרצה מעביר ביקורת על הפרקטיקה המשטרתית המבצעת לעיתים מעצרים מתוכננים דווקא במקומות עבודה לעיני התקשורת והמצלמות (להבאת הנאשם באזיקים), דבר המודגש כמנוגד לרוח סעיף 1 החייב שמירה על כבוד האדם.</p><h4>ד. סמכויות, מועדים והשלכות (סעיפים 61 ו-62)</h4><p>מעצר עד תום ההליכים (סעיף 61): מעצר נאשם לאחר הגשת כתב אישום. מוגבל בחוק ל-9 חודשים.</p><p>מעצר בפיקוח אלקטרוני (סעיף 61): מעצר בבית החשוד באמצעות אזיק אלקטרוני בקרסול. מוגבל בחוק ל-18 חודשים.</p><p>הארכה בידי בית המשפט העליון (סעיף 62): אם המשפט אינו מסתיים בתוך 9 חודשים (או 18 חודשים בפיקוח אלקטרוני), המדינה מחויבת לפנות לבית המשפט העליון לקבלת צו הארכה מיוחד.</p><h4>ה. דוגמת המרצה והפסיקה (פס\"ד ילנה מורוזובה)</h4><p>עובדות המקרה: נגד ילנה מורוזובה הוגש כתב אישום והיא נעצרה עד תום ההליכים. במהלך המשפט היא שהתה במעצר ובסופו הורשעה. היא הגישה ערעור לבית המשפט העליון, ובית המשפט העליון ביטל את הכרעת הדין בשל פגם חמור בהליך והחזיר את התיק לבית המשפט המחוזי כדי לנהל את המשפט מההתחלה.</p><p>השאלה המשפטית: האם החזרת התיק לדיון מחדש מאפסת את מרוץ 9 החודשים של מעצר עד תום ההליכים ומאפשרת להחזיק את הנאשמת במעצר חדש ללא אישור העליון?</p><p>הכרעת בית המשפט העליון: לא! מכוח עיקרון החוקיות (סעיף 1), אין מעצר ללא סמכות מפורשת בחוק. כיוון שאין בחוק סעיף המאפשר קציבה מחדש או איפוס של תקופת המעצר עקב החזרת התיק, המדינה אינה רשאית לעצור אותה מחדש באופן אוטומטי, והיא מחויבת לפנות לבית המשפט העליון לקבלת צו הארכה לפי סעיף 62; בהיעדר אישור מהעליון – חייבים לשחררה.</p><h4>ו. משמעות מעשית למבחן</h4><p>בפתרון קייס במבחן, כאשר מוצגת פעולת מעצר/עיכוב שבוצעה ללא סעיף הסמכה ספציפי בחוק, או כאשר התביעה מנסה \"לאפס\" תקרות זמן של מעצר מטעמים פרוצדורליים – יש להחיל את עיקרון החוקיות מסעיף 1 ואת הלכת מורוזובה, ולהתריע כי הפעולה או המעצר הם בלתי חוקיים בעליל.</p><p>---</p><h4>3. הרחבה מקיפה</h4><h4>א. ניתוח המבנה הנורמטיבי והאיזון החוקתי</h4><p>סעיף 1 לחוק המעצרים מהווה את נקודת המוצא הארכיטקטונית של דיני שלילת החירות בישראל:</p><p>1. עיקרון החוקיות כבלם על כוח המדינה: במדינה דמוקרטית, לרשות אכיפה אין סמכות טבעית או טבועה לעצור אזרח. כל סמכות מעצר או עיכוב חייבת לנבוע מהוראת חוק מפורשת.</p><p>2. האיזון מול חוק-יסוד: כבוד האדם וחירותו: חוק המעצרים שנחקק ב-1996 נתפר במיוחד לפי מידותיה של פסקת ההגבלה (סעיף 8 לחוק היסוד). הדרישה לשמירה על כבוד האדם אינה הצהרתית בלבד, אלא נורמה משפטית המחייבת את השוטרים והשופטים לבחור באמצעי הפוגע פחות.</p><h4>ב. ניתוח עומק של פסק דין ילנה מורוזובה (יישום עיקרון החוקיות)</h4><p>1. סיפור המסגרת בקצרה: נגד ילנה מורוזובה הוגש כתב אישום והיא נעצרה עד תום ההליכים לפי סעיף 61 לחוק המעצרים. המשפט התנהל בבית המשפט המחוזי והיא הורשעה. מורוזובה הגישה ערעור לבית המשפט העליון. העליון מצא פגם כבד מאוד בניהול הדיון, ביטל את הכרעת הדין, והורה להחזיר את התיק לבית המשפט המחוזי כדי להתחיל את המשפט מחדש מבראשית.</p><p>2. טיעוני הצדדים: המדינה סברה כי ברגע שהמשפט מוחזר לתחילתו, \"נעצר השעון\" ומתחילה תקופת מעצר עד תום ההליכים חדשה של 9 חודשים. מנגד, הנאשמת טענה כי חלפו 9 חודשים ובהיעדר הוראה מפורשת בחוק המאפשרת איפוס, המעצר הפך לבלתי חוקי.</p><p>3. השאלה המשפטית: האם החזרת התיק לשמיעה מחדש בערכאה הדיונית מקנה סמכות לאפס את מרוץ 9 החודשים של מעצר עד תום ההליכים, או שמא עיקרון החוקיות מחייב פנייה לבית המשפט העליון לפי סעיף 62?</p><p>4. ההלכה שהוצאה והכרעת העליון: בית המשפט העליון קבע הלכה קשיחה מבוססת עיקרון החוקיות (סעיף 1 לחוק המעצרים): אין מעצר ללא סמכות מפורשת לפי חוק. החוק אינו מכיר בקונסטרוקציה של \"איפוס מעצר\" עקב החזרת תיק. לפיכך, בית המשפט המחוזי אינו מוסמך לפסוק מעצר עד תום ההליכים מחדש, והדרך החוקית היחידה להמשך המעצר היא הגשת בקשת הארכה לבית המשפט העליון מכוח סעיף 62.</p><p>5. מדוע המרצה מזכיר את פסק הדין: המרצה משתמש בהלכת מורוזובה כדי להמחיש לסטודנטים עד כמה עיקרון החוקיות בסעיף 1 הוא קשיח ומהותי, וכי בית המשפט אינו מוכן לקבל \"אקרובטיקה משפטית\" המייצרת סמכויות מעצר מכללא ללא הסמכה חוקית מפורשת.</p><h4>ג. מלכודות למבחן ודגשים מפורשים של המרצה</h4><p>1. מלכודת איפוס ימי המעצר (מורוזובה): במבחן, אם יוצג קייס שבו תיק הוחזר על ידי ערכאת הערעור לדיון מחדש והתביעה טוענת שהמרוץ של 9 החודשים מציב מעצר חדש מבראשית – קביעה כזו היא טעות קשה! חובה ליישם את הלכת מורוזובה ולקבוע שהסמכות היחידה להמשך המעצר היא פנייה לעליון לפי סעיף 62.</p><p>2. מלכודת הבלעדיות המשטרתית: עיקרון החוקיות בסעיף 1 חל על כל גורם שלטוני המבצע מעצר/עיכוב (כגון רשות המסים ושב\"כ), ולא רק על משטרת ישראל.</p><p>3. מלכודת הפגיעה בכבוד: פגיעה בכבוד הנחקר (כגון מעצר מתוקשר במפגין/עובד במקום עבודתו לעיני המצלמות) אינה רק סוגיה אתית, אלא הפרה חזיתית של סעיף 1 לחוק המעצרים.</p><p>---</p><h4>4. פסיקה וחקיקה</h4><h4>א. פסיקה שהוזכרה בנושא</h4><p>ילנה מורוזובה נ' מדינת ישראל:</p><p>מה פסק הדין מלמד בנושא: מעגן באופן קשיח את עיקרון החוקיות בסעיף 1 לחוק המעצרים. קובע כי החזרת תיק על ידי ערכאת הערעור להתחלת דיון מחדש בערכאה הדיונית אינה מקנה סמכות לאפס את מרוץ 9 החודשים של מעצר עד תום ההליכים (סעיף 61), והמסלול החוקי היחיד להמשך המעצר הוא הגשת בקשת הארכה לבית המשפט העליון מכוח סעיף 62.</p><h4>ב. חקיקה שהוזכרה בנושא</h4><p>חוק סדר הדין הפלילי (סמכויות אכיפה – מעצרים), התשנ\"ו-1996 (\"חוק המעצרים\"):</p><p>סעיף 1: מעגן את עיקרון החוקיות במעצר ועיכוב – אין מעצר ואין עיכוב אלא בחוק או לפי חוק מכוח הסמכה מפורשת, ובדרך שיבטיחו שמירה מרבית על כבוד האדם וחירותו; החלת החוק על כלל סוגי המעצרים והרשויות.</p><p>סעיף 61: מסדיר את קציבת תקופת מעצר עד תום ההליכים (9 חודשים במעצר רגיל, 18 חודשים בפיקוח אלקטרוני).</p><p>סעיף 62: מסדיר את סמכות בית המשפט העליון להאריך מעצר עד תום ההליכים מעבר לתקופות בסעיף 61.</p><p>פקודת סדר הדין הפלילי (מעצר וחיפוש) [נוסח חדש], התשכ\"ט-1969:</p><p>מה הוא מסדיר: מסדיר את המסגרת הנורמטיבית של דיני החיפוש.</p><p>חוק סדר הדין הפלילי (סמכויות אכיפה – חיפוש בגוף חשוד ונטילת אמצעי זיהוי), התשנ\"ו-1996:</p><p>מה הוא מסדיר: מסדיר את הסמכויות לחיפוש בגוף ואמצעי זיהוי.</p><p>חוק-יסוד: כבוד האדם וחירותו:</p><p>סעיף 8 (פסקת ההגבלה): הנורמה החוקתית החולשת על כלל סמכויות המעצר והחיפוש.</p><p>---</p><li>במה תעדיף להתמקד?</li></section>"},"body-search-identification":{"title":"חיפוש בגוף ונטילת אמצעי זיהוי","html":"<div class=\"release-layer\"><h2>קריאה מורחבת</h2><section class=\"release-subtopic\"><h3>חיפוש חיצוני בגוף — תנאים, סמכויות ושימוש בכוח</h3><h4>א. המקור הנורמטיבי ופירוט 12 הבדיקות החיצוניות</h4><ul><li><strong>12 הבדיקות המוגדרות בחוק כחיפוש חיצוני</strong>: 1. בחינת גופו הערום וצילומו (הפשטה מלאה וצילום). 2. נטילת תביעה של כל חלק מהגוף (תביעת אצבע, תביעת כף רגל). 3. לקיחת חומר מתחת לציפורניים. 4. גזירת ציפורניים. 5. לקיחת חומר מתוך הנחיריים. 6. לקיחת שיער (תלישה). 7. לקיחת חומר מעל הגוף (כגון שאריות קרם גוף). 8. בדיקה של העור ובדיקת תאי עור. 9. מתן דגימת שתן. 10. מתן דגימת רוק. 11. מתן דגימת אוויר באמצעות נשיפה (מכשיר הינשוף לבדיקת אלכוהול). 12. נטילת דגימה של תאי לחי (מטוש בלחי). ### ב. תנאים מצטברים ואופן ביצוע בהסכמה</li><li><strong>התנאים המצטברים (סעיף 3(א))</strong>: 1. <em>גורם מאשר</em>: שוטר רגיל מוסמך להורות על החיפוש ואינו נדרש להיות קצין. 2. <em>יסוד לחשד</em>: קיומו של יסוד סביר לחשוד שבגוף נמצאת ראיה להוכחת עבירה או הזיקה אליה. 3. <em>דרגת העבירה</em>: העבירה הנחקרת היא מסוג <strong>עוון או פשע</strong>. <strong>איסור מוחלט: אין לבצע חיפוש חיצוני בעבירת חטא!</strong>. 4. <em>הסכמה</em>: קבלת הסכמת החשוד.</li><li><strong>אופן הביצוע בהסכמה</strong>: השוטר רשאי לערוך את החיפוש בעצמו, להורות שייערך בידי בעל מקצוע מיומן, או לבקש מהחשוד לתת את הדגימה בעצמו (כגון לתלוש לעצמו שערה, למסור דגימת שתן או לנשוף למכשיר). ### ג. דרישת אישור רופא, בדיקות מרפאה וצניעות (פרהסיה)</li><li><strong>אישור רופא</strong>: ככלל, חיפוש חיצוני פטור מאישור רופא. <strong>החריג</strong>: אם החשוד העלה חשש בריאותי סביר שהחיפוש עלול לפגוע בבריאותו (פגיעה שאינה נובעת ממהות החיפוש), נדרש אישור רופא. סירב החשוד להיפגש עם רופא – יסביר לו קצין משטרה שסירובו עשוי לשמש חיזוק למשקל ראיות התביעה.</li><li><strong>בדיקות בתנאי מרפאה (בעל מקצוע מיומן)</strong>: גזירת ציפורניים, נטילת תביעת שיניים/מנשך, לקיחת חומר מתוך הנחיריים, ולקיחת שיער מחלקים מוצנעים של הגוף – <strong>חובה לבצע בתנאי מרפאה ובידי בעל מקצוע מיומן</strong> (רופא, אח, חובש, טכנאי).</li><li><strong>איסור פרהסיה</strong>: חיפוש חיצוני המחייב חשיפת חלקי גוף המוסתרים בדרך כלל <strong>לא ייערך בפרהסיה</strong>, אלא כאשר הדבר דרוש למנוע סכנה קרובה לוודאי לשלום הציבור (כגון חשיפת חולצה מחשש לחגורת נפץ). ### ד. פרוצדורת שימוש בכוח סביר בהיעדר הסכמה</li><li><strong>גורם מוסמך בלעדי</strong>: <strong>קצין משטרה בדרגת רב פקד (רפ\"ק) ומעלה!</strong> שוטר זוטר אינו מוסמך להתיר שימוש בכוח בחיפוש חיצוני.</li><li><strong>פרוצדורת השימוע וההסבר</strong>: החשוד מובא בפני קצין המשטרה (רפ\"ק ומעלה). הקצין נותן לו הזדמנות להשמיע את טעמי סירובו, ומסביר לו מפורשות כי ניתן להשתמש נגדו בכוח סביר ושסירובו עשוי לשמש חיזוק למשקל ראיות התביעה.</li><li><strong>חלוקת הדין: הבדיקות המותרות בכוח מול האסורות בכוח</strong>: <em> <strong>הרשימה הסגורה המותרת בשימוש בכוח סביר (6 בדיקות בלבד)</strong>: 1. בחינת גופו הערום וצילומו (הפשטה בכוח וצילום). 2. נטילת תביעה של כל חלק מהגוף (תביעת אצבע / כף רגל בכוח). 3. לקיחת חומר מתחת לציפורניים (גירוד מתחת לציפורניים בכוח). 4. לקיחת שיער (<strong>מראש החשוד בלבד</strong> בכוח). 5. לקיחת חומר מעל הגוף (כגון גירוד שאריות קרם גוף בכוח). 6. בדיקה של העור. </em> <strong>איסור מוחלט על שימוש בכוח בשאר הבדיקות החיצוניות</strong>: * אסור בתכלית האיסור לבצע בכוח: גזירת ציפורניים; לקיחת חומר מתוך הנחיריים; מתן דגימת שתן; מתן דגימת רוק; דגימת תאי לחי (מטוש); בדיקת נשיפה (ינשוף); תביעת שיניים/מנשך; ולקיחת שיער מחלקים מוצנעים (איברי המין). ### ה. תוצאות ההפרה ומשמעות הסירוב</li><li>בבדיקה שבה אסור להפעיל כוח – החיפוש לא מבוצע, וסירוב החשוד ישמש <strong>חיזוק למשקל ראיות התביעה</strong> (ובבדיקת נשיפה/אלכוהול – מוליד חזקה משפטית כאילו נהג תחת השפעת אלכוהול).</li><li>אם הופעל כוח סביר ברשימה המותרת והחיפוש בוצע בפועל – <strong>אין עוד משמעות ראייתית לסירוב</strong> (כיוון שהראיה נתפסה).</li></ul></section><section class=\"release-subtopic\"><h3>חיפוש פנימי בגוף — תנאים, אישורים רפואיים והיתר שיפוטי</h3><h4>א. המקור הנורמטיבי ו-5 הבדיקות המוגדרות כחיפוש פנימי</h4><ul><li><strong>המקור הנורמטיבי</strong>: חוק סדר הדין הפלילי (סמכויות אכיפה – חיפוש בגוף החשוד ונטילת אמצעי זיהוי), התשנ\"ו-1996 (להלן: \"חוק החיפוש\").</li><li><strong>הסמכות השיפוטית בחוק החיפוש (סעיף 1)</strong>: בית המשפט המוסמך לכל עניין לפי חוק החיפוש הוא <strong>בית משפט השלום בלבד</strong>.</li><li><strong>פירוט 5 הבדיקות המוגדרות כחיפוש פנימי</strong>: 1. <strong>בדיקת דם רגילה (מהוריד)</strong>: שאיבת מבחנות דם – חדירה פיזית. 2. <strong>הדמיית פנים הגוף (CT, MRI, אולטרסאונד)</strong>: חדירה וירטואלית. 3. <strong>שיקוף רנטגן</strong>: בדיקה וירטואלית הפורצת את מעטפת הגוף (כגון לבחון אם החשוד בלע שקיות סמים). 4. <strong>בדיקה גינקולוגית (לרבות נטילת חומר מאיבר המין)</strong>: חדירה פיזית. 5. <strong>נטילת דגימת דם מזערית מהאצבע</strong>: דקירה קטנה באצבע (כמו בדיקת סוכר) ונטילת 1–3 טיפות דם – חדירה פיזית. ### ב. התנאים המצטברים לחיפוש פנימי בהסכמה (הוראות החוק, 4א)</li></ul><p>להורות על חיפוש פנימי בהסכמת החשוד נדרשת התקיימותם של <strong>4 תנאים מצטברים</strong>:</p><ol><li><strong>גורם מאשר</strong>: קצין משטרה בדרגה כלשהי (זולת החריג של דגימת דם מזערית).</li><li><strong>יסוד לחשד</strong>: יסוד סביר לחשוד שבגוף נמצאת ראיה להוכחת עבירה.</li><li><strong>דרגת העבירה</strong>: העבירה הנחקרת היא מסוג <strong>פשע בלבד</strong>! (<strong>אין חיפוש פנימי בעבירת חטא או עוון</strong>).</li><li><strong>אישור רופא, הסבר ופגישה ביחידות</strong>: <em> חובה שרופא נתן אישור בכתב שאין מניעה בריאותית לערוך את החיפוש. </em> פגישת החשוד עם הרופא תיערך <strong>שלא בנוכחות שוטר</strong>. <em> הרופא מסביר לחשוד כי אין מניעה בריאותית ושואל אותו אם הוא מסכים. הסכמת החשוד ואישור הרופא בחתימתם מהווים את האסמכתא לביצוע החיפוש. </em> אם החשוד מסרב להיפגש עם רופא – יסביר לו קצין המשטרה כי סירובו עשוי לשמש חיזוק למשקל ראיות התביעה. ### ג. חריגים לתנאי החיפוש הפנימי</li><li><strong>חריג עבירת עוון (בדיקת דם)</strong>: בדיקת דם רגילה מהוריד ודגימת דם מזערית מהאצבע מותרות <strong>גם בעבירה מסוג עוון</strong> (אך עדיין אסורות בעבירת חטא!).</li><li><strong>חריג דגימת דם מזערית מהאצבע (סעיף 4א)</strong>: <em> מותרת בעוון ופשע. </em> מוסמך להורות בהסכמה: <strong>גם שוטר שאינו קצין</strong>. (אם נערכה בדיקת דם רגילה בהוראת שוטר שאינו קצין – אין בכך בהכרח להביא לפסילת תוצאות הבדיקה). <em> <strong>פטור מאישור רופא</strong>: אין צורך באישור רופא לדגימת דם מזערית (אלא אם התעורר חשש בריאותי סביר, כגון שימוש בתרופות למדללי דם). </em> <strong>חובת חלופה בסירוב</strong>: אם החשוד מסרב לדגימת דם מזערית (למשל מתוך פחד ממחטים) – חובה להציע לו חיפוש חיצוני חלופי: <strong>נטילת שיער</strong> או <strong>דגימת תאי לחי (מטוש)</strong>. רק אם סירב גם לבדיקות החלופיות הללו – עשוי סירובו לשמש חיזוק לראיות התביעה.</li><li><strong>חריג בדיקה גינקולוגית</strong>: <em> <strong>תמיד מחייבת היתר בית משפט (שופט שלום)!</strong> </em> חל על כל אדם (חשודה, עד, נפגעת עבירה/קורבן אונס). * גם אם האישה מסכימה בכתב וגם אם הרופא נתן אישור – <strong>אין בדיקה גינקולוגית ללא היתר מבית משפט שלום</strong>. ### ד. פרוצדורת חיפוש פנימי ללא הסכמה (היתר שיפוטי - הוראות החוק)</li></ol><ul><li><strong>איסור מוחלט על שימוש בכוח ע\"י קצין</strong>: קצין משטרה אינו מוסמך להורות על הפעלת כוח בחיפוש פנימי.</li><li><strong>פנייה לבית משפט השלום</strong>: בהיעדר הסכמה (או בבדיקה גינקולוגית), קצין המשטרה מגיש בקשת היתר לבית משפט השלום, בצירוף תצהיר או הצהרה מוזהרת המאשרים שהתקיימו התנאים ושלא ניתנה הסכמה.</li><li><strong>חריג יחיד לקצין שלא לפנות לבית המשפט</strong>: קצין רשאי להחליט שלא לפנות לבית המשפט אם <strong>השהיית עריכת החיפוש עלולה לפגוע בראיה</strong> (כגון חשש ששאריות סם שנבלע/סם אונס יתכלו ויצאו מהגוף בזמן הנדרש לפנייה לשופט).</li><li><strong>3 התנאים המצטברים למתן היתר משופט שלום</strong>: 1. נתקיימו התנאים בחוק לחיפוש פנימי (כולל אישור רופא). 2. הצורך בהשגת הראיה גובר על הפגיעה בחשוד. 3. אין דרך סבירה אחרת להשגת הראיה שפגיעתה פחותה.</li><li><strong>סדרי הדיון והוראות מיוחדות</strong>: <em> שמיעת החשוד, בא כוחו, ואפוטרופסו (בקטיו/מוגבל). </em> הדיון נערך <strong>בדלתיים סגורות</strong>; אך אם ביקש החשוד דיון פומבי – <strong>חובה</strong> לנהל דיון פומבי! <em> בית המשפט רשאי לעיין במידע/תיק חקירה חסוי ולהסתמך עליו בלי להראותו לחשוד/סנגורו. </em> <strong>תוקף ההיתר ומועדים</strong>: תוקף היתר השופט הוא <strong>עד 3 ימים</strong>. שופט שלום רשאי להאריכו לתקופות נוספות של <strong>עד 3 ימים בכל פעם</strong> מטעמים מיוחדים שיירשמו. ### ה. אוכלוסיות מיוחדות ושאינן חשודות</li><li><strong>קטינים ומוגבלים שכלית (סעיף 14ג)</strong>: נדרשת <strong>הסכמה כפולה בכתב</strong> (של הקטין/המוגבל ושל האפוטרופוס). מספיק שאחד מהם מסרב (הקטין מסרב או האפוטרופוס מסרב) כדי <strong>למנוע</strong> את החיפוש! (פטור מאפוטרופוס יתאפשר מטעמי טובת החקירה, טובת הקטין, או לבקשת הקטין). אם הקטין/המוגבל אינו מסוגל לחתום – מותר לבצע חיפוש בלבד שלא ייערך בניגוד לרצונו.</li><li><strong>אדם שאינו חשוד (עד / נפגע עבירה - סעיף 14)</strong>: מותר לבצע חיפוש פנימי בגופו (כגון נטילת דם לבדיקת סם אונס) רק בהסבר מפורש ו<strong>הסכמה בכתב</strong> (למעט בדיקה גינקולוגית שמחייבת היתר שופט בכל מקרה!). ### ו. משמעות הסירוב ו-4 החריגים (סעיף 11)</li><li><strong>הכלל</strong>: סירוב החשוד באמירה/התנהגות לחיפוש פנימי או למפגש עם רופא עשוי לשמש <strong>חיזוק לראיות התביעה</strong> (אם החיפוש לא בוצע באשמת החשוד). אם היתר השופט מומש והחיפוש בוצע בכוח – <strong>אין עוד משמעות לסירוב</strong>.</li><li><strong>4 החריגים שבהם סירוב לא ישמש חיזוק לראיות התביעה</strong>: 1. הסירוב לחיפוש הפנימי היה של האפוטרופוס (ולא של הקטין/המוגבל). 2. המשטרה לא הגישה בקשה לבית המשפט להתיר את החיפוש הפנימי בשל סירובו (זולת אם השהייה הייתה פוגעת בראיה). 3. בית המשפט דחה את בקשת המשטרה להיתר חיפוש פנימי. 4. לא ניתן אישור רפואי מרופא לביצוע החיפוש.</li></ul></section><section class=\"release-subtopic\"><h3>חיפוש בגוף באוכלוסיות מיוחדות ובמי שאינו חשוד</h3><h4>א. המקור הנורמטיבי וסמכות בית המשפט</h4><ul><li><strong>המסגרת הנורמטיבית</strong>: חוק סדר הדין הפלילי (סמכויות אכיפה – חיפוש בגוף החשוד ונטילת אמצעי זיהוי), התשנ\"ו-1996 (\"חוק החיפוש\").</li><li><strong>סמכות שיפוטית ייחודית (סעיף 1)</strong>: בית המשפט המוסמך לדון בכל בקשה, היתר או עניין לפי חוק החיפוש הוא <strong>בית משפט השלום בלבד</strong>. ### ב. חיפוש בגופו של אדם שאינו חשוד (עד / נפגע עבירה)</li><li><strong>תנאי הסמכות (חלופות)</strong>: שוטר מוסמך לערוך או להורות על עריכת חיפוש פנימי או חיצוני בגופו של אדם שאינו חשוד (עד, נפגע עבירה, או כל אזרח) בהתקיים אחד מאלה: 1. היה לשוטר יסוד סביר להניח שבגופו של אותו אדם נמצאת ראיה הנדרשת לצורך חקירת העבירה (כגון ראיית DNA מתחת לציפורניים). 2. החיפוש נדרש לשם בדיקת קשר אפשרי של אותו אדם לעבירה הנחקרת (כגון נטילת דגימת DNA מאזרח להצלבה מול זירת עבירה).</li><li><strong>תנאי מתחייב לביצוע</strong>: חובה לתת לאדם הסבר מפורש על החיפוש ולקבל את <strong>הסכמתו בכתב</strong>.</li><li><strong>סייג הבדיקה הגינקולוגית הקשיח</strong>: חל איסור מוחלט לערוך בדיקה גינקולוגית במי שאינה חשודה (כגון נפגעת עבירת אונס) אלא <strong>בהיתר מפורש מבית משפט השלום</strong>. הסכמתה בכתב של נפגעת העבירה ואישור הרופא אינם פוטרים את המשטרה מהחובה לפנות לשופט שלום לקבלת היתר. ### ג. חיפוש בגופו של קטין ואדם עם מוגבלות שכלית</li><li><strong>כלל ההסכמה הכפולה</strong>: עריכת חיפוש בגופו (חיצוני או פנימי) של קטין או אדם עם מוגבלות שכלית טעונה <strong>הסכמה בכתב כפולה</strong>: 1. הסכמה בכתב של הקטין או האדם עם המוגבלות השכלית. 2. <strong>בנוסף</strong>, הסכמה בכתב של האפוטרופוס (הורה או אפוטרופוס ממונה).</li><li><strong>כלל הסירוב</strong>: מספיק שאחד מהצדדים מסרב כדי <strong>למנוע ולחסום</strong> את החיפוש. אם הקטין מסרב – האפוטרופוס אינו יכול לאשר במקומו; אם הקטין מסכים והאפוטרופוס מסרב – החיפוש נחסם.</li><li><strong>חריגי פטור מהסכמת אפוטרופוס</strong>: לא תידרש הסכמת האפוטרופוס בהתקיים אחד מהבאים: 1. מטעמים של טובת החקירה. 2. מטעמים של טובת הקטין או האדם עם המוגבלות. 3. לבקשת הקטין (כאשר הקטין מסכים ומבקש מפורשות שלא יפנו להוריו/לאפוטרופוס שלו).</li><li><strong>חריג לאי-מסוגלות לחתום בכתב</strong>: כאשר הקטין או המוגבל השכלי אינו מסוגל לתת הסכמתו בכתב מחמת גילו (כגון ילד בן 13) או מחמת מוגבלותו (כגון אדם מורדם/מונשם או אוטיסט בתפקוד קיצוני) – ניתן לערוך חיפוש בגופו <strong>בלבד שהחיפוש לא ייערך בניגוד לרצונו!</strong></li></ul></section><section class=\"release-subtopic\"><h3>משמעות סירוב לחיפוש בגוף וארבעת החריגים</h3><h4>א. המקור הנורמטיבי ומשמעות הסירוב הראייתית</h4><ul><li><strong>מהות הסנקציה הראייתית</strong>: כאשר החוק אוסר על הפעלת כוח פיזי (כגון ברוב החיפושים החיצוניים ובכל החיפושים הפנימיים), המחוקק קובע סנקציה ראייתית חלופית: סירוב החשוד באמירה או בהתנהגות לעבור את החיפוש או להיפגש עם רופא – עשוי לשמש <strong>חיזוק למשקל ראיות התביעה</strong>.</li><li><strong>התנאי הבסיסי לחיזוק</strong>: החיפוש לא נערך <strong>באשמת החשוד ובשל סירובו</strong>. ### ב. הבחנה קריטית: חיפוש שלא בוצע מול חיפוש שבוצע בפועל</li><li><strong>כאשר החיפוש בוצע בפועל</strong>: <em> אם החשוד סירב לחיפוש חיצוני מהרשימה המותרת בשימוש בכוח (כגון תלישת שיער ראש או גירוד חומר מתחת לציפורניים), והמשטרה הפעילה כוח סביר ונטלה את השיער/החומר – החיפוש בוצע והראיה הושגה, ולפיכך <strong>אין עוד שום משמעות ראייתית לסירוב הראשוני</strong>. </em> כיוצא בזה, אם החשוד סירב לחיפוש פנימי, המשטרה פנתה לבית משפט השלום, השופט נתן היתר והחיפוש בוצע בכוח – החיפוש בוצע ו<strong>אין משמעות לסירוב</strong>.</li><li><strong>כאשר החיפוש לא בוצע באשמת החשוד</strong>: * החיפוש נחסם עקב סירוב החשוד (ולא ניתן/מותר היה לבצעו בכוח) – במצב זה מתגבש הסירוב כ<strong>חיזוק לראיות התביעה</strong> (ובבדיקת נשיפה/אלכוהול – מוליד חזקה משפטית כאילו נהג תחת השפעת אלכוהול). ### ג. פירוט ארבעת החריגים המנטרלים את החיזוק הראייתי (סעיף 11)</li></ul><p>בארבעת התרחישים הבאים, אף שהחשוד לא עבר חיפוש בגופו, <strong>סירובו לא ישמש חיזוק לראיות התביעה</strong> כיוון שהאי-ביצוע אינו רובץ באשמתו הבלעדית:</p><ol><li><strong>חריג 1 – סירוב האפוטרופוס (בקטיו/מוגבל שכלית)</strong>: הסירוב לחיפוש הפנימי היה של האפוטרופוס של החשוד ולא של החשוד הקטין/המוגבל עצמו. כיוון שהקטין/המוגבל לא סירב בעצמו, לא ניתן לזקוף את עמדת האפוטרופוס לחובת החשוד כחיזוק ראייתי.</li><li><strong>חריג 2 – מחדל המשטרה בפנייה לבית המשפט</strong>: החשוד סירב לחיפוש פנימי, אך קצין המשטרה לא הגיש בקשת היתר לבית משפט השלום (ולא התקיים החריג של חשש סביר שהשהיית הפנייה תביא לפגיעה/התכלות הראיה). כיוון שהמשטרה נמנעה מלהביא את העניין להכרעת שופט, אי-ביצוע החיפוש נובע ממחדל משטרתי ולא ייזקף לחובת החשוד.</li><li><strong>חריג 3 – דחייה שיפוטית בבית המשפט</strong>: המשטרה פנתה לבית משפט השלום לקבלת היתר לחיפוש פנימי, אך השופט דחה את הבקשה (קבע שלא התקיימו התנאים המצטברים או שהצורך הראייתי אינו גובר על הפגיעה בחשוד). החיפוש נמנע מכוח החלטה שיפוטית מוצדקת, ולפיכך עמידת החשוד על זכותו אינה מהווה חיזוק.</li><li><strong>חריג 4 – היעדר אישור רפואי (מניעה בריאותית)</strong>: לא ניתן אישור רפואי מרופא לביצוע החיפוש הפנימי (הרופא קבע כי החיפוש כרוך בסיכון בריאותי לחשוד). כיוון שהחיפוש נמנע מטעמים רפואיים, הדבר אינו באשמת החשוד ולא ישמש חיזוק.</li></ol></section></div><div class=\"release-layer\"><h2>הרחבה מקיפה</h2><section class=\"release-subtopic\"><h3>חיפוש חיצוני בגוף — תנאים, סמכויות ושימוש בכוח</h3><h4>א. ניתוח המבנה הנורמטיבי והאיזון החוקתי</h4><p>סעיף 3 לחוק החיפוש מציג איזון קפדני בין צורכי החקירה לבין הגנה על אוטונומית הרצון החופשי ופרטיות החשוד.</p><p>בשלב הראשוני, בהתקיים יסוד לחשד בעוון או פשע, המחוקק מתנה כל חיפוש חיצוני בקבלת הסכמת החשוד. כאשר החשוד מסרב, המחוקק שולל משוטר זוטר את הסמכות להפעיל כוח, ומפקיד סמכות זו בידי דרגה פיקודית בכירה – <strong>קצין משטרה בדרגת רפ\"ק ומעלה</strong>. הקצין נדרש לקיים הליך של שימוע (הזדמנות להשמיע טעמים) ולמסור אזהרה מפורשת בדבר השימוש בכוח וההשלכות הראייתיות של הסירוב. ### ב. הגיון הרשימה הסגורה של שימוש בכוח סביר</p><p>המרצה מנתח את הרציונל שמאחורי ההבחנה הדווקנית בין בדיקות שמותר לבצע בכוח לבין בדיקות שאסור לבצע בכוח:</p><ol><li><strong>בדיקות הניתנות לאכיפה פיזית פסיבית (רשימה מותרת)</strong>: בדיקות שבהן ניתן להתגבר על התנגדות החשוד על ידי החזקתו הפיזית בלבד, ללא סיכון בריאותי וללא דרישה לשיתוף פעולה אקטיבי מצידו (כגון הידוק היד למכשיר תביעות אצבע, גירוד חומר מתחת לציפורן, תלישת שערת ראש, או הפשטה וצילום).</li><li><strong>בדיקות הדורשות שיתוף פעולה אקטיבי או הכרוכות בסיכון/השפלה (רשימה אסורה)</strong>: <em> </em>דרישת שיתוף פעולה אקטיבי<em>: מתן שתן, נשיפה למכשיר הינשוף, יריקת רוק, או מתן תאי לחי במטוש. כיוון שלא ניתן \"לסחוט\" אדם פיזית לתת שתן או לנשוף בכוח, השימוש בכוח נאסר, והסירוב מומר בסנקציה ראייתית לחובתו. </em> <em>סיכון בריאותי/גופני</em>: גזירת ציפורניים בכוח או החדרת עצם לנחיריים בכוח עלולות לגרום לדימום ולפציעה, ולפיכך נאסרו בכוח (להבדיל מגירוד חומר מתחת לציפורן בלבד). <em> </em>פגיעה חמורה בצניעות*: תלישת שיער מאיברי המין/חלקים מוצנעים כרוכה בפגיעה קשה בכבוד, ולכן נאסרה בכוח (להבדיל מתלישת שיער ראש). ### ג. דוגמאות ותרחישים מפי המרצה</li></ol><ul><li><strong>תרחיש בדיקת הנשיפה (הינשוף)</strong>: שוטר תנועה עוצר נהג ומתגבש יסוד סביר לחשוד כי נהג תחת השפעת אלכוהול (עבירת עוון/פשע). מתן דגימת אוויר בנשיפה מוגדר כחיפוש חיצוני. השוטר מחויב לבקש את הסכמת הנהג. אם הנהג מסרב – אסור לשוטר או לקצין להפעיל כוח פיזי כדי להכריחו לנשוף. הנהג מובא בפני קצין, ואם עומד בסירובו – החיפוש אינו מבוצע, וקמה נגדו חזקה משפטית ראייתית כאילו נהג תחת השפעת אלכוהול.</li><li><strong>תרחיש שאריות קרם הגוף מעל העור</strong>: חשוד בביצוע עבירה שהתחכך בקורבן העבירה, ועל עורו נותרו שאריות קרם גוף של הקורבן. לקיחת חומר מעל הגוף מוגדרת כחיפוש חיצוני. החשוד מסרב לביצוע החיפוש. החשוד מובא בפני קצין בדרגת רפ\"ק ומעלה, ולאחר מתן הזדמנות להשמיע טענותיו ואזהרה – מוסמכת המשטרה לתפוס את החשוד בכוח סביר ולגרד מעל עורו את דגימת קרם הגוף.</li><li><strong>תרחיש החשש הבריאותי במחלת ריאות</strong>: חשוד שנבקש ממנו לנשוף למכשיר הינשוף טוען כי הוא סובל ממחלת ריאות קשה וכי הנשיפה המאומצת תפגע בבריאותו. במצב זה קמה חובה לקבל אישור רופא מראש. אם החשוד מסרב להיפגש עם רופא – קצין המשטרה יסביר לו כי סירובו לפגוש רופא ייזקף לחובתו כחיזוק לראיות התביעה.</li><li><strong>תרחיש חגורת הנפץ בפרהסיה</strong>: שוטרים מעכבים אדם ברחוב ועולה חשש קרוב לוודאי שהוא נושא חגורת נפץ מוסתרת תחת חולצתו. אף שהכלל אוסר על חיפוש חיצוני החושף חלקי גוף מוצנעים בפרהסיה, הדחיפות למניעת סכנה קרובה לוודאי לשלום הציבור מתירה לדרוש ממנו להתפשט ולחשוף את גופו בפרהסיה ברחוב. ### ד. דגשי מרצה ומלכודות מבחן</li></ul><ol><li><strong>איסור עבירת חטא</strong>: מלכודת נפוצה במבחנים היא הצגת תרחיש של עבירת חטא (כגון עבירת קנס/תעבורה קלה) שבה השוטר מבקש לבצע חיפוש חיצוני. <strong>זכור: אין שום סמכות לחיפוש בגוף (חיצוני או פנימי) בעבירת חטא!</strong>.</li><li><strong>דרגת הקצין המאשר שימוש בכוח</strong>: סמכות להתיר שימוש בכוח סביר בחיפוש חיצוני נתונה <strong>אך ורק לקצין משטרה בדרגת רפ\"ק ומעלה</strong> (רב פקד), ולא לסתם קצין משטרה.</li><li><strong>מלכודת הציפורניים</strong>: הבחנה חדה בין <em>לקיחת חומר מתחת לציפורניים</em> (מותר לבצע בכוח סביר) לבין <em>גזירת ציפורניים</em> (אסור בתכלית האיסור לבצע בכוח!).</li><li><strong>מלכודת השיער</strong>: תלישת שיער <em>מהראש</em> מותרת בכוח סביר באישור רפ\"ק; תלישת שיער <em>מחלקים מוצנעים / איברי המין</em> אסורה לחלוטין בכוח!.</li></ol></section><section class=\"release-subtopic\"><h3>חיפוש פנימי בגוף — תנאים, אישורים רפואיים והיתר שיפוטי</h3><h4>א. ניתוח המבנה הנורמטיבי והאיזון החוקתי בחיפוש פנימי</h4><p>המחוקק הישראלי התייחס לחיפוש פנימי בחרדת קודש חוקתית בשל עוצמת הפגיעה באוטונומיה, בפרטיות ובשלמות הגוף. בשל כך נקבעו שלוש משוכות הגנה שאינן קיימות בחיפוש חיצוני:</p><ol><li><strong>הגבלת דרגת העבירה</strong>: ככלל, רק עבירות מסוג <strong>פשע</strong> מקימות סמכות לחיפוש פנימי (למעט בדיקת דם המותרת בעוון).</li><li><strong>הפרדת סמכויות רפואית</strong>: החשוד מופגש עם רופא <strong>שלא בנוכחות שוטר</strong>, כדי לוודא שאישור הבריאות אינו מופעל תחת לחץ משטרתי.</li><li><strong>שלילת סמכות כוח מקצין והכפפה בלעדית לשופט שלום</strong>: לקצין משטרה אין שום סמכות להתיר שימוש בכוח בחיפוש פנימי. אם החשוד מסרב, ההכרעה מועברת באופן בלעדי לביקורת שיפוטית של שופט שלום. ### ב. תרחישים ודוגמאות לימודיות מפי המרצה</li></ol><ul><li><strong>תרחיש סם האונס בבדיקת דם בקורבן עבירה / חשוד</strong>: * המורכבות של סם האונס בדם: סם האונס מתכלה בגוף תוך שעות ספורות. כאשר מדובר בחשוד שחשוד כי נטל סם או בלע סם אונס, קצין משטרה מוסמך להחליט שלא לפנות לבית המשפט לקבלת היתר כיוון שהשהיית הפנייה לשופט תביא להתכלות הראיה ולפגיעה בלתי הפיכה בחקירה.</li><li><strong>תרחיש דגימת דם מזערית מהאצבע והחלופה</strong>: <em> שוטר מבקש מחשוד בעוון לקבל דגימת דם מזערית מהאצבע לצורך הפקת פרופיל DNA. החשוד מביע פחד קשה ממחטים ומסרב. </em> לפי סעיף 4א, סמכות השוטר מותנית בכך שיציע לחשוד חלופה של חיפוש חיצוני: <strong>נטילת שיער ראש</strong> או <strong>דגימת תאי לחי (מטוש)</strong>. אם החשוד מסכים לחלופה – מבוצע החיפוש החיצוני. רק אם החשוד עומד בסירובו גם לחלופות הלא-חודרניות, סירובו ייזקף לחובתו כחיזוק לראיות התביעה.</li><li><strong>תרחיש מדללי הדם (חשש בריאותי בדגימה מזערית)</strong>: * בדגימת דם מזערית מן האצבע אין ככלל צורך באישור רופא. אולם, אם החשוד טוען כי הוא נוטל תרופות מדללות דם במינון גבוה וכי כל דקירה באצבע תגרום לו לדימום מסיבי ומסוכן – קמה חובה להפסיק את ההליך ולקבל אישור רופא מראש.</li><li><strong>תרחיש בדיקה גינקולוגית בנפגעת אונס</strong>: <em> נפגעת אונס מגיעה לתחנה ומבקשת בעצמה לעבור בדיקה גינקולוגית כדי למצות את הראיות נגד התוקף. </em> המרצה מדגיש: על אף הסכמתה המלאה בכתב ועל אף שהיא נפגעת עבירה ולא חשודה – החוק אינו מתיר ביצוע בדיקה גינקולוגית ללא <strong>היתר מפורש מבית משפט השלום</strong>. המשטרה חייבת לפנות לשופט שלום לקבלת היתר.</li><li><strong>תרחיש פומביות הדיון לפי לבקשת החשוד</strong>: <em> קצין משטרה מגיש בקשה להיתר חיפוש פנימי שלא בהסכמה. הדיון נפתח בדלתיים סגורות כמנהג החוק להגנת פרטיות החשוד. החשוד מצהיר בפני השופט: \"אני רוצה שהעיתונאים ייכנסו והדיון יהיה פומבי לחלוטין!\". </em> לשופט <strong>אין שיקול דעת</strong>: ברגע שהחשוד ביקש פומביות, חובה עליו לפתוח את דלתות בית המשפט לציבור ולתקשורת. ### ג. דגשי מרצה ומלכודות מבחן</li></ul><ol><li><strong>איסור עבירת חטא ועוון בחיפוש פנימי</strong>: חיפוש פנימי מותר <strong>אך ורק בעבירת פשע</strong>! החריג היחיד שבו מותר חיפוש פנימי בעבירת <strong>עוון</strong> הוא בדיקת דם רגילה או דגימת דם מזערית מהאצבע.</li><li><strong>אין סמכות כוח לקצין בחיפוש פנימי</strong>: במבחן, אם מוצג קצין משטרה (אפילו בדרגת ניצב/מפכ\"ל) המורה להפעיל כוח לחיפוש פנימי – מדובר בפעולה בלתי חוקית בעליל! רק שופט שלום מוסמך להתיר שימוש בכוח לחיפוש פנימי.</li><li><strong>מלכודת הבדיקה הגינקולוגית</strong>: בדיקה גינקולוגית מחייבת <strong>תמיד היתר משופט שלום</strong>, ללא קשר להסכמה, לאישור רופא, או לזהות הנבדקת (חשודה, עד, נפגעת עבירה).</li><li><strong>מלכודת תוקף ההיתר</strong>: תוקף היתר שופט לחיפוש פנימי הוא <strong>עד 3 ימים</strong> (ולא 30 ימים או 6 חודשים!). הארכות ניתנות בשלושה ימים בכל פעם מטעמים מיוחדים שיירשמו.</li><li><strong>מלכודת קטינים (הסכמה כפולה וכלל הסירוב)</strong>: בחיפוש פנימי/חיצוני בקטין נדרשת <strong>הסכמה כפולה</strong> (קטין + אפוטרופוס). אם הקטין מסרב – האפוטרופוס אינו יכול לאשר במקומו, והחיפוש נחסם!</li></ol></section><section class=\"release-subtopic\"><h3>חיפוש בגוף באוכלוסיות מיוחדות ובמי שאינו חשוד</h3><h4>א. עומק הרציונל החוקתי בהגנה על אוכלוסיות מיוחדות ומי שאינו חשוד</h4><p>חוק החיפוש מ-1996 נחקק לאור חוק יסוד: כבוד האדם וחירותו. המחוקק ביקש למנוע מצב שבו המשטרה תנצל את מעמדם הפגיע של נפגעי עבירה, עדים, קטינים או אנשים עם מוגבלות שכלית לצורך השגת ראיות, ללא פיקוח הדוק.</p><ul><li><strong>לגבי מי שאינו חשוד</strong>: כיוון שאינו חשוד בביצוע עבירה, אין מקום להפעלת סנקציות ראייתיות של \"חיזוק\" נגדו, והחיפוש מותנה לחלוטין בהסכמה חופשית בכתב.</li><li><strong>לגבי קטינים ומוגבלים שכלית</strong>: המחוקק יצר מנגנון של \"הסכמה כפולה\" כדי להבטיח שהקטין לא יילחץ מרשויות החקירה. מנגד, קביעת הכלל כי סירוב הקטין בולם את החיפוש (גם אם ההורה מסכים) מעגנת את האוטונומיה של הקטין על גופו. ### ב. ניתוח תרחישים ודוגמאות לימודיות מפי המרצה</li><li><strong>תרחיש ה-DNA מתחת לציפורניים של העד / נפגע העבירה</strong>: <em> </em>הסיטואציה<em>: קורבן תקיפה או עד שנחלץ לעזרת קורבן נאבקו בתוקף ושרטו אותו. מתחת לציפורני העד/קורבן נותרו תאי עור של התוקף. החוקרים מבקשים ליטול את החומר מתחת לציפורניים (חיפוש חיצוני) כדי להפיק פרופיל DNA של העבריין. </em> <em>היישום המשפטי</em>: מכוח סעיף 14, השוטר מוסמך להורות על החיפוש. החובה היא למסור הסבר מפורש לעד/קורבן ולקבל את הסכמתו בכתב.</li><li><strong>תרחיש הפנייה לציבור למתן דגימות DNA המוניות</strong>: <em> </em>הסיטואציה<em>: המשטרה חוקרת פשע חמור ללא קצה חוט ומבקשת מאזרחים תמימים באזור לבוא ולתת דגימת DNA (תאי לחי/שיער) כדי להצליב ולשלול חשודים. </em> <em>היישום המשפטי</em>: האזרחים אינם חשודים. הסמכות להדרש לכך מבוססת על סעיף 14(2) (בדיקת זיקה לעבירה), והיא מותנית בהסבר מפורש ובהסכמה בכתב בלבד.</li><li><strong>תרחיש בדיקה גינקולוגית בנפגעת אונס (מלכודת המבחן הקלאסית)</strong>: <em> </em>הסיטואציה<em>: נפגעת עבירת אונס מגיעה לתחנת המשטרה ומבקשת לעבור בדיקה גינקולוגית כדי למצות את הראיות (הפקת זרע/DNA) נגד האנס. היא חותמת על הסכמה בכתב, והרופא המטפל מאשר בכתב כי אין שום סיכון בריאותי בבדיקה. </em> <em>היישום המשפטי</em>: <strong>חובה לפנות לשופט שלום לקבלת היתר!</strong> המרצה מדגיש כי לא אכפת לנו שהיא נפגעת עבירה ולא חשודה, לא אכפת לנו שהיא מסכימה בכתב, ולא אכפת לנו שהרופא אישר. בחוק החיפוש נקבע סייג מוחלט: בדיקה גינקולוגית תיערך <strong>אך ורק בהיתר בית משפט השלום</strong>.</li><li><strong>תרחיש קטין והוריו (מאבק ההסכמה)</strong>: <em> </em>תרחיש א' (הקטין מסרב וההורה מסכים)<em>: קטין מסרב לעבור חיפוש בגופו, ואביו אומר לשוטרים: \"אני האפוטרופוס שלו ואני מורה לכם לבדוק אותו!\". היישום: <strong>אין חיפוש!</strong> סירוב הקטין בולם את החיפוש, והאפוטרופוס אינו יכול לאשר בניגוד לרצון הקטין. </em> <em>תרחיש ב' (הקטין מסכים ומבקש שלא יפנו להוריו)</em>: קטין מסכים לחיפוש בגופו אך מתחנן בפני החוקרים: \"בבקשה אל תספרו להורים שלי, הם יהרגו אותי\". היישום: מתקיים החריג המתיר פטור מהסכמת אפוטרופוס לבקשת הקטין, והחיפוש מבוצע על יסוד הסכמת הקטין בלבד.</li><li><strong>תרחיש הקטין בן ה-13 / האדם המורדם/אוטיסט</strong>: <em> </em>הסיטואציה<em>: קטין בן 13 או אדם עם מוגבלות שכלית קשה (כגון אוטיסט בתפקוד קיצוני או מורדם/מונשם) אינו מבין את משמעות החתימה ואינו מסוגל לחתום בכתב. </em> <em>היישום המשפטי</em>: ניתן לבצע את החיפוש בגופו בלבד שהחיפוש <strong>אינו נערך בניגוד לרצונו</strong> (אם מתגלה התנגדות פיזית או נפשית מצידו – אסור לבצע את החיפוש). ### ג. דגשי מרצה ומלכודות מבחן</li></ul><ol><li><strong>מלכודת הבדיקה הגינקולוגית</strong>: הבדיקה הגינקולוגית היא הבדיקה היחידה בחוק החיפוש שבה הסכמת הנבדקת (בין אם היא חשודה, עד, או נפגעת עבירה) <strong>לעולם אינה מספיקה</strong> כשלעצמה, וחובה לקבל היתר מבית משפט השלום.</li><li><strong>מלכודת סירוב הקטין</strong>: במבחן, אם יוצג הורה המאשר חיפוש בגוף בנו הממרר בבכי ומסרב – החיפוש הוא בלתי חוקי! סירוב קטין אינו טעון אישור אפוטרופוס וסירובו קובע.</li><li><strong>מלכודת הסכמה בכתב במי שאינו חשוד</strong>: חיפוש בגוף עד או נפגע עבירה ללא הסכמה מפורשת <strong>בכתב</strong> מהווה פגיעה בלתי חוקית בזכויותיו.</li></ol></section><section class=\"release-subtopic\"><h3>משמעות סירוב לחיפוש בגוף וארבעת החריגים</h3><h4>א. ניתוח המנגנון הנורמטיבי והאיזון החוקתי בסעיף 11</h4><p>הסדר הסירוב בסעיף 11 לחוק החיפוש מבטא מנגנון של תמרוץ ראייתי. המחוקק ביקש למנוע שימוש בכוח פיזי מיותר על גופו של אדם בחלק ניכר מהחיפושים החיצוניים ובכל החיפושים הפנימיים. תחת הפעלת כוח, קבע המחוקק כי החשוד חופשי לסרב לחיפוש פיזי, אך יישא בתוצאה הראייתית של סירובו בבית המשפט – בדמות ראיית \"חיזוק\" למשקל ראיות התביעה. עם זאת, המחוקק סייג מנגנון זה בקפדנות: <strong>החיזוק הראייתי מותנה בכך שאי-ביצוע החיפוש נגרם באשמתו הבלעדית של החשוד</strong>. אם הסירוב נבע מטעמים מוצדקים (מניעה בריאותית שקבע רופא, או הגנה על קטין ע\"י אפוטרופוס) או שסופק ע\"י החלטה שיפוטית/מחדל משטרתי – הסנקציה הראייתית מבוטלת לחלוטין. ### ב. ניתוח עומק של ארבעת החריגים ותפקידם הראייתי</p><ul><li><strong>חריג 1 (סירוב האפוטרופוס)</strong>: <em> לפי סעיף 14ג, חיפוש בגוף קטין/מוגבל דורש הסכמה כפולה (קטין + אפוטרופוס). </em> אם הקטין מסכים או ניטרלי, אך האפוטרופוס מסרב משיקוליו, החוק קובע כי סירוב האפוטרופוס אינו יכול לשמש \"חיזוק\" נגד הקטין במשפטו הפלילי.</li><li><strong>חריג 2 (מחדל המשטרה בפנייה לשופט)</strong>: <em> כאשר חשוד מסרב לחיפוש פנימי, הדין אינו מאפשר לקצין להרים ידיים מחד, ומאידך לטעון במשפט \"הוא סירב ולכן יש חיזוק\". </em> הקצין חייב למצות את המסלול החוקי ולקבל היתר מבית משפט השלום. אם הקצין לא פנה לשופט (ולא הוכיח דחיפות של פגיעה/התכלות הראיה עקב השהייה), המשטרה ויתרה על הראיה בעצמה, ולכן לא תהנה מחיזוק ראייתי.</li><li><strong>חריג 3 (דחיית הבקשה ע\"י השופט)</strong>: <em> שופט שלום שביטל/דחה בקשת היתר קבע למעשה כי החיפוש אינו מוצדק או שהפגיעה בחשוד אינה מידתית. </em> במצב זה, סירוב החשוד התברר כהגנה מוצדקת על זכויותיו היסודיות, ולכן לא יזקף לחובתו כראיה פלילית.</li><li><strong>חריג 4 (היעדר אישור רפואי)</strong>: <em> זכות החשוד להגנה על חייו ובריאותו קודמת לצורכי החקירה. </em> כאשר רופא קובע כי החיפוש הפנימי מסוכן בריאותית (כגון חשש לדימום/סיבוך), החיפוש נחסם מטעמים רפואיים ולא מתוך רצון לשיבוש חקירה, ולפיכך הסירוב נטרלי לחלוטין. ### ג. דוגמאות ותרחישים לימודיים מפי המרצה</li><li><strong>תרחיש דגימת דם מזערית מהאצבע והחלופה המנדטורית (סעיף 4א)</strong>: <em> חשוד בעוון/פשע נדרש לתת דגימת דם מזערית מן האצבע (דקירה קטנה). החשוד מצהיר: \"אני מסרב, יש לי פוביה קשה ממחטים!\". </em> לפי סעיף 4א, <strong>אסור למשטרה לזקוף את סירובו מיד כחיזוק ראייתי!</strong> החוק מחייב את השוטר להציע לחשוד חלופה של חיפוש חיצוני לא-חודרני: <strong>נטילת שיער ראש</strong> או <strong>דגימת תאי לחי (מטוש)</strong>. * רק אם החשוד עומד בסירובו <strong>גם לחלופות הלא-חודרניות הללו</strong> – מתגבש סירובו כחיזוק למשקל ראיות התביעה.</li><li><strong>תרחיש הצעת המפגש עם הרופא</strong>: <em> קצין משטרה מבקש לערוך חיפוש פנימי. החשוד מצהיר: \"אני מסרב לבדיקה ואני מורחב גם מסרב לראות רופא!\". </em> הקצין מחויב להסביר לחשוד מפורשות: \"דע לך שגם עצם סירובך להיפגש עם הרופא ייחשב כסירוב לחיפוש עצמו, וישמש נגדך כחיזוק לראיות התביעה\".</li><li><strong>תרחיש הדימום במדללי דם (היעדר אישור רפואי)</strong>: <em> חשוד הנדרש לבדיקת דם טוען בפני הרופא שהוא נוטל מדללי דם במינון קריטי וכי כל דקירה תגרום לדימום בלתי נשלט. הרופא מסרב לחתום על אישור רפואי בכתב. </em> החיפוש אינו מבוצע. בבית המשפט התביעה אינה רשאית לטעון לחיזוק ראייתי כיוון שהתקיים חריג 4 (היעדר אישור רפואי). ### ד. דגשי מרצה ומלכודות מבחן</li></ul><ol><li><strong>מלכודת מחדל הפנייה לבית המשפט (חריג 2)</strong>: במבחן, אם מוצג תרחיש שבו חשוד סירב לחיפוש פנימי והמשטרה לא פנתה לשופט שלום לקבלת היתר (ולא הוכח חשש להתכלות/פגיעה בראיה עקב השהייה) – התשובה היא שהסירוב <strong>אינו משמש חיזוק!</strong> המשטרה אינה רשאית לטעון לחיזוק כאשר היא עצמה נמנעה מלפנות לשופט.</li><li><strong>מלכודת ביצוע החיפוש בפועל</strong>: במבחן, אם החשוד צעק וסירב, אך החיפוש בוצע בסופו של דבר בכוח סביר מותר (חיפוש חיצוני ברשימה הסגורה) או בוצע בהיתר שופט (חיפוש פנימי) – <strong>אין שום משמעות ראייתית לסירוב</strong>.</li><li><strong>מלכודת החלופה בדגימת דם מזערית</strong>: סירוב לדגימת דם מזערית מהאצבע אינו מהווה חיזוק אלא אם המשטרה הציעה לחשוד חלופה של שיער או תאי לחי והוא סירב גם להן.</li></ol></section></div><section class=\"release-2a-addition\"><h3>הרחבת שיעור 9 — limited body search of detainee</h3><p>שלום לך עמיתי וידידי היקר.</p><p>כפרופסור לסדר דין פלילי באקדמיה וכעוזר המחקר שלך, ניתחתי באופן ממוקד וכירורגי את המקור המסומן בלבד (\"שיעור 9 ערוך.mp3\") והכנתי עבורך את תוכן הלימוד המפורט, המדויק והמוכן לאתר הקורס בנושא: \"סמכות חיפוש מוגבל על גופו של מעוכב ('חיפוש על גוף')\".</p><p>---</p><h4>📚 סמכות חיפוש מוגבל על גופו של מעוכב (\"חיפוש על גוף\")</h4><p>---</p><h4>1. תקציר הנושא</h4><p>הכלל המרכזי: שוטר המבצע עיכוב לאדם רשאי לערוך חיפוש מוגבל על גופו ובכליו (הידוע בלעז כ-Pat-down / \"חיפוש למשוש\"), בבגדיו ובחפצים שעמו (כגון תיק), ללא צורך בקיומו של חשד סביר, וזאת במטרה לשמור על שלום השוטר והמעוכב ולמנוע סיכון בעת ההובלה בניידת המשטרה או באמבולנס.</p><p>התנאים המרכזיים לביצוע החיפוש המוגבל:</p><p>1. התקיימות עיכוב חוקי של האדם.</p><p>2. תכלית ביטחונית: לוודא שהמעוכב אינו נושא על גופו כלי נשק, חפץ מסוכן או חפץ שעשוי לסייע בבריחתו.</p><p>3. עיתוי ומיקום: החיפוש נערך בעת כניסתו של האדם לניידת המשטרה או לאמבולנס.</p><p>גבולות ההגדרה של \"חיפוש מוגבל\":</p><p>מה כולל: חיפוש בבגדים, מישוש חיצוני, חיפוש בכליו (תיק), הוראה להסיר כיסוי מעל הפנים או הראש (כגון כובע, קסדה או רעלה), והוראה לחלוץ נעליים.</p><p>מה אינו כולל (איסור מוחלט): אינו כולל הסרת בגד החושפת איברי גוף שהיו מכוסים, ואינו כולל חיפוש גופני חיצוני או פנימי (כגון צילום רנטגן, בדיקת דם, או חיפוש רקטלי).</p><p>החריג המרכזי וביצוע בכוח סביר:</p><p>התנגדות לחיפוש: אם המעוכב חשוד בעבירה והוא מתנגד לעריכת החיפוש המוגבל – רשאי השוטר לבצע את החיפוש תוך שימוש בכוח סביר.</p><p>איסור התניית מיקום: המעוכב אינו רשאי לסרב לחיפוש בשטח או להתנותו בביצוע בתחנת המשטרה בלבד; החיפוש נועד להגן על השוטרים והמעוכב בעת ההובלה, ולכן ייערך בשטח לפני העלייה לניידת.</p><p>סמכות וכלל התאמת המין:</p><p>כלל בסיסי: חיפוש מוגבל ייערך בידי שוטר שהוא בן מינו של המעוכב (זכר לזכר, נקבה לנקבה).</p><p>חריגים להתאמת מין (בהם מותר לשוטר ממין שונה לבצע חיפוש מוגבל):</p><p>1. המעוכב הסכים מפורשות בעל פה לחיפוש בידי מי שאינו בן מינו (איסור שתיקה כהסכמה).</p><p>2. דחיית החיפוש תגרום לסיכון בלתי סביר לשלום הציבור או לשלומו של אדם (כגון חשש קונקרטי לחגורת נפץ, סכין או אקדח).</p><p>הבחנה חשובה: הבחנה בין חיפוש מוגבל על גוף (המותר ללא חשד סביר בעת העלאה לניידת/אמבולנס ללא הפשטה) לבין חיפוש גופני חיצוני או פנימי (המצריך חשד סביר, פרוצדורה מורכבת, ולעיתים הסכמה או אישור שופט).</p><p>נקודת מבחן מרכזית: טענת מעוכב כי החיפוש המוגבל בבגדיו בשטח הוא בלתי חוקי משום שהשוטר לא הציג \"חשד סביר\" למציאת אמצעי לחימה – תידחה לחלוטין; סמכות זו פטורה מתנאי של חשד סביר ונועדה להגנה עצמית וביטחון ההובלה.</p><p>---</p><h4>2. קריאה מורחבת</h4><h4>א. מקור נורמטיבי וחוקים שהוזכרו</h4><p>חוק סדר הדין הפלילי (סמכויות אכיפה – חיפוש בגוף חשוד ונטילת אמצעי זיהוי), התשנ\"ו-1996:</p><p>פקודת סדר הדין הפלילי (מעצר וחיפוש) [נוסח חדש], התשכ\"ט-1969:</p><p>מה הוא מסדיר: המסגרת הנורמטיבית הכללית של דיני החיפוש.</p><h4>ב. הכלל המשפטי, ההגדרה והמטרה (Pat-down)</h4><p>הגדרת \"חיפוש מוגבל על גוף\": מדובר בחיפוש בבגדיו של אדם ובכליו (כגון תיק או ארנק שהוא נושא עמו), וכן חיפוש גופני שאינו כולל הסרת בגד החושפת איברי גוף שהיו מכוסים. בלעז מוגדר החיפוש כ-Pat-down (\"חיפוש למשוש\").</p><p>הפעולות המותרות במסגרת החיפוש המוגבל:</p><p>1. מישוש ובדיקת כיסי הבגדים והבגדים שלבוש המעוכב.</p><p>2. חיפוש בכליו (בתיק, בתרמיל).</p><p>3. הוראה למעוכב להסיר כיסוי מעל הפנים או מעל הראש (כגון כובע, קסדה או רעלה).</p><p>4. הוראה למעוכב לחלוץ את נעליו.</p><p>התכלית והמטרה המשפטית: לוודא שהמעוכב אינו נושא על גופו כלי נשק, חפץ מסוכן, או חפץ שעשוי לסייע בבריחתו. החיפוש אינו נועד לאיסוף ראיות ראשי, אלא לשמירה על שלום השוטר, שלום המעוכב, ומניעת פגיעה עצמית או פגיעה בשוטרים בעת ההובלה.</p><h4>ג. עיתוי החיפוש והיעדר דרישת חשד סביר</h4><p>היעדר דרישת חשד סביר: בניגוד לחיפושים פליליים רגילים המחייבים קיומו של \"חשד סביר\" לביצוע עבירה או להחזקת תפוס, חיפוש מוגבל על גופו של מעוכב אינו דורש כל חשד סביר!. עצם העובדה שאדם מעוכב ומועלה לניידת/אמבולנס מקנה לשוטר את הסמכות האוטומטית לבצע את החיפוש המוגבל מטעמי בטיחות.</p><p>עיתוי הביצוע: החיפוש ייערך בעת כניסתו של האדם לניידת המשטרה או לאמבולנס (בשטח, בטרם הנסיעה).</p><p>תפיסת חפצים: אם נמצאו על גופו או בכליו כלי נשק או חפץ מסוכן – השוטר רשאי לתופסם. המרצה מבהיר כי גם אם יש לאדם רישיון נשק תקף, השוטר רשאי לתפוס ולהחזיק את הנשק אצלו במהלך העיכוב והשהות בתחנה כדי למנוע סיכון בטיחותי.</p><h4>ד. התנגדות לחיפוש והפעלת כוח סביר</h4><p>הפעלת כוח סביר בהתנגדות: אם האדם המעוכב חשוד בעבירה והוא מתנגד לעריכת החיפוש המוגבל – רשאי השוטר לבצע את החיפוש תוך שימוש בכוח סביר.</p><p>איסור התניית החיפוש בתחנה: מעוכב אינו רשאי לומר לשוטר \"אני מסרב שתגע בי ברחוב לעיני אנשים, קח אותי לתחנה ותעשה שם חיפוש\". השוטר זכאי וחייב לבצע את החיפוש בשטח לפני העלאתו לניידת, שכן תכלית החיפוש היא להבטיח שהמעוכב לא ישלוף סכין או נשק במהלך הנסיעה.</p><h4>ה. כלל התאמת המין והחריגים לו</h4><p>הכלל: חיפוש מוגבל ייערך בידי שוטר שהוא בן מינו של המעוכב (גבר יחפש על גבר, אישה תחפש על אישה).</p><p>שני החריגים המותרים:</p><p>1. הסכמת המעוכב: המעוכב הסכים מפורשות לערכת החיפוש בידי שוטר/ת שאינו בן מינו. המרצה מדגיש: חובה לקבל הסכמה מפורשת בעל פה, ואין דבר כזה \"שתיקה כהסכמה\"!.</p><p>2. דחיפות וסיכון בלתי סביר: דחיית החיפוש עד להגעת שוטר בן מינו תגרום לסיכון בלתי סביר לשלום הציבור או לשלומו של אדם (למשל: חשד קונקרטי לחגורת נפץ, סכין שלופה, או אקדח).</p><h4>ו. דוגמאות המרצה</h4><p>1. דוגמת החיפוש לפני העלאה לניידת והתיק (חיפוש בכליו):</p><p>שוטר מעכב אדם ומחליט להביאו לתחנה. לפני שהמעוכב נכנס לניידת המשטרה, השוטר מבצע עליו חיפוש מוגבל (Pat-down) בכיסים, בודק את התיק שהוא מחזיק (חיפוש בכליו), ומורה לו לחלוץ נעליים. החיפוש מבוצע בשטח כדי למנוע מצב שבו המעוכב ישלוף סכין במהלך הנסיעה.</p><p>2. דוגמת האקדח ברישיון (תפיסת חפץ מסוכן):</p><p>אישה מעוכבת מגיעה לתחנת המשטרה. בחיפוש המוגבל מתגלה כי היא נושאת אקדח בנרתיק. היא מציגה רישיון נשק בתוקף.</p><p>הכרעת המרצה: השוטרת מוסמכת לתפוס ולהחזיק את האקדח אצלה למשך הטיפול והחקירה בתחנה, משום שתכלית החיפוש המוגבל היא ניטרול כל סיכון ביטחוני בסביבת החקירה.</p><p>3. דוגמת הטרנסג'נדרים וסוגיית המין (פסיקה
