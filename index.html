גנון זה בקפדנות: <strong>החיזוק הראייתי מותנה בכך שאי-ביצוע החיפוש נגרם באשמתו הבלעדית של החשוד</strong>. אם הסירוב נבע מטעמים מוצדקים (מניעה בריאותית שקבע רופא, או הגנה על קטין ע\"י אפוטרופוס) או שסופק ע\"י החלטה שיפוטית/מחדל משטרתי – הסנקציה הראייתית מבוטלת לחלוטין. ### ב. ניתוח עומק של ארבעת החריגים ותפקידם הראייתי</p><ul><li><strong>חריג 1 (סירוב האפוטרופוס)</strong>: <em> לפי סעיף 14ג, חיפוש בגוף קטין/מוגבל דורש הסכמה כפולה (קטין + אפוטרופוס). </em> אם הקטין מסכים או ניטרלי, אך האפוטרופוס מסרב משיקוליו, החוק קובע כי סירוב האפוטרופוס אינו יכול לשמש \"חיזוק\" נגד הקטין במשפטו הפלילי.</li><li><strong>חריג 2 (מחדל המשטרה בפנייה לשופט)</strong>: <em> כאשר חשוד מסרב לחיפוש פנימי, הדין אינו מאפשר לקצין להרים ידיים מחד, ומאידך לטעון במשפט \"הוא סירב ולכן יש חיזוק\". </em> הקצין חייב למצות את המסלול החוקי ולקבל היתר מבית משפט השלום. אם הקצין לא פנה לשופט (ולא הוכיח דחיפות של פגיעה/התכלות הראיה עקב השהייה), המשטרה ויתרה על הראיה בעצמה, ולכן לא תהנה מחיזוק ראייתי.</li><li><strong>חריג 3 (דחיית הבקשה ע\"י השופט)</strong>: <em> שופט שלום שביטל/דחה בקשת היתר קבע למעשה כי החיפוש אינו מוצדק או שהפגיעה בחשוד אינה מידתית. </em> במצב זה, סירוב החשוד התברר כהגנה מוצדקת על זכויותיו היסודיות, ולכן לא יזקף לחובתו כראיה פלילית.</li><li><strong>חריג 4 (היעדר אישור רפואי)</strong>: <em> זכות החשוד להגנה על חייו ובריאותו קודמת לצורכי החקירה. </em> כאשר רופא קובע כי החיפוש הפנימי מסוכן בריאותית (כגון חשש לדימום/סיבוך), החיפוש נחסם מטעמים רפואיים ולא מתוך רצון לשיבוש חקירה, ולפיכך הסירוב נטרלי לחלוטין. ### ג. דוגמאות ותרחישים לימודיים מפי המרצה</li><li><strong>תרחיש דגימת דם מזערית מהאצבע והחלופה המנדטורית (סעיף 4א)</strong>: <em> חשוד בעוון/פשע נדרש לתת דגימת דם מזערית מן האצבע (דקירה קטנה). החשוד מצהיר: \"אני מסרב, יש לי פוביה קשה ממחטים!\". </em> לפי סעיף 4א, <strong>אסור למשטרה לזקוף את סירובו מיד כחיזוק ראייתי!</strong> החוק מחייב את השוטר להציע לחשוד חלופה של חיפוש חיצוני לא-חודרני: <strong>נטילת שיער ראש</strong> או <strong>דגימת תאי לחי (מטוש)</strong>. * רק אם החשוד עומד בסירובו <strong>גם לחלופות הלא-חודרניות הללו</strong> – מתגבש סירובו כחיזוק למשקל ראיות התביעה.</li><li><strong>תרחיש הצעת המפגש עם הרופא</strong>: <em> קצין משטרה מבקש לערוך חיפוש פנימי. החשוד מצהיר: \"אני מסרב לבדיקה ואני מורחב גם מסרב לראות רופא!\". </em> הקצין מחויב להסביר לחשוד מפורשות: \"דע לך שגם עצם סירובך להיפגש עם הרופא ייחשב כסירוב לחיפוש עצמו, וישמש נגדך כחיזוק לראיות התביעה\".</li><li><strong>תרחיש הדימום במדללי דם (היעדר אישור רפואי)</strong>: <em> חשוד הנדרש לבדיקת דם טוען בפני הרופא שהוא נוטל מדללי דם במינון קריטי וכי כל דקירה תגרום לדימום בלתי נשלט. הרופא מסרב לחתום על אישור רפואי בכתב. </em> החיפוש אינו מבוצע. בבית המשפט התביעה אינה רשאית לטעון לחיזוק ראייתי כיוון שהתקיים חריג 4 (היעדר אישור רפואי). ### ד. דגשי מרצה ומלכודות מבחן</li></ul><ol><li><strong>מלכודת מחדל הפנייה לבית המשפט (חריג 2)</strong>: במבחן, אם מוצג תרחיש שבו חשוד סירב לחיפוש פנימי והמשטרה לא פנתה לשופט שלום לקבלת היתר (ולא הוכח חשש להתכלות/פגיעה בראיה עקב השהייה) – התשובה היא שהסירוב <strong>אינו משמש חיזוק!</strong> המשטרה אינה רשאית לטעון לחיזוק כאשר היא עצמה נמנעה מלפנות לשופט.</li><li><strong>מלכודת ביצוע החיפוש בפועל</strong>: במבחן, אם החשוד צעק וסירב, אך החיפוש בוצע בסופו של דבר בכוח סביר מותר (חיפוש חיצוני ברשימה הסגורה) או בוצע בהיתר שופט (חיפוש פנימי) – <strong>אין שום משמעות ראייתית לסירוב</strong>.</li><li><strong>מלכודת החלופה בדגימת דם מזערית</strong>: סירוב לדגימת דם מזערית מהאצבע אינו מהווה חיזוק אלא אם המשטרה הציעה לחשוד חלופה של שיער או תאי לחי והוא סירב גם להן.</li></ol></section></div><section class=\"release-2a-addition\"><h3>הרחבת שיעור 9 — limited body search of detainee</h3><h4>📚 סמכות חיפוש מוגבל על גופו של מעוכב (\"חיפוש על גוף\")</h4><p>---</p><h4>1. תקציר הנושא</h4><p>הכלל המרכזי: שוטר המבצע עיכוב לאדם רשאי לערוך חיפוש מוגבל על גופו ובכליו (הידוע בלעז כ-Pat-down / \"חיפוש למשוש\"), בבגדיו ובחפצים שעמו (כגון תיק), ללא צורך בקיומו של חשד סביר, וזאת במטרה לשמור על שלום השוטר והמעוכב ולמנוע סיכון בעת ההובלה בניידת המשטרה או באמבולנס.</p><p>התנאים המרכזיים לביצוע החיפוש המוגבל:</p><p>1. התקיימות עיכוב חוקי של האדם.</p><p>2. תכלית ביטחונית: לוודא שהמעוכב אינו נושא על גופו כלי נשק, חפץ מסוכן או חפץ שעשוי לסייע בבריחתו.</p><p>3. עיתוי ומיקום: החיפוש נערך בעת כניסתו של האדם לניידת המשטרה או לאמבולנס.</p><p>גבולות ההגדרה של \"חיפוש מוגבל\":</p><p>מה כולל: חיפוש בבגדים, מישוש חיצוני, חיפוש בכליו (תיק), הוראה להסיר כיסוי מעל הפנים או הראש (כגון כובע, קסדה או רעלה), והוראה לחלוץ נעליים.</p><p>מה אינו כולל (איסור מוחלט): אינו כולל הסרת בגד החושפת איברי גוף שהיו מכוסים, ואינו כולל חיפוש גופני חיצוני או פנימי (כגון צילום רנטגן, בדיקת דם, או חיפוש רקטלי).</p><p>החריג המרכזי וביצוע בכוח סביר:</p><p>התנגדות לחיפוש: אם המעוכב חשוד בעבירה והוא מתנגד לעריכת החיפוש המוגבל – רשאי השוטר לבצע את החיפוש תוך שימוש בכוח סביר.</p><p>איסור התניית מיקום: המעוכב אינו רשאי לסרב לחיפוש בשטח או להתנותו בביצוע בתחנת המשטרה בלבד; החיפוש נועד להגן על השוטרים והמעוכב בעת ההובלה, ולכן ייערך בשטח לפני העלייה לניידת.</p><p>סמכות וכלל התאמת המין:</p><p>כלל בסיסי: חיפוש מוגבל ייערך בידי שוטר שהוא בן מינו של המעוכב (זכר לזכר, נקבה לנקבה).</p><p>חריגים להתאמת מין (בהם מותר לשוטר ממין שונה לבצע חיפוש מוגבל):</p><p>1. המעוכב הסכים מפורשות בעל פה לחיפוש בידי מי שאינו בן מינו (איסור שתיקה כהסכמה).</p><p>2. דחיית החיפוש תגרום לסיכון בלתי סביר לשלום הציבור או לשלומו של אדם (כגון חשש קונקרטי לחגורת נפץ, סכין או אקדח).</p><p>הבחנה חשובה: הבחנה בין חיפוש מוגבל על גוף (המותר ללא חשד סביר בעת העלאה לניידת/אמבולנס ללא הפשטה) לבין חיפוש גופני חיצוני או פנימי (המצריך חשד סביר, פרוצדורה מורכבת, ולעיתים הסכמה או אישור שופט).</p><p>נקודת מבחן מרכזית: טענת מעוכב כי החיפוש המוגבל בבגדיו בשטח הוא בלתי חוקי משום שהשוטר לא הציג \"חשד סביר\" למציאת אמצעי לחימה – תידחה לחלוטין; סמכות זו פטורה מתנאי של חשד סביר ונועדה להגנה עצמית וביטחון ההובלה.</p><p>---</p><h4>2. קריאה מורחבת</h4><h4>א. מקור נורמטיבי וחוקים שהוזכרו</h4><p>חוק סדר הדין הפלילי (סמכויות אכיפה – חיפוש בגוף חשוד ונטילת אמצעי זיהוי), התשנ\"ו-1996:</p><p>פקודת סדר הדין הפלילי (מעצר וחיפוש) [נוסח חדש], התשכ\"ט-1969:</p><p>מה הוא מסדיר: המסגרת הנורמטיבית הכללית של דיני החיפוש.</p><h4>ב. הכלל המשפטי, ההגדרה והמטרה (Pat-down)</h4><p>הגדרת \"חיפוש מוגבל על גוף\": מדובר בחיפוש בבגדיו של אדם ובכליו (כגון תיק או ארנק שהוא נושא עמו), וכן חיפוש גופני שאינו כולל הסרת בגד החושפת איברי גוף שהיו מכוסים. בלעז מוגדר החיפוש כ-Pat-down (\"חיפוש למשוש\").</p><p>הפעולות המותרות במסגרת החיפוש המוגבל:</p><p>1. מישוש ובדיקת כיסי הבגדים והבגדים שלבוש המעוכב.</p><p>2. חיפוש בכליו (בתיק, בתרמיל).</p><p>3. הוראה למעוכב להסיר כיסוי מעל הפנים או מעל הראש (כגון כובע, קסדה או רעלה).</p><p>4. הוראה למעוכב לחלוץ את נעליו.</p><p>התכלית והמטרה המשפטית: לוודא שהמעוכב אינו נושא על גופו כלי נשק, חפץ מסוכן, או חפץ שעשוי לסייע בבריחתו. החיפוש אינו נועד לאיסוף ראיות ראשי, אלא לשמירה על שלום השוטר, שלום המעוכב, ומניעת פגיעה עצמית או פגיעה בשוטרים בעת ההובלה.</p><h4>ג. עיתוי החיפוש והיעדר דרישת חשד סביר</h4><p>היעדר דרישת חשד סביר: בניגוד לחיפושים פליליים רגילים המחייבים קיומו של \"חשד סביר\" לביצוע עבירה או להחזקת תפוס, חיפוש מוגבל על גופו של מעוכב אינו דורש כל חשד סביר!. עצם העובדה שאדם מעוכב ומועלה לניידת/אמבולנס מקנה לשוטר את הסמכות האוטומטית לבצע את החיפוש המוגבל מטעמי בטיחות.</p><p>עיתוי הביצוע: החיפוש ייערך בעת כניסתו של האדם לניידת המשטרה או לאמבולנס (בשטח, בטרם הנסיעה).</p><p>תפיסת חפצים: אם נמצאו על גופו או בכליו כלי נשק או חפץ מסוכן – השוטר רשאי לתופסם. המרצה מבהיר כי גם אם יש לאדם רישיון נשק תקף, השוטר רשאי לתפוס ולהחזיק את הנשק אצלו במהלך העיכוב והשהות בתחנה כדי למנוע סיכון בטיחותי.</p><h4>ד. התנגדות לחיפוש והפעלת כוח סביר</h4><p>הפעלת כוח סביר בהתנגדות: אם האדם המעוכב חשוד בעבירה והוא מתנגד לעריכת החיפוש המוגבל – רשאי השוטר לבצע את החיפוש תוך שימוש בכוח סביר.</p><p>איסור התניית החיפוש בתחנה: מעוכב אינו רשאי לומר לשוטר \"אני מסרב שתגע בי ברחוב לעיני אנשים, קח אותי לתחנה ותעשה שם חיפוש\". השוטר זכאי וחייב לבצע את החיפוש בשטח לפני העלאתו לניידת, שכן תכלית החיפוש היא להבטיח שהמעוכב לא ישלוף סכין או נשק במהלך הנסיעה.</p><h4>ה. כלל התאמת המין והחריגים לו</h4><p>הכלל: חיפוש מוגבל ייערך בידי שוטר שהוא בן מינו של המעוכב (גבר יחפש על גבר, אישה תחפש על אישה).</p><p>שני החריגים המותרים:</p><p>1. הסכמת המעוכב: המעוכב הסכים מפורשות לערכת החיפוש בידי שוטר/ת שאינו בן מינו. המרצה מדגיש: חובה לקבל הסכמה מפורשת בעל פה, ואין דבר כזה \"שתיקה כהסכמה\"!.</p><p>2. דחיפות וסיכון בלתי סביר: דחיית החיפוש עד להגעת שוטר בן מינו תגרום לסיכון בלתי סביר לשלום הציבור או לשלומו של אדם (למשל: חשד קונקרטי לחגורת נפץ, סכין שלופה, או אקדח).</p><h4>ו. דוגמאות המרצה</h4><p>1. דוגמת החיפוש לפני העלאה לניידת והתיק (חיפוש בכליו):</p><p>שוטר מעכב אדם ומחליט להביאו לתחנה. לפני שהמעוכב נכנס לניידת המשטרה, השוטר מבצע עליו חיפוש מוגבל (Pat-down) בכיסים, בודק את התיק שהוא מחזיק (חיפוש בכליו), ומורה לו לחלוץ נעליים. החיפוש מבוצע בשטח כדי למנוע מצב שבו המעוכב ישלוף סכין במהלך הנסיעה.</p><p>2. דוגמת האקדח ברישיון (תפיסת חפץ מסוכן):</p><p>אישה מעוכבת מגיעה לתחנת המשטרה. בחיפוש המוגבל מתגלה כי היא נושאת אקדח בנרתיק. היא מציגה רישיון נשק בתוקף.</p><p>הכרעת המרצה: השוטרת מוסמכת לתפוס ולהחזיק את האקדח אצלה למשך הטיפול והחקירה בתחנה, משום שתכלית החיפוש המוגבל היא ניטרול כל סיכון ביטחוני בסביבת החקירה.</p><p>3. דוגמת הטרנסג'נדרים וסוגיית המין (פסיקה השוואתית):</p><p>המרצה מציין סוגיה מודרנית: כיצד נוהגים לגבי אדם הרשום כזכר בתעודת הזהות אך מזדהה ונראה כאישה (או להפך)?.</p><p>דגש המרצה: נכון להיום אין פסיקה של בית המשפט העליון בישראל המכריעה בשאלה מי רשאי לבצע חיפוש על טרנסג'נדרים ואיזה שוטר יבצע זאת. המרצה מציין כי סוגיה זו נדונה בימים אלה בבית המשפט העליון הפדרלי בארה\"ב.</p><h4>ז. משמעות מעשית למבחן</h4><p>בפתרון קייס במבחן:</p><p>1. יש לבחון את סוג החיפוש: אם מדובר במישוש בבגדים, בדיקת תיק, חליצת נעליים או הסרת כיסוי ראש – מדובר בחיפוש מוגבל המותר ללא חשד סביר.</p><p>2. אם הוסרו בגדים שחשפו איברי גוף מכוסים – החיפוש אינו חיפוש מוגבל אלא חיפוש גופני החייב בחשד סביר ובתנאים קפדניים.</p><p>3. אם המעוכב סירב לחיפוש בשטח – השוטר מוסמך להפעיל כוח סביר.</p><p>4. יש לבדוק את התאמת המין: חיפוש בידי שוטר ממין שונה מותר אך ורק בהסכמה מפורשת בעל פה או בנסיבות דחופות של סיכון בלתי סביר.</p><p>---</p><h4>3. הרחבה מקיפה</h4><h4>א. ניתוח המבנה הנורמטיבי והאיזון החוקתי</h4><p>דיני החיפוש מעגנים מדרג חוקתי קפדני השומר על הזכות לפרטיות ולשלמות הגוף מכוח חוק-יסוד: כבוד האדם וחירותו.</p><p>המחוקק יצר הבחנה ברורה בין דרגות שונות של פגיעה באוטונומיה של הפרט:</p><p>\\\\[\\text{חיפוש מוגבל (בבגדים/כלים)} \\longrightarrow \\text{חיפוש גופני חיצוני (על הגוף)} \\longrightarrow \\text{חיפוש גופני פנימי (בתוך הגוף)}\\\\]</p><p>1. עוצמת הפגיעה הנמוכה בחיפוש מוגבל: כיוון שחיפוש מוגבל אינו כולל הפשטה ואינו חושף איברים מוצנעים, עוצמת הפגיעה בפרטיות נמוכה יחסית.</p><p>2. הצדקת הפטור מחשד סביר: מתוך צורך הגנתי מידי על חיי השוטרים והמעוכב בעת הובלה בחלל סגור (ניידת/אמבולנס), פטר המחוקק את השוטר מהדרישה להוכיח \"חשד סביר\" מוקדם להחזקת אמצעי לחימה. עצם הסטטוס של עיכוב והובלה בניידת מקנים את הסמכות.</p><h4>ב. ניתוח מעמיק של הגדרת \"חיפוש מוגבל\" מול חיפושים גופניים אחרים</h4><p>מהו חיפוש מוגבל (Pat-down):</p><p>מוגבל לבגדים החיצוניים ולכליו של האדם.</p><p>מותר להורות על חליצת נעליים והסרת כיסוי ראש/פנים (קסדה, כובע, רעלה).</p><p>מהו חיפוש גופני חיצוני / פנימי (שאינו חיפוש מוגבל):</p><p>חיפוש גופני חיצוני: בדיקה על עורו החשוף של אדם, הסרת בגדים החושפת איברים מכוסים, בחינת שערות, גזירת ציפורניים, או נטילת תביעות אצבע.</p><p>חיפוש גופני פנימי: בדיקת דם, צילום רנטגן, בדיקת אולטרסאונד, בדיקה רקטלית או וגינלית (למשל בחשד לבליעת שקיות סמים).</p><p>הבדל נורמטיבי קריטי: חיפושים חיצוניים ופנימיים מחייבים חשד סביר, פרוצדורה מורכבת, הסכמה מדעת, ולעיתים אישור קצין ממונה או צו שופט. לעומת זאת, חיפוש מוגבל מותר מידית בשטח ללא חשד סביר.</p><h4>ג. ניתוח עומק של סוגיות מיוחדות ודגשי מרצה</h4><p>1. שימוש בכוח סביר: אם המעוכב מתנגד למישוש בבגדיו או לבדיקת התיק, השוטר מוסמך להפעיל כוח פיזי מדוד (אחיזת הידיים, הצמדה) כדי לבצע את החיפוש.</p><p>2. חובת ההסכמה המפורשת בחריג המין: אם שוטרת מבצעת חיפוש מוגבל על גבר (או שוטר על אישה), היעדר התנגדות של המעוכב אינו נחשב להסכמה!. החוק מחייב הסכמה אקטיבית ומפורשת בעל פה. בהיעדר הסכמה מפורשת או נסיבות דחיפות של סיכון חיי אדם – החיפוש ממין שונה הוא בלתי חוקי בעליל!.</p><p>3. תפיסת נשק ברישיון: הסמכות לתפוס כלי נשק בחיפוש מוגבל חלה גם כאשר הנשק מוחזק כדין וברישיון, מתוך התכלית של ניטרול סיכונים סביבתיים במהלך העיכוב.</p><h4>ד. מלכודות למבחן ודגשים מפורשים של המרצה</h4><p>1. מלכודת החשד הסביר: במבחן, אם נטענה טענה כי חיפוש מוגבל בבגדי מעוכב בכניסה לניידת היה בלתי חוקי כי לא היה לשוטר \"חשד סביר\" שהמעוכב נושא סכין – זוהי טעות משפטית!. חיפוש מוגבל על מעוכב פטור לחלוטין מדרישת חשד סביר.</p><p>2. מלכודת ההפשטה: אם שוטר הוראה למעוכב להוריד חולצה או מכנסיים ברחוב וחשף איברים מכוסים – קביעה כי זהו \"חיפוש מוגבל\" היא טעות חמורה!. ברגע שהוסרו בגדים המכסים איברי גוף, החיפוש חרג מחיפוש מוגבל והפך לחיפוש גופני החייב בחשד סביר.</p><p>3. מלכודת ה\"שתיקה כהסכמה\" בחיפוש ממין שונה: במבחן, שוטר ממין שונה שביצע חיפוש מוגבל מבלי שהמעוכב התנגד – ביצע חיפוש בלתי חוקי, שכן חובה לקבל הסכמה מפורשת בעל פה.</p><p>4. מלכודת בקשת החיפוש בתחנה: מעוכב אינו רשאי לסרב לחיפוש מוגבל בשטח בטענה שהוא דורש לעבור אותו בתחנה בלבד.</p><p>---</p><h4>4. פסיקה וחקיקה</h4><h4>א. פסיקה שהוזכרה בנושא</h4><p>פסיקה בנושא חיפוש מוגבל על גופו של מעוכב:</p><p>(הערה: במסגרת השיעור, המרצה פירט את הוראות החוק הסטטוטוריות לגבי חיפוש מוגבל [Pat-down], הדגיש את היעדר דרישת החשד הסביר, ואת כללי התאמת המין והכוח הסביר. המרצה ציין מפורשות כי בנושא התאמת מין לטרנסג'נדרים אין עדיין פסיקה של בית המשפט העליון בישראל [הסוגיה מונחת בעליון הפדרלי בארה\"ב], ולא איזכר פסק דין ישראלי ספציפי בשמו או במספר הליך לגבי סעיף זה).</p><h4>ב. חקיקה שהוזכרה בנושא</h4><p>חוק סדר הדין הפלילי (סמכויות אכיפה – חיפוש בגוף חשוד ונטילת אמצעי זיהוי), התשנ\"ו-1996:</p><p>פקודת סדר הדין הפלילי (מעצר וחיפוש) [נוסח חדש], התשכ\"ט-1969:</p><p>מה הוא מסדיר: המסגרת הנורמטיבית של דיני החיפוש הפליליים.</p><p>---</p><li>או לבחור כל נושא אחר מתוך הרשימה!</li></section><section class=\"presentation5-addition\"><h3>עקרונות יסוד בחיפוש בגוף: כבוד, בעל מקצוע מיומן ותיעוד החיפוש</h3><p>חיפוש חיצוני או פנימי בגופו של חשוד נערך רק במסגרת חוק החיפוש. מעבר לתנאים הספציפיים, החיפוש ייערך בדרך ובמקום שישמרו במידה המרבית על כבוד האדם; פעולה הכרוכה במיומנות רפואית תיערך בידי בעל מקצוע מיומן; ועורך החיפוש יערוך דו״ח על ביצועו ועל הדברים שנתפסו.</p><p>עקרונות הרוחב שנלמדו כוללים את סעיף 2(א), סעיף 2(ד), וסעיפים 5 ו־10. בפתרון קייס יש להפריד בין עצם מקור הסמכות לבין אופן מימושה: גם חיפוש מותר חייב להיעשות בכבוד, במקצועיות ובתיעוד.</p><h3>חיפוש בגוף בידי בן מינו של החשוד</h3><p>לפי סעיף 2(ה) לחוק החיפוש, ככלל חיפוש בגופו של חשוד ייערך בידי בן מינו. החריגים שנלמדו: דחייה היוצרת סיכון בלתי סביר לשלום הציבור; ביצוע בידי בעל מקצוע רפואי, בכפוף לכיבוד בקשת החשוד לבן מינו כאשר הדבר אינו מטיל נטל בלתי סביר; ונטילת טביעות אצבעות.</p><p>יש להבחין בין חיפוש בגוף לפי חוק החיפוש לבין חיפוש על גוף אישה לפי סעיף 46 לפקודת מעצר וחיפוש, וכן מהסדר החיפוש המוגבל של מעוכב או עצור שנלמד בשיעור 9.</p><h3>תיקון היקף סעיף 14</h3><p>שוטר רשאי לערוך <strong>חיפוש חיצוני או חיפוש פנימי</strong> בגופו של אדם שאינו חשוד, או להורות על עריכתו, כאשר מתקיימת אחת מעילות סעיף 14 שנלמדו: יסוד סביר להניח שבגופו מצויה ראיה הדרושה לחקירה, או שהחיפוש נדרש לבדיקת קשר אפשרי שלו לעבירה. תנאי לביצוע הוא מתן הסבר וקבלת הסכמה בכתב. בדיקה גינקולוגית טעונה היתר בית משפט.</p><p>לקישור לפסק הדין העוסק בחיפוש פנימי ובבדיקת דם: <button class=\"case-link\" data-case=\"39\">⚖ לאוניד לוין נ׳ מדינת ישראל</button></p>"},"investigation-law":{"title":"דיני חקירה","html":"<div class=\"release-layer\"><h2>קריאה מורחבת</h2><section class=\"release-subtopic\"><h3>המסגרת הנורמטיבית של דיני חקירה וההבחנה בין חקירת עד לחקירת חשוד</h3><h4>א. מקורות נורמטיביים וסעיפי חוק</h4><ul><li><strong>פקודת העדות</strong>: <em> <strong>סעיף 2</strong>: סמכות חקירת עד, חובת המענה הנכון, וחריג החיסיון מפני הפללה עצמית. </em> <strong>סעיף 3</strong>: פרוצדורת רישום הודעת עד בכתב, הקראה, חתימה, ורישום סירוב לחשוף.</li><li><strong>חוק סדר הדין הפלילי (חקירת חשודים), התשס\"ב-2002</strong>:</li><li><strong>חוק סדר הדין הפלילי (סמכויות אכיפה – מעצרים), התשנ\"ו-1996 (\"חוק המעצרים\")</strong>: <em> <strong>סעיף 28</strong>: חובת אזהרת עצור בידי קצין ממונה בדבר זכות השתיקה והחיסיון מהפללה. </em> <strong>סעיף 28א</strong>: חובת הפסקת חקירת/עדות עד ברגע שעולה חשד שביצע עבירה, ומתן אזהרה בדבר זכות השתיקה כחשוד.</li><li><strong>פקודת הראיות [נוסח חדש], התשל\"א-1971</strong>: * <strong>סעיף 47</strong>: החיסיון מפני הפללה עצמית (אוזכר בשיעור בקצרה). ### ב. הכללים והסמכויות בחקירת עד</li><li><strong>סמכות חקירה (סעיף 2 לפקודת העדות)</strong>: קצין משטרה המוסמך לכך רשאי לחקור כל אדם המכיר את עובדותיה ונסיבותיה של עבירה פלילית.</li><li><strong>חובת העד</strong>: הנחקר (כעד) חייב להשיב נכונה על כל השאלות שמוצגות לו על ידי השוטר/קצין.</li><li><strong>חריג החיסיון מפני הפללה עצמית</strong>: העד אינו חייב למסור תשובות לשאלות שהתשובה עליהן עשויה להעמידו בסיכון של אישום פלילי. ### ג. פרוצדורת גביית הודעת עד (הוראות החוק לפקודת העדות)</li></ul><ol><li><strong>רישום בכתב</strong>: הודעה הנגבית מפי עד תירשם בכתב.</li><li><strong>הקראה</strong>: תוקרא באוזני העד כפי שנרשמה. <em>(בפרקטיקה המשטרתית: בדרך כלל לא מקריאים בקול, אלא מדפיסים את ההודעה ונותנים לעד לקרוא אותה בעצמו)</em>.</li><li><strong>חתימה</strong>: מי שנקראה/נקראה לו ההודעה יידרש לחתום עליה. אם אינו יודע קרוא וכתוב – יתבקש להטביע בה את סימנו (חתימה/סימון).</li><li><strong>טיפול בסירוב לחתוך</strong>: סירב העד לחתום – ירשום קצין המשטרה את דבר הסירוב וסיבתו, ולאחר מכן יחתום קצין המשטרה בעצמו על ההודעה שבכתב. ### ד. נוהל המעבר מעד לחשוד</li></ol><ul><li><strong>הטריגר המשפטי</strong>: אם במהלך גביית עדות מעד (כגון אדם שהגיע להתלונן או למסור עדות) עולה חשד שהוא עצמו ביצע את העבירה נשוא החקירה.</li><li><strong>חובת החוקר</strong>: <strong>חייב החוקר להפסיק מיד את החקירה/העדות</strong>, להודיע לחשוד על זכות השתיקה העומדת לו כחשוד (זכותו שלא להשיב לשאלות כלל ושלא להיחקר כעד), ולמסור לו את נוסח האזהרה הרשמי. ### ה. השלכות הפרת הכלל</li><li>אם החוקר ממשיך לגבות עדות מעד שהפך לחשוד ללא הפסקה ולא מזהיר אותו בדבר זכות השתיקה – מדובר בפגם חמור בחקירה.</li><li><strong>תוצאה ראייתית</strong>: בית המשפט עשוי לפסול את ההודעה/ההודיה שנגבתה מהנחקר במסגרת דוקטרינת הפסילה הפסיקתית (הלכת יששכרוב). ### ו. דוגמת המרצה (סיפור נהג המונית)</li><li><strong>האירוע</strong>: נהג מונית אוסף נוסעת, והיא מסרבת לשלם את דמי הנסיעה בתום הנסיעה.</li><li><strong>התנהלות הנהג</strong>: במקום לזמן ניידת משטרה למקום, הנהג נעל את הנוסעת בתוך המונית ונסע איתה ישירות לתחנת המשטרה כדי להגיש נגדה תלונה.</li><li><strong>בחקירה בתחנה</strong>: הנהג הגיע לחוקר התורן (המרצה בצעירותו) והתחיל למסור עדות (\"הודעה\") כמתלונן/עד על כך שהיא לא שילמה, כשהוא מתאר בגאווה כיצד מנע ממנה לצאת מהמונית והביא אותה בכוח.</li><li><strong>התערבות החוקר</strong>: החוקר הבין מפי הנהג עצמו כי הנהג ביצע עבירות פליליות חמורות (כליאת שווא וחטיפה – מניעת חירות ללא סמכות חוקית).</li><li><strong>היישום המשפטי</strong>: החוקר נאלץ <strong>לעצור מיד את העדות</strong>, להודיע לנהג המונית כי הוא עצמו חשוד כעת בביצוע עבירה פלילית של כליאת שווא וחטיפה, למסור לו את נוסח האזהרה המלא, ולהודיע לו על זכות השתיקה בטרם ימשיך לחקור אותו כחשוד. ### ז. משמעות מעשית למבחן</li></ul><p>בפתרון קייס במבחן, יש לבחון האם הנחקר החל את הליכו כעד או כמתלונן, ובאיזה רגע מדויק בדבריו קם חשד לביצוע עבירה מצידו. אם החוקר לא הפסיק את גביית העדות והמשיך לתחקר אותו כעד ללא אזהרה – יש לטעון לפסילת הודאתו בבית המשפט מכוח הלכת יששכרוב.</p></section><section class=\"release-subtopic\"><h3>חקירת עד במשטרה, חובת המענה וחריג החיסיון מפני הפללה עצמית</h3><h4>א. מקור נורמטיבי וסעיפי חוק</h4><ul><li><strong>פקודת העדות</strong>: <em> <strong>סעיף 2</strong>: מסדיר את סמכות קצין המשטרה לחקור עד, את חובת המענה הנכון המוטלת על העד, ואת חריג החיסיון מפני הפללה עצמית. </em> <strong>סעיף 3</strong>: מסדיר את הפרוצדורה לרישום הודעת העד בכתב, הקראתה, חובת חתימת העד (או הטבעת סימן למי שאינו יודע קרוא וכתוב), וסדרי הטיפול במקרה של סירוב לחתום.</li><li><strong>פקודת הראיות [נוסח חדש], התשל\"א-1971</strong>: * <strong>סעיף 47</strong>: מעגן את החיסיון מפני הפללה עצמית בראיות (אוזכר בשיעור בקצרה בקשר להוראה המקבילה בפקודת העדות).</li><li><strong>חוק סדר הדין הפלילי (סמכויות אכיפה – מעצרים), התשנ\"ו-1996 (\"חוק המעצרים\")</strong>: <em> <strong>סעיף 28</strong>: מסדיר את אזהרת קצין המשטרה הממונה בדבר השרשור של זכות השתיקה והחיסיון מפני הפללה. </em> <strong>סעיף 28א</strong>: מסדיר את חובת הפסקת חקירת/עדות עד ברגע שעולה חשד שביצע עבירה, ומתן אזהרה בדבר זכות השתיקה כחשוד. ### ב. הכלל, הסמכות וחובת המענה של עד</li><li><strong>סמכות חקירת עד (סעיף 2 לפקודת העדות)</strong>: קצין משטרה המוסמך לכך רשאי לחקור כל אדם המכיר את עובדותיה ונסיבותיה של עבירה פלילית.</li><li><strong>חובת העד</strong>: אדם הנחקר כעד כפוף ל<strong>חובת מענה נכונה</strong> על כל השאלות שמציג לו קצין המשטרה. ### ג. החריג לחובת המענה: החיסיון מפני הפללה עצמית</li><li><strong>הוראת החוק</strong>: העד חייב להשיב נכונה על השאלות \"למעט שאלות שהתשובה עליהן עשויה להעמידו בסיכון של אישום פלילי\".</li><li><strong>מהות החיסיון</strong>: העד אינו חייב למסור תשובות או מסמכים שיגרמו לו להפוך לחשוד בביצוע עבירה פלילית או שיעמידו אותו בסיכון של אישום פלילי.</li><li><strong>הבחנה בין עד לחשוד</strong>: לעד <strong>אין זכות שתיקה גורפת</strong> (הוא אינו רשאי לסרב להשיב באופן כללי או להימנע מלהגיע למסור עדות), אלא עומד לו חיסיון נקודתי בלבד מפני הפללה עצמית לגבי שאלות ספציפיות המסיבות לו סיכון פלילי. ### ד. פרוצדורת גביית הודעת עד (הוראות החוק לפקודת העדות)</li></ul><ol><li><strong>רישום בכתב</strong>: הודעה הנגבית מפי עד תירשם בכתב.</li><li><strong>הקראה</strong>: תוקרא באוזני העד כפי שנרשמה. <em>(דגש פרקטיקה מפי המרצה: בפועל השוטרים אינם מקריאים בקול את ההודעה, אלא מדפיסים אותה ומוסרים אותה לעד לקריאה עצמית)</em>.</li><li><strong>חתימה / הטבעת סימן</strong>: מי שנקראה לו ההודעה יידרש לחתום עליה. אם הנחקר אינו יודע קרוא וכתוב, הוא יתבקש להטביע בה את סימנו (חתימה/סימון/קשקוש).</li><li><strong>נוהל סירוב לחתום</strong>: אם העד מסרב לחתום על ההודעה, קצין המשטרה ירשום על גבי המסמך את דבר הסירוב ואת סיבת הסירוב, ולאחר מכן יחתום קצין המשטרה בעצמו על ההודעה שבכתב. ### ה. חובת המעבר מעד לחשוד ומתן אזהרה</li></ol><ul><li><strong>התנאי להפסקת העדות</strong>: ברגע שמתעורר במהלך גביית העדות חשד כי העד ביצע את העבירה נשוא החקירה (או עבירה נלווית), החוקר חייב להפסיק מיד את גביית העדות.</li><li><strong>פרוצדורת המעבר</strong>: החוקר מודיע לנחקר כי הוא הופך כעת לחשוד, מוסר לו את נוסח האזהרה הרשמי, ומבהיר לו מפורשות את <strong>זכות השתיקה</strong> העומדת לו כחשוד (זכותו שלא להשיב לשאלות כלל ושלא להיחקר כעד). ### ו. השלכות הפרת הכלל ופגמים בחקירה</li><li>אם החוקר ממשיך לגבות עדות מאדם שהפך לחשוד מבלי להזהירו ומבלי להודיע לו על זכות השתיקה, מדובר בפגמים חמורים בחקירה.</li><li><strong>תוצאה ראייתית</strong>: בית המשפט עשוי לפסול את ההודעה/ההודיה שנגבתה מהנחקר במסגרת דוקטרינת הפסילה הפסיקתית (הלכת יששכרוב). ### ז. דוגמת המרצה (סיפור נהג המונית)</li><li><strong>עובדות המקרה</strong>: נהג מונית אוסף נוסעת, ובתום הנסיעה היא מסרבת לשלם את דמי הנסיעה.</li><li><strong>התנהלות הנהג</strong>: במקום להזמין ניידת משטרה, הנהג נעל את הנוסעת בתוך המונית ונסע איתה ישירות לתחנת המשטרה להגיש תלונה.</li><li><strong>בחקירה בתחנה</strong>: הנהג הגיע לחוקר התורן (המרצה בצעירותו) והחל למסור עדות (\"הודעה\") כמתלונן/עד, כשהוא מתאר בגאווה כיצד מנע ממנה לצאת מהמונית והביא אותה בכוח.</li><li><strong>התערבות החוקר</strong>: החוקר הבין מפי הנהג עצמו כי הנהג ביצע עבירות פליליות חמורות של כליאת שווא וחטיפה (מניעת חירות ללא סמכות חוקית).</li><li><strong>היישום המשפטי</strong>: החוקר עצר מיד את העדות, הודיע לנהג המונית כי הוא חשוד כעת בביצוע עבירות של כליאת שווא וחטיפה, ומסר לו את נוסח האזהרה בדבר זכות השתיקה כחשוד בטרם המשיך לחקור אותו. ### ח. משמעות מעשית למבחן</li></ul><p>בפתרון קייס במבחן, יש לבחון האם הנחקר החל את הליכו כעד/מתלונן, ובאיזה רגע מדויק בדבריו קם חשד לביצוע עבירה מצידו. אם החוקר לא הפסיק את גביית העדות והמשיך לתחקר אותו כעד ללא אזהרה – יש לטעון לפסילת הודאתו בבית המשפט מכוח הלכת יששכרוב.</p></section><section class=\"release-subtopic\"><h3>מעבר מעד לחשוד, חובת הפסקת העדות ומתן אזהרה</h3><h4>א. מקור נורמטיבי וסעיפי חוק</h4><ul><li><strong>חוק סדר הדין הפלילי (סמכויות אכיפה – מעצרים), התשנ\"ו-1996 (\"חוק המעצרים\")</strong>: <em> <strong>סעיף 28א</strong>: מסדיר את חובת החוקר להפסיק מיד את חקירת/עדות העד ברגע שעולה חשד שביצע עבירה, ולהודיע לו על זכות השתיקה העומדת לו כחשוד. </em> <strong>סעיף 28</strong>: מסדיר את חובת אזהרת עצור בידי קצין ממונה בדבר זכותו שלא לומר דבר שעלול להפליל אותו.</li><li><strong>פקודת העדות</strong>: * <strong>הוראות החוק</strong>: מסדירים את סמכות חקירת עד במשטרה, חובת המענה הנכון (למעט תשובות המפלילות עצמית), ופרוצדורת רישום וחתימת ההודעה. ### ב. הכלל והפרוצדורה במעבר מעד לחשוד</li><li><strong>הכלל המשפטי</strong>: הכלל הוא כי אם במהלך חקירתו או גביית עדותו של עד עולה חשד שהוא ביצע את העבירה נשוא החקירה, חייב החוקר להפסיק מיד את החקירה.</li><li><strong>חובות החוקר ברגע המעבר</strong>: 1. להורות על הפסקה מיידית של גביית העדות. 2. להודיע לנחקר כי התעורר נגדו חשד לביצוע עבירה פלילית פלונית. 3. למסור לנחקר את נוסח האזהרה הרשמי בדבר <strong>זכות השתיקה</strong>.</li><li><strong>שינוי זכויות הנחקר</strong>: הנחקר עובר מסטטוס של עד (הכפוף לחובת מענה נכונה בחוק למעט חיסיון מפני הפללה עצמית) לסטטוס של חשוד – הנהנה מזכות שתיקה מלאה וגורפת, קרי זכותו שלא להשיב לשאלות כלל ושלא להיחקר עוד כעד. ### ג. השלכות הפרת הכלל (פגמים בחקירה)</li><li>אם החוקר מתעלם מכך שהעד מודה בביצוע עבירה, וממשיך לגבות ממנו עדות כעד מבלי להזהירו בדבר זכות השתיקה, מדובר בפגם חקירתי חמור.</li><li><strong>תוצאה ראייתית</strong>: בית המשפט עשוי לפסול את ההודעה/ההודיה שנגבתה מהנחקר במסגרת דוקטרינת הפסילה הפסיקתית (הלכת יששכרוב). ### ד. דוגמת המרצה (סיפור נהג המונית)</li><li><strong>האירוע</strong>: נהג מונית אוסף נוסעת, ובתום הנסיעה היא מסרבת לשלם לו את דמי הנסיעה.</li><li><strong>התנהלות הנהג</strong>: במקום לזמן ניידת משטרה למקום, נהג המונית נעל את הנוסעת בתוך המונית ונסע איתה ישירות לתחנת המשטרה להגיש נגדה תלונה.</li><li><strong>בחקירה בתחנה</strong>: הנהג הגיע לחוקר התורן (המרצה בצעירותו) והחל למסור עדות (\"הודעה\") כמתלונן/עד, כשהוא מתאר בגאווה כיצד מנע ממנה לצאת מהמונית והביא אותה בכוח לתחנה.</li><li><strong>התערבות החוקר</strong>: החוקר הבין מפי הנהג עצמו כי הנהג ביצע עבירות פליליות חמורות (כליאת שווא וחטיפה – מניעת חירות של אזרח ללא סמכות חוקית).</li><li><strong>היישום המשפטי</strong>: החוקר נאלץ <strong>לעצור מיד את העדות</strong>, להודיע לנהג המונית כי הוא חשוד כעת בביצוע עבירות של כליאת שווא וחטיפה, ולמסור לו את נוסח האזהרה המלא בדבר זכות השתיקה בטרם המשיך לחקור אותו כחשוד. ### ה. פסיקה רלוונטית בקצרה (הלכת יששכרוב / ססחררוב)</li><li>בית המשפט העליון קבע בפסק דין יששכרוב כי אי-הודעה לחשוד על זכותו לשמור על זכות השתיקה מהווה פגם בחקירה, אשר עשוי להוביל לפסילת הודעתו/הודאתו בבית המשפט. ### ו. משמעות מעשית למבחן</li></ul><p>בפתרון קייס במבחן, יש לזהות את הטרנספורמציה ממעמד עד/מתלונן למעמד חשוד. אם החוקר המשיך לגבות הודעה מפי העד לאחר שעלה החשד מבלי לעצור ולהזהיר, מדובר בפגם חקירתי חמור המקים עילת פסילה להודאה לפי הלכת יששכרוב.</p></section><section class=\"release-subtopic\"><h3>שפת חקירת החשוד</h3><h4>א. מקור נורמטיבי וסעיפי חוק</h4><ul><li><strong>חוק סדר הדין הפלילי (חקירת חשודים), התשס\"ב-2002</strong>: ### ד. זכויות החשוד וחובות החוקר</li><li><strong>זכות החשוד</strong>: לקרוא ולהבין את פרוטוקול חקירתו בטרם יתבקש לחתום עליו. ### ה. דוגמת המרצה (החשוד האמריקאי)</li><li><strong>הכשל המשפטי</strong>: בסיום החקירה, החוקר מוסר לחשוד האמריקאי את ההודעה הרשומה בעברית ומבקש ממנו לחתום עליה. החשוד אינו יודע לקרוא עברית, ולפיכך אינו מבין על מה הוא חותם ואינו יכול לאשר את נכונות הדברים. ### ו. פער הדין מול הפרקטיקה בשטח</li><li>המרצה מציין כי בפרקטיקה בשטח, כאשר מגיע לתחנת המשטרה חשוד הדובר שפה נדירה מאוד, המשטרה נתקלת בקשיים כבדים לאתר מתורגמן זמין בזמן אמת.</li></ul></section><section class=\"release-subtopic\"><h3>מקום חקירת החשוד ושני החריגים לחקירה מחוץ לתחנה</h3><h4>א. מקור נורמטיבי וסעיפי חוק</h4><ul><li><strong>חוק סדר הדין הפלילי (חקירת חשודים), התשס\"ב-2002</strong>: <em> <strong>סעיף 3</strong>: קובע את הכלל שחקירת חשוד תתנהל בתחנת המשטרה, את שני החריגים לחקירה מחוץ לתחנה (חריג א' - דחיפות/אי-אפשרות; חריג ב' - צורך ענייני לפי קצין ממונה), ואת חובת תיעוד ההחלטה בכתב. </em> <strong>סעיף 17</strong>: מסדיר את הסייג לחובת תיעוד חזותי/קולי והצגת תיעוד מחוץ לתחנה בעבירות ביטחון. ### ב. הכלל: חקירה בתחנת המשטרה (סעיף 3)</li><li><strong>הוראת החוק</strong>: חקירת חשוד תתנהל ככלל בתוך תחנת המשטרה.</li><li><strong>הרציונל המשפטי</strong>: תחנת המשטרה מספקת סביבה מבוקרת, מונעת לחצים פסולים בשטח, מאפשרת הפעלת אמצעי תיעוד תקינים (בכתב, בווידאו או באודיו), ומבטיחה את שמירת זכויות החשוד. ### ג. שני החריגים לחקירה מחוץ לתחנה</li></ul><ol><li><strong>חריג א' – דחיפות / אי-אפשרות (סמכות שוטר)</strong>: <em> מתקיים כאשר השוטר סבור שלא ניתן לנהל את החקירה בתחנה, או שיש צורך ענייני לנהלה בדחיפות מחוץ לתחנה. </em> <em>תרחיש/דוגמת המרצה (החטופה הקבורה באדמה)</em>: חשוד שנלכד בשטח מציע להראות לחוקרים איפה הוא קבר חטופה שהיא עודנה בחיים. המשטרה לא תבזבז זמן יקר להסיע אותו לתחנת המשטרה כדי לחקור אותו, אלא תתחקר אותו מיד בשטח כדי להציל את חייה של הנחטפת בטרם יאזל לה האוויר.</li><li><strong>חריג ב' – צורך ענייני (סמכות קצין ממונה)</strong>: <em> מתקיים כאשר הקצין הממונה סבור שיש צורך ענייני בחקירת החשוד מחוץ לתחנה. </em> <em>דוגמת המרצה</em>: ניהול החקירה בשטח מחוץ לתחנה כדי שהמקום או זירת העבירה ישפיעו על החשוד להודות, או לצורך שחזור מעשיו בשטח. ### ד. פרוצדורה, מועדים וזכויות</li></ol><ul><li><strong>חובת תיעוד ההחלטה בכתב</strong>: כל החלטה להוציא חשוד לחקירה מחוץ לתחנה תתועד בכתב בסמוך ככל הניתן לאחר קבלתה.</li><li><strong>נוהל אישור החקירה בתחנה בעבירות חמורות (10 שנות מאסר ומעלה)</strong>: <em> נחקר חשוד מחוץ לתחנה בעבירה שדינה 10 שנות מאסר ומעלה (כגון רצח, אונס, שוד חמור), חובה להציג בפניו את תיעוד החקירה שנערכה מחוץ לתחנה מיד עם הגעתו לתחנה (או בהקדם האפשרי) ולבקש ממנו לאשרו. </em> הליך הצגת התיעוד ואישורו בתחנה יתועדו <strong>בתיעוד חזותי</strong> (וידאו) או <strong>בתיעוד קולי</strong> (אודיו). * <strong>סמכות דחייה</strong>: קצין ממונה רשאי לדחות את הצגת התיעוד בתחנה למועד מאוחר יותר אך ורק \"מטעמים מיוחדים שיירשמו\".</li><li><strong>סייג בעבירות ביטחון (סעיף 17)</strong>: בחקירת חשוד בעבירת ביטחון, הפטור מחובת תיעוד חזותי/קולי חל גם בחקירה מחוץ לתחנה, מטעמי ביטחון מידע. ### ה. השלכות הפרת הכלל</li><li>ניהול חקירת חשוד מחוץ לתחנת המשטרה ללא קיומה של עילת דחיפות או אישור קצין ממונה, או הימנעות מתיעוד ההחלטה בכתב – מהווים פגם חקירתי. פגם זה עשוי להשפיע על משקל הודאתו של החשוד או להוביל לפסילתה במסגרת דוקטרינת הפסילה הפסיקתית (הלכת יששכרוב). ### ו. משמעות מעשית למבחן</li></ul><p>בפתרון קייס במבחן, כאשר מוצגת חקירה שנעשתה מחוץ לתחנת המשטרה (כגון ברכב, ברחוב או בשטח), יש לבחון:</p><ol><li>האם התקיימה דחיפות מיידית (כמו הצלת חיים)?</li><li>האם ניתן אישור מוקדם של קצין ממונה מטעמים ענייניים?</li><li>האם ההחלטה תועדה בכתב בסמוך?</li><li>אם מדובר בעבירה חמורה (10 שנות מאסר ומעלה) – האם הציגו לחשוד את התיעוד בתחנה ואם הליך האישור תועד חזותית/קולית?</li></ol></section><section class=\"release-subtopic\"><h3>אופני תיעוד חקירת חשוד (חזותי, קולי, בכתב) וכללי הרישום</h3><h4>א. מקור נורמטיבי וסעיפי חוק</h4><ul><li><strong>חוק סדר הדין הפלילי (חקירת חשודים), התשס\"ב-2002</strong>: ### ב. פירוט שלוש חלופות התיעוד ותוכנן בחוק</li></ul><ol><li><strong>תיעוד חזותי (וידאו + קול)</strong>: <em> הקלטת תמונה וסאונד במקביל. </em> נערך <strong>בכל מהלכה של החקירה</strong>. * כולל את חילופי הדברים הכלליים וכן את תגובותיהם ותנועות גופם של החוקר והחשוד.</li><li><strong>תיעוד קולי (סאונד בלבד)</strong>: <em> הקלטת אודיו בלבד. </em> נערך <strong>בכל מהלכה של החקירה</strong>. * כולל את כל חילופי הדברים הקוליים שנעשו בין החוקר לחשוד.</li><li><strong>תיעוד בכתב (פרוטוקול מודפס/בכתב יד)</strong>: <em> כולל את עיקרי חילופי הדברים, וכן תגובות או תנועות גוף שהן תחליף לחילופי דברים (באופן שישקף נכונה את המתרחש). </em> <strong>עיתוי הרישום</strong>: ייערך בו-זמנית עם החקירה או בסמוך לה ככל האפשר. ### ג. כללי הרישום בפרקטיקה המשטרתית ובפסיקה</li></ol><ul><li><strong>רישום \"מילה במילה\"</strong>: על אף שהחוק נוקט בלשון \"עיקרי חילופי הדברים\", המרצה מציין כי עמדה במבחן הפסיקה הפרקטיקה המשטרתית המקובלת, שבה החוקר כותב <strong>מילה במילה</strong> את השאלות שהוא שואל ואת התשובות שהחשוד עונה.</li><li><strong>מנגנון \"הערת חוקר\"</strong>: <em> כאשר החקירה מתועדת בכתב (ולא בתיעוד חזותי), החוקר מחויב לשקף בפרוטוקול את התנהגותו הפיזית והרגשית של החשוד. </em> הדבר מבוצע באמצעות הוספת בסוגריים: <strong>\"הערת חוקר\"</strong> (למשל: <em>(הערת החוקר אסף מנשה: החשוד בוכה)</em>, <em>(הערת חוקר: החשוד מסתכל לצדדים)</em>, <em>(הערת חוקר: החשוד מזיע בצורה אובססיבית)</em>, <em>(הערת חוקר: החשוד מחפש בטלפון)</em>). ### ד. סוגיית התיעוד הסמוי (אין חובת גילוי)</li><li>כאשר חקירת חשוד מתועדת בתיעוד חזותי (וידאו), <strong>אין שום חובה בחוק לספר או לגלות לחשוד שהחקירה מצולמת או מוקלטת!</strong></li><li>ההקלטה החזותית יכולה להיות סמויה לחלוטין (מצלמה מוסתרת בתוך עט, בתמונה על הקיר, בעציץ, בתוך הטיח וכיוצא באלה). ### ה. שפת התיעוד בכתב ### ו. היחס בין הוראות החוק לפרקטיקה המשטרתית</li><li><strong>הוראת החוק</strong>: בחקירת עבירות חמורות (10 שנות מאסר ומעלה), דרישת החוק היבשה היא תיעוד חזותי, ולא מופיעה בחוק דרישה מצטברת לתיעוד בכתב.</li><li><strong>הפרקטיקה המשטרתית</strong>: בפועל, המשטרה פועלת תמיד בשיטה משולבת: החוקר מפעיל את התיעוד החזותי/הקולי, ובמקביל יושב ורושם בכתב את כל מהלכי החקירה והתשובות. ### ז. משמעות מעשית למבחן</li></ul><p>בפתרון שאלה או קייס במבחן:</p><ol><li>יש להכיר את שלוש חלופות התיעוד בחוק (חזותי, קולי, בכתב) ואת דרישת הרישום בו-זמנית/בסמוך.</li><li>יש לזכור שאין חובת אזהרה/גילוי על צילום סמוי בחדר החקירות.</li><li>יש לשים לב כי בתיעוד בכתב חובה לשלב \"הערות חוקר\" על התנהגות פיזית של החשוד כדי לשקף נכונה את המתרחש.</li></ol></section><section class=\"release-subtopic\"><h3>חובת תיעוד חזותי בחקירת עבירות חמורות (10 שנות מאסר ומעלה)</h3><h4>א. המקור הנורמטיבי וסעיפי החוק</h4><ul><li><strong>חוק סדר הדין הפלילי (חקירת חשודים), התשס\"ב-2002</strong>: * <strong>סעיף 17</strong>: מסדיר את הסייג לחובת תיעוד חזותי/קולי בעבירות ביטחון ודרישת מנגנון הפיקוח והבקרה המשטרתי. ### ב. הכלל והרציונל המשפטי להחמרה בעבירות חמורות</li><li><strong>הוראת החוק הקטגורית</strong>: חקירת חשוד בעבירה שהעונש הקבוע לצדה בחוק הוא <strong>10 שנות מאסר ומעלה</strong> (ועד מאסר עולם או עונש מוות) – <strong>חייבת להתועד בתיעוד חזותי</strong> (וידאו המשלב תמונה וסאונד).</li><li><strong>הרציונל המשפטי המוגבר</strong>: <em> עבירות חמורות (כגון רצח, אונס, שוד מזויף חמור) גוררות עונשי מאסר ממושכים ביותר וכבדים, אשר שוללים את חירות החשוד לזמן ממושך מאוד (עד מאסר עולם). </em> בשל עוצמת הפגיעה בחירות והסיכון להודאות שווא תחת לחץ חקירתי, נקטה החקיקה במנגנון הגנה קפדני וזהיר במיוחד, המבטיח שקציני המשטרה והשופטים בבית המשפט יוכלו לבחון בעיניהם ובאוזניהם את התנהלות הטיעוד, טון הדיבור, ושפת הגוף של הנחקר. ### ג. היקף התיעוד החזותי והיעדר חובת גילוי</li><li><strong>היקף התיעוד</strong>: התיעוד החזותי חייב להקיף את <strong>כל מהלכה של החקירה</strong> מראשיתה ועד סופה, ולכלול את חילופי הדברים, התגובות ותנועות הגוף של החוקר והחשוד.</li><li><strong>סמכות התיעוד הסמוי</strong>: בחוק <strong>אין שום דרישה או חובה לספר לחשוד שהחקירה מוקלטת בתיעוד חזותי</strong>. הצילום יכול להתבצע באמצעות אמצעים סמויים לחלוטין (מצלמה מוסתרת בעט, בתמונה על הקיר, בקיר עצמו, בתוך הטיח או בעציץ). ### ד. החריגים לחובת התיעוד החזותי</li></ul><ol><li><strong>חריג תקלה טכנית או צורך ענייני</strong>: <em> אם אירעה תקלה טכנית בציוד ההקלטה החזותי (כגון קלקול במצלמה) או שהתעורר צורך ענייני, רשאי <strong>הקצין הממונה</strong> בלבד להורות על תיעוד החקירה בתיעוד קולי (אודיו) או בתיעוד בכתב. </em> עם חלוף הנסיבות שמינעו את התיעוד החזותי (כגון תיקון/החלפת המצלמה) – <strong>חובה לשוב ולהקליט בתיעוד חזותי</strong> את המשך החקירה.</li><li><strong>חריג עבירת ביטחון (סעיף 17)</strong>: <em> חובת התיעוד החזותי או הקולי <strong>אינה חלה</strong> על חקירת חשוד בעבירת ביטחון, אפילו מדובר בעבירה שדינה 10 שנות מאסר ומעלה. </em> <em>הרציונל</em>: ביטחון מידע – מניעת חשיפה של שיטות חקירה סודיות, דרכי איסוף מודיעין ומידע מסווג למקרה שהסרטון ידלוף. <em> </em>מנגנון הפיקוח החלופי*: החוק מחייב למנות במשטרה גורם יעודי שיבצע פיקוח ובקרה שוטפים על חקירות אלה.</li><li><strong>חקירה מחוץ לתחנה בנסיבות דחופות והליך האישור בתחנה</strong>: <em> אם נחקר חשוד מחוץ לתחנת המשטרה מסיבות דחופות/ענייניות בעבירה שדינה 10 שנות מאסר ומעלה, חייבים החוקרים להציג בפניו את תיעוד החקירה מיד עם הגעתו לתחנה (או בהקדם האפשרי) ולבקש ממנו לאשרו. </em> הליך הצגת התיעוד והאישור בתחנה חייב להתועד <strong>בתיעוד חזותי או בתיעוד קולי</strong>. <em> </em>סמכות דחייה*: קצין ממונה רשאי להורות על דחיית הצגת התיעוד בתחנה למועד מאוחר יותר אך ורק \"מטעמים מיוחדים שיירשמו\". ### ה. הבחנה מרכזית: חוק מול פרקטיקה משטרתית</li></ol><ul><li><strong>לפי לשון החוק היבשה</strong>: בעבירות של 10 שנות מאסר ומעלה הדרישה בחוק היא תיעוד חזותי, ולא מופיעה דרישה מצטברת בחוק לכתוב פרוטוקול בכתב.</li><li><strong>לפי הפרקטיקה המשטרתית</strong>: המשטרה נוהגת תמיד בשיטה משולבת – החוקר מפעיל את התיעוד החזותי, ובמקביל יושב וכותב פרוטוקול מפורט בכתב מילה במילה. ### ו. השלכות הפרת הכלל</li><li>חקירת חשוד בעבירה חמורה (10 שנות מאסר ומעלה) ללא תיעוד חזותי, כאשר לא התקיימו תנאי התקלה הטכנית/הצורך הענייני ולא ניתן אישור קצין ממונה בכתב, מהווה פגם חקירתי חמור.</li><li>פגם זה מציב סיכון ממשי לקבילות ההודאה בבית המשפט במסגרת דוקטרינת הפסילה הפסיקתית (הלכת יששכרוב). ### ז. משמעות מעשית למבחן</li></ul><p>בפתרון שאלה או קייס במבחן:</p><ol><li>יש לבחון תחילה את העונש הקבוע לצד העבירה הנחקרת – אם מדובר ב-10 שנות מאסר ומעלה (כגון רצח/אונס/שוד חמור), חלה חובת תיעוד חזותי קטגורית.</li><li>אם החקירה תועדה בכתב בלבד – יש לבדוק האם ניתנה הוראת קצין ממונה מפורשת עקב תקלה טכנית/צורך ענייני והאם חזרו לתיעוד חזותי ברגע שחדלה המניעה.</li><li>טענת חשוד כי התיעוד החזותי פסול כיוון שנעשה במצלמה סמויה מבלי שסופר לו – <strong>תידחה לחלוטין</strong>.</li></ol></section><section class=\"release-subtopic\"><h3>חובת תיעוד חזותי/קולי בנסיבות מיוחדות (שחזור עבירה, שפת הסימנים, מוגבלות ואי-ידיעת קרוא וכתוב)</h3><h4>א. מקור נורמטיבי וסעיפי חוק</h4><ul><li><strong>חוק סדר הדין הפלילי (חקירת חשודים), התשס\"ב-2002</strong>: ### ב. פירוט המצבים של חובת תיעוד חזותי בלבד (וידאו + קול)</li></ul><ol><li><strong>שחזור עבירה בידי חשוד בשטח (סעיף ד')</strong>: <em> שחזור של עבירה פלילית המבוצע בידי חשוד מחוץ לתחנת המשטרה <strong>חייב להתועד בתיעוד חזותי בלבד</strong> (וידאו וסאונד במקביל). </em> <em>הרציונל והדוגמה המשפטית</em>: השחזור בשטח נערך לאחר שהחשוד כבר הודה בתחנה. בשטח, החוקרים אינם יכולים לרוץ אחרי החשוד עם דפים ו\"נייר קופי\" ולכתוב פרוטוקול האומר \"החשוד מצביע על אבן\". רישום כזה אינו מוכיח דבר בבית המשפט; חובה לצלם בווידאו את החשוד מצביע בעצמו על הסלע/האבן ואומר \"כאן רצחתי וקברתי אותה\", ולאחר מכן להוכיח שהגופה אכן נמצאה באותה נקודה. <em> </em>הרציונל המשפטי*: שפת הסימנים מבוססת על תנועות ידיים, מחוות גוף והבעות פנים. תיעוד בכתב בלבד או בהקלטת קול בלבד מנטרל את היכולת לבחון בדיעבד בבית המשפט את דיוק התרגום של המתורגמן ואת מחוות גופו של החשוד. ### ג. פירוט המצבים של חובת תיעוד חזותי או קולי (אודו / וידאו)</li><li><strong>אי-ידיעת קרוא וכתוב או מוגבלות (סעיף ג')</strong>: <em> כאשר קיים <strong>חשד</strong> שהחשוד אינו יודע קרוא וכתוב (אנאלפבית בכל שפה) או שהוא אדם עם מוגבלות המקשה עליו לאשר את נכונות התיעוד בכתב – חובה לתעד את החקירה ב<strong>תיעוד חזותי או בתיעוד קולי</strong>. </em> <em>הרציונל המשפטי</em>: מניעת טענות כוזבות או מוצדקות בבית המשפט כגון \"החוקר כתב שאני מודה בגניבה (3 שנות מאסר), אך אני איני יודע לקרוא ולכתוב והוא החתים אותי על טקסט שקרי שלא אמרתי\". ההקלטה החזותית או הקולית אינה נתונה למניפולציות ומספקת ראיה אובייקטיבית.</li><li><strong>הליך אישור חקירה מחוץ לתחנה בעבירות חמורות (סעיף ה')</strong>: <em> נחקר חשוד מחוץ לתחנה בעבירה שדינה 10 שנות מאסר ומעלה, חייבים החוקרים להציג בפניו את התיעוד בתחנה בהקדם האפשרי ולבקש ממנו לאשרו. </em> הליך הצגת התיעוד והאישור בתחנה חייב להתועד ב<strong>תיעוד חזותי או קולי</strong>. <em>(קצין ממונה רשאי לדחות את הצגת התיעוד מטעמים מיוחדים שיירשמו)</em>. ### ד. יחס הדין בחוק מול הפרקטיקה המשטרתית</li></ol><ul><li><strong>החוק היבש</strong>: במצבים המיוחדים הנ\"ל, הדין דורש תיעוד חזותי בלבד או תיעוד חזותי/קולי.</li><li><strong>הפרקטיקה המשטרתית</strong>: במקביל לתיעוד החזותי/הקולי הנדרש בחוק, המשטרה נוהגת תמיד לרשום <strong>גם פרוטוקול בכתב במקביל</strong> (למעט בשחזור בשטח שבו הצילום החזותי הוא בלעדי). ### ה. השלכות הפרת הכלל</li></ul></section><section class=\"release-subtopic\"><h3>הסייג לחובת תיעוד חזותי/קולי בעבירות ביטחון</h3><h4>א. מקור נורמטיבי וסעיפי חוק</h4><ul><li><strong>חוק סדר הדין הפלילי (חקירת חשודים), התשס\"ב-2002</strong>: * <strong>סעיף 17</strong>: מסדיר את הסייג לחובת תיעוד חזותי או קולי בחקירת חשוד בעבירת ביטחון, ואת חובת מינוי גורם משטרתי לפיקוח ובקרה שוטפים. ### ב. הכלל, הפטור והרציונל המשפטי</li><li><strong>הוראת הפטור (סעיף 17)</strong>: חובת התיעוד החזותי (וידאו + קול) או הקולי (אודיו) הקבועה בחוק לגבי עבירות שדינן 10 שנות מאסר ומעלה ולגבי הליכי אישור חקירה מחוץ לתחנה – <strong>אינה חלה</strong> בחקירת חשוד בעבירת ביטחון.</li><li><strong>הרציונל הראשי – ביטחון מידע</strong>: <em> במהלך חקירת חשודים בעבירות ביטחון, הנחקרים והחוקרים משוחחים על נושאים רגישים ביותר מבחינה ביטחונית. </em> המדינה והמשטרה חוששות כי תיעוד חזותי (וידאו) או קולי (הקלטת סאונד) מתוך חדרי החקירות הביטחוניים עלול לדלוף החוצה לציבור, לגורמי אויב או לאמצעי התקשורת. * דליפה כזו של חומר חזותי או קולי עלולה לגרום לסיכון מוחשי וחד-משמעי של חיי אדם ולחשיפת שיטות חקירה ומודיעין חסויות.</li><li><strong>סיווג התיעוד בכתב</strong>: התיעוד בכתב (פרוטוקול החקירה) ממשיך להתקיים, אך הוא נשמר ומתוייק תחת הגדרה וסיווג של <strong>\"חומר סודי ביותר\"</strong>. ### ג. דוגמת המרצה (הפרצה בגדר הבסיס הצבאי)</li><li><strong>התרחיש</strong>: המשטרה חוקרת חשוד שנעצר בגין עבירת ביטחון חמורה של חדירה לבסיס צבאי.</li><li><strong>המידע הנחשף בחקירה</strong>: במהלך החקירה, החשוד מפרט מול החוקרים בדיוק כיצד חדר לבסיס – למשל דרך פרצה מסוימת בגדר ההיקפית – ומתאר את הפעולות שביצע.</li><li><strong>הסיכון הביטחוני</strong>: אם חקירה זו תצולם בווידאו או תוקלט באודיו והסרטון/ההקלטה ידלפו, הדבר יחשוף קבל עם ועדה את הפרצה הביטחונית ואת דרכי החדירה, ויסכן באופן מיידי חיי אדם וביטחון המדינה.</li><li><strong>הפתרון המשפטי בסעיף 17</strong>: המשטרה פטורה מלתעד את החקירה הביטחונית בתיעוד חזותי או קולי. החקירה נרשמת בכתב בלבד ומתויקת כחומר סודי ביותר. ### ד. חובת הפיקוח והבקרה המשטרתית</li><li>כדי למנוע ניצול לרעה של הפטור מתיעוד חזותי/קולי וכדי להבטיח את תקינות החקירה, המחוקק קבע תנאי נלווה מפורש בסעיף 17: <strong>חובה למנות במשטרה גורם שיערוך פיקוח ובקרה שוטפים על חקירות ביטחוניות אלה</strong>. ### ה. משמעות מעשית למבחן</li></ul><p>בפתרון קייס במבחן, כאשר מוצגת חקירת חשוד בעבירת ביטחון שצפויה לגורר עונש חמור (כגון 10–20 שנות מאסר או מאסר עולם):</p><ol><li>טענת סניגור כי ההודאה פסולה לפי הלכת יששכרוב כיוון שהמשטרה לא צילמה את החקירה בווידאו – <strong>תידחה לחלוטין</strong> מכוח סעיף 17.</li><li>יש לציין מפורשות כי נימוק הפטור הוא <strong>ביטחון מידע</strong> ומניעת סיכון חיי אדם.</li><li>יש לבדוק ולהזכיר את חובת מינוי הגורם המפקח והמבקר במשטרה, ואת קיומו של התיעוד בכתב המוגדר כסודי ביותר.</li></ol></section><section class=\"release-subtopic\"><h3>איסור פרסום תיעוד חזותי או קולי של חקירה וארבעת עקרונותיו</h3><h4>א. מקור נורמטיבי וסעיפי חוק</h4><ul><li><strong>חוק סדר הדין הפלילי (חקירת חשודים), התשס\"ב-2002</strong>: <em> <strong>סעיף 13</strong>: אוסר מפורשות על פרסום תיעוד חזותי או קולי של חקירה שבוצעה בידי גוף חוקר אלא ברשות בית המשפט. </em>(הערה לימודית: המרצה מזכיר בתחילה בטעות את חוק המעצרים ומבהיר מיד כי המקור הנכון והמדויק הוא סעיף 13 לחוק חקירת חשודים)*.</li><li><strong>הלכות בית המשפט העליון</strong>: ### ב. הכלל המשפטי וארבעת העקרונות המרכזיים</li></ul><p>הוראת סעיף 13 לחוק חקירת חשודים וההלכות הפסוקות בעניין רשות השידור וטורג'מן מעגנות ארבעה עקרונות יסוד: 1. <strong>עיקרון 1 – חובת רשות בית המשפט ככלל קטגורי</strong>: * אין לפרסם תיעוד חזותי (וידאו) או קולי (אודיו) של חקירה שבוצעה בידי גוף חוקר אלא ברשות בית המשפט בלבד.</p><ol><li><strong>עיקרון 2 – שני הרציונלים העומדים בבסיס האיסור</strong>: <em> </em>רציונל א' – הגנה על טוהר ההליך השיפוטי ותקינותו<em>: מניעת \"משפט שדה\" בתקשורת, ומניעת זיהום והשפעה פסולה על עדים עתידיים, שופטים, או הציבור הרחב. </em> <em>רציונל ב' – הגנה על כבודם ופרטיותם של הנחקרים</em>: הגנה על האדם המצולם/מוקלט ברגעיו הקשים והפגיעים ביותר בחדר החקירות.</li><li><strong>עיקרון 3 – מעמד הסכמת הנחקר מול התנגדותו</strong>: <em> </em>כשנחקר מסכים לפרסום<em>: הסכמת הנחקר מנטרלת אמנם את הרציונל השני (הגנת כבודו ופרטיותו), אך <strong>אינה מנטרלת</strong> את הרציונל הראשון (הגנה על טוהר ההליך השיפוטי). כיוון שלנחקר אין בעלות על תקינות הדיון השיפוטי, <strong>הסכמתו אינה מספיקה, ועדיין חובה לקבל את רשות בית המשפט</strong>. </em> <em>כשנחקר מתנגד לפרסום</em>: אם הנחקר מתנגד לפרסום, קבע בית המשפט העליון כי התנגדותו מהווה <strong>שיקול נכבד ביותר שלא להתיר את הפרסום</strong>.</li><li><strong>עיקרון 4 – תחולת האיסור הבלתי מוגבלת בזמן</strong>: * האיסור על פרסום מהלך החקירה חל בכל שלבי ההליך הפלילי: <strong>בשעת החקירה, במהלך המשפט הפלילי, ואף לאחר שהמשפט הסתיים לחלוטין</strong>. ### ג. פער הדין מול הפרקטיקה המשטרתית והתקשורתית</li></ol><ul><li>המרצה מציין מתוך ניסיונו בשטח (\"בתוך עמי אני חי\"): בפרקטיקה בשטח מודלפות הקלטות חקירה חדשות לבקרים על ידי שוטרים, קציני משטרה, ואנשי מערכת התביעה, ואמצעי התקשורת משדרים אותן.</li><li><strong>דגש מרצה קריטי למבחן</strong>: המרצה מזהיר מפורשות את הסטודנטים שלא לכתוב במבחן או בהודעות על ההדלפות הקיימות במציאות. במבחן האקדמי הנבחנים נדרשים <strong>אך ורק לפי הכלל המשפטי היבש</strong> השולל פרסום ללא רשות בית משפט. ### ד. משמעות מעשית למבחן</li></ul><p>בפתרון שאלה או קייס במבחן, כאשר מוצג פרסום של סרטון/הקלטת חקירה בתקשורת:</p><ol><li>יש לקבוע כי הפרסום הוא <strong>בלתי חוקי</strong> אם לא ניתן היתר מוקדם מבית המשפט מכוח סעיף 13 לחוק חקירת חשודים והלכות רשות השידור וטורג'מן.</li><li>יש להבהיר כי הסכמת החשוד לפרסום אינה מרפאת את הליקוי ולא פוטרת מהיתר שיפוטי (כיוון שאינה מנטרלת את הרציונל של טוהר ההליך השיפוטי).</li><li>אם החשוד התנגד – יש לציין כי זו עילה מרכזית לדחיית הבקשה ע\"י השופט.</li><li>יש לציין שהאיסור חל גם לאחר תום המשפט.</li></ol></section><section class=\"release-subtopic\"><h3>פגמים בחקירה, אי-הודעה על זכויות ופסילת ראיות</h3><h4>א. מקורות נורמטיביים וסעיפי חוק</h4><ul><li><strong>חוק סדר הדין הפלילי (סמכויות אכיפה – מעצרים), התשנ\"ו-1996 (\"חוק המעצרים\")</strong>: <em> <strong>סעיף 28</strong>: מסדיר את חובת אזהרת עצור בידי קצין ממונה בדבר זכות השתיקה והחיסיון מפני הפללה עצמית. </em> <strong>סעיף 28א</strong>: מסדיר את חובת החוקר להפסיק מיד חקירת/עדות עד ברגע שעולה חשד שביצע עבירה, ולהזהירו בדבר זכות השתיקה כחשוד.</li><li><strong>חוק סדר הדין הפלילי (חקירת חשודים), התשס\"ב-2002</strong>: <em> <strong>סעיף 3</strong>: הכלל של חקירה בתחנה והחריגים לחקירה מחוץ לתחנה. </em> <strong>סעיף 13</strong>: איסור פרסום תיעוד חקירה ללא רשות בית משפט. * <strong>סעיף 17</strong>: סייג לחובת תיעוד חזותי/קולי בעבירות ביטחון.</li><li><strong>דוקטרינת הפסילה הפסיקתית</strong>: <strong> יששכרוב</strong> (המכונה בשיעור כ\"פסק דין ססחררוב / שחררוב / יסחרוב\"). ### ב. סוגי הפגמים בחקירה והסנקציה הראייתית</li></ul><ol><li><strong>פגם של אי-הודעה על זכות השתיקה</strong>: <em> חוקר החייב להזהיר חשוד בטרם חקירתו ונמנע מלהבהיר לו כי עומדת לו זכות לשמור על שתיקה – מבצע פגם חקירתי חמור. </em> <em>התוצאה</em>: בית המשפט עשוי לפסול את עדותו/הודאתו של החשוד כראיה קבילה במשפט.</li><li><strong>פגם במעבר מעד לחשוד</strong>: <em> במהלך גביית עדות מעד (או קבלת תלונה ממתלונן), ברגע שעולה חשד כי העד ביצע עבירה פלילית, קמה חובה מוחלטת להפסיק מיד את גביית העדות ולהזהירו בדבר זכות השתיקה. </em> אם החוקר מנצל את הסטטוס של ה\"עד\" כדי להמשיך להוציא ממנו אמירות מפלילות תחת חובת המענה הנכונה בחוק – מדובר בפגם חמור המביא לפסילת האמירות שנגבו לאחר עליית החשד.</li><li><strong>פגמים בכללי שפת החקירה, המקום והתיעוד</strong>: ### ג. דוגמת המרצה (סיפור נהג המונית)</li></ol><ul><li><strong>עובדות המקרה</strong>: נהג מונית נעל נוסעת שסירבה לשלם והביא אותה בכוח לתחנת המשטרה. הוא החל למסור עדות כמתלונן/עד ופיטרט בגאווה כיצד מנע ממנה לצאת.</li><li><strong>התנהלות החוקר (מניעת פגם)</strong>: החוקר הבין שהנהג ביצע עבירות חמורות של כליאת שווא וחטיפה. החוקר עצר מיד את העדות, הודיע לנהג כי הוא חשוד, והזהירו בדבר זכות השתיקה.</li><li><strong>הנפקות המשפטית</strong>: אם החוקר היה ממשיך לגבות ממנו עדות כעד, ההודאה הייתה נפסלת בבית המשפט מכוח הלכת יששכרוב עקב הפגם החקירתי. ### ד. פסיקה רלוונטית בקצרה (הלכת יששכרוב)</li><li>בית המשפט העליון קבע בפסק דין יששכרוב כי אי-הודעה לחשוד על זכות השתיקה מהווה פגם בחקירה, המעניק לבית המשפט סמכות לפסול את ההודאה/ההודעה שנגבתה ממנו מכוח דוקטרינת הפסילה הפסיקתית. ### ה. משמעות מעשית למבחן</li></ul><p>בפתרון קייס במבחן, יש לסרוק את התנהלות המשטרה ולזהות כל פגם חקירתי (אי-אזהרה, אי-הפסקת עדות עד, שפה לא מובנת, תיעוד חסר). לגבי הודאה שנגבתה תוך אי-הודעה על זכות השתיקה – יש לטעון לפסילתה בבית המשפט מכוח הלכת יששכרוב.</p></section></div><div class=\"release-layer\"><h2>הרחבה מקיפה</h2><section class=\"release-subtopic\"><h3>המסגרת הנורמטיבית של דיני חקירה וההבחנה בין חקירת עד לחקירת חשוד</h3><h4>א. ניתוח הטרמינולוגיה והמבנה הנורמטיבי</h4><ul><li><strong>בלבול המושגים בחוק מול הפרקטיקה</strong>: <em> המחוקק בפקודת העדות משתמש בלשון \"חקירת עד במשטרה\" וקורא לעד \"נחקר\". </em> המרצה מבהיר כי בפרקטיקה ובדין המהותי המינוח <strong>\"חקירה\"</strong> שמור לחשוד. לגבי עד מדובר ב<strong>מתן עדות</strong> ובגביית <strong>\"הודעה\"</strong> (ב-א'). * <strong>הודיה</strong> (ב-י'): מיוחסת אך ורק להודאה של חשוד/נאשם בביצוע עבירה פלילית. ### ב. ניתוח יחסי הכוחות: חובת מענה (עד) מול זכות שתיקה (חשוד)</li><li><strong>עד</strong>: כפוף ל<strong>חובת מענה נכונה</strong> (סעיף 2 לפקודת העדות). לעד <strong>אין זכות שתיקה גורפת</strong>! הזכות היחידה העומדת לעד היא <strong>חיסיון מפני הפללה עצמית</strong> (סעיף 47 לפקודת הראיות / סעיף 2 לפקודת העדות) – כלומר פטור ממתן תשובה לשאלה ספציפית שהתשובה עליה עלולה לסבך אותו באישום פלילי.</li><li><strong>חשוד</strong>: נהנה מ<strong>זכות שתיקה מלאה/גורפת</strong>. החשוד אינו חייב להשיב על שום שאלה משאלות החוקר, וזכותו לא להיחקר כלל כעד. ### ג. הניתוח הדיוני של המעבר מעד לחשוד</li></ul><p>האינטרס המוגן בכלל זה הוא מניעת \"עקיפה\" של זכות השתיקה.</p><p>אם חוקר משטרה ימשיך לגבות עדות מאדם שהפך לחשוד תחת הכסות של \"עד\" (הכפוף לחובת מענה בחוק), החוקר למעשה משמש כלי לסחיטת הודאה מהנחקר תוך שלילת האוטונומיה שלו והפעלת לחץ חוקי פסול.</p><p>לפיכך, סעיף 28א קובע כלל קטגורי: <strong>חובה לעצור את העדות מיד</strong>. ### ד. ניתוח פסק דין יששכרוב () במסגרת הסוגיה</p><ul><li><strong>ההלכה כפי שנלמדה בשיעור</strong>: אי-הודעה לחשוד על זכות השתיקה (או על זכות ההיוועצות) מהווה פגם חמור בחקירה, אשר עשוי להוביל לפסילת הודאתו/הודעתו של הנחקר בבית המשפט במסגרת דוקטרינת הפסילה הפסיקתית. ### ה. מלכודות מבחן ודגשי מרצה</li></ul><ol><li><strong>מלכודת הטרמינולוגיה</strong>: הבחנה חדה בין <strong>הודעה</strong> (ב-א' - עדות עד/מתלונן) לבין <strong>הודיה</strong> (ב-י' - הודאת חשוד בביצוע עבירה).</li><li><strong>מלכודת זכות השתיקה מול חיסיון</strong>: לעד <strong>אין זכות שתיקה</strong>! לעד יש רק חיסיון מפני הפללה עצמית לגבי שאלות ספציפיות המפלילות אותו. זכות שתיקה גורפת נתונה <strong>רק לחשוד</strong>.</li><li><strong>מלכודת המעבר המיידי מעד לחשוד (סעיף 28א)</strong>: במבחן, ברגע שמתלונן או עד מתחיל לפרט מעשים המהווים עבירה פלילית מצידו (כמו בדוגמת נהג המונית שכלקח את החוק לידיים ונעל את הנוסעת) – החוקר חייב לעצור את העדות במקום. אם החוקר המשיך לגבות עדות, כל אמרה שנמסרה לאחר מכן חשופה לפסילה!</li></ol></section><section class=\"release-subtopic\"><h3>חקירת עד במשטרה, חובת המענה וחריג החיסיון מפני הפללה עצמית</h3><h4>א. ניתוח מעמיק של המבנה הנורמטיבי והטרמינולוגיה</h4><p>המרצה מעמיד על דיוקה את ההבחנה בין הטרמינולוגיה בחוק לבין הפרקטיקה המשטרתית והפסיקתית:</p><ol><li><strong>לשון החוק מול הפרקטיקה</strong>: <em> המחוקק בפקודת העדות משתמש במונחים \"חקירת עד במשטרה\" וקורא לעד \"נחקר\". </em> בפרקטיקה המשטרתית, המונח <strong>\"חקירה\"</strong> שמור לחשוד בלבד, בעוד דברי העד או המתלונן נקראים <strong>\"הודעה\"</strong> (ב-א') או \"מתן עדות\".</li><li><strong>הבחנה בין \"הודעה\" ל\"הודיה\"</strong>: <em> <strong>הודעה</strong> (ב-א'): עדות של עד או תלונה של מתלונן הנרשמת בתחנת המשטרה. </em> <strong>הודיה</strong> (ב-י'): הודאה של חשוד/נאשם בביצוע העבירה המיוחסת לו. ### ב. מנגנון החיסיון מפני הפללה עצמית (עד) מול זכות השתיקה (חשוד)</li></ol><ul><li><strong>הנחקר כעד</strong>: <em> אינו נהנה מזכות שתיקה גורפת. העד חייב להשיב נכונה על השאלות. </em> הגנתו היחידה מבוססת על <strong>החיסיון מפני הפללה עצמית</strong> (סעיף 2 לפקודת העדות / סעיף 47 לפקודת הראיות). החיסיון מופעל באופן נקודתי – אך ורק לגבי שאלות ספציפיות שהתשובה עליהן תסבך אותו באישום פלילי.</li><li><strong>הנחקר כחשוד</strong>: * נהנה מ<strong>זכות שתיקה מלאה</strong>. זכותו שלא להשיב על שום שאלה משאלות החוקר ושלא להיחקר כעד. ### ג. ניתוח דיוני של חובת עצירת העדות</li><li><strong>תכלית הסעיף</strong>: למנוע מעקף לא חוקי של זכות השתיקה. אם חוקר משטרה ימשיך לגבות עדות מעד שהפך לחשוד תחת הכסות של \"עד\" (הכפוף לחובת מענה נכונה לפי חוק), החוקר משמש כלי לסחיטת הודאה מהנחקר תוך הפעלת לחץ נורמטיבי פסול.</li><li><strong>חובת העצירה המיידית</strong>: ברגע שעולה חשד לביצוע עבירה מפי העד, המשטרה פקעה סמכותה להמשיך לגבות ממנו עדות כעד, וקמה חובה קטגורית לעצור את ההודעה, להזהירו ולהסביר לו את זכות השתיקה. ### ד. ניתוח פסק דין יששכרוב () במסגרת הסוגיה</li><li><strong>אזכור בשיעור</strong>: המרצה מזכיר את פסק דין יששכרוב (המכונה בפי המרצה בשיעור גם \"ססחררוב / יסחרוב / שחררוב\").</li><li><strong>ההלכה כפי שנלמדה בשיעור</strong>: אי-הודעה לחשוד על זכות השתיקה (או על זכות ההיוועצות) מהווה פגם חמור בחקירה, אשר עשוי להוביל לפסילת הודאתו/הודעתו של הנחקר בבית המשפט במסגרת דוקטרינת הפסילה הפסיקתית. 3. <em>השאלות המשפטיות</em>: מהי נפקותו של פגם בחקירה המתבטא באי-הודעה על זכות השתיקה/היוועצות על קבילות ההודאה. 4. <em>ההלכה שהוצאה</em>: אי-הודעה על זכות השתיקה מקימה סמכות לפסילת הראיה/ההודאה מכוח דוקטרינת הפסילה הפסיקתית. ### ה. מלכודות מבחן ודגשי מרצה</li></ul><ol><li><strong>מלכודת הטרמינולוגיה</strong>: הבחנה חדה בין <strong>הודעה</strong> (ב-א' - עדות עד/מתלונן) לבין <strong>הודיה</strong> (ב-י' - הודאת חשוד בביצוע עבירה).</li><li><strong>מלכודת זכות השתיקה מול חיסיון</strong>: לעד <strong>אין זכות שתיקה</strong>! לעד יש רק חיסיון מפני הפללה עצמית לגבי שאלות ספציפיות המפלילות אותו. זכות שתיקה גורפת נתונה <strong>רק לחשוד</strong>.</li><li><strong>מלכודת המעבר המיידי מעד לחשוד (סעיף 28א)</strong>: במבחן, ברגע שמתלונן או עד מתחיל לפרט מעשים המהווים עבירה פלילית מצידו (כמו בדוגמת נהג המונית שכלקח את החוק לידיים ונעל את הנוסעת) – החוקר חייב לעצור את העדות במקום. אם החוקר המשיך לגבות עדות, כל אמרה שנמסרה לאחר מכן חשופה לפסילה!</li></ol></section><section class=\"release-subtopic\"><h3>מעבר מעד לחשוד, חובת הפסקת העדות ומתן אזהרה</h3><h4>א. ניתוח המבנה הנורמטיבי והרציונל המשפטי</h4><p>כלל זה גובר על הוראות פקודת העדות ומחייב מעבר בין דינים:</p><ol><li><strong>מעבר מחובת מענה לזכות שתיקה</strong>: עד כפוף לפי סעיף 2 לפקודת העדות לחובת מענה נכונה (למעט חיסיון מפני הפללה עצמית). ברגע שעולה נגדו חשד פלילי, מתנתקת תחולת פקודת העדות ונכנסת לתוקף זכות השתיקה המלאה של חשוד.</li><li><strong>מניעת עקיפת זכות השתיקה</strong>: הרציונל העמוק של הסעיף הוא למנוע מצב שבו חוקרי משטרה ינצלו את מעמדו של אדם כ\"עד\" כדי לסחוט ממנו אמירות מפלילות תחת חסות \"חובת המענה הנכונה\", ובכך יעקפו את ההגנה החוקתית של זכות השתיקה. ### ב. זכויות וערובות דיוניות ברגע המעבר</li></ol><ul><li><strong>חובת האזהרה המפורשת</strong>: החוקר אינו יכול להסתפק בהכרזה סתמית שהוא \"חשוד\", אלא חייב למסור לו את נוסח האזהרה המלא.</li><li><strong>תוכן האזהרה</strong>: הודעה מפורשת כי אינו חייב לומר דבר, כי כל מה שיאמר עשוי לשמש ראיה נגדו, וכי הימנעותו מלהשיב עשויה לחזק את ראיות התביעה (לפי דיני המעצרים/חקירות). ### ג. ניתוח עובדות והלכת פסק דין יששכרוב () במסגרת הסוגיה</li><li><strong>אזכור בשיעור</strong>: המרצה מפנה לפסק דין יששכרוב (המכונה על ידו בשיעור גם \"ססחררוב / יסחרוב / שחררוב\") שנלמד בתחילת מצגת 4 של דיני מעצרים.</li><li><strong>ההלכה כפי שנלמדה בשיעור</strong>: מחדל חקירתי של אי-הודעה לחשוד על זכות השתיקה פוגע בזכותו להליך הוגן, ומקים לבית המשפט סמכות לפסול את ההודעה/ההודיה שנגבתה ממנו מכוח דוקטרינת הפסילה הפסיקתית. 3. <em>השאלה המשפטית</em>: מהי נפקותו של פגם בחקירה המתבטא באי-הודעה על זכות השתיקה על קבילות ההודאה. 4. <em>ההלכה שהוצאה</em>: אי-הודעה על זכות השתיקה מקימה סמכות לפסילת הראיה/ההודאה מכוח דוקטרינת הפסילה הפסיקתית. ### ד. ניתוח מעמיק של תרחיש נהג המונית</li><li><strong>העובדות שנלמדו</strong>: נהג המונית הגיע מרצונו לתחנת המשטרה כמתלונן/עד נגד נוסעת שסירבה לשלם. בדבריו פיטרט כיצד נעל אותה ברכב והביאה בכוח.</li><li><strong>השאלה המשפטית ביישום</strong>: מהי חובת החוקר המקבל הודעה ממתלונן/עד כאשר דברי העד מגלים ביצוע עבירה פלילית מצידו?</li><li><strong>הכרעת החוקר בשטח והיישום</strong>: <em> לעצור מיד את גביית העדות. </em> להבהיר לנהג כי עשה מעשה אסור – שלל את חירותה של הנוסעת ללא סמכות חוקית (ביצע עבירות של כליאת שווא וחטיפה). <em> לשנות את הסטטוס שלו ממתלונן/עד לחשוד. </em> להזהירו מפורשות בדבר זכות השתיקה בטרם המשך גביית אמרה ממנו. ### ה. מלכודות מבחן ודגשי מרצה</li></ul><ol><li><strong>שימוש בטרמינולוגיה</strong>: החוק בסעיף 28א משתמש בלשון \"להפסיק את החקירה\", אך המרצה מדגיש כי בפועל מדובר ב<strong>להפסיק את העדות/ההודעה של העד</strong> ולעבור לחקירת חשוד.</li><li><strong>מידיות האזהרה</strong>: במבחן, אם החוקר \"זורם\" עם העד ושואל אותו עוד 2–3 שאלות כדי \"להוציא ממנו עוד פרטים\" לפני שהוא מזהיר אותו – כל האמירות שנגבו מרגע שעלה החשד ועד למתן האזהרה חסרות תוקף וחשופות לפסילה.</li><li><strong>אזהרה מפורשת</strong>: מתן אזהרה חלקית או אי-הודעה על זכות השתיקה שקולה להיעדר אזהרה ומפעילה את הלכת יששכרוב.</li></ol></section><section class=\"release-subtopic\"><h3>שפת חקירת החשוד</h3><h4>א. ניתוח המבנה הנורמטיבי והאיזון החוקתי</h4><p>סעיף 2 לחוק חקירת חשודים מעגן ערובה פרוצדורלית מרכזית להבטחת הגינות ההליך הפלילי ולמניעת הודאות שווא.</p><ol><li><strong>פגיעה בהבנת החשדות</strong>: החשוד אינו מבין עד תום במה הוא מואשם.</li><li><strong>עיוות הגרסה</strong>: תרגום קלוקל או חוסר יכולת להתבטא במדויק עלולים להציג אמירות ניטרליות כאמירות מפלילות. ### ב. היחס בין שפת החקירה (סעיף 2) לדיני התיעוד והחתימה</li></ol><ul><li><strong>חובת החתימה על הודעה</strong>: חוק חקירת חשודים מחייב הצגת תיעוד החקירה בכתב בפני החשוד לצורך אישורו וחתימתו. ### ג. ניתוח מצבים מיוחדים ותרחישים מפי המרצה <em> החוק קובע קטגורית: <strong>חובת תיעוד חזותי בלבד!</strong> </em> התנאי המתלה: מיד עם ההגעה לתחנת המשטרה/בסמוך לכך, חובה לתרגם את התיעוד בכתב בפני החשוד לשפה שהוא מבין, לצרף את התרגום לתיעוד, ולתעד את הליך האישור בתיעוד חזותי או קולי. ### ד. מלכודות מבחן ודגשי מרצה</li></ul></section><section class=\"release-subtopic\"><h3>מקום חקירת החשוד ושני החריגים לחקירה מחוץ לתחנה</h3><h4>א. ניתוח המבנה הנורמטיבי והאיזון החוקתי</h4><p>סעיף 3 לחוק חקירת חשודים מעגן את תפיסת יסוד של ההליך ההוגן:</p><ol><li><strong>הגנה על האוטונומיה ופרטיות החשוד</strong>: חקירת חשוד בשטח או במקומות לא מוסדרים חשופה ללחצים סביבתיים, לאיומים לא מוצהרים, ולאובדן שליטה על סדרי החקירה. תחנת המשטרה מבטיחה הליך מבוקר ומפוקח.</li><li><strong>איזון מול צורכי חקירה דחופים</strong>: המחוקק הכיר בכך שבחיים המציאותיים קיימים מצבי חירום (כגון הצלת נפשות) או צרכים חקירתיים מובהקים (כגון הצבעה על ראיה חמה בשטח). לפיכך נקבעו שני החריגים בסעיף 3, אך תוך הכפפתם לדרישת תיעוד בכתב ולביקורת בדיעבד. ### ב. ניתוח עומק של שני החריגים בסעיף 3</li></ol><ul><li><strong>חריג א' (דחיפות / אי-אפשרות טכנית)</strong>: <em> הסמכות נתונה <strong>לכל שוטר</strong> בשטח. </em> <em>מקרה קלאסי</em>: סיכון מיידי לחיי אדם או חשש ממשי לסילוק/השמדת ראיות קריטיות בזמן שיידרש להסעת החשוד לתחנה. (דוגמת המרצה: חשוד המסכים לחשוף מיד מקום קבורת חטופה המצצויה בסכנת חיים).</li><li><strong>חריג ב' (צורך ענייני לפי קצין ממונה)</strong>: <em> הסמכות נתונה <strong>לקצין הממונה בלבד</strong> ולא לסתם שוטר. </em> <em>מקרה קלאסי</em>: שיקול חקירתי טקטי – כגון עימות החשוד עם זירת העבירה, עריכת שחזור בשטח, או ניצול האווירה בזירה כדי לגרום לחשוד להישבר ולהודות. ### ג. פרוצדורת אישור החקירה בתחנה בעבירות חמורות (סעיף 10 / סעיף ה' בטבלה)</li><li><strong>חומרת העבירה</strong>: מדובר בעבירות שדינן <strong>10 שנות מאסר ומעלה</strong> (כגון רצח, אונס, שוד חמור). כיוון שעבירות אלה גוררות עונשי מאסר ממושכים ביותר (עד מאסר עולם), נקבע מנגנון זהירות כפול.</li><li><strong>חובת ההצגה והאישור</strong>: ברגע שהחשוד מובא לתחנה לאחר שנחקר מחוץ לתחנה, חייבים החוקרים להציג בפניו את התיעוד של החקירה שנערכה בשטח ולבקש ממנו לאשר כי הדברים שנרשמו אכן נאמרו על ידו.</li><li><strong>חובת התיעוד החזותי/קולי</strong>: הליך האישור בתחנה חייב להתועד ב<strong>תיעוד חזותי</strong> (וידאו) או <strong>בתיעוד קולי</strong> (אודיו).</li><li><strong>חריג הדחייה בידי קצין ממונה</strong>: הקצין הממונה רשאי להורות על דחיית הצגת התיעוד בתחנה למועד מאוחר יותר אך ורק \"מטעמים מיוחדים שיירשמו\" (כגון צורך חקירתי דחוף בהמשך פעולות סמויות). ### ד. סייג עבירות ביטחון (סעיף 17)</li><li>בחקירת חשוד בעבירת ביטחון, הוראות חוק חקירת חשודים המחייבות תיעוד חזותי/קולי או הצגת התיעוד מחוץ לתחנה בתיעוד חזותי/קולי – <strong>אינן חלות</strong>.</li><li><em>הרציונל</em>: הגנה על ביטחון המידע, מניעת דליפת שיטות חקירה ודרכי חדירה, ומניעת חשיפת מידע מסווג. ### ה. מלכודות מבחן ודגשי מרצה</li></ul><ol><li><strong>מלכודת התיעוד בכתב של ההחלטה</strong>: במבחן, לא די בהצדקת היציאה מחוץ לתחנה (דחיפות או צורך ענייני). חובה לבדוק האם ההחלטה על ניהול החקירה מחוץ לתחנה <strong>תועדה בכתב בסמוך ככל הניתן לאחר קבלתה</strong>. היעדר תיעוד בכתב של ההחלטה מהווה פגם דיוני.</li><li><strong>מלכודת הדרגה המאשרת</strong>: <em> חריג א' (דחיפות) ← מוסמך <strong>כל שוטר</strong>. </em> חריג ב' (צורך ענייני) ← מוסמך <strong>קצין ממונה בלבד</strong>.</li><li><strong>מלכודת העבירות החמורות (10 שנות מאסר ומעלה)</strong>: חקירה מחוץ לתחנה בעבירה חמורה מחייבת <strong>אישור מחדש בתחנה בתיעוד חזותי/קולי</strong>. אם החוקרים דילגו על הליך האישור בתחנה – זוהי הפרה של הוראת סעיף 10 לחוק.</li></ol></section><section class=\"release-subtopic\"><h3>אופני תיעוד חקירת חשוד (חזותי, קולי, בכתב) וכללי הרישום</h3><h4>א. ניתוח המבנה הנורמטיבי והאיזון הראייתי</h4><p>חוק חקירת חשודים נחקק כדי ליצור שקיפות מלאה ולהבטיח את תקינות גביית הראיות בחקירה פלילית.</p><p>המחוקק הבחין בין שלוש דרגות תיעוד:</p><ol><li><strong>תיעוד חזותי (הדרגה הגבוהה ביותר)</strong>: מעניק תמונה מלאה של התרחשויות החדר, כולל שפת גוף, הטמת קול, ולחצים סביבתיים.</li><li><strong>תיעוד קולי (דרגת ביניים)</strong>: משקף את חילופי הדברים המילוליים וטון הדיבור, אך נעדר מימד ויזואלי.</li><li><strong>תיעוד בכתב (הדרגה הבסיסית)</strong>: דורש מאמץ אקטיבי של החוקר לשקף נאמנה את המתרחש בזמן אמת. ### ב. ניתוח עומק של כללי הרישום בכתב ומנגנון \"הערת חוקר\"</li></ol><ul><li><strong>חובת השיקוף הנאמן</strong>: סעיף 4 לחוק קובע כי התיעוד בכתב ירשם באופן ש\"ישקף נכונה את המתרחש בכל מהלך החקירה\".</li><li><strong>תפקיד \"הערת החוקר\"</strong>: כאשר חקירה אינה מצולמת בווידאו, השופט בבית המשפט מקבל דפים מודפסים בלבד. אם החשוד יטען בבית המשפט שהודאתו הושגה תחת נסיבות נפשיות מסוימות או שהיה שקט ורגוע, הפרוטוקול חייב להכיל את התיעוד הפיזי שביצע החוקר בזמן אמת.</li><li><strong>דוגמאות המרצה לרישום \"הערת חוקר\"</strong>: <em> החוקר אסף מנשה מנהל חקירה בכתב. החשוד פורץ בבכי. החוקר רושם בגוף החקירה: </em>(הערת החוקר אסף מנשה: החשוד בוכה)<em>. </em> החשוד מתחיל להזיע בצורה חריגה. החוקר רושם: <em>(הערת חוקר: החשוד מזיע בצורה אובססיבית)</em>. <em> החשוד נמנע ממבט ישיר. החוקר רושם: </em>(הערת חוקר: החשוד מסתכל לצדדים)<em>. </em> החשוד משתמש במכשיר הנייד. החוקר רושם: <em>(הערת חוקר: החשוד מחפש בטלפון)</em>. ### ג. ניתוח תרחיש התיעוד הסמוי</li><li><strong>הסוגיה המשפטית</strong>: האם המשטרה חייבת להודיע לחשוד: \"דע לך שהחדר מצולם בווידאו\"?</li><li><strong>הכרעת הדין מפי המרצה</strong>: <strong>לא!</strong> החוק אינו מטיל שום חובה לגלות לחשוד כי החקירה מוקלטת בתיעוד חזותי.</li><li><strong>יישום בשטח</strong>: המשטרה משתמשת באמצעים טכנולוגיים מוסתרים (מצלמות סמויות בתוך עטים, תמונות קיר, עציצים או בתוך הטיח). הצילום הסמוי קביל לחלוטין ומשמש ראיה במשפט. ### ד. היחס בין הדין בחוק לפרקטיקה המשטרתית (שילוב תיעוד)</li><li><strong>בחינה אקדמית מול מציאות</strong>: <em> </em>לפי החוק<em>: בעבירה שדינה 10 שנות מאסר ומעלה, החוק דורש תיעוד חזותי בלבד, ואינו מחייב בחוק היבש כתיבת פרוטוקול בכתב במקביל. </em> <em>לפי הפרקטיקה</em>: החוקרים אינם מסתפקים בהקלטת הוידאו, אלא מקפידים לרשום במקביל פרוטוקול מלא בכתב. <em> </em>הרציונל המשטרתי לפרקטיקה המשולבת*: הרישום בכתב מאפשר סקירה מהירה של החקירה בידי תובעים, סנגורים ושופטים, מבלי להידרש לצפייה ממושכת בשעות של סרטוני וידאו, בעוד התיעוד החזותי משרת כגיבוי ראייתי מוחלט למקרה של טענות על זיוף או לחץ פסול. ### ה. מלכודות מבחן ודגשי מרצה</li></ul><ol><li><strong>מלכודת חובת הגילוי על צילום</strong>: במבחן, טענת סנגור כאילו התיעוד החזותי פסול כיוון שהמשטרה לא גילתה לחשוד שהיא מצלמת אותו בסתר – <strong>תידחה על הסף!</strong> אין שום חובה לגלות לחשוד על צילום סמוי.</li><li><strong>מלכודת \"עיקרי הדברים\" מול \"מילה במילה\"</strong>: בחוק נכתב \"עיקרי חילופי הדברים\", אך במבחן ובפרקטיקה הכלל המקובל שאושר בפסיקה הוא רישום <strong>מילה במילה</strong>.</li><li><strong>מלכודת עיתוי התיעוד בכתב</strong>: תיעוד בכתב שנערך שעות או ימים לאחר החקירה (ולא בו-זמנית או בסמוך לה ככל האפשר) סובל מפגם דיוני חמור הפוגע במהימנותו ובקבילותו.</li></ol></section><section class=\"release-subtopic\"><h3>חובת תיעוד חזותי בחקירת עבירות חמורות (10 שנות מאסר ומעלה)</h3><h4>א. ניתוח מעמיק של המבנה הנורמטיבי והאיזון הראייתי</h4><p>הוראות החוק לחוק חקירת חשודים מבטאים את קביעת המחוקק כי ככל שחומרת העבירה והעונש הצפוי בצדה עולים, כך גוברת החובה להבטיח את איכותה, דיוקה ושקיפותה של החקירה. התיעוד החזותי בעבירות חמורות משרת שלוש תכליות מרכזיות:</p><ol><li><strong>הגנה על החשוד מלחצים פסולים</strong>: מניעת אלימות פיזית, איומים, סחיטה נפשית או שרשור אמצעים פסולים בחדר החקירות.</li><li><strong>הגנה על החוקרים מטענות שווא</strong>: מתן כלי ראייתי מוחלט המזיים טענות שקריות של נחקרים בבית המשפט כאילו הודאתם הוצאה בכוח.</li><li><strong>מתן כלי שיפוטי אובייקטיבי</strong>: מאפשר לשופט לקבל רושם בלתי אמצעי על שפת הגוף, הבעות הפנים והמצב הנפשי של החשוד בעת מסירת הודאתו. ### ב. ניתוח עומק של חריג התקלה הטכנית והצורך הענייני</li></ol><ul><li><strong>דרישת האישור הפיקודי</strong>: שוטר זוטר אינו מוסמך להחליט על דעת עצמו כי הוא מוותר על תיעוד חזותי בעבירה חמורה. הסמכות להורות על תיעוד קולי או בכתב נתונה <strong>לקצין הממונה בלבד</strong>.</li><li><strong>חובת החזרה המיידית</strong>: החוק קובע מנגנון דינמי – ברגע שהתקלה הטכנית תוקנה או שהצורך הענייני חלף, החוקר חייב להפסיק את התיעוד החלופי ולחזור באופן מידי לתיעוד חזותי. ### ג. ניתוח עומק של סייג עבירות הביטחון (סעיף 17)</li><li><strong>הסוגיה הביטחונית</strong>: בחקירת חשודים בעבירות ביטחון חמורות (כגון חדירה לבסיס צבאי או פעילות טרור), החוקרים עושים שימוש בשיטות חקירה רגישות ובמידע מסווג.</li><li><strong>הכרעת החוק בסעיף 17</strong>: ניצחון אינטרס ביטחון המידע על פני דרישת התיעוד הציבורית. המדינה חששה כי סרטוני וידאו של חקירות ביטחוניות ידלפו ויחשפו שיטות עבודה וסודות ביטחוניים.</li><li><strong>מנגנון הפיקוח החלופי</strong>: כדי למנוע ניצול לרעה של הפטור, החוק מחייב למנות גורם משטרתי ייעודי המבצע פיקוח ובקרה שוטפים על חקירות אלה. ### ד. ניתוח תרחישים ודוגמאות לימודיות מפי המרצה</li></ul><ol><li><strong>תרחיש חקירת הרצח/האונס והמצלמה הסמויה בעציץ</strong>: <em> </em>הסיטואציה<em>: חשוד מובא לחקירה בעבירת רצח (מאסר עולם) או אונס (20 שנות מאסר). בחדר החקירות מוצבת מצלמה סמויה בתוך עציץ/עט/טיח. החוקר אינו מגלה לחשוד על קיום המצלמה. החשוד נשבר ומודה ברצח. </em> <em>הטענה במ המשפט</em>: הסנגור טוען כי ההודאה פסולה כיוון שהמשטרה הסתירה מהחשוד את קיומו של התיעוד החזותי הסמוי. <em> </em>היישום לפי המרצה*: <strong>הטענה נדחית על הסף!</strong> סעיף 7 לחוק מחייב תיעוד חזותי בעבירות אלה, אך בחוק <strong>אין שום חובה לגלות לחשוד שהחקירה מצולמת</strong>. התיעוד הסמוי קביל לחלוטין.</li><li><strong>תרחיש התקלה במצלמה והמעבר לרישום בכתב</strong>: <em> </em>הסיטואציה<em>: באמצע חקירת שוד חמור (20 שנות מאסר), מכשיר הווידאו מפסיק לעבוד עקב תקלה טכנית. </em> <em>היישום לפי המרצה</em>: החוקר מחויב לפנות לקצין הממונה. הקצין הממונה רושם הוראה המאשרת תיעוד קולי או בכתב עקב התקלה הטכנית. החקירה ממשיכה בכתב. ברגע שמובא מכשיר וידאו חלופי – חובה לחזור ולצלם בתיעוד חזותי.</li><li><strong>תרחיש החקירה מחוץ לתחנה בעבירת רצח ונוהל האישור</strong>: <em> </em>הסיטואציה<em>: חשוד ברצח נחקר מחוץ לתחנה מסיבות דחופות ומודה בשטח. </em> <em>היישום לפי המרצה</em>: ברגע שהחשוד מובא לתחנה, חייבים החוקרים להציג בפניו את התיעוד של החקירה מהשטח ולבקש ממנו לאשר אותה. הליך ההצגה והאישור בתחנה חייב להתועד בתיעוד חזותי או קולי (אלא אם קצין ממונה דחה זאת מטעמים מיוחדים שיירשמו). ### ה. מלכודות מבחן ודגשי מרצה</li><li><strong>מלכודת התירוץ המשטרתי ללא אישור קצין</strong>: במבחן, אם חקירת עבירה חמורה (10+ שנות מאסר) תועדה בכתב בלבד בטענה של \"הייתה תקלה\", אך <strong>לא ניתן אישור מפורש של קצין ממונה</strong> – התיעוד פגום ולא התקיים החריג בחוק.</li><li><strong>מלכודת חוק מול פרקטיקה</strong>: במבחן, אם נשאלת שאלה על דרישת החוק היבשה בעבירת 10+ שנות מאסר – התשובה היא <strong>תיעוד חזותי בלבד</strong> (אין דרישה בחוק לכתוב במקביל בכתב). אם נשאלת שאלה על הפרקטיקה – המשטרה מבצעת <strong>תיעוד משולב</strong> (חזותי + בכתב במקביל).</li><li><strong>מלכודת עבירת הביטחון (סעיף 17)</strong>: חקירת עבירת ביטחון שדינה 10 שנות מאסר ומעלה <strong>פטורה מחובת תיעוד חזותי/קולי</strong> מטעמי ביטחון מידע, ואינה נחשבת לפגומה.</li></ol></section><section class=\"release-subtopic\"><h3>חובת תיעוד חזותי/קולי בנסיבות מיוחדות (שחזור עבירה, שפת הסימנים, מוגבלות ואי-ידיעת קרוא וכתוב)</h3><h4>א. ניתוח המבנה הנורמטיבי והאיזון הראייתי</h4><p>הוראות חוק חקירת חשודים לגבי נסיבות מיוחדות נועדו לנטרל פערים כוחניים ומגבלות פיזיות/קוגניטיביות בין החוקר לנחקר.</p><p>המחוקק יצר חלוקה קטגורית קפדנית:</p><ol><li><strong>קטגוריית התיעוד החזותי/הקולי (מבחן האובייקטיביות הסאונדית)</strong>: באנאלפביתיות, במוגבלות קוגניטיבית/פיזית, או באישור חקירת 10+ שנים מחוץ לתחנה – מספקת הקלטת סאונד קולית או וידאו כדי למנוע את טענת \"החוקר רשם דברים שקריים בפרוטוקול\". ### ב. ניתוח עומק של תרחישי המרצה</li><li><strong>תרחיש השחזור בשטח והאבן (דוגמת נייר הקופי והסלע)</strong>: <em> </em>העובדות שנלמדו<em>: המרצה מתאר כי בעבר חוקרים היו יוצאים לשטח עם נייר קופי וכותבים בכתב יד דברים כגון: \"החשוד מצביע על אבן\". </em> <em>הכשל הראייתי</em>: המרצה מסביר כי רישום בכתב של שחזור הוא חסר ערך. סניגור בבית המשפט יטען שהחוקרים כיוונו את החשוד או בדו את ההצבעה מליבם. <em> </em>הפתרון בחוק*: סעיף ד' קובע חובת תיעוד חזותי בלבד. הסרטון חייב להראות את החשוד נע מעצמו בשטח, מגיע לסלע/אבן, מצביע עליה באופן אקטיבי, ומצהיר בקולו: \"מתחת לאבן הזו קברתי את הנרצחת\", ולאחר מכן הצילום מראה את חפירת הראיה מאותו מקום.</li><li><strong>תרחיש האנאלפבית בעבירת הגניבה</strong>: <em> </em>העובדות שנלמדו<em>: חשוד נחקר בעבירת גניבה (3 שנות מאסר, עבירה שאינה מחייבת ככלל תיעוד חזותי). החוקר כותב בפרוטוקול \"אני מודה שגנבתי\" והחשוד מחתים את אצבעו. בבית המשפט החשוד טוען: \"אני לא יודע לקרוא ולכתוב, חתמתי כי החוקר אמר לי שזה אישור יציאה ולא ידעתי שהוא רשם שהודעתי\". </em> <em>הפתרון בחוק</em>: סעיף ג' קובע כי <strong>מספיק קיים חשד</strong> שהחשוד אינו יודע קרוא וכתוב בכל שפה – חובה לעבור לתיעוד חזותי או קולי. הקלטת הסאונד/וידאו מונעת לחלוטין את טענת הזיוף וההטעיה.</li><li><strong>תרחיש שפת הסימנים והמתורגמן</strong>: <em> </em>הפתרון בחוק<em>: חובת תיעוד חזותי בלבד. תיעוד קולי בלבד לא ישקף את תנועות ידיו של החשוד, ותיעוד בכתב בלבד יציג את פרשנות המתורגמן בלבד ללא יכולת של סניגור או שופט לבחון בדיעבד את דיוק התרגום. </em> <strong>חקירת 10+ שנות מאסר / שחזור עבירה / שפת הסימנים</strong> ← <strong>חובת תיעוד חזותי בלבד</strong>.</li></ol><ul><li><strong>שפה שלא ניתן לתעד בכתב / חשוד אינו יודע קרוא וכתוב / אדם עם מוגבלות / אישור חקירת 10+ שנים מחוץ לתחנה</strong> ← <strong>חובת תיעוד חזותי או קולי</strong> (בנוסף לכתב בפרקטיקה).</li><li><strong>חקירה מחוץ לתחנה (שאינה שחזור)</strong> ← <strong>חזותי, קולי או בכתב</strong>. ### ד. מלכודות מבחן ודגשי מרצה</li></ul><ol><li><strong>מלכודת התיעוד בשחזור</strong>: במבחן, שחזור עבירה בתיעוד קולי (אודיו בלבד) או בתיעוד בכתב בלבד – <strong>אינו חוקי!</strong> שחזור חייב להתועד ב<strong>תיעוד חזותי בלבד</strong>.</li><li><strong>מלכודת \"חשד\" לאנאלפביתיות</strong>: בחוק לא נדרשת הוכחה מוחלטת שהחשוד אינו יודע לקרוא, אלא <strong>מספיק שקיים חשד</strong> אצל החוקר שהוא לא יודע קרוא וכתוב כדי להקים חובת תיעוד חזותי או קולי.</li><li><strong>מלכודת חוק מול פרקטיקה</strong>: במבחן, דרישת החוק היבשה בשחזור/שפת סימנים היא <strong>חזותי בלבד</strong>; בפרקטיקה המשטרה מצרפת פרוטוקולים נלווים.</li></ol></section><section class=\"release-subtopic\"><h3>הסייג לחובת תיעוד חזותי/קולי בעבירות ביטחון</h3><h4>א. ניתוח המבנה הנורמטיבי והאיזון הדיוני</h4><p>סעיף 17 לחוק חקירת חשודים מהווה \"סעיף גובר\" (Overriding provision) המאזן בין שתי תכליות חוקתיות מתנגשות:</p><ol><li><strong>התכלית הכללית של חוק חקירת חשודים</strong>: שקיפות, מניעת הודאות שווא, והבטחת זכויות החשוד באמצעות תיעוד חזותי/קולי אובייקטיבי.</li><li><strong>האינטרס הביטחוני הקצין</strong>: הגנה על ביטחון המדינה, מניעת דליפת סודות כמוסים, והגנה על חיי אדם. הכרעת המחוקק בסעיף 17 היא כי <strong>אינטרס ביטחון המידע גובר</strong> על חובת התיעוד החזותי/הקולי. בשל כך, הוחל הפטור הגורף מתיעוד חזותי/קולי על כל עבירות הביטחון. ### ב. ניתוח יחסים בין הוראות החוק</li></ol><ul><li><strong>היחס לסעיף 7 (סעיף א' בטבלה - חקירת 10+ שנות מאסר)</strong>: סעיף 7 קובע חובת תיעוד חזותי בעבירות שדינן 10 שנות מאסר ומעלה. סעיף 17 מקזז חובה זו וקובע כי אם העבירה של 10+ שנות מאסר היא עבירת ביטחון – <strong>החובה לתיעוד חזותי מבוטלת</strong>.</li><li><strong>היחס לסעיף 10 (סעיף ה' בטבלה - חקירה מחוץ לתחנה בעבירה חמורה)</strong>: סעיף 10 מחייב להציג את התיעוד בפני החשוד בתחנה בהקדם האפשרי ולתעד את הליך האישור בתיעוד חזותי/קולי. סעיף 17 קובע כי בחקירת עבירת ביטחון <strong>אין חובה לבצע תיעוד חזותי או קולי להליך זה</strong>. ### ג. יישום בקייס ותרחיש מעשי למבחן</li><li><strong>הסיטואציה בקייס</strong>: <em> חשוד נעצר על ידי כוחות הביטחון בחשד לביצוע עבירת ביטחון חמורה (כגון סיוע לאויב במלחמה / חדירה לבסיס צבאי – עבירה שהעונש עליה הוא עשרות שנות מאסר). </em> החקירה נערכה בתחנה או בשטח ותועדה בכתב בלבד בפרוטוקול המסווג כסודי ביותר. החשוד הודה בביצוע העבירה. * במשפט הפלילי, מגיש הסניגור בקשה לפסילת הודאת החשוד, בטענה שהמשטרה הפרה את הוראת סעיף 7 לחוק חקירת חשודים בכך שלא תיעדה את החקירה בתיעוד חזותי (וידאו), וטענה כי הדבר מהווה פגם חמור המקים עילת פסילה לפי הלכת יששכרוב.</li><li><strong>הניתוח וההכרעה המשפטית לפי המרצה</strong>: 1. <strong>דחיית טענת הפסילה</strong>: טענת הסניגור תידחה מכל וכל. 2. <strong>הביסוס המשפטי</strong>: מכוח סעיף 17 לחוק חקירת חשודים, חובת התיעוד החזותי או הקולי הקבועה בהוראות החוק ו-10 <strong>אינה חלה</strong> על חקירת חשוד בעבירת ביטחון. 3. <strong>נימוק הדין</strong>: הדין מעניק פטור מפורש מתיעוד חזותי/קולי מטעמים של ביטחון מידע ומניעת סיכון חיי אדם. 4. <strong>תקינות התיעוד</strong>: התיעוד בכתב שנערך ונשמר כחומר סודי ביותר קביל ותקין לחלוטין, ובלבד שהתקיים הפיקוח והבקרה השוטפים של הגורם המשטרתי הממונה לפי סעיף 17. ### ד. מלכודות למבחן ודגשים מפורשים של המרצה</li></ul><ol><li><strong>מלכודת ה-10 שנות מאסר</strong>: נבחנים רבים זוכרים את הכלל הקשיח של סעיף 7 (\"עבירה של 10+ שנות מאסר = חובת צילום בווידאו\") ושוכחים את הסייג של סעיף 17. <strong>ברגע שהעבירה מוגדרת כעבירת ביטחון – הפטור חל ואין שום חובת וידאו או אודיו!</strong>.</li><li><strong>מלכודת התיעוד בכתב</strong>: סעיף 17 פוטר מתיעוד <strong>חזותי או קולי</strong>, אך <strong>אינו פוטר מתיעוד בכתב!</strong> חובה לנהל פרוטוקול בכתב המתוייק כחומר סודי ביותר.</li><li><strong>מלכודת מנגנון הבקרה</strong>: במבחן, יש להקפיד ולציין כי התקיימות הפטור נשענת על חובת המשטרה למנות גורם ייעודי שיערוך פיקוח ובקרה שוטפים על חקירות אלה.</li></ol></section><section class=\"release-subtopic\"><h3>איסור פרסום תיעוד חזותי או קולי של חקירה וארבעת עקרונותיו</h3><h4>א. ניתוח מעמיק של ארבעת העקרונות והאיזון החוקתי</h4><p>סעיף 13 לחוק חקירת חשודים וההלכה הפסוקה יצרו הסדר ייחודי המפקיע את הכוח להחליט על פרסום הקלטות חקירה מידי גורמי האכיפה, אמצעי התקשורת והחשוד עצמו, ומעביר אותו באופן בלעדי לשיקול דעתו של בית המשפט. 1. <strong>חובת הרשות השיפוטית (מחסום נורמטיבי)</strong>: * חוק חקירת חשודים אינו מותיר פתח ל\"פטור אוטומטי\" מפרסום. כל גורם המבקש לפרסם קלטת חקירה חייב להגיש בקשה מנומקת לבית המשפט.</p><ol><li><strong>ניתוח שני הרציונלים בשאלת הפרסום</strong>: <em> </em>טוהר ההליך השיפוטי<em>: הקלטת חקירה חזותית/קולית היא ראיה משפטית גולמית. פרסומה בציבור בטרם הוצגה והוכרעה בבית המשפט עלול להוביל ל\"זיהום ראיות\", להטיית עדים שייחשפו אליה בתקשורת, וללחץ ציבורי פסול על המערכת השיפוטית. </em> <em>הגנה על כבוד הנחקר ופרטיותו</em>: נחקר בחדר החקירות מצוי במצב נחות, מושפל, ולעיתים פורץ בבכי או נשבר. חוק יסוד: כבוד האדם וחירותו מגן על זכותו שלא להפוך למופע בידור או לשיימינג פומבי בתקשורת.</li><li><strong>ניתוח יחסי הכוחות בהסכמת/התנגדות הנחקר</strong>: <em> </em>כאשר החשוד מסכים לפרסום<em>: החשוד רשאי למחול על פרטיותו וכבודו. אולם, האינטרס הציבורי של \"שמירה על טוהר ההליך השיפוטי\" אינו נכס פרטי של החשוד, ואין ביכולתו לוותר עליו. לפיכך, השופט מחויב לבחון האם הפרסום יפגע בתקינות המשפט, ואינו רשאי לאשר פרסום רק בשל הסכמת החשוד. </em> <em>כאשר החשוד מתנגד לפרסום</em>: במצב זה שני הרציונלים פועלים כנגד הפרסום – גם החשש מזיהום המשפט וגם הפגיעה הקשה בפרטיות החשוד. לפיכך קבע בית המשפט העליון ברשות השידור ובטורג'מן כי התנגדות הנחקר היא <strong>\"שיקול נכבד ביותר\"</strong> השולל ככלל את התרת הפרסום.</li><li><strong>עיתוי האיסור (רצף הזמנים)</strong>: * ניסיון לטעון כי האיסור פוקע עם סיום המשפט הפלילי נדחה מכל וכל. כבודו ופרטיותו של אדם, כמו גם אמון הציבור במערכת המשפט, אינם פוקעים עם מתן פסק הדין. הפרסום לאחר סיום המשפט עדיין מחייב פנייה לבית המשפט והתרת האיסור. ### ב. ניתוח דגשי המרצה ותרחיש קייס טיפוסי</li></ol><ul><li><strong>תרחיש הכתב המשפטי וההדלפה (יישום בקייס)</strong>: <em> </em>הסיטואציה<em>: כתב משפטי מקבל מקצין משטרה הקלטת וידאו סמויה מחקירת רצח. החשוד בסרטון הודה במעשה. הכתב פונה לחשוד וזה חותם לו על אישור בכתב: \"אני מסכים שתשדרו את הסרטון בחדשות\". הכתב מפרסם את הסרטון במהדורה המרכזית ללא פנייה לבית המשפט. </em> <em>השאלה המשפטית</em>: האם הפרסום נעשה כדין? <em> </em>הניתוח וההכרעה המשפטית לפי המרצה*: 1. <strong>הפרסום אינו חוקי בעליל</strong>: הפרת הוראת סעיף 13 לחוק חקירת חשודים. 2. <strong>ביטול טענת ההסכמה</strong>: חתימת החשוד על אישור הפרסום אינה מרפאת את הפסול, כיוון שהסכמת הנחקר מנטרלת רק את הרציונל של הגנת הפרטיות, אך אינה פוטרת מהחובה להגן על טוהר ההליך השיפוטי שאינו בשליטת החשוד. 3. <strong>חובת האישור השיפוטי</strong>: הכתב והמערכת היו חייבים להגיש בקשה מוקדמת לבית המשפט לקבלת היתר פרסום. 4. <strong>אי-תקפות הטיעון הפרקטי</strong>: טענת הכתב כי \"בפועל כולם מדליפים סרטוני חקירות\" תידחה בבית המשפט ובמבחן האקדמי, שכן נבחנים לפי הכלל הנורמטיבי המחייב. ### ג. מלכודות למבחן ודגשים מפורשים של המרצה</li></ul><ol><li><strong>מלכודת הסכמת החשוד</strong>: במבחן, קביעה כי \"מאחר והחשוד הסכים לפרסום – הפרסום חוקי\" היא <strong>טעות קשה!</strong> הסכמת החשוד לעולם אינה פוטרת מאישור בית משפט.</li><li><strong>מלכודת סיום המשפט</strong>: במבחן, טענה כי \"האיסור חל רק במהלך החקירה או המשפט, ולאחר מכן מותר לפרסם בחופשיות\" היא <strong>טעות!</strong> האיסור ממשיך לחול גם לאחר סיומו של המשפט.</li><li><strong>מלכודת הטעות בשם החוק</strong>: המרצה ציין בתחילה את חוק המעצרים ותיקן מפורשות לחוק חקירת חשודים. במבחן יש להקפיד לציין: <strong>סעיף 13 לחוק חקירת חשודים</strong>.</li><li><strong>מלכודת המציאות בשטח</strong>: המרצה מזהיר מפורשות: \"אל תרשמו לי הודעות בתחנת המידע שראיתם הקלטה בטלוויזיה... אנחנו לומדים את החוק ואת פסיקת בית המשפט העליון!\".</li></ol></section><section class=\"release-subtopic\"><h3>פגמים בחקירה, אי-הודעה על זכויות ופסילת ראיות</h3><h4>א. ניתוח המבנה הנורמטיבי של דוקטרינת הפסילה הפסיקתית</h4><p>המרצה מפנה לפסק דין יששכרוב (המכונה בפי המרצה בשיעור גם \"ססחררוב / שחררוב / יסחרוב\") שנלמד בתחילת מצגת 4 של דיני מעצרים.</p><p>דוקטרינת הפסילה הפסיקתית מעגנת את התפיסה כי תכלית ההליך הפלילי אינה גילוי האמת בכל מחיר, אלא גילוי האמת תוך שמירה על זכויות היסוד של הנחקר ועל הוגנות ההליך השיפוטי. ### ב. מפת הפגמים בחקירה והשלכותיהם לפי השיעור</p><ol><li><strong>פגם באי-מתן אזהרה על זכות השתיקה</strong>: <em> אי-הודעה לחשוד כי עומדת לו זכות לשמור על שתיקה שוללת ממנו את היכולת להפעיל אוטונומיה רצונית בחקירה. </em> הפגם מפעיל באופן ישיר את עילת הפסילה של הלכת יששכרוב.</li><li><strong>פגם באי-הפסקת עדות עד</strong>: <em> המשכת גביית עדות מעד שהפך לחשוד מנצלת לרעה את \"חובת המענה הנכונה\" המוטלת על עד לפי פקודת העדות כדי לסחוט הודאה. </em> אמרה שנגבתה בנסיבות אלה פגומה וחשופה לפסילה קטגורית.</li><li><strong>פגם במקום החקירה ובתיעוד מחוץ לתחנה (סעיף 3 לחוק חקירת חשודים)</strong>: * יציאה מחוץ לתחנה ללא נימוק של דחיפות/צורך ענייני או ללא תיעוד ההחלטה בכתב בסמוך – מהווים פגמים דיוניים.</li><li><strong>פגם בהיעדר תיעוד חזותי/קולי (הוראות החוק לחוק חקירת חשודים)</strong>:</li><li><strong>פגם בפרסום תיעוד חקירה (סעיף 13 לחוק חקירת חשודים)</strong>: * פרסום הקלטת חקירה בתקשורת ללא רשות בית משפט constitue הפרה פלילית ופגטיבית של סעיף 13. ### ג. מצבים מיוחדים מותרים (שאינם מהווים פגם בחקירה)</li></ol><ul><li><strong>תיעוד סמוי במצלמה מוסתרת</strong>: המרצה מדגיש כי בחוק <strong>אין שום חובה לגלות לחשוד שהחקירה מוקלטת בתיעוד חזותי</strong>. צילום סמוי (בתוך עטיף, עציץ, תמונה או קיר) קביל לחלוטין ואינו מהווה פגם.</li><li><strong>פטור מתיעוד חזותי/קולי בעבירות ביטחון (סעיף 17)</strong>: היעדר צילום בווידאו או אודיו בחקירת עבירת ביטחון אינו פגם, מטעמי ביטחון מידע, ובלבד שמתקיים הפיקוח והבקרה המשטרתית. ### ד. ניתוח פסק דין יששכרוב () במסגרת הסוגיה</li><li><strong>אזכור בשיעור</strong>: המרצה מפנה לפסק דין יששכרוב (המכונה על ידו בשיעור גם \"ססחררוב / יסחרוב / שחררוב\") שנלמד בתחילת מצגת 4 של דיני מעצרים.</li><li><strong>ההלכה כפי שנלמדה בשיעור</strong>: מחדל חקירתי של אי-הודעה לחשוד על זכות השתי
