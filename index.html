קה (או על זכות ההיוועצות) פוגע בזכותו להליך הוגן, ומקים לבית המשפט סמכות לפסול את ההודעה/ההודיה שנגבתה ממנו מכוח דוקטרינת הפסילה הפסיקתית. 3. <em>השאלה המשפטית</em>: מהי נפקותו של פגם בחקירה המתבטא באי-הודעה על זכות השתיקה על קבילות ההודאה. 4. <em>ההלכה שהוצאה</em>: אי-הודעה על זכות השתיקה מקימה סמכות לפסילת הראיה/ההודאה מכוח דוקטרינת הפסילה הפסיקתית. ### ה. מלכודות מבחן ודגשי מרצה</li></ul><ol><li><strong>מלכודת יששכרוב בשיעור חקירות</strong>: במבחן, ברגע שמוצגת חקירה שבה החוקר לא הזהיר את החשוד בדבר זכות השתיקה (או שהמשיך לחקור עד שהודה מבלי לעצור ולהזהיר לפי סעיף 28א) – החובה היא לטעון לפסילת ההודאה לפי הלכת יששכרוב.</li><li><strong>מלכודת הצילום הסמוי</strong>: במבחן, טענת סניגור כי ההודאה מצולמת בווידאו סמוי פסולה כיוון שלא גילו לחשוד – <strong>תידחה על הסף!</strong></li><li><strong>מלכודת סעיף 17 (ביטחון)</strong>: טענת סניגור כי חקירת עבירת ביטחון שדינה 10+ שנות מאסר פסולה כיוון שלא צולמה בווידאו – <strong>תידחה על הסף!</strong></li></ol></section></div>"}};
const TOPICS = [{"group":"🔍 שקיפות ומקורות","items":[{"id":"lesson6-note","tag":"⚠","title":"הערה חשובה על מקורות ואימות התוכן","html":"<h2>מקורות, מיקוד ומה עוד נבדק</h2><p>התוכן מבוסס על מחברת הקורס בלבד. בוצעה ביקורת ממוקדת ותוקנו הממצאים המתועדים כאן; <b>אין הצהרה שכל ההקלטות וכל ההלכות אומתו במלואן.</b></p><ul><li>שיעור 7: התיישנות עבירות מין בקטינים וטבלת הארכת התקופה הנוספת הוצאו מהחומר. התקופה הנוספת הבסיסית עצמה לא הוצאה.</li><li>שיעור 8: סיום המשפט, ענישה וערעור. חומר המעצרים אינו מיוחס עוד להקלטה זו.</li><li>תוקנו קנזי, מורוזובה, סעיף 23(ב) ושאלת תאריך ההתיישנות.</li><li>סיכומי פסיקה שטרם אומתו מסומנים כך. אין להסיק מהיעדר עדכון במחברת שהלכה תקפה כיום.</li></ul><p>צ׳אט המחברת מסייע באיתור, אך אינו תחליף למקור: נמצאה בו גם טעות בזיהוי דעת הרוב במורוזובה.</p><p><b>מצגת 4 — שקפים 1–35:</b> נבדקו מול האתר. הנושאים המהותיים שנבדקו (הלכת יששכרוב ופסילת ראיות, חיפוש בהסכמה, סעיפים 5–6 ו־66–74 לחסד״פ, מעצר/עיכוב ומועדי סעיף 61) כבר מכוסים; לא נמצא פער המחייב תיקון.</p><p><b>מצגת 4 — שקפים 36–70:</b> נבדקו מול האתר. הנושאים המהותיים שנבדקו (סמכויות מעצר ועיכוב לפי סעיפים 23–37, הבאה בפני שופט, זכויות העצור, חלופות, מועדי 24/48 שעות, סעיפי 59–62 והארכות מעצר) כבר מכוסים; לא נמצא פער המחייב תיקון.</p><p><b>מצגת 4 — שקפים 71–100:</b> נבדקו מול האתר. הנושאים המהותיים שנבדקו (מעצר עד תום ההליכים לפי סעיף 21, ראיות לכאורה, עילות מעצר, חלופות, חזקות, מועדי 30 יום/9 חודשים והארכות 90/150 ימים) כבר מכוסים; לא נמצא פער המחייב תיקון.</p>","lesson":"info","status":"ממצאי ביקורת מתועדים","source":"שיעור 7 ערוך.mp3 — דברי המרצה בתחילת הדיון בהתיישנות; שיעור8 ערוך.mp3 — דיון בסיום המשפט ובערעור","lessons":["info"]}]},{"group":"עקרונות יסוד (חוצה־שלבים)","items":[{"id":"circles","tag":"1","title":"שלושת המעגלים של התיק הפלילי (נלמד בשיעור 1)","html":"\n      <div class=\"eyebrow\">יסודות</div>\n      <h2>שלושת המעגלים המרכיבים את התיק הפלילי</h2>\n      <ul>\n        <li><b>דיני העונשין (הדין המהותי)</b> — מה מותר/אסור והעונש בצידו. יסוד עובדתי + יסוד נפשי, מעבר לספק סביר.</li>\n        <li><b>דיני הראיות (הדין הקדם־דיוני)</b> — קבילות (למשל פוליגרף אינו קביל) ומשקל (כגון שרשרת המוצג).</li>\n        <li><b>סדרי הדין (הדין הפרוצדורלי)</b> — כללי המעצר, החיפוש וניהול הדיונים.</li>\n      </ul>\n      <p><b>רף ההוכחה:</b> אזרחי — מאזן הסתברויות (50% ומעלה, הלכה מפורשת). פלילי — מעבר לספק סביר, ללא מספר מוגדר בפסיקה.</p>\n      <div class=\"callout case-callout\"><span class=\"callout-title\">קשור לפסק דין</span><button class=\"case-link\" data-case=\"0\">⚖ סילוסטר נגד היועץ המשפטי לממשלה (1948)</button></div>\n      <button class=\"expand-link\" data-topic=\"circles\">🔎 קריאה מורחבת — כל דברי המרצה, דוגמאות וסיפור מהשטח</button>\n    ","lesson":"1","status":"אומת מול הקלטת שיעור 1","lessons":["1"],"source":"שיעור 1.mp3 — דברי המרצה"},{"id":"adversarial","tag":"2","title":"אדברסרית מול אינקוויזיטורית (נלמד בשיעור 1)","html":"<div class=\"eyebrow\">שיעור 1</div><h2>השיטה האדברסרית — מודל והסתייגות</h2><p>המרצה הציג את השיטה האדברסרית כשיטה שבה הצדדים מנהלים את הבאת הראיות והטיעון, והשופט מכריע. הוא הדגיש שאין מדינה הפועלת לפי מודל טהור לחלוטין: בישראל השיטה בעיקרה אדברסרית, לצד חריגים.</p><p>החריג שנלמד הוא סעיף 167, המאפשר לבית המשפט להביא ראיה מיוזמתו לאחר שהצדדים סיימו את ראיותיהם, במקרים המתאימים.</p>","lesson":"1","status":"אומת מול הקלטת שיעור 1","lessons":["1"],"source":"שיעור 1.mp3 — דברי המרצה"},{"id":"packer","tag":"3","title":"שני המודלים של הרברט פקר (נלמד בשיעור 1)","html":"\n      <div class=\"eyebrow\">תיאוריה</div>\n      <h2>שני מודלים למשפט הפלילי — הרברט פקר</h2>\n      <ul>\n        <li><b>מיגור הפשיעה</b> — המטרה מקדשת את האמצעים.</li>\n        <li><b>ההליך הראוי</b> — זכויות הנאשם עליונות.</li>\n      </ul>\n      <p>בארה\"ב: פירות העץ המורעל (פסילה אוטומטית). בישראל (הלכת יששכרוב): <b>פסילה פסיקתית יחסית</b> — שיקול דעת לפי איזון אינטרסים.</p>\n      <div class=\"callout case-callout\"><span class=\"callout-title\">קשור לפסקי דין</span><button class=\"case-link\" data-case=\"25\">⚖ יששכרוב</button> <button class=\"case-link\" data-case=\"2\">⚖ בן חיים</button></div>\n      <button class=\"expand-link\" data-topic=\"packer\">🔎 קריאה מורחבת</button>\n    ","lesson":"1","status":"אומת מול הקלטת שיעור 1","lessons":["1"],"source":"שיעור 1.mp3 — דברי המרצה"},{"id":"sec184","tag":"4","title":"סעיף 184 — הרשעה בעבירה שהתגלתה (נלמד בשיעור 1)","html":"<div class=\"eyebrow\">חסד״פ</div><h2>סעיף 184 לחסד״פ והלכת דמיאניוק</h2><p>הסעיף מאפשר להרשיע בעבירה שאשמתו בה נתגלתה מן העובדות שהוכחו, אף אם היא שונה מן העבירה שבכתב האישום. לפי ההסבר בשיעור 1, נדרשים <b>שני תנאים מצטברים</b>: ניתנה לנאשם הזדמנות סבירה להתגונן מפני העבירה האחרת; ולא יוטל עליו בשל אותה עבירה עונש חמור מזה שהיה אפשר להטיל בשל העבירה המקורית.</p><div class=\"callout warn\"><span class=\"callout-title\">יישום בדמיאניוק</span><p>העובדה שהוכחה עבירה אחרת אינה מספיקה. המרצה הסביר כי דמיאניוק התגונן לאורך המשפט מפני האישום המסוים שיוחס לו, ולא מפני האישום החלופי; לכן לא הייתה לו הזדמנות סבירה להתגונן מפניו.</p></div><div class=\"callout case-callout\"><span class=\"callout-title\">קשור לפסק דין</span><button class=\"case-link\" data-case=\"3\">⚖ דמיאניוק נגד מדינת ישראל (1988)</button></div>","lesson":"1","status":"אומת מול הקלטת שיעור 1","lessons":["1"],"source":"שיעור 1.mp3 — הדיון בסעיף 184 ובהלכת דמיאניוק"},{"id":"classify","tag":"5","title":"סיווג עבירות — סעיף 24 (נלמד בשיעור 1)","html":"\n      <div class=\"eyebrow\">חובה לבחינה</div>\n      <h2>סיווג העבירות — סעיף 24 לחוק העונשין</h2>\n      <ul>\n        <li><b>חטא</b> — עד 3 חודשים מאסר, או קנס.</li>\n        <li><b>עוון</b> — מעל 3 חודשים ועד 3 שנים (כולל).</li>\n        <li><b>פשע</b> — מעל 3 שנים.</li>\n      </ul>\n      <p><b>מלכודת:</b> בדיוק 3 שנים = עוון. סעיף 42: אין תקופה קצובה = שנה אחת = עוון אוטומטית.</p>\n      <button class=\"expand-link\" data-topic=\"classify\">🔎 קריאה מורחבת</button>\n    ","lesson":"1","status":"אומת מול הקלטת שיעור 1","lessons":["1"],"source":"שיעור 1.mp3 — דברי המרצה"},{"id":"sec59","tag":"6","title":"תחילת ההליך הפלילי — סעיף 59 (נלמד בשיעור 1)","html":"\n      <div class=\"eyebrow\">חסד\"פ</div>\n      <h2>תחילת ההליך הפלילי — סעיף 59 לחסד\"פ</h2>\n      <p>נפתח כשנודע למשטרה על עבירה. חובה מוחלטת לרשום כל תלונה.</p>\n      <ul>\n        <li><b>פשע</b> — חובת חקירה מוחלטת. חריג: הלכת צדוק (תלונה מופרכת).</li>\n        <li><b>חטא/עוון</b> — קצין פקד+ רשאי שלא לחקור, משיקולי מדיניות או רשות אחרת מוסמכת.</li>\n      </ul>\n      <div class=\"callout case-callout\"><span class=\"callout-title\">קשור לפסק דין</span><button class=\"case-link\" data-case=\"4\">⚖ צדוק נגד ראש אגף חקירות ומודיעין (2007)</button></div>\n      <button class=\"expand-link\" data-topic=\"sec59\">🔎 קריאה מורחבת</button>\n    ","lesson":"1","status":"אומת מול הקלטת שיעור 1","lessons":["1"],"source":"שיעור 1.mp3 — הדיון בסעיף 59 ובדוגמת גניבה ממעסיק"}]},{"group":"שלב 1: חקירה והחלטת התביעה","items":[{"id":"investigation-law","tag":"חדש","title":"דיני חקירה","html":"<div class=\"eyebrow\">Release 1</div><div class=\"release-layer\"><h2>תקציר הנושא</h2><div class=\"callout case-callout\"><span class=\"callout-title\">קשור לפסק דין</span><button class=\"case-link\" data-case=\"55\">⚖ הוועד הציבורי נגד עינויים בישראל נגד ממשלת ישראל</button></div><section class=\"release-subtopic\"><h3>המסגרת הנורמטיבית של דיני חקירה וההבחנה בין חקירת עד לחקירת חשוד</h3><ul><li><strong>הכלל המרכזי</strong>: דיני החיקוק והפסיקה קובעים הבחנה קשיחה בין <strong>\"חקירת עד\"</strong> (גביית עדות/הודעה מאדם שאינו חשוד בביצוע העבירה) לבין <strong>\"חקירת חשוד\"</strong> (חקירת אדם החשוד בביצוע עבירה פלילית).</li><li><strong>התנאים המרכזיים לגביית עדות מעד</strong>: 1. קצין משטרה המוסמך לכך רשאי לחקור כל אדם המכיר את עובדות העבירה ונסיבותיה (סעיף 2 לפקודת העדות). 2. העד כפוף ל<strong>חובת מענה נכונה</strong> על כל השאלות שמוצגות לו. 3. ההודעה נרשמת בכתב, נקראת באוזני העד, והעד נדרש לחתום עליה (הוראות החוק לפקודת העדות).</li><li><strong>החריג המרכזי לחובת המענה של עד</strong>: <strong>החיסיון מפני הפללה עצמית</strong> – העד פטור מלהשיב על שאלות שהתשובה עליהן עשויה להעמידו בסיכון של אישום פלילי (סעיף 2 לפקודת העדות / סעיף 47 לפקודת הראיות).</li><li><strong>זכות / חובה / סמכות קריטית (מעבר מעד לחשוד)</strong>: <em> לחשוד נתונה <strong>זכות שתיקה מלאה</strong> (זכות שלא להשיב לשאלות כלל ולא להיחקר כעד). </em> ברגע שמהלך גביית עדות מעד עולה חשד שהוא ביצע עבירה פלילית – <strong>חובה מוחלטת על החוקר להפסיק מיד את גביית העדות</strong>, להודיע לנחקר כי הפך לחשוד, ולהזהירו מפורשות בדבר זכות השתיקה העומדת לו.</li><li><strong>מועד חשוב</strong>: הפסקת גביית העדות ומתן האזהרה חייבות להתבצע <strong>אופן מיידי ובסמוך ממש</strong> לרגע שבו עולה החשד לביצוע עבירה בידי העד.</li><li><strong>הבחנה טרמינולוגית מרכזית</strong>: <em> <strong>הודעה</strong> (ב-א'): הדיבור/העדות שמוסר עד או מתלונן במשטרה. </em> <strong>חקירה / חקירת חשוד</strong>: חקירה פרונטלית המנוהלת נגד אדם החשוד בביצוע עבירה. * <strong>הודיה</strong> (ב-י'): הודאה של חשוד/נאשם בביצוע העבירה המיוחסת לו.</li><li><strong>נקודת מבחן מרכזית</strong>: מחדל משטרתי של אי-הפסקת עדות עד והיעדר אזהרה בדבר זכות השתיקה בעת המעבר מעד לחשוד מביא לפגם חמור בחקירה, העשוי להוביל לפסילת ההודעה/ההודיה בבית המשפט (דוקטרינת הפסילה הפסיקתית - הלכת יששכרוב).</li></ul></section><section class=\"release-subtopic\"><h3>חקירת עד במשטרה, חובת המענה וחריג החיסיון מפני הפללה עצמית</h3><ul><li><strong>הכלל המרכזי</strong>: קצין משטרה המוסמך לכך רשאי לחקור כל אדם המכיר את עובדות העבירה ונסיבותיה, והעד הנחקר כפוף ל<strong>חובת מענה נכונה</strong> על כל השאלות המוצגות לו.</li><li><strong>התנאים המרכזיים לגביית עדות מעד</strong>: 1. קיומה של חקירה פלילית לגבי עבירה שנצברה לגביה סמכות חקירה לקצין משטרה מוסמך. 2. רישום ההודעה בכתב, הקראתה באוזני העד (או מסירתה לקריאה עצמית), וחתימת העד על גבי המסמך.</li><li><strong>החריג המרכזי לחובת המענה</strong>: <strong>החיסיון מפני הפללה עצמית</strong> – העד אינו חייב להשיב על שאלות שהתשובה עליהן עשויה להעמידו בסיכון של אישום פלילי.</li><li><strong>זכות / חובה / סמכות קריטית</strong>: <em> <strong>סמכות וחובת רישום סירוב (סעיף 3 לפקודת העדות)</strong>: סירב העד לחתום על ההודעה, קצין המשטרה מוסמך וחייב לרשום את דבר הסירוב ואת סיבתו, ולחתום בעצמו על ההודעה. </em> <strong>חובת הפסקת עדות</strong>: ברגע שמתעורר חשד שהעד ביצע עבירה פלילית, קמה <strong>חובה חקירתית מוחלטת</strong> להפסיק מיד את גביית העדות, להודיע לו כי הפך לחשוד, ולהזהירו בדבר זכות השתיקה.</li><li><strong>מועד חשוב</strong>: הפסקת גביית העדות ומתן האזהרה חייבות להתבצע <strong>אופן מיידי ובסמוך ממש</strong> לרגע שבו עולה החשד לביצוע עבירה בידי העד.</li><li><strong>הבחנה מרכזית</strong>: <em> <strong>\"הודעה\"</strong> (ב-א'): הדיבור/העדות שמודפסת ונמסרת מפי עד או מתלונן במשטרה. </em> <strong>\"הודיה\"</strong> (ב-י'): הודאה של חשוד בביצוע עבירה פלילית. * <strong>חובת מענה (עד)</strong> מול <strong>זכות שתיקה (חשוד)</strong>: לעד אין זכות שתיקה גורפת אלא רק חיסיון נקודתי מפני הפללה עצמית, בעוד לחשוד נתונה זכות שתיקה מלאה.</li><li><strong>נקודת מבחן מרכזית</strong>: מחדל משטרתי בהפסקת עדות עד ואי-אזהרתו כחשוד בדבר זכות השתיקה יוצרים פגם חמור בחקירה, אשר עשוי להוביל לפסילת הודעתו/הודאתו בבית המשפט מכוח דוקטרינת הפסילה הפסיקתית (הלכת יששכרוב).</li></ul></section><section class=\"release-subtopic\"><h3>מעבר מעד לחשוד, חובת הפסקת העדות ומתן אזהרה</h3><ul><li><strong>הכלל המרכזי</strong>: אם במהלך גביית עדות מעד (או קבלת תלונה ממתלונן) מתעורר חשד כי העד עצמו ביצע את העבירה נשוא החקירה (או עבירה נלווית), חייב החוקר <strong>להפסיק מיד את גביית העדות</strong>, להודיע לנחקר כי הפך לחשוד, ולהזהירו מפורשות בדבר זכות השתיקה העומדת לו.</li><li><strong>התנאים המרכזיים</strong>: 1. התנהלות הליך של גביית עדות/הודעה מעד או ממתלונן במשטרה. 2. התעוררות חשד לביצוע עבירה פלילית בידי העד תוך כדי מסירת דבריו.</li><li><strong>החריג המרכזי</strong>: כל עוד לא התעורר חשד פלילי נגד העד, גביית העדות נמשכת כסדרה והעד כפוף לחובת מענה נכונה על שאלות החוקר (בכפוף לחיסיון הנקודתי מפני הפללה עצמית).</li><li><strong>זכות / חובה / סמכות חשובה</strong>: <em> <strong>חובת החוקר</strong>: חובה מוחלטת לעצור את גביית העדות מיד, להודיע לנחקר על סיווגו כחשוד, ולמסור לו את נוסח האזהרה הרשמי. </em> <strong>זכות הנחקר</strong>: מעבר מיידי ממעמד עד לזכות שתיקה מלאה/גורפת כחשוד (זכותו שלא להשיב על שאלות כלל ושלא להיחקר עוד כעד).</li><li><strong>מועד חשוב</strong>: הפסקת העדות ומתן האזהרה חייבים להתבצע <strong>באופן מיידי ובסמוך ממש</strong> לרגע שבו עולה החשד לביצוע העבירה בדברי העד.</li><li><strong>הבחנה מרכזית</strong>: מעבר מהמנגנון של \"חובת מענה נכונה\" (החלה על עד לפי פקודת העדות) למנגנון של \"זכות שתיקה מלאה\" (העומדת לחשוד לפי חוק המעצרים).</li><li><strong>נקודת מבחן מרכזית</strong>: מחדל משטרתי בהפסקת העדות ואי-מתן אזהרה בדבר זכות השתיקה מהווים פגם חמור בחקירה, העשוי להוביל לפסילת הודעת/הודאת הנחקר בבית המשפט מכוח הלכת יששכרוב (פסילת ראיות שהושגו שלא כדין).</li></ul></section><section class=\"release-subtopic\"><h3>שפת חקירת החשוד</h3><ul><li><strong>התנאים המרכזיים</strong>:</li><li><strong>החריג המרכזי וכללי התיעוד המיוחדים</strong>:</li><li><strong>זכות / חובה / סמכות חשובה</strong>: * <strong>חובת החוקר</strong>: להבטיח חוקר/מתורגמן הדובר את שפת החשוד ולתעד את החקירה בהתאם לכללי השפה והתיעוד בחוק.</li></ul></section><section class=\"release-subtopic\"><h3>מקום חקירת החשוד ושני החריגים לחקירה מחוץ לתחנה</h3><ul><li><strong>הכלל המרכזי</strong>: חקירת חשוד חייבת להתנהל ככלל בתוך <strong>תחנת המשטרה</strong> (<strong>סעיף 3 לחוק סדר הדין הפלילי (חקירת חשודים), התשס\"ב-2002</strong>).</li><li><strong>התנאים המרכזיים לניהול החקירה בתחנה</strong>: * ביצוע החקירה הפרונטלית במתקן משטרתי מוסדר ומבוקר השומר על הגינות החקירה וזכויות החשוד.</li><li><strong>שני החריגים המרכזיים (המתירים חקירת חשוד מחוץ לתחנת המשטרה)</strong>: 1. <strong>חריג א' (דחיפות / אי-אפשרות - סמכות שוטר)</strong>: השוטר סבור שלא ניתן לנהל את החקירה בתחנה או שיש צורך ענייני לנהלה בדחיפות מחוץ לתחנה (כגון הצלת חיי חטופה/אדם המצוי בסכנה מיידית בשטח). 2. <strong>חריג ב' (צורך ענייני - סמכות קצין ממונה)</strong>: הקצין הממונה סבור שיש צורך ענייני בחקירת החשוד מחוץ לתחנה (כגון שחזור עבירה בשטח או השפעת זירת העבירה על החשוד).</li><li><strong>זכות / חובה / סמכות חשובה</strong>: <em> <strong>חובת תיעוד ההחלטה בכתב</strong>: החלטה על ניהול חקירת חשוד מחוץ לתחנה חייבת להתועד בכתב בסמוך ככל הניתן לאחר קבלתה. </em> <strong>פרוצדורת אישור החקירה בתחנה (בעבירות חמורות - 10 שנות מאסר ומעלה)</strong>: אם נחקר חשוד מחוץ לתחנה בעבירה שדינה 10 שנות מאסר ומעלה, חובה להציג בפניו את תיעוד החקירה בתחנה בהקדם האפשרי ולבקש ממנו לאשרו; הליך אישור זה יתועד בתיעוד חזותי או קולי.</li><li><strong>מועד חשוב</strong>: תיעוד ההחלטה בכתב חייב להתבצע בסמוך ככל הניתן לאחר קבלתה; הצגת התיעוד והאישור בתחנה יבוצעו בהקדם האפשרי.</li><li><strong>הבחנה מרכזית</strong>: הבחנה בין חקירה שוטפת ושגרתית בתחנה (הכלל) לבין חקירה בדחיפות בשטח או מטעמים ענייניים (החריגים).</li><li><strong>נקודת מבחן מרכזית</strong>: חקירת חשוד מחוץ לתחנת המשטרה ללא התקיימות אחד משני החריגים בחוק (דחיפות/אי-אפשרות או אישור קצין ממונה לצורך ענייני), או ללא תיעוד ההחלטה בכתב בסמוך לאחר קבלתה – מהווה פגם חקירתי.</li></ul></section><section class=\"release-subtopic\"><h3>אופני תיעוד חקירת חשוד (חזותי, קולי, בכתב) וכללי הרישום</h3><ul><li><strong>הכלל המרכזי</strong>: בחוק סדר הדין הפלילי (חקירת חשודים), התשס\"ב-2002, קיימות <strong>שלוש חלופות קבועות לתיעוד חקירת חשוד</strong>: תיעוד חזותי (וידאו וקול), תיעוד קולי (סאונד בלבד), ותיעוד בכתב.</li><li><strong>התנאים המרכזיים לכל חלופת תיעוד</strong>: 1. <strong>תיעוד חזותי / קולי</strong>: חייב להקיף את <strong>כל מהלכה של החקירה</strong>, ולכלול את חילופי הדברים בין החוקר לחשוד. בתיעוד חזותי – לרבות תגובות ותנועות גוף. 2. <strong>תיעוד בכתב</strong>: יכלול את עיקרי חילופי הדברים ותגובות/תנועות גוף המהוות תחליף לחילופי דברים, בדרך שתשקף נכונה את המתרחש. התיעוד בכתב ייערך <strong>בו-זמנית</strong> עם החקירה או בסמוך לה ככל האפשר.</li><li><strong>החריג המרכזי וכללי הרישום בפרקטיקה (\"הערת חוקר\")</strong>: * בתיעוד בכתב, כאשר אין צילום חזותי, חובה לתעד תופעות פיזיות ורגשיות של החשוד באמצעות שילוב מנגנון <strong>\"הערת חוקר\"</strong> בגוף הפרוטוקול (כגון: \"החשוד בוכה\", \"החשוד מזיע בצורה אובססיבית\").</li><li><strong>זכות / חובה / סמכות חשובה</strong>: * <strong>סמכות תיעוד סמוי (הקלטה/צילום מוסתר)</strong>: בחוק <strong>אין שום חובה לספר לחשוד שהחקירה מוקלטת בתיעוד חזותי!</strong> המשטרה מוסמכת לבצע תיעוד חזותי סמוי (מצלמה מוסתרת בעט, בתמונה, בקיר, בעציץ וכיו\"ב).</li><li><strong>מועד חשוב</strong>: התיעוד בכתב חייב להירשם <strong>בו-זמנית</strong> עם חקירת החשוד או בסמוך לה ככל האפשר.</li><li><strong>הבחנה מרכזית</strong>: * <strong>הדין בחוק מול הפרקטיקה המשטרתית</strong>: בחוק, לגבי עבירות חמורות (10 שנות מאסר ומעלה) נדרש תיעוד חזותי ואין דרישה בחוק לתיעוד בכתב במקביל; אולם <strong>בפרקטיקה המשטרתית מבוצע תמיד תיעוד בכתב במקביל לתיעוד החזותי/הקולי!</strong></li><li><strong>נקודת מבחן מרכזית</strong>: רישום חלק יחסי או חסר בתיעוד בכתב, הימנעות מתיעוד תגובות פיזיות (\"הערות חוקר\") כשאין צילום חזותי, או טענה מוטעית כאילו חובה לגלות לחשוד על צילום סמוי – מהווים נקודות כשל מרכזיות במבחן.</li></ul></section><section class=\"release-subtopic\"><h3>חובת תיעוד חזותי בחקירת עבירות חמורות (10 שנות מאסר ומעלה)</h3><ul><li><strong>הכלל המרכזי</strong>: חקירת חשוד בעבירה פלילית שדינה <strong>10 שנות מאסר או יותר</strong> (עד עונש מוות/מאסר עולם) <strong>חייבת להתועד בתיעוד חזותי</strong> (צילום וידאו וקול במקביל).</li><li><strong>המקור הנורמטיבי</strong>: <strong>חוק סדר הדין הפלילי (חקירת חשודים), התשס\"ב-2002</strong>, הוראות החוק.</li><li><strong>התנאים המרכזיים</strong>: 1. הנחקר הוא <strong>חשוד</strong> בביצוע עבירה פלילית (להבדיל מעד). 2. העבירה הנחקרת היא <strong>עבירה חמורה</strong> אשר העונש הקבוע לצדה בחוק הוא 10 שנות מאסר או יותר (כגון רצח, אונס, שוד חמור). 3. התיעוד החזותי מקיף את כל מהלכה של החקירה וכולל חילופי דברים, תגובות ותנועות גוף.</li><li><strong>שלושת החריגים המרכזיים לכלל</strong>: 1. <strong>תקלה טכנית / צורך ענייני</strong>: אם אירעה תקלה טכנית במכשירי ההקלטה או שהתעורר צורך ענייני, רשאי <strong>קצין ממונה</strong> להורות על מעבר לתיעוד קולי (אודיו) או לתיעוד בכתב. ברגע שחדלו הנסיבות המונעות – חובה לחזור לתיעוד חזותי. 2. <strong>סייג עבירת ביטחון (סעיף 17)</strong>: חובת התיעוד החזותי/הקולי <strong>אינה חלה</strong> בחקירת חשוד בעבירת ביטחון (מטעמי ביטחון מידע), ובלבד שמונה במשטרה גורם המבצע פיקוח ובקרה שוטפים. 3. <strong>חקירה מחוץ לתחנה ונוהל אישורה בתחנה</strong>: נחקר חשוד מחוץ לתחנה בעבירה של 10 שנות מאסר ומעלה, חובה להציג בפניו את התיעוד בתחנה בהקדם האפשרי ולבקש ממנו לאשרו; הליך הצגת התיעוד והאישור יתועד בתיעוד חזותי או קולי (קצין ממונה רשאי לדחות את הצגת התיעוד מטעמים מיוחדים שיירשמו).</li><li><strong>זכות / חובה / סמכות קריטית (סמכות תיעוד סמוי)</strong>: <em> בחוק <strong>אין שום חובה לגלות לחשוד שהחקירה מצולמת או מוקלטת!</strong>. </em> המשטרה מוסמכת לבצע תיעוד חזותי סמוי (מצלמה מוסתרת בעט, בתמונה, בקיר, בתוך הטיח, בעציץ וכדומה).</li><li><strong>הבחנה מרכזית (הדין בחוק מול הפרקטיקה המשטרתית)</strong>: <em> <strong>בחוק היבש</strong>: נדרש תיעוד חזותי בלבד, ואין חובה בחוק לתעד בכתב במקביל בעבירות אלה. </em> <strong>בפרקטיקה המשטרתית</strong>: מבוצע תמיד <strong>תיעוד משולב</strong> – המשטרה מפעילה תיעוד חזותי ובמקביל החוקר יושב ורושם בכתב פרוטוקול מלא מילה במילה.</li><li><strong>נקודת מבחן מרכזית</strong>: חקירת חשוד בעבירה שדינה 10 שנות מאסר ומעלה בתיעוד בכתב בלבד, ללא אישור קצין ממונה עקב תקלה טכנית/צורך ענייני מתועדים, מהווה פגם חקירתי חמור המעמיד בסכנה את קבילות ההודאה בבית המשפט.</li></ul></section><section class=\"release-subtopic\"><h3>חובת תיעוד חזותי/קולי בנסיבות מיוחדות (שחזור עבירה, שפת הסימנים, מוגבלות ואי-ידיעת קרוא וכתוב)</h3><ul><li><strong>הכלל המרכזי</strong>: <strong>חוק סדר הדין הפלילי (חקירת חשודים), התשס\"ב-2002</strong> קובע קטגוריות מיוחדות של חקירות ונסיבות שבהן קיימת <strong>חובה מוחלטת</strong> לתיעוד <strong>חזותי בלבד</strong> (וידאו + קול) או לתיעוד <strong>חזותי או קולי</strong> (אודיו).</li><li><strong>שלושת המצבים של חובת תיעוד חזותי בלבד (וידאו)</strong>: 1. <strong>עבירות חמורות</strong>: חקירת חשוד בעבירה שדינה 10 שנות מאסר ומעלה. 2. <strong>שחזור עבירה בשטח</strong>: שחזור עבירה המבוצע בידי חשוד מחוץ לתחנה. 3. <strong>חקירה בשפת הסימנים</strong>: אם החקירה התנהלה בשפת הסימנים, היא תתועד בתיעוד חזותי בלבד.</li><li><strong>שני המצבים של חובת תיעוד חזותי או קולי (אודיו/וידאו)</strong>: 1. <strong>אי-ידיעת קרוא וכתוב או מוגבלות</strong>: חשוד שקיים לגביו חשד אינו יודע קרוא וכתוב (בכל שפה) או אדם עם מוגבלות המקשה עליו לאשר את נכונות התיעוד בכתב. 2. <strong>הליך אישור חקירה מחוץ לתחנה (בעבירות חמורות)</strong>: הצגת התיעוד והליך אישורו בתחנה בפני חשוד שנחקר מחוץ לתחנה בעבירה שדינה 10 שנות מאסר ומעלה.</li><li><strong>זכות / חובה / סמכות חשובה</strong>: * <strong>זכות החשוד המוגבל/האנאלפבית</strong>: הגנה מפני החתמתו על פרוטוקול בכתב שאינו מסוגל לקרוא או לאשר.</li><li><strong>מועד חשוב</strong>: הצגת התיעוד והליך אישורו בתחנה (בעבירות של 10+ שנות מאסר שנחקרו מחוץ לתחנה) יבוצעו <strong>בהקדם האפשרי</strong> מיום ההגעה לתחנה.</li><li><strong>הבחנה מרכזית</strong>: הבחנה בין מצבים המחייבים <strong>תיעוד חזותי בלבד</strong> (שחזור, שפת סימנים, עבירות 10+ שנים) לבין מצבים שבהם קיימת גמישות לביצוע <strong>תיעוד חזותי או קולי</strong> (אנאלפבית, מוגבלות, אישור חקירה מחוץ לתחנה).</li></ul></section><section class=\"release-subtopic\"><h3>הסייג לחובת תיעוד חזותי/קולי בעבירות ביטחון</h3><ul><li><strong>הכלל המרכזי</strong>: <strong>סעיף 17 לחוק סדר הדין הפלילי (חקירת חשודים), התשס\"ב-2002</strong>, קובע סייג ופטור מפורש מחובת התיעוד החזותי (וידאו) או הקולי (אודיו) בחקירת חשוד בעבירת ביטחון.</li><li><strong>התנאים המרכזיים</strong>: 1. הנחקר הוא <strong>חשוד</strong> בביצוע <strong>עבירת ביטחון</strong>. 2. במשטרה מונה גורם ייעודי המבצע פיקוח ובקרה שוטפים על חקירות אלה.</li><li><strong>החריג המרכזי והיקף הפטור</strong>: הפטור מתיעוד חזותי או קולי חל <strong>גם אם העבירה הביטחונית היא עבירה חמורה שדינה 10 שנות מאסר ומעלה</strong> (שככלל מחייבת תיעוד חזותי לפי סעיף 7 / סעיף א' בטבלה), וגם אם החקירה נערכה מחוץ לתחנת המשטרה (סעיף 10 / סעיף ה' בטבלה).</li><li><strong>חובה / מנגנון פיקוח ותיעוד</strong>: <em> מתן הפטור מותנה בכך שמונה במשטרה גורם שיערוך פיקוח ובקרה שוטפים על החקירות הביטחוניות. </em> התיעוד בכתב (פרוטוקול) נותר חובה, אך נשמר תחת סיווג של <strong>\"חומר סודי ביותר\"</strong>.</li><li><strong>הרציונל המשפטי</strong>: הגנה על <strong>ביטחון מידע</strong> ומניעת סיכון חיי אדם. בחקירות ביטחוניות נחשפים פרטים רגישים (כגון שיטות חדירה, פרצות בגדרות בסיסים, ושיטות איסוף מודיעין). דליפה של תיעוד חזותי או קולי מתוך החדר עלולה לסכן חיי אדם ואינטרסים ביטחוניים קריטיים.</li><li><strong>הבחנה מרכזית</strong>: הבחנה בין עבירה פלילית רגילה חמורה (המחייבת תיעוד חזותי קטגורי בשילוב תמונה וקול) לבין עבירת ביטחון חמורה (הפטורה מתיעוד חזותי/קולי מטעמי ביטחון מידע).</li><li><strong>נקודת מבחן מרכזית</strong>: היעדר תיעוד חזותי או קולי בחקירת חשוד בעבירת ביטחון (אפילו בעבירה שדינה מאסר עולם) <strong>אינו מהווה פגם חקירתי</strong>, ובלבד שמתקיים מנגנון הפיקוח והבקרה השוטף במשטרה.</li></ul></section><section class=\"release-subtopic\"><h3>איסור פרסום תיעוד חזותי או קולי של חקירה וארבעת עקרונותיו</h3><ul><li><strong>הכלל המרכזי</strong>: קיימים איסור מוחלט וסייג קשיח על פרסום תיעוד חזותי (וידאו) או קולי (אודיו) של חקירה פלילית שבוצעה בידי גוף חוקר, אלא אם כן ניתן היתר/רשות מפורשת מבית המשפט (<strong>סעיף 13 לחוק סדר הדין הפלילי (חקירת חשודים), התשס\"ב-2002</strong>).</li><li><strong>התנאים המרכזיים לפרסום</strong>: פנייה מוקדמת לבית המשפט לקבלת רשות מפורשת בטרם ביצוע הפרסום ברבים.</li><li><strong>החריג המרכזי (אי-קיומו של חריג עצמאי)</strong>: <strong>אין שום חריג המאפשר פרסום עצמאי!</strong> אפילו הסכמה מפורשת בכתב של החשוד/הנחקר אינה מהווה חריג ואינה מתירה את הפרסום ללא אישור שיפוטי.</li><li><strong>זכות / חובה / סמכות חשובה</strong>: <em> <strong>זכות הנחקר</strong>: הגנה חוקתית על כבודו, שמו הטוב ופרטיותו בעת חקירתו בחדר החקירות. </em> <strong>סמכות בית המשפט</strong>: סמכות בלעדית להתיר או לאסור את הפרסום לאחר איזון בין טוהר ההליך השיפוטי להגנת הפרטיות.</li><li><strong>מועד חשוב ותחולה בזמן</strong>: איסור הפרסום חל בכל שלבי ההליך הפלילי – <strong>בשלב החקירה, במהלך ניהול המשפט, ואף לאחר שהמשפט הסתיים לחלוטין!</strong></li><li><strong>הבחנה מרכזית (הדין בחוק ובפסיקה מול הפרקטיקה בשטח)</strong>: <em> <strong>לפי החוק והפסיקה</strong>: נקבע איסור פרסום קשיח וקטגורי ללא רשות שופט. </em> <strong>לפי הפרקטיקה בשטח</strong>: קיימות הדלפות רבות של הקלטות חקירה ע\"י גורמי משטרה, תביעה ותקשורת. המרצה מדגיש כי למבחן האקדמי נדרשים אך ורק לכלל המשפטי המחייב ולא להפרות בשטח.</li><li><strong>נקודת מבחן מרכזית</strong>: פרסום הקלטת חקירה על יסוד הסכמת החשוד בלבד, ללא רשות בית משפט, מהווה הפרה של סעיף 13 לחוק חקירת חשודים; והתנגדות הנחקר לפרסום מהווה \"שיקול נכבד ביותר\" עבור בית המשפט שלא להתיר את הפרסום.</li></ul></section><section class=\"release-subtopic\"><h3>פגמים בחקירה, אי-הודעה על זכויות ופסילת ראיות</h3><ul><li><strong>הכלל המרכזי</strong>: חקירה פלילית המתנהלת תוך הפרת זכויות יסוד פרוצדורליות של הנחקר – ובראשן אי-הודעה לחשוד על <strong>זכות השתיקה</strong>, הימנעות מהפסקת עדות מעד שהפך לחשוד, או הפרת כללי השפה, המקום והתיעוד בחוק – מהווה חקירה פגומה.</li><li><strong>תוצאת הפגם (דוקטרינת הפסילה הפסיקתית)</strong>: מחדל חקירתי של אי-הודעה על זכות השתיקה (או אי-מתן אזהרה בעת מעבר מעד לחשוד) מקים לבית המשפט סמכות <strong>לפסול את ההודאה או ההודעה</strong> שנגבתה מהנחקר, במסגרת דוקטרינת הפסילה הפסיקתית שנקבעה בבית המשפט העליון (<strong>הלכת יששכרוב</strong>).</li><li><strong>התנאים המרכזיים להחלת עילת הפסילה</strong>: 1. התרחשות פגם או מחדל חקירתי הפוגע בזכויות הנחקר לפי דין (כגון גביית אמרה ללא אזהרה בדבר זכות השתיקה). 2. יצירת פגיעה בזכותו של החשוד להליך הוגן. 3. זיקה וקשר סיבתי בין הפגם בחקירה לבין השגת הראיה/ההודאה.</li><li><strong>החריג המרכזי (נסיבות שאינן מהוות פגם)</strong>: <em> <strong>תיעוד סמוי</strong>: צילום חזותי סמוי בחדר החקירות במצלמה מוסתרת (בעציץ, בעט, בקיר וכדומה) ללא הודעה לחשוד <strong>אינו מהווה פגם חקירתי</strong> ומותר על פי דין. </em> <strong>סייג עבירות ביטחון</strong>: היעדר תיעוד חזותי או קולי בחקירת חשוד בעבירת ביטחון (סעיף 17 לחוק חקירת חשודים) <strong>אינו מהווה פגם</strong>, מטעמי ביטחון מידע.</li><li><strong>זכות / חובה / סמכות חשובה</strong>: <em> <strong>חובת החוקר</strong>: חובה מוחלטת להזהיר חשוד בדבר זכות השתיקה בטרם חקירתו, ולעצור מיד עדות עד ברגע שעולה נגדו חשד פלילי. </em> <strong>סמכות בית המשפט</strong>: סמכות לפסול הודאות/ראיות שהושגו שלא כדין תוך פגיעה בזכות השתיקה והזכות להליך הוגן.</li><li><strong>מועד חשוב</strong>: מתן האזהרה וההודעה על זכות השתיקה חייבים להתבצע <strong>אופן מיידי ובסמוך ממש</strong> לרגע שבו עולה החשד לביצוע עבירה בידי הנחקר.</li><li><strong>הבחנה מרכזית</strong>: הבחנה בין \"הודעה\" של עד (הכפופה לחובת מענה נכונה למעט חיסיון מפני הפללה עצמית) לבין \"חקירה\" ו\"הודיה\" של חשוד (הנהנה מזכות שתיקה מלאה).</li><li><strong>נקודת מבחן מרכזית</strong>: מחדל משטרתי בהודעה על זכות השתיקה או המשכת חקירת עד שהפך לחשוד ללא אזהרה מפעילים את הלכת יששכרוב ומקימים עילה לפסילת הראיה בבית המשפט.</li></ul></section></div><div class=\"callout case-callout\"><span class=\"callout-title\">פסיקה קשורה ומאומתת</span><button class=\"case-link\" data-case=\"25\">⚖ רפאל יששכרוב נגד התובע הצבאי הראשי</button></div>","lesson":"extra","status":"מבוסס על מקור הקורס המסומן","lessons":["extra"],"source":"שיעור דיני חקירה-audio.mp4"},{"id":"search-seizure","tag":"חדש","title":"דיני חיפוש ותפיסה","html":"<div class=\"eyebrow\">Release 1</div><div class=\"release-layer\"><h2>תקציר הנושא</h2><div class=\"callout case-callout\"><span class=\"callout-title\">קשור לפסק דין</span><button class=\"case-link\" data-case=\"46\">⚖ יגמור סאמר נגד מדינת ישראל, מחלקת חקירות מכס ומע\"מ</button></div><div class=\"callout case-callout\"><span class=\"callout-title\">קשור לפסק דין</span><button class=\"case-link\" data-case=\"52\">⚖ חברת לרגו עבודות עפר בע\"מ נגד מדינת ישראל</button></div><section class=\"release-subtopic\"><h3>המסגרת הנורמטיבית של דיני החיפוש והבחנת היסוד בין חיפוש \"על גוף\" לחיפוש \"בגוף\"</h3><ul><li><strong>הכלל המשפטי</strong>: דיני החיפוש בשיטת המשפט הישראלית מבוססים על פיצול נורמטיבי בין שני דברי חקיקה מרכזיים: <strong>פקודת סדר הדין הפלילי (מעצר וחיפוש) [נוסח חדש], התשכ\"ט-1969</strong> (להלן: \"הפקודה\") לבין <strong>חוק סדר הדין הפלילי (סמכויות אכיפה – חיפוש בגוף החשוד ונטילת אמצעי זיהוי), התשנ\"ו-1996</strong> (להלן: \"חוק החיפוש\").</li><li><strong>סמכות שיפוטית (\"שופט\")</strong>: סעיף 1 לפקודה מגדיר \"שופט\" כ<strong>שופט בית משפט מחוזי או שופט בית משפט שלום</strong>. לשתי הערכאות נתונה סמכות מקבילה להוצאת צווי חיפוש מכוח הפקודה.</li><li><strong>הבחנת היסוד המושגית</strong>: <em> <strong>חיפוש \"על גוף\"</strong>: חיפוש על פני גופו של אדם, בבגדיו או בכליו (Pat-down / מישוש). מוסדר בפקודת מעצר וחיפוש. </em> <strong>חיפוש \"בגוף\"</strong>: חיפוש בגופו של אדם המוסדר בחוק החיפוש (1996), והנחלק לשתי קטגוריות: 1. <strong>חיפוש חיצוני</strong>: חיפוש בגוף <em>ללא חדירה</em> לתוכו. 2. <strong>חיפוש פנימי</strong>: חיפוש בגוף בעל מאפיינים <em>חודרניים</em> (חדירה פיזית או וירטואלית).</li><li><strong>נקודת מבחן קריטית</strong>: במבחן אקדמי חובה להשיב לפי הדין המהותי ולא לפי הפרקטיקה בשטח; אף שבפועל המשטרה פונה כמעט מיוזמתה רק לשופטי שלום, החוק מעניק סמכות מקבילה מלאה גם לשופט מחוזי.</li></ul></section><section class=\"release-subtopic\"><h3>חיפוש על גוף ללא צו, חיפוש בעצור וחיפוש על אישה</h3><ul><li><strong>הכלל המשפטי</strong>: חיפוש \"על גוף\" (Pat-down / מישוש בגדים, כיסים וכלים) ללא צו שופט מוסדר בפקודת מעצר וחיפוש ומותר <strong>אך ורק בארבעה מסלולים חלופיים</strong>: 1. קיומו של <strong>חשד סביר</strong> שהאדם מחזיק בחפץ אסור או שהוא מושא לחיפוש. 2. <strong>הסכמה מדעת</strong> בהיעדר חשד סביר (הלכת בן חיים - ). 3. <strong>חיפוש בעצור</strong> (סעיף 22 לפקודה). 4. מכוח <strong>פקודת הסמים המסוכנים</strong> (צוין במפורש כי סמכות זו אינה נלמדת בקורס זה).</li><li><strong>סמכות בעצור וכלל חילוף הידיים (סעיף 22)</strong>: ברגע שנעצר אדם קמה לשוטר סמכות מיידית לבצע חיפוש על גופו. סמכות זו מתחדשת בכל פעם שהעצור <strong>\"מחליף ידיים\"</strong> (מועבר בין שוטרים, חוקרים או סוהרים).</li><li><strong>חיפוש על אישה (סעיף 46)</strong>: חיפוש על גופה של אישה ייעשה <strong>אך ורק בידי אישה</strong> (שוטרת או סוהרת).</li><li><strong>נקודת מבחן קריטית</strong>: לפי סעיף 46 לפקודה, הכלל שחיפוש על גוף אישה ייעשה בידי אישה הוא <strong>קשיח ולא קיימים לו חריגים!</strong> (זאת להבדיל מחיפוש <em>בגוף</em> לפי חוק החיפוש 1996, שבו קיימים 3 חריגים המתירים חיפוש שלא בידי בן מינו).</li></ul></section><section class=\"release-subtopic\"><h3>חיפוש בחצרים ועל אדם בחצרים מכוח צו שופט והסמכויות הנלוות</h3><ul><li><strong>הכלל המשפטי</strong>: חיפוש בחצרים (הבית, קומותיו, שטחו שמתחתיו, הגג, החניה, הגינה, המרפסת והמחסן) מבוצע ככלל מכוח צו שיפוטי.</li><li><strong>סמכות שיפוטית</strong>: לפי סעיף 1 וסעיף 23 לפקודת מעצר וחיפוש, הסמכות להוצאת צו חיפוש בחצרים נתונה ל<strong>שופט בית משפט שלום או לשופט בית משפט מחוזי</strong>.</li><li><strong>שלושת התנאים/העילות החלופיות למתן צו (סעיף 23 לפקודה)</strong>: 1. החיפוש נחוץ כדי להבטיח הצגת חפץ לצורך חקירה, משפט או הליך אחר (שימור ראיות). 2. יש יסוד להניח שבמקום מוחזק חפץ גנוב, חפץ הקשור לעבירה או חפץ למטרה בלתי חוקית. 3. יש יסוד להניח שנעברה עבירה נגד אדם הנמצא במקום או שמתכוונים לעבור עבירה נגדו.</li><li><strong>סמכויות נלוות לצו החיפוש</strong>: <em> <strong>תפיסת חפצים</strong>: תפיסת החפצים המפורטים בצו, וכן תפיסת חפץ חשוד שלא נזכר בצו אם יש יסוד להניח שהוא קשור לביצוע עבירה פלילית (והבאתו בפני השופט שנתן את הצו). </em> <strong>סמכות מעצר נלווית (סעיף 24)</strong>: סמכות מעצר מיידית לגבי כל אדם הנמצא במקום והנחזה כמי שקשור בעבירה. <em> <strong>חיפוש על אדם בחצרים (סעיף 29)</strong>: סמכות לערוך חיפוש על גופו (Pat-down / מישוש בבגדים וכלים) של אדם הנמצא בחצרים, אם יש יסוד לחשוד שהוא מסתיר חפץ שמחפשים. </em> <strong>כניסה בכוח (סעיף 45)</strong>: חובת תופס המקום לאפשר כניסה חופשית והקלה סבירה; בסירוב – סמכות לפרוץ דלתות ומנעולים בכוח סביר. * <strong>עזרת הציבור (סעיף 20)</strong>: חובה על כל אדם לסייע לשוטר הדורש זאת באופן סביר לצורך מעצר או מניעת בריחה.</li><li><strong>נקודת מבחן קריטית</strong>: אף שבפרקטיקה פונים כמעט רק לשופטי שלום, בבחינה האקדמית לשופט מחוזי ולשופט שלום נתונה סמכות מקבילה מלאה לפי סעיף 1 לפקודה, וחל איסור להסתמך על הפרקטיקה בשטח!</li></ul></section><section class=\"release-subtopic\"><h3>חיפוש בחצרים ללא צו ונוהל החיפוש וחובת העדים</h3><ul><li><strong>הכלל המשפטי</strong>: כניסת שוטר לבית או למקום וביצוע חיפוש בחצרים בלא צו שופט מוגבלת באופן דווקני ל<strong>רשימה סגורה של ארבעה מקרים בלבד</strong> המנויים בסעיף 25 לפקודת מעצר וחיפוש.</li><li><strong>ארבעת המקרים לחיפוש ללא צו (סעיף 25 לפקודה - חלופות)</strong>: 1. קיים יסוד להניח שמבוצע במקום <strong>פשע</strong>, או שבוצע שם <strong>פשע זה מקרוב</strong>. 2. <strong>תופס הבית/המקום</strong> פונה בעצמו לעזרת המשטרה (מותר בכל מצב, גם ללא חשד לעבירה). 3. <strong>אדם המצוי שם</strong> פונה לעזרת המשטרה וקיים יסוד להניח שמבוצעת שם <strong>עבירה</strong> (לרבות עבירת עוון). 4. השוטר נמצא ב<strong>מרדף/רדיפה</strong> אחר אדם המתחמק ממעצר או נמלט ממשמורת חוקית (אף אם חלף זמן ניכר).</li><li><strong>נוהל עריכת חיפוש וחובת עדים (סעיף 26 לפקודה)</strong>: חיפוש בחצרים ייערך ככלל בנוכחות תופס המקום ו<strong>שני עדים שאינם שוטרים</strong>.</li><li><strong>שלושת החריגים לחובת שני עדים</strong>: (1) קיימת דחיפות בעריכת החיפוש; (2) ניתן היתר מפורש בצו שופט; (3) תופס הבית או בן משפחתו ביקש/אישר זאת בחתימתו.</li><li><strong>סמכויות נלוות בחצרים</strong>: <em> <strong>חיפוש על אדם בחצרים (סעיף 29)</strong>: סמכות לחיפוש על גופו (Pat-down) של אדם הנמצא בחצרים אם קיים חשד שהוא מסתיר חפץ שמחפשים. </em> <strong>שימוש בכוח (סעיף 45)</strong>: תופס המקום חייב לאפשר כניסה חופשית והקלה סבירה; בסירוב – סמכות לפרוץ דלתות וארונות נעולים בכוח סביר.</li><li><strong>נקודת מבחן קריטית</strong>: הבחנה בין פניית <em>תופס הבית</em> (סעיף 25(ב) – אינה דורשת חשד לעבירה פלילית כלל) לבין פניית <em>אדם המצוי שם</em> (סעיף 25(ג) – דורשת חשד לביצוע עבירה פלילית, אך מסתפקת בעבירת עוון).</li></ul></section><section class=\"release-subtopic\"><h3>חיפוש בחומר מחשב ובטלפון נייד</h3><ul><li><strong>הכלל המשפטי</strong>: חיפוש בחומר מחשב ובטלפון נייד נשלט על ידי פקודת סדר הדין הפלילי (מעצר וחיפוש) [נוסח חדש], התשכ\"ט-1969, ונקבע לגביו כלל קשיח: <strong>חיפוש בחומר מחשב ייערך אך ורק לפי צו שופט</strong>. אין חיפוש במחשב או בטלפון נייד ללא צו שיפוטי!</li><li><strong>תנאים מצטברים</strong>: 1. צו שופט הכולל <strong>היתר מפורש</strong> לחפש בחומר מחשב. 2. ביצוע החיפוש אך ורק על ידי <strong>בעל תפקיד מיומן</strong> (חוקר מחשב מוסמך).</li><li><strong>היקף ההגדרה בפסיקה (פסק דין אוריך)</strong>: טלפונים ניידים/חכמים, אייפדים וכל חפץ/מכשיר בעל יחידת עיבוד נתונים, זיכרון ושמירת נתונים בשבבים אלקטרוניים נחשבים משפטית כ\"חומר מחשב\".</li><li><strong>פרוצדורה וסדרי דין</strong>: בשלב החקירה, הבקשה לצו מוגשת <strong>במעמד צד אחד</strong> (בדלתיים סגורות) למניעת שיבוש/מחיקת נתונים, ועל החלטת בית המשפט בבקשה <strong>אין זכות לערור</strong>.</li><li><strong>נקודת מבחן קריטית</strong>: צו חיפוש בחצרים כללי אינו מעניק סמכות לחדור לטלפון נייד או למחשב הנמצאים בחצרים; נדרש היתר מפורש וספציפי בצו לחיפוש בחומר מחשב.</li></ul></section><section class=\"release-subtopic\"><h3>תפיסת חפצים ומחשב, זכויות העתקה והחזרת תפוסים</h3><ul><li><strong>הכלל המשפטי לסמכות תפיסה (סעיף 32 לפקודה)</strong>: מכוח עיקרון החוקיות, עצם קיומה של סמכות לחפש אינה מהווה כשלעצמה סמכות לתפוס. שוטר מוסמך לתפוס חפץ אם יש לו יסוד להניח שנעברה בו עבירה, עומדים לעבור בו עבירה, עשוי לשמש ראיה במשפט, או ניתן כשכר בעד ביצוע עבירה או כאמצעי לביצועה.</li><li><strong>חריגי תפיסת מחשבים</strong>: <em> <strong>מחשב של \"מוסד\" (עסק פרטי / רשות מדינה)</strong>: תפיסה אך ורק מכוח צו שופט מפורש. תפיסה שלא בנוכחות המחזיק מוגבלת לתקופה מרבית של <strong>עד 48 שעות בלבד</strong>; הארכה מותנית בשימוע למחזיק המחשב. </em> <strong>מחשב של אדם פרטי</strong>: אם אינו דרוש לחילוט או כראיה – חובה להחזירו לאדם שממנו נלקח <strong>תוך 30 ימים</strong>. שופט שלום רשאי להאריך מעת לעת בתקופות של <strong>עד 30 ימים בכל פעם</strong>.</li><li><strong>זכות העתקת חומר מחשב (סעיף 32א לפקודה)</strong>: המשתמש במחשב שנתפס זכאי לקבל העתק מחומר המחשב <strong>תוך 4 ימים</strong>. קצין משטרה בדרגת סגן ניצב (סנ\"צ) ומעלה רשאי לדחות ב-4 ימים בכל פעם עד תקרת <strong>16 ימים</strong>. שופט שלום רשאי להאריך מטעמים מיוחדים ב-<strong>15 ימים בכל פעם</strong>. קצין בדרגת מפקח משנה (ממ\"ש) ומעלה מוסמך למנוע מסירת העתק עקב חשש לשיבוש חקירה או ביצוע עבירה (כגון פדופיליה). על דחייה/מניעה ניתן לערור לבית משפט שלום.</li><li><strong>כלל החזרת תפוס (הוראות החוק לפקודה)</strong>: אם תוך <strong>6 חודשים</strong> מתפיסת חפץ לא הוגש כתב אישום ולא ניתן צו שיפוטי – חובה על המשטרה להחזיר את החפץ לאדם שממנו נלקח. בית משפט שלום רשאי להאריך את התקופה לבקשת שוטר או <strong>\"כל אדם מעוניין\"</strong>.</li><li><strong>חפצים אסורים בהחזקה (סעיף 31 לפקודה / סעיף 21 לחוק עוולות מסחריות)</strong>: חפץ שאסור בהחזקה (סמים, אקדח ללא מספר) – שופט מוסמך להורות על החרמתו או השמדתו <strong>אף בהיעדר העמדה לדין</strong>.</li><li><strong>נקודת מבחן קריטית</strong>: הארכת תפיסת חפץ מעבר ל-6 חודשים יכולה להיות מוגשת גם ע\"י \"כל אדם מעוניין\" (כגון אישה החוששת מאקדח של בעלה שתיק החקירה נגדו נסגר) ולא רק ע\"י המשטרה.</li></ul></section></div><div class=\"callout case-callout\"><span class=\"callout-title\">פסיקה קשורה ומאומתת</span><button class=\"case-link\" data-case=\"2\">⚖ אברהם בן חיים נגד מדינת ישראל</button><button class=\"case-link\" data-case=\"36\">⚖ יונתן אוריך נגד מדינת ישראל</button></div><section class=\"release-subtopic\"><h3>חיפוש במכשיר נייד ובחומר מחשב — סעיף 23א לפקודת החיפוש</h3><p>חיפוש בטלפון או בחומר מחשב הוא חיפוש בעל מאפיינים ייחודיים, ולכן יש לבחון את מקור הסמכות ואת היקף הצו באופן קונקרטי. עצם העובדה שהמכשיר נתפס אינה מתירה עיון גורף בתוכנו. כאשר נטען שחיפוש בלתי חוקי קדם לבקשת הצו, יש להפריד בין חוקיות האיסוף המוקדם לבין תוקף הצו והראיות שנאספו מכוחו, ולבחון את התוצאה לפי ההגנות והאיזונים שנלמדו בבן חיים וביששכרוב.</p><div class=\"callout\"><b>השלמת Audit חקיקה:</b> בחיפוש בטלפון יש להבחין בין תפיסת המכשיר לבין עיון בתוכנו: נבחנים מקור הסמכות והיקף הצו, וחיפוש מוקדם פגום נבחן בנפרד לפי הזיקה והחומרה שנלמדו.</div><div class=\"callout\" style=\"background:#fff;border:1px solid #dce2e6\"><div class=\"eyebrow\">תרשים זרימה</div>\n<h3>ציר הזמן של המעצר — מעיכוב ועד שחרור</h3>\n<svg viewBox=\"0 0 920 560\" role=\"img\" aria-label=\"ציר זמן של שלבי המעצר: עיכוב, מעצר ללא צו, מעצר גישור, מעצר עד תום ההליכים, ומועדי שחרור אוטומטי\" style=\"width:100%;height:auto;max-width:820px;display:block;margin:0 auto;font-family:Assistant,Arial,sans-serif\" xmlns=\"http://www.w3.org/2000/svg\"> x=\"240\" y=\"150\" text-anchor=\"middle\" fill=\"#202a37\" font-size=\"13\" font-weight=\"700\">תקרת 75 הימים הרגילה</text>\n  <text x=\"240\" y=\"170\" text-anchor=\"middle\" fill=\"#607083\" font-size=\"11\">מעצר הגישור נספר בתוך תקרה זו, לא מעבר לה</text>\n\n  <line x1=\"240\" y1=\"192\" x2=\"240\" y2=\"222\" stroke=\"#142641\" stroke-width=\"2\" marker-end=\"url(#ah3)\"/>\n\n  <rect x=\"30\" y=\"224\" width=\"420\" height=\"100\" rx=\"8\" fill=\"#edf4f1\" stroke=\"#457462\" stroke-width=\"1.5\"/>\n  <text x=\"240\" y=\"250\" text-anchor=\"middle\" fill=\"#202a37\" font-size=\"14\" font-weight=\"700\">מעצר עד תום ההליכים — סעיף 21</text>\n  <text x=\"240\" y=\"272\" text-anchor=\"middle\" fill=\"#607083\" font-size=\"11.5\">4 תנאים מצטברים:</text>\n  <text x=\"240\" y=\"292\" text-anchor=\"middle\" fill=\"#607083\" font-size=\"11.5\">עילת מעצר + ראיות לכאורה + היעדר חלופה + ייצוג</text>\n  <text x=\"240\" y=\"312\" text-anchor=\"middle\" fill=\"#607083\" font-size=\"11\">(היעדר אחד מהתנאים חוסם את המעצר)</text>\n\n  <line x1=\"240\" y1=\"324\" x2=\"240\" y2=\"354\" stroke=\"#142641\" stroke-width=\"2\" marker-end=\"url(#ah3)\"/>\n  <line x1=\"240\" y1=\"340\" x2=\"620\" y2=\"340\" stroke=\"#142641\" stroke-width=\"2\"/>\n  <line x1=\"620\" y1=\"340\" x2=\"620\" y2=\"354\" stroke=\"#142641\" stroke-width=\"2\" marker-end=\"url(#ah3)\"/>\n\n  <rect x=\"60\" y=\"356\" width=\"360\" height=\"88\" rx=\"8\" fill=\"#faf8f3\" stroke=\"#c0392b\" stroke-width=\"1.5\"/>\n  <text x=\"240\" y=\"382\" text-anchor=\"middle\" fill=\"#202a37\" font-size=\"13\" font-weight=\"700\">30 יום ללא תחילת משפט</text>\n  <text x=\"240\" y=\"404\" text-anchor=\"middle\" fill=\"#202a37\" font-size=\"12\" font-weight=\"700\">→ שחרור אוטומטי</text>\n  <text x=\"240\" y=\"424\" text-anchor=\"middle\" fill=\"#607083\" font-size=\"11\">בכפוף להארכות בית המשפט העליון</text>\n\n  <rect x=\"440\" y=\"356\" width=\"360\" height=\"88\" rx=\"8\" fill=\"#faf8f3\" stroke=\"#c0392b\" stroke-width=\"1.5\"/>\n  <text x=\"620\" y=\"382\" text-anchor=\"middle\" fill=\"#202a37\" font-size=\"13\" font-weight=\"700\">9 חודשים ללא הכרעת דין</text>\n  <text x=\"620\" y=\"404\" text-anchor=\"middle\" fill=\"#202a37\" font-size=\"12\" font-weight=\"700\">→ שחרור אוטומטי</text>\n  <text x=\"620\" y=\"424\" text-anchor=\"middle\" fill=\"#607083\" font-size=\"11\">בכפוף להארכות בית המשפט העליון</text>\n\n  <rect x=\"60\" y=\"470\" width=\"740\" height=\"70\" rx=\"10\" fill=\"#142641\"/>\n  <text x=\"430\" y=\"498\" text-anchor=\"middle\" fill=\"#faf8f3\" font-size=\"13\" font-weight=\"700\">שים לב: ביטול הרשעה בערעור והחזרת התיק לדיון מחדש</text>\n  <text x=\"430\" y=\"520\" text-anchor=\"middle\" fill=\"#faf8f3\" font-size=\"12.5\">אינם \"מאפסים\" את ימי המעצר שכבר נצברו — מלכודת מבחן נפוצה</text>\n</svg></div></section>","lesson":"extra","status":"מבוסס על מקור הקורס המסומן","lessons":["extra"],"source":"הקלטת שיעור 1 - דיני חיפוש-audio.mp4"},{"id":"body-search-identification","tag":"חדש","title":"חיפוש בגוף ונטילת אמצעי זיהוי","html":"<div class=\"eyebrow\">Release 1</div><div class=\"release-layer\"><h2>תקציר הנושא</h2><div class=\"callout case-callout\"><span class=\"callout-title\">קשור לפסק דין</span><button class=\"case-link\" data-case=\"53\">⚖ מדינת ישראל נגד מקדאד מקדאד</button></div><div class=\"callout case-callout\"><span class=\"callout-title\">קשור לפסק דין</span><button class=\"case-link\" data-case=\"56\">⚖ מדינת ישראל נגד ויקטור גואטה</button></div><section class=\"release-subtopic\"><h3>חיפוש חיצוני בגוף — תנאים, סמכויות ושימוש בכוח</h3><ul><li><strong>הכלל המשפטי</strong>: חיפוש חיצוני הוא חיפוש בגופו של אדם <strong>ללא חדירה</strong> לתוכו, הכולל רשימה מוגדרת של 12 בדיקות לפי <strong>חוק סדר הדין הפלילי (סמכויות אכיפה – חיפוש בגוף החשוד ונטילת אמצעי זיהוי), התשנ\"ו-1996</strong> (להלן: \"חוק החיפוש\").</li><li><strong>תנאים מצטברים לחיפוש חיצוני בהסכמת החשוד (סעיף 3)</strong>: 1. <strong>גורם מוסמך</strong>: שוטר (שאינו בהכרח קצין משטרה). 2. יסוד סביר לחשוד שבגופו של החשוד נמצאת ראיה להוכחת ביצוע עבירה. 3. העבירה היא מסוג <strong>עוון או פשע</strong> (<strong>אין חיפוש חיצוני בעבירת חטא!</strong>). 4. <strong>הסכמת החשוד</strong>.</li><li><strong>סמכות שימוש בכוח סביר בהיעדר הסכמה</strong>: מותרת אך ורק באישור <strong>קצין משטרה בדרגת רב פקד (רפ\"ק) ומעלה</strong>, ולאחר עריכת שימוע והסבר לחשוד.</li><li><strong>החריג המרכזי והרשימה הסגורה לשימוש בכוח</strong>: הפעלת כוח סביר מוגבלת <strong>אך ורק לרשימה סגורה של 6 בדיקות</strong> (בחינת גוף ערום וצילומו, תביעה מכל חלק בגוף, חומר מתחת לציפורניים, שיער ראש, חומר מעל הגוף, בדיקת עור). בשאר הבדיקות החיצוניות – <strong>חלה איסור מוחלט על שימוש בכוח!</strong>.</li><li><strong>נקודת מבחן קריטית</strong>: הבחנה בין <em>לקיחת חומר מתחת לציפורניים</em> (מותר בכוח) לבין <em>גזירת ציפורניים</em> (אסור בכוח); ובין <em>תלישת שיער ראש</em> (מותר בכוח) לבין <em>תלישת שיער מחלקים מוצנעים</em> (אסור בכוח!).</li></ul></section><section class=\"release-subtopic\"><h3>חיפוש פנימי בגוף — תנאים, אישורים רפואיים והיתר שיפוטי</h3><ul><li><strong>הכלל המשפטי</strong>: חיפוש פנימי מוגדר בחוק סדר הדין הפלילי (סמכויות אכיפה – חיפוש בגוף החשוד ונטילת אמצעי זיהוי), התשנ\"ו-1996 (להלן: \"חוק החיפוש\") כחיפוש בגופו של אדם בעל מאפיינים <strong>חודרניים</strong> – פיזית או וירטואלית. מדובר ב-5 בדיקות מוגדרות: בדיקת דם רגילה, הדמיית פנים הגוף (CT, MRI, אולטרסאונד), שיקוף רנטגן, בדיקה גינקולוגית, ונטילת דגימת דם מזערית מהאצבע.</li><li><strong>4 התנאים המצטברים לחיפוש פנימי בהסכמה (סעיף 4)</strong>: 1. <strong>גורם מוסמך</strong>: קצין משטרה (בכל דרגה). 2. <strong>יסוד לחשד</strong>: יסוד סביר לחשוד שבגוף נמצאת ראיה להוכחת עבירה. 3. <strong>דרגת העבירה</strong>: עבירה מסוג <strong>פשע בלבד</strong>! (<strong>אין חיפוש פנימי בעבירת חטא או עוון!</strong>). 4. <strong>אישור רופא והסבר שלא בנוכחות שוטר</strong>: חובה שרופא נתן אישור בכתב שאין מניעה בריאותית, לאחר פגישה עם החשוד שנערכה <strong>שלא בנוכחות שוטר</strong>, וקבלת הסכמת החשוד בכתב.</li><li><strong>חריגים מרכזיים לכלל</strong>: <em> <strong>בדיקת דם ודגימת דם מזערית</strong>: מותרות <strong>גם בעבירת עוון</strong>. </em> <strong>דגימת דם מזערית מהאצבע (סעיף 4א)</strong>: מוסמך להורות בהסכמה <strong>גם שוטר שאינו קצין</strong>, <strong>אין צורך באישור רופא</strong> (אלא אם קים חשש בריאותי), ובסירוב – חובה להציע חיפוש חיצוני חלופי (שיער או תאי לחי). * <strong>בדיקה גינקולוגית</strong>: <strong>תמיד מחייבת היתר בית משפט (שופט שלום)</strong>, גם אם האישה מסכימה בכתב וגם אם ניתן אישור רופא!</li><li><strong>סמכות והיתר שיפוטי בהיעדר הסכמה </strong>: <strong>אין שום קצין משטרה המוסמך להורות על חיפוש פנימי בכוח!</strong> בהיעדר הסכמה, קצין המשטרה חייב להגיש בקשת היתר ל<strong>בית משפט השלום</strong>.</li><li><strong>מועדים ופרוצדורה</strong>: תוקף היתר שופט לחיפוש פנימי הוא <strong>עד 3 ימים</strong> (הארכות ב-3 ימים בכל פעם מטעמים מיוחדים).</li><li><strong>נקודת מבחן קריטית</strong>: הבחנה בין חיפוש חיצוני (שבו קצין ברמת רפ\"ק ומעלה מוסמך להתיר שימוש בכוח ברשימה סגורה) לבין חיפוש פנימי (שבו <strong>אין סמכות קצין לכוח</strong>, אלא חובה לקבל היתר מבית משפט שלום!).</li></ul></section><section class=\"release-subtopic\"><h3>חיפוש בגוף באוכלוסיות מיוחדות ובמי שאינו חשוד</h3><ul><li><strong>הכלל המשפטי</strong>: עריכת חיפוש בגוף (חיצוני או פנימי) באדם שאינו חשוד (עד או נפגע עבירה) או באוכלוסיות מיוחדות (קטינים ואנשים עם מוגבלות שכלית) מוסדרת ב<strong>חוק סדר הדין הפלילי (סמכויות אכיפה – חיפוש בגוף החשוד ונטילת אמצעי זיהוי), התשנ\"ו-1996</strong> (להלן: \"חוק החיפוש\").</li><li><strong>הסמכות השיפוטית בחוק החיפוש (סעיף 1)</strong>: בית המשפט המוסמך לכל עניין לפי חוק החיפוש הוא <strong>בית משפט השלום בלבד</strong>.</li><li><strong>חיפוש באדם שאינו חשוד (עד / נפגע עבירה)</strong>: מותר לבצע חיפוש בגופו אם יש יסוד סביר להניח שבגופו נמצאת ראיה לחקירה (כגון DNA מתחת לציפורניים) או לבדיקת זיקתו לעבירה. התנאים המתחייבים: מתן הסבר מפורש ו<strong>הסכמה בכתב</strong>.</li><li><strong>החריג והסייג המוחלט – בדיקה גינקולוגית</strong>: לא ייערך חיפוש שהוא בדיקה גינקולוגית אלא <strong>בהיתר בית משפט (שופט שלום)</strong> בלבד! הכלל חל על כל אדם – חשודה, עד, או נפגעת עבירה/קורבן אונס – ואין בהסכמתה בכתב או באישור רופא כדי לפתור מהיתר שיפוטי.</li><li><strong>קטינים ואנשים עם מוגבלות שכלית</strong>: נדרשת <strong>הסכמה כפולה בכתב</strong> (גם של הקטין/המוגבל וגם של האפוטרופוס). <strong>כלל הסירוב</strong>: מספיק שאחד מהם מסרב (הקטין מסרב או האפוטרופוס מסרב) כדי <strong>למנוע</strong> את החיפוש.</li><li><strong>נקודת מבחן קריטית</strong>: הסכמת נפגעת אונס לבדיקה גינקולוגית אינה פוטרת את המשטרה מלקבל היתר משופט שלום; וסירוב קטין לחיפוש בגופו אינו ניתן לעקיפה על ידי הסכמת הורהו!</li></ul></section><section class=\"release-subtopic\"><h3>משמעות סירוב לחיפוש בגוף וארבעת החריגים</h3><ul><li><strong>הכלל המשפטי</strong>: סירוב החשוד (באמירה או בהתנהגות) לעריכת חיפוש חיצוני, חיפוש פנימי, או להיפגש עם רופא – כאשר החיפוש לא נערך בשל סירובו – עשוי לשמש <strong>חיזוק לראיות התביעה</strong>. (בבדיקת נשיפה/אלכוהול, הסירוב מוליד חזקה משפטית כאילו נהג תחת השפעת אלכוהול).</li><li><strong>הסייג הכללי לכלל (ביצוע בפועל)</strong>: אם החיפוש בוצע בפועל (בכוח סביר בחיפוש חיצוני מותר, או מכוח היתר שופט בחיפוש פנימי) – <strong>אין עוד משמעות ראייתית לסירוב</strong>.</li><li><strong>ארבעת החריגים הקשיחים (שבהם סירוב לא ישמש חיזוק ראייתי)</strong>: 1. <strong>סירוב אפוטרופוס</strong>: הסירוב לחיפוש הפנימי היה של האפוטרופוס (ולא של החשוד הקטין/המוגבל בשכלו). 2. <strong>מחדל המשטרה בפנייה לבית המשפט</strong>: המשטרה לא הגישה בקשה לבית המשפט להתיר את החיפוש הפנימי בשל סירובו (זולת אם השהיית הפנייה הייתה פוגעת בראיה). 3. <strong>דחייה שיפוטית</strong>: בית המשפט דחה את בקשת המשטרה להיתר חיפוש פנימי. 4. <strong>היעדר אישור רפואי</strong>: לא ניתן אישור רופא לעריכת החיפוש בגוף החשוד, כאשר אישור כזה דרוש על פי החוק.</li><li><strong>מקור נורמטיבי</strong>: <strong>חוק סדר הדין הפלילי (סמכויות אכיפה – חיפוש בגוף החשוד ונטילת אמצעי זיהוי), התשנ\"ו-1996</strong> (\"חוק החיפוש\"), סעיף 11.</li><li><strong>נקודת מבחן קריטית</strong>: אם החשוד סירב לחיפוש פנימי והמשטרה נמנעה מלהגיש בקשת היתר לבית משפט השלום (ולא התקיימה דחיפות של התכלות/פגיעה בראיה) – האי-ביצוע רובץ לפתחה של המשטרה, והסירוב נטרלי לחלוטין ולא ישמש כחיזוק!</li></ul></section></div><div class=\"callout case-callout\"><span class=\"callout-title\">פסיקה קשורה ומאומתת</span></div>","lesson":"extra","status":"מבוסס על מקור הקורס המסומן","lessons":["extra"],"source":"הקלטת שיעור 1 - דיני חיפוש-audio.mp4"},{"id":"arrest-basics","tag":"31","title":"יסודות דיני מעצרים: עיכוב, מעצר, עצור מול אסיר (הרחבה מהמצגות — לא שיעור 8)","html":"\n      <div class=\"eyebrow\">חוק המעצרים · חוק יסוד כבוד האדם וחירותו</div>\n      <h2>יסודות דיני המעצרים</h2>\n      <p><b>אסיר</b> — הורשע ונגזר עליו מאסר בפועל, מוחזק לריצוי עונשו. <b>עצור</b> — מוחזק לפני/בזמן ההליך, נהנה מחזקת החפות.</p>\n      <p><b>עיכוב</b> — הגבלת חירות קלה ומתוחמת (בירור/חקירה במקום). <b>מעצר</b> — שלילת חירות מלאה.</p>\n      <p>כללי הברזל: במסלול סעיף 23(א) נדרשת עבירה שאינה חטא; סעיף 23(ב) הוא מסלול נפרד הנוגע לעיכוב חוקי; אין לעצור אם ניתן להסתפק בעיכוב; אין לעצור אם ניתן להשיג את התכלית בחלופת מעצר.</p>\n      <div class=\"callout case-callout\"><span class=\"callout-title\">קשור לפסק דין</span><button class=\"case-link\" data-case=\"26\">⚖ קסאי — זכות התנגדות למעצר בלתי חוקי</button></div>\n      <button class=\"expand-link\" data-topic=\"arrest-basics\">🔎 קריאה מורחבת</button>\n    <div class=\"callout\" style=\"background:#fff;border:1px solid #dce2e6\"><div class=\"eyebrow\">תרשים זרימה</div>\n<h3>ציר הזמן של המעצר — מעיכוב ועד שחרור</h3>\n<svg viewBox=\"0 0 920 560\" role=\"img\" aria-label=\"ציר זמן של שלבי המעצר: עיכוב, מעצר ללא צו, מעצר גישור, מעצר עד תום ההליכים, ומועדי שחרור אוטומטי\" style=\"width:100%;height:auto;max-width:820px;display:block;margin:0 auto;font-family:Assistant,Arial,sans-serif\" xmlns=\"http://www.w3.org/2000/svg\">\n  <defs>\n    <marker id=\"ah3\" markerWidth=\"8\" markerHeight=\"8\" refX=\"4\" refY=\"4\" orient=\"auto\">\n      <path d=\"M0,0 L8,4 L0,8 Z\" fill=\"#142641\"/>\n    </marker>\n  </defs>\n\n  <rect x=\"700\" y=\"20\" width=\"200\" height=\"70\" rx=\"8\" fill=\"#edf4f1\" stroke=\"#457462\" stroke-width=\"1.5\"/>\n  <text x=\"800\" y=\"48\" text-anchor=\"middle\" fill=\"#202a37\" font-size=\"14\" font-weight=\"700\">עיכוב</text>\n  <text x=\"800\" y=\"68\" text-anchor=\"middle\" fill=\"#607083\" font-size=\"11\">הגבלת חירות קלה ומתוחמת</text>\n\n  <line x1=\"700\" y1=\"55\" x2=\"620\" y2=\"55\" stroke=\"#142641\" stroke-width=\"2\" marker-end=\"url(#ah3)\"/>\n\n  <rect x=\"420\" y=\"20\" width=\"200\" height=\"70\" rx=\"8\" fill=\"#edf4f1\" stroke=\"#457462\" stroke-width=\"1.5\"/>\n  <text x=\"520\" y=\"42\" text-anchor=\"middle\" fill=\"#202a37\" font-size=\"13\" font-weight=\"700\">מעצר שוטר ללא צו</text>\n  <text x=\"520\" y=\"62\" text-anchor=\"middle\" fill=\"#607083\" font-size=\"11\">סעיף 23(א): חשד + עילת מעצר</text>\n  <text x=\"520\" y=\"78\" text-anchor=\"middle\" fill=\"#607083\" font-size=\"11\">(לא בעבירת חטא)</text>\n\n  <line x1=\"420\" y1=\"55\" x2=\"340\" y2=\"55\" stroke=\"#142641\" stroke-width=\"2\" marker-end=\"url(#ah3)\"/>\n\n  <rect x=\"140\" y=\"20\" width=\"200\" height=\"70\" rx=\"8\" fill=\"#edf4f1\" stroke=\"#457462\" stroke-width=\"1.5\"/>\n  <text x=\"240\" y=\"42\" text-anchor=\"middle\" fill=\"#202a37\" font-size=\"13\" font-weight=\"700\">מעצר גישור</text>\n  <text x=\"240\" y=\"62\" text-anchor=\"middle\" fill=\"#607083\" font-size=\"11\">סעיף 17(ד): עד 5 ימים</text>\n  <text x=\"240\" y=\"78\" text-anchor=\"middle\" fill=\"#607083\" font-size=\"11\">לזמן הכנת כתב אישום</text>\n\n  <line x1=\"240\" y1=\"90\" x2=\"240\" y2=\"120\" stroke=\"#a98543\" stroke-width=\"2\" marker-end=\"url(#ah3)\"/>\n\n  <rect x=\"60\" y=\"122\" width=\"360\" height=\"70\" rx=\"8\" fill=\"#faf8f3\" stroke=\"#a98543\" stroke-width=\"1.5\"/>\n  <text x=\"240\" y=\"150\" text-anchor=\"middle\" fill=\"#202a37\" font-size=\"13\" font-weight=\"700\">תקרת 75 הימים הרגילה</text>\n  <text x=\"240\" y=\"170\" text-anchor=\"middle\" fill=\"#607083\" font-size=\"11\">מעצר הגישור נספר בתוך תקרה זו, לא מעבר לה</text>\n\n  <line x1=\"240\" y1=\"192\" x2=\"240\" y2=\"222\" stroke=\"#142641\" stroke-width=\"2\" marker-end=\"url(#ah3)\"/>\n\n  <rect x=\"30\" y=\"224\" width=\"420\" height=\"100\" rx=\"8\" fill=\"#edf4f1\" stroke=\"#457462\" stroke-width=\"1.5\"/>\n  <text x=\"240\" y=\"250\" text-anchor=\"middle\" fill=\"#202a37\" font-size=\"14\" font-weight=\"700\">מעצר עד תום ההליכים — סעיף 21</text>\n  <text x=\"240\" y=\"272\" text-anchor=\"middle\" fill=\"#607083\" font-size=\"11.5\">4 תנאים מצטברים:</text>\n  <text x=\"240\" y=\"292\" text-anchor=\"middle\" fill=\"#607083\" font-size=\"11.5\">עילת מעצר + ראיות לכאורה + היעדר חלופה + ייצוג</text>\n  <text x=\"240\" y=\"312\" text-anchor=\"middle\" fill=\"#607083\" font-size=\"11\">(היעדר אחד מהתנאים חוסם את המעצר)</text>\n\n  <line x1=\"240\" y1=\"324\" x2=\"240\" y2=\"354\" stroke=\"#142641\" stroke-width=\"2\" marker-end=\"url(#ah3)\"/>\n  <line x1=\"240\" y1=\"340\" x2=\"620\" y2=\"340\" stroke=\"#142641\" stroke-width=\"2\"/>\n  <line x1=\"620\" y1=\"340\" x2=\"620\" y2=\"354\" stroke=\"#142641\" stroke-width=\"2\" marker-end=\"url(#ah3)\"/>\n\n  <rect x=\"60\" y=\"356\" width=\"360\" height=\"88\" rx=\"8\" fill=\"#faf8f3\" stroke=\"#c0392b\" stroke-width=\"1.5\"/>\n  <text x=\"240\" y=\"382\" text-anchor=\"middle\" fill=\"#202a37\" font-size=\"13\" font-weight=\"700\">30 יום ללא תחילת משפט</text>\n  <text x=\"240\" y=\"404\" text-anchor=\"middle\" fill=\"#202a37\" font-size=\"12\" font-weight=\"700\">→ שחרור אוטומטי</text>\n  <text x=\"240\" y=\"424\" text-anchor=\"middle\" fill=\"#607083\" font-size=\"11\">בכפוף להארכות בית המשפט העליון</text>\n\n  <rect x=\"440\" y=\"356\" width=\"360\" height=\"88\" rx=\"8\" fill=\"#faf8f3\" stroke=\"#c0392b\" stroke-width=\"1.5\"/>\n  <text x=\"620\" y=\"382\" text-anchor=\"middle\" fill=\"#202a37\" font-size=\"13\" font-weight=\"700\">9 חודשים ללא הכרעת דין</text>\n  <text x=\"620\" y=\"404\" text-anchor=\"middle\" fill=\"#202a37\" font-size=\"12\" font-weight=\"700\">→ שחרור אוטומטי</text>\n  <text x=\"620\" y=\"424\" text-anchor=\"middle\" fill=\"#607083\" font-size=\"11\">בכפוף להארכות בית המשפט העליון</text>\n\n  <rect x=\"60\" y=\"470\" width=\"740\" height=\"70\" rx=\"10\" fill=\"#142641\"/>\n  <text x=\"430\" y=\"498\" text-anchor=\"middle\" fill=\"#faf8f3\" font-size=\"13\" font-weight=\"700\">שים לב: ביטול הרשעה בערעור והחזרת התיק לדיון מחדש</text>\n  <text x=\"430\" y=\"520\" text-anchor=\"middle\" fill=\"#faf8f3\" font-size=\"12.5\">אינם \"מאפסים\" את ימי המעצר שכבר נצברו — מלכודת מבחן נפוצה</text>\n</svg></div>","lesson":"extra","status":"הורחב מול ניתוח פסק דין מקבוצה C","lessons":["extra"],"source":"יונתן אוריך נ' מדינת ישראל.pdf — ניתוח קבוצה C"},{"id":"arrest-nowarrant","tag":"32","title":"מעצר שוטר ללא צו וזכויות העצור בתחנה (הרחבה מהמצגות — לא שיעור 8)","html":"\n      <div class=\"eyebrow\">סעיפים 23, 26–36 לחוק המעצרים</div>\n      <h2>מעצר שוטר ללא צו וזכויות העצור</h2>\n      <p>במסלול סעיף 23(א): חשד לעוון/פשע ועילת מעצר סטטוטורית. סעיף 23(ב), הנוגע לאי־ציות לעיכוב חוקי, הוא מסלול נפרד.</p>\n      <p>זכויות: אזהרה, הסבר זכויות, מפגש עו\"ד ללא דיחוי (עם חריגי דחייה), הודעה לקרוב.</p>\n      <div class=\"callout case-callout\"><span class=\"callout-title\">קשור לפסקי דין</span><button class=\"case-link\" data-case=\"27\">⚖ כהן — \"זה מקרוב\"</button> <button class=\"case-link\" data-case=\"28\">⚖ אסף שי — זכות עו\"ד</button></div>\n      <button class=\"expand-link\" data-topic=\"arrest-nowarrant\">🔎 קריאה מורחבת</button>\n    <div class=\"callout\"><b>השלמת Audit חקיקה:</b> במסלול סעיף 23(א) נבחנים חשד סביר ועילת מעצר; סעיף 23(ב) הוא מסלול נפרד להבאה לתחנה לצורך העיכוב, ואין לייבא אליו אוטומטית את תנאי 23(א).</div>","lesson":"extra","status":"הרחבה — לא מהקלטת שיעור 8","lessons":["extra"]},{"id":"arrest-bridge","tag":"33","title":"הצהרת תובע ומעצר גישור (הרחבה מהמצגות — לא שיעור 8)","html":"\n      <div class=\"eyebrow\">סעיף 17(ד) לחוק המעצרים</div>\n      <h2>הצהרת תובע ומעצר גישור</h2>\n      <p>עד 5 ימים לגישור עד הגשת כתא\"ש, בכפוף לתקרת 75 הימים הרגילה.</p>\n      <div class=\"callout case-callout\"><span class=\"callout-title\">קשור לפסק דין</span><button class=\"case-link\" data-case=\"29\">⚖ אלטויל — תכלית מצומצמת</button></div>\n      <button class=\"expand-link\" data-topic=\"arrest-bridge\">🔎 קריאה מורחבת</button>\n    <div class=\"callout\"><b>השלמת Audit חקיקה:</b> מעצר גישור לפי סעיף 17(ד) נועד רק לזמן הטכני להכנת כתב אישום ובקשת מעצר עד תום ההליכים; הוא אינו מסלול להמשך פעולות חקירה.</div>","lesson":"extra","status":"הרחבה — לא מהקלטת שיעור 8","lessons":["extra"]},{"id":"arrest-pending","tag":"34","title":"מעצר עד תום ההליכים (הרחבה מהמצגות — לא שיעור 8)","html":"\n      <div class=\"eyebrow\">סעיף 21 לחוק המעצרים</div>\n      <h2>מעצר עד תום ההליכים</h2><div class=\"callout case-callout\"><span class=\"callout-title\">קשור לפסק דין</span><button class=\"case-link\" data-case=\"43\">⚖ מדינת ישראל נגד ינון בן רחמים</button></div><div class=\"callout case-callout\"><span class=\"callout-title\">קשור לפסק דין</span><button class=\"case-link\" data-case=\"49\">⚖ פלוני 2 נגד מדינת ישראל</button></div>\n      <p>4 תנאים מצטברים: עילת מעצר + ראיות לכאורה + היעדר חלופה + ייצוג.</p>\n      <div class=\"callout case-callout\"><span class=\"callout-title\">קשור לפסקי דין</span><button class=\"case-link\" data-case=\"30\">⚖ זאדה — ראיות לכאורה</button> <button class=\"case-link\" data-case=\"31\">⚖ גנימאת — אין עילה מחומרה בלבד</button></div>\n      <button class=\"expand-link\" data-topic=\"arrest-pending\">🔎 קריאה מורחבת</button>\n    ","lesson":"extra","status":"הרחבה — לא מהקלטת שיעור 8","lessons":["extra"]},{"id":"arrest-release","tag":"35","title":"שחרור אוטומטי, מעצר לאחר הרשעה וערר (הרחבה מהמצגות — לא שיעור 8)","html":"\n      <div class=\"eyebrow\">סעיפים 52–53, 60–62 לחוק המעצרים</div>\n      <h2>שחרור אוטומטי ומעצר לאחר הרשעה</h2>\n      <p>30 יום ללא תחילת משפט, 9 חודשים ללא הכרעת דין — שחרור, בכפוף להארכות עליון.</p>\n      <div class=\"callout case-callout\"><span class=\"callout-title\">קשור לפסק דין</span><button class=\"case-link\" data-case=\"32\">⚖ איבדיוב — מניין 9 החודשים</button></div>\n      <button class=\"expand-link\" data-topic=\"arrest-release\">🔎 קריאה מורחבת</button>\n    <div class=\"callout\"><b>השלמת Audit חקיקה:</b> סעיף 61 עוסק במעצר עד הכרעת הדין. לאחר הכרעת דין מרשיעה יש להבחין בין מגבלת המעצר שלפני ההכרעה לבין הסמכות הדיונית להמשך מעצר עד גזר הדין.</div>","lesson":"extra","status":"הרחבה — לא מהקלטת שיעור 8","lessons":["extra"]},{"id":"bodies","tag":"7","title":"גופי התביעה — סעיף 60 (נלמד בשיעור 2)","html":"\n      <div class=\"eyebrow\">חלוקת עבודה</div>\n      <h2>גופי התביעה — חלוקת עבודה לפי סעיף 60</h2>\n      <ul>\n        <li><b>הפרקליטות</b> — פשע חמור (רצח, אונס, שוחד, ביטחוני, צווארון לבן) + עוון רגיש ציבורית.</li>\n        <li><b>התביעה המשטרתית</b> — פשע קל ורוב העוון/חטא.</li>\n      </ul>\n      <p>פרקליט המחוז רשאי לחרוג מהחלוקה — לא פוסל את ההליך.</p>\n      <p><b>חוק ההמלצות:</b> איסור המלצה בכתב להעמדה לדין, וחובת סיכום תשתית ראייתית (עם חריגים לכל אחד).</p>\n      <button class=\"expand-link\" data-topic=\"bodies\">🔎 קריאה מורחבת</button>\n    ","lesson":"2","status":"אומת מול תמלול שיעור 2","lessons":["2"]},{"id":"hearing","tag":"8","title":"זכות השימוע — סעיף 60א (נלמד בשיעור 2)","html":"\n      <div class=\"eyebrow\">זכויות החשוד</div>\n      <h2>חובת היידוע וזכות השימוע — סעיף 60א</h2>\n      <p>בעבירת פשע בלבד — מכתב יידוע. שימוע <b>בכתב תוך 30 יום = חובה</b>; בעל־פה = רשות.</p>\n      <p>חריגים לחובת יידוע: מעצר, מניעה ביטחונית, אלימות במשפחה/עבירות מין במשפחה.</p>\n      <div class=\"callout case-callout\"><span class=\"callout-title\">קשור לפסק דין</span><button class=\"case-link\" data-case=\"5\">⚖ שמואל נגד היועץ המשפטי לממשלה (2008)</button></div>\n      <button class=\"expand-link\" data-topic=\"hearing\">🔎 קריאה מורחבת</button>\n    ","lesson":"2","status":"אומת מול תמלול שיעור 2","lessons":["2"]},{"id":"closure","tag":"9","title":"עילות סגירת תיק — סעיף 62 (נלמד בשיעור 2)","html":"\n      <div class=\"eyebrow\">חסד\"פ</div>\n      <h2>עילות סגירת תיק — סעיף 62</h2><div class=\"callout case-callout\"><span class=\"callout-title\">קשור לפסק דין</span><button class=\"case-link\" data-case=\"48\">⚖ יונה יהב נגד פרקליטות המדינה</button></div><div class=\"callout case-callout\"><span class=\"callout-title\">קשור לפסק דין</span><button class=\"case-link\" data-case=\"54\">⚖ בנימין אייבי נגד היועץ המשפטי לממשלה</button></div>\n      <ul>\n        <li><b>חוסר ראיות מספיקות</b> — משאירה רישום פלילי.</li>\n        <li><b>נסיבות העניין</b> (\"עילת הקומבינה\") — משאירה רישום פלילי, וטעונה אישור גורם בכיר אחד: פרקליט המחוז (או פרקליט בכיר שהוסמך לכך) בתיק פרקליטותי, או ראש יחידת התביעות במשטרה (או תובע משטרתי בכיר) בתיק משטרתי.</li>\n        <li><b>חוסר אשמה</b> — סגירה שמזכה את החשוד לחלוטין; זהו המקרה היחיד שבו הרישום נמחק ממרשם המשטרה.</li>\n      </ul>\n      <p><b>חשוב להבחין:</b> \"סגירת תיק בהסדר\" (סגירה מותנית לפי סעיף 67א, לאחר תשלום/שירות לתועלת הציבור/תקופת מבחן) אינה \"עסקת טיעון\" — עסקת טיעון היא הסדר במסגרת כתב אישום שהוגש (הודאה תמורת אישום/עונש מוסכם), ואילו סגירה בהסדר מונעת מלכתחילה הגשת כתב אישום. בלבול בין השניים הוא טעות נפוצה (גם בקרב עורכי דין, לדברי המרצה) — יש להיזהר ממנה במבחן.</p>\n      <p><b>הודעה למתלונן ולחשוד:</b> על הרשות להודיע בכתב על החלטה שלא להעמיד לדין — למתלונן בכל מקרה, ולחשוד/לנאשם בנוסף אם התיק כבר הגיע לטיפול התביעה. ניתן לפנות בבקשה לעיון חוזר, ובסופו של דבר לעתור לבג\"ץ — אך היקף ההתערבות של בג\"ץ בהחלטות סגירת תיק צר מאוד ומוגבל למקרים חריגים של החלטה בלתי סבירה באופן קיצוני.</p>\n      <div class=\"callout case-callout\"><span class=\"callout-title\">קשור לפסקי דין</span><button class=\"case-link\" data-case=\"6\">⚖ נוה</button> <button class=\"case-link\" data-case=\"24\">⚖ אפל</button></div>\n      <button class=\"expand-link\" data-topic=\"closure\">🔎 קריאה מורחבת</button>\n    <div class=\"callout\" style=\"background:#fff;border:1px solid #dce2e6\"><div class=\"eyebrow\"> =\"11\">להרשעה בפועל</text>\n\n  <rect x=\"350\" y=\"127\" width=\"220\" height=\"92\" rx=\"8\" fill=\"#edf4f1\" stroke=\"#457462\" stroke-width=\"1.5\"/>\n  <text x=\"460\" y=\"155\" text-anchor=\"middle\" fill=\"#202a37\" font-size=\"14\" font-weight=\"700\">נסיבות העניין</text>\n  <text x=\"460\" y=\"175\" text-anchor=\"middle\" fill=\"#202a37\" font-size=\"13\">(\"עילת הקומבינה\")</text>\n  <text x=\"460\" y=\"198\" text-anchor=\"middle\" fill=\"#607083\" font-size=\"11\">טעונה אישור גורם בכיר</text>\n  <text x=\"460\" y=\"214\" text-anchor=\"middle\" fill=\"#607083\" font-size=\"11\">אחד (פרקליט מחוז / ראש יחידה)</text>\n\n  <rect x=\"660\" y=\"127\" width=\"220\" height=\"92\" rx=\"8\" fill=\"#edf4f1\" stroke=\"#457462\" stroke-width=\"1.5\"/>\n  <text x=\"770\" y=\"155\" text-anchor=\"middle\" fill=\"#202a37\" font-size=\"14\" font-weight=\"700\">חוסר אשמה</text>\n  <text x=\"770\" y=\"198\" text-anchor=\"middle\" fill=\"#607083\" font-size=\"11\">זיכוי מלא של</text>\n  <text x=\"770\" y=\"214\" text-anchor=\"middle\" fill=\"#607083\" font-size=\"11\">החשוד</text>\n\n  <line x1=\"150\" y1=\"219\" x2=\"150\" y2=\"249\" stroke=\"#a98543\" stroke-width=\"2\" marker-end=\"url(#ah2)\"/>\n  <line x1=\"460\" y1=\"219\" x2=\"460\" y2=\"249\" stroke=\"#a98543\" stroke-width=\"2\" marker-end=\"url(#ah2)\"/>\n  <line x1=\"770\" y1=\"219\" x2=\"770\" y2=\"249\" stroke=\"#a98543\" stroke-width=\"2\" marker-end=\"url(#ah2)\"/>\n\n  <rect x=\"40\" y=\"251\" width=\"220\" height=\"56\" rx=\"8\" fill=\"#faf8f3\" stroke=\"#a98543\" stroke-width=\"1.5\"/>\n  <text x=\"150\" y=\"284\" text-anchor=\"middle\" fill=\"#202a37\" font-size=\"13\" font-weight=\"700\">משאירה רישום פלילי</text>\n\n  <rect x=\"350\" y=\"251\" width=\"220\" height=\"56\" rx=\"8\" fill=\"#faf8f3\" stroke=\"#a98543\" stroke-width=\"1.5\"/>\n  <text x=\"460\" y=\"284\" text-anchor=\"middle\" fill=\"#202a37\" font-size=\"13\" font-weight=\"700\">משאירה רישום פלילי</text>\n\n  <rect x=\"660\" y=\"251\" width=\"220\" height=\"56\" rx=\"8\" fill=\"#faf8f3\" stroke=\"#c0392b\" stroke-width=\"1.5\"/>\n  <text x=\"770\" y=\"278\" text-anchor=\"middle\" fill=\"#202a37\" font-size=\"13\" font-weight=\"700\">הרישום נמחק לחלוטין</text>\n  <text x=\"770\" y=\"296\" text-anchor=\"middle\" fill=\"#202a37\" font-size=\"11\">(המקרה היחיד למחיקה)</text>\n\n  <rect x=\"60\" y=\"345\" width=\"800\" height=\"105\" rx=\"10\" fill=\"#142641\"/>\n  <text x=\"460\" y=\"372\" text-anchor=\"middle\" fill=\"#faf8f3\" font-size=\"14\" font-weight=\"700\">חשוב להבחין: \"סגירת תיק בהסדר\" (סעיף 67א) ≠ \"עסקת טיעון\"</text>\n  <text x=\"460\" y=\"396\" text-anchor=\"middle\" fill=\"#faf8f3\" font-size=\"12.5\">סגירה בהסדר מונעת מלכתחילה הגשת כתב אישום (מסלול חלופי, ולא עילה מ-3 העילות שלעיל)</text>\n  <text x=\"460\" y=\"418\" text-anchor=\"middle\" fill=\"#faf8f3\" font-size=\"12.5\">עסקת טיעון היא הסדר בתוך הליך שכתב אישום כבר הוגש בו (הודאה תמורת אישום/עונש מוסכם)</text>\n  <text x=\"460\" y=\"440\" text-anchor=\"middle\" fill=\"#d8c79a\" font-size=\"11.5\">בלבול נפוץ בין השניים — גם בקרב עורכי דין, לדברי המרצה</text>\n</svg></div>","lesson":"2","status":"אומת מול תמלול שיעור 2","lessons":["2"]},{"id":"appeal","tag":"10","title":"מסלול העררים — סעיפים 64–65 (נלמד בשיעור 3)","html":"\n      <div class=\"eyebrow\">זכויות המתלונן</div>\n      <h2>מסלול העררים — סעיפים 64–65</h2>\n      <p>ערר בכתב תוך <b>60 יום</b> מהודעת הסגירה.</p>\n      <ul>\n        <li>גוף חוקר/תובע משטרתי → פרקליט המחוז / מנהל תחום עררים</li>\n        <li>פרקליט מחוז/מדינה, עילה מקצועית → פרקליט המדינה</li>\n        <li>פרקליט מחוז/מדינה, עילת מדיניות → היועמ\"ש</li>\n        <li>פרקליט המדינה עצמו → היועמ\"ש</li>\n      </ul>\n      <p><b>אין לערור פעמיים.</b> חשוד לא מקבל הודעה אוטומטית על ערר, אלא רק אם שוקלים לקבלו.</p>\n      <button class=\"expand-link\" data-topic=\"appeal\">🔎 קריאה מורחבת</button>\n    <div class=\"callout warn\"><span class=\"callout-title\">דגש חובה למבחן</span><p>ככלל אין מגבלת זמן להחלטה בערר — <b>למעט בעבירות אלימות מסוג פשע</b>, שם ההחלטה חייבת להימסר למתלונן תוך 6 חודשים מהגשת הערר, אלא אם קיימים טעמים מיוחדים. גם לאחר \"אין ערר על ערר\", נותרת אפשרות לעתור לבג\"ץ.</p></div><div class=\"callout\" style=\"background:#fff;border:1px solid #dce2e6\"><div class=\"eyebrow\">תרשים זרימה</div>\n<h3>מסלול הערר — למי מגישים?</h3>\n<svg viewBox=\"0 0 920 560\" role=\"img\" aria-label=\"תרשים זרימה של מסלול הערר לפי גורם הסגירה\" style=\"width:100%;height:auto;max-width:820px;display:block;margin:0 auto;font-family:Assistant,Arial,sans-serif\" xmlns=\"http://www.w3.org/2000/svg\">\n  <defs>\n    <marker id=\"arrowhead\" markerWidth=\"8\" markerHeight=\"8\" refX=\"4\" refY=\"4\" orient=\"auto\">\n      <path d=\"M0,0 L8,4 L0,8 Z\" fill=\"#142641\"/>\n    </marker>\n  </defs>\n  <rect x=\"310\" y=\"16\" width=\"300\" height=\"60\" rx=\"10\" fill=\"#142641\"/>\n  <text x=\"460\" y=\"52\" text-anchor=\"middle\" fill=\"#faf8f3\" font-size=\"19\" font-weight=\"600\">מי החליט לסגור את התיק?</text>\n\n  <line x1=\"460\" y1=\"76\" x2=\"460\" y2=\"105\" stroke=\"#142641\" stroke-width=\"2\"/>\n  <line x1=\"460\" y1=\"105\" x2=\"115\" y2=\"105\" stroke=\"#142641\" stroke-width=\"2\"/>\n  <line x1=\"460\" y1=\"105\" x2=\"345\" y2=\"105\" stroke=\"#142641\" stroke-width=\"2\"/>\n  <line x1=\"460\" y1=\"105\" x2=\"575\" y2=\"105\" stroke=\"#142641\" stroke-width=\"2\"/>\n  <line x1=\"460\" y1=\"105\" x2=\"805\" y2=\"105\" stroke=\"#142641\" stroke-width=\"2\"/>\n  <line x1=\"115\" y1=\"105\" x2=\"115\" y2=\"130\" stroke=\"#142641\" stroke-width=\"2\" marker-end=\"url(#arrowhead)\"/>\n  <line x1=\"345\" y1=\"105\" x2=\"345\" y2=\"130\" stroke=\"#142641\" stroke-width=\"2\" marker-end=\"url(#arrowhead)\"/>\n  <line x1=\"575\" y1=\"105\" x2=\"575\" y2=\"130\" stroke=\"#142641\" stroke-width=\"2\" marker-end=\"url(#arrowhead)\"/>\n  <line x1=\"805\" y1=\"105\" x2=\"805\" y2=\"130\" stroke=\"#142641\" stroke-width=\"2\" marker-end=\"url(#arrowhead)\"/>\n\n  <rect x=\"15\" y=\"132\" wid 3"]},{"id":"conditional","tag":"11","title":"ההסדר המותנה — סעיפים 67א–ו (נלמד בשיעור 3)","html":"\n      <div class=\"eyebrow\">מסלול חלופי</div>\n      <h2>ההסדר המותנה — סעיפים 67א–ו</h2>\n      <p>סגירת תיק ללא כתב אישום, בתמורה להודאה ותנאים שיקומיים.</p>\n      <ul>\n        <li>לפי המסגרת שהמרצה לימד: ראיות מספיקות; חטא/עוון; העונש המתאים אינו כולל מאסר בפועל; אין תיקים תלויים ועומדים ועבר נקי בחמש השנים שקדמו לעבירה, לרבות הסדרים קודמים</li>\n      </ul>\n      <p>חובת חשיפה מיוחדת של טיוטת כתב האישום <b>לפני</b> הגשתו. הפרה → כתב אישום מקורי, אך בלי בקשת מאסר בפועל.</p>\n      <button class=\"expand-link\" data-topic=\"conditional\">🔎 קריאה מורחבת</button>\n    <div class=\"callout warn\"><span class=\"callout-title\">דגש חובה למבחן — תקרות כספיות וזמן</span><p>תשלום לאוצר המדינה במסגרת הסדר מותנה מוגבל עד <b>29,200 ₪</b> — תקרה זו חלה גם כשההסדר כולל כמה עבירות, וגם כשיש כמה חשודים באותו תיק (התקרה משותפת, לא לכל אחד בנפרד). פיצוי לנפגע העבירה מוגבל בנפרד עד 29,200 ₪, לתשלום בפריסה שלא תעלה על שנה. תוקף ההסדר עצמו הוא שנה אחת (עד 18 חודשים במקרים מיוחדים בהמלצת קצין מבחן). למתלונן <b>אין</b> זכות להגיש ערר על סגירת תיק בהסדר.</p></div><div class=\"callout\" style=\"background:#fff;border:1px solid #dce2e6\"><div class=\"eyebrow\">תרשים זרימה</div>\n<h3>תנאי הזכאות להסדר מותנה — סעיפים 67א–ו</h3>\n<svg viewBox=\"0 0 920 520\" role=\"img\" aria-label=\"תרשים תנאי הסף המצטברים לזכאות להסדר מותנה, תקרות כספיות ומועדים, ותוצאת הפרה\" style=\"width:100%;height:auto;max-width:820px;display:block;margin:0 auto;font-family:Assistant,Arial,sans-serif\" xmlns=\"http://www.w3.org/2000/svg\">\n  <defs>\n    <marker id=\"ah4\" markerWidth=\"8\" markerHeight=\"8\" refX=\"4\" refY=\"4\" orient=\"auto\">\n      <path d=\"M0,0 L8,4 L0,8 Z\" fill=\"#142641\"/>\n    </marker>\n  </defs>\n\n  <rect x=\"290\" y=\"14\" width=\"340\" height=\"52\" rx=\"10\" fill=\"#142641\"/>\n  <text x=\"460\" y=\"46\" text-anchor=\"middle\" fill=\"#faf8f3\" font-size=\"16\" font-weight=\"700\"> rray=\"4 3\"/>\n  <text x=\"460\" y=\"497\" text-anchor=\"middle\" fill=\"#202a37\" font-size=\"13\" font-weight=\"700\">הפרה ← כתב אישום מקורי (בלי בקשת מאסר בפועל)</text>\n</svg></div>","lesson":"3","status":"תנאי הסף והעיון נבדקו; יתר ההרחבה עדיין בביקורת","lessons":["3"],"source":"שיעור 3.mp3 — הסבר המרצה על סגירת תיק בהסדר, תנאי הסף והעיון לפני חתימה"},{"id":"kanzi","tag":"12","title":"עדות שותפים — מקנזי לביטול הכלל","html":"<h2>עדות שותף: קנזי והשינוי בהלכה</h2><p><b>הבחנה מכרעת:</b> הלכת קנזי היא נקודת המוצא ההיסטורית, לא סוף ההתפתחות. בבג״ץ 11339/05 בוטל הכלל החוסם ככלל העדת שותף שמשפטו הנפרד תלוי ועומד.</p><p>הכלל שנקבע: ניתן להעידו; דחיית העדות עד תום משפטו אפשרית במקרים חריגים ביותר, מטעמים שיירשמו. אין לערבב זאת עם נאשמים באותו כתב אישום וההסדר שבסעיף 155.</p>","lesson":"3","status":"תוקן מול פסק הדין","source":"מדינת ישראל נ׳ בית המשפט המחוזי באר שבע 11339-05.pdf — ההכרעה הסופית ודעת הנשיאה ביניש, פסקה 3","lessons":["3","7"]}]},{"group":"שלב 2: כתב אישום וקדם־משפט","items":[{"id":"structure","tag":"13","title":"מבנה כתב האישום — סעיף 85 (נלמד בשיעור 4)","html":"\n      <div class=\"eyebrow\">חסד\"פ</div>\n      <h2>מבנה כתב האישום — סעיף 85</h2>\n      <ul>\n        <li>בית משפט מוסמך, מדינת ישראל כמאשימה, פרטי הנאשם</li>\n        <li>פרק העובדות (עובדות בלבד, לא ראיות)</li>\n        <li>הוראות החיקוק</li>\n        <li><b>רשימת עדי תביעה — סגורה וקשיחה</b>, כולל שוטרים טכניים</li>\n      </ul>\n      <button class=\"expand-link\" data-topic=\"structure\">🔎 קריאה מורחבת</button>\n    ","lesson":"4","status":"תוכן קיים — טרם הושלם אימות פרטני","lessons":["4"]},{"id":"amend","tag":"14","title":"תיקון כתב האישום — סעיף 92 (נלמד בשיעור 4)","html":"\n      <div class=\"eyebrow\">קו פרשת המים</div>\n      <h2>תיקון כתב האישום — סעיף 92</h2>\n      <p><b>לפני הקראה</b> — תיקון חופשי. <b>אחרי הקראה</b> — בקשה רשמית + הזדמנות סבירה להתגונן.</p>\n      <button class=\"expand-link\" data-topic=\"amend\">🔎 קריאה מורחבת</button>\n    ","lesson":"4","status":"תוכן קיים — טרם הושלם אימות פרטני","lessons":["4"]},{"id":"joinder","tag":"15","title":"צירוף אישומים ונאשמים — 86-87 (נלמד בשיעור 4)","html":"\n      <div class=\"eyebrow\">יעילות דיונית</div>\n      <h2>צירוף אישומים ונאשמים — 86–87</h2>\n      <p>צירוף לפי עובדות משותפות/דומות, או שותפות בעבירה.</p>\n      <div class=\"callout case-callout\"><span class=\"callout-title\">קשור לפסק דין</span><button class=\"case-link\" data-case=\"10\">⚖ סוסן (1995) — סמכות נגררת</button></div>\n      <button class=\"expand-link\" data-topic=\"joinder\">🔎 קריאה מורחבת</button>\n    ","lesson":"4","status":"תוכן קיים — טרם הושלם אימות פרטני","lessons":["4"]},{"id":"withdraw","tag":"16","title":"חזרה מכתב אישום — סעיף 94 (נלמד בשיעור 4)","html":"\n      <div class=\"eyebrow\">חסד\"פ</div>\n      <h2>חזרה מכתב אישום — סעיף 94</h2>\n      <p><b>לפני תשובה</b> — ביטול בלבד. <b>אחרי תשובה</b> — זיכוי מוחלט (או ביטול בהסכמה, עם דרישת אישור היועמ\"ש להגשה מחדש).</p>\n      <button class=\"expand-link\" data-topic=\"withdraw\">🔎 קריאה מורחבת</button>\n    <div class=\"callout warn\"><span class=\"callout-title\">דגש חובה למבחן — החריג היחיד למעשה בית דין</span><p>מעשה בית דין (זיכוי/הרשעה סופיים) חוסם הגשת כתב אישום חדש על אותן עובדות — <b>למעט חריג יחיד ובלעדי: מוות המתלונן כתוצאה מהעבירה</b>. אם נגרם למתלונן מוות בעקבות המעשה (למשל לאחר הרשעה בחבלה/ניסיון רצח), ניתן להגיש כתב אישום חדש בעבירת רצח, חרף מעשה בית הדין הקיים. כמו כן: הסכמה לביטול כתב אישום (ביטול בהסכמה) אינה יכולה להיות מותנית — \"אין דבר כזה\" הסכמה על תנאי.</p></div>","lesson":"4","status":"תוכן קיים — טרם הושלם אימות פרטני","lessons":["4"]},{"id":"defendant","tag":"17","title":"מחשוד לנאשם (נלמד בשיעור 5)","html":"\n      <div class=\"eyebrow\">מעמד</div>\n      <h2>מחשוד לנאשם</h2>\n      <p>עם הגשת כתב האישום למזכירות ביהמ\"ש — החשוד הופך מיידית ל\"נאשם\".</p>\n    ","lesson":"5","status":"תוכן קיים — טרם הושלם אימות פרטני","lessons":["5"]},{"id":"review","tag":"18","title":"זכות העיון — סעיף 74 (נלמד בשיעור 5)","html":"\n      <div class=\"eyebrow\">זכויות הנאשם</div>\n      <h2>זכות העיון בחומר חקירה — סעיף 74</h2><div class=\"callout case-callout\"><span class=\"callout-title\">קשור לפסק דין</span><button class=\"case-link\" data-case=\"42\">⚖ מדינת ישראל נגד רפי פרידן</button></div>\n      <p>קמה עם הגשת כתב האישום. חלה <b>רק בפשע/עוון</b>, לא בחטא.</p>\n      <p>כשמסרבים לחשוף: בקשה לביהמ\"ש → ערר יחיד לערכאה בכירה → 3 אפשרויות (לחשוף / לא להשתמש כראיה / לחזור מהאישום).</p>\n      <div class=\"callout case-callout\"><span class=\"callout-title\">קשור לפסק דין</span><button class=\"case-link\" data-case=\"5\">⚖ שמואל (2008)</button></div>\n      <button class=\"expand-link\" data-topic=\"review\">🔎 קריאה מורחבת</button>\n    <h3>פומביות הדיון ואיסור פרסום חומרי חקירה</h3><p>פומביות הדיון וחופש הביטוי אינם מוחלטים. בבקשה לפרסם חומרי חקירה או תיעוד מהליך פלילי יש לאזן בין עניין הציבור ופומביות ההליך לבין פרטיות, שם טוב, הגינות ההליך והחשש להשפעה על עדים או לזיהום המשפט. ככל שהחקירה או המשפט פעילים והפרסום עלול לפגוע ממשית בהליך, ניתן למנוע או לעכב את הפרסום מכוח סעיף 13 לחוק חקירת חשודים (איסור פרסום תיעוד חזותי/קולי של חקירה ללא רשות בית המשפט) וההסדרים הכלליים שנלמדו. התרומה של עניין תורג׳מן ורשות השידור היא יישום אותו איזון על פרסום תקשורתי של חומרי חקירה, ולא יצירת כלל נפרד לכל אחד מהם.</p>","lesson":"5","status":"הורחב מול ניתוחי פסקי דין מקבוצה C","lessons":["5"],"source":"מדינת ישראל נ' המשיבים רון תורג'מן.pdf — ניתוח קבוצה C; רשות השידור נ' מדינת ישראל.pdf — ניתוח קבוצה C"},{"id":"reading","tag":"19","title":"הקראת כתב האישום והסכמות (נלמד בשיעור 5)","html":"<div class=\"eyebrow\">מצגת 2 · סעיפים 74–84</div><h2>עיון בחומר החקירה</h2><p>לאחר כתב אישום בעוון או בפשע זכאים הנאשם וסנגורו לעיין ולהעתיק את חומר החקירה. הרשימה הנלווית כוללת גם ציון קיומם של חומר שאינו חומר חקירה, חומר חסוי וחומר מודיעיני, עם סוג, נושא ומועד — בכפוף לחיסיון.</p><p>הסייגים שנלמדו: ראיות הזמה, עניינים פורמליים שאינם מהותיים, חומר חסוי, והסדרים מיוחדים בבגידה או ריגול. אם לא ניתנה הזדמנות סבירה לעיין, סעיף 77(א) מונע מן התובע להגיש את הראיה או להשמיע את העד, אלא אם ויתרו על כך.</p><p>בקשת עיון נדונה ככלל בפני שופט אחד; ערר בזכות יוגש בתוך 30 ימים. לפי פרידן, יש מסלול ערר אחד בלבד.</p><h3>אמרת חוץ של עד — סעיף 10א לפקודת הראיות</h3><p>קבלת אמרת חוץ של עד אינה תחליף אוטומטי לעדות בבית המשפט. לפי המסגרת שנלמדה, נדרשים תנאים מצטברים: האמרה הוכחה במשפט; מוסר האמרה הוא עד במשפט וניתנה לצדדים הזדמנות לחקרו; והעדות בבית המשפט שונה בפרט מהותי מן האמרה, או שהעד מכחיש את תוכנה או טוען שאינו זוכר. לצד קבילות האמרה יש לבחון את משקלה ואת הראיות המחזקות.</p><p>תחבולת חקירה אינה נפסלת כשלעצמה. הגבול הוא פגיעה באוטונומיית הרצון החופשי או פגיעה חמורה בהגינות ההליך; אין לשכפל מכאן את מבחני החיפוש או את דוקטרינת יששכרוב.</p><div class=\"callout\"><b>השלמת Audit חקיקה:</b> ויתור על הקראה מחייב את ארבעת התנאים המצטברים המפורטים בשאלה המתוקנת; אין להציג את הכלל כשלושה תנאים בלבד.</div>","lesson":"5","status":"הורחב מול ניתוח פסק דין מקבוצה C","lessons":["5"],"source":"אלעוקה נ' מדינת ישראל.pdf — ניתוח קבוצה C"},{"id":"trial-open6","tag":"20","title":"תזכורת: פתיחת המשפט וזכויות הנאשם (נלמד בשיעור 6)","html":"<div class=\"eyebrow\">מצגת 3 · סעיפים 143–145</div><h2>פתיחת המשפט: הקראה והסכמות</h2><p>הכלל הוא שהמשפט נפתח בהקראת כתב האישום. הוויתור אפשרי רק בארבעה תנאים מצטברים: הנאשם מיוצג; הסנגור הודיע שקרא לנאשם את כתב האישום; הנאשם אישר זאת; והדברים נרשמו בפרוטוקול.</p><p>לאחר תחילת המשפט, כאשר הנאשם מיוצג, בית המשפט רשאי לברר הסכמות לעובדות ולקבילות מסמכים ומוצגים, לרבות הגשתם שלא באמצעות עדים (סעיף 144). לפי סעיף 145, בית המשפט יסביר לנאשם את זכויות ההגנה אם ראה צורך בכך.</p>","lesson":"6","status":"הורחב ואומת מול מצגת 3","lessons":["6"],"source":"דיון פלילי - מצגת שלישית - 234907.PDF, שקפים 1–35"},{"id":"prelim-claims","tag":"21","title":"טענות מקדמיות — סעיף 149 (נלמד בשיעור 6)","html":"<div class=\"eyebrow\">מצגת 3 · סעיפים 149–151</div><h2>טענות מקדמיות</h2><p>הרשימה שבסעיף 149 אינה סגורה. הטענה מועלית בתחילת המשפט, אך ככלל אפשר להעלותה גם בהמשך ואף בערעור. החריג: חוסר סמכות מקומית
