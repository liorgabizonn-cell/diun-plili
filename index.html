","סעיף 13 ממשיך לחול ונדרשת רשות בית המשפט, לפי נסיבות ההליך"],"correct":3,"explain":"תחולת סעיף 13 נמשכת ושיקול הדעת משתנה לפי הנסיבות.","id":"presentation5-06","topic":"body-search-identification","lesson":"extra","extra":false,"source":"דיון פלילי - מצגת חמישית - 236423.PDF"},{"q": "מי אחראי, ככלל, על הגשת כתב אישום בעבירת פשע חמורה (כגון רצח או שוחד) לפי חלוקת העבודה בסעיף 60?", "opts": ["התביעה המשטרתית בלבד", "הפרקליטות", "שוטר מהתחנה המקומית, ללא צורך באישור נוסף", "בית המשפט קובע לפי שיקול דעתו"], "correct": 1, "explain": "חלוקת העבודה לפי סעיף 60: הפרקליטות מטפלת בפשע חמור (רצח, אונס, שוחד, עבירות ביטחוניות וצווארון לבן) ובעוון רגיש ציבורית; התביעה המשטרתית מטפלת בפשע קל וברוב עבירות העוון/חטא.", "id": "mcq-51", "topic": "bodies", "lesson": "2", "extra": false},{"q": "פרקליט המחוז החליט לחרוג מחלוקת העבודה הרגילה בין הפרקליטות לתביעה המשטרתית ולטפל בתיק שבאופן רגיל מטופל ע\"י המשטרה. מה המשמעות המשפטית?", "opts": ["ההליך פסול מעיקרו", "פרקליט המחוז מוסמך לכך, והחריגה אינה פוסלת את ההליך", "יש צורך באישור היועץ המשפטי לממשלה מראש", "חייבים לעביר את התיק חזרה למשטרה"], "correct": 1, "explain": "פרקליט המחוז רשאי לחרוג מחלוקת העבודה שבסעיף 60, וחריגה כזו אינה פוסלת את ההליך הפלילי.", "id": "mcq-52", "topic": "bodies", "lesson": "2", "extra": false},{"q": "מהי אחת המגבלות המרכזיות שמטיל \"חוק ההמלצות\" (תיקון 60יא לחסד\"פ, 2018)?", "opts": ["איסור מוחלט על סגירת תיקים", "איסור המלצה בכתב להעמדה לדין, וחובת סיכום תשתית ראייתית (עם חריגים)", "חובת פרסום כל החלטות הפרקליטות באינטרנט", "ביטול תפקיד פרקליט המחוז"], "correct": 1, "explain": "חוק ההמלצות (תיקון 60יא, 2018) אוסר על המלצה בכתב להעמדה לדין ומטיל חובת סיכום תשתית ראייתית, בכפוף לחריגים.", "id": "mcq-53", "topic": "bodies", "lesson": "2", "extra": false},{"q": "חשוד בעבירת פשע ביקש לממש את זכות השימוע לפי סעיף 60א. מהי חובת הרשות כלפיו?", "opts": ["חובה לזמנו לשימוע בעל פה בלבד", "חובה לאפשר לו להשמיע טענותיו בכתב תוך 30 יום; שימוע בעל פה הוא בגדר רשות בלבד", "אין כל חובה, הכול שיקול דעת", "חובה לקיים שימוע תוך 7 ימים בלבד"], "correct": 1, "explain": "בעבירת פשע, שימוע בכתב תוך 30 יום הוא חובה; שימוע בעל פה נתון לשיקול דעת הרשות (רשות ולא חובה).", "id": "mcq-54", "topic": "hearing", "lesson": "2", "extra": false},{"q": "באילו מצבים אין חובת יידוע מוקדם של החשוד על זכות השימוע לפי סעיף 60א, למרות שמדובר בעבירת פשע?", "opts": ["כאשר החשוד עני ואינו מיוצג", "במקרים של מעצר, מניעה ביטחונית, או אלימות במשפחה/עבירות מין במשפחה", "כאשר מדובר בעבירת תנועה", "לעולם אין חריגים לחובת היידוע"], "correct": 1, "explain": "חריגי חובת היידוע: מעצר, מניעה ביטחונית, ואלימות במשפחה/עבירות מין במשפחה.", "id": "mcq-55", "topic": "hearing", "lesson": "2", "extra": false},{"q": "חלפו 30 הימים שניתנו לחשוד למימוש זכות השימוע בכתב, והוא לא פנה כלל. מה רשאית הרשות לעשות?", "opts": ["להמתין ללא הגבלת זמן עד שהחשוד יפנה", "להגיש כתב אישום גם ללא שהתקיימה בפועל זכות השימוע, שכן ניתנה לו ההזדמנות ולא נוצלה", "לסגור את התיק אוטומטית מחוסר ראיות", "לבטל את זכות השימוע לצמיתות לגבי כל תיק עתידי של אותו חשוד"], "correct": 1, "explain": "אם חלפו 30 הימים והחשוד לא פנה, ניתן להגיש כתב אישום גם בטרם מומשה בפועל זכות השימוע - שכן ההזדמנות למימושה כבר ניתנה.", "id": "mcq-56", "topic": "hearing", "lesson": "2", "extra": false},{"q": "מהם ארבעת התנאים המצטברים שמאפשרים לוותר על הקראת כתב האישום בפתיחת המשפט?", "opts": ["הנאשם מיוצג; הסנגור הודיע שקרא לנאשם את כתב האישום; הנאשם אישר זאת; והדברים נרשמו בפרוטוקול", "הנאשם מודה באשמה מראש בלבד", "התובע מסכים לוותר על הקראה", "אין צורך בתנאים - ניתן לוותר תמיד"], "correct": 0, "explain": "הוויתור על הקראת כתב האישום אפשרי רק בהתקיים 4 תנאים מצטברים: ייצוג, הודעת הסנגור שקרא לנאשם את כתב האישום, אישור הנאשם, ורישום בפרוטוקול.", "id": "mcq-57", "topic": "trial-open6", "lesson": "6", "extra": false},{"q": "לפי סעיף 145 לחסד\"פ, מתי בית המשפט מחויב להסביר לנאשם את זכויות ההגנה שלו?", "opts": ["בכל מקרה, ללא יוצא מן הכלל", "רק אם ראה בית המשפט צורך בכך", "רק אם הנאשם אינו מיוצג ובקש זאת", "לעולם לא - זהו תפקיד הסנגור בלבד"], "correct": 1, "explain": "לפי סעיף 145, בית המשפט יסביר לנאשם את זכויות ההגנה אם ראה צורך בכך - לא חובה גורפת בכל מקרה.", "id": "mcq-58", "topic": "trial-open6", "lesson": "6", "extra": false},{"q": "כאשר הנאשם מיוצג, מה רשאי בית המשפט לברר לפי סעיף 144, כדי לייעל את ניהול המשפט?", "opts": ["רק את זהות העדים", "הסכמות לעובדות ולקבילות מסמכים ומוצגים, לרבות הגשתם שלא באמצעות עדים", "רק את עמדת התביעה לעונש", "אין לבית המשפט כל סמכות בעניין זה"], "correct": 1, "explain": "לפי סעיף 144, בית המשפט רשאי לברר הסכמות לעובדות ולקבילות מסמכים ומוצגים, כולל הגשתם שלא באמצעות עדים.", "id": "mcq-59", "topic": "trial-open6", "lesson": "6", "extra": false},{"q": "מהו ההבדל בין \"פגם\" ל\"פסול\" בכתב אישום, לצורך טענה מקדמית לפי סעיף 149?", "opts": ["אין הבדל, אלו מונחים זהים", "\"פגם\" הוא השמטת פרט ענייני מכתב האישום; \"פסול\" הוא אי-עמידה בדרישת כשרות דיונית (כגון הגשה ע\"י תובע לא מוסמך)", "\"פגם\" חמור יותר מ\"פסול\"", "ההבחנה רלוונטית רק בערעור"], "correct": 1, "explain": "פגם = השמטת פרט ענייני מכתב האישום. פסול = אי-עמידה בדרישת כשרות דיונית, למשל כתב אישום שהוגש בידי תובע לא מוסמך.", "id": "mcq-60", "topic": "prelim-claims", "lesson": "6", "extra": false},{"q": "נאשם מעלה בשלב מאוחר של המשפט טענה מקדמית של חוסר סמכות מקומית. מה נדרש?", "opts": ["הטענה תידחה אוטומטית מחמת איחור", "נדרשת רשות בית המשפט להעלאתה בשלב מאוחר", "אין צורך ברשות - ניתן להעלותה בכל שלב באופן חופשי", "הטענה יכולה להיות מועלית רק בערעור"], "correct": 1, "explain": "טענת חוסר סמכות מקומית ופגם/פסול בכתב האישום, כשמועלית בשלב מאוחר, דורשת רשות בית המשפט - בשונה מרוב הטענות המקדמיות האחרות.", "id": "mcq-61", "topic": "prelim-claims", "lesson": "6", "extra": false},{"q": "התקבלה טענה מקדמית לפי סעיף 149. מהן התוצאות האפשריות שבית המשפט רשאי לתת?", "opts": ["זיכוי הנאשם באופן מיידי", "תיקון כתב האישום, ביטולו, או העברתו לבית משפט מוסמך - לא זיכוי", "מאסר על תנאי לנאשם", "חובה לפתוח בחקירה משטרתית חדשה"], "correct": 1, "explain": "קבלת טענה מקדמית מאפשרת לבית המשפט לתקן, לבטל, או להעביר לבית משפט מוסמך - אך לא לזכות את הנאשם.", "id": "mcq-62", "topic": "prelim-claims", "lesson": "6", "extra": false},{"q": "היכן מתקיימת הסמכות המקומית לדון בעבירה, ככלל?", "opts": ["רק במקום מגורי הנאשם", "במקום ביצוע העבירה או במקום מגורי הנאשם", "רק בבית המשפט בירושלים", "במקום מושבו של התובע"], "correct": 1, "explain": "הסמכות המקומית מתקיימת במקום ביצוע העבירה או מקום מגורי הנאשם.", "id": "mcq-63", "topic": "court-jurisdiction", "lesson": "6", "extra": false},{"q": "לא ידוע מקום ביצוע העבירה ולא מקום מגורי הנאשם. היכן תתקיים הסמכות המקומית?", "opts": ["בבית המשפט בירושלים אוטומטית", "במקום תפיסתו של הנאשם", "התיק נסגר מחוסר סמכות", "בבית המשפט שבו הוגשה התלונה הראשונה"], "correct": 1, "explain": "אם שני המקומות (ביצוע ומגורים) אינם ידועים - הסמכות המקומית היא במקום תפיסת הנאשם.", "id": "mcq-64", "topic": "court-jurisdiction", "lesson": "6", "extra": false},{"q": "היועץ המשפטי לממשלה קבע שאין בית משפט מוסמך לדון בעניין לפי הכללים הרגילים. היכן תתקיים הסמכות?", "opts": ["בבית המשפט בתל אביב, כברירת מחדל הארצית", "בירושלים", "ההליך מתבטל", "בבית המשפט האחרון שדן בנאשם בעבר"], "correct": 1, "explain": "כאשר היועץ המשפטי לממשלה קובע שאין בית משפט מוסמך לפי הכללים הרגילים, הסמכות תהיה בירושלים.", "id": "mcq-65", "topic": "court-jurisdiction", "lesson": "6", "extra": false},{"q": "מהו רף ההוכחה הנדרש בהליך פלילי, לעומת הליך אזרחי?", "opts": ["שניהם דורשים מאזן הסתברויות (50% ומעלה)", "פלילי: מעבר לספק סביר (ללא אחוז מספרי מוגדר בפסיקה). אזרחי: מאזן הסתברויות (50% ומעלה)", "פלילי: 90% ודאות. אזרחי: 70% ודאות", "אין הבדל של ממש בין הרפים"], "correct": 1, "explain": "ברף האזרחי נדרש מאזן הסתברויות (50% ומעלה, הלכה מפורשת). ברף הפלילי נדרש \"מעבר לספק סביר\" - ללא הגדרה מספרית קונקרטית בפסיקה.", "id":"mcq-66", "topic": "circles", "lesson": "1", "extra": false},{"q": "מהם שלושת המעגלים המרכיבים את התיק הפלילי?", "opts": ["חקירה, משפט, ערעור בלבד", "דיני העונשין (דין מהותי), דיני הראיות (קבילות ומשקל), וסדרי הדין (דין פרוצדורלי)", "משטרה, פרקליטות, בית משפט", "חשוד, נאשם, אסיר"], "correct": 1, "explain": "שלושת המעגלים: דיני העונשין (מה מותר/אסור ומה העונש), דיני הראיות (קבילות ומשקל), וסדרי הדין (כללי מעצר, חיפוש וניהול הדיון).", "id":"mcq-67", "topic": "circles", "lesson": "1", "extra": false},{"q": "מהו הסעיף המהווה חריג לשיטה האדברסרית בישראל, ומה הוא מאפשר?", "opts": ["סעיף 74 - מאפשר לחשוד לעיין בחומר החקירה", "סעיף 167 - מאפשר לבית המשפט להביא ראיה מיוזמתו לאחר שהצדדים סיימו להביא ראיותיהם", "סעיף 155 - מאפשר צירוף נאשמים", "אין חריגים לשיטה האדברסרית בישראל"], "correct": 1, "explain": "סעיף 167 מאפשר לבית המשפט להביא ראיה מיוזמתו, לאחר שהצדדים סיימו את הבאת ראיותיהם, במקרים המתאימים - חריג לעיקרון שהצדדים (ולא בית המשפט) מנהלים את הבאת הראיות.", "id":"mcq-68", "topic": "adversarial", "lesson": "1", "extra": false},{"q": "האם קיימת מדינה הפועלת על פי מודל אדברסרי או אינקוויזיטורי \"טהור\" לחלוטין?", "opts": ["כן, ארה\"ב פועלת במודל אדברסרי טהור", "לא - בכל מדינה יש שילוב, ובישראל השיטה בעיקרה אדברסרית לצד חריגים", "כן, כל מדינות אירופה פועלות במודל אינקוויזיטורי טהור", "השאלה אינה רלוונטית למשפט הישראלי"], "correct": 1, "explain": "המרצה הדגישה שאין מדינה הפועלת לפי מודל טהור לחלוטין; בישראל השיטה בעיקרה אדברסרית, לצד חריגים כמו סעיף 167.", "id":"mcq-69", "topic": "adversarial", "lesson": "1", "extra": false},{"q": "מה ההבדל בין הגישה האמריקאית (\"פירות העץ המורעל\") לגישה הישראלית (הלכת יששכרוב) בפסילת ראיות שהושגו שלא כדין?", "opts": ["אין הבדל - שתי המערכות פוסלות אוטומטית", "בארה\"ב פסילה אוטומטית; בישראל פסילה פסיקתית יחסית לפי שיקול דעת ואיזון אינטרסים", "בישראל הפסילה תמיד אוטומטית, בארה\"ב תלוית שיקול דעת", "שתי המערכות אינן פוסלות ראיות באופן עקרוני"], "correct": 1, "explain": "בארה\"ב: דוקטרינת \"פירות העץ המורעל\" - פסילה אוטומטית. בישראל, לפי הלכת יששכרוב: פסילה פסיקתית יחסית, הנתונה לשיקול דעת בית המשפט לפי איזון אינטרסים.", "id":"mcq-70", "topic": "packer", "lesson": "1", "extra": false},{"q": "מהם שני מודלי המשפט הפלילי של הרברט פקר?", "opts": ["מודל אשמה ומודל חפות", "מודל מיגור הפשיעה (המטרה מקדשת את האמצעים) ומודל ההליך הראוי (זכויות הנאשם עליונות)", "מודל אדברסרי ומודל אינקוויזיטורי", "מודל מהותי ומודל פרוצדורלי"], "correct": 1, "explain": "פקר הציג שני מודלים מנוגדים: מודל מיגור הפשיעה, שבו המטרה (תפיסת עבריינים) מקדשת את האמצעים; ומודל ההליך הראוי, שבו זכויות הנאשם עליונות.", "id":"mcq-71", "topic": "packer", "lesson": "1", "extra": false},{"q": "מהם שני התנאים המצטברים הנדרשים כדי להרשיע נאשם, לפי סעיף 184, בעבירה שהתגלתה מן העובדות אך שונה מזו שבכתב האישום?", "opts": ["הודאת הנאשם, ואישור התובע", "ניתנה לנאשם הזדמנות סבירה להתגונן מפני העבירה האחרת; ולא יוטל עליו עונש חמור מזה שניתן היה להטיל בשל העבירה המקורית", "אישור בית המשפט העליון, ופרסום פומבי", "אין תנאים - ניתן להרשיע תמיד"], "correct": 1, "explain": "סעיף 184 דורש שני תנאים מצטברים: הזדמנות סבירה להתגונן מפני העבירה האחרת, ואי-החמרת העונש מעבר למה שניתן היה להטיל בשל העבירה המקורית.", "id":"mcq-72", "topic": "sec184", "lesson": "1", "extra": false},{"q": "מדוע, לפי ההסבר שניתן בשיעור, לא ניתן היה להשתמש בסעיף 184 באופן פשוט בעניין דמיאניוק?", "opts": ["כי דמיאניוק כפר בהיותו באושוויץ", "כי דמיאניוק התגונן לאורך המשפט מפני האישום המסוים שיוחס לו (איואן האיום), ולא מפני האישום החלופי - ולכן לא ניתנה לו הזדמנות סבירה להתגונן מפני האחרון", "כי סעיף 184 חל רק על עבירות רכוש", "כי דמיאניוק לא היה מיוצג"], "correct": 1, "explain": "ההסבר: העובדה שהוכחה עבירה אחרת אינה מספיקה כשלעצמה - נדרשת גם הזדמנות סבירה להתגונן מפני האישום החלופי, שלא ניתנה לדמיאניוק.", "id":"mcq-73", "topic": "sec184", "lesson": "1", "extra": false},{"q": "עבירה שאין לה תקופת מאסר קצובה בחוק - כיצד היא מסווגת לפי סעיף 42?", "opts": ["כפשע אוטומטית", "כחטא אוטומטית", "כעוון אוטומטי, בהתאם לענישה של שנה אחת שנקבעה כברירת מחדל", "אינה ניתנת לסיווג"], "correct": 2, "explain": "לפי סעיף 42: כאשר אין תקופה קצובה בחוק, ברירת המחדל היא שנת מאסר אחת - מה שמסווג את העבירה כעוון אוטומטית.", "id":"mcq-74", "topic": "classify", "lesson": "1", "extra": false},{"q": "מה חובת המשטרה כאשר מוגשת אליה תלונה על עבירה, ללא קשר לחומרתה?", "opts": ["אין כל חובה לרשום תלונות קלות", "חובה מוחלטת לרשום כל תלונה שמוגשת", "חובה לרשום רק תלונות על עבירת פשע", "חובה לרשום רק אם יש ראיות ראשוניות"], "correct": 1, "explain": "לפי סעיף 59, קיימת חובה מוחלטת לרשום כל תלונה שמוגיעה למשטרה, ללא תלות בסיווג העבירה או בסיכוייה.", "id":"mcq-75", "topic": "sec59", "lesson": "1", "extra": false},{"q": "מה קבע בג\"ץ 11339/05 (מדינת ישראל נ׳ בית המשפט המחוזי באר שבע) ביחס להלכת קנזי בעניין עדות שותף?", "opts": ["אישרר את הלכת קנזי במלואה ללא שינוי", "ביטל את הכלל החוסם שהעדת שותף שמשפטו הנפרד תלוי ועומד - ניתן להעידו, ודחיית עדותו אפשרית רק במקרים חריגים ביותר מטעמים שיירשמו", "קבע שלעולם אין להעיד שותף שמשפטו תלוי ועומד", "ביטל את האפשרות להעיד שותפים לחלוטין"], "correct": 1, "explain": "בבג\"ץ 11339/05 בוטל הכלל שחסם ככלל העדת שותף שמשפטו הנפרד תלוי ועומד. הכלל החדש: ניתן להעידו; דחיית העדות עד תום משפטו אפשרית רק במקרים חריגים ביותר, מטעמים שיירשמו.", "id":"mcq-76", "topic": "kanzi", "lesson": "3", "extra": false},{"q": "מה כוללת \"רשימת עדי התביעה\" בכתב אישום, לפי סעיף 85, ומהו אופייה?", "opts": ["רשימה גמישה שניתן לשנותה בכל שלב", "רשימה סגורה וקשיחה, הכוללת גם שוטרים טכניים", "רשימה שאינה חלק מכתב האישום כלל", "רשימה המתעדכנת אוטומטית לפי הצורך במהלך המשפט"], "correct": 1, "explain": "רשימת עדי התביעה בכתב האישום היא רשימה סגורה וקשיחה - כוללת גם שוטרים \"טכניים\", ואינה ניתנת לשינוי חופשי.", "id":"mcq-77", "topic": "structure", "lesson": "4", "extra": false},{"q": "מהו ההבדל בדרישות לתיקון כתב אישום לפני הקראתו לעומת לאחריה?", "opts": ["אין הבדל - התיקון תמיד חופשי", "לפני ההקראה: תיקון חופשי. לאחר ההקראה: נדרשת בקשה רשמית + מתן הזדמנות סבירה להתגונן", "לפני ההקראה: נדרש אישור היועמ\"ש. לאחר ההקראה: תיקון חופשי", "תיקון כתב אישום אינו אפשרי בשום שלב"], "correct": 1, "explain": "לפני הקראת כתב האישום - התיקון חופשי. לאחר ההקראה - נדרשת בקשה רשמית לבית המשפט ומתן הזדמנות סבירה לנאשם להתגונן.", "id":"mcq-78", "topic": "amend", "lesson": "4", "extra": false},{"q": "מהי העילה המרכזית לצירוף אישומים או נאשמים לפי סעיפים 86-87?", "opts": ["נוחות מנהלית של בית המשפט בלבד", "עובדות משותפות/דומות, או שותפות בעבירה", "זהות שם משפחה בין הנאשמים", "בקשת הסנגור בלבד"], "correct": 1, "explain": "צירוף אישומים ונאשמים לפי סעיפים 86-87 מבוסס על עובדות משותפות או דומות, או על שותפות בביצוע העבירה.", "id":"mcq-79", "topic": "joinder", "lesson": "4", "extra": false},{"q":"מתלונן מעוניין להגיש ערר על החלטת קצין חקירות (משטרה) שלא להעמיד לדין. לאיזה גורם יוגש הערר?","opts":["ישירות ליועץ המשפטי לממשלה","לפרקליט המחוז או למנהל תחום עררים מפרקליטות המדינה","לבית המשפט העליון","לשר המשפטים"],"correct":1,"explain":"ערר על החלטת גוף חוקר/תובע משטרתי מוגש לפרקליט המחוז או למנהל תחום עררים מפרקליטות המדינה - בהתאם למי שקיבל את ההחלטה המקורית.","id":"mcq-80","topic":"appeal","lesson":"3","extra":false},{"q":"התקבלה החלטה בערר. המתלונן עדיין אינו מרוצה מהתוצאה. מה המצב המשפטי?","opts":["ניתן להגיש ערר נוסף על ההחלטה בערר","לא ניתן להגיש ערר נוסף (\"אין ערר על ערר\") - אך עדיין נותרת אפשרות לעתור לבג\"ץ","יש להגיש תלונה חדשה במשטרה","התיק נסגר לצמיתות ואין כל אפשרות פנייה נוספת"],"correct":1,"explain":"הכלל: לא ניתן להגיש ערר נוסף על החלטה שניתנה בערר. עם זאת, כפי שהודגש, נותרת אפשרות לעתור לבג\"ץ כמסלול נוסף.","id":"mcq-81","topic":"appeal","lesson":"3","extra":false},{"q":"מהם התנאים המצטברים שנדרשים, לפי המסגרת שנלמדה, לצורך סגירת תיק בהסדר מותנה?","opts":["הודאת החשוד בלבד מספיקה בכל מקרה","ראיות מספיקות; עבירת חטא/עוון; העונש המתאים אינו כולל מאסר בפועל; אין תיקים תלויים ועומדים ועבר נקי בחמש השנים שקדמו לעבירה","אישור בית המשפט העליון מראש","תשלום קנס מלא בלבד"],"correct":1,"explain":"התנאים המצטברים: ראיות מספיקות; חטא/עוון (לא פשע); העונש המתאים אינו כולל מאסר בפועל; ואין תיקים תלויים ועומדים + עבר נקי ב-5 השנים הקודמות (כולל הסדרים קודמים).","id":"mcq-82","topic":"conditional","lesson":"3","extra":false},{"q":"נאשם עדיין לא הגיש תשובתו לכתב האישום, והתביעה מבקשת לחזור בה מכתב האישום. מה התוצאה?","opts":["זיכוי מוחלט של הנאשם","ביטול כתב האישום בלבד (לא זיכוי)","אין אפשרות לחזור בשלב זה","הרשעה אוטומטית"],"correct":1,"explain":"חזרה מכתב אישום לפני מתן תשובת הנאשם מובילה לביטול בלבד - לא לזיכוי מוחלט.","id":"mcq-83","topic":"withdraw","lesson":"4","extra":false},{"q":"התביעה מבקשת לבטל כתב אישום בהסכמה, לאחר שהנאשם כבר השיב לאישום. מה נדרש לפני הגשה מחדש?","opts":["אין צורך בכל אישור נוסף","אישור היועץ המשפטי לממשלה להגשה מחדש","אישור שר המשפטים בלבד","המתנה של שנה לפחות"],"correct":1,"explain":"ביטול בהסכמה לאחר תשובת הנאשם דורש אישור היועץ המשפטי לממשלה כתנאי להגשה מחדש של כתב אישום.","id":"mcq-84","topic":"withdraw","lesson":"4","extra":false},{"q":"מהו ההבדל בין מסלול המעצר של סעיף 23(א) לסעיף 23(ב) לחוק המעצרים?","opts":["אין הבדל - שני הסעיפים זהים","23(א): חשד לעוון/פשע + עילת מעצר סטטוטורית. 23(ב): מסלול נפרד להבאה לתחנה בשל אי-ציות לעיכוב חוקי - אין לייבא אליו את תנאי 23(א)","23(א) חל רק על קטינים","23(ב) מבטל את הצורך בעילת מעצר"],"correct":1,"explain":"סעיף 23(א) דורש חשד לעוון/פשע ועילת מעצר סטטוטורית. סעיף 23(ב) הוא מסלול נפרד (אי-ציות לעיכוב חוקי) שאין לייבא אליו אוטומטית את תנאי 23(א).","id":"mcq-85","topic":"arrest-nowarrant","lesson":"extra","extra":false},{"q":"מהן הזכויות המרכזיות של עצור מיד עם מעצרו?","opts":["רק הזכות לשתוק","אזהרה, הסבר זכויות, מפגש עו\"ד ללא דיחוי (בכפוף לחריגי דחייה), והודעה לקרוב","רק הזכות למפגש עם עו\"ד תוך 48 שעות","אין לעצור זכויות עד להגשת כתב אישום"],"correct":1,"explain":"זכויות העצור המיידיות: אזהרה, הסבר זכויות, מפגש עם עו\"ד ללא דיחוי (עם חריגי דחייה מוגבלים), והודעה לקרוב משפחה.","id":"mcq-86","topic":"arrest-nowarrant","lesson":"extra","extra":false},{"q":"מהי תכליתו של \"מעצר גישור\" לפי סעיף 17(ד) לחוק המעצרים?","opts":["להאריך את זמן החקירה ללא הגבלה","לגשר על הזמן הטכני הדרוש להכנת כתב אישום ובקשת מעצר עד תום ההליכים - עד 5 ימים, בכפוף לתקרת 75 הימים הרגילה","להחליף את מעצר עד תום ההליכים לחלוטין","לאפשר המשך פעולות חקירה נוספות"],"correct":1,"explain":"מעצר גישור נועד רק לזמן הטכני הדרוש להכנת כתב אישום ובקשת מעצר עד תום ההליכים (עד 5 ימים), ואינו מסלול להמשך חקירה.","id":"mcq-87","topic":"arrest-bridge","lesson":"extra","extra":false},{"q":"מהם שני פרקי הזמן המרכזיים שלאחריהם עשוי עצור להשתחרר אוטומטית, בכפוף להארכות בית המשפט העליון?","opts":["15 יום ו-3 חודשים","30 יום ללא תחילת משפט, ו-9 חודשים ללא הכרעת דין","60 יום ו-12 חודשים","שנה אחת בלבד, ללא הבחנה בין שלבים"],"correct":1,"explain":"30 יום ללא תחילת משפט, ו-9 חודשים ללא הכרעת דין - שני הרפים המובילים לשחרור אוטומטי, בכפוף להארכות בית המשפט העליון.","id":"mcq-88","topic":"arrest-release","lesson":"extra","extra":false},{"q":"לאילו עבירות חלה זכות העיון בחומר החקירה לפי סעיף 74?","opts":["לכל העבירות ללא יוצא מן הכלל, כולל חטא","רק בפשע ועוון - לא בחטא","רק בעבירות פשע חמורות בלבד","רק כאשר החשוד מיוצג על ידי עו\"ד פרטי"],"correct":1,"explain":"זכות העיון קמה עם הגשת כתב האישום וחלה רק בעבירות מסוג פשע או עוון - לא בעבירות חטא.","id":"mcq-89","topic":"review","lesson":"5","extra":false},{"q":"נאשם נמנע מלהשיב לשאלה בעת תשובתו לכתב האישום. מה המשמעות הדיונית?","opts":["אין לכך כל משמעות משפטית","ההימנעות מתשובה עשויה לשמש חיזוק לראיות התביעה, ובית המשפט חייב להסביר זאת לנאשם","ההימנעות גוררת זיכוי אוטומטי","ההימנעות גוררת הרשעה אוטומטית"],"correct":1,"explain":"הימנעות הנאשם מתשובה עשויה לשמש חיזוק לראיות התביעה - אך בית המשפט חייב להסביר לנאשם את המשמעות של הימנעותו.","id":"mcq-90","topic":"defendant-response","lesson":"6","extra":false},{"q":"כמה נאשמים הועמדו לדין באותו כתב אישום, וחלקם הודו בעובדות המקימות הרשעה. מדוע, ככלל, לא ייגזר דינם של המודים לפני סיום בירור משפטם של האחרים?","opts":["משיקולי יעילות דיונית גרידא, ללא נימוק מהותי","כדי לאפשר להעריך את חלקו של כל נאשם בעבירה ואת הענישה המתאימה רק לאחר בירור מלוא התמונה העובדתית","כי החוק אוסר על כך באופן מוחלט וללא חריגים","כדי להאריך את משך ההליך"],"correct":1,"explain":"הרציונל: רק לאחר בירור התמונה המלאה ניתן להעריך נכונה את חלקו של כל נאשם בעבירה ואת הענישה המתאימה לו.","id":"mcq-91","topic":"multi-defendants","lesson":"7","extra":false},{"q":"מהם שלושת השלבים בקביעת העונש לפי המתווה שנלמד (סעיפים 40ב-40טו לחוק העונשין)?","opts":["אשמה, הוכחה, ערעור","קביעת מתחם עונש הולם, בחינת חריגה (קולא/חומרא), וקביעת עונש סופי בתוך המתחם","חקירה, כתב אישום, גזר דין","זיכוי, הרשעה, ערעור"],"correct":1,"explain":"שלושת השלבים: (1) קביעת מתחם העונש ההולם, (2) בחינת אפשרות לחרוג ממנו (לקולא או לחומרא), (3) קביעת העונש הסופי בתוך המתחם (או בחריגה המוצדקת).","id":"mcq-92","topic":"sentencing","lesson":"8","extra":false},{"q":"לפי סעיף 169, מי מסכם ראשון בתום שלב הראיות - התביעה או ההגנה?","opts":["ההגנה מסכמת תמיד ראשונה","התובע מסכם תחילה ואחריו הנאשם/הסנגור","הצדדים מסכמים בו-זמנית","בית המשפט קובע לפי שיקול דעתו בכל מקרה"],"correct":1,"explain":"לפי סעיף 169, סדר הסיכומים הוא: התובע מסכם תחילה, ולאחריו הנאשם.","id":"mcq-93","topic":"summations","lesson":"7","extra":false},{"q":"לנאשם שמורה זכות מיוחדת ביחס לסדר הסיכומים. מהי?","opts":["זכות לסכם ראשון תמיד","זכות המילה האחרונה (מסכם אחרון)","זכות לוותר על סיכומים לחלוטין","זכות לדרוש שהתביעה תסכם פעמיים"],"correct":1,"explain":"התובע מסכם ראשון והנאשם אחריו, אך לנאשם שמורה זכות המילה האחרונה בהליך.","id":"mcq-94","topic":"verdict-sentence","lesson":"8","extra":false},{"q":"מהו החריג לכלל \"סיכון כפול\" כאשר המעשה גרם למותו של אדם לאחר הדיון הראשון?","opts":["אין חריג - הכלל מוחלט בכל מצב","ניתן להעמיד לדין פעם נוספת בשל אותו מעשה, אם בדיון הראשון נמצא הנאשם אשם (לרבות העמדה למבחן ללא הרשעה)","ניתן להעמיד לדין רק אם חלפו 10 שנים מהדיון הראשון","החריג חל רק אם הנאשם זוכה בדיון הראשון"],"correct":1,"explain":"כאשר המעשה גורם למוות לאחר הדיון הראשון, ניתן להעמיד לדין פעם נוספת - בתנאי שבדיון הראשון נמצא הנאשם אשם (כולל העמדה למבחן ללא הרשעה).","id":"mcq-95","topic":"double-jeopardy-justice","lesson":"6","extra":false},{"q":"מהו התנאי המרכזי לקבלת \"ראיות הזמה\" בשלב מתקדם של המשפט?","opts":["אין צורך בכל רשות - ניתן להביאן בכל עת באופן חופשי","טעונות רשות בית המשפט, ונועדו לסתור טענה שעלתה בהגנה ולא הייתה צפויה לתביעה מראש","מוגבלות לעדים שכבר העידו בעבר בלבד","אסורות תמיד לאחר תום פרשת ההגנה"],"correct":1,"explain":"ראיות הזמה טעונות רשות בית המשפט ומיועדות לסתור טענה שעלתה בהגנה ולא הייתה צפויה מראש לתביעה; לאחר הבאתן, רשאי הנאשם להביא ראיות לסתור אותן.","id":"mcq-96","topic":"trial-conduct","lesson":"7","extra":false},{"q":"עבירה שדינה עד 3 חודשי מאסר או קנס מסווגת כ:","opts":["פשע","עוון","חטא","אין לה סיווג"],"correct":2,"explain":"חטא הוא עבירה שדינה עד 3 חודשי מאסר, או קנס - הסיווג הקל ביותר לפי סעיף 24 לחוק העונשין.","id":"mcq-97","topic":"classify","lesson":"1","extra":false},{"q":"מיהו הגורם המוסמך להורות שלא לחקור עבירת חטא/עוון, משיקולי מדיניות?","opts":["כל שוטר, ללא תלות בדרגה","קצין משטרה בדרגת פקד ומעלה, או רשות אחרת מוסמכת","רק פרקליט המדינה","רק היועץ המשפטי לממשלה"],"correct":1,"explain":"בעבירת חטא/עוון, קצין משטרה בדרגת פקד ומעלה רשאי שלא לחקור משיקולי מדיניות, או רשות אחרת מוסמכת - בשונה מפשע, שבו קיימת חובת חקירה מוחלטת (למעט הלכת צדוק).","id":"mcq-98","topic":"sec59","lesson":"1","extra":false},{"q":"מעצר גישור לפי סעיף 17(ד) כפוף לאיזו תקרת זמן כוללת של מעצר?","opts":["תקרת 30 הימים","תקרת 75 הימים הרגילה","תקרת 9 החודשים","אין כל תקרה"],"correct":1,"explain":"מעצר הגישור (עד 5 ימים) כפוף לתקרת 75 הימים הרגילה - אינו חורג ממנה, אלא נספר בתוכה.","id":"mcq-99","topic":"arrest-bridge","lesson":"extra","extra":false},{"q":"מהי עילת הסגירה היחידה מבין עילות סעיף 62 שבה נמחק הרישום הפלילי לחלוטין ממרשם המשטרה?","opts":["חוסר ראיות מספיקות","נסיבות העניין (\"עילת הקומבינה\")","חוסר אשמה","כל עילות הסגירה מובילות למחיקת הרישום"],"correct":2,"explain":"רק עילת \"חוסר אשמה\" - סגירה שמזכה את החשוד לחלוטין - מובילה למחיקת הרישום ממרשם המשטרה. שתי העילות האחרות (חוסר ראיות, נסיבות העניין) משאירות רישום פלילי.","id":"mcq-100","topic":"closure","lesson":"2","extra":false},{"q":"מהו הטעות הנפוצה שהמרצה הזהירה מפניה, גם בקרב עורכי דין, ביחס לסגירת תיק בהסדר?","opts":["בלבול בין סגירת תיק בהסדר לבין עסקת טיעון - סגירה בהסדר מונעת מלכתחילה הגשת כתב אישום, בעוד עסקת טיעון היא הסדר במסגרת כתב אישום שכבר הוגש","בלבול בין עבירת חטא לעוון","בלבול בין מעצר לעיכוב","אין טעות נפוצה מיוחדת בנושא זה"],"correct":0,"explain":"עסקת טיעון = הסדר בתוך הליך שכתב אישום כבר הוגש בו (הודאה תמורת אישום/עונש מוסכם). סגירת תיק בהסדר (סעיף 67א) מונעת מלכתחילה את הגשת כתב האישום. בלבול בין השניים הוא טעות נפוצה שהמרצה הדגישה.","id":"mcq-101","topic":"closure","lesson":"2","extra":false},{"q":"מה כוללת \"פרק העובדות\" בכתב אישום, לפי סעיף 85?","opts":["רשימת ראיות התביעה","עובדות בלבד - לא ראיות","דעת התובע על אשמת הנאשם","תקדימים משפטיים רלוונטיים"],"correct":1,"explain":"פרק העובדות בכתב האישום כולל עובדות בלבד - לא ראיות ולא נימוקים משפטיים.","id":"mcq-102","topic":"structure","lesson":"4","extra":false},{"q":"מתי בדיוק הופך חשוד ל\"נאשם\"?","opts":["עם תחילת החקירה המשטרתית","עם הגשת כתב האישום למזכירות בית המשפט - מיידית","רק לאחר הקראת כתב האישום בפועל","עם מתן פסק הדין"],"correct":1,"explain":"עם הגשת כתב האישום למזכירות בית המשפט, החשוד הופך מיידית ל\"נאשם\" - זהו שינוי טכני-דיוני מיידי, לא הדרגתי.","id":"mcq-103","topic":"defendant","lesson":"5","extra":false},{"q":"מדוע חשוב שנאשם המבקש לטעון טענת אליבי יעלה אותה מיד?","opts":["אין כל דחיפות - ניתן להעלותה בכל שלב ללא הגבלה","איחור בהעלאת הטענה מגביל את הבאת הראיות לגביה, אלא ברשות בית המשפט","טענת אליבי חייבת להיטען לפני תחילת החקירה המשטרתית","טענת אליבי בטלה אם לא הועלתה בכתב מראש"],"correct":1,"explain":"טענת אליבי יש להעלות מיד; איחור בהעלאתה מגביל את האפשרות להביא ראיות לתמיכתה, אלא אם בית המשפט התיר זאת ברשות מיוחדת.","id":"mcq-104","topic":"defendant-response","lesson":"6","extra":false},{"q":"מה קורה כאשר, בכתב אישום משותף, אחד הנאשמים המודה נקרא להעיד נגד האחרים?","opts":["לא ניתן לגזור את דינו לפני סיום משפט האחרים בשום מקרה","ניתן לגזור את דינו גם לפני סיום משפט האחרים - זהו אחד המקרים המיוחדים המוכרים לחריג","חובה לבטל את כתב האישום המשותף כליל","המודה זוכה אוטומטית"],"correct":1,"explain":"כאשר הנאשם המודה נקרא להעיד נגד האחרים, ניתן לגזור את דינו לפני סיום משפטם - זהו אחד הנסיבות המיוחדות המוכרות כחריג לכלל שלפיו לא גוזרים דין מודה לפני סיום בירור משפט האחרים.","id":"mcq-105","topic":"multi-defendants","lesson":"7","extra":false},{"q":"מדוע חשוב להבחין, לפי הדגשת המרצה בנושא הסיכומים, בין סדר הטיעון, מתכונתו והסעד כשנטען לפגם?","opts":["אין הבדל מהותי בין המושגים הללו","כל היבט (מי מדבר, כיצד, ומה הסעד המבוקש) נבחן בנפרד, ופגם באחד מהם אינו בהכרח גורר את אותה תוצאה כפגם באחר","שלושת ההיבטים תמיד מובילים לביטול המשפט","ההבחנה רלוונטית רק בערכאת ערעור"],"correct":1,"explain":"ההבחנה חשובה כי כל היבט (מי מדבר ראשון, מתכונת הסיכום, והסעד הנדרש כשנטען לפגם) הוא רכיב נפרד בניתוח, ולא כל פגם גורר את אותה תוצאה משפטית.","id":"mcq-106","topic":"summations","lesson":"7","extra":false},{"q":"מהו נטל ההוכחה הנדרש לביסוס נסיבה מחמירה, לעומת נסיבה מקלה, בקביעת העונש?","opts":["שני הנטלים זהים - מאזן הסתברויות בשניהם","נסיבה מחמירה: מעבר לספק סביר. נסיבה מקלה: מאזן הסתברויות (הסטנדרט האזרחי)","שני הנטלים הם מעבר לספק סביר","אין צורך בהוכחת נסיבות כלל, רק בשיקול דעת השופט"],"correct":1,"explain":"קיים פיצול בנטל ההוכחה: נסיבה מחמירה מחייבת הוכחה מעבר לספק סביר (הסטנדרט הפלילי המחמיר), בעוד שנסיבה מקלה די בהוכחתה במאזן הסתברויות (הסטנדרט האזרחי).","id":"mcq-107","topic":"sentencing","lesson":"8","extra":false},{"q":"מהם מועדי הערעור הרגילים - ערעור בזכות וערעור ברשות?","opts":["30 יום בזכות, 60 ברשות","45 יום בזכות; 45+30 יום ברשות","90 יום לשניהם","אין מגבלת זמן לערעור בפלילים"],"correct":1,"explain":"ערעור בזכות: 45 יום. ערעור ברשות: 45 יום להגשת הבקשה + 30 יום נוספים במידה וניתנה רשות.","id":"mcq-108","topic":"appeals","lesson":"8","extra":false},{"q":"מהו הכלל בעניין ערעור על החלטות ביניים במהלך המשפט?","opts":["ניתן לערער על כל החלטת ביניים באופן חופשי","ככלל אין ערעור על החלטות ביניים, אלא בחריגים מוגדרים (כגון פסלות שופט, פומביות, עיון בחומר, עיכוב ביצוע)","ערעור על החלטת ביניים אפשרי רק לאחר תום ההליך כולו","החלטות ביניים אינן ניתנות לערעור בשום שלב, גם לא בסיום ההליך"],"correct":1,"explain":"הכלל: אין ערעור על החלטות ביניים אלא בהוראה מפורשת. חריגים מוכרים: פסלות שופט, פומביות, עיון בחומר החקירה, ועיכוב ביצוע.","id":"mcq-109","topic":"appeals","lesson":"8","extra":false}];
const CASE_Q = [{"title":"קייס 1 — פגם בכתב האישום","scenario":"נאשם הורשע בעבירת מרמה. בערעור טוען סנגורו כי בכתב האישום נפלה טעות בציון התאריך המדויק של אחת מהעברות הכספיות, וכי בשל כך יש לבטל את ההרשעה כולה — למרות שכל שאר העובדות הוכחו כדבעי ולא נטען שהדבר פגע ביכולתו של הנאשם להתגונן.","question":"האם יש לקבל את הטענה? נמקו את תשובתכם תוך הפניה לפסיקה הרלוונטית.","points":["יש להזכיר את הלכת סילוסטר (ע\"פ 1/48): הדיון הפלילי אינו \"אשקוקי\" — פגם דיוני/טכני שלא גרם לעיוות דין ולא מנע הגנה הוגנת אינו מביא לביטול ההליך.","יש לבחון האם הפגם (טעות בתאריך) פגע בפועל ביכולת הנאשם להתגונן — כאן נמסר בעובדה שלא נטען כך.","ניתן להזכיר את סעיף 215 לחסד\"פ, שבו עוגנה ההלכה.","מסקנה סבירה: יש לדחות את הטענה, שכן מדובר בפגם טכני גרידא."],"id":"caseq-1","topic":"sec184","source":"פרדריק וילאם סילוסטר נ׳ היועץ המשפטי לממשלה 1-48.pdf — פסקאות 9-10; חוק סדר הדין הפלילי [נוסח משולב] סעיפים 149(3), 215","lesson":"1","extra":false},{"title":"קייס 2 — חיפוש בהסכמה","scenario":"שוטר עוצר אזרח ברחוב ללא כל חשד מוקדם, ומבקש לחפש בתיקו. השוטר אומר לו רק \"אתה מסכים שאבדוק לך בתיק?\" והאזרח עונה \"בסדר, בכיף\". בחיפוש נמצאים סמים.","question":"האם החיפוש חוקי, והאם הראיה קבילה? התייחסו לתנאים הנדרשים.","points":["יש להזכיר את רע״פ 10141/09 בן חיים: בהיעדר מקור סמכות אחר, נדרשת הסכמה אמיתית, מודעת ורצונית מהסוג שנדון בפסק הדין.","השוטר חייב להבהיר לאזרח באופן מפורש את זכותו המלאה לסרב, ושסירובו לא ייזקף לחובתו.","כאן השוטר לא הבהיר דבר מזה — ההסכמה אינה \"מדעת\".","מסקנה: החיפוש אינו חוקי, והראיה (הסמים) עלולה להיפסל מכוח הלכת יששכרוב (פסילה פסיקתית יחסית, בכפוף לאיזון אינטרסים)."],"id":"caseq-2","topic":"packer","lesson":"1","extra":false,"source":"אברהם בן חיים נ׳ מדינת ישראל.pdf — רע״פ 10141/09, פסקאות 3–5, 13, 31–35 וההכרעה הסופית"},{"title":"קייס 3 — עדות שותף","scenario":"שני שותפים הועמדו לדין בכתבי אישום נפרדים. האחד הורשע אך טרם נגזר דינו. התביעה מבקשת להעידו במשפט שותפו. הסנגור טוען שהלכת קנזי מחייבת לפסול את העדות באופן אוטומטי.","question":"האם הטענה הגורפת נכונה? הציגו כלל, חריג ויישום.","points":["מזהים שמדובר בכתבי אישום נפרדים.","מבחינים בין הלכת קנזי ההיסטורית לבין בג״ץ 11339/05 שביטל את החסם הגורף.","ככלל ניתן להעיד את השותף גם לפני סיום משפטו; ניתן לדחות במקרים חריגים ביותר ומטעמים שיירשמו.","העובדה שגזר הדין טרם ניתן אינה לבדה בסיס לפסילה אוטומטית. שאלת משקל העדות נפרדת מעצם האפשרות להעיד."],"id":"caseq-3","topic":"kanzi","source":"מדינת ישראל נ׳ בית המשפט המחוזי באר שבע 11339-05.pdf — ההכרעה הסופית ודעת הנשיאה ביניש, פסקה 3","lesson":"3","extra":false},{"title":"קייס 4 — הסדר מותנה","scenario":"חשוד בעבירת תקיפה (עוון) מוזמן על ידי התביעה להצעת הסדר מותנה. הוא מבקש מסנגורו לעיין בחומרי החקירה לפני שיחליט אם לחתום, אך התביעה משיבה שזכות העיון קמה רק לאחר הגשת כתב אישום, ולכן היא מסרבת למסור את החומרים.","question":"האם עמדת התביעה נכונה? נמקו את תשובתכם.","points":["יש להבחין בין זכות העיון הרגילה (סעיף 74 לחסד\"פ) — הקמה רק לאחר הגשת כתב אישום, ורק בפשע/עוון — לבין זכות העיון המיוחדת והמוקדמת בהליך של הסדר מותנה (סעיף 67ד לחסד\"פ).","סעיף 67ד קובע במפורש: \"בטרם ייחתם הסדר, רשאי החשוד לעיין בחומר החקירה ובטיוטת כתב האישום אם אינה זהה למתואר בהסדר\" — כלומר החובה קמה עוד לפני הגשת כתב אישום, כדי שהחשוד יוכל להחליט מדעת אם לחתום.","מסקנה: עמדת התביעה שגויה — סעיף 67ד קובע חובת חשיפה מיוחדת ומוקדמת לחתימה על הסדר מותנה, נפרדת מזכות העיון הרגילה שבסעיף 74."],"id":"caseq-4","topic":"conditional","source":"חוק סדר הדין הפלילי [נוסח משולב] תשמ\"ב-1982 — סעיף 67ד","lesson":"3","extra":false},{"title":"קייס 5 — התיישנות: גבולות חומר הבחינה","scenario":"בתרגיל מוצגת עבירת פשע רגילה ופעולת חקירה מאוחרת. סטודנט מבקש לפתור את השאלה באמצעות טבלת הארכות מפורטת המופיעה במצגת, וכן להסתמך על שקפים בעניין עבירות מין בקטינים.","question":"כיצד יש לבנות את התשובה לפי הנחיית המרצה בשיעור 7?","points":["מזהים את תקופת ההתיישנות הבסיסית לפי סיווג העבירה.","מסבירים שפעולת חקירה היא אירוע מנתק, ושמנגנון התקופה הנוספת קשור לפי השיעור לפעולת חקירה.","לא בונים את התשובה על טבלת הארכות שהמרצה הוציא מחומר הבחינה.","לא מייבאים את דיני עבירות המין בקטינים, שהמרצה הורה להתעלם מהם בבחינה."],"id":"caseq-5","topic":"limitations-pointer","lesson":"6","extra":false,"source":"שיעור 7 ערוך.mp3 — דברי המרצה בתחילת הדיון בהתיישנות"},{"title":"קייס 6 — סיווג העבירה לפני הצעת הסדר","scenario":"רונן חשוד בעבירה שעונשה המרבי חמש שנות מאסר. הוא נעדר עבר פלילי בחמש השנים שקדמו לה ואין נגדו תיקים נוספים. התובע סבור שאין מקום לבקש מאסר בפועל ולכן מציע הסדר מותנה. סטודנט טוען שהיעדר עבר פלילי והיעדר בקשת מאסר מספיקים לכך.","question":"מהו תנאי הסף שהסטודנט דילג עליו, לפי המסגרת שנלמדה בשיעור 3?","points":["מפרידים בין העונש המרבי הקבוע לעבירה לבין העונש שהתובע סבור שמתאים בנסיבות המקרה.","עונש מרבי של חמש שנים מציב את העבירה בסוג פשע.","לפי המסגרת שהמרצה לימד, הסדר מותנה מיועד לחטא ולעוון, ולא לפשע.","עבר נקי והערכת התובע שאין צורך במאסר אינם מחליפים את תנאי סיווג העבירה; לכן המסקנה של הסטודנט אינה נכונה."],"id":"caseq-6","topic":"conditional","withheld":false,"lesson":"3","extra":false,"source":"שיעור 3.mp3 — הסבר המרצה על סגירת תיק בהסדר, תנאי הסף והעיון לפני חתימה"},{"title":"קייס 7 — התיישנות, סיכון כפול וערעור באיחור","scenario":"שרה ביצעה עבירת פשע (תקופת התיישנות בסיסית 10 שנים) ב-1/2014. ב-1/2018 החל הליך חקירה שהסתיים ב-6/2018. ב-2/2025 הוגש נגדה כתב אישום ומשפטה החל. באותו משפט טענה שרה שכבר זוכתה בעבר, בשנת 2016, מאישום שונה לחלוטין שנבע מאותו אירוע עובדתי — אך התביעה חוזרת וטוענת לעובדות דומות. שרה הורשעה בסופו של דבר, וסנגורה פספס את מועד הגשת הערעור בשבועיים בשל תקלה משרדית.","question":"התייחסו לשלוש הסוגיות: (1) האם ניתן היה להגיש את כתב האישום ב-2/2025 מבחינת התיישנות? (2) האם טענת הסיכון הכפול/הזיכוי הקודם תתקבל? (3) האם ניתן עדיין לערער חרף האיחור?","points":["(1) תקופת ההתיישנות הבסיסית: 1/2014 + 10 שנים = 1/2024. הליך החקירה (אירוע מנתק) מאפס ומתחיל שוב מ-6/2018, אך מוגבל ל\"תקופה נוספת\" של עד 3 שנים מעבר ל-1/2024 — כלומר עד 1/2027. הגשת האישום ב-2/2025 היא במועד.","(2) סעיף 5 חוסם רק דיון חוזר על אותו מעשה שממנו זוכתה — אם האישום הנוכחי מבוסס על עובדות שונות (גם אם מאותו אירוע כללי), הטענה עלולה להידחות; יש לבחון האם מדובר ב\"אותו מעשה\" ממש.","(3) בהליך פלילי ניתן להאריך את מועד הגשת הערעור גם ללא \"טעמים מיוחדים שיירשמו\" (בשונה מהליך אזרחי) — ולכן תקלה משרדית עשויה להצדיק הארכה; דחיית בקשת ההארכה עצמה נחשבת \"פסק דין\" הניתן לערעור בזכות (הלכת חילף)."],"id":"caseq-7","topic":"appeals","source":"חוק סדר הדין הפלילי [נוסח משולב] סעיפים 5, 9; חילף נ׳ מדינת ישראל.pdf","lesson":"8","extra":false},{"title":"קייס 8 — נאשמים באותו כתב אישום","scenario":"א׳ וב׳ מואשמים באותו כתב אישום בשוד. א׳ הודה בעובדות, וב׳ כופר. התביעה מבקשת לגזור את דינו של א׳ מיד כדי לסיים את עניינו.","question":"מהו הכלל שנלמד בשיעור 7 ומהו ההיגיון שניתן לו?","points":["מזהים שמדובר בכתב אישום אחד, תנאי מרכזי לדיון בסעיף 155 כפי שנלמד.","לא גוזרים את דינו של מי שהודה לפני שהסתיים בירור משפטו של מי שלא הודה.","ההסבר בשיעור הוא הצורך לראות את התמונה הכוללת ואת חלקו של כל נאשם לפני הענישה.","אין להוסיף חריגים או מסלולים שאינם מבוססים במפורש בחומר שנלמד."],"id":"caseq-8","topic":"multi-defendants","lesson":"6","extra":false,"source":"שיעור 7 ערוך.mp3 — דברי המרצה בתחילת הדיון בהתיישנות"},{"title":"קייס 9 — מעצר ועיכוב: הרחבה מעבר להקלטות 1–8","scenario":"שוטר עיכב את דני ברחוב בחשד לתקיפה (עוון) לפני כשלוש שעות, וביקש לבדוק את זהותו. דני סירב לשתף פעולה, ובתגובה עצר אותו השוטר ללא צו. בתחנה נמנע ממנו לפגוש את עורך דינו למשך 20 שעות ללא נימוק מיוחד, ובמהלך אותה תקופה נגבתה ממנו הודאה בעבירה חמורה יותר — ניסיון לשוד (פשע). דני הובא בפני שופט לאחר 30 שעות. בשלב מאוחר יותר ביקשה התביעה מעצר גישור, ולאחר מכן מעצר עד תום ההליכים, בטענה שמדובר ב\"מכת מדינה\" של שוד ברחובות.","question":"נתחו, לפי הסדר: (1) האם העיכוב והמעצר ללא צו היו כדין? (2) מה דין מניעת הפגישה עם עורך הדין וההודאה שנגבתה? (3) האם הזמן עד ההבאה בפני שופט תקין? (4) האם טענת \"מכת מדינה\" מספיקה למעצר עד תום ההליכים?","points":["(1) תחילה בודקים שהעיכוב נעשה בסמכות. אי־ציות להוראות עיכוב חוקיות עשוי להקים סמכות לפי סעיף 23(ב) להבאה לתחנה לתכלית העיכוב. אין לייבא אוטומטית את תנאי מסלול 23(א); יש לבחון את הנסיבות ואת האפשרות להסתפק בעיכוב.","(2) מניעת פגישה עם עו\"ד ללא נימוק מיוחד לאורך 20 שעות פוגעת בזכות יסוד — בהתאם להלכת אסף שי, פגיעה בלתי חוקית כזו עלולה להוביל לפסילת ההודאה שנגבתה בעקבותיה מכוח הלכת יששכרוב.","(3) הכלל הוא הבאה בפני שופט תוך 24 שעות בלבד (סעיפים 17(ג)/27/29 לחוק המעצרים) — אין בחוק כלל כללי של הארכה ל-48 שעות \"בנסיבות מיוחדות\"; הארכה מעבר ל-24 שעות מותרת רק במקרה ספציפי של שבת/חג (עד 32-36 שעות, סעיף 29). 30 שעות ללא הצדקה כזו חורגות מהכלל וסביר שפוגמות בחוקיות המעצר.","(4) לפי הלכת גנימאת, \"מכת מדינה\" או חומרת העבירה כשלעצמה אינן עילת מעצר עצמאית — יש לבחון את מסוכנותו האישית הספציפית של דני ואת קיומה של חלופת מעצר, ולא להסתפק בנימוק הכללי."],"id":"caseq-9","topic":"arrest-nowarrant","source":"חוק סדר הדין הפלילי סמכויות אכיפה מעצרים התשנו 1996.pdf — סעיפים 17(ג), 23(ב), 27, 29; אסף שי נ׳ מדינת ישראל.pdf; עימאד גנימאת נ׳ מדינת ישראל.pdf","lesson":"extra","extra":true},{"id":"caseq-10","title":"קייס 10 — שני מועדים בערעור ברשות","scenario":"בקשת רשות ערעור הוגשה בתוך 45 ימים מפסק הדין. ההחלטה המתירה ערעור ניתנה כעבור חודשיים. סטודנט טוען שהמועד חלף, כי עברו יותר מ־75 ימים מפסק הדין.","question":"האם חיבור פשוט של 45+30 פותר את השאלה? נמקו.","points":["מבדילים בין בקשת רשות הערעור לבין הערעור לאחר מתן הרשות.","45 הימים מתייחסים לבקשת הרשות לפי הכלל שנלמד.","30 הימים נמנים ממועד מתן הרשות, לא אוטומטית מתום 45 הימים.","ההמתנה להחלטה אינה מצדיקה כשלעצמה את מסקנת הסטודנט; בודקים את המועד בפועל לאחר מתן הרשות."],"topic":"appeals","source":"שיעור8 ערוך.mp3 — דיון בסיום המשפט ובערעור","lesson":"8","extra":false},{"id":"caseq-11","title":"קייס 11 — חזרה מערעור","scenario":"נאשם הגיש ערעור ומבקש לחזור בו. השוו בין בקשה לפני סיום טענות הצדדים לבין בקשה לאחר סיומן.","question":"מהי נקודת המעבר ומה נדרש בכל מצב?","points":["מזהים שהשאלה היא חזרה מערעור, לא חזרת תובע מאישום.","לפני סיום טענות בעלי הדין אין צורך ברשות בית המשפט.","אחרי סיום הטענות נדרשת רשות בית המשפט.","אין להעתיק לכאן את ההבחנה בין ביטול לזיכוי הנוגעת לחזרה מאישום."],"topic":"appeals","source":"שיעור8 ערוך.mp3 — דיון בסיום המשפט ובערעור","lesson":"8","extra":false},{"id":"caseq-12","topic":"summations","lesson":"8","extra":false,"title":"קייס 12 — האם סיכומים כתובים מבטלים את המשפט?","scenario":"בתיק כלכלי הסכימו הצדדים להגיש סיכומים בכתב. לאחר הרשעתו דורש הנאשם ביטול אוטומטי של המשפט משום שלא סיכם בעל־פה, בלי להצביע על פגיעה מסוימת בהגנתו.","question":"כיצד יש לנתח את הטענה לפי פלוני 5333/11? השוו בקצרה לזכריא.","points":["מזהים סוגיה של מתכונת הסיכומים, לא של עדות שותפים.","מציינים שטיעון בעל־פה הוא דרך המלך, אך אין ביטול אוטומטי עקב סיכומים בכתב בהסכמה.","בוחנים את ההסכמה ואת הטענה לנזק או עיוות דין; כאן לא פורטה פגיעה קונקרטית.","בזכריא יש חשיבות לכך שהתקיים דיון והסנגור עצמו בחר להסתפק בנימוקיו הכתובים.","המסקנה לפי נתוני הדוגמה: הדרישה לביטול אוטומטי אינה מבוססת; אין בכך היתר גורף לוותר על דיון בכל מקרה."],"source":"פלוני נ׳ מדינת ישראל 5333-11.pdf — רע״פ 5333/11, פסקאות א–ט; זכריא נ׳ מדינת ישראל.pdf — רע״פ 11160/03, פסקאות 2–4 והערת השופטת פרוקצ׳יה"}];

const EXAMS=[{"id":"moed-b-2025","title":"מבחן דיון פלילי — מועד ב׳ תשפ״ה","lecturer":"ד\"ר רתם רוזנברג-רובינס","conditions":"חומר סגור, עם נספחים מפורטים במחשב","durationMinutes":120,"partA":{"points":75,"questions":[{"id":"b25-a1","points":25,"scenario":"אסתר הסתובבה בתל אביב בשעות הערב כשלפתע התנפל עליה איש ושדד את תיקה באיומי סכין. היא מיהרה לתחנת המשטרה כדי להתלונן ומסרה תיאור כללי של השודד, שהיה גבר צעיר וגבוה עם שיער שחור הלבוש בחולצה כחולה. ברוך השוטר יצא מיד לסייר בשכונה שבה אירע השוד וראה ברחוב את גרשון, גבר צעיר וגבוה, שהיה מוכר לו בשל הסתבכותו בעבירות פליליות קודמות. למרות שלגרשון יש שיער בהיר והוא לבש חולצה אדומה ולא כחולה, חשב ברוך שלאור עברו הפלילי, יש סיכוי שהוא השודד. הוא החליט לערוך חיפוש בכיסיו ובתיקו של גרשון כדי לבדוק האם הוא מחזיק בסכין, שעשוי להיות כלי הנשק ששימש את השודד. ברוך הודיע לגרשון שהוא מבקש לערוך חיפוש וגרשון אמר שאין בעיה. בתיקו נמצאה סכין ובעקבות זאת הודיע לו ברוך שהוא עצור בחשד לשוד, שיש לו זכות לשמור על שתיקה, שיש לו זכות להיוועץ בסנגור ושאם אין לו סנגור הוא יוכל להיוועץ בסנגורי ציבורי. במהלך תשאולו בתחנת המשטרה הכחיש גרשון כל קשר לשוד. לאחר מכן הוזמנה אסתר לתחנת המשטרה והתבקשה לנסות לזהות את מי ששדד אותה מתוך מסדר זיהוי, שבו השתתף גרשון. אסתר לא הצליחה לזהות את השודד ולא הצביעה על גרשון. ואולם ברוך, שהיה משוכנע באשמתו של גרשון, נעמד בכניסה לחדר החקירות כשהוא מנופף בדף נייר ריק ואמר לגרשון: \"אתה רואה את זה? זה הדוח ממסדר הזיהוי. כתוב בו שהמתלוננת זיהתה אותך בתור השודד. עכשיו אתה מוכן לספר לי את האמת?\". בעקבות זאת נשבר גרשון והודה ששדד את אסתר באיומי סכין. התביעה הגישה נגד גרשון כתב אישום לבית המשפט המחוזי בתל אביב בגין עבירת השוד הקבועה בסעיף 402(א) לחוק העונשין. כתב האישום התבסס על הודאתו של גרשון במשטרה ועל הסכין שנמצאה בתיקו.","prompt":"אלו טענות מתחום סדר הדין הפלילי יוכל גרשון להעלות במשפט נגד הראיות המבססות את האישום נגדו? כיצד לדעתכם צפוי בית המשפט להכריע בטענות?","modelAnswer":"הסכין – גרשון יטען שיש לפסול את הסכין מלשמש כראיה במשפט. החיפוש שערך ברוך היה בלתי חוקי, שכן לברוך לא היה יסוד סביר לחשד שהוא ביצע עבירה או מסתיר אצלו חפץ שקשור לביצוע עבירה. אמנם ברוך פעל בעקבות מידע על שוד שהתבצע באזור, אך החלטתו לערוך חיפוש דווקא אצל גרשון נבעה לא מחשד אובייקטיבי אלא מהעובדה שגרשון מוכר לו כבעל עבר פלילי, כאשר עבר פלילי בפני עצמו אינו מהווה יסוד סביר לחשד. מאחר שגרשון לא תאם את תיאור השודד, לא היה לברוך חשד סביר נגדו והיה עליו לקבל הסכמה מדעת אם ברצונו לערוך חיפוש. הסכמה כזו לא ניתנה, שכן לא הוסבר לגרשון שמותר לו לסרב לחיפוש ולא יהיו לכך השלכות נגדו (בן חיים). מנגד, ניתן לטעון שברוך פעל בעקבות מידע ספציפי על שוד שהתבצע על ידי גבר גבוה וצעיר, ולכן היה סביר מצידו לערוך חיפוש אצל כל גבר העונה לתיאור זה גם אם חלק ממאפייניו אינם תואמים, שכן המתלוננת עלולה הייתה לטעות בתיאור מאחר שהייתה נסערת. ההודאה – גרשון יטען שיש לפסול גם את הודאתו במשטרה, שכן זו הושגה באמצעות תרגיל חקירה פסול. תרגיל זה ממחיש את הביקורת שהושמעה בקורס על הלכת פילצה, המבחינה בין בידוי ראיה מפלילה לשקר בעל פה בנוגע לקיומה של ראיה, ומראה שקו הגבול בין שני סוגי התחבולות עלול להיות דק: ברוך לא יצר ראיה בדויה ולא הראה אותה לגרשון אלא לכאורה שיקר רק בעל פה, אולם יצר בפני גרשון מצג שווא שלפיו הראיה נמצאת בידו — תרגיל בעייתי יותר מזה שנערך בפילצה, אך לא ברור שייקבע כבלתי חוקי. ככל שבית המשפט יקבע שאחת הראיות, או שתיהן, נגבו באופן בלתי חוקי, הוא יבחן פסילתן בהתאם למבחני הלכת יששכרוב: אופיה וחומרתה של אי-החוקיות, מידת ההשפעה של האמצעי הפסול על הראיה, והנזק מול התועלת שבפסילתה. מדובר בראיות שהן תוצר ישיר של אי-החוקיות, אך מנגד מדובר בעבירה חמורה כך שהנזק מפסילתן עלול להיות גבוה, והחוקיות עצמה גבולית — ולכן קשה לדעת כיצד יכריע בית המשפט."},{"id":"b25-a2","points":25,"scenario":"עם הגשת כתב האישום, הגישה התביעה גם בקשה למעצרו של גרשון עד תום ההליכים. גרשון, שלא היה מיוצג בדיון, ביקש מבית המשפט לדחות את הדיון ולמנות לו סנגור מהסנגוריה הציבורית, אך בית המשפט סירב. בסיום הדיון, החליט בית המשפט לעצור את גרשון עד תום ההליכים, בקובעו שמעצרו הכרחי שכן עבירת השוד היא עבירה חמורה שאף הפכה לנפוצה מאוד בתקופה האחרונה, ובשל כך לא ניתן לשחרר אותו לחלופת מעצר כגון שחרור בערובה.","prompt":"גרשון מבקש לערער על ההחלטה לעצור אותו. כיצד יוכל לעשות זאת ומה יהיו טענותיו?","modelAnswer":"גרשון יוכל להגיש ערר על החלטת המעצר לפי סעיף 53 לחוק המעצרים, הקובע כי עצור, משוחרר בערובה ותובע רשאים לערור על החלטת בית משפט בענין הנוגע למעצר. מאחר שהבקשה למעצר עד תום ההליכים נדונה במחוזי (הערכאה המוסמכת לדון בעבירה), הערר יוגש לעליון. גרשון יטען שלוש טענות מרכזיות: ראשית, בית המשפט שגה כשסירב למנות לו סנגור ציבורי וקיבל את בקשת המעצר בהיותו בלתי מיוצג — סעיפים 21(ב)(2) ו-21(ג) לחוק המעצרים קובעים כי אין להורות על מעצר עד תום ההליכים כשהנאשם אינו מיוצג, אלא אם הודיע שאין רצונו בסנגור; אם לא הודיע כאמור, על בית המשפט למנות לו סנגור, וכל עוד לא נתמנה סניגור ניתן לעצרו רק לתקופות של עד 7 ימים בכל פעם ולא יותר מ-30 ימים במצטבר. שנית, בית המשפט שגה כשקבע שחומרת העבירה והפיכתה לנפוצה מהוות עילת מעצר — כפי שנקבע בפס\"ד גנימאת, חומרת העבירה אינה עילת מעצר בפני עצמה אלא רק אינדיקציה למסוכנות, שכן הנאשם עדיין בחזקת חף מפשע, וגם היות העבירה \"מכת מדינה\" אינה יכולה להוות עילת מעצר, שכן מעצר הוא כלי מניעתי ולא הרתעתי. שלישית, בית המשפט שגה כשקבע שמסיבות אלה לא ניתן לשחרר את גרשון בערובה — סעיף 21(ב)(1) לחוק המעצרים קובע שאם ניתן להשיג את מטרת המעצר בדרך של ערובה או תנאי אחר, אין להורות על מעצר, ולכן אפילו אם היו עילות מעצר (וכאמור בפס\"ד גנימאת נקבע שלא), היה על בית המשפט לבדוק אם ניתן להשיג את המטרה בדרך חלופית."},{"id":"b25-a3","points":25,"scenario":"עם תחילת משפטו של גרשון, מונה לו סנגור שקיבל לידיו את חומר החקירה ואת רשימת החומר שנרשם ונאסף על ידי התביעה. ברשימה צוינו שתי ראיות שלא הופיעו בחומר החקירה. הראשונה הייתה עדות של עד ראיה לאירוע השוד, המשמש כמקור מודיעיני של המשטרה; ברשימה צוין שהעדות אינה מופיעה בחומר החקירה משום ששר הביטחון החליט שחשיפתה עלולה לפגוע בביטחון המדינה. הראיה השנייה הייתה מידע בנוגע לעבירות משמעת שבהן הורשע בעבר ברוך השוטר; ברשימה צוין שמדובר בעבירות משמעת ישנות שאינן רלוונטיות לתיק ולכן הן לא נכללו בחומר.","prompt":"סנגורו של גרשון מעוניין להשיג את שתי הראיות שאינן נמצאות בחומר החקירה. באלו הליכים משפטיים יוכל לנקוט לשם כך?","modelAnswer":"עדות הראיה – מדובר בראיה שהוצאה לגביה תעודת חיסיון לטובת המדינה, לפי סעיף 44 לפקודת הראיות, הקובע שראש הממשלה או שר הביטחון רשאים לקבוע שראיה תהיה חסויה אם מסירתה עלולה לפגוע בביטחון המדינה. סנגורו של גרשון יוכל להגיש עתירה לגילוי ראיה לבית המשפט העליון, ושופט של בית המשפט העליון ידון בבקשה ויעיין בראיה או לפחות בעיקריה (סיקסיק); המשפט ייעצר עד להכרעה בבקשה, אלא אם בית המשפט שדן באישום יחליט אחרת (סעיף 44(ב)). ככל שבית המשפט העליון יקבע שהראיה עשויה להועיל להגנת הנאשם ומידת התועלת שבה עולה על העניין שיש בהמשך אי-גילויה, או שהיא חיונית להגנה, יורה על גילוי הראיה, ואז תצטרך התביעה להחליט האם להגיש את הראיה ולאפשר להגנה לעיין בה, או לחזור בה מכתב האישום. עבירות המשמעת – מדובר בראיה שהתביעה סבורה שאינה רלוונטית לאישום ולכן לא כללה אותה בחומר החקירה. הסנגור יוכל להגיש בקשה לבית המשפט שדן באישום, לפי סעיף 74(ב) לחסד\"פ, להורות לתובע לאפשר עיון בחומר החקירה. הוא יטען שהרשעותיו של ברוך בעבירות משמעת משליכות ישירות על מהימנותו, וכי מאחר שטענות גרשון נוגעות לאי-תקינות החקירה שברוך ניהל, החומר רלוונטי לאישום. בניגוד למצב בפס\"ד שיינר, במקרה דנן החומר נמצא בידי התביעה או בהישג ידה המיידי, ובנוסף הפגיעה בזכויותיו של ברוך (שוטר, לא מתלונן) אינה קשה כמו באותו מקרה — ולכן האיזון בין הזכויות מוביל למסקנה שיש להורות לתביעה למסור את החומר."}]},"partB":{"points":25,"questions":[{"id":"b25-b1","points":5,"prompt":"אבשלום הורשע בבית משפט השלום בעבירת הגניבה. הוא ערער על הרשעתו לבית המשפט המחוזי אך הערעור נדחה. אבשלום מבקש להשיג על הרשעתו פעם נוספת. מה הוא יוכל לעשות?","options":["להגיש ערעור בזכות לבית המשפט העליון.","להגיש בקשת רשות ערעור (רע\"פ) לבית המשפט המחוזי.","להגיש בקשת רשות ערעור (רע\"פ) לבית המשפט העליון.","להגיש בקשה לדיון נוסף (דנ\"פ) לבית המשפט העליון."],"correct":2,"explain":"מאחר שכבר הוגש ערעור בזכות, האפשרות היחידה היא להגיש בקשה לערער פעם נוספת לבית המשפט העליון — רע\"פ."},{"id":"b25-b2","points":5,"prompt":"התביעה הגישה נגד מרדכי, תושב חיפה, כתב אישום בגין עבירה של הטרדה מינית, שדינה שלוש שנות מאסר. בכתב האישום נטען שמרדכי הטריד את חווה בביתה שבתל אביב, וכן צוין שמרדכי הורשע בעבירה אחרת של הטרדה מינית לפני עשר שנים. כתב האישום הוגש לבית המשפט המחוזי בתל אביב. אלו טענות מקדמיות יוכל מרדכי לטעון נגד כתב האישום?","options":["חוסר סמכות מקומית וחוסר סמכות עניינית.","חוסר סמכות מקומית ופגם/פסול בכתב האישום.","חוסר סמכות עניינית ופגם/פסול בכתב האישום.","חוסר סמכות עניינית והגנה מן הצדק."],"correct":2,"explain":"התביעה ציינה בכתב האישום פרט אסור (הרשעות קודמות של הנאשם), ועובדה זו מקימה טענה של פגם בכתב האישום. בנוסף, מאחר שמדובר בעבירה שדינה פחות משבע שנות מאסר, היה על התביעה להגיש את כתב האישום לבית משפט השלום — עובדה המקימה טענה לחוסר סמכות עניינית."},{"id":"b25-b3","points":5,"prompt":"שרה מואשמת בעבירה של המתה בקלות דעת, שדינה שתים עשרה שנות מאסר. לשרה אין סנגור והיא מבקשת כי ימונה לה סנגור ציבורי שייצג אותה במשפט. מהו הדין?","options":["בית המשפט חייב למנות לשרה סנגור.","בית המשפט חייב למנות לשרה סנגור, אם היא חסרת אמצעים או אם התביעה הודיעה שבכוונתה לבקש מאסר בפועל במידה ששרה תורשע.","בית המשפט רשאי, אך אינו חייב, למנות לשרה סנגור.","בית המשפט אינו רשאי למנות לשרה סנגור."],"correct":0,"explain":"חומרת העבירה (מעל 10 שנות מאסר) היא שמקימה חובת ייצוג בהתאם לחסד\"פ."},{"id":"b25-b4","points":5,"prompt":"דנית נעצרה בחשד לעבירה של החזקת סם למטרות סחר — עבירה לפי סעיף 7 לפקודת הסמים המסוכנים, שדינה 20 שנות מאסר. המשטרה חושדת שמיד לפני מעצרה בלעה דנית חבילה של סמים. כדי להוכיח שבגופה נמצאת חבילת הסם, הורה קצין משטרה לערוך שיקוף של פנים גופה של דנית באמצעות מכשיר רנטגן. רופא שבדק את דנית קבע שאין מניעה לערוך חיפוש מסוג זה, אך דנית מסרבת לאפשר למשטרה לעשות זאת. מהו הדין?","options":["למשטרה כלל אין סמכות לערוך חיפוש במקרה זה, שכן אין לה יסוד סביר לחשוד שבגופה של דנית נמצאת ראיה להוכחת ביצועה של עבירה מסוג פשע או להוכחת הקשר שבין החשוד לבין ביצוע עבירה כאמור.","המשטרה תוכל לבקש מבית המשפט אישור לעריכת החיפוש. אם תקבל את האישור ודנית תמשיך לסרב, ניתן יהיה לערוך את החיפוש תוך שימוש בכוח סביר.","המשטרה תוכל לבקש מבית המשפט אישור לעריכת החיפוש. אם תקבל את האישור ודנית תמשיך לסרב, יוכל סירובה של דנית לחזק את ראיות התביעה נגדה.","קצין משטרה יוכל לתת אישור בכתב לעריכת החיפוש, ואם דנית תמשיך לסרב, ניתן יהיה לערוך את החיפוש תוך שימוש בכוח סביר."],"correct":2,"explain":"מדובר בחיפוש פנימי בגוף שנערך לפי חוק החיפושים, ושאותו אין לערוך בכוח בשום מקרה, גם לאחר קבלת האישור מבית המשפט. עם זאת, מרגע שניתן האישור, יוכל סירובה של דנית לחזק את הראיות נגדה (ואף להוות עבירה פלילית)."},{"id":"b25-b5","points":5,"prompt":"יצחק מואשם בכך שביצע שוד בנק, ואילו יעקב מואשם בכך שלאחר השוד החביא בביתו את יצחק ואת הכסף ששדד כדי לסייע לו לחמוק מהמשטרה. התביעה מעוניינת להגיש נגד יצחק כתב אישום בגין עבירת השוד, שדינה 14 שנות מאסר, ולהגיש כתב אישום נגד יעקב בגין עבירה של סיוע לאחר מעשה, שדינה שלוש שנות מאסר. האם התביעה תוכל להגיש נגד השניים כתב אישום משותף ואם כן, לאיזה בית משפט יוגש כתב האישום?","options":["כן, התביעה תוכל להגיש נגד השניים כתב אישום משותף לבית משפט השלום.","כן, התביעה תוכל להגיש נגד השניים כתב אישום משותף לבית המשפט המחוזי.","כן, התביעה תוכל להגיש נגד השניים כתב אישום משותף לאיזה בית משפט שתבחר (שלום/מחוזי).","לא, התביעה תצטרך להגיש נגד כל אחד כתב אישום נפרד."],"correct":1,"explain":"לפי פס\"ד סוסן, כאשר מוקנית למחוזי סמכות שיפוט עניינית לגבי אחד הנאשמים בכתב אישום משותף, הוא רוכש סמכות שיפוט גם כלפי יתר הנאשמים — אפילו אם העבירות שבהן הואשמו מצויות בסמכות עניינית של השלום."}]}},{"id":"moed-a-2024","title":"מבחן דיון פלילי — סמסטר א׳ תשפ״ד, מועד א׳","lecturer":"ד\"ר רתם רוזנברג-רובינס","conditions":"חומר פתוח במחשב","durationMinutes":120,"partA":{"points":75,"questions":[{"id":"a24-a1","points":25,"scenario":"אלי הוא תושב תל אביב. בוקר אחד שמע אלי דפיקות בדלת ביתו, וכשפתח את הדלת הופתע למצוא שם את בועז השוטר. בועז הסביר לאלי שהתקבל מידע על פעילות חשודה שמתרחשת בביתו בשעות הלילה, ושהוא הגיע לערוך חיפוש בבית כדי לוודא שלא מבוצעות שם עבירות פליליות. אלי שאל את בועז האם מותר לו לסרב לעריכת החיפוש, ובועז השיב: \"בעיקרון אתה יכול לסרב, אבל אם תסרב אני אוכל להביא צו מבית המשפט ואז לא תהיה לך ברירה\". אלי, שהיה לבד בבית ולא היה לו עם מי להתייעץ, החליט לאפשר לבועז לערוך חיפוש. בועז ערך חיפוש בבית ומצא במגירה בחדר השינה שני כדורי אקסטזי, המוגדרים בפקודת הסמים המסוכנים כסם מסוכן האסור להחזקה ושימוש. הוא הודיע לאלי שהוא עצור בחשד להחזקת סם מסוכן לשימוש עצמי, והסיע אותו לתחנת המשטרה. בתחנה אמר בועז לאלי שיש לו זכות להיוועץ בסנגור לפני החקירה ושאל אם יש לו עורך דין. אלי השיב שאין לו עורך דין ושאל את בועז האם הוא יכול להתייעץ עם סנגור מהסנגוריה הציבורית. בועז השיב לאלי שלמרבה הצער הוא לא זכאי לסנגור ציבורי, כי הוא חשוד בעבירה קלה שדינה שלוש שנות מאסר בלבד. לאחר מכן הוא התחיל בחקירה ושאל את אלי האם הוא מודה שהחזיק בביתו סמים. אלי אמר שהוא מודה שהחזיק שני כדורי אקסטזי לשימוש עצמי, ולאחר חקירה קצרה שוחרר בערובה על ידי הקצין הממונה. התביעה הגישה לבית משפט השלום בתל אביב כתב אישום נגד אלי בגין עבירה של החזקת סם מסוכן לשימוש עצמי, לפי סעיף 7 לפקודת הסמים המסוכנים, שדינה שלוש שנות מאסר. כתב האישום מבוסס על הסמים שנמצאו בביתו של אלי ועל הודאתו במשטרה.","prompt":"אלו טענות מתחום סדר הדין הפלילי יוכל אלי להעלות במשפט נגד הראיות המבססות את האישום נגדו? כיצד לדעתכם צפוי בית המשפט להכריע בטענות?","modelAnswer":"החיפוש: אלי יטען שהחיפוש אינו חוקי בהתאם לפקודת סדר הדין הפלילי ולהלכת בן חיים. ראשית, חיפוש במקום אמור להיערך בצו בית משפט, אלא אם מתקיימים החריגים המנויים בסעיף 25 לפסד\"פ, שלא מתקיימים במקרה זה — לא הייתה דחיפות, וגם לא ברור שהיה יסוד סביר לחשד. במצב זה הסמכות לערוך חיפוש בבית מותנית בהסכמה מדעת של הנחפש, ואילו במקרה דנן לא ניתנה הסכמה מדעת שכן לא הובהר לאלי שזכותו לסרב לחיפוש ושלא יהיו לכך השלכות שליליות (בן חיים). שנית, לפי סעיף 26 לפסד\"פ חיפוש במקום ייערך בפני שני עדים שאינם שוטרים, ובמקרה דנן אלי היה לבדו ובועז ערך את החיפוש מבלי להסביר לו שנדרשים שני עדים ומבלי שאלי ויתר במפורש על דרישה זו. ההודאה: אלי יטען שהודאתו נגבתה תוך פגיעה בזכות ההיוועצות, שהנה זכות יסודית העומדת לחשוד (יששכרוב, שי). ראשית, בועז לא הבהיר לאלי שאם אין לו סנגור הוא זכאי להיוועץ בסנגור ציבורי, ובכך לא עמד בחובת היידוע (לין); יתרה מכך, בועז מטעה את אלי ואומר לו במפורש שהוא אינו זכאי להיוועץ בסנגור ציבורי בשל היותו נחשד בעבירה קלה — תוך בלבול בין הזכות להיוועץ בסנגור לפני חקירה (העומדת לכל חשוד, אף אם אינו עצור — שי) לבין הזכות להיות מיוצג על ידי סנגור ציבורי במהלך המשפט עצמו (שאינה קמה אוטומטית בעבירה קלה כזו, בכפוף לחריגים לפי תיקון 49 לחסד\"פ). שנית, אלי יטען שהיה על בועז לוודא שוויתורו על זכות ההיוועצות נעשה מדעת ולתעד את הוויתור בווידיאו (חייבטוב). לאור כל זאת, אלי יטען לפסילת הסם וההודאה בהתאם למבחני יששכרוב: מדובר באי-חוקיות חמורה יחסית (פגיעה בזכות יסוד שהורחבה בפסיקה, וחיפוש שנערך תוך הפרת כללים מרכזיים), הנזק מפסילה אינו גדול (עבירה לא חמורה), אך הסם הוא ראיה חפצית שמהימנותה אינה מושפעת מאי-החוקיות."},{"id":"a24-a2","points":25,"scenario":"לקראת המשפט שכר אלי את שירותיו של גדעון, סנגור פלילי מנוסה. גדעון קיבל לידיו את חומר החקירה שאספה התביעה, וכן קיבל ממנה רשימה של החומר שנרשם ונאסף במסגרת החקירה. כמה ימים לאחר מכן הודיעה דינה, התובעת בתיק, שרשימת החומר אינה מלאה ושלחה לגדעון רשימה מעודכנת, ושבוע לאחר מכן הודיעה שגם הרשימה הקודמת לא הייתה מלאה והעבירה שוב רשימה מעודכנת. גדעון עיין ברשימה המעודכנת וגילה שהיא כוללת מידע על שתי ראיות שלא נכללו בחומר החקירה. הראיה הראשונה היא עדותו של סוכן משטרתי, שהיה ככל הנראה מי שמסר למשטרה את המידע שהוביל לעריכת החיפוש בבית אלי — דינה השיבה שעדות זו חסויה מכיוון שחשיפתה עלולה לפגוע בעבודת המשטרה. הראיה השנייה היא אזכור לכך שבועז השוטר הורשע בעבר בדין משמעתי בעבירות שונות של הפרת הנחיות המשטרה — דינה השיבה שמדובר בדין משמעתי פנימי שהחומר בו אינו בידיה, ושהעברתו עלולה לפגוע בפרטיותו ובשמו הטוב של בועז.","prompt":"גדעון מעוניין להשיג את שתי הראיות שאינן נמצאות בחומר החקירה. באלו הליכים משפטיים יוכל לנקוט לשם כך ומה יהיו טענותיו?","modelAnswer":"עדות הסוכן המשטרתי: מדובר בראיה שהוצאה עליה ככל הנראה תעודת חיסיון לטובת הציבור, שאותה יכול כל שר בממשלה להוציא בנוגע לראיה שמסירתה עלולה לפגוע בענין ציבורי חשוב (סעיף 45 לפקודת הראיות). יש להגיש עתירה לגילוי ראיה לבית המשפט שדן באישום; יתקיים דיון בדלתיים סגורות שבו השופט שדן באישום יעיין לפחות בעיקרי הראיה כדי לקבוע האם היא חיונית להגנה, וככל שכן — יורה על גילויה, והתביעה תצטרך להחליט האם לגלותה או לוותר על האישום (סיקסיק). במקרה דנן, מדובר בראיה שעשויה להשליך על חוקיות החיפוש, ולכן יתכן שביהמ\"ש יורה לגלות אותה. הדין המשמעתי: מדובר בחומר שההגנה תטען שהוא אמור להיות בחומר החקירה לפי סעיף 74 לחסד\"פ. יש להגיש בקשה לבית המשפט שדן באישום לעיון בחומר החקירה ולהורות לתביעה להשיגו (סעיף 74(ב)); ההחלטה תתקבל על ידי שופט שאינו דן באישום. גדעון יטען שמדובר בראיה רלוונטית לאישום שכן היא נוגעת למהימנותו של עד התביעה המרכזי, וגם חומר שאינו נמצא פיזית בתיק אך נמצא בשליטתן של רשויות אכיפת החוק ובהישג ידן יכול להיחשב \"חומר חקירה\" (שיינר). בניגוד למצב בפס\"ד שיינר, במקרה דנן אין קושי ממש להשיג את החומר, והפגיעה בזכויותיו של בועז (שוטר, לא מתלונן) אינה קשה — ולכן האיזון מוביל למסקנה שיש להורות לתביעה להשיג את החומר. בנוסף, גדעון יטען שהתביעה נהגה שלא כראוי כשלא העבירה לו בבת אחת את הרשימה המלאה, שכן יש להעביר להגנה רשימה מלאה וממצה ולא טיפין-טיפין (גבאי)."},{"id":"a24-a3","points":25,"scenario":"בסופו של דבר הגיעו אלי וגדעון למסקנה כי עדיף לחסוך את עלויות ניהול המשפט ולהגיע עם דינה התובעת להסדר טיעון. לאחר משא ומתן, הודה אלי בבית המשפט בעבירה של החזקת סם מסוכן לשימוש עצמי, והצדדים ביקשו מבית המשפט לגזור עליו עונש מאסר על תנאי למשך שנתיים. דינה הסבירה שהחליטה להסכים לעונש קל מאחר שלאלי אין עבר פלילי ומאחר שהוא התכוון לטעון במשפט טענות משפטיות רבות שהיו גורמות להליך להתארך מאוד. להפתעת אלי, בית משפט השלום דחה את הסדר הטיעון וגזר עליו עונש מאסר על תנאי למשך שלוש שנים וכן קנס של עשרת אלפים שקלים, בקובעו שהתובעת שגתה בכך שהסכימה לעונש קל משיקולים פרקטיים, וכי אקסטזי הוא סם מסוכן ומזיק מאוד המצדיק ענישה חמורה. בית המשפט קבע שמתחם העונש ההולם לעבירה, כשמדובר בנאשם ללא עבר פלילי, נע בין שלוש שנות מאסר על תנאי וקנס לבין שנת מאסר בפועל, ולאור הסתמכות אלי על ההסדר גזר עליו עונש ברף התחתון של המתחם.","prompt":"אלי מבקש לערער על גזר הדין. בערעור הוא מעוניין לבקש מבית המשפט לגזור עליו את העונש שהוסכם עם התביעה, ולחלופין לאפשר לו לחזור בו מהודאתו על מנת שיוכל לנהל משפט שבו יטען לחפותו. כיצד הוא יכול לעשות זאת ומה יהיו טענותיו?","modelAnswer":"אלי יטען שביהמ\"ש שגה הן בכך שדחה את הסדר הטיעון והן באופן שבו גזר את הדין ונימק את העונש. הסדר הטיעון: מדובר בהסדר הכולל הן הסכמה לעניין האישומים והן הסדר \"סגור\" לעניין העונש. אלי יטען שביהמ\"ש נקט ב\"גישת שיקולי התביעה\" וב\"גישת העונש הראוי\" במקום ב\"גישת האיזון\" שאומצה בפס\"ד פלוני, המחייבת לשקול את התועלת שבהסדר מול הנזק שבהקלה, תוך התחשבות בעונש הראוי ובהסתמכות הנאשם — ובמקרה דנן ביהמ\"ש נתן משקל בעיקר לשיקוליה (השגויים, לעמדתו) של התובעת ולחומרת העבירה. בנוסף, אלי יטען שאם ערכאת הערעור תאשר את דחיית ההסדר, עליה לכל הפחות לאפשר לו לחזור בו מהודאתו — אך טענה זו נדחתה בפס\"ד פלוני, בקביעה שהנאשם מודה מרצונו החופשי ומודע לכך שביהמ\"ש אינו מחויב להסדר. העונש: אלי יטען שביהמ\"ש קבע את מתחם העונש ההולם מבלי שהתחשב מספיק בנסיבות הקשורות לביצוע העבירה עצמה, ותוך שקילת נסיבות שאינן קשורות לביצוע העבירה (העדר עבר פלילי) בשלב שגוי — בניגוד לתיקון 113 לחוק העונשין, הקובע שיש לקבוע את המתחם לפי חומרת העבירה בלבד. בשלב השני, של קביעת העונש בתוך המתחם, ביהמ\"ש לא התייחס לאפשרות לחרוג לקולא לאור סיכויי שיקומו הגבוהים של אלי והעדר עברו הפלילי. בונוס: עם זאת, בפס\"ד סעד נקבע שגם לאחר תיקון 113 ערכאת הערעור לא תתערב בעונש אלא אם הוא סוטה במידה קיצונית מרמת הענישה הראויה או נפלה טעות מהותית — ולכן קשה לדעת האם ביהמ\"ש יתערב, אם כי ניתן לטעון שהטעויות שצוינו מהותיות ומצדיקות התערבות."}]},"partB":{"points":25,"questions":[{"id":"a24-b1","points":5,"prompt":"התביעה הגישה נגד יעקב כתב אישום בגין עבירת התקיפה. בבוקר שבו אמור היה להיפתח המשפט, הבחין התובע בתיק כי בכתב האישום נפלו כמה טעויות. התובע מעוניין לחזור בו מכתב האישום על מנת לבדוק האם אפשר לתקן אותו ולהגיש אותו מחדש בשלב מאוחר יותר. מה הדין?","options":["התובע יוכל לחזור בו מכתב האישום רק ברשות בית המשפט ויוכל להגיש אותו מחדש בשלב מאוחר יותר.","התובע יוכל לחזור בו מכתב האישום רק ברשות בית המשפט ויוכל להגיש אותו מחדש בשלב מאוחר יותר רק באישור היועץ המשפטי לממשלה.","התובע לא יוכל לחזור בו מכתב האישום, מאחר שכבר הגיש אותו לבית המשפט.","התובע יוכל לחזור בו מכתב האישום מבלי לבקש רשות מבית המשפט ויוכל להגיש אותו מחדש בשלב מאוחר יותר."],"correct":3,"explain":"סעיף 93 לחסד\"פ קובע שהתביעה רשאית בכל עת לחזור בה מן האישום גם ללא רשות בית המשפט, אלא אם הנאשם כבר הודה בעובדות המביאות להרשעתו. סעיף 94 מוסיף שכל עוד הנאשם לא השיב לאישום, ביטול כתב האישום חה את הטענה השנייה.","ידחה את הטענה הראשונה אך יקבל את הטענה השנייה.","יקבל הן את הטענה הראשונה והן את הטענה השנייה."],"correct":0,"explain":"ערכאת הערעור לא תתערב בממצאי עובדה ומהימנות אלא במקרים חריגים, ולכן תדחה את הטענה השנייה. הטענה הראשונה, אף שהיא משפטית, דומה לטענה שנדחתה בפס\"ד פילצה, שם נקבע ששקר בעל פה (בניגוד לבידוי ראיה חפצית) מותר ואינו מביא לפסילת ההודאה."},{"id":"a24-b5","points":5,"prompt":"המשטרה עצרה את דני במעצר ראשוני, לאחר שבת זוגו התלוננה כי תקף אותה באלימות. המשטרה חוששת שאם דני ישוחרר, הוא יתקוף את בת זוגו שוב, ולפיכך מבקשת מבית המשפט להאריך את מעצרו. מה הדין?","options":["בית המשפט יוכל להורות על מעצרו של דני למשך 5 ימים בכל פעם ו-15 ימים במצטבר. לאחר מכן, בקשה למעצר נוסף תוגש רק באישור היועץ המשפטי לממשלה.","בית המשפט יוכל להורות על מעצרו של דני למשך 15 ימים בכל פעם ו-30 ימים במצטבר. לאחר מכן, בקשה למעצר נוסף תוגש רק באישור היועץ המשפטי לממשלה.","בית המשפט יוכל להורות על מעצרו של דני למשך 30 ימים בכל פעם ו-75 ימים במצטבר. לאחר מכן, בקשה למעצר נוסף תוגש רק באישור היועץ המשפטי לממשלה.","בית המשפט יוכל להורות על מעצרו של דני למשך 30 ימים בכל פעם ו-90 ימים במצטבר. לאחר מכן, בקשה למעצר נוסף תוגש רק באישור היועץ המשפטי לממשלה."],"correct":1,"explain":"מדובר במעצר לפני הגשת כתב אישום לפי סעיף 13 לחוק המעצרים. עילת המעצר הקבועה בסעיף 13(א)(2) — יסוד סביר לחשש שהחשוד יסכן בטחון אדם, הציבור או המדינה — מגבילה את תקופת המעצר ל-15 ימים בכל פעם ו-30 ימים במצטבר, ולאחר מכן רק בהארכה שבקשתה הוגשה באישור היועמ\"ש."}]}},{"id":"moed-b-2024","title":"מבחן דיון פלילי — סמסטר א׳ תשפ״ד, מועד ב׳","lecturer":"ד\"ר רתם רוזנברג-רובינס","conditions":"חומר פתוח במחשב","durationMinutes":120,"partA":{"points":75,"questions":[{"id":"b24-a1","points":25,"scenario":"אמנון נהג לעבודה במכונית ובדרך פגע במכוניתה של תמר. תמר נפצעה בתאונה. אמנון עצר את מכוניתו והזמין אמבולנס, ולמקום הגיעה גם ניידת משטרה. שמואל, השוטר שהגיע למקום, ביקש מאמנון להתלוות אליו לתחנת המשטרה כדי להשיב לכמה שאלות בנוגע לתאונה, ואמנון הסכים. כשהגיעו לתחנה, אמר שמואל לאמנון שהוא חשוד בעבירה של חבלה ברשלנות (עבירה שדינה שנת מאסר אחת). אמנון שאל האם כדאי שידבר עם סנגור לפני שיענה לשאלות, ושמואל השיב: \"לא, אתה לא עצור, אז לא צריך סנגור. זו רק חקירה קצרה ואז תוכל ללכת הביתה. אתה חשוד בעבירה מאוד קלה, כדאי לך פשוט לספר את האמת ולגמור עם זה\". אמנון סיפר ששתוך כדי נהיגה קיבל הודעת טקסט בטלפון הסלולרי שלו (טלפון חכם) והסתכל לרגע על הטלפון, וכתוצאה מכך לא הביט בכביש ופגע במכונית של תמר. שמואל שאל את אמנון אם יוכל לערוך חיפוש בטלפון שלו כדי לוודא שקיבל הודעה רגע לפני התאונה, ואמנון הסכים ונתן לו את הטלפון. שמואל עיין בכל הודעותיו של אמנון מבוקר התאונה וגילה שאמנון אכן קיבל הודעה בשעה הרלוונטית. לאחר שהבין ששמואל הביט בטלפון תוך כדי נהיגה, הגיע למסקנה שאמנון לא ביצע עבירת רשלנות אלא עבירה חמורה יותר של פציעה (הדורשת מחשבה פלילית). התביעה הגישה לבית משפט השלום כתב אישום בגין עבירת הפציעה, לפי סעיף 334 לחוק העונשין, שדינה שלוש שנות מאסר, על בסיס הודאתו של אמנון והודעת הטקסט שנמצאה בטלפון הנייד שלו.","prompt":"אלו טענות מתחום סדר הדין הפלילי יוכל אמנון להעלות במשפט נגד שתי הראיות המבססות את האישום נגדו? כיצד לדעתכם צפוי בית המשפט להכריע בטענות?","modelAnswer":"ההודאה: אמנון יטען שהודאתו נגבתה תוך פגיעה חמורה בזכות ההיוועצות. שמואל לא הזהיר אותו כנדרש בדבר זכותו לשמור על שתיקה ולהיוועץ בסנגור, ואף אמר לו במפורש שאינו צריך סנגור משום שאינו עצור — זאת חרף שבפס\"ד שי נקבע שחובת היידוע (סעיף 32 לחוק המעצרים) חלה בחקירת חשוד גם אם אינו עצור, ובפס\"ד לין נקבע שהיא כוללת גם יידוע על הזכות להיוועץ בסנגור ציבורי. שמואל גם לא תיעד את הוויתור על זכות ההיוועצות בווידיאו (חייבטוב). בדומה לפס\"ד שי, הפגיעה בזכות ההיוועצות הובילה את אמנון להודות בעובדות המובילות להאשמה חמורה יותר, ולכן יטען שיש לפסול לפחות את החלק בהודאה העוסק בטלפון. בנוסף, יוכל אמנון לטעון ששמואל עשה תרגיל \"הקטנת מצב\" פסול כשהבטיח לו מראש שייאשם בעבירה קלה לפני שידע את העובדות — בשונה מפילצה, שם לא הובטח לחשוד דבר מפורש ולא נלוותה פגיעה בזכות ההיוועצות. נראה שמבחני יששכרוב עשויים להוביל לפסילה חלקית לפחות. הודעת הטקסט: אמנון יטען שגם ההודעה פסולה, שכן הושגה בחיפוש בלתי חוקי בטלפון החכם (הנחשב מחשב) שלא בהתאם לסעיף 23א לפסד\"פ, המחייב צו שופט מפורט ובעל תפקיד מיומן. הסכמתו של אמנון, שניתנה מבלי שידע למה הוא מסכים, אינה הסכמה מדעת כדין לפי הלכת בן חיים, שממילא לא ברור שחלה על חיפוש במחשב (להבדיל מחיפוש בגוף ובמקום) ולא ברור שיכולה להחליף גם דרישות כמו צו שופט. בית המשפט יבחן פסילה בהתאם למבחני יששכרוב."},{"id":"b24-a2","points":25,"scenario":"יחד עם הגשת כתב האישום נגד אמנון, הגישה התביעה לבית משפט השלום גם בקשה לעצור אותו במעצר בית עד תום ההליכים, לאחר שהסתבר שהורשע בעבר בעבירות תעבורה רבות, בטענה שאם יורשע ייגזר עליו עונש חמור ולכן קיים חשש שיברח או ימנע את המשפט. אמנון, שלא היה לו כסף לשכור סנגור, הגיע לדיון כשאינו מיוצג וביקש שימונה לו סנגור ציבורי; בית המשפט דחה את הבקשה בקובעו שחומרת העבירה אינה מקנה זכאות כזו. אמנון ייצג את עצמו וטען שעד כה היה משוחרר ללא תנאים וכי יש לו טענות רבות נגד קבילות הראיות, כך שסיכויי הרשעתו אינם גבוהים. בית משפט השלום דחה את טענתו והורה על מעצר בית מלא בפיקוח אלקטרוני, בקובעו: \"טענותיו של הנאשם נגד קבילות הראיות יתבררו במשפט עצמו ואין להן קשר לשאלת המעצר... בשלב זה די בכך שהתביעה תוכיח כי שחרורו עלול לסכן את הציבור או להביא לשיבוש הליכי משפט... ואין אמצעי מידתי יותר ממעצר בית שיוכל להפיג חשש זה\".","prompt":"אמנון מעוניין להגיש ערר על החלטת בית המשפט. כיצד יוכל לעשות זאת ואלו טענות מתחום סדר הדין הפלילי יוכל לטעון בערר?","modelAnswer":"אמנון יוכל להגיש ערר לבית המשפט המחוזי לפי סעיף 53 לחוק המעצרים. הוא יטען בערר כי בית משפט השלום שגה כשקבע שטענותיו בעניין קבילות הראיות אינן רלוונטיות לשאלת המעצר — שכן בניגוד לקביעתו, אין די בהראיית עילת מעצר אלא יש להראות גם ראיות לכאורה לאשמת הנאשם (סעיף 21 לחוק המעצרים); אמנם בפס\"ד זאדה פורש תנאי זה בצמצום יחסי (די ב\"סיכוי סביר להרשעה\", בניגוד לעמדת החולקת של השופטת דורנר), אך בית משפט השלום אף לא קבע שקיים סיכוי סביר כזה אלא התעלם מהתנאי כליל. בנוסף, סעיף 21(ב)(1) קובע שאם ניתן להשיג את מטרת המעצר בדרך של ערובה או תנאי אחר (כגון הפקדת דרכון), אין להורות על מעצר, ומאחר שאמנון היה משוחרר עד כה ללא תנאים, ניתן היה להשיג את המטרה כך. בנוסף, ההחלטה התקבלה כשאמנון לא היה מיוצג, בניגוד לסעיפים 21(ב)(2) ו-21(ג) לחוק   document.getElementById('exit-exam').addEventListener('click',()=>{examSession=null;renderExams()});

    document.getElementById('exam-draft').addEventListener('input',e=>{store.examAnswers[exam.id]=store.examAnswers[exam.id]||{};store.examAnswers[exam.id][q.id]=e.target.value;save();document.getElementById('exam-draft-status').textContent='התשובה נשמרת במכשיר'});
    document.getElementById('grade-exam-answer').addEventListener('click',()=>gradeExamAnswer(exam,q));

function renderExamSummary(exam){

async function gradeExamAnswer(exam,q){
  const draft=(store.examAnswers[exam.id]?.[q.id]||'').trim();
  if(!draft){examSession.gradeError='יש לכתוב תשובה לפני שליחה לבדיקה.';return drawExamSession()}
  examSession.grading=true;examSession.gradeError=null;drawExamSession();
  const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),45000);
  try{
    const response=await fetch(GRADER_ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({examId:exam.id,questionId:q.id,questionText:`${q.scenario} ${q.prompt}`,modelAnswer:q.modelAnswer,maxPoints:q.points,studentAnswer:draft}),signal:controller.signal});
    if(!response.ok)throw new Error('grader unavailable');
    const result=await response.json();
    if(!result||typeof result.score!=='number'||typeof result.feedback!=='string')throw new Error('malformed grader response');
    store.examGrades[exam.id]=store.examGrades[exam.id]||{};
    store.examGrades[exam.id][q.id]={score:result.score,maxPoints:result.maxPoints||q.points,feedback:result.feedback};
    save();
  }catch(error){examSession.gradeError='לא ניתן לקבל בדיקה כרגע. אפשר להשוות ידנית להצעת הפתרון ולנסות שוב בעוד רגע.'}
  finally{clearTimeout(timer);examSession.grading=false;drawExamSession()}
}
