let chatSending=false;
async function sendCourseChat(){
  if(chatSending)return;
  const field=document.getElementById('chat-input'),question=field.value.trim();
  if(!question)return;
  const button=document.getElementById('send-chat'),log=document.getElementById('chat-history');
  const message=document.createElement('p');message.textContent=question;log.append(message);field.value='';
  const loading=document.createElement('p');loading.setAttribute('role','status');loading.textContent='Gemini מחפש בחומרי הקורס...';log.append(loading);
  chatSending=true;button.disabled=true;log.scrollTop=log.scrollHeight;
  const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),30000);
  try{
    const response=await fetch(COURSE_CHAT_ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question,...(currentTopic?{currentTopic}:{})}),signal:controller.signal});
    if(!response.ok)throw new Error('Course chat unavailable');
    const result=await response.json();
    if(!result||typeof result.answer!=='string'||!result.answer.trim())throw new Error('Missing answer');
    const answer=document.createElement('p');answer.dir='auto';answer.textContent=result.answer;log.append(answer);
    if(Array.isArray(result.sources)){
      const names=result.sources.map(source=>typeof source==='string'?source:(source&&typeof source==='object'?(source.title||source.name||source.displayName||source.fileName||source.filename):'')).filter(name=>typeof name==='string'&&name.trim()).map(name=>name.split('/').pop());
      if(names.length){const section=document.createElement('div'),title=document.createElement('strong'),list=document.createElement('ul');title.textContent='מקורות בחומרי הקורס';section.append(title);for(const name of names){const item=document.createElement('li');item.textContent=name;list.append(item)}section.append(list);log.append(section)}
    }
  }catch(error){const failure=document.createElement('p');failure.textContent='לא ניתן לקבל תשובה כרגע. אפשר לנסות שוב בעוד רגע או לפתוח את מחברת הקורס.';log.append(failure)}
  finally{clearTimeout(timer);loading.remove();chatSending=false;button.disabled=false;log.scrollTop=log.scrollHeight}
}

function quickPractice(){
  const candidates=MCQ.filter(q=>!q.withheld);
  const shuffle=list=>{for(let i=list.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[list[i],list[j]]=[list[j],list[i]]}return list};
  const unanswered=shuffle(candidates.filter(q=>!Number.isInteger(store.answers[q.id])));
  const others=shuffle(candidates.filter(q=>Number.isInteger(store.answers[q.id])));

function drawCases(open){
  const term=document.getElementById('case-search').value.toLocaleLowerCase('he'),topicId=document.getElementById('case-topic').value,review=document.getElementById('case-review').value;

  let backTopicId=null;
  if(open!==undefined){try{const origin=JSON.parse(sessionStorage.getItem('caseOrigin')||'null');if(origin&&String(origin.caseIndex)===String(open)&&topic(origin.topic))backTopicId=origin.topic}catch{}}
  document.getElementById('case-count').textContent=`${matches.length} מתוך ${CASES.length} רשומות פסיקה`;
  document.getElementById('case-results').innerHTML=matches.map(({c,i})=>caseCard(c,i,String(i)===String(open),String(i)===String(open)?backTopicId:null)).join('')||'<p>לא נמצאה פסיקה בסינון הנוכחי.</p>';
  document.querySelectorAll('[data-review]').forEach(b=>b.addEventListener('click',()=>{const i=b.dataset.review;store.savedCases[i]=!store.savedCases[i];save();b.setAttribute('aria-pressed',String(!!store.savedCases[i]));b.textContent=store.savedCases[i]?'✓ לחזור אליו':'לחזור אליו'}));
  if(open!==undefined)document.getElementById('case-'+open)?.scrollIntoView({block:'start'});
}
function renderLimitations(){setPage(`${heading('התיישנות — סדר בחישוב')}<div class="panel content-block">${visibleContent(LIMITATIONS_HTML)}</div><p><a class="button" href="#learn">חזרה לנושאים</a></p>`,'learn')}

function renderPractice(param=''){
  const qs=new URLSearchParams(param),single=qs.get('single');
  if(single){const mcq=MCQ.find(q=>q.id===single),caseQ=CASE_Q.find(q=>q.id===single),q=mcq||caseQ;if(q){session={kind:mcq?'mcq':'cases',questions:[q],index:0,picked:{},started:Date.now()};return drawSession()}}
  const caseMode=qs.get('mode')==='cases';
  setPage(`${heading('תרגול','בחר מסלול קצר וממוקד. אפשר לחזור לשאלות שטעית בהן.')}<div class="practice-setup panel">${session?`<div class="resume-callout"><span>תרגול קודם ממתין לך.</span>${resumeButton()}</div>`:''}<div class="setup-grid"><label>סוג תרגול<select id="practice-kind"><option value="mcq">שאלות אמריקאיות · ${MCQ.length}</option><option value="cases" ${caseMode?'selected':''}>קייסים · ${CASE_Q.length}</option></select></label><label>נושא<select id="practice-topic"><option value="">כל הנושאים</option>${STUDY_ITEMS.map(t=>`<option value="${esc(t.id)}">${esc(t.title)}</option>`).join('')}</select></label><label>מספר שאלות<select id="practice-count"><option value="5">5</option><option value="10">10</option><option value="20">20</option><option value="all">הכל</option></select></label></div><details class="advanced-options"><summary>אפשרויות נוספות</summary><div class="setup-grid"><label>סדר<select id="practice-order"><option value="original">מקורי</option><option value="random">אקראי</option></select></label><label>בחירת שאלות<select id="practice-state"><option value="all">כולן</option><option value="unanswered">רק לא נענו</option><option value="wrong">רק טעויות</option></select></label><label>הרחבות<select id="practice-extra"><option value="yes">כולל הרחבות</option><option value="no">ללא הרחבות</option></select></label></div></details><p id="practice-availability" role="status" class="muted small"></p><button type="button" class="button primary" id="start-session">התחל תרגול</button></div>`,'practice');
  if(topic(qs.get('topic'))&&isStudy(topic(qs.get('topic'))))document.getElementById('practice-topic').value=qs.get('topic');
  for(const id of ['practice-kind','practice-topic','practice-state','practice-extra'])document.getElementById(id).addEventListener('change',availablePractice);
  document.getElementById('start-session').addEventListener('click',startSession);availablePractice();bindResume();
}

function searchGlobal(){
  const input=document.getElementById('global-search'),box=document.getElementById('search-results'),term=input.value.trim().toLocaleLowerCase('he');
  if(term.length<2){box.hidden=true;box.innerHTML='';return}
  const matches=(list,textOf,urlOf)=>list.map((x,i)=>({x,i})).filter(({x})=>plain(textOf(x)).toLocaleLowerCase('he').includes(term)).slice(0,7).map(({x,i})=>`<a href="${esc(urlOf(x,i))}">${esc(x.title||x.name||x.q||x.question)}</a>`).join('');
  const groups=[['נושאים',matches(STUDY_ITEMS,x=>x.title+' '+x.html,x=>'#topic/'+x.id)],['פסיקה',matches(CASES,x=>Object.values(x).join(' '),(x,i)=>'#case/'+i)],['שאלות',matches(MCQ,x=>x.q+' '+x.explain,x=>'#practice?single='+encodeURIComponent(x.id))],['קייסים',matches(CASE_Q,x=>x.title+' '+x.scenario,x=>'#practice?single='+encodeURIComponent(x.id))]];
  box.innerHTML=groups.filter(([,html])=>html).map(([label,html])=>`<div class="search-group"><strong>${label}</strong>${html}</div>`).join('')||'<p>לא נמצאו תוצאות.</p>';box.hidden=false;
}
function route(){
  const raw=location.hash.slice(1)||'home';const [path,params='']=raw.split('?');const [view,id]=path.split('/');
  document.getElementById('more-panel').hidden=true;document.getElementById('search-results').hidden=true;
  currentTopic=view==='topic'?id:null;
  if(view==='case'){
    try{
      if(pendingCaseOrigin&&String(pendingCaseOrigin.caseIndex)===String(id))sessionStorage.setItem('caseOrigin',JSON.stringify(pendingCaseOrigin));
      else sessionStorage.removeItem('caseOrigin');
    }catch{}
  }
  pendingCaseOrigin=null;
  if(view==='learn')renderLearn();
  else if(view==='topic'){
    renderTopic(decodeURIComponent(id||''));
    if(new URLSearchParams(params).get('from')==='case'){
      try{
        const origin=JSON.parse(sessionStorage.getItem('caseOrigin')||'null');
        if(origin&&origin.topic===decodeURIComponent(id||'')){
          const y=origin.scroll||0;
          requestAnimationFrame(()=>requestAnimationFrame(()=>window.scrollTo(0,y)));
        }
        sessionStorage.removeItem('caseOrigin');
      }catch{}
    }
  }
  else if(view==='cases')renderCases();
  else if(view==='case')renderCases(id);
  else if(view==='limitations')renderLimitations();
  else if(view==='practice')renderPractice(view==='practice'&&id==='cases'?'mode=cases&'+params:params);
  else if(view==='exams')renderExams();
  else renderHome();
}

function openChat(event){
  chatReturnFocus=event?.currentTarget||document.activeElement;
  const drawer=document.getElementById('chat-drawer');drawer.hidden=false;document.getElementById('screen').hidden=false;
  document.querySelectorAll('[data-open-chat]').forEach(b=>b.setAttribute('aria-expanded','true'));
  const log=document.getElementById('chat-history');if(!log.children.length)log.innerHTML='<p>שאלו שאלה על חומרי הקורס.</p>';
  if(currentTopic){const p=document.createElement('p');p.textContent='נושא פתוח: '+topic(currentTopic)?.title;log.append(p)}
  document.getElementById('chat-input').focus();
}
function closeChat(){
  const drawer=document.getElementById('chat-drawer');if(drawer.hidden)return;
  drawer.hidden=true;document.getElementById('screen').hidden=true;
  document.querySelectorAll('[data-open-chat]').forEach(b=>b.setAttribute('aria-expanded','false'));
  if(chatReturnFocus?.isConnected)chatReturnFocus.focus();chatReturnFocus=null;
}
document.querySelectorAll('[data-open-chat]').forEach(b=>{b.setAttribute('aria-controls','chat-drawer');b.setAttribute('aria-expanded','false')});
document.getElementById('mobile-search-toggle').addEventListener('click',()=>{const box=document.getElementById('searchbar'),button=document.getElementById('mobile-search-toggle'),expanded=box.classList.toggle('mobile-open');button.setAttribute('aria-expanded',String(expanded));if(expanded)document.getElementById('global-search').focus()});
document.addEventListener('keydown',event=>{
  const drawer=document.getElementById('chat-drawer');if(drawer.hidden||event.key!=='Tab')return;
  const items=[...drawer.querySelectorAll('button,textarea,input,a[href]')].filter(el=>!el.disabled&&el.getClientRects().length);
  if(!items.length)return;
  const first=items[0],last=items.at(-1);
  if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus()}
  else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus()}
});
</script></body></html>
